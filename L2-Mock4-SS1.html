<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n":1,"q":"Which of Saminder's fundamental rules is most likely to be accurate?","opts":["Only rule 1 is accurate.","Only rule 2 is accurate.","Neither rule is accurate."],"ans":"C","expl":"Rule 1 is incorrect because riskier assets are assigned a higher weighting. Risk-free assets such as cash are typically assigned a weighting of zero, because their risk-free nature means that they do not need to be supported by capital. Riskier assets require more capital funding, hence the higher weighting and risk adjusted value.\nRule 2 is also incorrect because off-balance sheet assets also require capital funding and hence should be included using the same risk weighting approach.\n(Module 11.1, LOS 11.b)","explhtml":"<p>Rule 1 is incorrect because riskier assets are assigned a higher weighting. Risk-free assets such as cash are typically assigned a weighting of zero, because their risk-free nature means that they do not need to be supported by capital. Riskier assets require more capital funding, hence the higher weighting and risk adjusted value.<\/p><p>Rule 2 is also incorrect because off-balance sheet assets also require capital funding and hence should be included using the same risk weighting approach.<\/p><p>(Module 11.1, LOS 11.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JJK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><div class=\"tbl\"><table><tr><td>Rule 1:<\/td><td>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with riskier assets assigned a lower value than risk-free assets such as cash.<\/td><\/tr><tr><td>Rule 2:<\/td><td>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing capital adequacy.<\/td><\/tr><\/table><\/div><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward.<\/p><p>Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%.<\/p><p>Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock).<\/p><p>JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo— Three-Year Trends.<\/p><p>Exhibit 2: Internal Memo—Three-Year Trends<\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><\/tr><tr><td><sup>1<\/sup><\/td><td><sup>139,398<\/sup><\/td><td><sup>118,957<\/sup><\/td><td><sup>108,086<\/sup><\/td><\/tr><\/table><\/div><p>Assets under management<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><\/table><\/div><p>Net outflows<\/p><div class=\"tbl\"><table><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><\/tr><\/table><\/div><p>1 Represents client assets managed by JJK BMD Trusts<\/p><p>2 30-day liquidity needs in a stress scenario<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Saminder&#x27;s fundamental rules is most likely to be accurate?<\/p><\/div>","subj":"fsa"},{"n":2,"q":"Using the forecasted data and explicit targets given in  Exhibit 1: Internal Memo— Regulatory Capital Calculation (extracts), Saminder is most likely to conclude that JJK Holdings would:","opts":["meet its targeted tier 1 ratio and total capital ratio.","meet its targeted tier 1 ratio but not its targeted total capital ratio.","fail to meet either target."],"ans":"A","expl":"Risk-weighted assets | 601,312\nCommon equity tier 1 capital | 87,390\nAdditional tier 1 capital | 16,401\nTier 1 capital | 103,791\nTier 2 capital | 25,447\nTotal regulatory capital 103,791 | 129,238\nTier 1 ratio = 601,312 129,238 | = 17.3%\nTotal capital ratio = 601,312 | = 21.5%\n(Module 11.5, LOS 11.d)","explhtml":"<div class=\"tbl\"><table><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 1 capital<\/td><td>103,791<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total regulatory capital 103,791<\/td><td>129,238<\/td><\/tr><tr><td>Tier 1 ratio = 601,312 129,238<\/td><td>= 17.3%<\/td><\/tr><tr><td>Total capital ratio = 601,312<\/td><td>= 21.5%<\/td><\/tr><\/table><\/div><p>(Module 11.5, LOS 11.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JJK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><div class=\"tbl\"><table><tr><td>Rule 1:<\/td><td>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with riskier assets assigned a lower value than risk-free assets such as cash.<\/td><\/tr><tr><td>Rule 2:<\/td><td>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing capital adequacy.<\/td><\/tr><\/table><\/div><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward.<\/p><p>Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%.<\/p><p>Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock).<\/p><p>JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo— Three-Year Trends.<\/p><p>Exhibit 2: Internal Memo—Three-Year Trends<\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><\/tr><tr><td><sup>1<\/sup><\/td><td><sup>139,398<\/sup><\/td><td><sup>118,957<\/sup><\/td><td><sup>108,086<\/sup><\/td><\/tr><\/table><\/div><p>Assets under management<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><\/table><\/div><p>Net outflows<\/p><div class=\"tbl\"><table><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><\/tr><\/table><\/div><p>1 Represents client assets managed by JJK BMD Trusts<\/p><p>2 30-day liquidity needs in a stress scenario<\/p><\/div><\/details><div class=\"qtext\"><p>Using the forecasted data and explicit targets given in  Exhibit 1: Internal Memo— Regulatory Capital Calculation (extracts), Saminder is most likely to conclude that JJK Holdings would:<\/p><\/div>","subj":"fsa"},{"n":3,"q":"How are tier 1 capital and total capital most likely to change when Saminder makes her stated adjustment for the convertible bonds?","opts":["Common equity tier 1 capital and total capital will both remain unchanged.","Tier 1 capital will increase and tier 2 capital will decrease.","Other tier 1 capital will decrease and total capital will remain unchanged."],"ans":"B","expl":"Per  Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts), convertible bonds are currently part of tier 2 capital. On conversion they would become common stock and part of common tier 1 capital, hence tier 2 capital would decrease and common tier 1 capital would increase.\n(Module 11.5, LOS 11.d)","explhtml":"<p>Per  Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts), convertible bonds are currently part of tier 2 capital. On conversion they would become common stock and part of common tier 1 capital, hence tier 2 capital would decrease and common tier 1 capital would increase.<\/p><p>(Module 11.5, LOS 11.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JJK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><div class=\"tbl\"><table><tr><td>Rule 1:<\/td><td>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with riskier assets assigned a lower value than risk-free assets such as cash.<\/td><\/tr><tr><td>Rule 2:<\/td><td>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing capital adequacy.<\/td><\/tr><\/table><\/div><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward.<\/p><p>Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%.<\/p><p>Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock).<\/p><p>JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo— Three-Year Trends.<\/p><p>Exhibit 2: Internal Memo—Three-Year Trends<\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><\/tr><tr><td><sup>1<\/sup><\/td><td><sup>139,398<\/sup><\/td><td><sup>118,957<\/sup><\/td><td><sup>108,086<\/sup><\/td><\/tr><\/table><\/div><p>Assets under management<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><\/table><\/div><p>Net outflows<\/p><div class=\"tbl\"><table><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><\/tr><\/table><\/div><p>1 Represents client assets managed by JJK BMD Trusts<\/p><p>2 30-day liquidity needs in a stress scenario<\/p><\/div><\/details><div class=\"qtext\"><p>How are tier 1 capital and total capital most likely to change when Saminder makes her stated adjustment for the convertible bonds?<\/p><\/div>","subj":"fsa"},{"n":4,"q":"Using the data in  Exhibit 2: Internal Memo—Three-Year Trends, which of the following statements is most accurate?","opts":["The number of days JJK can withstand a stress-level-volume of cash outflows decreased by three days from 20X5 to 20X7.","The liquidity coverage ratio decreased in each of the two years.","The trend in net stable funding ratio indicates an increase from 20X5 to 20X7 in highly liquid funding available, compared to the level of funding required."],"ans":"A","expl":"20X5 | 20X6 | 20X7\nHigh quality liquid assets | 111,432 | 127,352 | 198,393\nNet outflows | 100,483 | 112,482 | 196,429\nLiquidity coverage ratio =\nHigh quality liquid assets Net outflows | 111% | 113% | 101%\nThe liquidity coverage ratio actually increased from 20X5 to 20X6, hence choice B is incorrect.\nThe net cash outflows are given for 30 days. An LCR ratio of 100% would mean JJK could withstand 30 days of stress-level outflows. To calculate the number of days JJK can withstand, multiply the LCR by 30.\n20X5 | 20X6 | 20X7\n30 × | 30 × | 30 ×\n1.11 | 1.13 | 1.01\nNumber of days of stress volume of cash\n33.3 | 34.0 | 30.3\noutflows Hence A is correct; the number of days decreased by 3 days from 33.3 to 30.3 Available net stable funding excludes highly liquid assets, hence C is incorrect. (Module 11.5, LOS 11.d)","explhtml":"<div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><\/tr><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><\/tr><tr><td>Net outflows<\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><\/table><\/div><p>Liquidity coverage ratio =<\/p><div class=\"tbl\"><table><tr><td>High quality liquid assets Net outflows<\/td><td>111%<\/td><td>113%<\/td><td>101%<\/td><\/tr><\/table><\/div><p>The liquidity coverage ratio actually increased from 20X5 to 20X6, hence choice B is incorrect.<\/p><p>The net cash outflows are given for 30 days. An LCR ratio of 100% would mean JJK could withstand 30 days of stress-level outflows. To calculate the number of days JJK can withstand, multiply the LCR by 30.<\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><\/tr><tr><td>30 ×<\/td><td>30 ×<\/td><td>30 ×<\/td><\/tr><tr><td>1.11<\/td><td>1.13<\/td><td>1.01<\/td><\/tr><\/table><\/div><p>Number of days of stress volume of cash<\/p><div class=\"tbl\"><table><tr><td>33.3<\/td><td>34.0<\/td><td>30.3<\/td><\/tr><\/table><\/div><p>outflows Hence A is correct; the number of days decreased by 3 days from 33.3 to 30.3 Available net stable funding excludes highly liquid assets, hence C is incorrect. (Module 11.5, LOS 11.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ali Saminder, CFA, has recently been hired by JJK Holdings, Inc. (JJK), a U.S.-based financial services holding company. JJK has global operations in commercial and investment banking alongside a significant wealth management division, JJK BMD. Saminder is currently on a six-month rotation working in the risk management division of JJK. She is seeking to become familiar with JJK&#x27;s approach to risk management and the maintenance of an adequate capital base.<\/p><p>Saminder has reviewed an internal document outlining JJK&#x27;s approach to meeting regulatory requirements and has made a note of two fundamental rules that she believes are used to help analyze capital adequacy.<\/p><div class=\"tbl\"><table><tr><td>Rule 1:<\/td><td>When assessing the tier 1 capital ratio, assets should be weighted according to their risk, with riskier assets assigned a lower value than risk-free assets such as cash.<\/td><\/tr><tr><td>Rule 2:<\/td><td>Off-balance-sheet assets should be excluded from the asset base of the bank when assessing capital adequacy.<\/td><\/tr><\/table><\/div><p>The document provided to Saminder outlines JJK&#x27;s approach to calculating regulatory capital. Extracts from the document are shown in Exhibit 1.<\/p><p>Exhibit 1: Internal Memo—Regulatory Capital Calculation (extracts)<\/p><p>Tier 1 capital is defined in accordance with global regulatory standards and is appropriately adjusted for intangible and deferred tax assets resulting from losses carried forward.<\/p><p>Other tier 1 capital consists of irredeemable non-cumulative preferred stock with a fixed divided of 4.3%.<\/p><p>Consistent with local regulatory standards, Tier 2 capital is comprised of $18,047m of subordinated debt maturing in five years, and a convertible bond issue convertible only at maturity at the end of 20X9 (convertible into common stock).<\/p><p>JJK Holding has a target tier 1 ratio of 15% and total capital ratio of 20%. 20X8 year-end figures are forecast as follows:<\/p><p>20X8 ($m)<\/p><p>Regulatory capital<\/p><div class=\"tbl\"><table><tr><td>Common equity tier 1 capital<\/td><td>87,390<\/td><\/tr><tr><td>Additional tier 1 capital<\/td><td>16,401<\/td><\/tr><tr><td>Tier 2 capital<\/td><td>25,447<\/td><\/tr><tr><td>Total assets<\/td><td>510,948<\/td><\/tr><tr><td>Risk-weighted assets<\/td><td>601,312<\/td><\/tr><\/table><\/div><p>Saminder notes that the convertible bond is due for conversion in 20X9. She intends to recalculate the 20X8 tier 1 ratio as if the bonds had been converted already.<\/p><p>Saminder has also reviewed an internal memo outlining some key trends over the last three years that were labeled &#x27;Possible concerns?&#x27; by a previous employee. However, it was not clear from the document which trends if any were actual cause for concern. The trends included in the documents are shown in  Exhibit 2: Internal Memo— Three-Year Trends.<\/p><p>Exhibit 2: Internal Memo—Three-Year Trends<\/p><div class=\"tbl\"><table><tr><td>20X5<\/td><td>20X6<\/td><td>20X7<\/td><td><\/td><\/tr><tr><td>$m<\/td><td>$m<\/td><td>$m<\/td><td><\/td><\/tr><tr><td><sup>1<\/sup><\/td><td><sup>139,398<\/sup><\/td><td><sup>118,957<\/sup><\/td><td><sup>108,086<\/sup><\/td><\/tr><\/table><\/div><p>Assets under management<\/p><div class=\"tbl\"><table><tr><td><sup>2<\/sup><\/td><td>100,483<\/td><td>112,482<\/td><td>196,429<\/td><\/tr><\/table><\/div><p>Net outflows<\/p><div class=\"tbl\"><table><tr><td>High quality liquid assets<\/td><td>111,432<\/td><td>127,352<\/td><td>198,393<\/td><\/tr><tr><td>Available stable funding<\/td><td>376,092<\/td><td>376,653<\/td><td>388,624<\/td><\/tr><tr><td>Required stable funding<\/td><td>327,043<\/td><td>301,275<\/td><td>303,182<\/td><\/tr><\/table><\/div><p>1 Represents client assets managed by JJK BMD Trusts<\/p><p>2 30-day liquidity needs in a stress scenario<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in  Exhibit 2: Internal Memo—Three-Year Trends, which of the following statements is most accurate?<\/p><\/div>","subj":"fsa"},{"n":5,"q":"Assume the country where Simlair is operating has been experiencing 30% annual inflation over the past three years and that Simlair has a net monetary liability position. Which of the following best describes the effect on Roleo's consolidated financial statements?","opts":["A gain is recognized in the income statement.","A loss is recognized in the income statement.","A gain is recognized as a direct adjustment to the balance sheet."],"ans":"A","expl":"The temporal method is required if the foreign subsidiary is operating in a highly inflationary environment, defined as cumulative inflation of more than 100% in a 3-year period. Compounded inflation of 30% annually for three years is approximately 3 120% (1.30 − 1). Under the temporal method, remeasurement gains and losses are recognized in the income statement. Holding net monetary liabilities denominated in a currency that is depreciating will result in a gain.\n(Module 10.7, LOS 10.g)","explhtml":"<p>The temporal method is required if the foreign subsidiary is operating in a highly inflationary environment, defined as cumulative inflation of more than 100% in a 3-year period. Compounded inflation of 30% annually for three years is approximately <sup>3<\/sup> 120% (1.30 − 1). Under the temporal method, remeasurement gains and losses are recognized in the income statement. Holding net monetary liabilities denominated in a currency that is depreciating will result in a gain.<\/p><p>(Module 10.7, LOS 10.g)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Roleo is a large U.S. multinational with subsidiaries around the world and prepares its financial statements in accordance with the U.S. GAAP. Among these subsidiaries is Simlair Industries. Alex Dudda, CFA, is one of the equity analysts following Roleo. Roleo has a defined benefit pension plan for its employees.<\/p><p>In preparing his research report, Dudda makes the following observations in the working documents:<\/p><p>Defined Benefit Pension Plans<\/p><p>Dudda noted that the assumed higher expected rate of return on plan assets reduces reported pension expense but does not affect the PBO, and thus increases the plan&#x27;s funded status.<\/p><p>Employee Share Option Scheme<\/p><p>Roleo also has an employee share option scheme. Just as there is a cost to Roleo for its defined benefit scheme, the cost of Roleo&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity even if there is no cash outlay.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume the country where Simlair is operating has been experiencing 30% annual inflation over the past three years and that Simlair has a net monetary liability position. Which of the following best describes the effect on Roleo&#x27;s consolidated financial statements?<\/p><\/div>","subj":"fsa"},{"n":6,"q":"Assume that Simlair is a significantly integrated sales division of Roleo, and that Roleo makes virtually all of the operating, investing, and financing decisions. The foreign currency gains and losses that arise from the consolidation of Simlair should be reported in:","opts":["shareholders’ equity.","operating cash flow.","net income."],"ans":"C","expl":"Assuming Simlair is an integrated sales division and Roleo makes virtually all of the decisions, the functional currency is likely the presentation currency. Thus, the temporal method is used. Under the temporal method, remeasurement gains and losses are reported in the income statement.\n(Module 10.2, LOS 10.d)","explhtml":"<p>Assuming Simlair is an integrated sales division and Roleo makes virtually all of the decisions, the functional currency is likely the presentation currency. Thus, the temporal method is used. Under the temporal method, remeasurement gains and losses are reported in the income statement.<\/p><p>(Module 10.2, LOS 10.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Roleo is a large U.S. multinational with subsidiaries around the world and prepares its financial statements in accordance with the U.S. GAAP. Among these subsidiaries is Simlair Industries. Alex Dudda, CFA, is one of the equity analysts following Roleo. Roleo has a defined benefit pension plan for its employees.<\/p><p>In preparing his research report, Dudda makes the following observations in the working documents:<\/p><p>Defined Benefit Pension Plans<\/p><p>Dudda noted that the assumed higher expected rate of return on plan assets reduces reported pension expense but does not affect the PBO, and thus increases the plan&#x27;s funded status.<\/p><p>Employee Share Option Scheme<\/p><p>Roleo also has an employee share option scheme. Just as there is a cost to Roleo for its defined benefit scheme, the cost of Roleo&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity even if there is no cash outlay.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume that Simlair is a significantly integrated sales division of Roleo, and that Roleo makes virtually all of the operating, investing, and financing decisions. The foreign currency gains and losses that arise from the consolidation of Simlair should be reported in:<\/p><\/div>","subj":"fsa"},{"n":7,"q":"Dudda's statement about defined benefit pension plans is most likely:","opts":["correct.","correct about PBO but incorrect about funded status.","correct about funded status but incorrect about PBO."],"ans":"B","expl":"Assuming a higher expected rate of return on plan assets (under U.S. GAAP) reduces reported pension expense but does not affect the PBO nor the fair value of plan assets -- and therefore does not affect the funded status of the plan.\n(Module 9.2, LOS 9.d)","explhtml":"<p>Assuming a higher expected rate of return on plan assets (under U.S. GAAP) reduces reported pension expense but does not affect the PBO nor the fair value of plan assets -- and therefore does not affect the funded status of the plan.<\/p><p>(Module 9.2, LOS 9.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Roleo is a large U.S. multinational with subsidiaries around the world and prepares its financial statements in accordance with the U.S. GAAP. Among these subsidiaries is Simlair Industries. Alex Dudda, CFA, is one of the equity analysts following Roleo. Roleo has a defined benefit pension plan for its employees.<\/p><p>In preparing his research report, Dudda makes the following observations in the working documents:<\/p><p>Defined Benefit Pension Plans<\/p><p>Dudda noted that the assumed higher expected rate of return on plan assets reduces reported pension expense but does not affect the PBO, and thus increases the plan&#x27;s funded status.<\/p><p>Employee Share Option Scheme<\/p><p>Roleo also has an employee share option scheme. Just as there is a cost to Roleo for its defined benefit scheme, the cost of Roleo&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity even if there is no cash outlay.<\/p><\/div><\/details><div class=\"qtext\"><p>Dudda&#x27;s statement about defined benefit pension plans is most likely:<\/p><\/div>","subj":"fsa"},{"n":8,"q":"Dudda's comments regarding Roleo's employee share option scheme are most likely:","opts":["correct.","incorrect because the cost of issuing shares under an employee stock option scheme will be taken directly to equity via OCI and hence not reduce retained earnings.","incorrect as the cost of issuing shares under an employee stock option scheme will not reduce equity."],"ans":"C","expl":"The expense of the employee stock options is recorded as compensation expense in the income statement and hence will reduce net income and eventually the retained earnings. However, there is an offsetting increase (same amount) in the paid-in capital and hence no overall impact on equity.\n(Module 9.1, LOS 9.b)","explhtml":"<p>The expense of the employee stock options is recorded as compensation expense in the income statement and hence will reduce net income and eventually the retained earnings. However, there is an offsetting increase (same amount) in the paid-in capital and hence no overall impact on equity.<\/p><p>(Module 9.1, LOS 9.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Roleo is a large U.S. multinational with subsidiaries around the world and prepares its financial statements in accordance with the U.S. GAAP. Among these subsidiaries is Simlair Industries. Alex Dudda, CFA, is one of the equity analysts following Roleo. Roleo has a defined benefit pension plan for its employees.<\/p><p>In preparing his research report, Dudda makes the following observations in the working documents:<\/p><p>Defined Benefit Pension Plans<\/p><p>Dudda noted that the assumed higher expected rate of return on plan assets reduces reported pension expense but does not affect the PBO, and thus increases the plan&#x27;s funded status.<\/p><p>Employee Share Option Scheme<\/p><p>Roleo also has an employee share option scheme. Just as there is a cost to Roleo for its defined benefit scheme, the cost of Roleo&#x27;s share option scheme will be charged as an expense to the income statement and hence reduce retained earnings and equity even if there is no cash outlay.<\/p><\/div><\/details><div class=\"qtext\"><p>Dudda&#x27;s comments regarding Roleo&#x27;s employee share option scheme are most likely:<\/p><\/div>","subj":"fsa"},{"n":9,"q":"Regarding Debian's plan to distribute the cash flow from the divested business, which of the following is the most likely course of action for the company?","opts":["Increase regular dividends.","Pay a special dividend instead of an increase in regular dividends.","Pay dividends instead of a stock repurchase to preserve flexibility."],"ans":"B","expl":"Investors prefer stability in regular dividends (maintaining or slowly increasing them as profitability improves). Regular dividends are rarely cut. The most appropriate approach to distribute one-time excess cash is to use either special dividends or stock buybacks. Stock buybacks are preferred if managers want to preserve flexibility because they are not sticky; there is no expectation of continuing a buyback program.\n(Module 15.1, LOS 15.a)","explhtml":"<p>Investors prefer stability in regular dividends (maintaining or slowly increasing them as profitability improves). Regular dividends are rarely cut. The most appropriate approach to distribute one-time excess cash is to use either special dividends or stock buybacks. Stock buybacks are preferred if managers want to preserve flexibility because they are not sticky; there is no expectation of continuing a buyback program.<\/p><p>(Module 15.1, LOS 15.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation, based in Country A, an emerging market economy. Debian recently divested a division, and wants to distribute the resulting proceeds to its shareholders. Andrews collects the information on Country A, as shown in Exhibit 1.<\/p><p>Exhibit 1: Select Information on Country A<\/p><p>Country A is a rapidly growing emerging market economy. Its 20-year benchmark currency–denominated sovereign debt currently offers an attractive 8% yield. Current tax rates are investor friendly and are 12% for both dividends and capital gains, while the corporate tax rate is 30%. The standard deviation of equity returns is 19%; for bond returns, it is 12%.<\/p><p>Andrews discusses Debian&#x27;s current dividend policy with Sarah Givens, a senior economist with the fund. Givens makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Shareholders can plan their financial budget assuming a specific dividend income. Higher dividends makes them less reliant on uncertain income from their other investments, a<\/td><\/tr><\/table><\/div><p>preference they exhibit while choosing which investments to continue to hold.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>Shareholders are acutely aware of their tax situations, and always want to maximize their after-tax cash flows, if given a choice.<\/td><\/tr><\/table><\/div><p>The 20-year benchmark sovereign bond yield is currently 6%. Andrews plans on using the international capital asset pricing model (ICAPM) to estimate Debian&#x27;s cost of capital. Givens states that the ICAPM prices two risk factors: (1) a benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Debian&#x27;s plan to distribute the cash flow from the divested business, which of the following is the most likely course of action for the company?<\/p><\/div>","subj":"corporate"},{"n":10,"q":"Regarding statements made by Givens, which of the following is most accurate?","opts":["Statement 1 is consistent with the bird-in-hand theory, while Statement 2 is consistent with the dividend irrelevance theory.","Statement 1 is consistent with the dividend irrelevance theory, while Statement 2 is consistent with tax minimization theory.","Statement 1 is consistent with dividend preference theory, while Statement 2 is consistent with tax aversion theory."],"ans":"C","expl":"Statement 1 is consistent with the dividend preference theory (also called the bird-in-hand theory), while Statement 2 is consistent with tax aversion theory. (Module 15.1, LOS 15.b)","explhtml":"<p>Statement 1 is consistent with the dividend preference theory (also called the bird-in-hand theory), while Statement 2 is consistent with tax aversion theory. (Module 15.1, LOS 15.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation, based in Country A, an emerging market economy. Debian recently divested a division, and wants to distribute the resulting proceeds to its shareholders. Andrews collects the information on Country A, as shown in Exhibit 1.<\/p><p>Exhibit 1: Select Information on Country A<\/p><p>Country A is a rapidly growing emerging market economy. Its 20-year benchmark currency–denominated sovereign debt currently offers an attractive 8% yield. Current tax rates are investor friendly and are 12% for both dividends and capital gains, while the corporate tax rate is 30%. The standard deviation of equity returns is 19%; for bond returns, it is 12%.<\/p><p>Andrews discusses Debian&#x27;s current dividend policy with Sarah Givens, a senior economist with the fund. Givens makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Shareholders can plan their financial budget assuming a specific dividend income. Higher dividends makes them less reliant on uncertain income from their other investments, a<\/td><\/tr><\/table><\/div><p>preference they exhibit while choosing which investments to continue to hold.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>Shareholders are acutely aware of their tax situations, and always want to maximize their after-tax cash flows, if given a choice.<\/td><\/tr><\/table><\/div><p>The 20-year benchmark sovereign bond yield is currently 6%. Andrews plans on using the international capital asset pricing model (ICAPM) to estimate Debian&#x27;s cost of capital. Givens states that the ICAPM prices two risk factors: (1) a benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding statements made by Givens, which of the following is most accurate?<\/p><\/div>","subj":"corporate"},{"n":11,"q":"What is the estimate of CRP to use in estimating Debian's required return on equity?","opts":["2.00%.","3.17%.","0.38%."],"ans":"B","expl":"CRP = sovereign yield spread × (σequity / σbond) = (8% – 6%) / (19% / 12%) = 3.17%. (Module 17.2, LOS 17.e)","explhtml":"<p>CRP = sovereign yield spread × (σequity / σbond) = (8% – 6%) / (19% / 12%) = 3.17%. (Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation, based in Country A, an emerging market economy. Debian recently divested a division, and wants to distribute the resulting proceeds to its shareholders. Andrews collects the information on Country A, as shown in Exhibit 1.<\/p><p>Exhibit 1: Select Information on Country A<\/p><p>Country A is a rapidly growing emerging market economy. Its 20-year benchmark currency–denominated sovereign debt currently offers an attractive 8% yield. Current tax rates are investor friendly and are 12% for both dividends and capital gains, while the corporate tax rate is 30%. The standard deviation of equity returns is 19%; for bond returns, it is 12%.<\/p><p>Andrews discusses Debian&#x27;s current dividend policy with Sarah Givens, a senior economist with the fund. Givens makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Shareholders can plan their financial budget assuming a specific dividend income. Higher dividends makes them less reliant on uncertain income from their other investments, a<\/td><\/tr><\/table><\/div><p>preference they exhibit while choosing which investments to continue to hold.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>Shareholders are acutely aware of their tax situations, and always want to maximize their after-tax cash flows, if given a choice.<\/td><\/tr><\/table><\/div><p>The 20-year benchmark sovereign bond yield is currently 6%. Andrews plans on using the international capital asset pricing model (ICAPM) to estimate Debian&#x27;s cost of capital. Givens states that the ICAPM prices two risk factors: (1) a benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the estimate of CRP to use in estimating Debian&#x27;s required return on equity?<\/p><\/div>","subj":"corporate"},{"n":12,"q":"Givens's statement about the ICAPM is:","opts":["correct.","incorrect about the second factor because it is based on an equally weighted market index.","incorrect about the first factor because it is based on a global market index."],"ans":"C","expl":"The ICAPM is a two-factor model, based on (1) a global and not benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.\n(Module 17.2, LOS 17.e)","explhtml":"<p>The ICAPM is a two-factor model, based on (1) a global and not benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.<\/p><p>(Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Corporate Issuers<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dan Andrews, CFA, is the equity analyst for a large pension fund. One of the fund&#x27;s holdings is Debian Corporation, based in Country A, an emerging market economy. Debian recently divested a division, and wants to distribute the resulting proceeds to its shareholders. Andrews collects the information on Country A, as shown in Exhibit 1.<\/p><p>Exhibit 1: Select Information on Country A<\/p><p>Country A is a rapidly growing emerging market economy. Its 20-year benchmark currency–denominated sovereign debt currently offers an attractive 8% yield. Current tax rates are investor friendly and are 12% for both dividends and capital gains, while the corporate tax rate is 30%. The standard deviation of equity returns is 19%; for bond returns, it is 12%.<\/p><p>Andrews discusses Debian&#x27;s current dividend policy with Sarah Givens, a senior economist with the fund. Givens makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Shareholders can plan their financial budget assuming a specific dividend income. Higher dividends makes them less reliant on uncertain income from their other investments, a<\/td><\/tr><\/table><\/div><p>preference they exhibit while choosing which investments to continue to hold.<\/p><div class=\"tbl\"><table><tr><td>Statement 2:<\/td><td>Shareholders are acutely aware of their tax situations, and always want to maximize their after-tax cash flows, if given a choice.<\/td><\/tr><\/table><\/div><p>The 20-year benchmark sovereign bond yield is currently 6%. Andrews plans on using the international capital asset pricing model (ICAPM) to estimate Debian&#x27;s cost of capital. Givens states that the ICAPM prices two risk factors: (1) a benchmark market index factor, and (2) a foreign currency–denominated, wealth-weighted market index.<\/p><\/div><\/details><div class=\"qtext\"><p>Givens&#x27;s statement about the ICAPM is:<\/p><\/div>","subj":"corporate"},{"n":13,"q":"By how much (in dollars) does GDW's FCFF exceed its free cash flow to equity (FCFE) in 2018?","opts":["$9,567.","$45,251.","$52,897."],"ans":"B","expl":"FCFE can be expressed in terms of FCFF as follows: FCFE = FCFF − Int(1 − tax rate) + net borrowing Therefore, the amount by which FCFF exceeds FCFE can be written as: FCFF − FCFE = Int(1 − tax rate) − net borrowing Interest = $20,265 + $5,223 = $25,488 Net borrowing = $5,866 − $33,275 = –$27,409 (additional information) Therefore: FCFF − FCFE = $25,488(1 − 0.3) − (–$27,409) = $45,251 (Module 21.4, LOS 21.d)","explhtml":"<p>FCFE can be expressed in terms of FCFF as follows: FCFE = FCFF − Int(1 − tax rate) + net borrowing Therefore, the amount by which FCFF exceeds FCFE can be written as: FCFF − FCFE = Int(1 − tax rate) − net borrowing Interest = $20,265 + $5,223 = $25,488 Net borrowing = $5,866 − $33,275 = –$27,409 (additional information) Therefore: FCFF − FCFE = $25,488(1 − 0.3) − (–$27,409) = $45,251 (Module 21.4, LOS 21.d)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated). GDW has produced impressive results since going public via an initial public offering in 2008. Through a program of aggressive growth by acquisition, GDW is currently seen as a major player and a threat to Consolidated&#x27;s own plans for growth and profitability. In preparation for his analysis, Warner has gathered the following financial data from GDW&#x27;s year-end statements.<\/p><p>GDW Statement of Income for Year Ended May 31, 2018<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>4,052,173<\/td><\/tr><\/table><\/div><p>Expenses<\/p><div class=\"tbl\"><table><tr><td>Cost of goods sold, general and operating expenses<\/td><td>3,735,397<\/td><\/tr><tr><td>Noncash charges<\/td><td>56,293<\/td><\/tr><tr><td>Interest on long-term debt<\/td><td>20,265<\/td><\/tr><tr><td>Other interest 3,817,178<\/td><td>5,223<\/td><\/tr><tr><td>Income before income taxes<\/td><td>234,995<\/td><\/tr><tr><td>Income taxes<\/td><td>70,499<\/td><\/tr><tr><td>Net income<\/td><td>164,497<\/td><\/tr><tr><td>Earnings per share<\/td><td>0.72<\/td><\/tr><\/table><\/div><p>Partial GDW Balance Sheet on May 31, 2018<\/p><p>Assets<\/p><p>Current assets (excluding cash)<\/p><div class=\"tbl\"><table><tr><td>Accounts receivable<\/td><td>284,762<\/td><\/tr><tr><td>Inventories<\/td><td>490,755<\/td><\/tr><tr><td>Prepaid expenses<\/td><td>23,743<\/td><\/tr><tr><td>Total current assets (excluding cash)<\/td><td>799,260<\/td><\/tr><tr><td>Property, plant, and equipment<\/td><td>687,890<\/td><\/tr><tr><td>Other assets<\/td><td>236,417<\/td><\/tr><\/table><\/div><p>Liabilities<\/p><p>Current liabilities (excluding notes payable)<\/p><div class=\"tbl\"><table><tr><td>Accounts payable and accrued liabilities<\/td><td>296,564<\/td><\/tr><tr><td>Other<\/td><td>100,039<\/td><\/tr><tr><td>Total current liabilities (excluding notes payable)<\/td><td>396,603<\/td><\/tr><tr><td>Long-term debt<\/td><td>262,981<\/td><\/tr><tr><td>Other liabilities<\/td><td>15,484<\/td><\/tr><\/table><\/div><p>Additional Information<\/p><div class=\"tbl\"><table><tr><td>Risk-free rate<\/td><td>4.5%<\/td><\/tr><tr><td>WACC<\/td><td>7.5%<\/td><\/tr><tr><td>2018 working capital investment<\/td><td>$7,325<\/td><\/tr><tr><td>2018 dividends<\/td><td>$82,248<\/td><\/tr><tr><td>Beta<\/td><td>1.10<\/td><\/tr><tr><td>Investment in fixed capital in 2018<\/td><td>$143,579<\/td><\/tr><tr><td>Market risk premium<\/td><td>5%<\/td><\/tr><tr><td>Total equity May 31, 2017<\/td><td>$1,019,869<\/td><\/tr><tr><td>Principal repayment of long-term debt in 2018<\/td><td>$33,275<\/td><\/tr><tr><td>Notes payable issued in 2018<\/td><td>$5,866<\/td><\/tr><tr><td>2018 change in liabilities<\/td><td>$27,409<\/td><\/tr><tr><td>Tax rate<\/td><td>30%<\/td><\/tr><\/table><\/div><p>As part of his analysis, Warner needs to forecast the free cash flow to the firm (FCFF) for 2019. The best information he has points to an increase in sales of 6%. The earnings before interest and tax (EBIT) margin is not expected to change from the rate of 6.4% achieved in 2018. Fixed capital spending is expected to be $36,470. Investment in net working capital is expected to be $24,313. Moreover, Warner notes that the only noncash charge is depreciation, which he estimates will be $60,000.<\/p><p>Warner has been asked to analyze the effect each of the following corporate events, if taken during 2019, would have on GDW&#x27;s free cash flow to equity (FCFE):<\/p><p>20% increase in dividends per share.<\/p><p>Repurchase of 25% of the firm&#x27;s outstanding shares using cash. New common share offering that would increase shares outstanding by 30%. New issue of convertible bonds that are not callable for five years and would increase the level of debt by 10%.<\/p><p>Warner is also interested in valuing Betacorp, another acquisition possibility for Consolidated. Warner notes that Betacorp is a mature, profitable company with generous dividend payments, which has resulted in a volatile capital structure for the company.<\/p><\/div><\/details><div class=\"qtext\"><p>By how much (in dollars) does GDW&#x27;s FCFF exceed its free cash flow to equity (FCFE) in 2018?<\/p><\/div>","subj":"equity"},{"n":14,"q":"The 2019 estimate of FCFF is closest to:","opts":["$191,646.","$210,329.","$215,329."],"ans":"A","expl":"When depreciation is the only noncash charge, FCFF can be estimated from: FCFF = EBIT(1 − tax rate) + Dep − FCInv − WCInv EBIT2019 = $4,052,173 × 1.06 × 0.064 = $274,899 Therefore: FCFF2019 = $274,899 (1 − 0.3) + $60,000 − $36,470 − $24,313 = $191,646 (Module 21.4, LOS 21.d)","explhtml":"<p>When depreciation is the only noncash charge, FCFF can be estimated from: FCFF = EBIT(1 − tax rate) + Dep − FCInv − WCInv EBIT2019 = $4,052,173 × 1.06 × 0.064 = $274,899 Therefore: FCFF2019 = $274,899 (1 − 0.3) + $60,000 − $36,470 − $24,313 = $191,646 (Module 21.4, LOS 21.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carl Warner, CFA, has been asked to review the financial information of Global Drug World (GDW) in preparation for a possible takeover bid by rival competitor Consolidated Drugstores International (Consolidated). GDW has produced impressive results since going public via an in
