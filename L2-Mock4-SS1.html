><td>Bond A<\/td><td>Bond B<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><tr><td>Option<\/td><td>Callable at par at t = 1 year<\/td><td>Putable at par at t = 1 year<\/td><\/tr><tr><td>Coupon<\/td><td>2%<\/td><td>1.50%<\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><\/table><\/div><p>Da Silva asks Dias the following questions:<\/p><div class=\"tbl\"><table><tr><td>Question 1:<\/td><td>Which bond in Exhibit 2 is most likely to exhibit negative convexity?<\/td><\/tr><tr><td>Question 2:<\/td><td>For a given decline in interest rate, which bond is most likely to have lower upside potential?<\/td><\/tr><tr><td>Question 3:<\/td><td>If interest rates rise, which bond is most likely to see its effective duration increase?<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>In answer to Da Silva&#x27;s Question 3, the bond whose effective duration is most likely to increase if interest rates rise is:<\/p><\/div>","subj":"fixed"},{"n":25,"q":"The value of the interest rate swap is closest to:","opts":["$32,200.","$47,500.","$63,300."],"ans":"A","expl":"new 180-day discount factor = 1 / [1 + (0.0325 × 180 / 360)] = 1 / 1.01625 = 0.9840.\nnew 360-day discount factor = 1 / [1 + (0.035 × 360 / 360)] = 1 / 1.035 = 0.9662.\nsum of the discount factors = 0.9840 + 0.9662 = 1.9502 new SFR = [(1 – 0.9662) / 1.9502] × (360/180) = 3.47% value (payer) = (0.0347 – 0.0325) × (180 / 360) × (1.9502) × ($15,000,000) = $32,178.30.\n(Module 30.6, LOS 30.e)","explhtml":"<p>new 180-day discount factor = 1 / [1 + (0.0325 × 180 / 360)] = 1 / 1.01625 = 0.9840.<\/p><p>new 360-day discount factor = 1 / [1 + (0.035 × 360 / 360)] = 1 / 1.035 = 0.9662.<\/p><p>sum of the discount factors = 0.9840 + 0.9662 = 1.9502 new SFR = [(1 – 0.9662) / 1.9502] × (360/180) = 3.47% value (payer) = (0.0347 – 0.0325) × (180 / 360) × (1.9502) × ($15,000,000) = $32,178.30.<\/p><p>(Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Derivatives<\/summary><div class=\"vig-body\"><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer position in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day MRR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, Carson asks Walsinzki about the mechanics of forward pricing.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of the interest rate swap is closest to:<\/p><\/div>","subj":"derivatives"},{"n":26,"q":"The fixed USD payment in the currency swap is closest to:","opts":["$16,500.","$17,900.","$33,000."],"ans":"A","expl":"USD notional = EUR 1,000,000 / 0.9091 = 1,099,989 USD fixed rate = 3% (semiannual). USD payment = 0.03 / 2 × 1,099,989 = $16,500 (Module 30.7, LOS 30.f)","explhtml":"<p>USD notional = EUR 1,000,000 / 0.9091 = 1,099,989 USD fixed rate = 3% (semiannual). USD payment = 0.03 / 2 × 1,099,989 = $16,500 (Module 30.7, LOS 30.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer position in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day MRR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, Carson asks Walsinzki about the mechanics of forward pricing.<\/p><\/div><\/details><div class=\"qtext\"><p>The fixed USD payment in the currency swap is closest to:<\/p><\/div>","subj":"derivatives"},{"n":27,"q":"The call option on Eurodollar futures is most likely being used to hedge:","opts":["a floating rate liability.","a long position in a floating rate note.","a long position in a fixed rate bond."],"ans":"B","expl":"Eurodollar futures contracts are cash settled contracts on MRR. Futures prices are inversely related to MRR. Call options on Eurodollar futures increase in value when interest rates fall, and hence, can be used to hedge a floating rate asset.\n(Module 31.6, LOS 31.i)","explhtml":"<p>Eurodollar futures contracts are cash settled contracts on MRR. Futures prices are inversely related to MRR. Call options on Eurodollar futures increase in value when interest rates fall, and hence, can be used to hedge a floating rate asset.<\/p><p>(Module 31.6, LOS 31.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer position in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day MRR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, Carson asks Walsinzki about the mechanics of forward pricing.<\/p><\/div><\/details><div class=\"qtext\"><p>The call option on Eurodollar futures is most likely being used to hedge:<\/p><\/div>","subj":"derivatives"},{"n":28,"q":"Regarding Carson's question about mechanics of forward pricing, Walsinzki would most accurately state that forward prices are set such that:","opts":["the market value of the contract at inception is 0.","the forward price is higher than the spot price by the expected return on the underlying.","the forward price is lower than the spot price by the dividend yield on the underlying."],"ans":"A","expl":"Forward prices are set so the market value of the contract at inception is zero. Using the cost of carry model, forward price equals spot price plus net cost of carry. For an equity forward contract, net cost of carry equals risk-free rate minus dividend yield.\n(Module 30.1, LOS 30.b)","explhtml":"<p>Forward prices are set so the market value of the contract at inception is zero. Using the cost of carry model, forward price equals spot price plus net cost of carry. For an equity forward contract, net cost of carry equals risk-free rate minus dividend yield.<\/p><p>(Module 30.1, LOS 30.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Randy Carson is the chief information officer of Zion Investments, LLC, an independent investment company. Carson has asked Jane Walsinzki, a senior derivatives analyst for Zion, for information on several outstanding contract positions. Walsinzki prepares a report outlining relevant information about the various derivatives.<\/p><p>Walsinzki&#x27;s report first identifies that the firm has a payer position in a two-year, semiannual, 3.25% fixed interest rate swap with a notional of $15 million. The second settlement just occurred. Current 180-day and 360-day MRR are 3.25% and 3.50%, respectively.<\/p><p>The report also identifies a two-year, semi-annual USD-for-EUR currency swap with a notional of €1 million. When the swap was initiated, the USD and EUR fixed rates were 3% and 2%, respectively. The exchange rate has changed from €/$ 0.9091 at inception to €/$ 0.8929 currently.<\/p><p>Furthermore, the report outlines that the firm holds a call option on a Eurodollar futures contract. This position was established to hedge another position of the firm, but Walsinzki could not identify the position that was being hedged.<\/p><p>Finally, Carson asks Walsinzki about the mechanics of forward pricing.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Carson&#x27;s question about mechanics of forward pricing, Walsinzki would most accurately state that forward prices are set such that:<\/p><\/div>","subj":"derivatives"},{"n":29,"q":"Regarding Laurent's statements about the various types of participants in commodity futures markets, Laurent was least accurate in making:","opts":["Statement 1.","Statement 2.","Statement 3."],"ans":"B","expl":"Speculators are generally willing to step in to provide insurance to hedgers in return for an anticipated profit, however note that this profit is merely expected and not guaranteed. Laurent's other two statements are accurate: a company that drills for oil may not be accurate predictor of the future supply and demand for their product, and arbitrageurs may own storage facilities (such as warehouses, feedlots, or grain silos) allowing them to attempt to capitalize on mispricing between a commodity's spot price and futures price.\n(Module 32.1, LOS 32.d)\nActivity Not Found","explhtml":"<p>Speculators are generally willing to step in to provide insurance to hedgers in return for an anticipated profit, however note that this profit is merely expected and not guaranteed. Laurent&#x27;s other two statements are accurate: a company that drills for oil may not be accurate predictor of the future supply and demand for their product, and arbitrageurs may own storage facilities (such as warehouses, feedlots, or grain silos) allowing them to attempt to capitalize on mispricing between a commodity&#x27;s spot price and futures price.<\/p><p>(Module 32.1, LOS 32.d)<\/p><p>Activity Not Found<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Mateo Durand, a student at HEC Paris, has been asked to prepare a presentation on commodities and commodity derivatives for his Trading course. Durand has a basic understanding of commodity derivatives, but would like a practitioner&#x27;s perspective, and so has arranged an interview with commodities trader Elena Laurent.<\/p><p>During the informational interview, Durand first asks Laurent, &quot;Could you explain the various types of participants in commodity futures markets? I&#x27;ve heard about hedgers, speculators, and arbitrageurs, but I&#x27;m not sure I really understand the difference.&quot;<\/p><p>In response, Laurent makes three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Hedgers may not be accurate predictors of the future supply and demand for the commodity they deal in.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Speculators can earn guaranteed profits by providing insurance to hedgers.&quot;<\/td><\/tr><tr><td>Statement 3:<\/td><td>&quot;Arbitrageurs may use storage facilities to exploit mispricing between commodity spot prices and futures prices.&quot;<\/td><\/tr><\/table><\/div><p>Laurent begins to quiz Durand. She asks him: &quot;If you were going to calculate the total return of a fully collateralized commodity futures contract, which of these expressions would you use?&quot;<\/p><div class=\"tbl\"><table><tr><td>Equation 1:<\/td><td>collateral return + spot price return + roll return<\/td><\/tr><tr><td>Equation 2:<\/td><td>spot price return + direct storage costs – convenience yield<\/td><\/tr><tr><td>Equation 3:<\/td><td>spot price return + roll return + convenience yield – collateral return<\/td><\/tr><\/table><\/div><p>Durand continues his questioning:<\/p><p>&quot;I understand that the original purpose of futures markets was for producers and consumers to hedge physical raw materials. Could you explain the various theoretical bases for commodity futures markets&#x27; long-run behavior?&quot;<\/p><p>In response, Laurent makes three explanatory statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 4:<\/td><td>&quot;In Insurance Theory, commodity consumers who are short the physical good are motivated to buy the commodity for future delivery to hedge their consumption price risk exposure.&quot;<\/td><\/tr><tr><td>Statement 5:<\/td><td>&quot;The Hedging Pressure Hypothesis describes scenarios when producers along with consumers seek to protect themselves from commodity market price volatility by entering into price hedges to stabilize their projected profits and cash flow.&quot;<\/td><\/tr><tr><td>Statement 6:<\/td><td>&quot;The Theory of Storage focuses on supply and demand dynamics of commodity inventories, including the concept of convenience<\/td><\/tr><\/table><\/div><p>yield.&quot;<\/p><p>To wrap up their conversation, Laurent poses a hypothetical situation to Durand: &quot;Suppose that a refinery operating on the US Gulf Coast wishes to enter into a swap that will hedge against adverse changes in the price difference between highly liquid Brent Crude Oil futures contracts and very illiquid Gulf of Mexico crude oil futures contracts. What kind of commodity swap would the refinery want to enter into?&quot;<\/p><p>After the interview, Laurent agrees to meet with Durand the following week to discuss more topics related to commodities and commodity derivatives.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Laurent&#x27;s statements about the various types of participants in commodity futures markets, Laurent was least accurate in making:<\/p><\/div>","subj":"alternatives"},{"n":30,"q":"Durand should state that the total return of a fully collateralized commodity futures contract can most accurately be calculated using Laurent's:","opts":["Equation 1.","Equation 2.","Equation 3."],"ans":"A","expl":"The total return of a fully collateralized commodity futures contract can be quantified as the spot price return, plus the roll return, plus the collateral return. (Module 32.2, LOS 32.g)","explhtml":"<p>The total return of a fully collateralized commodity futures contract can be quantified as the spot price return, plus the roll return, plus the collateral return. (Module 32.2, LOS 32.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mateo Durand, a student at HEC Paris, has been asked to prepare a presentation on commodities and commodity derivatives for his Trading course. Durand has a basic understanding of commodity derivatives, but would like a practitioner&#x27;s perspective, and so has arranged an interview with commodities trader Elena Laurent.<\/p><p>During the informational interview, Durand first asks Laurent, &quot;Could you explain the various types of participants in commodity futures markets? I&#x27;ve heard about hedgers, speculators, and arbitrageurs, but I&#x27;m not sure I really understand the difference.&quot;<\/p><p>In response, Laurent makes three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Hedgers may not be accurate predictors of the future supply and demand for the commodity they deal in.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Speculators can earn guaranteed profits by providing insurance to hedgers.&quot;<\/td><\/tr><tr><td>Statement 3:<\/td><td>&quot;Arbitrageurs may use storage facilities to exploit mispricing between commodity spot prices and futures prices.&quot;<\/td><\/tr><\/table><\/div><p>Laurent begins to quiz Durand. She asks him: &quot;If you were going to calculate the total return of a fully collateralized commodity futures contract, which of these expressions would you use?&quot;<\/p><div class=\"tbl\"><table><tr><td>Equation 1:<\/td><td>collateral return + spot price return + roll return<\/td><\/tr><tr><td>Equation 2:<\/td><td>spot price return + direct storage costs – convenience yield<\/td><\/tr><tr><td>Equation 3:<\/td><td>spot price return + roll return + convenience yield – collateral return<\/td><\/tr><\/table><\/div><p>Durand continues his questioning:<\/p><p>&quot;I understand that the original purpose of futures markets was for producers and consumers to hedge physical raw materials. Could you explain the various theoretical bases for commodity futures markets&#x27; long-run behavior?&quot;<\/p><p>In response, Laurent makes three explanatory statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 4:<\/td><td>&quot;In Insurance Theory, commodity consumers who are short the physical good are motivated to buy the commodity for future delivery to hedge their consumption price risk exposure.&quot;<\/td><\/tr><tr><td>Statement 5:<\/td><td>&quot;The Hedging Pressure Hypothesis describes scenarios when producers along with consumers seek to protect themselves from commodity market price volatility by entering into price hedges to stabilize their projected profits and cash flow.&quot;<\/td><\/tr><tr><td>Statement 6:<\/td><td>&quot;The Theory of Storage focuses on supply and demand dynamics of commodity inventories, including the concept of convenience<\/td><\/tr><\/table><\/div><p>yield.&quot;<\/p><p>To wrap up their conversation, Laurent poses a hypothetical situation to Durand: &quot;Suppose that a refinery operating on the US Gulf Coast wishes to enter into a swap that will hedge against adverse changes in the price difference between highly liquid Brent Crude Oil futures contracts and very illiquid Gulf of Mexico crude oil futures contracts. What kind of commodity swap would the refinery want to enter into?&quot;<\/p><p>After the interview, Laurent agrees to meet with Durand the following week to discuss more topics related to commodities and commodity derivatives.<\/p><\/div><\/details><div class=\"qtext\"><p>Durand should state that the total return of a fully collateralized commodity futures contract can most accurately be calculated using Laurent&#x27;s:<\/p><\/div>","subj":"alternatives"},{"n":31,"q":"Regarding the primary theories of futures returns, Laurent was least accurate in making:","opts":["Statement 4.","Statement 5.","Statement 6."],"ans":"A","expl":"In Insurance Theory, commodity producers who are long the physical good are motivated to sell the commodity for future delivery to hedge their production price risk exposure.\n(Module 32.1, LOS 32.f)","explhtml":"<p>In Insurance Theory, commodity producers who are long the physical good are motivated to sell the commodity for future delivery to hedge their production price risk exposure.<\/p><p>(Module 32.1, LOS 32.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mateo Durand, a student at HEC Paris, has been asked to prepare a presentation on commodities and commodity derivatives for his Trading course. Durand has a basic understanding of commodity derivatives, but would like a practitioner&#x27;s perspective, and so has arranged an interview with commodities trader Elena Laurent.<\/p><p>During the informational interview, Durand first asks Laurent, &quot;Could you explain the various types of participants in commodity futures markets? I&#x27;ve heard about hedgers, speculators, and arbitrageurs, but I&#x27;m not sure I really understand the difference.&quot;<\/p><p>In response, Laurent makes three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Hedgers may not be accurate predictors of the future supply and demand for the commodity they deal in.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Speculators can earn guaranteed profits by providing insurance to hedgers.&quot;<\/td><\/tr><tr><td>Statement 3:<\/td><td>&quot;Arbitrageurs may use storage facilities to exploit mispricing between commodity spot prices and futures prices.&quot;<\/td><\/tr><\/table><\/div><p>Laurent begins to quiz Durand. She asks him: &quot;If you were going to calculate the total return of a fully collateralized commodity futures contract, which of these expressions would you use?&quot;<\/p><div class=\"tbl\"><table><tr><td>Equation 1:<\/td><td>collateral return + spot price return + roll return<\/td><\/tr><tr><td>Equation 2:<\/td><td>spot price return + direct storage costs – convenience yield<\/td><\/tr><tr><td>Equation 3:<\/td><td>spot price return + roll return + convenience yield – collateral return<\/td><\/tr><\/table><\/div><p>Durand continues his questioning:<\/p><p>&quot;I understand that the original purpose of futures markets was for producers and consumers to hedge physical raw materials. Could you explain the various theoretical bases for commodity futures markets&#x27; long-run behavior?&quot;<\/p><p>In response, Laurent makes three explanatory statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 4:<\/td><td>&quot;In Insurance Theory, commodity consumers who are short the physical good are motivated to buy the commodity for future delivery to hedge their consumption price risk exposure.&quot;<\/td><\/tr><tr><td>Statement 5:<\/td><td>&quot;The Hedging Pressure Hypothesis describes scenarios when producers along with consumers seek to protect themselves from commodity market price volatility by entering into price hedges to stabilize their projected profits and cash flow.&quot;<\/td><\/tr><tr><td>Statement 6:<\/td><td>&quot;The Theory of Storage focuses on supply and demand dynamics of commodity inventories, including the concept of convenience<\/td><\/tr><\/table><\/div><p>yield.&quot;<\/p><p>To wrap up their conversation, Laurent poses a hypothetical situation to Durand: &quot;Suppose that a refinery operating on the US Gulf Coast wishes to enter into a swap that will hedge against adverse changes in the price difference between highly liquid Brent Crude Oil futures contracts and very illiquid Gulf of Mexico crude oil futures contracts. What kind of commodity swap would the refinery want to enter into?&quot;<\/p><p>After the interview, Laurent agrees to meet with Durand the following week to discuss more topics related to commodities and commodity derivatives.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the primary theories of futures returns, Laurent was least accurate in making:<\/p><\/div>","subj":"alternatives"},{"n":32,"q":"Regarding Laurent's hypothetical question, the refinery is most likely to enter into:","opts":["an excess return swap.","a basis swap.","a variance swap."],"ans":"B","expl":"In a basis swap, periodic payments are exchanged based on the prices of two commodities that are imperfectly correlated. These swaps are useful in, for example, dealing with the difference (i.e., the basis) between a highly liquid futures contract in a commodity (e.g. Brent Crude oil) and an illiquid but related material (Gulf of Mexico heavy crude oil). A total return swap reflects the performance of the reference asset, plus a return based upon interest earned on any cash collateral posted. In a variance swap, two parties exchange payments based on the difference between the observed variance in the price levels of a commodity, and some fixed amount of variance established at the outset of the contract.\n(Module 32.2, LOS 32.i)","explhtml":"<p>In a basis swap, periodic payments are exchanged based on the prices of two commodities that are imperfectly correlated. These swaps are useful in, for example, dealing with the difference (i.e., the basis) between a highly liquid futures contract in a commodity (e.g. Brent Crude oil) and an illiquid but related material (Gulf of Mexico heavy crude oil). A total return swap reflects the performance of the reference asset, plus a return based upon interest earned on any cash collateral posted. In a variance swap, two parties exchange payments based on the difference between the observed variance in the price levels of a commodity, and some fixed amount of variance established at the outset of the contract.<\/p><p>(Module 32.2, LOS 32.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mateo Durand, a student at HEC Paris, has been asked to prepare a presentation on commodities and commodity derivatives for his Trading course. Durand has a basic understanding of commodity derivatives, but would like a practitioner&#x27;s perspective, and so has arranged an interview with commodities trader Elena Laurent.<\/p><p>During the informational interview, Durand first asks Laurent, &quot;Could you explain the various types of participants in commodity futures markets? I&#x27;ve heard about hedgers, speculators, and arbitrageurs, but I&#x27;m not sure I really understand the difference.&quot;<\/p><p>In response, Laurent makes three statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>&quot;Hedgers may not be accurate predictors of the future supply and demand for the commodity they deal in.&quot;<\/td><\/tr><tr><td>Statement 2:<\/td><td>&quot;Speculators can earn guaranteed profits by providing insurance to hedgers.&quot;<\/td><\/tr><tr><td>Statement 3:<\/td><td>&quot;Arbitrageurs may use storage facilities to exploit mispricing between commodity spot prices and futures prices.&quot;<\/td><\/tr><\/table><\/div><p>Laurent begins to quiz Durand. She asks him: &quot;If you were going to calculate the total return of a fully collateralized commodity futures contract, which of these expressions would you use?&quot;<\/p><div class=\"tbl\"><table><tr><td>Equation 1:<\/td><td>collateral return + spot price return + roll return<\/td><\/tr><tr><td>Equation 2:<\/td><td>spot price return + direct storage costs – convenience yield<\/td><\/tr><tr><td>Equation 3:<\/td><td>spot price return + roll return + convenience yield – collateral return<\/td><\/tr><\/table><\/div><p>Durand continues his questioning:<\/p><p>&quot;I understand that the original purpose of futures markets was for producers and consumers to hedge physical raw materials. Could you explain the various theoretical bases for commodity futures markets&#x27; long-run behavior?&quot;<\/p><p>In response, Laurent makes three explanatory statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 4:<\/td><td>&quot;In Insurance Theory, commodity consumers who are short the physical good are motivated to buy the commodity for future delivery to hedge their consumption price risk exposure.&quot;<\/td><\/tr><tr><td>Statement 5:<\/td><td>&quot;The Hedging Pressure Hypothesis describes scenarios when producers along with consumers seek to protect themselves from commodity market price volatility by entering into price hedges to stabilize their projected profits and cash flow.&quot;<\/td><\/tr><tr><td>Statement 6:<\/td><td>&quot;The Theory of Storage focuses on supply and demand dynamics of commodity inventories, including the concept of convenience<\/td><\/tr><\/table><\/div><p>yield.&quot;<\/p><p>To wrap up their conversation, Laurent poses a hypothetical situation to Durand: &quot;Suppose that a refinery operating on the US Gulf Coast wishes to enter into a swap that will hedge against adverse changes in the price difference between highly liquid Brent Crude Oil futures contracts and very illiquid Gulf of Mexico crude oil futures contracts. What kind of commodity swap would the refinery want to enter into?&quot;<\/p><p>After the interview, Laurent agrees to meet with Durand the following week to discuss more topics related to commodities and commodity derivatives.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Laurent&#x27;s hypothetical question, the refinery is most likely to enter into:<\/p><\/div>","subj":"alternatives"},{"n":33,"q":"Regarding Kuiper's Statement 1 and Statement 2:","opts":["only Statement 1 is accurate.","only Statement 2 is accurate.","both statements are accurate."],"ans":"C","expl":"Both statements are accurate. Five percent VaR is the minimum loss 5% of the time, or maximum loss with a 95% confidence level. Historical VaR is suitable only when past data is a good representation of the future. If we expect changes in the economic environment, updated parameters can be used with parametric VaR estimation to obtain robust estimates of VaR.\n(Module 37.1, LOS 37.a)","explhtml":"<p>Both statements are accurate. Five percent VaR is the minimum loss 5% of the time, or maximum loss with a 95% confidence level. Historical VaR is suitable only when past data is a good representation of the future. If we expect changes in the economic environment, updated parameters can be used with parametric VaR estimation to obtain robust estimates of VaR.<\/p><p>(Module 37.1, LOS 37.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Rose Dongen is the chief risk officer at Molenaar Asset Management. Dongen is concerned about the risk metrics the firm is currently using, so she meets with Dan Kuiper, the firm&#x27;s portfolio manager, and Dirk Schipper, the head trader. Kuiper explains that the firm has been using a Value at Risk (VaR) metric over the past year, and it seems to communicate downside risk very well. Kuiper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>A 5% VaR measures the maximum loss with a 95% confidence level.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Parametric VaR is more suitable than historical VaR if we expect fundamental changes in the economy.<\/td><\/tr><\/table><\/div><p>Kuiper states that the expected return of the firm&#x27;s portfolios over the next year is 11.20%, with annual standard deviation of 14.80%. Currently, the firm has $332 million in assets under management.<\/p><p>Dongen makes the following statements regarding using a backtesting approach to evaluate investment strategies:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Backtesting uses the real-life investment process to test the risk- return tradeoff of an investment strategy.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Backtesting fully accounts for randomness in data.<\/td><\/tr><\/table><\/div><p>Schipper makes the following statements regarding Monte Carlo simulation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>We can use a Monte Carlo simulation, however if the asset returns are correlated a multivariate distribution should be specified.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Monte Carlo simulation is a proxy for actual investing.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Kuiper&#x27;s Statement 1 and Statement 2:<\/p><\/div>","subj":"portfolio"},{"n":34,"q":"The 5% annual $VaR using the parametric approach is closest to:","opts":["$44 million.","$56 million.","$150 million."],"ans":"A","expl":"VaR% = 11.20% − (1.65 × 14.80%) = –13.22%. $VaR = $332 million × 0.1322 = $43,890,400. (Module 37.1, LOS 37.b)","explhtml":"<p>VaR% = 11.20% − (1.65 × 14.80%) = –13.22%. $VaR = $332 million × 0.1322 = $43,890,400. (Module 37.1, LOS 37.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rose Dongen is the chief risk officer at Molenaar Asset Management. Dongen is concerned about the risk metrics the firm is currently using, so she meets with Dan Kuiper, the firm&#x27;s portfolio manager, and Dirk Schipper, the head trader. Kuiper explains that the firm has been using a Value at Risk (VaR) metric over the past year, and it seems to communicate downside risk very well. Kuiper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>A 5% VaR measures the maximum loss with a 95% confidence level.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Parametric VaR is more suitable than historical VaR if we expect fundamental changes in the economy.<\/td><\/tr><\/table><\/div><p>Kuiper states that the expected return of the firm&#x27;s portfolios over the next year is 11.20%, with annual standard deviation of 14.80%. Currently, the firm has $332 million in assets under management.<\/p><p>Dongen makes the following statements regarding using a backtesting approach to evaluate investment strategies:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Backtesting uses the real-life investment process to test the risk- return tradeoff of an investment strategy.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Backtesting fully accounts for randomness in data.<\/td><\/tr><\/table><\/div><p>Schipper makes the following statements regarding Monte Carlo simulation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>We can use a Monte Carlo simulation, however if the asset returns are correlated a multivariate distribution should be specified.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Monte Carlo simulation is a proxy for actual investing.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The 5% annual $VaR using the parametric approach is closest to:<\/p><\/div>","subj":"portfolio"},{"n":35,"q":"Regarding Dongen's two statements about backtesting:","opts":["Both statements are correct","Statement 1 is correct while statement 2 is incorrect.","Statement 1 is incorrect while statement 2 is correct."],"ans":"B","expl":"Backtesting is used to evaluate the risk-return tradeoff of an investment strategy by approximating a real-life investment process. Simulation and scenario analysis, along with sensitivity analysis, can supplement backtesting to account for randomness in data.\n(Module 38.1, LOS 38.a)","explhtml":"<p>Backtesting is used to evaluate the risk-return tradeoff of an investment strategy by approximating a real-life investment process. Simulation and scenario analysis, along with sensitivity analysis, can supplement backtesting to account for randomness in data.<\/p><p>(Module 38.1, LOS 38.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rose Dongen is the chief risk officer at Molenaar Asset Management. Dongen is concerned about the risk metrics the firm is currently using, so she meets with Dan Kuiper, the firm&#x27;s portfolio manager, and Dirk Schipper, the head trader. Kuiper explains that the firm has been using a Value at Risk (VaR) metric over the past year, and it seems to communicate downside risk very well. Kuiper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>A 5% VaR measures the maximum loss with a 95% confidence level.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Parametric VaR is more suitable than historical VaR if we expect fundamental changes in the economy.<\/td><\/tr><\/table><\/div><p>Kuiper states that the expected return of the firm&#x27;s portfolios over the next year is 11.20%, with annual standard deviation of 14.80%. Currently, the firm has $332 million in assets under management.<\/p><p>Dongen makes the following statements regarding using a backtesting approach to evaluate investment strategies:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Backtesting uses the real-life investment process to test the risk- return tradeoff of an investment strategy.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Backtesting fully accounts for randomness in data.<\/td><\/tr><\/table><\/div><p>Schipper makes the following statements regarding Monte Carlo simulation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>We can use a Monte Carlo simulation, however if the asset returns are correlated a multivariate distribution should be specified.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Monte Carlo simulation is a proxy for actual investing.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Dongen&#x27;s two statements about backtesting:<\/p><\/div>","subj":"portfolio"},{"n":36,"q":"Regarding Schipper's two statements:","opts":["Only statement 1 is correct.","Only statement 2 is correct.","Both statements are correct."],"ans":"A","expl":"When individual asset returns are correlated, it is crucial to specify a multivariate distribution in a Monte Carlo simulation. Rolling-window backtesting (not Monte Carlo simulation) is a proxy for actual investing.\n(Module 38.4, LOS 38.f)","explhtml":"<p>When individual asset returns are correlated, it is crucial to specify a multivariate distribution in a Monte Carlo simulation. Rolling-window backtesting (not Monte Carlo simulation) is a proxy for actual investing.<\/p><p>(Module 38.4, LOS 38.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Rose Dongen is the chief risk officer at Molenaar Asset Management. Dongen is concerned about the risk metrics the firm is currently using, so she meets with Dan Kuiper, the firm&#x27;s portfolio manager, and Dirk Schipper, the head trader. Kuiper explains that the firm has been using a Value at Risk (VaR) metric over the past year, and it seems to communicate downside risk very well. Kuiper makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>A 5% VaR measures the maximum loss with a 95% confidence level.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Parametric VaR is more suitable than historical VaR if we expect fundamental changes in the economy.<\/td><\/tr><\/table><\/div><p>Kuiper states that the expected return of the firm&#x27;s portfolios over the next year is 11.20%, with annual standard deviation of 14.80%. Currently, the firm has $332 million in assets under management.<\/p><p>Dongen makes the following statements regarding using a backtesting approach to evaluate investment strategies:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Backtesting uses the real-life investment process to test the risk- return tradeoff of an investment strategy.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Backtesting fully accounts for randomness in data.<\/td><\/tr><\/table><\/div><p>Schipper makes the following statements regarding Monte Carlo simulation:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>We can use a Monte Carlo simulation, however if the asset returns are correlated a multivariate distribution should be specified.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Monte Carlo simulation is a proxy for actual investing.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Schipper&#x27;s two statements:<\/p><\/div>","subj":"portfolio"},{"n":37,"q":"Using the information in Exhibit 1, which country is expected to have the lowest real risk-free rate?","opts":["East Farnia.","West Farnia.","South Farnia."],"ans":"B","expl":"Real risk-free rate is positively related to real GDP growth and to GDP volatility. West Farnia has the lowest GDP growth rate. South Farnia has the same GDP volatility as West Farina but a higher real GDP growth rate.\n(Module 39.1, LOS 39.c)","explhtml":"<p>Real risk-free rate is positively related to real GDP growth and to GDP volatility. West Farnia has the lowest GDP growth rate. South Farnia has the same GDP volatility as West Farina but a higher real GDP growth rate.<\/p><p>(Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the various economic forecasts used at Faver. As part of his orientation, Sean McDermott, the chief economist at Faver, provides Mollie with the firm&#x27;s forecasts for three countries as shown in exhibit 1. Exhibit 1: Forecasts For Subject Countries<\/p><div class=\"tbl\"><table><tr><td>Real GDP<\/td><td>GDP<\/td><td>Expected<\/td><td>Unemployment<\/td><\/tr><\/table><\/div><p>Country<\/p><div class=\"tbl\"><table><tr><td>growth<\/td><td>volatility<\/td><td>Inflation<\/td><td>Rate<\/td><td><\/td><\/tr><tr><td>East Farnia<\/td><td>2.1%<\/td><td>3%<\/td><td>1.2%<\/td><td>5.0%<\/td><\/tr><\/table><\/div><p>West<\/p><div class=\"tbl\"><table><tr><td>1.3%<\/td><td>4%<\/td><td>3.2%<\/td><td>4.2%<\/td><\/tr><\/table><\/div><p>Farnia Soth<\/p><div class=\"tbl\"><table><tr><td>3.2%<\/td><td>4%<\/td><td>1.1%<\/td><td>3.6%<\/td><\/tr><\/table><\/div><p>Farnia McDermott tells Mollie that the inter-temporal rate of substitution in East Farnia is 0.9368.<\/p><p>Mollie asks McDermott the following questions:<\/p><p>Question 1: What do we mean by the inter-temporal rate of substitution? Question 2: What factors are associated with an investor having a higher inter-temporal rate of substitution?<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, which country is expected to have the lowest real risk-free rate?<\/p><\/div>","subj":"portfolio"},{"n":38,"q":"The real risk-free rate in East Farnia is closest to:","opts":["2.1%.","3.3%.","6.8%."],"ans":"C","expl":"Real risk-free rate = [1/ E(mt)] – 1 = (1 / 0.9368) – 1 = 0.0675 = 6.75% (Module 39.1, LOS 39.c)","explhtml":"<p>Real risk-free rate = [1/ E(mt)] – 1 = (1 / 0.9368) – 1 = 0.0675 = 6.75% (Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the various economic forecasts used at Faver. As part of his orientation, Sean McDermott, the chief economist at Faver, provides Mollie with the firm&#x27;s forecasts for three countries as shown in exhibit 1. Exhibit 1: Forecasts For Subject Countries<\/p><div class=\"tbl\"><table><tr><td>Real GDP<\/td><td>GDP<\/td><td>Expected<\/td><td>Unemployment<\/td><\/tr><\/table><\/div><p>Country<\/p><div class=\"tbl\"><table><tr><td>growth<\/td><td>volatility<\/td><td>Inflation<\/td><td>Rate<\/td><td><\/td><\/tr><tr><td>East Farnia<\/td><td>2.1%<\/td><td>3%<\/td><td>1.2%<\/td><td>5.0%<\/td><\/tr><\/table><\/div><p>West<\/p><div class=\"tbl\"><table><tr><td>1.3%<\/td><td>4%<\/td><td>3.2%<\/td><td>4.2%<\/td><\/tr><\/table><\/div><p>Farnia Soth<\/p><div class=\"tbl\"><table><tr><td>3.2%<\/td><td>4%<\/td><td>1.1%<\/td><td>3.6%<\/td><\/tr><\/table><\/div><p>Farnia McDermott tells Mollie that the inter-temporal rate of substitution in East Farnia is 0.9368.<\/p><p>Mollie asks McDermott the following questions:<\/p><p>Question 1: What do we mean by the inter-temporal rate of substitution? Question 2: What factors are associated with an investor having a higher inter-temporal rate of substitution?<\/p><\/div><\/details><div class=\"qtext\"><p>The real risk-free rate in East Farnia is closest to:<\/p><\/div>","subj":"portfolio"},{"n":39,"q":"Regarding Mollie's Question 1, the inter-temporal rate of substitution is best defined as:","opts":["the rate at which a consumer is willing to substitute risky assets for default-free assets.","the rate at which a consumer is willing to substitute consumption in the present for consumption in the future.","the rate at which a consumer is willing to substitute consumption in the future for consumption in the present."],"ans":"B","expl":"The intertemporal rate of substitution is the ratio of the marginal utility of future consumption to the marginal utility of current consumption. As such, this measure represents the rate at which the consumer is willing to substitute current consumption for 1 unit of consumption in the future. Note that in most scenarios, the inter-temporal rate of substitution is less than 1, meaning that individuals generally prefer present consumption over future consumption.\n(Module 39.1, LOS 39.c)","explhtml":"<p>The intertemporal rate of substitution is the ratio of the marginal utility of future consumption to the marginal utility of current consumption. As such, this measure represents the rate at which the consumer is willing to substitute current consumption for 1 unit of consumption in the future. Note that in most scenarios, the inter-temporal rate of substitution is less than 1, meaning that individuals generally prefer present consumption over future consumption.<\/p><p>(Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the various economic forecasts used at Faver. As part of his orientation, Sean McDermott, the chief economist at Faver, provides Mollie with the firm&#x27;s forecasts for three countries as shown in exhibit 1. Exhibit 1: Forecasts For Subject Countries<\/p><div class=\"tbl\"><table><tr><td>Real GDP<\/td><td>GDP<\/td><td>Expected<\/td><td>Unemployment<\/td><\/tr><\/table><\/div><p>Country<\/p><div class=\"tbl\"><table><tr><td>growth<\/td><td>volatility<\/td><td>Inflation<\/td><td>Rate<\/td><td><\/td><\/tr><tr><td>East Farnia<\/td><td>2.1%<\/td><td>3%<\/td><td>1.2%<\/td><td>5.0%<\/td><\/tr><\/table><\/div><p>West<\/p><div class=\"tbl\"><table><tr><td>1.3%<\/td><td>4%<\/td><td>3.2%<\/td><td>4.2%<\/td><\/tr><\/table><\/div><p>Farnia Soth<\/p><div class=\"tbl\"><table><tr><td>3.2%<\/td><td>4%<\/td><td>1.1%<\/td><td>3.6%<\/td><\/tr><\/table><\/div><p>Farnia McDermott tells Mollie that the inter-temporal rate of substitution in East Farnia is 0.9368.<\/p><p>Mollie asks McDermott the following questions:<\/p><p>Question 1: What do we mean by the inter-temporal rate of substitution? Question 2: What factors are associated with an investor having a higher inter-temporal rate of substitution?<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Mollie&#x27;s Question 1, the inter-temporal rate of substitution is best defined as:<\/p><\/div>","subj":"portfolio"},{"n":40,"q":"Regarding Mollie's Question 2, one factor that is positively related to an investor's inter-temporal rate of substitution is:","opts":["expected future price of a risky asset.","current income level.","real rate of return."],"ans":"B","expl":"Due to diminishing marginal utility, the utility of current consumption (the denominator in the calculation of the inter-temporal rate of substitution) declines as an investor's income level rises, and thus the ratio increases. As a result, the higher the current income of an investor, the higher their inter-temporal rate of substitution. For a risk-averse investor, when the expected future price of a risky asset increases, utility of future consumption declines leading to a decrease in inter-temporal rate of substitution. The inter-temporal rate of substitution is inversely related to the real rate of return: the higher the return the investor can earn, the more important current consumption becomes relative to future consumption.\n(Module 39.1, LOS 39.c)","explhtml":"<p>Due to diminishing marginal utility, the utility of current consumption (the denominator in the calculation of the inter-temporal rate of substitution) declines as an investor&#x27;s income level rises, and thus the ratio increases. As a result, the higher the current income of an investor, the higher their inter-temporal rate of substitution. For a risk-averse investor, when the expected future price of a risky asset increases, utility of future consumption declines leading to a decrease in inter-temporal rate of substitution. The inter-temporal rate of substitution is inversely related to the real rate of return: the higher the return the investor can earn, the more important current consumption becomes relative to future consumption.<\/p><p>(Module 39.1, LOS 39.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brendan Mollie is a summer intern at Faver Asset Management. He is currently learning about the various economic forecasts used at Faver. As part of his orientation, Sean McDermott, the chief economist at Faver, provides Mollie with the firm&#x27;s forecasts for three countries as shown in exhibit 1. Exhibit 1: Forecasts For Subject Countries<\/p><div class=\"tbl\"><table><tr><td>Real GDP<\/td><td>GDP<\/td><td>Expected<\/td><td>Unemployment<\/td><\/tr><\/table><\/div><p>Country<\/p><div class=\"tbl\"><table><tr><td>growth<\/td><td>volatility<\/td><td>Inflation<\/td><td>Rate<\/td><td><\/td><\/tr><tr><td>East Farnia<\/td><td>2.1%<\/td><td>3%<\/td><td>1.2%<\/td><td>5.0%<\/td><\/tr><\/table><\/div><p>West<\/p><div class=\"tbl\"><table><tr><td>1.3%<\/td><td>4%<\/td><td>3.2%<\/td><td>4.2%<\/td><\/tr><\/table><\/div><p>Farnia Soth<\/p><div class=\"tbl\"><table><tr><td>3.2%<\/td><td>4%<\/td><td>1.1%<\/td><td>3.6%<\/td><\/tr><\/table><\/div><p>Farnia McDermott tells Mollie that the inter-temporal rate of substitution in East Farnia is 0.9368.<\/p><p>Mollie asks McDermott the following questions:<\/p><p>Question 1: What do we mean by the inter-temporal rate of substitution? Question 2: What factors are associated with an investor having a higher inter-temporal rate of substitution?<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Mollie&#x27;s Question 2, one factor that is positively related to an investor&#x27;s inter-temporal rate of substitution is:<\/p><\/div>","subj":"portfolio"},{"n":41,"q":"Blackwell's most appropriate course of action to remain in compliance with the Code and Standards is to:","opts":["include a disclosure indicating that lower earnings estimates are available.","follow up the first report with a second report emphasizing lower earnings projections.","remove her name from the report if they release the report with higher earnings estimates."],"ans":"C","expl":"Standard V(A) Diligence and Reasonable Basis requires that appropriate due diligence be performed and that recommendations be substantiated. Moreover, the Standards require that supervisory procedures must be in place to ensure compliance with the policy. If the report is released with the supervisor's revision, Blackwell should insist that her name be removed.\n(Module 42.8, LOS 42.a)","explhtml":"<p>Standard V(A) Diligence and Reasonable Basis requires that appropriate due diligence be performed and that recommendations be substantiated. Moreover, the Standards require that supervisory procedures must be in place to ensure compliance with the policy. If the report is released with the supervisor&#x27;s revision, Blackwell should insist that her name be removed.<\/p><p>(Module 42.8, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the trading loss.<\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the costs of the trading error.<\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to all of its clients on a pro-rata basis.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Blackwell&#x27;s most appropriate course of action to remain in compliance with the Code and Standards is to:<\/p><\/div>","subj":"ethics"},{"n":42,"q":"When updating the proxy-voting policy to conform to CFA Institute recommendations, which of the following recommendations is least appropriate for Blanchard to adopt?","opts":["Determine the economic impact of non-routine proxy votes.","Follow the same proxy-voting procedures regardless of the nature of the proposal.","If the proxy voter’s preference differs from the preference of a client who has delegated his voting powers, go with the client’s preference."],"ans":"B","expl":"Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm's proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.\n(Module 42.4, LOS 42.a)","explhtml":"<p>Standard III(A) Loyalty, Prudence, and Care. Unusual proposals, such as hostile takeovers and executive changes, may require more review than routine matters such as renewing stock-repurchase agreements. Money managers should provide a means to review complex proxies. Establishing evaluation criteria and disclosing the firm&#x27;s proxy voting policies and procedures to clients are basic elements of a proxy-voting policy. Client wishes regarding proxy voting should always be followed.<\/p><p>(Module 42.4, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Blackwell, CFA, has been hired into the research department of Blanchard Investments. Blanchard&#x27;s manager, Thaddeus Baldwin, CFA, has worked in the securities business for more than 50 years. On Blackwell&#x27;s first day at the office, Baldwin gives her an incomplete research report on Tops Groceries, Inc., to finish up.<\/p><p>Upon researching Tops, information about the financial instability of Tops Groceries&#x27; largest customer surfaces. Blackwell revises the research report by lowering the earnings projections. The day the report is to be released, Blackwell learns that Baldwin has replaced the lower, revised earnings projections with his earlier estimates.<\/p><p>Baldwin realizes that many of the firm&#x27;s practices and policies would benefit from a compliance check. Baldwin wants Blackwell to ensure that the policies and procedures at the firm are in compliance.<\/p><p>During a local society luncheon, Blackwell is seated next to CFA candidate Lucas Walters, who has been assigned the task of creating a compliance manual for Borchard &amp; Sons, a small brokerage firm. Walters asks for her advice.<\/p><p>When Walters returns to work, he is apprised of the following situation: Borchard &amp; Sons purchased 25,000 shares of CBX Corp. for equity manager Quintux Quantitative just minutes before the money manager called back and said it meant to buy 25,000 shares of CDX Corp. Borchard then purchased CDX shares for Quintux, but not before shares of CBX Corp. declined by 1.5%. The broker is holding the CBX shares in its own inventory.<\/p><p>Borchard proposes three methods for dealing with the trading error.<\/p><div class=\"tbl\"><table><tr><td>Method 1:<\/td><td>Quintux directs additional trades to Borchard worth a dollar value equal to the amount of the trading loss.<\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the costs of the trading error.<\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to all of its clients on a pro-rata basis.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>When updating the proxy-voting policy to conform to CFA Institute recommendations, which of the following recommendations is least appropriate for Blanchard to adopt?<\/p><\/div>","subj":"ethics"},{"n":43,"q":"If Walters wants the manual to satisfy the requirements and recommendations of the Code and Standards, which of the following instructions is least appropriate to include in the section on fair dealing?","opts":["Whenever possible, disseminate investment recommendations to all clients at the same time.","Execute all clients’ requested trades promptly and without comment, regardless of the company’s opinion on the stock being traded.","Members of the investment-policy committee should not discuss possible changes in investment recommendations with anyone else in the firm until after an official decision has been made."],"ans":"B","expl":"Standard III(B) Fair Dealing requires firms to notify clients of changes in investment advice before executing trades that go counter to that advice. While equal dissemination is usually impossible, it is an admirable goal. Firms should establish dissemination guidelines that are fair to all clients. Trading disclosures and confidentiality regarding investment rating changes are sensible precautions that meet the spirit of the fair dealing Standard. Maintaining client lists that detail client holdings will simplify the process of deciding how to best disseminate a change in investment recommendation.\n(Module 42.2, LOS 42.a)","explhtml":"<p>Standard III(B) Fair Dealing requires firms to notify clients of changes in investment advice before executing trades that go counter to that advice. While equal dissemination is usually impossible, it is an admirable goal. Firms should establish dissemination guidelines that are fair to all clients. Trading disclosures and confidentiality regarding investment rating changes are sensible precautions that meet the spirit of the fair dealing Standard. Maintaining client lists that detail client holdings will simplify the process of deciding how to best disseminate a change in investment recommendation.<\/p><p>(Module 42.2, LOS 42.a)<\/p>","qhtml":"< mount of the trading loss.<\/td><\/tr><tr><td>Method 2:<\/td><td>Borchard receives investment research from Quintux in exchange for Borchard covering the costs of the trading error.<\/td><\/tr><tr><td>Method 3:<\/td><td>Borchard transfers the ordered CBX shares in its inventory to Quintux, which allocates them to all of its clients on a pro-rata basis.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If Walters wants the manual to satisfy the requirements and recommendations of the Code and Standards, which of the following instructions is least appropriate to include in the section on fair dealing?<\/p><\/div>","subj":"ethics"},{"n":44,"q":"Which method for dealing with the trading error is most consistent with the Code and Standards?","opts":["Method 1.","Method 2.","Method 3."],"ans":"B","expl":"Method 2 is the best answer. Quintux should cover the cost of the trading error, and if Borchard is willing to accept investment research in lieu of cash, that's all the better for Quintux. If Quintux compensates Borchard with extra trades, its clients are covering the costs of the error, which may violate Standard III(A) Loyalty, Prudence, and Care if directing future trades to Borchard is not in the clients' best interest. By accepting the CBX shares it did not request and allocating the shares to all client accounts rather than paying for the error, Quintux is violating Standard III(C) Suitability, since the shares are not likely to be appropriate for all of its client accounts and may not be suitable for any accounts since the shares were obtained as a result of a trading error, not an intentional investment action. Passing on client names is a violation of Standard III(E) Preservation of Confidentiality.\n(Module 42.6, LOS 42.a)","explhtml":"<p>Method 2 is the best answer. Quintux should cover the cost of the trading error, and if Borchard is willing to accept investment research in lieu of cash, that&#x27;s all the better for Quintux. If Quintux
