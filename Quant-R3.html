<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Given the following annual returns, what is the mean absolute deviation?\n20002001200220032004\n15%2%5%-7%0%", "opts": ["0.0%.", "3.0%.", "5.6%."], "ans": "C", "expl": "The mean absolute deviation is found by taking the mean of the absolute values of\ndeviations from the mean. ( |15 – 3| + |2 – 3| + |5 – 3| + |-7 – 3| + |0 – 3|) / 5 = 5.60%\n(Module 3.1, LOS 3.b)", "qhtml": "<p>Given the following annual returns, what is the mean absolute deviation?</p><table class=\"qtable\"><thead><tr><th>2000</th><th>2001</th><th>2002</th><th>2003</th><th>2004</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>−7%</td><td>0%</td></tr></tbody></table>"}, {"n": 2, "q": "If Stock X's expected return is 30% and its expected standard deviation is 5%, Stock X's\nexpected coefficient of variation is:", "opts": ["0.167.", "1.20.", "6.0."], "ans": "A", "expl": "The coefficient of variation is the standard deviation divided by the mean: 5 / 30 = 0.167.\n(Module 3.1, LOS 3.b)"}, {"n": 3, "q": "In a positively skewed distribution, what is the order (from lowest value to highest) for the\ndistribution's mode, mean, and median values?", "opts": ["Mean, median, mode.", "Mode, median, mean.", "Mode, mean, median."], "ans": "B", "expl": "In a positively skewed distribution, the mode is less than the median, which is less than\nthe mean.\n(Module 3.2, LOS 3.c)"}, {"n": 4, "q": "Michael Philizaire decides to calculate the geometric average of the\nappreciation/deprecation of his home over the last five years. Using comparable sales and\nmarket data he obtains from a local real estate appraiser, Philizaire calculates the year-to-\nyear percentage change in the value of his home as follows: 20, 15, 0, –5, –5. The geometric\nreturn is closest to:", "opts": ["11.60%.", "0.00%.", "4.49%."], "ans": "C", "expl": "The geometric return is calculated as follows:\n1/5\n[(1 + 0.20) × (1 + 0.15) × (1 + 0.0) (1 – 0.05) (1 – 0.05)] – 1,\n0.2\nor [1.20 × 1.15 × 1.0 × 0.95 × 0.95] – 1 = 0.449, or 4.49%.\n(Module 3.1, LOS 3.a)"}, {"n": 5, "q": "An investor has a portfolio with 10% cash, 30% bonds, and 60% stock. If last year's return on\ncash was 2.0%, the return on bonds was 9.5%, and the return on stock was 25%, what was\nthe return on the investor's portfolio?", "opts": ["12.17%.", "18.05%.", "11.77%."], "ans": "B", "expl": "Find the weighted mean of the returns. (0.10 × 0.02) + (0.30 × 0.095) + (0.60 × 0.25) =\n18.05%\nAssetWeightReturnWeight × Return\nCash10%2%10% × 2% = 0.2%\nBonds30%9.5%30% × 9.5% = 2.85%\nStock60%25%60% × 25% = 15%\nWeighted Average Return\n18.05%\n∑ Weight × Probability\n(Module 3.1, LOS 3.a)"}, {"n": 6, "q": "A portfolio is equally invested in Stock A, with an expected return of 6%, and Stock B, with an\nexpected return of 10%, and a risk-free asset with a return of 5%. The expected return on\nthe portfolio is:", "opts": ["7.0%.", "7.4%.", "8.0%."], "ans": "A", "expl": "(0.333)(0.06) + (0.333)(0.10) + 0.333(0.05) = 0.07\n(Module 3.1, LOS 3.a)"}, {"n": 7, "q": "A sample of returns for four randomly selected assets in a portfolio is shown below:\nAssetReturn (%)\nA1.3\nB1.4\nC2.2\nD3.4\nWhat is the sample standard deviation of asset returns?", "opts": ["0.88%.", "0.97%.", "1.13%."], "ans": "B", "expl": "The sample standard deviation equals the square root of the sum of the squares of the\nposition returns less the mean return, divided by the number of observations in the\nsample minus one.\n2\nPositionReturn (%)\n(Return – Mean)\nA1.30.60\nB1.40.46\nC2.20.02\nD3.41.76\nMean8.3/4 = 2.075Sum = 2.83\n0.5\nStd. Dev. = [2.83 / (4 – 1)] = 0.97\n(Module 3.1, LOS 3.b)", "qhtml": "<p>A sample of returns for four randomly selected assets in a portfolio is shown below:</p><table class=\"qtable\"><thead><tr><th>Asset</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>1.3</td></tr><tr><td>B</td><td>1.4</td></tr><tr><td>C</td><td>2.2</td></tr><tr><td>D</td><td>3.4</td></tr></tbody></table><p>What is the sample standard deviation of asset returns?</p>"}, {"n": 8, "q": "What is the compound annual growth rate for stock A which has annual returns of 5.60%,\n22.67%, and -5.23%?", "opts": ["6.00%.", "7.08%.", "8.72%."], "ans": "B", "expl": "1/3\nCompound annual growth rate is the geometric mean. (1.056 × 1.2267 × 0.9477) – 1 =\n7.08%\n(Module 3.1, LOS 3.a)"}, {"n": 9, "q": "Consider the following statements about the geometric and arithmetic means as measures\nof central tendency. Which statement is least accurate?", "opts": ["The geometric mean may be used to estimate the average return over a one-period time horizon because it is the average of one-period returns.", "The difference between the geometric mean and the arithmetic mean increases with an increase in variability between period-to-period observations.", "The geometric mean calculates the rate of return that would have to be earned each year to match the actual, cumulative investment performance."], "ans": "A", "expl": "The arithmetic mean may be used to estimate the average return over a one-period time\nhorizon because it is the average of one-period returns. Both remaining statements are\ntrue.\n(Module 3.1, LOS 3.a)"}, {"n": 10, "q": "The following data points are observed returns.\n4.2%, 6.8%, 7.0%, 10.9%, 11.6%, 14.4%, 17.0%, 19.0%, 22.5%\nWhat return lies at the 70th percentile (70% of returns lie below this return)?", "opts": ["17.0%.", "14.4%.", "19.0%."], "ans": "A", "expl": "With 9 observations, the location of the 70th percentile is (9 + 1)(70 / 100) = 7. The seventh\nobservation in ascending order is 17.0%.\n(Module 3.1, LOS 3.a)"}, {"n": 11, "q": "The following annualized monthly return measures have been calculated for an investment\nbased on its performance over the last 72 months.\nArithmetic mean6.8%\nGeometric mean6.0%\n90% Winsorized mean5.5%\nIf for one month in the period the return was extremely high, which measure best reflects\nthe central tendency of the investment's returns?", "opts": ["Geometric mean.", "Winsorized mean.", "Arithmetic mean."], "ans": "B", "expl": "A winsorized mean is a technique for removing the distorting effects of outliers by\nreplacing them with less extreme values. The arithmetic and geometric means are based\non all observations and therefore include the impact of outliers.\n(Module 3.1, LOS 3.a)"}, {"n": 12, "q": "The respective arithmetic mean and geometric mean returns of the following series of stock\nmarket returns are:\nYear 114%\nYear 26%\nYear 3−5%\nYear 420%", "opts": ["8.75%; 8.34%.", "8.75%; 8.62%.", "8.90%; 8.62%."], "ans": "A", "expl": "(14 + 6 + (-5) + 20) / 4 = 8.75.\n0.25\n((1.14 × 1.06 × 0.95 × 1.20) – 1 = 8.34%.\n(Module 3.1, LOS 3.a)"}, {"n": 13, "q": "A distribution that has positive excess kurtosis is:", "opts": ["more skewed than a normal distribution.", "less peaked than a normal distribution.", "more peaked than a normal distribution."], "ans": "C", "expl": "A distribution with positive excess kurtosis is more peaked and has fatter tails than a\nnormal distribution.\n(Module 3.2, LOS 3.c)"}, {"n": 14, "q": "The mean monthly return on a security is 0.42% with a standard deviation of 0.25%. What is\nthe coefficient of variation?", "opts": ["168%.", "60%.", "84%."], "ans": "B", "expl": "The coefficient of variation expresses how much dispersion exists relative to the mean of a\ndistribution and is found by CV = s / mean, or 0.25 / 0.42 = 0.595, or 60%.\n(Module 3.1, LOS 3.b)"}, {"n": 15, "q": "Which of the following statements concerning skewness is least accurate? A distribution\nwith:", "opts": ["skew equal to 1 is not symmetrical.", "negative skewness has a large number of outliers on its left side.", "positive skewness has a long left tail."], "ans": "C", "expl": "A distribution with positive skewness has long right tails.\n(Module 3.2, LOS 3.c)"}, {"n": 16, "q": "Assume that the following returns are a sample of annual returns for firms in the clothing\nindustry.\nFirm 1Firm 2Firm 3Firm 4Firm 5\n15%2%5%(7%)0%\nThe sample standard deviation is closest to:", "opts": ["5.7.", "7.2.", "8.0."], "ans": "C", "expl": "The sample variance is found by taking the sum of all squared deviations from the mean\nand dividing by (n – 1).\n22222\n[(15 – 3) + (2 – 3) + (5 – 3) + (-7 – 3) + (0 – 3)] / (5 – 1) = 64.5\nThe sample standard deviation is found by taking the square root of the sample variance.\n√64.5 = 8.03\n(Module 3.1, LOS 3.b)", "qhtml": "<p>Assume that the following returns are a sample of annual returns for firms in the clothing industry.</p><table class=\"qtable\"><thead><tr><th>Firm 1</th><th>Firm 2</th><th>Firm 3</th><th>Firm 4</th><th>Firm 5</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>(7%)</td><td>0%</td></tr></tbody></table><p>The sample standard deviation is closest to:</p>"}, {"n": 17, "q": "Trina Romel, mutual fund manager, is taking over a poor-performing fund from a colleague.\nRomel wants to calculate the return on the portfolio. Over the last five years, the fund's\nannual percentage returns were: 25, 15, 12, -8, and –14.\nDetermine if the geometric return of the fund will be less than or greater than the arithmetic\nreturn and calculate the fund's geometric return:\nGeometric compared to\nGeometric Return\nArithmetic", "opts": ["12.86%greater than", "4.96%greater than", "4.96% less than"], "ans": "C", "expl": "The geometric return is calculated as follows:\n1/5\n[(1 + 0.25)(1 + 0.15)(1 + 0.12)(1 - 0.08)(1 – 0.14)] – 1,\n0.2\nor [1.25 × 1.15 × 1.12 × 0.92 × 0.86] – 1 = 0.4960, or 4.96%.\nThe geometric return will always be less than or equal to the arithmetic return. In this case\nthe arithmetic return was 6%.\n(Module 3.1, LOS 3.a)"}, {"n": 18, "q": "For a positively skewed distribution, the median is greater than:", "opts": ["both the mode and the mean.", "the mean, but less than the mode.", "the mode, but less than the mean."], "ans": "C", "expl": "For a positively skewed distribution, the mean is greater than the median, and the median\nis greater than the mode. Their order reverses for a negatively skewed distribution.\n(Module 3.2, LOS 3.c)"}, {"n": 19, "q": "What are the median and the third quintile of the following data points, respectively?\n9.2%, 10.1%, 11.5%, 11.9%, 12.2%, 12.8%, 13.1%, 13.6%, 13.9%, 14.2%, 14.8%,\n14.9%, 15.4%", "opts": ["13.1%; 13.7%.", "13.1%; 13.6%.", "12.8%; 13.6%."], "ans": "A", "expl": "The median is the midpoint of the data points. In this case there are 13 data points and\nth\nthe midpoint is the 7 term.\nThe formula for determining quantiles is: L = (n + 1)(y) / (100). Here, we are looking for the\ny\nthird quintile (60% of the observations lie below) and the formula is: (14)(60) / (100) = 8.4.\nthth\nThe third quintile falls between 13.6% and 13.9%, the 8 and 9 numbers from the left.\nSince L is not a whole number, we interpolate as: 0.136 + (0.40)(0.139 – 0.136) = 0.1372, or\n13.7%.\n(Module 3.1, LOS 3.a)"}, {"n": 20, "q": "An analyst observes the following four annual returns: R = +10%, R = –15%, R = 0%, and R\n1234\n= +5%. The average compound annual rate over the four years is closest to:", "opts": ["–0.5%.", "0.0%.", "–5.0%."], "ans": "A", "expl": "0.25\nG = [(1.10)(0.85)(1.00)(1.05)] – 1\n0.25\nG = (0.98175) – 1 = 0.9954 – 1 = –0.00459 ≈ –0.5%\nNote: Taking a number to the 0.25 power is the same as taking the fourth root of the\nnumber. (Module 3.1, LOS 3.a)"}, {"n": 21, "q": "If a distribution is positively skewed, then generally:", "opts": ["mean < median < mode.", "mean > median > mode.", "mean > median < mode."], "ans": "B", "expl": "When a distribution is positively skewed the right side tail is longer than normal due to\noutliers. The mean will exceed the median, and the median will generally exceed the mode\nbecause large outliers falling to the far right side of the distribution can dramatically\ninfluence the mean.\n(Module 3.2, LOS 3.c)"}, {"n": 22, "q": "An investor has a $12,000 portfolio consisting of $7,000 in stock P with an expected return of\n20% and $5,000 in stock Q with an expected return of 10%. What is the investor's expected\nreturn on the portfolio?", "opts": ["30.0%.", "15.0%.", "15.8%."], "ans": "C", "expl": "Here we need to multiply the returns by the proportion that each stock represents in the\nportfolio then sum.\nStockReturnInvestedProportion of PortfolioReturn × Proportion\nP20%$7,0007/1220% × 7/12\nQ10%$5,0005/1210% × 5/12\nTotal$12,00015.83%\n(Module 3.1, LOS 3.a)"}, {"n": 23, "q": "A distribution that is more peaked than a normal distribution is termed:", "opts": ["leptokurtic.", "skewed.", "platykurtic."], "ans": "A", "expl": "A distribution that is more peaked than normal is leptokurtic. A leptokurtic distribution has\nfatter tails compared to a normal distribution. This means there is a greater chance of\nobserving extreme outcomes. Market returns are leptokurtic.\nA distribution that is flatter than a normal distribution is termed platykurtic.\n(Module 3.2, LOS 3.c)"}, {"n": 24, "q": "Annual Returns on ABC Mutual Fund\nYr 1Yr 2Yr 3Yr 4Yr 5Yr 6Yr 7Yr 8Yr 9Yr 10\n11.0%12.5%8.0%9.0%13.0%7.0%15.0%2.0%-16.5%11.0%\nAssuming a mean of 7.2%, what is the sample standard deviation of the returns for ABC\nMutual Fund for the period from Year 1 to Year 10?", "opts": ["7.8%.", "9.8%.", "9.1%."], "ans": "C", "expl": "21/21/2\nStandard deviation = [∑ (x – X) / (n – 1)] = (744.10 / 9)  = = 9.1%.\nii\n(Module 3.1, LOS 3.b)", "qhtml": "<p>Annual Returns on ABC Mutual Fund</p><table class=\"qtable\"><thead><tr><th>Yr 1</th><th>Yr 2</th><th>Yr 3</th><th>Yr 4</th><th>Yr 5</th><th>Yr 6</th><th>Yr 7</th><th>Yr 8</th><th>Yr 9</th><th>Yr 10</th></tr></thead><tbody><tr><td>11.0%</td><td>12.5%</td><td>8.0%</td><td>9.0%</td><td>13.0%</td><td>7.0%</td><td>15.0%</td><td>2.0%</td><td>−16.5%</td><td>11.0%</td></tr></tbody></table><p>Assuming a mean of 7.2%, what is the sample standard deviation of the returns for ABC Mutual Fund for the period from Year 1 to Year 10?</p>"}, {"n": 25, "q": "The owner of a company has recently decided to raise the salary of one employee, who was\nalready making the highest salary in the company, by 40%. Which of the following value(s) is\n(are) expected to be affected by this raise?", "opts": ["both mean and median.", "median only.", "mean only."], "ans": "C", "expl": "Mean is affected because it is the sum of all values / number of observations. Median is\nnot affected as it the midpoint between the top half of values and the bottom half of\nvalues.\n(Module 3.1, LOS 3.a)"}, {"n": 26, "q": "Consider the following set of stock returns: 12%, 23%, 27%, 10%, 7%, 20%,15%. The third\nquartile is:", "opts": ["20.0%.", "21.5%.", "23%."], "ans": "C", "expl": "Typesetting math: 100%\nThe third quartile is calculated as: L = (7 + 1) (75/100) = 6. When we order the\ny\nobservations in ascending order: 7%, 10%, 12%, 15%, 20%, 23%, 27%, \"23%\" is the sixth\nobservation from the left.\n(Module 3.1, LOS 3.a)"}, {"n": 27, "q": "An analyst takes a sample of yearly returns of aggressive growth funds resulting in the\nfollowing data set: 25, 15, 35, 45, and 55. The mean absolute deviation (MAD) of the data set\nis closest to:", "opts": ["16.", "12.", "20."], "ans": "B", "expl": "Calculate the mean:\n25+15+35+45+55\n=35\n5\nTo get the mean absolute deviation, sum the deviations around the mean (ignoring the\nsign), and divide by the number of observations:\n10+20+0+10+20\n=12\n5\n(Module 3.1, LOS 3.b)"}, {"n": 28, "q": "Returns for a portfolio over the last four years are shown below. Treating these returns as a\nsample, what is their coefficient of variation (CV)?\nYearReturn\n117.0%\n212.2%\n33.9%\n4–8.4%", "opts": ["1.56.", "0.55.", "1.80."], "ans": "C", "expl": "The coefficient of variation is equal to the standard deviation of returns divided by the\nmean return.\nMean return = (17.0% + 12.2% + 3.9% – 8.4%) / 4 = 6.175%\nYearReturn2\n(R – 6.175%)\n117.0%117.18\n212.2%36.30\n33.9%5.18\n4–8.4%212.43\nSum = 371.09\n0.5\nSample standard deviation = [371.09 / (4 – 1)] = 11.12%\nCoefficient of variation = 11.12% / 6.175% = 1.80\n(Module 3.1, LOS 3.b)", "qhtml": "<p>Returns for a portfolio over the last four years are shown below. Treating these returns as a sample, what is their coefficient of variation (CV)?</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>1</td><td>17.0%</td></tr><tr><td>2</td><td>12.2%</td></tr><tr><td>3</td><td>3.9%</td></tr><tr><td>4</td><td>−8.4%</td></tr></tbody></table>"}, {"n": 29, "q": "A portfolio's monthly returns follow a distribution with a kurtosis measure of 4.2. Relative to\na portfolio with normally distributed returns, this portfolio has a:", "opts": ["lower probability of extreme upside returns and higher chance of extreme downside returns.", "higher probability of extreme upside returns and lower chance of extreme downside returns.", "higher probability of extreme upside returns and higher chance of extreme downside returns."], "ans": "C", "expl": "A leptokurtic distribution (a distribution with kurtosis measure greater than 3) is more\npeaked in the middle (data more clustered around the mean) and has fatter tails at the\nextremes (greater probability of outliers).\n(Module 3.2, LOS 3.c)"}, {"n": 30, "q": "For the investments shown in the table below:\nInvestmentReturn (%)\nA12\nB14\nC9\nD13\nE7\nF8\nG12\nWhich of the following statements is most accurate?", "opts": ["The mean is equal to the mode.", "The mean is equal to the median.", "The median is equal to the mode."], "ans": "C", "expl": "The median is the mid-point or central number of returns arranged from highest to lowest\nor lowest to highest. In this case: 7, 8, 9, 12, 12, 13, 14. The median return is 12%. The\nmode is the return that occurs most frequently. In this case, 12% is also the mode. The\nmean is 75 / 7 = 10.71%.\n(Module 3.1, LOS 3.a)", "qhtml": "<p>For the investments shown in the table below:</p><table class=\"qtable\"><thead><tr><th>Investment</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>12</td></tr><tr><td>B</td><td>14</td></tr><tr><td>C</td><td>9</td></tr><tr><td>D</td><td>13</td></tr><tr><td>E</td><td>7</td></tr><tr><td>F</td><td>8</td></tr><tr><td>G</td><td>12</td></tr></tbody></table><p>Which of the following statements is most accurate?</p>"}, {"n": 31, "q": "The annual returns on 5 portfolio investments for the last year are shown in the following\ntable. What is the return on the portfolio and the geometric mean of the returns on the\nportfolio investments?\nInvestmentInvested AmountReturn (%)\nA10,00012\nB10,00014\nC10,0009\nD10,00013\nE10,0007", "opts": ["11.00; 10.78.", "11.00; 10.97.", "11.64; 10.97."], "ans": "B", "expl": "Arithmetic Mean: 12 + 14 + 9 + 13 + 7 = 55; 55 / 5 = 11\n1/5\nGeometric Mean: [(1.12 × 1.14 × 1.09 × 1.13 × 1.07)] – 1 = 10.97%\n(Module 3.1, LOS 3.a)", "qhtml": "<p>The annual returns on 5 portfolio investments for the last year are shown in the following table. What is the return on the portfolio and the geometric mean of the returns on the portfolio investments?</p><table class=\"qtable\"><thead><tr><th>Investment</th><th>Invested Amount</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>$10,000</td><td>12</td></tr><tr><td>B</td><td>$10,000</td><td>14</td></tr><tr><td>C</td><td>$10,000</td><td>9</td></tr><tr><td>D</td><td>$10,000</td><td>13</td></tr><tr><td>E</td><td>$10,000</td><td>7</td></tr></tbody></table>"}, {"n": 32, "q": "A distribution of returns that has a greater percentage of small deviations from the mean\nand a greater percentage of large deviations from the mean compared to a normal\ndistribution:", "opts": ["has negative excess kurtosis.", "has positive excess kurtosis.", "is positively skewed."], "ans": "B", "expl": "A distribution that has a greater percentage of small deviations from the mean and a\ngreater percentage of large deviations from the mean will be leptokurtic and will exhibit\npositive excess kurtosis. The distribution will be taller (more peaked) with fatter tails than\na normal distribution.\n(Module 3.2, LOS 3.c)"}, {"n": 33, "q": "A company reports its past six years' earnings growth at 10%, 14%, 12%, 10%, –10%, and\n12%. The company's average compound annual growth rate of earnings is closest to:", "opts": ["8.5%.", "7.7%.", "8.0%."], "ans": "B", "expl": "1/6\nGeometric mean = [(1.10)(1.14)(1.12)(1.10)(0.90)(1.12)] − 1 = 0.0766, or 7.66% (Module\n3.1, LOS 3.a)"}, {"n": 34, "q": "A 5% trimmed mean ignores the:", "opts": ["highest and lowest 5% of observations.", "lowest 5% of observations.", "highest and lowest 2.5% of observations."], "ans": "C", "expl": "A 5% trimmed means discards the highest 2.5% and lowest 2.5% of observations and is the\narithmetic average of the remaining 95% of observations.\n(Module 3.1, LOS 3.a)"}, {"n": 35, "q": "Given the following set of data:\n17, 3, 13 , 3, 5, 9, 8\nThe value 8 is most accurately described as the:", "opts": ["mean.", "median.", "mode."], "ans": "B", "expl": "Median = middle of distribution = 8 (middle number);\nMean = (3 + 3 + 5 + 8 + 9 + 13 + 17) / 7 = 8.28;\nMode = most frequent observation = 3.\n(Module 3.1, LOS 3.a)"}, {"n": 36, "q": "The correlation coefficient between the return on an investment and the rate of economic\ngrowth is –0.065. An analyst should most likely interpret this correlation coefficient as\nindicating that returns on this investment are:", "opts": ["unrelated to economic growth.", "not related linearly to economic growth.", "negatively related to economic growth."], "ans": "B", "expl": "A correlation coefficient near zero indicates that two variables exhibit no linear\nrelationship. This does not necessarily mean that the variables are unrelated because they\nmight exhibit a nonlinear relationship.\n(Module 3.2, LOS 3.d)"}, {"n": 37, "q": "Which of the following statements concerning a distribution with positive skewness and\npositive excess kurtosis is least accurate?", "opts": ["The mean will be greater than the mode.", "It has a lower percentage of small deviations from the mean than a normal distribution.", "It has fatter tails than a normal distribution."], "ans": "B", "expl": "A distribution with positive excess kurtosis has a higher percentage of small deviations\nfrom the mean than normal. So it is more \"peaked\" than a normal distribution. A\ndistribution with positive skew has a mean > mode.\n(Module 3.2, LOS 3.c)"}, {"n": 38, "q": "The mean monthly return on a sample of small stocks is 4.56% with a standard deviation of\n3.56%. If the risk-free rate is 1%, what is the coefficient of variation?", "opts": ["1.28.", "1.00.", "0.78."], "ans": "C", "expl": "The coefficient of variation expresses how much dispersion exists relative to the mean of a\ndistribution. It is a measure of risk per unit of mean return.\nCV = s / mean. 3.56 / 4.56 = 0.781, or 78%.\n(Module 3.1, LOS 3.b)"}, {"n": 39, "q": "If an analyst concludes that the distribution of a large sample of returns is positively skewed,\nwhich of the following relationships involving the mean, median, and mode is most likely?", "opts": ["Mean > median < mode.", "Mean < median < mode.", "Mean > median > mode."], "ans": "C", "expl": "Typesetting math: 100%\nFor the positively skewed distribution, the mode is less than the median, which is less than\nthe mean. (Module 3.2, LOS 3.c)"}, {"n": 40, "q": "An analyst calculates a winsorized mean return of 3.2% for an investment fund. This\nmeasure most likely:", "opts": ["replaces outliers with less extreme returns.", "equally weights all returns.", "captures the compounded growth rate of the fund."], "ans": "A", "expl": "The winsorized mean is a technique for dealing with outliers. For example, a 90%\nwinsorized mean replaces the lowest 5% of values with the fifth percentile, and replaces\nthe highest 5% of values with the 95th percentile. The arithmetic mean weights all\nobservations equally. The geometric mean captures the compounded growth rate of the\nfund.\n(Module 3.1, LOS 3.a)"}, {"n": 41, "q": "If the historical mean return on an investment is 2.0%, the standard deviation is 8.8%, and\nthe risk free rate is 0.5%, what is the coefficient of variation (CV)?", "opts": ["0.23.", "0.17.", "4.40."], "ans": "C", "expl": "The CV = the standard deviation of returns / mean return\n= 8.8% / 2.0% = 4.4.\nThe CV is a measure of risk per unit of mean return. When ranking portfolios based on the\nCV, a lower value is preferred to higher.\n(Module 3.1, LOS 3.b)"}, {"n": 42, "q": "For the last four years, the returns for XYZ Corporation's stock have been 10.4%, 8.1%, 3.2%,\nand 15.0%. The equivalent compound annual rate is:", "opts": ["8.9%.", "9.2%.", "9.1%."], "ans": "C", "expl": "0.25\n(1.104 × 1.081 × 1.032 × 1.15) – 1 = 9.1%\n(Module 1.2, LOS 1.c)"}, {"n": 43, "q": "An analyst compiles the returns on Fund Q over the last four years:\nYearReturn\n14%\n23%\n32%\n430%\nWhich of the following will result in the lowest measure of the mean return?", "opts": ["The arithmetic mean.", "The geometric mean.", "The harmonic mean."], "ans": "C", "expl": "4\nHarmonic mean=−1=0.0864=8.64%\n1111\n+++\n1.041.031.021.30\n1\nGeometric mean=[(1.04)(1.03)(1.02)(1.30)]−1=0.0917=9.17%4\n4%+3%+2%+30%\nArithmetic mean==9.75%\n4\nTypesetting math: 100%\n(Module 3.1, LOS 3.a)", "qhtml": "<p>An analyst compiles the returns on Fund Q over the last four years:</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>1</td><td>4%</td></tr><tr><td>2</td><td>3%</td></tr><tr><td>3</td><td>2%</td></tr><tr><td>4</td><td>30%</td></tr></tbody></table><p>Which of the following will result in the lowest measure of the mean return?</p>"}, {"n": 44, "q": "Which of the following statements about kurtosis is least accurate? Kurtosis:", "opts": ["measures the peakedness of a distribution reflecting a greater or lesser concentration of returns around the mean.", "describes the degree to which a distribution is not symmetric about its mean.", "is used to reflect the probability of extreme outcomes for a return distribution."], "ans": "B", "expl": "The degree to which a distribution is not symmetric about its mean is measured by\nskewness. Excess kurtosis which is measured relative to a normal distribution, indicates\nthe peakedness of a distribution, and also reflects the probability of extreme outcomes.\n(Module 3.2, LOS 3.c)"}, {"n": 45, "q": "A distribution with a mode of 10 and a range of 2 to 25 would most likely be:", "opts": ["negatively skewed.", "positively skewed.", "normally distributed."], "ans": "B", "expl": "The distance to the left from the mode to the beginning of the range is 8. The distance to\nthe right from the mode to the end of the range is 15. Therefore, the distribution is\nskewed to the right, which means that it is positively skewed.\n(Module 3.2, LOS 3.c)"}, {"n": 46, "q": "In a negatively skewed distribution, what is the order (from lowest value to highest) for the\ndistribution's mode, mean, and median values?", "opts": ["Mode, mean, median.", "Median, mode, mean.", "Mean, median, mode."], "ans": "C", "expl": "In a negatively skewed distribution, the mean is less than the median, which is less than\nthe mode.\n(Module 3.2, LOS 3.c)"}, {"n": 47, "q": "Find the respective mean and the mean absolute deviation (MAD) of a series of stock market\nreturns.\nYear 114%\nYear 220%\nYear 324%\nYear 422%", "opts": ["20%; 3%.", "20%; 12%.", "22%; 3%."], "ans": "A", "expl": "(14 + 20 + 24 + 22) / 4 = 20 (mean)\nTake the absolute value of the differences and divide by n:\nMAD = [|14 – 20| + |20 – 20| + |24 – 20| + |22 – 20|] / 4 = 3%.\n(Module 3.1, LOS 3.b)"}, {"n": 48, "q": "Over the last five years, an investment fund's monthly returns were relatively stable apart\nfrom last year, where two extremely high returns were recorded. If the arithmetic mean for\nthe fund's monthly returns over the period is 6.7%, a trimmed or winsorized mean return is\nmost likely to be:", "opts": ["lower than the arithmetic mean.", "equal to the arithmetic mean.", "higher than the arithmetic mean."], "ans": "A", "expl": "A trimmed mean discards a percentage of the highest and lowest observations, while a\nwinsorized mean replaces a percentage of the highest and lowest observations with less\nextreme values. In this case the arithmetic mean would be influenced by the two highly\npositive returns, while a trimmed or winsorized mean would adjust for them and would\nlikely be lower than the arithmetic mean.\n(Module 3.1, LOS 3.a)"}, {"n": 49, "q": "Given the following box-and-whisker plot:\nA box plot\ndisplaying data distribution with a median of 3.1%, an interquartile range between 0.5% and\n5.2%, and whiskers extending from -3.7% to 14.4%, indicating the spread and potential\noutliers in the dataset.\nThe interquartile range is:", "opts": ["3.1% to 5.2%.", "0.5% to 5.2%.", "0.5% to 3.1%."], "ans": "B", "expl": "The interquartile range is from the first quartile (25th percentile) to the third quartile (75th\npercentile) and is represented as the box in a box-and-whisker plot. The horizontal line\nwithin the box represents the median (50th percentile).\n(Module 3.1, LOS 3.a)"}, {"n": 50, "q": "For a unimodal distribution with negative skewness:", "opts": ["the median is greater than the mean.", "the mean is greater than the mode.", "the mode is less than the median."], "ans": "A", "expl": "For a distribution with negative skewness, mean < median < mode.\n(Module 3.2, LOS 3.c)"}, {"n": 51, "q": "Twenty Level I CFA candidates in a study group took a practice exam and want to determine\nthe distribution of their scores. When they grade their exams they discover that one of them\nskipped an ethics question and subsequently filled in the rest of his answers in the wrong\nplaces, leaving him with a much lower score than the rest of the group. If they include this\ncandidate's score, their distribution will most likely:", "opts": ["be positively skewed.", "have a mean that is less than its median.", "have a mode that is less than its median."], "ans": "B", "expl": "With the low outlier included, the distribution will be negatively skewed. For a negatively\nskewed distribution, the mean is less than the median, which is less than the mode.\n(Module 3.2, LOS 3.c)"}, {"n": 52, "q": "The correlation between two variables is –0.74. The most appropriate way to interpret this\ncorrelation is that:", "opts": ["there is unlikely to be a strong linear relationship between the two variables.", "the two variables have a negative linear association.", "if one of the variables increases, there is a 74% probability that the other variable will decrease."], "ans": "B", "expl": "A correlation coefficient of –0.74 suggests a relatively strong negative linear association\nbetween the two variables. We cannot interpret the correlation coefficient directly as a\nmeasure of the probability that the two variables will change in opposite directions.\n(Module 3.2, LOS 3.d)"}, {"n": 53, "q": "What does it mean to say that an observation is at the sixty-fifth percentile?", "opts": ["65% of all the observations are below that observation.", "65% of all the observations are above that observation.", "The observation falls within the 65th of 100 intervals."], "ans": "A", "expl": "If the observation falls at the sixty-fifth percentile, 65% of all the observations fall below\nthat observation.\n(Module 3.1, LOS 3.a)"}, {"n": 54, "q": "An analyst gathers the following data about the mean monthly returns of three securities:\nSecurityMean Monthly ReturnStandard Deviation\nX0.90.7\nY1.24.7\nZ1.55.2\nWhich security has the highest level of relative risk as measured by the coefficient of\nvariation?", "opts": ["Y.", "Z.", "X."], "ans": "A", "expl": "The coefficient of variation, CV = standard deviation / arithmetic mean, is a common\nmeasure of relative dispersion (risk). CV = 0.7 / 0.9 = 0.78; CV = 4.7 / 1.2 = 3.92; and CV =\nXYZ\n5.2 / 1.5 = 3.47. Because a higher CV means higher relative risk, Security Y has the highest\nrelative risk.\n(Module 3.1, LOS 3.b)", "qhtml": "<p>An analyst gathers the following data about the mean monthly returns of three securities:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Mean Monthly Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>X</td><td>0.9</td><td>0.7</td></tr><tr><td>Y</td><td>1.2</td><td>4.7</td></tr><tr><td>Z</td><td>1.5</td><td>5.2</td></tr></tbody></table><p>Which security has the highest level of relative risk as measured by the coefficient of variation?</p>"}, {"n": 55, "q": "What is the coefficient of variation for a distribution with a mean of 10 and a variance of 4?", "opts": ["20%.", "25%.", "40%."], "ans": "A", "expl": "Coefficient of variation, CV = standard deviation / mean. The standard deviation is the\n½\nsquare root of the variance, or 4 = 2. So, CV = 2 / 10 = 20%.\n(Module 3.1, LOS 3.b)"}, {"n": 56, "q": "For the past three years, Acme Corp. has generated the following sample returns on equity\n(ROE): 4%, 10%, and 1%. What is the sample variance of the ROE over the last three years?", "opts": ["21.0%.", "4.6%.", "2 21.0(%)."], "ans": "C", "expl": "2222\n[(4 – 5) + (10 – 5) + (1 – 5)] / (3 – 1) = 21(%).\n(Module 3.1, LOS 3.b)"}, {"n": 57, "q": "Cameron Ryan wants to make an offer on the condominium he is renting. He takes a sample\nof prices of condominiums in his development that closed in the last five months. Sample\nprices are as follows (amounts are in thousands of dollars): $125, $175, $150, $155 and\n$135. The sample standard deviation is closest to:", "opts": ["19.24.", "38.47.", "370.00."], "ans": "A", "expl": "Calculations are as follows:\n1. Sample mean = (125 + 175 + 150 + 155 + 135) / 5 = 148\n2222\n2. Sample Variance = [(125 – 148) + (175 – 148) + (150 – 148) + (155 – 148) + (135 –\n2\n148)] / (5 – 1) = 1,480 / 4 = 370\n1/2\n3. Sample Standard Deviation = 370 = 19.24%.\n(Module 3.1, LOS 3.b)"}, {"n": 58, "q": "Given the following annual returns, what are the geometric and arithmetic mean returns,\nrespectively?\n20022003200420052006\n15%2%5%-7%0%", "opts": ["1.45%; 3.00%.", "2.75%; 3.00%.", "2.75%; 5.80%."], "ans": "B", "expl": "1/51/5\nGeometric Mean: (1.15 × 1.02 × 1.05 × 0.93 × 1.0) – 1 = 1.1454 – 1 = 2.75%\nArithmetic Mean: (15% + 2% + 5% – 7% + 0%) / 5 = 3.00%\n(Module 3.1, LOS 3.a)", "qhtml": "<p>Given the following annual returns, what are the geometric and arithmetic mean returns, respectively?</p><table class=\"qtable\"><thead><tr><th>2002</th><th>2003</th><th>2004</th><th>2005</th><th>2006</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>−7%</td><td>0%</td></tr></tbody></table>"}, {"n": 59, "q": "Which of the following statements concerning kurtosis is most accurate?", "opts": ["A distribution with kurtosis of +2 has fatter tails than a normal distribution.", "A leptokurtic distribution has excess kurtosis less than zero.", "A leptokurtic distribution has fatter tails than a normal distribution."], "ans": "C", "expl": "A leptokurtic distribution is more peaked than normal and has fatter tails. However, the\nexcess kurtosis is greater than zero.\n(Module 3.2, LOS 3.c)"}];
const CFG = {"title": "Statistical Measures of Asset Returns", "subtitle": "CFA · Quantitative Methods · Reading 3 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
