<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  .expl-rich{white-space:normal}
  .expl-rich p{margin:.55em 0}
  .expl-rich p:first-child{margin-top:0}
  .expl-rich p:last-child{margin-bottom:0}
  .expl-rich .los{display:block;margin-top:10px;color:var(--muted);font-size:13px}
  .expl-rich .katex{font-size:1.04em}
  .expl-rich .kd{margin:6px 0;overflow-x:auto;overflow-y:hidden}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">

<script>
const DATA = [{"n":1,"q":"Given the following annual returns, what is the mean absolute deviation?\n20002001200220032004\n15%2%5%-7%0%","opts":["0.0%.","3.0%.","5.6%."],"ans":"C","expl":"The độ lệch tuyệt đối trung bình được tìm thấy bằng cách lấy giá trị trung bình của các giá trị tuyệt đối của\nđộ lệch so với giá trị trung bình. ( |15 – 3| + |2 – 3| + |5 – 3| + |-7 – 3| + |0 – 3|) / 5 = 5,60%\n(Mô-đun 3.1, LOS 3.b)","qhtml":"<p>Given the following annual returns, what is the mean absolute deviation?</p><table class=\"qtable\"><thead><tr><th>2000</th><th>2001</th><th>2002</th><th>2003</th><th>2004</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>−7%</td><td>0%</td></tr></tbody></table>"},{"n":2,"q":"If Stock X's expected return is 30% and its expected standard deviation is 5%, Stock X's\nexpected coefficient of variation is:","opts":["0.167.","1.20.","6.0."],"ans":"A","expl":"Hệ số biến thiên là độ lệch chuẩn chia cho giá trị trung bình: 5/30 = 0,167.\n(Mô-đun 3.1, LOS 3.b)"},{"n":3,"q":"In a positively skewed distribution, what is the order (from lowest value to highest) for the\ndistribution's mode, mean, and median values?","opts":["Mean, median, mode.","Mode, median, mean.","Mode, mean, median."],"ans":"B","expl":"Trong phân bố có độ lệch dương, chế độ nhỏ hơn trung vị, nhỏ hơn\ngiá trị trung bình.\n(Mô-đun 3.2, LOS 3.c)"},{"n":4,"q":"Michael Philizaire decides to calculate the geometric average of the\nappreciation/deprecation of his home over the last five years. Using comparable sales and\nmarket data he obtains from a local real estate appraiser, Philizaire calculates the year-to-\nyear percentage change in the value of his home as follows: 20, 15, 0, –5, –5. The geometric\nreturn is closest to:","opts":["11.60%.","0.00%.","4.49%."],"ans":"C","expl":"Trả về hình học được tính như sau:\n1/5\n[(1 + 0,20) × (1 + 0,15) × (1 + 0,0) (1 – 0,05) (1 – 0,05)] – 1,\n0,2\nhoặc [1,20 × 1,15 × 1,0 × 0,95 × 0,95] – 1 = 0,449 hoặc 4,49%.\n(Mô-đun 3.1, LOS 3.a)","explhtml":"<p>Lợi nhuận hình học là:</p><div class=\"kd\">$$\\left[(1.20)(1.15)(1.00)(0.95)(0.95)\\right]^{1/5}-1=0.0449=4.49\\%$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.a)</span>"},{"n":5,"q":"An investor has a portfolio with 10% cash, 30% bonds, and 60% stock. If last year's return on\ncash was 2.0%, the return on bonds was 9.5%, and the return on stock was 25%, what was\nthe return on the investor's portfolio?","opts":["12.17%.","18.05%.","11.77%."],"ans":"B","expl":"Tìm giá trị trung bình có trọng số của kết quả trả về. (0,10 × 0,02) + (0,30 × 0,095) + (0,60 × 0,25) =\n18,05%\nAssetWeightReturnWeight × Return\nTiền mặt10%2%10% × 2% = 0,2%\nTrái phiếu30%9,5%30% × 9,5% = 2,85%\nStock60%25%60% × 25% = 15%\nLợi nhuận trung bình có trọng số\n18,05%\n∑ Trọng lượng × Xác suất\n(Mô-đun 3.1, LOS 3.a)"},{"n":6,"q":"A portfolio is equally invested in Stock A, with an expected return of 6%, and Stock B, with an\nexpected return of 10%, and a risk-free asset with a return of 5%. The expected return on\nthe portfolio is:","opts":["7.0%.","7.4%.","8.0%."],"ans":"A","expl":"(0,333)(0,06) + (0,333)(0,10) + 0,333(0,05) = 0,07\n(Mô-đun 3.1, LOS 3.a)"},{"n":7,"q":"A sample of returns for four randomly selected assets in a portfolio is shown below:\nAssetReturn (%)\nA1.3\nB1.4\nC2.2\nD3.4\nWhat is the sample standard deviation of asset returns?","opts":["0.88%.","0.97%.","1.13%."],"ans":"B","expl":"Độ lệch chuẩn mẫu bằng căn bậc hai của tổng bình phương của vị trí\ntrả về ít hơn lợi nhuận trung bình, chia cho số lượng quan sát trong\nmẫu trừ đi một.\n2\nPositionReturn (%)\n(Return – Mean)\nA1.30.60\nB1.40.46\nC2.20.02\nD3.41.76\nMean8.3/4 = 2.075Sum = 2.83\n0.5\nStd. Dev. = [2,83 / (4 – 1)] = 0,97\n(Mô-đun 3.1, LOS 3.b)","qhtml":"<p>A sample of returns for four randomly selected assets in a portfolio is shown below:</p><table class=\"qtable\"><thead><tr><th>Asset</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>1.3</td></tr><tr><td>B</td><td>1.4</td></tr><tr><td>C</td><td>2.2</td></tr><tr><td>D</td><td>3.4</td></tr></tbody></table><p>What is the sample standard deviation of asset returns?</p>","explhtml":"<p>Độ lệch chuẩn của mẫu bằng căn bậc hai của tổng bình phương độ lệch so với giá trị trung bình, chia cho\\((n-1)\\). Với lợi nhuận 1,3, 1,4, 2,2 và 3,4, giá trị trung bình là\\(8.3/4=2.075\\), và độ lệch bình phương\\((\\text{Return}-\\text{Mean})^2\\)là 0,60, 0,46, 0,02 và 1,76, tổng bằng 2,83:</p><div class=\"kd\">$$s=\\left[\\dfrac{2.83}{4-1}\\right]^{1/2}=0.97$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":8,"q":"What is the compound annual growth rate for stock A which has annual returns of 5.60%,\n22.67%, and -5.23%?","opts":["6.00%.","7.08%.","8.72%."],"ans":"B","expl":"1/3\nTốc độ tăng trưởng kép hàng năm là giá trị trung bình hình học. (1,056 × 1,2267 × 0,9477) – 1 =\n7,08%\n(Mô-đun 3.1, LOS 3.a)"},{"n":9,"q":"Consider the following statements about the geometric and arithmetic means as measures\nof central tendency. Which statement is least accurate?","opts":["The geometric mean may be used to estimate the average return over a one-period time horizon because it is the average of one-period returns.","The difference between the geometric mean and the arithmetic mean increases with an increase in variability between period-to-period observations.","The geometric mean calculates the rate of return that would have to be earned each year to match the actual, cumulative investment performance."],"ans":"A","expl":"Trung bình số học có thể được sử dụng để ước tính lợi nhuận trung bình trong khoảng thời gian một kỳ\nvì đây là mức trung bình của lợi nhuận một kỳ. Cả hai câu lệnh còn lại đều\ntrue.\n(Mô-đun 3.1, LOS 3.a)"},{"n":10,"q":"The following data points are observed returns.\n4.2%, 6.8%, 7.0%, 10.9%, 11.6%, 14.4%, 17.0%, 19.0%, 22.5%\nWhat return lies at the 70th percentile (70% of returns lie below this return)?","opts":["17.0%.","14.4%.","19.0%."],"ans":"A","expl":"Với 9 quan sát, vị trí của phân vị thứ 70 là (9 + 1)(70 / 100) = 7. Quan sát\nthứ bảy trong thứ tự tăng dần là 17,0%.\n(Mô-đun 3.1, LOS 3.a)"},{"n":11,"q":"The following annualized monthly return measures have been calculated for an investment\nbased on its performance over the last 72 months.\nArithmetic mean6.8%\nGeometric mean6.0%\n90% Winsorized mean5.5%\nIf for one month in the period the return was extremely high, which measure best reflects\nthe central tendency of the investment's returns?","opts":["Geometric mean.","Winsorized mean.","Arithmetic mean."],"ans":"B","expl":"Trung bình chiến thắng là một kỹ thuật để loại bỏ làm biến dạng tác động của các giá trị ngoại lệ bằng cách\nthay thế chúng bằng các giá trị ít cực đoan hơn. Phương tiện số học và hình học dựa trên\ndựa trên tất cả các quan sát và do đó bao gồm tác động của các giá trị ngoại lệ.\n(Mô-đun 3.1, LOS 3.a)"},{"n":12,"q":"The respective arithmetic mean and geometric mean returns of the following series of stock\nmarket returns are:\nYear 114%\nYear 26%\nYear 3−5%\nYear 420%","opts":["8.75%; 8.34%.","8.75%; 8.62%.","8.90%; 8.62%."],"ans":"A","expl":"(14 + 6 + (-5) + 20) / 4 = 8,75.\n0,25\n((1,14 × 1,06 × 0,95 × 1,20) – 1 = 8,34%.\n(Mô-đun 3.1, LOS 3.a)","explhtml":"<p>Ý nghĩa số học:</p><div class=\"kd\">$$\\dfrac{14+6+(-5)+20}{4}=8.75\\%$$</div><p>Ý nghĩa hình học:</p><div class=\"kd\">$$(1.14\\times1.06\\times0.95\\times1.20)^{0.25}-1=8.34\\%$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.a)</span>"},{"n":13,"q":"A distribution that has positive excess kurtosis is:","opts":["more skewed than a normal distribution.","less peaked than a normal distribution.","more peaked than a normal distribution."],"ans":"C","expl":"Phân phối có độ nhọn vượt quá dương sẽ đạt đỉnh cao hơn và có phần đuôi dày hơn so với phân phối chuẩn\nbình thường.\n(Mô-đun 3.2, LOS 3.c)"},{"n":14,"q":"The mean monthly return on a security is 0.42% with a standard deviation of 0.25%. What is\nthe coefficient of variation?","opts":["168%.","60%.","84%."],"ans":"B","expl":"Hệ số biến thiên biểu thị mức độ phân tán tồn tại so với giá trị trung bình của a\nphân phối và được tìm thấy bởi CV = s / trung bình, hoặc 0,25 / 0,42 = 0,595 hoặc 60%.\n(Mô-đun 3.1, LOS 3.b)"},{"n":15,"q":"Which of the following statements concerning skewness is least accurate? A distribution\nwith:","opts":["skew equal to 1 is not symmetrical.","negative skewness has a large number of outliers on its left side.","positive skewness has a long left tail."],"ans":"C","expl":"Phân phối có độ lệch dương có đuôi phải dài.\n(Mô-đun 3.2, LOS 3.c)"},{"n":16,"q":"Assume that the following returns are a sample of annual returns for firms in the clothing\nindustry.\nFirm 1Firm 2Firm 3Firm 4Firm 5\n15%2%5%(7%)0%\nThe sample standard deviation is closest to:","opts":["5.7.","7.2.","8.0."],"ans":"C","expl":"Phương sai mẫu được tìm bằng cách lấy tổng của tất cả các độ lệch bình phương từ giá trị trung bình\nvà chia cho (n – 1).\n22222\n[(15 – 3) + (2 – 3) + (5 – 3) + (-7 – 3) + (0 – 3)] / (5 – 1) = 64.5\nĐộ lệch chuẩn mẫu được tìm bằng cách lấy căn bậc hai của phương sai mẫu.\n√64.5 = 8.03\n(Module 3.1, LOS 3.b)","qhtml":"<p>Assume that the following returns are a sample of annual returns for firms in the clothing industry.</p><table class=\"qtable\"><thead><tr><th>Firm 1</th><th>Firm 2</th><th>Firm 3</th><th>Firm 4</th><th>Firm 5</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>(7%)</td><td>0%</td></tr></tbody></table><p>The sample standard deviation is closest to:</p>"},{"n":17,"q":"Trina Romel, mutual fund manager, is taking over a poor-performing fund from a colleague.\nRomel wants to calculate the return on the portfolio. Over the last five years, the fund's\nannual percentage returns were: 25, 15, 12, -8, and –14.\nDetermine if the geometric return of the fund will be less than or greater than the arithmetic\nreturn and calculate the fund's geometric return:\nGeometric compared to\nGeometric Return\nArithmetic","opts":["12.86%greater than","4.96%greater than","4.96% less than"],"ans":"C","expl":"Trả về hình học được tính như sau:\n1/5\n[(1 + 0,25)(1 + 0,15)(1 + 0,12)(1 - 0,08)(1 – 0,14)] – 1,\n0,2\nhoặc [1,25 × 1,15 × 1,12 × 0,92 × 0,86] – 1 = 0,4960 hoặc 4,96%.\nKết quả hình học sẽ luôn nhỏ hơn hoặc bằng kết quả số học. Trong trường hợp này\nkết quả số học là 6%.\n(Mô-đun 3.1, LOS 3.a)","explhtml":"<p>Lợi nhuận hình học là:</p><div class=\"kd\">$$\\left[(1.25)(1.15)(1.12)(0.92)(0.86)\\right]^{1/5}-1=0.0496=4.96\\%$$</div><p>Lợi nhuận hình học luôn nhỏ hơn hoặc bằng lợi nhuận số học; ở đây lợi nhuận số học là 6%.</p><span class=\"los\">(Học ​​phần 3.1, LOS 3.a)</span>"},{"n":18,"q":"For a positively skewed distribution, the median is greater than:","opts":["both the mode and the mean.","the mean, but less than the mode.","the mode, but less than the mean."],"ans":"C","expl":"Đối với phân phối lệch dương, giá trị trung bình lớn hơn giá trị trung bình trung vị và trung vị\nlớn hơn chế độ. Thứ tự của chúng đảo ngược đối với phân phối có độ lệch âm.\n(Mô-đun 3.2, LOS 3.c)"},{"n":19,"q":"What are the median and the third quintile of the following data points, respectively?\n9.2%, 10.1%, 11.5%, 11.9%, 12.2%, 12.8%, 13.1%, 13.6%, 13.9%, 14.2%, 14.8%,\n14.9%, 15.4%","opts":["13.1%; 13.7%.","13.1%; 13.6%.","12.8%; 13.6%."],"ans":"A","expl":"Trung vị là điểm giữa của dữ liệu điểm. Trong trường hợp này có 13 điểm dữ liệu và\nth\nđiểm giữa là số hạng thứ 7.\nCông thức xác định lượng tử là: L = (n + 1)(y) / (100). Ở đây, chúng tôi đang tìm kiếm\ny\nnhóm thứ ba (60% số quan sát nằm bên dưới) và công thức là: (14)(60) / (100) = 8,4.\nthth\nNhóm thứ ba nằm trong khoảng từ 13,6% đến 13,9%, số 8 và 9 từ left.\nVì L không phải là số nguyên nên chúng tôi nội suy thành: 0,136 + (0,40)(0,139 – 0,136) = 0,1372 hoặc\n13,7%.\n(Mô-đun 3.1, LOS 3.a)"},{"n":20,"q":"An analyst observes the following four annual returns: R = +10%, R = –15%, R = 0%, and R\n1234\n= +5%. The average compound annual rate over the four years is closest to:","opts":["–0.5%.","0.0%.","–5.0%."],"ans":"A","expl":"0,25\nG = [(1,10)(0,85)(1,00)(1,05)] – 1\n0,25\nG = (0,98175) – 1 = 0,9954 – 1 = –0,00459 ≈ –0,5%\nLưu ý: Lấy một số lũy thừa 0,25 cũng giống như lấy căn bậc 4 của số\n. (Mô-đun 3.1, LOS 3.a)","explhtml":"<div class=\"kd\">$$G=\\left[(1.10)(0.85)(1.00)(1.05)\\right]^{0.25}-1=(0.98175)^{0.25}-1=0.9954-1=-0.00459\\approx-0.5\\%$$</div><p>Lưu ý: nâng một số lên lũy thừa 0,25 cũng giống như lấy căn bậc 4 của nó.</p><span class=\"los\">(Học ​​phần 3.1, LOS 3.a)</span>"},{"n":21,"q":"If a distribution is positively skewed, then generally:","opts":["mean < median < mode.","mean > median > mode.","mean > median < mode."],"ans":"B","expl":"Khi phân phối bị lệch dương thì đuôi bên phải dài hơn bình thường tới\ncác ngoại lệ. Giá trị trung bình sẽ vượt quá giá trị trung bình và giá trị trung bình nhìn chung sẽ vượt quá chế độ\nvì các giá trị ngoại lệ lớn rơi về phía ngoài cùng bên phải của phân phối có thể\nảnh hưởng đáng kể đến giá trị trung bình.\n(Mô-đun 3.2, LOS 3.c)"},{"n":22,"q":"An investor has a $12,000 portfolio consisting of $7,000 in stock P with an expected return of\n20% and $5,000 in stock Q with an expected return of 10%. What is the investor's expected\nreturn on the portfolio?","opts":["30.0%.","15.0%.","15.8%."],"ans":"C","expl":"Ở đây chúng ta cần nhân lợi nhuận với tỷ lệ mà mỗi cổ phiếu đại diện trong\ndanh mục đầu tư rồi tính tổng.\nStockReturnInvestedProportion of Danh mục đầu tư Lợi nhuận × Tỷ lệ\nP20%$7.0007/1220% × 7/12\nQ10%$5.0005/1210% × 5/12\nTổng cộng $12.00015,83%\n(Mô-đun 3.1, LOS 3.a)"},{"n":23,"q":"A distribution that is more peaked than a normal distribution is termed:","opts":["leptokurtic.","skewed.","platykurtic."],"ans":"A","expl":"Phân phối đạt đỉnh cao hơn bình thường là leptokurtic. Phân phối leptokurtic có\nđuôi béo hơn so với phân phối bình thường. Điều này có nghĩa là có nhiều khả năng\nquan sát được những kết quả cực đoan hơn. Lợi nhuận thị trường mang tính leptokurtic.\nMột phân phối phẳng hơn phân phối bình thường được gọi là platykurtic.\n(Mô-đun 3.2, LOS 3.c)"},{"n":24,"q":"Annual Returns on ABC Mutual Fund\nYr 1Yr 2Yr 3Yr 4Yr 5Yr 6Yr 7Yr 8Yr 9Yr 10\n11.0%12.5%8.0%9.0%13.0%7.0%15.0%2.0%-16.5%11.0%\nAssuming a mean of 7.2%, what is the sample standard deviation of the returns for ABC\nMutual Fund for the period from Year 1 to Year 10?","opts":["7.8%.","9.8%.","9.1%."],"ans":"C","expl":"21/21/2\nĐộ lệch chuẩn = [∑ (x – X) / (n – 1)] = (744.10 / 9) = = 9,1%.\nii\n(Mô-đun 3.1, LOS 3.b)","qhtml":"<p>Annual Returns on ABC Mutual Fund</p><table class=\"qtable\"><thead><tr><th>Yr 1</th><th>Yr 2</th><th>Yr 3</th><th>Yr 4</th><th>Yr 5</th><th>Yr 6</th><th>Yr 7</th><th>Yr 8</th><th>Yr 9</th><th>Yr 10</th></tr></thead><tbody><tr><td>11.0%</td><td>12.5%</td><td>8.0%</td><td>9.0%</td><td>13.0%</td><td>7.0%</td><td>15.0%</td><td>2.0%</td><td>−16.5%</td><td>11.0%</td></tr></tbody></table><p>Assuming a mean of 7.2%, what is the sample standard deviation of the returns for ABC Mutual Fund for the period from Year 1 to Year 10?</p>"},{"n":25,"q":"The owner of a company has recently decided to raise the salary of one employee, who was\nalready making the highest salary in the company, by 40%. Which of the following value(s) is\n(are) expected to be affected by this raise?","opts":["both mean and median.","median only.","mean only."],"ans":"C","expl":"Số trung bình bị ảnh hưởng vì nó là tổng của tất cả giá trị/số lượng quan sát. Trung vị\nkhông bị ảnh hưởng vì nó là điểm giữa giữa nửa trên của giá trị và nửa dưới của\ngiá trị.\n(Mô-đun 3.1, LOS 3.a)"},{"n":26,"q":"Consider the following set of stock returns: 12%, 23%, 27%, 10%, 7%, 20%,15%. The third\nquartile is:","opts":["20.0%.","21.5%.","23%."],"ans":"C","expl":"Toán sắp chữ: 100%\nPhần tư thứ ba được tính như sau: L = (7 + 1) (75/100) = 6. Khi chúng tôi đặt hàng\ny\nquan sát theo thứ tự tăng dần: 7%, 10%, 12%, 15%, 20%, 23%, 27%, \"23%\" là quan sát\nthứ sáu từ bên trái.\n(Mô-đun 3.1, LOS 3.a)"},{"n":27,"q":"An analyst takes a sample of yearly returns of aggressive growth funds resulting in the\nfollowing data set: 25, 15, 35, 45, and 55. The mean absolute deviation (MAD) of the data set\nis closest to:","opts":["16.","12.","20."],"ans":"B","expl":"Tính giá trị trung bình:\n25+15+35+45+55\n=35\n5\nĐể có được độ lệch tuyệt đối trung bình, hãy tính tổng các độ lệch xung quanh giá trị trung bình (bỏ qua dấu\n) rồi chia cho số lần quan sát:\n10+20+0+10+20\n=12\n5\n(Mô-đun 3.1, LOS 3.b)","explhtml":"<p>Tính giá trị trung bình:</p><div class=\"kd\">$$\\dfrac{25+15+35+45+55}{5}=35$$</div><p>Tổng các độ lệch tuyệt đối xung quanh giá trị trung bình và chia cho số lượng quan sát:</p><div class=\"kd\">$$\\dfrac{10+20+0+10+20}{5}=12$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":28,"q":"Returns for a portfolio over the last four years are shown below. Treating these returns as a\nsample, what is their coefficient of variation (CV)?\nYearReturn\n117.0%\n212.2%\n33.9%\n4–8.4%","opts":["1.56.","0.55.","1.80."],"ans":"C","expl":"Hệ số biến thiên bằng độ lệch chuẩn của lợi nhuận chia cho\nlợi nhuận trung bình.\nLợi nhuận trung bình = (17,0% + 12,2% + 3,9% – 8,4%) / 4 = 6,175%\nYearReturn2\n(R – 6,175%)\n117,0%117,18\n212,2%36,30\n33,9%5,18\n4–8,4%212,43\nTổng = 371,09\n0,5\nĐộ lệch chuẩn mẫu = [371,09 / (4 – 1)] = 11,12%\nHệ số biến thiên = 11,12% / 6,175% = 1,80\n(Mô-đun 3.1, LOS 3.b)","qhtml":"<p>Returns for a portfolio over the last four years are shown below. Treating these returns as a sample, what is their coefficient of variation (CV)?</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>1</td><td>17.0%</td></tr><tr><td>2</td><td>12.2%</td></tr><tr><td>3</td><td>3.9%</td></tr><tr><td>4</td><td>−8.4%</td></tr></tbody></table>","explhtml":"<p>Hệ số biến thiên bằng độ lệch chuẩn của lợi nhuận chia cho lợi nhuận trung bình.</p><div class=\"kd\">$$\\bar{R}=\\dfrac{17.0\\%+12.2\\%+3.9\\%-8.4\\%}{4}=6.175\\%$$</div><p>Độ lệch bình phương\\((R-6.175\\%)^2\\)là 117,18, 36,30, 5,18 và 212,43, tổng là 371,09:</p><div class=\"kd\">$$s=\\left[\\dfrac{371.09}{4-1}\\right]^{1/2}=11.12\\%,\\qquad CV=\\dfrac{11.12\\%}{6.175\\%}=1.80$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":29,"q":"A portfolio's monthly returns follow a distribution with a kurtosis measure of 4.2. Relative to\na portfolio with normally distributed returns, this portfolio has a:","opts":["lower probability of extreme upside returns and higher chance of extreme downside returns.","higher probability of extreme upside returns and lower chance of extreme downside returns.","higher probability of extreme upside returns and higher chance of extreme downside returns."],"ans":"C","expl":"Phân phối leptokurtic (phân phối có số đo độ nhọn lớn hơn 3) lớn hơn\nđạt đỉnh ở giữa (dữ liệu tập trung nhiều hơn ở giá trị trung bình) và có phần đuôi dày hơn ở các\ncực trị (xác suất xuất hiện các giá trị ngoại lệ cao hơn).\n(Mô-đun 3.2, LOS 3.c)"},{"n":30,"q":"For the investments shown in the table below:\nInvestmentReturn (%)\nA12\nB14\nC9\nD13\nE7\nF8\nG12\nWhich of the following statements is most accurate?","opts":["The mean is equal to the mode.","The mean is equal to the median.","The median is equal to the mode."],"ans":"C","expl":"Trung vị là số lợi nhuận ở giữa hoặc trung tâm được sắp xếp từ cao nhất đến thấp nhất\nhoặc thấp nhất đến cao nhất. Trong trường hợp này: 7, 8, 9, 12, 12, 13, 14. Lợi nhuận trung bình là 12%. Chế độ\nlà chế độ trả về xảy ra thường xuyên nhất. Trong trường hợp này, 12% cũng là chế độ. Giá trị trung bình\nlà 75/7 = 10,71%.\n(Mô-đun 3.1, LOS 3.a)","qhtml":"<p>For the investments shown in the table below:</p><table class=\"qtable\"><thead><tr><th>Investment</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>12</td></tr><tr><td>B</td><td>14</td></tr><tr><td>C</td><td>9</td></tr><tr><td>D</td><td>13</td></tr><tr><td>E</td><td>7</td></tr><tr><td>F</td><td>8</td></tr><tr><td>G</td><td>12</td></tr></tbody></table><p>Which of the following statements is most accurate?</p>"},{"n":31,"q":"The annual returns on 5 portfolio investments for the last year are shown in the following\ntable. What is the return on the portfolio and the geometric mean of the returns on the\nportfolio investments?\nInvestmentInvested AmountReturn (%)\nA10,00012\nB10,00014\nC10,0009\nD10,00013\nE10,0007","opts":["11.00; 10.78.","11.00; 10.97.","11.64; 10.97."],"ans":"B","expl":"Trung bình số học: 12 + 14 + 9 + 13 + 7 = 55; 55 / 5 = 11\n1/5\nTrung bình Hình học: [(1,12 × 1,14 × 1,09 × 1,13 × 1,07)] – 1 = 10,97%\n(Mô-đun 3.1, LOS 3.a)","qhtml":"<p>The annual returns on 5 portfolio investments for the last year are shown in the following table. What is the return on the portfolio and the geometric mean of the returns on the portfolio investments?</p><table class=\"qtable\"><thead><tr><th>Investment</th><th>Invested Amount</th><th>Return (%)</th></tr></thead><tbody><tr><td>A</td><td>$10,000</td><td>12</td></tr><tr><td>B</td><td>$10,000</td><td>14</td></tr><tr><td>C</td><td>$10,000</td><td>9</td></tr><tr><td>D</td><td>$10,000</td><td>13</td></tr><tr><td>E</td><td>$10,000</td><td>7</td></tr></tbody></table>"},{"n":32,"q":"A distribution of returns that has a greater percentage of small deviations from the mean\nand a greater percentage of large deviations from the mean compared to a normal\ndistribution:","opts":["has negative excess kurtosis.","has positive excess kurtosis.","is positively skewed."],"ans":"B","expl":"Một phân phối có tỷ lệ phần trăm sai lệch nhỏ so với giá trị trung bình lớn hơn và\ntỷ lệ phần trăm lớn hơn của độ lệch lớn so với giá trị trung bình sẽ là leptokurtic và sẽ thể hiện\nvượt quá dương độ nhọn. Phân phối sẽ cao hơn (đỉnh hơn) với phần đuôi béo hơn\nphân phối bình thường.\n(Mô-đun 3.2, LOS 3.c)"},{"n":33,"q":"A company reports its past six years' earnings growth at 10%, 14%, 12%, 10%, –10%, and\n12%. The company's average compound annual growth rate of earnings is closest to:","opts":["8.5%.","7.7%.","8.0%."],"ans":"B","expl":"1/6\nTrung bình hình học = [(1.10)(1.14)(1.12)(1.10)(0.90)(1.12)] − 1 = 0,0766 hoặc 7,66% (Mô-đun\n3.1, LOS 3.a)"},{"n":34,"q":"A 5% trimmed mean ignores the:","opts":["highest and lowest 5% of observations.","lowest 5% of observations.","highest and lowest 2.5% of observations."],"ans":"C","expl":"Giảm 5% có nghĩa là loại bỏ 2,5% quan sát cao nhất và 2,5% thấp nhất và là\ntrung bình số học của 95% còn lại quan sát.\n(Mô-đun 3.1, LOS 3.a)"},{"n":35,"q":"Given the following set of data:\n17, 3, 13 , 3, 5, 9, 8\nThe value 8 is most accurately described as the:","opts":["mean.","median.","mode."],"ans":"B","expl":"Trung vị = giữa phân phối = 8 (số ở giữa);\nTrung bình = (3 + 3 + 5 + 8 + 9 + 13 + 17) / 7 = 8,28;\nChế độ = quan sát thường xuyên nhất = 3.\n(Mô-đun 3.1, LOS 3.a)"},{"n":36,"q":"The correlation coefficient between the return on an investment and the rate of economic\ngrowth is –0.065. An analyst should most likely interpret this correlation coefficient as\nindicating that returns on this investment are:","opts":["unrelated to economic growth.","not related linearly to economic growth.","negatively related to economic growth."],"ans":"B","expl":"Hệ số tương quan gần bằng 0 cho thấy hai biến không có mối quan hệ tuyến tính\n. Điều này không nhất thiết có nghĩa là các biến không liên quan vì chúng\ncó thể thể hiện mối quan hệ phi tuyến tính.\n(Mô-đun 3.2, LOS 3.d)"},{"n":37,"q":"Which of the following statements concerning a distribution with positive skewness and\npositive excess kurtosis is least accurate?","opts":["The mean will be greater than the mode.","It has a lower percentage of small deviations from the mean than a normal distribution.","It has fatter tails than a normal distribution."],"ans":"B","expl":"Một phân phối có độ nhọn vượt trội dương có tỷ lệ phần trăm sai lệch nhỏ\nso với giá trị trung bình cao hơn bình thường. Vì vậy, nó \"đạt đỉnh\" hơn so với phân phối chuẩn. A\nphân phối có độ lệch dương có chế độ > trung bình.\n(Mô-đun 3.2, LOS 3.c)"},{"n":38,"q":"The mean monthly return on a sample of small stocks is 4.56% with a standard deviation of\n3.56%. If the risk-free rate is 1%, what is the coefficient of variation?","opts":["1.28.","1.00.","0.78."],"ans":"C","expl":"Hệ số biến thiên biểu thị mức độ phân tán tồn tại so với giá trị trung bình của phân phối a\n. Nó là thước đo rủi ro trên mỗi đơn vị lợi nhuận trung bình.\nCV = s / Mean. 3,56 / 4,56 = 0,781 hoặc 78%.\n(Mô-đun 3.1, LOS 3.b)"},{"n":39,"q":"If an analyst concludes that the distribution of a large sample of returns is positively skewed,\nwhich of the following relationships involving the mean, median, and mode is most likely?","opts":["Mean > median < mode.","Mean < median < mode.","Mean > median > mode."],"ans":"C","expl":"Toán sắp chữ: 100%\nĐối với phân bố lệch dương, chế độ nhỏ hơn trung vị, nhỏ hơn\ngiá trị trung bình. (Mô-đun 3.2, LOS 3.c)"},{"n":40,"q":"An analyst calculates a winsorized mean return of 3.2% for an investment fund. This\nmeasure most likely:","opts":["replaces outliers with less extreme returns.","equally weights all returns.","captures the compounded growth rate of the fund."],"ans":"A","expl":"Giá trị trung bình chiến thắng là một kỹ thuật để xử lý các giá trị ngoại lệ. Ví dụ: giá trị trung bình chiến thắng 90%\nthay thế 5% giá trị thấp nhất bằng phân vị thứ năm và thay thế\n5% giá trị cao nhất bằng phân vị thứ 95. Giá trị trung bình số học có trọng số như nhau đối với tất cả\ncác quan sát. Giá trị trung bình hình học phản ánh tốc độ tăng trưởng gộp của quỹ\n.\n(Mô-đun 3.1, LOS 3.a)"},{"n":41,"q":"If the historical mean return on an investment is 2.0%, the standard deviation is 8.8%, and\nthe risk free rate is 0.5%, what is the coefficient of variation (CV)?","opts":["0.23.","0.17.","4.40."],"ans":"C","expl":"CV = độ lệch chuẩn của lợi nhuận / lợi nhuận trung bình\n= 8,8% / 2,0% = 4,4.\nCV là thước đo của rủi ro trên mỗi đơn vị lợi nhuận trung bình. Khi xếp hạng danh mục đầu tư dựa trên\nCV, giá trị thấp hơn sẽ được ưu tiên hơn giá trị cao hơn.\n(Mô-đun 3.1, LOS 3.b)"},{"n":42,"q":"For the last four years, the returns for XYZ Corporation's stock have been 10.4%, 8.1%, 3.2%,\nand 15.0%. The equivalent compound annual rate is:","opts":["8.9%.","9.2%.","9.1%."],"ans":"C","expl":"0,25\n(1,104 × 1,081 × 1,032 × 1,15) – 1 = 9,1%\n(Mô-đun 1.2, LOS 1.c)","explhtml":"<div class=\"kd\">$$(1.104\\times1.081\\times1.032\\times1.15)^{0.25}-1=9.1\\%$$</div><span class=\"los\">(Mô-đun 1.2, LOS 1.c)</span>"},{"n":43,"q":"An analyst compiles the returns on Fund Q over the last four years:\nYearReturn\n14%\n23%\n32%\n430%\nWhich of the following will result in the lowest measure of the mean return?","opts":["The arithmetic mean.","The geometric mean.","The harmonic mean."],"ans":"C","expl":"4\nTrung bình hài=−1=0,0864=8,64%\n1111\n++++\n1.041.031.021.30\nTrung bình hình học=[(1.04)(1.03)(1.02)(1.30)]−1=0.0917=9.17%4\n4%+3%+2%+30%\nTrung bình số học==9,75%\n4\nTính toán sắp chữ: 100%\n(Mô-đun 3.1, LOS 3.a)","qhtml":"<p>An analyst compiles the returns on Fund Q over the last four years:</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>1</td><td>4%</td></tr><tr><td>2</td><td>3%</td></tr><tr><td>3</td><td>2%</td></tr><tr><td>4</td><td>30%</td></tr></tbody></table><p>Which of the following will result in the lowest measure of the mean return?</p>","explhtml":"<div class=\"kd\">$$\\text{Harmonic mean}=\\dfrac{4}{\\frac{1}{1.04}+\\frac{1}{1.03}+\\frac{1}{1.02}+\\frac{1}{1.30}}-1=0.0864=8.64\\%$$</div><div class=\"kd\">$$\\text{Geometric mean}=\\left[(1.04)(1.03)(1.02)(1.30)\\right]^{1/4}-1=0.0917=9.17\\%$$</div><div class=\"kd\">$$\\text{Arithmetic mean}=\\dfrac{4\\%+3\\%+2\\%+30\\%}{4}=9.75\\%$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.a)</span>"},{"n":44,"q":"Which of the following statements about kurtosis is least accurate? Kurtosis:","opts":["measures the peakedness of a distribution reflecting a greater or lesser concentration of returns around the mean.","describes the degree to which a distribution is not symmetric about its mean.","is used to reflect the probability of extreme outcomes for a return distribution."],"ans":"B","expl":"Mức độ phân phối không đối xứng về giá trị trung bình được đo bằng\nđộ lệch. Độ nhọn vượt quá được đo tương ứng với phân phối chuẩn, biểu thị\nđỉnh của phân phối và cũng phản ánh xác suất xảy ra các kết quả cực đoan.\n(Mô-đun 3.2, LOS 3.c)"},{"n":45,"q":"A distribution with a mode of 10 and a range of 2 to 25 would most likely be:","opts":["negatively skewed.","positively skewed.","normally distributed."],"ans":"B","expl":"Khoảng cách ở bên trái từ chế độ đến đầu phạm vi là 8. Khoảng cách đến\nbên phải từ chế độ đến cuối phạm vi là 15. Do đó, phân bố\nbị lệch sang phải, nghĩa là nó bị lệch dương.\n(Mô-đun 3.2, LOS 3.c)"},{"n":46,"q":"In a negatively skewed distribution, what is the order (from lowest value to highest) for the\ndistribution's mode, mean, and median values?","opts":["Mode, mean, median.","Median, mode, mean.","Mean, median, mode."],"ans":"C","expl":"Trong phân phối có độ lệch âm, giá trị trung bình nhỏ hơn trung vị, nhỏ hơn\nchế độ.\n(Mô-đun 3.2, LOS 3.c)"},{"n":47,"q":"Find the respective mean and the mean absolute deviation (MAD) of a series of stock market\nreturns.\nYear 114%\nYear 220%\nYear 324%\nYear 422%","opts":["20%; 3%.","20%; 12%.","22%; 3%."],"ans":"A","expl":"(14 + 20 + 24 + 22) / 4 = 20 (trung bình)\nLấy giá trị tuyệt đối của chênh lệch và chia cho n:\nMAD = [|14 – 20| + |20 – 20| + |24 – 20| + |22 – 20|] / 4 = 3%.\n(Mô-đun 3.1, LOS 3.b)"},{"n":48,"q":"Over the last five years, an investment fund's monthly returns were relatively stable apart\nfrom last year, where two extremely high returns were recorded. If the arithmetic mean for\nthe fund's monthly returns over the period is 6.7%, a trimmed or winsorized mean return is\nmost likely to be:","opts":["lower than the arithmetic mean.","equal to the arithmetic mean.","higher than the arithmetic mean."],"ans":"A","expl":"Trung bình được cắt bớt loại bỏ tỷ lệ phần trăm của các quan sát cao nhất và thấp nhất, trong khi giá trị trung bình chiến thắng\nthay thế tỷ lệ phần trăm của các quan sát cao nhất và thấp nhất bằng các giá trị cực trị\nít hơn. Trong trường hợp này, giá trị trung bình số học sẽ bị ảnh hưởng bởi hai kết quả trả về dương\ncao, trong khi giá trị trung bình được cắt bớt hoặc được ưu hóa sẽ điều chỉnh cho chúng và\ncó thể sẽ thấp hơn giá trị trung bình số học.\n(Mô-đun 3.1, LOS 3.a)"},{"n":49,"q":"Given the following box-and-whisker plot:\nA box plot\ndisplaying data distribution with a median of 3.1%, an interquartile range between 0.5% and\n5.2%, and whiskers extending from -3.7% to 14.4%, indicating the spread and potential\noutliers in the dataset.\nThe interquartile range is:","opts":["3.1% to 5.2%.","0.5% to 5.2%.","0.5% to 3.1%."],"ans":"B","expl":"Phạm vi liên tứ phân vị là từ tứ phân vị thứ nhất (phân vị thứ 25) đến phân vị thứ ba (phân vị thứ 75\n) và được biểu thị dưới dạng hộp trong một âm mưu hộp và râu. Đường ngang\ntrong hộp biểu thị trung vị (phân vị thứ 50).\n(Mô-đun 3.1, LOS 3.a)"},{"n":50,"q":"For a unimodal distribution with negative skewness:","opts":["the median is greater than the mean.","the mean is greater than the mode.","the mode is less than the median."],"ans":"A","expl":"Đối với phân phối có độ lệch âm, trung bình < trung vị < mode.\n(Mô-đun 3.2, LOS 3.c)"},{"n":51,"q":"Twenty Level I CFA candidates in a study group took a practice exam and want to determine\nthe distribution of their scores. When they grade their exams they discover that one of them\nskipped an ethics question and subsequently filled in the rest of his answers in the wrong\nplaces, leaving him with a much lower score than the rest of the group. If they include this\ncandidate's score, their distribution will most likely:","opts":["be positively skewed.","have a mean that is less than its median.","have a mode that is less than its median."],"ans":"B","expl":"Với giá trị ngoại lệ thấp được đưa vào, phân phối sẽ bị sai lệch âm. Đối với phân phối bị lệch âm\n, giá trị trung bình nhỏ hơn trung vị, nhỏ hơn chế độ.\n(Mô-đun 3.2, LOS 3.c)"},{"n":52,"q":"The correlation between two variables is –0.74. The most appropriate way to interpret this\ncorrelation is that:","opts":["there is unlikely to be a strong linear relationship between the two variables.","the two variables have a negative linear association.","if one of the variables increases, there is a 74% probability that the other variable will decrease."],"ans":"B","expl":"Hệ số tương quan –0,74 cho thấy mối liên hệ tuyến tính âm tương đối mạnh\ngiữa hai biến. Chúng ta không thể giải thích trực tiếp hệ số tương quan dưới dạng\nthước đo xác suất hai biến sẽ thay đổi theo hướng ngược nhau.\n(Mô-đun 3.2, LOS 3.d)"},{"n":53,"q":"What does it mean to say that an observation is at the sixty-fifth percentile?","opts":["65% of all the observations are below that observation.","65% of all the observations are above that observation.","The observation falls within the 65th of 100 intervals."],"ans":"A","expl":"Nếu quan sát rơi vào phân vị thứ 65 thì 65% tổng số quan sát sẽ nằm dưới\nquan sát đó.\n(Module 3.1, LOS 3.a)"},{"n":54,"q":"An analyst gathers the following data about the mean monthly returns of three securities:\nSecurityMean Monthly ReturnStandard Deviation\nX0.90.7\nY1.24.7\nZ1.55.2\nWhich security has the highest level of relative risk as measured by the coefficient of\nvariation?","opts":["Y.","Z.","X."],"ans":"A","expl":"Hệ số biến thiên, CV = độ lệch chuẩn / trung bình số học, là thước đo phổ biến\nvề độ phân tán tương đối (rủi ro). CV = 0,7 / 0,9 = 0,78; CV = 4,7 / 1,2 = 3,92; và CV =\nXYZ\n5,2 / 1,5 = 3,47. Vì CV cao hơn có nghĩa là rủi ro tương đối cao hơn nên Bảo mật Y có\nrủi ro tương đối cao nhất.\n(Mô-đun 3.1, LOS 3.b)","qhtml":"<p>An analyst gathers the following data about the mean monthly returns of three securities:</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Mean Monthly Return</th><th>Standard Deviation</th></tr></thead><tbody><tr><td>X</td><td>0.9</td><td>0.7</td></tr><tr><td>Y</td><td>1.2</td><td>4.7</td></tr><tr><td>Z</td><td>1.5</td><td>5.2</td></tr></tbody></table><p>Which security has the highest level of relative risk as measured by the coefficient of variation?</p>","explhtml":"<p>Hệ số biến thiên\\(CV=\\dfrac{\\text{standard deviation}}{\\text{arithmetic mean}}\\), là thước đo phổ biến của độ phân tán tương đối (rủi ro):</p><div class=\"kd\">$$CV_X=\\dfrac{0.7}{0.9}=0.78,\\quad CV_Y=\\dfrac{4.7}{1.2}=3.92,\\quad CV_Z=\\dfrac{5.2}{1.5}=3.47$$</div><p>Vì CV cao hơn có nghĩa là rủi ro tương đối cao hơn nên Chứng khoán Y có rủi ro tương đối cao nhất.</p><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":55,"q":"What is the coefficient of variation for a distribution with a mean of 10 and a variance of 4?","opts":["20%.","25%.","40%."],"ans":"A","expl":"Hệ số biến thiên, CV = độ lệch chuẩn / giá trị trung bình. Độ lệch chuẩn là\n½\ncăn bậc hai của phương sai hoặc 4 = 2. Vì vậy, CV = 2 / 10 = 20%.\n(Mô-đun 3.1, LOS 3.b)"},{"n":56,"q":"For the past three years, Acme Corp. has generated the following sample returns on equity\n(ROE): 4%, 10%, and 1%. What is the sample variance of the ROE over the last three years?","opts":["21.0%.","4.6%.","2 21.0(%)."],"ans":"C","expl":"2222\n[(4 – 5) + (10 – 5) + (1 – 5)] / (3 – 1) = 21(%).\n(Mô-đun 3.1, LOS 3.b)","explhtml":"<div class=\"kd\">$$\\dfrac{(4-5)^2+(10-5)^2+(1-5)^2}{3-1}=21\\ (\\%^2)$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":57,"q":"Cameron Ryan wants to make an offer on the condominium he is renting. He takes a sample\nof prices of condominiums in his development that closed in the last five months. Sample\nprices are as follows (amounts are in thousands of dollars): $125, $175, $150, $155 and\n$135. The sample standard deviation is closest to:","opts":["19.24.","38.47.","370.00."],"ans":"A","expl":"Tính toán như sau:\n1. Giá trị trung bình mẫu = (125 + 175 + 150 + 155 + 135) / 5 = 148\n2222\n2. Phương sai mẫu = [(125 – 148) + (175 – 148) + (150 – 148) + (155 – 148) + (135 –\n2\n148)] / (5 – 1) = 1,480 / 4 = 370\n1/2\n3. Độ lệch chuẩn mẫu = 370 = 19,24%.\n(Học ​​phần 3.1, LOS 3.b)","explhtml":"<p>1. Ý nghĩa mẫu:</p><div class=\"kd\">$$\\dfrac{125+175+150+155+135}{5}=148$$</div><p>2. Phương sai mẫu:</p><div class=\"kd\">$$\\dfrac{(125-148)^2+(175-148)^2+(150-148)^2+(155-148)^2+(135-148)^2}{5-1}=\\dfrac{1{,}480}{4}=370$$</div><p>3. Độ lệch chuẩn mẫu:</p><div class=\"kd\">$$\\sqrt{370}=19.24\\%$$</div><span class=\"los\">(Học ​​phần 3.1, LOS 3.b)</span>"},{"n":58,"q":"Given the following annual returns, what are the geometric and arithmetic mean returns,\nrespectively?\n20022003200420052006\n15%2%5%-7%0%","opts":["1.45%; 3.00%.","2.75%; 3.00%.","2.75%; 5.80%."],"ans":"B","expl":"1/51/5\nTrung bình Hình học: (1,15 × 1,02 × 1,05 × 0,93 × 1,0) – 1 = 1,1454 – 1 = 2,75%\nTrung bình số học: (15% + 2% + 5% – 7% + 0%) / 5 = 3,00%\n(Mô-đun 3.1, LOS 3.a)","qhtml":"<p>Given the following annual returns, what are the geometric and arithmetic mean returns, respectively?</p><table class=\"qtable\"><thead><tr><th>2002</th><th>2003</th><th>2004</th><th>2005</th><th>2006</th></tr></thead><tbody><tr><td>15%</td><td>2%</td><td>5%</td><td>−7%</td><td>0%</td></tr></tbody></table>"},{"n":59,"q":"Which of the following statements concerning kurtosis is most accurate?","opts":["A distribution with kurtosis of +2 has fatter tails than a normal distribution.","A leptokurtic distribution has excess kurtosis less than zero.","A leptokurtic distribution has fatter tails than a normal distribution."],"ans":"C","expl":"Sự phân bố leptokurtic đạt đỉnh cao hơn bình thường và có đuôi béo hơn. Tuy nhiên,\nđộ nhọn vượt quá lớn hơn 0.\n(Mô-đun 3.2, LOS 3.c)"}];
const CFG = {"title": "Statistical Measures of Asset Returns", "subtitle": "CFA · Quantitative Methods · Reading 3 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl || q.explhtml){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts,q.explhtml));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options,richHtml){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  if(richHtml){
    const choice=document.createElement("article"); choice.className="expl-choice is-correct";
    const top=document.createElement("div"); top.className="expl-choice-top";
    const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=correctLetter;
    const state=document.createElement("span"); state.className="expl-state"; state.textContent="Đáp án đúng";
    top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
    const optionIndex=LETTERS.indexOf(correctLetter);
    if(options&&optionIndex>=0&&options[optionIndex]){ const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option); }
    const reason=document.createElement("div"); reason.className="expl-reason expl-rich"; reason.innerHTML=richHtml; choice.appendChild(reason); content.appendChild(choice);
  }else explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(!richHtml&&(data.reading||data.los)){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
