<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following factors most likely results in a drag, rather than a pull, on a company's liquidity position?", "opts": ["Delinquent customer payments", "Reduced limits on lines of credit", "Payments to vendors before the due date"], "ans": "A", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nA company's liquidity position is a measure of its ability to meet short-term cash flow needs. Liquidity is impacted by drags and pulls:\nA drag on liquidity refers to slower cash inflows\nA pull on liquidity refers to faster cash outflows or limited availability of trade credit\nBoth pulls and drags reduce a company's available cash balance.\nDelinquent customer payments slow the company's receipts of cash, create a drag on liquidity, and increase the likelihood of uncollected accounts\nreceivable. As a result, the company receives cash more slowly or receives less cash.\n(Choice B) A reduction in the company's credit limit is a pull on liquidity: the company will hit the lower limit sooner and more often, accelerating\nrequired repayments (ie, cash outflows).\n(Choice C) When a company pays its vendors before the due date, it is speeding up cash outflows, which is a pull on liquidity.\nThings to remember:\nA company's liquidity position measures its ability to meet short-term cash flow needs. A drag on liquidity indicates slower or smaller cash inflows;\na pull on liquidity refers to faster or greater cash outflows. Both scenarios reduce a company's liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 2, "q": "A company has a quick ratio of 0.95. If the company reports current liabilities of HKD400 million, deferred tax liabilities due in 14 months of HKD100 million, and inventory of HKD120 million, its current ratio is closest to:", "opts": ["0.65", "0.80", "1.25"], "ans": "C", "expl": "The current ratio and the quick ratio are two related liquidity metrics for a company's ability to meet short-term (ie, due within a year)\nobligations. Both ratios express the relationship between current assets (eg, cash, short-term marketable investments, receivables, inventory) and\ncurrent liabilities (eg, accounts payable, accrued liabilities, short-term debt). A higher ratio indicates better liquidity.\nThe quick ratio is the more conservative liquidity measure because it excludes inventory in the numerator. Inventory is the least liquid current\nasset as it requires the longest time to convert to cash.\nTo calculate the current ratio, first derive the value of current assets by using the given values for the quick ratio, current liabilities, and inventory.\nThe current asset value is then inserted into the current ratio formula.\n(Choice A) In calculating the current ratio, the level of current assets is incorrectly computed by subtracting inventory from the quick assets\n(current assets excluding inventory) instead of adding inventory to the quick assets.\n(Choice B) The denominator incorrectly includes deferred tax liabilities as a current liability. The deferred tax liabilities are due more than a year\nfrom now, so they are not a current liability.\nThings to remember:\nThe current ratio is equal to the current assets divided by the current liabilities. The quick ratio is equal to the current assets less inventory divided\nby the current liabilities. Inventory is excluded from the quick ratio since it is the least liquid of current assets and takes the longest time to convert\nto cash.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 3, "q": "A company has CAD 50 million of short-term liquidity needs. The company has the following assets and liabilities: CAD 20 million in marketable securities, which can be sold with a 0.5% brokerage cost CAD 35 million in bonds, able to be liquidated at 2.5% cost CAD 50 million in accounts payable with terms of 2/10, net 60 To cover its liquidity needs at lowest cost, which of the following strategies would be most appropriate for the company to use?", "opts": ["Issue new equity in secondary offering", "Sell all the marketable securities and sell bonds", "Sell all the marketable securities and delay accounts payable"], "ans": "C", "expl": "Companies typically have many options for short-term financing, including internal sources and financial intermediaries (eg, lines of credit).\nMismanaging capital can result in higher costs paid or a shortage of funds. When managing funds, a company should ensure that:\nsufficient sources of capital are maintained to meet the company's cash needs, especially peak needs, and\nmarket rates for these sources are not excessive compared with market averages.\nIn this scenario, selling the marketable securities is the company's cheapest option, with a 0.5% fee on sales. The company can free up funds by\ndelaying its accounts payable payment up to 60 days, forgoing a 2% discount. (\"2/10, net 60\" means that the company has 60 days to pay but it\ncan earn a 2% discount if payment is made within 10 days.) This lower cost option is preferable to liquidating bonds at a cost of 2.5% (Choice B).\n(Choice A) Issuing new equity in a secondary offering would be inappropriate for a company trying to meet short-term liquidity needs. Equity\nissuances typically take time to execute and can have high costs, which makes this option more appropriate to fund long-term needs.\nThings to remember:\nA company's management should know how different sources of short-term funds can affect its liquidity position and risks. When funds are\nmanaged, sufficient sources of capital must be maintained to meet the company's peak cash needs. In addition, market rates for these sources\nmust not be excessive compared with market averages.\nDescribe issuers’ objectives and compare methods for managing working capital and liquidity", "qhtml": null}, {"n": 4, "q": "Which of the following situations most likely creates a pull on a company's liquidity?", "opts": ["Major suppliers change payment terms from 60 days to 30 days.", "Obsolete inventory accumulates beyond one normal sales cycle.", "Interest rates for sources of short-term funding increase by 100 basis points."], "ans": "A", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nBusinesses manage liquidity by controlling cash inflows and outflows effectively in the near term. Certain events may drain liquidity through drags\nand pulls. A drag on liquidity generally refers to a slowdown in cash inflows. A pull on liquidity generally refers to a speedup in cash\noutflows. Both pulls and drags reduce a company's available cash balance.\nIn this scenario, a company's major suppliers shortening payment terms from 60 to 30 days means that the company must disburse cash earlier\nto satisfy payables. This situation creates a pull on liquidity.\n(Choice B) Excess buildup of obsolete inventory negatively affects a company's ability to generate sales. This creates a drag on liquidity.\n(Choice C) An increase in short-term borrowing rates makes it more difficult for a company to obtain funds. This creates a drag on liquidity.\nThings to remember:\nBusinesses manage liquidity by controlling cash inflows and outflows effectively in the near term. A drag on liquidity generally refers to a\nslowdown in cash inflows. A pull on liquidity generally refers to a speedup in cash outflows.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 5, "q": "An analyst gathers the following information about a company: Based on this information, the company's inventory turnover ratio is closest to:", "opts": ["8.0", "9.6", "12.0"], "ans": "B", "expl": "Inventory turnover is a liquidity metric that measures how many times inventory has been bought (eg, acquired, created), sold, and\nreplenished in a given period. All else being equal, the faster a company sells its inventory, the quicker it can convert its assets back to cash and\nrepeat the cycle. For example, everyday consumable products (eg, milk, bread) tend to turn over rapidly, while more durable items (eg, TV,\nwashing machine) tend to turn over more slowly.\nInventory turnover is particularly useful when comparing similar businesses as a means of contrasting operating and asset efficiency. In this case,\ninventory turnover is 9.6 times:\n(Choice A) 8.0 results from subtracting accounts receivable from COGS and then dividing by average inventory.\n(Choice C) 12.0 results from using credit sales instead of COGS as the numerator. This answer could also have been calculated by dividing\nCOGS by ending inventory instead of average inventory.\nThings to remember:\nInventory turnover is a liquidity metric that measures how many times inventory has been bought (eg, acquired, created), sold, and replenished in\na given period. Inventory turnover is calculated as COGS divided by average inventory.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 6, "q": "An analyst gathers the following data for a company: Based on this information, the days of inventory on hand (DOH) is closest to:", "opts": ["36.5", "40.6", "48.7"], "ans": "C", "expl": "Days of inventory on hand (DOH), also referred to as number of days of inventory, measures the average number of days it takes a company\nto sell its inventory. DOH is an activity ratio that indicates management's effectiveness in managing its inventory, with fewer days usually\nindicating more efficiency as capital is tied up in inventory for a shorter time. DOH is particularly useful as a means of contrasting operating and\nasset efficiency when comparing similar businesses.\nDOH is calculated as average inventory for the period divided by daily COGS. In this case, DOH equals 48.7.\n(Choice A) 36.5 is credit sales, not average inventory, divided by daily COGS.\n(Choice B) 40.6 is ending inventory, not average inventory, divided by daily COGS.\nThings to remember:\nThe number of days of inventory (DOH), also referred to as days of inventory on hand, measures the average number of days that it takes a\ncompany to sell its inventory. DOH is calculated as average inventory for the period divided by daily COGS.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 7, "q": "An analyst gathers the following data for a company for 20X1: Based on this information, the company's day's sales outstanding (DSO) in 20X1 is closest to: ", "opts": ["47.5", "51.1", "68.5"], "ans": "A", "expl": "Days sales outstanding (DSO), also referred to as number of days of receivables, is one of several activity ratios used to measure operational\nefficiency. DSO represents the average number of days it takes for a company to collect cash from credit sales.\nDSO performance is particularly useful for evaluating operating and asset efficiency when conducting trend analysis or comparing similar\nbusinesses. Faster collection of receivables enhances liquidity and results in a lower DSO; a higher DSO indicates that customers are slower to\npay invoices and are more of a drag on liquidity.\nDSO equals average accounts receivable divided by daily credit sales:\n(Choice B) 51.1 results from using ending accounts receivable, not average accounts receivable.\n(Choice C) 68.5 is equal to daily credit sales.\nThings to remember:\nDays sales outstanding (DSO) is used to measure the average time needed for a company to collect cash from credit sales. A lower DSO value is\ngenerally desirable and can improve a company's liquidity position. DSO is calculated as average accounts receivable divided by daily credit\nsales.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 8, "q": "An analyst is evaluating the performance of inventory management across several manufacturing companies. The analyst gathers the following data: Based on the data, and assuming all companies manufacture the same product, which of the following best describes the improvements in the number of days of inventory (DOH) from the previous year? ", "opts": ["Company X shows the most improvement.", "Company Z shows more improvement than Company Y.", "The industry average shows more improvement than Company Y."], "ans": "A", "expl": "The number of days of inventory (DOH), also referred to as days of inventory on hand, measures the average number of days that it takes a\ncompany to sell its inventory. Analysts can use DOH to evaluate a company's inventory management. Shorter DOH indicates greater speed\nand efficiency in selling inventory. In contrast, longer DOH can lead to inventory obsolescence and extra storage costs.\nCalculate the changes in DOH between FY18 and FY17:\nCompany X improved the most (by 3.4 days) over the previous year. On average, it took Company X 3.4 fewer days to sell its inventory compared\nto the prior year.\n(Choice B) Compared with the previous year, Company Z's DOH increased by 2.1 days while Company Y's DOH decreased by 2.2 days. This\nmeans that Company Z's DOH worsened by 2.1 days while Company Y's DOH improved by 2.2 days.\n(Choice C) Compared with the previous year, the industry's DOH decreased by 1 day while Company Y's DOH decreased by 2.2 days. This\nmeans that the industry's DOH improved by only 1 day while Company Y's DOH improved by 2.2 days.\nThings to remember:\nThe number of days of inventory (DOH) measures the average number of days that it takes a company to sell its inventory. Fewer days indicate\ngreater speed and efficiency in turning inventory into sales.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 9, "q": "An analyst is evaluating the performance of three manufacturers with the following information: Which company has the highest inventory turnover? ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The inventory turnover ratio represents the number of times, on average, inventory is sold and replenished during a fiscal period. It is calculated\nby dividing the cost of goods sold (COGS) by the average inventory. Average inventory is used since inventory fluctuates throughout the year.\nCOGS, or the cost at which the inventory was acquired or manufactured, is recorded when an item is sold.\nHigher inventory turnover can imply stronger sales relative to inventory levels whereas lower inventory turnover can imply slower sales or\nexcess inventory. The faster a company sells its inventory, the quicker it can convert its assets to cash and improve liquidity. In addition, long\ninventory storage times can lead to obsolete inventory.\nCompany X has the highest inventory turnover ratio of 4.3.\n(Choice B) Company Y has a lower inventory turnover ratio than Company X, meaning that Company Y was less efficient in converting its\ninventory into sales.\n(Choice C) Company Z has the lowest inventory turnover ratio.\nThings to remember:\nThe inventory turnover ratio is calculated as cost of goods sold divided by average inventory. It represents the number of times, on average,\ninventory is sold during the fiscal period. Higher inventory turnover can imply stronger sales relative to inventory levels.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 10, "q": "An analyst gathers the following data for a company: Based on this information, days payable outstanding (DPO) is closest to: ", "opts": ["45.6", "46.8", "49.0"], "ans": "A", "expl": "Days payable outstanding (DPO), also called number of day's payables, is one of several activity ratios used to measure operational efficiency.\nDPO is used to measure the average number of days it takes a company to pay its suppliers, which is one indicator of the company's\neffectiveness in managing its suppliers, cash disbursements, and operating cycle. A larger DPO, resulting from slower payments to suppliers, is\ndesirable since it enhances liquidity. DPO, like all activity ratios, is most useful when comparing against peers or an industry benchmark.\nDPO is the ratio of average accounts payable to average daily purchases. Average daily purchases is calculated as (COGS + Ending inventory –\nBeginning inventory) / 365.\n(Choice B) 46.8 results from dividing average accounts payable by COGS.\n(Choice C) 49.0 results from using ending payables instead of average payables.\nThings to remember:\nDays payable outstanding (DPO) is used to measure the average number of days it takes a company to pay its suppliers. DPO is the ratio of\naverage accounts payable to average daily purchases. Average daily purchases is calculated as (COGS + Ending inventory – Beginning\ninventory) / 365.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 11, "q": "All else being equal, which of the following changes to pulls and drags on liquidity most likely decreases a company's liquidity?", "opts": ["Increased pulls and drags", "Decreased pulls and drags", "Decreased pulls and increased drags"], "ans": "A", "expl": "Factors influencing a company's liquidity (ie, ability to generate cash to meet short-term obligations) are described as pulls and drags. Pulls are\nfactors affecting cash outflows, and drags are factors affecting cash inflows.\nLiquidity decreases with:\nincreased pulls: larger/more rapid outflows such as paying employees weekly rather than monthly; and\nincreased drags: smaller/slower inflows such as a reduction of credit lines from lenders.\n(Choice B) Liquidity increases with reduced pulls (ie, smaller/slower outflows), such as deferring payments to vendors to a later date, and\nreduced drags (ie, larger/more rapid inflows), such as faster inventory turnover.\n(Choice C) Increased drags decrease liquidity. However, decreased pulls favorably affect liquidity.\nThings to remember:\nPulls are factors that accelerate the flow of liquidity out of a company. Drags are factors that slow the flow of liquidity into a company. Increased\npulls and drags decrease liquidity, and reduced pulls and drags increase liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 12, "q": "An analyst gathers the following information for 20X1 for a Brazilian company (in BRL millions): Credit sales 135 Cost of goods sold (COGS) 108 Purchases 127 Accounts receivable 12 Beginning inventory balance 15 Ending inventory balance 17 Accounts payable 8 If the average length of the cash conversion cycle for the industry is 58 days, then the cash conversion cycle for the company is most likely:", "opts": ["better than that of the industry.", "the same as that of the industry.", "worse than that of the industry."], "ans": "C", "expl": "The cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers. The CCC consists of the number of days of inventory (ie, days of inventory on hand, DOH) plus the number of days of receivables (ie,\ndays of sales outstanding, DSO) less the number of days of payables (ie, days of payables outstanding, DPO).\nDOH measures the average time needed for a company to sell its inventory. DSO measures the average time needed to collect cash from the\nsales. DPO measures the average time needed to pay suppliers for the materials used to make the goods.\nIn this scenario, it takes the company 5.52 (63.52 − 58) more days than the industry, on average, to convert its inventory to cash after paying\nsuppliers. This indicates a worse CCC relative to the industry since it takes longer for the company to convert inventory to cash (Choices A and\nB).\nThings to remember:\nThe cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers. CCC is calculated by adding the number of days of inventory and the number of days of receivables, and then deducting the number of\ndays of payables. A longer CCC can be detrimental to a company's cash position.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 13, "q": "All else equal, a firm increasing its accounts receivables turnover will most likely:", "opts": ["decrease its operating cycle.", "increase its days of sales outstanding.", "increase its ending accounts receivables."], "ans": "A", "expl": "Accounts receivable turnover is a liquidity measure that approximates the number of times, on average, a company converts its accounts\nreceivables (AR) from credit sales to cash, within a reporting period. All else equal, higher AR turnover can signal more efficient working capital\nmanagement.\nA related measure, derived from AR turnover, is Days Sales Outstanding (DSO) (also known as \"days receivable\"). DSO measures the average\ntime in days it takes to collect cash from customers after making credit sales. Higher AR turnover results in lower (shorter) DSO, which can\ndecrease the operating cycle (Choice B).\nThe operating cycle (OC) measures the average time in days it takes a company to convert its inventory to cash. The OC is the sum of days of\ninventory on hand (DOH), which measures the average time in days to sell inventory, and DSO.\n(Choice C) All else equal, higher AR turnover suggests that receivables are turned into cash more frequently. This most likely leads to lower\nlevels of ending AR, not higher.\nThings to remember:\nAccounts receivable turnover measures the number of times, on average, a company converts its accounts receivables (AR) from credit sales to\ncash, within a reporting period. All else equal, a higher AR turnover results in lower days sales outstanding, which ultimately shortens the\noperating cycle.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 14, "q": "A company improved its operating cycle this fiscal year. If the company significantly increased its days of inventory on hand (DOH) over the same period, then the company most likely decreased its:", "opts": ["days payable outstanding (DPO).", "days of sales outstanding (DSO).", "accounts receivables turnover ratio."], "ans": "B", "expl": "The operating cycle (OC) measures the time required to convert inventory to cash. The OC consists of the days of inventory on hand (DOH),\nand the days of sales outstanding (DSO). The DOH measures the average time needed for a company to sell its inventory. The DSO measures\nthe average time needed for a company to collect cash from the sales. Decreasing the OC improves a company's overall cash position.\nThe company improved its OC by reducing the number of days. The OC is the sum of DOH and DSO, so an increase in DOH must be offset by a\ngreater decrease in DSO for the overall OC to decrease. Essentially, the company offsets an increase in its sales cycle with a greater decrease in\nits collections cycle. This results in a shorter OC, and the company receives cash faster.\n(Choice A) The OC, unlike the cash conversion cycle (CCC), is not impacted by changes to days payable outstanding (DPO). The CCC is the\ndifference between the OC and the DPO.\n(Choice C) The accounts receivable (AR) turnover ratio (credit sales ÷ AR) gauges the collection frequency over a period. AR turnover is\ninversely related to DSO. A decrease in AR turnover indicates that fewer collections are made over a set period, which indicates an increase in\nthe DSO in each collection cycle.\nThings to remember:\nThe operating cycle (OC) measures the time required to convert inventory to cash. The OC consists of days of inventory on hand (DOH) and days\nof sales outstanding (DSO). A company can offset an increase in DOH with a decrease in DSO in order to reduce the overall impact to OC.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 15, "q": "A consultant is evaluating several companies and has collected the following information for the fiscal year: Which company has the best accounts receivable turnover? ", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "A", "expl": "The accounts receivable (AR) turnover ratio measures the number of times, on average, accounts receivable is generated by credit sales and\ncollected as cash during a fiscal period. Credit sales occur when companies allow customers to defer sales invoice payments for a short period of\ntime (commonly 30-60 days). Companies then record the amount owed from the customers as AR.\nA higher AR turnover ratio implies greater efficiency in converting receivables to cash and indicates better liquidity. This efficiency can result from\na firm's effectiveness in receivables collection or from its credit-extension policies (eg, granting trade discount incentives for early payment).\nAR turnover for the three companies are as follows:\nCompany 1 has the highest AR turnover ratio of 3.64, which means that it is the most efficient in collecting its AR among the three companies.\n(Choice B) Company 2 has collected on its AR 2.50 times on average during the year. This means that it was less efficient than Company 1 at\nconverting receivables to cash.\n(Choice C) Company 3 has collected on its AR 3.04 times on average during the year. This means that it was less efficient that Company 1 at\nconverting receivables to cash.\nThings to remember:\nThe accounts receivable (AR) turnover ratio is calculated by dividing credit sales by average AR. A higher AR turnover ratio indicates higher\nefficiency in a company's credit collections.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 16, "q": "Which of the following factors is most likely considered a drag rather than a pull on a company's liquidity position?", "opts": ["Central bank tightening credit", "Accelerating payments to vendors", "Lenders reducing company credit lines"], "ans": "A", "expl": "A company's liquidity position measures its ability to generate cash to meet its short-term obligations. Factors influencing a liquidity position are\ndescribed as:\npulls, which make cash flows going out larger and/or faster (eg, paying accounts payable more rapidly), or\ndrags, which make cash flows coming in smaller and/or slower (eg, collecting accounts receivable more slowly).\nCentral bank credit tightening is a drag on liquidity since tighter credit implies capital is both less available and more expensive, slowing access to\ncapital inflows.\n(Choice B) Accelerating payments to vendors is an increasing pull on liquidity, as cash flows out of the company more quickly. Companies\ntypically do not meet payables before the due date to minimize these pulls. However, companies sometimes pay early to receive discounts or to\nmove recognition of the expense to an earlier tax year.\n(Choice C) Lenders reducing credit lines is a pull on liquidity since a credit line's balance must be paid down more often to keep it below a lower\ncredit limit.\nThings to remember:\nPulls are factors that may accelerate the draining of liquidity from a company. Drags are factors that may slow the flow of liquidity into a company.\nCentral bank credit tightening is a drag on liquidity since tight credit implies capital is both less available and more expensive.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 17, "q": "Which of the following events most likely creates a drag on liquidity for a business?", "opts": ["A supplier has reduced credit limits for purchases made by the business.", "Tightened credit conditions have raised the borrowing costs on new short-term loans.", "A bank has requested a partial repayment on a line of credit after a covenant violation."], "ans": "B", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nBusinesses manage liquidity by managing cash inflows and outflows effectively in the near term. Certain events may drain liquidity through drags\nand pulls. A drag on liquidity generally refers to a slowdown in cash inflows. A pull on liquidity generally refers to an acceleration in cash\noutflows. Both pulls and drags reduce a company's available cash balance.\nA rise in borrowing costs is considered a drag since higher interest rates make obtaining new commercial loans more costly and difficult. Less\nborrowing reduces a company's inflow of funds.\n(Choice A) When suppliers reduce credit limits on purchases, it forces businesses to make payments earlier. This creates a pull on liquidity by\nspeeding up cash outflows.\n(Choice C) A repayment on the amount drawn from a line of credit represents a pull on liquidity since it requires a cash outflow.\nThings to remember:\nBusinesses manage liquidity by managing cash inflows and outflows effectively in the near term. A drag on liquidity generally refers to a slowdown\nin cash inflows. A pull-on liquidity generally refers to a speedup in cash outflows.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 18, "q": "Companies can most likely shorten their cash conversion cycle and generate funds internally by increasing days of:", "opts": ["inventory.", "accounts payable.", "accounts receivable."], "ans": "B", "expl": "Companies can generate funds internally from current assets and liabilities by:\nliquidating current assets,\nincreasing cash inflow from operations, and\nimproving working capital efficiency.\nWorking capital efficiency is improved when the amount of time that operations need cash financing is minimized. This occurs when the time\nrequired to receive cash from customers is reduced and the time for paying cash to creditors is extended. A common indicator of working capital\nefficiency is the cash conversion cycle. This cycle measures the number of days it takes to convert goods purchased from suppliers into cash\nfrom customers, starting from date of payment to suppliers. Firms seek to shorten their cash conversion cycle by:\nincreasing trade creditor days,\ndecreasing the inventory holding period, and\ndecreasing the accounts receivable collection period.\nIncreasing trade creditor days means that a company can finance more of its operations with financing from suppliers (ie, trade credit) instead of\nthe company's own cash. A company can generate internal financing by extending the period between its inventory purchases and the date when\npayment is due to suppliers. This allows the company to retain its cash for a longer period.\n(Choice A) Increasing days of inventory means goods take longer to sell (ie, inventory takes longer to generate cash).\n(Choice C) Increasing days of accounts receivable means the company takes longer to receive cash from sales made on credit.\nThings to remember:\nCompanies can generate funds internally by improving their working capital efficiency through shorter cash conversion cycles. This can be\nachieved by shortening the period between inventory purchases and cash collection from customers, and/or extending the period between\ninventory purchases and payment to suppliers.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 19, "q": "All else being equal, which of the following events most likely improves a company's liquidity position?", "opts": ["Inventory decreases relative to sales", "Accounts receivable increase relative to sales", "Accounts payable decrease relative to inventory"], "ans": "A", "expl": "A company's liquidity position measures its ability to generate cash to meet its short-term obligations. Factors influencing a liquidity position are\ndescribed as:\npulls, which make cash flows going out larger and/or faster (eg, high payables turnover), or\ndrags, which make cash flows coming in smaller and/or slower (eg, low receivables turnover and/or low inventory turnover).\nA company's liquidity position improves if pulls and drags are reduced and worsens if pulls and drags increase.\nIf a company's inventory is declining relative to sales, the company's inventory turnover ratio increases since its inventory is selling faster. All\nelse being equal, inventory is converted to cash more rapidly, reducing a liquidity drag, which improves liquidity.\n(Choice B) All else constant, if accounts receivable increase relative to sales, the average time to collect receivables has increased. This is an\nincreased drag and indicates worsening of liquidity.\n(Choice C) All else constant, if accounts payable decrease relative to inventory, on average accounts payable are being paid faster. This is an\nincreased pull, which worsens liquidity.\nThings to remember:\nPulls relate to factors \"pulling\" liquidity out of a company. Drags relates to the speed of liquidity flowing into a company. Increased pulls and drags\nworsen liquidity. Reduced pulls and drags improve liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 20, "q": "A company has short-term liquidity needs of €50 million. The following sources of liquidity are available: Liquidity source (€ millions) Accounts payable with terms of 2/10 net 60 25 Accounts receivable sold to a factor at a 40 3.5% discount Bonds with a 3% liquidation cost 30 To cover the company's liquidity needs at the lowest cost, which of the following strategies would least likely be useful?", "opts": ["Sell bonds", "Delay accounts payable", "Sell accounts receivable"], "ans": "C", "expl": "Companies typically have access to many choices for short-term funding, including internal and external sources (eg, credit line). Mismanaging\nshort-term funding can result in paying higher costs or experiencing a shortage of funds. When managing liquidity, a company should ensure that:\navailable sources of funding are sufficient to meet cash needs, especially peak cash needs, and\nthe cost of these sources is not excessive relative to market averages.\nIn this scenario, since the company needs more funding than is available from any one source, it will need to use at least two of these sources.\nThe terms of 2/10 net 60 indicate that the company can use accounts payable as a 60-day funding source or earn a 2% discount if payment is\nmade within 10 days. Thus, ranking the costs of funding sources from lowest to highest:\ndelaying accounts payable costs 2% (ie, forgoing a 2% discount),\nliquidating bonds costs 3%, and\nselling accounts receivable to a factor (ie, factoring receivables) costs 3.5%.\nSince liquidating accounts receivable has the highest cost, the other two sources would be more useful for this company to fulfill its needs at\nminimal cost (Choices A and B).\nThings to remember:\nCompanies must evaluate a range of short-term funding sources to ensure access to sufficient liquidity that meets cash needs (eg, peak cash\nneeds) at a reasonable cost. Mismanaging short-term funding can result in paying higher costs or experiencing a shortage of funds.\nDescribe issuers’ objectives and compare methods for managing working capital and liquidity", "qhtml": null}, {"n": 21, "q": "An analyst is evaluating several companies and has compiled the following information: From 20X1 to 20X2, which company improved the most in days sales outstanding?", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "C", "expl": "Days sales outstanding (DSO), sometimes referred to as days in receivables, calculates the number of days, on average, for a company to\ncollect cash from its customers after sales are made on credit. It measures how quickly a company converts its receivables into cash.\nFaster collection of receivables results in a lower DSO, and this enhances a company's liquidity. By contrast, a higher DSO indicates that\ncustomers are too slow to pay invoices or that the company has poor credit extension policies (eg, not granting trade discount incentives for early\npayment), both of which can act as a drag on liquidity.\nIt is helpful to gauge a company's DSO performance by comparing it across time, to that of the industry average, or to peers.\nCompany 3 showed the most improvement from the previous year. It reduced its DSO by 2.4 days, meaning that it collected its receivables, on\naverage, 2.4 days faster than it did for the previous year.\n(Choice A) Company 1 took 5.0 days longer, on average, to collect its receivables compared to its performance the prior year.\n(Choice B) Although Company 2 improved its DSO from the previous year (−0.3 days), the improvement was less than that of Company 3.\nThings to remember:\nDays sales outstanding (DSO) represents the average length in days for a company to collect its receivables following its sales. A smaller DSO\nvalue can improve a company's liquidity position.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 22, "q": "A firm increasing its number of days of payables will most likely experience:", "opts": ["fewer days in the cash conversion cycle .", "the same number of days in the cash conversion cycle.", "more days in the cash conversion cycle."], "ans": "A", "expl": "The cash conversion cycle (CCC), or net operating cycle (OC), measures the number of days between a company's disbursement of cash to\nsuppliers and receipt of cash from customers. The CCC is equal to the difference between the OC and days payable outstanding (DPO).\nThe OC measures the time required to convert raw inventory to cash from sales. The company first needs time to sell inventory (measured in\nnumber of days of inventory) and then needs time to collect cash from those sales (measured in number of days of receivables). However, the OC\ndoes not consider the cash benefits from delaying time to pay suppliers (measured in DPO).\nThe DPO measures the average number of days to pay suppliers. The effect of changes in DPO is reflected in the CCC. When a company\nsaves cash by delaying payments, it extends its DPO, which reduces (improves) its CCC.\nThings to remember:\nThe cash conversion cycle (CCC) measures the number of days between a company's disbursement of cash to suppliers and receipt of cash from\ncustomers. The CCC is equal to the difference between the operating cycle and the number of days of payables. Extending the DPO reduces\n(improves) the CCC.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 23, "q": "Which of the following factors will most likely result in a pull, rather than a drag, on a company's liquidity position?", "opts": ["Accelerating payments to suppliers", "Increasing levels of obsolete inventory", "Slower collection of accounts receivable"], "ans": "A", "expl": "A company's liquidity position measures its ability to meet short-term cash flow needs. Both pulls (ie, faster cash outflows) and drags (ie,\nslower cash inflows) weaken a company's liquidity position.\nPulls include:\naccelerating payments to suppliers.\nspending more cash for inventory due to cuts in vendor credit.\nDrags include:\nless sales due to inventory obsolescence (Choice B).\nslower collection of accounts receivable (Choice C).\nThings to remember:\nA company's liquidity position is a measure of its ability to meet short-term cash flow needs. Both pulls (ie, faster cash outflows) and drags (eg,\nslower cash inflows) weaken a company's liquidity position.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 24, "q": "An analyst gathers the following information about three companies: Company X Company Y Company Z Days of inventory on hand 70 72 68 Days of sales outstanding 35 37 35 Days of payables outstanding 27 13 22 The company with the shortest cash conversion cycle is most likely: ", "opts": ["Company X.", "Company Y.", "Company Z."], "ans": "A", "expl": "A cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers for the materials used to make those goods.\nThe CCC is the sum of the average number of days needed to sell a company's inventory (DOH) and the average number of days needed to\ncollect receivables (DSO), minus the average number of days needed to pay suppliers (DPO). The DPO is subtracted because deferring\npayments to suppliers allows the company to hold cash longer. The lower the CCC, the faster the company turns the purchase of materials into\ncash.\nIn this scenario, the three companies' CCCs are calculated as follows:\nCompany X Company Y Company Z\nDOH 70 72 68\n+DSO 35 37 35\n−DPO 27 13 22\nCCC 78 96 81\nCompany X has the shortest CCC, 78 days.\n(Choice B) Selecting Company Y results from incorrectly adding DPO instead of subtracting it.\n(Choice C) Selecting Company Z results from calculating the operating cycle instead of the CCC. The operating cycle is the sum of DOH and\nDSO, and it excludes DPO.\nThings to remember:\nA cash conversion cycle (CCC) is the number of days needed to turn a company's purchase of materials from suppliers to cash from the sale of\ngoods produced by those materials. The CCC is the sum of the average number of days needed to sell the inventory and the average number of\ndays needed to collect receivables, minus the average number of days needed to pay suppliers.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 25, "q": "An analyst gathers the following data for a company: Based on this information, the accounts receivable turnover is closest to:", "opts": ["3.3", "4.0", "4.5"], "ans": "B", "expl": "Accounts receivable (AR) turnover measures the number of times, on average, that AR are generated by credit sales and collected as cash\nover a period. AR turnover indicates management's effectiveness in managing credit given to customers. Higher AR turnover implies greater\nefficiency in converting receivables to cash and indicates better liquidity.\nAR turnover is calculated as credit sales for the period divided by average receivables. In this case, AR turnover is closest to 4.0.\n(Choice A) 3.3 results from dividing cost of goods sold, not credit sales, by average receivables.\n(Choice C) 4.5 results from dividing credit sales by ending accounts receivable, not average receivables.\nThings to remember:\nAccounts receivable (AR) turnover measures the number of times, on average, that AR are generated by credit sales and collected as cash over a\nperiod. AR turnover is calculated as credit sales for the period divided by average receivables. A higher AR turnover ratio implies greater\nefficiency in converting receivables to cash and indicates better liquidity.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}];
const CFG = {"title": "Wiley · Working Capital and Liquidity", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Corporate Issuers · 25 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
