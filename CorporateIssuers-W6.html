<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following companies will most likely employ the greatest amount of debt relative to its equity?", "opts": ["A real estate developer during its initial growth phase", "A cyclical car manufacturer during an economic downturn", "A consulting firm that uses highly paid consultants and few physical assets"], "ans": "A", "expl": "A firm will typically increase the proportion of debt in its capital structure as it matures through its life cycle. In early (ie, start-up) stages,\nbusinesses have very limited access to debt due to high operating risk and unstable cash flows. In general, as a business gradually matures,\nmore funds can be borrowed since increased revenues and stable cash flows are opening the firm to more potential lenders. However, there are\nexceptions to this tendency for capital-intensive, capital-light, and cyclical businesses.\nCapital-intensive firms (eg, companies operating in real estate, utilities, or transportation) require relatively high levels of debt financing to\npurchase fixed assets during any stage of the life cycle. For example, a real estate developer would most likely have a lot of debt, even in its\nearly stages.\nCapital-light firms (eg, consulting firms, software companies) have fewer capital expenditures. Such companies often require little debt\nfinancing throughout the life cycle (Choice C).\nCyclical firms (eg, car manufacturers, mining companies) have more volatile revenues and cash flows that fluctuate with economic cycles. This\nvolatility reduces their debt capacity, especially during an economic downturn (Choice B).\nThings to remember:\nGenerally, firms will borrow more funds as they mature and thus have proportionately more debt in their capital structure. However, exceptions to\nthis tendency exist for capital-intensive, capital-light, and cyclical businesses.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 2, "q": "Analysts most appropriately use the company's weighted average cost of capital to determine a project's:", "opts": ["value.", "future cash flows.", "investment opportunity schedule."], "ans": "A", "expl": "A company's weighted average cost of capital is the rate the company pays for new capital to fund new projects, which typically require cash\noutflows to generate cash inflows. Inflows and outflows may occur throughout the project's life. The project's value is the net present value of\nits cash inflows and outflows. The discount rate used to find that the present value is the WACC. Therefore, analysts use the WACC to\ncalculate a project's value.\n(Choice B) A project's future cash flows are estimated by making assumptions about the project's need for cash (ie, outflows) and its ability to\ngenerate cash (ie, inflows). The WACC is then used to discount those cash flows to find the project's net present value.\n(Choice C) The investment opportunity schedule (IOS) is a graph of all the company's projects ranked from highest to lowest return against the\ncumulative amount of new capital needed for each project. A company's WACC does not determine the IOS.\nThings to remember:\nA company's weighted average cost of capital (WACC) is the rate the company pays for new capital to fund new projects, which typically require\ncash outflows to generate cash inflows. The project's value is the net present value of its cash inflows and outflows. The discount rate used to\nfind that present value is the WACC, so analysts use the WACC to find a project's value.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 3, "q": "An analyst wants to calculate a company's weighted average cost of capital (WACC) and compiles the following data: Weight of debt 20% Market yield on similar BBB debt 8% Corporate tax rate 30% Weight of preferred stock 10% Preferred dividend £2.00 Preferred stock share price £40.00 Weight of common stock 70% Last common dividend £1.90 Expected common dividend £2.00 Common dividend growth rate 5% Common stock share price £50.00 The analyst believes that the company's debt should be rated BBB. If the analyst uses the debt-rating approach to calculate the cost of debt and the dividend discount model (DDM) approach to calculate the cost of equity, the WACC is closest to:", "opts": ["7.79%", "7.92%", "8.40%"], "ans": "B", "expl": "The weighted average cost of capital (WACC) for a company is the weighted average cost of the different sources of capital. Suppliers of capital\nrequire risk-adjusted returns. The most common sources of capital include equity, preferred stock, and debt.\nCalculate costs of each capital source:\nInsert variables to calculcate WACC:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n4.All else equal, if a firm maintains a larger proportion of equity in its actual capital structure than in its target structure, the most likely reason is\nthat:\nA. the stock is currently trading at a historic low price.\n B. the stock will be included in an index once it reaches a greater market capitalization.\nC. management is raising capital for an infrastructure project that produces stable cash flows.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nA firm's stated capital structure (ie, mix of debt and equity) policy is often based on how much debt the firm can assume. Mature companies\ntypically prefer to issue debt since debt is cheaper than equity and its market value is more predictable. Debt such as tax shields (from interest\ndeductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of financial distress and bankruptcy.\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. At this optimal ratio of debt to equity,\nthe difference between the expected benefits and costs of debt is maximized.\nIn reality, capital structures often deviate from their optimal targets for the reasons shown in the table above. For example, investors may\ndesire an increase in a company's market cap to satisfy index listing requirements. In response, the company may issue more public equity, which\ncan cause the actual capital structure to deviate from the target.\n(Choice A) Firms tend to issue equity when the share price is high, not low. When the share price is low, the proceeds from the issuance will also\nbe low.\n(Choice C) The type of capital raised for a project depends largely on the project's nature. An infrastructure project with stable cash flows is well\nsuited to servicing debt, so the firm in this instance would more likely increase the proportion of debt, not equity, in its capital structure.\nThings to remember:\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from their\ntarget capital structures. A firm may issue more equity to have its stock listed in an index, causing a deviation from the target capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 4, "q": "All else equal, if a firm maintains a larger proportion of equity in its actual capital structure than in its target structure, the most likely reason is that:", "opts": ["the stock is currently trading at a historic low price.", "the stock will be included in an index once it reaches a greater market capitalization.", "management is raising capital for an infrastructure project that produces stable cash flows."], "ans": "B", "expl": "Reasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nA firm's stated capital structure (ie, mix of debt and equity) policy is often based on how much debt the firm can assume. Mature companies\ntypically prefer to issue debt since debt is cheaper than equity and its market value is more predictable. Debt such as tax shields (from interest\ndeductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of financial distress and bankruptcy.\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. At this optimal ratio of debt to equity,\nthe difference between the expected benefits and costs of debt is maximized.\nIn reality, capital structures often deviate from their optimal targets for the reasons shown in the table above. For example, investors may\ndesire an increase in a company's market cap to satisfy index listing requirements. In response, the company may issue more public equity, which\ncan cause the actual capital structure to deviate from the target.\n(Choice A) Firms tend to issue equity when the share price is high, not low. When the share price is low, the proceeds from the issuance will also\nbe low.\n(Choice C) The type of capital raised for a project depends largely on the project's nature. An infrastructure project with stable cash flows is well\nsuited to servicing debt, so the firm in this instance would more likely increase the proportion of debt, not equity, in its capital structure.\nThings to remember:\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from their\ntarget capital structures. A firm may issue more equity to have its stock listed in an index, causing a deviation from the target capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 5, "q": "Based on the pecking order theory, when a company issues equity, management is most likely signaling that:", "opts": ["the stock is overvalued.", "the company can pay larger dividends.", "they have confidence in meeting future commitments."], "ans": "A", "expl": "Information asymmetry arises from the fact that a company's managers know more about the company and its prospects than the company's\ninvestors. Investors realize this and try to interpret signals based on how management conducts the business, including raising capital.\nThe pecking order theory suggests that managers prefer to raise capital through methods that require the least amount of disclosure, thus\nproviding investors with the least amount of information necessary. Based on this theory, issuing equity is the least preferred method since it\nrequires significant disclosure and is scrutinized by investors. Equity issues may indicate that managers believe:\nthe company's prospects are not encouraging. If prospects were better, managers would hesitate to dilute their ownership.\nthe stock is overvalued and therefore a good form of financing to fund projects or acquisitions. Managers would be reluctant to issue stock if\nthey thought it was undervalued.\n(Choice B) The pecking order theory does not link the method of financing to dividend payments. However, since equity issues indicate future\nprospects are not encouraging, they are unlikely to indicate that the company can pay larger dividends.\n(Choice C) The issuance of debt would indicate that management has confidence in meeting future commitments since additional debt commits\nthe company to future obligations.\nThings to remember:\nThe pecking order theory suggests that managers prefer raising capital through methods that provide investors with the least amount of\ninformation necessary. Issuing equity is the least preferred method since it indicates to investors that management believes the company's\nprospects are not encouraging or that the stock is overvalued.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 6, "q": "According to the Modigliani-Miller propositions (with taxes), if a company increases its debt level, its market value will most likely:", "opts": ["decrease since the costs of financial distress are increasing.", "remain the same since the market value is unaffected by the capital structure.", "increase proportionally to the change in debt."], "ans": "C", "expl": "The Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no transaction or bankruptcy costs, and symmetric\ninformation) and assert that a company's market value equals the present value of its future cash flows. Modigliani and Miller propose that, in the\nabsence of taxes:\nA company's capital structure does not affect its value (MM I without taxes); and\nA company's cost of equity (r ) is directly proportional to its debt-to-equity ratio (D/E), but WACC remains constant (MM II without taxes).\ne\nHowever, these propositions change when there are corporate taxes:\nThe market value of a levered company is greater than the value of an unlevered but otherwise identical company; tax-exempt interest\npayments improve the levered company's cash flows, increasing its value. The difference in value is the amount of the debt tax shield (tD),\nwhich is the product of a company's tax rate (t) and value of debt (D) (MM I with taxes).\nA company's r is directly proportional to D/E, adjusted by (1 − t). Greater leverage will increase the cost of equity, but at a slower pace\ne\ndue to taxes. The greater the tax rate (t), the slower the increase in r when D/E increases (MM II with taxes).\ne\nTherefore, with taxes, an increase in debt will proportionally increase a company's value and reduce its WACC.\n(Choice A) The MM propositions assume no cost of financial distress.\n(Choice B) The market value would remain the same in the absence of taxes.\nThings to remember:\nThe Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no transaction or bankruptcy costs, and symmetric\ninformation). When these propositions include corporate taxes, greater leverage will increase a company's market value (MM I) and reduce its\nWACC (MM II).\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 7, "q": "A company is evaluating two projects. Project A has an IRR of 6.4%, and Project B has an IRR of 7.5%. The company has the following information: Next year's dividend ¥40 Dividend growth rate 2.5% Stock price ¥500 After-tax cost of debt 5.0% Debt-to-equity ratio 80% Assuming average risk and no capital constraints, the company should most likely invest in:", "opts": ["both projects.", "only Project B.", "neither project."], "ans": "C", "expl": "A company's weighted average cost of capital (WACC) measures its cost to raise additional capital, assuming new projects are funded by the\nsame proportions of capital. WACC is often used to evaluate the potential profitability of new projects. When projects have average risk, an\ninternal rate of return (IRR) that is less (greater) than the company's WACC means the project is deemed unprofitable (profitable) since its\nreturn is less (greater) than the company's opportunity cost of capital.\nIn this question, to calculate the WACC the cost of equity component must be derived via the Gordon growth model, then the weights of debt and\nequity must be derived from the company's debt-to-equity (D/E) ratio. This can be done as follows:\nThe company's WACC is 8.06%. Since both projects have IRRs that are less than the company's WACC, the company should invest in neither\nproject.\n(Choice A) The company would invest in both projects if the D/E ratio were misinterpreted as the percentage of the company's capital financed by\ndebt when calculating the WACC. This would result in a WACC of 6.1%.\n(Choice B) The company would invest only in Project B if the dividend growth rate were not added to (D /V ) when calculating the cost of equity\n1 0\n(8%). This would result in a WACC of 6.67%.\nThings to remember:\nA company's weighted average cost of capital (WACC) measures its cost to raise additional capital. When projects have average risk, an internal\nrate of return (IRR) less than the company's WACC means the project is deemed unprofitable since its return is less than the company's\nopportunity cost of capital.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 8, "q": "If senior management is compensated with stock options, that would most likely provide an incentive for it to pursue which of the following strategies?", "opts": ["Decrease leverage", "Practice risk avoidance", "Increase share buybacks"], "ans": "C", "expl": "Companies have many stakeholder groups, each with its own priorities and concerns. The groups may be affected differently by company actions,\nwhich can put various stakeholders at odds with each other.\nDifferent compensation structures are used to align management's interests with the interests of shareholders (ie, to maximize wealth), but can\nsometimes have the opposite effect. These include paying out bonuses in shares or stock options based on company performance.\nStock options are assumed to align management and shareholder interests since, in effect, they turn managers into shareholders. Options are in\nthe money (ie, have an intrinsic value) when the market price exceeds the options' exercise price; this provides an incentive for management to\nincrease a company's value and thus increase the market price.\nShare price is also affected by changes in capital structure. In a share buyback, management uses available cash to reduce the number of\noutstanding shares, which increases the price per share since total company value is unchanged. Stock options would encourage\nmanagement to buy back outstanding shares even when they are overvalued, directing funds away from projects that could increase value for\nshareholders.\n(Choice A) Compensation with stock options would motivate management to add more debt to amplify returns. Default risk would also increase,\nwhich is not in shareholders' interests.\n(Choice B) Stock option holders, like shareholders, have limited downside risk, so managers have no incentive to practice risk avoidance.\nThings to remember:\nDifferent compensation structures are used to align the interests of management with the interests of shareholders, but some structures can have\nthe opposite effect. Stock options are used to link compensation to company performance but may incentivize management to take unjustifiable\nactions (eg, buying back outstanding shares, increasing leverage) that increase the stock price.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 9, "q": "An analyst reviews the following information about a company: Cost of Capital Target (Pretax) Weight Debt 8% 30% Preferred stock 9% 20% Common equity 14% 50% If the company's tax rate decreases from 25% to 20%, then the company's weighted average cost of capital will be closest to:", "opts": ["10.36%", "10.72%", "10.83%"], "ans": "B", "expl": "When a company uses debt it incurs interest expense, which lowers taxable income and tax expense. This creates a benefit of using debt that\npartially offsets the cost of debt, so that the after-tax cost of debt [r (1 − t)] is less than the pretax cost of debt.\nd\nThe WACC formula can be used to find the company's WACC with a lower tax rate:\n(Choice A) 10.36% results from incorrectly applying an after-tax rate on the cost of preferred stock. Taxes do not affect the cost of preferred\nstock.\n(Choice C) 10.83% results from incorrectly using the higher tax rate of 25%, not the new lower tax rate of 20%.\nThings to remember:\nWhen a company uses debt it incurs interest expense, which lowers taxable income and tax expense. This creates a benefit from using debt that\npartially offsets the cost of debt. To calculate WACC, use the after-tax cost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 10, "q": "According to pecking order theory, the sources of capital from least to most attractive are:", "opts": ["bonds, common stock, net operating cash flows.", "common stock, bonds, net operating cash flows.", "common stock, net operating cash flows, bonds."], "ans": "B", "expl": "Pecking order theory suggests that companies' managements choose sources of capital based on the required information disclosures and\npotential information signaling effects. In general, lower disclosure requirements and less potential for signaling make a particular source of\ncapital more attractive.\nPecking order theory implies that management will:\nrely entirely on internally generated funds (ie, net operating cash flows) if they are adequate to meet the firm's financing needs,\nissue debt (eg, bonds) only when internally generated funds prove inadequate for funding all desired activities, and\nissue equity (eg, common stock) only after the other sources of funding have been fully exploited.\nThis hierarchy reflects a preference for using the available funding source that requires the least amount of information disclosure. Based on the\nrequired disclosures, the ranking of sources of capital from least to most attractive is common stock, debt, and internally generated funds\n(Choices A and C).\nThings to remember:\nPecking order theory suggests that, in general, lower disclosure requirements and less potential for signaling make a particular source of capital\nmore attractive. Therefore, equity is the least attractive source since it requires the most disclosure, internally generated funds are the most\nattractive since there are no required disclosures, and debt ranks in the middle.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 11, "q": "An analyst gathers the following information about a profitable company's target costs of capital: Selected Financial Data Cost of equity 16% Pretax cost of debt 8% Weighted average cost of capital (WACC) 12% The company has no other sources of capital. All else being equal, if its tax rate changes from 25% to 40%, its new WACC will be closest to:", "opts": ["9.60%", "11.52%", "12.34%"], "ans": "B", "expl": "When a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) using debt that partially offsets the cost of debt, such that:\nthe after-tax cost of debt [r (1 − t)] < the pretax cost of debt (r ).\nd d\nAll else equal, a higher (lower) tax rate creates a greater (smaller) benefit and decreases (increases) the after-tax cost of debt. Since an\nincrease in the tax rate decreases the cost of debt, it decreases the weighted average cost of capital (WACC). In this question, the increase in the\ntax rate means that WACC can only decrease, not increase, so 12% represents the highest possible WACC (Choice C).\nw w\nTo solve for the WACC when the tax rate is 40%, first calculate the weights of debt ( d) and equity ( e by using the WACC formula with the\nw + w w w\nexisting tax rate of 25%. Since the company has no preferred stock, d e = 100% and d = 1 − e:\nCalculations Steps\nWACC = (1 − w )r (1 − t) + w r Modify the WACC formula\ne d e e\n0.12 = (1 − w ) 0.08(1 – 0.25) + w 0.16 Use given information\ne e\n0.12 = 0.06 – 0.06w + w 0.16 Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 – 0.60) = 0.40 Solve for the weight of debt\nd\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again, but with the higher tax rate of 40%.\nThe decrease in the company's WACC from 12.00% to 11.52% is solely due to a higher tax rate.\nWACC = (0.4)(0.08)(1 − 0.4) + (0.6)(0.16)\n= 0.0192 + 0.096\n= 11.52%\n(Choice A) 9.60% is the WACC if the weight of equity and debt are the same (50%). This would be the case if 8% were the after-tax cost of debt.\nThings to remember:\nAll else equal, a higher (lower) tax rate creates a greater (smaller) tax shield and decreases (increases) the net cost of debt. Since a change in\nthe tax rate affects the cost of debt, it also affects the WACC.\nCalculate and interpret the weighted-average cost of capital for a company\n12. Which of the following types of capital is most likely to have an after-tax cost that is less than its before-tax cost?\n A. Debt\nB. Common stock\nC. Preferred stock\nExplanation\nComponent cost of capital is the cost associated with each source of external capital (eg, debt, common stock, preferred stock). Interest\nexpense is related to debt and can reduce tax expense (see modified income statement below) by lowering taxable income (ie, pretax income),\nthus creating tax savings.\nMany companies pay dividends to preferred and common stock investors. Unlike interest, dividends are not tax-deductible and cannot reduce the\ncost of common stock and preferred stock through tax savings (Choices B and C).\nThings to remember:\nDividends on preferred stock and common stock are not tax-deductible; conversely, interest on debt is tax-deductible, resulting in lower after-tax\ncost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 12, "q": "Which of the following types of capital is most likely to have an after-tax cost that is less than its before-tax cost?", "opts": ["Debt", "Common stock", "Preferred stock"], "ans": "A", "expl": "Component cost of capital is the cost associated with each source of external capital (eg, debt, common stock, preferred stock). Interest\nexpense is related to debt and can reduce tax expense (see modified income statement below) by lowering taxable income (ie, pretax income),\nthus creating tax savings.\nMany companies pay dividends to preferred and common stock investors. Unlike interest, dividends are not tax-deductible and cannot reduce the\ncost of common stock and preferred stock through tax savings (Choices B and C).\nThings to remember:\nDividends on preferred stock and common stock are not tax-deductible; conversely, interest on debt is tax-deductible, resulting in lower after-tax\ncost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 13, "q": "According to pecking order theory, the relative attractiveness of different sources of capital is most likely based on:", "opts": ["agency costs.", "priority of claims.", "information asymmetries."], "ans": "C", "expl": "Pecking order theory proposes that required information disclosure determines the relative attractiveness of different sources of capital.\nManagement would prefer to generate funds:\n1. internally, since that requires the least amount of information disclosure to investors, rather than\n2. externally, since that requires a greater amount of information disclosure to investors.\nThis theory reflects the presumption that\ncompany management has both public and nonpublic information, while\ninvestors have only public information, and funding decisions thus contain signals.\nFor example, a company would prefer to issue stock when it believes the stock is overvalued, so an equity offering signals that management\nbelieves the stock is overvalued. Since management has more knowledge about the company's prospects, the equity offering reveals information\nabout the stock's value to investors.\nThe sources of financing for company operations determine its capital structure. Many companies have target capital structures based on long-\nrun targets/objectives (eg, minimizing WACC, desired credit rating). However, various factors such as information asymmetries can also affect\nfunding decisions and result in capital structures that differ from the target.\n(Choice A) Agency costs are incurred by principals (eg, shareholders) to monitor the actions of parties acting as the principals' agents (eg,\ncompany managers) due to potential conflicts of interest. Agency costs do not affect pecking order theory.\n(Choice B) Priority of claims, the relative seniority or subordination of claims by creditors and shareholders, is based on contract law and the legal\nsystem, not on pecking order theory.\nThings to remember:\nPecking order theory is based on the presumption that management has more information than investors regarding future performance and that\nraising capital discloses information. Such disclosures can affect management's preferred choice of financing.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 14, "q": "All else being equal, which of the following factors is least likely to cause a company's actual capital structure to diverge from its target capital structure? The company:", "opts": ["generated greater than anticipated operating cash flow.", "refinanced maturing debt at a lower rate to reduce the cost of debt.", "issued equity when management perceived company stock was overvalued."], "ans": "B", "expl": "There are three general sources of funds companies use to finance operations:\nissuing common or preferred stock,\nborrowing (eg, loans, bonds), and\ngenerating cash from operations.\nUltimately, these amounts are reflected on balance sheets as debt or equity. The proportional split between the amounts of debt and equities is a\ncompany's capital structure.\nAlthough many companies have a target capital structure, various factors influence a company's reliance on different funding sources and may\nresult in the actual capital structure not matching the target. However, refinancing maturing debt at a lower interest rate does not change the\ncapital structure since the amount of debt is unchanged. All else equal, reducing the interest rate on debt lowers the company's WACC, but it\nwould not alter the company's capital structure.\n(Choice A) Greater than anticipated net operating cash flow results in cash in excess of amounts budgeted for other purposes (eg, debt\nretirement, investments). All else equal, this increases equity capital, raising it above the targeted proportion of the capital structure.\n(Choice C) A company may opportunistically issue equity securities if management perceives its common stock is overpriced. For a company\noperating at its target capital structure, issuing additional shares increases equity above the targeted proportion of the capital structure.\nThings to remember:\nFunding decisions are reflected in a company's capital structure. Many companies have a target capital structure, but various factors may result in\nactual capital structures not matching the target. However, all else equal, refinancing maturing debt with lower-cost debt does not change a\ncompany's capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 15, "q": "A company's current financial information includes the following data: Unlevered value (AUD millions) 1.75 Debt (AUD millions) 0 Cost of equity (%) 8 Tax rate (%) 30 If the company borrows AUD 1 million at a rate of 4% for a stock buyback, then after the buyback and based on the Modigliani-Miller propositions (with taxes), the company's WACC is closest to:", "opts": ["5.71%", "6.83%", "8.00%"], "ans": "B", "expl": "The Modigliani-Miller (MM) propositions hold that, assuming perfectly efficient capital markets, a company's value and WACC are unaffected by\ncapital structure changes. However, if the perfectly efficient market assumption is relaxed to acknowledge corporate taxes, all else equal, then\naccording to the MM propositions:\nThe market value of a levered company is greater than that of an unlevered but otherwise identical company due to the debt tax shield.\nSince the value of the levered company is greater, its WACC must be lower.\nThe cost of equity moves in proportion to the levered company's tax-adjusted D/E ratio.\nIn this case, the company currently has no debt, so its WACC equals the cost of equity. After adding leverage, the company's WACC is calculated\nas follows:\nThe levered WACC is approximately 6.83%. All else equal, with leverage, the company's WACC is less than its unlevered WACC (8.00%); the\nbenefit of the tax shield increases the company's value, decreasing its WACC (Choice C).\n(Choice A) 5.71% is the result of using the company's unlevered value to find the levered cost of equity.\nThings to remember:\nThe Modigliani-Miller propositions hold that, in perfectly efficient capital markets, capital structure does not affect a company's value. All else\nequal, if taxes are considered, a levered company likely has a greater value, greater cost of equity, and lower WACC than an unlevered but\notherwise identical company.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 16, "q": "An analyst has compiled the following data for a company: Selected Financial Data Stock price $100 Most recent annual dividend $2 Dividend growth rate 5% Cost of new debt 8% Tax rate 25% Using the dividend discount model (DDM) approach and assuming a debt-to-equity ratio of 1.5, the company's weighted average cost of capital (WACC) is closest to:", "opts": ["6.40%", "6.44%", "7.64%"], "ans": "B", "expl": "The weighted average cost of capital (WACC) is a company's weighted average after-tax cost of capital from all sources. The most common\nsources of capital include equity, preferred stock, and debt. The WACC also represents the weighted average required return of all capital\nproviders. In this scenario, the only capital sources are debt and common equity.\nUse the steps below to calculate WACC:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n17.An analyst gathers the following information about a company with only debt and common equity in its capital structure.\nBased on Target Capital Structure\nCost of common equity 10.0%\nPretax cost of debt 5.0%\nWeighted average cost of capital (WACC) 7.5%\nAll else being equal, if the company's tax rate decreases from 25% to 15%, the company's new WACC will be closest to:\nA. 7.50%\n\nB. 7.70%\nC. 7.83%\nExplanation\nWhen a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) of using debt that partially offsets the cost of debt, such that the after-tax cost of debt [r (1 − t)] is less than the\nd\npretax cost of debt (r ).\nd\nWith all else equal, a lower (higher) tax rate creates a smaller (greater) benefit and increases (decreases) the after-tax cost of debt. Since a\ndecrease in the tax rate increases the after-tax cost of debt, it increases the weighted average cost of capital (WACC). In this question, the\ndecrease in the tax rate means that the WACC can only increase, so the correct answer must be a WACC greater than 7.5%.\nw w\nTo solve for the WACC when the tax rate is 15%, first calculate the weights of debt ( d) and equity ( e) by using the WACC formula with the\nw + w = 100% w = 1 − w\nexisting tax rate of 25%. Since the company has no preferred stock, d e and d e:\nCalculations Steps\nWACC = (1 − w )(r )(1 − t) + w r Modify the WACC formula\ne d e e\n0.075 = (1 − w )(0.05)(1 − 0.25) + 0.10w Use given information\ne e\n0.075 = 0.0375 − 0.0375w + 0.10w Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 − 0.60) = 0.40 Solve for the weight of debt\nd\nWACC = (0.4)(0.05)(1 − 0.15) + (0.6)(0.10)\n= 0.017 + 0.06\n= 0.077, or 7.70%\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again but with a lower tax rate of 15%. The\nincrease in the company's WACC from 7.50% to 7.70% is due solely to a lower tax rate.\n(Choice A) 7.50% is the WACC found by assuming that the weights of debt and equity are each 50%, using the pretax cost of debt. This\nsuggests that there is no tax effect on the cost of debt.\n(Choice C) 7.83% is the WACC found by using the lower tax rate of 15%, not 25%, to determine the weight of debt and equity in the target\nallocation.\nCalculate and interpret the weighted-average cost of capital for a company LOS\n18.All else equal, it would be most attractive for a firm to issue debt instead of equity if:\nA. the stock price is very high.\n\nB. the firm's creditworthiness is about to deteriorate.\nC. the firm is financing the acquisition of a start-up company.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 17, "q": "An analyst gathers the following information about a company with only debt and common equity in its capital structure. Based on Target Capital Structure Cost of common equity 10.0% Pretax cost of debt 5.0% Weighted average cost of capital (WACC) 7.5% All else being equal, if the company's tax rate decreases from 25% to 15%, the company's new WACC will be closest to:", "opts": ["7.50%", "7.70%", "7.83%"], "ans": "B", "expl": "When a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) of using debt that partially offsets the cost of debt, such that the after-tax cost of debt [r (1 − t)] is less than the\nd\npretax cost of debt (r ).\nd\nWith all else equal, a lower (higher) tax rate creates a smaller (greater) benefit and increases (decreases) the after-tax cost of debt. Since a\ndecrease in the tax rate increases the after-tax cost of debt, it increases the weighted average cost of capital (WACC). In this question, the\ndecrease in the tax rate means that the WACC can only increase, so the correct answer must be a WACC greater than 7.5%.\nw w\nTo solve for the WACC when the tax rate is 15%, first calculate the weights of debt ( d) and equity ( e) by using the WACC formula with the\nw + w = 100% w = 1 − w\nexisting tax rate of 25%. Since the company has no preferred stock, d e and d e:\nCalculations Steps\nWACC = (1 − w )(r )(1 − t) + w r Modify the WACC formula\ne d e e\n0.075 = (1 − w )(0.05)(1 − 0.25) + 0.10w Use given information\ne e\n0.075 = 0.0375 − 0.0375w + 0.10w Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 − 0.60) = 0.40 Solve for the weight of debt\nd\nWACC = (0.4)(0.05)(1 − 0.15) + (0.6)(0.10)\n= 0.017 + 0.06\n= 0.077, or 7.70%\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again but with a lower tax rate of 15%. The\nincrease in the company's WACC from 7.50% to 7.70% is due solely to a lower tax rate.\n(Choice A) 7.50% is the WACC found by assuming that the weights of debt and equity are each 50%, using the pretax cost of debt. This\nsuggests that there is no tax effect on the cost of debt.\n(Choice C) 7.83% is the WACC found by using the lower tax rate of 15%, not 25%, to determine the weight of debt and equity in the target\nallocation.\nCalculate and interpret the weighted-average cost of capital for a company LOS\n18.All else equal, it would be most attractive for a firm to issue debt instead of equity if:\nA. the stock price is very high.\n\nB. the firm's creditworthiness is about to deteriorate.\nC. the firm is financing the acquisition of a start-up company.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 18, "q": "All else equal, it would be most attractive for a firm to issue debt instead of equity if:", "opts": ["the stock price is very high.", "the firm's creditworthiness is about to deteriorate.", "the firm is financing the acquisition of a start-up company."], "ans": "B", "expl": "Reasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 19, "q": "Which of the following is correct according to the pecking order theory? Managers prefer:", "opts": ["issuing new equity more than issuing debt.", "issuing debt more than using internal financing.", "using internal financing more than issuing new equity."], "ans": "C", "expl": "In finance, pecking order theory states that managers prefer sources of capital that require the least amount of information disclosure. On a\npreference hierarchy, sourcing capital from:\ninternally generated funds (ie, retained earnings) requires no public disclosure and is most preferred.\npublicly issued equity requires the most disclosure and is least preferred.\nAccording to pecking order theory, a company will typically finance internally if it has sufficient funds. When internal financing is insufficient, the\ncompany will turn to debt (Choice B). From an investor's perspective, a company issuing debt is a positive signal that management is confident\nthat the company can service future debt obligations.\nAt the bottom of the pecking order, a company will finance through issuing new equity, which is a negative signal to investors since the cost of\nequity is the highest (Choice A). Furthermore, companies tend to issue shares when the stock is overvalued but will not do so if the stock is\nundervalued, signaling that management is pessimistic about the company's valuation.\nThings to remember:\nPecking order theory states that managers prefer sources of capital that require the least amount of information disclosure and generate the\nfewest potential signaling effects. The order of preference from most to least preferred is as follows: internal funds, debt, and then equity.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 20, "q": "Information for a company is shown below: Book value of assets $70 million Market value of assets $92.5 million Book value of equity $20 million Market value of equity $30 million Cost of equity 13% Percentage of liabilities that is debt 80% Corporate tax rate 30% If the company's weighted average cost of capital (WACC) is 8.0%, its pretax cost of debt is closest to:", "opts": ["5.0%", "5.7%", "7.1%"], "ans": "C", "expl": "A company's weighted average cost of capital (WACC) is its overall cost of capital. WACC combines the proportion of each component in the\noverall capital structure (ie, \"weight\") with the cost of that component. When calculating WACC, weights are based on the components' market\nvalues, not their book values. The steps demonstrating how to derive the cost of debt are shown below:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n21.A firm uses comparable companies' capital structures to estimate its target capital structure and gathers the following data:\nBook value of debt Market value of debt\nCompany\nto book value of equity to market value of equity\nA 0.8 0.6\nB 0.6 0.2\nC 0.7 0.3\nIf the firm's cost of equity is 11% and its after-tax cost of debt is 7%, the firm's WACC is closest to:\nA. 9.35%\nB. 9.53%\n\nC. 9.93%\nExplanation\nA firm maximizes its value when operating at its optimal capital structure. In practice, this point of maximization is difficult to identify, and a range\nfor leverage is often used when specifying a target capital structure. A firm may operate at its current capital structure in the short run and\ntheoretically achieve its target capital structure in the long run; the firm's WACC would be calculated using the target structure.\nWhen a company's target capital structure is unknown, it can be estimated as:\nthe company's current capital structure,\nan average of comparable companies' capital structures, or\nby examining the company's historical capital structure and management's capital structure policy.\nThe table below demonstrates how to calculate WACC using target weights of debt and equity:\n(Choice A) 9.35% results from incorrectly using the book values of debt and equity when estimating the target capital structure, instead of using\nthe market values.\n(Choice B) 9.53% results from incorrectly using the average debt-to-equity ratio as the weight of debt.\nThings to remember:\nA firm's target capital structure is used to calculate its WACC. The target capital structure can be estimated by calculating the average of\ncomparable companies' current capital structures based on market value weights.\nDescribe optimal and target capital structures\n22.According to Modigliani-Miller Proposition I without taxes, if a company reduces the amount of debt in its capital structure, most likely the\ncompany's:\nA. value will increase.\nB. cost of equity will be unchanged.\n\nC. weighted average cost of capital will be unchanged.\nExplanation\nModigliani-Miller Proposition I (without taxes) assumes a perfectly efficient market (ie, no arbitrage, transaction costs, bankruptcy costs, or\ntaxes) and asserts that a company's market value is the present value of its future cash flows.\nSince markets are perfectly efficient, the cost of capital depends only on risk, so companies with the same risk, regardless of capital\nstructure, should have the same weighted average cost of capital (WACC).\nSince WACC is used as the discount rate in determining present value, companies with the same risk and thus WACC and the same\nprojected cash flows would have the same market value, regardless of capital structure (Choice A).\nIn perfectly efficient markets, investors can create their own leverage; in effect, they create their own optimal capital structure by borrowing to\nfinance investments. Since investors can recreate a company's capital structure—or change it—they put no value on the company by doing so,\nand there is no difference in value due to capital structure.\n(Choice B) Modigliani-Miller's Proposition II (without taxes) asserts that a company's cost of equity is a linear function of its debt-to-equity ratio.\nAlthough WACC is unaffected by changes in capital structure, reducing debt results in a lower cost of equity.\nThings to remember:\nModigliani-Miller Proposition I asserts that without taxes, transaction costs, bankruptcy costs, or arbitrage opportunities, capital structure is\nirrelevant to a company's market value. This means that a company cannot change value solely by changing its capital structure. One implication\nof Proposition I (without taxes) is that a change in capital structure has no effect on a company's WACC.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 21, "q": "A firm uses comparable companies' capital structures to estimate its target capital structure and gathers the following data: Book value of debt Market value of debt Company to book value of equity to market value of equity A 0.8 0.6 B 0.6 0.2 C 0.7 0.3 If the firm's cost of equity is 11% and its after-tax cost of debt is 7%, the firm's WACC is closest to:", "opts": ["9.35%", "9.53%", "9.93%"], "ans": "C", "expl": "A firm maximizes its value when operating at its optimal capital structure. In practice, this point of maximization is difficult to identify, and a range\nfor leverage is often used when specifying a target capital structure. A firm may operate at its current capital structure in the short run and\ntheoretically achieve its target capital structure in the long run; the firm's WACC would be calculated using the target structure.\nWhen a company's target capital structure is unknown, it can be estimated as:\nthe company's current capital structure,\nan average of comparable companies' capital structures, or\nby examining the company's historical capital structure and management's capital structure policy.\nThe table below demonstrates how to calculate WACC using target weights of debt and equity:\n(Choice A) 9.35% results from incorrectly using the book values of debt and equity when estimating the target capital structure, instead of using\nthe market values.\n(Choice B) 9.53% results from incorrectly using the average debt-to-equity ratio as the weight of debt.\nThings to remember:\nA firm's target capital structure is used to calculate its WACC. The target capital structure can be estimated by calculating the average of\ncomparable companies' current capital structures based on market value weights.\nDescribe optimal and target capital structures\n22.According to Modigliani-Miller Proposition I without taxes, if a company reduces the amount of debt in its capital structure, most likely the\ncompany's:\nA. value will increase.\nB. cost of equity will be unchanged.\n\nC. weighted average cost of capital will be unchanged.\nExplanation\nModigliani-Miller Proposition I (without taxes) assumes a perfectly efficient market (ie, no arbitrage, transaction costs, bankruptcy costs, or\ntaxes) and asserts that a company's market value is the present value of its future cash flows.\nSince markets are perfectly efficient, the cost of capital depends only on risk, so companies with the same risk, regardless of capital\nstructure, should have the same weighted average cost of capital (WACC).\nSince WACC is used as the discount rate in determining present value, companies with the same risk and thus WACC and the same\nprojected cash flows would have the same market value, regardless of capital structure (Choice A).\nIn perfectly efficient markets, investors can create their own leverage; in effect, they create their own optimal capital structure by borrowing to\nfinance investments. Since investors can recreate a company's capital structure—or change it—they put no value on the company by doing so,\nand there is no difference in value due to capital structure.\n(Choice B) Modigliani-Miller's Proposition II (without taxes) asserts that a company's cost of equity is a linear function of its debt-to-equity ratio.\nAlthough WACC is unaffected by changes in capital structure, reducing debt results in a lower cost of equity.\nThings to remember:\nModigliani-Miller Proposition I asserts that without taxes, transaction costs, bankruptcy costs, or arbitrage opportunities, capital structure is\nirrelevant to a company's market value. This means that a company cannot change value solely by changing its capital structure. One implication\nof Proposition I (without taxes) is that a change in capital structure has no effect on a company's WACC.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 22, "q": "According to Modigliani-Miller Proposition I without taxes, if a company reduces the amount of debt in its capital structure, most likely the company's:", "opts": ["value will increase.", "cost of equity will be unchanged.", "weighted average cost of capital will be unchanged."], "ans": "C", "expl": "Modigliani-Miller Proposition I (without taxes) assumes a perfectly efficient market (ie, no arbitrage, transaction costs, bankruptcy costs, or\ntaxes) and asserts that a company's market value is the present value of its future cash flows.\nSince markets are perfectly efficient, the cost of capital depends only on risk, so companies with the same risk, regardless of capital\nstructure, should have the same weighted average cost of capital (WACC).\nSince WACC is used as the discount rate in determining present value, companies with the same risk and thus WACC and the same\nprojected cash flows would have the same market value, regardless of capital structure (Choice A).\nIn perfectly efficient markets, investors can create their own leverage; in effect, they create their own optimal capital structure by borrowing to\nfinance investments. Since investors can recreate a company's capital structure—or change it—they put no value on the company by doing so,\nand there is no difference in value due to capital structure.\n(Choice B) Modigliani-Miller's Proposition II (without taxes) asserts that a company's cost of equity is a linear function of its debt-to-equity ratio.\nAlthough WACC is unaffected by changes in capital structure, reducing debt results in a lower cost of equity.\nThings to remember:\nModigliani-Miller Proposition I asserts that without taxes, transaction costs, bankruptcy costs, or arbitrage opportunities, capital structure is\nirrelevant to a company's market value. This means that a company cannot change value solely by changing its capital structure. One implication\nof Proposition I (without taxes) is that a change in capital structure has no effect on a company's WACC.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 23, "q": "An analyst gathers the following information about a company: Total capital $2 billion Debt-to-equity ratio 25% Cost of common equity 9.0% Pretax cost of debt 5.0% Tax rate 20% If the company has only common equity and debt in its capital structure, the company's weighted average cost of capital (WACC) is closest to:", "opts": ["7.75%", "8.00%", "8.20%"], "ans": "B", "expl": "A company's weighted average cost of capital (WACC) is its marginal cost to raise additional capital. If each source of capital has a different\ncomponent cost of capital, WACC is the weighted average of these costs of capital. The costs are weighted by the proportions of capital the\ncompany currently uses to support all its business activities.\nIn this question, to calculate the WACC the weights of debt and equity must be derived from the company's debt-to-equity ratio (D/E). The\ncompany's D/E ratio of 25% means it has $0.25 of debt for every $1.00 of equity, or 25% as much debt as equity. The weights can be derived as\nfollows:\nNote: Since the proportions of debt and equity must equal 100%, the weight of equity is 80% = 100% − 20%.\nTo calculate WACC, the company's component costs of capital are multiplied by their weights. To account for the after-tax cost of debt, be sure to\napply the company's tax rate:\nWACC = [(0.20) (0.05 × (1 − 0.20))] + [(0.80) (0.09)]\nWACC = 8.00%\n(Choice A) 7.75% results from incorrectly interpreting the company's D/E ratio of 25% to mean that 25%, instead of 20%, of the company's cost\nstructure is debt.\n(Choice C) 8.20% results from using the company's pretax, instead of after-tax, cost of debt.\nThings to remember:\nA company's weighted average cost of capital (WACC) is its marginal cost to raise additional capital. WACC is the sum of each capital\ncomponent's cost weighted by its proportion of the overall capital structure.\nCalculate and interpret the weighted-average cost of capital for a company\n24.A company's WACC increased from 4.8% to 5.2%. All else equal, which of the following is most likely the reason? The company's:\n A. equity beta increased.\nB. effective tax rate increased.\nC. preferred stock price increased.\nExplanation\nA company can raise capital from different sources (ie, debt, common equity, preferred equity), each with a different component cost of capital. A\ncompany's weighted average cost of capital (WACC) is the weighted average of these component costs, which are weighted by the proportion of\neach kind of capital the company currently uses to support its business activities.\nA company's cost of equity can be calculated multiple ways, but a common way is to use the capital asset pricing model (CAPM). The CAPM\nestimates the company's cost of equity as its expected return based on the risk-free rate, the expected return of the market, and the company's\nequity beta, which measures risk. An increase in the company's beta implies greater risk, which results in investors demanding a greater return to\nbe compensated for that risk. This greater expected return results in an increased cost of equity and an increased WACC for the company.\n(Choice B) An increase in the company's effective tax rate would decrease its after-tax cost of debt and, therefore, its WACC. This applies only in\ncountries that allow interest to be deducted for tax purposes.\n(Choice C) An increase in the price of the company's preferred stock would result in a decrease in its cost of preferred equity and, therefore, its\nWACC.\nThings to remember:\nA company's cost of equity is commonly calculated through the capital asset pricing model (CAPM), which uses the company's equity beta to\nmeasure risk. An increase in the company's beta results in investors demanding a greater return to be compensated for that risk, leading to an\nincreased cost of equity and weighted average cost of capital (WACC) for the company.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 24, "q": "A company's WACC increased from 4.8% to 5.2%. All else equal, which of the following is most likely the reason? The company's:", "opts": ["equity beta increased.", "effective tax rate increased.", "preferred stock price increased."], "ans": "A", "expl": "A company can raise capital from different sources (ie, debt, common equity, preferred equity), each with a different component cost of capital. A\ncompany's weighted average cost of capital (WACC) is the weighted average of these component costs, which are weighted by the proportion of\neach kind of capital the company currently uses to support its business activities.\nA company's cost of equity can be calculated multiple ways, but a common way is to use the capital asset pricing model (CAPM). The CAPM\nestimates the company's cost of equity as its expected return based on the risk-free rate, the expected return of the market, and the company's\nequity beta, which measures risk. An increase in the company's beta implies greater risk, which results in investors demanding a greater return to\nbe compensated for that risk. This greater expected return results in an increased cost of equity and an increased WACC for the company.\n(Choice B) An increase in the company's effective tax rate would decrease its after-tax cost of debt and, therefore, its WACC. This applies only in\ncountries that allow interest to be deducted for tax purposes.\n(Choice C) An increase in the price of the company's preferred stock would result in a decrease in its cost of preferred equity and, therefore, its\nWACC.\nThings to remember:\nA company's cost of equity is commonly calculated through the capital asset pricing model (CAPM), which uses the company's equity beta to\nmeasure risk. An increase in the company's beta results in investors demanding a greater return to be compensated for that risk, leading to an\nincreased cost of equity and weighted average cost of capital (WACC) for the company.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 25, "q": "An analyst has compiled the following data for a company: The company recently issued £30 million in debt with a 6% yield. Assume that beta remains stable. Using the CAPM approach, which of the following is closest to the company's weighted average cost of capital (WACC)?", "opts": ["6.72%", "7.16%", "7.34%"], "ans": "B", "expl": "The weighted average cost of capital (WACC) is a company's weighted average after-tax cost of capital from all sources. The most common\nsources of capital include equity, preferred stock, and debt. The WACC also represents the weighted average required return of all capital\nproviders.\nFor this question, use the steps below to calculate WACC using CAPM:\nCalculate and interpret the weighted-average cost of capital for a company\n26. Information for a company is shown below:\nPretax cost of debt 8%\nCost of equity 12%\nDebt-to-equity ratio 0.6\nCorporate tax rate 30%\nThe company's weighted average cost of capital (WACC) is closest to:\nA. 8.2%\n\nB. 9.6%\nC. 10.5%\nExplanation\nWACC is a company's overall cost of capital. It combines the proportion of each component in the overall capital structure (ie, the \"weight\") with\nthe component's cost. The debt-to-equity (D/E) ratio can be used to find the weight of each component. In this question, the D/E ratio is 0.6,\nwhich means that there are 0.6 units of debt for each unit of equity. The proportion of debt in the capital structure is obtained by dividing the value\nof debt by the sum of the values of debt plus equity:\nSince the total of debt and equity forms 100% of a company's capital structure, the weight of equity is 1 − Proportion of d
