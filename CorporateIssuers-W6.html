ebt, or 1 − 0.375 = 0.625.\nThe cost of each component is multiplied by its weight, and the total for each of those products is the company's WACC. The company can\ndeduct the interest it pays on its debt to reduce its taxes so the after-tax cost cost of debt is used:\n(Choice A) 8.2% results from mistakenly treating the 0.6 D/E ratio as the weight of debt.\n(Choice C) 10.5% results from using the pretax cost of debt instead of the after-tax cost.\nThings to remember:\nWACC is a company's overall cost of capital. The debt-to-equity (D/E) ratio can be used to derive the weight of each component. The proportion\nof debt in the capital structure can be derived from its D/E ratio by dividing D/E by (1 + D/E). The weight of equity equals 1 – weight of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 26, "q": "Information for a company is shown below: Pretax cost of debt 8% Cost of equity 12% Debt-to-equity ratio 0.6 Corporate tax rate 30% The company's weighted average cost of capital (WACC) is closest to:", "opts": ["8.2%", "9.6%", "10.5%"], "ans": "B", "expl": "WACC is a company's overall cost of capital. It combines the proportion of each component in the overall capital structure (ie, the \"weight\") with\nthe component's cost. The debt-to-equity (D/E) ratio can be used to find the weight of each component. In this question, the D/E ratio is 0.6,\nwhich means that there are 0.6 units of debt for each unit of equity. The proportion of debt in the capital structure is obtained by dividing the value\nof debt by the sum of the values of debt plus equity:\nSince the total of debt and equity forms 100% of a company's capital structure, the weight of equity is 1 − Proportion of debt, or 1 − 0.375 = 0.625.\nThe cost of each component is multiplied by its weight, and the total for each of those products is the company's WACC. The company can\ndeduct the interest it pays on its debt to reduce its taxes so the after-tax cost cost of debt is used:\n(Choice A) 8.2% results from mistakenly treating the 0.6 D/E ratio as the weight of debt.\n(Choice C) 10.5% results from using the pretax cost of debt instead of the after-tax cost.\nThings to remember:\nWACC is a company's overall cost of capital. The debt-to-equity (D/E) ratio can be used to derive the weight of each component. The proportion\nof debt in the capital structure can be derived from its D/E ratio by dividing D/E by (1 + D/E). The weight of equity equals 1 – weight of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 27, "q": "Management wishes to limit a company's use of debt since its operating cash flows are unpredictable, despite the company's current lenders offering low rates. The company is most likely in its:", "opts": ["mature phase.", "growth phase.", "start-up phase."], "ans": "B", "expl": "Life cycle phases and financial and debt characteristics\nLife cycle phase Financial characteristics Debt characteristics\nRevenue growth: Low Availability: Little to no\nStart-up Cash flow: Negative Cost: High\nBusiness risk: High Capital structure: ~0% debt\nAvailability: Moderate\nRevenue growth: High\nCost: Moderate\nGrowth Cash flow: Increasing\nSecurity: Secured\nBusiness risk: Medium\nCapital structure: 0%–20% debt\nAvailability: High\nRevenue growth: Slowing\nCost: Low\nMature Cash flow: Positive/predictable\nSecurity: Unsecured\nBusiness risk: Low\nCapital structure: > 20% debt\nThe proportion of debt in a firm's capital structure typically increases as the firm moves through its life cycle stages.\nIn the start-up phase, management would prefer taking on debt to avoid equity dilution but the firm lacks access to debt due to high risk. A\nfirm in this phase typically does not have enough assets to secure against debt or enough cash flows to service debt.\nIn the growth phase, debt is more available but management generally chooses to use debt conservatively. A firm in this phase has\ntypically started generating a positive cash flow, but the preference is to maintain operational flexibility and minimize financial risk.\nIn the mature phase, the firm is generating continuous cash flow and deleveraging over time, but management tries to maintain a debt level\nclose to that of the firm's optimal capital structure. A mature firm will often use share buybacks, financed by debt, to increase the proportion\nof debt in its capital structure.\nA firm's capital structure may also be dictated by the industry in which it operates. In this scenario, the company is leveraged and has access to\nlow-cost debt, but management is trying to minimize the risk of financial distress. These considerations suggest that the company is in the growth\nphase.\n(Choice A) In the mature phase, a company has a positive cash flow and less need of debt.\n(Choice C) Start-up companies are riskier for capital providers; therefore lenders would not be offering low lending rates to a start-up.\nThings to remember:\nThe proportion of debt in a firm's capital structure typically increases as the firm moves through the stages of its life cycle. In the growth phase,\ndebt has become more available, but management generally uses it conservatively to maintain operational flexibility and minimize financial risk.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 28, "q": "An analyst is estimating a company's weighted average cost of capital (WACC) based on the following data: After-tax cost of debt 5.8% Cost of preferred stock 5.9% Return on the market 7.4% Risk-free rate 3.0% Marginal tax rate 28.0% Weight of debt 42.0% Weight of equity 53.0% Weight of preferred stock 5.0% If the analyst estimates the company's beta as 1.61, then the company's WACC is closest to:", "opts": ["bondholders.", "common shareholders.", "preferred shareholders."], "ans": "B", "expl": "Higher levels of financial leverage increase the potential for conflicts of interest between shareholders and other stakeholders. Companies use\nleverage (eg, debt) to increase expected returns to shareholders through actions such as expanding capacity or repurchasing shares.\nHowever, the potential for higher returns comes with a higher probability of financial distress and/or bankruptcy since payments to creditors remain\nan obligation of the firm even when operating at a loss.\nIn general, no stakeholder benefits from a firm going bankrupt. However, the risk-return trade-off of greater financial leverage benefits common\nshareholders due to their asymmetric return profile. Successful use of leverage can result in shareholder returns that are a multiple of their initial\ninvestment, whereas their losses normally cannot exceed 100% of the investment.\n(Choices A and C) All else equal, when a firm increases financial leverage by issuing debt, the probability of bankruptcy increases. This reduces\nthe likelihood of the company meeting financial commitments to senior security holders. Therefore, bondholders and preferred shareholders do\nnot benefit from increases in financial leverage.\nThings to remember:\nHigher levels of financial leverage can increase expected returns for common shareholders but also increase the probability of company\nbankruptcy. All else equal, greater financial leverage benefits common shareholders but does not benefit bondholders and preferred shareholders.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 29, "q": "An analyst is estimating a company's weighted average cost of capital (WACC) and compiles the following information: Pretax cost of debt 5.8% Cost of common equity 7.1% Preferred stock share price at issuance $30.00 Current preferred stock share price $50.00 Preferred dividend $2.60 Weight of debt 61.0% Weight of common equity 35.0% Weight of preferred stock 4.0% Marginal tax rate 25.0% Based on only this information, the WACC is closest to: ", "opts": ["bondholders.", "common shareholders.", "preferred shareholders."], "ans": "B", "expl": "Higher levels of financial leverage increase the potential for conflicts of interest between shareholders and other stakeholders. Companies use\nleverage (eg, debt) to increase expected returns to shareholders through actions such as expanding capacity or repurchasing shares.\nHowever, the potential for higher returns comes with a higher probability of financial distress and/or bankruptcy since payments to creditors remain\nan obligation of the firm even when operating at a loss.\nIn general, no stakeholder benefits from a firm going bankrupt. However, the risk-return trade-off of greater financial leverage benefits common\nshareholders due to their asymmetric return profile. Successful use of leverage can result in shareholder returns that are a multiple of their initial\ninvestment, whereas their losses normally cannot exceed 100% of the investment.\n(Choices A and C) All else equal, when a firm increases financial leverage by issuing debt, the probability of bankruptcy increases. This reduces\nthe likelihood of the company meeting financial commitments to senior security holders. Therefore, bondholders and preferred shareholders do\nnot benefit from increases in financial leverage.\nThings to remember:\nHigher levels of financial leverage can increase expected returns for common shareholders but also increase the probability of company\nbankruptcy. All else equal, greater financial leverage benefits common shareholders but does not benefit bondholders and preferred shareholders.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 30, "q": "A manufacturer with industry-average financial leverage is issuing debt to fund expansion of production capacity. All else equal, the stakeholder group most likely to benefit from the increase in financial leverage is the company's:", "opts": ["bondholders.", "common shareholders.", "preferred shareholders."], "ans": "B", "expl": "Higher levels of financial leverage increase the potential for conflicts of interest between shareholders and other stakeholders. Companies use\nleverage (eg, debt) to increase expected returns to shareholders through actions such as expanding capacity or repurchasing shares.\nHowever, the potential for higher returns comes with a higher probability of financial distress and/or bankruptcy since payments to creditors remain\nan obligation of the firm even when operating at a loss.\nIn general, no stakeholder benefits from a firm going bankrupt. However, the risk-return trade-off of greater financial leverage benefits common\nshareholders due to their asymmetric return profile. Successful use of leverage can result in shareholder returns that are a multiple of their initial\ninvestment, whereas their losses normally cannot exceed 100% of the investment.\n(Choices A and C) All else equal, when a firm increases financial leverage by issuing debt, the probability of bankruptcy increases. This reduces\nthe likelihood of the company meeting financial commitments to senior security holders. Therefore, bondholders and preferred shareholders do\nnot benefit from increases in financial leverage.\nThings to remember:\nHigher levels of financial leverage can increase expected returns for common shareholders but also increase the probability of company\nbankruptcy. All else equal, greater financial leverage benefits common shareholders but does not benefit bondholders and preferred shareholders.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 31, "q": "Which of the following is most likely characteristic of a firm in its mature life cycle phase?", "opts": ["The cost of equity is cheaper than the cost of debt.", "The firm has access to more sources of unsecured debt.", "The firm deleverages debt by engaging in share buybacks."], "ans": "B", "expl": "Life cycle phases and financial and debt characteristics\nLife cycle phase Financial characteristics Debt characteristics\nRevenue growth: Low Availability: Little to no\nStart-up Cash flow: Negative Cost: High\nBusiness risk: High Capital structure: ~0% debt\nAvailability: Moderate\nRevenue growth: High\nCost: Moderate\nGrowth Cash flow: Increasing\nSecurity: Secured\nBusiness risk: Medium\nCapital structure: 0%–20% debt\nAvailability: High\nRevenue growth: Slowing\nCost: Low\nMature Cash flow: Positive/predictable\nSecurity: Unsecured\nBusiness risk: Low\nCapital structure: > 20% debt\nA firm typically increases the proportion of debt in its capital structure as it moves through the stages of its life cycle. In the start-up phase, firms\nhave little revenue and cash flow to service debt. As a result, lenders hesitate to lend to younger firms or charge them very high interest to\ncompensate for the risk; therefore, younger firms are financed almost entirely with equity.\nIn the growth phase, firms experience accelerated revenue growth and generate moderate cash flow. These firms require large amounts of capital\nexpenditures and working capital investments to support sales growth. More lending options, typically secured by receivables, inventory, and/or\nother assets, become available at moderate cost.\nIn the mature phase, firms have declining revenue growth and generate high levels of predictable cash flow because they require fewer\ninvestments. This lowers the cost of borrowing and enables firms to take on unsecured debt.\n(Choice A) The cost of debt is almost always less than the cost of equity because debt instruments provide much more predictable (ie, less risky)\ncash flows to investors in the form of interest payments and principal. Furthermore, lenders are higher on the priority of claims for receiving\nregular distributions and proceeds in the event of liquidation.\n(Choice C) Share buybacks often increase, not decrease (ie, deleverage), the proportion of debt in the capital structure since outstanding equity\nis reduced.\nThings to remember:\nIn the mature stage, firms have high levels of predictable cash flows, allowing them to borrow large amounts of unsecured debt at low costs.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 32, "q": "An analyst gathers the following information for a company: Book value of existing debt ¥150 million Book value per share of common stock ¥16 Market value of existing debt ¥170 million Current stock price ¥25 Common shares outstanding 10 million YTM on existing debt 5% Risk-free rate 3% Expected market return 12% Corporate tax rate 35% Based on this information, if the appropriate beta is 1.2, the company's WACC is closest to: ", "opts": ["9.5%", "10.4%", "11.7%"], "ans": "A", "expl": "The weighted average cost of capital (WACC) is a company's weighted average after-tax cost of capital from all sources. The most common\nsources of capital include equity, preferred stock, and debt. In this scenario, there is no preferred equity, so the company's WACC is the weighted\naverage cost of its debt and common equity.\nThe weights for debt and equity are determined using the market values of equity and debt to determine correct proportions. Market value is\npreferred to book value since WACC is used to determine the profitability of future projects, and market value represents the most current value\nwhereas book value represents historical cost.\nThe cost of common equity can be determined using different methods, based on available information. In this case, the data provided (eg, beta,\nrisk-free rate, market return) suggest use of the capital asset pricing model (CAPM).\nThe calculation is:\n(Choice B) 10.4% results from using the book values rather than market values to determine the equity and debt proportions.\n(Choice C) 11.7% results from incorrectly multiplying the beta in the CAPM by the market return instead of multiplying by the risk premium (ie,\nmarket return minus risk-free rate).\nThings to remember:\nA company's weighted average cost of capital (WACC) is its marginal cost to raise additional capital for investment. The cost is weighted by the\nproportion of each type of capital the company currently uses to support all its business activities. These weights are applied to the costs of equity\nand debt to determine the overall cost of capital for the company.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}];
const CFG = {"title": "Wiley · Capital Structure", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Corporate Issuers · 32 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
