<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
  /* two-column question table */
  .q-cols-header{display:flex;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .q-cols-header span{flex:1;text-align:center;padding:9px 14px;font-weight:700;
    color:var(--accent2);font-size:13.5px;background:var(--panel2)}
  .q-cols-header span+span{border-left:1px solid var(--line)}
  .opt[data-cols="2"]{display:flex;align-items:stretch;padding:0;overflow:hidden;gap:0}
  .opt[data-cols="2"] .lead{display:flex;align-items:center;padding:10px 12px;
    border-right:1px solid var(--line);white-space:nowrap}
  .opt[data-cols="2"] .opt-col{flex:1;padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.4}
  .opt[data-cols="2"] .opt-col+.opt-col{border-left:1px solid var(--line)}
  html[data-theme="light"] .q-cols-header{border-color:var(--line)}
  html[data-theme="light"] .q-cols-header span{background:var(--panel2)}
  html[data-theme="light"] .opt[data-cols="2"] .lead,
  html[data-theme="light"] .opt[data-cols="2"] .opt-col{border-color:var(--line)}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>

<script>
const DATA = [{"n":1,"q":"During 2004, Covax Corp. reported net income of $2.4 million and 2 million shares of\ncommon stock. Covax paid cash dividends of $14,000 to its preferred shareholders and\n$30,000 to its common shareholders. In 2004, Covax issued 900, $1,000 par, 5.5 percent\nbonds for $900,000. Each bond is convertible to 50 shares of common stock. Assume the tax\nrate is 40%. Compute Covax's basic and diluted EPS.\nBasic EPSDiluted EPS","opts":["$1.19 | $1.18","$1.19 | $1.22","$1.22 | $1.22"],"ans":"A","expl":"EPS cơ bản năm 2004:\n2.400.000−14.000\nCơ bản EPS==$1,19\n2.000.000\n2004 EPS pha loãng:\n(2.400.000−14.000)+(49.500)(1−0,40)\nEPS pha loãng==$1,18\n(2.000.000)+(45.000)\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>During 2004, Covax Corp. reported net income of $2.4 million and 2 million shares of common stock. Covax paid cash dividends of $14,000 to its preferred shareholders and $30,000 to its common shareholders. In 2004, Covax issued 900, $1,000 par, 5.5 percent bonds for $900,000. Each bond is convertible to 50 shares of common stock. Assume the tax rate is 40%. Compute Covax's basic and diluted EPS.</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":2,"q":"According to the standards for revenue recognition, a promise to transfer a distinct good or\nservice is most accurately described as a:","opts":["contract.","performance obligation.","transaction."],"ans":"B","expl":"Nghĩa vụ thực hiện trong hợp đồng được định nghĩa là những lời hứa chuyển giao\nhàng hóa hoặc dịch vụ riêng biệt.\n(Học phần 28.1, LOS 28.a)"},{"n":3,"q":"Using the following information for Boxes, Inc.:\nNet income $53,000,000\nOutstanding 7% preferred stock, par value $30,000,000\nOutstanding convertible bonds, face value of $10,000,000, Issued on January 1 at par\nwith a coupon rate of 6% and convertible at the rate of 20 shares per 1,000 of face\nvalue\n100,000 options at 55 outstanding all year\nTax rate 30%\n3,000,000 common shares outstanding all year\nStock price 60 at year-end, average stock price over the year 50.\nDiluted EPS is closest to:","opts":["$15.00.","$16.00.","$17.00."],"ans":"B","expl":"53.000.000−(0,07×30.000.000)\n=$16,97\nEPS cơ bản =\n3.000.000\nCác quyền chọn không có tính suy giảm vì giá thực hiện lớn hơn giá trung bình\ntrong khoảng thời gian đó.\nEPS bị pha loãng =\n53.000.000−(0,07×30.000.000)+[10.000.000×0.06×(1−0.30)]\n=$16,04\n3.000.000+200.000\n(Mô-đun 28.4, LOS 28.d)"},{"n":4,"q":"Securities are considered to be dilutive to earnings per share if:","opts":["converting them to common shares would decrease earnings available to common shareholders.","converting them to common shares would actually reduce earnings per share, compared to basic earnings per share.","they can be converted to common shares now or at any time in the future."],"ans":"B","expl":"Chứng khoán sẽ bị suy giảm nếu chúng làm giảm EPS (so với EPS cơ bản) nếu chúng được sử dụng\nhoặc chuyển đổi thành cổ phiếu phổ thông. Chứng khoán có khả năng suy giảm giá trị bao gồm bất kỳ loại chứng khoán nào\ncó thể được chuyển đổi thành cổ phiếu phổ thông ngay bây giờ hoặc bất kỳ lúc nào trong tương lai. Giả sử\nchuyển đổi chứng khoán như trái phiếu chuyển đổi hoặc cổ phiếu ưu đãi chuyển đổi thường\nlàm tăng thu nhập có sẵn cho cổ đông phổ thông; những chứng khoán này có tác động suy giảm đối với EPS\nnếu chúng tăng cổ phiếu phổ thông tương đối nhiều hơn mức tăng thu nhập có sẵn cho\ncommon.\n(Mô-đun 28.4, LOS 28.d)"},{"n":5,"q":"An analyst has gathered the following information about Zany Corp.\nNet income of $200,000 for the year ended December 31, 2004.\nDuring 2004, 50,000 common shares were outstanding.\nZany has 10,000 shares of 7%, $50 par convertible preferred stock outstanding, each\nconvertible into two shares of common.\n5,000 warrants are outstanding with an exercise price of $24. Each warrant is\nconvertible into one common share.\nThe average market price per common share during 2004 was $20.\nCalculate Zany's basic and diluted earnings per share (EPS) for 2004.\nBasic EPSDiluted EPS","opts":["$4.00 | $2.86","$3.30 | $2.86","$3.30 | $2.00"],"ans":"B","expl":"EPS cơ bản = (thu nhập ròng − cổ tức ưu đãi) / số lượng cổ phiếu phổ thông = (200.000 −\n35.000) / 50.000 = 3,30 USD mỗi cổ phiếu\nCổ phiếu ưu đãi được chuyển đổi thành 20.000 cổ phiếu phổ thông, công ty không trả\ncổ tức ưu đãi. EPS pha loãng = 200.000 / (50.000 + 20.000) = 2,86 USD trên mỗi cổ phiếu.\nchứng quyền đã hết tiền với giá cổ phiếu là 20 USD.\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>An analyst has gathered the following information about Zany Corp.</p><p>Net income of $200,000 for the year ended December 31, 2004.</p><p>During 2004, 50,000 common shares were outstanding.</p><p>Zany has 10,000 shares of 7%, $50 par convertible preferred stock outstanding, each convertible into two shares of common.</p><p>5,000 warrants are outstanding with an exercise price of $24. Each warrant is convertible into one common share.</p><p>The average market price per common share during 2004 was $20.</p><p>Calculate Zany's basic and diluted earnings per share (EPS) for 2004.</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":6,"q":"Lawson, Inc.'s net income for the year was $1,060,000 with 420,000 shares of common stock\noutstanding. Lawson has 2,000 shares of 8%, $1,000 par value convertible preferred stock\nthat were outstanding the entire year. Each share of preferred is convertible into 50 shares\nof common stock. Lawson's diluted earnings per share are closest to:","opts":["$1.94.","$2.04.","$2.14."],"ans":"B","expl":"EPS cơ bản của Lawson ((thu nhập ròng − cổ tức ưu đãi) / bình quân gia quyền\ncổ phiếu đang lưu hành) là ($1.060.000 − (2.000 ×) 1.000 USD × 0,08)) / 420.000 = 2,14 USD. Để tính\nEPS pha loãng, cổ phiếu ưu đãi chuyển đổi được coi là đã được chuyển đổi,\ncổ tức ưu đãi đã trả được cộng lại vào tử số của phương trình EPS và\ncổ phiếu phổ thông bổ sung được thêm vào mẫu số của phương trình. EPS pha loãng\ncủa Lawson là 1.060.000 USD / (420.000 + 100.000) = 2,04 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":7,"q":"Jersey, Inc.'s financial information included the following for its year ended December 31:\n160,000 shares of common stock were outstanding for the entire year.\n18,000 shares of 10%, $100 par value cumulative preferred stock were outstanding for\nthe entire year.\nCommon stock dividends paid during the current year were $240,000.\nAll preferred stock dividends were paid for the current year.\nNet income was $720,000.\nBasic earnings per share for Jersey, Inc. for the year ended December 31 are closest to:","opts":["$4.50.","$3.38.","$2.81."],"ans":"B","expl":"EPS cơ bản của Jersey, Inc. = (thu nhập ròng – cổ tức ưu đãi) / (số lượng bình quân gia quyền của\ncổ phiếu phổ thông đang lưu hành) là ($720.000 - 180.000 USD)/160.000 = 3,38 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":8,"q":"BWT, Inc. shows the following data in its financial statements at the end of the year. Assume\nall securities were outstanding for the entire year.\n6.125% convertible bonds, convertible into 33 shares of common stock. Issue price\n$1,000, 100 bonds outstanding.\n6.25% convertible preferred stock, $100 par, 2,315 shares outstanding. Convertible\ninto 3.3 shares of common stock, issue price $100.\n8% convertible preferred stock, $100 par, 2,572 shares outstanding. Convertible into 5\ncommon shares, issue price $80.\n9,986 warrants are outstanding with an exercise price of $38. Each warrant is\nconvertible into 1 share of common. Average market price of common is $52.00 per\nshare.\nCommon shares outstanding at the beginning of the year were 40,045.\nNet Income for the period was $200,000, while the tax rate was 40%.\nWhat are the basic and diluted EPS for the year?\nBasic EPSDiluted EPS","opts":["$4.12 | $3.06","$3.97 | $3.06","$4.12 | $2.95"],"ans":"A","expl":"Tính toán sắp chữ: 100%\nEPS cơ bản = Thu nhập ròng – cổ tức ưu đãi / Cổ phiếu bình quân gia quyền của phổ thông\nƯu tiên cổ tức:\n6,25% cổ phiếu ưu đãi chuyển đổi:\n(0,0625)($100)(2.315) = $14.469\n8% cổ phiếu ưu đãi chuyển đổi:\n(0,08)($100)(2.572) = $20.576\nCổ tức ưu đãi = $14.469 + $20.576 = $35.045.\nEPS cơ bản = ($200.000 – $35.045) / 40.045 = 164.955/40.045 = $4,12\nEPS pha loãng:\nTrước tiên, hãy kiểm tra từng chứng khoán có khả năng suy giảm để xem có bị pha loãng hay không.\n6,125% trái phiếu chuyển đổi:\n(Lãi suất nợ chuyển đổi)(1 – thuế suất) / Cổ phiếu phổ thông nếu được chuyển đổi\n= (0,06125)($1.000)(100)(1 – 0,4) / (33)(100)\n= $1,1136\nVì mức này thấp hơn EPS cơ bản nên các trái phiếu chuyển đổi này có tính pha loãng.\n6,25% cổ phiếu ưu đãi chuyển đổi:\nCổ tức ưu đãi / Cổ phiếu phổ thông nếu được chuyển đổi\n= (0,0625)($100) / 3,3 = $1,8939\nVì mức này thấp hơn EPS cơ bản nên cổ phiếu ưu đãi chuyển đổi này có tính suy giảm.\n8% cổ phiếu ưu đãi chuyển đổi:\nCổ tức ưu đãi / Cổ phiếu phổ thông nếu được chuyển đổi\n= (0,08)($100) / 5 = $1,60\nVì mức này thấp hơn EPS cơ bản nên cổ phiếu chuyển đổi này thấp hơn EPS cơ bản có tính pha loãng.\nChứng quyền:\nVì giá thực hiện $38 thấp hơn giá cổ phiếu trung bình $52 nên các chứng chỉ\ncó tính pha loãng.\nTiếp theo, hãy xác định số lượng cổ phiếu phổ thông sẽ được tạo ra bằng cách thực hiện từng\nchứng khoán pha loãng:\n6,125% có thể chuyển đổi trái phiếu:\n(100 trái phiếu)(33) = 3.300 cổ phiếu phổ thông\n6,25% cổ phiếu ưu đãi chuyển đổi:\n(2.315 cổ phiếu ưu đãi)(3.3) = 7.640 cổ phiếu phổ thông\n8% cổ phiếu ưu đãi chuyển đổi:\nPhép tính sắp chữ: 100%\n(2.572 cổ phiếu ưu đãi)(5) = 12.860 cổ phiếu phổ thông\nChứng quyền:\n[($52 – $38) / $52] × 9.986 = 2.689 cổ phiếu phổ thông\nEPS pha loãng = (Thu nhập ròng − cổ tức ưu đãi + cổ tức ưu đãi chuyển đổi + sau-\nlãi suất nợ chuyển đổi theo thuế) / Cổ phiếu bình quân gia quyền của cổ phiếu phổ thông được điều chỉnh để thực hiện\n[($200.000 − $35.045) + $35.045 + (0,06125)($1.000)(100)(1 − 0,4)] / (40.045 + 3.300 + 7.640\n+ 12.860 + 2.689) = $203.675 / 66.534 cổ phiếu = $3,06\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>BWT, Inc. shows the following data in its financial statements at the end of the year. Assume all securities were outstanding for the entire year.</p><p>6.125% convertible bonds, convertible into 33 shares of common stock. Issue price $1,000, 100 bonds outstanding.</p><p>6.25% convertible preferred stock, $100 par, 2,315 shares outstanding. Convertible into 3.3 shares of common stock, issue price $100.</p><p>8% convertible preferred stock, $100 par, 2,572 shares outstanding. Convertible into 5 common shares, issue price $80.</p><p>9,986 warrants are outstanding with an exercise price of $38. Each warrant is convertible into 1 share of common. Average market price of common is $52.00 per share.</p><p>Common shares outstanding at the beginning of the year were 40,045.</p><p>Net Income for the period was $200,000, while the tax rate was 40%.</p><p>What are the basic and diluted EPS for the year?</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":9,"q":"Which type of a capital structure contains no dilutive securities?","opts":["Complex.","Simple.","Basic."],"ans":"B","expl":"Cấu trúc vốn phức tạp chứa các chứng khoán có khả năng suy giảm như quyền chọn,\nchứng quyền hoặc chứng khoán chuyển đổi. Không có cấu trúc vốn cơ bản nhưng có\nthu nhập cơ bản trên mỗi cổ phiếu KHÔNG xem xét tác động của bất kỳ chứng khoán suy giảm nào trong\ntính toán EPS.\n(Mô-đun 28.4, LOS 28.d)"},{"n":10,"q":"An analyst gathered the following information about a company:\n01/01/06 - 20,000 shares issued and outstanding\n04/01/06 - 5.0% stock dividend\n07/01/06 - 5,000 shares repurchased\n10/01/06 - 2:1 stock split\nWhat is the company's weighted average number of shares outstanding at the end of 2006?","opts":["37,000.","39,500.","47,000."],"ans":"A","expl":"Số lượng cổ phiếu phổ thông bình quân gia quyền cuối kỳ là\nsố lượng cổ phiếu đang lưu hành trong năm tính theo phần trong năm mà chúng\nđã lưu hành. Cổ tức và chia cổ tức được áp dụng cho tất cả cổ phiếu đã phát hành hoặc mua lại và\ntất cả cổ phiếu gốc hoặc cổ phiếu đã điều chỉnh đang lưu hành trước khi chia cổ tức hoặc chia cổ tức.\nBước 1) Áp dụng cổ tức ngày 04/01/06 cho cổ phiếu đầu năm:\nCổ phiếu điều chỉnh = 1,05 × 20.000 = 21.000\nBước 2) Áp dụng mức chia tách ngày 01/10/06 cho số cổ phiếu đầu năm đã điều chỉnh và\nmua lại.\nSố cổ phiếu đầu năm đã điều chỉnh = 42.000 (= 2 × 21.000)\nMua lại cổ phiếu đã điều chỉnh = 10.000 (= 2 × 5.000)\nBước 3) Tính số lượng cổ phiếu trung bình có trọng số.\n42.000(12/12) - 10.000(12/6) = 37.000 cổ phiếu\n(Mô-đun 28.4, LOS 28.d)"},{"n":11,"q":"The following data pertains to the Sapphire Company:\nNet income equals $15,000.\nst\n5,000 shares of common stock issued on January 1.\nst\n10% stock dividend issued on June 1.\nst\n1,000 shares of common stock were repurchased on July 1.\n1,000 shares of 10%, $100 par preferred stock each convertible into 8 shares of\ncommon were outstanding the whole year.\nWhat is the company's diluted earnings per share (EPS)?","opts":["$2.50.","$1.00.","$1.15."],"ans":"B","expl":"Toán sắp chữ: 100%\nSố lượng cổ phiếu phổ thông bình quân:\n1/1 5.500 cổ phiếu phát hành (bao gồm 10% cổ tức bằng cổ phiếu vào ngày 1/6) × 12 = 66.000\n1/7 1.000 cổ phiếu mua lại × 6 tháng = -6.000\n= 60.000\n60.000 cổ phiếu/12 tháng = 5.000 cổ phiếu bình quân\nCổ tức ưu đãi = ($10)(1.000) = $10.000\nSố cổ phần từ việc chuyển đổi cổ phần ưu đãi = (1.000 cổ phần ưu đãi\ncổ phần)(8 × 1,1 cổ phần phổ thông/cổ phần ưu đãi) = 8.800 cổ phần phổ thông\nEPS pha loãng = [$15.000(NI) – $10.000(pfd) + $10.000(pfd)] / (5.000 cổ phiếu phổ thông\n+ 8.800 cổ phiếu chuyển đổi pfd.) = 15.000 USD / 13.800 cổ phiếu = 1,09 USD/cổ phiếu\nCon số này cần phải so sánh với EPS cơ bản để xem cổ phiếu ưu đãi có\nchống pha loãng.\nEPS cơ bản = [$15.000(NI) – $10.000(cổ tức ưu đãi)] / 5.000 cổ phiếu = $5.000 /\n5.000 cổ phiếu = 1 USD/cổ phiếu\nVì EPS sau khi chuyển đổi cổ phiếu ưu đãi lớn hơn trước khi chuyển đổi.\nchuyển đổi, cổ phiếu ưu đãi có tác dụng suy giảm suy giảm và chúng không được coi là\nphổ biến trong tính toán EPS pha loãng. Do đó EPS pha loãng giống như EPS cơ bản hoặc\n$1/cổ phiếu.\n(Học ​​phần 28.4, LOS 28.d)","qhtml":"<p>The following data pertains to the Sapphire Company:</p><ul><li>Net income equals $15,000.</li><li>5,000 shares of common stock issued on January 1<sup>st</sup>.</li><li>10% stock dividend issued on June 1<sup>st</sup>.</li><li>1,000 shares of common stock were repurchased on July 1<sup>st</sup>.</li><li>1,000 shares of 10%, $100 par preferred stock each convertible into 8 shares of common were outstanding the whole year.</li></ul><p>What is the company's diluted earnings per share (EPS)?</p>"},{"n":12,"q":"In applying the treasury stock method, if warrants allow the purchase of 1 million shares at\n$42 per share when the average price is $56 per share, how many shares will be added to\nthe firm's weighted average number of shares outstanding?","opts":["250,000.","420,000.","1,000,000."],"ans":"A","expl":"Phương pháp cổ phiếu quỹ sẽ cho phép bù đắp một phần 1 triệu cổ phiếu bổ sung\nbằng số lượng cổ phiếu có thể được mua lại bằng số tiền nhận được\ncho những cổ phiếu đó cổ phiếu. Trong trường hợp này, 1 triệu cổ phiếu phát hành sẽ được bù đắp bằng (1.000.000 ×\n$42 / $56) hoặc 750.000 cổ phiếu. Số cổ phiếu được thêm vào = 1.000.000 – 750.000 = 250.000.\n(Mô-đun 28.4, LOS 28.d)"},{"n":13,"q":"Which of the following debt securities issued by a company would give it a complex capital\nstructure?","opts":["Asset-backed securities.","Floating rate notes.","Convertible bonds."],"ans":"C","expl":"Cơ cấu vốn phức tạp có nghĩa là một công ty có chứng khoán đang lưu hành có thể chuyển đổi\nthành cổ phiếu phổ thông và do đó có khả năng làm giảm thu nhập trên mỗi cổ phiếu của công ty.\nVí dụ: có thể chuyển đổi trái phiếu, cổ phiếu ưu đãi chuyển đổi, quyền chọn và chứng quyền có\ncó khả năng làm giảm thu nhập trên mỗi cổ phiếu khi chuyển đổi hoặc thực hiện.\n(Mô-đun 28.4, LOS 28.d)"},{"n":14,"q":"As of the beginning of the year HalfPass Productions, Inc., had the following complex capital\nstructure:\n3,000,000 common shares outstanding.\n175,000 options with an exercise price of $22.\n250,000 warrants with an exercise price of $18.\nDuring the year:\nOn March 1, the company issued 100,000 new shares of common stock.\nOn July 1, the board of directors declared a 15% stock dividend.\nOn September 1, the company repurchased 125,000 shares.\nNet income (after-tax) for the year was $7,500,000.\nThe company paid common dividends of $2,750,000 and preferred dividends of\n$1,300,000.\nThe average market price for the common stock was $25 per share.\nAssume the fiscal year is January 1 through December 31. At year end, HalfPass's basic EPS is\nclosest to:","opts":["$1.77.","$1.66.","$1.94."],"ans":"A","expl":"Câu hỏi là yêu cầu EPS cơ bản. Do đó, chúng ta có thể bỏ qua các quyền chọn và chứng quyền có tính suy giảm.\nEPS cơ bản = (thu nhập ròng – cổ tức ưu đãi) / cổ phiếu phổ thông bình quân gia quyền\nđang lưu hành\nTử số = 7,5 triệu USD – 1,3 triệu USD = 6,2 triệu USD\nTính mẫu số tốn nhiều công sức hơn một chút (tính toán chi tiết trong bảng bên dưới):\nTriệu# tháng\nEventNotesTotal\nSố lượt chia sẻ Nổi bật\nBal bắt đầu. (BB)3.0001236.000\nSố mới (Tháng 3\n0.100101.00\n01)\nCổ tức cổ phiếu 15% trên BB0.450125.400\n15% cho cổ phiếu\nmới Cổ tức0,015100.150\nphát hành\nMua lại (ngày 1 tháng 9)-0,1254-0,500\nTổng 42,050\nSố cổ phiếu trung bình = 42.050.000 / 12 = 3.504.167\nEPS cơ bản = 6,2 triệu USD / 3,504 triệu = 1,77 USD\n(Mô-đun 28.4, LOS 28.d)"},{"n":15,"q":"A complex capital structure, for purposes of determining disclosure of diluted earnings per\nshare, is distinguished from a simple capital structure by the company having outstanding:","opts":["debt securities or convertible securities.","preferred stock, warrants, or options.","warrants, convertible securities, or options."],"ans":"C","expl":"Toán sắp chữ: 100%\nMột cấu trúc phức tạp chứa các chứng khoán có khả năng suy giảm giá trị. Chúng bao gồm mọi chứng khoán\ncó khả năng được chuyển đổi thành cổ phiếu phổ thông, chẳng hạn như quyền chọn, chứng quyền,\ncổ phiếu ưu đãi chuyển đổi hoặc trái phiếu chuyển đổi. Cấu trúc vốn đơn giản không chứa\nchứng khoán có khả năng suy giảm nhưng có thể bao gồm chứng khoán nợ không thể chuyển đổi hoặc cổ phiếu ưu đãi không thể chuyển đổi không\n.\n(Module 28.4, LOS 28.d)"},{"n":16,"q":"Firewalz, Inc., had 500,000 shares of common stock and 20,000 shares of 6%, $100 par\npreferred stock outstanding at the beginning of the year. Each share of the preferred can be\nconverted into two shares of common stock. On July 1, the company repurchased 100,000\nshares of its common stock. If net income for the year is $1.2 million, the reported diluted\nEPS for the year is closest to:","opts":["$2.45.","$2.42.","$2.40."],"ans":"C","expl":"Cổ tức ưu đãi = 6% × 100 USD × 20.000 = 120.000 USD.\nEPS cơ bản = (1,2 triệu USD – 120.000 USD) / [500.000 – (0,5)100.000] = 2,40 USD.\nCổ tức ưu đãi trên mỗi cổ phiếu phổ thông có được từ chuyển đổi = 120.000 USD / (2 ×\n20.000) = 3,00 USD, lớn hơn 2,40 USD. Ưu tiên là có tác dụng chống pha loãng (chuyển đổi\nsẽ không làm giảm EPS). Do đó, EPS pha loãng được báo cáo sẽ giống như EPS cơ bản:\n$2,40.\n(Module 28.4, LOS 28.d)"},{"n":17,"q":"At the beginning of its first year of business, Digmore Corporation acquires a fixed asset for\n$90 million and estimates that it will have a useful life of eight years and a salvage value of\n$10 million. Digmore expects the asset to produce 150 million units of output over its life,\nincluding 30 million units in each of the first three years, 20 million units in each of years 4 to\n7, and 10 million units in year 8. If depreciation expense in the first year is $10 million, what\nmethod of depreciation did Digmore most likely use?","opts":["Double-declining-balance.","Straight Line.","Units of production."],"ans":"B","expl":"Sử dụng khấu hao đường thẳng, số tiền khấu hao trong suốt thời gian sử dụng tài sản là $90 −\n$10 triệu = $80 triệu và chi phí khấu hao mỗi năm là $90 −\n$10 triệu = $80 triệu và chi phí khấu hao mỗi năm là 80 triệu USD / 8 = 10$\ntriệu.\nNếu công ty sử dụng số dư giảm dần kép, chi phí khấu hao trong năm đầu tiên sẽ\nlà 2/8 × 90 triệu USD = 22,5 triệu USD. Dựa trên đơn vị sản xuất, chi phí khấu hao\ntrong năm đầu tiên sẽ là (30 triệu / 150 triệu) × 80 triệu USD = 16\ntriệu.\n(Mô-đun 28.2, LOS 28.b)"},{"n":18,"q":"Valuable Corp.'s basic earnings per share (EPS) and diluted EPS for the year are different.\nGiven this information, which of the following statements is least accurate?","opts":["All of Valuable's potentially dilutive securities are antidilutive.","Diluted EPS is less than basic EPS.","Valuable Corp.'s capital structure may include both options and warrants."],"ans":"A","expl":"Nếu tất cả các chứng khoán có khả năng suy giảm của Có giá trị đều có tính suy giảm suy giảm thì EPS sẽ bằng\nEPS bị pha loãng.\n(Module 28.4, LOS 28.d)"},{"n":19,"q":"An analyst has gathered the following information about a company:\n110,000 shares of common outstanding at the beginning of the year.\nThe company repurchases 20,000 of its own common shares on July 1.\nNet income is $300,000 for the year.\n10,000 shares of existing 10 percent cumulative $100 par preferred outstanding that\nis not in arrears at the beginning or ending of the year.\nThe company also has $1 million in 10 percent callable bonds outstanding.\nThe company has declared a $0.50 dividend on the common.\nWhat is the company's basic Earnings Per Share?","opts":["$3.00.","$2.00.","$1.00."],"ans":"B","expl":"Tiền lãi đã được khấu trừ từ thu nhập.\n300.000−(0,10)($100)(10.000)\n=$2,00\n110.000−(6/12)(20.000)\n(Mô-đun 28.4, LOS 28.d)"},{"n":20,"q":"Securities that improve basic per share earnings, or reduce per share losses, if they are\nexercised or converted to common stock are called:","opts":["embedded securities.","dilutive securities.","antidilutive securities."],"ans":"C","expl":"Chứng khoán có tính pha loãng, khi thực hiện, sẽ tăng EPS cơ bản hoặc giảm lỗ trên mỗi cổ phiếu.\nCổ phiếu từ chuyển đổi không được tính vào EPS cơ bản hoặc EPS pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":21,"q":"Ajax Company has a simple capital structure. Which of the following will NOT be found on its\nbalance sheet?","opts":["6%, $50 par value callable bond.","10%, secured mortgage bond denominated in Swiss francs.","3%, $100 par value convertible bond."],"ans":"C","expl":"Nếu tồn tại trái phiếu chuyển đổi, công ty có cấu trúc vốn phức tạp.\n(Mô-đun 28.4, LOS 28.d)"},{"n":22,"q":"Orange Company's net income for 2004 was $7,600,000 with 2,000,000 shares outstanding.\nThe average share price in 2004 was $55. Orange had 10,000 shares of eight percent $1,000\npar value convertible preferred stock outstanding since 2003. Each preferred share was\nconvertible into 20 shares of common stock. Orange Company's diluted earnings per share\n(Diluted EPS) for 2004 is closest to:","opts":["$3.45.","$3.40.","$3.80."],"ans":"B","expl":"EPS cơ bản của Orange ((thu nhập ròng – cổ tức ưu đãi) / cổ phiếu phổ thông bình quân gia quyền\nchưa thanh toán) là [($7.600.000 − (10.000 × $1.000 × 0,08)] / 2.000.000 = $3,40. Để kiểm tra\npha loãng, EPS được tính theo giả định rằng cổ phiếu ưu đãi chuyển đổi được\nchuyển đổi thành cổ phiếu phổ thông vào đầu năm. Cổ tức ưu đãi đã trả\nđược thêm lại vào tử số của phương trình EPS pha loãng và các cổ phiếu\nthông thường bổ sung được thêm vào mẫu số của phương trình. EPS nếu được chuyển đổi của Orange là\n$7.600.000 / (2.000.000 + 200.000) = 3,45 USD vì EPS được chuyển đổi nếu cao hơn. hơn EPS cơ bản\n, cổ phiếu ưu đãi có tác dụng suy giảm suy giảm và không có sự điều chỉnh nào được thực hiện đối với EPS cơ bản.\n(Mô-đun 28.4, LOS 28.d)"},{"n":23,"q":"Which of the following securities would least likely be found in a simple capital structure?","opts":["3%, $100 par value convertible preferred.","6%, $5000 par value putable bond.","7%, $100 par value non convertible preferred."],"ans":"A","expl":"Cấu trúc vốn đơn giản không chứa các chứng khoán có khả năng suy giảm như quyền chọn cổ phiếu,\nchứng quyền hoặc cổ phiếu ưu đãi chuyển đổi.\n(Học phần 28.4, LOS 28.d)"},{"n":24,"q":"On December 31, 2004, JME Corporation had 350,000 shares of common stock outstanding.\nOn September 1, 2005, an additional 150,000 shares of common stock were issued. In\naddition, JME had $10 million of 8% convertible bonds outstanding at December 31, 2004,\nwhich are convertible into 200,000 shares of common stock. Net income for 2005 was $3\nmillion. Assuming an income tax rate of 40%, what amount should be reported as the diluted\nearnings per share for 2005?","opts":["$6.00.","$5.00.","$5.80."],"ans":"C","expl":"Nếu trái phiếu được chuyển đổi thì thu nhập ròng sẽ tăng 480.000 [10 triệu × 0,08 × (1 −\n0.4)] và số cổ phiếu đang lưu hành sẽ tăng thêm 200.000.\ntử số = 3.000.000 + 480.000 = 3.480.000\nmẫu số = 350.000 + (150.000 × 4/12) + 200.000 = 600.000\nEPS pha loãng = 3.480.000 / 600.000 = 5,80\n(Học phần 28.4, LOS 28.d)"},{"n":25,"q":"An analyst compiled the following information from Hampshire, Inc.'s financial activities in\nthe most recent year:\nNet income was $2,800,000.\n100,000 shares of common stock were outstanding on January 1.\nThe average market price per share for the year was $250.\n10,000 shares of 6%, $1,000 par value preferred shares were outstanding the entire\nyear.\n10,000 warrants, which allow the holder to purchase 10 shares of common stock for\neach warrant held at a price of $150 per common share, were outstanding the entire\nyear.\n30,000 shares of common stock were issued on September 1.\nHampshire, Inc.'s diluted earnings per share are closest to:","opts":["$14.67.","$18.38.","$20.00."],"ans":"A","expl":"Để tính EPS cơ bản của Hampshire ((thu nhập ròng – cổ tức ưu đãi) / bình quân gia quyền\ncổ phiếu phổ thông đang lưu hành), số cổ phiếu phổ thông bình quân gia quyền phải được tính.\n100.000 cổ phiếu đang lưu hành từ ngày 1 tháng 1 và 30.000 cổ phiếu được phát hành vào\nngày 1 tháng 9, do đó bình quân gia quyền là 100.000 + (30.000 × 4 / 12) = 110.000. EPS cơ bản là\n($2.800.000 – (10.000 × $1.000 × 0,06)) / 110.000 = $20,00.\nNếu chứng quyền được thực hiện, dòng tiền vào sẽ là 10.000 × $150 × 10 = $15.000.000 cho\n10 × 10.000 = 100.000 cổ phiếu. Sử dụng phương pháp cổ phiếu quỹ, số lượng cổ phiếu Hampshire\ncó thể được mua bằng dòng tiền vào (dòng tiền vào / giá cổ phiếu trung bình) là\n$15.000.000 / $250 = 60.000. Số lượng cổ phiếu sẽ được tạo là 100.000 –\n60.000 = 40.000. EPS pha loãng là 2.200.000 USD / (110.000 + 40.000) = 14,67 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":26,"q":"The following information pertains the QRK Company:\nOne million shares of common stock outstanding at the beginning of 2005.\n200,000 shares issued on the last day of March.\n500,000 shares issued on the last day of June.\n800,000 shares issued on the last day of September.\nWhat is the number of shares that should be used to compute 2005 earnings per share for\nthe QRK Company?","opts":["1.6 million.","1.9 million.","2.5 million."],"ans":"A","expl":"Số lượng cổ phiếu phổ thông đang lưu hành bình quân gia quyền là số lượng cổ phiếu\nđang lưu hành trong năm tính theo phần trong năm chúng đang lưu hành.\nĐối với Công ty QRK, số lượng cổ phiếu đang lưu hành có trọng số là một\ntriệu cổ phiếu ban đầu cộng với 150.000 cổ phiếu phát hành cuối tháng 3 (= 200.000 × 9/12), cộng\n250.000 cổ phiếu cho đợt phát hành cuối tháng 6 (= 500.000 × 6/12), cộng thêm 200.000 cổ phiếu cho đợt phát hành cuối tháng 6\nsố phát hành cuối tháng 9 (= 800.000 × 3/12), tương đương 1,6 triệu cổ phiếu.\n(Mô-đun 28.4, LOS 28.d)"},{"n":27,"q":"Advantage Corp.'s capital structure was as follows:\nDecember 31, 2005December 31, 2004\nOutstanding shares of stock:\nCommon110,000110,000\nConvertible Preferred10,00010,000\n% Convertible Bonds$1,000,000$1,000,000\nDuring 2005, Advantage paid dividends of $3 per share on its preferred stock. The preferred\nshares are convertible into 20,000 shares of common stock. The 8% bonds are convertible\ninto 30,000 shares of common stock. Net income for 2005 was $850,000. Assume the income\ntax rate is 30%.\nCalculate Advantage's basic and diluted earnings per share (EPS) for 2005.\nBasic EPSDiluted EPS","opts":["$7.45 | $6.26","$7.45 | $5.66","$6.31 | $5.66"],"ans":"B","expl":"EPS cơ bản = thu nhập ròng − pref div / wt. đại lộ cổ phiếu phổ thông\n[850,00 − (3 × 10.000)] / 110.000 = $7,45\nEPS bị pha loãng = [(thu nhập ròng − cổ tức ưu đãi) + cổ tức ưu đãi chuyển đổi +\n(lãi suất nợ chuyển đổi)(1 − t)] / [(cổ phiếu bình quân gia quyền) + (cổ phiếu từ chuyển đổi\nconv. pfd cổ phiếu) + (cổ phiếu từ chuyển đổi nợ chuyển đổi) + (cổ phiếu có thể phát hành từ cổ phiếu\noptions)]\n[(850.000 − (3 × 10.000)) + 30.000 + (80.000)(1 − 0,3)] / [(110.000) + (20.000) + (30.000)] =\n$5,66.\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>Advantage Corp.'s capital structure was as follows:</p><table class=\"qtable\"><thead><tr><th>Outstanding shares of stock:</th><th>December 31, 2005</th><th>December 31, 2004</th></tr></thead><tbody><tr><td>Common</td><td>110,000</td><td>110,000</td></tr><tr><td>Convertible Preferred</td><td>10,000</td><td>10,000</td></tr><tr><td>8% Convertible Bonds</td><td>$1,000,000</td><td>$1,000,000</td></tr></tbody></table><p>During 2005, Advantage paid dividends of $3 per share on its preferred stock. The preferred shares are convertible into 20,000 shares of common stock. The 8% bonds are convertible into 30,000 shares of common stock. Net income for 2005 was $850,000. Assume the income tax rate is 30%.</p><p>Calculate Advantage's basic and diluted earnings per share (EPS) for 2005.</p>","cols":["Basic EPS","Diluted EPS"]},{"n":28,"q":"For a firm with a simple capital structure, all of the following are necessary to measure basic\nearnings per share (EPS) EXCEPT:","opts":["dividends paid to preferred shareholders.","the timing and number of shares issued or repurchased during the year.","dividends paid to common shareholders."],"ans":"C","expl":"EPS cơ bản = thu nhập có sẵn cho cổ đông phổ thông chia cho mức bình quân gia quyền\nsố lượng cổ phiếu phổ thông đang lưu hành. Thu nhập dành cho cổ đông phổ thông\nbằng thu nhập ròng trừ đi cổ tức ưu đãi.\n(Mô-đun 28.4, LOS 28.d)"},{"n":29,"q":"When a firm recognizes revenue in excess of expenses on a product before cash is collected,\nwhat is the impact on the firm's assets and liabilities, ignoring taxes?","opts":["No effect | Increase","Increase | No effect","Increase | Increase"],"ans":"B","expl":"Khi một công ty ghi nhận doanh thu trước khi thu tiền mặt, vốn chủ sở hữu sẽ tăng (thu nhập giữ lại\n) và tài sản tăng (các khoản phải thu). Khi một sản phẩm được bán chịu,\ncác khoản phải thu (tài sản) tăng và hàng tồn kho (cũng là tài sản) giảm. Miễn là\ngiá bán của sản phẩm lớn hơn chi phí (giảm hàng tồn kho trên bảng cân đối kế toán\n), tổng tài sản sẽ tăng lên. Các khoản nợ không bị ảnh hưởng.\n(Mô-đun 28.2, LOS 28.b)","cols":["Assets","Liabilities"]},{"n":30,"q":"A firm with a capital structure consisting of only common stock and non-convertible bonds is\nsaid to have a:","opts":["straight capital structure.","simple capital structure.","non-diluted capital structure."],"ans":"B","expl":"Cấu trúc vốn đơn giản là cấu trúc không chứa chứng khoán nào có khả năng\nlàm giảm thu nhập trên mỗi cổ phiếu của một công ty. Ví dụ: trái phiếu chuyển đổi, cổ phiếu ưu đãi chuyển đổi\n, quyền chọn và chứng quyền có khả năng làm giảm thu nhập trên mỗi cổ phiếu khi\nchuyển đổi hoặc thực hiện.\n(Mô-đun 28.4, LOS 28.d)"},{"n":31,"q":"Selected information from Baltimore Corp's financial activities in the year 2004 is as follows:\nNet income was $4,200,000.\n750,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $50 in 2004.\nDividends were paid in 2004.\n10,000 warrants, which allowed the holder to purchase 10 shares of common stock for each\nwarrant held at a price of $40 per common share, were outstanding the entire year.\nBaltimore's diluted earnings per share (Diluted EPS) for 2004 is closest to:","opts":["$4.94.","$5.45.","$5.60."],"ans":"B","expl":"Thu nhập cơ bản trên mỗi cổ phiếu (EPS) của Baltimore (thu nhập ròng / số cổ phiếu bình quân gia quyền\nđang lưu hành) trong năm 2004 là 4.200.000 USD / 750.000 = $5,60.\nĐể tính EPS pha loãng, chúng tôi sử dụng phương pháp cổ phiếu quỹ để tính các chứng quyền:\nSố cổ phiếu phổ thông được tạo nếu thực hiện quyền chọn = 10.000 × 10 = 100.000\nDòng tiền vào nếu thực hiện chứng quyền = 40 USD × 100.000 = $4.000.000\nCổ phiếu được mua bằng các quỹ này = $4.000.000 / 50 = 80.000\nSố lượng cổ phiếu đang lưu hành tăng ròng = 100.000 – 80.000 = 20.000\nEPS pha loãng = $4.200.000 / (750.000 + 20.000) = 5,45 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":32,"q":"Which of the following statements about a firm with convertible preferred stock outstanding\nis most accurate?","opts":["If diluted and basic EPS are equal, the firm must report both basic and diluted EPS.","Diluted EPS is calculated with net income minus preferred dividends in the numerator.","If diluted EPS is less than basic EPS then the convertible preferred is said to be antidilutive."],"ans":"A","expl":"Một công ty có bất kỳ chứng khoán có khả năng suy giảm giá trị nào phải báo cáo cả EPS cơ bản và\npha loãng, ngay cả khi cả hai đều bằng nhau. Nếu cổ phiếu ưu đãi chuyển đổi có tác động suy giảm thu nhập\ntrên mỗi cổ phiếu, thì cổ tức ưu đãi sẽ được cộng lại vào tử số như thể cổ phiếu ưu đãi\nđã được chuyển đổi thành cổ phiếu phổ thông. Nếu EPS pha loãng nhỏ hơn EPS cơ bản thì\nưu tiên có thể chuyển đổi được cho là có tính pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":33,"q":"A company has the following sequence of events regarding its stock:\nThe company had 1,000,000 shares outstanding at the beginning of the year.\nOn June 30, the company declared and issued a 10% stock dividend.\nOn September 30, the company sold 400,000 shares of common stock at par.\nThe number of shares that should be used to compute basic earnings per share at year end\nis:","opts":["1,200,000.","1,000,000.","1,100,000."],"ans":"A","expl":"Tính toán sắp chữ: 100%\ncổ phiếu gốc của cổ phiếu phổ thông= 1.000.000(12)= 12.000.000\ncổ tức bằng cổ phiếu= 100.000(12)= 1.200.000\ncổ phiếu phổ thông mới= 400.000(3)= 1.200.000\n14.400.000\ntổng số cổ phiếu phổ thông= 1.200.000\n=\n12\nCổ tức bằng cổ phiếu được cho là đã tồn đọng kể từ đầu năm.\n(Học phần 28.4, LOS 28.d)"},{"n":34,"q":"Sampson Corp. had 500,000 shares of common stock outstanding at the beginning of the\nyear. The average market price was $20.\nOn April 1, Sampson issued 100,000 shares of $1000 par value 10 percent preferred\nstock.\nOn July 1, Sampson issued 200,000 warrants to purchase 10 shares of common stock\neach at $22 per share.\nOn October 1, Sampson repurchased 60,000 of common stock as treasury stock for\n$15 per share.\nThe weighted average common shares outstanding Sampson should use to compute basic\nearnings per share (EPS) was:","opts":["485,000.","515,000.","600,000."],"ans":"A","expl":"Chỉ giao dịch ngày 1 tháng 10 mới ảnh hưởng đến số lượng cổ phiếu phổ thông bình quân gia quyền đang lưu hành\nvì giao dịch ngày 1 tháng 4 sẽ không ảnh hưởng đến số lượng cổ phiếu đang lưu hành và\ngiao dịch ngày 1 tháng 7 liên quan đến các chứng quyền sẽ không được đưa vào phép tính EPS cơ bản\n. Cách tính EPS cơ bản là [(500.000 × 12) − (60.000 × 3)] / 12 = 485.000.\n(Mô-đun 28.4, LOS 28.d)"},{"n":35,"q":"All of the following are considered a potentially dilutive securities EXCEPT:","opts":["warrants.","preferred stock.","stock options."],"ans":"B","expl":"Không phải tất cả cổ phiếu ưu đãi đều có tính pha loãng. Chỉ cổ phiếu ưu đãi chuyển đổi mới có khả năng suy giảm tiềm năng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":36,"q":"The Fischer Company had net income of $1,500,000. Fischer paid preferred dividends of $5\non each of the 100,000 preferred shares. There are 1 million Fischer common shares\noutstanding. In addition to the common and preferred stock, Fischer has $25 million of 4%\nbonds outstanding. The face value of each bond is $1,000. Each bond is convertible into 40\ncommon shares. If Fischer's tax rate is 40%, determine its basic and diluted earnings per\nshare (EPS)?\nBasic EPSDiluted EPS","opts":["$1.50 | $1.25","$1.00 | $0.80","$1.00 | $1.25"],"ans":"B","expl":"($1.500.000−$500.000)\nEPS cơ bản==$1,00\n1.000.000\n($1.500.000−$500.000)+$1.000.000(1−0,4)\n$1.600.000\nEPS pha loãng===$0,80\n1.000.000+1.000.0002.000.000\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>The Fischer Company had net income of $1,500,000. Fischer paid preferred dividends of $5 on each of the 100,000 preferred shares. There are 1 million Fischer common shares outstanding. In addition to the common and preferred stock, Fischer has $25 million of 4% bonds outstanding. The face value of each bond is $1,000. Each bond is convertible into 40 common shares. If Fischer's tax rate is 40%, determine its basic and diluted earnings per share (EPS)?</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":37,"q":"Washington, Inc.'s stock transactions during the year 20X4 were as follows:\n720,000\nshares\nJanuary 1\nissued and\noutstanding\n2 for 1\nMay 1stock split\noccurred\nWhat was Washington's weighted average number of shares outstanding during 20X4, for\nearnings per share (EPS) computation purposes?","opts":["1,440,000.","1,500,000.","1,666,667."],"ans":"A","expl":"Số dư ngày 1 tháng 1 được điều chỉnh hồi tố cho việc chia tách cổ phiếu và (720.000 × 2 =)\n1.440.000 cổ phiếu được coi là đang lưu hành từ tháng 1.\n(Mô-đun 28.4, LOS 28.d)"},{"n":38,"q":"Under accrual accounting, revenues are recognized in the same period in which the\nassociated:","opts":["invoices are billed.","cash is collected.","expenses are incurred."],"ans":"C","expl":"Kế toán dồn tích dựa trên nguyên tắc khớp, theo đó doanh thu được tính\nđược ghi nhận trong cùng kỳ rằng các chi phí phát sinh để tạo ra các khoản doanh thu đó.\n(Mô-đun 28.2, LOS 28.b)"},{"n":39,"q":"Which of the following statements about the earnings per share calculation are most\naccurate?","opts":["If the diluted EPS is less than the basic EPS, then the diluted EPS is said to be anti- dilutive.","None of these choices are correct.","When calculating diluted EPS you must add the shares created from the conversion of the bonds to the denominator and the interest expense times the tax rate to the numerator."],"ans":"B","expl":"Chống pha loãng là khi EPS pha loãng > EPS cơ bản. Khi tính toán EPS pha loãng, bạn phải thêm\ncổ phiếu được tạo từ việc chuyển đổi trái phiếu sang mẫu số và lãi\n(1 – thuế suất) vào tử số.\n(Mô-đun 28.4, LOS 28.d)"},{"n":40,"q":"Zichron, Inc., had the following equity accounts on December 31:\nCommon stock: 20,000 shares.\nPreferred stock A: 10,000 shares convertible into common on a 2 for 1 basis, dividend\nof $40,000 was declared during the year.\nPreferred stock B: 10,000 shares, convertible to common on a 4 for 1 basis, dividend\nof $5,000 was declared during the year.\nThe company reported net income of $120,000 and paid a $20,000 dividend to its\ncommon shareholders.\nDiluted earnings per share for the year are:","opts":["$1.33.","$1.50.","$3.00."],"ans":"B","expl":"Toán sắp chữ: 100%\nEPS cơ bản = ($120.000 – $40.000 – $5.000) / 20.000 = $3,75.\nCổ phiếu ưu đãi chuyển đổi A: $40.000 / 2(10.000) = $2,00, thấp hơn EPS cơ bản nên\ncổ phiếu ưu đãi chuyển đổi có tính suy giảm.\nCổ phiếu ưu đãi chuyển đổi B: $5.000 / 4($10.000) = 0,125 USD, thấp hơn EPS cơ bản nên\ncổ phiếu ưu đãi chuyển đổi có tính suy giảm.\nEPS pha loãng = 120.000 USD / [20.000 + 2(10.000) + 4(10.000)] = 1,50 USD.\n(Học phần 28.4, LOS 28.d)"},{"n":41,"q":"A simple capital structure is least likely to include:","opts":["treasury stock.","callable preferred stock.","convertible bonds."],"ans":"C","expl":"Cấu trúc vốn đơn giản không bao gồm bất kỳ chứng khoán có khả năng suy giảm giá trị nào (chứng khoán\ncó thể làm giảm thu nhập trên mỗi cổ phiếu nếu được thực hiện). Trái phiếu chuyển đổi có khả năng suy giảm.\n(Mô-đun 28.4, LOS 28.d)"},{"n":42,"q":"Quad Associates, Inc.'s net income for 2005 was $892,000 with 400,000 shares outstanding.\nThe tax rate was 40 percent. Quad had 2,000 six percent $1,000 par value convertible bonds\nthat were issued in 2004. Each bond was convertible into 40 shares of common stock. Quad,\nInc.'s diluted earnings per share (Diluted EPS) for 2005 was closest to:","opts":["$2.23.","$2.41.","$2.01."],"ans":"C","expl":"Toán sắp chữ: 100%\nEPS cơ bản của Quad (thu nhập ròng / số cổ phiếu phổ thông bình quân gia quyền đang lưu hành) là\n$892.000 / 400.000 = $2,23.\nEPS pha loãng được tính theo giả định rằng trái phiếu chuyển đổi được chuyển đổi\nthành cổ phiếu phổ thông, lãi suất trái phiếu sau thuế được hoàn trả thành thu nhập ròng và\ncác cổ phiếu phổ thông bổ sung được thêm vào mẫu số của phương trình. EPS pha loãng\nEPS pha loãng của Quad là [$892.000 + (2.000 × $1.000 × 0,06)(1 − 0,40)] / [400.000 + (2.000 × 40)] = $2,01.\nVì EPS pha loãng nhỏ hơn EPS cơ bản nên chúng tôi biết rằng trái phiếu có tính pha loãng và phải\nđược xem xét khi tính toán EPS pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":43,"q":"The following information pertains to Bender, Inc., for last year:\nNet income of $25 million.\n1 million shares of $10 par value preferred stock outstanding paying a 10% dividend.\n50 million shares of common stock outstanding at the beginning of the year.\nIssued an additional 5 million shares of common stock on 7/1.\nWhat is Bender, Inc.'s basic earnings per share (EPS)?","opts":["$0.384.","$0.457.","$0.476."],"ans":"B","expl":"50.000.000 cổ phiếu phổ thông × 12 tháng = 600.000.000\n5.000.000 cổ phiếu phổ thông cổ phiếu × 6 tháng = 30.000.000 = 630.000.000\n630.000.000 / 12 = 52.500.000 cổ phiếu trung bình\n[$25.000.000(NI) − $1.000.000(cổ tức ưu đãi)] / 52.500.000 cổ phiếu = 24.000.000 USD /\n52.5000.000 = 0,457 USD\n(Mô-đun 28.4, LOS 28.d)"},{"n":44,"q":"Which of the following statements about the calculation of earnings per share (EPS) is least\naccurate?","opts":["Reacquired shares are excluded from the computation from the date of reacquisition.","Shares issued after a stock split must be adjusted for the split.","Options outstanding may have no effect on diluted EPS."],"ans":"B","expl":"Các cổ phiếu phát hành sau khi chia tách không cần phải điều chỉnh cho việc chia tách vì chúng đã là cổ phiếu \"mới\"\n. Quyền chọn có giá thực hiện lớn hơn giá cổ phiếu trung bình không ảnh hưởng đến\nEPS bị pha loãng. (Mô-đun 28.4, LOS 28.d)"},{"n":45,"q":"Selected information from Able Company's financial activities is as follows:\nNet Income was $720,000.\n1,000,000 shares of common stock were outstanding on January 1.\n1,000 shares of 8%, $1,000 par value preferred shares were outstanding on January 1.\nThe tax rate was 40%.\nThe average market price per share for the year was $20.\n6,000 shares of 3%, $500 par value preferred shares, convertible into common shares\nat a rate of 40 common shares for each preferred share, were outstanding for the\nentire year.\nAble's basic and diluted earnings per share (EPS) are closest to:\nBasic EPSDiluted EPS","opts":["$0.55 | $0.55","$0.64 | $0.64","$0.55 | $0.52"],"ans":"C","expl":"Tính toán sắp chữ: 100%\nThu nhập cơ bản trên mỗi cổ phiếu của Able ((Thu nhập ròng − Cổ tức cổ phiếu ưu đãi) / số lượng cổ phiếu trung bình đang lưu hành) trong năm 2004 là [($720.000 − ($500 × 6.000 × 0,03) − ($1.000 ×\n1.000 × 0,08)] / 1.000.000 = $0,55. Nếu cổ phiếu ưu đãi chuyển đổi được chuyển đổi thành cổ phiếu phổ thông\nvào ngày 1 tháng 1, 6.000 × 40 = 240.000 cổ phiếu bổ sung sẽ được phát hành. Ngoài ra,\ncổ tức của cổ phiếu ưu đãi chuyển đổi sẽ không được trả.\nVì vậy, EPS pha loãng là ($720.000 − 80.000) / (1.000.000 + 240.000) = $0,52.\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>Selected information from Able Company's financial activities is as follows:</p><p>Net Income was $720,000.</p><p>1,000,000 shares of common stock were outstanding on January 1.</p><p>1,000 shares of 8%, $1,000 par value preferred shares were outstanding on January 1.</p><p>The tax rate was 40%.</p><p>The average market price per share for the year was $20.</p><p>6,000 shares of 3%, $500 par value preferred shares, convertible into common shares at a rate of 40 common shares for each preferred share, were outstanding for the entire year.</p><p>Able's basic and diluted earnings per share (EPS) are closest to:</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":46,"q":"Savannah Corp.'s financial accounts for the year ended December 31 included the following\ninformation:\nNet Income: $122,000\nPreferred Stock Dividends Paid: $35,000\nCommon Stock Dividends Paid: $42,000\nCommon Shares outstanding at January 1: 50,000\n10% preferred $100 par value shares outstanding at January 1: 3,500\nNo stock transactions occurred during the year and all preferred stock dividends were paid.\nBasic earnings per share for Savannah are closest to:","opts":["$0.90.","$1.74.","$2.44."],"ans":"B","expl":"EPS cơ bản của Savannah Corp. ((thu nhập ròng – ưu tiên) cổ tức) / bình quân gia quyền\nsố lượng cổ phiếu phổ thông đang lưu hành) là (($122.000 − $35.000) / $50.000 =) $1,74.\n(Mô-đun 28.4, LOS 28.d)"},{"n":47,"q":"Suppose that JPK, Inc., paid dividends of $80,000 to its preferred shareholders and $40,000\nto its common shareholders during 2004. The company had 20,000 shares of common stock\nissued and outstanding on January 1, 2004, issued 7,000 more shares on June 1, 2004, and\npaid a 10% stock dividend on August 1, 2004. Assuming that JPK had $150,000 in net income,\nwhat is the firm's basic earnings per share (EPS) for 2004?","opts":["$2.91.","$2.64.","$2.71."],"ans":"B","expl":"1/1/00 22.000 cổ phiếu (được điều chỉnh theo tỷ lệ cổ tức bằng cổ phiếu 10%) × 12 tháng = 264.000\n6/1/00 7.700 cổ phiếu (được điều chỉnh theo tỷ lệ cổ tức bằng cổ phiếu 10%) × 7 tháng = 53.900\nTổng số cổ phiếu tháng = 317.900\nSố cổ phiếu trung bình = 317.900 / 12 = 26.492\nEPS cơ bản = ($150.000 − $80.000) / 26.492 = 2,64\n(Mô-đun 28.4, LOS 28.d)"},{"n":48,"q":"Gus Davy, CFA, is reviewing an industry that has been experiencing rising prices as well as\nunit volume growth. Davy's investment criteria include selecting companies generating the\nhighest profit margins. If Davy does not adjust companies' financial statements for their\ninventory cost assumptions, he is most likely to select companies that use:","opts":["LIFO.","weighted average cost.","FIFO."],"ans":"C","expl":"Phương pháp FIFO ghi nhận các chi phí lâu đời nhất trong giá vốn hàng bán. Khi giá tăng,\nCOGS sẽ thấp hơn và thu nhập ròng khi sử dụng FIFO sẽ cao hơn so với LIFO hoặc\nphương pháp chi phí trung bình. Thu nhập ròng cao hơn so với doanh thu (không bị ảnh hưởng bởi\nphương pháp chi phí hàng tồn kho) có nghĩa là tỷ suất lợi nhuận cao hơn. (Mô-đun 28.2, LOS 28.b)"},{"n":49,"q":"Robinson Company had 1 million shares outstanding at the beginning of the year. On April 1,\nRobinson issued an additional 300,000 shares. On July 1, Robinson issued 200,000 more\nshares. What is Robinson's weighted average number of shares outstanding for the\ncalculation of earnings per share?","opts":["1,325,000 shares.","1,200,000 shares.","1,500,000 shares."],"ans":"A","expl":"300.000 cổ phiếu phát hành vào ngày 1 tháng 4 có thời hạn lưu hành là 9 tháng, hay 9 / 12 = 75% của\nnăm. 200.000 cổ phiếu phát hành vào ngày 1 tháng 7 có thời hạn lưu hành là 6 tháng, hay 6/12 = 50%\ncủa năm. Số cổ phiếu trung bình có trọng số = 1.000.000 + (0,75) 300.000 + (0,5) 200.000 =\n1.325.000 cổ phiếu\n(Mô-đun 28.4, LOS 28.d)"},{"n":50,"q":"Zichron, Inc., had the following equity accounts on December 31:\nCommon stock: 20,000 shares.\nPreferred stock A: 10,000 shares convertible into common on a 2 for 1 basis, dividend\nof $40,000 was declared during the year.\nPreferred stock B: 10,000 shares, convertible to common on a 4 for 1 basis, dividend\nof $5,000 was declared during the year.\nThe company reported net income of $120,000 and paid a $20,000 dividend to its\ncommon shareholders.\nBasic earnings per share for the year are:","opts":["$2.75.","$2.00.","$3.75."],"ans":"C","expl":"EPS cơ bản = ($120.000 − 40.000 − 5.000) / 20.000 cổ phiếu = $3,75.\n(Mô-đun 28.4, LOS 28.d)"},{"n":51,"q":"Kendall Company's net income for 20X4 is $830,000 with 200,000 shares outstanding.\nKendall has 1,000 6% convertible bonds (each bond $1,000 face value and convertible into\n20 common shares) outstanding for the entire year. Kendall's tax rate is 40%. What is Kendall\nCompany's diluted earnings per share for 20X4?","opts":["$3.77.","$3.94.","$4.15."],"ans":"B","expl":"EPS cơ bản của Kendall là 830.000 USD / 200.000 = $4,15. Để tính toán EPS pha loãng, lãi trái phiếu\nsau thuế đã trả được cộng vào thu nhập ròng và số lượng cổ phiếu sẽ được phát hành\ntrong chuyển đổi sẽ được thêm vào mẫu số. EPS pha loãng của Kendall = [$830.000 + (1.000 ×\n$1.000 × 0,06) × (1 – 0,4)] / (200.000 + 20.000) = 3,94 USD. Vì EPS pha loãng nhỏ hơnEPS cơ bản\nnên chúng tôi biết rằng trái phiếu có tính pha loãng và cần được xem xét khi tính toán\nEPS pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":52,"q":"An analyst gathered the following information about a company:\n01/01/04 - 50,000 shares issued and outstanding at the beginning of the year\n04/01/04 - 5% stock dividend\n10/01/04 - 10% stock dividend\nWhat is the company's weighted average number of shares outstanding at the end of 2004?","opts":["55,000.","57,500.","57,750."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nSố lượng cổ phiếu phổ thông bình quân gia quyền đang lưu hành là số cổ phiếu\nđang lưu hành trong năm tính theo phần trong năm của chúng đã được lưu hành.\nCổ tức và chia tách được áp dụng cho tất cả cổ phiếu đã phát hành hoặc mua lại và tất cả cổ phiếu gốc hoặc\nđã điều chỉnh đang lưu hành trước khi chia tách hoặc chia cổ tức.\nBước 1) Áp dụng cổ tức ngày 01/04/04 cho cổ phiếu đầu năm: Cổ phiếu được điều chỉnh =\n1,05 × 50.000 = 52,500\nBước 2) Áp dụng chia cổ tức ngày 01/10/04 đối với số cổ phiếu điều chỉnh đầu năm. Điều chỉnh\nSố cổ phiếu đầu năm = 57.750 (= 1,1 × 52.500).\nBước 3) Tính số lượng cổ phiếu bình quân gia quyền. 57.750 × (12/12) = 57.750\nlượt chia sẻ.\n(Mô-đun 28.4, LOS 28.d)"},{"n":53,"q":"A company changes from an incorrect method of accounting to an acceptable one. Which of\nthe following statements about this change is most accurate?","opts":["It is a change in accounting principle and is reported below the line net of taxes.","It is an unusual or infrequent item and is reported in net income from continuing operations.","It requires restatement of any prior period results that are presented in the current financial statements."],"ans":"C","expl":"Nếu một công ty thay đổi từ phương pháp kế toán không chính xác sang phương pháp kế toán có thể chấp nhận được, thì\ncông ty phải tiết lộ bản chất của sai sót và ảnh hưởng của nó đối với thu nhập ròng và trình bày lại\nbất kỳ giai đoạn nào trước đó kết quả được trình bày trong báo cáo tài chính hiện tại.\n(Module 28.3, LOS 28.c)"},{"n":54,"q":"An analyst prepares the following common-size income statements for Perez Company:\n20X120X220X3\nSales100%100%100%\nCost of goods\n50%52%53%\nsold\nSelling and\nadministrative16%12%9%\nexpense\nInterest\n4%4%4%\nexpense\nPretax\n30%32%34%\nincome\nIncome tax\n15%16%17%\nexpense\nNet income15%16%17%\nBased only on this information, Perez's improving net profit margin is most likely a result of:","opts":["greater financial leverage.","controlling operating expenses.","improving gross margins."],"ans":"B","expl":"Sự cải thiện về tỷ suất lợi nhuận ròng từ 15% đến 17% dường như chủ yếu là do công ty\ngiảm chi phí bán hàng và quản lý từ 16% doanh thu xuống 9% doanh thu, do đó\ngiảm chi phí hoạt động từ 66% xuống 62% doanh thu. Tỷ suất lợi nhuận gộp đang giảm trong\ngiai đoạn này vì giá vốn hàng bán đang tăng tính theo phần trăm doanh thu. Mặc dù\nđòn bẩy tài chính không thể được xác định trực tiếp từ báo cáo kết quả hoạt động kinh doanh, nhưng thực tế là\nchi phí lãi vay là tỷ lệ phần trăm không đổi trên doanh thu cho thấy đòn bẩy tài chính ổn định.\n(Module 28.5, LOS 28.e)","qhtml":"<p>An analyst prepares the following common-size income statements for Perez Company:</p><table class=\"qtable\"><thead><tr><th></th><th>20X1</th><th>20X2</th><th>20X3</th></tr></thead><tbody><tr><td>Sales</td><td>100%</td><td>100%</td><td>100%</td></tr><tr><td>Cost of goods sold</td><td>50%</td><td>52%</td><td>53%</td></tr><tr><td>Selling and administrative expense</td><td>16%</td><td>12%</td><td>9%</td></tr><tr><td>Interest expense</td><td>4%</td><td>4%</td><td>4%</td></tr><tr><td>Pretax income</td><td>30%</td><td>32%</td><td>34%</td></tr><tr><td>Income tax expense</td><td>15%</td><td>16%</td><td>17%</td></tr><tr><td>Net income</td><td>15%</td><td>16%</td><td>17%</td></tr></tbody></table><p>Based only on this information, Perez's improving net profit margin is most likely a result of:</p>"},{"n":55,"q":"A 12 percent $100,000 convertible bond was issued on October 1, 2004. It is dilutive and can\nbe converted into 18,000 shares. The effective income tax rate for the year was 40%. What\nadjustments should be made to calculate diluted earnings per share?\nInterest added to theShares added to the\nnumeratordenominator","opts":["$1,800 | 4,500","$3,000 | 4,500","$3,000 | 18,000"],"ans":"A","expl":"Chi phí lãi vay trong ba tháng sau thuế được cộng vào tử số (12% ×\n$100.000 × 3/12 × 60 %) = 1.800 đô la. Số lượng cổ phiếu được thêm vào mẫu số là\n4.500. (18.000 × 3 / 12).\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>A 12 percent $100,000 convertible bond was issued on October 1, 2004. It is dilutive and can be converted into 18,000 shares. The effective income tax rate for the year was 40%. What adjustments should be made to calculate diluted earnings per share?</p><p><em>Options show → <strong>Interest Added to Numerator</strong> | <strong>Shares Added to Denominator</strong></em></p>"},{"n":56,"q":"The first-in-first-out (FIFO) expense recognition method for inventories best describes the\nphysical flow of goods if customers typically purchase units:","opts":["from the top of a stack.","in the same order the units are produced.","selectively from among all units for sale."],"ans":"B","expl":"Phương pháp luồng chi phí FIFO gần đúng nhất với luồng hàng hóa thực tế nếu khách hàng\nthường mua các đơn vị theo thứ tự sản xuất các đơn vị đó, chẳng hạn như hàng hóa có giới hạn\nthời hạn sử dụng. Nhập sau xuất trước (LIFO) gần đúng nhất với luồng hàng hóa nếu khách hàng\nmua các đơn vị từ đầu ngăn xếp, chẳng hạn như với nguyên liệu thô như than hoặc sỏi. Nếu\nkhách hàng chọn các đơn vị riêng lẻ trong số tất cả các đơn vị để bán thì luồng hàng\ncó thể không rõ ràng và phương pháp chi phí trung bình có thể mô tả nó tốt nhất.\n(Mô-đun 28.2, LOS 28.b)"},{"n":57,"q":"When considering the impact of warrants on earnings per share, the method to calculate the\nnumber of shares added to the denominator is derived using which method?","opts":["Treasury Stock method.","Cost recovery method.","Weighted average method."],"ans":"A","expl":"Phương pháp cổ phiếu quỹ giả định số tiền giả định mà công ty nhận được từ\nviệc thực hiện quyền chọn được sử dụng để mua cổ phiếu phổ thông của công ty\ntrên thị trường với mức giá trung bình trên thị trường.\n(Mô-đun 28.4, LOS 28.d)"},{"n":58,"q":"Selected information from Indigo Corp.'s financial activities in the year 20X9 included the\nfollowing:\nNet income is $5,600,000.\nThe tax rate is 40%.\n500,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $82 in 20X9.\n6,000 5% coupon $1,000 par value convertible bonds, which are convertible at a ratio\nof 20 shares for each bond, were outstanding the entire year.\n200,000 shares of common stock were issued on July 1.\n100,000 shares of common stock were purchased by the company as treasury stock\non October 1.\nIndigo Corp.'s diluted earnings per share for 20X9 are closest to:","opts":["$9.74.","$8.32.","$8.49."],"ans":"B","expl":"Toán sắp chữ: 100%\nCổ phiếu phổ thông bình quân gia quyền của Indigo = [(500.000 × 12) + (200.000 × 6) – (100.000 × 3)]\n/ 12 = 575.000. EPS cơ bản = 5.600.000 USD / 575.000 = 9,74 USD.\nĐối với EPS pha loãng, giả sử trái phiếu được chuyển đổi vào ngày 1 tháng 1 và các khoản thanh toán lãi\nkhông được thực hiện trên trái phiếu. Thu nhập ròng tăng lên bằng số tiền lãi trái phiếu\nsau thuế = $5.600.000 + [6.000 × $1.000 × 0,05 × (1 − 0,40)] = $5.780.000. Đã pha loãng\nEPS = 5.780.000 USD / (575.000 + 120.000) = 8,32 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":59,"q":"A firm had the following numbers of shares outstanding during the year:\nBeginning of year8,000,000 shares\nIssued on April 1750,000 shares\nPaid stock dividend of 20% on July 1\nIssued on October 1100,000 shares\nPurchased Treasury stock November 11,000,000 shares\nSplit 2 for 1 on December 31\nBased on this information, what is the weighted number of shares outstanding for the year?","opts":["20,783,333.","20,266,667.","42,444,444."],"ans":"B","expl":"Dư sót cả năm8.000.000 × 1,2 × 2 × 1,019.200.000\nNổi bật với 0,75 năm750.000 × 1,2 × 2 × 0,751.350.000\nDư nợ 0,25 năm100.000 × 2 × 0,2550.000\nNghỉ hưu trong 2 tháng-1.000.000 × 2 × (2/12)\nSố lượng cổ phiếu trung bình có trọng số trong năm:20.266.667\n(Mô-đun 28.4, LOS 28.d)"},{"n":60,"q":"The approach to revenue recognition in the converged accounting standards that were\nissued in May 2014 is best described as:","opts":["objectives-based.","principles-based.","rules-based."],"ans":"B","expl":"Các chuẩn mực kế toán tổng hợp liên quan đến ghi nhận doanh thu, ban hành vào tháng 5 năm 2014\nbởi IASB và FASB, đều dựa trên nguyên tắc.\n(Mô-đun 28.1, LOS 28.a)"},{"n":61,"q":"Which of the following statements regarding making changes in accounting principles is least\naccurate?","opts":["Changes in accounting estimates are now treated the same as changes in accounting principles.","The general rule is retrospective application.","A change in accounting principle is a change from one generally accepted accounting principle to another generally accepted principle. The firm making the change must justify the change."],"ans":"A","expl":"Những thay đổi trong ước tính kế toán không được xử lý giống như những thay đổi về nguyên tắc.\nNhững thay đổi về nguyên tắc được xử lý hồi tố, trong khi những thay đổi trong ước tính\nkế toán được tính trong giai đoạn hiện tại và tương lai. Cả hai câu lệnh còn lại\nđều chính xác.\n(Mô-đun 28.3, LOS 28.c)"},{"n":62,"q":"Selected information from Doors, Inc.'s financial activities in the year 2005 included the\nfollowing:\nNet income was $372,000.\n100,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $18 in 2005.\nDividends were paid in 2005.\n2,000, 6 percent $1,000 par value convertible bonds, which are convertible at a ratio\nof 25 shares for each bond, were outstanding the entire year.\nDoors, Inc.'s tax rate is 40%.\nDoors, Inc.'s diluted earnings per share (Diluted EPS) for 2005 was closest to:","opts":["$2.96.","$3.28.","$3.72."],"ans":"A","expl":"Cửa Thu nhập cơ bản trên mỗi cổ phiếu (EPS) là ($372.000 / 100.000 =) $3,72. Nếu trái phiếu được\nchuyển đổi, việc thanh toán lãi sẽ không được thực hiện. Thu nhập ròng tăng lên nhờ\nlãi suất trả cho trái phiếu sau khi trừ thuế: $372.000 + (($1000 × 2.000 × 0,06) × (1 − 0,40)) =\n$444.000.\nEPS pha loãng là $444.000 / (100.000 + (2.000 × 25)) = $2,96.\n(Mô-đun 28.4, LOS 28.d)"},{"n":63,"q":"Assume that the exercise price of an option is $11, and the average market price of the stock\nis $16. Assuming 1,039 options are outstan
