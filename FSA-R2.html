ding during the entire year, what is the number of\nshares to be added to the denominator of the Diluted EPS?","opts":["714.","325.","1,039."],"ans":"B","expl":"Sắp chữ toán học: 100%\n(1.039 tùy chọn)($11) = $11.429\n$11.429 / $16 mỗi cổ phiếu\n1039 – 714 = 325 cổ phiếu hoặc [(16 – 11) / 16]1.039 = 325.\n(Mô-đun 28.4, LOS 28.d)"},{"n":64,"q":"How will dilutive securities affect earnings per share (EPS) when determining diluted\nearnings per share?","opts":["Increase EPS.","Either decrease or increase EPS depending upon if the security is dilutive or antidilutive.","Decrease EPS."],"ans":"C","expl":"Các chứng khoán có tính pha loãng như trái phiếu chuyển đổi và quyền chọn có cấu trúc vốn phức tạp\nvà luôn giảm EPS. Các trái phiếu có thể chuyển đổi và quyền chọn cũng có thể có tác dụng giảm pha loãng,\nđiều này sẽ làm tăng EPS do đó có tên là có tác dụng giảm pha loãng. Cách duy nhất để biết một chứng khoán\ncó pha loãng hay pha loãng là so sánh EPS cơ bản với EPS pha loãng. Nếu EPS pha loãng\ncao hơn EPS cơ bản thì chứng khoán có tính suy giảm suy giảm và không được đưa vào khi\nxác định EPS bị pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":65,"q":"Last year, the AKB Company had net income equal to $5 million. Combined state and local\ntaxes were 45%. The firm paid $1 million to holders of its 1 million common shares and\n$250,000 to 100,000 preferred shareholders. What was AKB's earnings per share (EPS) last\nyear?","opts":["$2.25.","$2.50.","$4.75."],"ans":"C","expl":"Tính toán sắp xếp: 100%\nEPS = thu nhập có sẵn cho cổ đông phổ thông chia cho mức bình quân gia quyền\nsố lượng cổ phiếu phổ thông đang lưu hành. Thu nhập dành cho cổ đông phổ thông là\nthu nhập ròng trừ đi cổ tức ưu đãi hoặc 4.750.000 USD (= 5 triệu USD – 250.000) đối với AKB.\n(Mô-đun 28.4, LOS 28.d)"},{"n":66,"q":"Assume that the exercise price of an option is $5, and the average market price of the stock\nis $8. Assuming 816 options are outstanding during the entire year, what is the number of\nshares to be added to the denominator of the diluted EPS?","opts":["816.","306.","510."],"ans":"B","expl":"(816)(5) = 4.080 USD. 4.080 USD / 8 USD = 510 cổ phiếu. 816 − 510 = 306 cổ phiếu mới hoặc [(8 − 5) / 8]816 =\n306.\n(Mô-đun 28.4, LOS 28.d)"},{"n":67,"q":"A company has 1,000,000 warrants outstanding at the beginning of the year, each\nconvertible into one share of stock with an exercise price of $50. No new warrants were\nissued during the year. The average stock price during the period was $60, and the year-end\nstock price was $45. What adjustment for these warrants should be made, under the\ntreasury stock method, to the number of shares used to calculate diluted earnings per share\n(EPS)?","opts":["200,000.","0.","166,667."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nEPS pha loãng sử dụng giá trung bình. Vì giá trung bình lớn hơn giá thực hiện nên\ncác chứng quyền có tính suy giảm.\n60−50\n×1.000.000=166.667\n60\n(Module 28.4, LOS 28.d)"},{"n":68,"q":"Selected information from Caledonia, Inc.'s financial activities in the year 20X6 is as follows:\nNet income = $460,000.\n2,300,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $2 and the year-end stock price was $1.50.\n1,000 shares of 8%, $1,000 par value preferred shares were outstanding on January 1.\nPreferred dividends were paid in 20X6.\n10,000 warrants, each of which allows the holder to purchase 100 shares of common\nstock at an exercise price of $1.50 per common share, were outstanding the entire\nyear.\nCaledonia's diluted earnings per share for 20X6 are closest to:","opts":["$0.165.","$0.15.","$0.180."],"ans":"B","expl":"EPS cơ bản của Caledonia = (thu nhập ròng − cổ tức cổ phiếu ưu đãi) / (có trọng số\nsố lượng cổ phiếu phổ thông trung bình đang lưu hành)\n= [$460.000 − ($1.000 × 1.000 × 0,08)] / 2.300.000 = $0,17.\nSử dụng phương pháp cổ phiếu quỹ, nếu chứng quyền được thực hiện, dòng tiền vào sẽ là\n10.000 × 100 × $1,50 = $1.500.000. Số lượng cổ phiếu Caledonia có thể được\nmua theo dòng tiền vào, sử dụng giá cổ phiếu trung bình, là 1.500.000 USD / 2 USD = 750.000. Mức tăng ròng\nsố lượng cổ phiếu phổ thông đang lưu hành sẽ là 1.000.000 − 750.000 =\n250.000.\nEPS pha loãng = 380.000 USD / (2.300.000 + 250.000) = 0,15 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":69,"q":"Connecticut, Inc.'s stock transactions during the year 20X5 were as follows:\nJanuary 1: 360,000 common shares outstanding.\nApril 1: 1 for 3 reverse stock split.\nJuly 1: 60,000 common shares issued.\nWhen computing for earnings per share (EPS) computation purposes, what is Connecticut's\nweighted average number of shares outstanding during 20X5?","opts":["210,000.","140,000.","150,000."],"ans":"C","expl":"Số dư cổ phiếu phổ thông đang lưu hành của Connecticut vào ngày 1 tháng 1 được điều chỉnh hồi tố\nđối với việc chia cổ phiếu ngược theo tỷ lệ 1: 3, nghĩa là có (360.000 / 3) = 120.000 cổ phiếu \"mới\"\nđược xử lý như thể chúng đã được lưu hành kể từ ngày 1 tháng 1. Trung bình có trọng số của\ncổ phiếu phát hành vào tháng 7, (60.000 × 6 / 12) = 30.000 được thêm vào con số đó, đối với tổng cộng\n150.000.\n(Mô-đun 28.4, LOS 28.d)"},{"n":70,"q":"Maine Company's stock transactions during the year are described below:\n100,000\ncommon\nJanuary 1\nshares\noutstanding\n2 for 1\nMarch 1\nstock split\n10% stock\nAugust 1\ndividend\nThe weighted average number of shares outstanding used to calculate earnings per share is:","opts":["201,666.","220,000.","211,111."],"ans":"B","expl":"Số dư ngày 1 tháng 1 số lượng cổ phiếu phổ thông đang lưu hành được điều chỉnh hồi tố đối với cả\ncổ tức bằng cổ phiếu và việc chia tách cổ phiếu. Số cổ phiếu bình quân gia quyền đang lưu hành trong năm =\n100.000 × 2 × 1,1 = 220.000.\n(Mô-đun 28.4, LOS 28.d)"},{"n":71,"q":"At the beginning of the year, BJC Company had 40,000 shares of $1 par common stock\noutstanding. On April 1, BJC issued a 2-for-1 stock split and on July 1, BJC reacquired 20,000\nshares. On October 1, BJC issued 8,000 shares of $10 par, 5% cumulative preferred stock.\nHow many shares should BJC use to calculate diluted earnings per share?","opts":["60,000.","62,000.","70,000."],"ans":"C","expl":"Việc chia cổ phiếu được áp dụng từ đầu năm. Bởi vì cổ phiếu ưu đãi\nkhông thể chuyển đổi nên nó không ảnh hưởng đến số lượng cổ phiếu phổ thông để tính toán\nEPS pha loãng. Cổ phiếu đầu kỳ (40.000 cổ phiếu × 12 tháng) + cổ phiếu chia nhỏ (40.000 cổ phiếu × 12\ntháng) − cổ phiếu mua lại (20.000 cổ phiếu × 6 tháng) = 840.000 và 840.000 / 12\ntháng = 70.000 cổ phiếu.\n(Mô-đun 28.4, LOS 28.d)"},{"n":72,"q":"Selected information from Gerrard, Inc.'s financial activities in the most recent year was as\nfollows:\nNet income was $330,000.\nThe tax rate was 40%.\n700,000 shares of common stock were outstanding on January 1.\nThe average market price per share for the year was $6.\nDividends were paid during the year.\n2,000 shares of 8% $500 par value preferred shares, convertible into common shares\nat a rate of 200 common shares for each preferred share, were outstanding for the\nentire year.\n200,000 shares of common stock were issued on March 1.\nGerrard, Inc.'s diluted earnings per share (diluted EPS) was closest to:","opts":["$0.261.","$0.197.","$0.289."],"ans":"A","expl":"Để tính thu nhập cơ bản trên mỗi cổ phiếu (EPS) của Gerrard ((thu nhập ròng – cổ tức ưu đãi) /\ncổ phiếu phổ thông bình quân gia quyền đang lưu hành), cổ phiếu phổ thông bình quân gia quyền\nxuất sắc phải được tính toán. 700.000 cổ phiếu đang lưu hành từ ngày 1 tháng 1 và\n200.000 cổ phiếu được phát hành vào ngày 1 tháng 3, do đó bình quân gia quyền là 700.000 + (200.000 ×\n10 / 12) = 866.667. EPS cơ bản là $330.000 − (2.000 × $500 × 0,08)) / 866.667 = $0,289.\nNếu cổ phiếu ưu đãi chuyển đổi được chuyển đổi thành cổ phiếu phổ thông, 2.000 × 200 =\n400.000 cổ phiếu phổ thông bổ sung sẽ được phát hành và cổ tức trên\ncổ phiếu ưu đãi sẽ không được thanh toán. EPS bị pha loãng là 330.000 USD / (866.667 + 400.000)\n= 0,261 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":73,"q":"Changes in asset lives and salvage values are changes in accounting:","opts":["principle and are applied retrospectively.","estimates and are applied retrospectively.","estimates and are applied prospectively."],"ans":"C","expl":"Toán sắp chữ: 100%\nNhững thay đổi về thời gian tồn tại của tài sản và giá trị thu hồi là những thay đổi trong ước tính kế toán và không\nđược coi là những thay đổi trong nguyên tắc kế toán. Những thay đổi trong ước tính kế toán sẽ được áp dụng dự kiến\n.\n(Mô-đun 28.3, LOS 28.c)"},{"n":74,"q":"The Allen Corporation had 100,000 shares of common stock outstanding at the beginning of\nthe year. Allen issued 30,000 shares of common May 1. On July 1, the company issued a 10%\nstock dividend. On September 1, Allen issued 1,000, 10% bonds convertible into 21 shares of\nstock each. What is the weighted average number of shares to be used in computing basic\nand diluted earnings per share (EPS), assuming the convertible bonds are dilutive?","opts":["132,000 | 146,000","130,000 | 132,000","132,000 | 139,000"],"ans":"C","expl":"Tính cổ phiếu cơ bản:\nNgày 1 tháng 1 100.000 cổ phiếu đang lưu hành\nNgày 1 tháng 5 30.000 cổ phiếu phát hành\nNgày 1 tháng 7 Phát hành cổ tức 10% bằng cổ phiếu\nCổ tức 10% bằng cổ phiếu có hiệu lực trở về trước:\n110.000 cổ phiếu × 12 tháng = 1.320.000\n33.000 cổ phiếu × 8 tháng = 264.000\nTổng số cổ phiếu-tháng = 1.584.000\nSố cổ phiếu trung bình = (1.584.000 / 12) = 132.000\nTính cổ phiếu pha loãng:\n(1.000 trái phiếu) × (mỗi trái phiếu 21) × (4 tháng) = 84.000 tổng số cổ phiếu-tháng\n84.000 / 12 = 7.000 Cổ phiếu trung bình\nTổng số cổ phiếu pha loãng = 7.000 (từ trái phiếu chuyển đổi) + 132.000 (từ cổ phiếu) =\n139.000\nToán sắp chữ: 100%\n(Học phần 28.4, LOS 28.d)","qhtml":"<p>The Allen Corporation had 100,000 shares of common stock outstanding at the beginning of the year. Allen issued 30,000 shares of common May 1. On July 1, the company issued a 10% stock dividend. On September 1, Allen issued 1,000, 10% bonds convertible into 21 shares of stock each. What is the weighted average number of shares to be used in computing basic and diluted earnings per share (EPS), assuming the convertible bonds are dilutive?</p><p><em>Options show → <strong>Basic Shares</strong> | <strong>Diluted Shares</strong></em></p>"},{"n":75,"q":"Selected information from Jupiter Corp.'s financial activities in the year 20X5 is as follows:\nNet income is $18,300,000.\n115,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $150 in 20X5.\n200 warrants, which each allow the holder to purchase 100 shares of common stock\nat an exercise price of $100 per common share, were outstanding the entire year.\n60,000 shares of common stock were issued on April 1.\n45,000 shares of common stock were purchased by the company as treasury stock on\nOctober 1.\nJupiter Corp.'s diluted earnings per share for 20X5 are closest to:","opts":["$117.75.","$123.02.","$159.13."],"ans":"A","expl":"Để tính thu nhập cơ bản trên mỗi cổ phiếu (EPS) của Jupiter, hãy sử dụng công thức: (thu nhập ròng −\ncổ tức ưu đãi) / trọng số số cổ phiếu phổ thông bình quân đang lưu hành. Bình quân gia quyền\ncổ phiếu phổ thông đang lưu hành = [(115.000 × 12) + (60.000 × 9) – (45.000 × 3)] / 12 = 148.750.\nEPS cơ bản = 18.300.000 USD / 148.750 = 123,02 USD.\nSử dụng phương pháp cổ phiếu quỹ, nếu chứng quyền được thực hiện thì dòng tiền vào sẽ là 200\n× $100 × 100 = $2.000.000. Số lượng cổ phiếu Jupiter có thể được mua bằng tiền mặt\nnày ở mức giá cổ phiếu trung bình là 2.000.000 USD / 150 USD = 13.333. Số lượng cổ phiếu ròng\nlẽ ra đã được tạo là 20.000 − 13.333 = 6.667. EPS pha loãng = 18.300.000 USD /\n(148.750 + 6.667) = 117,75 USD. Vì EPS pha loãng nhỏ hơn EPS cơ bản nên chứng quyền có\ncó tính pha loãng.\n(Mô-đun 28.4, LOS 28.d)"},{"n":76,"q":"The following data pertains to the McGuire Company:\nNet income equals $15,000.\n5,000 shares of common stock issued on January 1.\n10% stock dividend issued on June 1.\n1000 shares of common stock were repurchased on July 1.\n1000 shares of 10%, par $100 preferred stock each convertible into 8 shares of\ncommon were outstanding the whole year.\nWhat is the company's basic earnings per share (EPS)?","opts":["$1.20.","$2.50.","$1.00."],"ans":"C","expl":"Số lượng cổ phiếu trung bình:\n1/1 5.500 cổ phiếu phát hành (bao gồm 10% cổ tức bằng cổ phiếu vào ngày 1 tháng 6) × 12 = 66.000\n7/1 1.000 cổ phiếu được mua lại × 6 tháng = 6.000\n66.000 − 6.000 = 60.000\n60.000 cổ phiếu / 12 tháng = 5.000 cổ phiếu bình quân\nCổ tức ưu đãi = ($10)($1.000) = $10.000\nEPS cơ bản = [$15.000(NI) – $10.000(cổ tức ưu đãi)] / 5.000 cổ phiếu = $5.000 / 5.000\ncổ phiếu = $1/cổ phiếu\n(Học phần 28.4, LOS 28.d)"},{"n":77,"q":"In calculating the numerator for diluted Earnings Per Share, the interest on convertible debt\nis:","opts":["subtracted from earnings available to common shareholders after an adjustment for taxes.","added to earnings available to common shareholders.","added to earnings available to common shareholders after an adjustment for taxes."],"ans":"C","expl":"Toán sắp chữ: 100%\nCông thức = EPS pha loãng = [(Thu nhập ròng − Cổ tức ưu đãi) + Ưu tiên chuyển đổi\ncổ tức + (Lãi suất nợ chuyển đổi)(1 − t)] / [(Cổ phiếu bình quân gia quyền) + (Cổ phiếu từ\nchuyển đổi cổ phiếu chuyển đổi) + (Cổ phiếu từ chuyển đổi nợ chuyển đổi) + (Cổ phiếu có thể phát hành\ntừ quyền chọn cổ phiếu)]\n(Học phần 28.4, LOS 28.d)"},{"n":78,"q":"Based on the following data, how many shares of common stock should be used to calculate\ndiluted earnings per share?\nNet income of $1,500,000, tax retention rate of 60%.\n1,000,000 shares of common are outstanding at the beginning of the year.\n10,000, 6% convertible bonds with each bond convertible into 20 shares of common\nth\nstock were issued at par ($100) on June 30 of this year.\nThe firm has 100,000 warrants outstanding all year with an exercise price of $25 per\nshare.\nThe average stock price for the period is $20, and the ending stock price is $30.","opts":["1,100,000.","1,000,000.","1,266,667."],"ans":"A","expl":"Đầu tiên, hãy kiểm tra độ pha loãng: EPS cơ bản = 1.500.000 / 1.000.000 = 1,50\nChứng quyền: chống pha loãng vì giá cổ phiếu trung bình thấp hơn giá thực hiện\nTrái phiếu chuyển đổi: tử số tác động = (# trái phiếu) × (mệnh giá) × (lãi suất) × (thuế\ntỷ lệ duy trì) × (0,5 cho kỳ hạn 1/2 năm) = (10.000) × (100) × (0,06) × (0,6) × (0,5) =\n18.000, do đó tử số = 1.518.000 Tác động của mẫu số: tăng số cổ phiếu trung bình =\n[(# trái phiếu) × (hệ số chuyển đổi) × (# tháng chưa thanh toán)] / 12 = (1.200.000 / 12 = 100.000)\nvì vậy, mẫu số = 1.100.000 và EPS với chuyển đổi = 1.518.000 / 1.100.000 = 1,38,\nnhỏ hơn 1,50. Trái phiếu có tính pha loãng và tính toán EPS pha loãng sẽ sử dụng\n1.100.000 cổ phiếu phổ thông trong mẫu số. Chứng quyền đã hết tiền\ndựa trên mức giá trung bình là $20.\n(Mô-đun 28.4, LOS 28.d)"},{"n":79,"q":"Nichols Company's net income for 20X6 was $978,000 with 1,250,000 shares outstanding.\nThe average share price in 20X6 was $8.50. Nichols issued 2,000 warrants to purchase 100\nshares each for $10 per share in 20X5. Nichols Company's diluted earnings per share\n(diluted EPS) for 20X6 is closest to:","opts":["$0.782.","$0.793.","$0.777."],"ans":"A","expl":"EPS cơ bản của Nichols (thu nhập ròng / cổ phiếu phổ thông bình quân gia quyền đang lưu hành) là:\n$978.000 / 1.250.000 = $0,782.\nBởi vì giá thực hiện của chứng quyền cao hơn giá cổ phiếu trung bình, nên\nchứng quyền có tính kháng pha loãng và được loại trừ khỏi EPS bị pha loãng. Vì không có\nchứng khoán có khả năng suy giảm tiềm năng nào khác nên EPS pha loãng của Nichols trong năm 20X6 giống với EPS cơ bản.\n(Học phần 28.4, LOS 28.d)"},{"n":80,"q":"Assume that the exercise price of an option is $9, and the average market price of the stock\nis $12. Assuming 992 options are outstanding during the entire year, what is the number of\nshares to be added to the denominator of the Diluted EPS?","opts":["248.","992.","744."],"ans":"A","expl":"(992)($9) = $8928\n$8928 / 12 = 744\n992 − 744 = 248 lượt chia sẻ mới hoặc [(12 − 9) / 12]992 = 248\n(Mô-đun 28.4, LOS 28.d)"},{"n":81,"q":"The SSP Company had 5 million shares outstanding on January 1. On February 15 the board\nof directors approved a 3:2 stock split, effective April 1. What is the weighted average\nnumber of shares outstanding for the SSP Company for year-end?","opts":["5,625,000 shares.","7,500,000 shares.","6,875,000 shares."],"ans":"B","expl":"Việc chia cổ phiếu và chia cổ tức bằng cổ phiếu được áp dụng cho tất cả các cổ phiếu tồn tại vào đầu\nkỳ và các cổ phiếu đã được phát hành hoặc mua lại trong kỳ nhưng trước\nchia hoặc chia cổ tức. Đối với SSP, 5 triệu cổ phiếu đang lưu hành đầu năm được điều chỉnh\nthành 7,5 triệu cổ phiếu (5,0 × 3/2) do chia 3:2.\n(Mô-đun 28.4, LOS 28.d)"},{"n":82,"q":"At the beginning of this year Aristotle Co. had 400,000 shares of common stock outstanding.\nDuring the year, Aristotle paid a 10 percent stock dividend on May 31, issued 90,000 new\ncommon shares on June 30, and repurchased 12,000 shares on December 1. The number of\nshares Aristotle should use in computing earnings per share at the end of the year is:","opts":["475,000.","476,000.","484,000."],"ans":"C","expl":"[400.000 cổ phiếu × 12 tháng + 40.000 × 12 tháng + 90.000 × 6 tháng - (12.000 × 1\ntháng)] chia cho 12 = 484.000 cổ phiếu.\n(Mô-đun 28.4, LOS 28.d)"},{"n":83,"q":"Oregon Corp.'s stock transactions during the year were as follows:\nJanuary 1: 320,000 shares outstanding.\nApril 1: 1-for-2 reverse stock split occurred.\nJuly 1: Acquisition of Smith, Inc. in exchange for issuance of 60,000 shares.\nOctober 1: 30,000 shares issued for cash.\nWhat is Oregon's weighted average number of shares outstanding?","opts":["197,500.","250,000.","167,500."],"ans":"A","expl":"Số dư ngày 1 tháng 1 được điều chỉnh hồi tố cho việc chia tách cổ phiếu ngược và 320.000 / 2 =\n160.000 cổ phiếu được coi là đang lưu hành từ tháng 1 1. Việc phát hành cổ phiếu được bao gồm\nkể từ ngày phát hành. Cổ phiếu bình quân gia quyền được tính bằng cách nhân số lượng cổ phiếu\nvới số tháng cổ phiếu đang lưu hành, sau đó cộng số tiền\nnày và chia tổng cho 12.\nNgày 1 tháng 1:cổ phiếu ban đầu160.000 × 12 =1.920.000\nNgày 1 tháng 7:Smith mua lại60.000 × 6 =360.000\nNgày 1 tháng 10:phát hành tiền mặt30.000 × 3 =90.000\nTổng:2.370.000\nSố cổ phiếu bình quân gia quyền của Oregon = 2.370.000 / 12 = 197.500.\n(Mô-đun 28.4, LOS 28.d)"},{"n":84,"q":"Retrospective presentation is least likely required for a change from:","opts":["LIFO to average cost inventory valuation.","percentage-of-completion to completed contract revenue recognition.","zero salvage value to positive salvage value."],"ans":"C","expl":"Toán sắp chữ: 100%\nNhững thay đổi trong nguyên tắc kế toán yêu cầu trình bày hồi cứu. Thay đổi về\ngiá trị thu hồi của một tài sản là thay đổi trong ước tính kế toán, không áp dụng hồi tố\n.\n(Mô-đun 28.3, LOS 28.c)"},{"n":85,"q":"The ZZT Company went public on June 1, 2004, by issuing 25 million shares of common\nstock. In 2005, the firm raised additional capital by issuing 2 million shares of preferred\nstock. What is the weighted average number of common shares outstanding for the year\nending December 31, 2005?","opts":["14,583,333.","25,000,000.","10,416,667."],"ans":"B","expl":"Số lượng cổ phiếu phổ thông đang lưu hành bình quân gia quyền là số lượng cổ phiếu\nđang lưu hành trong năm tính theo phần trong năm chúng đang lưu hành.\nVì không có cổ phiếu phổ thông mới mới được phát hành vào năm 2005, và có 25 triệu cổ phiếu vào thời điểm\ncuối năm 2004, có 25 triệu cổ phiếu vào cuối năm 2005. Lưu ý rằng cổ phiếu ưu đãi\ncổ phiếu không ảnh hưởng đến số lượng cổ phiếu phổ thông đang lưu hành.\n(Module 28.4, LOS 28.d)"},{"n":86,"q":"Selected financial ratios from Mulroy Company's common-size income statements are as\nfollows:\n20X120X220X3\nGross\nprofit22%24%26%\nmargin\nOperating\nprofit18%20%22%\nmargin\nPretax\n15%14%13%\nmargin\nNet profit\n11%10%9%\nmargin\nRelative to sales, it is most likely that Mulroy's:","opts":["income tax expense is increasing.","operating expenses are increasing.","nonoperating expenses are increasing."],"ans":"C","expl":"Chi phí không hoạt động bằng chênh lệch giữa lợi nhuận hoạt động và lợi nhuận trước thuế\n. Dựa trên tỷ suất lợi nhuận nhất định, chi phí ngoài hoạt động của Mulroy đã tăng từ\n3% doanh thu trong năm 20X1 lên 9% doanh thu trong năm 20X3. Vì tỷ suất lợi nhuận gộp ngày càng tăng nên chi phí\ncủa hàng bán đang giảm tính theo phần trăm doanh thu. Các chi phí hoạt động khác và\nchi phí thuế thu nhập, tính theo phần trăm doanh thu, ổn định trong khoảng thời gian được hiển thị.\n(Mô-đun 28.5, LOS 28.e)","qhtml":"<p>Selected financial ratios from Mulroy Company's common-size income statements are as follows:</p><table class=\"qtable\"><thead><tr><th></th><th>20X1</th><th>20X2</th><th>20X3</th></tr></thead><tbody><tr><td>Gross profit margin</td><td>22%</td><td>24%</td><td>26%</td></tr><tr><td>Operating profit margin</td><td>18%</td><td>20%</td><td>22%</td></tr><tr><td>Pretax margin</td><td>15%</td><td>14%</td><td>13%</td></tr><tr><td>Net profit margin</td><td>11%</td><td>10%</td><td>9%</td></tr></tbody></table><p>Relative to sales, it is most likely that Mulroy's:</p>"},{"n":87,"q":"Matrix, Inc.'s common size income statement for the years ended December 31, 20X1 and\n20X2 included the following information (percent of net sales):\n20X120X2\nSales100100\nCost of Goods Sold(55)(60)\n4540\nSelling General & Administrative(5)(5)\nDepreciation(7)(8)\n3327\nInterest Expense(15)(6)\n1821\nIncome Tax Expense(6)(7)\n1214\nAnalysis of this data indicates that from 20X1 to 20X2:","opts":["cost of goods sold increased.","interest expense per dollar of sales declined.","the effective tax rate increased."],"ans":"B","expl":"Trong báo cáo thu nhập thông thường, tất cả số tiền đều được ghi dưới dạng phần trăm doanh thu.\nChi phí lãi trên mỗi đô la doanh thu đã giảm từ 0,15 xuống 0,06. Những cách giải thích\nkhác được liệt kê không nhất thiết đúng. Giá vốn hàng bán tăng theo phần trăm doanh thu,\nnhưng nếu doanh số bán hàng giảm, giá vốn hàng bán cũng có thể giảm. Thuế suất hiệu dụng của công ty\n(chi phí thuế thu nhập / thu nhập trước thuế) có thể được tính từ báo cáo thu nhập thông thường\n. Ở đây, thuế suất hiệu dụng là 33% trong cả hai năm.\n(Module 28.5, LOS 28.e)"},{"n":88,"q":"Antidilutive securities should be assumed to have been converted to common shares when\ncalculating:","opts":["basic EPS but not diluted EPS.","diluted EPS but not basic EPS.","neither basic nor diluted EPS."],"ans":"C","expl":"Chứng khoán chống pha loãng sẽ tăng EPS nếu được thực hiện hoặc chuyển đổi thành cổ phiếu phổ thông.\nDo đó, chúng tôi không cho rằng chúng được chuyển đổi khi chúng tôi tính toán EPS pha loãng. EPS cơ bản\nđược tính toán trước khi giả định bất kỳ chứng khoán có khả năng suy giảm nào được chuyển đổi.\n(Mô-đun 28.4, LOS 28.d)"},{"n":89,"q":"CXW, Inc. has issued 9,986 warrants, which were outstanding for the entire year, with an\nexercise price of $38. Each warrant is convertible into 1 share of common. The average\nmarket price of CXW's common stock for the year is $52.00 per share and its price at the end\nof the year is $45.00 per share. In the calculation of CXW's diluted earnings per share, how\nmany new shares would theoretically need to be issued to facilitate warrant conversion?","opts":["2,689.","8,433.","9,986."],"ans":"A","expl":"Nếu chứng quyền được thực hiện, công ty sẽ nhận được giá thực hiện cho mỗi chứng quyền:\n9,986 × $38 = $379,468\nSử dụng phương pháp cổ phiếu quỹ, chúng tôi giả định công ty sử dụng số tiền mặt này để mua lại cổ phiếu\nở mức giá trung bình trong năm:\n$379.468 / $52 = 7.297 cổ phiếu phổ thông\nNếu những cổ phiếu mua lại này được sử dụng để thực hiện chứng quyền, công ty sẽ cần\nphát hành 9.986 – 7.297 = 2.689 cổ phiếu phổ thông mới để thực hiện phần còn lại của chứng quyền.\n(Mô-đun 28.4, LOS 28.d)"},{"n":90,"q":"In calculating the numerator for diluted earnings per share, the dividends on convertible\npreferred stock (if it is dilutive) are:","opts":["subtracted from earnings available to common shareholders without an adjustment for taxes.","added to earnings available to common shareholders with an adjustment for taxes.","added to earnings available to common shareholders without an adjustment for taxes."],"ans":"C","expl":"EPS pha loãng = [(Thu nhập ròng − Cổ tức ưu đãi) + Cổ tức ưu đãi chuyển đổi +\n(Lãi suất nợ chuyển đổi)(1 − t)] / [(Trung bình có trọng số) cổ phiếu) + (Cổ phiếu từ chuyển đổi\ncổ phiếu chuyển đổi) + (Cổ phiếu từ chuyển đổi nợ chuyển đổi) + (Cổ phiếu có thể phát hành từ cổ phiếu\noptions)]\n(Mô-đun 28.4, LOS 28.d)"},{"n":91,"q":"At the beginning of 2004, the Alaska Corporation had 2 million shares of common stock\noutstanding and no preferred stock. At the end of August, 2004, Alaska issued 600,000 new\nshares of common stock. If Alaska reported net income equal to $8.8 million, what was the\nfirm's earnings per share for 2004?","opts":["$3.38.","$3.67.","$4.00."],"ans":"C","expl":"EPS = thu nhập có sẵn cho cổ đông phổ thông chia cho mức bình quân gia quyền\nsố lượng cổ phiếu phổ thông đang lưu hành. Không có cổ đông ưu đãi, tất cả thu nhập ròng\nđều có sẵn cho các cổ đông phổ thông. Số lượng cổ phiếu bình quân gia quyền\nđang lưu hành bằng 2 triệu cổ phiếu ban đầu cộng với 4/12 của 600.000 cổ phiếu bổ sung.\nTrọng số 4/12 được sử dụng vì số cổ phiếu mới chỉ lưu hành 4 tháng trong năm\n. Do đó, EPS = 8,8 triệu USD / [2 triệu + (4/12)(600.000)] = 8,8/2,2 = 4,00 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":92,"q":"Capitalizing interest costs related to a company's construction of assets for its own use is\nrequired by:","opts":["U.S. GAAP only.","both IFRS and U.S. GAAP.","IFRS only."],"ans":"B","expl":"Cả GAAP và IFRS của Hoa Kỳ đều yêu cầu các công ty tận dụng tiền lãi tích lũy trong quá trình\nxây dựng tài sản vốn để sử dụng cho riêng họ.\n(Mô-đun 28.2, LOS 28.b)"},{"n":93,"q":"An analyst has gathered the following information about Artcraft, Inc. for the year:\nNet income of $30,000.\n5,000 shares of common stock and 500 shares of 8%, $90 par convertible preferred\nstock outstanding during the whole year.\nEach share of convertible preferred can be converted into 4 shares of common stock.\nLast year, Artcraft issued at par, $60,000 total face value of 6.0% convertible bonds,\nwith each of the 60 bonds convertible into 110 shares of the Artcraft common stock.\nIf Artcraft's effective tax rate is 40%, what will Artcraft report as diluted earnings per share\n(EPS)?","opts":["$3.12.","$2.36.","$3.37."],"ans":"B","expl":"Toán sắp chữ: 100%\nTrước tiên hãy tính EPS cơ bản, như nên loại trừ mọi công cụ chống pha loãng.\nEPS cơ bản = (thu nhập ròng – cổ tức ưu đãi)/cổ phiếu phổ thông bình quân gia quyền\nEPS cơ bản = ($30.000 – $3.600)/5.000 = $5,28.\nEPS pha loãng = thu nhập được điều chỉnh sau khi chuyển đổi (EAC) / bình quân gia quyền cộng tiềm năng\ncổ phiếu phổ thông đang lưu hành.\nBước 1: Tính EAC đã điều chỉnh\nnet\nthu nhập -\nEAC đã điều chỉnh:\nưu tiên\ncổ tức\ncổ tức\ntrên\n+có thể chuyển đổi\nưa thích\ncổ phiếu\nsau thuế\nlãi suất trên\n+\ncó thể chuyển đổi\nnợ\nđã điều chỉnh\nthu nhập\ncó sẵn\n=\ncho\ncommon\ncổ phiếu\ncổ tức ưu đãi = cổ tức ưu đãi chuyển đổi = (0,08)(90)(500) = 3.600\nlãi suất nợ chuyển đổi = (60.000)(0,06)(1 – 0,40) = 2.160\nEAC đã điều chỉnh = (30.000 – 3.600 + 3.600 + 2.160) = $32.160\nBước 2: Tính bình quân gia quyền cộng với số cổ phiếu phổ thông tiềm năng đang lưu hành.\ncó trọng số\ntrung bình\n=5.000\nchung\nchia sẻ\nchia sẻ\ntừ\nchuyển đổi\nof=(500 × 4)=2.000\ncó thể chuyển đổi\nưa thích\nstock\nshares=(60 × 110)=6.600\ntừ\nchuyển đổi\nTính toán sắp chữ: 100%\ncủa\ncó thể chuyển đổi\ntrái phiếu\ncó trọng số\nave. plus\ntiềm năng\n=13.600\ncommon\ncổ phiếu\noutst.\nBước 3: Xác nhận pha loãng hoặc chống pha loãng.\nTác động của cổ phiếu ưu đãi chuyển đổi là $3.600/2.000 = 1,8 USD, con số này thấp hơn\nso với BEPS và rất có tác động suy giảm.\nTác động của trái phiếu chuyển đổi là 2.160 USD/6.600 = 0,33 USD, một lần nữa lại thấp hơn BEPS\nvà do đó cũng có tác động suy giảm. Cả hai đều phải được đưa vào phép tính cuối cùng.\nBước 4: Tính EPS pha loãng\nEPS pha loãng = 32.160 / 13.600 = 2,36 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":94,"q":"Which expense recognition method is most appropriate for intangible assets with indefinite\nlives?","opts":["Test for impairment but do not amortize.","Use accelerated amortization for tax reporting and straight-line amortization for financial reporting.","Use straight-line amortization."],"ans":"A","expl":"Theo IFRS và US GAAP, tài sản vô hình có thời hạn sử dụng không xác định (ví dụ: lợi thế thương mại) không\nđược khấu hao nhưng ít nhất được kiểm tra mức độ suy giảm giá trị hàng năm.\n(Mô-đun 28.2, LOS 28.b)"},{"n":95,"q":"Examples of potentially dilutive securities least likely include:","opts":["stock options.","convertible preferred stock.","premium bonds."],"ans":"C","expl":"Việc trái phiếu được phát hành hay định giá ở mức cao hơn hay chiết khấu không liên quan đến việc\ntrái phiếu đó có khả năng suy giảm thu nhập trên mỗi cổ phiếu hay không. Trái phiếu và cổ phiếu ưu đãi chỉ\ncó khả năng suy giảm nếu chúng có thể chuyển đổi thành cổ phiếu phổ thông. Quyền chọn và chứng quyền cổ phiếu\ncó khả năng suy giảm vì chúng sẽ làm tăng số cổ phiếu phổ thông đang lưu hành nếu chúng được\nthực hiện.\n(Mô-đun 28.4, LOS 28.d)"},{"n":96,"q":"Assume that the exercise price of an option is $10, and the average market price of the stock\nis $13. Assuming 999 options are outstanding during the entire year, what is the number of\nshares to be added to the denominator of the diluted earnings per share (EPS)?","opts":["231.","768.","999."],"ans":"A","expl":"(999)(10) = 9,990\n9,990 / 13 = 768\n999 − 768 = 231\n(Mô-đun 28.4, LOS 28.d)"},{"n":97,"q":"When considering convertible preferred stock which of the following components of the\nearnings per share (EPS) equation needs to be adjusted to calculate diluted earnings per\nshare?","opts":["The denominator.","The numerator and denominator.","The numerator."],"ans":"B","expl":"Tử số sẽ tăng vì thu nhập dành cho cổ đông phổ thông là\ntăng lên do giảm cổ tức ưu đãi. Mẫu số tăng vì\nsố lượng cổ phiếu bình quân gia quyền tăng khi chuyển đổi cổ phiếu ưu đãi.\n(Mô-đun 28.4, LOS 28.d)"},{"n":98,"q":"A firm has a weighted average number of 20,000 common shares selling at an average of\n$10 throughout the year and 11,000, 10%, $100 par value preferred shares. If the firm earns\n$210,000 after taxes, what is its Basic EPS?","opts":["$7.50 / share.","$5.00 / share.","$10.50 / share."],"ans":"B","expl":"(210.000 − 110.000) / 20.000 = $5 chia sẻ\n(Học phần 28.4, LOS 28.d)"},{"n":99,"q":"The following information is for Trotters Diversified as of year-end:\nAverage common shares outstanding of 5.0 million.\nAverage market price for common stock of $35.00 per share.\nNet income of $9.0 million.\nCommon stock dividends paid of $1.2 million.\nTax rate of 40%.\n500,000 shares of cumulative convertible preferred stock with $30 par value and 10%\ndividend. Each preferred share is convertible into 5 common shares. Preferred\ndividends of $1.5 million were paid.\n10,000 convertible $1,000 par bonds with a 6.0% coupon, each convertible into 8\nshares of common stock.\n400,000 stock options, each option allows the holder to convert to one share of\ncommon stock at $32 per share.\nAll of these securities were outstanding for the full year.\nDiluted EPS for Trotters Diversified is closest to:","opts":["$1.23.","$1.50.","$1.19."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nChỉ có quyền chọn và cổ phiếu ưu đãi chuyển đổi có tính pha loãng. Trước tiên, hãy tính EPS cơ bản để\ndùng làm điểm chuẩn nhằm xác định các thành phần vốn có tác động suy giảm.\nEPS cơ bản = (thu nhập ròng – cổ tức ưu đãi) / bình quân gia quyền\ncổ phiếu đang lưu hành = (9,0 – 1,5) / 5,0 = 1,50 USD.\nTiếp theo, hãy kiểm tra độ pha loãng.\nCổ phiếu quyền chọn có tính pha loãng vì giá thực hiện thấp hơn giá cổ phiếu\ntrung bình. Không có tác động tử số từ các tùy chọn. Mẫu số\ntác động = # tùy chọn – [(# tùy chọn × giá thực hiện) / giá cổ phiếu trung bình)] = 400.000 –\n[(400.000 × 32) / 35] = 34.286 hay 0,034 triệu.\nĐể kiểm tra xem cổ phiếu ưu đãi chuyển đổi có pha loãng hay không, chúng ta cần xác định\nliệu nó có làm giảm EPS hay không. Đối với tử số, chúng tôi cộng lại cổ tức ưu đãi.\nTác động của mẫu số = (# cổ phiếu ưu đãi × tỷ lệ chuyển đổi) = 500.000 × 5 =\n2.500.000 hoặc 2,5 triệu. Khi đó, EPS = (9,0 – 1,5 + 1,5) / (5,0 + 2,5) = 1,20 USD. Do đó\ncổ phiếu ưu đãi chuyển đổi có tính pha loãng.\nĐể kiểm tra xem trái phiếu chuyển đổi có pha loãng hay không, chúng ta cần xác định xem\nchúng có làm giảm EPS hay không. Đối với tử số, chúng tôi cộng lại tác động sau thuế của\nphiếu giảm giá, hoặc (mệnh giá × phiếu giảm giá × (1 – t)), hoặc (10.000 trái phiếu × 1.000 mệnh giá × 0,06\nphiếu giảm giá × 0,6 ) = 360.000, hay 0,360 triệu USD. Mẫu số tác động = (# trái phiếu chuyển đổi\n× tỷ lệ chuyển đổi) = 10.000 × 8 = 80.000, hay 0,080 triệu. Khi đó, EPS = (9,0 –\n1,5 + 0,360) / (5,0 + 0,080) = 1,55 USD. Do đó, trái phiếu có tính pha loãng.\nCuối cùng, tính EPS pha loãng:\nEPS pha loãng = (9,0 – 1,5 + 1,5) / (5,0 + 2,5 + 0,034) = $1,1946.\n(Mô-đun 28.4, LOS 28.d)"},{"n":100,"q":"Which costs are least likely to be reported as an expense in the current accounting period?","opts":["Period costs.","Costs of producing inventory.","Loan interest that has not yet been paid."],"ans":"B","expl":"Chi phí hàng tồn kho được tính vào chi phí khi các mặt hàng được bán theo nguyên tắc phù hợp. Như một\nví dụ điển hình, nếu không có doanh số bán hàng nào được thực hiện thì chi phí sản xuất hàng tồn kho sẽ không được tính vào chi phí\nkỳ. Chi phí thời kỳ được tính vào chi phí trong kỳ. Theo phương pháp dồn tích,\ntiền lãi tích lũy trong kỳ sẽ được tính vào chi phí, bất kể khoản tiền đó đã được thanh toán\ntrong kỳ hay chưa. (Học ​​phần 28.2, LOS 28.b)"},{"n":101,"q":"Juniper Corp's stock transactions during the year 20X4 were as follows:\nJanuary 1540,000 shares issued and outstanding\nMarch 150 percent stock dividend\nJuly 1180,000 treasury shares reacquired\nOctober 160,000 treasury shares reissued\nWhen computing for earnings per share (EPS) computation purposes, what was Juniper's\nweighted average number of shares outstanding during 20X4?","opts":["735,000.","870,000.","930,000."],"ans":"A","expl":"Số dư ngày 1 tháng 1 được điều chỉnh hồi tố cho cổ tức bằng cổ phiếu và (540.000 × 1,5) =\n810.000 cổ phiếu được coi là đang lưu hành từ tháng 1 1. Số lượng trung bình có trọng số\ncủa cổ phiếu được tính bằng cách nhân số cổ phiếu với số tháng nắm giữ, như sau:\nNgày 1 tháng 1 Số cổ phiếu ban đầu (810.000 × 12) =9.720.000\nNgày 1 tháng 7 Số cổ phiếu được mua lại (-180.000 × 6) =1.080.000\nNgày 1 tháng 10 Số cổ phiếu phát hành lại (60.000 × 3) =180.000\n8.820.000\nSố cổ phiếu bình quân gia quyền là (8.820.000 / 12) = 735.000 cổ phiếu.\n(Mô-đun 28.4, LOS 28.d)"},{"n":102,"q":"Assume that the exercise price of an option is $6, and the average market price of the stock\nis $10. Assuming 802 options are outstanding during the entire year, the number of shares\nto be added to the denominator of diluted earnings per share (EPS) is closest to:","opts":["802.","321.","481."],"ans":"B","expl":"Tiền thu được từ việc thực hiện các tùy chọn sẽ là:\n(802)($6) = $4.812\nSố cổ phiếu có thể được mua lại bằng số tiền thu được ở mức giá trung bình là:\n4.812 / 10 = 481,2\nSố lượng cổ phiếu bổ sung mà công ty cần phát hành để thực hiện các quyền chọn cổ phiếu\nlà:\n802 − 481 = 321\n(Mô-đun 28.4, LOS 28.d)"},{"n":103,"q":"Consider the following information on the past year's operating performance and current\ncapital structure for the following two companies:\nSupple MovesPerfect Collection\nPaid no dividendsPaid common & pref. div.\nAve. Stock Price of $42.00Ave. Stock Price of $22.00\nPositive net incomePositive net income\n110,000 warrants with an exerciseConvertible debt with an 8.0% coupon,\nprice of $50.00conversion ratio at 10.0.\n150,000 options outstanding with an exercise\nprice of $19.50\nBased on the information above, which of the companies has a complex capital structure?","opts":["Supple Moves and Perfect Collection.","Perfect Collection only.","Supple Moves only."],"ans":"A","expl":"Toán sắp chữ: 100%\nCấu trúc vốn phức tạp là cấu trúc có khả năng pha loãng. Ở đây, Supple\nMoves và Perfect Collection đều đáp ứng tiêu chí này. (Các chứng quyền cho Supple Moves sẽ\ncó tác dụng suy giảm nếu giá cổ phiếu trung bình trên 50,00 USD.)\n(Học phần 28.4, LOS 28.d)","qhtml":"<p>Consider the following information on the past year's operating performance and current capital structure for the following two companies:</p><table class=\"qtable\"><thead><tr><th>Supple Moves</th><th>Perfect Collection</th></tr></thead><tbody><tr><td>Paid no dividends</td><td>Paid common &amp; pref. div.</td></tr><tr><td>Ave. Stock Price of $42.00</td><td>Ave. Stock Price of $22.00</td></tr><tr><td>Positive net income</td><td>Positive net income</td></tr><tr><td>110,000 warrants with an exercise price of $50.00</td><td>Convertible debt with an 8.0% coupon, conversion ratio at 10.0.</td></tr><tr><td>150,000 options outstanding with an exercise price of $19.50</td><td></td></tr></tbody></table><p>Based on the information above, which of the companies has a complex capital structure?</p>"},{"n":104,"q":"At the beginning of 2004, Osami Corporation had 1.4 million shares of common stock\noutstanding and no preferred stock. At the end of August 2004, Osami issued 1.2 million new\nshares of common stock. If Osami reported net income equal to $7.2 million, what were its\nearnings per share (EPS) for 2004?","opts":["$2.77.","$3.33.","$4.00."],"ans":"C","expl":"Cổ phiếu mới chỉ lưu hành 4 tháng trong năm. Do đó, số lượng cổ phiếu đang lưu hành\nbình quân gia quyền là [1,4 + (4/12)(1,2)] triệu = 1,8 triệu cổ phiếu. Vì vậy, EPS cơ bản\n= 7,2 triệu USD / 1,8 triệu = 4,00 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":105,"q":"Ajax Company's capital structure was as follows:\nDecember 31, 2004December 31, 2003\nOutstanding shares of stock:\nCommon200,000200,000\nConvertible preferred5,0005,000\n6% Convertible Bonds$500,000$500,000\nDuring 2004, Ajax paid dividends of $2.00 per share on its preferred stock.\nThe preferred shares are convertible into 10,000 shares of common stock.\nThe 6% bonds are convertible into 15,000 shares of common stock.\nNet income for 2004 was $400,000.\nAssume that income tax rate is 40%.\nAjax's basic and diluted earnings per share for 2004 are:\nBasic EPSDiluted EPS","opts":["$1.80 | $1.86","$1.95 | $1.86","$1.95 | $1.95"],"ans":"B","expl":"EPS cơ bản: [400.000 − 10.000] / 200.000 cổ phiếu = 1,95 USD mỗi cổ phiếu\nEPS pha loãng: [400.000 + (30.000 × 0,6)] / [200.000 + 10.000 + 15.000] = 1,86 USD trên mỗi cổ phiếu\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>Ajax Company's capital structure was as follows:</p><table class=\"qtable\"><thead><tr><th>Outstanding shares of stock:</th><th>December 31, 2004</th><th>December 31, 2003</th></tr></thead><tbody><tr><td>Common</td><td>200,000</td><td>200,000</td></tr><tr><td>Convertible preferred</td><td>5,000</td><td>5,000</td></tr><tr><td>6% Convertible Bonds</td><td>$500,000</td><td>$500,000</td></tr></tbody></table><p>During 2004, Ajax paid dividends of $2.00 per share on its preferred stock. The preferred shares are convertible into 10,000 shares of common stock. The 6% bonds are convertible into 15,000 shares of common stock. Net income for 2004 was $400,000. Assume that income tax rate is 40%.</p><p>Ajax's basic and diluted earnings per share for 2004 are:</p>","cols":["Basic EPS","Diluted EPS"]},{"n":106,"q":"Which of the following statements regarding the treasury stock method of computing diluted\nshares is least accurate? The treasury stock method:","opts":["is used when the exercise price of the option is less than the average market price.","assumes that the hypothetical funds received by the company from the exercise of the options are used to sell shares of the company’s common stock in the market at the average market price.","increases the total number of shares by less than the number that the exercise of the options would create."],"ans":"B","expl":"Phương thức cổ phiếu quỹ giả định mọi khoản tiền mà công ty nhận được từ việc thực hiện\nquyền chọn đều được sử dụng để mua cổ phiếu (không bán cổ phiếu) cổ phiếu phổ thông của công ty\ncổ phiếu trên thị trường ở mức giá trung bình trên thị trường.\n(Mô-đun 28.4, LOS 28.d)"},{"n":107,"q":"During 20X3, Rory, Inc., reported net income of $15,000 and had 2,000 shares of common\nstock outstanding for the entire year. Rory also had 2,000 shares of 10%, $50 par value\npreferred stock outstanding during 20X3. During 20X1, Rory issued 100, $1,000 par, 6%\nbonds for $100,000. Each of the bonds is convertible to 50 shares of common stock. Rory's\ntax rate is 40%. Assuming these bonds are dilutive, 20X3 diluted EPS for Rory is closest to:","opts":["$0.71.","$2.50.","$1.23."],"ans":"C","expl":"EPS pha loãng = [NI − cổ tức ưu đãi + lãi suất chuyển đổi (1 − t)] / [weighted\ncổ phiếu trung bình + cổ phiếu nợ chuyển đổi]\n100(1.000)(6%)(1 − 0,4) = $3.600; cổ phiếu nợ chuyển đổi = 50(100) = 5.000\n$15.000−$10.000+$3.600\n=$1,23\n2.000+5.000\n(Module 28.4, LOS 28.d)"},{"n":108,"q":"Bluff, Inc.'s stock transactions during the year were as follows:\nJanuary 190,000 common shares outstanding.\nApril 120% stock dividend is declared and issued.\nOctober 110,000 shares are reacquired as treasury stock.\nWhat is Bluff's weighted average number of shares outstanding during the year?","opts":["101,000.","105,500.","98,000."],"ans":"B","expl":"Cổ phiếu ban đầu: 90.000 × 1,20 =108.000\n– Cổ phiếu quỹ được mua lại: 10.000 × 12/3 =–2.500\n105.500\n(Mô-đun 28.4, LOS 28.d)"},{"n":109,"q":"An analyst gathers the following data about a company:\nThe company had 1 million shares of common stock outstanding for the entire year.\nThe company's beginning stock price was $50, its ending price was $70, and its\naverage price was $60.\nThe company had 100,000 warrants outstanding for the entire year. Each warrant\nallows the holder to buy one share of common stock at $50 per share.\nHow many shares of common stock should the company use in computing its diluted\nearnings per share?","opts":["1,016,667.","1,083,333.","1,100,000."],"ans":"A","expl":"Tính toán sắp chữ: 100%\nSử dụng phương pháp cổ phiếu Kho bạc:\nBướcXác định số lượng cổ phiếu phổ thông được tạo nếu chứng quyền được thực hiện =\n1:100.000.\nBướcTính dòng tiền vào nếu chứng quyền được thực hiện: (100.000)($50 mỗi cổ phiếu) =\n2:$5.000.000.\nStepTính số lượng cổ phiếu có thể mua bằng số tiền này bằng cách sử dụng\n3:giá thị trường trung bình ($60 mỗi cổ phiếu): 5.000.000 / 60 = 83.333 cổ phiếu.\nBướcTính mức tăng ròng của số cổ phiếu phổ thông đang lưu hành từ việc thực hiện\n4:chứng quyền: 100.000 − 83.333 = 16.667.\nStepThêm số cổ phiếu phổ thông tăng ròng từ việc thực hiện chứng quyền đến\n5:số lượng cổ phiếu phổ thông đang lưu hành trong cả năm: 1.000.000 + 16.667 =\n1.016.667.\n(Module 28.4, LOS 28.d)"},{"n":110,"q":"Selected information from Feder Corp.'s financial activities for the year is as follows:\nNet income was $7,650,000.\n1,100,000 shares of common stock were outstanding on January 1.\nThe average market price per share was $62.\nDividends were paid during the year.\nThe tax rate was 40%.\n10,000 shares of 6% $1,000 par value preferred shares convertible into common\nshares at a rate of 20 common shares for each preferred share were outstanding for\nthe entire year.\n70,000 options, which allow the holder to purchase 10 shares of common stock at an\nexercise price of $50 per common share, were outstanding the entire year.\nFeder Corp.'s diluted earnings per share (EPS) was closest to:","opts":["$4.91.","$5.87.","$5.32."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nThu nhập cơ bản trên mỗi cổ phiếu của liên bang ((thu nhập ròng – cổ tức ưu đãi) / bình quân gia quyền\ncổ phiếu đang lưu hành) là (($7.650.000 – ($1.000 × 10.000 × 0,06)) / 1.100.000 =) $6,41.\nNếu cổ phiếu ưu đãi chuyển đổi được chuyển đổi thành cổ phiếu phổ thông vào ngày 1 tháng 1, (10.000 ×\n20 =) 200.000 cổ phiếu phổ thông bổ sung sẽ được phát hành, cổ tức trên\ncổ phiếu ưu đãi sẽ không được thanh toán và EPS pha loãng sẽ là ($7.650.000 /\n(1.100.000 + 200.000) = $5,88. Bởi vì $5,88 thấp hơn EPS cơ bản là $6,41 nên cổ phiếu\nưu tiên có tính suy giảm.\nSử dụng phương pháp cổ phiếu quỹ, nếu quyền chọn được thực hiện thì dòng tiền vào sẽ là\n(70.000 × 10 × $50 =) $35.000.000. Số lượng cổ phiếu Feder có thể được mua với\ndòng tiền vào (dòng tiền vào chia cho giá cổ phiếu trung bình) là ($35.000.000 / $62 =) 564.516.\nSố lượng cổ phiếu lẽ ra sẽ được tạo là (700.000 – 564.516 =) 135.484.\nEPS pha loãng là [($7.650.000 – ($1.000 × 10.000 × 0,06)] / (1.100.000 + 135.484) =) $5,71.\nVì mức này thấp hơn EPS là $6,41 nên các quyền chọn có tính suy giảm.\nKết hợp các phép tính, EPS bị pha loãng là (($7.650.000) / (1.100.000 + 200.000 +\n135.484) = $5,32.\n(Mô-đun 28.4, LOS 28.d)"},{"n":111,"q":"A company has convertible preferred stock outstanding. In the computation of diluted\nearnings per share, common shares issued when convertible preferred stock is converted\nare added to the denominator of the basic EPS equation, and the numerator is:","opts":["adjusted by adding back convertible preferred stock dividends.","adjusted by adding back non-convertible preferred stock dividends.","not adjusted."],"ans":"A","expl":"Nếu cổ phiếu ưu đãi chuyển đổi có tính pha loãng, thì cổ tức ưu đãi sẽ chưa được trả\nnếu cổ phiếu ưu đãi được chuyển đổi phải được cộng lại vào tử số. Lưu ý rằng\nmọi cổ tức cổ phiếu ưu đãi không chuyển đổi vẫn bị trừ vào thu nhập ròng trong\ntử số.\n(Mô-đun 28.4, LOS 28.d)"},{"n":112,"q":"Zachary Company's warrants issued in 2000 are Zachary's only outstanding potentially\ndilutive security. In 2005, EPS and Dilutive EPS differed for the first time. A possible\nexplanation for the change is the:","opts":["average market price of Zachary decreased.","average market price of Zachary increased.","year-end market price of Zachary increased."],"ans":"B","expl":"Giá thị trường trung bình tăng có thể khiến chứng quyền của Zachary chuyển từ giảm pha loãng\nsang pha loãng. Nếu giá trung bình của cổ phiếu tăng trong năm, chứng quyền đó sẽ tăng.\ncó thể sẽ được thực hiện vào một thời điểm nào đó trong năm. Cả hai lựa chọn khác đều không thực hiện được\nđiều này.\n(Mô-đun 28.4, LOS 28.d)"},{"n":113,"q":"Trotters Diversified has 10,000 convertible bonds with a 6.0% coupon and $1,000 par value,\neach convertible into 8 shares of common stock. How many shares related to the convertible\nbonds should be included in the denominator of basic EPS?","opts":["0.","10,000.","80,000."],"ans":"A","expl":"Việc tính toán EPS cơ bản không được điều chỉnh theo tác động của chứng khoán\ncó khả năng suy giảm.\n(Học phần 28.4, LOS 28.d)"},{"n":114,"q":"A firm's financial statements reflect the following:\nNet income$1,700,000\nEBIT$2,900,000\nEffective tax rate35%\nInterest payments$285,000\nCommon equity$3,100,000\nTotal assets$6,600,000\nPreferred dividends paid$1,100,000\nWeighted avg. shares outstanding523,000\nBased on this information, what is the firm's basic EPS?","opts":["$2.75.","$3.25.","$1.15."],"ans":"C","expl":"EPS cơ bản của công ty = ($1.700.000 – $1.100.000) / (523.000) = $1,147.\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>A firm's financial statements reflect the following:</p><table class=\"qtable\"><tbody><tr><td>Net income</td><td>$1,700,000</td></tr><tr><td>EBIT</td><td>$2,900,000</td></tr><tr><td>Effective tax rate</td><td>35%</td></tr><tr><td>Interest payments</td><td>$285,000</td></tr><tr><td>Common equity</td><td>$3,100,000</td></tr><tr><td>Total assets</td><td>$6,600,000</td></tr><tr><td>Preferred dividends paid</td><td>$1,100,000</td></tr><tr><td>Weighted avg. shares outstanding</td><td>523,000</td></tr></tbody></table><p>Based on this information, what is the firm's basic EPS?</p>"},{"n":115,"q":"The Gaffe Company had net income of $1,500,000. Gaffe paid preferred dividends of $5 on\neach of the 100,000 preferred shares. Each preferred share is convertible into 20 common\nshares. There are 1 million Gaffe common shares outstanding. In addition to the common\nand preferred stock, Gaffe has $25 million of 4% bonds outstanding. If Gaffe's tax rate is\n40%, what is its diluted earnings per share?","opts":["$0.33.","$0.50.","$1.00."],"ans":"B","expl":"Tính toán sắp chữ: 100%\nCổ phiếu ưu đãi có thể chuyển đổi thành 100.000 × 20 = 2 triệu cổ phiếu phổ thông. Chúng\ncó tính pha loãng vì:\n$1.000.000\nEPS cơ bản==$1,00\n1.000.000\n$1.500.000\nEPS pha loãng==$0,50 tức là less.\n3.000.000\n(Mô-đun 28.4, LOS 28.d)"},{"n":116,"q":"A firm has had the following numbers of shares outstanding during the year:\nBeginning of year10,000,000 shares\nIssued on April 1500,000 shares\nSplit 2 for 1 on July 1\nIssued on October 1100,000 shares\nSplit 2 for 1 on December 31\nBased on this information, what is the weighted number of shares outstanding for the year?","opts":["20,780,000.","42,400,000.","41,550,000."],"ans":"C","expl":"Dư sót cả năm10.000.000 × 2 × 2 × 140.000.000\nXuất sắc cho 0,75 năm500.000 × 2 × 2 × 0,751.500.000\nDư nợ trong 0,25 năm100.000 × 2 × 0,2550.000\nSố lượng cổ phiếu bình quân gia quyền trong năm:41.550.000\n(Module 28.4, LOS 28.d)"},{"n":117,"q":"Moulding Company's net income was $13,820,000 with 2,600,000 shares outstanding. The\naverage share price for the year was $58.00. Moulding had 10,000 options to purchase 10\nshares each at $40 per share outstanding the entire year. Moulding Company's diluted\nearnings per share are closest to:","opts":["$3.71.","$5.32.","$5.25."],"ans":"C","expl":"EPS cơ bản của Moulding (thu nhập ròng / số cổ phiếu phổ thông bình quân gia quyền đang lưu hành) là\n$13.820.000 / 2.600.000 = 5,32 USD.\nSử dụng phương pháp cổ phiếu quỹ để tính EPS pha loãng, nếu quyền chọn được thực hiện,\ndòng tiền vào sẽ là 10.000 × 10 × 40 USD = 4.000.000 USD. Dựa trên giá cổ phiếu trung bình\n$58,00, số lượng cổ phiếu Molding có thể mua được bằng dòng tiền là\n$4.000.000 / $58 = 68.966. Số lượng cổ phiếu lẽ ra được tạo là 100.000\n– 68.966 = 31.034. EPS bị pha loãng là 13.820.000 USD / (2.600.000 + 31.034) = 5,25 USD.\n(Mô-đun 28.4, LOS 28.d)"},{"n":118,"q":"An analyst gathered the following data about a company:\nThe company had 500,000 shares of common stock outstanding for the entire year.\nThe company's beginning stock price was $40, its ending price was $60, and its\naverage price over the year was $50.\nThe company has 120,000 warrants outstanding for the entire year.\nEach warrant allows the holder to buy one share of common stock at $45 per share.\nHow many shares of common stock should the company use in computing its diluted\nearnings per share?","opts":["500,000.","488,000.","512,000."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nSự pha loãng xảy ra do giá thực hiện chứng quyền ($45) thấp hơn giá thị trường trung bình\ncủa cổ phiếu ($50). Số lượng cổ phiếu đang lưu hành tăng dần được tìm thấy\ntừ:\ngiá thị trường−giá thực hiện\n50−45\n()×# Warrants=()×120.000=12.000\n50\ngiá thị trường\nSố lượng cổ phiếu cần sử dụng trong tính toán EPS pha loãng = 500.000 + 12.000 = 512.000. (Mô-đun\n28.4, LOS 28.d)"},{"n":119,"q":"Rushford Corp.'s net income is $16,500,000 with 300,000 shares outstanding. The tax rate is\n40%. The average share price for the year was $372. Rushford has 50,000, 9%, $1,000 par\nvalue convertible bonds outstanding. Each bond is convertible into two shares of common\nstock.\nRushford Corp.'s basic and diluted earnings per share (EPS) are closest to:\nBasic EPSDiluted EPS","opts":["$55.00 | $51.56","$55.00 | $48.00","$65.63 | $48.00"],"ans":"B","expl":"EPS cơ bản của Rushford (thu nhập ròng / số cổ phiếu phổ thông bình quân gia quyền đang lưu hành) là\n16.500.000 USD / 300.000 = 55,00 USD. EPS pha loãng được tính theo giả định rằng\ntrái phiếu chuyển đổi được chuyển đổi thành cổ phiếu phổ thông, lãi suất trái phiếu sau thuế là\nđược khôi phục thành thu nhập ròng và cổ phiếu phổ thông bổ sung được thêm vào mẫu số\ncủa phương trình. EPS pha loãng của Rushford là [16.500.000 USD + (50.000 × 1.000 USD × 0,09)(1 - 0,40)] /\n(300.000 + (50.000 × 2) = 48,00 USD.\n(Học phần 28.4, LOS 28.d)","qhtml":"<p>Rushford Corp.'s net income is $16,500,000 with 300,000 shares outstanding. The tax rate is 40%. The average share price for the year was $372. Rushford has 50,000, 9%, $1,000 par value convertible bonds outstanding. Each bond is convertible into two shares of common stock.</p><p>Rushford Corp.'s basic and diluted earnings per share (EPS) are closest to:</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":120,"q":"An analyst has gathered the following information about Barnstabur, Inc., for the year:\nReported net income of $30,000.\n5,000 shares of common stock and 2,000 shares of 8%, $90 par preferred stock\noutstanding during the whole year.\nBarnstabur, has $60,000 of 6.0% convertible bonds outstanding, with each of the 60\nbonds convertible into 110 shares of Barnstabur common stock.\nIf Barnstabur's effective tax rate is 40%, what will Barnstabur report for diluted earnings per\nshare (EPS)?","opts":["$1.53.","$2.36.","$1.66."],"ans":"A","expl":"Tính toán sắp chữ: 100%\nEPS bị pha loãng = thu nhập được điều chỉnh sau khi chuyển đổi (EAC) / bình quân gia quyền cộng với tiềm năng\ncổ phiếu phổ thông chưa thanh toán.\nBước 1: Tính EAC đã điều chỉnh\nnet\nthu nhập -\nEAC đã điều chỉnh:\nưu tiên\ncổ tức\nsau thuế\nlãi trên\n+\ncó thể chuyển đổi\nnợ\nđã điều chỉnh\nthu nhập\ncó sẵn\n=\ncho\ncommon\ncổ phiếu\ncổ tức ưu đãi = (0,08)(90)(2.000) = 14.400\nlãi suất nợ chuyển đổi = (60.000)(0,06)(1 – 0,40) = 2.160\nEAC đã điều chỉnh = (30.000 – 14.400 + 2.160) = $17.760\nBước 2: Tính bình quân gia quyền cộng với số cổ phiếu phổ thông tiềm năng đang lưu hành.\nweighted\naverage\n=5.000\ncommon\nshares\nshares\nfrom\nconversion\n= (60 × 110)=6.600\ncủa\ncó thể chuyển đổi\ntrái phiếu\ncó trọng số\nave. plus\ntiềm năng\n=11.600\ncommon\ncổ phiếu\noutst.\nBước 3: Tính EPS pha loãng\nEPS pha loãng = 17.760 / 11.600 = $1,53.\n(Mô-đun 28.4, LOS 28.d)"},{"n":121,"q":"Young Distributors, Inc. issued convertible bonds two years ago, and those bonds are the\nonly potentially dilutive security Young has issued. In 20X5, Young's basic earnings per share\n(EPS) and diluted EPS were identical, but in 20X4 they were different. Which of the following\nfactors is least likely to explain the difference between basic and diluted EPS? The:","opts":["bonds were antidilutive in 20X5 but not in 20X4.","bonds were redeemed by Young Distributors at the beginning of 20X5.","average market price of Young common stock increased in 20X5."],"ans":"C","expl":"Giá cổ phiếu trung bình không phải là yếu tố quyết định liệu trái phiếu chuyển đổi có pha loãng hay không\nhoặc thuốc chống pha loãng.\nNếu Young mua lại trái phiếu, họ sẽ không có chứng khoán có khả năng suy giảm\nnổi bật trong năm 20X5 và EPS pha loãng, nếu công ty báo cáo, sẽ bằng EPS cơ bản.\nEPS cơ bản và EPS pha loãng cũng sẽ bằng nhau trong năm 20X5 nếu trái phiếu có pha loãng trong\nnăm đó.\n(Mô-đun 28.4, LOS 28.d)"},{"n":122,"q":"Roome Corp. has 5,000,000 common shares outstanding. There are 500,000 warrants\noutstanding to purchase the stock at $20, and there are 200,000 options outstanding to buy\nthe stock at $50. The average market price for the stock over the year was $40, and the\ncurrent stock price is $60. The number of shares used to calculate diluted EPS is:","opts":["5,250,000 shares.","5,300,000 shares.","5,700,000 shares."],"ans":"A","expl":"Áp dụng phương pháp cổ phiếu quỹ cho chứng quyền, 5.000.000 + [500.000 − (500.000 ×\n$20) / $40] = 5.250.000 cổ phiếu. Các quyền chọn này có tính pha loãng vì giá thực hiện của chúng\ncao hơn giá cổ phiếu trung bình trong năm.\n(Học phần 28.4, LOS 28.d)"},{"n":123,"q":"Protocol, Inc.'s net income for 2005 was $4,800,000. Protocol had 800,000 shares of common\nstock outstanding for the entire year. The tax rate was 40 percent. The average share price in\n2005 was $37.00. Protocol had 5,000 8 percent $1,000 par value convertible bonds that were\nissued in 2004. Each bond is convertible into 25 shares of common stock. Protocol, Inc.'s\nbasic and diluted earnings per share for 2005 were closest to:\nBasic EPSDiluted EPS","opts":["$6.00 | $5.45","$5.19 | $4.92","$6.00 | $4.92"],"ans":"A","expl":"EPS cơ bản của Giao thức (thu nhập ròng / số cổ phiếu phổ thông bình quân gia quyền đang lưu hành) là\n$4.800.000 / 800.000 = $6,00. EPS pha loãng được tính toán theo giả định rằng\ntrái phiếu chuyển đổi được chuyển đổi thành cổ phiếu phổ thông và lãi suất trái phiếu sau thuế\nđược khôi phục thành thu nhập ròng. Cổ phần phổ thông từ việc chuyển đổi trái phiếu\nđược thêm vào mẫu số của phương trình. EPS pha loãng của giao thức là [$4.800.000 + (5.000\n× $1.000 × 0,08)(1 − 0,40)] / [800.000 + (5.000 × 25)] = $5,45.\n(Mô-đun 28.4, LOS 28.d)","qhtml":"<p>Protocol, Inc.'s net income for 2005 was $4,800,000. Protocol had 800,000 shares of common stock outstanding for the entire year. The tax rate was 40 percent. The average share price in 2005 was $37.00. Protocol had 5,000 8 percent $1,000 par value convertible bonds that were issued in 2004. Each bond is convertible into 25 shares of common stock. Protocol, Inc.'s basic and diluted earnings per share for 2005 were closest to:</p><p><em>Options show → <strong>Basic EPS</strong> | <strong>Diluted EPS</strong></em></p>"},{"n":124,"q":"The Widget Company had net income of $1 million for the period. There were 1 million\nshares of widget common stock outstanding for the entire period. If there are 100,000\noptions outstanding with an exercise price of $40, what is the diluted earnings per share for\nWidget common stock if the average price per share over the period was $50?","opts":["$0.99.","$1.00.","$0.98."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nSử dụng phương pháp cổ phiếu Kho bạc\nTiền thu được = 100.000 ($40) = $4.000.000\nCổ phiếu giả định được mua bằng số tiền thu được= $4.000.000/$50 = 80.000 cổ phiếu\nKhả năng pha loãng = 100.000 – 80.000 = 20.000 cổ phiếu\nEPS cơ bản = $1/cổ phiếu\nEPS bị pha loãng = 1.000.000 USD / 1.020.000 = 0,98 USD/cổ phiếu\n(Mô-đun 28.4, LOS 28.d)"},{"n":125,"q":"Which of the following statements is CORRECT regarding the reporting of earnings per share\n(EPS)?","opts":["Basic EPS can be less than diluted EPS.","Diluted EPS must be less than or equal to basic EPS.","The EPS when antidilutive securities are converted into shares of common stock is less than basic EPS."],"ans":"B","expl":"Chứng khoán có tính suy giảm là chứng khoán sẽ tăng EPS nếu được thực hiện hoặc chuyển đổi thành\ncổ phiếu phổ thông.\n(Học phần 28.4, LOS 28.d)"},{"n":126,"q":"A company has the following sequence of events regarding their stock:\nOne million shares outstanding at the beginning of the year.\nOn June 30th, they declared and issued a 10% stock dividend.\nOn September 30th, they sold 400,000 shares of common stock at par.\nBasic earnings per share at year-end will be computed on how many shares?","opts":["1,100,000.","1,200,000.","1,000,000."],"ans":"B","expl":"1.000.000(12) = 12.000.000\n100.000(12) = 1.200.000\n400.000(3) = 1.200.000\n14.400.000\nTổng = = 1.200.000\n12\n(Mô-đun 28.4, LOS 28.d)"},{"n":127,"q":"A company had the following changes in its stock:\nThe company had 2 million shares outstanding on December 31, 20X6.\nOn March 31, 20X7, the company paid a 10% stock dividend.\nOn June 30, 20X7, the company sold $10 million face value of 7% convertible\ndebentures, convertible into common at $5 per share.\nOn September 30, 20X7, the company issued and sold 100,000 shares of common\nstock.\nThe company should compute its 20X7 basic earnings per share based on:","opts":["2,225,000 shares.","2,250,000 shares.","3,225,000 shares."],"ans":"A","expl":"EPS cơ bản không tính đến khả năng pha loãng từ trái phiếu chuyển đổi.\nCổ phiếu gốc = 2.000.000(12) =24,000,000\n+ Cổ tức bằng cổ phiếu = 200,000(12) =2,400,000\n+ Cổ phiếu mới = 100,000(3) =300,000\n26,700,000\n26,700,000\n=2.225.000\n12\nCách khác, 2 triệu (1,1) + (1/4) (100.000) = 2,225 triệu. (Mô-đun 28.4, LOS 28.d)"},{"n":128,"q":"The following data pertains to the Megatron company:\nNet income equals $15,000.\n5,000 shares of common stock issued on January 1.\n10% stock dividend issued on June 1.\n1000 shares of common stock were repurchased on July 1.\n1000 shares of 10%, par $100 preferred stock each convertible into 8 shares of\ncommon were outstanding the whole year.\nHow many common shares should be used in computing the company's basic earnings per\nshare (EPS)?","opts":["4,500.","5,500.","5,000."],"ans":"C","expl":"1/1 Phát hành 5.500 cổ phiếu (bao gồm 10% cổ tức bằng cổ phiếu vào ngày 1/6) × 12 = 66.000\n7/1 1.000 cổ phiếu được mua lại × 6 tháng = 6.000\n66.000 − 6.000 = 60.000 cổ phiếu\n60.000 cổ phiếu / 12 tháng = 5.000 cổ phiếu trung bình\n(Module 28.4, LOS 28.d)"},{"n":129,"q":"Stanley Corp. had 100,000 shares of common stock outstanding throughout 2004. It also had\n20,000 stock options with an exercise price of $20 and another 20,000 options with an\nexercise price of $28. The average market price for the company's stock was $25 throughout\nthe year. The stock closed at $30 on December 31, 2004. What are the number of shares\nused to calculate diluted earnings per share for the year?","opts":["110,000.","105,000.","104,000."],"ans":"C","expl":"Tính toán sắp chữ: 100%\nChỉ các quyền chọn cổ phiếu có giá thực hiện là $20 mới mang tính pha loãng. Số cổ phiếu bổ sung của\n4.000 (20.000 − [(20.000 × 20) / 25]) được thêm vào 100.000 cổ phiếu phổ thông đang lưu hành.\n(Mô-đun 28.4, LOS 28.d)"},{"n":130,"q":"Which of the following statements regarding basic and diluted EPS is least accurate?","opts":["A simple capital structure contains no potentially dilutive securities.","Antidilutive securities decrease EPS if they are exercised or converted.","Dilutive securities decrease EPS if they are exercised or converted to common stock."],"ans":"B","expl":"Chứng khoán có pha loãng tăng EPS nếu thực hiện hoặc chuyển đổi thành cổ phiếu phổ thông.\n(Mô-đun 28.4, LOS 28.d)"}];
const CFG = {"title": "Analyzing Income Statements", "subtitle": "CFA · Financial Statement Analysis · Reading 28 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    if(q.cols){
      const ch = document.createElement("div");
      ch.className = "q-cols-header";
      q.cols.forEach(h=>{
        const sp = document.createElement("span"); sp.textContent = h;
        ch.appendChild(sp);
      });
      card.appendChild(ch);
    }

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      if(q.cols && t.includes(" | ")){
        b.dataset.cols = "2";
        t.split(" | ").forEach(p=>{
          const sp = document.createElement("span"); sp.className = "opt-col"; sp.textContent = p;
          b.appendChild(sp);
        });
      } else {
        b.appendChild(document.createTextNode(t));
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
