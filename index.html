<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập CFA — Ngân hàng câu hỏi</title>
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --soon:#64748b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
  header .logo{font-size:22px}
  header h1{margin:0;font-size:17px}
  header p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .search{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 12px;font:inherit;min-width:180px}
  main{max-width:980px;margin:0 auto;padding:22px 16px 80px}

  /* breadcrumb */
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:16px}
  .crumb button{background:none;border:none;color:var(--accent2);cursor:pointer;font:inherit;padding:0}
  .crumb button:hover{text-decoration:underline}

  /* subject grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .subj{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px;min-height:150px}
  .subj:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .subj .ico{font-size:30px}
  .subj h3{margin:0;font-size:15.5px}
  .subj .meta{color:var(--muted);font-size:12.5px;margin-top:auto}
  .bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);width:0}
  .pill{align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:99px;
    background:var(--panel2);color:var(--muted)}
  .pill.live{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}

  /* module list */
  .subj-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .subj-head .ico{font-size:34px}
  .subj-head h2{margin:0;font-size:20px}
  .subj-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .mod{display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .mod .num{width:34px;height:34px;flex:none;border-radius:9px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent2)}
  .mod .info{flex:1;min-width:0}
  .mod .info b{font-size:15px;display:block}
  .mod .info span{color:var(--muted);font-size:12.5px}
  .mod .badge{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--soon)}
  .mod .badge.ready{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .mod .badge.doing{background:#3b2f10;color:#fde68a;border:1px solid #f59e0b}
  .mod .badge.done{background:#0b3a52;color:#bae6fd;border:1px solid #38bdf8}
  .prog{display:inline-block;margin-top:4px;font-size:12px}
  .prog.doing{color:#fbbf24}
  .prog.done{color:#7dd3fc}
  .reset{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;
    font-size:12px;padding:2px 6px;white-space:nowrap}
  .reset:hover{color:#fecaca;text-decoration:underline}
  .btn{font:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    padding:8px 16px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:var(--accent2)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .empty{color:var(--muted);text-align:center;padding:50px 10px;font-size:14px}
  .hide{display:none}
  @media(max-width:520px){.search{min-width:130px}.mod{flex-wrap:wrap}.mod .info{order:2;flex-basis:100%}}
  /* ===== theme sáng ===== */
  #themeBtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:7px 11px;cursor:pointer;font:inherit;font-size:15px;line-height:1}
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --soon:#94a3b8;
  }
  html[data-theme="light"] .pill.live{background:#dcfce7;color:#166534}
  html[data-theme="light"] .mod .badge.ready{background:#dcfce7;color:#166534}
  html[data-theme="light"] .mod .badge.doing{background:#fef3c7;color:#92400e;border-color:#d97706}
  html[data-theme="light"] .mod .badge.done{background:#dbeafe;color:#1e40af;border-color:#3b82f6}
  html[data-theme="light"] .prog.doing{color:#b45309}
  html[data-theme="light"] .prog.done{color:#1d4ed8}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;

    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),

    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);

    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>

<header>
  <span class="logo">🎓</span>
  <div>
    <h1>Ngân hàng câu hỏi CFA</h1>
    <p>Chọn môn → chọn module để ôn tập</p>
  </div>
  <span class="spacer"></span>
  <input id="search" class="search" placeholder="Tìm môn / module…" oninput="onSearch()">
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
</header>

<main>
  <!-- VIEW 1: subjects -->
  <section id="subjectsView">
    <div class="crumb"><b>Các môn học</b></div>
    <div id="subjectGrid" class="grid"></div>
  </section>

  <!-- VIEW 2: modules of one subject -->
  <section id="modulesView" class="hide">
    <div class="crumb">
      <button onclick="showSubjects()">Các môn học</button>
      <span>›</span><span id="crumbSubj"></span>
    </div>
    <div class="subj-head">
      <div><h2 id="mName"></h2><p id="mDesc"></p></div>
    </div>
    <div id="moduleList"></div>
  </section>
</main>

const $ = id => document.getElementById(id);
let query = "";

function readyCount(s){ return s.modules.filter(m=>m.status==="ready").length; }
function totalCount(s){ return s.modules.length; }

/* ===== tiến trình: đọc localStorage do từng đề lưu lại ===== */
function progKey(file){ return "cfa:prog:" + file.replace(/\.html$/i,"").toLowerCase(); }
function getProg(file){
  if(!file) return null;
  try{ return JSON.parse(localStorage.getItem(progKey(file))||"null"); }
  catch(e){ return null; }
}
function subjStats(s){
  let done=0, doing=0;
  s.modules.forEach(m=>{
    const p = getProg(m.file); if(!p) return;
    if(p.graded) done++; else if((p.done||0)>0) doing++;
  });
  return {done, doing};
}
function resetProg(file, ev){
  ev.stopPropagation();
  if(!confirm("Xoá tiến trình của đề này?")) return;
  try{ localStorage.removeItem(progKey(file)); }catch(e){}
  // re-render whatever view is open
  if(!$("modulesView").classList.contains("hide")) showModules(currentSubj);
  else renderSubjects();
}

function renderSubjects(){
  const grid = $("subjectGrid"); grid.innerHTML = "";
  const q = query.toLowerCase();
  let shown = 0;
  HUB.forEach(s=>{
    const hit = !q || s.name.toLowerCase().includes(q) || (s.short||"").toLowerCase().includes(q)
      || s.modules.some(m=>m.title.toLowerCase().includes(q));
    if(!hit) return;
    shown++;
    const ready = readyCount(s), total = totalCount(s);
    const st = subjStats(s);
    const pct = total ? Math.round(st.done/total*100) : 0;
    const card = document.createElement("div");
    card.className = "subj";
    card.onclick = ()=>showModules(s.id);
    const meta = st.done||st.doing
      ? `Đã làm ${st.done}/${total} đề${st.doing?` · ${st.doing} đang làm`:''}`
      : `${ready}/${total||'—'} đề · ${s.short||''}`;
    card.innerHTML = `
      <span class="pill ${ready?'live':''}">${ready?ready+' đề sẵn sàng':'Sắp có'}</span>
      <h3>${s.name}</h3>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta">${meta}</div>`;
    grid.appendChild(card);
  });
  if(!shown) grid.innerHTML = `<div class="empty">Không tìm thấy môn nào khớp “${query}”.</div>`;
}

let currentSubj = null;
function showModules(id){
  currentSubj = id;
  const s = HUB.find(x=>x.id===id);
  $("subjectsView").classList.add("hide");
  $("modulesView").classList.remove("hide");
  $("crumbSubj").textContent = s.name;
  $("mName").textContent = s.name;
  $("mDesc").textContent = s.desc || "";
  const list = $("moduleList"); list.innerHTML = "";
  if(!s.modules.length){
    list.innerHTML = `<div class="empty">Chưa có module nào cho môn này.<br>Bạn upload đề sau, mình thêm vào đây.</div>`;
  }
  s.modules.forEach(m=>{
    const ready = m.status==="ready";
    const p = ready ? getProg(m.file) : null;
    const row = document.createElement("div");
    row.className = "mod";

    // trạng thái tiến trình
    let progLine = "", badgeCls = ready?"ready":"", badgeTxt = ready?"Có sẵn":"Sắp có";
    let btnLabel = "Làm bài →";
    if(p && p.graded){
      const pct = p.pct!=null?p.pct:0;
      progLine = `<span class="prog done">✓ Đã nộp · ${p.correct}/${p.total} (${pct}%)</span>`;
      badgeCls = "done"; badgeTxt = pct+"%"; btnLabel = "Xem lại →";
    }else if(p && (p.done||0)>0){
      progLine = `<span class="prog doing">⏳ Đang làm · ${p.done}/${p.total} câu</span>`;
      badgeCls = "doing"; badgeTxt = "Đang làm"; btnLabel = "Tiếp tục →";
    }

    row.innerHTML = `
      <div class="num">${m.n}</div>
      <div class="info">
        <b>${m.title}</b>
        <span>${m.q? m.q+' câu' : (m.n===0?'Cả môn — tất cả readings':'Reading '+m.n)} ${ready?'':'· chưa có đề'}</span>
        ${progLine}
      </div>
      <span class="badge ${badgeCls}">${badgeTxt}</span>`;

    if(p){
      const rb = document.createElement("button");
      rb.className = "reset"; rb.textContent = "↺ Đặt lại";
      rb.onclick = (ev)=>resetProg(m.file, ev);
      row.appendChild(rb);
    }
    const btn = document.createElement(ready?"a":"button");
    btn.className = "btn primary";
    if(ready){ btn.href = m.file; btn.textContent = btnLabel; }
    else { btn.textContent = "Sắp có"; btn.disabled = true; }
    row.appendChild(btn);
    list.appendChild(row);
  });
  window.scrollTo({top:0});
}

function showSubjects(){
  $("modulesView").classList.add("hide");
  $("subjectsView").classList.remove("hide");
  window.scrollTo({top:0});
}
function onSearch(){ query = $("search").value.trim();
  if(!$("subjectsView").classList.contains("hide")) renderSubjects();
}

renderSubjects();
// làm mới tiến trình khi quay lại từ một đề (kể cả bfcache)
window.addEventListener("pageshow", ()=>{
  if($("modulesView").classList.contains("hide")) renderSubjects();
  else if(currentSubj) showModules(currentSubj);
});
