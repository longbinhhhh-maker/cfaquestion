h’s forecasts relating to Archway’s price and volume changes:   Average price increase per unit = 5.00%  Volume growth = –3.00% <\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 4, Archway’s forecasted gross profit margin for 2020 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "Has Morales most likely violated the CFA Institute Standards of Professional Conduct?", "opts": ["Yes, concerning Duties to Employers", "Yes, concerning Preservation of Confidentiality", "No"], "ans": "C", "expl": "Because Morales believes his supervisor and potentially the client are engaged in fraudulent activity and following the requirements of local law, he has not violated Standard III(E)–Preservation of Confidentiality or Standard (V)–Duties to Employers.", "explhtml": "<p>Because Morales believes his supervisor and potentially the client are engaged in fraudulent activity and  following the requirements of local law, he has not violated Standard III(E)–Preservation of Confidentiality  or Standard (V)–Duties to Employers. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics<\/summary><div class=\"vig-body\"><p>Sergio Morales, CFA, believes he has found evidence that his supervisor is engaged in fraudulent activity  involving a client&#x27;s account. When Morales confronts his supervisor, he is told the client is fully aware of  the issue. Later that day, Morales contacts the client and after disclosing the fraudulent activity, he is  told by the client to mind his own business. Following the requirements of local law, Morales provides  all of his evidence, along with copies of the client&#x27;s most recent account statements, to a government  whistleblower program.  <\/p><p>Pia Nilsson is a sole proprietor investment adviser. An economic recession has reduced the number of  clients she advises and caused revenues to decline. As a result, Nilsson has not paid her CFA Institute  membership dues for the past two years. When a national financial publication recently interviewed  Nilsson, she indicated that up until two years ago, she had been a CFA charterholder and a CFA Institute  member in good standing. In addition, she stated the completion of the CFA Program enhanced her  portfolio management skills and enabled her to achieve superior returns on behalf of her clients.  <\/p><p>Heidi Krueger, CFA, an investment advisor, applies soft dollars generated from client accounts to  purchase a report on the economic impact of world events, and to purchase a new conference table for  the office she uses to meet with clients and prospects.  <\/p><p>When Jefferson Piedmont, CFA, joined Branch Investing, Branch began using a quantitative stock  selection model Piedmont had developed on his own personal time prior to his employment with  Branch. One year later when Piedmont left Branch Investing, he found the original copy of the model he  had developed in a file at his home and presented it to his new employer, which immediately began  using the model.  <\/p><\/div><\/details><div class=\"qtext\"><p>Has Morales most likely violated the CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "Which of Nilsson's actions most likely violated the CFA Institute Standards of Professional Conduct?", "opts": ["Nonpayment of CFA Institute membership dues", "Indicating that being a CFA charterholder has enhanced her portfolio management skills", "Attributing her superior returns to participation in the CFA Program"], "ans": "C", "expl": "It is a violation of Standard VII(B)–Reference to CFA Institute, the CFA Designation, and the CFA Program to claim that the CFA charter helped her to achieve superior returns.", "explhtml": "<p>It is a violation of Standard VII(B)–Reference to CFA Institute, the CFA Designation, and the CFA Program to  claim that the CFA charter helped her to achieve superior returns. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sergio Morales, CFA, believes he has found evidence that his supervisor is engaged in fraudulent activity  involving a client&#x27;s account. When Morales confronts his supervisor, he is told the client is fully aware of  the issue. Later that day, Morales contacts the client and after disclosing the fraudulent activity, he is  told by the client to mind his own business. Following the requirements of local law, Morales provides  all of his evidence, along with copies of the client&#x27;s most recent account statements, to a government  whistleblower program.  <\/p><p>Pia Nilsson is a sole proprietor investment adviser. An economic recession has reduced the number of  clients she advises and caused revenues to decline. As a result, Nilsson has not paid her CFA Institute  membership dues for the past two years. When a national financial publication recently interviewed  Nilsson, she indicated that up until two years ago, she had been a CFA charterholder and a CFA Institute  member in good standing. In addition, she stated the completion of the CFA Program enhanced her  portfolio management skills and enabled her to achieve superior returns on behalf of her clients.  <\/p><p>Heidi Krueger, CFA, an investment advisor, applies soft dollars generated from client accounts to  purchase a report on the economic impact of world events, and to purchase a new conference table for  the office she uses to meet with clients and prospects.  <\/p><p>When Jefferson Piedmont, CFA, joined Branch Investing, Branch began using a quantitative stock  selection model Piedmont had developed on his own personal time prior to his employment with  Branch. One year later when Piedmont left Branch Investing, he found the original copy of the model he  had developed in a file at his home and presented it to his new employer, which immediately began  using the model.  <\/p><\/div><\/details><div class=\"qtext\"><p>Which of Nilsson's actions most likely violated the CFA Institute Standards of Professional<\/p><p>Conduct? <\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Do Heidi’s purchases violate Standard III(A) Loyalty, Prudence, and Care?", "opts": ["Neither of these purchases violates the Standard.", "Both of these purchases violate the Standard.", "Only one of these purchases violates the Standard."], "ans": "C", "expl": "Using soft dollars for the purchase of office furniture does not benefit clients and is a violation. Purchasing research reports with soft dollars is not a violation, but the advisor should ensure that research purchased with client brokerage will benefit her clients", "explhtml": "<p>Using soft dollars for the purchase of office furniture does not benefit clients and is a violation. Purchasing  research reports with soft dollars is not a violation, but the advisor should ensure that research purchased  with client brokerage will benefit her clients <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sergio Morales, CFA, believes he has found evidence that his supervisor is engaged in fraudulent activity  involving a client&#x27;s account. When Morales confronts his supervisor, he is told the client is fully aware of  the issue. Later that day, Morales contacts the client and after disclosing the fraudulent activity, he is  told by the client to mind his own business. Following the requirements of local law, Morales provides  all of his evidence, along with copies of the client&#x27;s most recent account statements, to a government  whistleblower program.  <\/p><p>Pia Nilsson is a sole proprietor investment adviser. An economic recession has reduced the number of  clients she advises and caused revenues to decline. As a result, Nilsson has not paid her CFA Institute  membership dues for the past two years. When a national financial publication recently interviewed  Nilsson, she indicated that up until two years ago, she had been a CFA charterholder and a CFA Institute  member in good standing. In addition, she stated the completion of the CFA Program enhanced her  portfolio management skills and enabled her to achieve superior returns on behalf of her clients.  <\/p><p>Heidi Krueger, CFA, an investment advisor, applies soft dollars generated from client accounts to  purchase a report on the economic impact of world events, and to purchase a new conference table for  the office she uses to meet with clients and prospects.  <\/p><p>When Jefferson Piedmont, CFA, joined Branch Investing, Branch began using a quantitative stock  selection model Piedmont had developed on his own personal time prior to his employment with  Branch. One year later when Piedmont left Branch Investing, he found the original copy of the model he  had developed in a file at his home and presented it to his new employer, which immediately began  using the model.  <\/p><\/div><\/details><div class=\"qtext\"><p>Do Heidi’s purchases violate Standard III(A) Loyalty, Prudence, and Care?<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "According to the Standards of Practice Handbook, did Piedmont most likely violate any CFA Institute Standards of Professional Conduct?", "opts": ["No", "Yes, because he misappropriated property now belonging to Branch", "Yes, because he failed to inform his new employer the model was the same one used by his previous employer"], "ans": "A", "expl": "Although departing employees may not take employer property when departing, as the guidance for Standard IV(A) – Loyalty outlines, the model Piedmont presented to his new employer was not Branch's property. It was created by Piedmont prior to his employment with Branch. The model was not created for Branch in the course of his employment, even though it was adopted by Branch.", "explhtml": "<p>Although departing employees may not take employer property when departing, as the guidance for  Standard IV(A) – Loyalty outlines, the model Piedmont presented to his new employer was not Branch&#x27;s  property. It was created by Piedmont prior to his employment with Branch. The model was not created for  Branch in the course of his employment, even though it was adopted by Branch. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Ethics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sergio Morales, CFA, believes he has found evidence that his supervisor is engaged in fraudulent activity  involving a client&#x27;s account. When Morales confronts his supervisor, he is told the client is fully aware of  the issue. Later that day, Morales contacts the client and after disclosing the fraudulent activity, he is  told by the client to mind his own business. Following the requirements of local law, Morales provides  all of his evidence, along with copies of the client&#x27;s most recent account statements, to a government  whistleblower program.  <\/p><p>Pia Nilsson is a sole proprietor investment adviser. An economic recession has reduced the number of  clients she advises and caused revenues to decline. As a result, Nilsson has not paid her CFA Institute  membership dues for the past two years. When a national financial publication recently interviewed  Nilsson, she indicated that up until two years ago, she had been a CFA charterholder and a CFA Institute  member in good standing. In addition, she stated the completion of the CFA Program enhanced her  portfolio management skills and enabled her to achieve superior returns on behalf of her clients.  <\/p><p>Heidi Krueger, CFA, an investment advisor, applies soft dollars generated from client accounts to  purchase a report on the economic impact of world events, and to purchase a new conference table for  the office she uses to meet with clients and prospects.  <\/p><p>When Jefferson Piedmont, CFA, joined Branch Investing, Branch began using a quantitative stock  selection model Piedmont had developed on his own personal time prior to his employment with  Branch. One year later when Piedmont left Branch Investing, he found the original copy of the model he  had developed in a file at his home and presented it to his new employer, which immediately began  using the model.  <\/p><\/div><\/details><div class=\"qtext\"><p>According to the Standards of Practice Handbook, did Piedmont most likely violate any CFA Institute<\/p><p>Standards of Professional Conduct? <\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "Which of Anderson’s three statements regarding hedge fund strategies is correct?", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "C", "expl": "C is correct. Global macro investing may introduce natural benefits of asset class and investment approach diversification, but they come with naturally higher volatility in the return profiles typically delivered. The exposures selected in any global macro strategy may not react to the global risks as expected because of either unforeseen contrary factors or global risks that simply do not materialize; thus, macro managers tend to produce somewhat lumpier and more uneven return streams than other hedge fund strategies. A is incorrect because relative value hedge fund strategies tend to use significant leverage that can be dangerous to limited partner investors, especially during periods of market stress. During normal market conditions, successful relative value strategies can earn credit, liquidity, or volatility premiums over time. However, in crisis periods when excessive leverage, deteriorating credit quality, illiquidity, and volatility spikes come to fruition, relative value strategies can result in losses. B is incorrect because long/short equity strategies tend to be exposed to some natural equity market beta risk but have less beta exposure than simple long-only beta allocations. Given that equity markets tend to rise over the long run, most long/short equity managers typically hold net long equity positions with some managers maintaining their short positions as a hedge against unexpected market downturns.", "explhtml": "<p>C is correct. Global macro investing may introduce natural benefits of asset class and investment approach  diversification, but they come with naturally higher volatility in the return profiles typically delivered. The  exposures selected in any global macro strategy may not react to the global risks as expected because of  either unforeseen contrary factors or global risks that simply do not materialize;  thus, macro managers tend to produce somewhat lumpier and more uneven return streams than other  hedge fund strategies.  A is incorrect because relative value hedge fund strategies tend to use significant leverage that can be  dangerous to limited partner investors, especially during periods of market stress. During normal market  conditions, successful relative value strategies can earn credit, liquidity, or volatility premiums over time.  However, in crisis periods when excessive leverage, deteriorating credit quality, illiquidity, and volatility  spikes come to fruition, relative value strategies can result in losses.  B is incorrect because long/short equity strategies tend to be exposed to some natural equity market beta  risk but have less beta exposure than simple long-only beta allocations. Given that equity markets tend to  rise over the long run, most long/short equity managers typically hold net long equity positions with some  managers maintaining their short positions as a hedge against unexpected market downturns. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Almaty Fund Inc is seeking broad diversification and has the following options to invest in the securities  of the following companies:  Alpha: A company that owns multi-family rental properties in Hong Kong SAR  Beta: A company that owns large office properties in New York City, San Francisco, Los Angeles, and  Chicago  Cota: A company with a mix of office and retail properties in urban and suburban markets <\/p><p>Mrs. Chuhi Chawla, An arbitrageur has two active positions in the commodity futures markets— one for  lean hogs and the other for natural gas. The calendar spread on the lean hogs contract is quoted at −50  cents per pound, and the calendar spread on the natural gas contract is +$1.10 per million BTU (British  thermal units). She also wishes to know some differences among valuation of commodity, bonds and  equity investments. <\/p><p>Xu meets with Yolanda Anderson, a junior analyst, to discuss various hedge fund strategies that might  be suitable for their Funds. Anderson tells Xu the following:  Statement 1- Relative value strategies tend to use minimal leverage.  Statement 2- Long/short equity strategies are typically not exposed to equity market beta risk.  Statement 3- Global macro strategies come with naturally higher volatility in the return profiles typically  delivered. <\/p><\/div><\/details><div class=\"qtext\"><p>Which of Anderson’s three statements regarding hedge fund strategies is correct?<\/p><\/div>", "subj": "alternatives"}, {"n": 34, "q": "Almaty Fund Inc should invest in the securities of which of the following companies?", "opts": ["Cota", "Beta", "Alpha"], "ans": "A", "expl": "It should be clear that a company with a mix of assets—office and retail—with exposure to urban and suburban markets offers the best diversification. A is incorrect because the company has only one type of asset, multi-family rentals, in one market, Hong Kong SAR. The systematic risk is high for that portfolio. B is incorrect because the company owns only one asset type, office properties, and the economic activity correlation may be high among urban cities with exposure to global trade and the financial sector.", "explhtml": "<p>It should be clear that a company with a mix of assets—office and retail—with exposure to urban and  suburban markets offers the best diversification. A is incorrect because the company has only one type of  asset, multi-family rentals, in one market, Hong Kong SAR. The systematic risk is high for that portfolio. B is  incorrect because the company owns only one asset type, office properties, and the economic activity  correlation may be high among urban cities with exposure to global trade and the financial sector. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Almaty Fund Inc is seeking broad diversification and has the following options to invest in the securities  of the following companies:  Alpha: A company that owns multi-family rental properties in Hong Kong SAR  Beta: A company that owns large office properties in New York City, San Francisco, Los Angeles, and  Chicago  Cota: A company with a mix of office and retail properties in urban and suburban markets <\/p><p>Mrs. Chuhi Chawla, An arbitrageur has two active positions in the commodity futures markets— one for  lean hogs and the other for natural gas. The calendar spread on the lean hogs contract is quoted at −50  cents per pound, and the calendar spread on the natural gas contract is +$1.10 per million BTU (British  thermal units). She also wishes to know some differences among valuation of commodity, bonds and  equity investments. <\/p><p>Xu meets with Yolanda Anderson, a junior analyst, to discuss various hedge fund strategies that might  be suitable for their Funds. Anderson tells Xu the following:  Statement 1- Relative value strategies tend to use minimal leverage.  Statement 2- Long/short equity strategies are typically not exposed to equity market beta risk.  Statement 3- Global macro strategies come with naturally higher volatility in the return profiles typically  delivered. <\/p><\/div><\/details><div class=\"qtext\"><p>Almaty Fund Inc should invest in the securities of which of the following companies?<\/p><\/div>", "subj": "alternatives"}, {"n": 35, "q": "Based on given information in case of Mrs. Chuhi, we can say that:", "opts": ["only the spreads of these commodities, and not the individual prices, can be traded in commodity markets.", "the lean hogs futures market is in a state of backwardation and the natural gas futures market is in a state of contango.", "the lean hogs futures market is in a state of contango and the natural gas futures market is in a state of backwardation."], "ans": "C", "expl": "The spread is the difference between the current spot price for a commodity and the futures contract price. Because futures markets in a state of contango will have futures prices that exceed the spot price, the spread for these markets is negative. Conversely, in a state of backwardation, the spread is positive. A is incorrect because either the individual contract prices or the combined spreads can be traded. B is incorrect because, as mentioned earlier, the negative sign of the spread of lean hogs futures indicates a state of contango, whereas the positive sign of the spread of natural gas futures indicates a state of backwardation.", "explhtml": "<p>The spread is the difference between the current spot price for a commodity and the futures contract price.  Because futures markets in a state of contango will have futures prices that exceed the spot price, the  spread for these markets is negative. Conversely, in a state of backwardation, the spread is positive. A is  incorrect because either the individual contract prices or the combined spreads can be traded. B is incorrect  because, as mentioned earlier, the negative sign of the spread of lean hogs futures indicates a state of  contango, whereas the positive sign of the spread of natural gas futures indicates a state of backwardation. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Almaty Fund Inc is seeking broad diversification and has the following options to invest in the securities  of the following companies:  Alpha: A company that owns multi-family rental properties in Hong Kong SAR  Beta: A company that owns large office properties in New York City, San Francisco, Los Angeles, and  Chicago  Cota: A company with a mix of office and retail properties in urban and suburban markets <\/p><p>Mrs. Chuhi Chawla, An arbitrageur has two active positions in the commodity futures markets— one for  lean hogs and the other for natural gas. The calendar spread on the lean hogs contract is quoted at −50  cents per pound, and the calendar spread on the natural gas contract is +$1.10 per million BTU (British  thermal units). She also wishes to know some differences among valuation of commodity, bonds and  equity investments. <\/p><p>Xu meets with Yolanda Anderson, a junior analyst, to discuss various hedge fund strategies that might  be suitable for their Funds. Anderson tells Xu the following:  Statement 1- Relative value strategies tend to use minimal leverage.  Statement 2- Long/short equity strategies are typically not exposed to equity market beta risk.  Statement 3- Global macro strategies come with naturally higher volatility in the return profiles typically  delivered. <\/p><\/div><\/details><div class=\"qtext\"><p>Based on given information in case of Mrs. Chuhi, we can say that:<\/p><\/div>", "subj": "alternatives"}, {"n": 36, "q": "What is a key distinction between the valuation of commodities compared with the valuation of stocks and bonds?", "opts": ["Valuation of commodities cannot be conducted using technical analysis.", "Valuation of commodities focuses on supply and demand, whereas valuation of stocks and bonds focuses on discounted cash flows.", "Valuation of stocks and bonds focuses on future supply and demand, whereas commodity valuation focuses on future profit margins and cash flow."], "ans": "B", "expl": "The valuation of commodities is based on a forecast of future prices based on supply and demand factors, as well as expected price volatility. In contrast, the valuation of stocks and bonds is based on estimating future profitability and/or cash flow. A is incorrect because technical analysis is sometimes applied to valuing commodities. C is incorrect for the reasons stated for choice B.", "explhtml": "<p>The valuation of commodities is based on a forecast of future prices based on supply and demand factors,  as well as expected price volatility. In contrast, the valuation of stocks and bonds is based on estimating  future profitability and/or cash flow. A is incorrect because technical analysis is sometimes applied to  valuing commodities. C is incorrect for the reasons stated for choice B. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Almaty Fund Inc is seeking broad diversification and has the following options to invest in the securities  of the following companies:  Alpha: A company that owns multi-family rental properties in Hong Kong SAR  Beta: A company that owns large office properties in New York City, San Francisco, Los Angeles, and  Chicago  Cota: A company with a mix of office and retail properties in urban and suburban markets <\/p><p>Mrs. Chuhi Chawla, An arbitrageur has two active positions in the commodity futures markets— one for  lean hogs and the other for natural gas. The calendar spread on the lean hogs contract is quoted at −50  cents per pound, and the calendar spread on the natural gas contract is +$1.10 per million BTU (British  thermal units). She also wishes to know some differences among valuation of commodity, bonds and  equity investments. <\/p><p>Xu meets with Yolanda Anderson, a junior analyst, to discuss various hedge fund strategies that might  be suitable for their Funds. Anderson tells Xu the following:  Statement 1- Relative value strategies tend to use minimal leverage.  Statement 2- Long/short equity strategies are typically not exposed to equity market beta risk.  Statement 3- Global macro strategies come with naturally higher volatility in the return profiles typically  delivered. <\/p><\/div><\/details><div class=\"qtext\"><p>What is a key distinction between the valuation of commodities compared with the valuation of<\/p><p>stocks and bonds? <\/p><\/div>", "subj": "alternatives"}, {"n": 37, "q": "With respect to the Burnhart’s statements:", "opts": ["both are correct.", "only statement 2 is correct.", "only statement 1 is correct."], "ans": "A", "expl": "UCIRP means that interest rates and exchange rates will adjust so the risk adjusted return on assets between any two countries and their associated currencies will be the same. PPP is based on the idea that a given basket of goods should cost the same in different countries after taking into account the changes in exchange rates. PPP does not hold due to transportation costs and other factors.", "explhtml": "<p>UCIRP means that interest rates and exchange rates will adjust so the risk adjusted return on assets  between any two countries and their associated currencies will be the same. PPP is based on the idea that  a given basket of goods should cost the same in different countries after taking into account the changes  in exchange rates. PPP does not hold due to transportation costs and other factors. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Economics<\/summary><div class=\"vig-body\"><p>Mr. Malay Singapuria lives in Mauritius can borrow in $ or in Mauritius Rupee (MUR). He wants to know  whether an arbitrage opportunity exists. If so, he wants to know how much would he profit by borrowing  MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic  currency terms.)   Spot rate (MUR/$) 30.73000   Forward rate (MUR/$) 31.50000   Domestic (MUR) interest rate 6.50%   Foreign ($) interest rate 5.20%  <\/p><p>Mr. Christiano Messi, An investment adviser is discussing a client’s portfolio exposure to the electric  utilities sector. The sector’s regulator has outlined series of proposals for new regulation, on which it is  carrying out cost–benefit analysis. He makes two statements to the client about the regulator’s cost– benefit analysis.  Statement 1- The regulator will assess and take into account as part of its cost–benefit analysis only the  indirect costs of new regulation arising from changed economic decisions and behaviors  Statement 2- Regulatory costs and benefits are easier to assess on a retrospective, after-the-fact basis <\/p><p>Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of  purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis  Ferngood. During the conversation Burnhart made the following statements:  <\/p><p>Statement 1:   Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These  assumptions are: that all goods and services can be transported among countries at no cost; and all  countries use the same basket of goods and services to measure their price levels.  <\/p><p>Statement 2:   UCIRP rests on the idea of equal real interest rates across international borders. Real interest rate  differentials would result in capital flows to the higher real interest rate country, equalizing the rates  over time. Another way to say this is that differences in interest rates are equal to differences in expected  changes in exchange rates.  <\/p><p>Jessica Wong, CFA, is an equity analyst responsible for the materials and industrial sectors in Europe.  The regulatory authorities are preparing new rules on transportation, further limiting the age and  exhaust emissions of the trucks used by industrial companies.  <\/p><\/div><\/details><div class=\"qtext\"><p>With respect to the Burnhart’s statements:<\/p><\/div>", "subj": "economics"}, {"n": 38, "q": "In Malay Singapuria’s case, which of the following is closest to the correct answer?", "opts": ["Borrow MUR. Arbitrage profits are MUR 13,340.", "Borrow domestic. Arbitrage profits are $39,685.", "Borrow $. Arbitrage profits are $13,340."], "ans": "A", "expl": "Step 1: Determine whether an arbitrage opportunity exists. Using CIRP, F = S x (1+r MUR)/(1+r $) = 30.73 (1.065)/(1.052) = 31.11 which is less than the market forward price of 31.50. Hence, $ is overpriced in forward market. We sell $ forward and purchase $ in spot market. Step 2: Borrow/Lend which currency? Rule: Lend the currency that you are buying in the spot market and borrow the Counter currency Step 3: Conduct Arbitrage and Calculate Profits. Note: 1 This is the amount you will have available to repay the loan. Note: 2 This is the amount you need to repay.", "explhtml": "<p>Step 1: Determine whether an arbitrage opportunity exists.  Using CIRP, F = S x (1+r MUR)/(1+r $) = 30.73 (1.065)/(1.052) = 31.11 which is less than the market forward  price of 31.50. Hence, $ is overpriced in forward market. We sell $ forward and purchase $ in spot market.  Step 2: Borrow/Lend which currency?  Rule: Lend the currency that you are buying in the spot market and borrow the Counter currency  Step 3: Conduct Arbitrage and Calculate Profits. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s2a-006.webp\" style=\"max-width:min(100%,470px)\" alt=\"\"><p>Note: 1 This is the amount you will have available to repay the loan.   Note: 2 This is the amount you need to repay. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mr. Malay Singapuria lives in Mauritius can borrow in $ or in Mauritius Rupee (MUR). He wants to know  whether an arbitrage opportunity exists. If so, he wants to know how much would he profit by borrowing  MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic  currency terms.)   Spot rate (MUR/$) 30.73000   Forward rate (MUR/$) 31.50000   Domestic (MUR) interest rate 6.50%   Foreign ($) interest rate 5.20%  <\/p><p>Mr. Christiano Messi, An investment adviser is discussing a client’s portfolio exposure to the electric  utilities sector. The sector’s regulator has outlined series of proposals for new regulation, on which it is  carrying out cost–benefit analysis. He makes two statements to the client about the regulator’s cost– benefit analysis.  Statement 1- The regulator will assess and take into account as part of its cost–benefit analysis only the  indirect costs of new regulation arising from changed economic decisions and behaviors  Statement 2- Regulatory costs and benefits are easier to assess on a retrospective, after-the-fact basis <\/p><p>Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of  purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis  Ferngood. During the conversation Burnhart made the following statements:  <\/p><p>Statement 1:   Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These  assumptions are: that all goods and services can be transported among countries at no cost; and all  countries use the same basket of goods and services to measure their price levels.  <\/p><p>Statement 2:   UCIRP rests on the idea of equal real interest rates across international borders. Real interest rate  differentials would result in capital flows to the higher real interest rate country, equalizing the rates  over time. Another way to say this is that differences in interest rates are equal to differences in expected  changes in exchange rates.  <\/p><p>Jessica Wong, CFA, is an equity analyst responsible for the materials and industrial sectors in Europe.  The regulatory authorities are preparing new rules on transportation, further limiting the age and  exhaust emissions of the trucks used by industrial companies.  <\/p><\/div><\/details><div class=\"qtext\"><p>In Malay Singapuria’s case, which of the following is closest to the correct answer?<\/p><\/div>", "subj": "economics"}, {"n": 39, "q": "Which statement by Mr. Christiano Messi is correct?", "opts": ["Only Statement 1 is correct.", "Only Statement 2 is correct.", "Both statements are correct."], "ans": "B", "expl": "Statement 2 is correct because actual costs and benefits may be available during retrospective analysis, allowing a more informed assessment of regulation. Statement 1 is incorrect because both indirect and implementation costs will be taken into account.", "explhtml": "<p>Statement 2 is correct because actual costs and benefits may be available during retrospective analysis,  allowing a more informed assessment of regulation. Statement 1 is incorrect because both indirect and  implementation costs will be taken into account. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mr. Malay Singapuria lives in Mauritius can borrow in $ or in Mauritius Rupee (MUR). He wants to know  whether an arbitrage opportunity exists. If so, he wants to know how much would he profit by borrowing  MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic  currency terms.)   Spot rate (MUR/$) 30.73000   Forward rate (MUR/$) 31.50000   Domestic (MUR) interest rate 6.50%   Foreign ($) interest rate 5.20%  <\/p><p>Mr. Christiano Messi, An investment adviser is discussing a client’s portfolio exposure to the electric  utilities sector. The sector’s regulator has outlined series of proposals for new regulation, on which it is  carrying out cost–benefit analysis. He makes two statements to the client about the regulator’s cost– benefit analysis.  Statement 1- The regulator will assess and take into account as part of its cost–benefit analysis only the  indirect costs of new regulation arising from changed economic decisions and behaviors  Statement 2- Regulatory costs and benefits are easier to assess on a retrospective, after-the-fact basis <\/p><p>Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of  purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis  Ferngood. During the conversation Burnhart made the following statements:  <\/p><p>Statement 1:   Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These  assumptions are: that all goods and services can be transported among countries at no cost; and all  countries use the same basket of goods and services to measure their price levels.  <\/p><p>Statement 2:   UCIRP rests on the idea of equal real interest rates across international borders. Real interest rate  differentials would result in capital flows to the higher real interest rate country, equalizing the rates  over time. Another way to say this is that differences in interest rates are equal to differences in expected  changes in exchange rates.  <\/p><p>Jessica Wong, CFA, is an equity analyst responsible for the materials and industrial sectors in Europe.  The regulatory authorities are preparing new rules on transportation, further limiting the age and  exhaust emissions of the trucks used by industrial companies.  <\/p><\/div><\/details><div class=\"qtext\"><p>Which statement by Mr. Christiano Messi is correct?<\/p><\/div>", "subj": "economics"}, {"n": 40, "q": "With regards to Jessica’s case, what is likely to be of greatest concern to the analyst when evaluating the impact of the new rules on companies?", "opts": ["Changes to costs related to the acquisition, operation, and maintenance of trucks", "Positive impact of reduced pollution on public health and subsequent health care cost savings in the wider society", "The methods and techniques used by the regulator during its cost–benefit analysis"], "ans": "A", "expl": "The analyst will want to understand and analyze the impact of the proposed regulations on the performance of companies she covers. Answers B and C relate to cost–benefit analysis carried out by the regulatory authority.", "explhtml": "<p>The analyst will want to understand and analyze the impact of the proposed regulations on the  performance of companies she covers. Answers B and C relate to cost–benefit analysis carried out by the  regulatory authority. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Mr. Malay Singapuria lives in Mauritius can borrow in $ or in Mauritius Rupee (MUR). He wants to know  whether an arbitrage opportunity exists. If so, he wants to know how much would he profit by borrowing  MUR 1,000,000 or the equivalent in $? (Assume a period of one year and state the profit in domestic  currency terms.)   Spot rate (MUR/$) 30.73000   Forward rate (MUR/$) 31.50000   Domestic (MUR) interest rate 6.50%   Foreign ($) interest rate 5.20%  <\/p><p>Mr. Christiano Messi, An investment adviser is discussing a client’s portfolio exposure to the electric  utilities sector. The sector’s regulator has outlined series of proposals for new regulation, on which it is  carrying out cost–benefit analysis. He makes two statements to the client about the regulator’s cost– benefit analysis.  Statement 1- The regulator will assess and take into account as part of its cost–benefit analysis only the  indirect costs of new regulation arising from changed economic decisions and behaviors  Statement 2- Regulatory costs and benefits are easier to assess on a retrospective, after-the-fact basis <\/p><p>Terrance Burnhart, a junior analyst at Wertheim Investments Inc., was discussing the concepts of  purchasing power parity (PPP) and uncovered interest rate parity (UIRP) with his colleague, Francis  Ferngood. During the conversation Burnhart made the following statements:  <\/p><p>Statement 1:   Absolute PPP is based on a number of unrealistic assumptions that limits its real-world usefulness. These  assumptions are: that all goods and services can be transported among countries at no cost; and all  countries use the same basket of goods and services to measure their price levels.  <\/p><p>Statement 2:   UCIRP rests on the idea of equal real interest rates across international borders. Real interest rate  differentials would result in capital flows to the higher real interest rate country, equalizing the rates  over time. Another way to say this is that differences in interest rates are equal to differences in expected  changes in exchange rates.  <\/p><p>Jessica Wong, CFA, is an equity analyst responsible for the materials and industrial sectors in Europe.  The regulatory authorities are preparing new rules on transportation, further limiting the age and  exhaust emissions of the trucks used by industrial companies.  <\/p><\/div><\/details><div class=\"qtext\"><p>With regards to Jessica’s case, what is likely to be of greatest concern to the analyst when evaluating<\/p><p>the impact of the new rules on companies? <\/p><\/div>", "subj": "economics"}, {"n": 41, "q": "Which one of Stosur’s responses is correct?", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "Statement 2 is correct. A significant advantage of the ETF creation/ redemption process is that the AP absorbs all costs of transacting the securities for the fund’s portfolio. APs pass these costs to investors in the ETF’s bid–ask spread, incurred by ETF buyers and sellers. Thus, non-transacting shareholders of an ETF are shielded from the negative impact of transaction costs caused by other investors entering and exiting the fund. In contrast, when investors enter or exit a traditional mutual fund, the mutual fund manager incurs costs to buy or sell investments arising from this activity, which affects all fund shareholders. This makes the ETF structure inherently fairer: Frequent ETF traders bear the cost of their activity, while buy-and-hold ETF shareholders are shielded from those costs. Investors cannot short mutual fund shares, but they can short ETF shares. Also, if ETF shares are trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy ETF shares and exchange them for the securities in the redemption basket. Statement 3 describes the scenario that would occur if the ETF shares are trading at a premium to NAV. A is incorrect because Statement 1 is incorrect. Investors cannot short mutual fund shares, but they can short ETF shares. C is incorrect because Statement 3 is incorrect. If ETF shares are trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy ETF shares and exchange them for the securities in the redemption basket. Statement 3 describes the scenario that would occur if ETF shares are trading at a premium to NAV.", "explhtml": "<p>Statement 2 is correct. A significant advantage of the ETF creation/ redemption process is that the AP  absorbs all costs of transacting the securities for the fund’s portfolio. APs pass these costs to investors in  the ETF’s bid–ask spread, incurred by ETF buyers and sellers. Thus, non-transacting shareholders  of an ETF are shielded from the negative impact of transaction costs caused by other investors entering and  exiting the fund. In contrast, when investors enter or exit a traditional mutual fund, the mutual fund  manager incurs costs to buy or sell investments arising from this activity, which affects all fund  shareholders. This makes the ETF structure inherently fairer: Frequent ETF traders bear the cost of their  activity, while buy-and-hold ETF shareholders are shielded from those costs. Investors cannot short mutual  fund shares, but they can short ETF shares. Also, if ETF shares are trading at a discount to NAV and arbitrage  costs are sufficiently low, APs will buy ETF shares and exchange them for the securities  in the redemption basket. Statement 3 describes the scenario that would occur if the ETF shares are trading  at a premium to NAV. A is incorrect because Statement 1 is incorrect. Investors cannot short mutual fund  shares, but they can short ETF shares. C is incorrect because Statement 3 is incorrect. If ETF shares are  trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy ETF shares and exchange  them for the securities in the redemption basket. Statement 3 describes the scenario that would occur if  ETF shares are trading at a premium to NAV. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Howie Rutledge is a senior portfolio strategist for an endowment fund. Rutledge meets with recently  hired junior analyst Larry Stosur to review the fund’s holdings. Rutledge asks Stosur about the mechanics  of exchange-traded funds (ETFs). Stosur responds by making the following statements:  Statement 1- Unlike mutual fund shares that can be shorted, ETF shares cannot be shorted.  Statement 2- In the ETF creation/redemption process, the authorized participants ( const CFG = {"title": "Kevin Sir Mock 2024 — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");

  renderSubjectBreakdown();

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");

  });
  head.addEventListener("pointermove",function(e){

    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

})();

    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<!--restart-confirm-start-->
<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
</html>
