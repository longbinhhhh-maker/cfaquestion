<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

    <!--subject-breakdown-panel-start-->
    <div id="subjectBreakdown" class="subject-breakdown" aria-live="polite"></div>
    <!--subject-breakdown-panel-end-->
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Utilizing the spot exchange rate and the inflation rate information provided, the calculated JPY/USD exchange rate predicted six months from today by relative purchasing power parity (relative PPP) is closest to:", "opts": ["JPY/USD 90.28.", "JPY/USD 96.90.", "JPY/USD 98.65."], "ans": "B", "expl": "Relative PPP hypothesizes that changes in nominal exchange rates over time are equal to national inflation rate differentials. The equation for relative PPP is: %ΔS(A/B) = inflation(A) – inflation(B) Since the ¥ has the higher inflation rate, the ¥ should depreciate by 4% per year or 2% over 6 months. Therefore, E(S ) = ¥95 × 1.02 = ¥96.90.", "explhtml": "<p>Relative PPP hypothesizes that changes in nominal exchange rates over time are equal to national inflation  rate differentials.  The equation for relative PPP is: %ΔS(A/B) = inflation(A) – inflation(B)  Since the ¥ has the higher inflation rate, the ¥ should depreciate by 4% per year or 2% over 6 months.  Therefore, E(S ) = ¥95 × 1.02 = ¥96.90. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<\/summary><div class=\"vig-body\"><p>Teresa Young, CFA, is the head of research for a large financial services firm based in New York City.   One of the European equities managers approaches Young for assistance with a longtime client based  in Dallas, Texas. The client&#x27;s existing portfolio is well-diversified, with approximately 60% in domestic  securities and 40% in global investments (primarily in Europe and Asia). The client is unhappy with the  portfolio&#x27;s recent performance and is convinced that there is too much exchange-rate exposure because  of the large foreign allocation. The portfolio manager would like to provide evidence to the contrary to  the client and believes the client is lacking a fundamental understanding of foreign exchange parity  relations.  Young compiles some basic information regarding the theoretical relationships among exchange rates,  interest rates, and inflation rates. She also obtains information on some of the client&#x27;s key non-U.S.  holdings. Young observes that the client currently has a large position in Banyo, a Japanese manufacturer  and distributor of consumer electronics with a strong global market share. The client also has a  substantial investment in Seine Industries, a French producer of paper products whose primary market  is Western Europe.  Current spot rates: 1.3200 USD ($) per EUR (€) ; 95 JPY (¥) per USD ($).  Expected inflation rates: United States: 4.00% ; Euro: 6.50% ; Japan: 8.00%.  Young is concerned about changes in Japanese monetary and fiscal policies. Japan has been well  integrated in global capital markets, and she expects that the policymakers in Japan will tighten  monetary policy while adopting an expansionary fiscal policy for the coming three to five years. She is  also concerned about changes in the regulatory environment in Japan: Young&#x27;s analysis of Japanese  budgets leads her to conclude that Japan is increasing funding to primary education, while the United  States is increasing funding for post-secondary education. <\/p><\/div><\/details><div class=\"qtext\"><p>Utilizing the spot exchange rate and the inflation rate information provided, the calculated JPY/USD<\/p><p>exchange rate predicted six months from today by relative purchasing power parity (relative PPP) is  closest to: <\/p><\/div>", "subj": "economics"}, {"n": 2, "q": "When Young discusses the International Fisher Relation with her client, she should explain that it is based on real interest rate parity, which implies that:", "opts": ["forward rates already reflect any difference in expected real interest rates between countries.", "any expected inflation differential between countries will be brought back to equilibrium by consumers’ demands for the least expensive goods and services.", "any difference in real interest rates between countries will result in capital flows that cause real interest rates in those countries to converge to the same level."], "ans": "B", "expl": "The real interest rate parity condition is the theory that real interest rates will converge to the same level across different markets. If real interest rate parity holds, then the level of real interest rates in one country will be identical to the level of real interest rates in a second country.", "explhtml": "<p>The real interest rate parity condition is the theory that real interest rates will converge to the same level  across different markets. If real interest rate parity holds, then the level of real interest rates in one country  will be identical to the level of real interest rates in a second country. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Teresa Young, CFA, is the head of research for a large financial services firm based in New York City.   One of the European equities managers approaches Young for assistance with a longtime client based  in Dallas, Texas. The client&#x27;s existing portfolio is well-diversified, with approximately 60% in domestic  securities and 40% in global investments (primarily in Europe and Asia). The client is unhappy with the  portfolio&#x27;s recent performance and is convinced that there is too much exchange-rate exposure because  of the large foreign allocation. The portfolio manager would like to provide evidence to the contrary to  the client and believes the client is lacking a fundamental understanding of foreign exchange parity  relations.  Young compiles some basic information regarding the theoretical relationships among exchange rates,  interest rates, and inflation rates. She also obtains information on some of the client&#x27;s key non-U.S.  holdings. Young observes that the client currently has a large position in Banyo, a Japanese manufacturer  and distributor of consumer electronics with a strong global market share. The client also has a  substantial investment in Seine Industries, a French producer of paper products whose primary market  is Western Europe.  Current spot rates: 1.3200 USD ($) per EUR (€) ; 95 JPY (¥) per USD ($).  Expected inflation rates: United States: 4.00% ; Euro: 6.50% ; Japan: 8.00%.  Young is concerned about changes in Japanese monetary and fiscal policies. Japan has been well  integrated in global capital markets, and she expects that the policymakers in Japan will tighten  monetary policy while adopting an expansionary fiscal policy for the coming three to five years. She is  also concerned about changes in the regulatory environment in Japan: Young&#x27;s analysis of Japanese  budgets leads her to conclude that Japan is increasing funding to primary education, while the United  States is increasing funding for post-secondary education. <\/p><\/div><\/details><div class=\"qtext\"><p>When Young discusses the International Fisher Relation with her client, she should explain that it is<\/p><p>based on real interest rate parity, which implies that: <\/p><\/div>", "subj": "economics"}, {"n": 3, "q": "Under the Mundell-Fleming model, the planned changes in Japanese monetary/fiscal policy are least likely to result in:", "opts": ["a depreciation of the Japanese yen.", "an appreciation of the Japanese yen.", "a capital account surplus."], "ans": "A", "expl": "Under the Mundell-Fleming model, a restrictive monetary/expansionary fiscal policy in the presence of high capital mobility would lead to a capital account surplus (due to inflow of capital) and domestic currency appreciation. Note that the question is asking for the \"least likely\" result.", "explhtml": "<p>Under the Mundell-Fleming model, a restrictive monetary/expansionary fiscal policy in the presence of high  capital mobility would lead to a capital account surplus (due to inflow of capital) and domestic currency  appreciation. Note that the question is asking for the &quot;least likely&quot; result. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Teresa Young, CFA, is the head of research for a large financial services firm based in New York City.   One of the European equities managers approaches Young for assistance with a longtime client based  in Dallas, Texas. The client&#x27;s existing portfolio is well-diversified, with approximately 60% in domestic  securities and 40% in global investments (primarily in Europe and Asia). The client is unhappy with the  portfolio&#x27;s recent performance and is convinced that there is too much exchange-rate exposure because  of the large foreign allocation. The portfolio manager would like to provide evidence to the contrary to  the client and believes the client is lacking a fundamental understanding of foreign exchange parity  relations.  Young compiles some basic information regarding the theoretical relationships among exchange rates,  interest rates, and inflation rates. She also obtains information on some of the client&#x27;s key non-U.S.  holdings. Young observes that the client currently has a large position in Banyo, a Japanese manufacturer  and distributor of consumer electronics with a strong global market share. The client also has a  substantial investment in Seine Industries, a French producer of paper products whose primary market  is Western Europe.  Current spot rates: 1.3200 USD ($) per EUR (€) ; 95 JPY (¥) per USD ($).  Expected inflation rates: United States: 4.00% ; Euro: 6.50% ; Japan: 8.00%.  Young is concerned about changes in Japanese monetary and fiscal policies. Japan has been well  integrated in global capital markets, and she expects that the policymakers in Japan will tighten  monetary policy while adopting an expansionary fiscal policy for the coming three to five years. She is  also concerned about changes in the regulatory environment in Japan: Young&#x27;s analysis of Japanese  budgets leads her to conclude that Japan is increasing funding to primary education, while the United  States is increasing funding for post-secondary education. <\/p><\/div><\/details><div class=\"qtext\"><p>Under the Mundell-Fleming model, the planned changes in Japanese monetary/fiscal policy are<\/p><p>least likely to result in: <\/p><\/div>", "subj": "economics"}, {"n": 4, "q": "Compared with the impact of the incremental spending on primary education in Japan, the planned incremental spending on post-secondary education in the United States is most likely to result in:", "opts": ["a higher growth in GDP.", "a lower growth in GDP.", "a similar growth in GDP."], "ans": "A", "expl": "Allocation of education spending among primary, secondary, and post-secondary education can be an important determinant of growth. In developed countries like the United States and Japan, incremental spending on post- secondary education will encourage innovation and growth to a greater degree than will spending on primary and secondary education.", "explhtml": "<p>Allocation of education spending among primary, secondary, and post-secondary education can be an  important determinant of growth. In developed countries like the United States and Japan, incremental  spending on post- secondary education will encourage innovation and growth to a greater degree than will  spending on primary and secondary education. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Teresa Young, CFA, is the head of research for a large financial services firm based in New York City.   One of the European equities managers approaches Young for assistance with a longtime client based  in Dallas, Texas. The client&#x27;s existing portfolio is well-diversified, with approximately 60% in domestic  securities and 40% in global investments (primarily in Europe and Asia). The client is unhappy with the  portfolio&#x27;s recent performance and is convinced that there is too much exchange-rate exposure because  of the large foreign allocation. The portfolio manager would like to provide evidence to the contrary to  the client and believes the client is lacking a fundamental understanding of foreign exchange parity  relations.  Young compiles some basic information regarding the theoretical relationships among exchange rates,  interest rates, and inflation rates. She also obtains information on some of the client&#x27;s key non-U.S.  holdings. Young observes that the client currently has a large position in Banyo, a Japanese manufacturer  and distributor of consumer electronics with a strong global market share. The client also has a  substantial investment in Seine Industries, a French producer of paper products whose primary market  is Western Europe.  Current spot rates: 1.3200 USD ($) per EUR (€) ; 95 JPY (¥) per USD ($).  Expected inflation rates: United States: 4.00% ; Euro: 6.50% ; Japan: 8.00%.  Young is concerned about changes in Japanese monetary and fiscal policies. Japan has been well  integrated in global capital markets, and she expects that the policymakers in Japan will tighten  monetary policy while adopting an expansionary fiscal policy for the coming three to five years. She is  also concerned about changes in the regulatory environment in Japan: Young&#x27;s analysis of Japanese  budgets leads her to conclude that Japan is increasing funding to primary education, while the United  States is increasing funding for post-secondary education. <\/p><\/div><\/details><div class=\"qtext\"><p>Compared with the impact of the incremental spending on primary education in Japan, the planned<\/p><p>incremental spending on post-secondary education in the United States is most likely to result in: <\/p><\/div>", "subj": "economics"}, {"n": 5, "q": "Using the information in Benchmark Interest Rate Paths for 3-Year Horizon, the value of a three- year, 3% annual-pay benchmark bond under Path 1 and Path 2 is closest to: Path 1 Path 2", "opts": ["$99.98 $100.15", "$100.18 $101.15", "$102.32 $103.98"], "ans": "B", "expl": "Pathwise valuation discounts each cashflow with its corresponding spot or forward rate. A three-year, 3% annual pay bond would have cash flows of $3, $3, and $103 in years 1, 2, and 3, respectively. The values for each path and the average value is shown below. Path Year 1 Year 2 Year 3 Value 1 2% 2.8050% 4.0787% $100.18 2 2% 2.8050% 3.0216% $101.15 3 2% 2.0780% 3.0216% $101.85 4 2% 2.0780% 2.2384% $102.58 Average $101.44", "explhtml": "<p>Pathwise valuation discounts each cashflow with its corresponding spot or forward rate. A three-year, 3%  annual pay bond would have cash flows of $3, $3, and $103 in years 1, 2, and 3, respectively. The values for  each path and the average value is shown below. <\/p><div class=\"tbl\"><table><tr><td>Path   <\/td><td>Year 1   <\/td><td>Year 2   <\/td><td>Year 3   <\/td><td>Value <\/td><\/tr><tr><td>1  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>4.0787%  <\/td><td>$100.18 <\/td><\/tr><tr><td>2  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>3.0216%  <\/td><td>$101.15 <\/td><\/tr><tr><td>3  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>3.0216%  <\/td><td>$101.85 <\/td><\/tr><tr><td>4  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>2.2384%  <\/td><td>$102.58 <\/td><\/tr><\/table><\/div><p>          Average  $101.44 <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s2a-001.webp\" style=\"max-width:min(100%,428px)\" alt=\"\">", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jonathan Song is a CFA candidate who recently took the Level II exam and is currently waiting to receive  his test results. Song is also pursuing his MBA at a prestigious Ivy League university. He has accepted a  position as an intern at a large brokerage firm in New York for this year&#x27;s summer break. Over the course  of his internship, he will rotate among the different areas of the firm, spending two weeks in each. His  current rotation is in the brokerage firm&#x27;s research department, where he will report to Bill Dixon, a  managing director whose group is responsible for bond analytics. Dixon is evaluating all of the interns  who rotate through his department this summer to identify possible candidates for future permanent  positions at the brokerage firm.  Song has successfully completed several courses in finance and economics, and Dixon seeks to assess  Song&#x27;s knowledge of various concepts that are of specific importance to his group. Dixon decides to focus  first on valuation of fixed income securities. To this end, Dixon supplies Song with some fundamental  market information. Benchmark Interest Rate Paths for 3-Year Horizon shows paths from a three-year  binomial interest rate tree for risk-free securities using current market data.  Benchmark Interest Rate Paths for 3-Year Horizon <\/p><div class=\"tbl\"><table><tr><td>Path  <\/td><td>Year 1   <\/td><td>Year 2   <\/td><td>Year 3 <\/td><\/tr><tr><td>1  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>4.0787% <\/td><\/tr><tr><td>2  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>3.0216% <\/td><\/tr><tr><td>3  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>3.0216% <\/td><\/tr><tr><td>4  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>2.2384% <\/td><\/tr><\/table><\/div><p>Dixon wants Song to value three-year, 4% annual pay, $100 face value Zena, Inc., bonds. The bonds have  a Bermudan-style call option that can be exercised at par in one and two years. Comparable bonds have  an OAS of 100bps. Dixon explains to Song that investments in callable bonds have special interest rate  risk considerations. Dixon states, &quot;Callable bonds may exhibit negative convexity. When the underlying  option is at or near the money, a callable bond will have lower one-sided down-duration than one-sided  up-duration.&quot;   While discussing spread measures, Song states, &quot;Everything else constant, higher OAS indicates better  compensation for risk. However, OAS estimation for callable bonds can be biased upward if the analyst  uses too high an estimate of interest rate volatility.&quot; <\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Benchmark Interest Rate Paths for 3-Year Horizon, the value of a three-<\/p><p>year, 3% annual-pay benchmark bond under Path 1 and Path 2 is closest to: <\/p><div class=\"tbl\"><table><tr><td>Path 1   <\/td><td>Path 2 <\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 6, "q": "Using the information given in the case and in Benchmark Interest Rate Paths for 3-Year Horizon, the value of 4% Zena, Inc., callable bond is closest to:", "opts": ["$97.12.", "$100.00.", "$100.82."], "ans": "C", "expl": "The value of a Zena, Inc., callable bond is $100.82, as shown below. The interest rate tree is updated by adding a constant spread (OAS) of 100bps at each node.", "explhtml": "<p>The value of a Zena, Inc., callable bond is $100.82, as shown below. The interest rate tree is updated by  adding a constant spread (OAS) of 100bps at each node. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s2a-002.webp\" style=\"max-width:min(100%,431px)\" alt=\"\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s2a-003.webp\" style=\"max-width:min(100%,564px)\" alt=\"\">", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathan Song is a CFA candidate who recently took the Level II exam and is currently waiting to receive  his test results. Song is also pursuing his MBA at a prestigious Ivy League university. He has accepted a  position as an intern at a large brokerage firm in New York for this year&#x27;s summer break. Over the course  of his internship, he will rotate among the different areas of the firm, spending two weeks in each. His  current rotation is in the brokerage firm&#x27;s research department, where he will report to Bill Dixon, a  managing director whose group is responsible for bond analytics. Dixon is evaluating all of the interns  who rotate through his department this summer to identify possible candidates for future permanent  positions at the brokerage firm.  Song has successfully completed several courses in finance and economics, and Dixon seeks to assess  Song&#x27;s knowledge of various concepts that are of specific importance to his group. Dixon decides to focus  first on valuation of fixed income securities. To this end, Dixon supplies Song with some fundamental  market information. Benchmark Interest Rate Paths for 3-Year Horizon shows paths from a three-year  binomial interest rate tree for risk-free securities using current market data.  Benchmark Interest Rate Paths for 3-Year Horizon <\/p><div class=\"tbl\"><table><tr><td>Path  <\/td><td>Year 1   <\/td><td>Year 2   <\/td><td>Year 3 <\/td><\/tr><tr><td>1  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>4.0787% <\/td><\/tr><tr><td>2  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>3.0216% <\/td><\/tr><tr><td>3  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>3.0216% <\/td><\/tr><tr><td>4  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>2.2384% <\/td><\/tr><\/table><\/div><p>Dixon wants Song to value three-year, 4% annual pay, $100 face value Zena, Inc., bonds. The bonds have  a Bermudan-style call option that can be exercised at par in one and two years. Comparable bonds have  an OAS of 100bps. Dixon explains to Song that investments in callable bonds have special interest rate  risk considerations. Dixon states, &quot;Callable bonds may exhibit negative convexity. When the underlying  option is at or near the money, a callable bond will have lower one-sided down-duration than one-sided  up-duration.&quot;   While discussing spread measures, Song states, &quot;Everything else constant, higher OAS indicates better  compensation for risk. However, OAS estimation for callable bonds can be biased upward if the analyst  uses too high an estimate of interest rate volatility.&quot; <\/p><\/div><\/details><div class=\"qtext\"><p>Using the information given in the case and in Benchmark Interest Rate Paths for 3-Year Horizon,<\/p><p>the value of 4% Zena, Inc., callable bond is closest to: <\/p><\/div>", "subj": "fixed"}, {"n": 7, "q": "Dixon's statement about interest rate risk of callable bonds is most accurately described as:", "opts": ["correct.", "incorrect about convexity.", "incorrect about one-sided duration."], "ans": "A", "expl": "Dixon is correct about callable bonds exhibiting negative convexity. This occurs when the option is at or near money. Dixon is also correct that when the underlying option is at or near money, for a given decrease in rates, the price appreciation of a callable bond will be lower than loss in value for an equal amount of increase in rates. Hence, the callable bond will have lower one-sided down-duration than one-sided up- duration.", "explhtml": "<p>Dixon is correct about callable bonds exhibiting negative convexity. This occurs when the option is at or  near money. Dixon is also correct that when the underlying option is at or near money, for a given decrease  in rates, the price appreciation of a callable bond will be lower than loss in value for an equal amount of  increase in rates. Hence, the callable bond will have lower one-sided down-duration than one-sided up- duration. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathan Song is a CFA candidate who recently took the Level II isk considerations. Dixon states, &quot;Callable bonds may exhibit negative convexity. When the underlying  option is at or near the money, a callable bond will have lower one-sided down-duration than one-sided  up-duration.&quot;   While discussing spread measures, Song states, &quot;Everything else constant, higher OAS indicates better  compensation for risk. However, OAS estimation for callable bonds can be biased upward if the analyst  uses too high an estimate of interest rate volatility.&quot; <\/p><\/div><\/details><div class=\"qtext\"><p>Dixon's statement about interest rate risk of callable bonds is most accurately described as:<\/p><\/div>", "subj": "fixed"}, {"n": 8, "q": "Song's statement regarding OAS is most accurately described as:", "opts": ["correct.", "incorrect about higher OAS indicates better compensation for risk.", "incorrect about OAS estimation for callable bonds possibly being biased upward."], "ans": "C", "expl": "Song is correct about higher OAS reflecting higher compensation for risk. Song is incorrect about the relationship between assumed volatility and computed OAS for a callable bond. If the assumed volatility is too high, the computed OAS for a callable bond would be too low, and hence the bias would be on the downside.", "explhtml": "<p>Song is correct about higher OAS reflecting higher compensation for risk. Song is incorrect about the  relationship between assumed volatility and computed OAS for a callable bond. If the assumed volatility is  too high, the computed OAS for a callable bond would be too low, and hence the bias would be on the  downside. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathan Song is a CFA candidate who recently took the Level II exam and is currently waiting to receive  his test results. Song is also pursuing his MBA at a prestigious Ivy League university. He has accepted a  position as an intern at a large brokerage firm in New York for this year&#x27;s summer break. Over the course  of his internship, he will rotate among the different areas of the firm, spending two weeks in each. His  current rotation is in the brokerage firm&#x27;s research department, where he will report to Bill Dixon, a  managing director whose group is responsible for bond analytics. Dixon is evaluating all of the interns  who rotate through his department this summer to identify possible candidates for future permanent  positions at the brokerage firm.  Song has successfully completed several courses in finance and economics, and Dixon seeks to assess  Song&#x27;s knowledge of various concepts that are of specific importance to his group. Dixon decides to focus  first on valuation of fixed income securities. To this end, Dixon supplies Song with some fundamental  market information. Benchmark Interest Rate Paths for 3-Year Horizon shows paths from a three-year  binomial interest rate tree for risk-free securities using current market data.  Benchmark Interest Rate Paths for 3-Year Horizon <\/p><div class=\"tbl\"><table><tr><td>Path  <\/td><td>Year 1   <\/td><td>Year 2   <\/td><td>Year 3 <\/td><\/tr><tr><td>1  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>4.0787% <\/td><\/tr><tr><td>2  <\/td><td>2%  <\/td><td>2.8050%  <\/td><td>3.0216% <\/td><\/tr><tr><td>3  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>3.0216% <\/td><\/tr><tr><td>4  <\/td><td>2%  <\/td><td>2.0780%  <\/td><td>2.2384% <\/td><\/tr><\/table><\/div><p>Dixon wants Song to value three-year, 4% annual pay, $100 face value Zena, Inc., bonds. The bonds have  a Bermudan-style call option that can be exercised at par in one and two years. Comparable bonds have  an OAS of 100bps. Dixon explains to Song that investments in callable bonds have special interest rate  risk considerations. Dixon states, &quot;Callable bonds may exhibit negative convexity. When the underlying  option is at or near the money, a callable bond will have lower one-sided down-duration than one-sided  up-duration.&quot;   While discussing spread measures, Song states, &quot;Everything else constant, higher OAS indicates better  compensation for risk. However, OAS estimation for callable bonds can be biased upward if the analyst  uses too high an estimate of interest rate volatility.&quot; <\/p><\/div><\/details><div class=\"qtext\"><p>Song's statement regarding OAS is most accurately described as:<\/p><\/div>", "subj": "fixed"}, {"n": 9, "q": "While discussing structural models, the European option that Song discusses is most likely:", "opts": ["a conversion option.", "a put option.", "a call option."], "ans": "C", "expl": "Equity investors can be thought of as holders of a European call option on the assets of the company with a strike price equal to the face value of debt. At the maturity of debt, if the assets of the company are worth more than the face value of debt, the option is exercised (i.e., debt is paid). However, if the assets are insufficient to pay the debt, due to limited liability of shareholders, the option is allowed to expire (i.e., the company defaults).", "explhtml": "<p>Equity investors can be thought of as holders of a European call option on the assets of the company with  a strike price equal to the face value of debt. At the maturity of debt, if the assets of the company are worth  more than the face value of debt, the option is exercised (i.e., debt is paid). However, if the assets are  insufficient to pay the debt, due to limited liability of shareholders, the option is allowed to expire (i.e., the  company defaults). <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Fixed Income<\/summary><div class=\"vig-body\"><p>Song says that an analyst could use structural models to analyze credit risk of Zena, Inc., bonds, and that  one of the ways to evaluate credit risk is to look at the ntity.  Comment 2: In an index CDS, the lower the credit correlation, the cheaper the premium. <\/p><\/div><\/details><div class=\"qtext\"><p>The payoff on the CDS on account of default of X and the notional principal of the CDS after default<\/p><p>are closest to: <\/p><div class=\"tbl\"><table><tr><td>Payoff   <\/td><td>Notional <\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 12, "q": "Which of the following best describe Comments 1 and 2 in Nathan’s case?", "opts": ["Both comments are correct.", "Both comments are incorrect.", "Only one of the two comments is correct."], "ans": "C", "expl": "Comment 1 is incorrect. It should say: \"In a CDS, the protection buyer is short the credit risk of the reference entity.\" Note the CDS purchaser is typically referred to as the short party. Long and short for a CDS is relative to credit risk rather than buying or selling the instrument. Comment 2 is correct. An Index CDS provides default cover for an index (basket) of bonds. Higher default correlation will make it more expensive to buy cover.", "explhtml": "<p>Comment 1 is incorrect. It should say: &quot;In a CDS, the protection buyer is short the credit risk of the reference  entity.&quot; Note the CDS purchaser is typically referred to as the short party. Long and short for a CDS is relative  to credit risk rather than buying or selling the instrument. Comment 2 is correct. An Index CDS provides  default cover for an index (basket) of bonds. Higher default correlation will make it more expensive to buy  cover. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Song says that an analyst could use structural models to analyze credit risk of Zena, Inc., bonds, and that  one of the ways to evaluate credit risk is to look at the economic exposure of the equity investors.  Specifically, owning equity is similar ry><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Fixed Income<\/summary><div class=\"vig-body\"><p>Nick Andrews, a fixed-income investment analyst, has been asked by his supervisor to prepare an  analysis of the convertible bond issued by Heavy Element Inc., a chemical industry company, for  presentation to the investment committee. Andrews has gathered the following data from the  convertible bond’s prospectus and market information:  Issuer: Heavy Element Inc.  Issue Date: 15 September 2020  Maturity Date: 15 September 2025  Interest: 3.75% payable annually  Issue Size: $100,000,000  Issue Price: $1,000 at par  Conversion Ratio: 23.26  Convertible Bond Price on 16 September 2022: $1,230  Share Price on 16 September 2022: $52 <\/p><p>Zack Ma is evaluating a 10-year, 4% Tesa bond. Ma has calculated the CVA on the bond to be $1.19 per  $100 par. Ma is considering the impact of a new patent granted to Tesa. After careful analysis, Ma  concludes that the probability of default would most likely decrease on the bond.  <\/p><p>Perez Zinta has collected the following information on a 3-year, 3% corporate bond- <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/efs/s2-001.webp\" style=\"max-width:min(100%,567px)\" alt=\"\"><p>Mr. Habibullah Sharifullah is trying to find the value of a 4-year, 5% annual pay, $100 par government  bond. Government par curve is provided below:  Maturity (years)  Par rate <\/p><div class=\"tbl\"><table><tr><td>1  <\/td><td>5.0% <\/td><\/tr><tr><td>2  <\/td><td>6.0% <\/td><\/tr><tr><td>3  <\/td><td>6.5% <\/td><\/tr><tr><td>4  <\/td><td>7.0% <\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The conversion price and conversion value (16th Sept 2022) are closest to:<\/p><div class=\"tbl\"><table><tr><td>Conversion price <\/td><td>Conversion price (16<sup>th<\/sup> Sept 2022) <\/td><\/tr><\/table><\/div><\/div>", "subj": "fixed"}, {"n": 14, "q": "After incorporating the revised probability in his analysis, Ma will er responds that he has not yet decided, but he expects the purchase  of the smaller drug company will require between $190 million and $240 million.   Ward begins her review of Gotham&#x27;s securities holdings and learns the following:  -The corporate bonds are classified as at amortized cost.  -The preferred stock is classified as a fair value through profit or loss security.  -The Treasury bonds, mortgages, and index fund are classified as fair value through OCI. <\/p><p>A review of the balance sheet left Ward with several questions. She called Caper for clarification, who  made the following statements:  -The fact is that, up until this point, we never had any real intent with regard to selling these securities.  In fact, we intend to hold on to the Treasury bonds until maturity.  -We know the market price for the corporate bonds but record their value at amortized cost anyway.  -We intend to reclassify the Treasury bonds as fair value through profit or loss securities because they  mature in less than a year.  -Because the index fund has the most appreciation potential, we intend to reclassify it as fair value  through profit or loss. <\/p><p>Confused by Caper&#x27;s statements, Ward tries a new tactic and looks at the securities from an income- statement perspective. She prepares a table showing how the securities have performed over the last  year and then reviews the income statement and balance sheet for the year to see how Gotham handled  the accounting. The following are last fiscal years’ numbers: <\/p><div class=\"tbl\"><table><tr><td>Securities   <\/td><td>Dividends/Interest <\/td><td>Unrealized Gains/Losses  <\/td><td>Realized Gains/Losses <\/td><\/tr><tr><td>Corporate Bonds 6.25%  $4,500,000  <\/td><td>$2,500,000 <\/td><td><\/td><td><\/td><\/tr><tr><td>Treasury Bonds 6.75%  <\/td><td>$8,500,000  <\/td><td>–$6,000,000 <\/td><td><\/td><\/tr><tr><td>S&amp;P 500 Index Fund  <\/td><td>$630,000  <\/td><td>$4,000,000  <\/td><td>$500,000 <\/td><\/tr><tr><td>GE Preferred Stock  <\/td><td>$740,000  <\/td><td>$1,200,000 <\/td><td><\/td><\/tr><tr><td>Residential Mortgages  <\/td><td>$2,200,000  <\/td><td>–$3,600,000   <\/td><td>$3,000,000 <\/td><\/tr><\/table><\/div><p>After reviewing Gotham&#x27;s accounting for its securities, Ward realizes she does not have enough  information to recommend reclassification for the securities. <\/p><\/div><\/details><div class=\"qtext\"><p>After reviewing Gotham's financial statements and reconsidering Caper's statements, Ward will most<\/p><p>likely conclude that the proposed reclassification of the S&amp;P 500 Index fund: <\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Gotham, which purchased 35% of Klesten Research Center in 2013, restates the last three years of financial statements to account for the purchase. Gotham has not elected the fair value option. In the fiscal year ended December 2016, what is the most likely effect the Klesten investment would have on Gotham's financial statements?", "opts": ["Decrease income and assets.", "Increase income and assets.", "Decrease income and increase assets."], "ans": "A", "expl": "The equity method appears to be the best way to account for Gotham's 35% stake in Klesten Research Center. Under the equity method, the proportional share of Klesten's operational loss is included in Gotham's income, which will decrease Gotham's total income. This decrease would also reduce the carrying value of the Klesten stake on the balance sheet, and the dividend would reduce it still further. Market value is irrelevant in this case, as is the increase in Klesten's debt level.", "explhtml": "<p>The equity method appears to be the best way to account for Gotham&#x27;s 35% stake in Klesten Research  Center. Under the equity method, the proportional share of Klesten&#x27;s operational loss is included in  Gotham&#x27;s income, which will decrease Gotham&#x27;s total income. This decrease would also reduce the carrying  value of the Klesten stake on the balance sheet, and the dividend would reduce it still further. Market value  is irrelevant in this case, as is the increase in Klesten&#x27;s debt level. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Gotham owns 35% of the Klesten Research Center, a laboratory that provides preclinical testing services.  That stake is not represented on the income statement and is carried on the balance sheet at original  cost. Last year, Klesten Research Center lost $150 million, increased its debt load by $400 million to $2.1  billion, saw its market value fall by $100 million to $4.85 billion, and paid $40 million in dividends. <\/p><p>A reporting unit of a Google-US corporation (Ohio division) has a fair value of $1,300,000 and a carrying  value of $1,400,000 that includes recorded goodwill of $300,000. The estimated fair value of the  identifiable net assets of the reporting unit at the impairment test date is $1,200,000.  <\/p><p>Ms. Babita Gada wants to know how many of the following situations might result in a forex translation  gain:  1- Total assets exceed total liabilities when the foreign currency is depreciating using the current rate  method.  2- Monetary liabilities exceed monetary assets when the foreign currency is appreciating using the  temporal method.  3- Monetary assets exceed monetary liabilities when the foreign currency is depreciating using the  temporal method.  4- Total assets equal total liabilities when the foreign currency is appreciating using the current rate  method. <\/p><p>Alpha company has both employee stock options and RSU grants as part of its compensation plan. For  20X1, the stock options and RSU grants had an equal number of unvested underlying shares. Suppose  that the company reports positive basic EPS and the same unrecognized compensation expense.  <\/p><\/div><\/details><div class=\"qtext\"><p>Gotham, which purchased 35% of Klesten Research Center in 2013, restates the last three years of<\/p><p>financial statements to account for the purchase. Gotham has not elected the fair value option. In the  fiscal year ended December 2016, what is the most likely effect the Klesten investment would have on  Gotham&#x27;s financial statements? <\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "Calculate the impairment loss in case of Google-US’ goodwill", "opts": ["200000", "100000", "0"], "ans": "A", "expl": "Step 1 – Determination of an Impairment Loss Because the fair value of the reporting unit is less than its carrying book value, a potential impairment loss has been identified. Fair value of unit: $1,300,000 < $1,400,000 Step 2 – Measurement of the Impairment Loss Fair value of reporting unit $1,300,000 Less: net assets 1,200,000 Implied goodwill $100,000 Current carrying value of goodwill $300,000 Less: implied goodwill 100,000 Impairment loss $200,000 The impairment loss of $200,000 is reported on the income statement, and the goodwill allocated to the reporting unit would be reduced by $200,000 to $100,000. If the fair value of the reporting unit was $800,000 (instead of $1,300,000), the implied goodwill would be a negative $400,000. In this case, the maximum amount of the impairment loss recognized would be $300,000, the carrying amount of goodwill.", "explhtml": "<p>Step 1 – Determination of an Impairment Loss  Because the fair value of the reporting unit is less than its carrying book value, a potential impairment loss  has been identified. Fair value of unit: $1,300,000 &lt; $1,400,000  Step 2 – Measurement of the Impairment Loss  Fair value of reporting unit $1,300,000  Less: net assets 1,200,000  Implied goodwill $100,000  Current carrying value of goodwill $300,000  Less: implied goodwill 100,000  Impairment loss $200,000 <\/p><p>The impairment loss of $200,000 is reported on the income statement, and the goodwill allocated to the  reporting unit would be reduced by $200,000 to $100,000. If the fair value of the reporting unit was  $800,000 (instead of $1,300,000), the implied goodwill would be a negative $400,000. In this case, the  maximum amount of the impairment loss recognized would be $300,000, the carrying amount of goodwill. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gotham owns 35% of the Klesten Research Center, a laboratory that provides preclinical testing services.  That stake is not represented on the income statement and is carried on the balance sheet at original  cost. Last year, Klesten Research Center lost $150 million, increased its debt load by $400 million to $2.1  billion, saw its market value fall by $100 million to $4.85 billion, and paid $40 million in dividends. <\/p><p>A reporting unit of a Google-US corporation (Ohio division) has a fair value of $1,300,000 and a carrying  value of $1,400,000 that includes recorded goodwill of $300,000. The estimated fair value of the  identifiable net assets of the reporting unit at the impairment test date is $1,200,000.  <\/p><p>Ms. Babita Gada wants to know how many of the following situations might result in a forex translation  gain:  1- Total assets exceed total liabilities when the foreign currency is depreciating using the current rate  method.  2- Monetary liabilities exceed monetary assets when the foreign currency is appreciating using the  temporal method.  3- Monetary assets exceed monetary liabilities when the foreign currency is depreciating using the  temporal method.  4- Total assets equal total liabilities when the foreign currency is appreciating using the current rate  method. <\/p><p>Alpha company has both employee stock options and RSU grants as part of its compensation plan. For  20X1, the stock options and RSU grants had an equal number of unvested underlying shares. Suppose  that the company reports positive basic EPS and the same unrecognized compensation expense.  <\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the impairment loss in case of Google-US’ goodwill<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "Relative to the Alpha company’s RSU plan, the options grants are most likely to result in:", "opts": ["more dilutive securities.", "fewer dilutive securities.", "the same number of dilutive securities."], "ans": "B", "expl": "Option grants include cash proceeds from exercise (while RSU does not) in the calculation of estimated proceeds. This results in a greater amount of treasury stock—reducing the number of dilutive securities.", "explhtml": "<p>Option grants include cash proceeds from exercise (while RSU does not) in the calculation of estimated  proceeds. This results in a greater amount of treasury stock—reducing the number of dilutive securities. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gotham owns 35% of the Klesten Research Center, a laboratory that provides preclinical testing services.  That stake is not represented on the income statement and is carried on the balance sheet at original  cost. Last year, Klesten Research Center lost $150 million, increased its debt load by $400 million to $2.1  billion, saw its market value fall by $100 million to $4.85 billion, and paid $40 million in dividends. <\/p><p>A reporting unit of a Google-US corporation (Ohio division) has a fair value of $1,300,000 and a carrying  value of $1,400,000 that includes recorded goodwill of $300,000. The estimated fair value of the  identifiable net assets of the reporting unit at the impairment test date is $1,200,000.  <\/p><p>Ms. Babita Gada wants to know how many of the following situations might result in a forex translation  gain:  1- Total assets exceed total liabilities when the foreign currency is depreciating using the current rate  method.  2- Monetary liabilities exceed monetary assets when the foreign currency is appreciating using the  temporal method.  3- Monetary assets exceed monetary liabilities when the foreign currency is depreciating using the  temporal method.  4- Total assets equal total liabilities when the foreign currency is appreciating using the current rate  method. <\/p><p>Alpha company has both employee stock options and RSU grants as part of its compensation plan. For  20X1, the stock options and RSU grants had an equal number of unvested underlying shares. Suppose  that the company reports positive basic EPS and the same unrecognized compensation expense.  <\/p><\/div><\/details><div class=\"qtext\"><p>Relative to the Alpha company’s RSU plan, the options grants are most likely to result in:<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "In case of Ms. Babita, how many of the following situations might result in a forex translation gain:", "opts": ["None.", "One.", "Two."], "ans": "A", "expl": "None of the situations will result in a gain. When total assets equal total liabilities, net assets are zero; thus, no gain or loss is recognized as a result of changing exchange rates. The other situations would result in a translation loss.", "explhtml": "<p>None of the situations will result in a gain. When total assets equal total liabilities, net assets are zero; thus,  no gain or loss is recognized as a result of changing exchange rates. The other situations would result in a  translation loss. <\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gotham owns 35% of the Klesten Research Center, a laboratory that provides preclinical testing services.  That stake is not represented on the income statement and is carried on ed ratio of less than 100% is considered efficient; a combined ratio greater than 100% indicates an underwriting loss. Insurer C is the only insurer that has a combined ratio less than 100%.", "explhtml": "<p>The combined ratio, which is the sum of the underwriting expense ratio and the loss and loss adjustment  expense ratio, is a measure of the efficiency of an underwriting operation. A combined ratio of less than  100% is considered efficient; a combined ratio greater than 100% indicates an underwriting loss. Insurer C  is the only insurer that has a combined ratio less than 100%. <\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Johansson asks Smith to review key performance ratios for three P&amp;C insurers in which Aries is invested.   Exhibit 1- Key Performance Ratios for Selected P&amp;C Insurers. <\/p><div class=\"tbl\"><table><tr><td>Insurer A  <\/td><td>Insurer B  <\/td><td>Insurer C <\/td><td><\/td><\/tr><tr><td>Loss and loss adjustment expense ratio   <\/td><td>68.8%   <\/td><td>65.9%   <\/td><td>64.1% <\/td><\/tr><tr><td>Underwriting expense ratio  <\/td><td>33.7%   <\/td><td>37.8%   <\/td><td>32.9% <\/td><\/tr><tr><td>Combined ratio  <\/td><td>102.5%  <\/td><td>103.7%  <\/td><td>97.0% <\/td><\/tr><\/table><\/div><p>Johansson also asks Smith to review key performance ratios for ABC Bank, a bank in which Aries is  invested.  Exhibit 2- Key Performance Ratios for ABC Bank* <\/p><div class=\"tbl\"><table><tr><td>2017   <\/td><td>2016   <\/td><td>2015 <\/td><td><\/td><\/tr><tr><td>Common equity Tier 1 capital ratio  <\/td><td>10.7%   <\/td><td>11.5%   <\/td><td>12.1% <\/td><\/tr><tr><td>Tier 1 capital ratio   <\/td><td>11.5%   <\/td><td>12.6%   <\/td><td>13.4% <\/td><\/tr><tr><td>Total capital ratio   <\/td><td>14.9%   <\/td><td>14.8%   <\/td><td>14.9% <\/td><\/tr><tr><td>Liquidity coverage ratio   <\/td><td>123.6%  <\/td><td>12
