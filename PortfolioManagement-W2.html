<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor's optimal portfolio is most likely to be determined by the:", "opts": ["portfolio with the highest return.", "current borrowing and lending rates.", "indifference curve with the highest utility."], "ans": "C", "expl": "The capital allocation line (CAL) is a straight line originating from the risk-free rate and tangent to the efficient frontier. It represents portfolios that\ndominate all other viable portfolios with respect to risk and return. The optimal risky portfolio is the point of tangency between the efficient frontier\nand the CAL.\nAn investor's risk aversion determines investor utility. Utility helps an investor choose the optimal portfolio. Plotting portfolios with the same utility\nbut with different levels of expected return and risk creates an indifference curve. An investor prefers all portfolios on the same indifference\ncurve equally but prefers an indifference curve with higher utility over one with lower utility.\nThe investor's optimal portfolio is the point of tangency between the indifference curve with the highest utility and the CAL. This dominant portfolio\nsatisfies the investor's risk aversion and is viable. Although the indifference curve with lower utility does intersect the CAL, the investor would\nprefer the optimal investor portfolio since it has higher utility.\n(Choice A) All risk-averse investors want to have the highest return for a given level of risk, or the lowest risk for a given level of return. The\nhighest return portfolio does not satisfy all the investor's needs.\n(Choice B) Borrowing and lending rates are most often required to match the investor's risk to a portfolio on the CAL. The actual rate of\nborrowing or lending is irrelevant in determining an optimal investor portfolio.\nThings to remember:\nAn investor's risk aversion helps the investor determine the utility of an investment. Indifference curves represent portfolios of equal utility. Each\ninvestor's optimal portfolio is the point of tangency between the indifference curve with the highest utility and the capital allocation line.\nDescribe the implications of combining a risk-free asset with a portfolio of risky assets", "qhtml": null}, {"n": 2, "q": "Portfolios on the capital market line are most likely constructed using a combination of:", "opts": ["a global market index and US Treasury bills.", "the optimal risky portfolio and the risk-free asset.", "the global minimum variance portfolio and US Treasury bills."], "ans": "A", "expl": "The capital market line (CML) is the practical form of the capital allocation line (CAL). The CAL represents theoretical portfolios combining\nthe optimal risk portfolio and a risk-free asset. The CML replaces the optimal risky portfolio with the real market portfolio (eg, the global market\nindex) and replaces the risk-free asset with short-term domestic government bonds (US Treasury bills).\nAnalysts using the CML assume that markets are informationally efficient. This means that markets provide all the information investors need\nand that all investors find the same valuation. With uniformity of securities' valuations, it is very difficult for investors to outperform the market\nconsistently. This assumption compels investors to follow a passive investing strategy. Under these conditions, using a stock index—such as the\nglobal market index—as a proxy for the market portfolio is logical.\n(Choice B) The optimal risky portfolio and the risk-free asset create theoretical portfolios on the CAL, not the CML.\n(Choice C) Theoretical portfolios created by combining the global minimum variance portfolio and US Treasury bills are suboptimal (lower return\nfor a given level of risk) to portfolios on the CAL. These are not portfolios on the capital market line.\nThings to remember:\nThe capital market line is the practical form of the capital allocation line using index products and government securities to create real-world\nportfolios. A global minimum-risk portfolio is used in place of the optimal risky portfolio or the global market index, the resulting portfolios would be\nsuboptimal with regard to risk and return.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 3, "q": "If a portfolio is fully diversified, it most likely eliminates which type of risk(s)?", "opts": ["Systematic and nonsystematic risk", "Nonsystematic risk but not systematic risk", "Systematic risk but not nonsystematic risk"], "ans": "B", "expl": "Systematic vs. nonsystematic risk\nTotal risk = Systematic risk + Nonsystematic risk\nSystematic risk Nonsystematic risk\nAlso known as market risk or Also known as nonmarket risk or firm-\nnondiversifiable risk specific risk\nInherent in the market Specific to firm or industry\nCannot be eliminated by diversification Can be eliminated by diversification\nExamples: interest rate shifts, stock Examples: business litigation,\nmarket crashes cyberattacks\nRisky assets have both systematic and nonsystematic risk. The total risk of an asset comprises both systemic and nonsystemic risk. Systematic\nrisk (market risk) is the intrinsic risk of the financial system and cannot be reduced or eliminated. It is associated with macroeconomic risks\nwhich impact all assets (eg, wars, recessions, interest rates). Nonsystematic risk usually refers to the risk of an individual company or an\nindustry (eg, a pharmaceutical company facing a class action lawsuit).\nTo eliminate the nonsystematic risk of a portfolio, choose assets whose returns are not correlated with one another. Rational investors add such\nassets until the nonsystematic risk is eliminated to create a fully diversified portfolio (Choices A and C).\nThings to remember:\nSystematic risk plus nonsystematic risk equals total risk. Systematic risk (market risk) is the intrinsic risk of the financial system. Nonsystematic\nrisk can be eliminated by combining assets with low correlation to each other whereas systematic risk cannot be eliminated.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 4, "q": "The security market line shows an asset's expected return based on the asset's:", "opts": ["total risk.", "systematic risk only.", "nonsystematic risk only."], "ans": "B", "expl": "Systematic (market) risk and nonsystematic (entity-specific) risk are the components of total risk. The security market line (SML) is based only\non systematic risk. The capital market line (CML) estimates a security's expected return based on total risk.\nThe SML is the graph of the capital asset pricing model (CAPM). The SML displays the linear relationship between the expected return of an\nasset (y-axis) and the security's beta (x-axis). The CAPM assumes that the risk/return relationship is best explained by a security's systematic\nrisk. Beta, a gauge of systematic risk, measures the sensitivity of a security's return to the market's return.\n(Choice A) The capital allocation line determines an expected return on a security based on total risk (standard deviation). The SML is based on\nsystematic (market) risk only, not total risk.\n(Choice C) Individual assets contain systematic risk and nonsystematic risk. Nonsystemic risk can be minimized by combining assets with low\ncorrelations to create a diversified portfolio, but this type of risk is not useful in estimating an expected return.\nThings to remember:\nThe capital asset pricing model is depicted by the security market line, which shows an asset's expected return relative to its systematic risk, as\nmeasured by beta.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 5, "q": "The market model is most likely used for determining the:", "opts": ["expected return of a security.", "asset allocation of a portfolio.", "nonsystematic risk of an asset."], "ans": "A", "expl": "The market model uses market returns to predict the expected return of a single security. The relationship between the market return and a\nsecurity's expected return is estimated through linear regression of historical return data, which results in a straight line when the relationship is\ngraphed. This line represents an estimate for the security's return for a given market return.\nThe slope of the regression line is the individual security's beta, which measures the sensitivity of a security's return relative to the market's return.\nFor a given market return, a higher beta translates to a higher expected return for the security.\nAlpha is where the market model's regression line intersects the y-axis. While it represents an estimate of the security's return if the market return\nis zero, alpha has less predictive value than beta. In the market model, beta represents a security's predicted return relative to the market's return.\n(Choice B) The market model uses the market's returns to predict a security's return. It is not used to determine asset allocation.\n(Choice C) The market model applies beta to determine the expected return of a security. Beta represents the systematic risk, not the\nnonsystematic risk, of an asset.\nThings to remember:\nUsing regression analysis, the market model takes historical returns to determine the relationship between a security's returns and the market's\nreturn. This estimates a security's expected return for a given market return.\nExplain return generating models (including the market model) and their uses", "qhtml": null}, {"n": 6, "q": "The capital market line (CML) represents portfolios that consist of a stock market index and US Treasury bills, whereas the capital allocation line (CAL) is best described as representing portfolios that consist of: ", "opts": ["the optimal risky portfolio and the risk-free asset.", "the global minimum variance portfolio and the risk-free asset.", "the market portfolio and short-term government securities."], "ans": "A", "expl": "The capital allocation line (CAL) graphically shows all combinations of the risk-free asset and the optimal risky portfolio. The point where the CAL\ntouches the efficient frontier is the optimal risky portfolio. The CAL, a straight-line tangent to the efficient frontier, begins at the risk-free rate (its y-\nintercept).\nThe capital market line (CML), an application of the CAL, replaces theoretical portfolios with actual assets. The CML replaces the risk-free\nasset with short-term government bonds (eg, US Treasury bills). It also assumes that a stock index portfolio (eg, S&P 500 index) replaces the\noptimal risky portfolio.\n(Choice B) The CAL assumes portfolios are created from the optimal risky portfolio and the risk-free asset, not the global minimum variance\nportfolio and the risk-free asset. Portfolios created with the global minimum variance portfolio would be suboptimal to portfolios created with the\noptimal risky portfolio.\n(Choice C) The CAL depicts portfolios created from the theoretical market portfolio and the theoretical risk-free asset, not short-term government\nsecurities.\nThings to remember:\nThe capital market line, an application of the capital allocation line, replaces theoretical portfolios with actual assets.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 7, "q": "Which of the following portfolio performance measures is a meaningful standalone metric?", "opts": ["M-squared", "Sharpe ratio", "Treynor ratio"], "ans": "A", "expl": "Portfolio performance measures are used to evaluate a portfolio's excess return, or return beyond a risk-free investment (eg, Treasury bills), on a\nrisk-adjusted basis. It is important to adjust return for risk because investors require additional return for taking on more risk.\nThe Sharpe ratio and Treynor ratio produce meaningful results only when compared relative to a peer group. Other measures such as M-squared\nand Jensen's alpha produce meaningful standalone results as well as relative comparisons. For example, an M-squared value of 3% means that\nthe portfolio has outperformed the market by 3%, and a Jensen's alpha value of 5% means that the portfolio has outperformed its predicted return\nby 5%.\nBoth the Sharpe and Treynor ratios do not provide meaningful results as standalone values. A portfolio with a Sharpe ratio of 1.5 cannot be\nmeaningfully evaluated unless it is compared to another Sharpe ratio. A portfolio with a Treynor ratio of 1.2 cannot be meaningfully evaluated\nunless it is compared to another Treynor ratio (Choices B and C).\nThings to remember:\nBoth the M-squared and Jensen's alpha measures can provide meaningful results as standalone values.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 8, "q": "According to the assumptions of the capital asset pricing model, which of the following best describes why all investors are price takers?", "opts": ["Investors have different expectations.", "Traders cannot influence the value of an asset.", "Market participants use different holding periods."], "ans": "B", "expl": "CAPM assumptions\nInvestors are compensated for taking risk\nInvestors are risk-averse and rational\nRational investors always want more wealth\nVolume does not impact a security's price\nFrictionless markets No costs, taxes, or restrictions on short selling\nBorrowing and lending at the risk-free rate exist\nSame holding period All investors use an undefined one-period term\nInvestors have identical economic expectations\nHomogeneous expectations\nOnly one optimal risky portfolio may exist\nInvestments are infinitely divisible The size of the investment does not alter results\nInvestors are price takers Large investors cannot influence the prices of securities\nThe capital asset pricing model (CAPM) assumes that all investors are price takers. No single entity can influence asset prices since the\nnumber of market participants is so large. Price takers trade on current prices as dictated by the market. The assumption is that asset prices are\nunaffected by an investor's trade.\nThe assumption may not reflect actual practice but is essential for the model's validity. The intent of the CAPM assumptions is to create a rational\ninvestor who selects efficient investments and whose investment decisions are not clouded by interference from known investing obstructions (eg,\nlaws, costs, information).\n(Choice A) One assumption of the capital asset pricing model (CAPM) is homogeneity in investor expectations. This assumption states that all\ninvestors have the same—not different—expectations. It does not directly suggest that all investors are price takers.\n(Choice C) CAPM assumes that all market participants use the same—not different—holding periods. This means that the expected return\nproduced by the CAPM represents the same time interval for all investors. It is an undefined one-period return. This does not specifically imply\nthat all investors are price takers.\nThings to remember:\nThe capital asset pricing model assumes that all investors are price takers. Price takers trade on current prices as dictated by the market. They\nhave no power to influence an asset's price. Asset prices are unaffected by market participant trades.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 9, "q": "An analyst gathers the following information on three stocks: Expected Stock Standard Beta Deviation A 20% 1.3 B 13% 0.8 C 31% −0.3 The market's expected return is 12%. Based on the CAPM, if the risk-free rate is 2%, then the stock with an expected return greater than the market's expected return is most likely: ", "opts": ["Stock A.", "Stock B.", "Stock C."], "ans": "A", "expl": "According to the CAPM, an asset's expected return is a function of its sensitivity to systematic risk as measured by beta, the market risk\npremium, and the risk-free rate. The market's beta is always equal to 1.0. If a security's beta is greater than 1.0, that security has more\nexposure to systematic risk and a higher expected return than the market.\nIn this case, Stock A's beta (1.3) is greater than the market beta (1.0), so Stock A has an expected return greater than the market's expected\nreturn (Choices B and C). Alternatively, a security's expected return can be calculated using the CAPM and then compared to the market's\nreturn. Stock A's expected return of 15% is greater than the market's expected return of 12%.\nThings to remember:\nAccording to the CAPM, an asset's expected return is a function of its sensitivity to systematic risk, the market risk premium, and the risk-free\nrate. The market's beta is always equal to 1.0. If a security's beta is greater than 1.0, that security has more exposure to systematic risk and a\nhigher expected return than the market.\nCalculate and interpret the expected return of an asset using the CAPM\n10. Assume the capital asset pricing model (CAPM) sets the expected return for fairly valued securities. If an analyst determines a stock's\nexpected return by another method and that return is higher than the stock's expected return as determined by the CAPM, then the analyst most\nlikely should:\n A. buy the stock since it undervalued.\nB. sell the stock since it is overvalued.\nC. postpone action until the stock is fairly valued.\nExplanation\nThe security market line (SML) is a graph of the capital asset pricing model (CAPM). The CAPM is used to estimate a security's expected return\nbased on its beta, the market's expected return, and the risk-free rate. Based on the CAPM's assumptions (eg, market efficiency), its' estimate of\na security's expected return is assumed to be the market's consensus.\nIf a stock's non-CAPM expected return is greater than its CAPM expected return, then the market assumes that the stock is mispriced and\nundervalued relative to the CAPM's valuation. Undervalued securities plot above the SML, and overvalued securities plot below it. Securities\nthat are valued fairly are located on the SML. Rational investors buy the undervalued asset, causing its price to increase and its expected return\nto decrease. This process continues until the security is priced fairly and plots on the SML\n(Choices B) Selling the stock is a result of misinterpreting its valuation as overvalued. According to CAPM, rational investors buy undervalued\nsecurities and sell overvalued ones.\n(Choices C) By taking no action the investor cannot capture the price appreciation. Assuming CAPM forms market consensus, if a security is\nfairly valued there is no opportunity for price appreciation.\nThings to remember:\nThe CAPM's estimate of a security's expected return is assumed to be the market's consensus. An expected return that differs from the CAPM's is\nassumed to be mispriced. If another model's prediction of a security's expected return exceeds the expected return as determined by the CAPM,\nthen the security is undervalued. Rational investors buy undervalued securities.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 10, "q": "Assume the capital asset pricing model (CAPM) sets the expected return for fairly valued securities. If an analyst determines a stock's expected return by another method and that return is higher than the stock's expected return as determined by the CAPM, then the analyst most likely should:", "opts": ["buy the stock since it undervalued.", "sell the stock since it is overvalued.", "postpone action until the stock is fairly valued."], "ans": "A", "expl": "The security market line (SML) is a graph of the capital asset pricing model (CAPM). The CAPM is used to estimate a security's expected return\nbased on its beta, the market's expected return, and the risk-free rate. Based on the CAPM's assumptions (eg, market efficiency), its' estimate of\na security's expected return is assumed to be the market's consensus.\nIf a stock's non-CAPM expected return is greater than its CAPM expected return, then the market assumes that the stock is mispriced and\nundervalued relative to the CAPM's valuation. Undervalued securities plot above the SML, and overvalued securities plot below it. Securities\nthat are valued fairly are located on the SML. Rational investors buy the undervalued asset, causing its price to increase and its expected return\nto decrease. This process continues until the security is priced fairly and plots on the SML\n(Choices B) Selling the stock is a result of misinterpreting its valuation as overvalued. According to CAPM, rational investors buy undervalued\nsecurities and sell overvalued ones.\n(Choices C) By taking no action the investor cannot capture the price appreciation. Assuming CAPM forms market consensus, if a security is\nfairly valued there is no opportunity for price appreciation.\nThings to remember:\nThe CAPM's estimate of a security's expected return is assumed to be the market's consensus. An expected return that differs from the CAPM's is\nassumed to be mispriced. If another model's prediction of a security's expected return exceeds the expected return as determined by the CAPM,\nthen the security is undervalued. Rational investors buy undervalued securities.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 11, "q": "Using the capital asset pricing model, if a security's expected return is 20%, its beta is 1.3, and the risk-free rate is 4%, then the market risk premium is closest to:", "opts": ["8.3%", "12.3%", "16.0%"], "ans": "B", "expl": "The market risk premium is the additional amount of return above the risk-free rate an investor expects to earn for bearing market risk. Under the\ncapital asset pricing model (CAPM), the market risk premium is the difference between the expected rate of return on the market and the\nrisk-free rate of return. The market risk premium is also called the excess market return.\nThe market risk premium is used in the CAPM to calculate the expected return for a security based on the security's beta, the market's return,\nand the risk-free rate. Use the CAPM formula to determine market risk premium.\n(Choice A) This percentage is the market return, not the market risk premium.\n(Choice C) This incorrect answer is the difference between the security's expected return and the risk-free rate. The market risk premium, in\ncontrast, is the difference between the market's expected return and the risk-free rate.\nThings to remember:\nThe market risk premium is the difference between the market's expected return and the risk-free rate. It is the amount of return—in addition to\nthe risk-free rate—that an investor expects to receive for bearing market risk. Using the capital asset pricing model to calculate the market risk\npremium, subtract the risk-free rate from the expected return and divide the result by the security's beta.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 12, "q": "The market portfolio's systematic variance is most likely:", "opts": ["less than its nonsystematic variance.", "equal to its nonsystematic variance.", "greater than its nonsystematic variance."], "ans": "C", "expl": "By definition, the market portfolio is a fully diversified portfolio. Diversification removes all nonsystematic risk, so nonsystematic variance\n(which quantifies nonsystematic risk) is zero. The terms risk and variance are used interchangeably; variance is the unit of measurement used to\nquantify a level of risk\nThe market portfolio contains only systematic risk (market risk). Therefore, the market portfolio's systematic variance is greater than its\nnonsystematic variance (Choices A and B).\nThings to remember:\nVariance quantifies risk. Total risk consists of both systematic and nonsystematic risk. A fully diversified portfolio contains only systematic risk\nsince diversification removes nonsystematic risk.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 13, "q": "If an asset has a beta that is equal to the average beta of all assets, then its risk level is most likely:", "opts": ["less than market risk.", "equal to market risk.", "greater than market risk."], "ans": "B", "expl": "Beta measures the sensitivity of an asset's risk relative to market risk. A stock or an asset that has a beta of 1.0 has the same relative risk as\nthe market, and the expected return should be the same as the market return. Beta can be positive or negative and mostly ranges from 0 to 2, but\nits value can be higher or lower. A stock with a beta of 1.20 has 20% more risk than the market.\nThe theoretical market portfolio's beta is the average beta of all risky assets, which is equal to 1 by definition. An asset with a beta equal to the\naverage beta of all risky assets also has a beta of 1, and its risk level is equal to that of the market's risk (Choices A and C).\nThings to remember:\nThe theoretical market portfolio includes all risky assets, and the average beta of all risky assets is the same as the beta of the market. An asset\nwith a beta equal to the market has a risk level equal to that of the market's risk.\nCalculate and interpret beta", "qhtml": null}, {"n": 14, "q": "Which of the following is most likely an assumption of CAPM?", "opts": ["Investments are infinitely divisible.", "Investors have the same risk appetite.", "Investors are rewarded only for diversifiable risk."], "ans": "A", "expl": "CAPM assumptions\nInvestors are compensated for taking risk\nInvestors are risk-averse and rational\nRational investors always want more wealth\nVolume does not impact a security's price\nFrictionless markets No costs, taxes, or restrictions on short selling\nBorrowing and lending at the risk-free rate exist\nSame holding period All investors use an undefined one-period term\nInvestors have identical economic expectations\nHomogeneous expectations\nOnly one optimal risky portfolio may exist\nInvestments are infinitely divisible The size of the investment does not alter results\nInvestors are price takers Large investors cannot influence the prices of securities\nCAPM is used to calculate the expected return for an asset based on only its systematic risk. CAPM assumes that all investments are\ninfinitely divisible, so investors can create any asset allocation without restriction.\nIn practice, investors may be able to invest only in discrete amounts or units, such as shares. Alternative solutions include purchasing fractional\nshares that allow investors to buy stock based on a dollar value rather than paying the full share price.\n(Choice B) CAPM assumes all investors are risk-averse and want to be compensated fairly for taking on additional risk. It does not assume they\nare equally risk-averse or willing to accept the same level of risk.\n(Choice C) CAPM is a single-factor model in which only systematic, non-diversifiable market risk is priced. Nonsystematic or diversifiable risk is\nassumed to be diversified by the investor and therefore does not need to be compensated with return.\nThings to remember:\nCAPM assumes all investments are indefinitely divisible and individuals can invest any amount they want to. In practice, certain investments can\nbe made only in discrete functions. The size of the investment does not alter results.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 15, "q": "A portfolio manager is considering three funds to add to a portfolio and gathers the following data: Fund X Fund Y Fund Z Actual average return (%) 5.13 4.98 7.29 Expected return (%) 5.59 4.83 7.81 Beta 1.18 0.95 1.85 The manager will add only funds with Jensen's alpha above −0.5% and a, ex post Treynor ratio greater than 3%. If the risk-free rate is 1.7% and the market has averaged a 5% return, the manager's most appropriate choice is:", "opts": ["Fund X", "Fund Y", "Fund Z"], "ans": "B", "expl": "The Treynor ratio and Jensen's alpha are used to evaluate risk-adjusted portfolio performance. The Treynor ratio compares the portfolio's\nreturns in excess of the risk-free rate with the portfolio's systematic risk as measured by beta. Jensen's alpha calculates the difference\nbetween a portfolio's actual (eg, average return) and expected returns consistent with the portfolio's systematic risk according to CAPM.\nIn this scenario, the manager uses both measures to compare three funds. Treynor ratios are solved using the equation above. Jensen's alpha is\nmore easily solved by comparing the actual and expected returns. Substituting all terms into the equation would give the same answer, but the\nmore direct approach is to recognize that Jensen's alpha is the difference between the actual (ie, average) and expected returns.\nThe only choice that meets both criteria is Fund Y.\n(Choice A) Fund X has a Jensen's alpha that exceeds −0.5%, but its ex post Treynor ratio, based on actual returns, is below 3%; therefore, this\nfund would not be selected.\n(Choice C) Fund Z has a Treynor ratio greater than 3%, but its Jensen's alpha is below −0.5%; therefore, this fund would not be selected.\nThings to remember:\nThe Treynor ratio and Jensen's alpha are used to evaluate performance that relies on the CAPM framework. Both gauge performance on a risk-\nadjusted basis, with beta as the measure of risk. The Treynor ratio compares a portfolio's excess return to its systematic risk. Jensen's alpha\ncompares a portfolio's actual and expected returns, as predicted by CAPM.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 16, "q": "Which of the following performance measures is most appropriate for a portfolio that has diversified all nonsystematic risk?", "opts": ["M-squared", "Sharpe ratio", "Jensen's alpha"], "ans": "C", "expl": "Jensen's alpha measures the difference between a portfolio's actual return and its expected return. Expected return represents the return that a\nportfolio should produce given the risk-free rate, the overall market return, and the portfolio's beta. A positive Jensen's alpha is risk-adjusted\nperformance above the market. Investors evaluate portfolios using Jensen's alpha.\nA portfolio that has fully eliminated nonsystematic risk (ie, nonmarket or idiosyncratic) is left with only systematic risk (market risk). Beta\nmeasures systematic risk. Use beta-based performance metrics to evaluate diversified portfolios. Jensen's alpha is the only metric offered as an\nanswer that is based on beta. The Treynor ratio, also based on beta, would also be proper.\nThe Sharpe ratio and M-squared use standard deviation as the measure of risk to normalize portfolio returns. Standard deviation accounts for\ntotal risk (systematic risk plus nonsystematic risk). Standard deviation should be used when a portfolio has not been fully diversified and still has\nnonsystematic risk (Choices A and B).\nThings to remember:\nThe Treynor ratio and Jensen's alpha both use beta as a measure of risk. Beta measures only systematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 17, "q": "A state pension fund employs three investment managers; their fund performance data for the past year is shown below: Standard Beta Return Deviation (σ) (β) Manager 1 13% 18% 1.4 Manager 2 7% 12% 0.8 Manager 3 14% 22% 1.5 Market 8% 14% 1.0 If the risk-free rate is 2%, then the manager with the highest total risk-adjusted return is: ", "opts": ["Manager 1.", "Manager 2.", "Manager 3."], "ans": "A", "expl": "Total risk, or standard deviation of returns (σ), combines systematic risk (market risk) and nonsystematic risk (nonmarket risk). Using either the\nSharpe ratio or M-squared (M2) equation is proper when evaluating managers based on the highest return adjusted for total risk.\nBoth M-squared and the Sharpe ratio calculate total risk-adjusted performance for each manager because each reflects total risk (as captured by\nstandard deviation, σ). Both also evaluate a portfolio's excess return (ie, return greater than the risk-free rate) compared to that portfolio's\nstandard deviation.\nBoth the unscaled Sharpe ratio and the M2, in percentage terms, give identical rankings when comparing manager's performance. As shown\nbelow, Manager 1 has the highest Sharpe ratio and M-squared results.\nThings to remember:\nStandard deviation measures total risk whereas beta measures systematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 18, "q": "A mid-cap portfolio has the following performance this past year: Portfolio return 18.0% Market return 7.0% Risk-free rate 2.0% Standard deviation of portfolio returns 23.0% Standard deviation of market returns 20.0% Beta 0.90 The M-squared value for the portfolio is closest to:", "opts": ["11.57%", "15.91%", "20.40%"], "ans": "B", "expl": "The M-squared metric measures excess return after adjusting for the risk of a portfolio relative to that of its benchmark. The portfolio's\nexcess return is its return in excess of the risk-free rate. The portfolio's excess return is adjusted for risk using the ratio of the market's risk to the\nportfolio's risk, as measured by standard deviation. The risk-free return is then added back for the portfolio's risk-adjusted return.\nThe M-squared result, the portfolio's risk-adjusted return, can be compared with the market return: if the portfolio's M-squared result is greater\n(less) than the market return, then the portfolio outperformed (underperformed) the market on a risk-adjusted basis.\nInserting values into the equation:\n(Choice A) 11.57% results from subtracting the market return instead of the risk-free rate from the portfolio return to find the portfolio's excess\nreturn.\n(Choice C) 20.40% results from inverting the ratio of the market standard deviation to portfolio standard deviation.\nThings to remember:\nThe M-squared value measures portfolio performance relative to the market on a risk-adjusted basis. The M-squared result can be compared to\nthe market return: if the portfolio's M-squared result is greater (less) than the market return, then the portfolio outperformed (underperformed) the\nmarket on a risk-adjusted basis.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 19, "q": "An analyst collects the following data: Sharpe Standard Return Ratio Deviation Portfolio A 1.06 13% Market 12% 9% The risk-free rate is 2%. The M-squared value of Portfolio A is closest to: ", "opts": ["11.5%", "12.0%", "15.8%"], "ans": "A", "expl": "Portfolio returns are compared to a benchmark to determine whether the portfolio manager outperformed the benchmark. However, simply\ncomparing returns is not useful without knowing how much risk the manager assumed.\nM-squared (or M2) is an investment performance tool that takes risk, as measured by standard deviation, into account. It measures the risk-\nadjusted excess return of the portfolio using the ratio of the market's standard deviation to the portfolio's standard deviation. If the M-squared\nvalue is greater than the market return, it indicates that the portfolio outperformed the market on a risk-adjusted basis.\nRearranging terms in the equation results in:\nThe blue-shaded terms represent the Sharpe ratio, so the M-squared formula simplifies to:\nSharpe ratio × σ + Risk-free rate\nm\n= (1.06 × 0.09) + 0.02 = 0.1154 = 11.54%\nNote that the difference between a portfolio's M-squared and the market return is known as M-squared alpha.\n(Choice B) 12.0% is the market's M-squared value. Since M-squared measures excess return, there is no excess return between the market's\nreturn and itself.\n(Choice C) 15.78% is obtained by incorrectly multiplying the portfolio's Sharpe ratio by its standard deviation instead of the market's standard\ndeviation.\nThings to remember:\nM-squared is a risk-adjusted performance evaluation metric that measures excess portfolio return relative to the excess market return. It is\ncalculated by multiplying the portfolio's Sharpe ratio by the market standard deviation and then adding the risk-free rate to that result.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 20, "q": "The expected return on the market is 8% and the risk-free rate is 3%. If a security has a beta of 1.2, its expected return is closest to:", "opts": ["9.0%", "9.6%", "12.6%"], "ans": "A", "expl": "The capital asset pricing model (CAPM) estimates the expected return for a security based on the security's beta, the market's return, and\nthe risk-free rate. To find the expected return of a security, substitute the given values into the CAPM:\n(Choice B) This answer results from multiplying the market's return and the security's beta instead of plugging the variables into the CAPM\nequation to find the expected return for the security.\n(Choice C) This answer is the result of multiplying the market's return by the security's beta and then adding the risk-free rate to the product. This\noverstates the expected return and is an incorrect application of the CAPM.\nThings to remember:\nUsing the capital asset pricing model, the expected return can be found by multiplying the security's beta by the market risk premium (market\nreturn minus the risk-free rate) and then adding the risk-free rate.\nCalculate and interpret beta", "qhtml": null}, {"n": 21, "q": "An analyst collects the following data for three portfolios over the past five years: Standard Beta Return Deviation (σ) (β) Manager 1 10% 18% 1.2 Manager 2 9% 12% 0.8 Manager 3 11% 22% 1.5 Market 8% 14% Risk-free rate 3% Which portfolio has the highest Sharpe ratio?", "opts": ["Portfolio 1", "Portfolio 2", "Portfolio 3"], "ans": "B", "expl": "Investors require higher returns for assuming more risk. The Sharpe ratio is one metric that evaluates returns on a risk-adjusted basis, measuring\nexcess return per unit of total risk. Excess return is the difference between the portfolio's return and the return of a risk-free asset (eg, US\nTreasury bill, or T-bill). Total risk is measured by the standard deviation of returns and captures both systematic (market) risk and nonsystematic\n(nonmarket) risk.\nThe Sharpe ratios for the three portfolios are calculated below:\nPortfolio 2 has the highest Sharpe ratio, and therefore has the greatest excess return per unit of total risk compared to its peers.\nThings to remember:\nThe Sharpe ratio measures excess return per unit of total risk. Standard deviation, not beta, is used to calculate the Sharpe ratio. The portfolio\nwith the highest Sharpe ratio produces the best risk-adjusted result.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 22, "q": "According to the capital asset pricing model, beta best measures the sensitivity of an asset's return to:", "opts": ["total risk.", "market risk.", "nonsystematic risk."], "ans": "B", "expl": "Beta is a measure of market (systematic) risk. Beta estimates an asset's sensitivity to market movements. An asset with a beta of 1 has the\nsame relative risk and the same expected return as the market's return. An asset with a beta of 1.20 has 20% more risk than the market.\nWith respect to capital market theory, beta is the main component of the capital asset pricing model (CAPM). The CAPM is used to estimate a\nsecurity's expected return based on the security's beta, the market's expected return, and the risk-free rate.\n(Choices A and C) Beta is a measure of a security's systematic risk. Total risk comprises both systematic risk and nonsystematic risk.\nThings to remember:\nBeta estimates an asset's sensitivity to market movements. The capital asset pricing model uses beta, the risk-free rate, and the market's\nexpected return to determine an security's expected return.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 23, "q": "An analyst collects the following data to calculate the Treynor ratio for a fund: Market return 10.0% US Treasury bill return 4.0% Standard deviation of portfolio returns 22.9% Fund return 16.0% Beta 1.15 The Treynor ratio for the four-year period is closest to: ", "opts": ["0.10", "0.14", "0.52"], "ans": "A", "expl": "The Treynor ratio is a metric that evaluates a portfolio's performance on a risk-adjusted basis. It measures excess return per unit of systematic\n(market) risk. Excess return is the difference between the portfolio's return and the return of a risk-free asset (eg, US Treasury bill, or T-bill).\nSystematic risk is measured by beta and refers to the relative sensitivity of a portfolio's return to that of the overall market.\nIt is important to adjust return for risk since investors require additional return for taking on more risk.\n(Choice B) This answer results from dividing the average portfolio return, instead of the excess return, by beta.\n(Choice C) The excess return was divided by the standard deviation instead of beta.\nThings to remember:\nThe Treynor ratio measures excess return per unit of systematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 24, "q": "A manager collects the following data on three investments: Expected Expected Investment standard Beta return (%) deviation (%) A 19 30 1.4 B 16 26 1.1 C 6 13 0.7 Market 8 18 1.0 Which investment has the lowest correlation with the market?", "opts": ["Investment A", "Investment B", "Investment C"], "ans": "B", "expl": "Rearrange the beta equation to solve for the correlation coefficient:\nBeta is a measure of systematic (market) risk. It measures the sensitivity of a security's return relative to the market's return. Beta is a\nfunction of a security's standard deviation, the market's standard deviation, and the correlation between the two.\nRearrange the beta formula to solve for correlation, then find the investment with the lowest correlation:\nFor a given risk level (standard deviation), the lower the security's correlation with the market, the greater the security's potential benefit of\ndiversification. A portfolio of securities that has a low correlation with the market—and low correlations among its individual securities—has\nlower risk than a portfolio with highly correlated assets.\n(Choices A and C) Investments A and C have higher correlations with the market than Investment B does.\nThings to remember:\nFor a given level of risk (standard deviation), the lower the correlation between the security and the market, the lower the beta (market risk).\nComparing correlations is important since a security with the lowest correlation with the market provides the most risk reduction through the\nbenefit of diversification.\nCalculate and interpret beta", "qhtml": null}, {"n": 25, "q": "An analyst gathers the following information: Portfolio Market Expected return 10.4% 8% Beta 1.4 1.0 Standard deviation 15% 12% If the risk-free rate is 2%, the portfolio's Sharpe ratio is closest to:", "opts": ["0.06", "0.56", "0.70"], "ans": "B", "expl": "The Sharpe ratio is one method used to evaluate the performance of an asset or portfolio relative to its risk. It measures an investment's return in\nexcess of the risk-free rate, then scales that return by the amount of risk the investor assumed to achieve the return. An investment with a greater\nSharpe ratio indicates that the investment produced greater excess return for its risk.\nThe Sharpe ratio uses total risk, as measured by standard deviation, as its risk metric. Asset risk refers to either the asset's systematic risk or its\ntotal risk, which is the sum of its systematic risk and unsystematic (ie, diversifiable) risk.\nIn this scenario, the portfolio's Sharpe ratio is calculated as:\n(Choice A) 0.06 is the portfolio's Treynor ratio. This ratio represents the portfolio's excess return relative to its systematic risk, as measured by\nbeta.\n(Choice C) 0.70 is the ratio of the portfolio's excess return to the market's, not the portfolio's, standard deviation.\nThings to remember:\nThe Sharpe ratio is one measure of asset performance used to evaluate performance relative to risk. It is calculated as the ratio of the asset's\nexcess return to the asset's standard deviation. Standard deviation is a measure of total risk, which is the sum of systematic and nonsystematic\nrisk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 26, "q": "An analyst provides the following performance information for three portfolios over the past year: Selected Portfolio Performance Data Mean Annual Return Sharpe Ratio Treynor Ratio Portfolio 1 18.0% 0.83 0.11 Portfolio 2 10.0% 0.34 0.13 Portfolio 3 7.5% 0.50 0.06 Based only on this information, if the risk-free rate is 1.5%, which portfolio has the highest systematic risk? ", "opts": ["Portfolio 1", "Portfolio 2", "Portfolio 3"], "ans": "A", "expl": "Performance evaluation analyzes a portfolio's return and degree of risk. In portfolio management, risk is quantified as either systematic risk, as\nmeasured by beta, or total risk, as measured by standard deviation. Total risk includes both systematic and unsystematic risk.\nThe Treynor ratio, which is the ratio of excess return to beta, allows the isolation of systematic risk using beta. This distinguishes it from the\nSharpe ratio, which is the ratio of excess return to total risk as measured by standard deviation.\nIn this question, the portfolio with the highest systematic risk is identified as follows:\nPortfolio 1 has the highest systematic risk, with a beta of 1.50.\nThings to remember:\nThe Treynor ratio measures excess return relative to systematic risk, as measured by beta. This distinguishes it from the Sharpe ratio, which also\nuses excess return but relative to total risk as measured by standard deviation.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 27, "q": "A portfolio consisting of the S&P 500 Index ETF and US Treasury bills is most likely on the:", "opts": ["efficient frontier.", "capital market line.", "security market line."], "ans": "B", "expl": "The capital market line (CML) is the practical form of the capital allocation line (CAL). The CAL represents theoretical portfolios combining\nthe optimal risky portfolio and a risk-free asset. The CML replaces the optimal risky portfolio with the real market portfolio (eg, the S&P 500\nIndex) and replaces the risk-free asset with short-term domestic government bonds.\nAnalysts using the CML assume that markets are informationally efficient. This means that markets provide all the information investors need, and\nall investors find the same valuation. With uniformity of securities' valuations, it is very difficult for investors to outperform the market consistently.\nThis assumption compels investors to follow a passive investing strategy. Under these conditions, using a stock index—such as the S&P 500\nIndex—as a proxy for the market portfolio is logical.\nUnder the CAL, the definition of the optimal risky portfolio not only includes stocks and bonds but also includes thousands of different types of\nasset classes. Some of these are unavailable due to legal restrictions (eg, Class A China Stock to non-Chinese investors) and some are\nnontradable (eg, private property). Therefore, the optimal risky portfolio does not exist in the real world.\n(Choice A) The efficient frontier represents all theoretical portfolios of risky assets in the investment opportunity set to that offer the highest\nexpected return at each level of risk. Portfolios on the efficient frontier do not hold the risk-free asset.\n(Choice C) The security market line shows rates of return for individual assets, not for a portfolio of assets. It depicts one security's expected\nreturn as a function of systematic risk.\nThings to remember:\nThe capital market line is the practical form of the capital allocation line that uses indexes and government securities to create real-world\nportfolios. Analysts can make actionable conclusions using actual versus theoretical portfolios. The capital market line assumes that markets are\ninformationally efficient.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 28, "q": "The following information on three portfolios is collected: All portfolios have an actual return of 15%. According to the capital asset pricing model (CAPM), which of the following is most likely to be the best performing portfolio based on the difference between its actual return and its expected return?", "opts": ["Portfolio X", "Portfolio Y", "Portfolio Z"], "ans": "A", "expl": "Examining a portfolio's return is only one aspect of evaluating its performance. Another is determining how much risk it took to earn that return.\nThis is accomplished by calculating a risk-adjusted return. In portfolio management, the return is adjusted for risk using either systematic risk\n(beta) or total risk (standard deviation).\nJensen's alpha is a performance measure that uses beta to determine the portfolio's risk-adjusted excess return. It is the difference between a\nportfolio's actual return and its risk-adjusted return as predicted by the capital asset pricing model (CAPM). Portfolio X, which has the highest\nJensen's alpha, is the best performing portfolio based on its risk-adjusted excess return.\n(Choice B) Portfolio Y is the best performing investment evaluated using the Sharpe ratio. The Sharpe ratio determines a portfolio's risk premium\n(return less risk-free rate) per unit of total risk (standard deviation).\n(Choice C) Portfolio Z is the best-performing investment evaluated using the Treynor ratio. The Treynor ratio determines a portfolio's risk\npremium (return less risk-free rate) per unit of systematic risk (beta).\nThings to remember:\nJensen's alpha is the difference between actual return and expected return as predicted by the capital asset pricing model. The portfolio with the\nhighest Jensen's alpha outperforms its peers by having the greatest risk-adjusted excess return.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 29, "q": "Which of the following performance measures is most appropriate for evaluating the risk-adjusted returns of a fully diversified portfolio?", "opts": ["M-Squared", "Sharpe ratio", "Treynor ratio"], "ans": "C", "expl": "Performance measures comparison\nPerformance Risk\nDiversification Description Risk\nmeasure measure\nExcess return per Standard\nSharpe ratio No Total\nunit of total risk deviation\nExcess market-risk- Standard\nM-squared No Total\nadjusted return deviation\nReturn per unit of\nTreynor ratio Yes Beta Systematic\nsystematic risk\nExcess of actual vs.\nJensen's alpha Yes Beta Systematic\nexpected return\nIn theory, fully diversified portfolios have no nonsystematic (company-specific) risk. For those portfolios, an appropriate performance measure is\none that uses beta to measure market risk. Portfolios that are not fully diversified contain both nonsystematic (company-specific) and systematic\n(market) risk. For these portfolios, a suitable performance measure is one that uses total risk (standard deviation).\nHere, the portfolio is fully diversified, so an appropriate performance measure should be based on beta, not standard deviation (Choices A and\nB). Using the Treynor ratio or Jensen's alpha is appropriate. The Treynor ratio is a performance measure that determines a portfolio's excess\nreturn per unit of systematic risk. For example, if the return of a portfolio is 20%, the risk-free rate is 5%, and its beta 1.2, then the portfolio's\nTreynor ratio is 0.125, or (0.20 − 0.05)/1.2. This means that the portfolio earned 0.125 units of excess return per unit of systematic risk.\nThings to remember:\nFully diversified portfolios have no nonsystematic (company-specific) risk. Appropriate performance measures for these portfolios use beta to\nmeasure market risk and include the Jensen's alpha and the Treynor ratio. The Treynor ratio determines a portfolio's excess return per unit of\nsystematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 30, "q": "An analyst gathers information about three investments: Correlation between Expected Expected Investment investment and the return (%) variance market A 15.0 0.1296 0.5 B 7.0 0.0081 0.9 C 11.0 0.0625 0.8 Market 8.5 0.0256 1.0 Which investment has the greatest amount of systematic risk?", "opts": ["A", "B", "C"], "ans": "C", "expl": "Beta is a measure of systematic risk (market risk). It measures the sensitivity of a security's return relative to the market's return. The market\nhas a beta of 1. A security with a beta higher than 1 tends to move in the same direction as the market, but the magnitude of the movement is\ngreater. Individual securities have systematic risk and nonsystematic risk. Fully diversified portfolios have only systematic risk since\ndiversification eliminates nonsystematic risk.\nFor a given market return, a higher beta translates to a higher expected return for the security. A higher expected return is associated with higher\nrisk, so a security's beta indicates its relative riskiness. Since beta is the same as systematic risk, the security with the highest market risk is the\none with the highest beta.\nBeta is a function of a security's standard deviation, the market's standard deviation, and the correlation between the two. The formula requires\nthe use of the standard deviation, so remember to take the square root of variance if the variance is the only risk measure given in the question.\nUse the formula for beta to determine each investment's systematic risk:\nThings to remember:\nBeta is a measure of systematic risk (ie, market risk). It is a function of a security's standard deviation, the market's standard deviation, and the\ncorrelation between the two. A higher beta means higher risk and higher expected return.\nCalculate and interpret beta\n31. A portfolio on the capital market line with higher risk than that of the market portfolio is most likely:\nA. unachievable.\nB. created through lending.\n C. created through borrowing.\nExplanation\nThe capital market line represents risky portfolios that contain a combination of the global market index (market portfolio) and US Treasury bills\n(risk-free assets). The investor's risk level determines that investor's asset allocation. If the investor's risk tolerance matches the market portfolio's\nrisk level, then the investor holds only the market portfolio.\nApproaches to estimating probabilities\nLess than the Same as the Greater than the\nRisk level\nmarket portfolio market portfolio market portfolio\nAllocation to\n<100% 100% >100%\nmarket portfolio\nAllocation to\n>0% and <100% 0% <0% (negative)\nrisk-free asset\nBorrowing or\nLending Neither Borrowing\nlending\nTo create a $100,000 portfolio that has 30% more risk than the market, invest $130,000 in the global market index. This is achieved by borrowing\nan additional $30,000 at the risk-free rate (US Treasury bills) and investing it and the original portfolio in the global market index. This creates a\nportfolio with 30% more risk than the market portfolio. Its allocation is 130% to the global market index and −30% to US Treasury bills. The\namount borrowed is repaid at a point in time in the future.\n(Choice A) All portfolios above the capital market line are unattainable.\n(Choice B) Lending would be appropriate if the investor wants risk lower than that of the market portfolio.\nThings to remember:\nTo create portfolios on the capital market line with risk higher than that of the market portfolio, borrow at the risk-free rate and invest the original\ninvestment plus the amount borrowed in the market portfolio. When borrowing, the amount allocated to the market portfolio will be greater than\n100%.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 31, "q": "A portfolio on the capital market line with higher risk than that of the market portfolio is most likely:", "opts": ["unachievable.", "created through lending.", "created through borrowing."], "ans": "C", "expl": "The capital market line represents risky portfolios that contain a combination of the global market index (market portfolio) and US Treasury bills\n(risk-free assets). The investor's risk level determines that investor's asset allocation. If the investor's risk tolerance matches the market portfolio's\nrisk level, then the investor holds only the market portfolio.\nApproaches to estimating probabilities\nLess than the Same as the Greater than the\nRisk level\nmarket portfolio market portfolio market portfolio\nAllocation to\n<100% 100% >100%\nmarket portfolio\nAllocation to\n>0% and <100% 0% <0% (negative)\nrisk-free asset\nBorrowing or\nLending Neither Borrowing\nlending\nTo create a $100,000 portfolio that has 30% more risk than the market, invest $130,000 in the global market index. This is achieved by borrowing\nan additional $30,000 at the risk-free rate (US Treasury bills) and investing it and the original portfolio in the global market index. This creates a\nportfolio with 30% more risk than the market portfolio. Its allocation is 130% to the global market index and −30% to US Treasury bills. The\namount borrowed is repaid at a point in time in the future.\n(Choice A) All portfolios above the capital market line are unattainable.\n(Choice B) Lending would be appropriate if the investor wants risk lower than that of the market portfolio.\nThings to remember:\nTo create portfolios on the capital market line with risk higher than that of the market portfolio, borrow at the risk-free rate and invest the original\ninvestment plus the amount borrowed in the market portfolio. When borrowing, the amount allocated to the market portfolio will be greater than\n100%.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 32, "q": "In relation to other portfolios, unattainable portfolios are located:", "opts": ["below the capital market line.", "on the capital market line.", "above the capital market line."], "ans": "C", "expl": "The capital market line (CML) is the practical form of the capital allocation line (CAL). The CAL represents theoretical portfolios combining\nthe optimal risky portfolio and a risk-free asset. The CML replaces the optimal risky portfolio with the real market portfolio (eg, global market\nindex) and uses short-term domestic government bonds (US Treasury bills) in place of the risk-free asset. All portfolios above the CML are\nunattainable (gray shaded area).\nAt each level of risk along the CML, there is no combination of assets that can produce a return greater than the return on the CML. All portfolios\nbelow the CML (green shaded area) are attainable but are suboptimal since portfolios along the CML have the highest return at each level of risk\n(Choices A and B).\nThe CML represents portfolios that hold a combination of the global market index and the US Treasury bills. The market portfolio is the portfolio\non the efficient frontier at the point where a straight line that originates from the risk-free rate is tangent to the efficient frontier. All portfolios on the\nCML dominate all other achievable portfolios.\nThings to remember:\nPortfolios on the capital market line (CML) have the highest return for a given level of risk. Portfolios above the CML are unattainable, and\nportfolios below the CML are suboptimal.\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 33, "q": "A manager compiles the following data: The market's expected standard deviation is 20%. Which of the following investments has the highest nonsystematic risk?", "opts": ["Investment X", "Investment Y", "Investment Z"], "ans": "C", "expl": "Variance is a measure of risk. A portfolio's total variance is the sum of its systematic variance and its nonsystematic variance. The\nsystematic (market) risk is the portion of a portfolio's risk that cannot be eliminated through diversification. The nonsystematic (company-specific)\nrisk can be eliminated through diversification.\nTo find which of a set of investments has the highest risk, find the nonsystemic risk of each investment and select the choice with the highest\nnumerical value. Rearrange the total variance formula to calculate the nonsystematic variance and use this to rank the investments by\nnonsystematic variance. Note that the variance of each investment is the square of that investment's standard deviation:\nInvestment Z has the highest nonsystematic variance, followed by Investments Y (Choice B) and X (Choice A).\nThings to remember:\nThe total variance of a portfolio is the sum of its systematic variance and its nonsystematic variance. The systematic variance of an investment\ncan be calculated from its beta and expected standard deviation.\nDescribe and demonstrate applications of the CAPM and the SML", "qhtml": null}, {"n": 34, "q": "An analyst collects the following information on a portfolio's performance over the past year: Mean Annual Standard Beta Return Deviation Portfolio 12.0% 40.0% 1.8 Market 7.0% 20.0% Risk-free rate 1.5% The portfolio's M-squared value is closest to:", "opts": ["0.30", "6.75", "7.50"], "ans": "B", "expl": "M-squared (M2) measures portfolio returns in excess of a benchmark (typically the market portfolio) adjusted for the ratio of the total risk of the\nportfolio relative to the total risk of the benchmark. For M-squared, total risk is measured as the standard deviation.\nM-squared is appropriate both for evaluating standalone portfolio performance and for ranking portfolios. If a portfolio's M-squared measure is\nhigher than the market return, then the portfolio achieved a better performance than the market on a total risk-adjusted basis, and vice versa.\nWhen ranking portfolios, the portfolio with the highest M-squared value has outperformed its peers.\nFor this question, the M-squared calculation is as follows:\n20\nM2 = (12.0 − 1.5)( ) + 1.5 = 6.75\n40\n= 5.25 + 1.5 = 6.75\nThe difference between the market return of 7.0% and the portfolio's M-squared value of 6.75 suggests that the portfolio underperformed the\nmarket on a total risk-adjusted basis. Although the portfolio earned an excess return of 10.5%, the risk-adjusted return before adding back the\nrisk-free rate is only 5.25%.\nNote: Many candidates confuse M2 with M2-alpha. Many sources treat them as identical concepts, but the CFA curriculum distinguishes them.\nM2-alpha subtracts the market return from M2; both of these are addressed in the curriculum.\n(Choice A) The result 0.30 represents the Sharpe ratio, which is a component of, but not equivalent to, M-squared. The Sharpe ratio measures\nexcess return per unit of total risk, or standard deviation, but does not adjust this excess return by the ratio of the portfolio standard deviation to\nthe market standard deviation.\nChoice C) The result 7.50 results from using the market return instead of the risk premium to calculate M-squared.\nThings to remember:\nM-squared measures portfolio performance relative to a benchmark, typically the market portfolio, on a total risk-adjusted basis. The measure is\ncalculated by multiplying the excess portfolio return by the ratio of the standard deviation of the market to the standard deviation of the portfolio,\nthen adding back the risk-free rate.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 35, "q": "The security market line is best described as:", "opts": ["the graphical representation of the CAPM.", "relating to only portfolios on the efficient frontier.", "intersecting the y-axis at the market risk premium."], "ans": "A", "expl": "The capital asset pricing model (CAPM) allows investors to estimate a security's expected return given that security's beta, the market's return,\nand the risk-free rate. Beta calculates the security's expected return based on only its systematic risk.\nThe security market line (SML) is the graphical representation of the CAPM, displaying the linear relationship between a security's expected\nreturn (y-axis) and its beta (x-axis). The SML allows investors to identify the relative value of a security. Securities located on the SML are\ndeemed to be fairly valued. In contrast:\nSecurities that plot above the SML are undervalued (ie, greater return than expected for the amount of risk), so the value should rise and the\nexpected return should decrease.\nSecurities that plot below the SML are overvalued (ie, less return than expected for the amount of risk), so the value should fall and the\nexpected return should increase.\n(Choice B) The capital market line relates to only portfolios on the efficient frontier. The SML relates to any security or asset.\n(Choice C) The SML intersects the y-axis at the risk-free rate. The market risk premium is the slope of the SML.\nThings to remember:\nThe capital asset pricing model (CAPM) allows investors to estimate a security's expected return given that security's beta, the market's return,\nand the risk-free rate. The security market line is the graphical representation of the CAPM, displaying the linear relations
