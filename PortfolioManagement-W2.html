hip between a security's\nexpected return and its beta.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 36, "q": "Under the capital asset pricing model, the excess market return is most likely:", "opts": ["less than the market risk premium.", "equal to the market risk premium.", "greater than the market risk premium."], "ans": "B", "expl": "The market risk premium is the additional amount of return above the risk-free rate an investor expects to earn for bearing market risk. Under the\ncapital asset pricing model (CAPM), the market risk premium is the difference between the expected rate of return on the market and the risk-\nfree rate of return.\nCAPM is an equation that calculates a security's expected return. The excess market return is equal to the market risk premium and is part of\nthe CAPM formula. Both are the additional rate of return above the risk-free rate, which market participants expect when owning a risky asset\n(Choices A and C).\nThings to remember:\nThe excess market return and the market risk premium are equal. Both are the difference between the return of the market and the risk-free rate.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 37, "q": "Which of the following has the least impact to a fully diversified portfolio?", "opts": ["A portfolio holding misses its earnings expectations.", "A central bank unexpectedly raises interest rates by 1%.", "A labor report announces unemployment is at record highs."], "ans": "A", "expl": "Systematic vs. nonsystematic risk\nTotal risk = Systematic risk + Nonsystematic risk\nSystematic risk Nonsystematic risk\nAlso known as market risk or Also known as nonmarket risk or firm-\nnondiversifiable risk specific risk\nInherent in the market Specific to firm or industry\nCannot be eliminated by diversification Can be eliminated by diversification\nExamples: interest rate shifts, stock Examples: business litigation,\nmarket crashes cyberattacks\nIndividual risky assets have both systematic risk and nonsystematic risk. Together, they comprise the total risk of an asset. Nonsystematic risk\nis specific to a single company or industry.\nA fully diversified portfolio combines many assets with low correlations to reduce nonsystematic risk and minimize its impacts on the portfolio.\nA portfolio holding that misses its earnings target is an event that impacts a specific company; as a nonsystematic risk, it has the least impact on a\nfully diversified portfolio.\nSystematic risk is the intrinsic risk of the financial system (market risk). Since it is a risk of the financial system, it cannot be avoided by\ndiversifying a portfolio's mix of individual securities. A change in the interest rate or unemployment level are examples of systematic risks that\nwould impact even a fully diversified portfolio (Choices B and C).\nThings to remember:\nSystematic risk plus nonsystematic risk equals total risk. Systematic risk is the intrinsic risk of the financial system and nonsystematic risk is a\ncompany-specific risk. Nonsystematic risk can be avoided by combining assets with low correlations, while systematic risk cannot be eliminated.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 38, "q": "According to the capital asset pricing model, if a security is plotted below the security market line then it would be most appropriate for market participants to:", "opts": ["buy the security since it is undervalued.", "not trade the security since it is mispriced.", "sell the security since its expected return is too low."], "ans": "C", "expl": "The security market line (SML) is a graph of the capital asset pricing model (CAPM). The CAPM is used to estimate a security's expected return\nbased on the security's beta, the market's return, and the risk-free rate. Beta measures the sensitivity of a security's return to the market return.\nFairly valued securities are located on the SML. Undervalued securities are plotted above the SML, and overvalued securities are plotted below\nit.\nIf a security's expected return is too low for its risk level and it is plotted below the SML the security's price is too high relative to its risk: the\nsecurity is overvalued. Rational market participants sell an overvalued security, decreasing its price and increasing its expected return until the\nsecurity is priced fairly and can be plotted on the SML (Choice A).\n(Choice B) Rational market participants take advantage of security mispricing and trade until the security's expected return equals the amount\npredicted by the SML.\nThings to remember:\nSecurities that are valued fairly are located on the security market line (SML). An overvalued security is plotted below the SML and an\nundervalued security is plotted above it. Rational market participants sell overvalued securities and buy undervalued ones. Both actions cause a\nsecurity's expected return to revert to the SML.\nDescribe and demonstrate applications of the CAPM and the SML", "qhtml": null}, {"n": 39, "q": "An analyst collects the following information on a portfolio's performance over the past year: Selected portfolio and market data Mean annual return Standard deviation Beta Portfolio 5.5% 15.0% 0.8 Market 7.0% 20.% Risk-free rate 1.5% The Jensen's alpha of the portfolio is closest to: ", "opts": ["−0.40", "0.27", "1.10"], "ans": "A", "expl": "Jensen's alpha is a risk-adjusted return that measures the difference between a portfolio's actual return and its expected return as predicted\nusing the capital asset pricing model, or CAPM. Since the CAPM estimates expected return based on systematic risk as measured by beta,\nJensen's alpha is a measure of excess systematic risk-adjusted return.\nJensen's alpha is appropriate both for evaluating stand-alone portfolio performance and for ranking portfolios. For example, if Jensen's alpha is\npositive, the portfolio performed better than expected. When portfolios are ranked, the portfolio with the highest Jensen's alpha has outperformed\nits peers on a risk-adjusted basis.\nFor this question, Jensen's alpha is calculated as follows:\nJensen's alpha = 5.5 − [1.5 + 0.8(7.0 − 1.5)] = 5.5 − 5.9 = −0.40\nSince the portfolio produced negative alpha, its actual return was less than its expected return as predicted by the CAPM.\n(Choice B) 0.27 represents the portfolio's Sharpe ratio, which measures excess return per unit of total risk, or standard deviation, not systematic\nrisk, or beta.\n(Choice C) 1.10 incorrectly subtracts the portfolio's expected return from the market return, not from the portfolio's actual return.\nThings to remember:\nJensen's alpha measures excess return as the difference between a portfolio's actual return and expected return as predicted by the capital asset\npricing model. The portfolio with the highest Jensen's alpha outperforms its peers by having the greatest risk-adjusted excess return. On a stand-\nalone basis, if Jensen's alpha is positive, the portfolio has performed better than expected, according to the CAPM.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 40, "q": "According to capital market theory, the market portfolio is most accurately described as including all:", "opts": ["assets.", "risky assets.", "investable assets."], "ans": "B", "expl": "Capital market theory states that the market portfolio includes all risky assets. It is a theoretical portfolio that holds traditional assets such as\nstocks and bonds as well as other assets that may not be tradeable or investable (eg, art, real estate, human capital). The market portfolio ignores\nreal-world constraints and includes these assets. The theoretical market portfolio is not attainable, but a reasonable proxy can be achieved by\nusing a broad global market index.\n(Choices A and C) The market portfolio does not contain the risk-free asset. If the market portfolio included all assets, then it would hold the risk-\nfree asset as well as risky assets. The theoretical market portfolio is based on assets that are on the efficient frontier and the risk-free asset is not\non the efficient frontier.\nThings to remember:\nThe market portfolio holds all risky assets. For exam purposes, discern between the theoretical definition and the real-world application of the\nmarket portfolio (eg, broad global market index).\nExplain the capital allocation line (CAL) and the capital market line (CML)", "qhtml": null}, {"n": 41, "q": "The rationale for combining the risk-free asset with a risky portfolio is that the correlation between the two assets is:", "opts": ["zero.", "positive.", "negative."], "ans": "A", "expl": "The correlation between any asset and the risk-free asset is zero since the standard deviation of the risk-free asset is also zero. Zero\ncorrelation and zero risk lower portfolio standard deviation relative to a portfolio of only risky assets. This can be proven using the following\nformula:\nIf asset a is a risky portfolio and asset b is the risk-free rate, then:\nInvestors who add the risk-free asset to a risky portfolio can obtain the same return at lower risk since the returns of the risk-free asset are not\ncorrelated with the returns of a risky portfolio. The correlation coefficient is zero, so there is no positive or negative relationship (Choices B and\nC).\nThings to remember:\nBy combining risky assets with the risk-free asset, investors can reduce risk without giving up return since the correlation between the two assets\nis zero.\nDescribe the implications of combining a risk-free asset with a portfolio of risky assets", "qhtml": null}, {"n": 42, "q": "When predicting the expected return of a security, the slope coefficient of the market model most likely represents the security's:", "opts": ["beta.", "alpha.", "sigma."], "ans": "A", "expl": "The market model uses market returns to predict the expected return of a single security. The relationship between them is estimated through\nlinear regression. The straight line represents a security's estimated return based on a given market return.\nA security's beta measures the sensitivity of its return relative to the market's return. A security with a beta greater than 1 tends to move in the\nsame direction as the market, but the magnitude of the movement is greater. The slope of the regression line is the individual security's beta.\nNote: The market beta is always 1.\nBeta is the slope coefficient for the independent variable in the market model. For a given market return, a higher beta translates to a higher\nexpected return for the security. A higher expected return is associated with higher risk, so a security's beta indicates its relative riskiness.\n(Choice B) Alpha in the market model represents the portion of the security's return not predicted by the market. It is the y-intercept of the\nregression formula, not the slope coefficient of the market model.\n(Choice C) Sigma is often used to represent the standard deviation of a security's return. Sigma is not part of the market model.\nThings to remember:\nThe market model uses regression analysis to predict a security's return. The slope of the regression line is the beta of the security. A security's\nbeta reflects its riskiness relative to the market.\nExplain return generating models (including the market model) and their uses", "qhtml": null}, {"n": 43, "q": "Investors should not expect additional returns for taking on nonsystematic risk since this risk most likely is:", "opts": ["minimized in a well-diversified portfolio.", "the same for every asset in a given market.", "already included in an asset's systematic risk."], "ans": "A", "expl": "Systematic vs. nonsystematic risk\nTotal risk = Systematic risk + Nonsystematic risk\nSystematic risk Nonsystematic risk\nAlso known as market risk or Also known as nonmarket risk or firm-\nnondiversifiable risk specific risk\nInherent in the market Specific to firm or industry\nCannot be eliminated by diversification Can be eliminated by diversification\nExamples: interest rate shifts, stock Examples: business litigation,\nmarket crashes cyberattacks\nSystematic risk (ie, market risk) is the financial system's inherent risk that affects all securities in a market. It is associated with macroeconomic\nfactors (eg, recessions, interest rates) and cannot be avoided. Nonsystematic risk (ie, firm-specific risk) is the set of specific risks inherent to an\nindividual company or industry.\nSince systematic risk is unavoidable, rational investors expect compensation for taking on this risk. However, nonsystematic risk from any one\nasset can be minimized in a portfolio by adding other, diverse assets. Nonsystematic risk can be minimized to near zero in a well-diversified\nportfolio, so investors should not expect additional return for accepting it.\n(Choice B) Nonsystematic risk is unique to each company or industry and therefore not shared by every asset in a given market.\n(Choice C) Nonsystematic risk is not included in an asset's systematic risk.\nThings to remember:\nNonsystematic risk is a set of specific risks inherent to an individual company or industry. Rational investors expect compensation for taking on\nsystematic risk. Nonsystematic risk can be minimized to near zero in a well-diversified portfolio, so investors should not expect additional returns\nfor accepting this risk.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 44, "q": "An analyst believes the expected return of the market is −5.0%; while the risk-free rate is 2.0% and a security's beta is 1.2. According to the capital asset pricing model, the security's expected return is closest to: ", "opts": ["−6.4%", "−6.0%", "−1.6%"], "ans": "A", "expl": "The capital asset pricing model (CAPM) estimates a security's expected return based on the security's beta, the market's return, and the\nrisk-free rate. Beta is a measure of a security's sensitivity to market returns. Regardless of the direction of the market (positive or negative), if a\nsecurity's beta is greater than the market's beta of 1, then it amplifies the market return in the same way.\nHere, the market's return is negative and the security's beta is greater than one, so the security's expected return is less than the market's\nreturn. Calculate the security's expected return using the CAPM formula:\n(Choice B) −6.0% results from multiplying beta by the negative market return only (1.2 × −5.0%) instead of multiplying beta by the market risk\npremium (the market's return minus the risk-free rate) and then adding the risk-free rate.\n(Choice C) −1.6% is the expected return found by mistakenly adding the risk-free rate—not subtracting it—when determining the market risk\npremium. This results in higher (less negative) expected return.\nThings to remember:\nThe capital asset pricing model uses beta to estimate the expected return of a security based on the market's return. When the market's expected\nreturn is negative, a security with a beta greater than the market's beta of 1 will have a lower expected return than the market's return.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 45, "q": "A portfolio has the following performance over the past three years: Year 20X1 20X2 20X3 Portfolio return 10.0% 13.0% 19.0% Market return 7.0% US Treasury bill return 3.0% Standard deviation of portfolio returns 4.6% The Sharpe ratio over the three-year period is closest to:", "opts": ["1.5", "2.4", "3.1"], "ans": "B", "expl": "The Sharpe ratio evaluates portfolio performance on a risk-adjusted basis. It measures excess return per unit of total risk. Excess return is\ndefined as the difference between the mean return of a risky portfolio and the return of a risk-free investment (eg, US Treasury bill, or T-bill).\nTotal risk is measured by the standard deviation of returns and captures both systematic (market) and nonsystematic (nonmarket) risk.\nIt is important to adjust return for risk since investors require additional return for taking on more risk.\nNote: In this scenario, the geometric mean return is appropriate as the Sharpe ratio is calculated based on historical returns and not on expected\nreturn (which would use the arithmetic mean return).\n(Choice A) The excess return is incorrectly calculated using the average market return instead of the average Treasury note rate (risk-free\nreturn).\n(Choice C) This response results from dividing the average portfolio return, instead of the excess return, by the standard deviation.\nThings to remember:\nThe Sharpe ratio measures excess return per unit of total risk (measured by standard deviation).\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 46, "q": "Which of the following performance measures most likely ignores nonsystematic risk?", "opts": ["M-squared", "Sharpe ratio", "Jensen's alpha"], "ans": "C", "expl": "Examining a manager's return is only one part of a manager's performance evaluation. Another part is determining how much risk the manager\ntook to earn that return. In portfolio management, risk is quantified as either systematic risk (beta) or total risk (standard deviation).\nJensen's alpha and the Treynor ratio are two performance measures that use beta as a measure of risk. Here, Jensen's alpha is the only\nperformance measure that uses beta (systematic risk) and ignores nonsystematic risk. Jensen's alpha is the difference between an asset's\nactual return and an asset's return as predicted by the CAPM. If it is positive, then the manager has outperformed by having a greater return\nthan its expected risk-adjusted return and vice versa.\n(Choice A) M-squared is a performance measure based on total risk (standard deviation), not systematic risk (beta). It is a risk-adjusted\nperformance measure, which determines how the portfolio performed relative to the market.\n(Choice B) The Sharpe ratio measures excess return relative to the portfolio's total risk (standard deviation), of returns, not beta.\nThings to remember:\nJensen's alpha and the Treynor ratio are two performance measures based on beta. M-squared and the Sharpe ratio are based on standard\ndeviation (total risk). If Jensen's alpha is positive, then the manager has exceeded expectations on a risk-adjusted basis.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 47, "q": "A fund manager collects the following data for the firm's three top-performing portfolios over the past seven years. Correlation Between Return Standard Portfolio and the (%) Deviation (%) Market Portfolio X 21 41 0.7 Portfolio Y 19 35 0.6 Portfolio Z 16 27 0.6 Market 10 17 Risk-free rate 3 Which portfolio has the highest Jensen's alpha?", "opts": ["Portfolio X", "Portfolio Y", "Portfolio Z"], "ans": "B", "expl": "Jensen's alpha is a risk-adjusted return that measures a portfolio's actual return minus its expected (predicted) return. Jensen's alpha uses beta\nto adjust for market, or systematic, risk; a higher beta means a higher expected return. If Jensen's alpha is positive, then the portfolio has\nperformed better than expected. On a risk-adjusted basis, the portfolio with the highest Jensen's alpha has outperformed its peers.\nIn the question, beta needs to be calculated before solving for Jensen's alpha.\nβ\nInput the values into the beta equation to calculate p for each portfolio:\nβ\nInput p and the other values from the question to solve for Jensen's alpha:\nPortfolio Y has the highest Jensen's alpha and therefore the highest risk-adjusted return.\n(Choice A) Portfolio X has a Jensen's alpha of 6.18%, which is less than that of Portfolio Y.\n(Choice C) Portfolio Z has a Jensen's alpha of 6.33%, which is less than that of Portfolio Y.\nThings to remember:\nJensen's alpha measures the percent return relative to the expected return. A higher Jensen's alpha is preferable.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 48, "q": "A manager converts a portfolio's excess return to match the market's risk and then compares it with the market's excess return. The manager is most likely calculating which of the following performance measures? ", "opts": ["M-squared", "Sharpe ratio", "Jensen's alpha"], "ans": "A", "expl": "Examining a portfolio's return is only one part of evaluating a portfolio's performance. Another part is determining how much risk it took to earn\nthat return. This is accomplished by calculating a risk-adjusted return. In portfolio management, the return is adjusted for risk by using either\nsystematic risk (beta) or total risk (standard deviation).\nM-squared uses standard deviation to measure the total risk-adjusted return of a portfolio. It is the difference between a portfolio's hypothetical\nmarket-risk-adjusted excess return and the excess return of the market. This hypothetical risk-adjusted return is found by calculating the\nportfolio's return using the market's risk. If M-squared is positive, then the portfolio's risk-adjusted performance is better than that of the market.\n(Choice B) The Sharpe ratio is a performance measure that determines a market premium (a security's level of return above the risk-free rate)\nper unit of total risk (standard deviation). The Sharpe ratio is not the difference between two returns, but rather scales return per unit of risk.\n(Choice C) Jensen's alpha measures the systematic-risk-adjusted excess return of a portfolio using beta, not standard deviation. It is used to\ncalculate the difference between the actual return and the return predicted by the capital asset pricing model. A positive Jensen's alpha shows\nthat the portfolio has outperformed the market on this risk-adjusted basis.\nThings to remember:\nM-squared uses standard deviation to measure the total risk-adjusted return of a portfolio. It is the difference between a portfolio's hypothetical\nmarket-risk-adjusted excess return and the excess return of the market. Portfolios that yield a positive M-squared perform better than the market\non a risk-adjusted basis.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 49, "q": "An analyst gathers the following information on a fully diversified portfolio's performance over the past year: Selected portfolio and market data Mean annual return Standard deviation Beta Portfolio 8.0% 35.0% 1.5 Market 7.0% 25.0% Risk-free rate 1.0% Based on this information, the Treynor ratio for the portfolio is closest to:", "opts": ["0.020", "0.047", "0.060"], "ans": "B", "expl": "Analyzing a portfolio's return is only one part of performance evaluation; another is determining how much risk the manager took to earn the\nreturn. In portfolio management, risk is quantified as either systematic risk (as measured by beta) or total risk (as measured by standard\ndeviation). In theory, fully diversified portfolios have only systematic (ie, market, non-diversifiable) risk.\nThe Treynor ratio measures excess return relative to systematic risk and is therefore appropriate for a fully diversified portfolio. When calculating\nthe Treynor ratio, excess return is the difference between the portfolio's average return and the average return of a risk-free asset (eg, US\nTreasury bill, or T-bill), and systematic risk is measured by beta. In this scenario, the relevant data used to calculate the Treynor ratio are the\nmean annual portfolio return of 8.0%, the mean annual risk-free rate of 1.0%, and beta of 1.5:\n0.08 − 0.01\nTreynor ratio = ≈ 0.047\n1.5\nThis result suggests the portfolio's excess return was 4.7 times its systematic risk. The Treynor ratio is best used as a measure to compare the\nperformance of two or more portfolios.\n(Choice A) 0.02 represents the Sharpe ratio, which measures excess return per unit of total risk (ie, standard deviation).\n(Choice C) 0.06 represents the portfolio's M-squared measure, which evaluates portfolio return by adjusting the total risk of the portfolio\ncompared to a benchmark (typically the market).\nThings to remember:\nThe Treynor ratio measures excess return relative to systematic risk, as measured by beta.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 50, "q": "Under capital market theory, the best explanation for why investors eliminate nonsystematic risk is that the price of nonsystematic risk is:", "opts": ["zero.", "positive.", "the expected return of an asset."], "ans": "A", "expl": "Systematic vs. nonsystematic risk\nTotal risk = Systematic risk + Nonsystematic risk\nSystematic risk Nonsystematic risk\nAlso known as market risk or Also known as nonmarket risk or firm-\nnondiversifiable risk specific risk\nInherent in the market Specific to firm or industry\nCannot be eliminated by diversification Can be eliminated by diversification\nExamples: interest rate shifts, stock Examples: business litigation,\nmarket crashes cyberattacks\nRational investors will not assume risk without being paid. While the total risk of individual risky assets is the systematic risk and nonsystematic\nrisk, the total risk of a fully diversified portfolio contains only systematic risk. Investors expect to be compensated for assuming systematic risk;\nthis compensation equals the asset's expected return. This is the same as stating that compensation is the price of risk.\nNonsystematic risk can be eliminated through diversification. Since investors can diversify that risk away, they will not be compensated for\nassuming it. Not being compensated is the equivalent to a price of nonsystematic risk being zero.\n(Choice B) Since investors can eliminate nonsystematic risk, the price of nonsystematic risk is zero, not positive.\n(Choice C) The price of systematic risk, not nonsystematic risk, is the expected return of the asset. It cannot be avoided, but investors are paid\nfor bearing it.\nThings to remember:\nThe price of risk (eg, what investors are paid for bearing risk) is an asset's expected return. Individual securities have systematic risk and\nnonsystematic risk. Fully diversified portfolios have only systematic risk. Since nonsystematic risk can be eliminated through diversification,\ninvestors are not compensated for bearing it, so its price is zero.\nExplain systematic and nonsystematic risk, including why an investor should not expect to receive additional return for bearing nonsystematic risk", "qhtml": null}, {"n": 51, "q": "The market has priced a security to have an expected return of 9.0%. The security's beta is 0.9, the risk-free rate is 2.5%, and the market's expected return is 7.5%. According to the capital asset pricing model (CAPM), the difference in expected return due to its mispricing is closest to:", "opts": ["0.65%", "2.00%", "4.50%"], "ans": "B", "expl": "The security market line (SML) is a graph of the capital asset pricing model (CAPM). The CAPM is used to estimate a security's expected return\nbased on the security's beta, the market's return, and the risk-free rate. Beta measures the sensitivity of a security's return relative to the market\nreturn. Fairly valued securities are located on the SML. Undervalued securities are plotted above the SML and overvalued securities are plotted\nbelow it.\nIf an asset's expected return is too high for its risk level, then its price is too low relative to its risk. The asset is undervalued and is plotted above\nthe SML. Rational investors buy this undervalued asset, increasing its price and decreasing its expected return until the security is priced fairly so\nthat it is plotted on the SML.\nUse the CAPM to determine the expected return of the security:\nHere, the difference between the expected return based on the security's market price and the expected return of the security using the CAPM is\n2.0% (0.09 − 0.07 = 0.02).\nThings to remember:\nSecurities that are valued fairly are located on the security market line (SML). An undervalued security plots above the SML and an overvalued\nsecurity plots below it. Rational market participants buy undervalued securities and sell overvalued ones. Both actions cause a mispriced\nsecurity's expected return to revert to the SML.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)\n52. Which of the following statements best describes the Sharpe ratio?\nA. It measures return without considering a portfolio's risk.\n\nB. It indicates the performance of an investment on a risk-adjusted basis.\nC. It is most appropriate for those portfolios that have only systematic risk.\nExplanation\nThe Sharpe ratio is a performance measure that determines a portfolio's excess return (the amount of return above the risk-free rate) per unit of\ntotal risk. For example, if the portfolio's return is 24%, the risk-free rate is 4%, and the total risk (standard deviation) of the portfolio is 20%, then its\nSharpe ratio is 1.00, or (0.24 – 0.04)/0.20. This means that the portfolio earned 1.00 unit of excess return per each unit of total risk.\nA useful application of the Sharpe ratio is to rank portfolios. The portfolio with the highest Sharpe ratio has earned more return per unit of risk.\nRational investors prefer portfolios with the highest Sharpe ratios.\n(Choice A) The Sharpe ratio measures a portfolio's risk-adjusted return. It scales a portfolio's excess return by its total risk (standard deviation).\n(Choice C) The Sharpe ratio is based on total risk. Total risk is the sum of systematic risk and nonsystematic risk. This performance measure\nwould be inappropriate for a portfolio that has only systematic risk.\nThings to remember:\nThe Sharpe ratio expresses a portfolio's excess return on a per-unit-of-total-risk basis. A useful application of the Sharpe ratio is to rank portfolios\nfrom highest (most preferred) to lowest (least preferred) since rational investors prefer portfolios that have the highest Sharpe ratios.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 52, "q": "Which of the following statements best describes the Sharpe ratio?", "opts": ["It measures return without considering a portfolio's risk.", "It indicates the performance of an investment on a risk-adjusted basis.", "It is most appropriate for those portfolios that have only systematic risk."], "ans": "B", "expl": "The Sharpe ratio is a performance measure that determines a portfolio's excess return (the amount of return above the risk-free rate) per unit of\ntotal risk. For example, if the portfolio's return is 24%, the risk-free rate is 4%, and the total risk (standard deviation) of the portfolio is 20%, then its\nSharpe ratio is 1.00, or (0.24 – 0.04)/0.20. This means that the portfolio earned 1.00 unit of excess return per each unit of total risk.\nA useful application of the Sharpe ratio is to rank portfolios. The portfolio with the highest Sharpe ratio has earned more return per unit of risk.\nRational investors prefer portfolios with the highest Sharpe ratios.\n(Choice A) The Sharpe ratio measures a portfolio's risk-adjusted return. It scales a portfolio's excess return by its total risk (standard deviation).\n(Choice C) The Sharpe ratio is based on total risk. Total risk is the sum of systematic risk and nonsystematic risk. This performance measure\nwould be inappropriate for a portfolio that has only systematic risk.\nThings to remember:\nThe Sharpe ratio expresses a portfolio's excess return on a per-unit-of-total-risk basis. A useful application of the Sharpe ratio is to rank portfolios\nfrom highest (most preferred) to lowest (least preferred) since rational investors prefer portfolios that have the highest Sharpe ratios.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 53, "q": "An advisor is evaluating an equity portfolio's risk-adjusted return for last year. It is most appropriate for the advisor to use the Sharpe ratio, rather than the Treynor ratio, if:", "opts": ["last year's excess return is negative.", "the investor's portfolio is not fully diversified.", "the advisor is considering only systematic risk."], "ans": "B", "expl": "Comparisons using Sharpe ratio vs. Treynor ratio\nUse Sharpe ratio when… Use Treynor ratio when:\nInvestor owns no assets other than the Beta of asset (or portfolio) is positive\nportfolio being evaluated Risk metric is systematic risk\nRisk metric is total risk (measured by (measured by beta)\nstandard deviation) The assets make up only part of\nInvestor's assets are not fully diversified investor's overall holdings\nThe Sharpe and Treynor ratios both measure risk-adjusted returns to evaluate an investment's excess return relative to its risk. The ratios'\nnumerators are identical. However, the Sharpe ratio's denominator is total risk—the sum of systematic (ie, non-diversifiable) and nonsystematic\nrisk—while the Treynor ratio's denominator is only systematic risk.\nInvestors are compensated only for assuming systematic risk (measured by beta) since nonsystematic risk can be eliminated through\ndiversification. A portfolio that is not fully diversified (as in this scenario) will be exposed to total risk (measured by standard deviation). Since the\nSharpe ratio evaluates excess return relative to total risk, it is the appropriate ratio to assess the risk-adjusted return of a non-diversified (or less\nthan fully diversified) portfolio.\n(Choice A) To be meaningful, both ratios require a positive numerator. The greatest ratios represent the best risk-adjusted returns. However, a\nnegative numerator will generate a less negative ratio for a riskier portfolio, so the rankings will be incorrect.\n(Choice C) An advisor concerned with evaluating risk-adjusted returns based solely on systematic risk would most appropriately use the Treynor\nratio, not the Sharpe ratio. The Treynor ratio evaluates excess return relative to beta, which is a measure of only systematic risk.\nThings to remember:\nThe Sharpe and Treynor ratios are risk-adjusted measures of excess return on investments. The Sharpe ratio evaluates excess return relative to\ntotal risk, while the Treynor ratio evaluates excess return relative to systematic risk. The Sharpe ratio is more appropriate when the investment\nbeing evaluated is less than fully diversified and therefore exposed to both systematic and unsystematic risk.\nCalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen’s alpha", "qhtml": null}, {"n": 54, "q": "According to the capital asset pricing model (CAPM), if the market's expected risk premium is positive and an asset's beta is negative, the asset's expected return is most likely: ", "opts": ["less than the risk-free rate.", "equal to the risk-free rate.", "greater than the risk-free rate."], "ans": "A", "expl": "Beta measures the sensitivity of a security's return relative to the market's return. According to the CAPM, a security whose beta is negative\ntends to have expected returns that go down when the market's return goes up. Its expected return is less than the risk-free rate. A security\nwith a negative beta does not guarantee a negative return; its expected return could be positive (less than risk-free rate but greater than zero) or\nnegative.\nAccording to the CAPM, an asset's expected return is the sum of the risk-free rate and the product of the market's risk premium and beta. If the\nmarket risk premium is positive and the asset's beta is negative, the resulting product is negative. Reducing the risk-free rate by this (negative)\nresult indicates that the expected return is less than the risk-free rate.\nA security with a negative beta may be useful in diversifying a portfolio (ie, a defensive investment), but it individually underperforms in a rising\nmarket. This creates an opportunity cost (not investing in higher beta securities), and its return may not keep pace with inflation over the long-\nterm.\n(Choice B) If a security's beta is equal to zero, its expected return is the risk-free rate.\n(Choice C) If a security's beta is positive, its expected return will be greater than the risk-free rate.\nThings to remember:\nIf a security's beta is negative, its expected return is less than the risk-free rate. The expected return can be positive or negative. A security with a\nnegative beta can diversify a portfolio but may also create opportunity cost in a rising market and may not generate returns that keep pace with\ninflation over the long-term.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}, {"n": 55, "q": "The following information is collected for three investments: Correlation Expected Expected between Investment standard return (%) investment deviation (%) and the market A 9 17 0.9 B 10 14 1.0 C 13 18 0.8 Market 8 15 1.0 Which investment has the highest market risk? ", "opts": ["A", "B", "C"], "ans": "A", "expl": "Beta is a measure of market risk (systematic risk). It is a function of the security's standard deviation, the market's standard deviation, and the\ncorrelation between the two. It measures the sensitivity of a security's return relative to the market's return. The market has a beta of 1. A\nsecurity with a beta higher than 1 tends to move in the same direction as the market, but the magnitude of the movement is greater.\nIndividual securities have systematic risk and nonsystematic risk. Fully diversified portfolios have only systematic risk since diversification\neliminates nonsystematic risk. For a given market return, a higher beta translates to a higher expected return for the security. A higher expected\nreturn is associated with higher risk, so a security's beta indicates its relative riskiness.\nSince beta is a measure of market risk, the security with the highest market risk is the one with the highest beta. Use the formula for beta to\ndetermine each investment's systematic risk:\n(Choices B and C) Investments B and C each have lower betas than Investment A, so those investments' market risks are lower than Investment\nA's market risk.\nThings to remember:\nBeta is a measure of market (ie, systematic) risk. It is a function of the security's standard deviation, the market's standard deviation, and the\ncorrelation between the two.\nCalculate and interpret beta\n56. Which of the following is an assumption of the capital asset pricing model (CAPM)?\nA. Investors use different estimates to value assets.\nB. Analysts independently appraise a company's price.\n C. Market participants use the same economic expectations.\nExplanation\nCAPM assumptions\nInvestors are compensated for taking risk\nInvestors are risk-averse and rational\nRational investors always want more wealth\nVolume does not impact a security's price\nFrictionless markets No costs, taxes, or restrictions on short selling\nBorrowing and lending at the risk-free rate exist\nSame holding period All investors use an undefined one-period term\nInvestors have identical economic expectations\nHomogeneous expectations\nOnly one optimal risky portfolio may exist\nInvestments are infinitely divisible The size of the investment does not alter results\nInvestors are price takers Large investors cannot influence the prices of securities\nMarket participants analyze a security to determine its current intrinsic value. Homogeneity in investor expectations, one assumption of the\ncapital asset pricing model (CAPM), suggests that all market participants use identical economic expectations to determine an asset's value.\nSince all investors are presumed to have the same expectations, there can be only one optimal risky portfolio. Although inconsistent with\nobserved investor behavior, this assumption is necessary to create a portfolio that has the same consensus expectation.\n(Choice A) Homogeneity in investor expectations presumes that investors use the same, not different, estimates to value assets. If they used\ndifferent economic estimates, then assets would have more than one expected return.\n(Choice B) The CAPM assumes homogeneity in investor expectations. Theoretically, all market participants come to the same conclusions since\nthey all have the same economic expectations.\nThings to remember:\nHomogeneity in investor expectations means all investors make the same economic forecasts and come to the same conclusions. This implies\nthat only one optimal risky portfolio exists. If this assumption were relaxed, then multiple, conflicting expected returns would exist.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 56, "q": "Which of the following is an assumption of the capital asset pricing model (CAPM)?", "opts": ["Investors use different estimates to value assets.", "Analysts independently appraise a company's price.", "Market participants use the same economic expectations."], "ans": "C", "expl": "CAPM assumptions\nInvestors are compensated for taking risk\nInvestors are risk-averse and rational\nRational investors always want more wealth\nVolume does not impact a security's price\nFrictionless markets No costs, taxes, or restrictions on short selling\nBorrowing and lending at the risk-free rate exist\nSame holding period All investors use an undefined one-period term\nInvestors have identical economic expectations\nHomogeneous expectations\nOnly one optimal risky portfolio may exist\nInvestments are infinitely divisible The size of the investment does not alter results\nInvestors are price takers Large investors cannot influence the prices of securities\nMarket participants analyze a security to determine its current intrinsic value. Homogeneity in investor expectations, one assumption of the\ncapital asset pricing model (CAPM), suggests that all market participants use identical economic expectations to determine an asset's value.\nSince all investors are presumed to have the same expectations, there can be only one optimal risky portfolio. Although inconsistent with\nobserved investor behavior, this assumption is necessary to create a portfolio that has the same consensus expectation.\n(Choice A) Homogeneity in investor expectations presumes that investors use the same, not different, estimates to value assets. If they used\ndifferent economic estimates, then assets would have more than one expected return.\n(Choice B) The CAPM assumes homogeneity in investor expectations. Theoretically, all market participants come to the same conclusions since\nthey all have the same economic expectations.\nThings to remember:\nHomogeneity in investor expectations means all investors make the same economic forecasts and come to the same conclusions. This implies\nthat only one optimal risky portfolio exists. If this assumption were relaxed, then multiple, conflicting expected returns would exist.\nExplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)", "qhtml": null}, {"n": 57, "q": "When estimating expected return, which of the following statements most accurately describes the alpha coefficient in the market model?", "opts": ["Alpha is the intercept term of the market model.", "A security's systematic risk is expressed as alpha.", "Alpha is the best estimate of a security's market return."], "ans": "A", "expl": "The market model uses market returns to predict the expected return of a single security. The relationship between the market return and\nsecurity's expected return is estimated through linear regression. The regression line represents an estimate for a security's return based on a\ngiven market return.\nAlpha (y-intercept) is where the market model's regression line intersects the y-axis. It represents an estimate of the security's return if the\nmarket return is zero.\nThe security's beta measures the sensitivity of a security's return relative to the market's return. Note: The market always has a beta of 1. A\nsecurity with a beta higher than 1 tends to move in the same direction as the market, but the magnitude of the movement is greater.\nThe slope of the regression line is the individual security's beta. For a given market return, a higher beta translates to a higher expected return\nfor a security. A higher expected return is associated with higher risk, so a security's beta indicates its relative riskiness.\n(Choice B) In the market model, a security's systematic risk (market risk) is expressed as beta, not alpha. Beta is a measure of sensitivity of a\nsecurity's return to the market's return.\n(Choice C) The best estimate of a security's market return is the result of applying the complete market model formula, not just alpha. Alpha\nrepresents the portion of a security's return not explained by the market.\nThings to remember:\nUsing the market model, investors estimate a security's beta (the slope coefficient) and alpha (the y-intercept) to determine the expected return of\nthe security based on the return of the market.\nExplain return generating models (including the market model) and their uses", "qhtml": null}, {"n": 58, "q": "A manager collects the following data: Expected Standard Investment Beta Deviation (%) 1 0.8 20 2 0.9 22 3 1.0 17 If the risk-free rate is 3.5% and the market risk premium is positive, which investment has the lowest expected return according to the capital asset pricing model? ", "opts": ["Investment 1", "Investment 2", "Investment 3"], "ans": "A", "expl": "The capital asset pricing model determines the expected return for a security based on the security's beta, the market return, and the risk-free\nrate. In this question, it is not possible to calculate the investments' expected returns since the expected return of the market is unknown but is\nconstant and applicable to all securities equally. However, beta can be used to determine the relative return among investments, so it is possible\nto find which investment has the lowest expected return.\nBeta measures the sensitivity of a security's expected return relative to the expected market return. A security with the lowest beta has the\nleast sensitivity to market risk and, given the direct relationship between risk and return, the lowest expected return. Investment 1 has the lowest\nexpected return since it has the lowest beta (Choices B and C).\nThings to remember:\nUnder the capital asset pricing model, a security's beta helps determine its expected return. Given a positive expected return, a low beta means a\nlow expected return on a security.\nCalculate and interpret the expected return of an asset using the CAPM", "qhtml": null}];
const CFG = {"title": "Wiley · Portfolio Risk And Return Part II", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Portfolio Management · 58 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
