<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
  /* two-column question table */
  .q-cols-header{display:flex;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .q-cols-header span{flex:1;text-align:center;padding:9px 14px;font-weight:700;
    color:var(--accent2);font-size:13.5px;background:var(--panel2)}
  .q-cols-header span+span{border-left:1px solid var(--line)}
  .opt[data-cols="2"]{display:flex;align-items:stretch;padding:0;overflow:hidden;gap:0}
  .opt[data-cols="2"] .lead{display:flex;align-items:center;padding:10px 12px;
    border-right:1px solid var(--line);white-space:nowrap}
  .opt[data-cols="2"] .opt-col{flex:1;padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.4}
  .opt[data-cols="2"] .opt-col+.opt-col{border-left:1px solid var(--line)}
  html[data-theme="light"] .q-cols-header{border-color:var(--line)}
  html[data-theme="light"] .q-cols-header span{background:var(--panel2)}
  html[data-theme="light"] .opt[data-cols="2"] .lead,
  html[data-theme="light"] .opt[data-cols="2"] .opt-col{border-color:var(--line)}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a central bank implements an exchange rate targeting policy successfully, the country's\ninflation rate is most likely to be:", "opts": ["less than that of the target currency.", "the same as that of the target currency.", "greater than that of the target currency."], "ans": "B", "expl": "Successful exchange rate targeting should result in the same inflation rate in the targeting\ncountry as in the country of the target currency.\n(Module 15.2, LOS 15.c)"}, {"n": 2, "q": "Which one of the following Federal Reserve monetary policies, when pursued in line with the\nU.S. government's fiscal policies, would help increase aggregate demand during a period of\nhigh unemployment?", "opts": ["A decrease in the discount rate.", "The sale of bonds by the Fed.", "An increase in the reserve requirements for financial institutions."], "ans": "A", "expl": "A decrease in the Fed's lending rate is a monetary tool that the Fed can use to increase the\nmoney supply, thereby increasing aggregate demand during recessionary times when\nthere is high unemployment. An increase in the reserve requirements and the sale of\nbonds by the Fed would all be restrictive monetary policies that would reduce the amount\nof money in the economy and reduce aggregate demand.\n(Module 15.2, LOS 15.d)"}, {"n": 3, "q": "Which of the following policy combinations would most likely lead to private sector growth\nand a decreasing government share of GDP?", "opts": ["Contractionary fiscal policy and contractionary monetary policy.", "Expansionary fiscal policy and contractionary monetary policy.", "Contractionary fiscal policy and expansionary monetary policy."], "ans": "C", "expl": "Contractionary fiscal policy combined with expansionary monetary policy is more likely to\nincrease private sector growth and decrease the government share of GDP than the other\npolicy combinations.\n(Module 15.2, LOS 15.d)"}, {"n": 4, "q": "A central bank has operational independence if it can independently determine:", "opts": ["the horizon over which to achieve its inflation target.", "the policy rate.", "how inflation is calculated."], "ans": "B", "expl": "A central bank is said to have operational independence if it has the authority to\ndetermine the policy rate independently. Determining how inflation is calculated and the\ntime horizon for achieving its target rate of inflation refer to a central bank that has target\nindependence.\n(Module 15.2, LOS 15.c)"}, {"n": 5, "q": "If the U.S. Federal Reserve decides to decrease the money supply, which of the following is\nmost likely to occur in the short run?", "opts": ["An increase in the velocity of money similar to decrease in the money supply.", "A decrease in the unemployment rate.", "An increase in the real rate of interest."], "ans": "C", "expl": "If the U.S. Federal Reserve decreases the money supply, an increase in nominal and real\ninterest rates will occur. Higher real rates will cause businesses to invest less, which will\ncause the unemployment rate to increase. Furthermore, households will decrease\npurchases of durable goods, automobiles, and other items that are typically financed at\nshort-term rates. This will decrease aggregate demand. The decrease in aggregate demand\nand expenditures will cause incomes to go down, which further decreases consumption\nand investment. Moreover, this decrease in aggregate demand will decrease real GDP and\nthe price level in the short run and the long run.\n(Module 15.1, LOS 15.b)"}, {"n": 6, "q": "A central bank follows an inflation targeting monetary policy. If the permissible band is plus-\nor-minus 2% around the target inflation rate, the central bank is most likely to choose a\ntarget inflation rate of:", "opts": ["0%.", "1%.", "3%."], "ans": "C", "expl": "Because they consider deflation to be disruptive to an economy, central banks typically\nchoose inflation targets and bands that do not include a negative rate of inflation.\n(Module 15.2, LOS 15.c)"}, {"n": 7, "q": "When the Federal Reserve sells government securities on the open market, bank reserves\nare:", "opts": ["decreased, which reduces the amount of money banks are able to lend, causing a decrease in the federal funds rate.", "decreased, which reduces the amount of money banks are able to lend, causing an increase in the federal funds rate.", "increased, which increases the amount of money banks are able to lend, causing a decrease in the federal funds rate."], "ans": "B", "expl": "When the Federal Reserve wants to increase the federal funds rate through open market\noperations, it sells government securities. Open-market sales reduce bank reserves and\ncause the federal funds rate to increase.\n(Module 15.1, LOS 15.b)"}, {"n": 8, "q": "Which of the following fiscal and monetary policy scenarios is most likely to increase the size\nof the public sector relative to the private sector?", "opts": ["Contractionary fiscal and monetary policy.", "Expansionary fiscal policy and contractionary monetary policy.", "Expansionary monetary policy and contractionary fiscal policy."], "ans": "B", "expl": "Expansionary fiscal policy tends to expand the public sector. Contractionary monetary\npolicy tends to contract the private sector.\n(Module 15.2, LOS 15.d)"}, {"n": 9, "q": "Which of the following is currently the most-used target for central banks?", "opts": ["Money supply targeting.", "Interest rate targeting.", "Inflation targeting."], "ans": "C", "expl": "Inflation targeting is the most-used tool of central banks for making monetary policy\ndecisions.\n(Module 15.2, LOS 15.c)"}, {"n": 10, "q": "Silvano Jimenez, an analyst at Banco del Rey, is reviewing recent actions taken by the U.S.\nFederal Reserve (the Fed) in setting monetary policy. Recently, the Fed decided to increase\nthe money supply, which has resulted in a decrease in real interest rates. At a staff meeting,\nJimenez brings this matter to the attention of his colleagues and makes the following\nstatements:\nStatement 1: Although the money supply increase has led to a decrease in real interest rates,\nwe should begin to see U.S. investors decrease their investments abroad and the U.S. dollar\nwill appreciate in the foreign exchange market.\nStatement 2: The Fed's increase in the money supply will increase the amount of imports\ninto the U.S.\nAre Statement 1 and Statement 2 as made by Jimenez CORRECT?", "opts": ["Incorrect | Correct", "Incorrect | Incorrect", "Correct | Incorrect"], "ans": "B", "expl": "If the Fed increases the money supply and real interest rates decline, U.S. investors will\nseek higher real rates of return abroad and the U.S. dollar will depreciate as the dollar will\nbe exchanged for foreign currencies in order to buy the foreign investments. Likewise, the\ndecrease in real interest rates will reduce the inflow of funds from abroad as foreign\ninvestors seek higher rates of return outside the U.S. With a dollar that has depreciated,\nU.S. exports should increase, as U.S. products will become cheaper for foreign buyers. As\nsuch, both statements are incorrect.\n(Module 15.1, LOS 15.b)", "cols": ["Statement 1", "Statement 2"]}, {"n": 11, "q": "Central banks that are able to define how inflation is computed and determine its desired\nlevel are best described as having:", "opts": ["operational independence.", "target independence.", "transparency."], "ans": "B", "expl": "Target independence means the central bank defines how inflation is computed, sets the\ntarget inflation level, and determines the horizon over which the target is to be achieved.\nCentral banks that have operational independence are allowed to determine the policy\nrate. Transparency refers to the degree to which central banks report to the public on the\nstate of the economic environment and is one of the three essential qualities of an\neffective central bank.\n(Module 15.2, LOS 15.c)"}, {"n": 12, "q": "Which of the following statements regarding U.S. Federal Reserve open market operations is\nleast accurate?", "opts": ["If the Fed wants to stimulate the economy, it will sell Treasury securities to banks.", "When the Fed buys Treasury securities, short-term interest rates will generally decrease.", "When the Fed sells Treasury securities, excess reserves decrease."], "ans": "A", "expl": "If the Fed intends to stimulate the economy, they will buy, not sell, Treasury securities.\nBuying Treasury securities injects reserves into the banking system.\n(Module 15.1, LOS 15.b)"}, {"n": 13, "q": "An analyst has determined the projected trend rate of real GDP growth is 2.5% and the\ncentral bank's inflation target is 2.5%. If the central bank policy rate is 5.0%, monetary policy\nis most likely:", "opts": ["expansionary.", "neutral.", "contractionary."], "ans": "B", "expl": "The neutral rate of interest is real trend rate of economic growth plus the inflation target.\nIn this example, the neutral rate = 2.5% + 2.5% = 5.0%. Because the policy rate is the same\nas the neutral rate of interest, monetary policy is neither contractionary nor expansionary.\n(Module 15.2, LOS 15.c)"}, {"n": 14, "q": "An economy's long-term trend rate of real GDP growth is 3% and the central bank's target\ninflation rate is 2%. If the policy rate is 6%, monetary policy is:", "opts": ["contractionary.", "expansionary.", "neutral."], "ans": "A", "expl": "Monetary policy is contractionary when the policy rate is greater than the neutral rate,\nwhich is the sum of the real trend rate of economic growth and the target rate of inflation.\nHere, the neutral rate is 3% + 2% = 5% and the policy rate of 6% is greater than the neutral\nrate. Monetary policy is expansionary when the policy rate is less than the neutral interest\nrate.\n(Module 15.2, LOS 15.c)"}, {"n": 15, "q": "If a country's economy is growing at an unsustainably rapid rate and the central bank\ndecreases its target overnight interest rate, the country's:", "opts": ["expected rate of inflation is likely to decline.", "inflation rate is likely to increase.", "long-term rate of economic growth will increase."], "ans": "B", "expl": "The central bank should increase target interest rates when the economy is growing at an\nunsustainable (above-full-employment) level. Decreasing the target overnight rate is likely\nto further increase aggregate demand and cause inflation to accelerate, which will be\ndetrimental to the long-term growth rate of the economy.\n(Module 15.1, LOS 15.b)"}, {"n": 16, "q": "Xanadu attempts to decrease its inflation rate by implementing contractionary monetary\npolicy. Which of the following is most likely to be the long-run effect on Xanadu's trade\nbalance as a result of the monetary policy change?", "opts": ["Improve.", "Worsen.", "Remain the same."], "ans": "B", "expl": "Contractionary monetary policy likely will cause higher domestic interest rates and attract\nforeign capital. As foreign capital flows in, the currency will appreciate relative to other\ncurrencies. The higher cost of its currency will result in higher cost exports that become\nless attractive to other countries. Xanadu's trade balance will most likely worsen.\n(Module 15.1, LOS 15.b)"}, {"n": 17, "q": "If the Federal Reserve wishes to lower market interest rates without changing the discount\nrate, it can:", "opts": ["buy Treasury securities.", "increase bank reserve requirements.", "raise the yield on Treasury securities."], "ans": "A", "expl": "Buying Treasury securities pumps money into the economy, lowering interest rates. Higher\nreserve requirements will restrict the money supply, causing rates to rise. The Federal\nReserve has no direct control over the yield on existing Treasury securities.\n(Module 15.1, LOS 15.b)"}, {"n": 18, "q": "Which of the following is least likely to be a function of the central bank?", "opts": ["Issue currency.", "Collect tax payments.", "Regulate the banking system."], "ans": "B", "expl": "The three functions of a central bank are to issue a country's currency, regulate its banking\nsystem, and to manage the money supply. Tax collection is typically conducted by a\ngovernment agency created specifically to carry out that function.\n(Module 15.1, LOS 15.a)"}, {"n": 19, "q": "Assume the U.S. economy is undergoing a recession. In its efforts to stimulate the economy\nby trying to influence short-term interest rates the Fed is most likely to take which two\nactions?", "opts": ["Buy Treasury securities and decrease bank reserve requirements.", "Sell Treasury securities and decrease bank reserve requirements.", "Sell Treasury securities and increase bank reserve requirements."], "ans": "A", "expl": "If the economy is in a recession, the Fed is likely to attempt to decrease short-term\ninterest rates. Thus, the Fed will buy Treasury securities and decrease bank reserve\nrequirements.\n(Module 15.1, LOS 15.b)"}, {"n": 20, "q": "The most likely reason for deflation to persist despite expansionary monetary policy is:", "opts": ["a liquidity trap.", "bond market vigilantes.", "inelastic demand for money."], "ans": "A", "expl": "Deflation is often associated with liquidity trap conditions. A liquidity trap is a situation in\nwhich demand for money becomes highly elastic. Expanding the money supply has little\neffect on economic activity under these conditions because individuals and firms choose\nto hold the additional money in cash. \"Bond market vigilantes\" is an expression referring\nto the fact that expansionary monetary policy may cause long-term interest rates to\nincrease, instead of decreasing as intended, if bond market participants expect the\nexpansionary policy to increase future inflation rates.\n(Module 15.2, LOS 15.c)"}, {"n": 21, "q": "The open market sale of Treasury securities by the Federal Reserve is least likely to result in:", "opts": ["increased exports of U.S. goods.", "a decreased rate of inflation.", "increased longer-term interest rates."], "ans": "A", "expl": "When the Fed sells Treasuries, it causes both short- and long-term interest rates to\nincrease. This rate increase causes the dollar to appreciate, which reduces foreign demand\nfor domestic goods, causing exports to decline. The interest rate increase also puts\ndownward pressure on price levels, which causes inflation to slow.\n(Module 15.1, LOS 15.b)"}, {"n": 22, "q": "Central banks are most likely to pursue a target inflation rate:", "opts": ["equal to 0%.", "between 0% and 2%.", "between 2% and 3%."], "ans": "C", "expl": "Central banks typically define price stability as a stable inflation rate of about 2% to 3%. A\ntarget of zero is not typically used because it would risk deflation.\n(Module 15.1, LOS 15.a)"}, {"n": 23, "q": "Which of the following statements regarding the monetary policy transmission mechanism is\nmost accurate?", "opts": ["Central banks can control short-term interest rates directly, but long-term interest rates are beyond their control.", "Central banks can control short-term interest rates by increasing the money supply to increase interest rates or by decreasing the money supply to decrease interest rates.", "Central banks can control long-term interest rates directly because decisions by consumers and businesses are based on these rates."], "ans": "A", "expl": "Central banks can control short-term interest rates directly. However, the decisions of\nconsumers and businesses are based on long-term interest rates, which are beyond the\ncontrol of central banks. Increasing the money supply will decrease interest rates and\ndecreasing the money supply will increase interest rates.\n(Module 15.2, LOS 15.c)"}, {"n": 24, "q": "If a bank needs to borrow funds from the Federal Reserve to fund a temporary shortage in\nreserves, it would borrow funds at the:", "opts": ["prime rate.", "discount rate.", "federal funds rate."], "ans": "B", "expl": "Banks are able to borrow from the Fed at the discount rate. The federal funds rate is the\ninterest rate banks charge other banks to borrow reserves from other banks. The prime\nrate is the rate that commercial banks charge their best customers.\n(Module 15.1, LOS 15.a)"}, {"n": 25, "q": "A central bank is said to have credibility if:", "opts": ["economic actors base decisions on the central bank’s stated inflation targets.", "it issues inflation reports monthly.", "it determines both the policy rate and the method for computing the inflation rate."], "ans": "A", "expl": "If a central bank has credibility, economic actors come to believe the inflation rate will be\nnear the central bank's target and factor this inflation rate into their decisions. Periodic\ninflation reports enhance the transparency of a central bank. A central bank that\ndetermines both the policy rate and the method for computing the inflation rate is said to\nhave independence. (Module 15.2, LOS 15.c)"}, {"n": 26, "q": "Contractionary monetary policy is least likely to decrease consumption spending by\ndecreasing:", "opts": ["expectations for economic growth.", "securities prices.", "the foreign exchange value of the currency."], "ans": "C", "expl": "Contractionary monetary policy is likely to increase the value of the domestic currency in\nthe foreign exchange market, which decreases foreign demand for the country's exports.\nContractionary monetary policy should cause both securities prices and expectations for\neconomic growth to decrease, each of which is likely to cause consumers to decrease\nspending.\n(Module 15.1, LOS 15.b)"}, {"n": 27, "q": "The primary objective of a central bank is typically to:", "opts": ["control inflation.", "achieve full employment.", "stabilize exchange rates."], "ans": "A", "expl": "Although some central banks have other stated goals including stabilizing exchange rates\nand achieving full employment, the primary objective for a central bank is to control\ninflation and promote price stability.\n(Module 15.1, LOS 15.a)"}, {"n": 28, "q": "If a central bank's targeted inflation rate is above the current rate, the central bank is most\nlikely to:", "opts": ["buy government securities.", "increase the overnight lending rate.", "increase the reserve requirement."], "ans": "A", "expl": "Buying government securities is an expansionary policy that would increase the money\nsupply and allow the inflation rate to increase to the targeted range. Increasing reserve\nrequirements and overnight lending rates are contractionary and would have the opposite\neffects.\n(Module 15.1, LOS 15.b)"}, {"n": 29, "q": "Which of the following is the most likely result of a central bank's shift to an expansionary\nmonetary policy?", "opts": ["Domestic currency appreciates.", "Exports increase.", "Interest rates increase."], "ans": "B", "expl": "Expansionary monetary policy decreases interest rates. This should cause the domestic\ncurrency to depreciate, which should increase foreign demand for the country's exports.\n(Module 15.1, LOS 15.b)"}, {"n": 30, "q": "To determine whether monetary policy is expansionary or contractionary, an analyst should\ncompare the central bank's policy rate to the:", "opts": ["neutral interest rate.", "target inflation rate.", "trend rate of real growth."], "ans": "A", "expl": "The neutral interest rate is the sum of the trend rate of real economic growth and the\ntarget inflation rate. Monetary policy is expansionary if the policy rate is less than the\nneutral interest rate and contractionary if the policy rate is greater than the neutral\ninterest rate.\n(Module 15.2, LOS 15.c)"}, {"n": 31, "q": "What are the three essential qualities an effective central bank should possess?", "opts": ["Transparency, independence, and consistency.", "Credibility, relevance, and reliability.", "Independence, credibility, and transparency."], "ans": "C", "expl": "A central bank that is independent from political interference, possesses credibility, and\nexhibits transparency is more likely to achieve its monetary policy objectives than a central\nbank that lacks these qualities. The other characteristics listed in the answer choices relate\nto financial statements and financial reporting standards.\n(Module 15.2, LOS 15.c)"}, {"n": 32, "q": "Which of the following policy tools is the least likely to be available to the U.S. Federal\nReserve Board?", "opts": ["Setting the discount rate at which banks can borrow from the Federal Reserve.", "Buying and selling Treasury securities in the open market.", "Requiring the banking system to tighten or loosen its credit policies."], "ans": "C", "expl": "The U.S. Federal Reserve can encourage or persuade banks as a whole to tighten or loosen\ntheir credit policies, but it cannot compel them to do so.\n(Module 15.1, LOS 15.b)"}, {"n": 33, "q": "The Federal Reserve has decided to increase the federal funds rate (the interest rate that\nbanks charge each other for overnight loans). To implement this policy, the Federal Reserve\nwill most likely:", "opts": ["sell government securities in the open market.", "increase currency exchange rates (cause domestic currency to appreciate).", "set a lower price on Treasury bills and notes that it is auctioning."], "ans": "A", "expl": "Selling government securities on the open market reduces bank reserves and drives up\nthe federal funds rate. The other two statements are incorrect because the Federal\nReserve does not directly control exchange rates or the prices of government securities.\n(Module 15.1, LOS 15.b)"}, {"n": 34, "q": "Which of the following is least likely a function or objective of a central bank?", "opts": ["Issuing currency.", "Keeping inflation within an acceptable range.", "Lending money to government agencies."], "ans": "C", "expl": "Lending money to government agencies is not typically a function of a central bank.\nCentral bank functions include controlling the country's money supply to keep inflation\nwithin acceptable levels and promoting a sustainable rate of economic growth, as well as\nissuing currency and regulating banks.\n(Module 15.1, LOS 15.a)"}, {"n": 35, "q": "Central banks pursuing expansionary policies may:", "opts": ["decrease the policy rate and make open market purchases of securities.", "decrease the policy rate and make open market sales of securities.", "increase the policy rate and make open market purchases of securities."], "ans": "A", "expl": "Decreasing the policy rate, decreasing reserve requirements, and purchasing securities in\nthe open market are expansionary monetary policy actions.\n(Module 15.1, LOS 15.b)"}, {"n": 36, "q": "A country is experiencing a core inflation rate of 7% during a recessionary period of real GDP\ngrowth. If the central bank has a single mandate to achieve price stability and uses inflation\ntargeting with an acceptable range of zero to 4%, its monetary policy response is most likely\nto decrease:", "opts": ["GDP growth in the short run.", "short-term interest rates.", "the foreign exchange value of the country’s currency."], "ans": "A", "expl": "If the central bank has a price stability mandate, it will most likely respond to the above-\ntarget inflation rate by decreasing the money supply, even though GDP growth is in a\nrecessionary phase. Decreasing the money supply will result in higher short-term interest\nrates and appreciation of the currency, but will likely cause GDP growth to decrease\nfurther in the short run.\n(Module 15.1, LOS 15.a)"}, {"n": 37, "q": "A central bank that wants to increase short-term interest rates is most likely to:", "opts": ["issue long-term bonds.", "sell government securities.", "decrease bank reserve requirements."], "ans": "B", "expl": "Open market operations to sell securities will decrease the outstanding supply of cash\nbalances and increase short-term interest rates. The central bank does not issue long-term\nbonds but may buy and sell bonds issued by the government. Decreasing reserve\nrequirements or purchasing government securities would tend to decrease short-term\ninterest rates.\n(Module 15.1, LOS 15.b)"}, {"n": 38, "q": "The government is reducing its spending to balance the budget, while the central bank is\nlowering its official policy rate. What will most likely be the combined effect on the economy?", "opts": ["The private sector as a percentage of GDP will increase.", "The public and private sectors as a percentage of GDP will neither decrease nor increase.", "The public sector as a percentage of GDP will increase."], "ans": "A", "expl": "The private sector will expand as a percentage of GDP because (1) the public sector will\ndecrease as a percentage of GDP due to government spending cuts and (2) lower interest\nrates should cause the private sector to expand.\n(Module 15.2, LOS 15.d)"}, {"n": 39, "q": "Which of the following conditions is difficult for monetary policy to address because a\ncentral bank cannot reduce its nominal policy rate much below zero?", "opts": ["Deflation.", "Inflation.", "Stagflation."], "ans": "A", "expl": "Deflation is difficult for central banks to address when policy rates cannot be lowered any\nfurther. Inflation can be addressed by contractionary monetary policy. Stagflation is\ndifficult to address because monetary policy cannot pursue higher growth and lower\ninflation at the same time.\n(Module 15.2, LOS 15.c)"}, {"n": 40, "q": "If a monetary policy is focused on combating inflation, which open market actions by the\nFederal Reserve will most effectively accomplish this?", "opts": ["Sell Treasury securities, causing aggregate demand to decrease.", "Sell Treasury securities, causing aggregate demand to increase.", "Purchase Treasury securities, causing aggregate demand to decrease."], "ans": "A", "expl": "If the Federal Reserve wants to slow inflation, it needs to decrease aggregate demand (i.e.,\nbusiness investment, consumer purchases of durable goods, and exports). To accomplish\nthis, the Federal Reserve could engage in open market sales of Treasury securities.\n(Module 15.1, LOS 15.b)"}];
const CFG = {"title": "Monetary Policy", "subtitle": "CFA · Economics · Reading 15 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    if(q.cols){
      const ch = document.createElement("div");
      ch.className = "q-cols-header";
      q.cols.forEach(h=>{
        const sp = document.createElement("span"); sp.textContent = h;
        ch.appendChild(sp);
      });
      card.appendChild(ch);
    }

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      if(q.cols && t.includes(" | ")){
        b.dataset.cols = "2";
        t.split(" | ").forEach(p=>{
          const sp = document.createElement("span"); sp.className = "opt-col"; sp.textContent = p;
          b.appendChild(sp);
        });
      } else {
        b.appendChild(document.createTextNode(t));
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|\(?required\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect)\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect)\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
