<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#d86413; --accent2:#f0a05a;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#d86413; --accent2:#a8500e;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(216,100,19,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(240,160,90,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(216,100,19,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(216,100,19,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#d86413,secondary:#f0a05a"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements about hypothesis testing is most accurate?", "opts": ["A Type I error is rejecting the null hypothesis when it is true, and a Type II error is rejecting the alternative hypothesis when it is true.", "A hypothesis that the population mean is less than or equal to 5 should be rejected when the critical Z-statistic is greater than the sample Z-statistic.", "A hypothesized mean of 3, a sample mean of 6, and a standard error of the sampling means of 2 give a sample Z-statistic of 1.5."], "ans": "C", "expl": "Z = (6 - 3)/2 = 1.5. A Type II error is failing to reject the null hypothesis when it is false. The\nnull hypothesis that the population mean is less than or equal to 5 should be rejected\nwhen the sample Z-statistic is greater than the critical Z-statistic.\n(Module 8.1, LOS 8.a)"}, {"n": 2, "q": "An analyst decides to select 10 stocks for her portfolio by placing the ticker symbols for all\nthe stocks traded on the New York Stock Exchange in a large bowl. She randomly selects 20\nstocks and will put every other one chosen into her 10-stock portfolio. The analyst used:", "opts": ["dual random sampling.", "simple random sampling.", "stratified random sampling."], "ans": "B", "expl": "In simple random sampling, each item in the population has an equal chance of being\nselected. The analyst's method meets this criterion.\n(Module 8.1, LOS 8.a)"}, {"n": 3, "q": "A financial analyst is constructing a hypothesis test to assess whether the mean daily return\non a portfolio of blue-chip stocks is statistically different from zero. The sample size is 128\ntrading days, the mean return is 0.14%, and the standard deviation is 0.18%. With the null\nhypothesis that the daily portfolio return is equal to zero, which of the following changes in\nvariables will independently make it more likely that the null is rejected?", "opts": ["A move of the mean return down to 0.11%.", "An increase in the standard deviation of the returns to 0.23%.", "An increase in the sample size to 140."], "ans": "C", "expl": "Even though numbers are provided, no calculations are needed. An increase in the sample\nsize will produce a lower standard error, and a lower standard error will equate to a higher\ntest statistic. Note that all numbers provided are positive, such that the critical value will\nbe a positive number. The higher the test statistic is relative to the critical value, the more\nlikely it is that the null hypothesis is rejected.\nA decrease in the mean return will lower the test statistic, while an increase in the\nstandard deviation will increase the standard error (which will decrease the test statistic).\n(Module 8.2, LOS 8.b)"}, {"n": 4, "q": "An analyst calculates that the mean of a sample of 200 observations is 5. The analyst wants\nto determine whether the calculated mean, which has a standard error of the sample\nstatistic of 1, is significantly different from 7 at the 5% level of significance. Which of the\nfollowing statements is least accurate?:", "opts": ["The null hypothesis would be: H: mean = 7. 0", "The alternative hypothesis would be H: mean > 7. a", "The mean observation is significantly different from 7, because the calculated Z- statistic is less than the critical Z-statistic."], "ans": "B", "expl": "The way the question is worded, this is a two tailed test. The alternative hypothesis is not\nH: M > 7 because in a two-tailed test the alternative is =, while < and > indicate one-tailed\na\ntests. A test statistic is calculated by subtracting the hypothesized parameter from the\nparameter that has been estimated and dividing the difference by the standard error of\nthe sample statistic. Here, the test statistic = (sample mean – hypothesized mean) /\n(standard error of the sample statistic) = (5 - 7) / (1) = -2. The calculated Z is -2, while the\ncritical value is -1.96. The calculated test statistic of -2 falls to the left of the critical Z-\nstatistic of -1.96, and is in the rejection region. Thus, the null hypothesis is rejected and\nthe conclusion is that the sample mean of 5 is significantly different than 7. What the\nnegative sign shows is that the mean is less than 7; a positive sign would indicate that the\nmean is more than 7. The way the null hypothesis is written, it makes no difference\nwhether the mean is more or less than 7, just that it is not 7.\n(Module 8.2, LOS 8.b)"}, {"n": 5, "q": "Which of the following statements about hypothesis testing is most accurate? A Type I error\nis the probability of:", "opts": ["rejecting a true alternative hypothesis.", "rejecting a true null hypothesis.", "failing to reject a false hypothesis."], "ans": "B", "expl": "The Type I error is the error of rejecting the null hypothesis when, in fact, the null is true.\n(Module 8.1, LOS 8.a)"}, {"n": 6, "q": "A Type I error is made when the researcher:", "opts": ["rejects the null hypothesis when it is actually true.", "fails to reject the null hypothesis when it is actually false.", "rejects the alternative hypothesis when it is actually true."], "ans": "A", "expl": "A Type I error is defined as rejecting the null hypothesis when it is actually true. It can be\nthought of as a false positive.\nA Type II error occurs when a researching fails to reject the null hypothesis when it is false.\nIt can be thought of as a false negative.\n(Module 8.1, LOS 8.a)"}, {"n": 7, "q": "Which of the following statements about hypothesis testing is most accurate?", "opts": ["The probability of a Type I error is equal to the significance level of the test.", "If you can disprove the null hypothesis, then you have proven the alternative hypothesis.", "The power of a test is one minus the probability of a Type I error."], "ans": "A", "expl": "The probability of getting a test statistic outside the critical value(s) when the null is true is\nthe level of significance and is the probability of a Type I error. The power of a test is 1\nminus the probability of a Type II error. Hypothesis testing does not prove a hypothesis,\nwe either reject the null or fail to reject it.\n(Module 8.1, LOS 8.a)"}, {"n": 8, "q": "A survey is taken to determine whether the average starting salaries of CFA charterholders is\nequal to or greater than $57,000 per year. Assuming a normal distribution, what is the test\nstatistic given a sample of 115 newly acquired CFA charterholders with a mean starting\nsalary of $65,000 and a standard deviation of $4,500?", "opts": ["-19.06.", "1.78.", "19.06."], "ans": "C", "expl": "With a large sample size (115) the z-statistic is used. The z-statistic is calculated by\nsubtracting the hypothesized parameter from the parameter that has been estimated and\ndividing the difference by the standard error of the sample statistic. Here, the test statistic\n1/2\n= (sample mean – hypothesized mean) / (population standard deviation / (sample size) =\n1/21/2\n(X − µ) / (σ / n) = (65,000 – 57,000) / (4,500 / 115) = (8,000) / (4,500 / 10.72) = 19.06.\n(Module 8.2, LOS 8.b)"}, {"n": 9, "q": "Lucy James, CFA, is constructing a hypothesis test using a 5% level of significance. If she is\ninterested in increasing the \"power of the test,\" she should consider:", "opts": ["increasing the probability of a Type II error.", "keeping the significance level the same and increasing the sample size.", "lowering the level of significance."], "ans": "B", "expl": "A Type I error, which is equivalent to the level of significance, is the probability of\nincorrectly rejecting a true null hypothesis. A Type II error is the probability of incorrectly\nnot rejecting a false null hypothesis. The \"power of the test\" is equal to 1 minus the\nprobability of a Type II error and represents the probability of correctly rejecting a false\nnull hypothesis.\nTo increase the power of the test, James could keep the significance level the same and\nincrease the sample size. Lowering the level of significance will reduce the probability of a\nType I error, increase the probability of a Type II error, and decrease the power of the test.\nIncreasing the probability of a Type II error will decrease the power of the test.\n(Module 8.2, LOS 8.b)"}, {"n": 10, "q": "Which of the following statements about hypothesis testing is most accurate? A Type II error\nis the probability of:", "opts": ["failing to reject a false null hypothesis.", "rejecting a true alternative hypothesis.", "rejecting a true null hypothesis."], "ans": "A", "expl": "The Type II error is the error of failing to reject a null hypothesis that is not true.\n(Module 8.1, LOS 8.a)"}, {"n": 11, "q": "The power of the test is:", "opts": ["the probability of rejecting a true null hypothesis.", "equal to the level of confidence.", "the probability of rejecting a false null hypothesis."], "ans": "C", "expl": "This is the definition of the power of the test: the probability of correctly rejecting the null\nhypothesis (rejecting the null hypothesis when it is false).\n(Module 8.1, LOS 8.a)"}, {"n": 12, "q": "If a two-tailed hypothesis test has a 5% probability of rejecting the null hypothesis when the\nnull is true, it is most likely that the:", "opts": ["power of the test is 95%.", "probability of a Type I error is 2.5%.", "significance level of the test is 5%."], "ans": "C", "expl": "Rejecting the null hypothesis when it is true is a Type I error. The probability of a Type I\nerror is the significance level of the test. The power of a test is one minus the probability\nof a Type II error, which cannot be calculated from the information given.\n(Module 8.1, LOS 8.a)"}, {"n": 13, "q": "A Type II error:", "opts": ["fails to reject a false null hypothesis.", "fails to reject a true null hypothesis.", "rejects a true null hypothesis."], "ans": "A", "expl": "A Type II error is defined as accepting the null hypothesis when it is actually false. The\nchance of making a Type II error is called beta risk.\n(Module 8.1, LOS 8.a)"}, {"n": 14, "q": "Which of the following statements about parametric and nonparametric tests is least\naccurate?", "opts": ["Nonparametric tests rely on population parameters.", "The test of the difference in means is used when you are comparing means from two independent samples.", "The test of the mean of the differences is used when performing a paired comparison."], "ans": "A", "expl": "Nonparametric tests are not concerned with parameters; they make minimal assumptions\nabout the population from which a sample comes. It is important to distinguish between\nthe test of the difference in the means and the test of the mean of the differences. Also, it\nis important to understand that parametric tests rely on distributional assumptions,\nwhereas nonparametric tests are not as strict regarding distributional properties.\n(Module 8.2, LOS 8.c)"}, {"n": 15, "q": "If a one-tailed z-test uses a 5% significance level, the test will reject a:", "opts": ["false null hypothesis 95% of the time.", "true null hypothesis 95% of the time.", "true null hypothesis 5% of the time."], "ans": "C", "expl": "The level of significance is the probability of rejecting the null hypothesis when it is true.\nThe probability of rejecting the null when it is false is the power of a test. (Module 8.1, LOS\n8.a)"}, {"n": 16, "q": "Which of the following statements about hypothesis testing is least accurate?", "opts": ["If the alternative hypothesis is H: µ > µ, a two-tailed test is appropriate. a0", "The null hypothesis is a statement about the value of a population parameter.", "A Type II error is failing to reject a false null hypothesis."], "ans": "A", "expl": "The hypotheses are always stated in terms of a population parameter. Type I and Type II\nare the two types of errors you can make – reject a null hypothesis that is true or fail to\nreject a null hypothesis that is false. The alternative may be one-sided (in which case a > or\n< sign is used) or two-sided (in which case a ≠ is used).\n(Module 8.1, LOS 8.a)"}, {"n": 17, "q": "A test of whether a mutual fund's performance rank in one period provides information\nabout the fund's performance rank in a subsequent period is best described as a:", "opts": ["mean-rank test.", "nonparametric test.", "parametric test."], "ans": "B", "expl": "A rank correlation test is best described as a nonparametric test.\n(Module 8.2, LOS 8.c)"}, {"n": 18, "q": "Kyra Mosby, M.D., has a patient who is complaining of severe abdominal pain. Based on an\nexamination and the results from laboratory tests, Mosby states the following diagnosis\nhypothesis: H: Appendicitis, H: Not Appendicitis. Dr. Mosby removes the patient's\noA\nappendix and the patient still complains of pain. Subsequent tests show that the gall bladder\nwas causing the problem. By taking out the patient's appendix, Dr. Mosby:", "opts": ["made a Type II error.", "made a Type I error.", "is correct."], "ans": "A", "expl": "This statement is an example of a Type II error, which occurs when you fail to reject a\nhypothesis when it is actually false.\nThe other statements are incorrect. A Type I error is the rejection of a hypothesis when it\nis actually true.\n(Module 8.2, LOS 8.b)"}, {"n": 19, "q": "If an analyst wants to perform hypothesis testing using a chi-square test, which of the\nfollowing values is he most likely assessing?", "opts": ["Whether two population variances are equal.", "The value of a population mean.", "The value of a population variance."], "ans": "C", "expl": "A chi-square test is a hypothesis test used to assess the value of a population variance.\nThe value of a population mean will use either a t-test (for a small sample) or a z-test (for a\nlarge sample). An F-test can be used to assess the equality of two population variances.\n(Module 8.2, LOS 8.b)"}, {"n": 20, "q": "A survey is taken to determine whether the average starting salaries of CFA charterholders is\nequal to or greater than $58,500 per year. What is the test statistic given a sample of 175\nCFA charterholders with a mean starting salary of $67,000 and a standard deviation of\n$5,200?", "opts": ["1.63.", "–1.63.", "21.62."], "ans": "C", "expl": "With a large sample size (175) the z-statistic is used. The z-statistic is calculated by\nsubtracting the hypothesized parameter from the parameter that has been estimated and\ndividing the difference by the standard error of the sample statistic. Here, the test statistic\n1/2\n= (sample mean – hypothesized mean) / (population standard deviation / (sample size) =\n1/21/2\n(X − µ) / (σ / n) = (67,000 – 58,500) / (5,200 / 175) = (8,500) / (5,200 / 13.22) = 21.62.\n(Module 8.2, LOS 8.b)"}, {"n": 21, "q": "John Jenkins, CFA, is performing a study on the behavior of the mean P/E ratio for a sample\nof small-cap companies. Which of the following statements is most accurate?", "opts": ["A Type I error represents the failure to reject the null hypothesis when it is, in fact, false.", "One minus the confidence level of the test represents the probability of making a Type II error.", "The significance level of the test represents the probability of making a Type I error."], "ans": "C", "expl": "A Type I error is the rejection of the null when the null is actually true. The significance\nlevel of the test (alpha) (which is one minus the confidence level) is the probability of\nmaking a Type I error. A Type II error is the failure to reject the null when it is actually\nfalse.\n(Module 8.1, LOS 8.a)"}, {"n": 22, "q": "A survey is taken to determine whether the average starting salaries of CFA charterholders is\nequal to or greater than $54,000 per year. Assuming a normal distribution, what is the test\nstatistic given a sample of 75 newly acquired CFA charterholders with a mean starting salary\nof $57,000 and a standard deviation of $1,300?", "opts": ["2.31.", "-19.99.", "19.99."], "ans": "C", "expl": "With a large sample size (75) the z-statistic is used. The z-statistic is calculated by\nsubtracting the hypothesized parameter from the parameter that has been estimated and\ndividing the difference by the standard error of the sample statistic. Here, the test statistic\n1/2\n= (sample mean – hypothesized mean) / (sample standard deviation / (sample size) = (X\n1/21/2\n− µ) / (σ / n) = (57,000 – 54,000) / (1,300 / 75) = (3,000) / (1,300 / 8.66) = 19.99.\n(Module 8.2, LOS 8.b)"}, {"n": 23, "q": "A survey is taken to determine whether the average starting salaries of CFA charterholders is\nequal to or greater than $59,000 per year. What is the test statistic given a sample of 135\nnewly acquired CFA charterholders with a mean starting salary of $64,000 and a standard\ndeviation of $5,500?", "opts": ["-10.56.", "0.91.", "10.56."], "ans": "C", "expl": "With a large sample size (135) the z-statistic is used. The z-statistic is calculated by\nsubtracting the hypothesized parameter from the parameter that has been estimated and\ndividing the difference by the standard error of the sample statistic. Here, the test statistic\n1/2\n= (sample mean – hypothesized mean) / (population standard deviation / (sample size))\n1/21/2\n= (X − µ) / (σ / n) = (64,000 – 59,000) / (5,500 / 135) = (5,000) / (5,500 / 11.62) = 10.56.\n(Module 8.2, LOS 8.b)"}, {"n": 24, "q": "Ron Jacobi, manager with the Toulee Department of Natural Resources, is responsible for\nsetting catch-and-release limits for Lake Norby, a large and popular fishing lake. He takes a\nsample to determine whether the mean length of Northern Pike in the lake exceeds 18\ninches. If the sample t-statistic indicates that the mean length of the fish is significantly\ngreater than 18 inches, when the population mean is actually 17.8 inches, the t-test resulted\nin:", "opts": ["both a Type I and a Type II error.", "a Type I error only.", "a Type II error only."], "ans": "B", "expl": "Rejection of a null hypothesis when it is actually true is a Type I error. Here, H: μ ≤ 18\no\ninches and H: μ > 18 inches. Type II error is failing to reject a null hypothesis when it is\na\nactually false.\nBecause a Type I error can only occur if the null hypothesis is true, and a Type II error can\nonly occur if the null hypothesis is false, it is logically impossible for a test to result in both\ntypes of error at the same time.\n(Module 8.2, LOS 8.b)"}, {"n": 25, "q": "Which of the following statements regarding hypothesis testing is least accurate?", "opts": ["A type I error is acceptance of a hypothesis that is actually false.", "A type II error is the failure to reject the null hypothesis when it is actually false.", "The significance level is the risk of making a type I error."], "ans": "A", "expl": "A type I error is the rejection of a hypothesis that is actually true.\n(Module 8.1, LOS 8.a)"}, {"n": 26, "q": "If a two-tailed hypothesis test has a 5% probability of rejecting the null hypothesis when the\nnull is true, it is most likely that:", "opts": ["the power of the test is 95%.", "the confidence level of the test is 95%.", "the probability of a Type I error is 2.5%."], "ans": "B", "expl": "Rejecting the null hypothesis when it is true is a Type I error. The probability of a Type I\nerror is the significance level of the test and one minus the significance level is the\nconfidence level. The power of a test is one minus the probability of a Type II error, which\ncannot be calculated from the information given. (Module 8.1, LOS 8.a)"}, {"n": 27, "q": "Which of the following statements about hypothesis testing is least accurate?", "opts": ["A Type I error is the probability of rejecting the null hypothesis when the null hypothesis is false.", "A Type II error is the probability of failing to reject a null hypothesis that is not true.", "The significance level is the probability of making a Type I error."], "ans": "A", "expl": "A Type I error is the probability of rejecting the null hypothesis when the null hypothesis is\ntrue.\n(Module 8.1, LOS 8.a)"}, {"n": 28, "q": "If the probability of a Type I error decreases, then the probability of:", "opts": ["incorrectly rejecting the null increases.", "incorrectly accepting the null decreases.", "a Type II error increases."], "ans": "C", "expl": "If P(Type I error) decreases, then P(Type II error) increases. A null hypothesis is never\naccepted. We can only fail to reject the null.\n(Module 8.1, LOS 8.a)"}, {"n": 29, "q": "A Type I error:", "opts": ["rejects a true null hypothesis.", "fails to reject a false null hypothesis.", "rejects a false null hypothesis."], "ans": "A", "expl": "A Type I Error is defined as rejecting the null hypothesis when it is actually true. The\nprobability of committing a Type I error is the significance level or alpha risk.\n(Module 8.1, LOS 8.a)"}, {"n": 30, "q": "A data analyst compares the P/E ratios for two companies over a period of 20 years and\ncalculates a two-tailed F-statistic that exceeds the critical F-statistic value. As a result of her\nfindings, she will:", "opts": ["reject the null hypothesis that the P/E ratio variances between the two companies are significantly different.", "reject the null hypothesis that the P/E ratio variances between the two companies are not significantly different.", "not reject the null hypothesis that the P/E ratio variances between the two companies are significantly different."], "ans": "B", "expl": "The F-test is used to assess the equality of two population variances. Here, the comparison\nis between two companies' P/E ratios over a period of 20 years. The null hypothesis for the\ntwo-tailed test is that the variances are not significantly different, while the alternative\nhypothesis is that they are significantly different.\nBecause the calculated F-statistic is higher than the critical F-statistic value, the null\nhypothesis will be rejected.\n(Module 8.2, LOS 8.b)"}, {"n": 31, "q": "For a two-tailed test of hypothesis involving a z-distributed test statistic and a 5% level of\nsignificance, a calculated z-statistic of 1.5 indicates that:", "opts": ["the null hypothesis cannot be rejected.", "the test is inconclusive.", "the null hypothesis is rejected."], "ans": "A", "expl": "For a two-tailed test at a 5% level of significance the calculated z-statistic would have to be\ngreater than the critical z value of 1.96 for the null hypothesis to be rejected.\n(Module 8.2, LOS 8.b)"}, {"n": 32, "q": "Bo Rigley, CFA, is a financial analyst examining large-cap equity returns over a calendar year.\nHis sample size is 252 trading days, and he observes a mean return of 0.07% and a standard\ndeviation of 0.12%. With his null hypothesis that the daily portfolio return is equal to zero\nand a 10% level of significance, Rigley will:", "opts": ["reject the null because the test statistic is greater than the critical value.", "not reject the null because the test statistic is greater than the critical value.", "not reject the null because the test statistic is less than the critical value."], "ans": "A", "expl": "At a 10% level of significance, the critical z-values for a two-tailed test are + or –1.645, so\nthe decision rule is to reject the null if the test statistic < –1.645 or > +1.645.\nWith a sample size of 252 and a standard deviation of 0.12%, the standard error is equal\nto:\ns0.12%\nS\n===0.0075593%\nx\n¯\nn\n√√252\nThe test statistic is equal to:\n0.0007\n=9.26\n0.000075593\nBecause the test statistic of 9.26 > 1.645, Rigley will reject the null that the daily equity\nreturn is equal to zero.\n(Module 8.2, LOS 8.b)"}, {"n": 33, "q": "A researcher is testing whether the average age of employees in a large firm is statistically\ndifferent from 35 years (either above or below). A sample is drawn of 250 employees and the\nresearcher determines that the appropriate critical value for the test statistic is 1.96. The\nvalue of the computed test statistic is 4.35. Given this information, which of the following\nstatements is least accurate? The test:", "opts": ["indicates that the researcher will reject the null hypothesis.", "indicates that the researcher is 95% confident that the average employee age is different than 35 years.", "has a significance level of 95%."], "ans": "C", "expl": "This test has a significance level of 5%. The relationship between confidence and\nsignificance is: significance level = 1 – confidence level. We know that the significance level\nis 5% because the sample size is large and the critical value of the test statistic is 1.96\n(2.5% of probability is in both the upper and lower tails).\n(Module 8.2, LOS 8.b)"}, {"n": 34, "q": "For a hypothesis test regarding a population parameter, an analyst has determined that the\nprobability of failing to reject a false null hypothesis is 18%, and the probability of rejecting a\ntrue null hypothesis is 5%. The power of the test is:", "opts": ["0.18.", "0.95.", "0.82."], "ans": "C", "expl": "The power of the test is 1 – the probability of failing to reject a false null (Type II error); 1 –\n0.18 = 0.82.\n(Module 8.2, LOS 8.b)"}];
const CFG = {"title": "Hypothesis Testing", "subtitle": "CFA · Quantitative Methods · Reading 8 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#d86413','#f0a05a','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
