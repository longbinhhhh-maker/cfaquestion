portfolio has been diversified away.<\/p><p>Observation 2:The business cycle obviously impacts the credit spreads on individual securities, but at the fund level, credit spreads are stable.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the bond that is most likely to experience the greatest yield spread volatility over the course of the business cycle is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q123.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":124,"q":"Which of Jones's observations regarding the high-yield bond fund is correct?","opts":["Observation 1 only","Observation 2 only","Neither Observation 1 nor Observation 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a124.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a124.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 119–124 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Jones, a fixed income analyst at a large investment management firm, is evaluating domestic monetary policy and the overall interest rate environment within the context of the business cycle. Jones observes that the last recession was six years ago, and over the past few years the domestic economy has experienced consistent growth of about 3.0%. Jones forecasts GDP growth will peak this year at 3.5% and inflation will accelerate.<\/p><p>The current central bank policy rate is 1.50% and has been unchanged for several years. Using the Taylor Rule, Jones calculates a policy rate of 4.50%. The yield curve is positively sloped with short-term bond yields anchored by the policy rate while the long-term government bond is yielding 4.00%.<\/p><p>Jones then suggests that consumption hedging properties embedded in government bond risk premiums are due to the following conditions:<\/p><p><b>Condition 1<\/b> the lack of currency risk for domestic investors<\/p><p><b>Condition 2:<\/b> bond returns being negatively correlated with GDP growth<\/p><p><b>Condition 3:<\/b> the fact that government bond risk premiums are static<\/p><p>Jones then compiles data on several five-year corporate bonds that are held by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex038.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><p>Jones shifts his attention to the firm&#x27;s high-yield bond fund and notes that the fund holds more than 400 positions and has not experienced a default during the past five years. Jones then observes:<\/p><p>Observation 1:The default risk for this portfolio has been diversified away.<\/p><p>Observation 2:The business cycle obviously impacts the credit spreads on individual securities, but at the fund level, credit spreads are stable.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Jones&#x27;s observations regarding the high-yield bond fund is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q124.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":125,"q":"If Park's long-term economic outlook for high but volatile GDP growth proves correct, it will most likely result in relatively:","opts":["more saving and less borrowing.","higher real default-free interest rates.","higher intertemporal rate of substitution."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a125.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a125.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 125–130 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Park Ji-Won is an analyst at an investment firm analyzing the domestic economy and interest rates. Park&#x27;s long-term economic outlook for the country is for relatively high but volatile GDP growth, even though the economy has been in a recession for the past six months. Just prior to the onset of the recession, the yield curve inverted. The most recent monthly economic data has shown some signs of economic stabilization and the stock market has rallied 10% since its low two months ago.<\/p><p>Park is analyzing the one-year nominal default-free domestic government zero-coupon bond, which is currently priced at 97.36 per 100 par value. Park is forecasting 1.50% inflation over the next year. A one-year inflation-adjusted default-free domestic government zero-coupon bond is currently priced at 0.85%, which Park estimates to be the real one-year rate.<\/p><\/div><\/details><div class=\"qtext\"><p>If Park&#x27;s long-term economic outlook for high but volatile GDP growth proves correct, it will most likely result in relatively:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q125.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":126,"q":"Based on this scenario, over the past six months, with the economy in recession, the intertemporal rate of substitution's impact on the one-year real default-free interest rate has most likely resulted in:","opts":["lower real yields.","unchanged real yields.","higher real yields."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a126.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a126.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 125–130 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span>  case<\/span><\/summary><div class=\"vig-body\"><p>Park Ji-Won is an analyst at an investment firm analyzing the domestic economy and interest rates. Park&#x27;s long-term economic outlook for the country is for relatively high but volatile GDP growth, even though the economy has been in a recession for the past six months. Just prior to the onset of the recession, the yield curve inverted. The most recent monthly economic data has shown some signs of economic stabilization and the stock market has rallied 10% since its low two months ago.<\/p><p>Park is analyzing the one-year nominal default-free domestic government zero-coupon bond, which is currently priced at 97.36 per 100 par value. Park is forecasting 1.50% inflation over the next year. A one-year inflation-adjusted default-free domestic government zero-coupon bond is currently priced at 0.85%, which Park estimates to be the real one-year rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the market dynamics that triggered the 10% stock market rally? Investor sentiment shifted, resulting in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q128.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":129,"q":"The implied risk premium for inflation uncertainty on the one-year default-free domestic government zero-coupon bond is closest to:","opts":["0.36%","0.65%","1.21%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a129.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a129.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 125–130 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Park Ji-Won is an analyst at an investment firm analyzing the domestic economy and interest rates. Park&#x27;s long-term economic outlook for the country is for relatively high but volatile GDP growth, even though the economy has been in a recession for the past six months. Just prior to the onset of the recession, the yield curve inverted. The most recent monthly economic data has shown some signs of economic stabilization and the stock market has rallied 10% since its low two months ago.<\/p><p>Park is analyzing the one-year nominal default-free domestic government zero-coupon bond, which is currently priced at 97.36 per 100 par value. Park is forecasting 1.50% inflation over the next year. A one-year inflation-adjusted default-free domestic government zero-coupon bond is currently priced at 0.85%, which Park estimates to be the real one-year rate.<\/p><\/div><\/details><div class=\"qtext\"><p>The implied risk premium for inflation uncertainty on the one-year default-free domestic government zero-coupon bond is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q129.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":130,"q":"Based on the information provided, the one-year breakeven inflation rate is closest to:","opts":["1.86%","2.35%","2.71%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a130.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a130.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 125–130 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Park Ji-Won is an analyst at an investment firm analyzing the domestic economy and interest rates. Park&#x27;s long-term economic outlook for the country is for relatively high but volatile GDP growth, even though the economy has been in a recession for the past six months. Just prior to the onset of the recession, the yield curve inverted. The most recent monthly economic data has shown some signs of economic stabilization and the stock market has rallied 10% since its low two months ago.<\/p><p>Park is analyzing the one-year nominal default-free domestic government zero-coupon bond, which is currently priced at 97.36 per 100 par value. Park is forecasting 1.50% inflation over the next year. A one-year inflation-adjusted default-free domestic government zero-coupon bond is currently priced at 0.85%, which Park estimates to be the real one-year rate.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided, the one-year breakeven inflation rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q130.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":131,"q":"Which of the following best describes the role of Broad Street as authorized participant?","opts":["Facilitates the creation/redemption of ETF shares with the fund sponsor","Is authorized by the fund sponsor to trade its ETF in the secondary market","Buys shares of stock directly from the fund sponsor to create new ETF shares"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a131.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a131.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 23 · Câu 131–136 · Portfolio Management<\/summary><div class=\"vig-body\"><p>New Age Management (&quot;New Age&quot;) is the fund sponsor of the Cutting-Edge Technology Fund (CETF), an exchange-traded fund (ETF). In its investment strategy, CETF invests in the 10 largest US technology stocks based on market capitalization. Broad Street Brokers (&quot;Broad Street&quot;) acts as an authorized participant (AP) for CETF. CETF trades on a US exchange and rebalances on the last trading day of every calendar quarter.<\/p><p>CETF&#x27;s current creation and redemption baskets are displayed below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex039.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Intraday on March 31, CETF last trades at $20.00, a premium to the current intraday NAV (ie, iNAV) of $19.98. The current bid-ask spread is $19.96–$20.02. Another broker/dealer, Zebra Trading (ZT)—which is not an AP— comes to Broad Street with a large order to buy 500,000 shares of CETF. Broad Street immediately fills the entire 500,000-share order at $20.00, although it has only 100,000 shares in inventory.<\/p><p>During the day, Broad Street also trades blocks of CETF with a third broker/dealer, Alpha Trading. The net trading activity at the end of the day is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex040.webp\" style=\"max-width:min(100%,668px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the role of Broad Street as authorized participant?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q131.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":132,"q":"An ETF creation unit is best described as stocks:","opts":["included in the ETF that are publicly disclosed each day by the fund sponsor.","that the AP receives from the fund sponsor in exchange for shares of the ETF.","that the AP sends to the fund sponsor in exchange for large blocks of the ETF."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a132.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a132.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<detai ts in the 10 largest US technology stocks based on market capitalization. Broad Street Brokers (&quot;Broad Street&quot;) acts as an authorized participant (AP) for CETF. CETF trades on a US exchange and rebalances on the last trading day of every calendar quarter.<\/p><p>CETF&#x27;s current creation and redemption baskets are displayed below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex039.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Intraday on March 31, CETF last trades at $20.00, a premium to the current intraday NAV (ie, iNAV) of $19.98. The current bid-ask spread is $19.96–$20.02. Another broker/dealer, Zebra Trading (ZT)—which is not an AP— comes to Broad Street with a large order to buy 500,000 shares of CETF. Broad Street immediately fills the entire 500,000-share order at $20.00, although it has only 100,000 shares in inventory.<\/p><p>During the day, Broad Street also trades blocks of CETF with a third broker/dealer, Alpha Trading. The net trading activity at the end of the day is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex040.webp\" style=\"max-width:min(100%,668px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the data presented in Exhibit 2, 500,000 shares will most likely be deducted from which broker/dealer&#x27;s Depository Trust Company (DTC) account?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q136.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":137,"q":"Based on Exhibit 1 and relative to the benchmark, the new US equity manager's investment style biases are best described as:","opts":["large-capitalization, value.","small-capitalization, value.","small-capitalization, growth."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a137.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a137.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 137–142 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Bob Jones is a senior research analyst for a United States university endowment. Jones is considering hiring a new US equity manager for a portion of the endowment&#x27;s equity allocation. The new manager describes his investing style as a &quot;multi-cap, go anywhere&quot; manager.<\/p><p>Jones analyzes the manager&#x27;s performance over the past year using the Carhart four-factor model relative to a market-capitalization weighted benchmark index based on the 500 largest US-listed stocks. The manager&#x27;s security selection contributed −0.10% to his overall return for this period. The factor sensitivities and returns are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex041.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit\"><p>Jones then compares the new manager&#x27;s historical performance with the endowment&#x27;s existing active equity managers using the same benchmark. This information is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex042.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Jones discusses the results presented in Exhibit 1 and Exhibit 2 with Jennifer Williams, a junior research analyst at the endowment. Williams makes the following comments: Comment 1: By squaring active risk, the various sources of a portfolio&#x27;s active risk components can be separated.<\/p><p>Comment 2: The components of active risk are systematic risk and residual risk.<\/p><p>Comment 3: The benchmark selection for the new manager may not be appropriate.<\/p><p>Williams believes that instead of hiring the new manager, the endowment would be better off investing in an alternative index product. The bases for her belief are that alternative indexes:<\/p><p><b>Basis 1:<\/b> capture systematic alpha exposures<\/p><p><b>Basis 2:<\/b> cost less than traditional active managers<\/p><p><b>Basis 3:<\/b> use a mechanical, rules-based process<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and relative to the benchmark, the new US equity manager&#x27;s investment style biases are best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q137.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":138,"q":"Based on Exhibit 1, the new manager's active return from factor tilts is closest to:","opts":["0.37%","0.62%","0.72%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a138.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a138.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 137–142 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bob Jones is a senior research analyst for a United States university endowment. Jones is considering hiring a new US equity manager for a portion of the endowment&#x27;s equity allocation. The new manager describes his investing style as a &quot;multi-cap, go anywhere&quot; manager.<\/p><p>Jones analyzes the manager&#x27;s performance over the past year using the Carhart four-factor model relative to a market-capitalization weighted benchmark index based on the 500 largest US-listed stocks. The manager&#x27;s security selection contributed −0.10% to his overall return for this period. The factor sensitivities and returns are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex041.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit\"><p>Jones then compares the new manager&#x27;s historical  src=\"l2img/uw-pm/ex042.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Jones discusses the results presented in Exhibit 1 and Exhibit 2 with Jennifer Williams, a junior research analyst at the endowment. Williams makes the following comments: Comment 1: By squaring active risk, the various sources of a portfolio&#x27;s active risk components can be separated.<\/p><p>Comment 2: The components of active risk are systematic risk and residual risk.<\/p><p>Comment 3: The benchmark selection for the new manager may not be appropriate.<\/p><p>Williams believes that instead of hiring the new manager, the endowment would be better off investing in an alternative index product. The bases for her belief are that alternative indexes:<\/p><p><b>Basis 1:<\/b> capture systematic alpha exposures<\/p><p><b>Basis 2:<\/b> cost less than traditional active managers<\/p><p><b>Basis 3:<\/b> use a mechanical, rules-based process<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Williams&#x27;s bases for her belief that the endowment should invest in an alternative index product are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q142.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":143,"q":"Regarding Martinez's description of the basic fundamental law of active management, which additional component is most appropriately included in the full fundamental law?","opts":["Signal quality","Portfolio construction","Benchmark tracking risk"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a143.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a143.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 143–148 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Amy Gomez, CFA, a portfolio manager at Peak Global Inc. (Peak), has just hired Elizabeth Martinez as a junior analyst. During orientation, Gomez asks Martinez to describe the fundamental law of active management. Martinez states that, assuming optimal active weights and forecasted security returns, the basic fundamental law of active management includes factors for skill, breadth, and aggressiveness.<\/p><p>Martinez then elaborates on the full fundamental law of active management by stating the following:<\/p><p>Statement 1: The information coefficient measures the correlation between the active weights and the forecasted active returns.<\/p><p>Statement 2: The transfer coefficient measures the correlation between the forecasted active returns and the realized active returns.<\/p><p>Statement 3: The value added, or skill of the manager, measures the correlation between the active weights and the realized active returns.<\/p><p>Next, Gomez begins a discussion of the Peak Global Fund (PGF). Gomez states that the portfolio is broadly diversified and that her annual return projections for each holding are uncorrelated; the portfolio is subject to the following active constraints: long only, no leverage, and an investment universe that is limited to the 50 benchmark securities. Gomez then provides Martinez with five years of selected historical data and asks for observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex043.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Martinez observes the following:<\/p><p>Observation 1: The information coefficient implies little forecasting skill.<\/p><p>Observation 2: The transfer coefficient looks artificially low and should be very close to 1.00.<\/p><p>Observation 3: The information ratio will likely be overstated due to difficulty in accurately measuring breadth.<\/p><p>Gomez responds to Observation 1 by stating, &quot;My investment process leads to a portfolio with a value tilt and a median market capitalization less than the benchmark. Also, to be fair, it is only 60 months of data.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding Martinez&#x27;s description of the basic fundamental law of active management, which additional component is most appropriately included in the full fundamental law?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q143.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":144,"q":"Which of Martinez's statements on the full fundamental law of active management is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a144.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a144.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 143–148 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amy Gomez, CFA, a portfolio manager at Peak Global Inc. (Peak), has just hired Elizabeth Martinez as a junior analyst. During orientation, Gomez asks Martinez to describe the fundamental law of active management. Martinez states that, assuming optimal active weights and forecasted security returns, the basic fundamental law of active management includes factors for skill, breadth, and aggressiveness.<\/p><p>Martinez then elaborates on the full fundamental law of active management by stating the following:<\/p><p>Statement 1: The information coefficient measures the correlation between the active weights and the forecasted active returns.<\/p><p>Statement 2: The transfer coefficient measures the correlation between the forecasted active returns and the realized active returns.<\/p><p>Statement 3: The value added, or skill of the manager, measures the correlation between the active weights and the realized active returns.<\/p><p>Next, Gomez begins a discussion of the Peak Global Fund (PGF). Gomez states that the portfolio is broadly diversified and that her annual return projections for each holding are uncorrelated; the portfolio is subject to the following active constraints: long only, no leverage, and an investment universe that is limited to the 50 benchmark securities. Gomez then provides Martinez with five years of selected historical data and asks for observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex043.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Martinez observes the following:<\/p><p>Observation 1: The information coefficient implies little forecasting skill.<\/p><p>Observation 2: The transfer coefficient looks artificially low and should be very close to 1.00.<\/p><p>Observation 3: The information ratio will likely be overstated due to difficulty in accurately measuring breadth.<\/p><p>Gomez responds to Observation 1 by stating, &quot;My investment process leads to a portfolio with a value tilt and a median market capitalization less than the benchmark. Also, to be fair, it is only 60 months of data.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Martinez&#x27;s statements on the full fundamental law of active management is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q144.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":145,"q":"Based on the full fundamental law of active management and Exhibit 1, the information ratio of the Peak Global Fund is closest to:","opts":["0.197","0.296","0.657"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a145.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a145.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<det "Both time-series and cross-sectional dependence"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a147.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a147.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 143–148 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amy Gomez, CFA, a portfolio manager at Peak Global Inc. (Peak), has just hired Elizabeth Martinez as a junior analyst. During orientation, Gomez asks Martinez to describe the fundamental law of active management. Martinez states that, assuming optimal active weights and forecasted security returns, the basic fundamental law of active management includes factors for skill, breadth, and aggressiveness.<\/p><p>Martinez then elaborates on the full fundamental law of active management by stating the following:<\/p><p>Statement 1: The information coefficient measures the correlation between the active weights and the forecasted active returns.<\/p><p>Statement 2: The transfer coefficient measures the correlation between the forecasted active returns and the realized active returns.<\/p><p>Statement 3: The value added, or skill of the manager, measures the correlation between the active weights and the realized active returns.<\/p><p>Next, Gomez begins a discussion of the Peak Global Fund (PGF). Gomez states that the portfolio is broadly diversified and that her annual return projections for each holding are uncorrelated; the portfolio is subject to the following active constraints: long only, no leverage, and an investment universe that is limited to the 50 benchmark securities. Gomez then provides Martinez with five years of selected historical data and asks for observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex043.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Martinez observes the following:<\/p><p>Observation 1: The information coefficient implies little forecasting skill.<\/p><p>Observation 2: The transfer coefficient looks artificially low and should be very close to 1.00.<\/p><p>Observation 3: The information ratio will likely be overstated due to difficulty in accurately measuring breadth.<\/p><p>Gomez responds to Observation 1 by stating, &quot;My investment process leads to a portfolio with a value tilt and a median market capitalization less than the benchmark. Also, to be fair, it is only 60 months of data.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following limitations to the fundamental law most likely support (s) Martinez&#x27;s Observation 3?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q147.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":148,"q":"Observation 1 and Gomez's response identifies a practical limitation of the fundamental law of active management. Which of the following best describes the limitation?","opts":["Forecasted information coefficients are uncertain.","A 30-stock portfolio is insufficient to calculate an information coefficient.","Five years of monthly data is not enough time to calculate an information coefficient."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a148.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a148.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 143–148 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amy Gomez, CFA, a portfolio manager at Peak Global Inc. (Peak), has just hired Elizabeth Martinez as a junior analyst. During orientation, Gomez asks Martinez to describe the fundamental law of active management. Martinez states that, assuming optimal active weights and forecasted security returns, the basic fundamental law of active management includes factors for skill, breadth, and aggressiveness.<\/p><p>Martinez then elaborates on the full fundamental law of active management by stating the following:<\/p><p>Statement 1: The information coefficient measures the correlation between the active weights and the forecasted active returns.<\/p><p>Statement 2: The transfer coefficient measures the correlation between the forecasted active returns and the realized active returns.<\/p><p>Statement 3: The value added, or skill of the manager, measures the correlation between the active weights and the realized active returns.<\/p><p>Next, Gomez begins a discussion of the Peak Global Fund (PGF). Gomez states that the portfolio is broadly diversified and that her annual return projections for each holding are uncorrelated; the portfolio is subject to the following active constraints: long only, no leverage, and an investment universe that is limited to the 50 benchmark securities. Gomez then provides Martinez with five years of selected historical data and asks for observations.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex043.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Martinez observes the following:<\/p><p>Observation 1: The information coefficient implies little forecasting skill.<\/p><p>Observation 2: The transfer coefficient looks artificially low and should be very close to 1.00.<\/p><p>Observation 3: The information ratio will likely be overstated due to difficulty in accurately measuring breadth.<\/p><p>Gomez responds to Observation 1 by stating, &quot;My investment process leads to a portfolio with a value tilt and a median market capitalization less than the benchmark. Also, to be fair, it is only 60 months of data.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Observation 1 and Gomez&#x27;s response identifies a practical limitation of the fundamental law of active management. Which of the following best describes the limitation?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q148.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":149,"q":"Based on Exhibit 1, the total value added by active management for 20X9 is closest to:","opts":["-0.95%","-0.80%","0.30%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a149.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a149.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 149–154 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Paul Durham, senior performance attribution analyst at a pension fund, is reviewing the fund&#x27;s conventional asset allocation portfolio data for year-end 20X9. The information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex044.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>Durham is considering adding a new equity manager and is evaluating the All-Weather Equity Fund, a 130/30 long-short fund. Fund data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex045.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><p>As part of his evaluation, Durham compares the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.<\/p><p>Durham discusses the All-Weather Equity Fund with Joanna Baran, a peer and coworker. Baran suggests looking at the fund using the fundamental law of active management to better understand performance drivers. Based on this suggestion, Durham requests historical data on the All-Weather Equity Fund&#x27;s transfer coefficient (TC), information coefficient (IC), and breadth (BR) from the fund&#x27;s manager.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the total value added by active management for 20X9 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q149.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":150,"q":"Based on Exhibit 1, the value added from security selection is closest to:","opts":["-0.95%","-0.55%","-0.40%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a150.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a150.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 149–154 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, senior performance attribution analyst at a pension fund, is reviewing the fund&#x27;s conventional asset allocation portfolio data for year-end 20X9. The information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex044.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>Durham is considering adding a new equity manager and is evaluating the All-Weather Equity Fund, a 130/30 long-short fund. Fund data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex045.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><p>As part of his evaluation, Durham compares the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.< the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.<\/p><p>Durham discusses the All-Weather Equity Fund with Joanna Baran, a peer and coworker. Baran suggests looking at the fund using the fundamental law of active management to better understand performance drivers. Based on this suggestion, Durham requests historical data on the All-Weather Equity Fund&#x27;s transfer coefficient (TC), information coefficient (IC), and breadth (BR) from the fund&#x27;s manager.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the information ratio (IR) for the All-Weather Equity Fund is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q151.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":152,"q":"Combining the Rainy-Day Fund with the benchmark portfolio produces an optimal Sharpe ratio closest to:","opts":["0.516","0.720","0.849"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a152.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a152.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 149–154 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, senior performance attribution analyst at a pension fund, is reviewing the fund&#x27;s conventional asset allocation portfolio data for year-end 20X9. The information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex044.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>Durham is considering adding a new equity manager and is evaluating the All-Weather Equity Fund, a 130/30 long-short fund. Fund data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex045.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><p>As part of his evaluation, Durham compares the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.<\/p><p>Durham discusses the All-Weather Equity Fund with Joanna Baran, a peer and coworker. Baran suggests looking at the fund using the fundamental law of active management to better understand performance drivers. Based on this suggestion, Durham requests historical data on the All-Weather Equity Fund&#x27;s transfer coefficient (TC), information coefficient (IC), and breadth (BR) from the fund&#x27;s manager.<\/p><\/div><\/details><div class=\"qtext\"><p>Combining the Rainy-Day Fund with the benchmark portfolio produces an optimal Sharpe ratio closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q152.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":153,"q":"If Durham added a \"no shorting\" constraint to the Rainy-Day Fund, the optimal amount of active risk would most likely:","opts":["decrease.","stay the same.","increase."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a153.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a153.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 149–154 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, senior performance attribution analyst at a pension fund, is reviewing the fund&#x27;s conventional asset allocation portfolio data for year-end 20X9. The information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex044.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>Durham is considering adding a new equity manager and is evaluating the All-Weather Equity Fund, a 130/30 long-short fund. Fund data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex045.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><p>As part of his evaluation, Durham compares the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.<\/p><p>Durham discusses the All-Weather Equity Fund with Joanna Baran, a peer and coworker. Baran suggests looking at the fund using the fundamental law of active management to better understand performance drivers. Based on this suggestion, Durham requests historical data on the All-Weather Equity Fund&#x27;s transfer coefficient (TC), information coefficient (IC), and breadth (BR) from the fund&#x27;s manager.<\/p><\/div><\/details><div class=\"qtext\"><p>If Durham added a &quot;no shorting&quot; constraint to the Rainy-Day Fund, the optimal amount of active risk would most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q153.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":154,"q":"Which of the following best describes the full fundamental law of active management? Expected return equals:","opts":["(IC)\\BROA","(TC)(IC) \\BR","(TC)(IC) BROA"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a154.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a154.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 149–154 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Paul Durham, senior performance attribution analyst at a pension fund, is reviewing the fund&#x27;s conventional asset allocation portfolio data for year-end 20X9. The information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex044.webp\" style=\"max-width:min(100%,639px)\" alt=\"Exhibit\"><p>Durham is considering adding a new equity manager and is evaluating the All-Weather Equity Fund, a 130/30 long-short fund. Fund data is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex045.webp\" style=\"max-width:min(100%,482px)\" alt=\"Exhibit\"><p>As part of his evaluation, Durham compares the All-Weather Equity Fund with the Rainy-Day Fund, a fund with an unconstrained long-short strategy that also uses the same benchmark. The Rainy-Day Fund has a forecasted information ratio (IR) of 0.30.<\/p><p>Durham discusses the All-Weather Equity Fund with Joanna Baran, a peer and coworker. Baran suggests looking at the fund using the fundamental law of active management to better understand performance drivers. Based on this suggestion, Durham requests historical data on the All-Weather Equity Fund&#x27;s transfer coefficient (TC), information coefficient (IC), and breadth (BR) from the fund&#x27;s manager.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the full fundamental law of active management? Expected return equals:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q154.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":155,"q":"Based on the information provided and Exhibit 1, if an APT arbitrage opportunity did exist between the model equity portfolio and the benchmark index, which of the following is least likely responsible for this outcome?","opts":["The portfolios are not well-diversified.","The universe of suitable investable assets is too limited.","The factor model does not accurately describe asset returns."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a155.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a155.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 155–160 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Ronald Jones, CFA, is a junior analyst at a buy-side firm. Jones has been tasked with evaluating the three domestic equity funds that are used to construct the firm&#x27;s model client equity portfolio. Jones compares the funds to the model portfolio&#x27;s broadly diversified domestic equity benchmark.<\/p><p>The model portfolio equally weights each fund, and Jones has developed the following fundamental single-factor model based on arbitrage pricing theory (APT).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex046.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Jones then constructs a four-factor APT model for Fund A using a 2% risk-free rate, which is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex047.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Jones also creates a new three-factor model for the firm&#x27;s domestic bond fund (DBF) based on industrial production, inflation, and corporate credit spreads. Corporate credit spreads are calculated by comparing the yields on a broad-based corporate bond index to the five-year government benchmark on a monthly basis. The portion of the return not explained by the model was 0.5%. The details of the DBF model are presented in Exhibit 3, and the previous month&#x27;s model inputs are shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex048.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex049.webp\" style=\"max-width:min(100%,661px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information provided and Exhibit 1, if an APT arbitrage opportunity did exist between the model equity portfolio and the benchmark index, which of the following is least likely responsible for this outcome?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q155.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":156,"q":"Based on the information provided and Exhibit 1, the arbitrage opportunity between the model equity portfolio and the benchmark index is best described as:","opts":["no arbitrage opportunity exists.","shorting the benchmark and using the proceeds to buy the portfolio.","shorting the portfolio and using the proceeds to buy the benchmark."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a156.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a156.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 155–160 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ronald Jones, CFA, is a junior analyst at a buy-side firm. Jones has been tasked with evaluating the three domestic equity funds that are used to construct the firm&#x27;s model client equity portfolio. Jones compares the funds to the model portfolio&#x27;s broadly diversified domestic equity benchmark.<\/p><p>The model portfolio equally weights each fund, and Jones has developed the following fundamental single-factor model based on arbitrage pricing theory (APT).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex046.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Jones then constructs a four-factor APT model for Fund A using a 2% risk-free rate, which is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex047.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Jones also creates a new three-factor model for the firm&#x27;s domestic bond fund (DBF) based on industrial production, inflation, and corporate credit spreads. Corporate credit spreads are calculated by comparing the yields on a broad-based corporate bond index to the five-year government benchmark on a monthly basis. The portion of the return not explained by the model was 0.5%. The details of the DBF model are presented in Exhibit 3, and the previous month&#x27;s model inputs are shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex048.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex049.webp\" style=\"max-width:min(100%,661px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information provided and Exhibit 1, the arbitrage opportunity between the model equity portfolio and the benchmark index is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q156.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":157,"q":"Assuming Jones' model in Exhibit 2 is a Carhart four-factor model, it most likely incorporates factor risk premiums that would be considered:","opts":["pure factors.","statistical factors.","market anomalies under CAPM."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a157.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a157.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><s idth:min(100%,540px)\" alt=\"Exhibit\"><p>Jones then constructs a four-factor APT model for Fund A using a 2% risk-free rate, which is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex047.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Jones also creates a new three-factor model for the firm&#x27;s domestic bond fund (DBF) based on industrial production, inflation, and corporate credit spreads. Corporate credit spreads are calculated by comparing the yields on a broad-based corporate bond index to the five-year government benchmark on a monthly basis. The portion of the return not explained by the model was 0.5%. The details of the DBF model are presented in Exhibit 3, and the previous month&#x27;s model inputs are shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex048.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex049.webp\" style=\"max-width:min(100%,661px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>The three-factor model presented in Exhibits 3 and 4 is best described as a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q159.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":160,"q":"Based on the information provided in Exhibits 3 and 4, the return on the domestic bond fund in the previous month is closest to:","opts":["0.72%","1.92%","2.42%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a160.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a160.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 155–160 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ronald Jones, CFA, is a junior analyst at a buy-side firm. Jones has been tasked with evaluating the three domestic equity funds that are used to construct the firm&#x27;s model client equity portfolio. Jones compares the funds to the model portfolio&#x27;s broadly diversified domestic equity benchmark.<\/p><p>The model portfolio equally weights each fund, and Jones has developed the following fundamental single-factor model based on arbitrage pricing theory (APT).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex046.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Jones then constructs a four-factor APT model for Fund A using a 2% risk-free rate, which is presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex047.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Jones also creates a new three-factor model for the firm&#x27;s domestic bond fund (DBF) based on industrial production, inflation, and corporate credit spreads. Corporate credit spreads are calculated by comparing the yields on a broad-based corporate bond index to the five-year government benchmark on a monthly basis. The portion of the return not explained by the model was 0.5%. The details of the DBF model are presented in Exhibit 3, and the previous month&#x27;s model inputs are shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex048.webp\" style=\"max-width:min(100%,416px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex049.webp\" style=\"max-width:min(100%,661px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the information provided in Exhibits 3 and 4, the return on the domestic bond fund in the previous month is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q160.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":161,"q":"Which of Schilling's statements about ETF premiums and discounts is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a161.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a161.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 161–164 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Karsten Knapp and Inna Schilling are financial advisors at Bloxx Investments, a wealth management firm. They are assessing the suitability of ETFs for existing clients who currently invest in mutual funds. Knapp is concerned that ETFs trading at a premium or discount to their NAV may affect clients&#x27; returns. He asks Schilling&#x27;s opinion, and she makes the following statements:<\/p><p>Statement 1: Fixed income ETFs typically have lower premiums and discounts than equity ETFs.<\/p><p>Statement 2: An index with an active futures market contributes to increased premiums and discounts of ETFs benchmarked to that index.<\/p><p>Statement 3: The percentage of foreign securities held and the frequency of trading are factors that influence ETF premiums and discounts.<\/p><p>Knapp and Schilling discuss the total costs of owning an ETF. Schilling explains that trading costs can be a significant portion of total costs, depending on the holding period. She gives Knapp an example based on PJW, an ETF that tracks the S&amp;P 500 Index:<\/p><p>Management fee: 0.30% per year<\/p><p>Commission: 0.08% per trade<\/p><p>Bid-offer spread of 0.14% on purchase and sale<\/p><p>Holding period: 15 months<\/p><p>Schilling then says that ETFs have specific types of risk, and Knapp asks for more details. Schilling gives examples of events related to ETF risks, including &quot;soft&quot; closures.<\/p><p>Lastly, Knapp and Schilling discuss ETF applications and how ETFs can be used to increase the overall efficiency of a portfolio. Schilling tells Knapp that ETFs are often employed, for example, when an active manager moves the portfolio out of a certain asset class or factor that Bloxx&#x27;s clients want to remain exposed to. This temporary gap can be offset by purchasing liquid ETFs and maintaining exposure to that asset class or factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Schilling&#x27;s statements about ETF premiums and discounts is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q161.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":162,"q":"Based on the data Schilling provides, PJW's trading costs as a percentage of total costs are closest to:","opts":["44.4%","50.0%","54.0%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a162.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a162.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 161–164 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Karsten Knapp and Inna Schilling are financial advisors at Bloxx Investments, a wealth management firm. They are assessing the suitability of ETFs for existing clients who currently invest in mutual funds. Knapp is concerned that ETFs trading at a premium or discount to their NAV may affect clients&#x27; returns. He asks Schilling&#x27;s opinion, and she makes the following statements:<\/p><p>Statement 1: Fixed income ETFs typically have lower premiums and discounts than equity ETFs.<\/p><p>Statement 2: An index with an active futures market contributes to increased premiums and discounts of ETFs benchmarked to that index.<\/p><p>Statement 3: The percentage of foreign securities held and the frequency of trading are factors that influence ETF premiums and discounts.<\/p><p>Knapp and Schilling discuss the total costs of owning an ETF. Schilling explains that trading costs can be a significant portion of total costs, depending on the holding period. She gives Knapp an example based on PJW, an ETF that tracks the S&amp;P 500 Index:<\/p><p>Management fee: 0.30% per year<\/p><p>Commission: 0.08% per trade<\/p><p>Bid-offer spread of 0.14% on purchase and sale<\/p><p>Holding period: 15 months<\/p><p>Schilling then says that ETFs have specific types of risk, and Knapp asks for more details. Schilling gives examples of events related to ETF risks, including &quot;soft&quot; closures.<\/p><p>Lastly, Knapp and Schilling discuss ETF applications and how ETFs can be used to increase the overall efficiency of a portfolio. Schilling tells Knapp that ETFs are often employed, for example, when an active manager moves the portfolio out of a certain asset class or factor that Bloxx&#x27;s clients want to remain exposed to. This temporary gap can be offset by purchasing liquid ETFs and maintaining exposure to that asset class or factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the data Schilling provides, PJW&#x27;s trading costs as a percentage of total costs are closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q162.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":163,"q":"Which of the following events is most likely related to the risk of a \"soft\" closure of an ETF?","opts":["Changing the ETF's benchmark","Lending the ETF's underlying securities to short sellers","Using over-the-counter swaps to increase the ETF's returns"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a163.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm  can be offset by purchasing liquid ETFs and maintaining exposure to that asset class or factor.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following events is most likely related to the risk of a &quot;soft&quot; closure of an ETF?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q163.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":164,"q":"The ETF application cited by Schilling is best described as:","opts":["portfolio completion.","portfolio rebalancing.","liquidity management."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a164.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a164.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 161–164 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Karsten Knapp and Inna Schilling are financial advisors at Bloxx Investments, a wealth management firm. They are assessing the suitability of ETFs for existing clients who currently invest in mutual funds. Knapp is concerned that ETFs trading at a premium or discount to their NAV may affect clients&#x27; returns. He asks Schilling&#x27;s opinion, and she makes the following statements:<\/p><p>Statement 1: Fixed income ETFs typically have lower premiums and discounts than equity ETFs.<\/p><p>Statement 2: An index with an active futures market contributes to increased premiums and discounts of ETFs benchmarked to that index.<\/p><p>Statement 3: The percentage of foreign securities held and the frequency of trading are factors that influence ETF premiums and discounts.<\/p><p>Knapp and Schilling discuss the total costs of owning an ETF. Schilling explains that trading costs can be a significant portion of total costs, depe     }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}

    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};

      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}
