x)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex016.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><p>In an effort to add value, Pilot uses active strategies within the active portion of the fixed-income portfolio. Two of the strategies are listed below:<\/p><p>Strategy 1: On an annual basis, the four benchmark domestic fixed-income ETFs are over- or underweighted based on Pilot&#x27;s forecasted returns. The risk model for this strategy is based on the 4 × 4 active return correlation matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/wx048.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Strategy 2: Each quarter, a market timing call is made based on the forecasted performance of the two international ETFs. The ETF expected to relatively outperform is scored &quot;1&quot; and receives 100% allocation; the other is scored &quot;−1&quot; and receives no allocation. Over the past 20 quarters, the market timing call has been right 12 times. The annualized active risk of this strategy is 5.0%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of the following factors most likely indicate that Fund A is a closet index fund?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q049.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":50,"q":"Based on Exhibit 2, which manager has demonstrated the greatest active investment skill?","opts":["Manager X","Manager Y","Manager Z"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a050.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a050.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/ e management of fixed-income in the firm&#x27;s model portfolio, which is constructed in house and includes a combination of passive exchange-traded funds (ETFs) and a proprietary active strategy. The fixed-income portfolio is benchmarked 60% to a broad-based domestic fixed-income index and 40% to a broad-based international fixed-income index.<\/p><p>The domestic fixed-income benchmark index includes four ETFs: one each for government, mortgage-backed, investment grade corporate, and high-yield bonds; these bonds are all equally weighted (25% in the index, 15% in the portfolio). The international fixed-income benchmark includes two ETFs: an equal 50/50 split (ie, 20% in the portfolio) between developed markets and emerging markets.<\/p><p>The five-year historical performance of the in-house fund is listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex015.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex016.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><p>In an effort to add value, Pilot uses active strategies within the active portion of the fixed-income portfolio. Two of the strategies are listed below:<\/p><p>Strategy 1: On an annual basis, the four benchmark domestic fixed-income ETFs are over- or underweighted based on Pilot&#x27;s forecasted returns. The risk model for this strategy is based on the 4 × 4 active return correlation matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/wx048.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Strategy 2: Each quarter, a market timing call is made based on the forecasted performance of the two international ETFs. The ETF expected to relatively outperform is scored &quot;1&quot; and receives 100% allocation; the other is scored &quot;−1&quot; and receives no allocation. Over the past 20 quarters, the market timing call has been right 12 times. The annualized active risk of this strategy is 5.0%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 5, the breadth of Strategy 1 is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q053.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":54,"q":"Based on Strategy 2, and assuming active risk is limited to 3%, the expected annualized active return using Grinold's rule is closest to:","opts":["0.60%","1.00%","1.80%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a054.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a054.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 49–54 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pilot Advisors (Pilot) is considering replacing Fund A in the firm&#x27;s model equity portfolios based on recent historical performance.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex013.webp\" style=\"max-width:min(100%,361px)\" alt=\"Exhibit\"><p>Pilot believes that Fund A is a closet index fund based on the following factors: Factor 1: Active return<\/p><p>Factor 2: Active risk<\/p><p>Factor 3: Sharpe ratio<\/p><p>Pilot has identified three potential replacement funds for Fund A and has analyzed the performance of the funds&#x27; managers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex014.webp\" style=\"max-width:min(100%,588px)\" alt=\"Exhibit\"><p>Pilot is also examining the management of fixed-income in the firm&#x27;s model portfolio, which is constructed in house and includes a combination of passive exchange-traded funds (ETFs) and a proprietary active strategy. The fixed-income portfolio is benchmarked 60% to a broad-based domestic fixed-income index and 40% to a broad-based international fixed-income index.<\/p><p>The domestic fixed-income benchmark index includes four ETFs: one each for government, mortgage-backed, investment grade corporate, and high-yield bonds; these bonds are all equally weighted (25% in the index, 15% in the portfolio). The international fixed-income benchmark includes two ETFs: an equal 50/50 split (ie, 20% in the portfolio) between developed markets and emerging markets.<\/p><p>The five-year historical performance of the in-house fund is listed below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex015.webp\" style=\"max-width:min(100%,419px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex016.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><p>In an effort to add value, Pilot uses active strategies within the active portion of the fixed-income portfolio. Two of the strategies are listed below:<\/p><p>Strategy 1: On an annual basis, the four benchmark domestic fixed-income ETFs are over- or underweighted based on Pilot&#x27;s forecasted returns. The risk model for this strategy is based on the 4 × 4 active return correlation matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/wx048.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><p>Strategy 2: Each quarter, a market timing call is made based on the forecasted performance of the two international ETFs. The ETF expected to relatively outperform is scored &quot;1&quot; and receives 100% allocation; the other is scored &quot;−1&quot; and receives no allocation. Over the past 20 quarters, the market timing call has been right 12 times. The annualized active risk of this strategy is 5.0%.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Strategy 2, and assuming active risk is limited to 3%, the expected annualized active return using Grinold&#x27;s rule is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q054.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":55,"q":"Which of the following statements least likely describes the BM and RP portfolios?","opts":["The BM portfolio is long only, and the RP portfolio is a long/short portfolio.","The underlying factor portfolios are the same for both portfolios and are created from long/short factor portfolios.","Factor exposures for the BM portfolio are equally weighted, and the RP portfolio is equally risk weighted."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a055.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a055.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Marta Nowak is the research director at Eagle Investments, an ETF manager. Eagle is developing a new long-only multifactor equity ETF, and Nowak is responsible for the initial backtesting and strategy development.<\/p><p>Nowak instructs Zibi Turek, research analyst at Eagle, to create and backtest two factor-weighted allocation portfolios: a benchmark (BM) portfolio and a risk parity (RP) portfolio.<\/p><p>The historical investment simulation will use the ETF&#x27;s expected BM securities as the investment universe and include five fundamental factors, the last 10 years of point-in-time data, a rolling-window approach, and monthly rebalancing.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex017.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Turek reviews the results as presented in Exhibit 1 with Nowak and makes the following comment:<\/p><p>&quot;The returns of factor portfolios 1 and 5 are accurately described by a normal distribution.&quot;<\/p><p>Turek reviews Exhibit 2 with Nowak:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex018.webp\" style=\"max-width:min(100%,646px)\" alt=\"Exhibit\"><p>Based on his review of Exhibit 2, Turek makes the following observations:<\/p><p>Observation 1:95% of the time, monthly losses for the BM portfolio will be less than 4.1%.<\/p><p>Observation 2:Once monthly losses for the RP portfolio reach at least 2.4%, 5% of the time losses will be as great as 3.6%.<\/p><p>Observation 3:The RP portfolio&#x27;s single worst monthly return was 11.4%.<\/p><p>To confirm the results of the backtest, Nowak instructs Turek to cross-validate the results.<\/p><p>Finally, Nowak requests that a scenario analysis be performed to determine how the two strategies perform in different market regimes. The results are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex019.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following statements least likely describes the BM and RP portfolios?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q055.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":56,"q":"Turek's comment on the distribution of returns most likely:","opts":["accurately describes the results of the backtest.","underestimates the downside risk of factors 1 and 5.","overestimates the number of outliers in the tails of the distribution."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a056.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a056.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marta Nowak is the research director at Eagle Investments, an ETF manager. Eagle is developing a new long-only multif ns:<\/p><p>Observation 1:95% of the time, monthly losses for the BM portfolio will be less than 4.1%.<\/p><p>Observation 2:Once monthly losses for the RP portfolio reach at least 2.4%, 5% of the time losses will be as great as 3.6%.<\/p><p>Observation 3:The RP portfolio&#x27;s single worst monthly return was 11.4%.<\/p><p>To confirm the results of the backtest, Nowak instructs Turek to cross-validate the results.<\/p><p>Finally, Nowak requests that a scenario analysis be performed to determine how the two strategies perform in different market regimes. The results are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex019.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>To satisfy Nowak&#x27;s instructions to cross-validate the backtest results, which of the following is the most appropriate approach? The same backtest should be performed using:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":60,"q":"Exhibit 3 shows that the best relative risk-adjusted performance for the RP portfolio occurred during the market regimes that involved:","opts":["low inflation and low volatility.","high inflation and low inflation.","high inflation and high volatility."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 55–60 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marta Nowak is the research director at Eagle Investments, an ETF manager. Eagle is developing a new long-only multifactor equity ETF, and Nowak is responsible for the initial backtesting and strategy development.<\/p><p>Nowak instructs Zibi Turek, research analyst at Eagle, to create and backtest two factor-weighted allocation portfolios: a benchmark (BM) portfolio and a risk parity (RP) portfolio.<\/p><p>The historical investment simulation will use the ETF&#x27;s expected BM securities as the investment universe and include five fundamental factors, the last 10 years of point-in-time data, a rolling-window approach, and monthly rebalancing.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex017.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Turek reviews the results as presented in Exhibit 1 with Nowak and makes the following comment:<\/p><p>&quot;The returns of factor portfolios 1 and 5 are accurately described by a normal distribution.&quot;<\/p><p>Turek reviews Exhibit 2 with Nowak:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex018.webp\" style=\"max-width:min(100%,646px)\" alt=\"Exhibit\"><p>Based on his review of Exhibit 2, Turek makes the following observations:<\/p><p>Observation 1:95% of the time, monthly losses for the BM portfolio will be less than 4.1%.<\/p><p>Observation 2:Once monthly losses for the RP portfolio reach at least 2.4%, 5% of the time losses will be as great as 3.6%.<\/p><p>Observation 3:The RP portfolio&#x27;s single worst monthly return was 11.4%.<\/p><p>To confirm the results of the backtest, Nowak instructs Turek to cross-validate the results.<\/p><p>Finally, Nowak requests that a scenario analysis be performed to determine how the two strategies perform in different market regimes. The results are presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex019.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Exhibit 3 shows that the best relative risk-adjusted performance for the RP portfolio occurred during the market regimes that involved:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":61,"q":"All else being equal, based on Exhibit 1, which of the trades most likely had the greatest market impact?","opts":["Trade 1","Trade 2","Trade 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a061.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a061.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–66 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Makore Investments is an asset management firm specializing in US equities. Hugo Dawson, a junior trader at Makore, executes a market buy order for 5,000 shares of Balsa Chem, a thinly traded stock. He fills the order in four trades; details are presented in Exhibit 1. He then calculates the market impact of the trades and their average effective spreads.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex020.webp\" style=\"max-width:min(100%,574px)\" alt=\"Exhibit\"><p>Dawson presents the information to Rose Preston, a senior trader and his supervisor at Makore. Dawson explains he used a trading strategy that consisted of automatically breaking the order into smaller, random-sized orders, which were sent to different exchanges at random times, and that the trades were executed using an electronic broker. He adds that electronic trading systems are faster and cheaper than floor-based trading systems and lists other advantages:<\/p><p>Advantage 1: Electronic trading systems have more liquidity since they are used in most equity and bond trades.<\/p><p>Advantage 2: Electronic trading systems keep audit trails that prevent parasitic traders from manipulating the market.<\/p><p>Advantage 3: When properly programmed, electronic exchange systems are capable of executing orders without any errors.<\/p><p>Preston tells Dawson to sell the stocks of three semiconductor manufacturers since Makore&#x27;s investment committee decided to underweight the industry. She explains that Makore&#x27;s position in the stocks is substantial, and she is concerned about a large decrease in prices before Dawson can complete the sale.<\/p><p>Dawson suggests executing several trades at the same price between different mutual funds managed by Makore. He believes that these trades would increase the liquidity perceived by the market and allow the firm to sell the stocks at better prices. Preston explains that Makore cannot carry out the activity suggested by Dawson since it is an abusive trading practice that manipulates the market.<\/p><p>Dawson then warns that competitors are trading at increasing speeds, which is reducing the effectiveness of the trades. Preston explains that Makore is currently upgrading its computers and optimizing programming codes—two measures expected to reduce latency and increase the firm&#x27;s competitiveness.<\/p><\/div><\/details><div class=\"qtext\"><p>All else being equal, based on Exhibit 1, which of the trades most likely had the greatest market impact?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":62,"q":"Based on Exhibit 1, the average effective spread (S) of the four trades is closest to:","opts":["0.03","0.05","0.06"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 61–66 · Portfolio Management<span class=\"vig-hint\">b  trading strategy that consisted of automatically breaking the order into smaller, random-sized orders, which were sent to different exchanges at random times, and that the trades were executed using an electronic broker. He adds that electronic trading systems are faster and cheaper than floor-based trading systems and lists other advantages:<\/p><p>Advantage 1: Electronic trading systems have more liquidity since they are used in most equity and bond trades.<\/p><p>Advantage 2: Electronic trading systems keep audit trails that prevent parasitic traders from manipulating the market.<\/p><p>Advantage 3: When properly programmed, electronic exchange systems are capable of executing orders without any errors.<\/p><p>Preston tells Dawson to sell the stocks of three semiconductor manufacturers since Makore&#x27;s investment committee decided to underweight the industry. She explains that Makore&#x27;s position in the stocks is substantial, and she is concerned about a large decrease in prices before Dawson can complete the sale.<\/p><p>Dawson suggests executing several trades at the same price between different mutual funds managed by Makore. He believes that these trades would increase the liquidity perceived by the market and allow the firm to sell the stocks at better prices. Preston explains that Makore cannot carry out the activity suggested by Dawson since it is an abusive trading practice that manipulates the market.<\/p><p>Dawson then warns that competitors are trading at increasing speeds, which is reducing the effectiveness of the trades. Preston explains that Makore is currently upgrading its computers and optimizing programming codes—two measures expected to reduce latency and increase the firm&#x27;s competitiveness.<\/p><\/div><\/details><div class=\"qtext\"><p>The upgrades of Makore&#x27;s computers and optimization of programming codes will most likely reduce latency associated with:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q066.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":67,"q":"Based on Exhibit 1, and the parametric VaR with a 1% significance level, Waitaki Equities Fund is expected to experience a minimum annual loss (NZD millions) closest to:","opts":["5.0","38.6","62.0"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a067.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a067.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 67–72 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Vanessa Wells is a senior portfolio manager at Mohaka Asset Management, a firm that manages funds and portfolios of international bonds and equities. She is reviewing the firm&#x27;s latest risk report with Duncan Boyd, a risk analyst at Mohaka. Wells wants to understand the current risk exposure of Waitaki Equities, a large cap fund managed by Mohaka, and Boyd presents the following details:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex021.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Boyd calculates Waitaki&#x27;s daily and annual parametric value at risk (VaR), assuming that the statistical properties of the return distribution remain constant across the year. He says that the concept of VaR has several advantages and can be estimated using three methods: parametric, historical simulation, and Monte Carlo. Then he makes the following observations:<\/p><p>Observation 1:The parametric method allows giving a greater weight to more recent observations.<\/p><p>Observation 2:The historical simulation method is not well suited for assessing the risk of options.<\/p><p>Observation 3:The Monte Carlo method can accommodate virtually any type of distribution.<\/p><p>Wells tells Boyd that since the Waitaki fund is measured against the market index, she is particularly interested in a risk measure that takes the benchmark into consideration. Boyd proposes applying a risk measure to a theoretical portfolio that consists of a long position in the total value of the Waitaki Equities Fund and a short position in the benchmark&#x27;s holdings, proportional to the fund value. Boyd explains that there are other risk metrics that can improve the risk assessment of Mohaka&#x27;s products, like sensitivity risk and scenario risk measures. He says, &quot;Sensitivity risk measures—such as beta, convexity, and vega—measure the portfolio&#x27;s exposure to changes in underlying risk factors.&quot;<\/p><p>Boyd adds that scenario risk measures such as historical scenarios and hypothetical scenarios allow for testing the effect of past or unprecedented market movements on the value of a portfolio. However, he explains to Wells, such measures also have important limitations:<\/p><p>Limitation 1: Scenario risk measures do not allow taking liquidity into account.<\/p><p><b>Limitation 2:<\/b> It is difficult to attribute probabilities to each scenario.<\/p><p><b>Limitation 3:<\/b> Scenario risk measures focus exclusively on extreme losses, without considering gains.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, and the parametric VaR with a 1% significance level, Waitaki Equities Fund is expected to experience a minimum annual loss (NZD millions) closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q067.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":68,"q":"Which of the following is an advantage of VaR? VaR:","opts":["can be verified using backtesting.","is not subject to discretionary choices.","adequately estimates the frequency of left-tail events."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a068.webp\" target=\"_bl ies (WDT). Harris sees the order and assesses the current trading details on WDT.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex022.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>Due to the size of the order and the intraday price weakness of WDT, Harris decides to immediately sell 2,000 shares. Instead of routing the order to a specific broker, Harris enters the order into Chesterfield&#x27;s trade execution system at the midpoint price of $20.13. The 2,000 shares are immediately filled at $20.13, as the trading software found hidden liquidity in a dark pool. Harris then enters an order to sell an additional 1,000 share order at $20.13, but this order goes unfilled and the stock trades lower.<\/p><p>Harris holds the remaining 18,000 shares, anticipating that more liquidity will develop at better prices. Unfortunately, the stock continues to trade lower as the day progresses, falling to $19.95. Harris and Dickinson discuss the situation and decide to wait until the next day to fill the remainder of the order in hopes of selling at $20 or better.<\/p><p>The next morning, indications are that WDT will open at $19.65. Harris electronically instructs Broker A to use a volume-weighted average price (VWAP) algorithm for the remaining 18,000 shares over the course of the trading day. For the day, 180,000 shares of WDT traded, the benchmark VWAP was $19.89, and Harris&#x27;s order was filled at $19.87, resulting in an average price for the entire 20,000 shares of approximately $19.90.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the inside spread is closest to ($):<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q073.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":74,"q":"Based on Exhibit 1, the effective spread on the initial 2,000 shares is closest to ($):","opts":["zero","0.0035","0.0176"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWor "l2img/uw-pm/q078.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":79,"q":"Based on Exhibit 1, Horizonte's monthly 5% parametric VaR estimate is closest to:","opts":["8.09%","8.68%","11.67%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a079.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a079.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 79–84 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Alberto Aguiar is a risk analyst at a long-only asset management firm. Horizonte Balanced Fund, one of the funds managed by the firm, has a diversified portfolio that invests in an equities subportfolio and in a fixed income subportfolio. Aguiar uses the parametric method to estimate Horizonte&#x27;s value at risk (VaR) based on the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex023.webp\" style=\"max-width:min(100%,495px)\" alt=\"Exhibit\"><p>Marcela Velasco, the firm&#x27;s chief risk officer, explains to Aguiar that the fixed income subportfolio may also include callable and putable bonds. Therefore, Velasco believes that the parametric method may not be the most appropriate VaR method for the Horizonte Balanced Fund.<\/p><p>Velasco is concerned about the allocation of risk to each of the firm&#x27;s trading units and asks Aguiar about firm-wide risk management. Aguiar makes the following observations:<\/p><p>Observation 1:In an optimal risk allocation, the sum of each trading unit&#x27;s individual risk budget should exceed the firm&#x27;s overall risk budget.<\/p><p>Observation 2:Restrictive risk limits may result in considerable losses.<\/p><p>Velasco tells Aguiar that one limitation of VaR is its vulnerability to trending markets. A portfolio can have several consecutive losses that individually do not exceed the VaR amount but that collectively result in a substantial loss. She asks Aguiar what he would suggest to address this limitation of VaR.<\/p><p>Velasco is preparing a presentation about fund risk for the firm&#x27;s management committee. All funds managed by the firm are long-only, unleveraged, and open-ended. She divides her presentation into two parts:<\/p><p>Part 1: Velasco explains how the risk exposure of a fund is estimated. Initially, she calculates the portfolio&#x27;s reaction to small changes in risk factors, such as the equity risk premium and interest rates. Then she constructs extremely adverse scenarios and assesses their impact on the portfolio.<\/p><p>Part 2: Velasco addresses how risk measures can be used to improve the firm&#x27;s capital allocation decisions since the firm invests most of its own capital in the funds it manages. Velasco assesses the risk of each fund using appropriate risk measures. Then she suggests to the committee the most risk-efficient allocation of the firm&#x27;s capital into each fund.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Horizonte&#x27;s monthly 5% parametric VaR estimate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q079.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":80,"q":"For a portfolio with callable and putable bonds, which of the following is an appropriate VaR method?","opts":["Only the Monte Carlo method","Only the historical simulation method","Either the historical simulation or Monte Carlo method"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a080.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a080.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 79 budget.<\/p><p>Observation 2:Restrictive risk limits may result in considerable losses.<\/p><p>Velasco tells Aguiar that one limitation of VaR is its vulnerability to trending markets. A portfolio can have several consecutive losses that individually do not exceed the VaR amount but that collectively result in a substantial loss. She asks Aguiar what he would suggest to address this limitation of VaR.<\/p><p>Velasco is preparing a presentation about fund risk for the firm&#x27;s management committee. All funds managed by the firm are long-only, unleveraged, and open-ended. She divides her presentation into two parts:<\/p><p>Part 1: Velasco explains how the risk exposure of a fund is estimated. Initially, she calculates the portfolio&#x27;s reaction to small changes in risk factors, such as the equity risk premium and interest rates. Then she constructs extremely adverse scenarios and assesses their impact on the portfolio.<\/p><p>Part 2: Velasco addresses how risk measures can be used to improve the firm&#x27;s capital allocation decisions since the firm invests most of its own capital in the funds it manages. Velasco assesses the risk of each fund using appropriate risk measures. Then she suggests to the committee the most risk-efficient allocation of the firm&#x27;s capital into each fund.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following constraints most appropriately addresses VaR&#x27;s vulnerability to trending markets?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q082.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":83,"q":"The risk tools described in Part 1 of Velasco's presentation are best described as:","opts":["multifactor scenario analysis and VaR.","sensitivity risk measures and stress tests.","incremental VaR and historical scenarios."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a083.webp\" tar d by the firm are long-only, unleveraged, and open-ended. She divides her presentation into two parts:<\/p><p>Part 1: Velasco explains how the risk exposure of a fund is estimated. Initially, she calculates the portfolio&#x27;s reaction to small changes in risk factors, such as the equity risk premium and interest rates. Then she constructs extremely adverse scenarios and assesses their impact on the portfolio.<\/p><p>Part 2: Velasco addresses how risk measures can be used to improve the firm&#x27;s capital allocation decisions since the firm invests most of its own capital in the funds it manages. Velasco assesses the risk of each fund using appropriate risk measures. Then she suggests to the committee the most risk-efficient allocation of the firm&#x27;s capital into each fund.<\/p><\/div><\/details><div class=\"qtext\"><p>The risk tools described in Part 1 of Velasco&#x27;s presentation are best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q083.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":84,"q":"In Part 2 of Velasco's presentation, which of the following risk measures is most appropriate to assess the risk of the firm's mutual funds?","opts":["Liquidity gap","Surplus at risk","Redemption risk"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a084.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a084.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 79–84 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Alberto Aguiar is a risk analyst at a long-only asset management firm. Horizonte Balanced Fund, one of the funds managed by the firm, has a diversified portfolio that invests in an equities subportfolio and in a fixed income subportfolio. Aguiar uses the parametric method to estimate Horizonte&#x27;s value at risk (VaR) based on the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex023.webp\" style=\"max-width:min(100%,495px)\" alt=\"Exhibit\"><p>Marcela Velasco, the firm&#x27;s chief risk officer, explains to Aguiar that the fixed income subportfolio may also include callable and putable bonds. Therefore, Velasco believes that the parametric method may not be the most appropriate VaR method for the Horizonte Balanced Fund.<\/p><p>Velasco is concerned about the allocation of risk to each of the firm&#x27;s trading units and asks Aguiar about firm-wide risk management. Aguiar makes the following observations:<\/p><p>Observation 1:In an optimal risk allocation, the sum of each trading unit&#x27;s individual risk budget should exceed the firm&#x27;s overall risk budget.<\/p><p>Observation 2:Restrictive risk limits may result in considerable losses.<\/p><p>Velasco tells Aguiar that one limitation of VaR is its vulnerability to trending markets. A portfolio can have several consecutive losses that individually do not exceed the VaR amount but that collectively result in a substantial loss. She asks Aguiar what he would suggest to address this limitation of VaR.<\/p><p>Velasco is preparing a presentation about fund risk for the firm&#x27;s management committee. All funds managed by the firm are long-only, unleveraged, and open-ended. She divides her presentation into two parts:<\/p><p>Part 1: Velasco explains how the risk exposure of a fund is estimated. Initially, she calculates the portfolio&#x27;s reaction to small changes in risk factors, such as the equity risk premium and interest rates. Then she constructs extremely adverse scenarios and assesses their impact on the portfolio.<\/p><p>Part 2: Velasco addresses how risk measures can be used to improve the firm&#x27;s capital allocation decisions since the firm invests most of its own capital in the funds it manages. Velasco assesses the risk of each fund using appropriate risk measures. Then she suggests to the committee the most risk-efficient allocation of the firm&#x27;s capital into each fund.<\/p><\/div><\/details><div class=\"qtext\"><p>In Part 2 of Velasco&#x27;s presentation, which of the following risk measures is most appropriate to assess the risk of the firm&#x27;s mutual funds?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q084.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":85,"q":"If an ETF is trading at a discount to its iNAV and arbitrage costs are low, an AP may profit by:","opts":["selling ETF shares and buying the basket of securities.","exchanging ETF shares for the basket of securities with the ETF issuer.","buying ETF creation units in the secondary market and selling the basket of securities."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a085.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a085.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 85–88 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Devin Garner is a senior sales executive at Finaxen Investments, a wealth management firm. Garner&#x27;s clients have begun to ask him about investing in ETFs, so he asks Jody Rosales, a portfolio manager at Finaxen, to help him better understand the mechanics of ETFs. Rosales explains the creation/redemption process and the role of authorized participants (APs). She also discusses the arbitrage opportunities for APs when an ETF is trading at a premium or discount to the intraday indicated NAV (iNAV) of its basket of securities.<\/p><p>Rosales tells Garner that a fundamental feature of ETFs is their ability to track the underlying index, and similar ETFs with the same benchmark may have different tracking errors. For example, she continues, if ETF 1 and ETF 2 track the same global equities index and ETF 1 has a higher tracking error than ETF 2, this could result from differences in the ETFs&#x27; characteristics. She lists three differences between ETF 1 and ETF 2:<\/p><p>Difference 1: ETF 1 holds American depositary receipts (ADRs) if local markets have low liquidity, whereas ETF 2 holds shares in each local market.<\/p><p>Difference 2: ETF 1 holds all constituent shares of the index, whereas ETF 2 optimizes its portfolio by holding a representative sample.<\/p><p>Difference 3: ETF 1 has a lower expense ratio than ETF 2.<\/p><p>Garner asks about the costs of investing in ETFs. Rosales explains that although ETFs typically have lower expense ratios than mutual funds, the bid-ask spread is an important cost component of ETFs. She explains that there are significant differences in bid-ask spreads among ETF categories and presents the spreads of ETF 3 and ETF 4 in Exhibit 1. Garner asks Rosales to explain possible reasons for that difference.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex024.webp\" style=\"max-width:min(100%,564px)\" alt=\"Exhibit\"><p>Finally, as Garner also sells European securities to his clients, he asks Rosales to discuss the main characteristics of ETF trading in Europe.<\/p><\/div><\/details><div class=\"qtext\"><p>If an ETF is trading at a discount to its iNAV and arbitrage costs are low, an AP may profit by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q085.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":86,"q":"Which of the following differences best explains ETF 1's higher tracking error?","opts":["Difference 1","Difference 2","Difference 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a086.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a086.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 85–88 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Devin Garner is a senior sales executive at Finaxen Investments, a wealth management firm. Garner&#x27;s clients have begun to ask him about investing in ETFs, so he asks Jody Rosales, a portfolio manager at Finaxen, to help him better understand the mechanics of ETFs. Rosales explains the creation/redemption process and the role of authorized participants (APs). She also discusses the arbitrage opportunities for APs when an ETF is trading at a premium or discount to the intraday indicated NAV (iNAV) of its basket of securities.<\/p><p>Rosales tells Garner that a fundamental feature of ETFs is their ability to track the underlying index, and similar ETFs with the same benchmark may have different tracking errors. For example, she continues, if ETF 1 and ETF 2 track the same global equities index and ETF 1 has a higher tracking error than ETF 2, this could result from differences in the ETFs&#x27; characteristics. She lists three differences between ETF 1 and ETF 2:<\/p><p>Difference 1: ETF 1 holds American depositary receipts (ADRs) if local markets have low liquidity, whereas ETF 2 holds shares in each local market.<\/p><p>Difference 2: ETF 1 holds all constituent shares of the index, whereas ETF 2 optimizes its portfolio by holding a representative sample.<\/p><p>Difference 3: ETF 1 has a lower expense ratio than ETF 2.<\/p><p>Garner asks about the costs of investing in ETFs. Rosales explains that although ETFs typically have lower expense ratios than mutual funds, the bid-ask spread is an important cost component of ETFs. She explains that there are significant differences in bid-ask spreads among ETF categories and presents the spreads of ETF 3 and ETF 4 in Exhibit 1. Garner asks Rosales to explain possible reasons for that difference.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex024.webp\" style=\"max-width:min(100%,564px)\" alt=\"Exhibit\"><p>Finally, as Garner also sells European securities to his clients, he asks Rosales to discuss the main characteristics of ETF trading in Europe.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following differences best explains ETF 1&#x27;s higher tracking error?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q086.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":87,"q":"Which of the following most likely contributes to ETF 4's wider bid-ask spread?","opts":["ETF 4 has greater ongoing order flow than ETF 3.","ETF 4 holds less-liquid underlying securities than ETF 3.","ETF 4 has a greater number of market makers than ETF 3."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a087.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a087.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 85–88 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Devin Garner is a senior sales executive at Finaxen Investments, a wealth management firm. Garner&#x27;s clients have begun to ask him about investing in ETFs, so he asks Jody Rosales, a portfolio manager at Finaxen, to help him better understand the mechanics of ETFs. Rosales explains the creation/redemption process and the role of authorized participants (APs). She also discusses the arbitrage opportunities for APs when an ETF is trading at a premium or discount to the intraday indicated NAV (iNAV) of its basket of securities.<\/p><p>Rosales tells Garner that a fundamental feature of ETFs is their ability to track the underlying index, and similar ETFs with the same benchmark may have different tracking errors. For example, she continues, if ETF 1 and ETF 2 track the same global equities index and ETF 1 has a higher tracking error than ETF 2, this could result from differences in the ETFs&#x27; characteristics. She lists three differences between ETF 1 and ETF 2:<\/p><p>Difference 1: ETF 1 holds American depositary receipts (ADRs) if local markets have low liquidity, whereas ETF 2 holds shares in each local market.<\/p><p>Difference 2: ETF 1 holds all constituent shares of the index, whereas ETF 2 optimizes its portfolio by holding a representative sample.<\/p><p>Difference 3: ETF 1 has a lower expense ratio than ETF 2.<\/p><p>Garner asks about the costs of investing in ETFs. Rosales explains that although ETFs typically have lower expense ratios than mutual funds, the bid-ask spread is an important cost component of ETFs. She explains that there are significant differences in bid-ask spreads among ETF categories and presents the spreads of ETF 3 and ETF 4 in Exhibit 1. Garner asks Rosales to explain possible reasons for that difference.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex024.webp\" style=\"max-width:min(100%,564px)\" alt=\"Exhibit\"><p>Finally, as Garner also sells European securities to his clients, he asks Rosales to discuss the main characteristics of ETF trading in Europe.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following most likely contributes to ETF 4&#x27;s wider bid-ask spread?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q087.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":88,"q":"In Europe, the majority of ETF transactions are:","opts":["negotiated over the counter.","carried out by retail investors.","cleared and settled through a centralized platform."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a088.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a088.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 85–88 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Devin Garner is a senior sales executive at Finaxen Investments, a wealth management firm. Garner&#x27;s clients have begun to ask him about investing in ETFs, so he asks Jody Rosales, a portfolio manager at Finaxen, to help him better understand the mechanics of ETFs. Rosales explains the creation/redemption process and the role of authorized participants (APs). She also discusses the arbitrage opportunities for APs when an ETF is trading at a premium or discount to the intraday indicated NAV (iNAV) of its basket of securities.<\/p><p>Rosales tells Garner that a fundamental feature of ETFs is their ability to track the underlying index, and similar ETFs with the same benchmark may have different tracking errors. For example, she continues, if ETF 1 and ETF 2 track the same global equities index and ETF 1 has a higher tracking error than ETF 2, this could result from differences in the ETFs&#x27; characteristics. She lists three differences between ETF 1 and ETF 2:<\/p><p>Difference 1: ETF 1 holds American depositary receipts (ADRs) if local markets have low liquidity, whereas ETF 2 holds shares in each local market.<\/p><p>Difference 2: ETF 1 holds all constituent shares of the index, whereas ETF 2 optimizes its portfolio by holding a representative sample.<\/p><p>Difference 3: ETF 1 has a lower expense ratio than ETF 2.<\/p><p>Garner asks about the costs of investing in ETFs. Rosales explains that although ETFs typically have lower expense ratios than mutual funds, the bid-ask spread is an important cost component of ETFs. She explains that there are significant differences in bid-ask spreads among ETF categories and presents the spreads of ETF 3 and ETF 4 in Exhibit 1. Garner asks Rosales to explain possible reasons for that difference.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex024.webp\" style=\"max-width:min(100%,564px)\" alt=\"Exhibit\"><p>Finally, as Garner also sells European securities to his clients, he asks Rosales to discuss the main characteristics of ETF trading in Europe.<\/p><\/div><\/details><div class=\"qtext\"><p>In Europe, the majority of ETF transactions are:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q088.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":89,"q":"The allocation to one of the emerging market ETFs in client portfolios best describes which type of asset class exposure?","opts":["Tactical","Dynamic","Strategic"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a089.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a089.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 89–94 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Richard LeBlanc, CFA, is evaluating the investment merits of the Universal Emerging Market Bond (UEMB) ETF and the Acme Emerging Market Bond (AEMB) ETF. Based on his short-to-intermediate term market views, LeBlanc is considering replacing a portion of a US government bond mutual fund held in client portfolios with one of these two ETFs. He hopes to achieve two objectives: generating additional returns while also providing diversification benefits.<\/p><p>Both ETFs trade on a US exchange and invest in USD-denominated sovereign emerging market bonds. They also share the same benchmark, the Total Emerging Market Bond Index, which consists of 2,035 underlying securities.<\/p><p>Information on the ETFs and their performance is listed in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex025.webp\" style=\"max-width:min(100%,329px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Late in the US trading day, the US Federal Reserve (Fed) unexpectedly raises interest rates, sending US bond yields higher and reversing gains from earlier in the day. After the Fed&#x27;s announcement, LeBlanc observes the trading activity shown in Exhibits 3 and 4, which compare the ETFs with both the benchmark and historical tracking data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex027.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex028.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>The allocation to one of the emerging market ETFs in client portfolios best describes which type of asset class exposure?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q089.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":90,"q":"Which of the following statements best describes the ETFs' historical performance? Based on Exhibit 2 and compared with AEMB, UMB's tracking difference is smaller in:","opts":["all time periods.","the 1-year period only.","the 5-year and 10-year periods only."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a090.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a090.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 89–94 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Richard LeBlanc, CFA, is evaluating the investment merits of the Universal Emerging Market Bond (UEMB) ETF and the Acme Emerging Market Bond (AEMB) ETF. Based on his short-to-intermediate term market views, LeBlanc is considering replacing a portion of a US government bond mutual fund held in client portfolios with one of these two ETFs. He hopes to achieve two objectives: generating additional returns while also providing diversification benefits.<\/p><p>Both ETFs trade on a US exchange and invest in USD-denominated sovereign emerging market bonds. They also share the same benchmark, the Total Emerging Market Bond Index, which consists of 2,035 underlying securities.<\/p><p>Information on the ETFs and their performance is listed in Exhibits 1 and 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex025.webp\" style=\"max-width:min(100%,329px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Late in the US trading day, the US Federal Reserve (Fed) unexpectedly raises interest rates, sending US bond yields higher and reversing gains from earlier in the day. After the Fed&#x27;s announcement, LeBlanc observes the trading activity shown in Exhibits 3 and 4, which compare the ETFs with both the benchmark and historical tracking data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex027.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex028.webp\" style=\"max-width:min(100%,575px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following statements best describes the ETFs&#x27; historical performance? Based on Exhibit 2 and compared with AEMB, UMB&#x27;s tracking difference is smaller in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/  firm&#x27;s global small-cap equity (GSCE) strategy. Innovation uses a traditional long-only portfolio construction process for GSCE, which prohibits shorting and leverage. Innovation&#x27;s investment process currently screens for estimated free cash flow yield to identify suitable investment candidates, but this strategy has not been statistically backtested.<\/p><p>Smith believes a backtest based on the most recent 30 years of data and that uses the historical earnings yield as the sole factor could lead to better investment results. Smith will conduct a rolling window backtest with a monthly rebalance, using the current constituents of the Russell 3000 Index (a cap-weighted index that tracks the 3,000 largest US public corporations) as the investment universe. Smith&#x27;s data vendor does not provide point-in-time data, but transaction costs will be included in the analysis.<\/p><p>Rachel Wilmer, a small-cap research analyst at Innovation, questions the need for this analysis and makes the following statements:<\/p><p>Statement 1: Backtesting provides no value to traditional bottom-up managers since it relies on backward-looking data for stock selection.<\/p><p>Statement 2: A single-factor backtesting strategy is most appropriate for risk parity portfolios.<\/p><p>Statement 3: Hedged long/short managers can more fully implement the backtest&#x27;s results.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes why Smith believes backtesting can lead to better results? Backtesting:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q095.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":96,"q":"Which of Wilmer's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a096.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ l nsumption outcomes.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2 and Hirata&#x27;s estimates, the current price of the Champion bond (per $1.00 of par) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q105.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":106,"q":"Which of the statements about the equity risk premium is (are) correct?","opts":["Only Hirata's statement","Only Dawson's statement","Both Hirata's and Dawson's statements"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a106.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a106.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 101–106 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Emiko Hirata is a portfolio manager at an investment management firm. Hirata is talking to Caleb Dawson, an economist at the firm, about the current state of the economy. Dawson begins by talking about economic theory and how changes in consumer behavior can affect asset prices.<\/p><p>Dawson states that investors&#x27; marginal utility from current consumption is declining, which can affect the price of bonds. Dawson also observes that wealthier individuals are investing more and therefore their ownership percentage of the investment assets is increasing, which may affect asset prices, returns, and savings rates.<\/p><p>Hirata and Dawson turn their attention to the central bank&#x27;s monetary policy. The central bank has maintained a low policy rate of 0.5% through the current recession and has not indicated plans to change it. Dawson collects current information on the economy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex029.webp\" style=\"max-width:min(100%,324px)\" alt=\"Exhibit\"><p>Dawson notes that factors other than the central bank&#x27;s policy rate can affect the real interest rate; specifically, factors related to real GDP are among the primary factors for determining real interest rates.<\/p><p>Hirata holds a 2-year, zero-coupon bond for Champion Manufacturing in her portfolio and plans to sell it in one year. She asks Dawson what the price should be today if the price of the bond in one year is estimated to be:<\/p><p>$0.97 per $1.00 of par in a good economy or<\/p><p>$0.87 per $1.00 of par in a bad economy.<\/p><p>Dawson provides estimates for probabilities of each state and investors&#x27; intertemporal rate of substitution:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex030.webp\" style=\"max-width:min(100%,400px)\" alt=\"Exhibit\"><p>Hirata and Dawson then discuss equity investments and the equity risk premium and make the following statements:<\/p><p>Hirata: The risk premium for investing in corporate debt over government debt is not sufficient to justify discounting equities.<\/p><p><b>Dawson:<\/b> The equity risk premium is driven in part by its poor hedging properties against bad consumption outcomes.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements about the equity risk premium is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q106.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":107,"q":"Cyclops's strategy to have the fund sub-advised by four management teams is best described as:","opts":["position limits.","capital allocation.","risk decomposition."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a107.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a107.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 107–112 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Cyclops Partners is a hedge fund manager. Ramesh Singh, the chief risk officer at Cyclops, is responsible for monitoring and reporting both portfolio and firm-wide risks to senior management.<\/p><p>One of the firm&#x27;s funds operates as a long/short, market-neutral equity strategy and has €100,000,000 in assets. The fund is benchmarked to:<\/p><p>the risk-free rate, with gross equity exposure of 200%, and<\/p><p>net equity exposure of zero.<\/p><p>The fund is sub-advised by four separate internal teams, each with a risk budget based on the expected tail risk of the team&#x27;s sub-portfolio. The resulting overall portfolio is broadly diversified and, when necessary, the firm&#x27;s managers use an option overlay strategy consisting of index options to fine-tune the fund&#x27;s net market exposure.<\/p><p>The market values in the portfolio are within an acceptable risk tolerance; however, the portfolio&#x27;s net beta position is currently outside acceptable levels. The fund&#x27;s current positions are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex031.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Singh asks Ahana Agarwal, a newly hired junior risk analyst, to review the results of a value-at-risk (VaR) analysis on the fund, the results of which are presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex032.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><p>Singh then states there are three standard VaR approaches used at Cyclops:<\/p><p><b>Approach 1:<\/b> One-day 5% historical simulation VaR with a lookback period of five years<\/p><p><b>Approach 2:<\/b> Monthly 1% parametric VaR<\/p><p><b>Approach 3:<\/b> Annual 16% Monte Carlo simulation VaR<\/p><p>Singh states that he prefers Approach 1 for this portfolio. However, Agarwal interjects and recommends that, in this instance, either Approach 2 or Approach 3 would be more appropriate.<\/p><p>Finally, Agarwal suggests that additional risk measures should be included in the risk assessment and that the portfolio should be stress-tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Cyclops&#x27;s strategy to have the fund sub-advised by four management teams is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q107.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":108,"q":"Based on this scenario, which of the following risk measures is most appropriate for evaluating the risk of the fund?","opts":["VaR","Ex post tracking error","Ex ante tracking error"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a108.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a108.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 107–112 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Cyclops Partners is a hedge fund manager. Ramesh Singh, the chief risk officer at Cyclops, is responsible for monitoring and reporting both portfolio and firm-wide risks to senior management.<\/p><p>One of the firm&#x27;s funds operates as a long/short, market-neutral equity strategy and has €100,000,000 in assets. The fund is benchmarked to:<\/p><p>the risk-free rate, with gross equity exposure of 200%, and<\/p><p>net equity exposure of zero.<\/p><p>The fund is sub-advised by four separate internal teams, each with a risk budget based on the expected tail risk of the team&#x27;s sub-portfolio. The resulting overall portfolio is broadly diversified and, when necessary, the firm&#x27;s managers use an option overlay strategy con e results of a value-at-risk (VaR) analysis on the fund, the results of which are presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex032.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><p>Singh then states there are three standard VaR approaches used at Cyclops:<\/p><p><b>Approach 1:<\/b> One-day 5% historical simulation VaR with a lookback period of five years<\/p><p><b>Approach 2:<\/b> Monthly 1% parametric VaR<\/p><p><b>Approach 3:<\/b> Annual 16% Monte Carlo simulation VaR<\/p><p>Singh states that he prefers Approach 1 for this portfolio. However, Agarwal interjects and recommends that, in this instance, either Approach 2 or Approach 3 would be more appropriate.<\/p><p>Finally, Agarwal suggests that additional risk measures should be included in the risk assessment and that the portfolio should be stress-tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the best set of additional risk measures for this portfolio?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q111.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":112,"q":"Based on the information provided, which of the following scenario risk measures are most appropriate for this portfolio?","opts":["Single factor stress test and reverse stress test","Reverse stress test and multifactor scenario analysis","Single factor stress test and multifactor scenario analysis"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a112.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a112.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 107–112 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Cyclops Partners is a hedge fund manager. Ramesh Singh, the chief risk officer at Cyclops, is responsible for monitoring and reporting both portfolio and firm-wide risks to senior management.<\/p><p>One of the firm&#x27;s funds operates as a long/short, market-neutral equity strategy and has €100,000,000 in assets. The fund is benchmarked to:<\/p><p>the risk-free rate, with gross equity exposure of 200%, and<\/p><p>net equity exposure of zero.<\/p><p>The fund is sub-advised by four separate internal teams, each with a risk budget based on the expected tail risk of the team&#x27;s sub-portfolio. The resulting overall portfolio is broadly diversified and, when necessary, the firm&#x27;s managers use an option overlay strategy consisting of index options to fine-tune the fund&#x27;s net market exposure.<\/p><p>The market values in the portfolio are within an acceptable risk tolerance; however, the portfolio&#x27;s net beta position is currently outside acceptable levels. The fund&#x27;s current positions are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex031.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Singh asks Ahana Agarwal, a newly hired junior risk analyst, to review the results of a value-at-risk (VaR) analysis on the fund, the results of which are presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex032.webp\" style=\"max-width:min(100%,479px)\" alt=\"Exhibit\"><p>Singh then states there are three standard VaR approaches used at Cyclops:<\/p><p><b>Approach 1:<\/b> One-day 5% historical simulation VaR with a lookback period of five years<\/p><p><b>Approach 2:<\/b> Monthly 1% parametric VaR<\/p><p><b>Approach 3:<\/b> Annual 16% Monte Carlo simulation VaR<\/p><p>Singh states that he prefers Approach 1 for this portfolio. However, Agarwal interjects and recommends that, in this instance, either Approach 2 or Approach 3 would be more appropriate.<\/p><p>Finally, Agarwal suggests that additional risk mea mestic investors<\/p><p><b>Condition 2:<\/b> bond returns being negatively correlated with GDP growth<\/p><p><b>Condition 3:<\/b> the fact that government bond risk premiums are static<\/p><p>Jones then compiles data on several five-year corporate bonds that are held by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex038.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><p>Jones shifts his attention to the firm&#x27;s high-yield bond fund and notes that the fund holds more than 400 positions and has not experienced a default during the past five years. Jones then observes:<\/p><p>Observation 1:The default risk for this portfolio has been diversified away.<\/p><p>Observation 2:The business cycle obviously impacts the credit spreads on individual securities, but at the fund level, credit spreads are stable.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided and the Taylor Rule, which of the following is most likely? The:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q119.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":120,"q":"If Jones's economic forecasts are realized over the next year and the central bank reacts in a conventional manner, the slope of the yield curve is most likely to:","opts":["flatten.","steepen.","remain unchanged."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a120.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a120.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 119–124 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Jones, a fixed income analyst at a large investment management firm, is evaluating domestic monetary policy and the overall interest rate environment within the context of the business cycle. Jones observes that the last recession was six years ago, and over the past few years the domestic economy has experienced consistent growth of about 3.0%. Jones forecasts GDP growth will peak this year at 3.5% and inflation will accelerate.<\/p><p>The current central bank policy rate is 1.50% and has been unchanged for several years. Using the Taylor Rule, Jones calculates a policy rate of 4.50%. The yield curve is positively sloped with short-term bond yields anchored by the policy rate while the long-term government bond is yielding 4.00%.<\/p><p>Jones then suggests that consumption hedging properties embedded in government bond risk premiums are due to the following conditions:<\/p><p><b>Condition 1<\/b> the lack of currency risk for domestic investors<\/p><p><b>Condition 2:<\/b> bond returns being negatively correlated with GDP growth<\/p><p><b>Condition 3:<\/b> the fact that government bond risk premiums are static<\/p><p>Jones then compiles data on several five-year corporate bonds that are held by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex038.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><p>Jones shifts his attention to the firm&#x27;s high-yield bond fund and notes that the fund holds more than 400 positions and has not experienced a default during the past five years. Jones then observes:<\/p><p>Observation 1:The default risk for this portfolio has been diversified away.<\/p><p>Observation 2:The business cycle obviously impacts the credit spreads on individual securities, but at the fund level, credit spreads are stable.<\/p><\/div><\/details><div class=\"qtext\"><p>If Jones&#x27;s economic forecasts are realized over the next year and the central bank reacts in a conventional manner, the slope of the yield curve is most likely to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q120.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":121,"q":"Which of Jones's conditions correctly identifies why government bond risk premiums may have consumption hedging properties?","opts":["Condition 1","Condition 2","Condition 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a121.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a121.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 119–124 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>John Jones, a fixed income analyst at a large investment management firm, is evaluating domestic monetary policy and the overall interest rate environment within the context of the business cycle. Jones observes that the last recession was six years ago, and over the past few years the domestic economy has experienced consistent growth of about 3.0%. Jones forecasts GDP growth will peak this year at 3.5% and inflation will accelerate.<\/p><p>The current central bank policy rate is 1.50% and has been unchanged for several years. Using the Taylor Rule, Jones calculates a policy rate of 4.50%. The yield curve is positively sloped with short-term bond yields anchored by the policy rate while the long-term government bond is yielding 4.00%.<\/p><p>Jones then suggests that consumption hedging properties embedded in government bond risk premiums are due to the following conditions:<\/p><p><b>Condition 1<\/b> the lack of currency risk for domestic investors<\/p><p><b>Condition 2:<\/b> bond returns being negatively correlated with GDP growth<\/p><p><b>Condition 3:<\/b> the fact that government bond risk premiums are static<\/p><p>Jones then compiles data on several five-year corporate bonds that are held by the firm.<\/p><img class=\"pimg\" loa  inflation will accelerate.<\/p><p>The current central bank policy rate is 1.50% and has been unchanged for several years. Using the Taylor Rule, Jones calculates a policy rate of 4.50%. The yield curve is positively sloped with short-term bond yields anchored by the policy rate while the long-term government bond is yielding 4.00%.<\/p><p>Jones then suggests that consumption hedging properties embedded in government bond risk premiums are due to the following conditions:<\/p><p><b>Condition 1<\/b> the lack of currency risk for domestic investors<\/p><p><b>Condition 2:<\/b> bond returns being negatively correlated with GDP growth<\/p><p><b>Condition 3:<\/b> the fact that government bond risk premiums are static<\/p><p>Jones then compiles data on several five-year corporate bonds that are held by the firm.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex038.webp\" style=\"max-width:min(100%,624px)\" alt=\"Exhibit\"><p>Jones shifts his attention to the firm&#x27;s high-yield bond fund and notes that the fund holds more than 400 positions and has not experienced a default during the past five years. Jones then observes:<\/p><p>Observation 1:The default risk for this portfolio has been diversified away.<\/p><p>Observation 2:The business cycle obviously impacts the credit spreads on individual securities, but at the fund level, credit spreads are stable.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, if Jones&#x27;s economic forecast materializes, which of the following is most likely?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q122.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":123,"q":"Based on Exhibit 1, the bond that is most likely to experience the greatest yield spread volatility over the course of the business cycle is:","opts":["Bond A.","Bond B.","Bond C."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"
