<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

const DATA = [{"n":1,"q":"Based on Smith's statement and Exhibit 1, which of the following best describes the risk of Continental's fixed income portfolio? £5,057,758 represents the expected one-day:","opts":["minimum loss, which occurs 5% of the time.","maximum loss, which occurs at least 5% of the time.","maximum gain or loss, which would occur 95% of the time."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a001.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a001.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Continental Inc. is a full-service brokerage firm catering to institutional buy-side investors. During the normal course of business, Continental continuously buys and sells all types of commonly traded bonds and regularly maintains a large inventory of bonds to facilitate client transactions. Roger Smith, chief risk officer at Continental, is responsible for monitoring the risk of the firm&#x27;s bond inventory.<\/p><p>Smith is evaluating Continental&#x27;s risk policies and discusses the firm&#x27;s policies with Edgar Monroe, a newly hired risk analyst. Smith asks Monroe how familiar he is with value at risk (VaR). Monroe replies that he is generally familiar with three methods of VaR estimation:<\/p><p>Method 1: Parametric<\/p><p>Method 2: Historical simulation<\/p><p>Method 3: Monte Carlo simulation<\/p><p>Smith then states that Continental uses a 5% VaR model, which estimates expected returns, volatilities, and correlations for each risk factor, assuming a normal return distribution. Portfolio details are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex001.webp\" style=\"max-width:min(100%,313px)\" alt=\"Exhibit\"><p>Smith then asks Monroe to provide a historical simulation VaR for comparative purposes. Monroe provides Smith with the following data and states that the historical analysis is based on a lookback period of two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex002.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Monroe discusses the findings with Smith and makes the following observations:<\/p><p>Observation 1: This analysis is a more accurate estimate of risk since it uses historical data.<\/p><p>Observation 2: £3,355,647 is 1.65 standard deviations from the mean.<\/p><p>Observation 3: These calculations are derived from the current portfolio constituents only.<\/p><p>Monroe then comments that this specific portfolio is subject to the following limitations of VaR:<\/p><p>Limitation 1: Correlation and liquidity risk<\/p><p>Limitation 2: Subjectivity and extreme event risk<\/p><p>Limitation 3: Oversimplification and trading regime risk<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Smith&#x27;s statement and Exhibit 1, which of the following best describes the risk of Continental&#x27;s fixed income portfolio? £5,057,758 represents the expected one-day:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q001.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":2,"q":"Based on Smith's statement and Exhibit 1, Continental's approach to VaR is best described as using?","opts":["Method 1","Method 2","Method 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a002.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a002.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Co 5% VaR model, which estimates expected returns, volatilities, and correlations for each risk factor, assuming a normal return distribution. Portfolio details are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex001.webp\" style=\"max-width:min(100%,313px)\" alt=\"Exhibit\"><p>Smith then asks Monroe to provide a historical simulation VaR for comparative purposes. Monroe provides Smith with the following data and states that the historical analysis is based on a lookback period of two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex002.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Monroe discusses the findings with Smith and makes the following observations:<\/p><p>Observation 1: This analysis is a more accurate estimate of risk since it uses historical data.<\/p><p>Observation 2: £3,355,647 is 1.65 standard deviations from the mean.<\/p><p>Observation 3: These calculations are derived from the current portfolio constituents only.<\/p><p>Monroe then comments that this specific portfolio is subject to the following limitations of VaR:<\/p><p>Limitation 1: Correlation and liquidity risk<\/p><p>Limitation 2: Subjectivity and extreme event risk<\/p><p>Limitation 3: Oversimplification and trading regime risk<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and using a 1% threshold, the portfolio&#x27;s daily parametric VaR (in £) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q003.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":4,"q":"Which of Monroe's observations regarding the VaR analysis in Exhibit 2 is correct?","opts":["Observation 1","Observation 2","Observation 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a004.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a004.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Continental Inc. is a full-service brokerage firm catering to institutional buy-side investors. During the normal course of business, Continental continuously buys and sells all types of commonly traded bonds and regularly maintains a large inventory of bonds to facilitate client transactions. Roger Smith, chief risk officer at Continental, is responsible for monitoring the risk of the firm&#x27;s bond inventory.<\/p><p>Smith is evaluating Continental&#x27;s risk policies and discusses the firm&#x27;s policies with Edgar Monroe, a newly hired risk analyst. Smith asks Monroe how familiar he is with value at risk (VaR). Monroe replies that he is generally familiar with three methods of VaR estimation:<\/p><p>Method 1: Parametric<\/p><p>Method 2: Historical simulation<\/p><p>Method 3: Monte Carlo simulation<\/p><p>Smith then states that Continental uses a 5% VaR model, which estimates expected returns, volatilities, and correlations for each risk factor, assuming a normal return distribution. Portfolio details are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex001.webp\" style=\"max-width:min(100%,313px)\" alt=\"Exhibit\"><p>Smith then asks Monroe to provide a historical simulation VaR for comparative purposes. Monroe provides Smith with the following data and states that the historical analysis is based on a lookback period of two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex002.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Monroe discusses the findings with Smith and makes the following observations:<\/p><p>Observation 1: This analysis is a more accurate estimate of risk since it uses historical data.<\/p><p>Observation 2: £3,355,647 is 1.65 standard deviations from the mean.<\/p><p>Observation 3: These calculations are derived from the current portfolio constituents only.<\/p><p>Monroe then comments that this specific portfolio is subject to the following limitations of VaR:<\/p><p>Limitation 1: Correlation and liquidity risk<\/p><p>Limitation 2: Subjectivity and extreme event risk<\/p><p>Limitation 3: Oversimplification and trading regime risk<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Monroe&#x27;s observations regarding the VaR analysis in Exhibit 2 is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":5,"q":"Which of the following limitations identified by Monroe is most likely underestimated in this portfolio?","opts":["Limitation 1","Limitation 2","Limitation 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a005.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a005.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Continental Inc. is a full-service brokerage firm catering to institutional buy-side investors. During the normal course of business, Continental continuously buys and sells all types of commonly traded bonds and regularly maintains a large inventory of bonds to facilitate client transactions. Roger Smith, chief risk officer at Continental, is responsible for monitoring the risk of the firm&#x27;s bond inventory.<\/p><p>Smith is evaluating Continental&#x27;s risk policies and discusses the firm&#x27;s policies with Edgar Monroe, a newly hired risk analyst. Smith asks Monroe how familiar he is with value at risk (VaR). Monroe replies that he is generally familiar with three methods of VaR estimation:<\/p><p>Method 1: Parametric<\/p><p>Method 2: Historical simulation<\/p><p>Method 3: Monte Carlo simulation<\/p><p>Smith then states that Continental uses a 5% VaR model, which estimates expected returns, volatilities, and correlations for each risk factor, assuming a normal return distribution. Portfolio details are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex001.webp\" style=\"max-width:min(100%,313px)\" alt=\"Exhibit\"><p>Smith then asks Monroe to provide a historical simulation VaR for comparative purposes. Monroe provides Smith with the following data and states that the historical analysis is based on a lookback period of two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex002.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Monroe discusses the findings with Smith and makes the following observations:<\/p><p>Observation 1: This analysis is a more accurate estimate of risk since it uses historical data.<\/p><p>Observation 2: £3,355,647 is 1.65 standard deviations from the mean.<\/p><p>Observation 3: These calculations are derived from the current portfolio constituents only.<\/p><p>Monroe then comments that this specific portfolio is subject to the following limitations of VaR:<\/p><p>Limitation 1: Correlation and liquidity risk<\/p><p>Limitation 2: Subjectivity and extreme event risk<\/p><p>Limitation 3: Oversimplification and trading regime risk<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following limitations identified by Monroe is most likely underestimated in this portfolio?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":6,"q":"Which of the following extensions to VaR would be most appropriate in evaluating the risk faced by Continental?","opts":["Conditional VaR and relative VaR","Incremental VaR and relative VaR","Conditional VaR and incremental VaR"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a006.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a006.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–6 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Continental Inc. is a full-service brokerage firm catering to institutional buy-side investors. During the normal course of business, Continental continuously buys and sells all types of commonly traded bonds and regularly maintains a large inventory of bonds to facilitate client transactions. Roger Smith, chief risk officer at Continental, is responsible for monitoring the risk of the firm&#x27;s bond inventory.<\/p><p>Smith is evaluating Continental&#x27;s risk policies and discusses the firm&#x27;s policies with Edgar Monroe, a newly hired risk analyst. Smith asks Monroe how familiar he is with value at risk (VaR). Monroe replies that he is generally familiar with three methods of VaR estimation:<\/p><p>Method 1: Parametric<\/p><p>Method 2: Historical simulation<\/p><p>Method 3: Monte Carlo simulation<\/p><p>Smith then states that Continental uses a 5% VaR model, which estimates expected returns, volatilities, and correlations for each risk factor, assuming a normal return distribution. Portfolio details are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex001.webp\" style=\"max-width:min(100%,313px)\" alt=\"Exhibit\"><p>Smith then asks Monroe to provide a historical simulation VaR for comparative purposes. Monroe provides Smith with the following data and states that the historical analysis is based on a lookback period of two years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex002.webp\" style=\"max-width:min(100%,333px)\" alt=\"Exhibit\"><p>Monroe discusses the findings with Smith and makes the following observations:<\/p><p>Observation 1: This analysis is a more accurate estimate of risk since it uses historical data.<\/p><p>Observation 2: £3,355,647 is 1.65 standard deviations from the mean.<\/p><p>Observation 3: These calculations are derived from the current portfolio constituents only.<\/p><p>Monroe then comments that this specific portfolio is subject to the following limitations of VaR:<\/p><p>Limitation 1: Correlation and liquidity risk<\/p><p>Limitation 2: Subjectivity and extreme event risk<\/p><p>Limitation 3: Oversimplification and trading regime risk<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following extensions to VaR would be most appropriate in evaluating the risk faced by Continental?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":7,"q":"Which of Ngobeni's assumptions regarding APT is correct?","opts":["Only Assumption 1","Only Assumption 2","Only Assumption 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Elizabeth Ngobeni is a newly hired performance attribution analyst at an investment consulting firm. Maria Mabaso is a senior research analyst at the firm and Ngobeni&#x27;s supervisor. Mabaso quizzes Ngobeni on her fundamental knowledge of factor models and asks her to describe the arbitrage pricing theory (APT). Ngobeni responds by stating the key underlying assumptions of APT:<\/p><p>Assumption 1: No arbitrage opportunities exist among well-diversified portfolios.<\/p><p>Assumption 2: Investors are able to form portfolios that are free of factor risk but still subject to asset-specific risk.<\/p><p>Assumption 3: APT describes asset returns through the three factors of portfolio beta, value, and market capitalization.<\/p><p>Ngobeni continues by comparing the Carhart model to CAPM and APT:<\/p><p>Comparison 1: The Carhart model is an APT model.<\/p><p>Comparison 2: The Carhart model is a multifactor extension of CAPM.<\/p><p>Comparison 3: Persistent market anomalies that are difficult to explain in a CAPM framework are systematic risk factors in the Carhart model.<\/p><p>Mabaso then provides a statistical one-factor model, shown in Exhibit 1, that describes the expected return for three equal dollar-weighted portfolios, along with their associated expected returns and factor sensitivity. She asks Ngobeni to test for an arbitrage opportunity with these three portfolios.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex003.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Mabaso shifts the discussion to the pros and cons of statistical fixed-income factor models, and then to the potential benefits of factor models in strategic portfolio decision-making. Ngobeni adds that in strategic portfolio decisions, multifactor models help investors to:<\/p><p><b>Comment 1:<\/b> Develop more efficient, better diversified portfolios<\/p><p><b>Comment 2:<\/b> Allocate to risks in which investors have a comparative advantage<\/p><p>Comment 3: Develop market timing models between the market portfolio and a risk-free asset to adjust risk exposure<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ngobeni&#x27;s assumptions regarding APT is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":8,"q":"Which of Ngobeni's comparisons are correct?","opts":["Comparison 1 and Comparison 2 only","Comparison 2 and Comparison 3 only","Comparison 1, Comparison 2, and Comparison 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elizabeth Ngobeni is a newly hired performance attribution analyst at an investment consulting firm. Maria Mabaso is a senior research analyst at the firm and Ngobeni&#x27;s supervisor. Mabaso quizzes Ngobeni on her fundamental knowledge of factor models and asks her to describe the arbitrage pricing theory (APT). Ngobeni responds by stating the key underlying assumptions of APT:<\/p><p>Assumption 1: No arbitrage opportunities exist among well-diversified portfolios.<\/p><p>Assumption 2: Investors are able to form portfolios that are free of factor risk but still subject to asset-specific risk.<\/p><p>Assumption 3: APT describes asset returns through the three factors of portfolio beta, value, and market capitalization.<\/p><p>Ngobeni continues by comparing the Carhart model to CAPM and APT:<\/p><p>Comparison 1: The Carhart model is an APT model.<\/p><p>Comparison 2: The Carhart model is a multifactor extension of CAPM.<\/p><p>Comparison 3: Persistent market anomalies that are difficult to explain in a CAPM framework are systematic risk factors in the Carhart model.<\/p><p>Mabaso then provides a statistical one-factor model, shown in Exhibit 1, that describes the expected return for three equal dollar-weighted portfolios, along with their associated expected returns and factor sensitivity. She asks Ngobeni to test for an arbitrage opportunity with these three portfolios.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex003.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Mabaso shifts the discussion to the pros and cons of statistical fixed-income factor models, and then to the potential benefits of factor models in strategic portfolio decision-making. Ngobeni adds that in strategic portfolio decisions, multifactor models help investors to:<\/p><p><b>Comment 1:<\/b> Develop more efficient, better diversified portfolios<\/p><p><b>Comment 2:<\/b> Allocate to risks in which investors have a comparative advantage<\/p><p>Comment 3: Develop market timing models between the market portfolio and a risk-free asset to adjust risk exposure<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ngobeni&#x27;s comparisons are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q008.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":9,"q":"Ngobeni uses APT to test for an arbitrage opportunity with the portfolios described in Exhibit 1. Which of the following is her best conclusion? An arbitrage opportunity:","opts":["is not possible.","is possible, by buying 100% of Portfolio B and shorting 100% of Portfolio A.","is possible, by buying 50% of Portfolio A and 50% of Portfolio B and shorting 100% of Portfolio C."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a009.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a009.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elizabeth Ngobeni is a newly hired performance attribution analyst at an inve s of factor models in strategic portfolio decision-making. Ngobeni adds that in strategic portfolio decisions, multifactor models help investors to:<\/p><p><b>Comment 1:<\/b> Develop more efficient, better diversified portfolios<\/p><p><b>Comment 2:<\/b> Allocate to risks in which investors have a comparative advantage<\/p><p>Comment 3: Develop market timing models between the market portfolio and a risk-free asset to adjust risk exposure<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following best describe examples of statistical fixed income factors?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":12,"q":"Which of Ngobeni's comments on strategic portfolio decisions are correct?","opts":["Comment 1 and Comment 2 only","Comment 2 and Comment 3 only","Comment 1, Comment 2, and Comment 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elizabeth Ngobeni is a newly hired performance attribution analyst at an investment consulting firm. Maria Mabaso is a senior research analyst at the firm and Ngobeni&#x27;s supervisor. Mabaso quizzes Ngobeni on her fundamental knowledge of factor models and asks her to describe the arbitrage pricing theory (APT). Ngobeni responds by stating the key underlying assumptions of APT:<\/p><p>Assumption 1: No arbitrage opportunities exist among well-diversified portfolios.<\/p><p>Assumption 2: Investors are able to form portfolios that are free of factor risk but still subject to asset-specific risk.<\/p><p>Assumption 3: APT describes asset returns through the three factors of portfolio beta, value, and market capitalization.<\/p><p>Ngobeni continues by comparing the Carhart model to CAPM and APT:<\/p><p>Comparison 1: The Carhart model is an APT model.<\/p><p>Comparison 2: The Carhart model is a multifactor extension of CAPM.<\/p><p>Comparison 3: Persistent market anomalies that are difficult to explain in a CAPM framework are systematic risk factors in the Carhart model.<\/p><p>Mabaso then provides a statistical one-factor model, shown in Exhibit 1, that describes the expected return for three equal dollar-weighted portfolios, along with their associated expected returns and factor sensitivity. She asks Ngobeni to test for an arbitrage opportunity with these three portfolios.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex003.webp\" style=\"max-width:min(100%,424px)\" alt=\"Exhibit\"><p>Mabaso shifts the discussion to the pros and cons of statistical fixed-income factor models, and then to the potential benefits of factor models in strategic portfolio decision-making. Ngobeni adds that in strategic portfolio decisions, multifactor models help investors to:<\/p><p><b>Comment 1:<\/b> Develop more efficient, better diversified portfolios<\/p><p><b>Comment 2:<\/b> Allocate to risks in which investors have a comparative advantage<\/p><p>Comment 3: Develop market timing models between the market portfolio and a risk-free asset to adjust risk exposure<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ngobeni&#x27;s comments on strategic portfolio decisions are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":13,"q":"Based on Exhibit 1, the manager who most closely aligns with Yildiz's desired investment profile is:","opts":["Manager A.","Manager B.","Manager C."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Elif Yildiz is an equity portfolio manager at a corporate pension plan. The plan invests in multiple equity funds, each managed by a different manager. Yildiz is conducting a search for a new equity manager who would diversify the existing mix of purely fundamental, bottom-up managers.<\/p><p>Yildiz instructs Anushka Patel, a research analyst at the plan, to prepare information on three new managers who invest predominately with a top-down macro approach, minimizing stock selection risk. This information is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex004.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Yildiz then reviews last year&#x27;s factor sensitivity and return information for the Value Fund, one of the current equity funds used by the plan. Yildiz notes the benchmark for the Value Fund is appropriate. This information is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex005.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Yildiz expects the equity momentum factor to outperform over the near term and is concerned about the pension plan&#x27;s active exposure to this factor. She asks Patel to identify three factor portfolios that could be added to the plan to hedge the momentum risk exposure. These portfolios are presented in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex006.webp\" style=\"max-width:min(100%,536px)\" alt=\"Exhibit\"><p>Yildiz then considers the plan&#x27;s asset allocation mix. The plan uses a two-factor macroeconomic model to assist in asset allocation weighting decisions. Based on the plan&#x27;s diversified asset allocation approach, the weighted average factor risk premium for the portfolio is 2.5%. The portion of the return not explained by the two-factor macroeconomic model is 0.5%. Information for the last year is presented in Exhibit 4:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex007.webp\" style=\"max-width:min(100%,572px)\" alt=\"Exhibit\"><p>Patel then reminds Yildiz of the multiple risk dimensions that must be considered when arriving at an asset allocation policy. Patel makes the following statement regarding the pension plan:<\/p><p>&quot;The plan is sponsored by a highly leveraged cyclical company whose revenue and profitability are very sensitive to economic fluctuations. The plan&#x27;s participants are relatively young compared with many other plans in the same industry.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the manager who most closely aligns with Yildiz&#x27;s desired investment profile is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":14,"q":"Based on Exhibit 1, the manager with the greatest information ratio is:","opts":["Manager A.","Manager B.","Manager C."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Elif Yildiz is an equity portfolio manager at a corporate pension plan. The plan invests in multiple equity funds, each managed by a dif price higher, and closed out the position an hour later at even higher prices.<\/p><p><b>Trade 3:<\/b> Using data-mining software, Super-Fast is often able to identify and predict the algorithmic trading pattern of brokerage firms. In this case, the software indicated that more selling of a stock&#x27;s shares was imminent, so Super-Fast shorted shares of the stock and then closed the position by the end of the day.<\/p><p>Rybakova then provides a hypothetical example of another trading strategy that is used only occasionally.<\/p><p><b>Trade 4:<\/b> Using a pegged limit order below the best ask (ie, Super-Fast is the buyer) on Exchange A, the order is filled when a large seller takes out numerous bids in the limit order book at one time (ie, large market order). Super-Fast&#x27;s electronic trading system immediately sells the position using a market order on another exchange before other participants can change their orders, generating a small profit.<\/p><p>Rybakova explains to Zhukov that each strategy is thoroughly tested and validated before it is used in live markets. Even with thorough processes and procedures, mistakes have happened.<\/p><p>For example, due to a programming error, one of Super-Fast&#x27;s high-frequency trading strategies erroneously began buying at the ask and selling at the bid. This resulted in substantial losses: hundreds of executions occurred before it could be shut down.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the three primary trading strategies described by Rybakova is least likely an example of low-latency trading?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":20,"q":"Regulators using real-time surveillance techniques to identify abusive trading practices would most likely characterize the strategy of Trade 2 as:","opts":["bluffing.","gunning the market.","legitimate trading acti h:min(100%,477px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the primary purpose of a security lending program for NGT? The security lending program:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":30,"q":"Relative to other ETFs, bid-ask spreads for NGT are most likely:","opts":["wider than average, to boost AP profitability.","narrower than average, due to two-way order flow.","wider than average, due to significant creation and redemption activity."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a030.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a030.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Evergreen Investment Management (Evergreen) is the fund sponsor for the New Growth Technology (NGT) ETF. NGT&#x27;s asset base has grown substantially in recent years due to a low fee structure, low tracking error, and, in general, a relative outperformance over technology stocks.<\/p><p>NGT is now one of the largest and most actively traded ETFs in the market. Dragon Trading (Dragon) is an authorized participant (AP) for NGT and one of its most active market makers.<\/p><p>Selected data for NGT is presented below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex008.webp\" style=\"max-width:min(100%,477px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Relative to other ETFs, bid-ask spreads for NGT are most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":31,"q":"Based on the results in Exhibit 1, which of the following is the most appropriate conclusion? In a real-time implementation, estimated risk-adjusted performance of the model with:","opts":["no lag is the most accurate.","a one-month lag is understated.","a three-month lag is understated."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Portfolio Management<\/summary><div class=\"vig-body\"><p>A client has requested that Wolfgang Schmidt, an analyst at Backtesting Inc., run a multifactor portfolio backtest to assess historical performance and then run several simulations using different assumptions. The client has identified six value-oriented fundamental factors to backtest and has selected a widely available value index as the investable universe. Schmidt will use 30 years of data with monthly rebalancing and a rolling-window procedure.<\/p><p>Schmidt&#x27;s data provider has point-in-time constituent data but no other point-in-time information. Companies in the index report financial results on a quarterly basis. To help calibrate the model, Schmidt conducts an initial backtest with Factor 1, using numerous monthly reporting lags to fine-tune the analysis for the other factors. Schmidt then reviews the results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex009.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Schmidt then designs a benchmark portfolio (BM) and a risk parity portfolio (RP) and runs a backtest and three simulations to generate investment performance based on the underlying factor portfolios. Each simulation is constructed from 1,000 trial runs. The three simulation approaches are as follows:<\/p><p>Approach 1: Historical simulation<\/p><p>Approach 2: Monte Carlo simulation (multivariate normal distribution)<\/p><p>Approach 3: Monte Carlo simulation (skewed Student&#x27;s t-distribution)<\/p><p>Schmidt then reviews the results, comparing the downside risk characteristics of each approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex010.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on the results in Exhibit 1, which of the following is the most appropriate conclusion? In a real-time implementation, estimated risk-adjusted performance of the model with:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":32,"q":"The multifactor historical simulation (Approach 1) risk parity portfolio is least likely formed by:","opts":["using two rolling-window procedures.","implementing a nondeterministic rolling-window backtest.","combining individual factor portfolio returns from different months."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A client has requested that Wolfgang Schmidt, an analyst at Backtesting Inc., run a multifactor portfolio backtest to assess historical performance and then run several simulations using different assumptions. The client has identified six value-oriented fundamental factors to backtest and has selected a widely available value index as the investable universe. Schmidt will use 30 years of data with monthly rebalancing and a rolling-window procedure.<\/p><p>Schmidt&#x27;s data provider has point-in-time constituent data but no other point-in-time information. Companies in the index report financial results on a quarterly basis. To help calibrate the model, Schmidt conducts an initial backtest with Factor 1, using numerous monthly reporting lags to fine-tune the analysis for the other factors. Schmidt then reviews the results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex009.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Schmidt then designs a benchmark portfolio (BM) and a risk parity portfolio (RP) and runs a backtest and three simulations to generate investment performance based on the underlying factor portfolios. Each simulation is constructed from 1,000 trial runs. The three simulation approaches are as follows:<\/p><p>Approach 1: Historical simulation<\/p><p>Approach 2: Monte Carlo simulation (multivariate normal distribution)<\/p><p>Approach 3: Monte Carlo simulation (skewed Student&#x27;s t-distribution)<\/p><p>Schmidt then reviews the results, comparing the downside risk characteristics of each approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex010.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>The multifactor historical simulation (Approach 1) risk parity portfolio is least likely formed by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":33,"q":"Given the design of Approach 1 (historical simulation), which of the following sampling techniques is least likely to be used?","opts":["Bootstrapped sampling","Inverse transformation sampling","Random sampling without replacement"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a actors. Schmidt then reviews the results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex009.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Schmidt then designs a benchmark portfolio (BM) and a risk parity portfolio (RP) and runs a backtest and three simulations to generate investment performance based on the underlying factor portfolios. Each simulation is constructed from 1,000 trial runs. The three simulation approaches are as follows:<\/p><p>Approach 1: Historical simulation<\/p><p>Approach 2: Monte Carlo simulation (multivariate normal distribution)<\/p><p>Approach 3: Monte Carlo simulation (skewed Student&#x27;s t-distribution)<\/p><p>Schmidt then reviews the results, comparing the downside risk characteristics of each approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex010.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>In contrast to Approach 1 (historical simulation), Approach 2 (Monte Carlo simulation) most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q034.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":35,"q":"Which of the following best demonstrates the use of sensitivity analysis?","opts":["Approach 1","Approach 2","Approach 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a035.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A client has requested that Wolfgang Schmidt, an analyst at Backtesting Inc., run a multifactor portfolio backtest to assess historical performance and then run several simulations using different assumptions. The client has identified six value-oriented fundamental factors to backtest and has selected a widely available value index as the investable universe. Schmidt will use 30 years of data with monthly rebalancing and a rolling-window procedure.<\/p><p>Schmidt&#x27;s data provider has point-in-time constituent data but no other point-in-time information. Companies in the index report financial results on a quarterly basis. To help calibrate the model, Schmidt conducts an initial backtest with Factor 1, using numerous monthly reporting lags to fine-tune the analysis for the other factors. Schmidt then reviews the results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex009.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Schmidt then designs a benchmark portfolio (BM) and a risk parity portfolio (RP) and runs a backtest and three simulations to generate investment performance based on the underlying factor portfolios. Each simulation is constructed from 1,000 trial runs. The three simulation approaches are as follows:<\/p><p>Approach 1: Historical simulation<\/p><p>Approach 2: Monte Carlo simulation (multivariate normal distribution)<\/p><p>Approach 3: Monte Carlo simulation (skewed Student&#x27;s t-distribution)<\/p><p>Schmidt then reviews the results, comparing the downside risk characteristics of each approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex010.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of the following best demonstrates the use of sensitivity analysis?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":36,"q":"Based on Exhibit 2, which of the following is Schmidt's most appropriate conclusion?","opts":["Approach 1 overestimates downside risk for the benchmark portfolio.","Approach 2 underestimates downside risk for the benchmark portfolio.","Approach 3 underestimates downside risk for the risk parity portfolio."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>A client has requested that Wolfgang Schmidt, an analyst at Backtesting Inc., run a multifactor portfolio backtest to assess historical performance and then run several simulations using different assumptions. The client has identified six value-oriented fundamental factors to backtest and has selected a widely available value index as the investable universe. Schmidt will use 30 years of data with monthly rebalancing and a rolling-window procedure.<\/p><p>Schmidt&#x27;s data provider has point-in-time constituent data but no other point-in-time information. Companies in the index report financial results on a quarterly basis. To help calibrate the model, Schmidt conducts an initial backtest with Factor 1, using numerous monthly reporting lags to fine-tune the analysis for the other factors. Schmidt then reviews the results:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex009.webp\" style=\"max-width:min(100%,626px)\" alt=\"Exhibit\"><p>Schmidt then designs a benchmark portfolio (BM) and a risk parity portfolio (RP) and runs a backtest and three simulations to generate investment performance based on the underlying factor portfolios. Each simulation is constructed from 1,000 trial runs. The three simulation approaches are as follows:<\/p><p>Approach 1: Historical simulation<\/p><p>Approach 2: Monte Carlo simulation (multivariate normal distribution)<\/p><p>Approach 3: Monte Carlo simulation (skewed Student&#x27;s t-distribution)<\/p><p>Schmidt then reviews the results, comparing the downside risk characteristics of each approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex010.webp\" style=\"max-width:min(100%,566px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, which of the following is Schmidt&#x27;s most appropriate conclusion?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":37,"q":"The inverted yield curve observed by Holland is most likely driven by:","opts":["a decrease in the volatility of GDP growth.","investor expectations of a decline in the inflation rate.","bond risk premiums that are positively correlated with maturity."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Yannick Radkov is a fund manager for Fund One, a multi-asset fund for Destiny Financial. Radkov is reviewing the economic landscape with Inge Holland, an analyst at Destiny, and how changes to the landscape may affect the fund&#x27;s holdings.<\/p><p>Holland states that the country&#x27;s economy is showing signs of worsening. Holland notes that the yield curve has inverted and states that this often happens before a recession. Radkov is curious how a worsening of the economy will affect Fund One and collects information on a selection of the fund&#x27;s holdings:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex011.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>Holland notes that it will be difficult to compare all of the assets in the fund since they have different hedging properties against bad economic outcomes. She uses three examples of assets held in the fund:<\/p><p>A 3-month T-bill<\/p><p>A 10-year government bond<\/p><p>A noncyclical, dividend-paying stock<\/p><p>Another Fund One investment is a commercial real property that it rents to a developed-economy government tenant for a fixed amount not indexed to inflation. Radkov questions the discount rate used to value this property. He provides data on the risk factors relevant for that tenant and asks Holland to calculate the correct discount rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex012.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Finally, Radkov considers Fund One&#x27;s equity holdings. He is curious what might happen to P/E values when the economy improves. Radkov decides to look at the most recent recession and notices that P/E values for the stock market were below their historical average after the recession ended. He considers three potential reasons:<\/p><p>Real interest rates<\/p><p>Uncertainty about future inflation<\/p><p>Expectation for future real earnings growth<\/p><p>Holland adds that the changes to the economy are likely to affect cyclical companies and noncyclical companies differently, stating:<\/p><p>Statement 1: Poorly managed cyclical companies are more likely to be exposed during an economic boom than during weaker economic periods.<\/p><p>Statement 2: Noncyclical companies&#x27; earnings growth is unaffected by the business cycle.<\/p><\/div><\/details><div class=\"qtext\"><p>The inverted yield curve observed by Holland is most likely driven by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":38,"q":"Based on Exhibit 1, which bond's yield spread will likely widen the most?","opts":["Bond 1","Bond 2","Bond 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yannick Radkov is a fund manager for Fund One, a multi-asset fund for Destiny Financial. Radkov is reviewing the economic landscape with Inge Holland, an analyst at Destiny, and how changes to the landscape may affect the fund&#x27;s holdings.<\/p><p>Holland states that the country&#x27;s economy is showing signs of worsening. Holland notes that the yield curve has inverted and states that this often happens before a recession. Radkov is curious how a worsening of the economy will affect Fund One and collects information on a selection of the fund&#x27;s holdings:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex011.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>Holland notes that it will be difficult to compare all of the assets in the fund since they have different hedging properties against bad economic outcomes. She uses three examples of assets held in the fund:<\/p><p>A 3-month T-bill<\/p><p>A 10-year government bond<\/p><p>A noncyclical, dividend-paying stock<\/p><p>Another Fund One investment is a commercial real property that it rents to a developed-economy government tenant for a fixed amount not indexed to inflation. Radkov questions the discount rate used to value this property. He provides data on the risk factors relevant for that tenant and asks Holland to calculate the correct discount rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex012.webp\" style=\"max-width:min(10  is a fund manager for Fund One, a multi-asset fund for Destiny Financial. Radkov is reviewing the economic landscape with Inge Holland, an analyst at Destiny, and how changes to the landscape may affect the fund&#x27;s holdings.<\/p><p>Holland states that the country&#x27;s economy is showing signs of worsening. Holland notes that the yield curve has inverted and states that this often happens before a recession. Radkov is curious how a worsening of the economy will affect Fund One and collects information on a selection of the fund&#x27;s holdings:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex011.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>Holland notes that it will be difficult to compare all of the assets in the fund since they have different hedging properties against bad economic outcomes. She uses three examples of assets held in the fund:<\/p><p>A 3-month T-bill<\/p><p>A 10-year government bond<\/p><p>A noncyclical, dividend-paying stock<\/p><p>Another Fund One investment is a commercial real property that it rents to a developed-economy government tenant for a fixed amount not indexed to inflation. Radkov questions the discount rate used to value this property. He provides data on the risk factors relevant for that tenant and asks Holland to calculate the correct discount rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-pm/ex012.webp\" style=\"max-width:min(100%,420px)\" alt=\"Exhibit\"><p>Finally, Radkov considers Fund One&#x27;s equity holdings. He is curious what might happen to P/E values when the economy improves. Radkov decides to look at the most recent recession and notices that P/E values for the stock market were below their historical average after the recession ended. He considers three potential reasons:<\/p><p>Real interest rates<\/p><p>Uncertainty about future inflation<\/p><p>Expectation for future real earnings growth<\/p><p>Holland adds that the changes to the economy are likely to affect cyclical companies and noncyclical companies differently, stating:<\/p><p>Statement 1: Poorly managed cyclical companies are more likely to be exposed during an economic boom than during weaker economic periods.<\/p><p>Statement 2: Noncyclical companies&#x27; earnings growth is unaffected by the business cycle.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements made by Holland about cyclicality is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":43,"q":"Patel's use of the MO ETF in client portfolios was most likely intended to meet which of the following portfolio strategy goals?","opts":["Tactical","Completion","Rebalancing"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Sri Patel, CFA, is a registered investment adviser for high-net-worth US retail clients. To construct client portfolios, Patel mainly uses exchange-traded funds (ETFs), preferring their low cost and the ease of using them to implement both core strategic asset class exposure and tactical trading ideas.<\/p><p>During the last equity bear market, which occurred one year ago, volatility futures spiked to the highest level in recent years, with the volatility index (VIX) of the Chicago Board Options Exchange (CBOE) reaching 40. Viewing this as an opportunity to position client portfolios for a normalization in volatility, Patel purchased an inverse volatility futures (IVIX) exchange-traded note (ETN), which appreciates as volatility declines. Patel also positioned clients in a momentum factor (MO) ETF, believing it would outperform the broad market during the early stages of the next bull market.<\/p><p>Over the past year, financial markets have rebounded significantly and volatility has declined. The IVIX has performed as expected since the VIX has fallen to 10 and is near a record low. Patel is concerned that another stock market sell-off is likely, due to high valuations, steadily rising bond yields, and a series of credit losses at several large European banks. Therefore, he believes now is the time to exit both the MO and IVIX and allocate that money to a low-volatility (LOWV) equity ETF.<\/p><p>The next day—before Patel can act on his views—global equities sell off considerably, falling 4%. In the US, the VIX surges to 19, almost doubling overnight, and the stock market opens significantly lower, falling 3%. Patel is shocked to see the value of IVIX plunge by more than 95% at the open, wiping out not only the gains of the last three years but virtually all his client&#x27;s original investment.<\/p><\/div><\/details><div class=\"qtext\"><p>Patel&#x27;s use of the MO ETF in client portfolios was most likely intended to meet which of the following portfolio strategy goals?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":44,"q":"Patel's use of IVIX in client portfolios was most likely intended to:","opts":["reduce portfolio risk.","utilize smart beta factor exposure.","outperform the portfolio's benchmark."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-pm/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-pm/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–48 · Portfolio Manage to implement both core strategic asset class exposure and tactical trading ideas.<\/p><p>During the last equity bear market, which occurred one year ago, volatility futures spiked to the highest level in recent years, with the volatility index (VIX) of the Chicago Board Options Exchange (CBOE) reaching 40. Viewing this as an opportunity to position client portfolios for a normalization in volatility, Patel purchased an inverse volatility futures (IVIX) exchange-traded note (ETN), which appreciates as volatility declines. Patel also positioned clients in a momentum factor (MO) ETF, believing it would outperform the broad market during the early stages of the next bull market.<\/p><p>Over the past year, financial markets have rebounded significantly and volatility has declined. The IVIX has performed as expected since the VIX has fallen to 10 and is near a record low. Patel is concerned that another stock market sell-off is likely, due to high valuations, steadily rising bond yields, and a series of credit losses at several large European banks. Therefore, he believes now is the time to exit both the MO and IVIX and allocate that money to a low-volatility (LOWV) equity ETF.<\/p><p>The next day—before Patel can act on his views—global equities sell off considerably, falling 4%. In the US, the VIX surges to 19, almost doubling overnight, and the stock market opens significantly lower, falling 3%. Patel is shocked to see the value of IVIX plunge by more than 95% at the open, wiping out not only the gains of the last three years but virtually all his client&#x27;s original investment.<\/p><\/div><\/details><div class=\"qtext\"><p>The type of risk that ultimately materialized for Patel&#x27;s clients from the inclusion of the IVIX ETN is best described as:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-pm/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":47,"q":"Which of the following best
