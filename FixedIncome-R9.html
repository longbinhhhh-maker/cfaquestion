<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Given that the two-year spot rate is 5.89% and the one-year forward rate one-year from now\nis 6.05%, assuming annual compounding what is the one year spot rate?", "opts": ["5.67%.", "5.73%.", "5.91%."], "ans": "B", "expl": "The spot rate is computed as follows:\n2\n2\n(1 + spot rate)\n(1 + 0.0589)\n0,2\nspot rate =  - 1 =  - 1 = 5.73%\n0,1\n11\n(1 + forward rate)(1 + 0.0605)\n1,2\n(Module 55.1, LOS 55.b)"}, {"n": 2, "q": "An investor wants to take advantage of the 5-year spot rate, currently at a level of 4.0%.\nUnfortunately, the investor just invested all of his funds in a 2-year bond with a yield of 3.2%.\nThe investor contacts his broker, who tells him that in two years he can purchase a 3-year\nbond and end up with the same return currently offered on the 5-year bond. What 3-year\nforward rate beginning two years from now will allow the investor to earn a return\nequivalent to the 5-year spot rate?", "opts": ["4.5%.", "5.6%.", "3.5%."], "ans": "A", "expl": "521/3\n(1.04 / 1.032) – 1 = 4.5%.\n(Module 55.1, LOS 55.b)"}, {"n": 3, "q": "Given that the one-year spot rate is 6.05% and the two-year spot rate is 7.32%, assuming\nannual compounding what is the one-year forward rate starting one year from now?", "opts": ["8.34%.", "7.87%.", "8.61%."], "ans": "C", "expl": "The forward rate is computed as follows:\n2\n2\n(1 + spot rate)\n(1 + 0.0732)\n0,2\nForward rate =  - 1 =  - 1 = 8.61%\n1,2\n11\n(1 + 0.0605)\n(1 + spot rate)\n0,1\n(Module 55.1, LOS 55.b)"}, {"n": 4, "q": "Given the one-year spot rate S = 0.06 and the implied 1-year forward rates one, two, and\n1\nthree years from now of: 11 = 0.062; 21 = 0.063; 31 = 0.065, what is the theoretical 4-\nyyyyyy\nyear spot rate?", "opts": ["6.25%.", "6.00%.", "6.75%."], "ans": "A", "expl": ".25\nS = [ (1.06) (1.062) (1.063) (1.065) ] – 1 = 6.25%.\n4\n(Module 55.1, LOS 55.b)"}, {"n": 5, "q": "A 2-year option-free bond (par value of $10,000) has an annual coupon of 15%. An investor\ndetermines that the spot rate of year 1 is 16% and the year 2 spot rate is 17%. The bond\nprice is closest to:", "opts": ["$8,401.", "$9,694.", "$11,122."], "ans": "B", "expl": "We can calculate the price of the bond by discounting each of the annual payments by the\nappropriate spot rate and finding the sum of the present values. Price = [1,500/(1.16)] +\n2\n[11,500/(1.17)] = $9,694. Or, in keeping with the notion that each cash flow is a separate\nbond, sum the following transactions on your financial calculator:\nN=1, I/Y=16.0, PMT=0, FV=1,500, CPT PV=1,293\nN=2, I/Y=17.0, PMT=0, FV=11,500, CPT PV=8,401\nPrice = 1,293 + 8,401 = $9,694.\n(Module 55.1, LOS 55.a)"}, {"n": 6, "q": "The current 4-year spot rate is 4% and the current 5-year spot rate is 5.5%. What is the 1-\nyear forward rate in four years?", "opts": ["11.72%.", "10.14%.", "9.58%."], "ans": "A", "expl": "5\n(1.055)\n4y1y=−1=0.1172\n4\n(1.04)\nNote: 5(5.5) − 4(4) = 11.5%.\n(Module 55.1, LOS 55.b)"}, {"n": 7, "q": "The 3-year annual spot rate is 7%, the 4-year annual spot rate is 7.5%, and the 5-year annual\nspot rate is 8%. The 1-year forward rate four years from now is closest to:", "opts": ["7%.", "9%.", "10%."], "ans": "C", "expl": "5\n(1+S)\n5\n1.08\n1.4693\n5\nImplied 1-year forward rate in four years =  =\n−1=−1=−1\n41.3355\n4\n1.075\n(1+S)\n4\n0.1002 or 10.02%. Alternatively, 5 × 8% – 4 × 7.5% = 10%.\n(Module 55.1, LOS 55.b)"}, {"n": 8, "q": "The six-year spot rate is 7% and the five-year spot rate is 6%. The implied one-year forward\nrate five years from now is closest to:", "opts": ["12.0%.", "5.0%.", "6.5%."], "ans": "A", "expl": "6565\n51= [(1 + S) / (1 + S)] - 1 = [(1.07)/(1.06)] – 1 = [1.5 / 1.338] - 1 = 0.12\nyy65\n(Module 55.1, LOS 55.b)"}, {"n": 9, "q": "Using the following spot rates for pricing the bond, what is the present value of a three-year\nsecurity that pays a fixed annual coupon of 6%?\nYear 1: 5.0%\nYear 2: 5.5%\nYear 3: 6.0%", "opts": ["102.46.", "100.10.", "95.07."], "ans": "B", "expl": "This value is computed as follows:\n23\nPresent Value = 6/1.05 + 6/1.055 + 106/1.06 = 100.10\nThe value 95.07 results if the coupon payment at maturity of the bond is neglected.\n(Module 55.1, LOS 55.a)", "qhtml": "<p>Using the following spot rates for pricing the bond, what is the present value of a three-year</p><p>security that pays a fixed annual coupon of 6%?</p><table class=\"qtable\"><tbody><tr><td>Year 1:</td><td>5.0%</td></tr><tr><td>Year 2:</td><td>5.5%</td></tr><tr><td>Year 3:</td><td>6.0%</td></tr></tbody></table>"}, {"n": 10, "q": "The one-year spot rate is 7.00%. One-year forward rates are 8.15% one year from today,\n10.30% two years from today, and 12.00% three years from today.\nThe value today of a 4-year, $1,000 par value, zero-coupon bond is closest to:", "opts": ["$640.", "$700.", "$665."], "ans": "B", "expl": "Based on the given spot and forward rates, the 4-year spot rate equals [(1.07)(1.0815)\n1/4\n(1.103)(1.120)] – 1 = 9.35%.\nBond value: N = 4; FV = 1,000; I/Y = 9.35; PMT = 0; CPT  PV = –699.40\n→\n(Module 55.1, LOS 55.a)"}, {"n": 11, "q": "A yield curve for coupon bonds is composed of yields on bonds with similar:", "opts": ["coupon rates.", "issuers.", "maturities."], "ans": "B", "expl": "Typesetting math: 100%\nYield curves are typically constructed for bonds of the same or similar issuers, such as a\ngovernment bond yield curve or AA rated corporate bond yield curve.\n(Module 55.1, LOS 55.c)"}, {"n": 12, "q": "The one-year spot rate is 5% and the two-year spot rate is 6.5%. What is the one-year\nforward rate starting one year from now?", "opts": ["5.00%.", "7.87%.", "8.02%."], "ans": "C", "expl": "The forward rate is computed as follows:\n2\nOne-year forward rate = 1.065 / 1.05 – 1 = 8.02%\n(Module 55.1, LOS 55.b)"}, {"n": 13, "q": "The 3-year spot rate is 10%, and the 4-year spot rate is 10.5%. What is the 1-year forward\nrate 3 years from now?", "opts": ["10.0%.", "11.0%.", "12.0%."], "ans": "C", "expl": "43\n[(1 + S) / (1 + S)] – 1 = 12.01% = 12%.\n43\n(Module 55.1, LOS 55.b)"}, {"n": 14, "q": "The following spot and forward rates currently exist in the market:\nThe 1-year spot rate is 3.75%.\nThe 1-year forward rate one year from today is 9.50%.\nThe 1-year forward rate two years from today is 15.80%.\nGiven these rates and based on annual compounding, how much should an investor be\nwilling to pay for each $100 in par value for a three-year, zero-coupon bond?", "opts": ["$33.", "$44.", "$76."], "ans": "C", "expl": "The discount rate on an N-year, zero-coupon bond is the spot rate for Year N. Thus, find\nthe spot rate in Year 3:\n3\n(1 + Z) = (1.0375) × (1.095) × (1.158) = 1.31556\n3\n1/3\nZ = (1.31556) – 1 = 0.0957 = 9.573%\n3\nNow, price this three-year, zero-coupon bond to yield 9.57%:\nN = 3; I/Y = 9.57; FV = 100; CPT PV = –76.02 (ignore sign)\nHint: 100 / (1.0375 × 1.095 × 1.158) = 76.02 saves a couple of calculations.\n(Module 55.1, LOS 55.b)"}, {"n": 15, "q": "Assume the following government spot yield curve.\nOne-year rate: 5%\nTwo-year rate: 6%\nThree-year rate: 7%\nIf a 3-year annual-pay government bond has a coupon of 6%, its yield to maturity is closest\nto:", "opts": ["6.08%.", "6.92%.", "7.00%."], "ans": "B", "expl": "First determine the current price of the bond:\n23\n= 6 / 1.05 + 6 / (1.06) + 106 / (1.07) = 5.71 + 5.34 + 86.53 = 97.58\nThen compute the yield of the bond:\nN = 3; PMT = 6; FV = 100; PV = -97.58; CPT  I/Y = 6.92%\n→\n(Module 55.1, LOS 55.a)"}, {"n": 16, "q": "A spot rate curve is most accurately described as yields to maturity for:", "opts": ["government bonds.", "zero-coupon bonds.", "money market securities."], "ans": "B", "expl": "A spot rate curve illustrates the yields for single payments to be made in various future\nperiods, including short-term and long-term periods.\n(Module 55.1, LOS 55.c)"}, {"n": 17, "q": "The one-year spot rate is 6% and the one-year forward rates starting in one, two and three\nyears respectively are 6.5%, 6.8%, and 7%. What is the four-year spot rate?", "opts": ["6.51%.", "6.57%.", "6.58%."], "ans": "B", "expl": "Typesetting math: 100%\nThe four-year spot rate is computed as follows:\n1/4\nFour-year spot rate = [(1 + 0.06)(1 + 0.065)(1 + 0.068)(1 + 0.07) ] – 1 = 6.57%\n(Module 55.1, LOS 55.b)"}, {"n": 18, "q": "If the yield curve is downward-sloping, the no-arbitrage value of a bond calculated using spot\nrates will be:", "opts": ["greater than the market price of the bond.", "equal to the market price of the bond.", "less than the market price of the bond."], "ans": "B", "expl": "The value of a bond calculated using appropriate spot rates is its no-arbitrage value. If no\narbitrage opportunities are present, this value is equal to the market price of a bond.\n(Module 55.1, LOS 55.a)"}, {"n": 19, "q": "The Treasury spot rate yield curve is closest to which of the following curves?", "opts": ["Forward yield curve rate.", "Par bond yield curve.", "Zero-coupon bond yield curve."], "ans": "C", "expl": "The spot rate yield curve shows the appropriate rates for discounting single cash flows\noccurring at different times in the future. Conceptually, these rates are equivalent to yields\non zero-coupon bonds. The par bond yield curve shows the YTMs at which bonds of\nvarious maturities would trade at par value. Forward rates are expected future short-term\nrates.\n(Module 55.1, LOS 55.c)"}, {"n": 20, "q": "A 10-year spot rate is least likely the:", "opts": ["appropriate discount rate on the year 10 cash flow for a 20-year bond.", "yield-to-maturity on a 10-year coupon bond.", "yield-to-maturity on a 10-year zero-coupon bond."], "ans": "B", "expl": "A 10-year spot rate is the yield-to-maturity on a 10-year zero-coupon security, and is the\nappropriate discount rate for the year 10 cash flow for a 20-year (or any maturity greater\nthan or equal to 10 years) bond. Spot rates are used to value bonds and to ensure that\nbond prices eliminate any possibility for arbitrage resulting from buying a coupon security,\nstripping it of its coupons and principal payment, and reselling the strips as separate zero-\ncoupon securities. The yield to maturity on a 10-year bond is the (complex) average of the\nspot rates for all its cash flows.\n(Module 55.1, LOS 55.a)"}, {"n": 21, "q": "The term structure of yield volatility illustrates the relationship between yield volatility and:", "opts": ["Macaulay duration.", "time to maturity.", "yield to maturity."], "ans": "B", "expl": "The term structure of yield volatility refers to the relationship between yield volatility and\ntime to maturity.\n(Module 55.1, LOS 55.a)"}, {"n": 22, "q": "Given that the 2-year spot rate is 5.76% and the 3-year spot rate is 6.11%, what is the 1-year\nforward rate starting two years from now?", "opts": ["6.81%.", "6.97%.", "7.04%."], "ans": "A", "expl": "32\n(1 + S) = (1 + S)(1 + 2y1y)\n32\n32\n(1 + 2y1y) = (1 + S) / (1 + S)\n32\n32\n(1 + 2y1y) = (1.0611) / (1.0576) = 1.0681\n2y1y = 6.81%\n(Module 55.1, LOS 55.b)"}, {"n": 23, "q": "A 4 percent Treasury bond has 2.5 years to maturity. Spot rates are as follows:\n6 month1 year1.5 years2 years2.5 years\n2%2.5%3%4%6%\nThe note is currently selling for $976. Determine the arbitrage profit, if any, that is possible.", "opts": ["$37.63.", "$43.22.", "$19.22."], "ans": "C", "expl": "The no-arbitrage price of a bond is determined by discounting each of its cash flows at the\nappropriate spot rate. Any difference between the no-arbitrage price and the market price\nof a bond represents a potential arbitrage profit.\n202020201020\n=++++\n1.012345\n1.01251.0151.021.03\n=19.80+19.51+19.13+18.48+879.86=$956.78\n   976−956.78=$19.22\n(Module 55.1, LOS 55.a)", "qhtml": "<p>A 4 percent Treasury bond has 2.5 years to maturity. Spot rates are as follows:</p><table class=\"qtable\"><thead><tr><th>6 month</th><th>1 year</th><th>1.5 years</th><th>2 years</th><th>2.5 years</th></tr></thead><tbody><tr><td>2%</td><td>2.5%</td><td>3%</td><td>4%</td><td>6%</td></tr></tbody></table><p>The note is currently selling for $976. Determine the arbitrage profit, if any, that is possible.</p>"}, {"n": 24, "q": "The arbitrage-free bond valuation approach can best be described as the:", "opts": ["geometric average of the spot interest rates.", "use of a series of spot interest rates that reflect the current term structure.", "use of a single discount factor."], "ans": "B", "expl": "The use of multiple discount rates (i.e., a series of spot rates that reflect the current term\nstructure) will result in more accurate bond pricing and in so doing, will eliminate any\nmeaningful arbitrage opportunities. That is why the use of a series of spot rates to\ndiscount bond cash flows is considered to be an arbitrage-free valuation procedure.\n(Module 55.1, LOS 55.a)"}, {"n": 25, "q": "Which of the following statements regarding zero-coupon bonds and spot interest rates is\nCORRECT?", "opts": ["If the yield to maturity on a 2-year zero coupon bond is 6%, then the 2-year spot rate is 3%.", "Price appreciation creates all of the zero-coupon bond's return.", "Spot interest rates will never vary across the term structure."], "ans": "B", "expl": "Zero-coupon bonds are quite special. Because zero-coupon bonds have no coupons (all of\nthe bond's return comes from price appreciation), investors have no uncertainty about the\nrate at which coupons will be invested. Spot rates are defined as interest rates used to\ndiscount a single cash flow to be received in the future. If the yield to maturity on a 2-year\nzero is 6%, we can say that the 2-year spot rate is 6%.\n(Module 55.1, LOS 55.a)"}, {"n": 26, "q": "An investor who is calculating the arbitrage-free value of a government security should\ndiscount each cash flow using the:", "opts": ["risk-free rate.", "government spot rate that is specific to its maturity.", "government note yield that is specific to its maturity."], "ans": "B", "expl": "To calculate a government bond's arbitrage-free value, each cash flow is discounted using\nthe government spot rate that is specific to the maturity of the cash flow.\n(Module 55.1, LOS 55.a)"}, {"n": 27, "q": "Assume that a callable bond's call period starts two years from now with a call price of\n$102.50. Also assume that the bond pays an annual coupon of 6% and the term structure is\nflat at 5.5%. Which of the following is the price of the bond assuming that it is called on the\nfirst call date?", "opts": ["$100.00.", "$103.17.", "$102.50."], "ans": "B", "expl": "The bond price is computed as follows:\n2\nBond price = 6/1.055 + (102.50 + 6)/1.055= $103.17\n(Module 55.1, LOS 55.a)"}, {"n": 28, "q": "Using the following spot rates, what is the price of a three-year bond with annual coupon\npayments of 5%?\nOne-year rate: 4.78%\nTwo-year rate: 5.56%\nThree-year rate: 5.98%", "opts": ["$93.27.", "$97.47.", "$98.87."], "ans": "B", "expl": "The bond price is computed as follows:\n23\nBond price = (5 / 1.0478) + (5 / 1.0556) + (105 / 1.0598) = $97.47\n(Module 55.1, LOS 55.a)"}, {"n": 29, "q": "An investor gathers the following information about a 2-year, annual-pay bond:\nPar value of $1,000\nCoupon of 4%\n1-year spot interest rate is 2%\n2-year spot interest rate is 5%\nUsing the above spot rates, the current price of the bond is closest to:", "opts": ["$983.", "$1,000.", "$1,010."], "ans": "A", "expl": "The value of the bond is simply the present value of discounted future cash flows, using\nthe appropriate spot rate as the discount rate for each cash flow. The coupon payment of\n2\nthe bond is $40 (0.04 × 1,000). The bond price = 40/(1.02) + 1,040/(1.05) = $982.53.\n(Module 55.1, LOS 55.a)"}, {"n": 30, "q": "A 3-year option-free bond (par value of $1,000) has an annual coupon of 9%. An investor\ndetermines that the spot rate of year 1 is 6%, the year 2 spot rate is 12%, and the year 3 spot\nrate is 13%. Using the arbitrage-free valuation approach, the bond price is closest to:", "opts": ["$912.", "$968.", "$1,080."], "ans": "A", "expl": "We can calculate the price of the bond by discounting each of the annual payments by the\nappropriate spot rate and finding the sum of the present values. Price = [90 / (1.06)] + [90 /\n23\n(1.12)] + [1,090 / (1.13)] = 912. Or, in keeping with the notion that each cash flow is a\nseparate bond, sum the following transactions on your financial calculator:\nN = 1; I/Y = 6.0; PMT = 0; FV = 90; CPT  PV = 84.91\n→\nN = 2; I/Y = 12.0; PMT = 0; FV = 90; CPT  PV = 71.75\n→\nN = 3; I/Y = 13.0; PMT = 0; FV = 1,090; CPT  PV = 755.42\n→\nPrice = 84.91 + 71.75 + 755.42 = $912.08.\n(Module 55.1, LOS 55.a)"}, {"n": 31, "q": "The six-month spot rate is 4.0% and the 1 year spot rate is 4.5%, both stated on a\nsemiannual bond basis. The implied six-month rate six months from now, stated on a\nsemiannual bond basis, is closest to:", "opts": ["4%.", "5%.", "6%."], "ans": "B", "expl": "Typesetting math: 100%\n2121\n6m6m/2 = [(1 + S/2) / (1 + S/2)] - 1 = [(1.0225)/(1.02)] - 1\n21\n[1.0455 / 1.02] - 1 = 0.025\n6m6m = 0.025 × 2 = 0.05\n(Module 55.1, LOS 55.b)"}, {"n": 32, "q": "A three-year annual coupon bond has a par value of $1,000 and a coupon rate of 5.5%. The\nspot rate for year 1 is 5.2%, the spot rate for year two is 5.5%, and the spot rate for year\nthree is 5.7%. The value of the coupon bond is closest to:", "opts": ["$1,000.00.", "$937.66.", "$995.06."], "ans": "C", "expl": "You need the find the present value of each cash flow using the spot rate that coincides\nwith each cash flow.\nThe present value of cash flow 1 is: FV = $55; PMT = 0; I/Y = 5.2%; N = 1; CPT  PV =\n→\n-$52.28.\nThe present value of cash flow 2 is: FV = $55; PMT = 0; I/Y = 5.5%; N = 2; CPT  PV = –\n→\n$49.42.\nThe present value of cash flow 3 is: FV = $1,055; PMT = 0; I/Y = 5.7%; N = 3; CPT  PV = –\n→\n$893.36.\nThe most you pay for the bond is the sum of: $52.28 + $49.42 + $893.36 = $995.06.\n(Module 55.1, LOS 55.a)"}, {"n": 33, "q": "Suppose the 3-year spot rate is 12.1% and the 2-year spot rate is 11.3%. Which of the\nfollowing statements concerning forward and spot rates is most accurate? The 1-year:", "opts": ["forward rate one year from today is 13.7%.", "forward rate two years from today is 13.2%.", "forward rate two years from today is 13.7%."], "ans": "C", "expl": "3\nThe equation for the three-year spot rate, S, is (1 + S)(1 + 11)(1 + 21) = (1 + S). Also,\n31yyyy3\n2323\n(1 + S)(1 + 11) = (1 + S). So, (1 + 21) = (1 + S) / (1 + S), computed as: (1 + 0.121) /\n1yy2yy32\n2\n(1 + 0.113) = 1.137. Thus, 21= 0.137, or 13.7%.\nyy\n(Module 55.1, LOS 55.b)"}, {"n": 34, "q": "Current spot rates are as follows:\n1-Year: 6.5%\n2-Year: 7.0%\n3-Year: 9.2%\nWhich of the following statements is most accurate?", "opts": ["For a 3-year annual pay coupon bond, the first coupon can be discounted at 6.5%, the second coupon can be discounted at 7.0%, and the third coupon plus maturity value can be discounted at 9.2% to find the bond's arbitrage-free value.", "The yield to maturity for 3-year annual pay coupon bond can be found by taking the geometric average of the 3 spot rates.", "For a 3-year annual pay coupon bond, all cash flows can be discounted at 9.2% to find the bond's arbitrage-free value."], "ans": "A", "expl": "Spot interest rates can be used to price coupon bonds by taking each individual cash flow\nand discounting it at the appropriate spot rate for that year's payment. Note that the yield\nto maturity is the bond's internal rate of return that equates all cash flows to the bond's\nprice. Current spot rates have nothing to do with the bond's yield to maturity.\n(Module 55.1, LOS 55.a)", "qhtml": "<p>Current spot rates are as follows:</p><table class=\"qtable\"><tbody><tr><td>1-Year:</td><td>6.5%</td></tr><tr><td>2-Year:</td><td>7.0%</td></tr><tr><td>3-Year:</td><td>9.2%</td></tr></tbody></table><p>Which of the following statements is most accurate?</p>"}, {"n": 35, "q": "An analyst collects the following information regarding spot rates:\n1-year rate = 4%.\n2-year rate = 5%.\n3-year rate = 6%.\n4-year rate = 7%.\nThe 2-year forward rate two years from today is closest to:", "opts": ["9.04%.", "7.02%.", "8.03%."], "ans": "A", "expl": "(cid:0)\n4\n(1.07)(4×7)−(2×5)\n(cid:0)\n(cid:0)\n−1=0.0904, or =9 as an approximation.\n⎷22\n(1.05)\n(Module 55.1, LOS 55.b)"}, {"n": 36, "q": "If the current two-year spot rate is 6% while the one-year forward rate for one year is 5%,\nwhat is the current spot rate for one year?", "opts": ["5.0%.", "5.5%.", "7.0%."], "ans": "C", "expl": "Typesetting math: 100%\n2\n(1 + 11)(1 + s) = (1 + s)\nyy12\n2\n(1 + 0.05)(1 + s) = (1 + 0.06)\n1\n2\n(1 + s) = (1.06) / (1 + 0.05)\n1\n1 + s = 1.1236 / 1.05\n1\n1 + s = 1.0701\n1\ns = 0.07 or 7%\n1\n(Module 55.1, LOS 55.b)"}, {"n": 37, "q": "A 2-year option-free bond (par value of $1,000) has an annual coupon of 6%. An investor\ndetermines that the spot rate for year 1 is 5% and the year 2 spot rate is 8%. The bond price\nis closest to:", "opts": ["$966.", "$992.", "$1,039."], "ans": "A", "expl": "We can calculate the price of the bond by discounting each of the annual payments by the\nappropriate spot rate and finding the sum of the present values. Bond price = [60 / (1.05)]\n2\n+ [1,060 / (1.08)] = $966. Or, in keeping with the notion that each cash flow is a separate\nbond, sum the following transactions on your financial calculator:\nN = 1; I/Y = 5.0; PMT = 0; FV = 60; CPT  PV = 57.14\n→\nN = 2; I/Y = 8.0; PMT = 0; FV = 1,060; CPT  PV = 908.78\n→\nPrice = 57.14 + 908.78 = $966.\n(Module 55.1, LOS 55.a)"}];

function saveProg(){

      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
