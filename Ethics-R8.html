<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Nancy Korthauer, CFA, has launched a new hedge fund called the Korthauer Tautology Fund\nbut has had trouble hiring analysts who are CFA charterholders as well as with finding\nclients. She offers a $15,000 incentive bonus to any charterholder who joins the firm with\nover $1 million in committed client investments. Which of the following interpretations of\nthe Code and Standards is most accurate?", "opts": ["A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided clients are informed of the incentive bonus.", "A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided the member or candidate refuses to accept the incentive bonus.", "A member or candidate may not solicit current clients away from their current employer."], "ans": "C", "expl": "A member or candidate may not solicit current clients away from their current employer\nunder Standard IV(A) \"Loyalty.\""}, {"n": 2, "q": "Dixie Miller, a Level II CFA candidate, heads the research department of a large brokerage\nfirm. The firm has many analysts, some of whom are subject to the CFA Institute Code of\nEthics and Standards of Professional Conduct. If Miller delegates some of her supervisory\nduties, which statement best describes her responsibilities under the CFA Institute Code and\nStandards?", "opts": ["CFA Institute Standards prevent Miller from delegating supervisory duties to subordinates.", "Miller retains supervisory responsibilities for those duties delegated to her subordinates.", "Miller's supervisory responsibilities do not apply to those subordinates who are not subject to the CFA Institute Code and Standards."], "ans": "B", "expl": "Even though members may delegate supervisory duties, such delegation does not relieve\nmembers of the supervisory responsibility.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 3, "q": "Jill Borowski, CFA, works for Advisors where she manages a portfolio for a wealthy family.\nBorowski earns 1% of the portfolio's value each year in the form of a commission from\nAdvisors. The family just told her that any year the portfolio she manages earns more than a\n10% return, the family will give her the use of the family's vacation home for one week. With\nrespect to the Code and Standards, this proposal most accurately represents:", "opts": ["an ethical violation from which the Standards require Borowski to dissociate herself.", "a gift or benefit which the Standards recommend Borowski disclose to her employer.", "an additional compensation arrangement which the Standards require Borowski to receive her employer’s consent before accepting."], "ans": "C", "expl": "Standard IV(B) Additional Compensation Arrangements requires that members and\ncandidates receive written consent from their employer before accepting benefits from\nclients that may influence their objectivity or loyalty. Gifts from a client that are contingent\non earning a minimum return may have the appearance of causing a member or candidate\nto favor that client's interests over the interests of other clients.\n(Module 91.6, LOS 91: IV(B))"}, {"n": 4, "q": "Chris Babcock, CFA, a portfolio manager for a large Texas investment firm, has been offered\ncompensation in addition to what her firm pays her. The offer is from one of her clients and\nthe additional compensation will be based on her yearly performance in excess of the\nmarket index. Babcock should:", "opts": ["make written disclosure to all parties involved before she accepts this offer.", "make written disclosure to her other clients before she accepts this offer.", "turn down the offer because it represents a clear conflict between this client and Babcock's other clients."], "ans": "A", "expl": "Standard IV(B), Additional Compensation Arrangements, applies in this situation. Standard\nIV(B) states, \"No gifts, benefits, compensation, or consideration are to be accepted with\nmay create a conflict of interest with the employer's interest unless written consent is\nreceived from all parties.\"\nThe key words here are \"written consent\" - members must obtain written consent because\nsuch arrangements may affect loyalties and objectivity and create potential conflicts of\ninterest."}, {"n": 5, "q": "Analysts who undertake an independent consulting practice while employed must get\npermission from their employer and should disclose all of the following EXCEPT:", "opts": ["the clients contact information.", "the compensation or benefit to be received.", "the anticipated duration of the service to be rendered."], "ans": "A", "expl": "The Member or Candidate is not required to disclose confidential information about his\nindependent clients.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 6, "q": "Jason Blackwell, CFA, works as an investment banker for Mega Capital. Sylvia Lego, a friend\nof Blackwell who has an independent investment advisory practice, asks Blackwell to help\nher review client portfolios during evenings and weekends for a fee. According to the\nStandard concerning loyalty, under what conditions may Blackwell accept this arrangement?", "opts": ["Blackwell must disclose to Mega Capital the additional compensation that will result from the arrangement, but is not required to obtain their consent.", "Blackwell must notify Mega Capital about the terms of the arrangement and obtain their consent.", "None, because this arrangement would put Blackwell into competition with Mega Capital."], "ans": "B", "expl": "Standard IV(A) Loyalty states that before engaging in independent practice for\ncompensation, members and candidates must notify their employer of the services they\nwill provide and the expected duration and compensation, and must secure consent from\ntheir employer before beginning independent practice.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 7, "q": "If a member or candidate wishes to engage in independent practice that may conflict with\nher employer's interests, she is least likely required to notify her employer of:", "opts": ["the number of clients her practice will serve.", "the compensation she will receive.", "the types of services she will provide."], "ans": "A", "expl": "She must provide information to her employer about the type of services, the\ncompensation arrangement, and the expected duration of the services.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 8, "q": "All of the following activities might constitute a violation of Standard IV(A), Loyalty to\nEmployer, EXCEPT:", "opts": ["misuse of confidential information.", "solicitation of the employer's clients following termination of employment.", "solicitation of the employer's clients prior to termination of employment."], "ans": "B", "expl": "Solicitation of the employer's clients prior to termination of employment would constitute\na violation of Loyalty to Employer, but solicitation of clients following termination would\nnot.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 9, "q": "An analyst working at an investment firm has a client that rents limousines. The client tells\nthe analyst that as long as he is the client's analyst, he can have free use of a limousine\nseveral times a year. The analyst needs to:", "opts": ["do nothing since the offer is not linked to the performance of the client's portfolio.", "explicitly refuse such an offer.", "inform his supervisor in writing of the offer if the analyst intends to accept the offer."], "ans": "C", "expl": "Standard IV(B) requires that members disclose to their employer in writing all benefits that\nthey receive in addition to their regular compensation for services they perform on behalf\nof their employer. They also need to get consent from their employer in writing. The\nwritten report to the employer should include the details of any written or oral agreement\nfor extra compensation. The analyst does not have to refuse the offer."}, {"n": 10, "q": "Selma Brown, CFA, is a portfolio manager for Mainland Securities. Rick Wood, one of her\nclients and owner of Wood Fitness Centers, offers to permit Brown and her immediate family\nto use the facilities at his fitness centers at no cost during 2003. To get this benefit, Brown\nmust achieve on Wood's portfolio at least a 2-percentage point return above the total return\non the S&P's 500 index during 2002. Brown orally informs her immediate supervisor of the\nnature and duration of the proposed arrangement.\nArnold Turley, a CFA Institute member, is a portfolio analyst at Mainland Securities. He was\njust elected to the Board of Directors for Omega Services, which pays him $1,000 plus\nexpenses for attending each of its quarterly board meetings. Turley e-mails Mainland's\ncompliance officer informing her of this arrangement with Omega and receives a reply\ninforming him that the agreement is acceptable.\nDid Brown or Turley violate CFA Institute Standards of Professional Conduct?", "opts": ["Brown: No, Turley: No.", "Brown: Yes, Turley: No.", "Brown: Yes, Turley: Yes."], "ans": "B", "expl": "Brown violated Standard IV(B), Additional Compensation Arrangements, because she must\ndisclose in writing other benefits to be received for services that are in addition to\ncompensation conferred by her employer. Turley did not violate Standard IV(B) because he\nreceived consent from his employer in writing, which includes e-mail.\n(Module 91.6, LOS 91: IV(B))"}, {"n": 11, "q": "When a CFA Institute member who is presently employed by a firm undertakes any\nindependent practice, he must do all of the following EXCEPT:", "opts": ["disclose the expected duration of the services to be rendered.", "remand a percentage (to be determined by the employee and employer) of the income earned back to the employer.", "secure permission from the employer."], "ans": "B", "expl": "The member is obligated to get permission from his employer if he will be in any way\ncompeting with his current employer. They must provide notification to their employer\ndescribing the types of services to be rendered, the expected duration, and compensation\nfor the services.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 12, "q": "Jacob Allen, CFA, decides he could make more money if he started his own company. Which\nof the following steps would most likely violate Standard IV(A) Loyalty?", "opts": ["Renting space for his new company and interviewing several candidates for the position of manager at the new company.", "Soliciting, without written permission from his current employer, the business of former clients after he leaves his current employer.", "Using his notes from prior research of a firm in a creating a new research report on the firm, after leaving his current employer."], "ans": "C", "expl": "Allen's notes from his research are employer records and even though he prepared them,\nit is a violation to take them from his employer without permission. Soliciting former\nclients' business is not, in itself, a violation as long has Allen has not misappropriated\nclient information from his former employer. Preparations to start a new business are not\nnecessarily a violation of the Standard, although soliciting current clients or recruiting\nother firm personnel for the new venture, before formally leaving his employer, would be\nviolations of the Standards.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 13, "q": "Which of the following statements is most correct under the Code and Standards?", "opts": ["CFA Institute members are prohibited from undertaking independent practice in competition with their employer.", "Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer.", "Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer."], "ans": "B", "expl": "Members are not prohibited from making arrangements or preparations to go into\ncompetitive business before terminating their relationship with their employer. CFA\nInstitute members are not prohibited from undertaking independent practice in\ncompetition with their employer provided they have consent from their employer.\nMembers must provide notification to their employer describing the types of services to be\nrendered, the expected duration, and compensation for the services."}, {"n": 14, "q": "Sue Parsons, CFA, works full-time as an investment advisor for the Malloy Group, an asset\nmanagement firm. Parsons wants to engage in independent practice in which she would\nadvise individual clients on their portfolios. She would conduct these investment activities\nonly on weekends. She is currently only in the preparation stage and has not started\nindependent practice yet. The Standard concerning loyalty:", "opts": ["does not require Parsons to notify Malloy of preparing an independent practice.", "requires Parsons to obtain consent from both Malloy and the persons from whom she will engage in independent practice.", "requires Parsons to notify Malloy that she is preparing to engage in independent practice."], "ans": "A", "expl": "Standard IV(A) Loyalty distinguishes between \"undertaking independent practice\" and\npreparing to begin doing so. The Standard requires that Parsons obtain consent from her\nemployer before she engages in independent practice that could result in compensation\nor other benefit in competition with Malloy. It does not require Parsons to obtain consent\nwhen only preparing to go into independent practice."}, {"n": 15, "q": "Nick O'Donnell, CFA, unsuspectingly joins the research team at Wickett & Co., an investment\nbanking firm controlled by organized crime. None of the managers at Wickett are CFA\nInstitute members. Because of his tenuous situation at Wickett, O'Donnell begins making\npreparations for independent practice. He knows he will be terminated if he informs\nmanagement at Wickett that he is preparing to leave. Consequently, he determines that \"if\nhe can just hang on for one year, he will likely have a client base sufficient for him to strike\nout on his own.\" This action is:", "opts": ["a violation of his duty to disclose conflicts to his employer.", "a violation of his fiduciary duties.", "not a violation of his duty to employer."], "ans": "C", "expl": "O'Donnell is required to obtain consent from his employer if he is attempting to practice in\ncompetition with his employer. Merely undertaking preparations to leave, which do not\nviolate a duty, is not a violation of the Code and Standards."}, {"n": 16, "q": "Francisco Perez, CFA, is an equity research analyst for a long-term investment fund. The fund\nis seeking new clients, so Perez contacts old clients he knew through his former employer.\nWhich of the following is most accurate?", "opts": ["Perez can only solicit clients after notifying his former employer.", "Perez cannot solicit clients from a former employer.", "Perez is not prevented from soliciting clients as long as he is working from memory and publically available information rather than a list generated while he was still with the former employer."], "ans": "C", "expl": "According to Standard IV(A), Perez is not prevented from soliciting clients as long as he is\nworking from memory and publically available information rather than a list generated\nwhile he was still with the former employer."}, {"n": 17, "q": "Which of the following statements is least accurate with regard to the Standard concerning\nloyalty to employers?", "opts": ["Employees planning to leave an employer must not engage in activities that would conflict with their duty to act in the employer’s best interest.", "Former employees may contact clients of their previous firms if doing so does not violate a non-compete agreement and the contact information is obtained from public sources.", "Skills and experience a former employee obtained through work at a firm are considered privileged information of that firm."], "ans": "C", "expl": "Once an employee leaves a firm, the employee's skills and experience acquired are not\nconsidered confidential or privileged. The other two statements are accurate.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 18, "q": "Bill Valley has been working for Advisors, Inc., for several years, and he just joined CFA\nInstitute. Valley's sister just received a large bonus in the form of stock options in Zephyr,\nInc. Valley's sister knows nothing about financial assets and offers Valley a week at her\nholiday home each year in exchange for Valley monitoring Zephyr and the value of her stock\noptions. In order to comply with the Code and Standards, Valley needs to inform Advisors of:", "opts": ["both the use of the holiday home and his sister's options.", "nothing since no money is involved and it is a favor for a family member.", "the compensation in the form of the use of the holiday home only."], "ans": "A", "expl": "According to Standard IV(A), Loyalty to Employer, Valley must inform Advisors of his\noutside consultation even if it is not for monetary compensation. According to Standard\nVI(A), Avoid or Disclose Conflicts, Valley must also disclose possible conflicts of interest,\nand his sister's position qualifies."}, {"n": 19, "q": "John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his\nown money management business and has given his two-week notice of his resignation from\nAdvisors. A few days before his resignation takes effect, on his lunch hour, he takes out a\nloan from a bank on behalf of his new business and uses the money to buy some office\nequipment for his new business. Since he engaged in these transactions while still an\nemployee of Advisors, Hill violated Standard IV(A), Loyalty to Employer, by:", "opts": ["breaching his duty of loyalty to his current employer by making preparations to go into a competitive business.", "neither taking out the loan nor buying the equipment.", "preparing to undertake independent practice before giving notice to his current employer of his intent to resign."], "ans": "B", "expl": "The Standards of Practice under IV(A) states that a departing employee is \"generally free to\nmake arrangements or preparations to go into a competitive business before terminating\nthe relationship with the employee's employer provided that such preparations do not\nbreach the employee's duty of loyalty.\" Neither of these actions are in conflict with the\ninterests of Advisors, and Hill performed them on his own time."}, {"n": 20, "q": "A firm recently hired Hal Crane, CFA, to be a supervisor in the firm. Crane has reviewed the\nprocedures for complying with the Code and Standards in the company. It is Crane's belief\nthat the procedures need revision in order to be effective. Crane must:", "opts": ["decline supervisory responsibilities in writing until the company adopts an adequate compliance system.", "exercise his supervisory responsibilities with the greater level of diligence required by the Code and Standards.", "make reasonable efforts to encourage the company to adopt an adequate compliance system."], "ans": "A", "expl": "According to Standard IV(C) Responsibilities of Supervisors, if Crane believes the\ncompany's compliance procedures are not adequate, Crane should decline supervisory\nresponsibilities in writing until an adequate system is adopted."}, {"n": 21, "q": "Martin Tripp, CFA, is vice-president of the equity department at Walker Financial, a large\nmoney management firm. Of the twenty analysts in his department for whom he has\nsupervisory responsibility, eight are subject to CFA Institute Standards of Professional\nConduct. Tripp believes that he cannot personally evaluate the conduct of the twenty\nanalysts on a continuing basis. Therefore, he plans to delegate some of his supervisory\nduties to Sarah Green, who is subject to the Standards, and some to Bob Brown, who is not\nsubject to the Standards. According to CFA Institute Standards of Professional Conduct,\nwhich of the following statements about Tripp's ability to delegate supervisory duties is most\naccurate?", "opts": ["Tripp may not delegate any of his supervisory duties to either Green or Brown.", "Tripp may delegate some or all of his supervisory duties only to Green because she is subject to the Standards.", "Tripp may delegate some or all of his supervisory duties to Brown, even though Brown is not subject to the Standards."], "ans": "C", "expl": "Standard IV(C) Responsibilities of Supervisors permits Tripp to delegate supervisory duties\nto Green, Brown, or both, but such delegation does not relieve Tripp of his supervisory\nresponsibility."}, {"n": 22, "q": "Wanda Kirby, CFA, recently joined Allegheny Investments as a senior analyst. Because of her\nextensive experience in the investments business and knowledge of the Code and\nStandards, Allegheny's management asked her to assume supervisory responsibility. Kirby\nreviewed Allegheny's existing compliance system and determined that it was inadequate to\nallow her to clearly discharge her supervisory responsibility. According to CFA Institute\nStandards, Kirby should:", "opts": ["agree to accept supervisory responsibility and to develop reasonable procedures to allow her to adequately exercise such responsibility.", "agree to accept supervisory responsibility provided that Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility.", "decline in writing to accept supervisory responsibility until Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility."], "ans": "C", "expl": "If Kirby clearly cannot discharge supervisory responsibilities because of an inadequate\ncompliance system, she should decline in writing to accept supervisory responsibility until\nAllegheny adopts reasonable procedures to allow her to adequately exercise such\nresponsibility."}, {"n": 23, "q": "Janet Thompson, CFA, is employed as an analyst by Nationwide Securities. According to CFA\nInstitute Standards of Professional Conduct, which of the following statements about\nThompson's duty to Nationwide is NOT correct? Thompson must refrain from:", "opts": ["engaging in any conduct that would injure Nationwide.", "engaging in independent competitive activity that could conflict with the business of Nationwide unless she receives written consent.", "making arrangements to go into a competitive business before terminating her relationship with Nationwide."], "ans": "C", "expl": "Standard IV(A) permits Thompson to make preparations to go into a competitive business\nbefore terminating her relationship with Nationwide provided that such preparations do\nnot breach her duty of loyalty."}, {"n": 24, "q": "A CFA Institute member, undertaking independent practice that could result in\ncompensation or other benefit:", "opts": ["must notify his employer and clients of the types of service to be rendered and the expected compensation.", "must notify his employer of the types of service to be rendered, the expected duration, and the expected compensation.", "must notify the entities for whom he plans to undertake independent practice of the compensation he receives from his employer."], "ans": "B", "expl": "According to Standard IV(A), Loyalty to Employer, a CFA Institute member, undertaking\nindependent practice that could result in compensation or other benefit, must notify his\nemployer of the types of service to be rendered, the expected duration, and the expected\ncompensation."}, {"n": 25, "q": "May Frost, CFA, is an equity research analyst for a \"precious metals mining\" exchange traded\nfund which has recently started significantly outperforming its benchmark after several\nyears of stagnation. Upon investigating the source of the outperformance, Frost learns that\nthe fund has experienced severe style drift, and now has a significant proportion of its\nresources invested in technology and internet stocks. Frost reviews the fund's prospectus\nand learns the current sector weighting violates multiple prospectus covenants. Frost\ncontacts her supervisor and the fund's compliance department and is told the portfolio\nweighting is not her responsibility and that she should not pursue the matter further. Frost\nreviews the firm's whistleblower policy, contacts personal legal counsel, and then contacts\nregulatory authorities regarding the style drift and prospectus violations. Frost is most likely:", "opts": ["not in violation of the Code and Standards.", "in violation of the Standard on preservation of confidentiality.", "in violation of the Standard on loyalty."], "ans": "A", "expl": "The Code and Standards do not prohibit whistleblowing actions, as long as these actions\ndo not violate applicable laws or regulations.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 26, "q": "Brian Bellow, CFA, is a portfolio manager for Progressive Trust Company. Several friends\nhave asked Bellow to review their investment portfolios. On his own time, Bellow examines\ntheir portfolios and makes several recommendations. He accepts no compensation from his\nfriends for his investment advice. According to CFA Institute Standards of Professional\nConduct, did Bellow violate his duty to Progressive Trust?", "opts": ["No, because Bellow provided no ongoing investment advice.", "Yes, because Bellow did not attempt to solicit his friends to become clients of his employer.", "No, because Bellow received no compensation for his services."], "ans": "C", "expl": "Standard IV(A) Loyalty requires members and candidates to disclose to their employers\nany independent practice for compensation. In this case, Bellow did not receive any\ncompensation for his advice and therefore did not engage in independent practice."}, {"n": 27, "q": "Jill Marsh, CFA, works for Advisors where she manages various portfolios. Marsh's godfather\nis an accountant and has done Marsh's tax returns every year as a birthday gift. Marsh's\ngodfather has recently become a client of Advisors and asked specifically for Marsh to\nmanage his account. In order to comply Standard IV(B), Disclosure of Additional\nCompensation Arrangements, she needs to:", "opts": ["do neither of the actions listed here.", "have her godfather cease doing her taxes.", "liquidate from her personal portfolio any stocks her godfather owns and verbally tell her supervisor about the tax services."], "ans": "A", "expl": "Standard IV(B) requires that members disclose to their employer in writing all benefits that\nthey receive in addition to their regular compensation for services they perform on behalf\nof their employer. It is not unreasonable for an individual's godfather to give them a\nbirthday gift. Moreover, since the tax services were a regular birthday present before her\ngodfather became a client, this implies that they are unrelated to any investment\nmanagement services."}, {"n": 28, "q": "John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his\nown money management business and has given his two weeks' notice of his resignation\nfrom Advisors. A few days before his resignation takes effect, Rod Bright, a former client of\nAdvisors, calls Hill at his home about his new firm. Bright says that he is very happy that Hill\nis leaving Advisors because now he and Hill can resume a professional relationship. Bright\nsays that he would never become a client of Advisors again. Hill promises to call Bright back\nafter he has left Advisors but takes no further action. Hill does not tell Advisors about the\ncall. Hill has most likely:", "opts": ["not violated the Standards.", "violated the Standard concerning loyalty to employer.", "violated the Standard concerning avoidance or disclosure of conflicts."], "ans": "A", "expl": "Based on the information here, Hill has not violated the Standards. The phone call was not\nwith a current client of Advisors, and the individual made it clear that he would not\nbecome a client of Advisors. Therefore, there was no breach of loyalty to Advisors by Hill\nfor not acting in his employer's interests, nor is there a conflict of interest."}, {"n": 29, "q": "Which of the following statements is most correct concerning a member's obligation to his\nor her employer under the Code and Standards?", "opts": ["Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer.", "Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer.", "Members are prohibited from undertaking independent practice in competition with their employer."], "ans": "A", "expl": "There is no blanket prohibition against independent practice in competition with a\nmember's employer. The member must obtain permission from the employer. Members\nmay make preparations to go into a competitive business, but may not solicit clients of the\nemployer as long as members are still employed by the employer."}, {"n": 30, "q": "Theresa Hatcher, CFA, is making arrangements to establish her own investment advisory\nbusiness before terminating her relationship with her current employer, Elite Brokers, Inc.\nElite is a small company consisting of only six investment professionals and a small support\nstaff. According to CFA Institute Standards of Professional Conduct, which of the following\nactivities is least likely a violation of Hatcher's duty to Elite?", "opts": ["Hatcher engages in secret negotiations with two other investment professionals and her administrative assistant to leave Elite in order to join her new business.", "Hatcher leases office space, furniture, and other equipment for her new business.", "Hatcher solicits Elite's clients before her termination of employment at Elite."], "ans": "B", "expl": "Standard IV(A) permits Hatcher to make preparations to begin a new practice, such as\nleasing office space, furniture, and other equipment, but not to engage in the other\nactivities that may violate her duty to employer.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 31, "q": "Nicholas Brynne, CFA, develops a trading model while working for CE Jones, an investment\nmanagement firm. By working on the model at home from his personal computer, Brynne is\nable to devote additional work hours. Although the trading model is successful, Brynne loses\nhis job in a company restructuring, and decides to start his own practice using the trading\nmodel. Nicholas is most likely:", "opts": ["in violation of the Standards because he did not have permission to build the trading model using his home computer.", "in violation of the Standards because he did not receive permission from his employer to keep or use the files after employment ended.", "not in violation of the Standards because the trading model was created using his home computer."], "ans": "B", "expl": "Brynne is in violation of Standard IV(A) \"Loyalty.\" Employer records include items stored in\nany medium including home computers.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 32, "q": "Jennifer Stewart, CFA, a supervisor at an investment advisory firm, has tried unsuccessfully\nto convince top management of the firm's need for a formal, comprehensive compliance\nprogram. What is Stewart's most appropriate course of action?", "opts": ["Decline in writing to accept supervisory responsibility.", "Rely on the Code and Standards to perform her duties as a supervisor.", "Resign from the firm if no compliance program is instituted."], "ans": "A", "expl": "According to Standard IV(C) Responsibilities of Supervisors, Stewart should decline in\nwriting to accept supervisory responsibility until the firm adopts adequate compliance\nprocedures.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 33, "q": "Which of the following activities will least likely constitute a violation of Standard IV(A),\nLoyalty?", "opts": ["Consulting on your own time and obtaining written permission from your employer.", "Contacting your current clients and asking them to \"come with you\" when you resign from your current employer.", "Conspiracy to bring about a mass resignation of other employees."], "ans": "A", "expl": "Consulting on your own time and obtaining written permission from your employer does\nnot constitute a violation of Standard IV(A).\n(Module 91.6, LOS 91: IV(A))"}, {"n": 34, "q": "Bill Fence, CFA, supervises a group of research analysts, none of whom have earned the CFA\ndesignation (nor are they CFA candidates). On several occasions he has attempted to get his\nfirm to adopt a compliance system to ensure that applicable laws and regulations are\nfollowed. However, the firm's principals have never adopted his recommendations. Fence\nshould most appropriately:", "opts": ["take no further action, because by encouraging his firm to adopt a compliance system he has fulfilled his obligations under the Code and Standards.", "refuse supervisory responsibility.", "report the inadequacy by submitting a complaint in writing to the CFA Institute Professional Conduct Program."], "ans": "B", "expl": "According to Standard IV(C), Responsibilities of Supervisors, if the member cannot\ndischarge supervisory responsibilities because of a poor or nonexistent compliance\nsystem, the member should decline in writing to accept supervisory responsibility until the\nfirm adopts an adequate system."}, {"n": 35, "q": "Fernando Abrea, CFA was an analyst for Pacific Investments. In October he left Pacific and\njoined Global Securities as manager of a local office. Abrea's change of employment came\nabout in the following manner:\nIn April, Abrea contacted Global about a possible position he saw advertised in a\nfinancial publication and had exploratory meetings with Global.\nIn July, Abrea submitted a strategic plan to Global and signed an agreement to join\nGlobal. He then contracted for office space on behalf of Global.\nOn October 15, Abrea's resignation from Pacific became effective. He did not take any\nclient lists from Pacific.\nOn October 16, Abrea mailed a letter that explained his new undertaking with Global\nto prospective clients, including his former clients at Pacific.\nWith respect to Standard IV(A) Loyalty, Abrea:", "opts": ["violated the Standard by contracting for office space on behalf of Global.", "did not violate the Standard.", "violated the Standard by contacting his former clients at Pacific."], "ans": "B", "expl": "According to Standard IV(A) Loyalty, preparations to leave employment are not prohibited.\nEven though Abrea engaged in significant preparatory activities prior to beginning his new\nventure, none of these actions suggest Abrea did not continue to act in Pacific's interests\nwhile he was employed by Pacific. Abrea may contact his former clients on behalf of Global\nafter his employment by Pacific has officially ended, as long as he did not misappropriate\ntheir contact information from Pacific."}, {"n": 36, "q": "Bob Douglas, CFA, is considering leaving his current employer to compete in the same field.\nHe did not sign a non-compete clause when he was hired. According to the Code and\nStandards, he may:", "opts": ["begin competing with his current employer as long as the employer has been informed of Douglas' intentions.", "prepare to compete with his current employer, but not begin competing until his resignation is effective.", "not begin competing or prepare to begin competing until his resignation becomes effective."], "ans": "B", "expl": "Douglas may plan and prepare to compete with his current employer, but may not begin\ncompeting until his resignation is effective or he gets permission from his employer.\nStandard IV(A) Loyalty states that when members and candidates are leaving an employer,\nthey must act in the employer's interests until their separation becomes effective.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 37, "q": "Mark Roberts has resigned from a local investment advisory firm and begun working at\nBenjamin Investments. Without getting approval from his supervisor at Benjamin, Roberts\nuses a phone book to find the contact information of his old clients and asks for their\ncontinued business. Has Roberts violated any CFA Institute Standards of Professional\nConduct?", "opts": ["No.", "Yes, because he is not allowed to solicit his former clients.", "Yes, because he must obtain written consent from his current supervisor."], "ans": "A", "expl": "Roberts has not violated the Standards. According to Standard IV(A) Loyalty, Roberts may\nsolicit his old clients providing he does not use any records from his prior employer\nwithout permission. Roberts may use publicly available information, such as a phone book,\nto contact his former clients.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 38, "q": "Michel Marchant, CFA, recently became an independent money manager. After six months,\nhe has only ten clients. To supplement his income, Marchant accepted employment as an\nadvisor at Middleton Financial Advisors. According to Standard IV(A) Loyalty, Marchant is\nrequired to:", "opts": ["attempt to bring his existing clients to Middleton.", "inform his existing clients about his new employment at Middleton.", "obtain permission from Middleton to continue his independent practice."], "ans": "C", "expl": "Because Marchant's independent practice may conflict with Middleton's interests,\nStandard IV(A) Loyalty requires that Marchant obtain permission from Middleton to\ncontinue it. Neither of the other choices describes a requirement of Standard IV(A)."}, {"n": 39, "q": "Jane Talbot, CFA, is a portfolio manager at Cavalier Investments. Talbot manages the account\nof Wendall Wilcox. The performance of Wilcox's portfolio has been below that of the\nbenchmark portfolio, the S&P 500, for the past several years. In an effort to enhance his\nportfolio's performance, Wilcox offers to pay Talbot $2,000 each year that his portfolio's\nreturn exceeds that of the S&P 500. Wilcox suggests this arrangement last for the next three\nyears. According to the Code and Standards, Talbot is required to:", "opts": ["obtain permission from Cavalier and disclose the nature of the compensation, the amount of compensation, and the duration of the agreement.", "disclose to Cavalier the nature of the compensation, the amount of compensation, and the duration of the agreement.", "obtain permission from Cavalier before accepting this compensation from Wilcox."], "ans": "A", "expl": "Standard IV(B) Additional Compensation Arrangements requires members and candidates\nto obtain permission from their employers before accepting such compensation from\nclients or third parties, In addition, Talbot must disclose the terms of any agreement under\nwhich Talbot will receive additional compensation, including the nature of the\ncompensation, the amount of compensation, and the duration of the agreement, but this\nis not a requirement of the Standard.\n(Module 91.6, LOS 91: IV(B))"}, {"n": 40, "q": "Which of the following statements regarding employee/employer relationships is NOT\ncorrect?", "opts": ["A written contract may or may not exist between employer and employee.", "An employee is someone in the service of another.", "There must be monetary compensation for an employer/employee relationship to exist."], "ans": "C", "expl": "Monetary compensation is not a requirement of the employee/employer relationship."}, {"n": 41, "q": "Which of the following is least likely a recommended procedure for supervisors and\ncompliance officers to comply with Standard IV(C) Responsibilities of Supervisors?", "opts": ["Hold hearings when violations have occurred to determine the severity of the violations.", "Incorporate a professional conduct evaluation into the employee's performance review.", "Disseminate the firm's compliance procedures to employees."], "ans": "A", "expl": "While a supervisor should respond promptly and investigate violations, there is no\nobligation to hold hearings when violations have occurred.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 42, "q": "Sharon West is a CFA charterholder and trust officer for REO Trust Company. Soon after\nbeginning work for REO, West finds that REO has been conducting all its securities\ntransactions through her brother who is a registered representative. West's brother charges\nREO commissions that are equal to the lowest available from another broker. West's brother\ntells her that if she continues doing business with him, he will give her a substantial discount\non all personal transactions she conducts through him. West:", "opts": ["does not need to inform her employer of the arrangement because the commissions her brother charges the firm are the lowest available.", "must reject the arrangement.", "must inform her employer of the arrangement because it provides her with additional compensation."], "ans": "C", "expl": "Members are required to disclose to their employer in writing all monetary compensation\nor other benefit they receive from clients or third parties in addition to the employer's\ncompensation, and obtain the employer's permission for such arrangements."}, {"n": 43, "q": "Pamela Gee is a portfolio manager. She is planning to establish her own money\nmanagement firm. She has already informed her employer, Branford, Inc., about her plans.\nIn her remaining time at Branford, she may:", "opts": ["solicit Branford colleagues but not Branford clients.", "start the registration of her new company.", "inform her current clients about her resignation and let them know how to reach her."], "ans": "B", "expl": ""}, {"n": 44, "q": "To comply with Standard IV(B), Additional Compensation Arrangements, members should do\nall of the following EXCEPT:", "opts": ["immediately make a written report to their employer specifying any compensation benefits they receive.", "reject any outside compensation immediately because it is not appropriate to accept outside compensation in a business setting.", "state the terms of oral or written agreements regarding the compensation and the duration of the agreement."], "ans": "B", "expl": "There is no reason to reject any outside compensation immediately because it is\ninappropriate to accept it. However, all outside arrangements must be reported to the\nmember's employer.\n(Module 91.6, LOS 91: IV(B))"}, {"n": 45, "q": "According to the CFA Institute Standards of Professional Conduct, which of the following\nstatements about members with supervisory responsibility is least accurate? Members with\nsupervisory responsibility:", "opts": ["must make reasonable efforts to detect violation of laws, rules, regulations, and the Code and Standards.", "are relieved of their supervisory responsibility if they delegate their supervisory duties to other members of CFA Institute.", "are expected to have in-depth knowledge of the Code and Standards and to apply this knowledge in discharging their supervisory responsibilities."], "ans": "B", "expl": "Although members who supervise large numbers of employees may delegate supervisory\nduties, such delegation does not relieve them of their supervisory responsibility.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 46, "q": "Which of the following examples of supervisory responsibility is consistent with the\nrequirements of the Code and Standards?", "opts": ["A professional conduct evaluation is part of an employee’s performance review.", "A firm’s compliance policies allow a portfolio manager to designate a trade to an account or portfolio after the outcome of the trade is known.", "A supervisor's income is partially based on the firm’s overall level of trading activity."], "ans": "A", "expl": "According to Standard IV(C) Responsibilities of Supervisors, supervisors must make\nreasonable efforts to detect and prevent violations of laws, rules, regulations, and the\nCode and Standards by anyone under their authority. Incorporating a professional conduct\nevaluation as part of an employee's performance review is a recommended compliance\nprocedure.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 47, "q": "Jack Salyers, CFA, is considering starting his own firm to compete with his current employer.\nHe takes several actions before turning in his resignation. Which of the following actions\nleast likely violates the Standard concerning loyalty? Salyers:", "opts": ["registers his new firm with the government’s financial regulators.", "informs clients he has been serving that he is forming a new firm and offers them a discount on fees if they move their accounts to the new firm.", "copies computer models he has been using to form a reasonable basis for his investment recommendations."], "ans": "A", "expl": "Under Standard IV(A) Loyalty, making preparations to start a competing business while still\nemployed is acceptable. Soliciting the employer's clients and taking the employer's\nproperty (such as computer models) violate the Standard.\n(Module 91.6, LOS 91: IV(A))"}, {"n": 48, "q": "An analyst needs to inform his supervisor in writing of which of the following?", "opts": ["A client and the analyst alternate paying for lunch at a local sandwich shop.", "An annual bonus, sent to the analyst by a client, which varies with the performance of the client's portfolio that the analyst manages as an employee even though no verbal or written agreement exists about the bonus.", "Both the lunch and the bonus mentioned in the other answers."], "ans": "B", "expl": "Standard IV(B) requires that members disclose to their employer in writing all benefits that\nthey receive in addition to their regular compensation for services they perform on behalf\nof their employer. Since the bonus varies with the performance of the client's portfolio,\nthere is a clear link to the services of the analyst. The analyst is not required to report the\nlunch since it is not linked to performance.\n(Module 91.6, LOS 91: IV(B))"}, {"n": 49, "q": "An analyst belongs to a nationally recognized charitable organization, which requires dues\nfor membership. The analyst has worked out a deal where he provides money management\nadvice in lieu of paying dues. Which of the following must the analyst do?", "opts": ["Resign from the position because the relationship is a conflict with the Standards.", "Nothing since he is not an employee of the charitable organization.", "Must treat the charitable organization as his employer."], "ans": "C", "expl": "An employee/employer relationship does not necessarily mean monetary compensation\nfor services. If the analyst is performing services for the organization, then the analyst\nmust treat the position as if he were an employee."}, {"n": 50, "q": "Grant Starks, CFA, has been working for Advisors, Inc., for eight years. Starks is about to start\nhis own money management business and has given his two-week notice of his resignation.\nA few days before his resignation takes effect, a current client of Advisors calls him at his\noffice to inquire about some services for her account at Advisors. During the conversation,\nStarks tells the client that his new business will have lower commissions than Advisors.\nStarks has most likely violated the Standard concerning:", "opts": ["avoidance or disclosure of conflicts.", "communication with clients and prospective clients.", "loyalty."], "ans": "C", "expl": "Standard IV(A) Loyalty requires members and candidates who are leaving an employer to\nact in their employer's interest until their departure takes effect."}, {"n": 51, "q": "Edwin McNeill, CFA, is a senior trader for Grey Securities. In his monthly review of his team's\nactivity, McNeill notices a series of suspicious trades by one of the traders. McNeill consults\nhis manager, who agrees that these trades are a potential violation. McNeill informs the\ntrader that her duties will be restricted while these trades are being investigated and refers\nthe matter to Grey's compliance officer for further action. McNeill has:", "opts": ["not violated the Standards.", "violated Standard IV(C) Responsibilities of Supervisors by failing to prevent a potential violation.", "violated Standard IV(C) Responsibilities of Supervisors by restricting the trader’s duties before the investigation is completed."], "ans": "A", "expl": "By reviewing the employee's conduct, restricting the employee's activities while\ninvestigating a potential violation, and referring the matter to his manager and compliance\nofficer, McNeill acted properly according to Standard IV(C) Responsibilities of Supervisors.\nWrongdoing by a subordinate does not mean the manager has violated Standard IV(C) as\nlong as the manager has made reasonable efforts to detect and prevent violations.\n(Module 91.6, LOS 91: IV(C))"}, {"n": 52, "q": "Dave Kline, CFA, is a personal investment advisor with 200 individual, family, and corporate\naccounts. After a dispute with a coworker on margin policy, he formally resigns his position\nby giving suitable notice. However, he does not follow his firm's established \"Transition and\nExit Policies\" regarding his accounts. The firm's stated policies require him to notify each\nclient of his planned departure and personally introduce them to their new account\nrepresentative, Greg Potter. Kline sees Potter as a rival and states \"...let Potter do his own\nwork and find his own clients.\" Kline is most likely:", "opts": ["in violation of Standard I(D) \"Misconduct\" for leaving clients subject to an account representative he does not find suitable.", "in violation of Standard IV(A) \"Loyalty\" for failing to follow the employer’s policies and procedures related to notifying clients of his departure.", "not in violation of the Code and Standards."], "ans": "B", "expl": "Kline is in violation of Standard IV(A) \"Loyalty\" for failing to follow the employer's policies\nand procedures related to notifying clients of his departure."}, {"n": 53, "q": "David Saul, CFA, heads the trust department at Savage National Bank. Fairway Enterprises\ninvites Saul to sit on its Board of Directors. In return for his services on the Board, Fairway\noffers to provide Saul and his family with access to the facilities at Wilmont Country Club at\nno cost. Saul will not receive any monetary compensation for his services on the Board.\nAccording to CFA Institute Standards of Professional Conduct, which of the following actions\nmust Saul take?", "opts": ["Saul must disclose in writing to Savage Bank the terms of the offer whether or not he accepts the offer to serve on the Board of Directors.", "Saul must obtain written consent from Savage Bank and Fairway Enterprises if he decides to accept the offer to serve on the Board of Directors.", "Saul must reject the offer to serve on the Board of Directors."], "ans": "B", "expl": "Standard IV(B) requires that members obtain written consent from all parties involved\nbefore accepting monetary compensation or other benefits that they receive for their\nservices that are in addition to compensation or benefits conferred by a member's\nemployer. The phrase \"all parties\" is referring to Saul's employer and Fairway's Board of\nDirectors."}, {"n": 54, "q": "Which of the following statements is most accurate about the Standard concerning the\nresponsibilities of supervisors?", "opts": ["If a supervisor makes a reasonable effort to detect violations, but fails to detect a violation that occurs, she has violated the Standard.", "If a supervisor does not make a reasonable effort to detect violations, she is in violation of the Standard even if no violations by her subordinates have occurred.", "If a subordinate violates a securities law, her supervisor is in violation of the Standard."], "ans": "B", "expl": "Standard IV(C) Responsibilities of Supervisors requires members to make a reasonable\neffort to detect and prevent violations by their subordinates of applicable laws,\nregulations, and rules. Violations by subordinates do not necessarily mean the supervisor\nhas violated this Standard if the supervisor has made reasonable efforts to detect and\nprevent violations"}];
const CFG = {"title": "Guidance for Standard IV", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.6 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
</html>
