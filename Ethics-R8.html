<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Nancy Korthauer, CFA, has launched a new hedge fund called the Korthauer Tautology Fund\nbut has had trouble hiring analysts who are CFA charterholders as well as with finding\nclients. She offers a $15,000 incentive bonus to any charterholder who joins the firm with\nover $1 million in committed client investments. Which of the following interpretations of\nthe Code and Standards is most accurate?","opts":["A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided clients are informed of the incentive bonus.","A member or candidate may arrange for current clients to switch to the Korthauer Tautology Fund provided the member or candidate refuses to accept the incentive bonus.","A member or candidate may not solicit current clients away from their current employer."],"ans":"C","expl":"Thành viên hoặc ứng viên không được lôi kéo khách hàng hiện tại từ chủ lao động hiện tại của họ\ntheo Tiêu chuẩn IV(A) \"Lòng trung thành\"."},{"n":2,"q":"Dixie Miller, a Level II CFA candidate, heads the research department of a large brokerage\nfirm. The firm has many analysts, some of whom are subject to the CFA Institute Code of\nEthics and Standards of Professional Conduct. If Miller delegates some of her supervisory\nduties, which statement best describes her responsibilities under the CFA Institute Code and\nStandards?","opts":["CFA Institute Standards prevent Miller from delegating supervisory duties to subordinates.","Miller retains supervisory responsibilities for those duties delegated to her subordinates.","Miller's supervisory responsibilities do not apply to those subordinates who are not subject to the CFA Institute Code and Standards."],"ans":"B","expl":"Mặc dù các thành viên có thể ủy quyền nhiệm vụ giám sát, việc ủy quyền đó không làm giảm bớt\ncác thành viên giám sát trách nhiệm.\n(Mô-đun 91.6, LOS 91: IV(C))"},{"n":3,"q":"Jill Borowski, CFA, works for Advisors where she manages a portfolio for a wealthy family.\nBorowski earns 1% of the portfolio's value each year in the form of a commission from\nAdvisors. The family just told her that any year the portfolio she manages earns more than a\n10% return, the family will give her the use of the family's vacation home for one week. With\nrespect to the Code and Standards, this proposal most accurately represents:","opts":["an ethical violation from which the Standards require Borowski to dissociate herself.","a gift or benefit which the Standards recommend Borowski disclose to her employer.","an additional compensation arrangement which the Standards require Borowski to receive her employer’s consent before accepting."],"ans":"C","expl":"Thỏa thuận bồi thường bổ sung IV(B) tiêu chuẩn yêu cầu các thành viên và\nnhận được sự đồng ý bằng văn bản từ người sử dụng lao động của họ trước khi chấp nhận các lợi ích từ\nkhách hàng có thể ảnh hưởng đến tính khách quan hoặc lòng trung thành của họ. Quà tặng từ một khách hàng phụ thuộc\nkiếm được lợi nhuận tối thiểu có thể khiến thành viên hoặc ứng viên\nưu tiên lợi ích của khách hàng đó hơn lợi ích của các khách hàng khác.\n(Mô-đun 91.6, LOS 91: IV(B))"},{"n":4,"q":"Chris Babcock, CFA, a portfolio manager for a large Texas investment firm, has been offered\ncompensation in addition to what her firm pays her. The offer is from one of her clients and\nthe additional compensation will be based on her yearly performance in excess of the\nmarket index. Babcock should:","opts":["make written disclosure to all parties involved before she accepts this offer.","make written disclosure to her other clients before she accepts this offer.","turn down the offer because it represents a clear conflict between this client and Babcock's other clients."],"ans":"A","expl":"Tiêu chuẩn IV(B), Thỏa thuận bồi thường bổ sung, áp dụng trong trường hợp này. Tiêu chuẩn\nIV(B) nêu rõ: \"Không nhận quà tặng, lợi ích, thù lao hoặc sự đền bù nào với\ncó thể tạo ra xung đột lợi ích với lợi ích của người sử dụng lao động trừ khi nhận được sự đồng ý bằng văn bản\ntừ tất cả các bên.\"\nTừ khóa ở đây là \"sự đồng ý bằng văn bản\" - các thành viên phải có được sự đồng ý bằng văn bản vì\nnhững thỏa thuận như vậy có thể ảnh hưởng đến lòng trung thành và tính khách quan và tạo ra xung đột tiềm ẩn về\nlợi ích."},{"n":5,"q":"Analysts who undertake an independent consulting practice while employed must get\npermission from their employer and should disclose all of the following EXCEPT:","opts":["the clients contact information.","the compensation or benefit to be received.","the anticipated duration of the service to be rendered."],"ans":"A","expl":"Thành viên hoặc Ứng viên không bắt buộc phải tiết lộ thông tin bí mật về\nkhách hàng độc lập của mình.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":6,"q":"Jason Blackwell, CFA, works as an investment banker for Mega Capital. Sylvia Lego, a friend\nof Blackwell who has an independent investment advisory practice, asks Blackwell to help\nher review client portfolios during evenings and weekends for a fee. According to the\nStandard concerning loyalty, under what conditions may Blackwell accept this arrangement?","opts":["Blackwell must disclose to Mega Capital the additional compensation that will result from the arrangement, but is not required to obtain their consent.","Blackwell must notify Mega Capital about the terms of the arrangement and obtain their consent.","None, because this arrangement would put Blackwell into competition with Mega Capital."],"ans":"B","expl":"Tiêu chuẩn IV(A) Lòng trung thành quy định rằng trước khi tham gia hành nghề độc lập để nhận được thù lao\n, các thành viên và ứng viên phải thông báo cho nhà tuyển dụng của họ về các dịch vụ mà họ\nsẽ cung cấp cũng như thời lượng và mức thù lao dự kiến, đồng thời phải nhận được sự đồng ý từ\nngười sử dụng lao động của họ trước khi bắt đầu hành nghề độc lập.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":7,"q":"If a member or candidate wishes to engage in independent practice that may conflict with\nher employer's interests, she is least likely required to notify her employer of:","opts":["the number of clients her practice will serve.","the compensation she will receive.","the types of services she will provide."],"ans":"A","expl":"Cô ấy phải cung cấp thông tin cho chủ lao động của mình về loại dịch vụ,\nthỏa thuận thù lao và thời gian dự kiến của dịch vụ.\n(Module 91.6, LOS 91: IV(A))"},{"n":8,"q":"All of the following activities might constitute a violation of Standard IV(A), Loyalty to\nEmployer, EXCEPT:","opts":["misuse of confidential information.","solicitation of the employer's clients following termination of employment.","solicitation of the employer's clients prior to termination of employment."],"ans":"B","expl":"Việc lôi kéo khách hàng của người sử dụng lao động trước khi chấm dứt việc làm sẽ cấu thành\nvi phạm Lòng trung thành với Nhà tuyển dụng, nhưng việc lôi kéo khách hàng sau khi chấm dứt hợp đồng sẽ\nkhông.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":9,"q":"An analyst working at an investment firm has a client that rents limousines. The client tells\nthe analyst that as long as he is the client's analyst, he can have free use of a limousine\nseveral times a year. The analyst needs to:","opts":["do nothing since the offer is not linked to the performance of the client's portfolio.","explicitly refuse such an offer.","inform his supervisor in writing of the offer if the analyst intends to accept the offer."],"ans":"C","expl":"Tiêu chuẩn IV(B) yêu cầu các thành viên tiết lộ cho chủ lao động của họ bằng văn bản tất cả các lợi ích mà\nhọ nhận được ngoài khoản thù lao thường xuyên cho các dịch vụ mà họ thực hiện thay mặt\ncủa ông chủ của họ. Họ cũng cần phải nhận được sự đồng ý từ người sử dụng lao động của họ bằng văn bản.\nBáo cáo bằng văn bản gửi cho người sử dụng lao động phải bao gồm chi tiết về mọi thỏa thuận bằng văn bản hoặc bằng miệng\nđể được trả thêm tiền. Nhà phân tích không cần phải từ chối lời đề nghị."},{"n":10,"q":"Selma Brown, CFA, is a portfolio manager for Mainland Securities. Rick Wood, one of her\nclients and owner of Wood Fitness Centers, offers to permit Brown and her immediate family\nto use the facilities at his fitness centers at no cost during 2003. To get this benefit, Brown\nmust achieve on Wood's portfolio at least a 2-percentage point return above the total return\non the S&P's 500 index during 2002. Brown orally informs her immediate supervisor of the\nnature and duration of the proposed arrangement.\nArnold Turley, a CFA Institute member, is a portfolio analyst at Mainland Securities. He was\njust elected to the Board of Directors for Omega Services, which pays him $1,000 plus\nexpenses for attending each of its quarterly board meetings. Turley e-mails Mainland's\ncompliance officer informing her of this arrangement with Omega and receives a reply\ninforming him that the agreement is acceptable.\nDid Brown or Turley violate CFA Institute Standards of Professional Conduct?","opts":["Brown: No, Turley: No.","Brown: Yes, Turley: No.","Brown: Yes, Turley: Yes."],"ans":"B","expl":"Brown đã vi phạm Tiêu chuẩn IV(B), Thỏa thuận bồi thường bổ sung, vì cô ấy phải\ntiết lộ bằng văn bản các lợi ích khác sẽ nhận được cho dịch vụ đó là ngoài khoản thù lao\ndo người chủ của cô ấy trao. Turley không vi phạm Tiêu chuẩn IV(B) vì anh\nđã nhận được sự đồng ý từ chủ lao động của mình bằng văn bản, bao gồm cả e-mail.\n(Module 91.6, LOS 91: IV(B))"},{"n":11,"q":"When a CFA Institute member who is presently employed by a firm undertakes any\nindependent practice, he must do all of the following EXCEPT:","opts":["disclose the expected duration of the services to be rendered.","remand a percentage (to be determined by the employee and employer) of the income earned back to the employer.","secure permission from the employer."],"ans":"B","expl":"Thành viên có nghĩa vụ phải xin phép chủ nhân của mình nếu anh ta cạnh tranh\ncạnh tranh với chủ nhân hiện tại của mình bằng bất kỳ cách nào. Họ phải cung cấp thông báo cho chủ lao động của mình\nmô tả loại dịch vụ sẽ được cung cấp, thời lượng dự kiến và mức thù lao\ncho các dịch vụ đó.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":12,"q":"Jacob Allen, CFA, decides he could make more money if he started his own company. Which\nof the following steps would most likely violate Standard IV(A) Loyalty?","opts":["Renting space for his new company and interviewing several candidates for the position of manager at the new company.","Soliciting, without written permission from his current employer, the business of former clients after he leaves his current employer.","Using his notes from prior research of a firm in a creating a new research report on the firm, after leaving his current employer."],"ans":"C","expl":"Các ghi chú của Allen từ nghiên cứu của anh ấy là hồ sơ của người sử dụng lao động và mặc dù anh ấy đã chuẩn bị chúng,\nviệc lấy chúng từ người chủ của anh ấy mà không được phép là vi phạm. Việc lôi kéo hoạt động kinh doanh của khách hàng cũ\nbản thân nó không phải là vi phạm miễn là Allen không chiếm đoạt\nthông tin khách hàng từ chủ cũ của mình. Việc chuẩn bị bắt đầu một hoạt động kinh doanh mới không nhất thiết\nvi phạm Tiêu chuẩn, mặc dù việc lôi kéo khách hàng hiện tại hoặc tuyển dụng\nnhân sự khác của công ty cho liên doanh mới, trước khi chính thức rời khỏi chủ của mình, sẽ là\nvi phạm Tiêu chuẩn.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":13,"q":"Which of the following statements is most correct under the Code and Standards?","opts":["CFA Institute members are prohibited from undertaking independent practice in competition with their employer.","Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer.","Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer."],"ans":"B","expl":"Các thành viên không bị cấm sắp xếp hoặc chuẩn bị tham gia\nhoạt động kinh doanh cạnh tranh trước khi chấm dứt mối quan hệ với chủ lao động của mình. CFA\nCác thành viên của Viện không bị cấm thực hiện hành nghề độc lập trong\ncạnh tranh với người sử dụng lao động của họ miễn là họ có được sự đồng ý từ người sử dụng lao động của mình.\nCác thành viên phải cung cấp thông báo cho người sử dụng lao động của mình mô tả các loại dịch vụ sẽ được\ncung cấp, thời lượng dự kiến và mức thù lao cho các dịch vụ đó."},{"n":14,"q":"Sue Parsons, CFA, works full-time as an investment advisor for the Malloy Group, an asset\nmanagement firm. Parsons wants to engage in independent practice in which she would\nadvise individual clients on their portfolios. She would conduct these investment activities\nonly on weekends. She is currently only in the preparation stage and has not started\nindependent practice yet. The Standard concerning loyalty:","opts":["does not require Parsons to notify Malloy of preparing an independent practice.","requires Parsons to obtain consent from both Malloy and the persons from whom she will engage in independent practice.","requires Parsons to notify Malloy that she is preparing to engage in independent practice."],"ans":"A","expl":"Tiêu chuẩn IV(A) Lòng trung thành phân biệt giữa \"thực hiện hoạt động độc lập\" và\nchuẩn bị bắt đầu thực hiện. Tiêu chuẩn yêu cầu Parsons phải có được sự đồng ý từ\nchủ lao động của cô ấy trước khi cô ấy tham gia vào hoạt động độc lập có thể dẫn đến việc nhận được thù lao\nhoặc lợi ích khác khi cạnh tranh với Malloy. Parsons không yêu cầu phải có được sự đồng ý\nkhi chỉ chuẩn bị hành nghề độc lập."},{"n":15,"q":"Nick O'Donnell, CFA, unsuspectingly joins the research team at Wickett & Co., an investment\nbanking firm controlled by organized crime. None of the managers at Wickett are CFA\nInstitute members. Because of his tenuous situation at Wickett, O'Donnell begins making\npreparations for independent practice. He knows he will be terminated if he informs\nmanagement at Wickett that he is preparing to leave. Consequently, he determines that \"if\nhe can just hang on for one year, he will likely have a client base sufficient for him to strike\nout on his own.\" This action is:","opts":["a violation of his duty to disclose conflicts to his employer.","a violation of his fiduciary duties.","not a violation of his duty to employer."],"ans":"C","expl":"O'Donnell phải có được sự đồng ý từ người chủ của mình nếu anh ấy đang cố gắng hành nghề trong cuộc cạnh tranh\nvới người chủ của mình. Chỉ thực hiện việc chuẩn bị rời đi mà không\nvi phạm nghĩa vụ, không vi phạm Quy tắc và Tiêu chuẩn."},{"n":16,"q":"Francisco Perez, CFA, is an equity research analyst for a long-term investment fund. The fund\nis seeking new clients, so Perez contacts old clients he knew through his former employer.\nWhich of the following is most accurate?","opts":["Perez can only solicit clients after notifying his former employer.","Perez cannot solicit clients from a former employer.","Perez is not prevented from soliciting clients as long as he is working from memory and publically available information rather than a list generated while he was still with the former employer."],"ans":"C","expl":"Theo Tiêu chuẩn IV(A), Perez không bị ngăn cản từ việc mời chào khách hàng miễn là anh ta\nlàm việc từ trí nhớ và thông tin có sẵn công khai thay vì một danh sách được tạo ra\nkhi anh ta vẫn còn làm việc cho người chủ cũ."},{"n":17,"q":"Which of the following statements is least accurate with regard to the Standard concerning\nloyalty to employers?","opts":["Employees planning to leave an employer must not engage in activities that would conflict with their duty to act in the employer’s best interest.","Former employees may contact clients of their previous firms if doing so does not violate a non-compete agreement and the contact information is obtained from public sources.","Skills and experience a former employee obtained through work at a firm are considered privileged information of that firm."],"ans":"C","expl":"Khi nhân viên rời công ty, các kỹ năng và kinh nghiệm có được của nhân viên đó không\nđược coi là bí mật hoặc đặc quyền. Hai câu còn lại đều chính xác.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":18,"q":"Bill Valley has been working for Advisors, Inc., for several years, and he just joined CFA\nInstitute. Valley's sister just received a large bonus in the form of stock options in Zephyr,\nInc. Valley's sister knows nothing about financial assets and offers Valley a week at her\nholiday home each year in exchange for Valley monitoring Zephyr and the value of her stock\noptions. In order to comply with the Code and Standards, Valley needs to inform Advisors of:","opts":["both the use of the holiday home and his sister's options.","nothing since no money is involved and it is a favor for a family member.","the compensation in the form of the use of the holiday home only."],"ans":"A","expl":"Theo Tiêu chuẩn IV(A), Vì lòng trung thành với Nhà tuyển dụng, Valley phải thông báo cho Cố vấn về\nviệc tư vấn bên ngoài của anh ấy ngay cả khi việc đó không phải để trả thù lao bằng tiền. Theo Tiêu chuẩn\nVI(A), Tránh hoặc tiết lộ xung đột, Valley cũng phải tiết lộ những xung đột lợi ích có thể xảy ra,\nvà vị trí của em gái anh ấy đủ điều kiện."},{"n":19,"q":"John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his\nown money management business and has given his two-week notice of his resignation from\nAdvisors. A few days before his resignation takes effect, on his lunch hour, he takes out a\nloan from a bank on behalf of his new business and uses the money to buy some office\nequipment for his new business. Since he engaged in these transactions while still an\nemployee of Advisors, Hill violated Standard IV(A), Loyalty to Employer, by:","opts":["breaching his duty of loyalty to his current employer by making preparations to go into a competitive business.","neither taking out the loan nor buying the equipment.","preparing to undertake independent practice before giving notice to his current employer of his intent to resign."],"ans":"B","expl":"Tiêu chuẩn hành nghề theo IV(A) quy định rằng nhân viên nghỉ việc \"thường được tự do\nsắp xếp hoặc chuẩn bị để tham gia vào một doanh nghiệp cạnh tranh trước khi chấm dứt\nhợp đồng mối quan hệ với người sử dụng lao động của nhân viên với điều kiện là những sự chuẩn bị đó không\nvi phạm nghĩa vụ trung thành của nhân viên.\" Cả hai hành động này đều không xung đột với\nlợi ích của Cố vấn và Hill đã thực hiện chúng theo thời gian riêng của mình."},{"n":20,"q":"A firm recently hired Hal Crane, CFA, to be a supervisor in the firm. Crane has reviewed the\nprocedures for complying with the Code and Standards in the company. It is Crane's belief\nthat the procedures need revision in order to be effective. Crane must:","opts":["decline supervisory responsibilities in writing until the company adopts an adequate compliance system.","exercise his supervisory responsibilities with the greater level of diligence required by the Code and Standards.","make reasonable efforts to encourage the company to adopt an adequate compliance system."],"ans":"A","expl":"Theo Tiêu chuẩn IV(C) Trách nhiệm của Các giám sát viên, nếu Crane tin rằng các quy trình tuân thủ\ncủa công ty là không đầy đủ, Crane nên từ chối trách nhiệm giám sát\nbằng văn bản cho đến khi hệ thống phù hợp được áp dụng."},{"n":21,"q":"Martin Tripp, CFA, is vice-president of the equity department at Walker Financial, a large\nmoney management firm. Of the twenty analysts in his department for whom he has\nsupervisory responsibility, eight are subject to CFA Institute Standards of Professional\nConduct. Tripp believes that he cannot personally evaluate the conduct of the twenty\nanalysts on a continuing basis. Therefore, he plans to delegate some of his supervisory\nduties to Sarah Green, who is subject to the Standards, and some to Bob Brown, who is not\nsubject to the Standards. According to CFA Institute Standards of Professional Conduct,\nwhich of the following statements about Tripp's ability to delegate supervisory duties is most\naccurate?","opts":["Tripp may not delegate any of his supervisory duties to either Green or Brown.","Tripp may delegate some or all of his supervisory duties only to Green because she is subject to the Standards.","Tripp may delegate some or all of his supervisory duties to Brown, even though Brown is not subject to the Standards."],"ans":"C","expl":"Tiêu chuẩn IV(C) Trách nhiệm của Người giám sát cho phép Tripp ủy quyền nhiệm vụ giám sát\ncho Green, Brown hoặc cả hai, nhưng việc ủy quyền đó không làm giảm bớt trách nhiệm giám sát của Tripp\ntrách nhiệm."},{"n":22,"q":"Wanda Kirby, CFA, recently joined Allegheny Investments as a senior analyst. Because of her\nextensive experience in the investments business and knowledge of the Code and\nStandards, Allegheny's management asked her to assume supervisory responsibility. Kirby\nreviewed Allegheny's existing compliance system and determined that it was inadequate to\nallow her to clearly discharge her supervisory responsibility. According to CFA Institute\nStandards, Kirby should:","opts":["agree to accept supervisory responsibility and to develop reasonable procedures to allow her to adequately exercise such responsibility.","agree to accept supervisory responsibility provided that Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility.","decline in writing to accept supervisory responsibility until Allegheny adopts reasonable procedures to allow her to adequately exercise such responsibility."],"ans":"C","expl":"Nếu Kirby rõ ràng không thể thực hiện trách nhiệm giám sát do hệ thống tuân thủ\nkhông đầy đủ, cô ấy nên từ chối bằng văn bản để nhận trách nhiệm giám sát cho đến\nAllegheny áp dụng các thủ tục hợp lý để cho phép cô thực hiện đầy đủ\ntrách nhiệm đó."},{"n":23,"q":"Janet Thompson, CFA, is employed as an analyst by Nationwide Securities. According to CFA\nInstitute Standards of Professional Conduct, which of the following statements about\nThompson's duty to Nationwide is NOT correct? Thompson must refrain from:","opts":["engaging in any conduct that would injure Nationwide.","engaging in independent competitive activity that could conflict with the business of Nationwide unless she receives written consent.","making arrangements to go into a competitive business before terminating her relationship with Nationwide."],"ans":"C","expl":"Tiêu chuẩn IV(A) cho phép Thompson chuẩn bị lên đường tham gia vào một doanh nghiệp cạnh tranh\ntrước khi chấm dứt mối quan hệ của cô với Nationwide với điều kiện là việc chuẩn bị đó không\nkhông vi phạm nghĩa vụ trung thành của cô."},{"n":24,"q":"A CFA Institute member, undertaking independent practice that could result in\ncompensation or other benefit:","opts":["must notify his employer and clients of the types of service to be rendered and the expected compensation.","must notify his employer of the types of service to be rendered, the expected duration, and the expected compensation.","must notify the entities for whom he plans to undertake independent practice of the compensation he receives from his employer."],"ans":"B","expl":"Theo Tiêu chuẩn IV(A), Lòng trung thành với Nhà tuyển dụng, thành viên Viện CFA, thực hiện\nhành nghề độc lập có thể dẫn đến thù lao hoặc lợi ích khác, phải thông báo cho\nchủ lao động của mình về các loại dịch vụ sẽ được cung cấp, thời lượng dự kiến và mức thù lao\ndự kiến."},{"n":25,"q":"May Frost, CFA, is an equity research analyst for a \"precious metals mining\" exchange traded\nfund which has recently started significantly outperforming its benchmark after several\nyears of stagnation. Upon investigating the source of the outperformance, Frost learns that\nthe fund has experienced severe style drift, and now has a significant proportion of its\nresources invested in technology and internet stocks. Frost reviews the fund's prospectus\nand learns the current sector weighting violates multiple prospectus covenants. Frost\ncontacts her supervisor and the fund's compliance department and is told the portfolio\nweighting is not her responsibility and that she should not pursue the matter further. Frost\nreviews the firm's whistleblower policy, contacts personal legal counsel, and then contacts\nregulatory authorities regarding the style drift and prospectus violations. Frost is most likely:","opts":["not in violation of the Code and Standards.","in violation of the Standard on preservation of confidentiality.","in violation of the Standard on loyalty."],"ans":"A","expl":"Quy tắc và Tiêu chuẩn không cấm các hành động tố cáo, miễn là những hành động này\nkhông vi phạm luật hoặc quy định hiện hành.\n(Học phần 91.6, LOS 91: IV(A))"},{"n":26,"q":"Brian Bellow, CFA, is a portfolio manager for Progressive Trust Company. Several friends\nhave asked Bellow to review their investment portfolios. On his own time, Bellow examines\ntheir portfolios and makes several recommendations. He accepts no compensation from his\nfriends for his investment advice. According to CFA Institute Standards of Professional\nConduct, did Bellow violate his duty to Progressive Trust?","opts":["No, because Bellow provided no ongoing investment advice.","Yes, because Bellow did not attempt to solicit his friends to become clients of his employer.","No, because Bellow received no compensation for his services."],"ans":"C","expl":"Tiêu chuẩn IV(A) Lòng trung thành yêu cầu các thành viên và ứng viên tiết lộ cho người sử dụng lao động của họ\nbất kỳ hoạt động độc lập nào để được trả thù lao. Trong trường hợp này, Bellow không nhận được bất kỳ\ntiền bồi thường nào cho lời khuyên của mình và do đó không tham gia vào hoạt động độc lập."},{"n":27,"q":"Jill Marsh, CFA, works for Advisors where she manages various portfolios. Marsh's godfather\nis an accountant and has done Marsh's tax returns every year as a birthday gift. Marsh's\ngodfather has recently become a client of Advisors and asked specifically for Marsh to\nmanage his account. In order to comply Standard IV(B), Disclosure of Additional\nCompensation Arrangements, she needs to:","opts":["do neither of the actions listed here.","have her godfather cease doing her taxes.","liquidate from her personal portfolio any stocks her godfather owns and verbally tell her supervisor about the tax services."],"ans":"A","expl":"Tiêu chuẩn IV(B) yêu cầu các thành viên tiết lộ cho chủ lao động của họ bằng văn bản tất cả các phúc lợi mà\nhọ nhận được ngoài khoản thù lao thường xuyên cho các dịch vụ mà họ thực hiện thay mặt cho chủ lao động\ncủa họ. Không phải là không có lý khi cha đỡ đầu của một cá nhân tặng họ một món quà sinh nhật\n. Hơn nữa, vì dịch vụ thuế là món quà sinh nhật thường xuyên trước khi\ncha đỡ đầu của cô trở thành khách hàng, điều này ngụ ý rằng chúng không liên quan đến bất kỳ dịch vụ quản lý\nđầu tư nào."},{"n":28,"q":"John Hill, CFA, has been working for Advisors, Inc., for eight years. Hill is about to start his\nown money management business and has given his two weeks' notice of his resignation\nfrom Advisors. A few days before his resignation takes effect, Rod Bright, a former client of\nAdvisors, calls Hill at his home about his new firm. Bright says that he is very happy that Hill\nis leaving Advisors because now he and Hill can resume a professional relationship. Bright\nsays that he would never become a client of Advisors again. Hill promises to call Bright back\nafter he has left Advisors but takes no further action. Hill does not tell Advisors about the\ncall. Hill has most likely:","opts":["not violated the Standards.","violated the Standard concerning loyalty to employer.","violated the Standard concerning avoidance or disclosure of conflicts."],"ans":"A","expl":"Dựa trên thông tin ở đây, Hill không vi phạm Tiêu chuẩn. Cuộc gọi điện thoại không\nvới khách hàng hiện tại của Cố vấn và cá nhân này đã nói rõ rằng anh ta sẽ không\ntrở thành khách hàng của Cố vấn. Do đó, Hill\nkhông vi phạm lòng trung thành với Cố vấn vì không hành động vì lợi ích của chủ lao động cũng như không có xung đột lợi ích."},{"n":29,"q":"Which of the following statements is most correct concerning a member's obligation to his\nor her employer under the Code and Standards?","opts":["Consent from the employer is necessary to permit independent practice that could result in compensation or other benefits in competition with the member's employer.","Members are prohibited from making arrangements or preparations to go into competitive business before terminating their relationship with their employer.","Members are prohibited from undertaking independent practice in competition with their employer."],"ans":"A","expl":"Không có lệnh cấm chung đối với hoạt động độc lập cạnh tranh với người chủ của một\nthành viên. Thành viên phải được sự cho phép của người sử dụng lao động. Các thành viên\ncó thể chuẩn bị tham gia vào một hoạt động kinh doanh cạnh tranh nhưng không được thu hút khách hàng của\nnhà tuyển dụng miễn là các thành viên vẫn còn làm việc cho nhà tuyển dụng."},{"n":30,"q":"Theresa Hatcher, CFA, is making arrangements to establish her own investment advisory\nbusiness before terminating her relationship with her current employer, Elite Brokers, Inc.\nElite is a small company consisting of only six investment professionals and a small support\nstaff. According to CFA Institute Standards of Professional Conduct, which of the following\nactivities is least likely a violation of Hatcher's duty to Elite?","opts":["Hatcher engages in secret negotiations with two other investment professionals and her administrative assistant to leave Elite in order to join her new business.","Hatcher leases office space, furniture, and other equipment for her new business.","Hatcher solicits Elite's clients before her termination of employment at Elite."],"ans":"B","expl":"Tiêu chuẩn IV(A) cho phép Hatcher chuẩn bị bắt đầu một hoạt động mới, chẳng hạn như\ncho thuê không gian văn phòng, đồ nội thất và các thiết bị khác nhưng không tham gia vào hoạt động khác\ncác hoạt động có thể vi phạm nghĩa vụ của cô ấy với người sử dụng lao động.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":31,"q":"Nicholas Brynne, CFA, develops a trading model while working for CE Jones, an investment\nmanagement firm. By working on the model at home from his personal computer, Brynne is\nable to devote additional work hours. Although the trading model is successful, Brynne loses\nhis job in a company restructuring, and decides to start his own practice using the trading\nmodel. Nicholas is most likely:","opts":["in violation of the Standards because he did not have permission to build the trading model using his home computer.","in violation of the Standards because he did not receive permission from his employer to keep or use the files after employment ended.","not in violation of the Standards because the trading model was created using his home computer."],"ans":"B","expl":"Brynne vi phạm Tiêu chuẩn IV(A) “Lòng trung thành.” Hồ sơ của nhà tuyển dụng bao gồm các mục được lưu trữ trong\nbất kỳ phương tiện nào kể cả máy tính ở nhà.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":32,"q":"Jennifer Stewart, CFA, a supervisor at an investment advisory firm, has tried unsuccessfully\nto convince top management of the firm's need for a formal, comprehensive compliance\nprogram. What is Stewart's most appropriate course of action?","opts":["Decline in writing to accept supervisory responsibility.","Rely on the Code and Standards to perform her duties as a supervisor.","Resign from the firm if no compliance program is instituted."],"ans":"A","expl":"Theo Trách nhiệm của Giám sát viên Tiêu chuẩn IV(C), Stewart nên từ chối\nbằng văn bản để chấp nhận trách nhiệm giám sát cho đến khi công ty áp dụng sự tuân thủ đầy đủ\nquy trình.\n(Mô-đun 91.6, LOS 91: IV(C))"},{"n":33,"q":"Which of the following activities will least likely constitute a violation of Standard IV(A),\nLoyalty?","opts":["Consulting on your own time and obtaining written permission from your employer.","Contacting your current clients and asking them to \"come with you\" when you resign from your current employer.","Conspiracy to bring about a mass resignation of other employees."],"ans":"A","expl":"Tư vấn theo thời gian của riêng bạn và nhận được sự cho phép bằng văn bản từ chủ lao động của bạn\nkhông cấu thành hành vi vi phạm Tiêu chuẩn IV(A).\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":34,"q":"Bill Fence, CFA, supervises a group of research analysts, none of whom have earned the CFA\ndesignation (nor are they CFA candidates). On several occasions he has attempted to get his\nfirm to adopt a compliance system to ensure that applicable laws and regulations are\nfollowed. However, the firm's principals have never adopted his recommendations. Fence\nshould most appropriately:","opts":["take no further action, because by encouraging his firm to adopt a compliance system he has fulfilled his obligations under the Code and Standards.","refuse supervisory responsibility.","report the inadequacy by submitting a complaint in writing to the CFA Institute Professional Conduct Program."],"ans":"B","expl":"Theo Tiêu chuẩn IV(C), Trách nhiệm của Người giám sát, nếu thành viên không thể\nthực hiện trách nhiệm giám sát do tuân thủ kém hoặc không tồn tại\nsystem, thành viên phải từ chối bằng văn bản để chấp nhận trách nhiệm giám sát cho đến khi\ncông ty áp dụng một hệ thống phù hợp."},{"n":35,"q":"Fernando Abrea, CFA was an analyst for Pacific Investments. In October he left Pacific and\njoined Global Securities as manager of a local office. Abrea's change of employment came\nabout in the following manner:\nIn April, Abrea contacted Global about a possible position he saw advertised in a\nfinancial publication and had exploratory meetings with Global.\nIn July, Abrea submitted a strategic plan to Global and signed an agreement to join\nGlobal. He then contracted for office space on behalf of Global.\nOn October 15, Abrea's resignation from Pacific became effective. He did not take any\nclient lists from Pacific.\nOn October 16, Abrea mailed a letter that explained his new undertaking with Global\nto prospective clients, including his former clients at Pacific.\nWith respect to Standard IV(A) Loyalty, Abrea:","opts":["violated the Standard by contracting for office space on behalf of Global.","did not violate the Standard.","violated the Standard by contacting his former clients at Pacific."],"ans":"B","expl":"Theo Tiêu chuẩn IV(A) Lòng trung thành, việc chuẩn bị nghỉ việc không bị cấm.\nMặc dù Abrea đã tham gia vào các hoạt động chuẩn bị quan trọng trước khi bắt đầu công việc kinh doanh\nmới của mình, nhưng không có hành động nào trong số này cho thấy Abrea đã không tiếp tục hành động vì lợi ích của Pacific\nkhi anh ấy còn làm việc cho Pacific. Abrea có thể thay mặt Global\nliên hệ với các khách hàng cũ của mình sau khi công việc của anh ấy ở Pacific chính thức kết thúc, miễn là anh ấy không chiếm đoạt\nthông tin liên hệ của họ từ Pacific."},{"n":36,"q":"Bob Douglas, CFA, is considering leaving his current employer to compete in the same field.\nHe did not sign a non-compete clause when he was hired. According to the Code and\nStandards, he may:","opts":["begin competing with his current employer as long as the employer has been informed of Douglas' intentions.","prepare to compete with his current employer, but not begin competing until his resignation is effective.","not begin competing or prepare to begin competing until his resignation becomes effective."],"ans":"B","expl":"Douglas có thể lập kế hoạch và chuẩn bị cạnh tranh với người chủ hiện tại của mình, nhưng không được bắt đầu\ncạnh tranh cho đến khi việc từ chức của anh ấy có hiệu lực hoặc anh ấy được người chủ cho phép.\nTiêu chuẩn IV(A) Lòng trung thành nêu rõ rằng khi các thành viên và ứng viên rời khỏi nhà tuyển dụng,\nhọ phải hành động vì lợi ích của nhà tuyển dụng cho đến khi việc chia tay của họ có hiệu lực.\n(Module 91.6, LOS 91: IV(A))"},{"n":37,"q":"Mark Roberts has resigned from a local investment advisory firm and begun working at\nBenjamin Investments. Without getting approval from his supervisor at Benjamin, Roberts\nuses a phone book to find the contact information of his old clients and asks for their\ncontinued business. Has Roberts violated any CFA Institute Standards of Professional\nConduct?","opts":["No.","Yes, because he is not allowed to solicit his former clients.","Yes, because he must obtain written consent from his current supervisor."],"ans":"A","expl":"Roberts không vi phạm Tiêu chuẩn. Theo Tiêu chuẩn IV(A) Loyalty, Roberts có thể\ngạ gẫm các khách hàng cũ của mình với điều kiện anh không sử dụng bất kỳ hồ sơ nào từ người chủ trước\nmà không được phép. Roberts có thể sử dụng thông tin có sẵn công khai, chẳng hạn như danh bạ điện thoại,\nđể liên hệ với khách hàng cũ của mình.\n(Module 91.6, LOS 91: IV(A))"},{"n":38,"q":"Michel Marchant, CFA, recently became an independent money manager. After six months,\nhe has only ten clients. To supplement his income, Marchant accepted employment as an\nadvisor at Middleton Financial Advisors. According to Standard IV(A) Loyalty, Marchant is\nrequired to:","opts":["attempt to bring his existing clients to Middleton.","inform his existing clients about his new employment at Middleton.","obtain permission from Middleton to continue his independent practice."],"ans":"C","expl":"Vì hoạt động độc lập của Marchant có thể xung đột với lợi ích của Middleton nên\nTiêu chuẩn IV(A) Lòng trung thành yêu cầu Marchant phải xin phép Middleton để\ntiếp tục đi. Cả hai lựa chọn khác đều không mô tả yêu cầu của Tiêu chuẩn IV(A)."},{"n":39,"q":"Jane Talbot, CFA, is a portfolio manager at Cavalier Investments. Talbot manages the account\nof Wendall Wilcox. The performance of Wilcox's portfolio has been below that of the\nbenchmark portfolio, the S&P 500, for the past several years. In an effort to enhance his\nportfolio's performance, Wilcox offers to pay Talbot $2,000 each year that his portfolio's\nreturn exceeds that of the S&P 500. Wilcox suggests this arrangement last for the next three\nyears. According to the Code and Standards, Talbot is required to:","opts":["obtain permission from Cavalier and disclose the nature of the compensation, the amount of compensation, and the duration of the agreement.","disclose to Cavalier the nature of the compensation, the amount of compensation, and the duration of the agreement.","obtain permission from Cavalier before accepting this compensation from Wilcox."],"ans":"A","expl":"Thỏa thuận bồi thường bổ sung theo tiêu chuẩn IV(B) yêu cầu các thành viên và ứng viên\nphải xin phép người sử dụng lao động trước khi chấp nhận khoản thù lao đó từ\nkhách hàng hoặc bên thứ ba. Ngoài ra, Talbot phải tiết lộ các điều khoản của bất kỳ thỏa thuận nào theo\nmà Talbot sẽ nhận được khoản bồi thường bổ sung, bao gồm bản chất của khoản bồi thường\n, số tiền bồi thường và thời hạn của thỏa thuận, nhưng điều này\nkhông phải là yêu cầu của Tiêu chuẩn.\n(Mô-đun 91.6, LOS 91: IV(B))"},{"n":40,"q":"Which of the following statements regarding employee/employer relationships is NOT\ncorrect?","opts":["A written contract may or may not exist between employer and employee.","An employee is someone in the service of another.","There must be monetary compensation for an employer/employee relationship to exist."],"ans":"C","expl":"Tiền lương không phải là yêu cầu trong mối quan hệ nhân viên/chủ lao động."},{"n":41,"q":"Which of the following is least likely a recommended procedure for supervisors and\ncompliance officers to comply with Standard IV(C) Responsibilities of Supervisors?","opts":["Hold hearings when violations have occurred to determine the severity of the violations.","Incorporate a professional conduct evaluation into the employee's performance review.","Disseminate the firm's compliance procedures to employees."],"ans":"A","expl":"Mặc dù người giám sát phải phản hồi kịp thời và điều tra các vi phạm nhưng không có\nnghĩa vụ tổ chức điều trần khi vi phạm xảy ra.\n(Học phần 91.6, LOS 91: IV(C))"},{"n":42,"q":"Sharon West is a CFA charterholder and trust officer for REO Trust Company. Soon after\nbeginning work for REO, West finds that REO has been conducting all its securities\ntransactions through her brother who is a registered representative. West's brother charges\nREO commissions that are equal to the lowest available from another broker. West's brother\ntells her that if she continues doing business with him, he will give her a substantial discount\non all personal transactions she conducts through him. West:","opts":["does not need to inform her employer of the arrangement because the commissions her brother charges the firm are the lowest available.","must reject the arrangement.","must inform her employer of the arrangement because it provides her with additional compensation."],"ans":"C","expl":"Các thành viên phải tiết lộ cho chủ lao động của mình bằng văn bản tất cả khoản bồi thường bằng tiền\nhoặc lợi ích khác mà họ nhận được từ khách hàng hoặc bên thứ ba ngoài chủ lao động\nbồi thường và xin phép người sử dụng lao động cho những thỏa thuận như vậy."},{"n":43,"q":"Pamela Gee is a portfolio manager. She is planning to establish her own money\nmanagement firm. She has already informed her employer, Branford, Inc., about her plans.\nIn her remaining time at Branford, she may:","opts":["solicit Branford colleagues but not Branford clients.","start the registration of her new company.","inform her current clients about her resignation and let them know how to reach her."],"ans":"B","expl":""},{"n":44,"q":"To comply with Standard IV(B), Additional Compensation Arrangements, members should do\nall of the following EXCEPT:","opts":["immediately make a written report to their employer specifying any compensation benefits they receive.","reject any outside compensation immediately because it is not appropriate to accept outside compensation in a business setting.","state the terms of oral or written agreements regarding the compensation and the duration of the agreement."],"ans":"B","expl":"Không có lý do gì để từ chối bất kỳ khoản bồi thường bên ngoài nào ngay lập tức vì đó\nkhông thích hợp để chấp nhận nó. Tuy nhiên, tất cả các thỏa thuận bên ngoài phải được báo cáo cho\nchủ lao động của thành viên.\n(Mô-đun 91.6, LOS 91: IV(B))"},{"n":45,"q":"According to the CFA Institute Standards of Professional Conduct, which of the following\nstatements about members with supervisory responsibility is least accurate? Members with\nsupervisory responsibility:","opts":["must make reasonable efforts to detect violation of laws, rules, regulations, and the Code and Standards.","are relieved of their supervisory responsibility if they delegate their supervisory duties to other members of CFA Institute.","are expected to have in-depth knowledge of the Code and Standards and to apply this knowledge in discharging their supervisory responsibilities."],"ans":"B","expl":"Mặc dù các thành viên giám sát số lượng lớn nhân viên có thể ủy quyền các nhiệm vụ giám sát\n, việc ủy quyền như vậy không làm giảm bớt trách nhiệm giám sát của họ.\n(Module 91.6, LOS 91: IV(C))"},{"n":46,"q":"Which of the following examples of supervisory responsibility is consistent with the\nrequirements of the Code and Standards?","opts":["A professional conduct evaluation is part of an employee’s performance review.","A firm’s compliance policies allow a portfolio manager to designate a trade to an account or portfolio after the outcome of the trade is known.","A supervisor's income is partially based on the firm’s overall level of trading activity."],"ans":"A","expl":"Theo Tiêu chuẩn IV(C) Trách nhiệm của Giám sát viên, người giám sát phải thực hiện\nnhững nỗ lực hợp lý nhằm phát hiện và ngăn chặn hành vi vi phạm luật pháp, quy tắc, quy định cũng như\nQuy tắc và Tiêu chuẩn của bất kỳ ai dưới quyền của họ. Việc kết hợp đánh giá hành vi chuyên nghiệp\nnhư một phần của đánh giá hiệu suất của nhân viên là một quy trình tuân thủ được khuyến nghị\n.\n(Mô-đun 91.6, LOS 91: IV(C))"},{"n":47,"q":"Jack Salyers, CFA, is considering starting his own firm to compete with his current employer.\nHe takes several actions before turning in his resignation. Which of the following actions\nleast likely violates the Standard concerning loyalty? Salyers:","opts":["registers his new firm with the government’s financial regulators.","informs clients he has been serving that he is forming a new firm and offers them a discount on fees if they move their accounts to the new firm.","copies computer models he has been using to form a reasonable basis for his investment recommendations."],"ans":"A","expl":"Theo Tiêu chuẩn IV(A) Lòng trung thành, việc chuẩn bị bắt đầu kinh doanh cạnh tranh trong khi\nđang làm việc là có thể chấp nhận được. Lôi kéo khách hàng của nhà tuyển dụng và lấy tài sản\ncủa nhà tuyển dụng (chẳng hạn như mô hình máy tính) vi phạm Tiêu chuẩn.\n(Mô-đun 91.6, LOS 91: IV(A))"},{"n":48,"q":"An analyst needs to inform his supervisor in writing of which of the following?","opts":["A client and the analyst alternate paying for lunch at a local sandwich shop.","An annual bonus, sent to the analyst by a client, which varies with the performance of the client's portfolio that the analyst manages as an employee even though no verbal or written agreement exists about the bonus.","Both the lunch and the bonus mentioned in the other answers."],"ans":"B","expl":"Tiêu chuẩn IV(B) yêu cầu các thành viên tiết lộ cho chủ lao động của họ bằng văn bản tất cả các lợi ích mà\nhọ nhận được ngoài khoản thù lao thường xuyên cho các dịch vụ mà họ thực hiện thay mặt\ncủa ông chủ của họ. Vì tiền thưởng thay đổi tùy theo hiệu quả hoạt động của danh mục đầu tư của khách hàng,\ncó mối liên hệ rõ ràng với các dịch vụ của nhà phân tích. Nhà phân tích không bắt buộc phải báo cáo\nbữa trưa vì nó không liên quan đến hiệu suất.\n(Mô-đun 91.6, LOS 91: IV(B))"},{"n":49,"q":"An analyst belongs to a nationally recognized charitable organization, which requires dues\nfor membership. The analyst has worked out a deal where he provides money management\nadvice in lieu of paying dues. Which of the following must the analyst do?","opts":["Resign from the position because the relationship is a conflict with the Standards.","Nothing since he is not an employee of the charitable organization.","Must treat the charitable organization as his employer."],"ans":"C","expl":"Mối quan hệ nhân viên/người sử dụng lao động không nhất thiết có nghĩa là thù lao bằng tiền\ncho các dịch vụ. Nếu nhà phân tích đang thực hiện dịch vụ cho tổ chức thì nhà phân tích\nphải coi vị trí đó như thể anh ta là một nhân viên."},{"n":50,"q":"Grant Starks, CFA, has been working for Advisors, Inc., for eight years. Starks is about to start\nhis own money management business and has given his two-week notice of his resignation.\nA few days before his resignation takes effect, a current client of Advisors calls him at his\noffice to inquire about some services for her account at Advisors. During the conversation,\nStarks tells the client that his new business will have lower commissions than Advisors.\nStarks has most likely violated the Standard concerning:","opts":["avoidance or disclosure of conflicts.","communication with clients and prospective clients.","loyalty."],"ans":"C","expl":"Tiêu chuẩn IV(A) Lòng trung thành yêu cầu các thành viên và ứng viên những người sắp rời bỏ người chủ để\nhành động vì lợi ích của người chủ cho đến khi sự ra đi của họ có hiệu lực."},{"n":51,"q":"Edwin McNeill, CFA, is a senior trader for Grey Securities. In his monthly review of his team's\nactivity, McNeill notices a series of suspicious trades by one of the traders. McNeill consults\nhis manager, who agrees that these trades are a potential violation. McNeill informs the\ntrader that her duties will be restricted while these trades are being investigated and refers\nthe matter to Grey's compliance officer for further action. McNeill has:","opts":["not violated the Standards.","violated Standard IV(C) Responsibilities of Supervisors by failing to prevent a potential violation.","violated Standard IV(C) Responsibilities of Supervisors by restricting the trader’s duties before the investigation is completed."],"ans":"A","expl":"Bằng cách xem xét hành vi của nhân viên, hạn chế các hoạt động của nhân viên trong khi\nđiều tra một hành vi vi phạm tiềm ẩn và chuyển vấn đề đến người quản lý của mình và nhân viên tuân thủ\n, McNeill đã hành động đúng đắn theo Tiêu chuẩn IV(C) Trách nhiệm của Người giám sát.\nViệc làm sai trái của cấp dưới không có nghĩa là người quản lý đã vi phạm Tiêu chuẩn IV(C) vì\nmiễn là người quản lý đã thực hiện những nỗ lực hợp lý để phát hiện và ngăn chặn hành vi vi phạm.\n(Mô-đun 91.6, LOS 91: IV(C))"},{"n":52,"q":"Dave Kline, CFA, is a personal investment advisor with 200 individual, family, and corporate\naccounts. After a dispute with a coworker on margin policy, he formally resigns his position\nby giving suitable notice. However, he does not follow his firm's established \"Transition and\nExit Policies\" regarding his accounts. The firm's stated policies require him to notify each\nclient of his planned departure and personally introduce them to their new account\nrepresentative, Greg Potter. Kline sees Potter as a rival and states \"...let Potter do his own\nwork and find his own clients.\" Kline is most likely:","opts":["in violation of Standard I(D) \"Misconduct\" for leaving clients subject to an account representative he does not find suitable.","in violation of Standard IV(A) \"Loyalty\" for failing to follow the employer’s policies and procedures related to notifying clients of his departure.","not in violation of the Code and Standards."],"ans":"B","expl":"Kline vi phạm \"Lòng trung thành\" Tiêu chuẩn IV(A) vì không tuân theo chính sách của người sử dụng lao động\nvà các thủ tục liên quan đến việc thông báo cho khách hàng về việc anh ta rời đi."},{"n":53,"q":"David Saul, CFA, heads the trust department at Savage National Bank. Fairway Enterprises\ninvites Saul to sit on its Board of Directors. In return for his services on the Board, Fairway\noffers to provide Saul and his family with access to the facilities at Wilmont Country Club at\nno cost. Saul will not receive any monetary compensation for his services on the Board.\nAccording to CFA Institute Standards of Professional Conduct, which of the following actions\nmust Saul take?","opts":["Saul must disclose in writing to Savage Bank the terms of the offer whether or not he accepts the offer to serve on the Board of Directors.","Saul must obtain written consent from Savage Bank and Fairway Enterprises if he decides to accept the offer to serve on the Board of Directors.","Saul must reject the offer to serve on the Board of Directors."],"ans":"B","expl":"Tiêu chuẩn IV(B) yêu cầu các thành viên phải có sự đồng ý bằng văn bản của tất cả các bên liên quan\ntrước khi chấp nhận bồi thường bằng tiền hoặc các lợi ích khác mà họ nhận được cho\ncác dịch vụ ngoài thù lao hoặc phúc lợi do người sử dụng lao động\ncủa thành viên trao tặng. Cụm từ \"tất cả các bên\" ám chỉ người chủ của Saul và Ban giám đốc của Fairway."},{"n":54,"q":"Which of the following statements is most accurate about the Standard concerning the\nresponsibilities of supervisors?","opts":["If a supervisor makes a reasonable effort to detect violations, but fails to detect a violation that occurs, she has violated the Standard.","If a supervisor does not make a reasonable effort to detect violations, she is in violation of the Standard even if no violations by her subordinates have occurred.","If a subordinate violates a securities law, her supervisor is in violation of the Standard."],"ans":"B","expl":"Tiêu chuẩn IV(C) Trách nhiệm của Giám sát viên yêu cầu các thành viên thực hiện một thỏa thuận nỗ lực\nhợp lý để phát hiện và ngăn chặn các vi phạm của cấp dưới đối với luật hiện hành,\nquy định và quy tắc. Vi phạm của cấp dưới không nhất thiết có nghĩa là người giám sát\nđã vi phạm Tiêu chuẩn này nếu người giám sát đã có những nỗ lực hợp lý để phát hiện và\nngăn chặn các vi phạm"}];
const CFG = {"title": "Guidance for Standard IV", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.6 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
