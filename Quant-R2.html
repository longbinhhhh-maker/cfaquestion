<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  .expl-rich{white-space:normal}
  .expl-rich p{margin:.55em 0}
  .expl-rich p:first-child{margin-top:0}
  .expl-rich p:last-child{margin-bottom:0}
  .expl-rich .los{display:block;margin-top:10px;color:var(--muted);font-size:13px}
  .expl-rich .katex{font-size:1.04em}
  .expl-rich .kd{margin:6px 0;overflow-x:auto;overflow-y:hidden}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A perpetual bond with a face value of $100,000 pays annual interest of 5%. The bond is\nquoted at a yield of 7%. The bond's price is closest to:", "opts": ["$140,000.", "$98,100.", "$71,500."], "ans": "C", "expl": "$100,000(0.05)\n=$71,428.57.\n0.07\n(Module 2.1, LOS 2.a)", "explhtml": "<div class=\"kd\">$$\\dfrac{\\$100{,}000(0.05)}{0.07}=\\$71{,}428.57$$</div><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 2, "q": "An investor looks at her monthly brokerage statement and notices that the yield to maturity\non her 5-year corporate bond with a 4% annual coupon rate has gone from 4.2% last month\nto 3.8% this month. The statement will reflect a bond price that, over the last month, has:", "opts": ["increased.", "decreased.", "remained flat."], "ans": "A", "expl": "Bond prices and yields move in opposite directions, such that if the yield has dropped\nfrom 4.2% to 3.8%, it must be a case that the price of the bond has increased. A decrease\nin price would align with an increase in yield to maturity. If the price had remained flat, the\nyield would be unchanged.\n(Module 2.2, LOS 2.b)"}, {"n": 3, "q": "Assume that one- and two-year risk-free rates are 1.80% and 2.50%, respectively. Using the\ncash flow additivity principle, the one-year reinvestment rate, one year from now is closest\nto:", "opts": ["3.5%.", "3.2%.", "2.8%."], "ans": "B", "expl": "2\n(1+r)2\n1.025\n2\nF=−1=−1=3.2%\n1,1\n1\n1\n1.018\n(1+r)\n1\n(Module 2.2, LOS 2.c)", "explhtml": "<p>The implied 1-year forward rate one year ahead is:</p><div class=\"kd\">$$f_{1,1}=\\dfrac{(1+S_2)^2}{(1+S_1)}-1=\\dfrac{(1.025)^2}{1.018}-1=3.2\\%$$</div><span class=\"los\">(Module 2.2, LOS 2.c)</span>"}, {"n": 4, "q": "Assuming the 1-year riskless interest rates on the U.S. dollar and British pound are 3.5% and\n4.0% respectively, the forward exchange rate between the two currencies will be different\nthan the spot rate by approximately:", "opts": ["0.50%.", "7.50%.", "3.75%."], "ans": "A", "expl": "The percentage difference between forward and spot exchange rates is approximately\nequal to the difference between the interest rates in the two countries. Although there is a\nmore refined calculation, the difference between the forward and spot rates will be\napproximately equal to 4.0% – 3.5% = 0.50%.\n3.75% is just the average of the two rates, and 7.50% adds them together instead of taking\nthe difference.\n(Module 2.2, LOS 2.c)"}, {"n": 5, "q": "A pure discount instrument with a face value of ¥100 million matures 12 years from today. If\nits yield to maturity is 3%, its price today is closest to:", "opts": ["¥72 million.", "¥70 million.", "¥71 million."], "ans": "B", "expl": "–12\n¥100,000,000(1.03) = ¥70,137,988.\n(Module 2.1, LOS 2.a)"}, {"n": 6, "q": "A share of George Co. preferred stock is selling for $65. It pays a dividend of $4.50 per year\nand has a perpetual life. The rate of return it is offering its investors is closest to:", "opts": ["6.9%.", "4.5%.", "14.4%."], "ans": "A", "expl": "4.5 / 65 = 0.0692, or 6.92%.\n(Module 2.1, LOS 2.a)"}, {"n": 7, "q": "Assuming a constant rate of growth in dividends, we can estimate an equity share's:", "opts": ["required rate of return as the sum of its dividend yield and growth rate.", "dividend yield as the sum of its required rate of return and its growth rate.", "growth rate as the sum of its dividend yield and its required rate of return."], "ans": "A", "expl": "Starting with the Gordon growth model, we can solve for the estimated required rate of\nreturn, constant growth rate, or dividend yield as follows:\nD\n1\nk=+g\ne\ncV\n0\nD\n1\ng=k−\ne\ncV\n0\nD\n1\n=k−g\ne\nc\nV\n0\n(Module 2.2, LOS 2.b)", "explhtml": "<p>Starting from the Gordon growth model, we can solve for the required return, the constant growth rate, or the dividend yield:</p><div class=\"kd\">$$k_e=\\dfrac{D_1}{V_0}+g,\\qquad g=k_e-\\dfrac{D_1}{V_0},\\qquad \\dfrac{D_1}{V_0}=k_e-g$$</div><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}, {"n": 8, "q": "An investment product promises to pay a lump sum of $25,458 at the end of 9 years. If an\ninvestor feels this investment should produce a rate of return of 14%, compounded\nannually, the present value is closest to:", "opts": ["$9,426.00.", "$7,829.00.", "$7,618.00."], "ans": "B", "expl": "9\n25,458 / 1.14 = 7,828.54\nAlternatively, N = 9; I/Y = 14; FV = -25,458; PMT = 0; CPT  PV = $7,828.54.\n→\n(Module 2.1, LOS 2.a)", "explhtml": "<div class=\"kd\">$$\\dfrac{25{,}458}{1.14^{9}}=7{,}828.54$$</div><p>Alternatively: N = 9; I/Y = 14; FV = -25,458; PMT = 0; CPT PV \\(=\\$7{,}828.54\\).</p><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 9, "q": "A financial advisor recommends to her client that he buy a 6-year, $1,000 face value bond\nthat pays annual interest of 5%. The yield to maturity is 4.5%, and the client intends to hold\nthe bond as an investment until it matures. The value of the bond today is closest to:", "opts": ["$1,025.", "$975.", "$1,000."], "ans": "A", "expl": "With a fixed-coupon, annual-pay bond, the annual interest payment and the principal\npayment are discounted at the yield to maturity. The calculator solution is to solve for\npresent value while setting the number of periods (N) to 6, the annual payment (PMT) to\n50 (which is 1,000 × 5%), the future value (FV) to 1,000, and the yield (I/Y) to 4.5%:\n1,050\n5050\n++...+=1,025.79\n1.045\n26\n1.0451.045\nThis can also be answered using the calculator: N = 6; I/Y = 4.5; PMT = 50; FV = 1,000. CPT\nPV = –1,025.79.\nIt is also worth noting that because the yield to maturity (4.5%) is below the coupon rate\n(5%), the bond's current price must be above the par value of $1,000. $975 would only be\npossible if the yield was above the coupon rate.\n(Module 2.1, LOS 2.a)", "explhtml": "<p>For a fixed-coupon annual-pay bond, discount the coupons and principal at the yield to maturity (N = 6, PMT = 50, FV = 1,000, I/Y = 4.5%):</p><div class=\"kd\">$$\\dfrac{50}{1.045}+\\dfrac{50}{1.045^{2}}+\\cdots+\\dfrac{1{,}050}{1.045^{6}}=1{,}025.79$$</div><p>Calculator: N = 6; I/Y = 4.5; PMT = 50; FV = 1,000; CPT PV \\(=-1{,}025.79\\). Because the yield (4.5%) is below the coupon rate (5%), the price must be above par.</p><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 10, "q": "A bond pays annual coupon interest of £40 and returns its face value of £1,000 in five years.\nThe bond's yield to maturity is 4.5%. Its price today is closest to:", "opts": ["£946.", "£978.", "£957."], "ans": "B", "expl": "N = 5; I/Y = 4.5; PMT = 40; FV = 1,000; CPT PV = –978.05.\n(Module 2.1, LOS 2.a)"}, {"n": 11, "q": "A pure discount instrument with a face value of €1 million matures eight years from today. If\nits yield to maturity is –1.5%, its price today is closest to:", "opts": ["€1.13 million.", "€0.98 million.", "€0.89 million."], "ans": "A", "expl": "Given these three answer choices, you can choose the correct answer without performing\nthe calculation. With a negative yield, the price of a single future cash flow must be greater\n8\nthan the amount of the cash flow. In this case, €1,000,000 / (1 – 0.015) = €1,128,522.\n(Module 2.1, LOS 2.a)", "explhtml": "<p>With a negative yield, the price of a single future cash flow exceeds the cash flow itself:</p><div class=\"kd\">$$\\dfrac{\\text{€}1{,}000{,}000}{(1-0.015)^{8}}=\\text{€}1{,}128{,}522$$</div><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 12, "q": "Wortel Industries has preferred stock outstanding that paying an annual dividend of $3.75\nper share. If an investor wants to earn a rate of return of 8.5%, how much should he be\nwilling to pay for a share of Wortel preferred stock?", "opts": ["$31.88.", "$44.12.", "$42.10."], "ans": "B", "expl": "To calculate the price, we need to discount the future dividend stream at the investor's\nrequired return.\nThe stream of dividends is a perpetuity (a fixed dividend each year forever).\nGiven the PV of a perpetuity = cash flow / discount rate\nThen price = $3.75 / 0.085 = $44.12\n(Module 2.1, LOS 2.a)"}, {"n": 13, "q": "An investor purchases a 10-year, $1,000 par value bond that pays annual coupons of $100. If\nthe market rate of interest is 12%, what is the current market value of the bond?", "opts": ["$887.", "$1,124.", "$950."], "ans": "A", "expl": "Note that bond problems are just mixed annuity problems. You can solve bond problems\ndirectly with your financial calculator using all five of the main TVM keys at once. For bond-\ntypes of problems the bond's price (PV) will be negative, while the coupon payment (PMT)\nand par value (FV) will be positive. N = 10; I/Y = 12; FV = 1,000; PMT = 100; CPT  PV = –\n→\n886.99.\n(Module 2.1, LOS 2.a)"}, {"n": 14, "q": "Given investors require an annual return of 12.5%, a perpetual bond (i.e., a bond with no\nmaturity/due date) that pays $87.50 a year in interest should be valued at:", "opts": ["$1,093.", "$700.", "$70."], "ans": "B", "expl": "87.50 ÷ 0.125 = $700.\n(Module 2.1, LOS 2.a)"}, {"n": 15, "q": "An investor with USD1,000,000 is undecided between two mutually exclusive opportunities\nwith the following cash flows:\nTime 0Time 1Time 2Time 3\nOpportunity 1–1,000,000500,000500,000500,000\nOpportunity 2–1,000,000400,000500,000600,000\nThe investor's required return is 11% per year. Which opportunity should the investor\nchoose?", "opts": ["The investor should be indifferent between the two opportunities.", "The investor should choose Opportunity 2.", "The investor should choose Opportunity 1."], "ans": "C", "expl": "Although this problem may be solved by calculating the individual NPVs of each\nopportunity (Opportunity 1: 221.86 and Opportunity 2: 204.89), another approach would\nbe to use the cash flow additivity principle as follows:\nTime 1Time 2Time 3\nOpportunity 1500,000500,000500,000\nOpportunity 2400,000500,000600,000\nCash flow difference+100,0000–100,000\nBecause the present value of the cash flow difference arising at Time 1 (in favor of\nOpportunity 1) must exceed the present value of the negative cash flow difference arising\nat Time 3 (in favor of Opportunity 2) at any positive discount rate, Opportunity 1 is\npreferred.\n(Module 2.2, LOS 2.c)"}, {"n": 16, "q": "An equity investor has a required return of 7% and purchases preferred stock with a $50 per\nshare par value and an annual dividend of $3.20. The value of the preferred stock is closest\nto:", "opts": ["$43.", "$50.", "$46."], "ans": "C", "expl": "The value of preferred stock, based on the assumption that the annual dividend will be\npaid in perpetuity, is equal to:\nThe correct answer is 45.71, which is closest to $46 per share.\nD3.20\nP\n==45.71\n0.07\nk\nP\n(Module 2.1, LOS 2.a)", "explhtml": "<p>The value of preferred stock (dividend paid in perpetuity) is:</p><div class=\"kd\">$$P_0=\\dfrac{D}{k_P}=\\dfrac{3.20}{0.07}=45.71$$</div><p>This is closest to $46 per share.</p><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 17, "q": "An annuity will pay eight annual payments of $100, with the first payment to be received one\nyear from now. If the interest rate is 12% per year, what is the present value of this annuity?", "opts": ["$496.76.", "$1,229.97.", "$556.38."], "ans": "A", "expl": "N = 8; I/Y = 12%; PMT = -$100; FV = 0; CPT  PV = $496.76.\n→\n(Module 2.1, LOS 2.a)"}, {"n": 18, "q": "A loan of $15,000 is to be paid off in monthly payments over 5 years at 12% annual interest.\nWhat is the amount of each payment?", "opts": ["$1,802.", "$334.", "$4,161."], "ans": "B", "expl": "I = 12 / 12 = 1; N = 5 × 12 = 60; PV = 15,000; CPT  PMT = 333.67.\n→\n(Module 2.1, LOS 2.a)"}, {"n": 19, "q": "An investor is choosing between two possible investments. Both have identical future cash\nflows in all situations, but the investor notices a slight discrepancy in price between the two.\nWhat action will this investor take based on the no-arbitrage principle?", "opts": ["Act quickly by buying the lower-priced investment, as the prices will quickly converge.", "Wait for the prices to further diverge, then sell the higher-priced investment.", "Do nothing, as there cannot be a price divergence based on the rule."], "ans": "A", "expl": "The no-arbitrage principle (law of one price) states that the price for an investment will be\nthe same if two sets of future cash flows are identical under all conditions. Although there\nshould not be a discrepancy in theory, there may be one for a short time period. If there is\na slight price discrepancy between these investments, it will not last long, so the investor\nshould act quickly and buy the lower-priced investment. The prices would not further\ndiverge.\n(Module 2.2, LOS 2.c)"}, {"n": 20, "q": "An investor purchases a stock on January 1. The annual dividend payments for a stock\ninvestment for the next four years, beginning on December 31, are $50, $75, $100, and $125.\nBased on the cash flow additivity principle, the present value of this series of cash flows will\nbe equivalent to the present value of a $50 annuity and the present value of what series of\ncash flows?", "opts": ["$75, $50, $25, and $0.", "$0, $25, $50, and $75.", "$0, $0, $125, and $125."], "ans": "B", "expl": "The cash flow additivity principle states that the PV of any stream of cash flows is equal to\nthe sum of the PVs of all of the cash flows. The cash flows are $50, $75, $100, and $125.\nSo, if one stream of cash flows is equal to $50 each year, subtract $50 from each original\ncash flow to get the second stream of cash flows.\nThe PV of 50, 75, 100, and 125 = PV of 50, 50, 50, and 50 + PV of 0, 25, 50, and 75.\nThe order matters, as the PV will be different (and higher) if the higher cash flows come\nbefore the lower ones.\n(Module 2.2, LOS 2.c)"}, {"n": 21, "q": "Abeta's stock is trading at $47. Abeta just paid a dividend of $1.50, and markets assume a\nconstant growth rate in dividends of 4%. Abeta's required return on equity is closest to:", "opts": ["8.1%.", "7.3%.", "6.5%."], "ans": "B", "expl": "To calculate the implied cost of equity, we rearrange the constant growth formula as\nfollows:\nD×(1+g)\n1.50×1.04\n0\nr=+g=+0.04=7.32%\nP47.00\n0\n(Module 2.2, LOS 2.b)", "explhtml": "<p>Rearranging the constant-growth model for the required return:</p><div class=\"kd\">$$r=\\dfrac{D_0(1+g)}{P_0}+g=\\dfrac{1.50\\times1.04}{47.00}+0.04=7.32\\%$$</div><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}, {"n": 22, "q": "A stock is expected to pay a dividend next year of $2.40. An analyst expects the dividend to\ngrow at a constant annual rate of 4% and believes investors' required rate of return on the\nstock is 7%. The analyst will estimate a value for this stock that is closest to:", "opts": ["$80.00.", "$85.60.", "$83.20."], "ans": "A", "expl": "$2.40\n=$80.\nApplying the Gordon growth model,\n0.07−0.04\n(Module 2.1, LOS 2.a)"}, {"n": 23, "q": "Bill Jones is creating a charitable trust to provide six annual payments of $20,000 each,\nbeginning next year. How much must Jones set aside now at 10% interest compounded\nannually to meet the required disbursements?", "opts": ["$154,312.20.", "$87,105.21.", "$95,815.74."], "ans": "B", "expl": "N = 6, PMT = -$20,000, I/Y = 10%, FV = 0, Compute PV  $87,105.21.\n→\n(Module 2.1, LOS 2.a)"}, {"n": 24, "q": "A bond with a 10-year maturity has a face value of $10,000 and pays annual interest of $600.\nThe bond is issued at a price of $9,500. The bond's yield to maturity will be:", "opts": ["greater than 6%.", "less than 6%.", "equal to 6%."], "ans": "A", "expl": "No calculations are needed to answer this question. This bond was issued at a price of\n$9,500, which is below face value of $10,000. The bond is considered a discount bond, and\nthis results from a situation where the bond's coupon rate is below the yield to maturity.\nWith annual interest of $600 on a face value of $10,000, the coupon rate is equal to 6%\n(600 / 10,000). The yield to maturity must be greater than 6% for the bond to be issued at\na discounted price.\n(Module 2.1, LOS 2.a)"}, {"n": 25, "q": "A 5-year, 8% coupon bond with a par value of $1,000 pays interest annually. The price is\n$942.50, and the yield to maturity is 9.50%. If the price of the bond moves to $963.75, the\nyield to maturity will be closest to:", "opts": ["8.93%.", "10.07%.", "8.55%."], "ans": "A", "expl": "Because the price of the bond increases, the yield to maturity will fall from its current\nlevel. The current level is 9.50%, which means the yield cannot be 10.07%. The calculation\nfor the yield can be derived using a financial calculator:\nPV = –963.75\nFV = 1,000.00\nN = 5 years\nPMT = 80 (8% of par)\nSolve for I/Y = 8.93.\n(Module 2.2, LOS 2.b)"}, {"n": 26, "q": "An analyst is using the constant growth dividend discount model (DDM) to evaluate XYZ\nstock. The stock is currently trading at $20 per share and recently paid an annual dividend of\n$1.50. Assuming a constant growth rate of 4.5%, the implied required rate of return on the\nstock is closest to:", "opts": ["12.00%.", "12.34%.", "11.68%."], "ans": "B", "expl": "The Gordon growth model, also known as the DDM, takes the next period's dividend and\ndivides it by the difference between the required return and the growth rate. The formula\ncan be algebraically manipulated to isolate the required rate of return. The calculation to\ndetermine the required rate of return is shown:\n1.50(1.045)\nD\n1\nkg\n=+=+0.045=0.1234, or 12.34\ne\n20\nV\nc\n0\nThe 11.68% answer option is the output if the current dividend is discounted by the\ngrowth rate rather than increased by the growth rate to get to the next period's dividend.\nThe 12.00% answer option is the output if the current dividend is used in the calculation\nwithout adjusting for the growth rate.\n(Module 2.2, LOS 2.b)", "explhtml": "<p>The Gordon growth model isolates the required return as next period's dividend over price, plus the growth rate:</p><div class=\"kd\">$$k_e=\\dfrac{D_1}{V_0}+g=\\dfrac{1.50(1.045)}{20}+0.045=0.1234,\\ \\text{or }12.34\\%$$</div><p>The 11.68% option discounts the current dividend by the growth rate instead of growing it; the 12.00% option uses the current dividend without adjusting for growth.</p><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}, {"n": 27, "q": "A bond pays annual coupon interest of £60 and returns its face value of £1,000 in seven\nyears. The bond's price today is £1,045. Its yield to maturity is closest to:", "opts": ["6.8%.", "6.0%.", "5.2%."], "ans": "C", "expl": "N = 7; PMT = 60; FV = 1,000; PV = –1,045; CPT I/Y = 5.2162.\n(Module 2.2, LOS 2.b)"}, {"n": 28, "q": "An investor is deciding whether to buy a 1-year bond two years in a row or lock in the rate on\na 2-year bond today. The 1-year spot interest rate is 5.25%, and the 2-year spot interest rate\nis 6.50%. Which of the following statements is most accurate regarding implied forward rates\nand the investor's options?", "opts": ["The expected rate on a 1-year bond one year from today is equal to 7.76%.", "The investor is better off locking in the 2-year rate at 6.50%.", "The forward rate will be between 5.25% and 6.50%."], "ans": "A", "expl": "Implied forward rates can be derived based on observable spot rates in the fixed income\nmarket. The result is that the implied 1-year forward rate one year in the future can be\nderived based on this formula:\n2\n(1+S)\n2\n=(1+1y1y)\n(1+)\nS\n1\n2\n(1.065)\n−1=0.0776\n(1.0525)\nThe forward rate (1y1y) is equal to 7.76%.\nThe forward rate will be higher than both spot rates, which means it cannot be between\n5.25% and 6.50%. The investor should be indifferent between the 2-year bond paying\n6.50% and 1-year bonds at 5.25% and 7.76%.\n(Module 2.2, LOS 2.c)", "explhtml": "<p>The implied 1-year forward rate one year ahead is derived from observable spot rates:</p><div class=\"kd\">$$\\dfrac{(1+S_2)^2}{(1+S_1)}=(1+f_{1,1})$$</div><div class=\"kd\">$$\\dfrac{(1.065)^2}{(1.0525)}-1=0.0776=7.76\\%$$</div><p>The forward rate \\(f_{1,1}\\) is higher than both spot rates, so it cannot lie between 5.25% and 6.50%.</p><span class=\"los\">(Module 2.2, LOS 2.c)</span>"}, {"n": 29, "q": "To determine whether the current price of a common stock is aligned with its intrinsic value,\nan analyst wants to use the Gordon growth model. To appropriately apply the model, the\nanalyst will need to estimate:", "opts": ["a fluctuating growth rate assigned to dividends.", "the dividend to be received next year.", "a growth rate that is above the required return."], "ans": "B", "expl": "The Gordon growth model, also known as the constant growth dividend discount model\n(DDM), takes the next period's dividend and divides it by the difference between the\nrequired return and the growth rate. The growth rate is assumed to be constant, and it\nmust be below the required return—or else the denominator of the calculation will be\nnegative, making it invalid.\n(Module 2.1, LOS 2.a)"}, {"n": 30, "q": "Given a 5% discount rate, the present value of $500 to be received three years from today is:", "opts": ["$400.", "$432.", "$578."], "ans": "B", "expl": "N = 3; I/Y = 5; FV = 500; PMT = 0; CPT  PV = 431.92.\n→\n3\nor: 500/1.05 = 431.92.\n(Module 2.1, LOS 2.a)", "explhtml": "<p>N = 3; I/Y = 5; FV = 500; PMT = 0; CPT PV \\(=431.92\\), or:</p><div class=\"kd\">$$\\dfrac{500}{1.05^{3}}=431.92$$</div><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 31, "q": "A 15-year zero-coupon German government bond has an annualized yield of –1.5%.\nAssuming annual compounding, the price of the bond per €100 of principal is closest to:", "opts": ["€125.", "€115.", "€105."], "ans": "A", "expl": "N = 15; I/Y = –1.5; FV = 100; PMT = 0; CPT PV = –125.45.\n(Module 2.1, LOS 2.a)"}, {"n": 32, "q": "An investor pays $726.27 for a zero-coupon bond with a face value of $1,000 and maturing in\n10 years. Bonds with similar risk profiles and with similar terms yield 3.00%. The yield to\nmaturity for this bond is closest to:", "opts": ["3.25%.", "2.75%.", "3.00%."], "ans": "A", "expl": "A zero-coupon bond pays no interest, but it is most often purchased at a price heavily\ndiscounted from par value. The equation that shows the relationship between the present\nvalue (the purchase price), the future value, time, and yield to maturity is shown as\nfollows:\n$1,000\n$726.27=\n10\n(1+r)\n1,000\n√\n10\n1+r=\n726.27\nr=1.0325−1=0.0325, or 3.25\nThis can also be answered using the calculator: N = 10; PV = –726.27; PMT = 0; FV = 1,000.\nCPT I/Y = 3.25.\n2.75% is the yield to maturity if the present value is incorrectly input as $762.27 instead of\n$726.27. The yield on similar bonds does not reflect the yield on a specific bond.\n(Module 2.1, LOS 2.a)", "explhtml": "<p>For a zero-coupon bond, the relationship between price, face value, time, and yield is:</p><div class=\"kd\">$$726.27=\\dfrac{1{,}000}{(1+r)^{10}}$$</div><div class=\"kd\">$$1+r=\\sqrt[10]{\\dfrac{1{,}000}{726.27}}=1.0325\\ \\Rightarrow\\ r=0.0325,\\ \\text{or }3.25\\%$$</div><p>Calculator: N = 10; PV = -726.27; PMT = 0; FV = 1,000; CPT I/Y = 3.25.</p><span class=\"los\">(Module 2.1, LOS 2.a)</span>"}, {"n": 33, "q": "Given the following cash flow stream:\nEnd of YearAnnual Cash Flow\n1$4,000\n2$2,000\n3-0-\n4-$1,000\nUsing a 10% discount rate, the present value of this cash flow stream is:", "opts": ["$4,606.00.", "$3,636.00.", "$3,415.00."], "ans": "A", "expl": "PV(1): N = 1; I/Y = 10; FV = -4,000; PMT = 0; CPT  PV = 3,636\n→\nPV(2): N = 2; I/Y = 10; FV = -2,000; PMT = 0; CPT  PV = 1,653\n→\nPV(3): 0\nPV(4): N = 4; I/Y = 10; FV = 1,000; PMT = 0; CPT  PV = -683\n→\nTotal PV = 3,636 + 1,653 + 0 – 683 = 4,606\n(Module 2.2, LOS 2.c)", "qhtml": "<p>Given the following cash flow stream:</p><table class=\"qtable\"><thead><tr><th>End of Year</th><th>Annual Cash Flow</th></tr></thead><tbody><tr><td>1</td><td>$4,000</td></tr><tr><td>2</td><td>$2,000</td></tr><tr><td>3</td><td>$0</td></tr><tr><td>4</td><td>−$1,000</td></tr></tbody></table><p>Using a 10% discount rate, the present value of this cash flow stream is:</p>"}, {"n": 34, "q": "A pure discount instrument with a face value of ¥500 million matures nine years from today\nand has a current price of ¥350 million. The instrument's annualized yield is closest to:", "opts": ["4.0%.", "3.3%.", "4.7%."], "ans": "A", "expl": "500\n9\n(1+r)=\n350\n1\n500\n9\n()−1=4.04%.\nr =\n350\n(Module 2.2, LOS 2.b)", "explhtml": "<div class=\"kd\">$$(1+r)^{9}=\\dfrac{500}{350}$$</div><div class=\"kd\">$$r=\\left(\\dfrac{500}{350}\\right)^{1/9}-1=4.04\\%$$</div><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}, {"n": 35, "q": "An investor spends $365,000 purchasing zero-coupon bonds with a total face value of\n$500,000 and maturing in 10 years. For the annualized rate of return to be above 3.20%, the\nbond's price will have to be:", "opts": ["equivalent to $365,000.", "higher than $365,000.", "lower than $365,000."], "ans": "C", "expl": "With a future value of $500,000, a present value of $365,000, and a maturity of 10 years,\nthe annualized rate of return is calculated as shown:\n$500,000\n=$365,000\n10\n(1+r)\n$500,000\n10\n(1+r)\n==1.36986\n$365,000\n1/10\nr=1.36986−1=0.0320\nOn the calculator, N = 10; PV = –365,000; PMT = 0; FV = 500,000; CPT I/Y = 3.2.\nBecause the annualized return is 3.20% and the question asks about what the bond's price\nmust be to be above 3.20%, the price of the bond must be below the purchase price of\n$365,000. The relationship between the price and rate of return is inverse; for the rate of\nreturn to be above 3.20%, the price must fall.\n(Module 2.2, LOS 2.b)", "explhtml": "<p>With FV = $500,000, PV = $365,000 and a 10-year horizon:</p><div class=\"kd\">$$(1+r)^{10}=\\dfrac{500{,}000}{365{,}000}=1.36986$$</div><div class=\"kd\">$$r=1.36986^{1/10}-1=0.0320,\\ \\text{or }3.20\\%$$</div><p>Calculator: N = 10; PV = -365,000; PMT = 0; FV = 500,000; CPT I/Y = 3.2.</p><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}, {"n": 36, "q": "Using a constant growth dividend discount model (DDM), an analyst assumes a required\nreturn on equity of 9.75%. The current stock price is $30 per share, and the next period's\ndividend is $2.40 per share. The constant growth rate implied in the model is closest to:", "opts": ["1.83%.", "1.75%.", "1.89%."], "ans": "B", "expl": "The Gordon growth model, also known as the DDM, takes the next period's dividend and\ndivides it by the difference between the required return and the growth rate. The formula\ncan be algebraically manipulated to isolate the implied growth rate. The calculation to\ndetermine the growth rate is shown:\nD\n2.40\n1\ng=k−=0.0975−=0.0975−0.08=0.0175, or 1.75\ne\n30\ncV\n0\nThe 1.83% answer option takes the correct answer of 1.75% and adds the dividend yield of\n8%: 1.75% + 0.08% = 1.83%. The 1.89% answer option takes the correct answer of 1.75%\nand grows it by multiplying it by the dividend yield of 8%: 1.75% × (1.08) = 1.89%.\n(Module 2.2, LOS 2.b)", "explhtml": "<p>Rearranging the Gordon growth model to isolate the implied growth rate:</p><div class=\"kd\">$$g=k_e-\\dfrac{D_1}{V_0}=0.0975-\\dfrac{2.40}{30}=0.0975-0.08=0.0175,\\ \\text{or }1.75\\%$$</div><p>The 1.83% option adds the 8% dividend yield to 1.75%; the 1.89% option grows 1.75% by the dividend yield.</p><span class=\"los\">(Module 2.2, LOS 2.b)</span>"}];
const CFG = {"title": "The Time Value of Money in Finance", "subtitle": "CFA · Quantitative Methods · Reading 2 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl || q.explhtml){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      if(q.explhtml){
        const sp = document.createElement("span"); sp.className = "expl-rich"; sp.innerHTML = q.explhtml;
        e.appendChild(sp);
      } else {
        e.appendChild(document.createTextNode(q.expl));
      }
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
