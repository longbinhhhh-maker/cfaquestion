<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  .expl-rich{white-space:normal}
  .expl-rich p{margin:.55em 0}
  .expl-rich p:first-child{margin-top:0}
  .expl-rich p:last-child{margin-bottom:0}
  .expl-rich .los{display:block;margin-top:10px;color:var(--muted);font-size:13px}
  .expl-rich .katex{font-size:1.04em}
  .expl-rich .kd{margin:6px 0;overflow-x:auto;overflow-y:hidden}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>

<script>
const DATA = [{"n":1,"q":"A perpetual bond with a face value of $100,000 pays annual interest of 5%. The bond is\nquoted at a yield of 7%. The bond's price is closest to:","opts":["$140,000.","$98,100.","$71,500."],"ans":"C","expl":"$100.000(0,05)\n=$71.428,57.\n0,07\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<div class=\"kd\">$$\\dfrac{\\$100{,}000(0.05)}{0.07}=\\$71{,}428.57$$</div><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":2,"q":"An investor looks at her monthly brokerage statement and notices that the yield to maturity\non her 5-year corporate bond with a 4% annual coupon rate has gone from 4.2% last month\nto 3.8% this month. The statement will reflect a bond price that, over the last month, has:","opts":["increased.","decreased.","remained flat."],"ans":"A","expl":"Giá trái phiếu và lợi suất di chuyển theo hướng ngược nhau, chẳng hạn như nếu lợi suất giảm\ntừ 4,2% xuống 3,8%, thì đó hẳn là giá trái phiếu đã giảm tăng lên. Việc giảm\ngiá sẽ phù hợp với mức tăng lợi tức đến ngày đáo hạn. Nếu giá vẫn giữ nguyên thì\nlợi suất sẽ không thay đổi.\n(Mô-đun 2.2, LOS 2.b)"},{"n":3,"q":"Assume that one- and two-year risk-free rates are 1.80% and 2.50%, respectively. Using the\ncash flow additivity principle, the one-year reinvestment rate, one year from now is closest\nto:","opts":["3.5%.","3.2%.","2.8%."],"ans":"B","expl":"2\n(1+r)2\n1.025\n2\nF=−1=−1=3,2%\n1,1\n1.018\n(1+r)\n(Mô-đun 2.2, LOS 2.c)","explhtml":"<p>Lãi suất kỳ hạn 1 năm ngụ ý cho một năm tới là:</p><div class=\"kd\">$$f_{1,1}=\\dfrac{(1+S_2)^2}{(1+S_1)}-1=\\dfrac{(1.025)^2}{1.018}-1=3.2\\%$$</div><span class=\"los\">(Mô-đun 2.2, LOS 2.c)</span>"},{"n":4,"q":"Assuming the 1-year riskless interest rates on the U.S. dollar and British pound are 3.5% and\n4.0% respectively, the forward exchange rate between the two currencies will be different\nthan the spot rate by approximately:","opts":["0.50%.","7.50%.","3.75%."],"ans":"A","expl":"Phần trăm chênh lệch giữa tỷ giá hối đoái kỳ hạn và tỷ giá hối đoái giao ngay xấp xỉ\nbằng chênh lệch giữa lãi suất ở hai quốc gia. Mặc dù có\ntính toán tinh tế hơn, nhưng chênh lệch giữa tỷ giá kỳ hạn và tỷ giá giao ngay sẽ\nxấp xỉ bằng 4,0% – 3,5% = 0,50%.\n3,75% chỉ là mức trung bình của hai tỷ giá và 7,50% cộng chúng lại với nhau thay vì lấy\nsự khác biệt.\n(Mô-đun 2.2, LOS 2.c)"},{"n":5,"q":"A pure discount instrument with a face value of ¥100 million matures 12 years from today. If\nits yield to maturity is 3%, its price today is closest to:","opts":["¥72 million.","¥70 million.","¥71 million."],"ans":"B","expl":"–12\n100.000.000 yên(1,03) = 70.137.988 yên.\n(Mô-đun 2.1, LOS 2.a)"},{"n":6,"q":"A share of George Co. preferred stock is selling for $65. It pays a dividend of $4.50 per year\nand has a perpetual life. The rate of return it is offering its investors is closest to:","opts":["6.9%.","4.5%.","14.4%."],"ans":"A","expl":"4,5 / 65 = 0,0692 hoặc 6,92%.\n(Mô-đun 2.1, LOS 2.a)"},{"n":7,"q":"Assuming a constant rate of growth in dividends, we can estimate an equity share's:","opts":["required rate of return as the sum of its dividend yield and growth rate.","dividend yield as the sum of its required rate of return and its growth rate.","growth rate as the sum of its dividend yield and its required rate of return."],"ans":"A","expl":"Bắt đầu với mô hình tăng trưởng Gordon, chúng ta có thể giải tỷ suất lợi nhuận yêu cầu ước tính\n, tốc độ tăng trưởng không đổi hoặc tỷ suất cổ tức như sau:\nD\nk=+g\ne\ncV\n0\nD\ng=k−\ne\ncV\n0\nD\n=k−g\ne\nc\nV\n0\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<p>Bắt đầu từ mô hình tăng trưởng Gordon, chúng ta có thể tìm lợi nhuận yêu cầu, tốc độ tăng trưởng không đổi hoặc tỷ suất cổ tức:</p><div class=\"kd\">$$k_e=\\dfrac{D_1}{V_0}+g,\\qquad g=k_e-\\dfrac{D_1}{V_0},\\qquad \\dfrac{D_1}{V_0}=k_e-g$$</div><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"},{"n":8,"q":"An investment product promises to pay a lump sum of $25,458 at the end of 9 years. If an\ninvestor feels this investment should produce a rate of return of 14%, compounded\nannually, the present value is closest to:","opts":["$9,426.00.","$7,829.00.","$7,618.00."],"ans":"B","expl":"9\n25.458 / 1,14 = 7.828,54\nNgoài ra, N = 9; I/Y = 14; FV = -25,458; PMT = 0; CPT PV = $7.828,54.\n→\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<div class=\"kd\">$$\\dfrac{25{,}458}{1.14^{9}}=7{,}828.54$$</div><p>Ngoài ra: N = 9; I/Y = 14; FV = -25,458; PMT = 0; PV CPT\\(=\\$7{,}828.54\\).</p><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":9,"q":"A financial advisor recommends to her client that he buy a 6-year, $1,000 face value bond\nthat pays annual interest of 5%. The yield to maturity is 4.5%, and the client intends to hold\nthe bond as an investment until it matures. The value of the bond today is closest to:","opts":["$1,025.","$975.","$1,000."],"ans":"A","expl":"Có một trái phiếu có lãi suất cố định, trả hàng năm, khoản thanh toán lãi hàng năm và khoản thanh toán gốc\nđược chiết khấu theo lãi suất đáo hạn. Giải pháp máy tính là giải\ngiá trị hiện tại trong khi đặt số kỳ (N) thành 6, khoản thanh toán hàng năm (PMT) thành\n50 (tức là 1.000 × 5%), giá trị tương lai (FV) thành 1.000 và lợi nhuận (I/Y) thành 4,5%:\n1.050\n5050\n++...+=1.025,79\n1.045\n26\n1.0451.045\nĐiều này cũng có thể được trả lời bằng máy tính: N = 6; I/Y = 4,5; PMT = 50; FV = 1.000. CPT\nPV = –1.025,79.\nCũng cần lưu ý rằng vì lợi tức đáo hạn (4,5%) thấp hơn lãi suất coupon\n(5%), nên giá hiện tại của trái phiếu phải cao hơn mệnh giá 1.000 USD. $975 sẽ chỉ có thể\nnếu lợi suất cao hơn lãi suất phiếu giảm giá.\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<p>Đối với trái phiếu trả lãi hàng năm có lãi cố định, chiết khấu lãi trả lãi và tiền gốc theo lãi suất đáo hạn (N = 6, PMT = 50, FV = 1.000, I/Y = 4,5%):</p><div class=\"kd\">$$\\dfrac{50}{1.045}+\\dfrac{50}{1.045^{2}}+\\cdots+\\dfrac{1{,}050}{1.045^{6}}=1{,}025.79$$</div><p>Máy tính: N = 6; I/Y = 4,5; PMT = 50; FV = 1.000; PV CPT\\(=-1{,}025.79\\). Bởi vì lợi suất (4,5%) thấp hơn lãi suất coupon (5%) nên giá phải cao hơn mệnh giá.</p><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":10,"q":"A bond pays annual coupon interest of £40 and returns its face value of £1,000 in five years.\nThe bond's yield to maturity is 4.5%. Its price today is closest to:","opts":["£946.","£978.","£957."],"ans":"B","expl":"N = 5; I/Y = 4,5; PMT = 40; FV = 1.000; CPT PV = –978.05.\n(Mô-đun 2.1, LOS 2.a)"},{"n":11,"q":"A pure discount instrument with a face value of €1 million matures eight years from today. If\nits yield to maturity is –1.5%, its price today is closest to:","opts":["€1.13 million.","€0.98 million.","€0.89 million."],"ans":"A","expl":"Với ba lựa chọn trả lời sau, bạn có thể chọn câu trả lời đúng mà không cần thực hiện\nphép tính. Với lợi suất âm, giá của một dòng tiền trong tương lai phải lớn hơn\n8\nso với lượng của dòng tiền. Trong trường hợp này, €1.000.000 / (1 – 0,015) = €1.128.522.\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<p>Với lợi suất âm, giá của một dòng tiền trong tương lai sẽ vượt quá chính dòng tiền đó:</p><div class=\"kd\">$$\\dfrac{\\text{€}1{,}000{,}000}{(1-0.015)^{8}}=\\text{€}1{,}128{,}522$$</div><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":12,"q":"Wortel Industries has preferred stock outstanding that paying an annual dividend of $3.75\nper share. If an investor wants to earn a rate of return of 8.5%, how much should he be\nwilling to pay for a share of Wortel preferred stock?","opts":["$31.88.","$44.12.","$42.10."],"ans":"B","expl":"Để tính giá, chúng ta cần chiết khấu dòng cổ tức trong tương lai ở mức\nlợi nhuận yêu cầu của nhà đầu tư.\nDòng cổ tức là vĩnh viễn (cổ tức cố định mãi mãi mỗi năm).\nVới PV vĩnh viễn = dòng tiền / tỷ lệ chiết khấu\nKhi đó giá = 3,75 USD / 0,085 = 44,12 USD\n(Mô-đun 2.1, LOS 2.a)"},{"n":13,"q":"An investor purchases a 10-year, $1,000 par value bond that pays annual coupons of $100. If\nthe market rate of interest is 12%, what is the current market value of the bond?","opts":["$887.","$1,124.","$950."],"ans":"A","expl":"Lưu ý rằng các vấn đề về trái phiếu chỉ là các vấn đề về niên kim hỗn hợp. Bạn có thể giải quyết các vấn đề về trái phiếu\ntrực tiếp bằng máy tính tài chính của mình bằng cách sử dụng tất cả năm khóa TVM chính cùng một lúc. Đối với các loại vấn đề về trái phiếu-\n, giá trái phiếu (PV) sẽ âm, trong khi thanh toán phiếu giảm giá (PMT)\nvà mệnh giá (FV) sẽ dương. N = 10; I/Y = 12; FV = 1.000; PMT = 100; CPT PV = –\n→\n886,99.\n(Mô-đun 2.1, LOS 2.a)"},{"n":14,"q":"Given investors require an annual return of 12.5%, a perpetual bond (i.e., a bond with no\nmaturity/due date) that pays $87.50 a year in interest should be valued at:","opts":["$1,093.","$700.","$70."],"ans":"B","expl":"87,50 ÷ 0,125 = $700.\n(Mô-đun 2.1, LOS 2.a)"},{"n":15,"q":"An investor with USD1,000,000 is undecided between two mutually exclusive opportunities\nwith the following cash flows:\nTime 0Time 1Time 2Time 3\nOpportunity 1–1,000,000500,000500,000500,000\nOpportunity 2–1,000,000400,000500,000600,000\nThe investor's required return is 11% per year. Which opportunity should the investor\nchoose?","opts":["The investor should be indifferent between the two opportunities.","The investor should choose Opportunity 2.","The investor should choose Opportunity 1."],"ans":"C","expl":"Mặc dù vấn đề này có thể được giải quyết bằng cách tính NPV riêng lẻ của từng\ncơ hội (Cơ hội 1: 221,86 và Cơ hội 2: 204.89), một cách tiếp cận khác sẽ\nlà sử dụng nguyên tắc cộng dòng tiền như sau:\nThời gian 1 Thời gian 2 Thời gian 3\nCơ hội 1500.000500.000500.000\nCơ hội 2400,000500,000600,000\nChênh lệch dòng tiền+100,0000–100,000\nBởi vì giá trị hiện tại của chênh lệch dòng tiền phát sinh tại Thời điểm 1 (theo\nCơ hội 1) phải vượt quá giá trị hiện tại của chênh lệch dòng tiền âm phát sinh\ntại Thời điểm 3 (có lợi cho Cơ hội 2) với bất kỳ tỷ lệ chiết khấu dương nào, Cơ hội 1 được ưu tiên\n.\n(Mô-đun 2.2, LOS 2.c)"},{"n":16,"q":"An equity investor has a required return of 7% and purchases preferred stock with a $50 per\nshare par value and an annual dividend of $3.20. The value of the preferred stock is closest\nto:","opts":["$43.","$50.","$46."],"ans":"C","expl":"Giá trị của cổ phiếu ưu đãi, dựa trên giả định rằng cổ tức hàng năm sẽ được\ntrả vĩnh viễn, bằng:\nCâu trả lời đúng là 45,71, gần nhất với 46 USD trên mỗi cổ phiếu.\nD3.20\nP\n==45,71\n0,07\nk\nP\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<p>Giá trị cổ phiếu ưu đãi (trả cổ tức vĩnh viễn) là:</p><div class=\"kd\">$$P_0=\\dfrac{D}{k_P}=\\dfrac{3.20}{0.07}=45.71$$</div><p>Đây là mức gần nhất với 46 USD/cổ phiếu.</p><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":17,"q":"An annuity will pay eight annual payments of $100, with the first payment to be received one\nyear from now. If the interest rate is 12% per year, what is the present value of this annuity?","opts":["$496.76.","$1,229.97.","$556.38."],"ans":"A","expl":"N = 8; I/Y = 12%; PMT = -$100; FV = 0; CPT PV = $496,76.\n→\n(Mô-đun 2.1, LOS 2.a)"},{"n":18,"q":"A loan of $15,000 is to be paid off in monthly payments over 5 years at 12% annual interest.\nWhat is the amount of each payment?","opts":["$1,802.","$334.","$4,161."],"ans":"B","expl":"I = 12/12 = 1; N = 5 × 12 = 60; PV = 15.000; CPT PMT = 333,67.\n→\n(Mô-đun 2.1, LOS 2.a)"},{"n":19,"q":"An investor is choosing between two possible investments. Both have identical future cash\nflows in all situations, but the investor notices a slight discrepancy in price between the two.\nWhat action will this investor take based on the no-arbitrage principle?","opts":["Act quickly by buying the lower-priced investment, as the prices will quickly converge.","Wait for the prices to further diverge, then sell the higher-priced investment.","Do nothing, as there cannot be a price divergence based on the rule."],"ans":"A","expl":"Nguyên tắc không chênh lệch giá (luật một giá) quy định rằng giá cho một khoản đầu tư sẽ\nnhư nhau nếu hai dòng tiền trong tương lai giống hệt nhau trong mọi điều kiện. Mặc dù về mặt lý thuyết\nkhông nên có sự khác biệt nhưng có thể có sự khác biệt trong một khoảng thời gian ngắn. Nếu có\nsự chênh lệch nhỏ về giá giữa các khoản đầu tư này thì nó sẽ không tồn tại lâu, vì vậy nhà đầu tư\nnên hành động nhanh chóng và mua khoản đầu tư có giá thấp hơn. Giá sẽ không còn\nphân kỳ nữa.\n(Mô-đun 2.2, LOS 2.c)"},{"n":20,"q":"An investor purchases a stock on January 1. The annual dividend payments for a stock\ninvestment for the next four years, beginning on December 31, are $50, $75, $100, and $125.\nBased on the cash flow additivity principle, the present value of this series of cash flows will\nbe equivalent to the present value of a $50 annuity and the present value of what series of\ncash flows?","opts":["$75, $50, $25, and $0.","$0, $25, $50, and $75.","$0, $0, $125, and $125."],"ans":"B","expl":"Nguyên tắc cộng dòng tiền nêu rõ rằng PV của bất kỳ dòng tiền nào đều bằng\ntổng PV của tất cả các dòng tiền. Các dòng tiền là $50, $75, $100 và $125.\nVì vậy, nếu một dòng tiền bằng $50 mỗi năm, hãy trừ $50 khỏi mỗi dòng tiền\nban đầu để có được luồng tiền thứ hai.\nPV của 50, 75, 100 và 125 = PV bằng 50, 50, 50 và 50 + PV của 0, 25, 50 và 75.\nThứ tự quan trọng vì PV sẽ khác (và cao hơn) nếu dòng tiền cao hơn đến\ntrước dòng tiền thấp hơn.\n(Mô-đun 2.2, LOS 2.c)"},{"n":21,"q":"Abeta's stock is trading at $47. Abeta just paid a dividend of $1.50, and markets assume a\nconstant growth rate in dividends of 4%. Abeta's required return on equity is closest to:","opts":["8.1%.","7.3%.","6.5%."],"ans":"B","expl":"Để tính chi phí vốn cổ phần ngụ ý, chúng tôi sắp xếp lại công thức tăng trưởng không đổi như sau:\nD×(1+g)\n1,50×1,04\n0\nr=+g=+0,04=7,32%\nP47.00\n0\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<p>Sắp xếp lại mô hình tăng trưởng không đổi để đạt được lợi nhuận yêu cầu:</p><div class=\"kd\">$$r=\\dfrac{D_0(1+g)}{P_0}+g=\\dfrac{1.50\\times1.04}{47.00}+0.04=7.32\\%$$</div><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"},{"n":22,"q":"A stock is expected to pay a dividend next year of $2.40. An analyst expects the dividend to\ngrow at a constant annual rate of 4% and believes investors' required rate of return on the\nstock is 7%. The analyst will estimate a value for this stock that is closest to:","opts":["$80.00.","$85.60.","$83.20."],"ans":"A","expl":"$2,40\n=$80.\nÁp dụng mô hình tăng trưởng Gordon,\n0,07−0,04\n(Mô-đun 2.1, LOS 2.a)"},{"n":23,"q":"Bill Jones is creating a charitable trust to provide six annual payments of $20,000 each,\nbeginning next year. How much must Jones set aside now at 10% interest compounded\nannually to meet the required disbursements?","opts":["$154,312.20.","$87,105.21.","$95,815.74."],"ans":"B","expl":"N = 6, PMT = -$20.000, I/Y = 10%, FV = 0, Giá trị điện toán tính toán $87.105,21.\n→\n(Mô-đun 2.1, LOS 2.a)"},{"n":24,"q":"A bond with a 10-year maturity has a face value of $10,000 and pays annual interest of $600.\nThe bond is issued at a price of $9,500. The bond's yield to maturity will be:","opts":["greater than 6%.","less than 6%.","equal to 6%."],"ans":"A","expl":"Không cần tính toán để trả lời câu hỏi này. Trái phiếu này được phát hành với giá\n$9.500, thấp hơn mệnh giá 10.000 USD. Trái phiếu được coi là trái phiếu chiết khấu và\nđiều này là kết quả của tình huống lãi suất coupon của trái phiếu thấp hơn lãi suất đáo hạn.\nVới lãi suất hàng năm là 600 USD trên mệnh giá 10.000 USD, lãi suất coupon bằng 6%\n(600 / 10.000). Lợi suất đáo hạn phải lớn hơn 6% để trái phiếu được phát hành ở\ngiá chiết khấu.\n(Mô-đun 2.1, LOS 2.a)"},{"n":25,"q":"A 5-year, 8% coupon bond with a par value of $1,000 pays interest annually. The price is\n$942.50, and the yield to maturity is 9.50%. If the price of the bond moves to $963.75, the\nyield to maturity will be closest to:","opts":["8.93%.","10.07%.","8.55%."],"ans":"A","expl":"Vì giá trái phiếu tăng nên lợi tức đáo hạn sẽ giảm từ mức\nhiện tại. Mức hiện tại là 9,50%, có nghĩa là lợi suất không thể là 10,07%. Bạn có thể tính toán\nlợi suất bằng máy tính tài chính:\nPV = –963,75\nFV = 1.000,00\nN = 5 năm\nPMT = 80 (8% mệnh giá)\nGiải I/Y = 8.93.\n(Mô-đun 2.2, LOS 2.b)"},{"n":26,"q":"An analyst is using the constant growth dividend discount model (DDM) to evaluate XYZ\nstock. The stock is currently trading at $20 per share and recently paid an annual dividend of\n$1.50. Assuming a constant growth rate of 4.5%, the implied required rate of return on the\nstock is closest to:","opts":["12.00%.","12.34%.","11.68%."],"ans":"B","expl":"Mô hình tăng trưởng Gordon, còn được gọi là DDM, lấy giai đoạn tiếp theo cổ tức và\nchia nó cho chênh lệch giữa lợi nhuận yêu cầu và tốc độ tăng trưởng. Công thức\ncó thể được xử lý bằng đại số để tách biệt tỷ suất lợi nhuận yêu cầu. Phép tính để\nxác định tỷ lệ lợi nhuận yêu cầu được hiển thị:\n1,50(1,045)\nD\nkg\n=+=+0,045=0,1234 hoặc 12,34\ne\n20\nV\nc\n0\nTùy chọn trả lời 11,68% là đầu ra nếu cổ tức hiện tại được chiết khấu theo tốc độ tăng trưởng\nthay vì tăng theo tốc độ tăng trưởng để có được cổ tức của kỳ tiếp theo.\nTùy chọn trả lời 12,00% là đầu ra nếu cổ tức hiện tại được sử dụng trong phép tính\nmà không điều chỉnh tốc độ tăng trưởng.\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<p>Mô hình tăng trưởng Gordon tách lợi nhuận yêu cầu thành cổ tức trên giá của kỳ tiếp theo, cộng với tốc độ tăng trưởng:</p><div class=\"kd\">$$k_e=\\dfrac{D_1}{V_0}+g=\\dfrac{1.50(1.045)}{20}+0.045=0.1234,\\ \\text{or }12.34\\%$$</div><p>Quyền chọn 11,68% chiết khấu cổ tức hiện tại theo tốc độ tăng trưởng thay vì tăng cổ tức; quyền chọn 12,00% sử dụng cổ tức hiện tại mà không điều chỉnh theo mức tăng trưởng.</p><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"},{"n":27,"q":"A bond pays annual coupon interest of £60 and returns its face value of £1,000 in seven\nyears. The bond's price today is £1,045. Its yield to maturity is closest to:","opts":["6.8%.","6.0%.","5.2%."],"ans":"C","expl":"N = 7; PMT = 60; FV = 1.000; PV = –1.045; CPT I/Y = 5,2162.\n(Mô-đun 2.2, LOS 2.b)"},{"n":28,"q":"An investor is deciding whether to buy a 1-year bond two years in a row or lock in the rate on\na 2-year bond today. The 1-year spot interest rate is 5.25%, and the 2-year spot interest rate\nis 6.50%. Which of the following statements is most accurate regarding implied forward rates\nand the investor's options?","opts":["The expected rate on a 1-year bond one year from today is equal to 7.76%.","The investor is better off locking in the 2-year rate at 6.50%.","The forward rate will be between 5.25% and 6.50%."],"ans":"A","expl":"Tỷ giá kỳ hạn ngụ ý có thể được tính dựa trên tỷ giá giao ngay có thể quan sát được trên thị trường thu nhập cố định\n. Kết quả là lãi suất kỳ hạn 1 năm ngụ ý của một năm trong tương lai có thể được\ndựa trên công thức này:\n2\n(1+S)\n2\n=(1+1y1y)\n(1+)\nS\n2\n(1,065)\n−1=0,0776\n(1,0525)\nTỷ giá kỳ hạn (1y1y) bằng 7,76%.\nTỷ giá kỳ hạn sẽ cao hơn cả hai tỷ giá giao ngay, nghĩa là không thể nằm giữa\n5,25% và 6,50%. Nhà đầu tư không nên phân biệt giữa trái phiếu kỳ hạn 2 năm trả\n6,50% và trái phiếu 1 năm ở mức 5,25% và 7,76%.\n(Mô-đun 2.2, LOS 2.c)","explhtml":"<p>Tỷ giá kỳ hạn 1 năm ngụ ý cho một năm tới được lấy từ tỷ giá giao ngay có thể quan sát được:</p><div class=\"kd\">$$\\dfrac{(1+S_2)^2}{(1+S_1)}=(1+f_{1,1})$$</div><div class=\"kd\">$$\\dfrac{(1.065)^2}{(1.0525)}-1=0.0776=7.76\\%$$</div><p>Tỷ giá kỳ hạn\\(f_{1,1}\\)cao hơn cả hai tỷ giá giao ngay, do đó nó không thể nằm trong khoảng từ 5,25% đến 6,50%.</p><span class=\"los\">(Mô-đun 2.2, LOS 2.c)</span>"},{"n":29,"q":"To determine whether the current price of a common stock is aligned with its intrinsic value,\nan analyst wants to use the Gordon growth model. To appropriately apply the model, the\nanalyst will need to estimate:","opts":["a fluctuating growth rate assigned to dividends.","the dividend to be received next year.","a growth rate that is above the required return."],"ans":"B","expl":"Mô hình tăng trưởng Gordon, còn được gọi là mô hình chiết khấu cổ tức tăng trưởng không đổi\n(DDM), lấy cổ tức của kỳ tiếp theo và chia cho chênh lệch giữa\nlợi nhuận yêu cầu và tốc độ tăng trưởng. Tốc độ tăng trưởng được giả định là không đổi và\nphải thấp hơn lợi nhuận yêu cầu—nếu không thì mẫu số của phép tính sẽ\nâm, khiến nó không hợp lệ.\n(Mô-đun 2.1, LOS 2.a)"},{"n":30,"q":"Given a 5% discount rate, the present value of $500 to be received three years from today is:","opts":["$400.","$432.","$578."],"ans":"B","expl":"N = 3; I/Y = 5; FV = 500; PMT = 0; CPT PV = 431,92.\n→\n3\nhoặc: 500/1,05 = 431,92.\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<p>N = 3; I/Y = 5; FV = 500; PMT = 0; PV CPT\\(=431.92\\), hoặc:</p><div class=\"kd\">$$\\dfrac{500}{1.05^{3}}=431.92$$</div><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":31,"q":"A 15-year zero-coupon German government bond has an annualized yield of –1.5%.\nAssuming annual compounding, the price of the bond per €100 of principal is closest to:","opts":["€125.","€115.","€105."],"ans":"A","expl":"N = 15; I/Y = –1,5; FV = 100; PMT = 0; CPT PV = –125,45.\n(Mô-đun 2.1, LOS 2.a)"},{"n":32,"q":"An investor pays $726.27 for a zero-coupon bond with a face value of $1,000 and maturing in\n10 years. Bonds with similar risk profiles and with similar terms yield 3.00%. The yield to\nmaturity for this bond is closest to:","opts":["3.25%.","2.75%.","3.00%."],"ans":"A","expl":"Trái phiếu không trả lãi định kỳ không trả lãi nhưng thường được mua với giá cao\nchiết khấu so với mệnh giá. Phương trình thể hiện mối quan hệ giữa giá trị\nhiện tại (giá mua), giá trị tương lai, thời gian và lợi suất đến ngày đáo hạn được thể hiện như\nnhư sau:\n$1.000\n$726,27=\n10\n(1+r)\n1.000\n√\n10\n1+r=\n726,27\nr=1,0325−1=0,0325 hoặc 3,25\nĐiều này cũng có thể được trả lời bằng máy tính: N = 10; PV = –726,27; PMT = 0; FV = 1.000.\nCPT I/Y = 3,25.\n2,75% là lợi tức đáo hạn nếu giá trị hiện tại được nhập không chính xác là $762,27 thay vì\n$726,27. Lợi tức của các trái phiếu tương tự không phản ánh lợi tức của một trái phiếu cụ thể.\n(Mô-đun 2.1, LOS 2.a)","explhtml":"<p>Đối với trái phiếu không trả lãi, mối quan hệ giữa giá, mệnh giá, thời gian và lợi tức là:</p><div class=\"kd\">$$726.27=\\dfrac{1{,}000}{(1+r)^{10}}$$</div><div class=\"kd\">$$1+r=\\sqrt[10]{\\dfrac{1{,}000}{726.27}}=1.0325\\ \\Rightarrow\\ r=0.0325,\\ \\text{or }3.25\\%$$</div><p>Máy tính: N = 10; PV = -726,27; PMT = 0; FV = 1.000; CPT I/Y = 3,25.</p><span class=\"los\">(Mô-đun 2.1, LOS 2.a)</span>"},{"n":33,"q":"Given the following cash flow stream:\nEnd of YearAnnual Cash Flow\n1$4,000\n2$2,000\n3-0-\n4-$1,000\nUsing a 10% discount rate, the present value of this cash flow stream is:","opts":["$4,606.00.","$3,636.00.","$3,415.00."],"ans":"A","expl":"PV(1): N = 1; I/Y = 10; FV = -4.000; PMT = 0; CPT PV = 3.636\n→\nPV(2): N = 2; I/Y = 10; FV = -2.000; PMT = 0; CPT PV = 1.653\n→\nPV(3): 0\nPV(4): N = 4; I/Y = 10; FV = 1.000; PMT = 0; CPT PV = -683\n→\nTổng PV = 3.636 + 1.653 + 0 – 683 = 4.606\n(Mô-đun 2.2, LOS 2.c)","qhtml":"<p>Given the following cash flow stream:</p><table class=\"qtable\"><thead><tr><th>End of Year</th><th>Annual Cash Flow</th></tr></thead><tbody><tr><td>1</td><td>$4,000</td></tr><tr><td>2</td><td>$2,000</td></tr><tr><td>3</td><td>$0</td></tr><tr><td>4</td><td>−$1,000</td></tr></tbody></table><p>Using a 10% discount rate, the present value of this cash flow stream is:</p>"},{"n":34,"q":"A pure discount instrument with a face value of ¥500 million matures nine years from today\nand has a current price of ¥350 million. The instrument's annualized yield is closest to:","opts":["4.0%.","3.3%.","4.7%."],"ans":"A","expl":"500\n9\n(1+r)=\n350\n500\n9\n()−1=4,04%.\nr =\n350\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<div class=\"kd\">$$(1+r)^{9}=\\dfrac{500}{350}$$</div><div class=\"kd\">$$r=\\left(\\dfrac{500}{350}\\right)^{1/9}-1=4.04\\%$$</div><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"},{"n":35,"q":"An investor spends $365,000 purchasing zero-coupon bonds with a total face value of\n$500,000 and maturing in 10 years. For the annualized rate of return to be above 3.20%, the\nbond's price will have to be:","opts":["equivalent to $365,000.","higher than $365,000.","lower than $365,000."],"ans":"C","expl":"Với giá trị tương lai là 500.000 USD, giá trị hiện tại là 365.000 USD và thời gian đáo hạn là 10 năm,\ntỷ lệ hàng năm là lợi nhuận được tính như sau:\n$500.000\n=$365.000\n10\n(1+r)\n$500.000\n10\n(1+r)\n==1.36986\n$365.000\n1/10\nr=1.36986−1=0,0320\nTrên máy tính, N = 10; PV = –365.000; PMT = 0; FV = 500.000; CPT I/Y = 3,2.\nVì lợi tức hàng năm là 3,20% và câu hỏi hỏi về giá trái phiếu\nphải trên 3,20% nên giá trái phiếu phải thấp hơn giá mua\n$365.000. Mối quan hệ giữa giá và tỷ suất lợi nhuận là nghịch đảo; để tỷ lệ\nlợi nhuận trên 3,20% thì giá phải giảm.\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<p>Với FV = 500.000 USD, PV = 365.000 USD và thời hạn 10 năm:</p><div class=\"kd\">$$(1+r)^{10}=\\dfrac{500{,}000}{365{,}000}=1.36986$$</div><div class=\"kd\">$$r=1.36986^{1/10}-1=0.0320,\\ \\text{or }3.20\\%$$</div><p>Máy tính: N = 10; PV = -365.000; PMT = 0; FV = 500.000; CPT I/Y = 3,2.</p><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"},{"n":36,"q":"Using a constant growth dividend discount model (DDM), an analyst assumes a required\nreturn on equity of 9.75%. The current stock price is $30 per share, and the next period's\ndividend is $2.40 per share. The constant growth rate implied in the model is closest to:","opts":["1.83%.","1.75%.","1.89%."],"ans":"B","expl":"Mô hình tăng trưởng Gordon, còn được gọi là DDM, lấy cổ tức của kỳ tiếp theo và\nchia cho chênh lệch giữa lợi nhuận yêu cầu và tốc độ tăng trưởng. Công thức\ncó thể được xử lý bằng đại số để tách biệt tốc độ tăng trưởng ngụ ý. Phép tính để\nxác định tốc độ tăng trưởng được hiển thị:\nD\n2,40\ng=k−=0,0975−=0,0975−0,08=0,0175 hoặc 1,75\ne\n30\ncV\n0\nTùy chọn câu trả lời 1,83% có câu trả lời đúng là 1,75% và cộng tỷ suất cổ tức của\n8%: 1,75% + 0,08% = 1,83%. Tùy chọn câu trả lời 1,89% lấy câu trả lời đúng là 1,75%\nvà tăng nó bằng cách nhân nó với tỷ suất cổ tức 8%: 1,75% × (1,08) = 1,89%.\n(Mô-đun 2.2, LOS 2.b)","explhtml":"<p>Sắp xếp lại mô hình tăng trưởng Gordon để tách biệt tốc độ tăng trưởng ngụ ý:</p><div class=\"kd\">$$g=k_e-\\dfrac{D_1}{V_0}=0.0975-\\dfrac{2.40}{30}=0.0975-0.08=0.0175,\\ \\text{or }1.75\\%$$</div><p>Tùy chọn 1,83% tăng tỷ suất cổ tức 8% lên 1,75%; quyền chọn 1,89% tăng 1,75% theo tỷ suất cổ tức.</p><span class=\"los\">(Học ​​phần 2.2, LOS 2.b)</span>"}];
const CFG = {"title": "The Time Value of Money in Finance", "subtitle": "CFA · Quantitative Methods · Reading 2 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl || q.explhtml){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts,q.explhtml));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options,richHtml){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  if(richHtml){
    const choice=document.createElement("article"); choice.className="expl-choice is-correct";
    const top=document.createElement("div"); top.className="expl-choice-top";
    const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=correctLetter;
    const state=document.createElement("span"); state.className="expl-state"; state.textContent="Đáp án đúng";
    top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
    const optionIndex=LETTERS.indexOf(correctLetter);
    if(options&&optionIndex>=0&&options[optionIndex]){ const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option); }
    const reason=document.createElement("div"); reason.className="expl-reason expl-rich"; reason.innerHTML=richHtml; choice.appendChild(reason); content.appendChild(choice);
  }else explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(!richHtml&&(data.reading||data.los)){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){

      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');

      fetchEmoji('face-positive', emoji);

      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
