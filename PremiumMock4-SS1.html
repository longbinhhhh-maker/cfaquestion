<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">

<script>
const DATA = [{"n":1,"q":"Max Ohn, CFA, works as a client advisor for a small firm. He has established a referral program with\na real estate agency. Ohn refers clients to the real estate agency and the real estate agency refers\nclients to Ohn. Because the real estate agency does not compete with Ohn's employer and because\nthe arrangement benefits Ohn's firm, he omits disclosure of the arrangement to his firm. Ohn\ndiligently discloses the referral arrangement to all referred clients after they become firm clients. Has\nOhn most likely violated the Standard relating to referral fees?","opts":["No","Yes, only by omitting disclosure of the arrangement to his firm","Yes, by omitting disclosure of the arrangement to his firm and by disclosing the referral\narrangement to referred clients after they become firm clients"],"qhtml":null,"ans":"C","expl":"Yes, by omitting disclosure of the arrangement to his firm and by disclosing the\nreferral arrangement to referred clients after they become firm clients"},{"n":2,"q":"A member, who is an independent analyst, is approached by two small companies to write issuer-paid research report. Company 1 proposes to pay a flat fee plus stock warrants to the member.\nCompany 2 requires the member to obtain approval prior to publishing the reports. The member\nmost likely violates the Standards if the member agrees to write reports for:","opts":["Company 1 only.","Company 2 only.","both Company 1 and Company 2."],"qhtml":null,"ans":"C","expl":"both Company 1 and Company 2."},{"n":3,"q":"Toni Lynn, CFA, is a research analyst. Lynn relies on her colleagues to determine whether the third-party research she uses is sound. Lynn also uses content from personal blogs and social media\nwebsites for her research after concluding it is sound. Has Lynn most likely violated the Standard\nrelating to diligence and reasonable basis?","opts":["No","Yes, by using content from personal blogs and social media websites for her research","Yes, by relying on her colleagues to determine whether the third-party research is sound"],"qhtml":null,"ans":"A","expl":"No"},{"n":4,"q":"Teresa Avila, CFA, is a micro cap investment analyst at a hedge fund. The fund requires Avila to\nhold any securities she recommends for the fund in her own account as well. Because Avila has\nsuch a small account, whenever she trades for her own portfolio she combines the transactions with\nthose of the hedge fund so she is sure to have her account aligned with the fund. Has Avila most\nlikely violated any CFA Institute Standards of Professional Conduct?","opts":["No","Yes, the Standard relating to misconduct","Yes, the Standard relating to priority of transactions"],"qhtml":null,"ans":"C","expl":"Yes, the Standard relating to priority of transactions"},{"n":5,"q":"Kush Shah, CFA, is the chief investment officer of an investment firm. Shah discovers during a\nroutine review of the firm's trading system that the firm erroneously bought shares of IY steel for\nseveral clients. Shah immediately sells IY shares and realises significant profits for clients. Later, Shah outsources a portion of the clients' portfolios to an external manager. Shah does not notify the\nfirm's clients about the external manager because the fund's stock selection process remains\nunchanged. Shah has violated the Standards because he failed to notify clients:","opts":["only about the erroneous purchase of IY shares.","only about outsourcing a portion of the clients' portfolios to an external manager.","about the erroneous purchase of IY shares and about outsourcing a portion of the clients'\nportfolios to an external manager."],"qhtml":null,"ans":"C","expl":"about the erroneous purchase of IY shares and about outsourcing a portion of the\nclients' portfolios to an external manager."},{"n":6,"q":"The Standard relating to additional compensation arrangements requires members to disclose\nwhich of the following that might create a conflict with their employer's interests?","opts":["Only direct compensation","Only indirect compensation","Both direct compensation and indirect compensation"],"qhtml":null,"ans":"C","expl":"Both direct compensation and indirect compensation"},{"n":7,"q":"Ana Kloes, CFA, passes all three levels of the CFA exam in three consecutive years. After passing\nthe Level III exam, she adds to her email signature, \"Partial CFA, awaiting CFA charter.\" Before\nKloes is awarded the CFA charter, she writes on her social media page, \"I passed all three levels of\nthe CFA Program on my first attempt in three consecutive years.\" Has Kloes violated the\nStandards?","opts":["No","Yes, because she adds to her email signature, \"Partial CFA, awaiting CFA charter\"","Yes, because she adds on her social media page, \"I passed all three levels of the CFA\nProgram on my first attempt in three consecutive years.\""],"qhtml":null,"ans":"B","expl":"Yes, because she adds to her email signature, \"Partial CFA, awaiting CFA charter\""},{"n":8,"q":"To be compliant with the GIPS standards, after a firm presents five years of performance history, it\nmust build up to a minimum of:","opts":["7 years of compliant performance presentation.","10 years of compliant performance presentation.","15 years of compliant performance presentation."],"qhtml":null,"ans":"B","expl":"10 years of compliant performance presentation."},{"n":9,"q":"Akash Gupta has just finished taking the Level II CFA exam for the second time. To protect the\nintegrity of the exam, Gupta is careful not to discuss the exam questions with other candidates.\nGupta calls his friend, a member, and contrasts his two attempts by highlighting that there were\nmany calculation questions on derivatives in the first instance and none in the second. Later, in a\npublic blog on investment education, Gupta shares his strong disagreement regarding CFA Institute\nshifting to computer-based testing. Has Gupta violated the Standards?","opts":["No","Yes, by highlighting that there were no calculation questions on derivatives in the recent\nexam","Yes, by expressing his disagreement in a public blog regarding CFA Institute shifting to\ncomputer-based testing"],"qhtml":null,"ans":"B","expl":"Yes, by highlighting that there were no calculation questions on derivatives in the\nrecent exam"},{"n":10,"q":"A member who pays a higher brokerage commission on behalf of all of his clients than he would\nnormally pay, without any corresponding benefit to the client, violates the Standard relating to:","opts":["suitability.","fair dealing.","loyalty, prudence, and care."],"qhtml":null,"ans":"C","expl":"loyalty, prudence, and care."},{"n":11,"q":"Which of the following statements is accurate?","opts":["Verification eliminates the need for in-depth due diligence of a GIPS-compliant firm for a\nprospective investor.","Verification can be performed on a specific composite to ensure accuracy of the composite\npresentation.","Verification provides assurance on whether the firm's policies and procedures related to\npooled fund maintenance have been implemented on a firm-wide basis."],"qhtml":null,"ans":"C","expl":"Verification provides assurance on whether the firm's policies and procedures\nrelated to pooled fund maintenance have been implemented on a firm-wide basis."},{"n":12,"q":"Which of the following is not a recommended procedure for compliance with the Standard relating to\nmisrepresentation? Firms should:","opts":["avoid verifying information from third-party firms for timely trade executions.","specifically designate which employees are authorized to speak on behalf of the firm.","periodically review employee correspondence that contains representations of individual\nqualifications."],"qhtml":null,"ans":"A","expl":"avoid verifying information from third-party firms for timely trade executions."},{"n":13,"q":"A member who is an investment advisor receives a large unsolicited trade request from a client that\nis not aligned with the client's investment objectives. Which of the following actions by the member\nis consistent with the Standard relating to suitability? The member:","opts":["immediately executes the trade.","reduces the size of the requested investment and executes the trade.","discusses the investment with the client, adjusts the client's investment policy statement,\nand executes the trade."],"qhtml":null,"ans":"C","expl":"discusses the investment with the client, adjusts the client's investment policy\nstatement and executes the trade."},{"n":14,"q":"When a client asks her how she makes investment decisions, Petra Vogler, CFA, tells the client she\nuses mosaic theory. According to Vogler, the theory involves analyzing public and nonmaterial\nnonpublic information including the evaluation of statements made to her by company insiders in\none-on-one meetings where management discusses new earnings projections not known to the\npublic. Vogler also gathers general industry information from industry experts she has contacted.\nVogler violates the CFA Institute Standards of Professional Conduct because of her use of:","opts":["industry expert information.","one-on-one meeting information.","nonmaterial nonpublic information."],"qhtml":null,"ans":"B","expl":"one-on-one meeting information."},{"n":15,"q":"Shruti Kurup, CFA, is preparing to leave her firm and join a new employer. Prior to leaving the firm,\nKurup calls all her clients informing them of her decision to leave. When asked by the clients, Kurup\nstates lack of confidence in the firm's leadership as the reason for her departure and also mentions\nthat more employees are likely to leave soon. Kurup has violated the Standard(s) relating:","opts":["only to loyalty.","only to communication with clients and prospective clients.","both to loyalty and to communication with clients and prospective clients only."],"qhtml":null,"ans":"A","expl":"only to loyalty."},{"n":16,"q":"To comply with the Standard relating to knowledge of the law, members are required to take which\nof the following actions?\nAction 1 only: Acquire detailed knowledge of all the laws relating to their activities\nAction 2 only: Dissociate from activities of others that they believe are unethical","opts":["Action 1 only","Action 2 only","Both Action 1 and Action 2"],"qhtml":null,"ans":"B","expl":"Action 2 only"},{"n":17,"q":"Peter Chang, CFA, spreads rumors on social media about a potential acquisition of Advanced\nElectronics Company (AEC) after buying the stock for his personal account. Despite the rumors,\nAEC's stock price declines and Chang closes his position at a significant loss. Has Chang violated\nthe Standards?","opts":["No","Yes, the Standard relating to market manipulation only","Yes, both the Standard relating to market manipulation and the Standard relating to\nmisconduct"],"qhtml":null,"ans":"C","expl":"Yes, both the Standard relating to market manipulation and the Standard relating to\nmisconduct"},{"n":18,"q":"According to the Standards, which of the following information requires disclosure?\n• Information 1: A member's brother inherits a significant ownership of a stock that is part of the\nmember's research coverage universe. The member has no beneficial ownership in her brother's\ninvestments.\n• Information 2: A member, a portfolio manager at an investment firm, does unpaid volunteer work\nduring holiday weekends at a charity.\n• Information 3: Firm enters into an agreement with a mutual fund to receive commissions for\nrecommending the fund to the firm's clients.","opts":["Information 1","Information 2","Information 3"],"qhtml":null,"ans":"C","expl":"Information 3"},{"n":19,"q":"According to the Standards, a member engages in information-based manipulation when she:","opts":["uses public information to implement trading strategies with an intent to exploit perceived\nmarket inefficiencies.","induces other market participants to trade a security by issuing an overly optimistic\nprojection of a security's value.","relies on false rumors spread by other market participants to secure a dominant position in\nan underlying security."],"qhtml":null,"ans":"B","expl":"induces other market participants to trade a security by issuing an overly optimistic\nprojection of a security's value."},{"n":20,"q":"According to the Standard relating to preservation of confidentiality, a member is required to\nmaintain confidentiality of information communicated to her:","opts":["by her former clients only.","by her prospective clients only.","both by her former clients and by her prospective clients."],"qhtml":null,"ans":"C","expl":"both by her former clients and by her prospective clients."},{"n":21,"q":"Anisha Joshi, CFA, develops a product that selects mutual funds based on historical data. Joshi\ntests her methodology and produces simulated performance results. The promotional material for\nthe product does not indicate that the results are simulated. Joshi has most likely violated the\nStandards relating:","opts":["only to fair dealing.","only to performance presentation.","both to fair dealing and to performance presentation."],"qhtml":null,"ans":"B","expl":"only to performance presentation."},{"n":22,"q":"Who is most likely responsible for claiming and maintaining compliance with the CFA Institute\nGlobal Investment Performance Standards (GIPS)?","opts":["The firm claiming compliance","Independent verification firms","The performance measurement department"],"qhtml":null,"ans":"A","expl":"The firm claiming compliance"},{"n":23,"q":"Mila Roy, CFA, heads the research division of an investment firm. Roy sends a recommended stock\nlist to all of her firm's clients along with a notification that a detailed report on each stock is available\non request. Roy later calls only her premium fee-paying clients and discusses her\nrecommendations. Such additional services are available for all clients willing to pay premium fees\nand is fully disclosed as part of the client agreement. Has Roy violated the Standards?","opts":["No","Yes, the Standard relating to fair dealing","Yes, the Standard relating to communication with clients and prospective clients"],"qhtml":null,"ans":"A","expl":"No"},{"n":24,"q":"The GIPS standards were created to prevent the:","opts":["comparison of comparable time periods with other firms' results.","selection of a top-performing portfolio to represent the firm's strategy.","presentation of an average performance history that includes terminated portfolios."],"qhtml":null,"ans":"B","expl":"selection of a top-performing portfolio to represent the firm's strategy."},{"n":25,"q":"According to the Standard relating to responsibilities of supervisors, a member who works as a\ndepartment head managing large numbers of employees must:","opts":["have in-depth knowledge of the Code and Standards.","personally evaluate the conduct of all employees in his department on a continuing basis.","make reasonable efforts to ensure all employees at his firm comply with applicable laws and\nregulations."],"qhtml":null,"ans":"A","expl":"have in-depth knowledge of the Code and Standards."},{"n":26,"q":"Regarding challenges to ethical behavior, which of the following is not an example of a situational\ninfluence?","opts":["Bonuses","Internal factors","Loyalty to employer"],"qhtml":null,"ans":"B","expl":"Internal factors"},{"n":27,"q":"Mary Lawrence, CFA, is a research analyst. She archives her research notes for recommendation\nchanges and discards her research notes for cases in which recommendations do not change. She\nalso discards third-party research reports used to support her analysis. Lawrence has most likely\nviolated the Standards:","opts":["only by discarding third-party research reports used to support her analysis.","only by discarding her research notes for cases in which recommendations do not change.","both by discarding third-party research reports used to support her analysis and by\ndiscarding her research notes for cases in which recommendations do not change."],"qhtml":null,"ans":"C","expl":"both by discarding third-party research reports used to support her analysis and by\ndiscarding her research notes for cases in which recommendations do not change."},{"n":28,"q":"The central limit theorem:","opts":["requires that the population be approximately normally distributed.","implies that the sample mean is a consistent estimator of the population mean.","states that the product of independent random variables is normally distributed."],"qhtml":null,"ans":"B","expl":"implies that the sample mean is a consistent estimator of the population mean."},{"n":29,"q":"A portfolio invested in two assets has an expected return of 11%. If expected returns for Assets A\nand B, respectively, are 8% and 12%, then the portfolio weight of Asset B is closest to:","opts":["25%.","50%.","75%."],"qhtml":null,"ans":"C","expl":"75%."},{"n":30,"q":"In a test of independence based on contingency table data, the nonparametric test statistic to be\nused is:","opts":["F-distributed.","normally distributed.","chi-square distributed."],"qhtml":null,"ans":"C","expl":"chi-square distributed."},{"n":31,"q":"An analyst gathers the following information (in £ millions) about a company:\nBeginning accounts receivable: 5,500\nEnding accounts receivable: 7,000\nRevenue: 35,000\nAssuming all sales are made on credit, cash received from customers (in £ millions) is:","opts":["33,500.","35,000.","36,500."],"qhtml":null,"ans":"A","expl":"33,500."},{"n":32,"q":"Double taxation of income occurs when a corporation pays taxes on its profits, and additional taxes\nare paid by the:","opts":["shareholders on dividends received.","corporation on distributions to shareholders.","shareholders on gains earned from their equity investment."],"qhtml":null,"ans":"A","expl":"shareholders on dividends received."},{"n":33,"q":"An analyst gathers the following fiscal year information (in ¥ millions) for a company:\nCash flow from operating activities: 28,808\nPurchase of equipment: 1,300\nSale of equipment: 1,750\nLong-term debt repayment: 470\nIncrease in short-term borrowing: 930\nFCFE is closest to:","opts":["¥28,798 million.","¥29,258 million.","¥29,718 million."],"qhtml":null,"ans":"C","expl":"¥29,718 million."},{"n":34,"q":"A positive movement in a lagging indicator would least likely be used to:","opts":["identify a past condition of the economy.","identify an expected future economic upturn.","confirm that an expansion is currently underway."],"qhtml":null,"ans":"B","expl":"identify an expected future economic upturn."},{"n":35,"q":"Which of the following is an example of cooperative country behavior?","opts":["Autarky","Hegemony","Bilateralism"],"qhtml":null,"ans":"C","expl":"Bilateralism"},{"n":36,"q":"A firm is operating under an oligopoly when it is:","opts":["the sole provider of a good or service.","one of many providers of a good or service.","one of a small number of providers of a good or service."],"qhtml":null,"ans":"C","expl":"one of a small number of providers of a good or service."},{"n":37,"q":"An analyst gathers the following information (in € millions) about a company's machine:\nCarrying amount prior to impairment: 8.0\nPresent value of expected future cash flows: 7.4\nUndiscounted expected future cash flows: 7.8\nCosts to sell: 0.2\nImpairment loss: 0.5\nThe fair value of the machine (in € millions) is:","opts":["7.5.","7.7.","7.8."],"qhtml":null,"ans":"B","expl":"7.7."},{"n":38,"q":"An advantage of indirect taxes as a fiscal policy tool is that such taxes:","opts":["can be adjusted almost immediately.","minimize interference with consumer choices.","have a greater impact on aggregate spending and output than direct government spending."],"qhtml":null,"ans":"A","expl":"can be adjusted almost immediately."},{"n":39,"q":"The notes to the financial statements are required to provide:","opts":["explanatory information about every line item on the balance sheet and income statement.","information about the accounting policies, methods, and estimates used to prepare the\nfinancial statements.","management comments over any favorable or unfavorable trends, significant events and\nuncertainties that may affect the company."],"qhtml":null,"ans":"B","expl":"information about the accounting policies, methods, and estimates used to prepare\nthe financial statements."},{"n":40,"q":"At which stage in its life cycle would a typical company most likely have more debt than equity in its\ncapital structure?","opts":["Start-up stage","Growth stage","Mature stage"],"qhtml":null,"ans":"C","expl":"Mature stage"},{"n":41,"q":"Business models should have:","opts":["a value chain only.","a value proposition only.","both a value chain and a value proposition."],"qhtml":null,"ans":"C","expl":"both a value chain and a value proposition."},{"n":42,"q":"An analyst gathers the following information about a company's capital investment:\nInitial cash outlay: $90 million\nAnnual before-tax cash flows (year-end) for Year 1 through Year 6: $50 million\nMarginal tax rate: 15%\nRequired rate of return: 12%\nThe net present value of the investment is closest to:","opts":["$85 million.","$116 million.","$175 million."],"qhtml":null,"ans":"A","expl":"$85 million."},{"n":43,"q":"An analyst is preparing financial projections for a company held in her firm's equity portfolio. When\ndetermining an appropriate time horizon for her company projections, the analyst should consider:","opts":["the portfolio's turnover only.","cyclicality of the company's industry only.","both the portfolio's turnover and the cyclicality of the company's industry."],"qhtml":null,"ans":"C","expl":"both the portfolio's turnover and the cyclicality of the company's industry."},{"n":44,"q":"An analyst gathers the following information about a company's capital structure, cost of capital, and\nmarginal tax rate:\nMarket value of debt: $1,000 million\nMarket value of equity: $500 million\nBook value of debt: $900 million\nBook value of equity: $300 million\nPre-tax cost of debt: 4%\nCost of equity: 6%\nMarginal tax rate: 30%\nIf interest is fully tax deductible, the WACC is closest to:","opts":["3.6%.","3.9%.","4.7%."],"qhtml":null,"ans":"B","expl":"3.9%."},{"n":45,"q":"The regulation of economic activity over time is associated with:","opts":["fiscal policy only.","monetary policy only.","both fiscal policy and monetary policy."],"qhtml":null,"ans":"C","expl":"both fiscal policy and monetary policy."},{"n":46,"q":"An analyst gathers the following one-period continuously compounded returns:\nr(0,1): 4.2% | r(1,2): 3.0% | r(2,3): −1.0%\nThe continuously compounded return from time t = 0 to time t = 3 is closest to:","opts":["6.07%.","6.20%.","6.25%."],"qhtml":null,"ans":"B","expl":"6.20%."},{"n":47,"q":"An analyst runs a simple linear regression to test whether the variation in the demand for corn\nexplains the variation in the supply of wheat. In this model, the demand for corn is a(n):","opts":["indicator variable.","explained variable.","independent variable."],"qhtml":null,"ans":"C","expl":"independent variable."},{"n":48,"q":"A company must disclose for each class of long-lived assets the amounts of impairment losses\nrecognized in the period and where those losses are recognized on the financial statements under:","opts":["IFRS only.","US GAAP only.","both IFRS and US GAAP."],"qhtml":null,"ans":"C","expl":"both IFRS and US GAAP."},{"n":49,"q":"A country in fiscal balance with a trade surplus will most likely:","opts":["sell assets to foreigners to reduce the imbalance.","reduce the imbalance by lending to foreign countries.","have an excess of domestic saving relative to investment spending."],"qhtml":null,"ans":"C","expl":"have an excess of domestic saving relative to investment spending."},{"n":50,"q":"Which of the following changes to management compensation packages would most likely result in\nmanagement becoming more risk averse in its corporate decision making?","opts":["Decreasing the length of management tenure","Eliminating stock grants and options from management compensation","Tying management compensation to the size of the company's business"],"qhtml":null,"ans":"B","expl":"Eliminating stock grants and options from management compensation"},{"n":51,"q":"Members of a company's board of directors are most likely required to:","opts":["report to the company's CEO.","display loyalty to the company.","work for the company or the industry in which the company operates."],"qhtml":null,"ans":"B","expl":"display loyalty to the company."},{"n":52,"q":"An analyst gathers the following information about a company's common stock:\n• 1 January: 200,000 shares outstanding\n• 1 June: 50,000 shares issued\n• 1 August: two-for-one stock split\n• 31 December: 500,000 shares outstanding\nTo calculate earnings per share for Year 1, the company's weighted average number of shares\noutstanding is closest to:","opts":["350,000.","375,000.","458,332."],"qhtml":null,"ans":"C","expl":"458,332"},{"n":53,"q":"The most appropriate treatment of goodwill is that it be:","opts":["amortized.","tested annually for impairment.","fully expensed at the time of acquisition."],"qhtml":null,"ans":"B","expl":"tested annually for impairment."},{"n":54,"q":"A corporate takeover mechanism by which shareholders are persuaded to vote for a group seeking\na controlling position on a company's board of directors best defines a:","opts":["tender offer.","proxy contest.","hostile takeover."],"qhtml":null,"ans":"B","expl":"proxy contest."},{"n":55,"q":"If all observations in a dataset have distinct positive values, which of the following relationships\nholds?","opts":["Arithmetic mean < Harmonic mean < Geometric mean","Geometric mean < Arithmetic mean < Harmonic mean","Harmonic mean < Geometric mean < Arithmetic mean"],"qhtml":null,"ans":"C","expl":"Harmonic mean < Geometric mean < Arithmetic mean"},{"n":56,"q":"An analyst gathers the following information about a company:\nDebt-to-equity ratio based on market value: 43%\nDebt-to-equity ratio based on book value: 52%\nThe weight of debt the analyst should use when determining the company's target capital structure\nis closest to:","opts":["30%.","43%","52%"],"qhtml":null,"ans":"A","expl":"30%."},{"n":57,"q":"A portfolio has two stocks with equal weighting. The variance of returns for each stock is 100\npercent squared, and the covariance is 50 percent squared. The portfolio's standard deviation of\nreturns is closest to:","opts":["7.9%.","8.7%.","75.0%."],"qhtml":null,"ans":"B","expl":"8.7%."},{"n":58,"q":"In capital investment decisions, an abandonment option is most likely a type of:","opts":["sizing option.","timing option.","flexibility option."],"qhtml":null,"ans":"A","expl":"sizing option."},{"n":59,"q":"Which of the following available sources of capital is taken into account to calculate the WACC of an\nunlevered company?","opts":["Preferred stock only","Common stock only","Both preferred stock and common stock"],"qhtml":null,"ans":"C","expl":"Both preferred stock and common stock"},{"n":60,"q":"An analyst gathers the following information (in € thousands) about an electronics manufacturing\ncompany:\nYear 2: Cost of sales: 1,250 | Cost of inventory: 225 | Net realizable value of inventory: 300\nYear 1: Cost of sales: 1,000 | Cost of inventory: 375 | Net realizable value of inventory: 325\nChanges to the allowance for inventory obsolescence have already been reflected in cost of sales.\nThe inventory turnover (based on average inventory) for Year 2 is closest to:","opts":["4.0.","4.2.","4.5."],"qhtml":null,"ans":"C","expl":"4.5."},{"n":61,"q":"The long-run marginal cost schedule serves as a firm's supply curve under a(n):","opts":["oligopoly market.","perfectly competitive market.","monopolistically competitive market."],"qhtml":null,"ans":"B","expl":"perfectly competitive market."},{"n":62,"q":"Fiat money is currency that is:","opts":["legal tender.","not created by a central bank.","convertible by law int /USD spot rate: 1.2930 | AUD/USD spot rate: 1.3245\n(CAD/USD is the amount of CAD per 1 USD;\nAUD/USD is the amount of AUD per 1 USD)\nThe spot CAD/AUD (amount of CAD per 1 AUD) cross-rate is closest to:","opts":["0.9762.","1.0244.","1.7126."],"qhtml":null,"ans":"A","expl":"0.9762."}];
const CFG = {"title":"Premium Mock 4 (2026) — Session 1","subtitle":"CFA Level I · Premium 2026 · 90 câu · 2h15p","minutes":135,"passMark":70,"hasAnswers":true,"hasExpl":true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
