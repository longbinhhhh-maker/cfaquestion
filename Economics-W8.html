<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>

9TP5CbWsjqcAAAAAElFTkSuQmCC"]}, {"n": 2, "q": "If spot exchange rate quotes are 0.1427 CAD/SEK and 0.1366 CAD/NOK, the no-arbitrage SEK/NOK spot rate is closest to:", "opts": ["0.0195", "0.9573", "1.0447"], "ans": "B", "expl": "A cross exchange rate can be derived by cross multiplying two other rates. Cross rates are commonly used to derive an exchange rate for a\nseldom-quoted currency pair, but they can also be used to determine whether a quoted rate is fairly priced. One currency must be common to\nboth cross-multiplied rates.\nIn this scenario, the SEK/NOK cross rate is calculated by cross multiplying the CAD/SEK and CAD/NOK exchange rates. Since both quotes have\nCAD in the numerator, the steps to calculate the cross rate are as follows:\nThis cross rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. Here, any SEK/NOK exchange rate\nother than 0.9573 would allow an investor to earn arbitrage profits by selling the relatively overvalued currency and buying the relatively\nundervalued currency.\n(Choice A) 0.0195 results from failing to invert the CAD/SEK quote before multiplying it by the CAD/NOK rate.\n(Choice C) 1.0447 results from incorrectly inverting the CAD/NOK quote rather than the CAD/SEK rate. Doing so results in the NOK/SEK cross\nrate instead of the SEK/NOK rate.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAACcCAIAAACBeeUdAAAUXElEQVR42u2d3XWrOhOGlW+d+7ArCKkgpALjCowrMK4AuwKbCjAVYFdgXAGkApMKol2B2RXs7+JdZ5aOMJj8mp39PhdZsc2PNGg0o9EI3fz+/VsRQv5M/kcREEIFJoRQgQkhVGBCqMCEECowIYQKTAihAhNCBSaEUIEJIVRgQqjAhBAqMCGECkwIoQITQgUmhFCBCSFUYEIIFZgQKjAhhApMCKECE0IFJoRQgQkhVGBCCBWYkG/LP+ AAAASUVORK5CYII="]}, {"n": 3, "q": "A GBP/USD forward exchange rate quoted at positive forward points most likely indicates that GBP:", "opts": ["is expected to appreciate against USD.", "is trading at a forward discount relative to USD.", "has an interest rate that is lower than the USD interest rate."], "ans": "B", "expl": "A forward exchange rate is the amount of one currency that can be exchanged for one unit of another currency in the future; this rate can be\nquoted by forward points. The forward exchange rate is determined by adding the quoted number of positive or negative forward points, also\nknown as pips, to the price currency in the spot rate quote.\nIf there are:\nPositive forward points, then the specified number of pips is added to the spot rate to determine the forward exchange rate. In this\nscenario, it takes more GBP (ie, price currency) to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth\nless relative to the USD in the forward market, so the GBP is trading at a forward discount.\nNegative forward points, then the specified number of pips is subtracted from the spot rate to determine the forward exchange rate. In that\ncase, it takes fewer GBP to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth more relative to the USD in\nthe forward market, so the GBP is trading at a forward premium.\n(Choice A) The positive points signal that it will take a greater amount of GBP to buy USD 1 at the forward rate than at the spot rate and that\nmarket participants expect the GBP to depreciate against the USD.\n(Choice C) A forward exchange rate greater than the spot rate indicates that the price currency interest rate is greater than the base currency\ninterest rate.\nThings to remember:\nForward discounts or premiums refer to the value of a currency at the forward versus the spot exchange rate. Positive forward points indicate it\ntakes more of the price currency to buy one unit of the base currency at the forward rate (ie, in the future) and the price currency is trading at a\nforward discount.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA48AAAFoCAIAAAB41VlLAABQZElEQVR42u29XW4bWZK/HWUUai6qG0oX0FczgGlvwClvgJQ2QMkbINkboDgbYHEDTXEDTXIDFrkBi9yAnVpASRQwc1VAOY2euik0Su/F7+94jzOZKX5Isj6e58KQk5knT8b5yMg4EXG+u7q6MgAAAACAe8kzRAAAAAAAaKsAAAAAAGirAAAAAIC2CgAAAACAtgoAAAAAaKsAAAAAAGirAAAAAABoqwAAAACAtgoAAAAAgLYKAAAAAGirAAAAAABoqwAAAAAAaKsAAAAAgLYKAAAAAIC2CgAAAABoqwAAAAAAaKsAAAAAAGirAAAAAIC2CgAAAACAtgoAAAAAaKsAAAAAAGirAAAAAABoqwAAAACAtgoAAAAAgLYKAAAAAGirAAAAAABoqwAAAAAAaKsAAAAAgLYKAAAAAIC2CgAAAABPhu8RwT0nTVMzS5Lk2jOjKDKzOI4R2lJms5kLansphaWFYldLqdXMrFarIfnHwWKxWCwW/t84jtX0TEqVSqVSqSCK2xZF0ZzzgCbeFautgebD7SmPNTBsqwAAAABw//nu6uoKKdz/D9O9vb1rz5QZ7/T0FKEt7+vffeeC2l5KYWmh2NVSbk5gfC3l559/ti+2lqOjo4dS516v5/89PT19sobzzKTU7XbVoIjiRkThoyMzNIrmnAc08a5YbUnAh9tTHmtgeAIAgN35Yrpe7fqj2+0iEwBGB4DhCQAAAAAAhm0V7oanvOj2IMATw1YOnoAHipZl8XK549HxdASudxxvOjBsqwAAAABg2FbhPjAajcxsOp0q2UoURfV63cyazebSj3udb2a1Wk2XDAYDpWV58eKFfjo4OLAgF8lisfCrdKE7xauE4+Pj/E+613Q6DVM+xXHcaDTyiU5ms5mHLqnmuuN8Pq9Wq+GH+GQyGY/HKlM/bRPHM5lMzGw8HquG1xaoWrmBJDQPqP7j8Tg0n1QqFZWZbw5H0pvP56pDpVKRiIoiD9I09Ub3u5hZo9HIX1JS4aVi9wQ9fqaOHBwchDfNd7PZbKZ2cebzucpRra4NpPASvLaVSkV3UYcMe3LYjb2Sg8FAyYZKZCgh93o9nRlFUbvd3mbohbLVkfF4rAgz1SGsfH4MqkqDwUDV7vf7qpXq6SPIh49qG+ZRUgtm2nGxWKjMcJioVl5JnV+v1zMdPl9JF2OmV2R69Wg0WtrT8sdHo5FXQFJSUWma+nBwGWZa30qNlyXzW7/fV5l52Wo6arfb6yaoyky/XlSj0QinuKWjQ6Jw8ZbLdukM42MwkwEqL4r8ACmfMfLztu517ShO01ThU0mSFI2CfI9VfYqq3ev19JNE2u128xmvNp5+4b5wBfeb09PTcHG52+2ueOGnT5/iOC5JbhfH8adPnz59+lR0r/y8E0WRx3EfHR35hXqDOgcHB/7TycnJycmJ//Tx40cdbzab5ROEKuPlhDEHGZVXj3l1daVaLX3SUA61Wm1FGRZppZnSwgIzdbu2KKfZbOZbUI1oxW4hmUs+fvz48ePHktyEEnt4SVGF82LPtEhGvEX19EqWRI10u93yjj0cDofDoZV6yIQlhN344ODg4ODAu26+m/lVFxcXF xchange Rate Dealer 1 CNY/THB 0.22 Dealer 1 INR/THB 2.35 Dealer 2 INR/CNY 10.75 Based on only this information, the arbitrage profit available per every CNY 1 is closest to:", "opts": ["INR 0.0682", "INR 0.0064", "CNY 0.0682"], "ans": "A", "expl": "A cross-rate is the exchange rate implied by two related exchange rates, assuming that no arbitrage opportunities exist. If the actual exchange\nrate differs from the no-arbitrage exchange rate implied by the cross-rate, then an arbitrage opportunity exists. An investor can profit by\npurchasing a currency from the source where it is underpriced and simultaneously selling the same currency to the source where it is\noverpriced.\nFinding an arbitrage opportunity from cross-rates can be conceptualized as a triangle, as shown above. Potential arbitrage profits can be\nobserved by moving from one currency to another in two directions around the triangle. When moving around the triangle, one currency is\nmultiplied by the actual exchange rate to convert to another currency.\nIn this scenario, the INR/CNY rate from Dealer 2 is 10.75. Using the INR/THB and CNY/THB rates quoted by Dealer 1, Dealer 1's INR/CNY cross-\nrate is 10.6818. The arbitrage profit is the difference between buying CNY 1 for INR 10.6818 from Dealer 1 and simultaneously selling CNY 1 for\nINR 10.75 to Dealer 2. The profit is INR 10.75 − INR 10.6818 = INR 0.0682 per every CNY 1 (Choice C).\n(Choice B) 0.0064 is the potential arbitrage profit in CNY, not INR.\nThings to remember:\nIf an actual exchange rate differs from a cross-rate derived from two related exchange rates, an arbitrage opportunity becomes available by\npurchasing a currency from the underpriced source and selling the same currency to the overpriced source.\nCalculate and interpret currency cross-rates", "qhtml": "<p>A currency trader observes the following currency spot exchange rates from two dealers:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgMAAADgCAIAAAAR9 te in the other\ncurrency can be calculated. Since GBP is the base currency, rearrange the equation to isolate the base currency's risk-free rate:\n(Choice B) 2.55% results from adding the USD interest rate (1.04) to the difference between the spot rate and forward exchange rates (1.3266 −\n1.3075).\n(Choice C) 5.51% results from incorrectly using the ratio of the forward rate to the spot rate (1.3266/1.3075), instead of the spot rate to the\nforward rate, before multiplying by the USD interest rate (1.04).\nThings to remember:\nArbitrage-free pricing of forward exchange rates requires the spot/forward difference to reflect the difference in the two currencies' risk-free interest\nrates. The spot and forward exchange rates between a pair of currencies and one interest rate can be used to calculate the other interest rate.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuMAAACMCAIAAABZIjBVAAAhVklEQVR42u2d3XXiStOF2996748cwcgRHDkCpAgQESAisBUBVgRABBYRABEAESAisBwBcgT+Lvaavfq0kPix8djMfi5mYY2k7q5uSdVV1dU37+/vRgghhBDiW/J/EoEQQgghpKkIIYQQQkhTEUIIIYQ0FSGEEEIIaSpCCCGEkKYihBBCCCFNRQghhBBCmooQQgghpKkIIYQQQkhTEUIIIYQ0FSGEEEIIaSpCCCGEENJUhBBCCCFNRQghhBBCmooQQggh/kr+JxEIIcQPpaqqoij4ZxiGkokwsqkIIYRw1IWqqnq93peVWJZlFEVRFN3e3kYWt7e3aZqmaVpVlfqFrFar1Wp1c3Nz3uXj8fg7t8tWVS/EH5eANBUhhBBCfF9u3t/fJQUhhDDnGlSiKDLGFEXxBa9TGEvu7u583zfGDIfDOI55fD6fp2lqjAmCYLlcqndsoRVFcap3bLVaGWOiKPqeH0pYiZbL5eW8ft9EAopTEUKI81/iaZqWZfllnwEoIp7nQRHxPA/H8SNJEmgwURTleY4jpuY5wr9BENh3cCiKAh/4IAiazvkI8FkcLILVwAmoc5MiYhoidXBt0+ecsT6+70N6J2k/uP/eitmtQB3s+x+UAItoafupMq9Xg+PwohIw8v4IIYQQ4mp5F0IIcTpxHMdxPBwOl8slLByn3uGMC/Hefnx8bD8tCIIwDMMwtEsxxgyHQ+cT8Pz8zKs2m81ms3Em1p7nPT8/26fV2e12u93OGIOynP+178AiHJuHU0S9GiAIApT1/v4+HA7h/PI8jwaJvZLZK2ec/Pj4aBszkiRJkoRXOaWzaY+Pj85/QdqomN1TuCFP2+12R0rg+fnZbhcNHp ces in the spot rate. Since the spot rate for all major currencies except JPY is quoted\nto four decimal places (JPY is quoted to two decimal places), multiply the difference in the rates by 10,000 (100 for JPY). Multiplying 0.0116\n× 10,000 = 116.0 forward points. Another way is to simply move the decimal in the difference four places to the right.\nThings to remember:\nForward exchange rates are often quoted as forward points relative to the spot exchange rate. Forward points for all currencies except JPY are\ncalculated as (Forward rate − spot rate) × 10,000. Forward points can be positive or negative.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkQAAAA2CAIAAACp9xHuAAANV0lEQVR42u2dO3bizBaFy/e/udWZM8sj+EXWGdIIjEYgGAFoBIYRACMAjwAYgeURIEZgOeus1VlnvsFed69apQcPG9vt3l/QC9NSPU6depxTp4qLl5cXI4QQQvzJ/EciEEIIoclMCCGE0GQmhBBCaDITQgihyUwIIYTQZCaEEEJoMhNCCCE0mQkhhNBkJoQQQmgyE0IIITSZCSGEEJrMhBBCaDITQgghNJkJIYQQmsyEEEIITWZCCCH+Wv57wjtZlrU/EASBMcbzvK8hozzPUR3f998nx6IoyrKkJP9ciqLAB4guz3PUqxY8825Cfp+6l2X5pzfisazXa/Ya6HCv1/ubB1mnFwhZZkIIIUQ9Fy8vL0e/c3HR/sDDw4MxJgzDryGjKIqMMd1udzwev0+O4/H48fGRkjzKgry/v59Opx8uNFhgnU5nu93STI+iqMWsv7u7Q92/htqgIo+Pj0c14glCHgwGq9Xqk7R4FEXQQ3b/LMtgkUAOZ7JOIO0wDM837Jws7dq+8D4MBoPr6+vabrVcLo0xk8kEhmMQBBg39gqwLMvBYEAT3PO8fr+P/utUbblcTiYT2qa1WUBbkGCe51CP4XA4Go3MO7gZOfR8mXHnc46D5nXunY8lTVNjTJIkjn5Dj883vv9VoK3R7h8Ohy0M2XSulmXZ6XSoEmead5H7WRfQJ0sbXSBJEkhgsVgcOP/Zfaf6zd5pDNMJ1oimsk+EB+7u7iC0+Xwex7Ex5unpqT2XOI5RGDRlWZao1+XlJQcuZoHcm7IoyxKmAh6YTqd4MU1T6M9RDSo3oxBCCPM3BoCY4wNGbOdSv993XA20LrHq4Z657/vOk1mWOdElWCPkec453FlAIYVer8dX8IDv+8wOpcIDRVHwe5jPBy6jWIblcgmzusnpUZYlbPyyLFE8JyM7AKSaOB6AHLi1XhTF8/Mz0oS0bT8P/kUFe73euTeii6JAOX/+/PnKbXOkUytM7qvjQ5ZleADVtMMumkJ4IJkgCKpNT1nZnjE7R7xLZUYzrddrNv3hvQNFRU3ptKnVZJSHq1pa4U5FaKmz4kjzrA4u5BUEgRPw4nn ne whether a quoted rate is properly priced. One currency\nmust be common to both cross multiplied rates.\nIn this case, the AUD/CNY cross rate is calculated by taking the cross product of the HKD/AUD and HKD/CNY exchange rates. However, HKD is\nthe numerator of both rates, so to produce a rate that can be cross multiplied, the HKD/AUD rate must be inverted. This is done by using the\nreciprocal of the rate, as shown below:\nThe AUD/CNY quote is then calculated as follows:\nThis rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. In this case, any AUD/CNY exchange rate other\nthan 0.6176 would allow a trader to earn arbitrage profits by selling the relatively overvalued currency and buying the undervalued currency.\n(Choice A) 0.0215 results from failing to invert the HKD/AUD quote before multiplying it with the HKD/CNY rate.\n(Choice C) 1.6193 results from incorrectly inverting the HKD/CNY quote rather than the AUD/HKD rate. Doing so results in the CNY/AUD cross\nrate instead of the AUD/CNY rate.\nThings to remember:\nCross rates result from multiplying two exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is fairly priced.\nCalculate and interpret currency cross-rates", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWgAAAClCAIAAAD+hvBcAAAPjElEQVR42u2d0XXiyBZFi7fmf9QRICIwRGApAkMEQARABEAEmAgQESAisIjAOALkCEYTwbyP895dcklg47Hd2Oz90csthFSoSqfOvVVSNf755x8HAHAO/+ESAADCAQAIBwAgHACAcAAAwgEAgHAAAMIBAAgHACAcAIBwAAAgHACAcAAAwgEACAcAIBwAAAgHACAcAIBwAMAl88e5X2g0Glw1gJ/HWa8fxnEAwNk0eMs5ADhyHACAcAAAwgEACAcAIBwAAAgHACAcAIBwAADCAQAIBwCA+5CH3AB+I3meL5dL59x+v9eWdrvtnBuNRmEYfvbZi6JwzgVBcGyHJEmcc8/Pz9WPms2mc24wGHze2XEcAOB4yA3g3yKLEcexulzrutM01acPDw/OuSiKPqkAcRxPp9PTp4jjWIWRDyqTZZn5o8fHx3PPnqbper12zm02G4QD4K0Mh0PdfrrrPMfe6XT0xzvuybe/ieZVbZJwOOe0Z1U4tMNqtTo3ZpnP5zpC9ciEKgDgSI4CuA9Mi8po1G rkJggg=="]}, {"n": 11, "q": "A currency trader observes the following spot exchange rates involving the British pound (GBP), US dollar (USD), and Mexican peso (MXN): If the trader is quoted 27.2511 for the MXN/GBP rate, the most appropriate conclusion is that:", "opts": ["no arbitrage opportunity exists.", "the MXN is undervalued relative to the GBP.", "risk-free interest rates are higher in Mexico than in the UK."], "ans": "B", "expl": "A cross rate is an exchange rate obtained by cross-multiplying two exchange rates to derive a third rate. Cross rates are commonly used to\nderive an exchange rate for a seldom-quoted currency pair, but they can also be used to determine whether a quoted rate is properly priced. One\ncurrency must be common to both cross-multiplied rates.\nIn this question, the MXN/GBP cross rate is the cross-product of the USD/GBP and MXN/USD. The 27.2511 rate quoted to the dealer means GBP\nis overvalued: It costs more MXN to buy GBP 1 (27.2511) than indicated by the cross-rate formula shown above (26.6417). Describing GBP as\novervalued relative to MXN is the same as describing MXN as undervalued relative to GBP.\n(Choice A) When an exchange rate is mispriced, an arbitrage profit can be earned by selling the relatively overvalued currency and buying the\nrelatively undervalued currency.\n(Choice C) Risk-free interest rates are a key determinant of the difference between forward and spot exchange rates. All exchange rates in this\nquestion are spot rates, and since no information on forward rates is provided, no conclusions can be reached regarding interest rates in either\nMexico or the UK.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": "<img class=\"qfig\" src=\"data:image/png urrency quotes need to be inverted to facilitate cancelling out the intermediary currency.\nIn this scenario, EUR has appreciated by 2% against GBP and CHF has appreciated by 5% against EUR.\nSince EUR has appreciated relative to the GBP and is the base currency in the given GBP/EUR exchange rate, that rate is multiplied by\n1.02, indicating that 1 EUR now buys more GBP.\nSince CHF has appreciated relative to the EUR and is the price currency in the given CHF/EUR exchange rate, it is multiplied by (1/1.05),\nindicating that the EUR now buys fewer CHF.\nThe new CHF/GBP cross rate is:\n(Choice B) 1.2434 CHF/GBP results from dividing the original GBP/EUR exchange rate by 1.02, rather than multiplying to reflect EUR's\nappreciation against GBP.\n(Choice C) 1.3176 CHF/GBP results from multiplying the original CHF/EUR exchange rate by 1.05 rather than dividing to reflect the CHF's\nappreciation against the EUR.\nThings to remember:\nFor any three currencies, three exchange rates express the value between each possible pair. Given any two of the exchange rates, the third is\nfixed by arbitrage. This implied exchange rate is known as a cross rate, which is obtained by multiplying the two given exchange rates and\nfactoring out the currency common to both quotes.\nCalculate and interpret currency cross-rates", "qhtml": "<p>An analyst obtains the following exchange rates among EUR, GBP, and CHF:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPsAAAB/CAIAAACmMSM/AAAF1ElEQVR42u2d246sIBBFbeP//7LnYZKOp1WEulnAWo8TZRA3RQk0+7Pv+wIwDStNACgeAMUDoHgAFA+A4gFQPACKB0DxACgeQMxmXuLn8/n5y+VGhu9lhW0Ol9ecy7/kXOzfjX9/FxTiV+GAjR7HZ/croaaJBLVqLTZO8XevVt/cY+PdPpXdW1PCzwVN3cO22DjFHyt3GeE+n4/tSzUpLbIf3g07Tu0T3GNbx8+3il3NK/fz2o5/sap0wjgq7gPe7eMd4M8px/eJCjfWDxpNxQbFeNs0CzpKZgRDZVOtPBS1vjWgQ2Sm4VSCLL/Xp/iazryFafp10c/W6/TPqylh3/dLXSprdVdsXIx/MTUfppIeaeG7cs8cdLZ+5Xh3Y1Ozlv+77RvqIjrk0bFTsay5Dq4bSBfjNR9G/c5LIvR5FT/tCtRfV+x34WmZcycZb0vfdL3n9071dyp2jWyXP4bPHOr/3TCin3G3sHhL48zzkkv  forward discount.\n(Choice C) Forward points of −823 result from incorrectly subtracting the forward rate from the spot rate and then multiplying by 10,000.\nNegative forward points do indicate the price currency is trading at a forward premium, but that is not the case here.\nThings to remember:\nWhen risk-free interest rates for two countries are different, the forward rates for their currencies must be priced to prevent arbitrage profit. When\nthe forward rate is higher than the spot rate, the price currency is said to be trading at a discount. Forward points are calculated as (forward rate −\nspot rate) × 10,000.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtcAAAHGCAIAAAAwjjCpAABi5klEQVR42u29TXbjyJX+fVWVZbdP/n0S6T49qJ4IWV5AQisQuAKRKyC5AoorILkCkisg6Q0QXIHAczwXNPGwBA3bp9sJDeq4y06X3sHT+bxRAX5AFKWkpOc30JEgIBCIzxv33rhxdHd3Z0IIIYQQT843KgIhhBBCSAoRQgghhKQQIYQQQghJIUIIIYSQFCKEEEIIISlECCGEEJJChBBCCCEkhQghhBBCUogQQgghhKQQIYQQQkgKEUIIIYSQFCKEEEIISSFCCCGEkBQihBBCCCEpRAghhBCSQoQQQgghJIUIIYQQQlKIEEIIIYSkECGEEEJIChFCCCGEkBQihBBCCEkhQgghhBCSQoQQQgghKUQIIYQQkkKEEEIIISSFCCGEEEJSiBBCCCGEpBAhhBBCSAoRQgghhNgDb/aSynQ6NbObm5sqNzebzTAMVfQeeZ6b2Ww2w5+np6dmFsfx181VURRmFgSBKgikaWpmy+XyMRrzAZa217V7vR7LwS0EM1On3lCtr7MHuY3klY/85eH9q4/tL00KQeFigN7K6empBqx1zbTf7+NP/PK1Wiqqst1uTyaTQxCGDgeMqqymvTRmVH273UY5c6Y/BLyuzbwtl0u3ECSFrBQ+BoOBmWVZdnFx8To7CxvJKx/5y8O7BlWTRUYIIYQQ9gJ0IR6bpTyp9w+c0WjU7XZVDis5Pj52W/jDG3OWZScnJ1U6zqGVwx4L4UXy4cMHmNi06hXoI2wJGEbEI0ohr1P9+GK4vb1VIayj1Wrxp+3PF+Q5lsMeC8FeqEVGhSBAFEWaGU0WGSGEEELYi9eF2P19IcfjsZklSYIrcGJqtVqdTsd+rfKFsSDLMvw5HA7NrNFowP3HU35OJhP6Q8Hbn17Kw+EQ8ilIkgR5wFPIA/JDFzP7olvDW4bDoedsVavVXMn348ePNG0gzXq9bmZ5nuM6v7fVap2dne1QdN1ud11RwBOq1+vhhsFgwNeZo//v9XosNC9XvILyZ4kVRYGymk6neBduqNfr8F50iwU38O1cICIpPvIQvCYxn89xBTUeBAFW7b1eb6XtIM9zVH sitive.\nTo convert the rate to forward points, multiply the difference by 10,000.\n(Choice A) The −83 amount results from incorrectly dividing the forward points by the spot rate before multiplying by 10,000.\n(Choice C) The forward points should be negative since, in this case, forward rate < spot rate.\nThings to remember:\nA forward rate may be expressed as a number of points (ie, pips) added to the spot rate. The forward points of all currencies (except JPY) are\ncalculated as: (Forward rate − Spot rate) × 10,000. If forward rate < spot rate, the points are negative, and if forward rate > spot rate, the points\nare positive.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkQAAAA2CAIAAACp9xHuAAANV0lEQVR42u2dO3bizBaFy/e/udWZM8sj+EXWGdIIjEYgGAFoBIYRACMAjwAYgeURIEZgOeus1VlnvsFed69apQcPG9vt3l/QC9NSPU6depxTp4qLl5cXI4QQQvzJ/EciEEIIoclMCCGE0GQmhBBCaDITQgihyUwIIYTQZCaEEEJoMhNCCCE0mQkhhNBkJoQQQmgyE0IIITSZCSGEEJrMhBBCaDITQgghNJkJIYQQmsyEEEIITWZCCCH+Wv57wjtZlrU/EASBMcbzvK8hozzPUR3f998nx6IoyrKkJP9ciqLAB4guz3PUqxY8825Cfp+6l2X5pzfisazXa/Ya6HCv1/ubB1mnFwhZZkIIIUQ9Fy8vL0e/c3HR/sDDw4MxJgzDryGjKIqMMd1udzwev0+O4/H48fGRkjzKgry/v59Opx8uNFhgnU5nu93STI+iqMWsv7u7Q92/htqgIo+Pj0c14glCHgwGq9Xqk7R4FEXQQ3b/LMtgkUAOZ7JOIO0wDM837Jws7dq+8D4MBoPr6+vabrVcLo0xk8kEhmMQBBg39gqwLMvBYEAT3PO8fr+P/utUbblcTiYT2qa1WUBbkGCe51CP4XA4Go3MO7gZOfR8mXHnc46D5nXunY8lTVNjTJIkjn5Dj883vv9VoK3R7h8Ohy0M2XSulmXZ6XSoEmead5H7WRfQJ0sbXSBJEkhgsVgcOP/Zfaf6zd5pDNMJ1oimsk+EB+7u7iC0+Xwex7Ex5unpqT2XOI5RGDRlWZao1+XlJQcuZoHcm7IoyxKmAh6YTqd4MU1T6M9RDSo3oxBCCPM3BoCY4wNGbOdSv993XA20LrHq4Z657/vOk1mWOdElWCPkec453FlAIYVer8dX8IDv+8wOpcIDRVHwe5jPBy6jWIblcgmzusnpUZYlbPyyLFE8JyM7AKSaOB6AHLi1XhTF8/Mz0oS0bT8P/kUFe73euTeii6JAOX/+/PnKbXOkUytM7qvjQ5ZleADVtMMumkJ4IJkgCKpNT1nZnjE7R7xLZUYzrddrNv3hvQNFRU3ptKnVZJSHq1pa4U ltiplying two quoted exchange rates, each containing one of the currencies from the pair and a common\ncurrency (eg, USD). If the cross rate between two currencies does not equal the quoted exchange rate between them, the currencies are not\nfairly valued versus each other.\nIn this scenario, the cross rate between MXN and JPY is calculated as follows:\nSince the quoted rate is expressed as JPY/MXN, the cross rate must be inverted:\nAs expressed, JPY is the price currency and MXN is the base currency. Based on their cross rates relative to USD, it should take less JPY to buy\nMXN 1 than indicated by the current JPY/MXN spot exchange rate (5.5502). Therefore, since MXN 1 is worth more JPY 1 in the spot market than\nat the cross rate, MXN is overvalued versus JPY at the quoted exchange rate between them (Choices A and B).\nThings to remember:\nA cross rate is an implied exchange rate between two currencies obtained by multiplying the exchange rates for both currencies against a common\ncurrency. In a currency pair, the base currency is undervalued (overvalued) in the currency market if it buys fewer (more) units of the price\ncurrency at their quoted exchange rate that at the cross rate between them.\nCalculate and interpret currency cross-rates\n17. When the price currency is trading at a forward premium to the base currency, it is most likely that the:\nA. forward points are positive.\n\nB. price currency is expected to appreciate against the base currency.\nC. interest rate for the price currency is higher than for the base currency.\nExplanation\nWhen the risk-free interest rates for two countries differ, the forward exchange rate between their currencies will differ from the spot (ie, current)\nexchange rate. A foreign exchange quote specifies the amount of price currency that can be acquired for each unit of base currency. When the\nforward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base currency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base currency.\nA forward premium signals that market participants expect the price currency to appreciate relative to the base currency: in the future, one unit\nof base currency will buy less price currency than it does today since the price currency has become more valuable than the base currency. A\nforward discount signals that the price currency is expected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less than the spot rate and the forward points are\nnegative.\n(Choice C) When the price currency is trading at a forward premium, its interest rate must be less than the base currency's interest rate. The\ncurrency with the lower interest rate trades at a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the risk-free interest rates of two countries are different,\nthe forward exchange rate will differ from the spot rate. When the forward rate is lower than the spot rate, it signals that market participants expect\nthe price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": "<p>An analyst gathers the following spot exchange rate quotes:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAaMAAACjCAIAAACogOYXAAAInElEQVR42u3d27KiOhQFUKH8/1+mH6zeZYHElRsEHOOpjztcTSYJBM+0LMsD4NZmpwCQdACSDkDSAUg6AEkHIOkAJB2ApAMkHcANPCuXn6bp79/pF8s+lvz7MLjsq1hkqXSZ11/brm0lXjJyBvgpwXaRVbLfGg472DOTrtKyLK/jnKZp7zhP/yaC8Z0I00tUOAasTolatCqcW9/ia0hU8m35msIFh3CZpKts/4l8PD6yG37fwu7HY2416NlWib1RTk3L+trn6Nq0//6z0w482+76135ZWbcuPa7MPS+tLh2JFI4c1MejO7i2MZrV9/6xIm0r3l9YBGvOx6qbrrRZFbJg0F0c2Y8jn0hUNsvtVxjpGY1ZNd13o+1tkH4V7PQqeuQ spot (ie, current)\nexchange rate. A foreign exchange quote specifies the amount of price currency that can be acquired for each unit of base currency. When the\nforward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base currency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base currency.\nA forward premium signals that market participants expect the price currency to appreciate relative to the base currency: in the future, one unit\nof base currency will buy less price currency than it does today since the price currency has become more valuable than the base currency. A\nforward discount signals that the price currency is expected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less than the spot rate and the forward points are\nnegative.\n(Choice C) When the price currency is trading at a forward premium, its interest rate must be less than the base currency's interest rate. The\ncurrency with the lower interest rate trades at a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the risk-free interest rates of two countries are different,\nthe forward exchange rate will differ from the spot rate. When the forward rate is lower than the spot rate, it signals that market participants expect\nthe price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA48AAAFoCAIAAAB41VlLAABQZElEQVR42u29XW4bWZK/HWUUai6qG0oX0FczgGlvwClvgJQ2QMkbINkboDgbYHEDTXEDTXIDFrkBi9yAnVpASRQwc1VAOY2euik0Su/F7+94jzOZKX5Isj6e58KQk5knT8b5yMg4EXG+u7q6MgAAAACAe8kzRAAAAAAAaKsA d the ratio of\nthe interest rates for the respective currencies. When the forward exchange rate is lower than the spot exchange rate, the price currency\ninterest rate is lower than the base currency interest rate, and vice versa. The following formula shows this relationship:\n(Choices A and B) When the forward rate is less than the spot rate, it signals that market participants expect the price currency to appreciate\nagainst the base currency: in the future, it will take less of the price currency to buy one unit of the base currency than it does today. As a result,\nthe price currency is said to be trading at a premium to the base currency\nThings to remember:\nWhen the forward currency exchange rate is less than the spot currency exchange rate, the price currency interest rate is lower than the base\ncurrency interest rate. In addition, the price currency is trading at a forward premium. and is expected to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA48AAAFoCAIAAAB41VlLAABQZElEQVR42u29XW4bWZK/HWUUai6qG0oX0FczgGlvwClvgJQ2QMkbINkboDgbYHEDTXEDTXIDFrkBi9yAnVpASRQwc1VAOY2euik0Su/F7+94jzOZKX5Isj6e58KQk5knT8b5yMg4EXG+u7q6MgAAAACAe8kzRAAAAAAAaKsAAAAAAGirAAAAAIC2CgAAAACAtgoAAAAAaKsAAAAAAGirAAAAAABoqwAAAACAtgoAAAAAgLYKAAAAAGirAAAAAABoqwAAAAAAaKsAAAAAgLYKAAAAAIC2CgAAAABoqwAAAAAAaKsAAAAAAGirAAAAAIC2CgAAAACAtgoAAAAAaKsAAAAAAGirAAAAAABoqwAAAACAtgoAAAAAgLYKAAAAAGirAAAAAABoqwAAAAAAaKsAAAAAgLYKAAAAAIC2CgAAAABPhu8RwT0nTVMzS5Lk2jOjKDKzOI4R2lJms5kLansphaWFYldLqdXMrFarIfnHwWKxWCwW/t84jtX0TEqVSqVSqSCK2xZF0ZzzgCbeFautgebD7SmPNTBsqwAAAABw//nu6uoKKdz/D9O9vb1rz5QZ7/T0FKEt7+vffeeC2l5KYWmh2NVSbk5gfC3l559/ti+2lqOjo4dS516v5/89PT19sobzzKTU7XbVoIjiRkThoyMzNIrmnAc08a5YbUnAh9tTHmtgeAIAgN35Yrpe7fqj2+0iEwBGB4DhCQAAAAAAhm0V7oan const CFG = {"title": "Wiley · Exchange Rate Calculations", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Economics · 19 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  .qnote{margin-top:12px;border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:8px 10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{width:100%;resize:vertical;min-height:40px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
</style>
<script>
/* ===== Ghi chú cá nhân cho mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      if(card.querySelector(".qnote")) continue;
      var k = keyFor(card);
      if(k===null) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú của bạn</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.rows = 2;
      ta.setAttribute("placeholder","Viết ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      card.appendChild(wrap);
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
</body>
</html>
