<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An analyst gathers the following information related to the New Zealand dollar (NZD) and the Australian dollar (AUD): Selected Exchange Rate Information Spot exchange rate (NZD/AUD) 1.1800 Arbitrage-free one-year forward exchange rate (NZD/AUD) 1.1974 Dealer offered one-year forward exchange rate (NZD/AUD) 1.1700 New Zealand one-year interest rate 3.0% Australian one-year interest rate 1.5% Based on this information, the maximum arbitrage profits (in AUD) are closest to:", "opts": ["0.0120", "0.0238", "0.0276"], "ans": "B", "expl": "When the risk-free interest rates of two countries are different, the forward rates of their currencies must be priced to prevent arbitrage profit in an\nefficient market. The forward rate calculation is based on the spot rate, the interest rates, and the length of the forward period. In this scenario,\nsince a dealer is offering a rate of 1.1700 NZD/AUD, which differs from the arbitrage-free rate, arbitrage profits are possible.\nAccording to the arbitrage-free rate, AUD 1.000 should purchase NZD 1.1974. However, using the dealer quote, AUD 1.000 only purchases NZD\n1.1700. Therefore, in the market, the AUD is underpriced and the NZD is overpriced.\nArbitrage profits can be earned by committing today to sell (ie, deliver) the overpriced NZD and to buy (ie, take delivery of) the underpriced AUD\nthrough a forward exchange rate contract. One of the key elements of arbitrage is that investors do not risk their own funds, but instead borrow to\ninitiate the transaction. In this scenario, the first step is to borrow AUD to obtain the NZD, which will be invested and eventually delivered under\nthe forward contract. The complete steps to exploit this opportunity are as follows:\n(Choice A) 0.0120 represents the difference between the arbitrage-free forward exchange rate and the market rate, or 1/1.1700 − 1/1.1974\n(quotes are inverted to obtain the AUD result).\n(Choice C) 0.0276 represents the loss that would be incurred by entering into a forward contract to sell the AUD (ie, underpriced asset) and buy\nthe NZD (ie, overpriced asset). This transaction is unlikely since it would lock in a loss.\nThings to remember:\nArbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower price\nin a different market. If the arbitrage-free forward rate differs from the market rate, an arbitrage opportunity exists.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 2, "q": "If spot exchange rate quotes are 0.1427 CAD/SEK and 0.1366 CAD/NOK, the no-arbitrage SEK/NOK spot rate is closest to:", "opts": ["0.0195", "0.9573", "1.0447"], "ans": "B", "expl": "A cross exchange rate can be derived by cross multiplying two other rates. Cross rates are commonly used to derive an exchange rate for a\nseldom-quoted currency pair, but they can also be used to determine whether a quoted rate is fairly priced. One currency must be common to\nboth cross-multiplied rates.\nIn this scenario, the SEK/NOK cross rate is calculated by cross multiplying the CAD/SEK and CAD/NOK exchange rates. Since both quotes have\nCAD in the numerator, the steps to calculate the cross rate are as follows:\nThis cross rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. Here, any SEK/NOK exchange rate\nother than 0.9573 would allow an investor to earn arbitrage profits by selling the relatively overvalued currency and buying the relatively\nundervalued currency.\n(Choice A) 0.0195 results from failing to invert the CAD/SEK quote before multiplying it by the CAD/NOK rate.\n(Choice C) 1.0447 results from incorrectly inverting the CAD/NOK quote rather than the CAD/SEK rate. Doing so results in the NOK/SEK cross\nrate instead of the SEK/NOK rate.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 3, "q": "A GBP/USD forward exchange rate quoted at positive forward points most likely indicates that GBP:", "opts": ["is expected to appreciate against USD.", "is trading at a forward discount relative to USD.", "has an interest rate that is lower than the USD interest rate."], "ans": "B", "expl": "A forward exchange rate is the amount of one currency that can be exchanged for one unit of another currency in the future; this rate can be\nquoted by forward points. The forward exchange rate is determined by adding the quoted number of positive or negative forward points, also\nknown as pips, to the price currency in the spot rate quote.\nIf there are:\nPositive forward points, then the specified number of pips is added to the spot rate to determine the forward exchange rate. In this\nscenario, it takes more GBP (ie, price currency) to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth\nless relative to the USD in the forward market, so the GBP is trading at a forward discount.\nNegative forward points, then the specified number of pips is subtracted from the spot rate to determine the forward exchange rate. In that\ncase, it takes fewer GBP to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth more relative to the USD in\nthe forward market, so the GBP is trading at a forward premium.\n(Choice A) The positive points signal that it will take a greater amount of GBP to buy USD 1 at the forward rate than at the spot rate and that\nmarket participants expect the GBP to depreciate against the USD.\n(Choice C) A forward exchange rate greater than the spot rate indicates that the price currency interest rate is greater than the base currency\ninterest rate.\nThings to remember:\nForward discounts or premiums refer to the value of a currency at the forward versus the spot exchange rate. Positive forward points indicate it\ntakes more of the price currency to buy one unit of the base currency at the forward rate (ie, in the future) and the price currency is trading at a\nforward discount.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 4, "q": "A currency trader observes the following currency spot exchange rates from two dealers: Source Currency Exchange Rate Dealer 1 CNY/THB 0.22 Dealer 1 INR/THB 2.35 Dealer 2 INR/CNY 10.75 Based on only this information, the arbitrage profit available per every CNY 1 is closest to: ", "opts": ["INR 0.0682", "INR 0.0064", "CNY 0.0682"], "ans": "A", "expl": "A cross-rate is the exchange rate implied by two related exchange rates, assuming that no arbitrage opportunities exist. If the actual exchange\nrate differs from the no-arbitrage exchange rate implied by the cross-rate, then an arbitrage opportunity exists. An investor can profit by\npurchasing a currency from the source where it is underpriced and simultaneously selling the same currency to the source where it is\noverpriced.\nFinding an arbitrage opportunity from cross-rates can be conceptualized as a triangle, as shown above. Potential arbitrage profits can be\nobserved by moving from one currency to another in two directions around the triangle. When moving around the triangle, one currency is\nmultiplied by the actual exchange rate to convert to another currency.\nIn this scenario, the INR/CNY rate from Dealer 2 is 10.75. Using the INR/THB and CNY/THB rates quoted by Dealer 1, Dealer 1's INR/CNY cross-\nrate is 10.6818. The arbitrage profit is the difference between buying CNY 1 for INR 10.6818 from Dealer 1 and simultaneously selling CNY 1 for\nINR 10.75 to Dealer 2. The profit is INR 10.75 − INR 10.6818 = INR 0.0682 per every CNY 1 (Choice C).\n(Choice B) 0.0064 is the potential arbitrage profit in CNY, not INR.\nThings to remember:\nIf an actual exchange rate differs from a cross-rate derived from two related exchange rates, an arbitrage opportunity becomes available by\npurchasing a currency from the underpriced source and selling the same currency to the overpriced source.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 5, "q": "The EUR/GBP spot exchange rate is 1.1650. The EUR one-year interest rate is 0.25%, and the GBP one-year interest rate is 1.50%. The one- year forward exchange rate expressed in forward points is closest to: ", "opts": ["−143", "−115", "145"], "ans": "A", "expl": "Exchange rate quotes specify the amount of one currency to be traded for one unit of another currency. The value is expressed in units of the\nprice currency per one unit of the base currency. If the EUR/GBP exchange rate is quoted at 1.1650, it costs 1.1650 EUR (the price currency) to\npurchase one GBP (the base currency).\nThe spot exchange rate is the value at which one currency can be traded for another today. The forward exchange rate is the current quotation\nfor the value at which one currency can be exchanged for another in the future. The difference between the spot and forward exchange rates is\ndetermined by the relative level of risk-free interest rates in the two currencies.\nGiven the spot rate and one-year interest rates in the two currencies, the one-year forward rate can be calculated. The forward points equal\nforward exchange rate minus the spot exchange rate, with the difference multiplied by 10,000 (unless the JPY is one of the currency pair, in which\ncase the multiplier is 100).\n(Choice B) −115 is the negative of the one-year forward exchange rate.\n(Choice C) 145 is the result if the EUR and GBP interest rates are inverted in the forward exchange rate calculation.\nThings to remember:\nTo determine forward points, the spot exchange rate is subtracted from the forward exchange rate, and the difference is multiplied by 10,000\nunless JPY is involved causing the multiplier to be 100.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 6, "q": "An analyst observes the following exchange rate data: Selected foreign exchange rate quotes Source Currencies Spot rate Market JPY/EUR 115.85 Market JPY/USD 106.60 Dealer EUR/USD 0.9050 Based only on this information, the arbitrage profit (in USD) available for each USD 1.000 invested is closest to:", "opts": ["0", "0.0152", "0.0168"], "ans": "C", "expl": "Arbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower\nprice in a different market. For this question, the first step is to identify any mispricing between the market and dealer quotes.\nTo compare the dealer quote of 0.0950 EUR/USD to a similar market quote, first calculate the market available EUR/USD cross-rate. Since both\nmarket quotes have JPY in the numerator, the steps to calculate the no-arbitrage market rate are as follows:\nThere is an arbitrage opportunity since the no-arbitrage rate of 0.9202 EUR/USD differs from the dealer-offered rate of 0.9050 EUR/USD\n(Choice A). The steps to exploit the arbitrage are as follows:\nPlease note that the calculations shown above are rounded to four decimals. The approximate answer will result from using the entire numbers\ngenerated from the calculations. Users who calculate subsequent steps using only the numbers shown in the preceding step(s) will obtain an\nincorrect answer.\n(Choice B) 0.0152 is the profit per EUR converted at the rate of 0.09050 EUR/USD.\nThings to remember:\nArbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset a lower price in a\ndifferent market.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 7, "q": "The USD/GBP spot rate is 1.3075, and the one-year USD/GBP forward rate is 1.3266. If the one-year USD risk-free interest rate is 4.00%, then the one-year GBP risk-free interest rate is closest to: ", "opts": ["2.50%", "2.55%", "5.51%"], "ans": "A", "expl": "Arbitrage-free pricing of forward exchange rates requires the spot/forward difference to reflect the difference in the currencies' risk-free\ninterest rates. This reflects the difference over the term to the forward date between:\nthe interest income earned on the currency purchased, and\nthe interest expense (if borrowed) or opportunity cost on the currency sold in the spot market.\nGiven the forward and spot exchange rates between a pair of currencies and the interest rate in one of them, the risk-free rate in the other\ncurrency can be calculated. Since GBP is the base currency, rearrange the equation to isolate the base currency's risk-free rate:\n(Choice B) 2.55% results from adding the USD interest rate (1.04) to the difference between the spot rate and forward exchange rates (1.3266 −\n1.3075).\n(Choice C) 5.51% results from incorrectly using the ratio of the forward rate to the spot rate (1.3266/1.3075), instead of the spot rate to the\nforward rate, before multiplying by the USD interest rate (1.04).\nThings to remember:\nArbitrage-free pricing of forward exchange rates requires the spot/forward difference to reflect the difference in the two currencies' risk-free interest\nrates. The spot and forward exchange rates between a pair of currencies and one interest rate can be used to calculate the other interest rate.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 8, "q": "A foreign exchange dealer observes that the USD/EUR spot rate is 1.1733, and the two-month forward rate is 1.1849. Based on this information, the two-month forward points are closest to:", "opts": ["0.0116", "1.1600", "116.0000"], "ans": "C", "expl": "Forward exchange rates are currency exchange rates for transactions occurring in the future. In this question, the two-month USD/EUR\nforward rate of 1.1849 means that two months from today, one party will pay $1.1849 in exchange for €1. The convention in the foreign exchange\nmarket is to express the forward rate in terms of the number of points, or pips, between the forward rate and the spot rate.\nForward points are calculated in a two-step process:\nFirst, calculate the difference between the two rates. The spot rate is always subtracted from the forward rate, so the difference can be\neither positive or negative. In this question, the difference is 1.1849 − 1.1733 = USD/EUR 0.0116.\nNext, scale the difference by the number of decimal places in the spot rate. Since the spot rate for all major currencies except JPY is quoted\nto four decimal places (JPY is quoted to two decimal places), multiply the difference in the rates by 10,000 (100 for JPY). Multiplying 0.0116\n× 10,000 = 116.0 forward points. Another way is to simply move the decimal in the difference four places to the right.\nThings to remember:\nForward exchange rates are often quoted as forward points relative to the spot exchange rate. Forward points for all currencies except JPY are\ncalculated as (Forward rate − spot rate) × 10,000. Forward points can be positive or negative.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 9, "q": "A currency trader observes the following spot rates involving the Chinese yuan (CNY), Hong Kong dollar (HKD), and Australian dollar (AUD): The no-arbitrage AUD/CNY spot rate is closest to:", "opts": ["0.0215", "0.6176", "1.6193"], "ans": "B", "expl": "A cross rate is an exchange rate that cross multiplies two exchange rates to derive a third rate. Cross rates are commonly used to derive an\nexchange rate for a seldom-quoted currency pair, but they can also be used to determine whether a quoted rate is properly priced. One currency\nmust be common to both cross multiplied rates.\nIn this case, the AUD/CNY cross rate is calculated by taking the cross product of the HKD/AUD and HKD/CNY exchange rates. However, HKD is\nthe numerator of both rates, so to produce a rate that can be cross multiplied, the HKD/AUD rate must be inverted. This is done by using the\nreciprocal of the rate, as shown below:\nThe AUD/CNY quote is then calculated as follows:\nThis rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. In this case, any AUD/CNY exchange rate other\nthan 0.6176 would allow a trader to earn arbitrage profits by selling the relatively overvalued currency and buying the undervalued currency.\n(Choice A) 0.0215 results from failing to invert the HKD/AUD quote before multiplying it with the HKD/CNY rate.\n(Choice C) 1.6193 results from incorrectly inverting the HKD/CNY quote rather than the AUD/HKD rate. Doing so results in the CNY/AUD cross\nrate instead of the AUD/CNY rate.\nThings to remember:\nCross rates result from multiplying two exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is fairly priced.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 10, "q": "The SGD/USD spot rate is 1.4148, and the three-month forward rate is 1.4431. Based on this information, the three-month forward points, expressed as a percentage, are closest to:", "opts": ["1.96", "2.00", "2.83"], "ans": "B", "expl": "Forward exchange rates are currency exchange rates for transactions being entered into today that will actually occur in the future. In this\nscenario, the three-month SGD/USD forward rate of 1.4431 means that three months from today, one party will pay SGD 1.4431 in exchange for\nUSD 1.0000.\nThe convention in the foreign exchange market is to express the forward rate in terms of the number of points, or pips, between the forward rate\nand the spot rate, or as a percentage of the spot rate. Forward points as a percentage of the spot rate, in this scenario, are calculated as follows:\n(Choice A) 1.96 results from dividing by the forward rate, not the spot rate.\n(Choice C) 2.83 results from subtracting the spot rate from the forward rate (1.4431 − 1.4148) and then multiplying by 100.\nThings to remember:\nForward exchange rates are quoted as forward points relative to the spot exchange rate or as a percentage of the spot exchange rate. Forward\npoints expressed as a percentage are equal to subtracting 1 from the ratio of the forward rate to the spot rate, and then multiplying by 100.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 11, "q": "A currency trader observes the following spot exchange rates involving the British pound (GBP), US dollar (USD), and Mexican peso (MXN): If the trader is quoted 27.2511 for the MXN/GBP rate, the most appropriate conclusion is that:", "opts": ["no arbitrage opportunity exists.", "the MXN is undervalued relative to the GBP.", "risk-free interest rates are higher in Mexico than in the UK."], "ans": "B", "expl": "A cross rate is an exchange rate obtained by cross-multiplying two exchange rates to derive a third rate. Cross rates are commonly used to\nderive an exchange rate for a seldom-quoted currency pair, but they can also be used to determine whether a quoted rate is properly priced. One\ncurrency must be common to both cross-multiplied rates.\nIn this question, the MXN/GBP cross rate is the cross-product of the USD/GBP and MXN/USD. The 27.2511 rate quoted to the dealer means GBP\nis overvalued: It costs more MXN to buy GBP 1 (27.2511) than indicated by the cross-rate formula shown above (26.6417). Describing GBP as\novervalued relative to MXN is the same as describing MXN as undervalued relative to GBP.\n(Choice A) When an exchange rate is mispriced, an arbitrage profit can be earned by selling the relatively overvalued currency and buying the\nrelatively undervalued currency.\n(Choice C) Risk-free interest rates are a key determinant of the difference between forward and spot exchange rates. All exchange rates in this\nquestion are spot rates, and since no information on forward rates is provided, no conclusions can be reached regarding interest rates in either\nMexico or the UK.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 12, "q": "An analyst obtains the following exchange rates among EUR, GBP, and CHF: CHF/EUR 1.1010 GBP/EUR 0.8602 CHF/GBP 1.2799 If CHF appreciates by 5% versus EUR and EUR appreciates by 2% versus GBP, the no-arbitrage CHF/GBP rate would be closest to:", "opts": ["1.1951", "1.2434", "1.3176"], "ans": "A", "expl": "Among any three currencies (eg, EUR, CHF, and GBP), three exchange rates express the value between each possible pair (ie, CHF/EUR,\nGBP/EUR, and CHF/GBP). Given any two of the three exchange rates, the third is effectively fixed by arbitrage. This implied exchange rate is\nknown as a cross rate, which is obtained by multiplying the two given rates and factoring out the currency common to both quotes. In some\ncases, currency quotes need to be inverted to facilitate cancelling out the intermediary currency.\nIn this scenario, EUR has appreciated by 2% against GBP and CHF has appreciated by 5% against EUR.\nSince EUR has appreciated relative to the GBP and is the base currency in the given GBP/EUR exchange rate, that rate is multiplied by\n1.02, indicating that 1 EUR now buys more GBP.\nSince CHF has appreciated relative to the EUR and is the price currency in the given CHF/EUR exchange rate, it is multiplied by (1/1.05),\nindicating that the EUR now buys fewer CHF.\nThe new CHF/GBP cross rate is:\n(Choice B) 1.2434 CHF/GBP results from dividing the original GBP/EUR exchange rate by 1.02, rather than multiplying to reflect EUR's\nappreciation against GBP.\n(Choice C) 1.3176 CHF/GBP results from multiplying the original CHF/EUR exchange rate by 1.05 rather than dividing to reflect the CHF's\nappreciation against the EUR.\nThings to remember:\nFor any three currencies, three exchange rates express the value between each possible pair. Given any two of the exchange rates, the third is\nfixed by arbitrage. This implied exchange rate is known as a cross rate, which is obtained by multiplying the two given exchange rates and\nfactoring out the currency common to both quotes.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 13, "q": "Which of the following conditions is most likely if the base currency interest rate is lower than the price currency interest rate?", "opts": ["The forward points are positive.", "The price currency trades at a forward premium.", "The base currency inflation is greater than price currency inflation."], "ans": "A", "expl": "Foreign exchange quotes specify an amount of price currency per unit of base currency. Spot exchange rates are values at which currencies can\nbe exchanged today. Forward exchange rates are current quotes for future exchanges.\nTo find the forward points, subtract the spot rate from the forward rate and multiply the difference by the appropriate multiplier either 100 or\n10,000. The forward points are positive when the forward rate is greater than the spot rate. The relationship between interest rates, exchange\nrates, and forward points is shown below:\n(Choice B) Forward premium refers to a currency with a higher value in the forward market than in the spot market. The currency with the lower\ninterest rate, the base currency in this question, would trade at a forward premium.\n(Choice C) Inflation expectations impact interest rates, but inflation is not a direct input in determining the difference between the spot and\nforward rates.\nThings to remember:\nIf the base currency interest rate is lower than the price currency interest rate, the forward exchange rate is greater than the spot rate and the\nforward points are positive.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 14, "q": "The spot rate is 5.5945 BRL/USD when the one-year, risk-free interest rates are 3.5% in Brazil and 2.0% in the US. Based on the arbitrage- free BRL/USD forward rate, the BRL is most likely trading at a: ", "opts": ["discount to the USD and the forward points are 823.", "discount to the USD and the forward points are 811.", "premium to the USD and the forward points are −823."], "ans": "A", "expl": "When risk-free interest rates for two countries are different, the forward rates for their currencies must be priced to prevent arbitrage profit. The\nconvention in the foreign exchange market is to express the forward rate in terms of the number of points, or pips, between the forward rate and\nthe spot rate quotes.\nThe BRL/USD no-arbitrage forward rate and the forward points for this question are calculated using the formulas above:\nWhen the forward rate (expressed as price currency per unit of the base currency) is higher than the spot rate, the forward points are positive,\nand the price currency (BRL) is said to be trading at a forward discount to the base currency (USD). A forward discount indicates that the\nprice currency is expected to depreciate relative to the base currency, such that it will take more units of the price currency to buy one unit of the\nbase currency.\n(Choice B) Forward points of 811 result from switching the numerator and denominator in the forward rate formula. While the points are\nincorrectly calculated, positive points do indicate the price currency is trading at a forward discount.\n(Choice C) Forward points of −823 result from incorrectly subtracting the forward rate from the spot rate and then multiplying by 10,000.\nNegative forward points do indicate the price currency is trading at a forward premium, but that is not the case here.\nThings to remember:\nWhen risk-free interest rates for two countries are different, the forward rates for their currencies must be priced to prevent arbitrage profit. When\nthe forward rate is higher than the spot rate, the price currency is said to be trading at a discount. Forward points are calculated as (forward rate −\nspot rate) × 10,000.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 15, "q": "The CAD/USD spot rate is 0.7191 and the one-month forward rate is 0.7131. Based on this information, the one-month forward points are closest to:", "opts": ["−83", "−60", "60"], "ans": "B", "expl": "Forward exchange rates are currency exchange rates for transactions that will occur in the future. In this question, the one-month CAD/USD\nforward rate of 0.7131 indicates that one month from today, one party will pay CAD 0.7131 in exchange for USD 1.0000. Except for the Japanese\nyen (JPY), the spot rate of all major currencies is quoted to 4 decimal places (ie, ten-thousandth of a percent).\nThe convention in the foreign exchange market is to express the forward rate as a number of points (ie, pips) added to the spot rate. In this\nquestion:\nForward points = (0.7131 − 0.7191) × 10,000\n= −0.0060 × 10,000 = −60 points\nNote that the spot rate is subtracted from the forward rate to find the difference between them; therefore:\nif forward rate < spot rate, the points are negative, and\nif forward rate > spot rate, the points are positive.\nTo convert the rate to forward points, multiply the difference by 10,000.\n(Choice A) The −83 amount results from incorrectly dividing the forward points by the spot rate before multiplying by 10,000.\n(Choice C) The forward points should be negative since, in this case, forward rate < spot rate.\nThings to remember:\nA forward rate may be expressed as a number of points (ie, pips) added to the spot rate. The forward points of all currencies (except JPY) are\ncalculated as: (Forward rate − Spot rate) × 10,000. If forward rate < spot rate, the points are negative, and if forward rate > spot rate, the points\nare positive.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 16, "q": "An analyst gathers the following spot exchange rate quotes: MXN/USD 20.6558 USD/JPY 0.008770 JPY/MXN 5.5502 The analyst's most appropriate conclusion is that the MXN is:", "opts": ["undervalued versus JPY.", "fairly valued versus JPY.", "overvalued versus JPY."], "ans": "C", "expl": "A cross rate is an implied exchange rate between two currencies that is derived from quoted exchange rates. The cross rate for any pair of\ncurrencies is obtained by multiplying two quoted exchange rates, each containing one of the currencies from the pair and a common\ncurrency (eg, USD). If the cross rate between two currencies does not equal the quoted exchange rate between them, the currencies are not\nfairly valued versus each other.\nIn this scenario, the cross rate between MXN and JPY is calculated as follows:\nSince the quoted rate is expressed as JPY/MXN, the cross rate must be inverted:\nAs expressed, JPY is the price currency and MXN is the base currency. Based on their cross rates relative to USD, it should take less JPY to buy\nMXN 1 than indicated by the current JPY/MXN spot exchange rate (5.5502). Therefore, since MXN 1 is worth more JPY 1 in the spot market than\nat the cross rate, MXN is overvalued versus JPY at the quoted exchange rate between them (Choices A and B).\nThings to remember:\nA cross rate is an implied exchange rate between two currencies obtained by multiplying the exchange rates for both currencies against a common\ncurrency. In a currency pair, the base currency is undervalued (overvalued) in the currency market if it buys fewer (more) units of the price\ncurrency at their quoted exchange rate that at the cross rate between them.\nCalculate and interpret currency cross-rates\n17. When the price currency is trading at a forward premium to the base currency, it is most likely that the:\nA. forward points are positive.\n\nB. price currency is expected to appreciate against the base currency.\nC. interest rate for the price currency is higher than for the base currency.\nExplanation\nWhen the risk-free interest rates for two countries differ, the forward exchange rate between their currencies will differ from the spot (ie, current)\nexchange rate. A foreign exchange quote specifies the amount of price currency that can be acquired for each unit of base currency. When the\nforward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base currency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base currency.\nA forward premium signals that market participants expect the price currency to appreciate relative to the base currency: in the future, one unit\nof base currency will buy less price currency than it does today since the price currency has become more valuable than the base currency. A\nforward discount signals that the price currency is expected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less than the spot rate and the forward points are\nnegative.\n(Choice C) When the price currency is trading at a forward premium, its interest rate must be less than the base currency's interest rate. The\ncurrency with the lower interest rate trades at a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the risk-free interest rates of two countries are different,\nthe forward exchange rate will differ from the spot rate. When the forward rate is lower than the spot rate, it signals that market participants expect\nthe price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 17, "q": "When the price currency is trading at a forward premium to the base currency, it is most likely that the:", "opts": ["forward points are positive.", "price currency is expected to appreciate against the base currency.", "interest rate for the price currency is higher than for the base currency."], "ans": "B", "expl": "When the risk-free interest rates for two countries differ, the forward exchange rate between their currencies will differ from the spot (ie, current)\nexchange rate. A foreign exchange quote specifies the amount of price currency that can be acquired for each unit of base currency. When the\nforward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base currency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base currency.\nA forward premium signals that market participants expect the price currency to appreciate relative to the base currency: in the future, one unit\nof base currency will buy less price currency than it does today since the price currency has become more valuable than the base currency. A\nforward discount signals that the price currency is expected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less than the spot rate and the forward points are\nnegative.\n(Choice C) When the price currency is trading at a forward premium, its interest rate must be less than the base currency's interest rate. The\ncurrency with the lower interest rate trades at a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the risk-free interest rates of two countries are different,\nthe forward exchange rate will differ from the spot rate. When the forward rate is lower than the spot rate, it signals that market participants expect\nthe price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 18, "q": "When the arbitrage-free forward exchange rate is trading lower than the corresponding spot rate, the price currency most likely:", "opts": ["is trading at a discount to the base currency.", "is expected to depreciate against the base currency.", "has an interest rate that is lower than the base currency interest rate."], "ans": "C", "expl": "Forward exchange rates are currency exchange rates for transactions that will occur in the future. The price currency is the currency in the\nnumerator, and the base currency is in the denominator.\nThe arbitrage-free forward rate is calculated as the product of the spot rate (expressed as price currency per unit of base currency) and the ratio of\nthe interest rates for the respective currencies. When the forward exchange rate is lower than the spot exchange rate, the price currency\ninterest rate is lower than the base currency interest rate, and vice versa. The following formula shows this relationship:\n(Choices A and B) When the forward rate is less than the spot rate, it signals that market participants expect the price currency to appreciate\nagainst the base currency: in the future, it will take less of the price currency to buy one unit of the base currency than it does today. As a result,\nthe price currency is said to be trading at a premium to the base currency\nThings to remember:\nWhen the forward currency exchange rate is less than the spot currency exchange rate, the price currency interest rate is lower than the base\ncurrency interest rate. In addition, the price currency is trading at a forward premium. and is expected to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 19, "q": "The current spot rate between the Russian ruble and Chinese yuan is 10.5000 RUB/CNY. The Russian annual interest rate is at 7.0% and the Chinese annual interest rate is at 4.0%. The following one-year forward exchange rate quotes are available from foreign exchange dealers: Available dealer quotes (RUB/CNY) Dealer 1 10.8029 Dealer 2 10.9100 An arbitrage opportunity is most likely offered by:", "opts": ["Dealer 1 only.", "Dealer 2 only.", "both Dealer 1 and Dealer 2."], "ans": "B", "expl": "Arbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower\nprice in a different market. The arbitrage-free forward rate is the rate that prevents arbitrage profit. For this question, the first step is to calculate\nthe arbitrage-free rate, and then determine if either of the dealer quotes are priced to allow arbitrage.\nThe spot exchange rate shows RUB as the price currency and CNY as the base currency. Using the formula shown above, the arbitrage-free one-\nyear forward rate (in RUB/CNY) is:\n1 + 0.07\n= 10.5000 ×\nArbitrage-free forward rate\n1 + 0.04\n= 10.8029\nSince Dealer 2's quote of 10.9100 RUB/CNY is different from this arbitrage-free rate, an investor can earn arbitrage profits using the quote.\nThere is no arbitrage opportunity with the quote from Dealer 1 since that quote equals the arbitrage-free rate (Choices A and C).\nThings to remember:\nArbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower price\nin a different market. The arbitrage-free forward rate can be used to determine if an arbitrage opportunity exists.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}];

const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
