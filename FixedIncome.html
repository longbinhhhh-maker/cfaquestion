<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"If an issuer is required to retire a specified portion of the bond's principal each year, the\nbond most likely.","opts":["is callable.","is a step-up note.","has a sinking fund provision."],"ans":"C","expl":"A. Không chính xác vì trái phiếu hiện có thể thu hồi được có thể bị nhà phát hành thu hồi, nhưng\nnhà phát hành không bắt buộc phải thực hiện 50.\nB. Không chính xác vì phiếu tăng giá có lãi suất phiếu giảm giá tăng dần theo thời gian theo\nmột lịch trình định trước.\nC. Đúng vì Việc cung cấp quỹ chìm yêu cầu rút lại một phần tiền gốc của trái phiếu\nhàng năm, thay vì rút toàn bộ khoản phát hành khi đáo hạn.\nThu nhập cố định: mô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và\ncác điều khoản dự phòng về dòng tiền tương phản có lợi cho người phát hành và nhà đầu tư","qhtml":null},{"n":2,"q":"A five-year semiannual bond has a yield to maturity of 8%. Converted to a quarterly\nperiodicity, the yield to maturity is closest to:","opts":["1.98%","3.92%","7.92%."],"ans":"C","expl":"A. Không chính xác vì Lợi suất đến ngày đáo hạn được chuyển đổi sang cơ sở hàng quý vẫn phải được thể hiện bằng thuật ngữ gộp hàng năm. Công thức chuyển đổi từ m kỳ sang n kỳ trong năm là (1 + APR_m/m)^m = (1 + APR_n/n)^n. Ở đây (1 + 0,08/2)^2 = (1 + APR_4/4)^4 mang lại APR_4/4 = 1,98%, là tỷ lệ hàng quý, không phải APR hàng năm.\nB. Không chính xác vì Bạn không thể chuyển đổi lợi nhuận bằng cách lấy (1 + APR_2)^(1/2) - 1 = 1,08^(1/2) - 1 = 3,92%. Mối quan hệ đúng là (1 + APR_m/m)^m = (1 + APR_n/n)^n.\nC. Đúng vì Đặt tỷ lệ hiệu dụng hàng năm bằng nhau: (1 + APR_2/2)^2 = (1 + APR_4/4)^4. Với APR_2 = 8%, (1 + 0,08/2)^2 = (1 + APR_4/4)^4, do đó APR_4/4 = 1,98% và APR_4 = 4 x 1,98% = 7,92%.\nThu nhập cố định: tính lãi suất hàng năm trên trái phiếu cho các giai đoạn gộp khác nhau trong một năm","qhtml":null},{"n":3,"q":"The key rate duration best measures a bond's sensitivity to a change in the:","opts":["level of the yield-to-maturity.","slope of the yield-to-worst curve.","shape of the benchmark yield curve."],"ans":"C","expl":"A. Không chính xác vì Phần này mô tả thời hạn được sửa đổi, ước tính phần trăm thay đổi giá của trái phiếu khi có sự thay đổi về lợi suất đến ngày đáo hạn của nó.\nB. Không chính xác vì Thời lượng không được đo lường dựa trên lợi nhuận đến mức tệ nhất (mức thấp nhất của lợi nhuận đến ngày đáo hạn, lợi nhuận cho cuộc gọi đầu tiên, lợi nhuận đến cuộc gọi thứ hai, v.v.).\nC. Đúng vì Thời hạn lãi suất chính (một phần) đo lường độ nhạy cảm của trái phiếu đối với sự thay đổi của đường cong lợi suất chuẩn tại một điểm đáo hạn cụ thể. Không giống như thời hạn hiệu dụng, thời hạn lãi suất chính giúp xác định 'rủi ro định hình' - độ nhạy của trái phiếu đối với những thay đổi về hình dạng của đường cong lãi suất chuẩn (ví dụ: đường cong trở nên dốc hơn hoặc phẳng hơn).\nThu nhập cố định: xác định thời hạn lãi suất chính và mô tả cách sử dụng nó để đo lường độ nhạy cảm về giá của các công cụ thu nhập cố định đối với những thay đổi của đường cong lãi suất chuẩn","qhtml":null},{"n":4,"q":"A bond priced at 99.4 has a modified duration of 6.9 and an annual convexity statistic of -\n212. If the market yield increases by 75 basis points, the price of this bond is closest to","opts":["93.7.","94.3.","94.9."],"ans":"A","expl":"A. Đúng vì %ΔPV_Full = (-AnnModDur x ΔYield) + [0,5 x AnnConvexity x (ΔYield)^2] = (-6,9 x 0,0075) + (0,5 x -212 x 0,0075^2) = -0,05175 - 0,0059625 = -0,0577125, hoặc -5,77%. Thay đổi giá = -0,0577125 x 99,4 = -5,7366, do đó giá mới = 99,4 - 5,7366 = 93,66, gần nhất với 93,7.\nB. Không chính xác vì 94,3 là kết quả của việc áp dụng thay đổi giá thành mệnh giá (100) thay vì 99,4: 100 - 5,74 = 94,26.\nC. Không chính xác vì 94,9 là kết quả của việc nhập điều chỉnh độ lồi dưới dạng số dương: (-6,9 x 0,0075) + (0,5 x 212 x 0,0075^2) = -0,04579, hoặc -4,58%; 99,4 - (0,04579 x 99,4) = 94,85.\nThu nhập cố định: tính phần trăm thay đổi giá của trái phiếu đối với một thay đổi cụ thể về lợi suất, với thời hạn và độ lồi của trái phiếu","qhtml":null},{"n":5,"q":"If interest rates rise over the holding period, the total return of a coupon bond held until\nmaturity is most likely to be:","opts":["less than the yield to maturity at purchase.","equal to the yield to maturity at purchase.","greater than the yield to maturity at purchase."],"ans":"C","expl":"A. Không chính xác vì nhà đầu tư mua và nắm giữ có tổng lợi nhuận cao hơn nếu lãi suất tăng\ndo số tiền thu được từ tái đầu tư phiếu giảm giá vượt quá dự kiến. Nếu lãi suất giảm, nhà đầu tư mua\nvà giữ sẽ nhận ra rằng không có lợi nhuận theo giá thị trường khi anh ta được mua lại bằng mệnh giá khi đến hạn.\nB. Không chính xác vì nhà đầu tư mua và nắm giữ có tổng lợi nhuận cao hơn nếu lãi suất tăng\ndo số tiền thu được từ tái đầu tư phiếu giảm giá vượt quá dự kiến. Nếu lãi suất giảm, nhà đầu tư mua\nvà-giữ sẽ nhận ra rằng không có lợi nhuận theo giá thị trường khi anh ta được mua lại bằng mệnh giá khi đáo hạn. Sự lựa chọn\nnày có thể hấp dẫn đối với những ứng viên thiếu hiểu biết, những người tập trung vào nhà đầu tư mua và nắm giữ\nvà không có bất kỳ thay đổi lãi suất thị trường nào.\nC. Đúng vì nhà đầu tư dài hạn phải đối mặt với rủi ro tái đầu tư lãi suất cũng như rủi ro về giá thị trường nếu trái phiếu cần được bán trước khi đáo hạn. Một nhà đầu tư [mua và giữ] [trong trái phiếu 10\nnăm) với thời hạn 10 năm chỉ quan tâm đến rủi ro tái đầu tư phiếu lãi.\nTất nhiên, tình huống này giả định rằng nhà phát hành thực hiện tất cả các khoản thanh toán phiếu lãi và tiền gốc\ntheo đúng lịch trình. Nhà đầu tư mua và giữ có tổng lợi nhuận cao hơn nếu lãi suất\ntăng và tổng lợi nhuận thấp hơn nếu lãi suất giảm\nThu nhập cố định: mô tả mối quan hệ giữa lợi nhuận trong thời gian nắm giữ trái phiếu,\nthời hạn ở Macaulay và thời hạn đầu tư;","qhtml":null},{"n":6,"q":"A bond that allows the issuer to pay interest in the form of additional amounts of the\nexisting bond issue rather than\na cash payment best describes a","opts":["step-up coupon bond.","deferred coupon bond.","payment-in-kind coupon bond."],"ans":"C","expl":"A. Không chính xác vì phiếu giảm giá của trái phiếu phiếu giảm giá tăng dần, có thể cố định hoặc thả nổi,\ntăng theo mức ký quỹ được chỉ định vào những ngày được chỉ định. Nó không cho phép tổ chức phát hành trả lãi\ndưới dạng số tiền bổ sung của đợt phát hành trái phiếu thay cho thanh toán bằng tiền mặt.\nB. Không chính xác vì trái phiếu trả lãi trả chậm, đôi khi được gọi là trái phiếu trả lãi chia tách,\nkhông trả lãi trong vài năm đầu tiên nhưng sau đó trả lãi coupon cao hơn bình thường\ntrong suốt thời gian còn lại của nó. Nó không cho phép tổ chức phát hành trả lãi dưới hình thức\nsố tiền bổ sung của đợt phát hành trái phiếu thay cho thanh toán bằng tiền mặt\nC. Đúng vì trái phiếu trả lãi bằng hiện vật (PIK) thường cho phép tổ chức phát hành trả\nlãi dưới hình thức số tiền bổ sung phát hành trái phiếu thay vì thanh toán bằng tiền mặt\nThu nhập cố định: mô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và\nngược lại các điều khoản dự phòng về dòng tiền mang lại lợi ích cho tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":7,"q":"In the event of default, investors in covered bonds most likely have recourse against:","opts":["the issuer only.","a segregated pool of assets only.","both the issuer and a segregated pool of assets."],"ans":"C","expl":"A. Không chính xác vì ngược lại [với chứng khoán đảm bảo bằng tài sản], trong trường hợp trái phiếu được bảo đảm,\nnhóm tài sản vẫn nằm trên bảng cân đối kế toán của tổ chức tài chính. Trong trường hợp\nvỡ nợ, các trái chủ có quyền truy đòi cả tổ chức tài chính và quỹ bảo đảm.\nB. Không chính xác vì ngược lại [với chứng khoán đảm bảo bằng tài sản], trong trường hợp trái phiếu được bảo đảm,\nnhóm tài sản vẫn nằm trên bảng cân đối kế toán của tổ chức tài chính. Trong trường hợp\nvỡ nợ, các trái chủ có quyền truy đòi cả tổ chức tài chính và quỹ bảo đảm.\nC. Đúng vì trái phiếu được bảo đảm là một nghĩa vụ nợ được đảm bảo bởi một nhóm tài sản\ntách biệt được gọi là \"nhóm bảo đảm\" trong trường hợp vỡ nợ, người sở hữu trái phiếu có quyền truy đòi cả\ntổ chức tài chính và nhóm tài sản đảm bảo.\nThu nhập cố định: mô tả các đặc điểm và rủi ro của trái phiếu được bảo hiểm cũng như chúng khác với\ncác chứng khoán bảo đảm bằng tài sản khác","qhtml":null},{"n":8,"q":"In the securitization process, the trustee most likely.","opts":["sells the underlying collateral.","owns the underlying collateral.","holds the underlying collateral."],"ans":"C","expl":"A. Không chính xác vì người bán tài sản thế chấp, đôi khi được gọi là người gửi tiền là người\ncông ty khởi nguồn các khoản vay. Chúng được bán cho SPE và được nắm giữ bởi người được ủy thác\nB. Không chính xác vì SPE mua các khoản vay hoặc khoản phải thu và sử dụng chúng làm tài sản thế chấp\nphát hành ABS Sau khi việc mua bán hoàn tất, chính [SPE] chứ không phải [người gửi tiền/người bán] mới là người\nsở hữu chúng một cách hợp pháp. SPE sở hữu tài sản thế chấp nhưng không nắm giữ tài sản thế chấp và\nmặc dù người được ủy thác không sở hữu tài sản thế chấp cơ bản nhưng vẫn nắm giữ nó.\nC. Đúng vì người được ủy thác hoặc đại lý được ủy thác thường là tổ chức tài chính được ủy thác\nquyền bảo vệ tài sản sau khi chúng được bán cho SPE, giữ số tiền đến hạn\ncho chủ sở hữu ABS cho đến khi họ được thanh toán và cung cấp thông tin định kỳ cho chủ sở hữu ABS\nThu nhập cố định: mô tả chứng khoán hóa, bao gồm các bên và vai trò của họ","qhtml":null},{"n":9,"q":"The coupon of a residential mortgage-backed security is the:","opts":["pass-through rate","weighted average coupon rate.","rate on the underlying pool of mortgages."],"ans":"A","expl":"A. Đúng vì lãi suất chuyển tiếp của chứng khoán thế chấp được gọi là lãi suất chuyển-\nthông qua. Tỷ lệ chuyển tiếp thấp hơn tỷ lệ thế chấp trên nhóm thế chấp cơ bản\nvới số tiền bằng với phí dịch vụ và phí hành chính khác. Tỷ lệ chuyển-\nmà nhà đầu tư nhận được được gọi là \"lãi suất ròng\" hoặc \"phiếu giảm giá ròng.\nB. Không chính xác vì không phải tất cả các khoản thế chấp được bao gồm trong một nhóm các khoản thế chấp\nđược chứng khoán hóa đều có cùng lãi suất thế chấp và cùng kỳ hạn. WAC được tính bằng cách\ncân nhắc lãi suất thế chấp của mỗi khoản thế chấp trong nhóm theo phần trăm của\nsố dư thế chấp chưa thanh toán liên quan đến số tiền chưa thanh toán của tất cả các khoản thế chấp trong\ntập hợp. Tỷ lệ này, trừ đi phí dịch vụ và các phí hành chính khác, xác định tỷ lệ chuyển tiếp\nC. Không chính xác vì lãi suất phiếu giảm giá của chứng khoán chuyển tiếp thế chấp được gọi là tỷ lệ chuyển tiếp\ntỷ lệ chuyển tiếp thấp hơn lãi suất thế chấp trên tài sản cơ sở. gộp\ncác khoản thế chấp với số tiền bằng phí dịch vụ và phí hành chính khác. Tỷ lệ chuyển-\n mà nhà đầu tư nhận được được gọi là 'lãi suất ròng' hoặc 'phiếu giảm giá ròng\"\nThu nhập cố định: mô tả các loại và đặc điểm của chứng khoán được thế chấp bằng nhà ở,\nbao gồm chứng khoán chuyển tiếp thế chấp và nghĩa vụ thế chấp bằng tài sản thế chấp, và\ngiải thích các dòng tiền và rủi ro cho từng loại","qhtml":null},{"n":10,"q":"The stated annual yield to maturity on a semiannual bond basis is 3.66%. The effective\nannual yield is closest to:","opts":["3.63%","3.69%","7.45%"],"ans":"B","expl":"A. Không chính xác vì công thức chuyển đổi từ lợi tức hiệu dụng hàng năm sang lợi tức trả lương nửa năm-\n:\n≠ ((1+ năng suất)0,5 - 1) x 2 = ((1+0,0366)0,5 - 1) x 2= (1,018136 - 1) x 2 = 0,036272 ≈ 3,63%.\nB. Đúng vì lãi suất thực tế hàng năm có chu kỳ bằng 1 vì chỉ có một\nkỳ gộp trong năm. Không cần tính toán dựa trên ý tưởng trực quan\nrằng do tính lãi kép nửa năm nên lợi suất hiệu dụng hàng năm phải cao hơn một chút.\nCông thức tính lợi tức hiệu quả hàng năm của trái phiếu trả lương nửa năm là:\n= (1 + Yield/2)² - 1 = (1 + 0,0366/2)2 – 1 = 1,036935 - 1,036935 ≈ 3,69%\nC. Không chính xác vì lợi suất không chia cho 2. Công thức dùng để tính\nlợi tức thực tế hàng năm của trái phiếu thanh toán nửa năm:\n≠ (1+ lợi suất)² - 1 = (1 + 0,0366)2-1 = 1,07454 – 1 = 0,07454 ≈ 7,45%.\nThu nhập cố định: tính lãi suất hàng năm của trái phiếu cho các giai đoạn lãi kép khác nhau trong một năm","qhtml":null},{"n":11,"q":"In a securitization, the purchase agreement between the seller of the collateral and the\nspecial purpose entity most likely provides:","opts":["a description of the transaction structure.","representations about the quality of the assets.","documentation of enhancements used to reduce credit risk."],"ans":"B","expl":"A. Không chính xác vì đây là một phần của bản cáo bạch. Một tài liệu pháp lý quan trọng khác là\nbản cáo bạch, trong đó mô tả cấu trúc của chứng khoán hóa.\nB. Đúng vì một tài liệu pháp lý quan trọng là thỏa thuận mua bán giữa\nngười bán tài sản thế chấp và SPE, trong đó đưa ra các tuyên bố và bảo đảm mà\nngười bán đưa ra về tài sản được bán. Những tuyên bố và bảo đảm này đảm bảo\nnhà đầu tư về chất lượng của tài sản.\nC. Không chính xác vì đây là một phần của bản cáo bạch. Chứng khoán hóa thường sử dụng một số hình thức\ncải thiện tín dụng, được ghi trong bản cáo bạch.\nThu nhập cố định: mô tả chứng khoán hóa, bao gồm các bên và vai trò của họ","qhtml":null},{"n":12,"q":"An analyst gathers the following information about a bond:\n• Price 96.00\n• Price with yield to maturity 10 basis points higher 95.80\n• Price with yield to maturity 10 basis points lower 96.30\nThe approximate convexity of this bond is closest to:","opts":["521.","1,042.","2,604."],"ans":"B","expl":"A. Không chính xác vì mẫu số được nhân không chính xác với 2, như xảy ra trong phép tính\nthời lượng gần đúng:\n[96.3+95.8]−[2×96]\n= 521.\n2×(0,001)2 ×(96)\nB. Đúng vì approCon =\n(𝑃𝑉_)+(𝑃𝑉+)−[2𝑥(𝑃𝑉0)]\n(𝛥𝑌𝑖𝑒𝑙𝑑)2×(𝑃𝑉0)\n[96.3+95.8]−[2×96]\nDo đó, độ lồi gần đúng của liên kết này = = 1,042\n(0,001)2 ×(96)\nC. Không chính xác vì độ lồi gần đúng được tính không chính xác là khoảng thời gian\nxấp xỉ, với sai sót ở chỗ thay đổi về năng suất (0,001) được bình phương:\n[96.3−95.8]\n= 2.604.\n(0,001)2 × 2 ×(96)\nThu nhập cố định: tính toán và giải thích độ lồi và mô tả sự điều chỉnh độ lồi","qhtml":null},{"n":13,"q":"A break-even reinvestment rate is most likely equivalent to a(n):","opts":["par rate.","spot rate.","implied forward rate."],"ans":"C","expl":"A. Không chính xác vì đường cong mệnh giá là một chuỗi lợi suất đến ngày đáo hạn sao cho mỗi trái phiếu\nđược định giá theo mệnh giá. Tỷ giá mệnh giá không phải là tỷ lệ tái đầu tư hòa vốn.\nB. Không chính xác vì tỷ giá giao ngay là một chuỗi lãi suất đến ngày đáo hạn của trái phiếu không trả lãi định kỳ.\nTỷ giá kỳ hạn liên kết tỷ giá giao ngay này với tỷ giá giao ngay khác và vì lý do này có thể được mô tả là\ntỷ lệ tái đầu tư hòa vốn. Tuy nhiên, chỉ riêng tỷ giá giao ngay không phải là mức tái đầu tư hòa vốn\ntỷ lệ\nC. Đúng vì tỷ giá kỳ hạn ngụ ý là tỷ lệ tái đầu tư hòa vốn. Nó liên kết\nlợi tức đầu tư vào trái phiếu không trả lãi định kỳ ngắn hạn với lợi tức đầu tư\ntrong trái phiếu không trả lãi định kỳ dài hạn hơn.\nThu nhập cố định: xác định lãi suất giao ngay và đường cong giao ngay, đồng thời tính giá trái phiếu bằng cách sử dụng\ntỷ giá giao ngay","qhtml":null},{"n":14,"q":"A bond trading at its no-arbitrage value is priced at a premium. The sum of the present\nvalue of the bond's cash flows discounted at spot rates is:","opts":["less than the sum of the present values of the bond's cash flows discounted at its yield to maturity","equal to the sum of the present values of the bond's cash flows discounted at its yield to maturity.","greater than the sum of the present values of the bond's cash flows discounted at its yield to maturity."],"ans":"B","expl":"A. Không chính xác vì giá (hoặc giá trị) trái phiếu được xác định bằng tỷ giá giao ngay đôi khi\nđược coi là 'giá trị không chênh lệch giá'\ncủa trái phiếu nếu giá thị trường hiện tại bằng giá trị không chênh lệch giá, việc chiết khấu dòng tiền theo\ntỷ giá giao ngay hoặc lợi suất đến ngày đáo hạn sẽ đạt cùng một mức giá. Mức giá thị trường\nhiện tại so với mệnh giá không mang giá trị không chênh lệch giá.\nB. Đúng vì giá (hoặc giá trị) trái phiếu được xác định bằng tỷ giá giao ngay đôi khi\nđược coi là 'giá trị không chênh lệch giá'\ncủa trái phiếu.Nếu giá thị trường hiện tại bằng 'giá trị không chênh lệch giá, thì việc chiết khấu dòng tiền theo\ntỷ giá giao ngay hoặc lợi suất đến ngày đáo hạn sẽ có cùng mức giá.\nC. Không chính xác vì giá (hoặc giá trị) trái phiếu được xác định bằng tỷ giá giao ngay đôi khi\nđược gọi là 'giá trị không chênh lệch giá' của trái phiếu.\nNếu giá thị trường hiện tại bằng giá trị không chênh lệch giá, việc chiết khấu dòng tiền theo\ntỷ giá giao ngay hoặc lợi suất đến ngày đáo hạn sẽ có cùng mức giá. Mức giá thị trường\nhiện tại so với mệnh giá không mang giá trị không chênh lệch giá.\nThu nhập cố định: xác định tỷ giá giao ngay và đường cong giao ngay, đồng thời tính giá trái phiếu bằng cách sử dụng\ntỷ giá giao ngay","qhtml":null},{"n":15,"q":"An analyst gathers the following information about a company that only has senior\nunsecured debt.\nType Total Amount Outstanding Time to Maturity\nFloating-rate note (FRN) $50 million 12 years\nFixed-rate bond $10 million 2 years\nIn a bankruptcy scenario, if the priority of claims is enforced, it is most likely that","opts":["fixed-rate bond is repaid first because it matures earlier.","both bondholders are repaid proportionally to the amount owed.","FRN is repaid first because it has the highest amount outstanding."],"ans":"B","expl":"A. Không chính xác vì tất cả các chủ nợ ở cùng cấp độ cơ cấu vốn đều được coi\nmột loại, do đó, một trái chủ cấp cao không có bảo đảm có khoản nợ đáo hạn trong 30 năm sẽ có cùng yêu cầu bồi thường\ntheo tỷ lệ phá sản như một người có khoản nợ đáo hạn sau sáu tháng. Điều khoản này\nđược gọi là trái phiếu xếp hạng pari passu (\"trên cơ sở bình đẳng\") về quyền thanh toán.\nB. Đúng vì cả hai trái phiếu đều đại diện cho các dạng nợ không có bảo đảm cao cấp và do đó, tất cả\nchủ nợ đều có cùng cấp độ cơ cấu vốn và được coi là một loại, do đó, một\ntrái chủ cấp cao không có bảo đảm có khoản nợ đến hạn vào 30 năm có yêu cầu bồi thường theo tỷ lệ trong\nphá sản giống như một khoản nợ đáo hạn sau sáu tháng. Điều khoản này được gọi là trái phiếu\nxếp hạng pari passu ('trên cơ sở bình đẳng\") về quyền thanh toán.\nC. Không chính xác vì tất cả các chủ nợ ở cùng cấp độ cơ cấu vốn được coi là\nmột loại; do đó, một trái chủ không có bảo đảm cao cấp có khoản nợ đáo hạn trong 30 năm sẽ có cùng yêu cầu bồi thường phá sản theo tỷ lệ giống như một người có khoản nợ đáo hạn sau sáu tháng. Điều khoản này\nđược gọi là trái phiếu xếp hạng pari passu ('trên cơ sở bình đẳng') về quyền thanh toán\nThu nhập cố định: mô tả thứ hạng thâm niên của nợ, nợ có bảo đảm so với nợ không có bảo đảm và\nmức độ ưu tiên của các khiếu nại khi phá sản và tác động của chúng đối với xếp hạng tín dụng","qhtml":null},{"n":16,"q":"All else being equal, reinvestment risk is greatest for:","opts":["putable bonds.","callable bonds.","non-callable convertible bonds."],"ans":"B","expl":"A. Không chính xác vì trái phiếu có thể bán lại có lợi cho người nắm giữ trái phiếu bằng cách đảm bảo giá bán được chỉ định trước\nvào ngày mua lại. Nếu lãi suất tăng sau ngày phát hành, do đó\nlàm giá trái phiếu giảm, người sở hữu trái phiếu có thể trả lại trái phiếu cho tổ chức phát hành và nhận\ntiền mặt. Số tiền mặt này có thể được tái đầu tư vào trái phiếu mang lại lợi suất cao hơn, phù hợp với lãi suất thị trường\ncao hơn. Do đó, rủi ro tái đầu tư đối với trái phiếu có thể bán được thấp hơn so với trái phiếu có thể mua lại\n, tất cả các yếu tố khác đều bằng nhau\nB. Đúng vì trái phiếu có thể thu hồi mang lại cho nhà đầu tư mức độ rủi ro tái đầu tư cao hơn\nso với trái phiếu không thể thu hồi, nghĩa là, nếu trái phiếu được thu hồi, người nắm giữ trái phiếu phải tái đầu tư vốn\ntrong môi trường lãi suất thấp hơn\nC. Không chính xác vì trái phiếu chuyển đổi có thể được xem là sự kết hợp của trái phiếu thẳng\n(trái phiếu không có quyền chọn) cộng với quyền chọn mua vốn cổ phần được nhúng. Trái phiếu chuyển đổi cũng có thể\nbao gồm các điều khoản bổ sung, phổ biến nhất là điều khoản thu hồi. Vì không có điều khoản thu hồi\náp dụng trong trường hợp này nên rủi ro tái đầu tư sẽ thấp hơn so với trái phiếu\ntương đương có điều khoản thu hồi: trái phiếu có thể thu hồi khiến nhà đầu tư gặp mức độ\nrủi ro tái đầu tư cao hơn so với trái phiếu không thể thu hồi, nghĩa là, nếu trái phiếu được thu hồi, người sở hữu trái phiếu phải\ntái đầu tư tiền vào môi trường lãi suất thấp hơn\nThu nhập cố định: mô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và\ncác điều khoản dự phòng về dòng tiền tương phản mang lại lợi ích cho tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":17,"q":"An analyst is concerned that a bond might be downgraded one category by Standard &\nPoor's and become non- investment grade. The current rating of this bond is most likely.","opts":["A-","BB-","BBB-"],"ans":"C","expl":"A. Không chính xác vì trái phiếu xếp hạng A-có thể bị hạ cấp một loại (xuống BBB-) mà vẫn được xếp hạng\ntrái phiếu cấp đầu tư\nB. Không chính xác vì trái phiếu được xếp hạng BB- đã ở dưới mức đầu tư trước bất kỳ khoản đầu tư nào.\nhạ cấp\nC. Đúng vì BBB- là mức xếp hạng thấp nhất đối với trái phiếu có mức đầu tư. Một loại\nhạ cấp (từ BBB- xuống BB-) sẽ làm cho trái phiếu bị xếp hạng phi đầu tư\nThu nhập cố định: mô tả việc sử dụng xếp hạng từ các cơ quan xếp hạng tín dụng và những hạn chế của chúng","qhtml":null},{"n":18,"q":"A corporation with a holding company structure has debt at both its parent holding\ncompany and operating subsidiaries Debt at the operating level must be serviced before funds\ncan be upstreamed to pay debt at the holding company. This arrangement best describes:","opts":["structural subordination.","a cross-default provision.","the corporate family rating."],"ans":"A","expl":"A. Đúng vì một yếu tố khác được các cơ quan xếp hạng xem xét là sự phụ thuộc về cấu trúc,\ncó thể phát sinh khi một công ty có cấu trúc công ty mẹ có nợ ở cả\ncông ty mẹ và các công ty con đang điều hành. Nợ tại các công ty con đang hoạt động sẽ\nđược xử lý bằng dòng tiền và tài sản của các công ty con trước khi vốn có thể được chuyển\n(\"ngược dòng\") đến công ty mẹ để trả nợ ở cấp độ đó.\nB. Không chính xác vì các điều khoản về vi phạm chéo xảy ra khi vi phạm như không thanh toán\nlãi trên một trái phiếu gây ra vi phạm đối với tất cả các khoản nợ tồn đọng. Đây không phải là cấu trúc\nphụ thuộc\nC. Không chính xác vì các cơ quan xếp hạng thường sẽ cung cấp xếp hạng cho cả tổ chức phát hành và tổ chức phát hành,\nđặc biệt khi chúng liên quan đến nợ doanh nghiệp. Thuật ngữ được sử dụng để phân biệt giữa\nxếp hạng nhà phát hành và xếp hạng vấn đề bao gồm xếp hạng tập đoàn công ty. Đây không phải là sự phụ thuộc về mặt cấu trúc.\nThu nhập cố định: mô tả thứ hạng thâm niên của nợ, nợ có bảo đảm so với nợ không có bảo đảm và\nmức độ ưu tiên của các yêu cầu bồi thường khi phá sản và tác động của chúng đối với xếp hạng tín dụng","qhtml":null},{"n":19,"q":"For an option-free fixed-rate bond trading at a premium, as the coupon payment date\napproaches, Macaulay duration most likely","opts":["decreases.","remains constant.","increases."],"ans":"A","expl":"A. Đúng vì thời gian trôi qua trong thời gian phiếu giảm giá (di chuyển từ phải sang trái trong\nsơ đồ), thời hạn Macaulay giảm dần và sau đó tăng lên sau khi phiếu giảm giá\nđược thanh toán. Mô hình thông thường là thời gian đến ngày đáo hạn dài hơn tương ứng với thống kê về thời gian ở Macaulay\ncao hơn. Mô hình này luôn đúng đối với giao dịch trái phiếu ở mệnh giá hoặc ở mức\npremium cao hơn mệnh giá Ngược lại, thời gian đáo hạn ngắn hơn tương ứng với thời hạn Macaulay\nthấp hơn trong kỳ phiếu lãi.\nB. Không chính xác vì mô hình thông thường là thời gian đến ngày đáo hạn dài hơn tương ứng với số liệu thống kê về thời gian ở Macaulay cao hơn. Mẫu này luôn đúng đối với giao dịch trái phiếu ở mệnh giá hoặc ở mức\nphí trên mệnh giá. Thống kê thời hạn Macaulay không đổi nếu trái phiếu là vĩnh viễn.\nC. Không chính xác vì nếu trái phiếu được định giá ở mức chiết khấu [không phải ở mức cao hơn], thì thời gian đáo hạn\ndài hơn có thể dẫn đến thời hạn thấp hơn. Tình trạng này chỉ xảy ra nếu lãi suất trái phiếu thấp\n(nhưng không phải bằng 0) so với lợi suất và thời gian đáo hạn dài. Ngược lại, chỉ đối với\ntrường hợp đặc biệt của trái phiếu chiết khấu, thời gian đáo hạn ngắn hơn có thể dẫn đến thời hạn\nthống kê\nThu nhập cố định cao hơn: giải thích mức độ ảnh hưởng của thời gian đáo hạn, lãi suất và lợi suất của trái phiếu\nrủi ro lãi suất","qhtml":null},{"n":20,"q":"Using the rating scale from Standard & Poor's or Fitch, the lowest rating for an\ninvestment-grade bond is","opts":["BBB-","BBB","BBB+"],"ans":"A","expl":"A. Đúng vì trái phiếu được Moody's xếp hạng Baa3 trở lên và BBB- trở lên theo Standard\n& Poor's và Fitch được coi là hạng đầu tư.\nB. Không chính xác vì trái phiếu được Moody's xếp hạng Baa3 trở lên và BBB- trở lên theo Standard\n& Poor's và Fitch được coi là cấp đầu tư\nC. Không chính xác vì trái phiếu được Moody's xếp hạng Baa3 trở lên và BBB- trở lên theo Standard\n& Poor's và Fitch được coi là cấp đầu tư\nThu nhập cố định: mô tả các phân khúc thị trường có thu nhập cố định và nhà phát hành cũng như nhà đầu tư\nnhững người tham gia","qhtml":null},{"n":21,"q":"The EBITDA/interest expense ratio is best classified as a:","opts":["leverage ratio.","coverage ratio.","profitability ratio."],"ans":"B","expl":"A. Không chính xác vì EBITDA/lãi suất là tỷ lệ khả năng thanh toán chứ không phải tỷ lệ đòn bẩy. Có một\nmột số thước đo đòn bẩy được các nhà phân tích tín dụng sử dụng. Phổ biến nhất là nợ/vốn,\nnợ/EBITDA và thước đo quỹ hoặc tỷ lệ dòng tiền/nợ.\nB. Đúng vì tỷ lệ khả năng thanh toán đo lường khả năng đáp ứng các khoản thanh toán lãi suất\ncủa tổ chức phát hành. Hai tỷ lệ phổ biến nhất là EBITDA/chi phí lãi vay và EBIT/lãi\ntỷ lệ chi phí.\nC. Không chính xác vì mặc dù có một số thước đo về dòng tiền và khả năng sinh lời được sử dụng trong phân tích tín dụng\n, EBITDA/lãi suất không phải là thước đo lợi nhuận EBITDA một\nđo lường dòng tiền thường được sử dụng, lấy thu nhập hoạt động và cộng lại khấu hao và\nchi phí khấu hao vì đó là những khoản mục không dùng tiền mặt.\nThu nhập cố định: tính toán và giải thích các tỷ số tài chính được sử dụng trong phân tích tín dụng","qhtml":null},{"n":22,"q":"Which of the following statements is most accurate? US commercial paper typically:","opts":["requires the issuer to pledge collateral","requires the issuer to have a backup line of credit.","has a maturity ranging from a few days up to two years."],"ans":"B","expl":"A. Không chính xác vì thương phiếu là một kỳ phiếu ngắn hạn không có bảo đảm được phát hành vào năm\nđiểm đánh dấu công khai hoặc thông qua một đợt phát hành riêng lẻ thể hiện nghĩa vụ nợ của tổ chức phát hành\nVì không có bảo đảm nên tổ chức phát hành không cần phải cầm cố tài sản thế chấp\nB. Đúng vì Tín dụng ancalase chính xác mà các cơ quan thường yêu cầu các tổ chức phát hành thương phiếu phải đảm bảo\nmột hạn mức tín dụng dự phòng từ các ngân hàng\nC. Không chính xác vì thời gian đáo hạn của thương phiếu Hoa Kỳ thường dao động từ vài ngày trở lên.\nđến 270 ngày.\nThu nhập cố định: so sánh các lựa chọn tài trợ ngắn hạn có sẵn cho các tập đoàn và\ntổ chức tài chính","qhtml":null},{"n":23,"q":"The current yield for a 4.5% coupon, 10-year bond, with a maturity par value of $100 and\ncurrently priced at $85.70\nis closest to:","opts":["4.50%","5.25%.","5.93%."],"ans":"B","expl":"A. Không chính xác vì đây là phiếu giảm giá của trái phiếu.\nB. Đúng vì lợi nhuận hiện tại được tính là ($4,5 / $85,70) = 5,25%.\nC. Không chính xác vì nó được tính như sau:\n100 - 85,70 = 14,30\n14,30 / 10 = 1,43.\n4,5 + 1,43 = 5,93\nThu nhập cố định: so sánh, tính toán và giải thích các thước đo lợi nhuận và chênh lệch lợi nhuận cho cố định-\nlãi suất trái phiếu","qhtml":null},{"n":24,"q":"Which of the following types of collateralized debt obligations (CDOS) are most likely\nbacked by asset-backed securities?","opts":["Structured finance CDOS","Collateralized loan obligations","Collateralized bond obligations"],"ans":"A","expl":"A. Đúng vì nghĩa vụ nợ được thế chấp (CDO) là thuật ngữ chung dùng để mô tả một\nchứng khoán được hỗ trợ bởi một nhóm đa dạng gồm một hoặc nhiều nghĩa vụ nợ: CDO được hỗ trợ bởi ABS,\nRMBS, CMBS và các CDO khác là CDOS tài chính có cấu trúc.\nB. Không chính xác vì nghĩa vụ nợ được thế chấp (CDO) là thuật ngữ chung dùng để mô tả một\nbảo đảm được hỗ trợ bởi một nhóm đa dạng gồm một hoặc nhiều nghĩa vụ nợ. CDO được hỗ trợ bởi\ncác khoản vay ngân hàng có đòn bẩy là nghĩa vụ cho vay có thế chấp (CLOS)\nC. Không chính xác vì nghĩa vụ nợ được thế chấp (CDO) là thuật ngữ chung dùng để mô tả một\nchứng khoán được hỗ trợ bởi một nhóm hoặc nhiều nghĩa vụ nợ đa dạng CDO được hỗ trợ bởi\ntrái phiếu doanh nghiệp và thị trường mới nổi là nghĩa vụ trái phiếu được thế chấp (CBO).\nThu nhập cố định: mô tả các nghĩa vụ nợ được thế chấp, bao gồm cả dòng tiền và rủi ro","qhtml":null},{"n":25,"q":"An analyst gathers the following information about a 6% coupon bond currently trading at\npar:\nBenchmark Rate Price per 100 of Par Value\n5.9% 100.75\n6.0% 100.00\n6.1% 99.26\nThe bond's effective duration is closest to:","opts":["3.75.","7.45.","7.50."],"ans":"B","expl":"A. Không chính xác vì nó sử dụng giá hiện tại thay vì giá nếu lãi suất tăng trong\ntử số = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥đường cong x 𝑃𝑉 ) = (100,75 - 100,00) / (2 x 0,001 x 100,00) =\n+ 0 0\n3,75.\nB. Đúng vì thời gian hiệu lực - (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥curve x 𝑃𝑉 ) = (100,75 – 99,26) /\n+ 0 0\n(2 x 0,001 x 100,00) = 7,45.\nC. Không chính xác vì nó sử dụng giá hiện tại thay vì giá nếu lãi suất tăng trong\ntử số và không nhân được với 2 ở mẫu số, = (𝑃𝑉 −𝑃𝑉 ) / (𝛥curve x 𝑃𝑉 )\n+ 0 0\n= (100,75 - 100,00) / (0,001 x 100,00) = 7,50.\nThu nhập cố định: giải thích tại sao thời gian hiệu dụng và độ lồi hiệu quả là lớn nhất\nbiện pháp thích hợp về rủi ro lãi suất đối với trái phiếu kèm theo quyền chọn","qhtml":"<p>An analyst gathers the following information about a 6% coupon bond currently trading at par:</p><table class=\"qtable\"><thead><tr><th>Benchmark Rate</th><th>Price per 100 of Par Value</th></tr></thead><tbody><tr><td>5.9%</td><td>100.75</td></tr><tr><td>6.0%</td><td>100.00</td></tr><tr><td>6.1%</td><td>99.26</td></tr></tbody></table><p>The bond's effective duration is closest to:</p>"},{"n":26,"q":"An analyst gathers the following information about a pension plan's liabilities:\nInterest Rate Assumption Present Value of Liabilities (in $ Millions)\n0.5% 198\n1.0% 186\n1.5% 174\nIf interest rates are currently 1.0%, the effective duration of the liabilities is closest to:","opts":["6.5.","12.9.","25.8."],"ans":"B","expl":"A. Không chính xác vì phản hồi này sử dụng 1% cho sự thay đổi trong đường cong lợi suất chuẩn\n(ACurve), thay vì 0,5%. Thời gian hiệu lực = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥đường cong x 𝑃𝑉 ) = ($198\n− + 0\ntriệu - 174 triệu USD) / (2 x 0,01 x 186 triệu USD) = 6,4516 ≈ 6,5.\nB. Đúng vì thời lượng hiệu dụng = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥đường cong x 𝑃𝑉 ) = ($198 triệu -\n− + 0\n174 triệu USD) / (2 x 0,005 x 186 triệu USD) = 12,9032 ≈ 12,9.\nC. Không chính xác vì phản hồi này sử dụng công thức không chính xác về thời hạn hiệu lực; (𝑃𝑉 −\n−\n𝑃𝑉 ) / (𝛥đường cong x 𝑃𝑉 ) = ($198 triệu - $174 triệu)/(0,005 x $186 triệu) = 25,8065 ≈\n+ 0\n25,8.\nThu nhập cố định: giải thích tại sao thời gian hiệu dụng và độ lồi hiệu quả là lớn nhất\nbiện pháp thích hợp về rủi ro lãi suất đối với trái phiếu kèm theo quyền chọn","qhtml":"<p>An analyst gathers the following information about a pension plan's liabilities:</p><table class=\"qtable\"><thead><tr><th>Interest Rate Assumption</th><th>Present Value of Liabilities (in $ Millions)</th></tr></thead><tbody><tr><td>0.5%</td><td>198</td></tr><tr><td>1.0%</td><td>186</td></tr><tr><td>1.5%</td><td>174</td></tr></tbody></table><p>If interest rates are currently 1.0%, the effective duration of the liabilities is closest to:</p>"},{"n":27,"q":"Which of the following is a curve duration measure?","opts":["Modified duration","Effective duration","Macaulay duration"],"ans":"B","expl":"A. Không chính xác vì thời lượng đã sửa đổi là thống kê về thời lượng lợi nhuận. Có một số loại\nthời hạn trái phiếu. Nói chung, những điều này có thể được chia thành thời hạn lợi suất và thời lượng đường cong.\nThời hạn lợi suất là độ nhạy cảm của giá trái phiếu đối với lợi suất đến-\nthời gian đáo hạn của chính trái phiếu đó.\nB. Đúng vì thời lượng hiệu dụng là một thống kê về thời lượng đường cong trong đó nó đo lường rủi ro lãi suất\ntheo sự dịch chuyển song song của đường cong lợi suất chuẩn\nC. Không chính xác vì thời lượng Macaulay là giá trị trung bình có trọng số của thời gian nhận được .\ncác khoản thanh toán đã hứa của trái phiếu, trong đó trọng số là phần của toàn bộ giá\ntương ứng với từng khoản thanh toán trong tương lai đã hứa của trái phiếu\nThu nhập cố định: giải thích lý do tại sao thời hạn hiệu lực và độ lồi hiệu quả là những thước đo\nthích hợp nhất về rủi ro lãi suất đối với trái phiếu có các tùy chọn đi kèm","qhtml":null},{"n":28,"q":"Bonds issued in the Eurobond market are most likely.","opts":["denominated only in euros.","in the form of registered bonds.","issued within the jurisdiction of the issuer's home country."],"ans":"B","expl":"A. Không chính xác vì trái phiếu được phát hành và giao dịch trên thị trường Eurobond được gọi là\nEurobonds và được đặt tên theo loại tiền tệ mà chúng có mệnh giá. Ví dụ\n, trái phiếu Eurodollar và Euroyen lần lượt được tính bằng đô la Mỹ và yên Nhật,\n. Trái phiếu có mệnh giá bằng euro được gọi là trái phiếu bằng đồng euro\nTrái phiếu châu Âu.\nB. Đúng vì trái phiếu châu Âu, trái phiếu trong nước và nước ngoài hiện là trái phiếu đã đăng ký cho\nmà quyền sở hữu được ghi lại bằng tên hoặc số sê-ri.\nC. Không chính xác vì trái phiếu châu Âu được phát hành ngoài phạm vi quyền lực của bất kỳ quốc gia nào,\nthường không được bảo đảm và có thể được định giá bằng bất kỳ loại tiền tệ nào, bao gồm cả\ntiền tệ nội địa của nhà phát hành.\nThu nhập cố định: mô tả mức độ ảnh hưởng của các cân nhắc về pháp lý, quy định và thuế đến việc phát hành và\ngiao dịch chứng khoán có thu nhập cố định","qhtml":null},{"n":29,"q":"For a coupon bond with a negative yield, compounding more frequently within the year\nresults in a yield-to-maturity that is:","opts":["more negative.","the same.","less negative."],"ans":"A","expl":"A. Đúng vì việc gộp lãi thường xuyên hơn trong năm dẫn đến lợi suất đến ngày đáo hạn thấp hơn (\nâm).\nB. Không chính xác vì việc gộp lãi thường xuyên hơn trong năm dẫn đến lợi suất đến ngày đáo hạn thấp hơn (\nâm). Việc chuyển đổi lợi suất đến ngày đáo hạn hàng năm thành lãi kép hàng quý và\nhàng tháng mang lại cùng tỷ lệ lợi nhuận.\nC. Không chính xác vì việc gộp lãi thường xuyên hơn trong năm dẫn đến lợi suất đến ngày đáo hạn thấp hơn (\nâm).\nThu nhập cố định: tính lãi suất hàng năm của trái phiếu cho các giai đoạn gộp khác nhau trong một năm","qhtml":null},{"n":30,"q":"All else being equal, expected loss for a debt instrument:","opts":["is independent of the recovery rate.","decreases as the recovery rate increases.","changes proportionally to the recovery rate."],"ans":"B","expl":"A. Không chính xác vì tổn thất dự kiến ​​= Xác suất vỡ nợ x (1 - Tỷ lệ phục hồi). Vì sự mất mát\ndự kiến ​​bị ảnh hưởng bởi những thay đổi về tốc độ khôi phục nên nó không độc lập với tốc độ khôi phục.\nB. Đúng vì tổn thất dự kiến ​​= Xác suất vỡ nợ x Mức độ nghiêm trọng của tổn thất được đặt mặc định, trong đó\nmức độ nghiêm trọng của tổn thất thường được biểu thị bằng (1- Tỷ lệ khôi phục), trong đó tốc độ khôi phục là\nphần trăm của số tiền gốc được thu hồi trong trường hợp vỡ nợ. Do đó, tổn thất dự kiến\ncũng có thể được viết là Tổn thất dự kiến ​​= Xác suất mặc định x (1- Tỷ lệ khôi phục), có nghĩa là\ntỷ lệ khôi phục càng cao thì tổn thất dự kiến ​​càng thấp.\nC. Không chính xác vì mối quan hệ Tổn thất dự kiến ​​= Xác suất vỡ nợ x (1 - Tỷ lệ phục hồi)\nngụ ý rằng tổn thất dự kiến ​​tăng khi tỷ lệ thu hồi giảm và ngược lại, do đó\nnó không thay đổi tỷ lệ thuận với tỷ lệ thu hồi.\nThu nhập cố định: mô tả rủi ro tín dụng và các thành phần của nó, xác suất vỡ nợ và tổn thất được đưa ra\nvỡ nợ","qhtml":null},{"n":31,"q":"Matrix pricing is most likely used to estimate the price of a bond that","opts":["is highly liquid.","is not yet issued.","has unknown credit quality."],"ans":"B","expl":"A. Không chính xác vì một số trái phiếu có lãi suất cố định không được giao dịch tích cực nên thường ước tính\ntỷ lệ chiết khấu thị trường và giá dựa trên giá niêm yết hoặc giá cố định của những trái phiếu so sánh được giao dịch thường xuyên hơn\n. Những trái phiếu có thể so sánh này có thời gian đáo hạn, lãi suất\nvà chất lượng tín dụng tương tự nhau. Quá trình ước tính này được gọi là định giá ma trận. Trái phiếu có tính thanh khoản cao\nđược định giá dựa trên giá thị trường thực tế chứ không phải giá ma trận.\nB. Đúng vì đối với những trái phiếu chưa được phát hành, người ta thường ước tính tỷ lệ chiết khấu và giá thị trường\ndựa trên giá niêm yết hoặc giá cố định của những trái phiếu có thể so sánh được\nđược giao dịch thường xuyên hơn. Những trái phiếu có thể so sánh này có thời gian đáo hạn, lãi suất trái phiếu,\nvà chất lượng tín dụng tương tự nhau. Quá trình ước tính này được gọi là định giá ma trận.\nC. Không chính xác vì đối với các trái phiếu có thể so sánh được có thời gian đáo hạn, lãi suất\nvà chất lượng tín dụng tương tự nhau, quá trình ước tính được gọi là định giá ma trận. Những trái phiếu có chất lượng tín dụng\nkhông chắc chắn không phải là ứng cử viên phù hợp cho định giá ma trận\nThu nhập cố định: mô tả định giá ma trận","qhtml":null},{"n":32,"q":"All else being equal, the risk of a strategic default for a non-recourse mortgage is most\nlikely.","opts":["lower than for a recourse mortgage.","the same as for a recourse mortgage.","greater than for a recourse mortgage."],"ans":"C","expl":"A. Không chính xác vì đối với khoản thế chấp không truy đòi, người đi vay có thể có động cơ\nvỡ nợ đối với khoản thế chấp dưới nước và cho phép người cho vay tịch thu tài sản, thậm chí\nnếu có sẵn nguồn lực để tiếp tục thanh toán thế chấp. Loại vỡ nợ này của người vay\nđược gọi là \"vỡ nợ chiến lược. Do đó, rủi ro vỡ nợ chiến lược\ncao hơn (không thấp hơn) đối với khoản thế chấp không truy đòi.\nB. Không chính xác vì đối với khoản thế chấp không truy đòi, người đi vay có thể có động cơ để\nvỡ nợ đối với khoản thế chấp dưới nước và cho phép người cho vay tịch thu tài sản, thậm chí\nnếu có sẵn nguồn lực để tiếp tục thanh toán thế chấp. Loại vỡ nợ này của người vay\nđược gọi là \"vỡ nợ chiến lược\". Do đó, rủi ro vỡ nợ chiến lược\ncao hơn (không giống nhau) đối với khoản thế chấp không truy đòi.\nC. Đúng vì đối với khoản thế chấp không truy đòi, người đi vay có thể có động cơ\nvỡ nợ đối với khoản thế chấp dưới nước và cho phép người cho vay tịch thu tài sản, thậm chí\nnếu có sẵn nguồn lực để tiếp tục thanh toán thế chấp. Loại vỡ nợ này của người vay\nđược gọi là \"vỡ nợ chiến lược. Ở những quốc gia nơi các khoản thế chấp nhà ở là các khoản vay truy đòi\n, khả năng vỡ nợ chiến lược ít xảy ra hơn vì người cho vay có thể tìm cách bù đắp\nsự thiếu hụt từ các tài sản và/hoặc thu nhập khác của người đi vay. Do đó, rủi ro vỡ nợ chiến lược\nđối với khoản thế chấp không truy đòi\nThu nhập cố định: mô tả các đặc điểm cơ bản của các khoản vay thế chấp nhà ở được\nchứng khoán hóa","qhtml":null},{"n":33,"q":"For bonds with embedded options, the most appropriate measure of price sensitivity to\ninterest rate changes is:","opts":["effective duration.","modified duration.","Macaulay duration."],"ans":"A","expl":"A. Đúng vì thời hạn hiệu lực là cần thiết để đo lường rủi ro lãi suất\ncủa một trái phiếu phức tạp, chẳng hạn như trái phiếu có chứa quyền chọn mua được nhúng. Tóm lại,\ntrái phiếu có thể mua lại không có tỷ lệ hoàn vốn nội bộ được xác định rõ ràng (sản lượng đến ngày đáo hạn).\nDo đó, số liệu thống kê về thời hạn lợi tức, chẳng hạn như thời hạn sửa đổi và thời hạn Macaulay, không áp dụng\nthời hạn hiệu lực là thước đo thời hạn thích hợp\nB. Không chính xác vì tóm lại, trái phiếu [một quyền chọn được nhúng) không có tỷ suất sinh lợi nội bộ\nđược xác định rõ ràng (lợi suất đến ngày đáo hạn). Do đó, số liệu thống kê về thời hạn lợi nhuận, chẳng hạn như\nđã sửa đổi và thời lượng Macaulay, không được áp dụng; thời lượng hiệu quả là thước đo thời lượng\nthích hợp.\nC. Không chính xác vì tóm tắt. Trái phiếu [một tùy chọn được nhúng) không có tỷ suất sinh lợi nội bộ\nđược xác định rõ ràng (lợi suất đến ngày đáo hạn). Do đó, số liệu thống kê về thời hạn lợi tức, chẳng hạn như\nđã sửa đổi và thời hạn Macaulay, không áp dụng thời hạn hiệu dụng là thước đo thời hạn thích hợp\n.\nThu nhập cố định: giải thích tại sao thời hạn hiệu dụng và độ lồi hiệu quả là những thước đo\nthích hợp nhất về rủi ro lãi suất đối với trái phiếu có các tùy chọn nhúng","qhtml":null},{"n":34,"q":"For a bond with an embedded option, effective duration is the most appropriate measure\nof interest rate risk because the bond's:","opts":["future cash flows are uncertain.","internal rate of return is well-defined.","pricing is sensitive to changes in credit spreads."],"ans":"A","expl":"A. Đúng vì thời hạn hiệu lực là cần thiết để đo lường rủi ro lãi suất\ncủa một trái phiếu phức tạp, chẳng hạn như trái phiếu có chứa quyền chọn mua được nhúng. Vấn đề\nlà dòng tiền trong tương lai không chắc chắn vì chúng phụ thuộc vào lãi suất trong tương lai.\nQuyết định thu hồi trái phiếu của nhà phát hành phụ thuộc vào khả năng tái cấp vốn cho khoản nợ với\nchi phí vốn thấp hơn. Thời lượng hiệu quả là thước đo thời lượng thích hợp.\nB. Không chính xác vì trái phiếu có thể thu hồi không có tỷ suất hoàn vốn nội bộ được xác định rõ ràng\n(sản lượng đến ngày đáo hạn). Do đó, số liệu thống kê về thời hạn lợi nhuận, chẳng hạn như thời lượng đã sửa đổi và Macaulay\n, không được áp dụng; thời lượng hiệu quả là thước đo thời lượng thích hợp.\nC. Không chính xác vì thời hạn hiệu lực đo lường mức độ nhạy cảm của trái phiếu đối với những thay đổi trong đường cong lợi suất chuẩn\nchứ không phải những thay đổi trong chênh lệch tín dụng, được đo bằng\ncác phương tiện khác (mô hình định giá). Thước đo thời lượng đường cong này [thời hạn hiệu quả] cho thấy\nđộ nhạy cảm của trái phiếu đối với đường cong lãi suất chuẩn-đặc biệt là đường cong mệnh giá của chính phủ-\ngiả định không có thay đổi trong chênh lệch tín dụng. Bạn có thể sử dụng mô hình định giá để xác định 'thống kê thời hạn tín dụng\n-nghĩa là độ nhạy cảm của giá trái phiếu với sự thay đổi trong chênh lệch tín dụng.\nThu nhập cố định: giải thích tại sao thời hạn hiệu dụng và độ lồi hiệu quả là\nthước đo thích hợp nhất về rủi ro lãi suất đối với trái phiếu có các quyền chọn kèm theo","qhtml":null},{"n":35,"q":"An analyst gathers the following information about a spot curve:\nTerm to Maturity Spot Rate\n1 year 6%\n2 years 5%\n3 years 4%\nIf the coupon rate of a 3-year annual-pay bond is 4%, the price of the bond is closest to:","opts":["97.28.","99.86.","100.00."],"ans":"B","expl":"A. Không chính xác vì giá trái phiếu được tính bằng tỷ lệ chiết khấu trung bình\ncủa tỷ giá giao ngay; (6% + 5% + 4%)/3 = 15%/3 = 5%. Do đó, PV ≠ 4/(1,05)¹ + 4/(1,05)2 +\n104/(1,05)3 = 4/1,05 + 4/1.1025+ 104/1.157625 = 3.8095 + 3.6281 + 89.8391= 97.276 ≈\n97,28.\nB. Đúng vì với tỷ giá giao ngay, giá của trái phiếu có thể được tính bằng\ncông thức sau: PV = [PMT/(1+𝑍 )1+ PMT/(1+ 𝑍 )²+...+ (PMT + FV)/(1+ 𝑍 )N ] Do đó, PV =\n1 2 𝑁\n4/(1+0,06)1 + 4/(1+0,05)² + (4 + 100)/(1+0,04)3 = 4/1,06 + 4/1,1025+ 104/1,1249 = 3,77358 +\n3,62812 + 92,4556 = 99,8573 ≈ 99,86.\nC. Không chính xác vì giá trái phiếu được tính bằng lãi suất giao ngay kỳ hạn 3 năm là\ntỷ lệ chiết khấu cho tất cả các dòng tiền.\nDo đó, PV ≠ 4/(1 + 0,04)¹ + 4/(1 + 0,04)2 + (4 + 100)/(1 + 0,04)3 = 4/1,04 + 4/1.0816 +\n104/1.1249 = 3.8461 + 3.6982 + 92.4527 = 99.9969 ≈ 100.00.\nThu nhập cố định: xác định tỷ giá giao ngay và đường cong giao ngay và tính giá trái phiếu bằng cách sử dụng\ngiao ngay giá","qhtml":null},{"n":36,"q":"The price of an option-free bond increases by 7% when the yield to maturity decreases by\n100 basis points. If the price of this bond decreases by 7%, the yield to maturity most likely\nincreases by:","opts":["less than 100 basis points.","100 basis points.","more than 100 basis points."],"ans":"C","expl":"A. Không chính xác vì với cùng một lãi suất phiếu giảm giá và thời gian đáo hạn, phần trăm giá\nthay đổi lớn hơn (về giá trị tuyệt đối, nghĩa là không quan tâm đến dấu của sự thay đổi)\nkhi lãi suất chiết khấu thị trường giảm so với khi nó tăng (hiệu ứng lồi).\nB. Không chính xác vì với cùng một lãi suất phiếu giảm giá và thời gian đáo hạn, phần trăm giá\nthay đổi lớn hơn (về giá trị tuyệt đối, nghĩa là không quan tâm đến dấu của sự thay đổi)\nkhi lãi suất chiết khấu thị trường giảm so với khi nó tăng (hiệu ứng lồi).\nC. Đúng vì với cùng một lãi suất phiếu giảm giá và thời gian đáo hạn, phần trăm giá\nthay đổi lớn hơn (về giá trị tuyệt đối, nghĩa là không quan tâm đến dấu hiệu của sự thay đổi)\nkhi lãi suất chiết khấu thị trường giảm so với khi nó tăng (hiệu ứng lồi)\nThu nhập cố định: xác định mối quan hệ giữa giá trái phiếu, lãi suất coupon, thời gian đáo hạn và\nsản lượng đến trưởng thành","qhtml":null},{"n":37,"q":"All else being equal, the absolute value of the percentage price change for an option-free\nbond is most likely","opts":["less when the market discount rate decreases than when it increases by the same amount.","the same whether the market discount rate decreases or increases by the same amount.","greater when the market discount rate decreases than when it increases by the same amount."],"ans":"C","expl":"A. Không chính xác vì điều ngược lại mới đúng do hiệu ứng lồi. Đối với cùng một phiếu giảm giá\nvà thời gian đến ngày đáo hạn, phần trăm thay đổi giá sẽ lớn hơn (theo giá trị tuyệt đối,\ncó nghĩa là không quan tâm đến dấu hiệu của sự thay đổi) khi tỷ lệ chiết khấu thị trường giảm\nxuống so với khi nó tăng (hiệu ứng lồi).\nB. Không chính xác vì nó bỏ qua hiệu ứng lồi của hầu hết các trái phiếu không có quyền chọn. Đối với cùng tỷ lệ và thời gian của phiếu giảm giá\n. đến ngày đáo hạn, phần trăm thay đổi giá sẽ lớn hơn (theo giá trị\ntuyệt đối, nghĩa là không quan tâm đến dấu hiệu của sự thay đổi) khi tỷ lệ chiết khấu thị trường\ngiảm so với khi tăng (hiệu ứng lồi).\nC. Đúng vì với cùng một lãi suất phiếu giảm giá và thời gian đáo hạn, phần trăm giá\nthay đổi lớn hơn (về giá trị tuyệt đối, nghĩa là không quan tâm đến dấu hiệu của sự thay đổi)\nkhi lãi suất chiết khấu thị trường giảm so với khi nó tăng (hiệu ứng lồi).\nThu nhập cố định: xác định mối quan hệ giữa giá trái phiếu, lãi suất coupon, thời gian đáo hạn và\nsản lượng đến ngày đáo hạn","qhtml":null},{"n":38,"q":"An analyst gathers the following information about three option-free bonds:\nBond 1 Bond 2 Bond 3\nCoupon rate 5% 3% 3%\nMaturity (years) 15 10 15\nAll else being equal, if the market discount rate decreases by 50 basis points, the bond most\nlikely to experience the greatest percentage price change is:","opts":["Bond 1.","Bond 2.","Bond 3"],"ans":"C","expl":"A. Không chính xác vì trong cùng thời gian đáo hạn, trái phiếu có lãi suất thấp hơn có\nphần trăm thay đổi giá lớn hơn so với trái phiếu có lãi suất cao hơn khi lãi suất chiết khấu thị trường của chúng\nthay đổi cùng một lượng (hiệu ứng phiếu giảm giá). Trái phiếu 1 có cùng thời gian đáo hạn như\nTrái phiếu 3 nhưng phiếu giảm giá cao hơn, do đó Trái phiếu 1 sẽ có phần trăm thay đổi giá\nso với Trái phiếu 3.\nB. Không chính xác vì nhìn chung, với cùng một lãi suất, trái phiếu dài hạn có\ntỷ lệ phần trăm thay đổi giá lớn hơn so với trái phiếu ngắn hạn khi lãi suất chiết khấu thị trường của chúng thay đổi\ncùng một lượng (hiệu ứng đáo hạn). Trái phiếu 2 có cùng lãi suất như Trái phiếu 3 nhưng\nthời gian đáo hạn ngắn hơn, do đó Trái phiếu 2 sẽ có phần trăm thay đổi giá nhỏ hơn\nso với Trái phiếu 3.\nC. Đúng vì trong cùng thời gian đáo hạn, trái phiếu có lãi suất thấp hơn có\nphần trăm thay đổi giá lớn hơn so với trái phiếu có lãi suất cao hơn khi lãi suất chiết khấu thị trường của chúng\nthay đổi cùng một lượng (hiệu ứng phiếu giảm giá). Trái phiếu 3 có cùng thời gian đáo hạn như\nTrái phiếu 1 nhưng phiếu giảm giá thấp hơn, do đó Trái phiếu 3 sẽ có phần trăm thay đổi giá\nso với Trái phiếu 1. Ngoài ra, nhìn chung, với cùng một lãi suất, trái phiếu dài hạn hơn\ncó phần trăm thay đổi giá lớn hơn trái phiếu ngắn hạn khi lãi suất chiết khấu thị trường\ncủa chúng thay đổi cùng một lượng (thời gian đáo hạn) hiệu ứng). Trái phiếu 3 có\ntỷ lệ phiếu giảm giá tương tự như Trái phiếu 2 nhưng có thời gian đáo hạn dài hơn, do đó Trái phiếu 3 sẽ có\nphần trăm thay đổi giá lớn hơn so với Trái phiếu 2.\nThu nhập cố định: xác định mối quan hệ giữa giá trái phiếu, lãi suất trái phiếu, thời gian đáo hạn và\nlợi tức đến ngày đáo hạn","qhtml":"<p>An analyst gathers the following information about three option-free bonds:</p><table class=\"qtable\"><thead><tr><th></th><th>Bond 1</th><th>Bond 2</th><th>Bond 3</th></tr></thead><tbody><tr><td>Coupon rate</td><td>5%</td><td>3%</td><td>3%</td></tr><tr><td>Maturity (years)</td><td>15</td><td>10</td><td>15</td></tr></tbody></table><p>All else being equal, if the market discount rate decreases by 50 basis points, the bond most likely to experience the greatest percentage price change is:</p>"},{"n":39,"q":"Implied forward rates are best defined as the:","opts":["geometric average of spot rates.","breakeven reinvestment rates between zero-coupon bonds.","current yield to maturity on zero-coupon bonds of different maturities."],"ans":"B","expl":"A. Không chính xác vì đường cong giao ngay có thể được tính dưới dạng trung bình nhân của\ntỷ giá kỳ hạn.\nB. Đúng vì tỷ giá kỳ hạn ngụ ý (còn được gọi là lợi suất kỳ hạn) được tính từ\ntỷ giá giao ngay. Tỷ giá kỳ hạn ngụ ý là tỷ lệ tái đầu tư hòa vốn. Khi thị trường\nở trạng thái cân bằng (không có chênh lệch giá), tỷ giá kỳ hạn ngụ ý bằng với tỷ giá kỳ hạn.\nC. Không chính xác vì lãi suất giao ngay là lãi suất đến ngày đáo hạn của trái phiếu không trả lãi, đáo hạn vào\nngày của mỗi dòng tiền.\nThu nhập cố định: xác định lãi suất giao ngay và đường cong giao ngay, đồng thời tính giá trái phiếu bằng cách sử dụng\ntỷ giá giao ngay","qhtml":null},{"n":40,"q":"Effective duration is the most appropriate measure of interest rate risk for a bond with an\nembedded option because the bond does not have a well-defined:","opts":["effective convexity.","internal rate of return.","curve duration statistic."],"ans":"B","expl":"A. Không chính xác vì các liên kết với các tùy chọn nhúng có độ lồi hiệu dụng được xác định rõ.\nĐộ lồi âm, có thể được gọi là \"độ lõm\" là một tính năng quan trọng của liên kết\ncó thể gọi được. Mặt khác, trái phiếu có thể bán được luôn có độ lồi dương.\nB. Đúng vì tóm lại, một trái phiếu có thể mua lại không có tỷ suất sinh lợi nội bộ được xác định rõ ràng\n(lợi suất đến ngày đáo hạn). Do đó, số liệu thống kê về thời hạn lợi nhuận, chẳng hạn như thời lượng đã sửa đổi và\nMacaulay, không được áp dụng; thời lượng hiệu quả là thước đo thời lượng thích hợp.\nC. Không chính xác vì thời lượng hiệu dụng là một thống kê về thời lượng đường cong trong đó nó đo lường\nrủi ro lãi suất theo sự dịch chuyển song song của đường cong lãi suất chuẩn (𝛥Curve).\nRủi ro lãi suất của trái phiếu có quyền chọn nhúng được đo lường một cách thích hợp nhất bằng cách sử dụng\nthời hạn hiệu lực, một thống kê đường cong, có nghĩa là độ nhạy của trái phiếu có\ntùy chọn nhúng đối với sự thay đổi mức độ của đường cong lãi suất chuẩn trên thực tế đã được xác định rõ\n.\nThu nhập cố định: giải thích tại sao thời hạn hiệu lực và độ lồi hiệu quả là\nbiện pháp đo lường rủi ro lãi suất phù hợp nhất đối với trái phiếu có quyền chọn kèm theo","qhtml":null},{"n":41,"q":"When interest rates increase, mortgage-backed securities most likely exhibit increased:","opts":["extension risk.","contraction risk.","reinvestment risk."],"ans":"A","expl":"A. Đúng vì rủi ro gia hạn là rủi ro khi lãi suất tăng, số tiền trả trước sẽ\nthấp hơn dự báo vì chủ nhà không muốn từ bỏ lợi ích của lãi suất hợp đồng\nmà hiện tại có vẻ thấp. Do đó, chứng khoán được đảm bảo bằng các khoản thế chấp sẽ\nthường có thời gian đáo hạn dài hơn dự đoán tại thời điểm mua.\nB. Không chính xác vì rủi ro thu hẹp là rủi ro khi lãi suất giảm, số tiền trả trước\nthực tế sẽ cao hơn dự báo vì chủ sở hữu nhà sẽ tái cấp vốn với mức lãi suất thấp hơn hiện tại-\n. Do đó, chứng khoán được đảm bảo bằng các khoản thế chấp sẽ có thời gian đáo hạn\nngắn hơn so với dự đoán tại thời điểm mua. Việc nắm giữ một chứng khoán có kỳ hạn\ntrở nên ngắn hơn khi lãi suất giảm có hai hậu quả bất lợi đối với các nhà đầu tư.\nĐầu tiên, các nhà đầu tư phải tái đầu tư số tiền thu được với lãi suất thấp hơn. Thứ hai, nếu chứng khoán\ncó thể trả trước hoặc có thể thu hồi được thì mức tăng giá của nó sẽ không lớn bằng mức tăng giá của một trái phiếu\ngiống hệt nhưng không có tùy chọn trả trước hoặc quyền chọn mua. Rủi ro thu hẹp gia tăng xảy ra\nkhi lãi suất giảm chứ không tăng.\nC. Không chính xác vì rủi ro thu hẹp là rủi ro khi lãi suất giảm, số tiền trả trước\nthực tế sẽ cao hơn dự báo vì chủ sở hữu nhà sẽ tái cấp vốn với mức lãi suất thấp hơn hiện tại-\n. Đầu tiên, các nhà đầu tư phải tái đầu tư số tiền thu được với lãi suất\nthấp hơn. Khi lãi suất giảm thay vì tăng, các khoản trả trước có thể\ntăng và được tái đầu tư với lãi suất thấp hơn, do đó làm tăng rủi ro tái đầu tư. Điều này\nkhông có khả năng xảy ra khi lãi suất tăng.\nThu nhập cố định: xác định rủi ro thanh toán trước và mô tả cấu trúc phân chia thời gian trong\nchứng khoán hóa và mục đích của chúng","qhtml":null},{"n":42,"q":"Tightening corporate bond yield spreads are most likely associated with:","opts":["issuers' deteriorating creditworthiness.","periods of high demand for corporate bonds.","broker-dealers' reduced ability and willingness to make markets."],"ans":"B","expl":"A. Không chính xác vì chênh lệch lợi suất mở rộng dựa trên hai yếu tố chính: (1) sự suy giảm độ tin cậy của\ntổ chức phát hành, đôi khi được gọi là rủi ro di chuyển hoặc hạ cấp tín dụng và\n(2) sự gia tăng rủi ro thanh khoản thị trường.\nB. Đúng vì trong thời kỳ nhu cầu trái phiếu cao, chênh lệch sẽ giảm dần.\nC. Không chính xác vì chênh lệch lợi suất mở rộng dựa trên hai yếu tố chính: (1) sự suy giảm độ tin cậy của\ntổ chức phát hành, đôi khi được gọi là rủi ro di chuyển hoặc hạ cấp tín dụng và\n(2) sự gia tăng rủi ro thanh khoản thị trường. Hầu hết các hạt thị trường giao dịch chủ yếu qua quầy\nthông qua các đại lý môi giới giao dịch cho tài khoản của chính họ Khả năng và sự sẵn sàng tạo ra\nthị trường, như được phản ánh trong chênh lệch giá thầu-yêu cầu, là yếu tố quan trọng quyết định rủi ro thanh khoản thị trường\n.\nThu nhập cố định: mô tả các yếu tố kinh tế vĩ mô, thị trường và nhà phát hành cụ thể ảnh hưởng đến\nmức độ và sự biến động của lợi suất lây lan","qhtml":null},{"n":43,"q":"In a repurchase agreement:","opts":["only the lender of funds is exposed to credit risk.","credit risk is eliminated by using highly rated sovereign bonds as collateral.","the initial margin offers partial protection against changes in the market value of the collateral."],"ans":"C","expl":"A. Không chính xác vì mỗi người tham gia hợp đồng repo đều phải đối mặt với rủi ro là bên\nkhác không thể đáp ứng các nghĩa vụ của mình\nB. Không chính xác vì mỗi người tham gia hợp đồng repo đều phải đối mặt với rủi ro là bên\nkhác không thể đáp ứng các nghĩa vụ của mình, bất kể chất lượng của tài sản thế chấp được sử dụng trong\ngiao dịch repo. Tài sản thế chấp phải có ít hoặc không có mối tương quan với rủi ro tín dụng của\nđối tác repo để đa dạng hóa rủi ro tín dụng.\nC. Đúng vì ngoài chất lượng cao của chứng khoán cơ bản, kho còn bao gồm\ncác tính năng được thiết kế để giảm nguy cơ thiếu hụt tài sản thế chấp trong suốt thời hạn hợp đồng. Một trong những tính năng\nnhư vậy là cung cấp tài sản thế chấp vượt quá số tiền mặt trao đổi, được gọi là ký quỹ\nban đầu.\nThu nhập cố định: mô tả các thỏa thuận mua lại (repos), cách sử dụng cũng như lợi ích và\nrủi ro","qhtml":null},{"n":44,"q":"With respect to a bond with an embedded option, for parallel shifts in the benchmark\nyield curve, effective duration most likely indicates the same interest rate sensitivity as:","opts":["key rate durations.","modified duration.","Macaulay duration."],"ans":"A","expl":"A. Đúng vì đối với những thay đổi song song trong đường cong lãi suất chuẩn, thời hạn lãi suất chính sẽ\nbiểu thị độ nhạy lãi suất tương tự như thời hạn hiệu lực.\nB. Không chính xác vì sự khác biệt giữa thời lượng được sửa đổi gần đúng và thời lượng\nhiệu quả nằm ở mẫu số. Thời hạn được sửa đổi là một thống kê >thời hạn lợi suất trong đó nó\nđo lường rủi ro lãi suất dựa trên sự thay đổi về lợi tức đến ngày đáo hạn (AYield) của chính nhóm đó.\nCâu hỏi này đề cập đến những thay đổi trong đường cong lợi suất chuẩn, chứ không phải lợi suất của chính trái phiếu đến\nkỳ hạn, do đó, thời hạn được sửa đổi là thước đo không chính xác.\nC. Không chính xác vì sự khác biệt giữa thời lượng được sửa đổi gần đúng và thời lượng\nhiệu quả nằm ở mẫu số. Thời hạn được sửa đổi là một thống kê về thời hạn lợi tức trong đó nó\nđo lường rủi ro lãi suất theo sự thay đổi trong lợi tức đến ngày đáo hạn (AYield)\nNgoài ra, việc tính toán thống kê thời hạn được sửa đổi (ModDur) của một trái phiếu yêu cầu\nmột sự điều chỉnh đơn giản đối với thời hạn Macaulay. Đó là thống kê thời lượng Macaulay chia cho\nmột cộng với sản lượng mỗi kỳ. Do đó, thời hạn Macaulay, như một dẫn xuất toán học của\nthời hạn được sửa đổi, cũng là thước đo rủi ro về sự thay đổi lợi suất đến\nkỳ hạn của chính trái phiếu. Câu hỏi này đề cập đến những thay đổi trong đường cong lợi suất chuẩn, chứ không phải\nlợi suất đến ngày đáo hạn của chính trái phiếu, do đó, thời hạn sửa đổi là thước đo không chính xác.\nThu nhập cố định: xác định thời hạn lãi suất chính và mô tả cách sử dụng nó để đo độ nhạy cảm về giá của\ncác công cụ thu nhập cố định đối với những thay đổi của đường cong lợi suất chuẩn","qhtml":null},{"n":45,"q":"In a securitization, a senior/subordinated structure is most likely a form of","opts":["time tranching","credit tranching.","prepayment risk management."],"ans":"B","expl":"A. Không chính xác vì việc tạo ra các loại trái phiếu có kỳ hạn dự kiến ​​khác nhau\nđược coi là thời gian là một hình thức phân ngạch tín dụng, không phải phân ngạch thời gian.\nB. Đúng vì thông thường việc chứng khoán hóa sẽ bao gồm một hình thức tăng cường tín dụng nội bộ\nđược gọi là Cấp dưới là cấp dưới, còn được gọi là phân đợt tín dụng. Trong\ncấu trúc như vậy, có nhiều loại trái phiếu hoặc đợt và các loại trái phiếu khác nhau\nvề cách chúng sẽ chia sẻ mọi tổn thất do vỡ nợ của những người đi vay có khoản vay\nđược thế chấp. Các lớp liên kết được phân loại là các lớp liên kết cấp cao hoặc các lớp liên kết cấp dưới\ndo đó, lý do cấu trúc này còn được gọi là cấu trúc cấp cao/cấp dưới\n.\nC. Không chính xác vì rủi ro thanh toán trước là sự không chắc chắn rằng dòng tiền sẽ khác\nvới dòng tiền dự kiến ​​như được quy định trong hợp đồng vay vì\nkhả năng thay đổi thanh toán của người vay. Rủi ro này liên quan đến việc phân bổ thời gian, không phải phân bổ tín dụng.\nThu nhập cố định: mô tả các cấu trúc tăng cường tín dụng điển hình được sử dụng trong chứng khoán hóa","qhtml":null},{"n":46,"q":"Modified duration is the most appropriate measure of interest rate risk for which of the\nfollowing securities?","opts":["Callable bond","US Treasury bond","Mortgage-backed bond"],"ans":"B","expl":"A. Không chính xác vì trái phiếu có thể thu hồi không có tỷ suất hoàn vốn nội bộ được xác định rõ ràng\n(sản lượng đến ngày đáo hạn). Do đó, số liệu thống kê về thời lượng lợi nhuận, chẳng hạn như thời lượng được sửa đổi và Macau
