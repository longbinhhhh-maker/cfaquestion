34 +0,054)/2=0,088/2= 0,044=4,4%.\nC. Không chính xác vì việc định giá ma trận dar nội suy tuyến tính được triển khai từ\nđầu sai của khoảng. Một số trái phiếu có lãi suất cố định không được giao dịch tích cực. Do đó,\nkhông có sẵn giá thị trường để tính tỷ suất lợi nhuận mà nhà đầu tư yêu cầu. Trong những trường hợp\nnày, người ta thường ước tính tỷ lệ chiết khấu và giá thị trường dựa trên giá niêm yết\nhoặc giá cố định của các trái phiếu so sánh được giao dịch thường xuyên hơn. Những trái phiếu có thể so sánh này có\nlốp tương tự như súng thần công và chất lượng tín dụng. Công cụ ước tính này được gọi là định giá\neratrix. Inte es bmete fatkebdisonart có thể được kết hợp với sự xen kẽ tuyến tính.\nSử dụng phần cuối của wraite giữa hai liên kết đã cho, chúng ta có: 0,034+\n(8-5)/(8-3) * (0,054 -0,034) = 0,034 +3/5x0,02 = 0,046 = 4,6%.\nThu nhập cố định: mô tả giá ma trận","qhtml":null},{"n":61,"q":"Compared to an otherwise similar option-free bond, investors require a higher yield for a\ncorporate bond with a:","opts":["put provision.","call provision.","conversion provision."],"ans":"B","expl":"A. Không chính xác vì điều khoản quyền chọn bán là một lựa chọn có giá trị cho các trái chủ, do đó\ntrái phiếu có thể tranh chấp mang lại lợi suất thấp hơn (và do đó có giá cao hơn) so với các trái phiếu không thể tranh chấp tương tự không phải\n.\nB. Đúng vì điều khoản cuộc gọi là một lựa chọn có giá trị cho nhà phát hành. Do đó, các yếu tố khác\nbằng nhau, các nhà đầu tư yêu cầu lợi suất cao hơn (và do đó trả giá thấp hơn) cho một trái phiếu có thể mua lại so với\nđối với một trái phiếu không thể mua lại tương tự khác.\nC. Không chính xác vì trái phiếu chuyển đổi mang lại cho người sở hữu trái phiếu quyền chuyển đổi trái phiếu\nthành cổ phiếu phổ thông của công ty phát hành. Vì tùy chọn này có lợi cho người sở hữu trái phiếu nên\ntrái phiếu chuyển đổi mang lại lợi suất thấp hơn và bán với giá cao hơn so với các trái phiếu không chuyển đổi không phải\ntương tự.\nThu nhập cố định: mô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và\nngược lại các điều khoản dự phòng về dòng tiền mang lại lợi ích cho tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":62,"q":"The price of a bond issued in the United Kingdom by a US-based company and\ndenominated in British pounds most likely changes when:","opts":["US interest rates change only.","British interest rates change only.","both US and British interest rates change"],"ans":"B","expl":"A. Không chính xác vì mệnh giá tiền tệ của dòng tiền của trái phiếu ảnh hưởng đến\nlãi suất của quốc gia ảnh hưởng đến giá trái phiếu. Giá trái phiếu do một công ty\ncó trụ sở tại Hoa Kỳ phát hành và có mệnh giá bằng bảng Anh sẽ bị ảnh hưởng bởi lãi suất của Anh.\nB. Đúng vì mệnh giá tiền tệ của dòng tiền của trái phiếu ảnh hưởng đến\nlãi suất của quốc gia ảnh hưởng đến giá trái phiếu. Giá trái phiếu do một công ty\ncó trụ sở tại Hoa Kỳ phát hành và có mệnh giá bằng bảng Anh sẽ bị ảnh hưởng bởi lãi suất của Anh.\nC. Không chính xác vì mệnh giá tiền tệ của dòng tiền của trái phiếu ảnh hưởng đến\nlãi suất của quốc gia ảnh hưởng đến giá trái phiếu. Giá trái phiếu do một công ty\ncó trụ sở tại Hoa Kỳ phát hành và có mệnh giá bằng bảng Anh sẽ bị ảnh hưởng bởi lãi suất của Anh.\nThu nhập cố định: mô tả mức độ ảnh hưởng của các cân nhắc về pháp lý, quy định và thuế đến việc phát hành và\ngiao dịch chứng khoán có thu nhập cố định","qhtml":null},{"n":63,"q":"A floating-rate note makes semiannual interest payments and has a coupon rate equal to\nthe six-month market reference rate plus 45 basis points. The interest payments are made in\nJune and December. If the six-month market reference rate was 1.95% in June and 2.25% in\nDecember of the same year, the coupon rate paid in December of that year was closest to","opts":["2.40%.","2.55%.","2.70%."],"ans":"A","expl":"A. Đúng vì lãi suất áp dụng trong tháng 12 là tỷ lệ tham chiếu thị trường sáu tháng\ntrong tháng 6 cộng với biên độ 45 điểm cơ bản = 1,95% +0,45% = 2,40%.\nB. Không chính xác vì biên độ 45 điểm cơ bản được cộng vào mức trung bình của tỷ giá tham chiếu thị trường 6 tháng tháng 6 và tháng 12\n = (2,25% + 1,95% )/2+0,45% = 2,55%.\nC. Không chính xác vì biên độ 45 bps được thêm vào tỷ giá tham chiếu thị trường trong tháng 12 =\n2,25% +0,45% = 2,70%\nThu nhập cố định: tính toán và giải thích các thước đo chênh lệch lợi suất cho các công cụ lãi suất thả nổi","qhtml":null},{"n":64,"q":"An analyst observes the following price-yield relationship for an option-free bond:\nPrice per 100 of Par Value Yield to Maturity\n100.95 7.45%\n101.80 6.75%\n103.40 6.05%\nIf the bond trades at 101.80 per 100 of par value, its approximate modified duration is closest\nto:","opts":["1.72.","2.25.","3.44."],"ans":"A","expl":"A. Đúng vì thời hạn sửa đổi gần đúng của trái phiếu được tính như sau:\nXấp xỉModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\n= (103,40 - 100,95)/(2 x 0,0070 x 101,80)\n= 2,45/1,4252 = 1,7191 ≈ 1,72.\nB. Không chính xác vì thời hạn sửa đổi gần đúng của trái phiếu được tính như sau\nXấp xỉModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\nTuy nhiên, trong trường hợp này, lợi suất cao hơn/giá thấp hơn sẽ bị loại bỏ khỏi tính toán và\nphép nhân với 2 ở mẫu số cũng được bỏ qua: = (103,40 -\n101,80)/(101,80*(6,75% - 6,05%)) = 2,2453 = 2,25.\nC. Không chính xác vì thời hạn sửa đổi gần đúng của trái phiếu được tính như sau\nXấp xỉModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\nTuy nhiên, trong trường hợp này, số 2 bị lược bỏ khỏi mẫu số.\n= (103,40-100,95)/(0,0070 × 101,80)\n= 2,45/0,7126 = 3,4381 ≈ 3,44.\nThu nhập cố định: xác định, tính toán và giải thích thời hạn đã sửa đổi, thời hạn tiền và thời hạn\ngiá trị của một điểm cơ bản (PVBP)","qhtml":null},{"n":65,"q":"An analyst gathers the following information about a bond which is currently trading at\n95.35 per 100 par\nBenchmark Yield Bond Price\n3.50% 99.50\n4.00% 95.35\n4.50% 92.25\nThe effective duration of the bond is closest to:","opts":["6.5.","7.6.","8.7"],"ans":"B","expl":"A. Không chính xác vì thời lượng hiệu quả được tính toán không chính xác là\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )] = (95,35-92,25)/(0,005 × 95,35) = 6,50.\n0 + 0\nB. Đúng vì thời hạn hiệu lực của trái phiếu là độ nhạy cảm của giá trái phiếu với sự thay đổi\ntrong đường cong lợi suất chuẩn.\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )]\n− + 0\nVới 𝑃𝑉 = 95,35, 𝑃𝑉 = 99,50, 𝑃𝑉 = 92,25,\n0 − +\nEffDur= (99,50 - 92,25)/(2 x 0,005 x 95,35) = 7,60\nC. Không chính xác vì thời lượng hiệu quả được tính toán không chính xác là\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )] = (99,50 - 95,35)/(0,005 x 95.35) = 8,70\n− + 0\nThu nhập cố định: giải thích tại sao thời lượng hiệu dụng và độ lồi hiệu quả là những thước đo thích hợp nhất\nvề rủi ro lãi suất đối với trái phiếu có quyền chọn kèm theo","qhtml":"<p>An analyst gathers the following information about a bond which is currently trading at 95.35 per 100 par:</p><table class=\"qtable\"><thead><tr><th>Benchmark Yield</th><th>Bond Price</th></tr></thead><tbody><tr><td>3.50%</td><td>99.50</td></tr><tr><td>4.00%</td><td>95.35</td></tr><tr><td>4.50%</td><td>92.25</td></tr></tbody></table><p>The effective duration of the bond is closest to:</p>"},{"n":66,"q":"An analyst gathers the following information about a bond:\nPar value 100\nCoupon rate 5.50%\nCoupon frequency Annual\nTime to maturity 5 years\nHolding period 3 years\nIf the market discount rate is 4.75% for the holding period, the future value of reinvested\ncoupons at the end of the holding period is closest to:","opts":["15.05.","17.30.","18.12."],"ans":"B","expl":"A. Không chính xác vì 4,75% được sử dụng làm lãi suất phiếu giảm giá và 5,50% làm lãi suất tái đầu tư,\ndẫn đến (4,75 x 1,0550^2) + (4,75 x 1,0550) + 4,75 = 15,0481 ≈ 15,05.\nLãi suất là lãi suất mà tại đó phiếu giảm giá các khoản thanh toán được tái đầu tư và tỷ lệ chiết khấu\nthị trường tại thời điểm mua và tại thời điểm bán nếu trái phiếu không được giữ đến\nngày đáo hạn.\nB. Đúng vì phiếu giảm giá đầu tiên được tái đầu tư ở mức 4,75% trong hai năm, phiếu giảm giá thứ hai\nđược tái đầu tư ở mức 4,75% trong một năm và phiếu giảm giá thứ ba vẫn chưa được tái đầu tư.\n(5,50 × 1,0475^2)+(5,50×1,0475) + 5,50 = 17 2962 ≈ 17 30.\nLãi suất là tỷ lệ mà các khoản thanh toán lãi được tái đầu tư và tỷ lệ chiết khấu thị trường\ntại thời điểm mua và tại thời điểm bán nếu trái phiếu không được giữ đến\nngày đáo hạn.\nC. Không chính xác vì các phiếu giảm giá được coi là đã được tái đầu tư trong 3 năm, 2 năm,\nvà 1 năm, tương ứng, dẫn đến (5,50 x 1,0475^3)+(5,50 x 1,0475 ^2)+(5,50 x 1,0475) =\n18.1177 ≈ 18.12.\nLãi suất là tỷ lệ mà các khoản thanh toán lãi suất được tái đầu tư và tỷ lệ chiết khấu thị trường\ntại thời điểm mua và tại thời điểm bán nếu trái phiếu không được giữ đến\nngày đáo hạn.\nThu nhập cố định: tính toán và giải thích các nguồn lợi nhuận từ việc đầu tư vào lãi suất cố định\ntrái phiếu;","qhtml":null},{"n":67,"q":"Bonds are quoted using the:","opts":["full price and settled using the flat price.","flat price and settled using the full price.","\"dirty\" price and settled using the invoice price."],"ans":"B","expl":"A. Không chính xác vì giá cố định thường được các nhà kinh doanh trái phiếu niêm yết. Nếu giao dịch diễn ra,\ntiền lãi tích lũy sẽ được thêm vào giá cố định để có được toàn bộ giá mà người mua đã thanh toán và\nngười bán nhận được vào ngày thanh toán.\nB. Đúng vì giá cố định thường được các nhà kinh doanh trái phiếu niêm yết. Nếu giao dịch diễn ra,\ntiền lãi tích lũy sẽ được thêm vào giá cố định để có được toàn bộ giá mà người mua đã thanh toán và\nngười bán nhận được vào ngày thanh toán.\nC. Không chính xác vì giá cố định thường được các nhà kinh doanh trái phiếu niêm yết. Nếu giao dịch diễn ra,\ntiền lãi tích lũy sẽ được thêm vào giá cố định để có được toàn bộ giá mà người mua đã trả và\nngười bán nhận được vào ngày thanh toán\" và toàn bộ giá còn được gọi là hóa đơn hoặc\ngiá 'bẩn'.\nThu nhập cố định: tính giá trái phiếu dựa trên lãi suất đến ngày đáo hạn trên hoặc giữa phiếu giảm giá\nngày","qhtml":null},{"n":68,"q":"Which of the following does not depend on the market discount rate? A bond's:","opts":["flat price","full price","accrued interest"],"ans":"C","expl":"A. Không chính xác vì giá cố định bị ảnh hưởng bởi sự thay đổi tỷ lệ chiết khấu thị trường\nB. Không chính xác vì giá cố định bị ảnh hưởng bởi sự thay đổi tỷ lệ chiết khấu thị trường và\nnếu giá cố định bị ảnh hưởng bởi tỷ lệ chiết khấu thị trường thì giá đầy đủ cũng vậy (vì giá đầy đủ bằng\ngiá cố định cộng với lãi tích lũy).\nC. Đúng vì phần lãi tích lũy của toàn bộ giá không phụ thuộc vào lãi suất-\nđến ngày đáo hạn.\nThu nhập cố định: tính giá của trái phiếu dựa trên lãi suất đến ngày đáo hạn vào hoặc giữa phiếu giảm giá\nngày","qhtml":null},{"n":69,"q":"An investor determines the following information about the price sensitivity of an option-\nfree bond:\nRate Change Price\n75 basis point increase 104.0\n75 basis point decrease 108.5\nIf the current price is 106, the duration of this bond is closest to:","opts":["2.1.","2.8.","3.0."],"ans":"B","expl":"A. Không chính xác vì nó sử dụng 100 bps thay vì 75bps trong mẫu số\nThời lượng ≠ 108,5 - 104\n2 × 106 x 0,0100 ≠ 2,12 hoặc 2,1\nB. Đúng vì công thức sau ước tính phần trăm thay đổi gần đúng của giá\nđối với thay đổi 100 điểm cơ bản về lợi suất (thời lượng) là\nThời lượng = Giá nếu lợi suất giảm - Giá nếu lợi suất tăng\n2 x (giá ban đầu) x (thay đổi lợi nhuận ở định dạng thập phân)\n= 108.5 - 104\n2 x 106 x 0,0075\n= 4,5\n1,59\n= 2,83 hoặc 2,8\nC. Không chính xác vì nó sử dụng mệnh giá thay vì giá trị thị trường trong mẫu số\nThời lượng ≠ 108,5 - 104\n2 x 100 x 0,0075 ≠ 3,0\nThu nhập cố định: xác định, tính toán và diễn giải thời hạn được sửa đổi, thời hạn tiền và giá trị\ncủa một điểm cơ bản (PVBP)","qhtml":null},{"n":70,"q":"The number of common shares a convertible bond can be converted into is the:","opts":["conversion ratio.","conversion price.","conversion value."],"ans":"A","expl":"A. Đúng vì tỷ lệ chuyển đổi là số lượng cổ phiếu phổ thông mà mỗi trái phiếu\ncó thể được chuyển đổi thành.\nB. Không chính xác vì giá chuyển đổi là giá trên mỗi cổ phiếu mà tại đó trái phiếu chuyển đổi\ncó thể được chuyển đổi thành cổ phiếu.\nC. Không chính xác vì giá trị chuyển đổi, đôi khi được gọi là giá trị ngang bằng, là\ngiá cổ phiếu hiện tại nhân với tỷ lệ chuyển đổi.\nThu nhập cố định: mô tả cấu trúc dòng tiền chung của các công cụ thu nhập cố định và\ncác điều khoản dự phòng về dòng tiền mặt tương phản có lợi cho tổ chức phát hành và nhà đầu tư","qhtml":null},{"n":71,"q":"A credit card receivable asset-backed security most likely.","opts":["faces high prepayment risk.","uses fully-amortizing loans as collateral.","reinvests principal repayments during the lockout period."],"ans":"C","expl":"A. Không chính xác vì khoản vay không khấu hao không liên quan đến các khoản hoàn trả vốn gốc\ntheo lịch trình, ABS được hỗ trợ bởi các khoản vay không khấu hao không bị ảnh hưởng bởi rủi ro thanh toán trước.\nABS phải thu bằng thẻ tín dụng là một ví dụ về ABS được hỗ trợ bởi các khoản vay không khấu hao\nB. Không chính xác vì khoản vay không khấu hao không liên quan đến việc trả nợ gốc\ntheo lịch trình, ABS được hỗ trợ bởi các khoản vay không khấu hao không bị ảnh hưởng bởi rủi ro trả trước.\nABS phải thu bằng thẻ tín dụng là một ví dụ về ABS được hỗ trợ bởi các khoản vay không khấu hao.\nC. Đúng vì tài sản thế chấp của thẻ tín dụng ABS phải thu là một nhóm các khoản vay\nkhông khấu hao. Các khoản vay này có thời hạn khóa, trong đó dòng tiền được thanh toán cho\nngười nắm giữ chứng khoán chỉ dựa trên các khoản phí và phí tài chính thu được. Khi thời gian khóa\nkết thúc, số tiền gốc được chủ thẻ hoàn trả sẽ không còn được tái đầu tư mà\nthay vào đó được phân phối cho các nhà đầu tư.\nThu nhập cố định: mô tả các loại và đặc điểm của chứng khoán không thế chấp được đảm bảo bằng tài sản,\nbao gồm dòng tiền và rủi ro của từng loại","qhtml":null},{"n":72,"q":"An analyst gathers the following information about a bond currently trading at par.\nChange in Benchmark Curve Price per 100 of Par Value\n+25 bps 98\n-25 bps 103\nThe effective duration of this bond is closest to:","opts":["2.5.","5.0.","10.0."],"ans":"C","expl":"A. Không chính xác vì nó bỏ qua sự thay đổi điểm cơ sở x 100 trong phép tính.\nThời hạn hiệu lực ≠ (𝑃𝑉 )−(𝑃𝑉 )/2 = (103 - 98)/2 = 2,5\n− +\nB. Không chính xác vì đó là sự chênh lệch về giá (103-98 = 5).\nC. Đúng vì thời hạn hiệu lực được tính như (𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝐶𝑢𝑟𝑣𝑒)∗\n− +\n𝑃𝑉 ) trong đó: 𝑃𝑉 = giá trái phiếu khi lãi suất chuẩn giảm, 𝑃𝑉 = giá trái phiếu\n0 + 0\n khi lợi suất chuẩn tăng và PV, sau đó là giá trái phiếu hiện tại.\nThời hạn hiệu lực = (103-98)/(2 * 0,0025 × 100) = 10.\nThu nhập cố định: giải thích tại sao thời hạn hiệu lực và hiệu lực độ lồi là\nbiện pháp thích hợp nhất để đo lường rủi ro lãi suất đối với trái phiếu có quyền chọn kèm theo","qhtml":null},{"n":73,"q":"An analyst gathers the following spot and forward rates:\n2-year spot rate 1.0%\n4-year spot rate 2.5%\n4-year forward rate, two years from today 3.0%\nThe 2-year forward rate, four years from today is closest to:","opts":["2%.","3%.","4%."],"ans":"A","expl":"A. Đúng vì công thức chung cho mối quan hệ giữa hai tỷ giá giao ngay và\ntỷ giá kỳ hạn ngụ ý là (1+𝑍 )𝐴 * (1+𝐼𝐹𝑅 )𝐵−𝐴 = (1+𝑍 )𝐵𝑛 trong đó z, là x-\n𝐴 𝐴.𝐵−𝐴 𝐵\ntỷ giá giao ngay năm và IFR là tỷ giá kỳ hạn y năm, x năm kể từ bây giờ. Bằng cách sử dụng công thức, tỷ giá giao ngay 6\nnăm có thể được tính theo hai cách khác nhau:\nX\n1. Sử dụng A = 2, B=6 : (1 + z )6 = (1 + z )2 × (1+ IFR )4\n6 2 2,4\n2. Sử dụng A = 4, B = 6: (1 + z )6 = (1 + Z ) × (1+IFR )2\n6 4 4,2\nSo sánh hai số ta có: (1+z2)2 x (1 + IFR )4 = (1 + z )4 × (1+ IFR )2. Sử dụng các số\n2,4 4 4,2\ntừ thân:\n(1+0,01)2 × (1+0,03)4=(1+0,025)4 × (1+IFR )4\n4,2\n1,0201 x 1,1255 = 1,1038 × (1+ IFR )2\n4,2\nIFR =(1,1481/1,1038)0,5-1=0,0199~2%.\n4,2\nB. Không chính xác vì thay vì sử dụng công thức về mối quan hệ giữa tỷ giá giao ngay\nvà tỷ giá kỳ hạn ngụ ý, ứng viên giả định rằng tỷ giá kỳ hạn 2 năm, 4 năm\nkể từ hôm nay bằng tỷ giá kỳ hạn 4 năm, 2 năm kể từ hôm nay.\nC. Không chính xác vì khi tính IFR ở bước cuối cùng, ứng viên quên lấy\ncăn bậc hai IFR ≠1.1481/1.1038-1 = 0,0401 ≈ 4%.\n4,2\nThu nhập cố định: xác định tỷ giá ngang giá và tỷ giá kỳ hạn, đồng thời tính tỷ giá mệnh giá, tỷ giá kỳ hạn từ giao ngay\ntỷ giá, tỷ giá giao ngay từ tỷ giá kỳ hạn và giá trái phiếu sử dụng tỷ giá kỳ hạn","qhtml":null},{"n":74,"q":"A bond issuer has a credit rating of BBB. Based only on this information, the rating of a\nsenior unsecured bond from this issuer is most likely to be:","opts":["lower than BBB.","BBB","higher than BBB."],"ans":"B","expl":"A. Không chính xác vì như đã lưu ý trong phần cơ bản cho câu trả lời đúng, xếp hạng tín dụng của tổ chức phát hành\nthường áp dụng cho khoản nợ không có bảo đảm cao cấp.\nB. Đúng vì xếp hạng tín dụng của tổ chức phát hành thường áp dụng cho khoản nợ không có bảo đảm cấp cao của tổ chức đó.\nC. Không chính xác vì như đã lưu ý trong cơ sở lý luận cho câu trả lời đúng, xếp hạng tín dụng của tổ chức phát hành\nthường áp dụng cho khoản nợ không có bảo đảm cao cấp.\nThu nhập cố định: mô tả thứ hạng thâm niên của nợ, nợ có bảo đảm so với nợ không có bảo đảm và\nmức độ ưu tiên của các khiếu nại khi phá sản và tác động của chúng đối với xếp hạng tín dụng","qhtml":null},{"n":75,"q":"An analyst gathers the following information about a zero-coupon bond:\nTime to maturity 5 years\nAnnual convexity 28.835\nAnnual yield to maturity 2%\nIf the yield decreases by 1%, the bond's percentage change in price is closest to:","opts":["4.76%.","5.05%.","5.14%."],"ans":"B","expl":"A. Không chính xác vì việc điều chỉnh độ lồi bị trừ đi thay vì được cộng vào.\nPhần trăm thay đổi về giá không bằng -4,901961*-0,01- (0,5 * 28,835* -\n0,014)=0,04901961 -0,0014418 = 4,757781%, được làm tròn thành 4,76%.\nB. Đúng vì thời hạn Macaulay của trái phiếu không trả lãi định kỳ là thời gian đáo hạn và\nthời hạn được sửa đổi là thống kê thời hạn Macaulay chia cho một cộng với lợi tức mỗi kỳ\nỞ đây, thời hạn đã sửa đổi = 5 / 1,02 = 4,901961\nDo đó, phần trăm thay đổi về giá = -4,901961* -0,01 + (0,5*28,835* -0,012) =\n0,04901961 + 0,0014418 = 5,04614%, làm tròn thành 5,05%.\nC. Không chính xác vì việc điều chỉnh độ lồi được áp dụng cho thời lượng Macaulay thay vì\nso với thời lượng đã sửa đổi. Phần trăm thay đổi về giá không bằng -5* -0,01+\n(0,5*28,835 - 0,012) = 0,05 +0,0014418 = 5,14418%, được làm tròn thành 5,14%.\nThu nhập cố định: tính phần trăm thay đổi giá của trái phiếu đối với một thay đổi được chỉ định trong\nlợi suất, với thời hạn của trái phiếu và Độ lồi","qhtml":null},{"n":76,"q":"The Macaulay duration of a zero-coupon bond is most likely.","opts":["less than the time to maturity.","equal to the time to maturity.","greater than the time to maturity."],"ans":"B","expl":"A. Không chính xác vì thời hạn Macaulay của trái phiếu không trả lãi định kỳ bằng với thời gian đến khi đáo hạn\n, không nhỏ hơn thời gian đến khi đáo hạn.\nB. Đúng vì thời hạn Macaulay của trái phiếu không trả lãi định kỳ là thời gian đáo hạn của nó.\nC. Không chính xác vì thời hạn Macaulay của trái phiếu không trả lãi định kỳ bằng thời gian đáo hạn\n, không lớn hơn thời gian đến ngày đáo hạn.\nThu nhập cố định: xác định, tính toán và giải thích thời hạn Macaulay","qhtml":null},{"n":77,"q":"US municipal bonds are best described as:","opts":["agency bonds.","non-sovereign bonds.","quasi-government bonds."],"ans":"B","expl":"A. Không chính xác vì các cơ quan chính phủ là các cơ quan gần như chính phủ phát hành nợ để\nđể tài trợ cho việc cung cấp hàng hóa hoặc dịch vụ công cụ thể do chính phủ tài trợ\ndựa trên luật pháp quốc gia hoặc địa phương. Điều này có thể liên quan đến việc tài trợ cho các hoạt động cụ thể\nđược chính phủ thúc đẩy hoặc vận hành cơ sở hạ tầng cần thiết theo quy định của\nluật. Trái phiếu do các cơ quan này phát hành được gọi là trái phiếu hoặc cơ quan gần như chính phủ\ntrái phiếu\nB. Đúng vì các loại tổ chức phát hành chính phủ không có chủ quyền chính bao gồm các cơ quan,\nngân hàng đại chúng siêu quốc gia và chính quyền khu vực Người kiểm tra Chính phủ tái cấp. Những\nbao gồm các chính quyền cấp tỉnh, tiểu bang, ama incal, được gọi là các khu vực thành phố ở Hoa Kỳ và\nthường là trái phiếu chính quyền địa phương ở những nơi khác trong phạm vi Khu vực tài phán có chủ quyền cụ thể\nC. Không chính xác vì các cơ quan chính phủ là các cơ quan gần như chính phủ phát hành nợ\nđể tài trợ cho các khoản cung cấp do chính phủ tài trợ đối với hàng hóa công cụ thể hoặc quyền điều hành dựa trên\ntheo luật quốc gia hoặc luật pháp địa phương. Điều này có thể liên quan đến việc tài trợ cho công ty quảng bá hàng không snet 50 bởi\nnhà xuất bản của công ty xổ số cần thiết, nó được tạo ra bởi than Timi cô gái được tin cậy\nbởi các cơ quan này giống như các tổ hợp hai mặt tìm kiếm hoặc gần như trái phiếu\nThu nhập cố định: các lựa chọn tìm kiếm theo chủ quyền và tiền tệ các chính phủ, gần như-\ngovamenteobusa và các cơ quan siêu quốc gia","qhtml":null},{"n":78,"q":"A bond portfolio consists of the following option-free annual-pay coupon bonds:\nBond 1 Bond 2\nPar value $300,000 $450,000\nMarket value $200,000 $400,000\nYield to maturity 4% 3%\nMacaulay duration 7.5 5.4\nThe modified duration of this portfolio is closest to:","opts":["5.9.","6.0.","6.1."],"ans":"A","expl":"A. Đúng vì Macaulay và thời hạn sửa đổi cho danh mục đầu tư được tính bằng\ntrung bình có trọng số của số liệu thống kê cho từng trái phiếu riêng lẻ. Tỷ trọng của tổng giá trị thị trường danh mục đầu tư\nlà trọng số.\nĐầu tiên, chúng tôi tính toán thời hạn sửa đổi (ModDur) của từng trái phiếu bằng công thức\nbên dưới\nModDur = MacDur / (1+r)\nModDur của Trái phiếu 1 = 7,5/(1+4%) = 7.211538\nModDur của Trái phiếu 2 = 5,4/(1+3%) = 5,242718.\nTiếp theo, chúng tôi tính toán trọng số cho từng trái phiếu dựa trên giá trị thị trường như sau:\nTrọng lượng của Trái phiếu 1 = 200.000 USD / 200.000 USD + 400.000 USD) = 0,333333\nTrọng lượng của Trái phiếu 2 = 400.000 USD / ($200.000 + 400.000 USD) = 0,666667\nThời hạn được sửa đổi của danh mục đầu tư = (Trọng lượng cho Trái phiếu 1 x ModDur của Trái phiếu 1) + (Trọng lượng cho\nLiên kết 2 x ModDur của Liên kết 2) = (0,333333 7,211538) + (0,666667 x 5,242718)= 5,898992 ≈\n5,9.\nB. Không chính xác vì trọng số dựa trên mệnh giá được sử dụng.\nTrọng lượng của Trái phiếu 1≠ $300.000/ ($300.000+ $450.000) = 0,4\nTrọng lượng của Trái phiếu 2≠ $450.000/ ($300.000+ $450.000) = 0,6\nThời hạn đã sửa đổi của danh mục đầu tư (0,4 x 7,211538) + (0,6 x 5,242718)=6,030246 ≈ 6,0.\nC. Không chính xác vì nó sử dụng thời hạn Macaulay thay vì thời hạn đã sửa đổi cho\ntrái phiếu riêng lẻ và thể hiện thời hạn Macaulay của danh mục đầu tư.\nThời hạn đã sửa đổi của danh mục Thời hạn Macaulay của danh mục đầu tư = (0,333333 x 7,5) +\n(0,666667 × 5,4) = 6,099999 ≈ 6.1.\nThu nhập cố định: tính toán thời hạn và độ lồi của danh mục đầu tư, đồng thời giải thích những hạn chế của các thước đo này","qhtml":"<p>A bond portfolio consists of the following option-free annual-pay coupon bonds:</p><table class=\"qtable\"><thead><tr><th></th><th>Bond 1</th><th>Bond 2</th></tr></thead><tbody><tr><td>Par value</td><td>$300,000</td><td>$450,000</td></tr><tr><td>Market value</td><td>$200,000</td><td>$400,000</td></tr><tr><td>Yield to maturity</td><td>4%</td><td>3%</td></tr><tr><td>Macaulay duration</td><td>7.5</td><td>5.4</td></tr></tbody></table><p>The modified duration of this portfolio is closest to:</p>"},{"n":79,"q":"An analyst gathers the following information about forward rates:\nTime Period Forward Rate\n0y1y 1%\n1y1y 2%\n2y1y 4%\nUsing only this information, the price per 100 of par value of a 3-year, 1% annual coupon\nbond is closest to:","opts":["84.05.","91.74.","96.23."],"ans":"C","expl":"A. Không chính xác vì mỗi mẫu số được nâng lên lũy thừa của năm tương ứng.\nPV ≠ PMT/ (1 +0y1y) + PMT/ (1+0y1y x 1y1y)2 + (PMT + FV)/(1+0y1y x 1y1y x 2y1y)3\nPV ≠ 1/(1+1%) + 1/((1+1%) (1 + 2% ))2 + (1+100)/((1+1%) (1+2%) (1 + 4% ) )3 = 0,9901+0,9422\n+82,1215 = 84,0538, được làm tròn thành 84,05.\nB. Không chính xác vì tỷ giá kỳ hạn được sử dụng trực tiếp như tỷ giá giao ngay. Do đó,\nPV ≠ PMT / (1 + Z )1 + PMT / (1 + Z )2 + ... + (PMT + FV) / (1 + Z )N\n1 2 N\nPV ≠ 1/(1+1%)1 +1 / (1 +2%)2 + (1 + 100)/(1+4%)3 = 0,9901 +0,9612 +89,7886 = 91,7399,\nđược làm tròn thành\n91,74.\nC. Đúng vì trung bình hình học của tỷ giá kỳ hạn cho chúng ta tỷ giá giao ngay (tức là\n(0y1y x 1y1y) = (1 + Z )2, (0y1y x 1y1y x 2y1y) = (1 + Z )3)), do đó giá của trái phiếu sử dụng\n2 3\ntỷ giá kỳ hạn có thể được tính bằng cách sử dụng: PV = PMT / (1 + Z )1 + PMT / (1 + Z )2+. + (PMT +\n1 2\nFV)/(1+Z )N trong đó 𝑍 = lãi suất giao ngay, hoặc lãi suất không trả lãi, hoặc lãi suất bằng 0, cho Giai đoạn 1, 𝑍 =\nN 1 2\ntỷ giá giao ngay, hoặc lãi suất không trả lãi, hoặc lãi suất bằng 0, cho Giai đoạn 2, 𝑍 = tỷ giá giao ngay, hoặc lãi suất phiếu giảm giá bằng 0-\n𝑁\n, hoặc lãi suất bằng 0, cho Kỳ N.\nPV> = PMT / (1 +0y1y) + PMT / (1 + 0y1y x 1y1y) + (PMT + FV) / (1 +0y1y x 1y1y x 2y1y)\nPV = 1 / (1 +1%) + 1/((1+1%) (1+2%)) + (1 + 100)/((1+1%) (1+2%) (1+4%) = 0,9901+0,9707\n+94,2685 = 96,2293, được làm tròn thành 96.23.\nThu nhập cố định: xác định tỷ giá ngang bằng và tỷ giá kỳ hạn, đồng thời tính tỷ giá mệnh giá, tỷ giá kỳ hạn từ tỷ giá giao ngay\n, tỷ giá giao ngay từ tỷ giá kỳ hạn và giá trái phiếu sử dụng tỷ giá kỳ hạn","qhtml":null},{"n":80,"q":"With respect to interest rate risk, an investor who sells a fixed-rate bond after the first\ncoupon is received and before its maturity is exposed to:","opts":["market price risk, only.","coupon reinvestment risk, only","both market price risk and coupon reinvestment risk."],"ans":"C","expl":"A. Không chính xác vì những thay đổi về lãi suất làm thay đổi giá trị tương lai của khoản thanh toán phiếu lãi tái đầu tư\n. Do đó, nhà đầu tư cũng phải đối mặt với rủi ro tái đầu tư phiếu giảm giá.\nB. Không chính xác vì nhà đầu tư sẽ bán trái phiếu trước khi đáo hạn và đối mặt với rủi ro\nrằng nó sẽ được bán với giá cao hơn hoặc thấp hơn (rủi ro giá thị trường).\nC. Đúng vì nhà đầu tư phải đối mặt với rủi ro tái đầu tư phiếu giảm giá đối với tất cả phiếu giảm giá nhận được\n(phiếu giảm giá đầu tiên cộng với bất kỳ phiếu giảm giá nào khác cho đến khi bán) và cũng phải đối mặt với rủi ro về giá thị trường do những thay đổi về\nlãi suất sẽ ảnh hưởng đến giá bán trái phiếu.\nRủi ro tái đầu tư phiếu giảm giá quan trọng hơn khi nhà đầu tư có tầm nhìn dài hạn liên quan đến thời gian đáo hạn của trái phiếu. Ví dụ: một nhà đầu tư mua và giữ chỉ có rủi ro tái đầu tư phiếu giảm giá\n. Rủi ro giá thị trường quan trọng hơn khi nhà đầu tư có khoảng thời gian\nngắn hạn so với thời gian đáo hạn. Ví dụ: nhà đầu tư bán trái phiếu trước\nnhận được phiếu lãi đầu tiên chỉ gặp rủi ro về giá thị trường.\nThu nhập cố định: tính toán và giải thích các nguồn lợi nhuận từ việc đầu tư vào trái phiếu\ncó lãi suất cố định;","qhtml":null},{"n":81,"q":"For an option-free fixed-rate corporate bond, the duration and convexity statistics are\nmost likely relevant for a change in:","opts":["the credit spread only.","the benchmark yield only","both the credit spread and the benchmark yield.]"],"ans":"C","expl":"A. Không chính xác vì lợi tức đến ngày đáo hạn của trái phiếu doanh nghiệp bao gồm lợi suất chuẩn\ncủa chính phủ và chênh lệch, sự thay đổi về lợi tức đến ngày đáo hạn của trái phiếu có thể bắt nguồn từ\nmột trong hai thành phần hoặc sự kết hợp của cả hai. Điểm mấu chốt là đối với một trái phiếu có lãi suất cố định\nkhông có quyền chọn, số liệu thống kê về thời lượng và độ lồi tương tự áp dụng cho sự thay đổi trong\nlợi suất chuẩn cũng áp dụng cho sự thay đổi trong chênh lệch\nB. Không chính xác vì lợi tức đến ngày đáo hạn của trái phiếu doanh nghiệp bao gồm lợi suất chuẩn\ncủa chính phủ và sự thay đổi chênh lệch về lợi suất đến ngày đáo hạn của trái phiếu có thể bắt nguồn từ\nmột trong hai thành phần hoặc sự kết hợp của cả hai. Điểm mấu chốt là đối với trái phiếu có lãi suất cố định\nkhông có quyền chọn, số liệu thống kê về thời lượng và độ lồi giống nhau áp dụng cho thay đổi điểm chuẩn\nlợi nhuận cũng áp dụng cho sự thay đổi về chênh lệch giá.\nC. Đúng vì điểm mấu chốt là đối với trái phiếu có lãi suất cố định không có quyền chọn, số liệu thống kê\nthời gian và độ lồi tương tự áp dụng cho sự thay đổi về lợi suất chuẩn cũng áp dụng cho\nthay đổi về chênh lệch lãi suất.\nThu nhập cố định: mô tả các yếu tố kinh tế vĩ mô, thị trường và nhà phát hành cụ thể ảnh hưởng đến\nmức độ và sự biến động của chênh lệch lãi suất","qhtml":null},{"n":82,"q":"An analyst gathers the following information about a callable bond that pays interest\nannually:\nCurrent price 105 per 100 of par value\nTime-to-maturity 4 years\nCoupon rate 4%\nCall price at year 2 103 per 100 of par value\nCall price at year 3 101 per 100 of par value\nThis bond's yield to worst is the:","opts":["yield to maturity.","yield to first call.","yield to second call."],"ans":"C","expl":"A. Không chính xác vì lợi suất đến ngày đáo hạn, 𝑟 là : 105 = 4/(1 + r )1 + 4/(1 + r )2 + 4/(1 +\n𝑦𝑡𝑚 ytm ytm\nr )3 + 104/(1 + r )4\nytm ytm\nSử dụng máy tính tài chính với N = 4, PV=-105, FV = 100, PMT=4 và giải I, 𝑟 =\n𝑦𝑡𝑚\n2,6656% ≈ 2,7%. Mặc dù thấp hơn lợi nhuận của cuộc gọi đầu tiên là 2,9%, nhưng YTM lớn hơn (tốt hơn)\nso với lợi nhuận của cuộc gọi thứ hai là 2,6%, khiến lợi nhuận của cuộc gọi thứ hai trở nên tệ nhất.\nB. Không chính xác vì lợi suất cuộc gọi đầu tiên, r, là: 105 = 4/(1+r)^1+ (4+103)/(1+r)^2\nSử dụng máy tính tài chính với N = 2, PV=-105, FV = 103, PMT 4 và giải I, r₁ =\n2.8706% ≈ 2,9%. Lợi nhuận này lớn hơn (tốt hơn) so với cả lợi nhuận cho lệnh gọi thứ hai là 2,6%\n(là mức thấp nhất hoặc tệ nhất) và YTM là 2,7%,\nC. Đúng vì mức thấp nhất trong chuỗi lợi suất thu hồi và lợi tức đến ngày đáo hạn được\nđược gọi là lợi suất đến mức tệ nhất. Trình tự lợi tức của trái phiếu như sau:\nLợi suất đến ngày đáo hạn, Tem được tính bằng cách giải phương trình này: 105 = 4/(1\n+r )1+4/(1+г )2+4/(1+r )3 + 104/(1 + r )4\nytm yem yem ytm\nSử dụng máy tính tài chính với N = 4, PV=-105, FV = 100, PMT=4 và giải I, 𝑟 =\n𝑦𝑡𝑚\n2,6656% ≈ 2,7%.\nLợi nhuận cho cuộc gọi đầu tiên, r, được tính bằng giải phương trình này: 105 = 4/(1+r )1+ (4+103)/(1+r )2\n1 1\nSử dụng máy tính tài chính với N = 2, PV=-105, FV = 103, PMT=4 và giải tìm 1, r =\n2,8706% ≈ 2,9%.\nHiệu suất cuộc gọi theo giây, r, được tính bằng cách giải phương trình này: 105 = 4/(1 + r )1 +\n2\n4/(1+r )2+(4+101)/(1+r )3Sử dụng máy tính tài chính với N = 3, PV=-105, FV = 101, PMT=4\n2 2\nvà giải I, r2 = 2,5718% ≈ 2,6%.\nDo đó, lợi suất đến mức tệ nhất bằng với lợi nhuận theo giây.\nThu nhập cố định: so sánh, tính toán và diễn giải các thước đo lợi nhuận và chênh lệch lợi nhuận cho cố định-\ntrái phiếu lãi suất","qhtml":null},{"n":83,"q":"An analyst gathers the following information about three option-free bonds, each trading\nat a premium:\nCoupon Yield to Maturity Time to Maturity\nBond 1 4% 4% 10 years\nBond 2 4% 5% 11 years\nBond 3 5% 5% 9 years\nAll else being equal, the bond with the lowest Macaulay duration is most likely.","opts":["Bond 1.","Bond 2.","Bond 3."],"ans":"C","expl":"A. Không chính xác vì thống kê thời hạn Macaulay và thời hạn đã sửa đổi cho trái phiếu có lãi suất cố định\nphụ thuộc chủ yếu vào lãi suất trái phiếu, lãi suất đến ngày đáo hạn và thời gian đáo hạn. Cao hơn\nlãi suất trái phiếu hoặc lợi suất đến ngày đáo hạn cao hơn sẽ làm giảm các thước đo về thời hạn. Thời gian đến hạn dài hơn\nsự trưởng thành thường dẫn đến thời hạn cao hơn. Nó luôn luôn như vậy đối với một trái phiếu có giá cao hơn\nhoặc theo mệnh giá. Trái phiếu 1 có lãi suất thấp hơn Trái phiếu 3, lãi suất đến ngày đáo hạn thấp hơn và\nthời gian đáo hạn dài hơn. Do đó, thời hạn Macaulay của Trái phiếu 1 lớn hơn Trái phiếu 3.\nB. Không chính xác vì thống kê thời hạn Macaulay và thời hạn đã sửa đổi cho trái phiếu có lãi suất cố định\nphụ thuộc chủ yếu vào lãi suất trái phiếu, lãi suất đến ngày đáo hạn và thời gian đáo hạn. Cao hơn\nlãi suất trái phiếu hoặc lãi suất đến ngày đáo hạn cao hơn sẽ làm giảm các thước đo thời hạn. Một thời gian dài hơn để-\nsự trưởng thành thường dẫn đến thời hạn cao hơn. Nó luôn luôn như vậy đối với một trái phiếu có giá cao hơn\nhoặc theo mệnh giá. Trái phiếu 2 có lãi suất thấp hơn Trái phiếu 3, cùng lợi suất đến ngày đáo hạn và\ndo đó kỳ hạn dài hơn Thời hạn Macaulay của Trái phiếu 2 lớn hơn Trái phiếu 3.\nC. Đúng vì thống kê thời hạn Macaulay và thời hạn sửa đổi cho trái phiếu có lãi suất cố định\nphụ thuộc chủ yếu vào lãi suất trái phiếu, lãi suất đến ngày đáo hạn và thời gian đáo hạn. Cao hơn\nlãi suất trái phiếu hoặc lãi suất đến ngày đáo hạn cao hơn sẽ làm giảm các thước đo thời hạn. Một thời gian dài hơn để-\nsự trưởng thành thường dẫn đến thời hạn cao hơn. Nó luôn luôn như vậy đối với một trái phiếu có giá cao hơn\nhoặc theo mệnh giá.\" Trong trường hợp này, Trái phiếu 3 có phiếu giảm giá cao hơn, tỷ suất sinh lợi bằng hoặc cao hơn\nđáo hạn và thời gian đáo hạn ngắn nhất. Do đó, nó có thời lượng Macaulay thấp nhất.\nThu nhập cố định: giải thích mức độ đáo hạn, lãi suất và lãi suất của trái phiếu ảnh hưởng đến lãi suất của nó như thế nào\nrủi ro","qhtml":"<p>An analyst gathers the following information about three option-free bonds, each trading at a premium:</p><table class=\"qtable\"><thead><tr><th></th><th>Coupon</th><th>Yield to Maturity</th><th>Time to Maturity</th></tr></thead><tbody><tr><td>Bond 1</td><td>4%</td><td>4%</td><td>10 years</td></tr><tr><td>Bond 2</td><td>4%</td><td>5%</td><td>11 years</td></tr><tr><td>Bond 3</td><td>5%</td><td>5%</td><td>9 years</td></tr></tbody></table><p>All else being equal, the bond with the lowest Macaulay duration is most likely:</p>"},{"n":84,"q":"An analyst gathers the following information about a bond:\nClean price (per 100 of par value) 114.75\nAnnual modified duration 4.8250\nMacaulay duration (years) 4.9469\nAccrued interest (per 100 of par value) 1.6250\nThe bond's money duration (per 100 of par value) is closest to:","opts":["553.67.","561.51.","575.70."],"ans":"B","expl":"A. Không chính xác vì nó nhân thời lượng đã sửa đổi với giá sạch thay vì\ngiá đầy đủ.\n4,8250 x 114,75 = 553,6688 ≈ 553,67.\nB. Đúng vì thời lượng tiền bằng tích của thời hạn đã sửa đổi và\ngiá\nGiá đầy đủ = Giá sạch + Lãi tích lũy = 114,75 + 1,625 = 116.375;\nThời hạn tiền = Thời hạn sửa đổi x Giá đầy đủ = 116,375 x 4,8250 = 561,5094 ≈ 561,51.\nThời hạn sửa đổi là thước đo phần trăm thay đổi giá của một trái phiếu khi có sự thay đổi về lợi suất đến ngày đáo hạn của nó. Một thống kê liên quan là. Thời hạn tiền của một trái phiếu là\nthước đo sự thay đổi giá theo đơn vị tiền tệ mà trái phiếu được mệnh giá.\nThời hạn tiền có thể được biểu thị trên 100 mệnh giá hoặc theo vị thế thực tế\nkích thước của trái phiếu trong danh mục đầu tư Tại Hoa Kỳ, thời hạn tiền thường được gọi là\n'thời hạn đô la 'Thời hạn tiền (MoneyDur) được tính toán. là thời hạn được sửa đổi hàng năm\nnhân với giá đầy đủ (𝑃𝑉𝐹𝑢𝑙𝑙) của trái phiếu, bao gồm cả lãi tích lũy.\nC. Không chính xác vì nó nhân giá đầy đủ với thời hạn Macaulay thay vì\nthời hạn đã sửa đổi.\nGiá đầy đủ = Giá sạch + Lãi tích lũy = 114,75 + 1,625 = 116,375,\nThời hạn ở Macau x Giá đầy đủ = 4,9469 x 116,375 = 575,6955 ≈ 575,70.\nThu nhập cố định: xác định, tính toán và diễn giải thời hạn đã sửa đổi, thời hạn tiền và giá trị\ngiá của một điểm cơ bản (PVBP)","qhtml":null},{"n":85,"q":"Effective duration is:","opts":["a useful interest rate risk measure only for bonds with embedded options.","an accurate estimate of interest rate risk only when the assumed benchmark rate change is small.","the same as the modified duration of an option-free bond only when the yield curve is perfectly flat."],"ans":"C","expl":"A. Không chính xác vì mặc dù thời hạn hiệu lực là thước đo rủi ro lãi suất\nthích hợp nhất đối với trái phiếu có quyền chọn kèm theo, nhưng nó cũng hữu ích với trái phiếu truyền thống để\nbổ sung thông tin do Macaulay cung cấp và thời hạn lợi suất được sửa đổi.\nB. Không chính xác vì cân nhắc thực tế trong việc sử dụng thời hạn hiệu quả là việc thiết lập sự thay đổi\ntrong đường cong lợi suất chuẩn. Với khoảng thời gian được sửa đổi gần đúng, độ chính xác\nđược cải thiện bằng cách chọn thay đổi lợi suất đến ngày đáo hạn nhỏ hơn. Nhưng các mô hình định giá cho các chứng khoán phức tạp hơn\n, chẳng hạn như trái phiếu có thể thu hồi và bảo đảm bằng thế chấp, bao gồm các giả định về\nhành vi của các tổ chức phát hành doanh nghiệp, doanh nghiệp hoặc chủ sở hữu nhà. Tỷ giá thường cần\nthay đổi một lượng tối thiểu để ảnh hưởng đến quyết định thu hồi trái phiếu hoặc tái cấp vốn cho khoản vay thế chấp\nvì phát hành nợ mới liên quan đến chi phí giao dịch. Do đó, ước tính rủi ro lãi suất\nsử dụng thời hạn hiệu dụng không nhất thiết phải được cải thiện bằng cách chọn một thay đổi nhỏ hơn\ntrong lãi suất chuẩn.\nC. Đúng vì thời hạn được sửa đổi và thời hạn hiệu lực của một trái phiếu không có quyền chọn chỉ giống nhau trong trường hợp hiếm hoi là đường cong lợi suất hoàn toàn bằng phẳng.\nThu nhập cố định: giải thích tại sao thời hạn hiệu dụng và độ lồi hiệu quả là những thước đo\nthích hợp nhất về rủi ro lãi suất đối với trái phiếu có các quyền chọn kèm theo","qhtml":null},{"n":86,"q":"An investor gathers the following information about a bond portfolio comprised of two\noption-free bonds:\nBond Par Value Market Value Duration\n1 $100,000 $120,000 5\n2 $200,000 $180,000 4\nThe duration of the portfolio is closest to:","opts":["4.33.","4.40.","455."],"ans":"B","expl":"A . Không chính xác vì nó tính trọng số trái phiếu theo mệnh giá.\nDP= [(100.000 ` 300.000) x 5] + [(200.000 ` 300.000) × 4]\n= (0,333 × 5) + (0,667 × 4)\n= 1,665 + 2,668\n= 4,333 = 4,33\nB. Đúng vì thời hạn của danh mục đầu tư là trung bình có trọng số (theo giá trị thị trường) của\nthời hạn của trái phiếu trong danh mục đầu tư.\nThời hạn của danh mục đầu tư = [(120.000 ` 300.000) x 5] + [(180.000 ` 300.000) × 4]\n= (0,4 x 5)+(0,6 × 4)\n= 2,00 +2,40\n= 4,40\nC. Không chính xác vì nó tính trọng số của trái phiếu theo thời hạn của chúng.\nDP= [(5 9) x 5] + [(4 9) x 4)]\n= 2.777 +1.777\n= 4.5544.55\nThu nhập cố định: tính toán thời hạn và độ lồi của danh mục đầu tư và giải thích những hạn chế của những điều này\ncác biện pháp","qhtml":null},{"n":87,"q":"An analyst gathers the following information about a bond that pays interest annually:\nCoupon rate 4%\nTime-to-maturity 3 years\nPar value $100,000\nIf the market discount rate is 5%, the market value of this bond is closest to:","opts":["$89,839.","$97,277.","$102,775."],"ans":"B","expl":"A. Không chính xác vì theo cơ sở giải thích cho câu trả lời đúng, giá của trái phiếu\ngần nhất là 97.277 USD. Câu trả lời sai này được đưa ra bằng cách bỏ qua các khoản thanh toán lãi coupon cho\nnăm 1 & 2:\nGiá trái phiếu ≠ 104.000/(1+5% )3 = 89.839.11025 ≈ 89.839.\nB. Đúng vì giá trái phiếu là giá trị hiện tại của dòng tiền hứa hẹn và\nđược tính như sau:\nGiá trái phiếu = 4.000/ (1 +5%)1 + 4.000 / (1+5% )² + 104.000 / (1+5%)3 = 3.809.5238 +\n3.628.1179 + 89.839.1102 = 97.276.7520 ≈ 97.277. Dữ liệu đầu vào của máy tính: FV = 100.000, I =\n10,05, N = 3, PMT = 4.000, PV = 97.276,75 ≈ 97,277.\nC. Không chính xác vì theo cơ sở giải thích cho câu trả lời đúng, giá của trái phiếu\ngần nhất là 97.277 USD. Câu trả lời sai này được đưa ra bằng cách hoán đổi lãi suất coupon và\ntỷ lệ chiết khấu thị trường.\nGiá trái phiếu ≠ 5.000/(1+4%)1 +5.000/(1+4% )² + 105.000/(1+4%)3 = 4.807.6923 +\n4.622,7811 + 93,344,6177 = 102,775,0910 ≈ 102,775. Dữ liệu đầu vào của máy tính: FV = 100.000, I=\n0,04, N=3, PMT = 5.000, PV = 102.775,09 ≈ 102.775.\nThu nhập cố định: tính giá trái phiếu với lãi suất đến ngày đáo hạn trên hoặc giữa các phiếu giảm giá\nngày","qhtml":null},{"n":88,"q":"Which of the following mortgage features most likely benefits the lender?","opts":["Non-recourse loan","Prepayment option","Prepayment penalty"],"ans":"C","expl":"A. Không chính xác vì trong khoản vay truy đòi, người cho vay có yêu cầu bồi thường đối với người đi vay về\nsự thiếu hụt giữa số dư thế chấp chưa thanh toán và số tiền thu được\nnhận được từ việc bán tài sản. Trong khoản vay không truy đòi, người cho vay không có\nyêu cầu như vậy và do đó chỉ có thể trông cậy vào tài sản để thu hồi số dư thế chấp\nsố dư.\nB. Không chính xác vì khoản thế chấp có thể cho phép người đi vay trả trước toàn bộ hoặc một phần số tiền gốc thế chấp còn nợ trước ngày đến hạn theo lịch trình khi số tiền gốc phải được hoàn trả\n. Điều khoản hợp đồng này được gọi là tùy chọn thanh toán trước hoặc tùy chọn thanh toán sớm\n. Từ quan điểm của người cho vay hoặc nhà đầu tư, tác động của tùy chọn trả trước\nlà số lượng và thời gian của dòng tiền từ khoản thế chấp không thể biết chắc chắn\n. Tùy chọn trả trước mang lại lợi ích cho người đi vay hơn là người cho vay.\nC. Đúng vì mục đích của hình phạt trả trước là bồi thường cho người cho vay\nsự khác biệt giữa lãi suất hợp đồng và lãi suất thế chấp hiện hành nếu người đi vay\ntrả trước khi lãi suất giảm.\nThu nhập cố định: mô tả các đặc điểm cơ bản của các khoản vay thế chấp nhà ở được\nchứng khoán hóa","qhtml":null},{"n":89,"q":"With respect to the notching process adopted by credit rating agencies, a corporate's\nsubordinated debt is most likely.","opts":["notched up from the corporate's junior subordinated debt.","subject to a smaller notching adjustment the higher the corporate's issuer rating.","notched down from the corporate's issuer rating due to higher probability of default."],"ans":"B","expl":"A. Không chính xác vì nhận ra các mức ưu tiên thanh toán khác nhau này và do đó khả năng\nmức độ tổn thất cao hơn (hoặc thấp hơn) trong trường hợp vỡ nợ, các cơ quan xếp hạng đã áp dụng\nquy trình ghi chú, theo đó xếp hạng tín dụng của họ đối với các vấn đề có thể được tăng lên hoặc giảm xuống từ\nxếp hạng của nhà phát hành, thường là xếp hạng áp dụng cho khoản nợ không có bảo đảm cấp cao. Do đó, xếp hạng vấn đề\nđược tăng hoặc giảm so với xếp hạng của nhà phát hành chứ không phải từ xếp hạng cấp dưới hơn như\nnhư xếp hạng cấp dưới.\nB. Đúng vì các cơ quan xếp hạng đã áp dụng quy trình giảm bớt trong đó\nxếp hạng tín dụng của họ đối với các vấn đề có thể được tăng hoặc giảm so với xếp hạng của tổ chức phát hành, thường là xếp hạng\náp dụng cho khoản nợ không có bảo đảm cấp cao của họ. Theo nguyên tắc chung, xếp hạng không có bảo đảm\ncao cấp càng cao thì mức điều chỉnh giảm bớt càng nhỏ.\nC. Không chính xác vì nhận ra các ưu tiên thanh toán khác nhau này và do đó khả năng\nmức độ thiệt hại cao hơn (hoặc thấp hơn) trong trường hợp vỡ nợ, các cơ quan xếp hạng đã áp dụng\nquy trình ghi chú, theo đó xếp hạng tín dụng của họ đối với các vấn đề có thể được tăng lên hoặc giảm xuống so với\nxếp hạng của nhà phát hành và cả các điều khoản vỡ nợ chéo, theo đó các sự kiện vỡ nợ (chẳng hạn như không\nthanh toán lãi) trên một trái phiếu sẽ kích hoạt vỡ nợ trên một trái phiếu trên tất cả các khoản nợ tồn đọng, ngụ ý\nxác suất vỡ nợ giống nhau cho tất cả các vấn đề, các vấn đề cụ thể có thể được chỉ định xếp hạng tín dụng khác nhau-\ncao hơn hoặc thấp hơn-do phương pháp điều chỉnh xếp hạng được gọi là khía cạnh. Chính mức độ mất mát\ncao hơn chứ không phải xác suất vỡ nợ cao hơn đang thúc đẩy quá trình cắt giảm.\nThu nhập cố định: mô tả thứ hạng thâm niên của nợ, nợ có bảo đảm so với nợ không có bảo đảm và\nmức độ ưu tiên của các yêu cầu bồi thường khi phá sản và tác động của chúng đối với xếp hạng tín dụng","qhtml":null},{"n":90,"q":"Money market yields are:","opts":["annualized and compounded.","stated for a common periodicity.","stated on a simple interest basis."],"ans":"C","expl":"A. Không chính xác vì lãi suất đến ngày đáo hạn của trái phiếu được tính gộp hàng năm và gộp lại. Các thước đo lợi suất\ntrên thị trường tiền tệ được tính hàng năm nhưng không gộp.\nB. Không chính xác vì các công cụ thị trường tiền tệ có thời gian đáo hạn khác nhau có\ncác chu kỳ lãi suất hàng năm khác nhau.\nC. Đúng vì tỷ suất lợi nhuận của một công cụ thị trường tiền tệ được nêu trên cơ sở\nlãi suất đơn giản.\nThu nhập cố định: tính toán và giải thích các thước đo lợi nhuận cho các công cụ thị trường tiền tệ","qhtml":null},{"n":91,"q":"A portfolio manager gathers the following information about an option-free bond that\nwas held to maturity:\n• Realized horizon yield 4.2%\n• Reinvestment rate 4.1%\nThe yield to maturity at purchase was most likely.","opts":["less than 4.2%.","equal to 4.2%.","greater than 4.2%."],"ans":"C","expl":"A. Không chính xác vì bởi vì, vì tỷ lệ tái đầu tư nhỏ hơn lợi suất kỳ hạn, nên thời gian đáo hạn của năng suất đến\n lớn hơn lợi suất kỳ hạn 4,2%\nB. Không chính xác vì bởi vì, vì tỷ lệ tái đầu tư nhỏ hơn lợi suất kỳ hạn, nên thời gian đáo hạn của năng suất đến\n lớn hơn lợi suất kỳ hạn 4,2%\nC. Đúng vì lợi suất thực hiện trong thời hạn khớp với lợi suất đến ngày đáo hạn ban đầu nếu (1)\ncác khoản thanh toán lãi suất được tái đầu tư với cùng mức lãi suất như lãi suất đến ngày đáo hạn ban đầu,\nvà (2) trái phiếu được bán ở mức giá theo quỹ đạo giá lãi suất không đổi, ngụ ý rằng\nnhà đầu tư không có bất kỳ khoản lãi hoặc lỗ vốn nào khi bán trái phiếu. Vì\ntỷ lệ tái đầu tư nhỏ hơn lãi suất trong thời hạn và trái phiếu được giữ đến ngày đáo hạn, nên lợi suất đến\nkỳ hạn lớn hơn lãi suất trong thời hạn.\nThu nhập cố định: tính toán và giải thích các nguồn lợi nhuận từ việc đầu tư vào trái phiếu\nlãi suất cố định;","qhtml":null},{"n":92,"q":"A three-year, semiannual-pay bond with a $100 par value and a 5% coupon rate is\npurchased for $108. One year later , if the yield to maturity has decreased by 100 basis points,\nthe change in the value of this bond is closest to:","opts":["$0.57.","$1.52.","$3.08."],"ans":"A","expl":"A. Đúng vì giá trị trái phiếu được tính như sau:\nPV= [PMT = (1+r)¹] + [PMT +(1+r)²] +...+ [(PMT + FV) + (1+r)N)\nở đâu:\nPV = giá trị hiện tại hoặc giá của trái phiếu\nThanh toán phiếu giảm giá PMT mỗi kỳ\nFV = giá trị tương lai được thanh toán khi đáo hạn hoặc mệnh giá của trái phiếu\nr = tỷ lệ chiết khấu thị trường hoặc tỷ suất lợi nhuận yêu cầu trong mỗi kỳ\nN = số khoảng thời gian cách đều nhau cho đến khi đáo hạn\nSử dụng dữ liệu đầu vào của máy tính, N = (3 x 2)=6, PMT = (5% 2) 100 = $2,5, FV = $100, PV = $108,\nGiải quyết cho I, bằng 1,114% nửa năm một lần, hoặc 2,228% hàng năm. Nếu năng suất đạt\nkỳ hạn giảm đi 100 điểm cơ bản, giá trái phiếu sau một năm được tính là: N = 4,\nPMT = 2,5 USD, FV = 100 USD, 1= [(2,228% -1% ) 2] = 0,614%, Giải PV, bằng 107,43 USD.\nDo đó, sự thay đổi giá trị của trái phiếu = $108,00 - $107,43 = $0,57\nB. Không chính xác vì không tính toán lãi suất hàng năm trước khi tính toán sự thay đổi trong\ngiá trị\nSử dụng đầu vào của máy tính, lợi tức của trái phiếu: N=6, PMT = $2,5, FV = $100, Giải I bằng\n1,114%.\nNếu lợi suất giảm 100 bps thì giá trái phiếu sau một năm được tính là: N = 4,\nPMT = $2,5, FV = 100, I = (1,114% -1%) = 0,114%, Giải PV = $109,52.\nDo đó, thay đổi về giá trị = $108-109,52-$1,52 hoặc thay đổi về giá trị là $1,52\nC. Không chính xác vì sử dụng sai thời gian đáo hạn khi tính toán khoản nợ mới.\ngiá trị thay vì điều chỉnh thời hạn cho thời hạn một năm về giá trị\nSử dụng dữ liệu đầu vào của máy tính, lợi suất trái phiếu: N = 6, PMT = $2,5, FV = 100, I = (2,228% -\n1%)/2=0,614%, Giải được PV bằng $111,08.\nDo đó, thay đổi về giá trị = $108-111,08 = - $3,08 hoặc thay đổi giá trị là $3,08.\nThu nhập cố định: tính giá trái phiếu dựa trên lợi tức đến ngày đáo hạn vào hoặc giữa các phiếu lãi\nngày tháng","qhtml":null},{"n":93,"q":"The yield spread of a specific bond over the standard swap rate in that currency of the\nsame tenor best describes the","opts":["I-spread.","Z-spread.","option-adjusted spread."],"ans":"A","expl":"A. Đúng vì chênh lệch lãi suất của một trái phiếu cụ thể so với tỷ lệ hoán đổi tiêu chuẩn bằng\nloại tiền tệ có cùng kỳ hạn đó được gọi là chênh lệch I hoặc chênh lệch nội suy đối với đường cong hoán đổi\n.\nB. Không chính xác vì thay vào đó, một cách tiếp cận khác là tính toán mức chênh lệch lãi suất không đổi trên đường cong giao ngay của chính phủ (hoặc hoán đổi lãi suất). Mức chênh lệch này được gọi là mức chênh lệch biến động bằng 0\n (Z- Spread) của trái phiếu so với lãi suất chuẩn. Đôi khi, mức chênh lệch Z được\ngọi là mức chênh lệch tĩnh vì nó không đổi (và không có biến động).\nC. Không chính xác vì mức chênh lệch Z cũng được sử dụng để tính mức chênh lệch được điều chỉnh theo quyền chọn (OAS)\ntrên một trái phiếu có thể mua lại. OAS, giống như lợi tức được điều chỉnh theo quyền chọn, dựa trên mô hình định giá quyền chọn\nvà giả định về biến động lãi suất trong tương lai.\nThu nhập cố định: so sánh, tính toán và giải thích các thước đo lợi suất và chênh lệch lợi suất cho\ntrái phiếu có lãi suất cố định","qhtml":null},{"n":94,"q":"For a fixed-rate bond, when interest rates decrease, the future value of reinvested coupon\npayments most likely.","opts":["decreases and the market price of the bond increases.","increases and the market price of the bond decreases.","increases and the market price of the bond increases."],"ans":"A","expl":"A. Đúng vì có hai loại rủi ro lãi suất bù đắp ảnh hưởng đến rủi ro tái đầu tư trái phiếu\nvà rủi ro giá thị trường. Giá trị tương lai của các khoản thanh toán lãi suất\nđược tái đầu tư (và trong danh mục đầu tư, tiền gốc của trái phiếu đáo hạn trước ngày\n) tăng khi lãi suất tăng và giảm khi lãi suất giảm. Giá bán\ncủa một trái phiếu đáo hạn sau ngày đáo hạn (và do đó cần phải bán) giảm khi\nlãi suất tăng và tăng khi lãi suất giảm.\nB. Không chính xác vì giá trị tương lai của các khoản thanh toán lãi suất tái đầu tư (và trong danh mục đầu tư,\ntiền gốc của các trái phiếu đáo hạn trước thời hạn) tăng khi lãi suất tăng\nup. Giá bán trái phiếu đáo hạn sau ngày đáo hạn (và do đó cần phải bán)\ngiảm khi lãi suất tăng.\nC. Không chính xác vì giá trị tương lai của các khoản thanh toán lãi suất tái đầu tư (và trong danh mục đầu tư,\ntiền gốc của trái phiếu đáo hạn trước thời hạn) tăng khi lãi suất tăng\nup. Giá bán của một dải sẽ đáo hạn sau ngày hết hạn (và do đó cần phải bán)\ngiảm khi lãi suất tăng pp.\nThu nhập cố định: mô tả mối quan hệ giữa lợi nhuận trong thời gian nắm giữ của một dải,\nthời hạn ở Macau và thời hạn đầu tư","qhtml":null},{"n":95,"q":"The yield spread in basis points over an actual or interpolated government bond best describes the:","opts":["I-spread.","G-spread.","Z-spread."],"ans":"B","expl":"A. Không chính xác vì chênh lệch lãi suất của một trái phiếu cụ thể trên tỷ lệ hoán đổi tiêu chuẩn trong đó\nloại tiền tệ có cùng kỳ hạn được gọi là I- spread.\nB. Đúng vì chênh lệch lợi suất tính theo điểm cơ bản trên một giá trị thực tế hoặc nội suy\ntrái phiếu chính phủ được gọi là chênh lệch G. Chênh lệch giá trái phiếu chính phủ là\nlợi nhuận nhờ mang lại tín dụng, tính thanh khoản cao hơn và các rủi ro khác liên quan đến trái phiếu chính phủ.\nC. Không chính xác vì chênh lệch lãi suất trên một điểm chuẩn cụ thể được gọi là\nmức chênh lệch điểm chuẩn. Lãi suất không đổi chênh lệch trên một hợp đồng giao ngay của chính phủ (hoặc hoán đổi lãi suất)\nđường cong được gọi là chênh lệch không biến động (Z- spread) của trái phiếu so với lãi suất chuẩn.\nThu nhập cố định: so sánh, tính toán và giải thích các thước đo lợi suất và chênh lệch lợi suất cho thu nhập cố định\ntrái phiếu lãi suất"},{"n":96,"q":"Which of the following debt categories has the highest ranking in terms of priority of\npayment?","opts":["Second lien debt","Subordinated debt","Senior unsecured debt"],"ans":"A","expl":"A. Đúng vì khoản nợ thế chấp thứ hai là nợ BẢO ĐẢM (có bảo đảm) — có quyền truy đòi trực tiếp đối với tài sản thế chấp — nên xếp trên mọi loại nợ không bảo đảm về thứ tự ưu tiên thanh toán.\nB. Không chính xác vì nợ cấp dưới xếp hạng DƯỚI cùng trong ba loại được liệt kê: sau nợ có bảo đảm và sau cả cấp cao không có bảo đảm.\nC. Không chính xác vì nợ không có bảo đảm cao cấp được xếp trên nợ cấp dưới nhưng vẫn ở dưới mức nợ có bảo đảm (thế chấp thứ hai).","qhtml":null},{"n":97,"q":"In a securitization, time tranching most likely refers to differences in:","opts":["default risk.","expected maturities.","underlying collateral."],"ans":"B","expl":"A. Không chính xác vì điều này liên quan đến việc phân bổ tín dụng chứ không phải phân bổ thời gian. Trong phân ngạch tín dụng,\ncó nhiều loại trái phiếu hoặc phân ngạch và các loại cổ phiếu khác nhau về cách chúng\nsẽ chia sẻ tổn thất do vỡ nợ của những người đi vay có khoản vay được thế chấp.\nB. Đúng vì việc tạo các loại trái phiếu có kỳ hạn dự kiến ​​khác nhau\nđược gọi là phân chia theo thời gian.\nC. Không chính xác vì việc phân chia không thay đổi tài sản thế chấp cơ bản mà chỉ thay đổi\ncách chia sẻ khoản lỗ hoặc khoản trả trước. Trong cấu trúc như vậy, có nhiều hơn một loại hoặc đợt trái phiếu\n và các loại cổ phiếu khác nhau về cách chúng sẽ chia sẻ tổn thất do\nvỡ nợ của những người đi vay có khoản vay được thế chấp.\nThu nhập cố định: xác định rủi ro trả trước và mô tả cấu trúc phân chia thời gian trong\nchứng khoán hóa và mục đích của chúng","qhtml":null},{"n":98,"q":"For a floating-rate note, the specified yield spread over the reference rate best defines\nthe:","opts":["coupon.","quoted margin.","required margin."],"ans":"B","expl":"A. Không chính xác vì chênh lệch lãi suất đã chỉ định được thêm vào hoặc trừ khỏi tỷ lệ\ntham chiếu dẫn đến phiếu giảm giá. Ví dụ: thả nổi có thể đặt lại lãi suất\nhàng quý ở mức Libor kỳ hạn ba tháng cộng với 0,50%. Đây không phải là tỷ lệ ký quỹ được trích dẫn, nó là tỷ lệ\ntham chiếu cộng với tỷ lệ ký quỹ được trích dẫn.\nB. Đúng vì chênh lệch lãi suất được chỉ định này trên tỷ giá tham chiếu được gọi là biên độ\nđược trích dẫn trên FRN. Vai trò của tỷ lệ ký quỹ niêm yết là bù đắp cho nhà đầu tư về\nsự khác biệt về rủi ro tín dụng của tổ chức phát hành và điều đó được ngụ ý bởi tỷ giá tham chiếu.\nC. Không chính xác vì mức ký quỹ bắt buộc là chênh lệch lợi suất trên hoặc dưới tỷ giá\ntham chiếu sao cho FRN được định giá theo mệnh giá vào ngày đặt lại tỷ giá. Những thay đổi về tỷ lệ ký quỹ\nbắt buộc thường xuất phát từ những thay đổi về rủi ro tín dụng của tổ chức phát hành. Biên độ yêu cầu không được chỉ định\nnhưng thay đổi dựa trên lực lượng thị trường.\nThu nhập cố định: tính toán và giải thích các thước đo chênh lệch lợi suất cho các công cụ lãi suất thả nổi","qhtml":null},{"n":99,"q":"An investor holds a bond with the following characteristics:\n• Yield to maturity 9%\n• Modified duration 7.4\nIf the duration gap is zero, the investment horizon is closest to:","opts":["6.8 years.","7.4 years.","8.1 years."],"ans":"C","expl":"A. Không chính xác vì ứng viên tính toán thời hạn Macaulay không chính xác: MacDur ≠\n7.4/(1+9%) = 6,8. Bởi vì khoảng cách thời hạn bằng với thời hạn Macaulay của trái phiếu trừ đi\nthời hạn đầu tư nên thời hạn đầu tư được ghi không chính xác là 6,8 năm.\nB. Không chính xác vì ứng viên nhầm lẫn thời hạn Macaulay với thời hạn\nđã sửa đổi, do đó xác định không chính xác thời hạn đầu tư là 7,4 năm.\nC. Đúng vì chúng ta sử dụng thực tế ModDur = MacDur /(1+r) để tính thời hạn Macaulay\ncủa trái phiếu: MacDur = 7,4 × (1+9%) = 8,07. Bởi vì khoảng cách thời hạn bằng\nthời hạn Macaulay của trái phiếu trừ đi thời hạn đầu tư nên thời hạn đầu tư là\ngần nhất là 8,1 năm.\nThu nhập cố định: mô tả mối quan hệ giữa lợi tức thời gian nắm giữ trái phiếu,\nthời hạn Macaulay và thời hạn đầu tư;","qhtml":null},{"n":100,"q":"All else being equal, when the market interest rate falls below a bond's coupon rate,\npotential price appreciation is most limited for a:","opts":["putable bond.","callable bond.","option-free bond."],"ans":"B","expl":"A. Không chính xác vì nếu lãi suất thấp so với lãi suất phiếu giảm giá thì giá trị của\nquyền chọn bán thấp và tác động của sự thay đổi trong lợi suất chuẩn đối với giá trái phiếu [putable]\nrất giống với tác động lên giá của trái phiếu không thể bán lại, ví dụ: không\ngiới hạn. Hơn nữa, một nhà đầu tư hợp lý sẽ không thực hiện quyền chọn bán khi lãi suất thị trường\nthấp hơn lãi suất coupon của trái phiếu.\nB. Đúng vì khi lãi suất thấp, thời hạn hiệu lực của trái phiếu có thể thu hồi được\nthấp hơn so với trái phiếu không thể thu hồi được vì giá trái phiếu có thể thu hồi\nkhông tăng nhiều khi lợi suất chuẩn giảm. Sự hiện diện của quyền chọn mua\nhạn chế sự tăng giá, đặc biệt khi lãi suất giảm và trái phiếu có nhiều khả năng được gọi hơn\n.\nC. Không chính xác vì sự hiện diện của một tùy chọn nhúng làm giảm độ nhạy cảm của giá trái phiếu\nvới những thay đổi trong đường cong lợi suất chuẩn, giả sử không có thay đổi về rủi ro tín dụng. Một\ntrái phiếu không có quyền chọn đóng vai trò là trường hợp cơ bản, trong khi với quyền chọn mua, sự tăng giá bị hạn chế\nkhi lãi suất thị trường xuống dưới lãi suất coupon [và với quyền chọn bán, giá giảm sẽ bị giới hạn\nkhi lãi suất thị trường cao hơn lãi suất coupon].\nThu nhập cố định: giải thích tại sao thời lượng hiệu dụng và độ lồi hiệu quả là những thước đo lãi suất thích hợp nhất\n rủi ro lãi suất đối với trái phiếu có quyền chọn nhúng","qhtml":null},{"n":101,"q":"Callable bonds exhibit:","opts":["positive convexity only.","negative convexity only.","either positive or negative convexity."],"ans":"C","expl":"A. Không chính xác vì khi lợi nhuận chuẩn cao và giá trị của lệnh gọi được nhúng\nquyền chọn thấp, trái phiếu có thể mua lại và trái phiếu không thể mua lại có tác động rất giống nhau từ\nthay đổi lãi suất. Cả hai đều có độ lồi dương. Nhưng vì lợi suất chuẩn là\ngiảm sự phân kỳ của các đường cong Tại một thời điểm nào đó, liên kết có thể gọi được sẽ chuyển sang phạm vi\nđộ lồi âm, điều này cho thấy quyền chọn mua được nhúng có nhiều giá trị hơn đối với\nnhà phát hành và có nhiều khả năng được thực hiện\nB. Không chính xác vì khi lợi nhuận chuẩn cao và giá trị của lệnh gọi được nhúng\nquyền chọn thấp, trái phiếu có thể mua lại và trái phiếu không thể mua lại có tác động rất giống nhau từ\nthay đổi lãi suất. Cả hai đều có độ lồi dương. Nhưng vì lợi suất chuẩn là\ngiảm, các đường cong phân kỳ. Tại một thời điểm nào đó, liên kết có thể gọi được sẽ chuyển sang phạm vi\nđộ lồi âm, điều này cho thấy quyền chọn mua được nhúng có nhiều giá trị hơn đối với\nnhà phát hành và có nhiều khả năng được thực hiện hơn.\nC. Đúng vì khi lợi nhuận chuẩn cao và giá trị của lệnh gọi được nhúng\nquyền chọn thấp, trái phiếu có thể mua lại và trái phiếu không thể mua lại có tác động rất giống nhau từ\nthay đổi lãi suất. Cả hai đều có độ lồi dương. Nhưng vì lợi suất chuẩn là\ngiảm, các đường cong phân kỳ. Tại một thời điểm nào đó, trái phiếu có thể mua lại sẽ chuyển sang phạm vi\nđộ lồi âm, điều này cho thấy quyền chọn mua được nhúng có nhiều giá trị hơn đối với\nnhà phát hành và có nhiều khả năng được thực hiện hơn.\nThu nhập cố định: giải thích tại sao thời gian hiệu dụng và độ lồi hiệu quả là lớn nhất\nbiện pháp thích hợp về rủi ro lãi suất đối với trái phiếu kèm theo quyền chọn","qhtml":null},{"n":102,"q":"An investor sells a fixed-rate bond originally purchased at a discount. The resulting\ncapital gain or loss should be measured by comparing the bond's selling price with its:","opts":["par value.","carrying value.","purchase price."],"ans":"B","expl":"A. Không chính xác vì lãi và lỗ vốn được tính từ giá trị ghi sổ của trái phiếu\nchứ không phải từ giá mua hoặc mệnh giá.\nB. Đúng vì lãi vốn phát sinh nếu một trái phiếu được bán ở mức giá cao hơn quỹ đạo giá lãi suất không đổi\nvà tổn thất vốn xảy ra nếu trái phiếu được bán ở mức giá thấp hơn quỹ đạo giá lãi suất không đổi\ncủa nó. Ngoài ra, lãi và lỗ vốn được tính từ giá trị ghi sổ của trái phiếu\nchứ không phải từ giá mua. Giá trị ghi sổ bao gồm việc khấu hao chiết khấu hoặc phí bảo hiểm\nnếu trái phiếu được mua ở mức giá thấp hơn hoặc cao hơn mệnh giá. Giá trị mang\nlà bất kỳ điểm nào trên quỹ đạo giá lãi suất không đổi.\nC. Không chính xác vì lãi và lỗ vốn được tính từ giá trị ghi sổ của\ntrái phiếu chứ không phải từ giá mua.\nThu nhập cố định: tính toán và diễn giải các nguồn lợi nhuận từ việc đầu tư vào trái phiếu\ncó lãi suất cố định","qhtml":null},{"n":103,"q":"An investor gathers the following information about an investment in a bond with a 10-\nyear tenor:\nPurchase price 95.27\nSale price 102.06\nSum of reinvested coupon payments 24.28\nIf the holding period was seven years, the horizon yield is closest to:","opts":["2.29%.","2.86%.","4.11%."],"ans":"C","expl":"A. Không chính xác vì giá mua và giá bán vô tình bị hoán đổi trong công thức:\n102,06 = (95,27 +24,28)/(1+r)^7 => r = 0,022853 ≈ 2,29%.\nGiải pháp máy tính: N = 7; PV = -102,06; FV = 95,27+ 24,28; CPT I/Y = 2,29%\nB. Không chính xác vì thời gian nắm giữ và kỳ hạn của trái phiếu vô tình bị hoán đổi trong công thức\n:\n95,27 (102,06+24 28)/(1+r)^10=> r = 0,028628 ≈ 2,86%.\nGiải pháp máy tính: N = 10, PV= -95 27, FV = 102,06 + 24,28; CPT I/Y= 2,86%.\nC. Đúng vì lợi tức kỳ hạn là tỷ suất hoàn vốn nội bộ giữa tổng lợi nhuận\n(tổng số tiền thanh toán lãi tái đầu tư và giá bán hoặc số tiền mua lại) và\ngiá mua của trái phiếu. Lợi tức đầu tư vào trái phiếu là tỷ suất lợi nhuận hàng năm\ntrong thời gian nắm giữ.\n95,27 = (102,06+24,28)/ (1+r)^7 => r = 0,041147 ≈ 4,11%.\nGiải pháp máy tính: N = 7; PV= -95,27; FV = 102,06 + 24,28; CPT I/Y = 4,11%.\nThu nhập cố định: tính toán và giải thích các nguồn lợi nhuận từ việc đầu tư vào trái phiếu\ncó lãi suất cố định;","qhtml":null},{"n":104,"q":"A commercial paper has the following characteristics:\nRedemption value $5,000,000\nInterest earned $140,500\nDays to maturity 160\nFor a 365-day year, the discount rate is closest to:","opts":["6.2%.","6.4%.","6.6%."],"ans":"B","expl":"A. Không chính xác vì thí sinh nhầm lẫn giá trị quy đổi với giá trị hiện tại và\ntừ đó cộng tiền lãi kiếm được vào giá trị hoàn lại như một phần của phép tính.\nDR ≠ (365/160) x (140.500/(5.000.000 + 140.500)) = 0,0624 ≈ 6,2%.\nB. Đúng vì tỷ lệ chiết khấu DR = (Năm/Ngày) x ((FV - PV)/FV), trong đó Năm =\nsố ngày trong năm, Ngày = số ngày từ khi thanh toán đến khi đáo hạn, FV =\ngiá trị tương lai được trả khi đáo hạn/mệnh giá của công cụ thị trường tiền tệ, PV = hiện tại\ngiá trị/giá của công cụ thị trường tiền tệ và FV - PV là tiền lãi thu được.\nDR = (365/160) x (140.500/5.000.000) = 0,0641 ≈ 6,4%.\nC. Không chính xác vì đây là tỷ lệ bổ sung. AOR = Năm/Ngày x ((FV-PV)/PV)\nAOR = (365/160) x (140.500/(5.000.000-140.500)) = 0,0660 ≈ 6,6%.\nThu nhập cố định: tính toán và giải thích các thước đo lợi suất cho các công cụ thị trường tiền tệ","qhtml":null},{"n":105,"q":"Two par bonds have the same duration but different convexity. All else being equal, if\nyields to maturity increase by 10 basis points, it is most likely that:","opts":["the more convex bond underperforms the less convex bond.","both bond prices decrease by the same amount.","the more convex bond outperforms the less convex bond."],"ans":"C","expl":"A. Không chính xác vì hai trái phiếu được giả định là có cùng mức giá, lãi suất đến ngày đáo hạn,\nvà thời hạn được sửa đổi. Lợi ích của độ lồi lớn hơn xảy ra khi lợi suất đến\nkỳ hạn của chúng thay đổi. Đối với cùng mức giảm lợi tức đến ngày đáo hạn, trái phiếu càng lồi\nsẽ càng tăng giá. Và với cùng mức tăng lợi tức đến ngày đáo hạn, trái phiếu\n càng lồi thì giá càng giảm. Kết luận là trái phiếu càng lồi sẽ hoạt động tốt hơn\ntrái phiếu càng lồi ít hơn trong cả thị trường tăng (giá tăng) và thị trường giảm (giá giảm). Liên kết lồi nhiều\nluôn hoạt động tốt hơn liên kết ít lồi\nB. Không chính xác vì hai trái phiếu được giả định là có cùng mức giá, lãi suất đến ngày đáo hạn,\nvà thời hạn được sửa đổi. Lợi ích của độ lồi lớn hơn xảy ra khi lợi suất đến\nkỳ hạn của chúng thay đổi. Đối với cùng mức giảm lợi tức đến ngày đáo hạn, trái phiếu càng lồi\nsẽ càng tăng giá. Và với cùng mức tăng lợi tức đến ngày đáo hạn, trái phiếu\n càng lồi thì giá càng giảm. Kết luận là trái phiếu càng lồi tốt hơn\ntrái phiếu càng lồi tốt hơn trái phiếu trong cả thị trường tăng (giá tăng) và thị trư
