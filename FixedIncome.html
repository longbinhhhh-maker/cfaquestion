lay\n, không áp dụng thời lượng hiệu quả là thước đo thời lượng thích hợp\nB. Đúng vì thời hạn đã sửa đổi có thể được sử dụng để đo lường rủi ro lãi suất của trái phiếu không phức tạp\nchẳng hạn như trái phiếu kho bạc Hoa Kỳ, trong khi thời hạn hiệu lực là cần thiết để\nđo lường rủi ro lãi suất của trái phiếu phức tạp, chẳng hạn như trái phiếu có chứa\ntùy chọn mua kèm theo.\nC. Không chính xác vì một chứng khoán có thu nhập cố định khác có số liệu thống kê về thời hạn lợi tức, chẳng hạn như\nnhư thời hạn được sửa đổi và Macaulay, không liên quan là trái phiếu được thế chấp.\nThu nhập cố định: xác định, tính toán và giải thích thời hạn được sửa đổi, thời hạn thanh toán và\ngiá trị của một điểm cơ bản (PVBP)","qhtml":null},{"n":47,"q":"The percentage price change for a bond, given a change in its yield to maturity, is best\nestimated by:","opts":["effective duration.","modified duration.","Macaulay duration."],"ans":"B","expl":"A. Không chính xác vì thời hạn hiệu lực của trái phiếu là độ nhạy cảm của giá trái phiếu với\nsự thay đổi trong đường cong lợi suất chuẩn, chứ không phải với sự thay đổi trong lợi suất đến ngày đáo hạn của trái phiếu\nB. Đúng vì thời hạn được sửa đổi là một thống kê về thời hạn lợi suất trong đó nó đo lường rủi ro lãi suất\ntheo sự thay đổi về lợi tức đến ngày đáo hạn của chính trái phiếu. Thời hạn được sửa đổi\ncung cấp ước tính về phần trăm thay đổi giá của một trái phiếu khi lợi suất của nó thay đổi-\nđến ngày đáo hạn\nC. Không chính xác vì thời hạn Macaulay là trung bình có trọng số của thời gian đến khi nhận được các khoản thanh toán đã hứa của trái phiếu\n, trong đó trọng số là phần chia của toàn bộ giá\ntương ứng với từng khoản thanh toán trong tương lai đã hứa của trái phiếu.\nThu nhập cố định: xác định, tính toán và giải thích thời hạn được sửa đổi, thời hạn thanh toán và giá trị\ncủa một điểm cơ bản (PVBP)","qhtml":null},{"n":48,"q":"An analyst gathers the following information about an annual-pay bond:\nCoupon rate 6.0%\nYield to maturity 4.5%\nMacaulay duration 10.0\nIf the yield to maturity decreases by 100 basis points, the expected percentage change in the\nbond's price is closest to:","opts":["9.43%.","9.57%.","10.00%"],"ans":"B","expl":"A. Không chính xác vì nó tính toán thời lượng đã sửa đổi bằng cách sử dụng phiếu giảm giá thay vì YTM.\nMacDur / (1 + phiếu giảm giá) = 10/1,06 = 9,43.\nB. Đúng vì thời hạn được sửa đổi cung cấp ước tính về phần trăm thay đổi giá\nđối với một trái phiếu khi có sự thay đổi về lãi suất đến ngày đáo hạn [YTM]\nThời lượng được sửa đổi = Thời lượng Macaulay / (1+r) = 10,0 / 1,045 = 9,5694\n%*SYMBOL*PV ≈ - AnnModDur x 𝛥Sản lượng = - 9,5694 x -1% = 9,5694% ≈ 9,57%.\nC. Không chính xác vì đây là thời hạn của Macaulay. Thời hạn Macaulay phải được điều chỉnh theo\nlợi suất đến ngày đáo hạn để tính thời hạn được sửa đổi và sau đó, thời hạn được sửa đổi được\ndùng để tính tỷ lệ phần trăm thay đổi giá đối với sự thay đổi của lợi tức đến ngày đáo hạn của trái phiếu.\nThu nhập cố định: tính tỷ lệ phần trăm thay đổi giá của trái phiếu đối với một thay đổi cụ thể về lợi suất\n, dựa trên thời hạn của trái phiếu và độ lồi","qhtml":null},{"n":49,"q":"Which of the following is most likely a negative covenant?","opts":["The issuer must comply with all laws and regulations.","The issuance of new debt must be junior to existing bondholder debt.","New debt obligations are treated the same as the borrower's other senior debt instruments."],"ans":"B","expl":"A. Không chính xác vì các giao ước khẳng định thường có tính chất hành chính. Ví dụ\n, các giao ước khẳng định thường được sử dụng bao gồm những gì nhà phát hành sẽ làm với\nthu được từ việc phát hành trái phiếu và lời hứa thực hiện thanh toán theo hợp đồng.\nnhà phát hành cũng có thể hứa tuân thủ tất cả các luật và quy định.\nB. Đúng vì các cam kết tiêu cực ngăn cản việc phát hành khoản nợ cấp cao hơn hoặc\nđược ưu tiên trước khoản nợ của chủ sở hữu trái phiếu hiện tại. Đây là một giao ước phủ định.\nC. Không chính xác vì các giao ước khẳng định thường có tính chất hành chính. Đối với\nví dụ: mệnh đề pari passu (hoặc \"bình đẳng\") đảm bảo rằng nghĩa vụ nợ được\nđược xử lý giống như các công cụ nợ cao cấp khác của người đi vay.\nThu nhập cố định: mô tả nội dung của khế ước trái phiếu và đối chiếu các giao ước khẳng định và phủ định","qhtml":null},{"n":50,"q":"An analyst gathers the following information about a 4% annual-payment bond with a\ncurrent yield-to-maturity of 4.0%:\nAnnualized Yield to Maturity Bond Price\n3.9% 100.45\n4.0% 100.00\n4.1% 99.56\nThe bond's annualized Macaulay duration is closest to:","opts":["4.28.","4.45.","4.63."],"ans":"C","expl":"A. Không chính xác vì nó xác định AppxModDur nhưng sau đó điều chỉnh thước đo thời lượng được tính\nbằng cách chia cho (1 + r), thay vì nhân.\nAppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×(𝑃𝑉 )] = (100,45-99,56)/(2 x 0,001 x\n− + 0\n100) = 4,45. Xấp xỉMacDur ≠ Xấp xỉModDur / (1+r) = 4,45/(1+0,04) = 4,279 ≈ 4,28.\nB. Không chính xác vì nó không điều chỉnh thêm thời lượng đã sửa đổi để xác định thời lượng\nMacaulay. AppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×(𝑃𝑉 )] = (100,45-\n− + 0\n99,56)/(2 x 0,001 x 100) = 4,45.\nC. Đúng vì nó điều chỉnh Khoảng thời gian được sửa đổi gần đúng theo năng suất đáo hạn là 1+ để\nxác định thời lượng Macaulay. AppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×\n− +\n(𝑃𝑉 )] = (100,45-99,56)/(2 x 0,001 x 100) = 4,45. Thời lượng Macaulay = thời lượng đã sửa đổi x (1\n0\n+ YTM) = 4,45 x (1 + 0,04) = 4,628 ≈ 4,63.\nThu nhập cố định: xác định, tính toán và diễn giải thời lượng Macaulay","qhtml":"<p>An analyst gathers the following information about a 4% annual-payment bond with a current yield-to-maturity of 4.0%:</p><table class=\"qtable\"><thead><tr><th>Annualized Yield to Maturity</th><th>Bond Price</th></tr></thead><tbody><tr><td>3.9%</td><td>100.45</td></tr><tr><td>4.0%</td><td>100.00</td></tr><tr><td>4.1%</td><td>99.56</td></tr></tbody></table><p>The bond's annualized Macaulay duration is closest to:</p>"},{"n":51,"q":"An analyst gathers the following information about a company (in $ millions):\n• Operating income 120\n• Net income 85\n• Interest expense 15\n• Depreciation and amortization 15\nInterest coverage using EBIT is closest to:","opts":["7x.","8x.","9x."],"ans":"B","expl":"A. Không chính xác vì đây là thu nhập ròng cộng với khấu hao & khấu hao chia cho lãi\nchi phí.\nPhạm vi trả lãi ≠ (85 + 15) / 15= $100 / 15 = 6,7, làm tròn thành 7.\nB. Đúng vì thu nhập hoạt động được định nghĩa là doanh thu hoạt động trừ đi chi phí hoạt động\nvà thường được gọi là 'thu nhập trước lãi vay và thuế' (EBIT).\nBảo hiểm lãi vay sử dụng EBIT là thu nhập hoạt động/chi phí lãi vay. = $120/15 = 8.\nC. Không chính xác vì đây là khoản bảo hiểm lãi vay sử dụng EBIT cộng với khấu hao & khấu trừ dần\n(EBITDA. không phải EBIT) chia cho chi phí lãi vay.\nBảo hiểm lãi suất ≠ ($120 + $15) / 15 = 9.\nThu nhập cố định: tính toán và giải thích các tỷ số tài chính được sử dụng trong phân tích tín dụng","qhtml":null},{"n":52,"q":"Which of the following duration statistics best measures the sensitivity of a bond's price\nto a flattening of the yield curve?","opts":["Key rate duration","Effective duration","Macaulay duration"],"ans":"A","expl":"A. Đúng vì thời hạn lãi suất chính (hoặc thời hạn một phần) là thước đo độ nhạy cảm của trái phiếu\nvới sự thay đổi trong đường cong lợi suất chuẩn ở một phân đoạn đáo hạn cụ thể. Ngược lại với\nthời hạn hiệu lực, thời hạn lãi suất chính giúp xác định 'rủi ro hình thành đối với một trái phiếu-tức là, độ nhạy cảm\ncủa trái phiếu đối với những thay đổi về hình dạng của đường cong lãi suất chuẩn (ví dụ: đường cong lãi suất\ntrở nên dốc hơn hoặc phẳng hơn).\nB. Không chính xác vì thời hạn hiệu lực cho thấy mức độ nhạy cảm của trái phiếu đối với đường cong lợi suất\nchuẩn mực giả định rằng tất cả lợi suất đều thay đổi một lượng như nhau. Ngược lại với khoảng thời gian\nhiệu quả, khoảng thời gian lãi suất chính giúp xác định rủi ro hình thành' đối với một biên độ, nghĩa là độ nhạy của biên độ\nvới những thay đổi về hình dạng của đường cong lợi suất chuẩn (ví dụ: đường cong lợi suất trở nên\ndốc hơn hoặc phẳng hơn).\nC. Không chính xác vì số liệu thống kê về thời hạn lợi suất đo lường mức độ nhạy cảm của toàn bộ giá trái phiếu\nvới lợi tức đến ngày đáo hạn của chính trái phiếu bao gồm thời hạn Macaulay, thời hạn được sửa đổi,\nthời hạn tiền và giá trị của một điểm cơ bản. Kỳ hạn Macaulay đo lường\nđộ nhạy cảm của giá đầy đủ của trái phiếu đối với sự thay đổi trong lãi suất đến khi đáo hạn, chứ không phải với những thay đổi về hình dạng\ncủa đường cong lợi suất chuẩn.\nThu nhập cố định: xác định thời hạn lãi suất chính và mô tả cách sử dụng nó để đo độ nhạy cảm về giá của\ncác công cụ thu nhập cố định đối với những thay đổi của đường cong lợi suất chuẩn","qhtml":null},{"n":53,"q":"All else being equal, an investment-grade bond issuer most likely has:","opts":["less market liquidity risk than a below-investment-grade issuer.","the same market liquidity risk as a below-investment-grade issuer.","greater market liquidity risk than a below-investment-grade issuer."],"ans":"A","expl":"A. Đúng vì rủi ro thanh khoản thị trường là rủi ro mà mức giá mà nhà đầu tư có thể\nthực sự giao dịch-mua hoặc bán-có thể khác với giá niêm yết trên thị trường.\nchất lượng của tổ chức phát hành càng thấp thì rủi ro thanh khoản thị trường càng cao\nB. Không chính xác vì chất lượng của tổ chức phát hành càng thấp thì rủi ro thanh khoản thị trường càng cao.\nTrong trường hợp này, người đi vay cấp đầu tư có ít rủi ro thanh khoản thị trường hơn, không giống nhau.\nC. Không chính xác vì chất lượng của tổ chức phát hành càng thấp thì rủi ro thanh khoản thị trường càng cao.\nTrong trường hợp này, người đi vay cấp đầu tư có rủi ro thanh khoản thị trường ít hơn chứ không phải nhiều hơn.\nThu nhập cố định: mô tả rủi ro tín dụng và các thành phần của nó, xác suất vỡ nợ và tổn thất được đưa ra\nvỡ nợ","qhtml":null},{"n":54,"q":"An analyst gathers the following information about an option-free bond:\nPar value $1,000,000\nCurrent market value $912,575\nDuration 2.4\nIf yields are expected to decrease by 50 basis points, the expected price change for the bond\nis closest to:","opts":["$11,000.","$22,000.","$24,000."],"ans":"A","expl":"A. Đúng vì thời hạn được sửa đổi cung cấp ước tính về phần trăm thay đổi giá\nđối với một trái phiếu khi có sự thay đổi về lợi tức đến ngày đáo hạn của nó. Khoảng thời gian được sửa đổi là 2,4 có nghĩa là\nthay đổi phần trăm giá 2,4% khi lợi tức trái phiếu thay đổi 100 điểm cơ bản đến kỳ hạn\n. Do đó, khi lợi suất giảm 50 điểm cơ bản, giá trái phiếu sẽ thay đổi\n(2.4)(0,0050)($912.575) = $10,951 ≈ $11.000.\nB. Không chính xác vì nó sử dụng phép tính không chính xác ( 0,024)($912.575) = $21.902 ≈ $22.000.\nC. Không chính xác vì nó sử dụng phép tính không chính xác (0,024)($1.000.000) = 24.000 USD.\nThu nhập cố định: tính phần trăm thay đổi giá của một trái phiếu đối với một thay đổi cụ thể trong\nlợi suất, dựa trên thời hạn và độ lồi của trái phiếu","qhtml":null},{"n":55,"q":"The price value of a basis point (PVBP) for a bond with a full price of 103.50 and a\nmodified duration of 6.2 is closest to:","opts":["0.0642.","0.6420.","6.4200."],"ans":"A","expl":"A. Đúng vì thời hạn được sửa đổi cung cấp ước tính về phần trăm thay đổi giá\nđối với một trái phiếu khi có sự thay đổi về lãi suất đến ngày đáo hạn của nó: %𝛥𝑃𝑉𝐹𝑢𝑙𝑙 ≈ -AnnModDur x 𝛥Yield. Ngoài ra,\nmột phiên bản khác của thời hạn tiền là giá trị giá của một điểm cơ bản (PVBP) cho trái phiếu.\nPVBP là ước tính về sự thay đổi trong giá đầy đủ khi có 1 điểm cơ bản thay đổi trong thời gian đáo hạn của lợi tức đến\n Ở đây: -6,2 x 0,0001 0,00062 và PVBP = 0,00062 x 103,50 = 0,06417, được làm tròn thành\n0,0642.\nB. Không chính xác vì nó biểu thị mức thay đổi 10 bp, không phải 1 bp: -6,2 x 0,001 = 0,0062\nvà PVBP ≠ 0,0062 × 103,50 = 0,6417, được làm tròn thành 0,642.\nC. Không chính xác vì nó biểu thị mức thay đổi 1 phần trăm (100 bp), không phải 1 bp: -6,2 x 0,01\n= 0,062 và PVBP ≠ 0,062 × 103,50 = 6,417, làm tròn thành 6,42\nThu nhập cố định: xác định, tính toán và diễn giải thời hạn được sửa đổi, thời hạn tiền và\ngiá trị của một điểm cơ bản (PVBP)","qhtml":null},{"n":56,"q":"An analyst gathers the following details about a bond portfolio:\nBond Market Price (per 100 of par value) Money Duration (per 100 of par value)\n1 95 730\n2 120 515\nIf each bond has a par value of £25 million, the modified duration of this bond portfolio is\nclosest to:","opts":["5.8.","6.1.","6.2."],"ans":"A","expl":"A. Đúng vì thời hạn tiền (Money Dur) được tính bằng thời hạn\nđược sửa đổi hàng năm nhân với giá đầy đủ (𝑃𝑉𝐹𝑢𝑙𝑙) của trái phiếu, bao gồm cả tiền lãi tích lũy. Do đó\nthời hạn được sửa đổi của các dải lần lượt là 730/95 = 7,6842 và 515/120 = 4,29167.\nThời hạn được sửa đổi của danh mục đầu tư trái phiếu được tính bằng trung bình trọng số của số liệu thống kê\ncho từng trái phiếu riêng lẻ. Tỷ trọng của giá trị thị trường tổng thể của danh mục đầu tư là trọng số\n. Ở đây, giá trị thị trường của trái phiếu là 25 triệu bảng * 95/100 = 23.750.000 bảng và\n25 triệu bảng* 120/100 = 30.000.000 bảng. Do đó, trọng số của trái phiếu đầu tiên trong danh mục đầu tư là\n£23.750.000/(£23.750.000+ £30.000.000) = 44,186% và trọng số của trái phiếu thứ hai trong\ndanh mục đầu tư là £30.000.000/(£23.750.000+ 30.000.000 bảng Anh) = 55,814%. Do đó, thời hạn được sửa đổi\ncủa danh mục đầu tư là 44,186% * 7,6842 + 55,814% * 4,29167 = 3,3953 +2,3953 =\n5,7907, được làm tròn thành 5,8.\nB. Không chính xác vì thời hạn sửa đổi của danh mục đầu tư không bằng mức trung bình có trọng số\ncủa thời hạn tiền của trái phiếu chia cho 100. Thời hạn sửa đổi danh mục đầu tư <>\n44,186% * 730/100 + 55,814% 5,15/100 = 6,1. Thay vào đó, thời hạn được sửa đổi của danh mục đầu tư trái phiếu\nđược tính bằng mức trung bình có trọng số của số liệu thống kê cho từng trái phiếu. Tỷ trọng\ntrong giá trị thị trường tổng thể của danh mục đầu tư là trọng số.\nC. Không chính xác vì thời hạn sửa đổi của danh mục đầu tư không bằng mức trung bình\ncủa thời hạn tiền của trái phiếu chia cho 100. Thời hạn sửa đổi danh mục đầu tư <>\n50% * 730/100 + 50% * 5,15/100 = 6,225, làm tròn thành 6,2. Thay vào đó, thời hạn sửa đổi của\ndanh mục đầu tư trái phiếu được tính bằng mức trung bình có trọng số của số liệu thống kê cho từng trái phiếu\nriêng lẻ. Tỷ trọng của tổng giá trị thị trường của danh mục đầu tư là trọng số. Ứng viên có thể chọn\ntùy chọn này vì mệnh giá của trái phiếu giống nhau.\nThu nhập cố định: tính toán thời hạn và độ lồi của danh mục đầu tư, đồng thời giải thích những hạn chế của những\nđo lường","qhtml":null},{"n":57,"q":"With respect to the credit rating agencies' practice of notching, the size of a notching\nadjustment:","opts":["is larger for higher-rated credits.","is standardized between rating agencies.","depends on the rating of the issuer's senior unsecured debt."],"ans":"C","expl":"A. Không chính xác vì theo nguyên tắc chung, xếp hạng tín chấp cấp cao càng cao thì càng nhỏ.\nsự điều chỉnh khía cạnh.\nB. Không chính xác vì việc khía được áp dụng theo cách thức của từng tổ chức xếp hạng tín nhiệm\nhướng dẫn\nC. Đúng vì nhận ra các ưu tiên thanh toán khác nhau và do đó có khả năng\nmức độ tổn thất cao hơn (hoặc thấp hơn) trong trường hợp vỡ nợ, các cơ quan xếp hạng đã áp dụng\nquá trình xếp hạng theo đó xếp hạng tín dụng của họ về các vấn đề có thể được tăng lên hoặc giảm xuống từ mức\nxếp hạng của tổ chức phát hành thường là xếp hạng được áp dụng cho khoản nợ không có bảo đảm cấp cao. Là một vị tướng\ntheo quy tắc, xếp hạng cấp cao hoặc được bảo đảm càng cao thì mức điều chỉnh khía cạnh fne càng nhỏ. các\nLý do đằng sau điều này là xếp hạng càng cao thì nguy cơ vỡ nợ càng thấp, do đó,\nnhu cầu 'đánh dấu' xếp hạng để nắm bắt mức chênh lệch tiềm năng trong mức lỗ 70 là rất lớn\ngiảm đi. Tuy nhiên, đối với các khoản tín dụng được xếp hạng thấp hơn, rủi ro vỡ nợ sẽ lớn hơn và do đó có khả năng xảy ra\nsự khác biệt về hóa thạch so với xếp hạng giận dữ thấp hơn (hoặc cao hơn là một sự cân nhắc kỹ lưỡng hơn khi đánh giá\nrủi ro tín dụng của một vấn đề\nThu nhập cố định: mô tả thứ hạng thâm niên của khoản nợ, nợ có bảo đảm và không có bảo đảm và\nmức độ ưu tiên của các yêu cầu bồi thường trong việc phá sản và tác động của chúng đối với xếp hạng tín dụng","qhtml":null},{"n":58,"q":"Which of the following is most likely a key factor in the credit analysis of revenue-backed\nnon- sovereign government bonds?","opts":["Per capita income","Breadth of the tax base","Debt-service-coverage ratio of the project"],"ans":"C","expl":"A. Không chính xác vì thu nhập bình quân đầu người là mối quan tâm đối với trái phiếu chính phủ hoặc trái phiếu nghĩa vụ\nchung, chứ không phải trái phiếu doanh thu của chính phủ không có chủ quyền. Thu nhập bình quân đầu người: Nhiều\ncác quốc gia thịnh vượng hơn thường có cơ sở thuế rộng hơn và sâu hơn để hỗ trợ cho khoản nợ\n. Phân tích kinh tế của trái phiếu GO của chính phủ không có chủ quyền, bao gồm\ntrái phiếu đô thị của Hoa Kỳ, tập trung vào việc làm, thu nhập bình quân đầu người (và những thay đổi về thu nhập này theo thời gian),\nnợ bình quân đầu người (và những thay đổi trong đó theo thời gian), cơ sở thuế (độ sâu, chiều rộng, đa dạng hóa,\nsự ổn định, v.v.)\nB. Không chính xác vì cơ sở tính thuế liên quan đến trái phiếu chính phủ hoặc trái phiếu nghĩa vụ chung\n. Thu nhập bình quân đầu người: Các quốc gia thịnh vượng hơn thường có cơ sở thuế\nrộng hơn và sâu hơn để hỗ trợ nợ. Phân tích kinh tế của chính phủ không có chủ quyền\nTrái phiếu GO, bao gồm trái phiếu đô thị của Hoa Kỳ, tập trung vào việc làm, thu nhập bình quân đầu người (và\nnhững thay đổi về thu nhập đó theo thời gian), nợ bình quân đầu người (và những thay đổi trong đó theo thời gian), cơ sở thuế (độ sâu,\nbề rộng, đa dạng hóa, ổn định, v.v.).\nC. Đúng vì trái phiếu doanh thu được phát hành để tài trợ cho dự án cụ thể (ví dụ: tài trợ cho\nhệ thống thoát nước mới, đường thu phí, cầu, bệnh viện, sân thể thao, v.v.). Trái phiếu doanh thu\nđược phát hành để tài trợ cho một dự án cụ thể, có mức độ rủi ro cao hơn trái phiếu GO\nvì chúng phụ thuộc vào một nguồn doanh thu duy nhất. Một thước đo tín dụng quan trọng đối với\ntrái phiếu chính phủ không có chính phủ được bảo đảm bằng doanh thu là tỷ lệ khả năng thanh toán nợ (DSC),\nđo lường mức doanh thu có sẵn để trang trải các khoản thanh toán nợ (gốc và\nlãi) sau chi phí hoạt động.\nThu nhập cố định: giải thích những cân nhắc đặc biệt khi đánh giá tín dụng của chính phủ và\ncác tổ chức phát hành và phát hành nợ chính phủ không có chủ quyền","qhtml":null},{"n":59,"q":"An analyst observes the following yields to maturity on zero-coupon government bonds:\nMaturity Yield to Maturity\n1 year 1.5%\n2 years 2.5%\n3 years 3.5%\nThe 2y1y implied forward rate is closest to:","opts":["4.5%.","5.5%.","6.6%."],"ans":"B","expl":"A. Không chính xác vì đó là lợi tức kỳ hạn ngụ ý 1 năm 2. Năng suất có thể được tìm thấy bằng cách sử dụng (1 +\nz)1 x (1+ IFR )²= (1 + Z )³; (1+0,015)¹× (1+IFR )²= (1+0,035)³× (1+ IFR )² = (1 +\n1,2 3 1,2 1,2\n0,035)/(1+0,015) - 1 = 1,1087/1,0150 = 1,0923. IFR 1,0923 -1 = 0,0451 hoặc 4,51%.\n1,2 =\nB. Đúng vì lợi suất 2 năm 1 năm là lợi suất kỳ hạn một năm được ngụ ý trong hai năm kể từ bây giờ.\nLợi suất ngụ ý trong 2 năm 1 năm có thể được tìm bằng cách sử dụng (1+ z )(1+ z ) x (1+ IFR )=(1+z )3= (1+0,015) x\n1 2 2,1 3\n(1+0,025) x (1+ IFR ) = (1+1,035)³. (1 + IFR )² = (1 +1,040)3/[(1+0,015) x (1,025)] - 1 =\n1,2 1, 2\n1,1087/1,0404 = 1,0656 - 1 = 0,0656 hay 6,6%.\nC. Không chính xác vì nó là trái phiếu ghép lãi có thời hạn 3 năm chia cho\ntích của hai sản lượng đầu tiên đến khi đáo hạn. Sản lượng được tìm thấy là (1 + z₁) × (1+ z₂) ×(1 + IFR )\n1,2\n= (1+z )3 = (1 + 0,015) × (1 + 0,025) × (1+ IFR₁,₂) = (1 +1,035)3. (1 + IFR )²= (1 +\n3 1, 2\n1,040)3/[(1+0,015) x (1,025)] - 1 = 1,1087/1,0404 = 1,0656 - 1 = 0,0656 hay 6,6%\nThu nhập cố định: xác định mệnh giá và tỷ giá kỳ hạn, đồng thời tính tỷ giá mệnh giá, tỷ giá
