that\ncorrespond to each of the bond's promised future payments.\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 48, "q": "An analyst gathers the following information about an annual-pay bond:\nCoupon rate 6.0%\nYield to maturity 4.5%\nMacaulay duration 10.0\nIf the yield to maturity decreases by 100 basis points, the expected percentage change in the\nbond's price is closest to:", "opts": ["9.43%.", "9.57%.", "10.00%"], "ans": "B", "expl": "A. Incorrect because it calculates modified duration using the coupon rather than YTM.\nMacDur / (1 + coupon) = 10/1.06 = 9.43.\nB. Correct because modified duration provides an estimate of the percentage price change\nfor a bond given a change in its yield-to-maturity [YTM]\nModified duration = Macaulay Duration / (1+r) = 10.0 / 1.045 = 9.5694\n%*SYMBOL*PV ≈ - AnnModDur x 𝛥Yield = - 9.5694 x -1% = 9.5694% ≈ 9.57%.\nC. Incorrect because this is Macaulay duration. Macaulay duration must be adjusted by the\nyield-to-maturity to calculate the modified duration, and afterwards, modified duration is\nthe used to calculate the percentage price change for a change in bond's yield to maturity.\nFixed Income: calculate the percentage price change of a bond for a specified change in\nyield, given the bond's duration and convexity", "qhtml": null}, {"n": 49, "q": "Which of the following is most likely a negative covenant?", "opts": ["The issuer must comply with all laws and regulations.", "The issuance of new debt must be junior to existing bondholder debt.", "New debt obligations are treated the same as the borrower's other senior debt instruments."], "ans": "B", "expl": "A. Incorrect because affirmative covenants are typically administrative in nature. For\nexample, frequently used affirmative covenants include what the issuer will do with the\nproceeds from the bond issue and the promise of making the contractual payments. The\nissuer may also promise to comply with all laws and regulations.\nB. Correct because negative pledges prevent the issuance of debt that would be senior to or\nrank in priority ahead of the existing bondholders ' debt. This is a negative covenant.\nC. Incorrect because affirmative covenants are typically administrative in nature. For\nexample, a pari passu (or\"equal footing\") clause, which ensures that a debt obligation is\ntreated the same as the borrower's other senior debt instruments.\nFixed Income: describe the contents of a bond indenture and contrast affirmative and\nnegative covenants", "qhtml": null}, {"n": 50, "q": "An analyst gathers the following information about a 4% annual-payment bond with a\ncurrent yield-to-maturity of 4.0%:\nAnnualized Yield to Maturity Bond Price\n3.9% 100.45\n4.0% 100.00\n4.1% 99.56\nThe bond's annualized Macaulay duration is closest to:", "opts": ["4.28.", "4.45.", "4.63."], "ans": "C", "expl": "A. Incorrect because it determines ApproxModDur but then adjusts the calculated duration\nmeasure by dividing it by (1 + r), instead of multiplying.\nAppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×(𝑃𝑉 )] = (100.45-99.56)/(2 x 0.001 x\n− + 0\n100) = 4.45. ApproxMacDur ≠ ApproxModDur / (1+r) = 4.45/(1+0.04) = 4.279 ≈ 4.28.\nB. Incorrect because it does not further adjust the modified duration to determine the\nMacaulay duration. AppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×(𝑃𝑉 )] = (100.45-\n− + 0\n99.56)/(2 x 0.001 x 100) = 4.45.\nC. Correct because it adjusts the Approximate Modified Duration by 1+ yield to maturity to\ndetermine the Macaulay duration. AppxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2×( 𝛥𝑌𝑖𝑒𝑙𝑑)×\n− +\n(𝑃𝑉 )] = (100.45-99.56)/(2 x 0.001 x 100) = 4.45. Macaulay duration = modified duration x (1\n0\n+ YTM) = 4.45 x (1 + 0.04) = 4.628 ≈ 4.63.\nFixed Income: define, calculate, and interpret Macaulay duration", "qhtml": "<p>An analyst gathers the following information about a 4% annual-payment bond with a current yield-to-maturity of 4.0%:</p><table class=\"qtable\"><thead><tr><th>Annualized Yield to Maturity</th><th>Bond Price</th></tr></thead><tbody><tr><td>3.9%</td><td>100.45</td></tr><tr><td>4.0%</td><td>100.00</td></tr><tr><td>4.1%</td><td>99.56</td></tr></tbody></table><p>The bond's annualized Macaulay duration is closest to:</p>"}, {"n": 51, "q": "An analyst gathers the following information about a company (in $ millions):\n• Operating income 120\n• Net income 85\n• Interest expense 15\n• Depreciation and amortization 15\nInterest coverage using EBIT is closest to:", "opts": ["7x.", "8x.", "9x."], "ans": "B", "expl": "A. Incorrect because this is net income plus depreciation & amortization divided by interest\nexpense.\nInterest coverage ≠ (85 + 15) / 15= $100 / 15 = 6.7, rounded to 7.\nB. Correct because operating income is defined as operating revenues minus operating\nexpenses and is commonly referred to as 'earnings before interest and taxes' (EBIT).\nInterest coverage using EBIT is operating income/interest expense. = $120/15 = 8.\nC. Incorrect because this is interest coverage using EBIT plus depreciation & amortization\n(EBITDA. not EBIT) divided by interest expense.\nInterest coverage ≠ ($120 + $15) / 15 = 9.\nFixed Income: calculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 52, "q": "Which of the following duration statistics best measures the sensitivity of a bond's price\nto a flattening of the yield curve?", "opts": ["Key rate duration", "Effective duration", "Macaulay duration"], "ans": "A", "expl": "A. Correct because key rate duration (or partial duration) is a measure of a bond's sensitivity\nto a change in the benchmark yield curve at a specific maturity segment. In contrast to\neffective duration, key rate durations help identify 'shaping risk for a bond-that is, a bond's\nsensitivity to changes in the shape of the benchmark yield curve (e.g., the yield curve\nbecoming steeper or flatter).\nB. Incorrect because effective duration indicates the bond's sensitivity to the benchmark\nyield curve assuming that all yields change by the same amount. In contrast to effective\nduration, key rate durations help identify shaping risk' for a band that is, a band's sensitivity\nto changes in the shape of the benchmark yield curve (e g., the yield curve becoming\nsteeper or flatter).\nC. Incorrect because yield duration statistics measuring the sensitivity of a bond's full price\nto the bond's own yield- to-maturity include the Macaulay duration, modified duration,\nmoney duration, and price value of a basis point. The Macaulay duration measures the\nsensitivity of a bond's full price to a change in its yield to maturity, not to changes in the\nshape of the benchmark yield curve.\nFixed Income: define key rate duration and describe its use to measure price sensitivity of\nfixed-income instruments to benchmark yield curve changes", "qhtml": null}, {"n": 53, "q": "All else being equal, an investment-grade bond issuer most likely has:", "opts": ["less market liquidity risk than a below-investment-grade issuer.", "the same market liquidity risk as a below-investment-grade issuer.", "greater market liquidity risk than a below-investment-grade issuer."], "ans": "A", "expl": "A. Correct because market liquidity risk is the risk that the price at which investors can\nactually transact-buying or selling-may differ from the price indicated in the market. The\nlower the quality of the issuer, the higher the market liquidity risk\nB. Incorrect because the lower the quality of the issuer, the higher the market liquidity risk.\nIn this case the investment grade borrower has less market liquidity risk, not the same.\nC. Incorrect because the lower the quality of the issuer, the higher the market liquidity risk.\nIn this case the investment grade borrower has less market liquidity risk, not more.\nFixed Income: describe credit risk and its components, probability of default and loss given\ndefault", "qhtml": null}, {"n": 54, "q": "An analyst gathers the following information about an option-free bond:\nPar value $1,000,000\nCurrent market value $912,575\nDuration 2.4\nIf yields are expected to decrease by 50 basis points, the expected price change for the bond\nis closest to:", "opts": ["$11,000.", "$22,000.", "$24,000."], "ans": "A", "expl": "A. Correct because modified duration provides an estimate of the percentage price change\nfor a bond given a change in its yield-to-maturity. A modified duration of 2.4 translates to a\n2.4% percentage price change given a 100 basis points change in the bond's yield to\nmaturity. Therefore, for a 50 basis point decrease in yields, the bond's price will change by\n(2.4)(0.0050)($912,575) = $10.951 ≈ $11,000.\nB. Incorrect because it uses an incorrect calculation ( 0.024)($912,575) = $21,902 ≈ $22,000.\nC. Incorrect because it uses an incorrect calculation (0.024)($1,000,000) = $24,000.\nFixed Income: calculate the percentage price change of a bond for a specified change in\nyield, given the bond's duration and convexity", "qhtml": null}, {"n": 55, "q": "The price value of a basis point (PVBP) for a bond with a full price of 103.50 and a\nmodified duration of 6.2 is closest to:", "opts": ["0.0642.", "0.6420.", "6.4200."], "ans": "A", "expl": "A. Correct because modified duration provides an estimate of the percentage price change\nfor a bond given a change in its yield-to-maturity: %𝛥𝑃𝑉𝐹𝑢𝑙𝑙 ≈ -AnnModDur x 𝛥Yield. Also,\nanother version of money duration is the price value of a basis point (PVBP) for the bond.\nThe PVBP is an estimate of the change in the full price given a 1 bp change in the yield-to-\nmaturity Here: -6.2 x 0.0001 0.00062 and PVBP = 0.00062 x 103.50 = 0.06417, rounded to\n0.0642.\nB. Incorrect because it represents a 10 bp change in rates, not 1 bp: -6.2 x 0.001 = 0.0062\nand PVBP ≠ 0.0062 × 103.50 = 0.6417, rounded to 0.642.\nC. Incorrect because it represents a 1 percent change in rates (100 bp), not 1 bp: -6.2 x 0.01\n= 0.062 and PVBP ≠ 0.062 × 103.50 = 6.417, rounded to 6.42\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 56, "q": "An analyst gathers the following details about a bond portfolio:\nBond Market Price (per 100 of par value) Money Duration (per 100 of par value)\n1 95 730\n2 120 515\nIf each bond has a par value of £25 million, the modified duration of this bond portfolio is\nclosest to:", "opts": ["5.8.", "6.1.", "6.2."], "ans": "A", "expl": "A. Correct because money duration (Money Dur) is calculated as the annual modified\nduration times the full price (𝑃𝑉𝐹𝑢𝑙𝑙) of the bond, including accrued interest. Thus the\nmodified durations of the bands are 730/95 = 7.6842 and 515/120 = 4.29167, respectively.\nThe modified duration of a bond portfolio is calculated as the weighted average of the\nstatistics for the individual bonds. The shares of overall portfolio market value are the\nweights. Here, the market values of the bonds are £25 million * 95/100 = £23,750,000 and\n£25 million* 120/100 = £30,000,000. Thus the weight of the first bond in the portfolio is\n£23,750,000/(£23,750,000+ £30,000,000) = 44.186% and the weight of the second bond in\nthe portfolio is £30,000,000/(£23,750,000+ £30,000,000) = 55.814%. The modified duration\nof the portfolio is therefore 44.186% * 7.6842 + 55.814% * 4.29167 = 3.3953 +2.3953 =\n5.7907, rounded to 5.8.\nB. Incorrect because the modified duration of the portfolio is not equal to the weighted\naverage of the money durations of the bonds divided by 100. Portfolio modified duration <>\n44.186% * 730/100 + 55.814% 5.15/100 = 6.1. Instead, the modified duration of a bond\nportfolio is calculated as the weighted average of the statistics for the individual bonds. The\nshares of overall portfolio market value are the weights.\nC. Incorrect because the modified duration of the portfolio is not equal to the simple\naverage of the money durations of the bonds divided by 100. Portfolio modified duration <>\n50% * 730/100 + 50% * 5.15/100 = 6.225, rounded to 6.2. Instead, the modified duration of\na bond portfolio is calculated as the weighted average of the statistics for the individual\nbonds. The shares of overall portfolio market value are the weights. Candidates may choose\nthis option because the par values of the bonds are the same.\nFixed Income: calculate portfolio duration and convexity and explain the limitations of these\nmeasures", "qhtml": null}, {"n": 57, "q": "With respect to the credit rating agencies' practice of notching, the size of a notching\nadjustment:", "opts": ["is larger for higher-rated credits.", "is standardized between rating agencies.", "depends on the rating of the issuer's senior unsecured debt."], "ans": "C", "expl": "A. Incorrect because as a general rule , the higher the senior unsecured rating, the smaller\nthe notching adjustment.\nB. Incorrect because notching is applied according to each credit rating agency's notching\nguidelines\nC. Correct because recognizing different payment priorities, and thus the potential for\nhigher (or lower) loss severity in the event of default, the rating agencies have adopted a\nnotching process whereby their credit ratings on issues can be moved up or down from the\nissuer rating which is usually the rating applied to its senior unsecured debt. As a general\nrule, the higher the senior orisecured rating, the smaller fne notching adjustment. The\nreason behind this is that the higher the rating, the lower the perceived risk of default so,\nthe need to 'notch' the rating to capture the potential difference in loss seventy is greatly\nreduced. For lower rated credits, however, the risk of default is greater and thus be potensa\ndifference in foss from a lower (or higher angray ranking is a bager consideration in assessing\nan issue's credit riskiness\nFixed Income: describe the seniority rankings of debt, secured versus unsecured debt and\nthe priority of claims in bankruptcy, and their impact on credit ratings", "qhtml": null}, {"n": 58, "q": "Which of the following is most likely a key factor in the credit analysis of revenue-backed\nnon- sovereign government bonds?", "opts": ["Per capita income", "Breadth of the tax base", "Debt-service-coverage ratio of the project"], "ans": "C", "expl": "A. Incorrect because per capita income is a concern for sovereign bonds or general\nobligation bonds, not non- sovereign government revenue bonds. Income per capita: More\nprosperous countries generally have a broader and deeper tax base with which to support\ndebt. The economic analysis of non-sovereign government GO bonds, including US\nmunicipal bonds, focuses on employment, per capita income (and changes in it over time),\nper capita debt (and changes in it over time), the tax base (depth, breadth, diversification,\nstability, etc.)\nB. Incorrect because the tax base is a concern for sovereign bonds or general obligation\nbonds. Income per capita: More prosperous countries generally have a broader and deeper\ntax base with which to support debt. The economic analysis of non-sovereign government\nGO bonds, including US municipal bonds, focuses on employment, per capita income (and\nchanges in it over time), per capita debt (and changes in it over time), the tax base (depth,\nbreadth, diversification, stability, etc.).\nC. Correct because revenue bonds are issued for specific project financing (eg, financing for\na new sewer system, a toll road, bridge, hospital, a sports arena, etc.). Revenue bonds,\nwhich are issued to finance a specific project, have a higher degree of risk than GO bonds\nbecause they are dependent on a single source of revenue. A key credit measure for\nrevenue-backed non-sovereign government bonds is the debt-service-coverage (DSC) ratio,\nwhich measures how much revenue is available to cover debt payments (principal and\ninterest) after operating expenses.\nFixed Income: explain special considerations when evaluating the credit of sovereign and\nnon-sovereign government debt issuers and issues", "qhtml": null}, {"n": 59, "q": "An analyst observes the following yields to maturity on zero-coupon government bonds:\nMaturity Yield to Maturity\n1 year 1.5%\n2 years 2.5%\n3 years 3.5%\nThe 2y1y implied forward rate is closest to:", "opts": ["4.5%.", "5.5%.", "6.6%."], "ans": "B", "expl": "A. Incorrect because it is the 1y2y implied forward yield. The yield can be found using (1 +\nz)1 x (1+ IFR )²= (1 + Z )³; (1+0.015)¹× (1+IFR )²= (1+0.035)³× (1+ IFR )² = (1 +\n1,2 3 1,2 1,2\n0.035)/(1+0.015) - 1 = 1.1087/1.0150 = 1.0923. IFR 1.0923 -1 = 0.0451 or 4.51%.\n1,2 =\nB. Correct because the 2y1y yield is the implied one-year forward yield two years from now.\nThe 2y1y implied yield can be found using (1+ z )(1+ z ) x (1+ IFR )=(1+z )3= (1+0.015) x\n1 2 2,1 3\n(1+0.025) x (1+ IFR ) = (1+1.035)³. (1 + IFR )² = (1 +1.040)3/[(1+0.015) x (1.025)] - 1 =\n1,2 1, 2\n1.1087/1.0404 = 1.0656 - 1 = 0.0656 or 6.6%.\nC. Incorrect because it is the compounded three year to maturity bond divided by the\nproduct of the first two yields to maturity. The yield is found as (1 + z₁) × (1+ z₂) ×(1 + IFR )\n1,2\n= (1+z )3 = (1 + 0.015) × (1 + 0.025) × (1+ IFR₁,₂) = (1 +1.035)3. (1 + IFR )²= (1 +\n3 1, 2\n1.040)3/[(1+0.015) x (1.025)] - 1 = 1.1087/1.0404 = 1.0656 - 1 = 0.0656 or 6.6%\nFixed Income: define par and forward rates, and calculate par rates, forward rates from spot\nrates, spot rates from forward rates, and the price of a bond using forward rates", "qhtml": null}, {"n": 60, "q": "An analyst gathers the following information:\nTime to Maturity Yield to Maturity\nBond 1 Three years 3.4%\nBond 2 Eight years 5.4%\nBased only on this information, the estimated market discount rate for a 5-year bond with\nsimilar credit quality is:", "opts": ["4.2%.", "4.4%.", "4.6%."], "ans": "A", "expl": "A. Correct because some fixed-rate bonds are not actively traded. Therefore, there is no\nmarket price available to ca two given bonds, we have: 0.034+\n(8-5)/(8-3) * (0.054 -0.034) = 0.034 +3/5x0.02 = 0.046 = 4.6%.\nFixed Income: describe matrix pricing", "qhtml": null}, {"n": 61, "q": "Compared to an otherwise similar option-free bond, investors require a higher yield for a\ncorporate bond with a:", "opts": ["put provision.", "call provision.", "conversion provision."], "ans": "B", "expl": "A. Incorrect because the put provision is a valuable option for the bondholders, therefore\nputable bonds offer a lower yield (and thus have a higher price) than otherwise similar non-\nputable bonds.\nB. Correct because the call provision is a valuable option for the issuer. Thus, other things\nequal, investors require a higher yield (and thus pay a lower price) for a callable bond than\nfor an otherwise similar non-callable bond.\nC. Incorrect because a convertible bond gives the bondholder the right to convert the bond\ninto common shares of the issuing company. Because this option favors the bondholder,\nconvertible bonds offer a lower yield and sell at a higher price than otherwise similar non-\nconvertible bonds.\nFixed Income: describe common cash flow structures of fixed-income instruments and\ncontrast cash flow contingency provisions that benefit issuers and investors", "qhtml": null}, {"n": 62, "q": "The price of a bond issued in the United Kingdom by a US-based company and\ndenominated in British pounds most likely changes when:", "opts": ["US interest rates change only.", "British interest rates change only.", "both US and British interest rates change"], "ans": "B", "expl": "A. Incorrect because the currency denomination of a bond's cash flows influences which\ncountry's interest rates affect a bond's price. The price of a bond issued by a US-based\ncompany and denominated in British pounds will be affected by British interest rates.\nB. Correct because the currency denomination of a bond's cash flows influences which\ncountry's interest rates affect a bond's price. The price of a bond issued by a US-based\ncompany and denominated in British pounds will be affected by British interest rates.\nC. Incorrect because the currency denomination of a bond's cash flows influences which\ncountry's interest rates affect a bond's price. The price of a bond issued by a US-based\ncompany and denominated in British pounds will be affected by British interest rates.\nFixed Income: describe how legal, regulatory, and tax considerations affect the issuance and\ntrading of fixed-income securities", "qhtml": null}, {"n": 63, "q": "A floating-rate note makes semiannual interest payments and has a coupon rate equal to\nthe six-month market reference rate plus 45 basis points. The interest payments are made in\nJune and December. If the six-month market reference rate was 1.95% in June and 2.25% in\nDecember of the same year, the coupon rate paid in December of that year was closest to", "opts": ["2.40%.", "2.55%.", "2.70%."], "ans": "A", "expl": "A. Correct because the applicable interest rate in December is the six-month market\nreference rate in June plus the 45 basis point margin = 1.95% +0.45% = 2.40%.\nB. Incorrect because the 45 bps margin is added to the average of the June and December\nsix-month market reference rates = (2.25% + 1.95% )/2+0.45% = 2.55%.\nC. Incorrect because the 45 bps margin is added to the market reference rate in December =\n2.25% +0.45% = 2.70%\nFixed Income: calculate and interpret yield spread measures for floating-rate instruments", "qhtml": null}, {"n": 64, "q": "An analyst observes the following price-yield relationship for an option-free bond:\nPrice per 100 of Par Value Yield to Maturity\n100.95 7.45%\n101.80 6.75%\n103.40 6.05%\nIf the bond trades at 101.80 per 100 of par value, its approximate modified duration is closest\nto:", "opts": ["1.72.", "2.25.", "3.44."], "ans": "A", "expl": "A. Correct because the approximate modified duration of a bond is calculated as follows:\nApproxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\n= (103.40 - 100.95)/(2 x 0.0070 x 101.80)\n= 2.45/1.4252 = 1.7191 ≈ 1.72.\nB. Incorrect because the approximate modified duration of a bond is calculated as follows\nApproxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\nHowever, in this case, the higher yield/lower price is omitted from the calculation and the\nmultiplication by 2 in the denominator is omitted as well: = (103.40 -\n101.80)/(101.80*(6.75% - 6.05%)) = 2.2453 = 2.25.\nC. Incorrect because the approximate modified duration of a bond is calculated as follows\nApproxModDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝑌𝑖𝑒𝑙𝑑)∗(𝑃𝑉 )]\n− + 0\nHowever, in this case, the number 2 is omitted from the denominator.\n= (103.40-100.95)/(0.0070 × 101.80)\n= 2.45/0.7126 = 3.4381 ≈ 3,44.\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 65, "q": "An analyst gathers the following information about a bond which is currently trading at\n95.35 per 100 par\nBenchmark Yield Bond Price\n3.50% 99.50\n4.00% 95.35\n4.50% 92.25\nThe effective duration of the bond is closest to:", "opts": ["6.5.", "7.6.", "8.7"], "ans": "B", "expl": "A. Incorrect because the effective duration is incorrectly calculated as\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )] = (95.35-92.25)/(0.005 × 95.35) = 6.50.\n0 + 0\nB. Correct because the effective duration of a bond is the sensitivity of the bond's price to a\nchange in a benchmark yield curve.\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )]\n− + 0\nWith 𝑃𝑉 = 95.35, 𝑃𝑉 = 99.50, 𝑃𝑉 = 92.25,\n0 − +\nEffDur= (99.50 - 92.25)/(2 x 0.005 x 95,35) = 7.60\nC. Incorrect because the effective duration is incorrectly calculated as\nEffDur = [(𝑃𝑉 )−(𝑃𝑉 )]/[( 𝛥𝐶𝑢𝑟𝑣𝑒)∗(𝑃𝑉 )] = (99.50 - 95.35)/(0.005 x 95.35) = 8.70\n− + 0\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": "<p>An analyst gathers the following information about a bond which is currently trading at 95.35 per 100 par:</p><table class=\"qtable\"><thead><tr><th>Benchmark Yield</th><th>Bond Price</th></tr></thead><tbody><tr><td>3.50%</td><td>99.50</td></tr><tr><td>4.00%</td><td>95.35</td></tr><tr><td>4.50%</td><td>92.25</td></tr></tbody></table><p>The effective duration of the bond is closest to:</p>"}, {"n": 66, "q": "An analyst gathers the following information about a bond:\nPar value 100\nCoupon rate 5.50%\nCoupon frequency Annual\nTime to maturity 5 years\nHolding period 3 years\nIf the market discount rate is 4.75% for the holding period, the future value of reinvested\ncoupons at the end of the holding period is closest to:", "opts": ["15.05.", "17.30.", "18.12."], "ans": "B", "expl": "A. Incorrect because 4.75% is used as the coupon rate and 5.50% as the reinvestment rate,\nresulting in (4.75 x 1.0550^2) + (4.75 x 1.0550) + 4.75 = 15.0481 ≈ 15.05.\nInterest rates are the rates at which coupon payments are reinvested and the market\ndiscount rates at the time of purchase and at the time of sale if the bond is not held to\nmaturity.\nB. Correct because the first coupon is reinvested at 4.75% for two years, the second coupon\nis reinvested at 4.75% for one year, and the third coupon has not yet been reinvested.\n(5.50 × 1.0475^2)+(5.50×1.0475) + 5.50 = 17 2962 ≈ 17 30.\nInterest rates are the rates at which coupon payments are reinvested and the market\ndiscount rates at the time of purchase and at the time of sale if the bond is not held to\nmaturity.\nC. Incorrect because the coupons are deemed to have been reinvested over 3 years, 2 years,\nand 1 year, respectively, resulting in (5.50 x 1.0475^3)+(5.50 x 1.0475 ^2)+(5.50 x 1.0475) =\n18.1177 ≈ 18.12.\nInterest rates are the rates at which coupon payments are reinvested and the market\ndiscount rates at the time of purchase and at the time of sale if the bond is not held to\nmaturity.\nFixed Income: calculate and interpret the sources of return from investing in a fixed-rate\nbond;", "qhtml": null}, {"n": 67, "q": "Bonds are quoted using the:", "opts": ["full price and settled using the flat price.", "flat price and settled using the full price.", "\"dirty\" price and settled using the invoice price."], "ans": "B", "expl": "A. Incorrect because the flat price usually is quoted by bond dealers. If a trade takes place,\nthe accrued interest is added to the flat price to obtain the full price paid by the buyer and\nreceived by the seller on the settlement date.\nB. Correct because the flat price usually is quoted by bond dealers. If a trade takes place,\nthe accrued interest is added to the flat price to obtain the full price paid by the buyer and\nreceived by the seller on the settlement date.\nC. Incorrect because the flat price usually is quoted by bond dealers. If a trade takes place,\nthe accrued interest is added to the flat price to obtain the full price paid by the buyer and\nreceived by the seller on the settlement date\" and the full price also is called the invoice or\n'dirty' price.\nFixed Income: calculate a bond's price given a yield-to-maturity on or between coupon\ndates", "qhtml": null}, {"n": 68, "q": "Which of the following does not depend on the market discount rate? A bond's:", "opts": ["flat price", "full price", "accrued interest"], "ans": "C", "expl": "A. Incorrect because it is the flat price that is affected by a market discount rate change\nB. Incorrect because it is the flat price that is affected by a market discount rate change, and\nif the flat price is affected by the market discount rate so is the full price (as full price equals\nflat price plus accrued interest).\nC. Correct because the accrued interest part of the full price does not depend on the yield-\nto-maturity.\nFixed Income: calculate a bond's price given a yield-to-maturity on or between coupon\ndates", "qhtml": null}, {"n": 69, "q": "An investor determines the following information about the price sensitivity of an option-\nfree bond:\nRate Change Price\n75 basis point increase 104.0\n75 basis point decrease 108.5\nIf the current price is 106, the duration of this bond is closest to:", "opts": ["2.1.", "2.8.", "3.0."], "ans": "B", "expl": "A. Incorrect because it uses 100 bps instead of 75bps in the denominator\nDuration ≠ 108.5 - 104\n2 × 106 x 0.0100 ≠ 2.12, or 2.1\nB. Correct because the following formula estimates the approximate percentage price\nchange for a 100 basis point change in yield (duration) is\nDuration = Price if yield declines - Price if yield rises\n2 x (initial price) x (change in yield in decimal format)\n= 108.5 - 104\n2 x 106 x 0.0075\n= 4.5\n1.59\n= 2.83, or 2.8\nC. Incorrect because it uses par value instead of market value in the denominator\nDuration ≠ 108.5 - 104\n2 x 100 x 0.0075 ≠ 3.0\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 70, "q": "The number of common shares a convertible bond can be converted into is the:", "opts": ["conversion ratio.", "conversion price.", "conversion value."], "ans": "A", "expl": "A. Correct because the conversion ratio is the number of common shares that each bond\ncan be converted into.\nB. Incorrect because the conversion price is the price per share at which the convertible\nbond can be converted into shares.\nC. Incorrect because the conversion value, sometimes called the parity value, is the current\nshare price multiplied by the conversion ratio.\nFixed Income: describe common cash flow structures of fixed-income instruments and\ncontrast cash flow contingency provisions that benefit issuers and investors", "qhtml": null}, {"n": 71, "q": "A credit card receivable asset-backed security most likely.", "opts": ["faces high prepayment risk.", "uses fully-amortizing loans as collateral.", "reinvests principal repayments during the lockout period."], "ans": "C", "expl": "A. Incorrect because a non-amortizing loan does not involve scheduled principal\nrepayments, an ABS backed by non-amortizing loans is not affected by prepayment risk.\nCredit card receivable ABS are an example of ABS backed by non-amortizing loans\nB. Incorrect because a non-amortizing loan does not involve scheduled principal\nrepayments, an ABS backed by non-amortizing loans is not affected by prepayment risk.\nCredit card receivable ABS are an example of ABS backed by non-amortizing loans.\nC. Correct because the collateral of credit card receivable ABS is a pool of non-amortizing\nloans. These loans have lockout periods during which the cash flows that are paid out to\nsecurity holders are based only on finance charges collected and fees. When the lockout\nperiod is over, the principal that is repaid by the cardholders is no longer reinvested but\ninstead is distributed to investors.\nFixed Income: describe types and characteristics of non-mortgage asset-backed securities,\nincluding the cash flows and risks of each type", "qhtml": null}, {"n": 72, "q": "An analyst gathers the following information about a bond currently trading at par.\nChange in Benchmark Curve Price per 100 of Par Value\n+25 bps 98\n-25 bps 103\nThe effective duration of this bond is closest to:", "opts": ["2.5.", "5.0.", "10.0."], "ans": "C", "expl": "A. Incorrect because it omits the basis point change x 100 from the calculation.\nEffective duration ≠ (𝑃𝑉 )−(𝑃𝑉 )/2 = (103 - 98)/2 = 2.5\n− +\nB. Incorrect because it is the difference in the prices (103-98 = 5).\nC. Correct because the effective duration is calculated as (𝑃𝑉 )−(𝑃𝑉 )]/[2∗( 𝛥𝐶𝑢𝑟𝑣𝑒)∗\n− +\n𝑃𝑉 ) where: 𝑃𝑉 = the bond price when the benchmark yield is decreased, 𝑃𝑉 = the bond\n0 + 0\nprice when the benchmark yield is increased, and PV, then current bond price.\nEffective duration = (103-98)/(2 * 0.0025 × 100) = 10.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 73, "q": "An analyst gathers the following spot and forward rates:\n2-year spot rate 1.0%\n4-year spot rate 2.5%\n4-year forward rate, two years from today 3.0%\nThe 2-year forward rate, four years from today is closest to:", "opts": ["2%.", "3%.", "4%."], "ans": "A", "expl": "A. Correct because the general formula for the relationship between two spot rates and the\nimplied forward rate is (1+𝑍 )𝐴 * (1+𝐼𝐹𝑅 )𝐵−𝐴 = (1+𝑍 )𝐵𝑛 where z, is the x-\n𝐴 𝐴.𝐵−𝐴 𝐵\nyear spot rate and IFR is the y-year forward rate, x years from now. Using the formula, the 6\nyear spot rate can be calculated in two different ways:\nX\n1. Using A = 2, B=6 : (1 + z )6 = (1 + z )2 × (1+ IFR )4\n6 2 2,4\n2. Using A = 4, B = 6: (1 + z )6 = (1 + Z ) × (1+IFR )2\n6 4 4,2\nEquating the two we get: (1+z2)2 x (1 + IFR )4 = (1 + z )4 × (1+ IFR )2. Using the numbers\n2,4 4 4,2\nfrom the stem:\n(1+0.01)2 × (1+0.03)4=(1+0.025)4 × (1+IFR )4\n4,2\n1.0201 x 1.1255 = 1.1038 × (1+ IFR )2\n4,2\nIFR =(1.1481/1.1038)0.5-1=0.0199~2%.\n4,2\nB. Incorrect because instead of using the formula for the relationship between spot rates\nand the implied forward rates, the candidate assumed that the 2 year forward rate, 4 years\nfrom today is equal to the 4 year forward rate, 2 years from today.\nC. Incorrect because when calculating IFR in the last step, the candidate forgets to take the\nsquare root IFR ≠1.1481/1.1038-1 = 0.0401 ≈ 4%.\n4,2\nFixed Income: define par and forward rates, and calculate par rates, forward rates from spot\nrates, spot rates from forward rates, and the price of a bond using forward rates", "qhtml": null}, {"n": 74, "q": "A bond issuer has a credit rating of BBB. Based only on this information, the rating of a\nsenior unsecured bond from this issuer is most likely to be:", "opts": ["lower than BBB.", "BBB", "higher than BBB."], "ans": "B", "expl": "A. Incorrect because as noted in the rationale for the correct answer, the issuer credit rating\nusually applies to senior unsecured debt.\nB. Correct because the issuer credit rating usually applies to its senior unsecured debt.\nC. Incorrect because as noted in the rationale for the correct answer, the issuer credit rating\nusually applies to senior unsecured debt.\nFixed Income: describe the seniority rankings of debt, secured versus unsecured debt and\nthe priority of claims in bankruptcy, and their impact on credit ratings", "qhtml": null}, {"n": 75, "q": "An analyst gathers the following information about a zero-coupon bond:\nTime to maturity 5 years\nAnnual convexity 28.835\nAnnual yield to maturity 2%\nIf the yield decreases by 1%, the bond's percentage change in price is closest to:", "opts": ["4.76%.", "5.05%.", "5.14%."], "ans": "B", "expl": "A. Incorrect because the convexity adjustment is subtracted rather than added. The\npercentage change in price is not equal to -4.901961*-0.01- (0.5 * 28.835* -\n0.014)=0.04901961 -0.0014418 = 4.757781%, rounded to 4.76%.\nB. Correct because the Macaulay duration of a zero-coupon bond is its time-to-maturity and\nmodified duration is the Macaulay duration statistic divided by one plus the yield per period\nHere, modified duration = 5 / 1.02 = 4.901961\nThus, the percentage change in price = -4.901961* -0.01 + (0.5*28.835* -0.012) =\n0.04901961 + 0.0014418 = 5.04614%, rounded to 5.05%.\nC. Incorrect because the convexity adjustment is applied to the Macaulay duration rather\nthan the modified duration. The percentage change in price is not equal to -5* -0.01+\n(0.5*28.835 - 0.012) = 0.05 +0.0014418 = 5.14418%, rounded to 5.14%.\nFixed Income: calculate the percentage price change of a bond for a specified change in\nyield, given the bond's duration and Convexity", "qhtml": null}, {"n": 76, "q": "The Macaulay duration of a zero-coupon bond is most likely.", "opts": ["less than the time to maturity.", "equal to the time to maturity.", "greater than the time to maturity."], "ans": "B", "expl": "A. Incorrect because the Macaulay duration of a zero-coupon bond is equal to the time-to-\nmaturity, not less-than the time-to-maturity.\nB. Correct because the Macaulay duration of a zero-coupon bond is its time-to-maturity.\nC. Incorrect because the Macaulay duration of a zero-coupon bond is equal to the time-to-\nmaturity, not greater-than the time-to-maturity.\nFixed Income: define, calculate, and interpret Macaulay duration", "qhtml": null}, {"n": 77, "q": "US municipal bonds are best described as:", "opts": ["agency bonds.", "non-sovereign bonds.", "quasi-government bonds."], "ans": "B", "expl": "A. Incorrect because government agencies are quasi-government entities that issue debt in\norder to fund the government-sponsored provision of specific public goods or services\nbased on sovereign or local law This may involve the financing of specific activities\npromoted by the government or the operation of necessary infrastructure as mandated by\nlaw The bonds issued by these agencies are known as quasi government bonds or agency\nbonds\nB. Correct because the main types of non-sovereign government issuers include agencies,\npublic banks supranationals and regional governments Redicinal Government testers. These\ninclude provincial, state, ama incal governams, referred to as municipal bouds in the US and\nmost often as local authority bonds elsewhere within a specias sovereign Jurisdiction\nC. Incorrect because government agencies are quas-government entities that issue debt in\norder to fund the government-sponsored provisies of specific public goods or senecue based\non sovereign or local law. This may involve the financing of snet 50 aervities promoter by\nthe emernout the asennon of necessary lottastover, its mamfered by lass Timi coals relied\nby these agences are asoen as quest bouddment biheds or nearly bonds\nFixed Income: desenterfinding choices by sovereign and monisovereige governments, quasi-\ngovamenteobusa and supranational agencies", "qhtml": null}, {"n": 78, "q": "A bond portfolio consists of the following option-free annual-pay coupon bonds:\nBond 1 Bond 2\nPar value $300,000 $450,000\nMarket value $200,000 $400,000\nYield to maturity 4% 3%\nMacaulay duration 7.5 5.4\nThe modified duration of this portfolio is closest to:", "opts": ["5.9.", "6.0.", "6.1."], "ans": "A", "expl": "A. Correct because the Macaulay and modified durations for the portfolio are calculated as\nthe weighted average of the statistics for the individual bonds. The shares of overall\nportfolio market value are the weights.\nFirst we calculate the modified duration (ModDur) of the individual bonds using formula\nbelow\nModDur = MacDur / (1+r)\nModDur of Bond 1 = 7.5/(1+4%) = 7.211538\nModDur of Bond 2 = 5.4/(1+3%) = 5.242718.\nNext, we calculate the weights for the individual bonds based on market values, as follows:\nWeight for Bond 1 = $200,000 / ($200,000 + $400,000) = 0.333333\nWeight for Bond 2 = $400,000 / ($200,000 + $400,000) = 0.666667\nModified duration of the portfolio = (Weight for Bond 1 x ModDur of Bond 1) + (Weight for\nBond 2 x ModDur of Bond 2) = (0.333333 7.211538) + (0.666667 x 5.242718)= 5.898992 ≈\n5.9.\nB. Incorrect because the weights based on par value are used.\nWeight for Bond 1≠ $300,000/ ($300,000+ $450,000) = 0.4\nWeight for Bond 2≠ $450,000/ ($300,000+ $450,000) = 0.6\nModified duration of the portfolio (0.4 x 7.211538) + (0.6 x 5.242718)=6.030246 ≈ 6.0.\nC. Incorrect because it uses Macaulay duration instead of modified duration for the\nindividual bonds, and represents the Macaulay duration of the portfolio.\nModified duration of the portfolio Macaulay duration of the portfolio = (0.333333 x 7.5) +\n(0.666667 × 5.4) = 6.099999 ≈ 6.1.\nFixed Income: calculate portfolio duration and convexity and explain the limitations of these\nmeasures", "qhtml": "<p>A bond portfolio consists of the following option-free annual-pay coupon bonds:</p><table class=\"qtable\"><thead><tr><th></th><th>Bond 1</th><th>Bond 2</th></tr></thead><tbody><tr><td>Par value</td><td>$300,000</td><td>$450,000</td></tr><tr><td>Market value</td><td>$200,000</td><td>$400,000</td></tr><tr><td>Yield to maturity</td><td>4%</td><td>3%</td></tr><tr><td>Macaulay duration</td><td>7.5</td><td>5.4</td></tr></tbody></table><p>The modified duration of this portfolio is closest to:</p>"}, {"n": 79, "q": "An analyst gathers the following information about forward rates:\nTime Period Forward Rate\n0y1y 1%\n1y1y 2%\n2y1y 4%\nUsing only this information, the price per 100 of par value of a 3-year, 1% annual coupon\nbond is closest to:", "opts": ["84.05.", "91.74.", "96.23."], "ans": "C", "expl": "A. Incorrect because each denominator is raised to the power of the corresponding year.\nPV ≠ PMT/ (1 +0y1y) + PMT/ (1+0y1y x 1y1y)2 + (PMT + FV)/(1+0y1y x 1y1y x 2y1y)3\nPV ≠ 1/(1+1%) + 1/((1+1%) (1 + 2% ))2 + (1+100)/((1+1%) (1+2%) (1 + 4% ) )3 = 0.9901+0.9422\n+82.1215 = 84.0538, rounded to 84.05.\nB. Incorrect because the forward rates are used directly as spot rates. Hence,\nPV ≠ PMT / (1 + Z )1 + PMT / (1 + Z )2 + ... + (PMT + FV) / (1 + Z )N\n1 2 N\nPV ≠ 1/(1+1%)1 +1 / (1 +2%)2 + (1 + 100)/(1+4%)3 = 0.9901 +0.9612 +89.7886 = 91.7399,\nrounded to\n91.74.\nC. Correct because the geometric average of the forward rates gives us the spot rates (ie.\n(0y1y x 1y1y) = (1 + Z )2, (0y1y x 1y1y x 2y1y) = (1 + Z )3)), hence the price of a bond using\n2 3\nforward rates can be calculated using: PV = PMT / (1 + Z )1 + PMT / (1 + Z )2+. + (PMT +\n1 2\nFV)/(1+Z )N where 𝑍 = spot rate, or the zero-coupon yield, or zero rate, for Period 1, 𝑍 =\nN 1 2\nspot rate, or the zero-coupon yield, or zero rate, for Period 2, 𝑍 = spot rate, or the zero-\n𝑁\ncoupon yield, or zero rate, for Period N.\nPV> = PMT / (1 +0y1y) + PMT / (1 + 0y1y x 1y1y) + (PMT + FV) / (1 +0y1y x 1y1y x 2y1y)\nPV = 1 / (1 +1%) + 1/((1+1%) (1+2% )) + (1 + 100)/((1+1%) (1+2%) (1+4%) = 0.9901+0.9707\n+94.2685 = 96.2293, rounded to 96.23.\nFixed Income: define par and forward rates, and calculate par rates, forward rates from spot\nrates, spot rates from forward rates, and the price of a bond using forward rates", "qhtml": null}, {"n": 80, "q": "With respect to interest rate risk, an investor who sells a fixed-rate bond after the first\ncoupon is received and before its maturity is exposed to:", "opts": ["market price risk, only.", "coupon reinvestment risk, only", "both market price risk and coupon reinvestment risk."], "ans": "C", "expl": "A. Incorrect because changes in interest rates change the future value of reinvested coupon\npayments. Therefore, the investor faces coupon reinvestment risk, too.\nB. Incorrect because the investor will be selling the bond before maturity and faces the risk\nthat it will be sold at a higher or lower price (market price risk).\nC. Correct because the investor faces coupon reinvestment risk for all coupons received\n(first coupon plus any others until sale) and also faces market price risk as changes in the\ninterest rate will impact the sale price of the bond.\nCoupon reinvestment risk matters more when the investor has a long-term horizon relative\nto the time-to-maturity of the bond. For instance, a buy-and-hold investor only has coupon\nreinvestment risk. Market price risk matters more when the investor has a short-term\nhorizon relative to the time-to-maturity. For example, an investor who sells the bond before\nthe first coupon is received has only market price risk.\nFixed Income: calculate and interpret the sources of return from investing in a fixed-rate\nbond;", "qhtml": null}, {"n": 81, "q": "For an option-free fixed-rate corporate bond, the duration and convexity statistics are\nmost likely relevant for a change in:", "opts": ["the credit spread only.", "the benchmark yield only", "both the credit spread and the benchmark yield.]"], "ans": "C", "expl": "A. Incorrect because the yield-to-maturity on a corporate bond consists of a government\nbenchmark yield and a spread, a change in the bond's yield-to-maturity can originate in\neither component or a combination of the two. The key point is that for an option-free\nfixed-rate bond, the same duration and convexity statistics that apply for a change in\nbenchmark yield also apply for a change in spread\nB. Incorrect because the yield-to-maturity on a corporate bond consists of a government\nbenchmark yield and a spread a change in the bond's yield-to-maturity can originate in\neither component or a combination of the two The key point is that for an option-free fixed-\nrate bond, the same duration and convexity statistics that apply for a change in benchmark\nyield also apply for a change in spread.\nC. Correct because the key point is that for an option-free fixed-rate bond, the same\nduration and convexity statistics that apply for a change in benchmark yield also apply for a\nchange in spread.\nFixed Income: describe macroeconomic, market, and issuer-specific factors that influence\nthe level and volatility of yield spreads", "qhtml": null}, {"n": 82, "q": "An analyst gathers the following information about a callable bond that pays interest\nannually:\nCurrent price 105 per 100 of par value\nTime-to-maturity 4 years\nCoupon rate 4%\nCall price at year 2 103 per 100 of par value\nCall price at year 3 101 per 100 of par value\nThis bond's yield to worst is the:", "opts": ["yield to maturity.", "yield to first call.", "yield to second call."], "ans": "C", "expl": "A. Incorrect because the yield-to-maturity, 𝑟 is : 105 = 4/(1 + r )1 + 4/(1 + r )2 + 4/(1 +\n𝑦𝑡𝑚 ytm ytm\nr )3 + 104/(1 + r )4\nytm ytm\nUsing a financial calculator with N = 4, PV=-105, FV = 100, PMT=4 and solving for I, 𝑟 =\n𝑦𝑡𝑚\n2.6656% ≈ 2.7%. Although less than the yield to first call of 2.9%, the YTM is greater (better)\nthan the yield to second call of 2.6%, making the latter the yield to worst.\nB. Incorrect because the yield-to-first-call, r, is: 105 = 4/(1+r)^1+ (4+103)/(1+r)^2\nUsing a financial calculator with N = 2, PV=-105, FV = 103, PMT 4 and solving for I, r₁ =\n2.8706% ≈ 2.9%. This yield is greater (better) than both the yield to second call of 2.6%\n(which is the lowest, or worst) and the YTM of 2.7%,\nC. Correct because the lowest of the sequence of yields-to-call and the yield-to-maturity is\nknown as the yield-to- worst. The sequence of yields for the bond is as follows:\nYield-to-maturity, Tem is calculated by solving this equation: 105 = 4/(1\n+r )1+4/(1+г )2+4/(1+r )3 + 104/(1 + r )4\nytm yem yem ytm\nUsing a financial calculator with N = 4, PV=-105, FV = 100, PMT=4 and solving for I, 𝑟 =\n𝑦𝑡𝑚\n2.6656% ≈ 2.7%.\nYield-to-first-call, r, is calculated by solving this equation: 105 = 4/(1+r )1+ (4+103)/(1+r )2\n1 1\nUsing a financial calculator with N = 2, PV=-105, FV = 103, PMT=4 and solving for 1, r =\n2.8706% ≈ 2.9%.\nYield-to-second-call, r, is calculated by solving this equation: 105 = 4/(1 + r )1 +\n2\n4/(1+r )2+(4+101)/(1+r )3Using a financial calculator with N = 3, PV=-105, FV = 101, PMT=4\n2 2\nand solving for I, r2 = 2.5718% ≈ 2.6%.\nTherefore the yield-to-worst is equal to the yield-to-second-call.\nFixed Income: compare, calculate, and interpret yield and yield spread measures for fixed-\nrate bonds", "qhtml": null}, {"n": 83, "q": "An analyst gathers the following information about three option-free bonds, each trading\nat a premium:\nCoupon Yield to Maturity Time to Maturity\nBond 1 4% 4% 10 years\nBond 2 4% 5% 11 years\nBond 3 5% 5% 9 years\nAll else being equal, the bond with the lowest Macaulay duration is most likely.", "opts": ["Bond 1.", "Bond 2.", "Bond 3."], "ans": "C", "expl": "A. Incorrect because the Macaulay and modified duration statistics for a fixed-rate bond\ndepend primarily on the coupon rate, yield-to-maturity, and time-to-maturity. A higher\ncoupon rate or a higher yield-to-maturity reduces the duration measures A longer time-to-\nmaturity usually leads to a higher duration. It always does so for a bond priced at a premium\nor at par value. Bond 1 has a lower coupon than Bond 3, a lower yield-to-maturity, and a\nlonger maturity. The Macaulay duration of Bond 1 is therefore greater than that of Bond 3.\nB. Incorrect because the Macaulay and modified duration statistics for a fixed-rate bond\ndepend primarily on the coupon rate, yield-to-maturity, and time-to-maturity. A higher\ncoupon rate or a higher yield-to-maturity reduces the duration measures. A longer time-to-\nmaturity usually leads to a higher duration. It always does so for a bond priced at a premium\nor at par value. Bond 2 has a lower coupon than Bond 3, the same yield-to-maturity, and a\nlonger maturity The Macaulay duration of Bond 2 is therefore greater than that of Bond 3.\nC. Correct because the Macaulay and modified duration statistics for a fixed-rate bond\ndepend primarily on the coupon rate, yield-to-maturity, and time-to-maturity. A higher\ncoupon rate or a higher yield-to-maturity reduces the duration measures. A longer time-to-\nmaturity usually leads to a higher duration. It always does so for a bond priced at a premium\nor at par value.\" In this case, Bond 3 has a higher coupon, the same or higher yield-to-\nmaturity, and the shortest time to maturity. It therefore has the lowest Macaulay duration.\nFixed Income: explain how a bond's maturity, coupon, and yield level affect its interest rate\nrisk", "qhtml": "<p>An analyst gathers the following information about three option-free bonds, each trading at a premium:</p><table class=\"qtable\"><thead><tr><th></th><th>Coupon</th><th>Yield to Maturity</th><th>Time to Maturity</th></tr></thead><tbody><tr><td>Bond 1</td><td>4%</td><td>4%</td><td>10 years</td></tr><tr><td>Bond 2</td><td>4%</td><td>5%</td><td>11 years</td></tr><tr><td>Bond 3</td><td>5%</td><td>5%</td><td>9 years</td></tr></tbody></table><p>All else being equal, the bond with the lowest Macaulay duration is most likely:</p>"}, {"n": 84, "q": "An analyst gathers the following information about a bond:\nClean price (per 100 of par value) 114.75\nAnnual modified duration 4.8250\nMacaulay duration (years) 4.9469\nAccrued interest (per 100 of par value) 1.6250\nThe bond's money duration (per 100 of par value) is closest to:", "opts": ["553.67.", "561.51.", "575.70."], "ans": "B", "expl": "A. Incorrect because it multiplies the modified duration with the clean price instead of the\nfull price.\n4.8250 x 114.75 = 553.6688 ≈ 553.67.\nB. Correct because the money duration equals the product of modified duration and full\nprice\nFull price = Clean price + Accrued interest = 114.75 + 1.625 = 116.375;\nMoney duration = Modified duration x Full Price = 116.375 x 4.8250 = 561.5094 ≈ 561.51.\nModified duration is a measure of the percentage price change of a bond given a change in\nits yield-to-maturity. A related statistic is money duration. The money duration of a bond is\na measure of the price change in units of the currency in which the bond is denominated.\nThe money duration can be stated per 100 of par value or in terms of the actual position\nsize of the bond in the portfolio. In the United States, money duration is commonly called\n'dollar duration 'Money duration (MoneyDur) is calculated as the annual modified duration\ntimes the full price (𝑃𝑉𝐹𝑢𝑙𝑙) of the bond, including accrued interest.\nC. Incorrect because it multiplies the full price with the Macaulay duration instead of the\nmodified duration.\nFull price = Clean price + Accrued interest = 114.75 + 1.625 = 116.375,\nMacaulay duration x Full price = 4.9469 x 116.375 = 575.6955 ≈ 575.70.\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 85, "q": "Effective duration is:", "opts": ["a useful interest rate risk measure only for bonds with embedded options.", "an accurate estimate of interest rate risk only when the assumed benchmark rate change is small.", "the same as the modified duration of an option-free bond only when the yield curve is perfectly flat."], "ans": "C", "expl": "A. Incorrect because although effective duration is the most appropriate interest rate risk\nmeasure for bonds with embedded options, it also is useful with traditional bonds to\nsupplement the information provided by the Macaulay and modified yield durations.\nB. Incorrect because a practical consideration in using effective duration is in setting the\nchange in the benchmark yield curve. With approximate modified duration, accuracy is\nimproved by choosing a smaller yield-to-maturity change. But the pricing models for more-\ncomplex securities, such as callable and mortgage-backed bonds, include assumptions about\nthe behavior of the corporate issuers, businesses, or homeowners. Rates typically need to\nchange by a minimum amount to affect the decision to call a bond or refinance a mortgage\nloan because issuing new debt involves transaction costs. Therefore, estimates of interest\nrate risk using effective duration are not necessarily improved by choosing a smaller change\nin benchmark rates.\nC. Correct because the modified duration and effective duration on an option-free bond are\nidentical only in the rare circumstance of an absolutely flat yield curve.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 86, "q": "An investor gathers the following information about a bond portfolio comprised of two\noption-free bonds:\nBond Par Value Market Value Duration\n1 $100,000 $120,000 5\n2 $200,000 $180,000 4\nThe duration of the portfolio is closest to:", "opts": ["4.33.", "4.40.", "455."], "ans": "B", "expl": "A . Incorrect because it weights the bonds by par value.\nDP= [(100,000 ÷ 300,000) x 5] + [(200,000 ÷ 300,000) × 4]\n= (0.333 × 5) + (0.667 × 4)\n= 1.665 + 2.668\n= 4.333 = 4.33\nB. Correct because the portfolio's duration is the weighted average (by market value) of the\nduration of the bonds in the portfolio.\nDuration of portfolio = [(120,000 ÷ 300,000) x 5] + [(180,000 ÷ 300,000) × 4]\n= (0.4 x 5)+(0.6 × 4)\n= 2.00 +2.40\n= 4.40\nC. Incorrect because it weights the bonds by their duration.\nDP= [(5÷9) x 5] + [(4÷9) x 4)]\n= 2.777 +1.777\n= 4.5544.55\nFixed Income: calculate portfolio duration and convexity and explain the limitations of these\nmeasures", "qhtml": null}, {"n": 87, "q": "An analyst gathers the following information about a bond that pays interest annually:\nCoupon rate 4%\nTime-to-maturity 3 years\nPar value $100,000\nIf the market discount rate is 5%, the market value of this bond is closest to:", "opts": ["$89,839.", "$97,277.", "$102,775."], "ans": "B", "expl": "A. Incorrect because as per the justification for the correct answer, the price of the bond is\nclosest to $97,277. This incorrect answer is arrived at by ignoring the coupon payments for\nyear 1 & 2:\nPrice of bond ≠ 104,000/(1+5% )3 = 89,839.11025 ≈ 89,839.\nB. Correct because the price of the bond is the present value of the promised cash flows and\nis calculated as follows:\nPrice of bond = 4,000/ (1 +5%)1 + 4,000 / (1+5% )² + 104,000 / (1+5%)3 = 3,809.5238 +\n3,628.1179 + 89,839.1102 = 97,276.7520 ≈ 97,277. Calculator inputs: FV = 100,000, I =\n10.05, N = 3, PMT = 4,000, PV = 97,276.75 ≈ 97.277.\nC. Incorrect because as per the justification for the correct answer, the price of the bond is\nclosest to $97,277. This incorrect answer is arrived at by switching the coupon rate and the\nmarket discount rate.\nPrice of bond ≠ 5,000/(1+4%)1 +5,000/(1+4% )² + 105,000/(1+4%)3 = 4,807.6923 +\n4,622.7811 + 93,344.6177 = 102,775.0910 ≈ 102,775. Calculator inputs: FV = 100,000, I=\n0.04, N=3, PMT = 5,000, PV = 102,775.09 ≈ 102,775.\nFixed Income: calculate a bond's price given a yield-to-maturity on or between coupon\ndates", "qhtml": null}, {"n": 88, "q": "Which of the following mortgage features most likely benefits the lender?", "opts": ["Non-recourse loan", "Prepayment option", "Prepayment penalty"], "ans": "C", "expl": "A. Incorrect because in a recourse loan, the lender has a claim against the borrower for the\nshortfall between the amount of the outstanding mortgage balance and the proceeds\nreceived from the sale of the property. In a non- recourse loan, the lender does not have\nsuch a claim and thus can look only to the property to recover the outstanding mortgage\nbalance.\nB. Incorrect because a mortgage may entitle the borrower to prepay all or part of the\noutstanding mortgage principal prior to the scheduled due date when the principal must be\nrepaid. This contractual provision is referred to as a prepayment option or an early\nrepayment option. From the lender's or investor's viewpoint, the effect of a prepayment\noption is that the amount and timing of the cash flows from a mortgage cannot be known\nwith certainty. The prepayment option benefits the borrower rather than the lender.\nC. Correct because the purpose of the prepayment penalty is to compensate the lender for\nthe difference between the contract rate and the prevailing mortgage rate if the borrower\nprepays when interest rates decline.\nFixed Income: describe fundamental features of residential mortgage loans that are\nsecuritized", "qhtml": null}, {"n": 89, "q": "With respect to the notching process adopted by credit rating agencies, a corporate's\nsubordinated debt is most likely.", "opts": ["notched up from the corporate's junior subordinated debt.", "subject to a smaller notching adjustment the higher the corporate's issuer rating.", "notched down from the corporate's issuer rating due to higher probability of default."], "ans": "B", "expl": "A. Incorrect because recognizing these different payment priorities, and thus the potential\nfor higher (or lower) loss severity in the event of default, the rating agencies have adopted a\nnotching process whereby their credit ratings on issues can be moved up or down from the\nissuer rating, which is usually the rating applied to its senior unsecured debt. Issue ratings\nare thus notched up or down from the issuer rating, and not from more junior ratings such\nas junior subordinated ratings.\nB. Correct because the rating agencies have adopted a notching process whereby their\ncredit ratings on issues can be moved up or down from the issuer rating, which is usually the\nrating applied to its senior unsecured debt As a general rule, the higher the senior\nunsecured rating, the smaller the notching adjustment.\nC. Incorrect because recognizing these different payment priorities, and thus the potential\nfor higher (or lower) loss severity in the event of default, the rating agencies have adopted a\nnotching process whereby their credit ratings on issues can be moved up or down from the\nissuer rating and also cross-default provisions, whereby events of default (such as non-\npayment of interest) on one bond trigger default on all outstanding debt, imply the same\ndefault probability for all issues, specific issues may be assigned different credit ratings-\nhigher or lower-due to a rating adjustment methodology known as notching. It is the higher\nloss severity, and not higher probability of default, that is driving the notching process.\nFixed Income: describe the seniority rankings of debt, secured versus unsecured debt and\nthe priority of claims in bankruptcy, and their impact on credit ratings", "qhtml": null}, {"n": 90, "q": "Money market yields are:", "opts": ["annualized and compounded.", "stated for a common periodicity.", "stated on a simple interest basis."], "ans": "C", "expl": "A. Incorrect because bond yields-to-maturity are annualized and compounded. Yield\nmeasures in the money market are annualized but not compounded.\nB. Incorrect because money market instruments having different times-to-maturity have\ndifferent periodicities for the annual rate.\nC. Correct because the rate of return on a money market instrument is stated on a simple\ninterest basis.\nFixed Income: calculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 91, "q": "A portfolio manager gathers the following information about an option-free bond that\nwas held to maturity:\n• Realized horizon yield 4.2%\n• Reinvestment rate 4.1%\nThe yield to maturity at purchase was most likely.", "opts": ["less than 4.2%.", "equal to 4.2%.", "greater than 4.2%."], "ans": "C", "expl": "A. Incorrect because, since the reinvestment rate is less than the horizon yield, the yield-to-\nmaturity is greater than the horizon yield of 4.2%\nB. Incorrect because, since the reinvestment rate is less than the horizon yield, the yield-to-\nmaturity is greater than the horizon yield of 4.2%\nC. Correct because the realized horizon yield matches the original yield-to-maturity if (1)\ncoupon payments are reinvested at the same interest rate as the original yield-to-maturity,\nand (2) the bond is sold at a price on the constant-yield price trajectory, which implies that\nthe investor does not have any capital gains or losses when the bond is sold. Since the\nreinvestment rate is less than the horizon yield and the bond is held to maturity, the yield to\nmaturity is greater than the horizon yield.\nFixed Income: calculate and interpret the sources of return from investing in a fixed-rate\nbond;", "qhtml": null}, {"n": 92, "q": "A three-year, semiannual-pay bond with a $100 par value and a 5% coupon rate is\npurchased for $108. One year later , if the yield to maturity has decreased by 100 basis points,\nthe change in the value of this bond is closest to:", "opts": ["$0.57.", "$1.52.", "$3.08."], "ans": "A", "expl": "A. Correct because the value of a bond is calculated as:\nPV= [PMT = (1+r)¹] + [PMT +(1+r)²] +...+ [(PMT + FV) + (1+r)N)\nwhere:\nPV= present value, or the price of the bond\nPMT coupon payment per period\nFV = future value paid at maturity, or the par value of the bond\nr = market discount rate, or required rate of return per period\nN= number of evenly spaced periods to maturity\nUsing calculator inputs, N = (3 x 2)=6, PMT = (5% ÷ 2) 100 = $2.5, FV = $100, PV = $108,\nSolve for I, is equal to 1.114% semi-annually, or 2.228% on an annual basis. If the yield to\nmaturity decreases by 100 bps, the price of the bond after one year is computed as: N = 4,\nPMT = $2.5, FV = $100, 1= [(2.228% -1% ) ÷ 2] = 0.614%, Solve PV, is equal to $107.43.\nTherefore, the change in value of the bond = $108.00 - $107.43 = $0.57\nB. Incorrect because fails to annualize the interest rate before computing the change in\nvalue\nUsing calculator inputs, the yield of the bond: N=6, PMT = $2.5, FV = $100, Solve I is equal to\n1.114%.\nIf the yield declines by 100 bps, the price of the bond after one year is computed as: N = 4,\nPMT = $2.5, FV = 100, I = (1.114% -1% ) = 0.114%, Solve for PV = $109.52.\nTherefore, the change in value = $108-109.52-$1.52, or a change in value of $1.52\nC. Incorrect because incorrectly uses the same time to maturity when calculating the new\nvalue rather than adjusting the term for the passage of one year in value\nUsing calculator inputs, the yield of the bond: N = 6, PMT = $2.5, FV = 100, I = (2.228% -\n1%)/2=0.614%, Solve for PV is equal to $111.08.\nTherefore, the change in value = $108-111.08 = - $3.08, or a change in value of $3.08.\nFixed Income: calculate a bond's price given a yield-to-maturity on or between coupon\ndates", "qhtml": null}, {"n": 93, "q": "The yield spread of a specific bond over the standard swap rate in that currency of the\nsame tenor best describes the", "opts": ["I-spread.", "Z-spread.", "option-adjusted spread."], "ans": "A", "expl": "A. Correct because the yield spread of a specific bond over the standard swap rate in that\ncurrency of the same tenor is known as the I-spread or interpolated spread to the swap\ncurve.\nB. Incorrect because another approach is to calculate a constant yield spread over a\ngovernment (or interest rate swap) spot curve instead. This spread is known as the zero\nvolatility spread (Z-spread) of a bond over the benchmark rate. Sometimes, the Z-spread is\ncalled the static spread because it is constant (and has zero volatility).\nC. Incorrect because the Z-spread is also used to calculate the option-adjusted spread (OAS)\non a callable bond. The OAS, like the option-adjusted yield, is based on an option- pricing\nmodel and an assumption about future interest rate volatility.\nFixed Income: compare, calculate, and interpret yield and yield spread measures for fixed-\nrate bonds", "qhtml": null}, {"n": 94, "q": "For a fixed-rate bond, when interest rates decrease, the future value of reinvested coupon\npayments most likely.", "opts": ["decreases and the market price of the bond increases.", "increases and the market price of the bond decreases.", "increases and the market price of the bond increases."], "ans": "A", "expl": "A. Correct because there are two offsetting types of interest rate risk that affect the bond\ninvestor coupon reinvestment risk and market price risk. The future value of reinvested\ncoupon payments (and in a portfolio, the principal on bonds that mature before the horizon\ndate) increases when interest rates go up and decreases when rates go down. The sale price\non a bond that matures after the horizon date (and thus needs to be sold) decreases when\ninterest rates go up and increases when rates go down.\nB. Incorrect because the future value of reinvested coupon payments (and in a portfolio, the\nprincipal on boods that mature before the horizon date) increases when interest rates go\nup. The sale price on a bond that matures after the horizon date (and thus needs to be sold)\ndecreases when interest rates go up.\nC. Incorrect because the future value of reinvested coupon payments (and in a portfolio, the\nprincipal on bonds that mature before the horizon date) increases when interest rates go\nup. The sale price on a band that matures after the horizon date (and thus needs to be sold)\ndecreases when interest rates go pp.\nFixed Income: describe the relationships among a band's holding period return, its\nMacaulay duration, and the investment horizon", "qhtml": null}, {"n": 95, "q": "The yield spread in basis points over an actual or interpolated government bond best describes the:", "opts": ["I-spread.", "G-spread.", "Z-spread."], "ans": "B", "expl": "A. Incorrect because the yield spread of a specific bond over the standard swap rate in that\ncurrency of the same tenor is known as the I- spread.\nB. Correct because the yield spread in basis points over an actual or interpolated\ngovernment bond is known as the G-spread. The spread over a government bond is the\nreturn for bearing greater credit, liquidity, and other risks relative to the sovereign bond.\nC. Incorrect because the yield spread over a specific benchmark is referred to as the\nbenchmark spread. A constant yield spread over a government (or interest rate swap) spot\ncurve is known as the zero-volatility spread (Z- spread) of a bond over the benchmark rate.\nFixed Income: compare, calculate, and interpret yield and yield spread measures for fixed-\nrate bonds"}, {"n": 96, "q": "Which of the following debt categories has the highest ranking in terms of priority of\npayment?", "opts": ["Second lien debt", "Subordinated debt", "Senior unsecured debt"], "ans": "A", "expl": "A. Correct because second lien debt là nợ CÓ BẢO ĐẢM (secured) — có quyền truy đòi trực tiếp đối với tài sản thế chấp — nên xếp trên mọi loại nợ không bảo đảm về thứ tự ưu tiên thanh toán.\nB. Incorrect because subordinated debt xếp DƯỚI cùng trong ba loại được liệt kê: sau nợ có bảo đảm và sau cả senior unsecured.\nC. Incorrect because senior unsecured debt xếp trên subordinated debt nhưng vẫn dưới nợ có bảo đảm (second lien).", "qhtml": null}, {"n": 97, "q": "In a securitization, time tranching most likely refers to differences in:", "opts": ["default risk.", "expected maturities.", "underlying collateral."], "ans": "B", "expl": "A. Incorrect because this relates to credit tranching, not time tranching. In credit tranching,\nthere is more than one bond class or tranche, and the share classes differ as to how they\nwill share losses resulting from defaults of the borrowers whose loans are in the collateral.\nB. Correct because the creation of bond classes that possess different expected maturities is\nreferred to as time tranching.\nC. Incorrect because tranching does not change underlying collateral, rather it only changes\nhow losses or prepayments will be shared. In such a structure, there is more than one bond\nclass or tranche, and the share classes differ as to how they will share losses resulting from\ndefaults of the borrowers whose loans are in the collateral.\nFixed Income: define prepayment risk and describe time tranching structures in\nsecuritizations and their purpose", "qhtml": null}, {"n": 98, "q": "For a floating-rate note, the specified yield spread over the reference rate best defines\nthe:", "opts": ["coupon.", "quoted margin.", "required margin."], "ans": "B", "expl": "A. Incorrect because a specified yield spread is added to, or subtracted from, the reference\nrate which results in the coupon. For example, the floater might reset its interest rate\nquarterly at three-month Libor plus 0.50%. This is not the quoted margin, it is the reference\nrate plus the quoted margin.\nB. Correct because this specified yield spread over the reference rate is called the quoted\nmargin on the FRN. The role of the quoted margin is to compensate the investor for the\ndifference in the credit risk of the issuer and that implied by the reference rate.\nC. Incorrect because the required margin is the yield spread over, or under, the reference\nrate such that the FRN is priced at par value on a rate reset date. Changes in the required\nmargin usually come from changes in the issuer's credit risk. The required margin is not\nspecified but changes based on market forces.\nFixed Income: calculate and interpret yield spread measures for floating-rate instruments", "qhtml": null}, {"n": 99, "q": "An investor holds a bond with the following characteristics:\n• Yield to maturity 9%\n• Modified duration 7.4\nIf the duration gap is zero, the investment horizon is closest to:", "opts": ["6.8 years.", "7.4 years.", "8.1 years."], "ans": "C", "expl": "A. Incorrect because the candidate calculates the Macaulay duration incorrectly: MacDur ≠\n7.4/(1+9%) = 6.8. Because the duration gap is equal to the bond's Macaulay duration minus\nthe investment horizon the investment horizon is incorrectly stated as 6.8 years.\nB. Incorrect because the candidate confuses the Macaulay duration with the modified\nduration, thus incorrectly determining the investment horizon as 7.4 years.\nC. Correct because we use the fact that ModDur = MacDur /(1+r) to calculate the Macaulay\nduration of the bond: MacDur = 7.4 × (1+9%) = 8.07. Because the duration gap is equal to\nthe bond's Macaulay duration minus the investment horizon the investment horizon is\nclosest to 8.1 years.\nFixed Income: describe the relationships among a bond's holding period return, its\nMacaulay duration, and the investment horizon;", "qhtml": null}, {"n": 100, "q": "All else being equal, when the market interest rate falls below a bond's coupon rate,\npotential price appreciation is most limited for a:", "opts": ["putable bond.", "callable bond.", "option-free bond."], "ans": "B", "expl": "A. Incorrect because if interest rates are low compared with the coupon rate, the value of\nthe put option is low and the impact of a change in the benchmark yield on the [putable]\nbond's price is very similar to the impact on the price of a non-putable bond, e.g., not\nlimited. Furthermore, a rational investor would not exercise the put option when the\nmarket interest rate is lower than the coupon rate of the bond.\nB. Correct because when interest rates are low, the effective duration of the callable bond is\nlower than that of the otherwise comparable non-callable bond because the callable bond\nprice does not increase as much when benchmark yields fall. The presence of the call option\nlimits price appreciation especially when interest rates are falling and the bond is more\nlikely to be called.\nC. Incorrect because the presence of an embedded option reduces the sensitivity of the\nbond price to changes in the benchmark yield curve, assuming no change in credit risk. An\noption-free bond serves as the base case, whereas with a call, price appreciation is limited\nwhen market rates go below the coupon rate [and with a put, price depreciation is limited\nwhen market rates go above the coupon rate].\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 101, "q": "Callable bonds exhibit:", "opts": ["positive convexity only.", "negative convexity only.", "either positive or negative convexity."], "ans": "C", "expl": "A. Incorrect because when the benchmark yield is high and the value of the embedded call\noption is low, the callable and the non-callable bonds experience very similar effects from\ninterest rate changes. They both have positive convexity But as the benchmark yield is\nreduced the curves diverge At some point, the callable bond moves into the range of\nnegative convexity, which indicates that the embedded call option has more value to the\nissuer and is more likely to be exercised\nB. Incorrect because when the benchmark yield is high and the value of the embedded call\noption is low, the callable and the non-callable bonds experience very similar effects from\ninterest rate changes. They both have positive convexity. But as the benchmark yield is\nreduced, the curves diverge At some point, the callable bond moves into the range of\nnegative convexity, which indicates that the embedded call option has more value to the\nissuer and is more likely to be exercised.\nC. Correct because when the benchmark yield is high and the value of the embedded call\noption is low, the callable and the non-callable bonds experience very similar effects from\ninterest rate changes. They both have positive convexity But as the benchmark yield is\nreduced, the curves diverge. At some point, the callable bond moves into the range of\nnegative convexity, which indicates that the embedded call option has more value to the\nissuer and is more likely to be exercised.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 102, "q": "An investor sells a fixed-rate bond originally purchased at a discount. The resulting\ncapital gain or loss should be measured by comparing the bond's selling price with its:", "opts": ["par value.", "carrying value.", "purchase price."], "ans": "B", "expl": "A. Incorrect because capital gains and losses are measured from the carrying value of the\nbond and not from the purchase price or par value.\nB. Correct because capital gains arise if a bond is sold at a price above its constant-yield\nprice trajectory and capital losses occur if a bond is sold at a price below its constant-yield\nprice trajectory. Also, capital gains and losses are measured from the carrying value of the\nbond and not from the purchase price. The carrying value includes the amortization of the\ndiscount or premium if the bond is purchased at a price below or above par value. The\ncarrying value is any point on the constant-yield price trajectory.\nC. Incorrect because capital gains and losses are measured from the carrying value of the\nbond and not from the purchase price.\nFixed Income: calculate and interpret the sources of return from investing in a fixed-rate\nbond", "qhtml": null}, {"n": 103, "q": "An investor gathers the following information about an investment in a bond with a 10-\nyear tenor:\nPurchase price 95.27\nSale price 102.06\nSum of reinvested coupon payments 24.28\nIf the holding period was seven years, the horizon yield is closest to:", "opts": ["2.29%.", "2.86%.", "4.11%."], "ans": "C", "expl": "A. Incorrect because the sale and purchase price are accidentally swapped in the formula:\n102.06 = (95.27 +24.28)/(1+r)^7 => r = 0.022853 ≈ 2.29%.\nCalculator solution: N = 7; PV = -102.06; FV = 95.27+ 24.28; CPT I/Y = 2.29%\nB. Incorrect because holding period and tenor of bond are accidentally swapped in the\nformula:\n95.27 (102.06+24 28)/(1+r)^10=> r = 0.028628 ≈ 2.86%.\nCalculator solution: N = 10, PV= -95 27, FV = 102.06 + 24.28; CPT I/Y= 2.86%.\nC. Correct because a horizon yield is the internal rate of return between the total return\n(the sum of reinvested coupon payments and the sale price or redemption amount) and the\npurchase price of the bond. The horizon yield on a bond investment is the annualized\nholding-period rate of return.\n95.27 = (102.06+24.28)/ (1+r)^7 => r = 0.041147 ≈ 4.11%.\nCalculator solution: N = 7; PV= -95.27; FV = 102.06 + 24.28; CPT I/Y = 4.11%.\nFixed Income: calculate and interpret the sources of return from investing in a fixed-rate\nbond;", "qhtml": null}, {"n": 104, "q": "A commercial paper has the following characteristics:\nRedemption value $5,000,000\nInterest earned $140,500\nDays to maturity 160\nFor a 365-day year, the discount rate is closest to:", "opts": ["6.2%.", "6.4%.", "6.6%."], "ans": "B", "expl": "A. Incorrect because candidates confuse the redemption value with the present value and\nthereby add the interest earned to the redemption value as part of the calculation.\nDR ≠ (365/160) x (140,500/(5,000,000 + 140,500)) = 0.0624 ≈ 6.2%.\nB. Correct because the discount rate, DR = (Year/Days) x ((FV - PV)/FV), where Year =\nnumber of days in the year, Days = number of days between settlement and maturity, FV =\nfuture value paid at maturity/face value of the money market instrument, PV = present\nvalue/price of the money market instrument, and FV - PV, is the interest earned.\nDR = (365/160) x (140,500/5,000,000) = 0.0641 ≈ 6.4%.\nC. Incorrect because this is the add-on rate. AOR = Year/Days x ((FV-PV)/PV)\nAOR = (365/160) x (140,500/(5,000,000-140,500)) = 0.0660 ≈ 6.6%.\nFixed Income: calculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 105, "q": "Two par bonds have the same duration but different convexity. All else being equal, if\nyields to maturity increase by 10 basis points, it is most likely that:", "opts": ["the more convex bond underperforms the less convex bond.", "both bond prices decrease by the same amount.", "the more convex bond outperforms the less convex bond."], "ans": "C", "expl": "A. Incorrect because the two bonds are assumed to have the same price, yield-to-maturity,\nand modified duration. The benefit of greater convexity occurs when their yields-to-\nmaturity change. For the same decrease in yield-to-maturity, the more convex bond\nappreciates more in price. And for the same increase in yield-to-maturity, the more convex\nbond depreciates less in price. The conclusion is that the more convex bond outperforms\nthe less convex bond in both bull (rising price) and bear (falling price) markets. The more\nconvex bond always outperforms the less convex bond\nB. Incorrect because the two bonds are assumed to have the same price, yield-to-maturity,\nand modified duration. The benefit of greater convexity occurs when their yields-to-\nmaturity change. For the same decrease in yield-to-maturity, the more convex bond\nappreciates more in price. And for the same increase in yield-to-maturity, the more convex\nbond depreciates less in price. The conclusion is that the more convex bond outperforms\nthe less convex outperforms bond in both bull (rising price) and bear (falling price) markets.\nThe more convex bond always the less convex bond.\nC. Correct because the two bonds are assumed to have the same price, yield-to-maturity,\nand modified duration. The benefit of greater conve
