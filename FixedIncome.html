<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If an issuer is required to retire a specified portion of the bond's principal each year, the\nbond most likely.", "opts": ["is callable.", "is a step-up note.", "has a sinking fund provision."], "ans": "C", "expl": "A. Incorrect because a bond that is currently callable may be retired by the issuer, but the\nissuer is not required to do 50.\nB. Incorrect because a step-up note has a coupon rate that increases over time according to\na predetermined schedule.\nC. Correct. A sinking fund provision requires retirement of a portion of the bond's principal\nevery year, rather than retirement of the entire issue at maturity.\nFixed Income: describe common cash flow structures of fixed-income instruments and\ncontrast cash flow contingency provisions that benefit issuers and investors", "qhtml": null}, {"n": 2, "q": "A five-year semiannual bond has a yield to maturity of 8%. Converted to a quarterly\nperiodicity, the yield to maturity is closest to:", "opts": ["1.98%", "3.92%", "7.92%."], "ans": "C", "expl": "A. Incorrect. The yield-to-maturity converted to a quarterly basis must still be expressed in annualized, compounded terms. The formula for converting from m periods to n periods per year is (1 + APR_m/m)^m = (1 + APR_n/n)^n. Here (1 + 0.08/2)^2 = (1 + APR_4/4)^4 gives APR_4/4 = 1.98%, which is the quarterly rate, not the annualized APR.\nB. Incorrect. You cannot convert the yield by simply taking (1 + APR_2)^(1/2) - 1 = 1.08^(1/2) - 1 = 3.92%. The correct relationship is (1 + APR_m/m)^m = (1 + APR_n/n)^n.\nC. Correct. Setting the effective annual rates equal: (1 + APR_2/2)^2 = (1 + APR_4/4)^4. With APR_2 = 8%, (1 + 0.08/2)^2 = (1 + APR_4/4)^4, so APR_4/4 = 1.98% and APR_4 = 4 x 1.98% = 7.92%.\nFixed Income: calculate annual yield on a bond for varying compounding periods in a year", "qhtml": null}, {"n": 3, "q": "The key rate duration best measures a bond's sensitivity to a change in the:", "opts": ["level of the yield-to-maturity.", "slope of the yield-to-worst curve.", "shape of the benchmark yield curve."], "ans": "C", "expl": "A. Incorrect. This describes modified duration, which estimates the percentage price change of a bond for a change in its yield-to-maturity.\nB. Incorrect. Duration is not measured against the yield-to-worst (the lowest of the yield-to-maturity, yield-to-first-call, yield-to-second-call, and so on).\nC. Correct. Key rate (partial) duration measures a bond's sensitivity to a change in the benchmark yield curve at a specific maturity point. Unlike effective duration, key rate durations help identify 'shaping risk' - a bond's sensitivity to changes in the shape of the benchmark yield curve (e.g., the curve becoming steeper or flatter).\nFixed Income: define key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes", "qhtml": null}, {"n": 4, "q": "A bond priced at 99.4 has a modified duration of 6.9 and an annual convexity statistic of -\n212. If the market yield increases by 75 basis points, the price of this bond is closest to", "opts": ["93.7.", "94.3.", "94.9."], "ans": "A", "expl": "A. Correct. %ΔPV_Full = (-AnnModDur x ΔYield) + [0.5 x AnnConvexity x (ΔYield)^2] = (-6.9 x 0.0075) + (0.5 x -212 x 0.0075^2) = -0.05175 - 0.0059625 = -0.0577125, or -5.77%. Price change = -0.0577125 x 99.4 = -5.7366, so the new price = 99.4 - 5.7366 = 93.66, closest to 93.7.\nB. Incorrect. 94.3 results from applying the price change to par (100) instead of 99.4: 100 - 5.74 = 94.26.\nC. Incorrect. 94.9 results from entering the convexity adjustment as a positive number: (-6.9 x 0.0075) + (0.5 x 212 x 0.0075^2) = -0.04579, or -4.58%; 99.4 - (0.04579 x 99.4) = 94.85.\nFixed Income: calculate the percentage price change of a bond for a specified change in yield, given the bond's duration and convexity", "qhtml": null}, {"n": 5, "q": "If interest rates rise over the holding period, the total return of a coupon bond held until\nmaturity is most likely to be:", "opts": ["less than the yield to maturity at purchase.", "equal to the yield to maturity at purchase.", "greater than the yield to maturity at purchase."], "ans": "C", "expl": "A. Incorrect because a buy-and-hold investor has a higher total return if interest rates rise\ndue to the unexpected excess coupon reinvestment proceeds. If interest rates fall, a buy-\nand-hold investor realizes no market price returns as he is redeemed at par at maturity.\nB. Incorrect because a buy-and-hold investor has a higher total return if interest rates rise\ndue to the unexpected excess coupon reinvestment proceeds. If interest rates fall, a buy-\nand-hold investor realizes no market price returns as he is redeemed at par at maturity. This\nchoice may be attractive to uninformed candidates who focus on the buy-and-hold investor,\nand not any market interest rate changes.\nC. Correct because a long-term investor faces coupon reinvestment risk as well as market\nprice risk if the bond needs to be sold prior to maturity. An [buy-and-hold] investor [in a 10-\nyear bond) with a 10-year time horizon is concerned only with coupon reinvestment risk.\nThis situation assumes of course, that the issuer makes all of the coupon and principal\npayments as scheduled. The buy-and-hold investor has a higher total return if interest rates\nrise and a lower total return if rates fall\nFixed Income: describe the relationships among a bond's holding period return, its\nMacaulay duration, and the investment horizon;", "qhtml": null}, {"n": 6, "q": "A bond that allows the issuer to pay interest in the form of additional amounts of the\nexisting bond issue rather than\na cash payment best describes a", "opts": ["step-up coupon bond.", "deferred coupon bond.", "payment-in-kind coupon bond."], "ans": "C", "expl": "A. Incorrect because the coupon of a step-up coupon bond, which may be fixed or floating,\nincreases by specified margins at specified dates. It does not allow the issuer to pay interest\nin the form of additional amounts of the bond issue in lieu of a cash payment.\nB. Incorrect because a deferred coupon bond, sometimes called a split coupon bond, pays\nno coupons for its first few years but then pays a higher coupon than it otherwise normally\nwould for the remainder of its life. It does not allow the issuer to pay interest in the form of\nadditional amounts of the bond issue in lieu of a cash payment\nC. Correct because a payment-in-kind (PIK) coupon bond typically allows the issuer to pay\ninterest in the form of additional amounts of the bond issue rather than as a cash payment\nFixed Income: describe common cash flow structures of fixed-income instruments and\ncontrast cash flow contingency provisions that benefit issuers and investors", "qhtml": null}, {"n": 7, "q": "In the event of default, investors in covered bonds most likely have recourse against:", "opts": ["the issuer only.", "a segregated pool of assets only.", "both the issuer and a segregated pool of assets."], "ans": "C", "expl": "A. Incorrect because in contrast [to asset-backed securities], in the case of covered bonds,\nthe pool of assets remains on the financial institution's balance sheet. In the event of\ndefault, bondholders have recourse against both the financial institution and the cover pool.\nB. Incorrect because in contrast [to asset-backed securities], in the case of covered bonds,\nthe pool of assets remains on the financial institution's balance sheet. In the event of\ndefault, bondholders have recourse against both the financial institution and the cover pool.\nC. Correct because a covered bond is a debt obligation backed by a segregated pool of\nassets called a \"cover pool\" in the event of default, bondholders have recourse against both\nthe financial institution and the cover pool.\nFixed Income: describe characteristics and risks of covered bonds and how they differ from\nother asset-backed securities", "qhtml": null}, {"n": 8, "q": "In the securitization process, the trustee most likely.", "opts": ["sells the underlying collateral.", "owns the underlying collateral.", "holds the underlying collateral."], "ans": "C", "expl": "A. Incorrect because the seller of the collateral, sometimes called the depositor is the\ncorporation that originated the loans. They are sold to an SPE and held by the trustee\nB. Incorrect because the SPE purchases the loans or receivables and uses them as collateral\nto issue the ABS After the sale is completed, it is [the SPE], not [the depositor/seller], that\nlegally owns them. The SPE owns the collateral but does not hold the collateral, and\nalthough the trustee does not own the underlying collateral it does hold it.\nC. Correct because a trustee or trustee agent is typically a financial institution with trust\npowers that safeguards the assets after they have been sold to the SPE, holds the funds due\nto the ABS holders until they are paid, and provides periodic information to the ABS holders\nFixed Income: describe securitization, including the parties and the roles they play", "qhtml": null}, {"n": 9, "q": "The coupon of a residential mortgage-backed security is the:", "opts": ["pass-through rate", "weighted average coupon rate.", "rate on the underlying pool of mortgages."], "ans": "A", "expl": "A. Correct because a mortgage pass-through security's coupon rate is called the pass-\nthrough rate. The pass- through rate is lower than the mortgage rate on the underlying pool\nof mortgages by an amount equal to the servicing and other administrative fees. The pass-\nthrough rate that the investor receives is said to be \"net interest\" or \"net coupon.\nB. Incorrect because not all of the mortgages that are included in a pool of securitized\nmortgages have the same mortgage rate and the same maturity. The WAC is calculated by\nweighting the mortgage rate of each mortgage in the pool by the percentage of the\noutstanding mortgage balance relative to the outstanding amount of all the mortgages in\nthe pool. This rate, less servicing and other administrative fees, determines the pass-\nthrough rate\nC. Incorrect because a mortgage pass-through security's coupon rate is called the pass-\nthrough rate. The pass- through rate is lower than the mortgage rate on the underlying pool\nof mortgages by an amount equal to the servicing and other administrative fees. The pass-\nthrough rate that the investor receives is said to be 'net interest' or 'net coupon\"\nFixed Income: describe types and characteristics of residential mortgage-backed securities,\nincluding mortgage pass-through securities and collateralized mortgage obligations, and\nexplain the cash flows and risks for each type", "qhtml": null}, {"n": 10, "q": "The stated annual yield to maturity on a semiannual bond basis is 3.66%. The effective\nannual yield is closest to:", "opts": ["3.63%", "3.69%", "7.45%"], "ans": "B", "expl": "A. Incorrect because the formula converts from an effective annual yield to a semiannual-\npay yield:\n≠ ((1+ yield)0.5 - 1) x 2 = ((1+0.0366)0.5 - 1) x 2= (1.018136 - 1) x 2 = .036272 ≈ 3.63%.\nB. Correct because an effective annual rate has a periodicity of one because there is just one\ncompounding period in the year. No calculations are required based on the intuitive idea\nthat due to semi-annual compounding, the effective annual yield must be slightly higher.\nThe formula to calculate the effective annual yield of a semi-annual pay bond is:\n= (1 + yield/2)² - 1 = (1 + 0.0366/2)2 – 1 = 1.036935 - 1.036935 ≈ 3.69%\nC. Incorrect because the the yield is not divided by 2. The formula used to calculate the\neffective annual yield of a semi-annual pay bond:\n≠ (1+ yield)² - 1 = (1 + 0.0366)2-1 = 1.07454 – 1 = .07454 ≈ 7.45%.\nFixed Income: calculate annual yield on a bond for varying compounding periods in a year", "qhtml": null}, {"n": 11, "q": "In a securitization, the purchase agreement between the seller of the collateral and the\nspecial purpose entity most likely provides:", "opts": ["a description of the transaction structure.", "representations about the quality of the assets.", "documentation of enhancements used to reduce credit risk."], "ans": "B", "expl": "A. Incorrect because this is part of the prospectus. Another important legal document is the\nprospectus, which describes the structure of the securitization.\nB. Correct because an important legal document is the purchase agreement between the\nseller of the collateral and the SPE, which sets forth the representations and warranties that\nthe seller makes about the assets sold. These representations and warranties assure\ninvestors about the quality of the assets.\nC. Incorrect because this is part of the prospectus. Securitizations often use several forms of\ncredit enhancements, which are documented in the prospectus.\nFixed Income: describe securitization, including the parties and the roles they play", "qhtml": null}, {"n": 12, "q": "An analyst gathers the following information about a bond:\n• Price 96.00\n• Price with yield to maturity 10 basis points higher 95.80\n• Price with yield to maturity 10 basis points lower 96.30\nThe approximate convexity of this bond is closest to:", "opts": ["521.", "1,042.", "2,604."], "ans": "B", "expl": "A. Incorrect because the denominator is incorrectly multiplied by 2, as happens in the\ncalculation of approximate duration:\n[96.3+95.8]−[2×96]\n= 521.\n2×(0.001)2 ×(96)\nB. Correct because ApproxCon =\n(𝑃𝑉_)+(𝑃𝑉+)−[2𝑥(𝑃𝑉0)]\n(𝛥𝑌𝑖𝑒𝑙𝑑)2×(𝑃𝑉0)\n[96.3+95.8]−[2×96]\nTherefore the approximate convexity of this bond = = 1.042\n(0.001)2 ×(96)\nC. Incorrect because the approximate convexity is incorrectly calculated as approximate\nduration, with a mistake in that the change in yield (0.001) is squared:\n[96.3−95.8]\n= 2.604.\n(0.001)2 × 2 ×(96)\nFixed Income: calculate and interpret convexity and describe the convexity adjustment", "qhtml": null}, {"n": 13, "q": "A break-even reinvestment rate is most likely equivalent to a(n):", "opts": ["par rate.", "spot rate.", "implied forward rate."], "ans": "C", "expl": "A. Incorrect because a par curve is a sequence of yields-to-maturity such that each bond is\npriced at par value. Par rates are not break-even reinvestment rates.\nB. Incorrect because the spot rate is a sequence of yields-to-maturity on zero-coupon bonds.\nA forward rate links one spot rate to another and for this reason can be characterized as a\nbreak-even reinvestment rate. A spot rate alone is, however, not a break-even reinvestment\nrate\nC. Correct because an implied forward rate is a break-even reinvestment rate. It links the\nreturn on an investment in a shorter-term zero-coupon bond to the return on an investment\nin a longer-term zero-coupon bond.\nFixed Income: define spot rates and the spot curve, and calculate the price of a bond using\nspot rates", "qhtml": null}, {"n": 14, "q": "A bond trading at its no-arbitrage value is priced at a premium. The sum of the present\nvalue of the bond's cash flows discounted at spot rates is:", "opts": ["less than the sum of the present values of the bond's cash flows discounted at its yield to maturity", "equal to the sum of the present values of the bond's cash flows discounted at its yield to maturity.", "greater than the sum of the present values of the bond's cash flows discounted at its yield to maturity."], "ans": "B", "expl": "A. Incorrect because the bond price (or value) determined using the spot rates is sometimes\nreferred to as the bond's 'no-arbitrage value'\nIf the current market price equals the no-arbitrage value, discounting the cash flows by\neither spot rates or yield to maturity arrives to the same price. The level of the current\nmarket price vis a vis par has no bearing the no-arbitrage value.\nB. Correct because bond price (or value) determined using the spot rates is sometimes\nreferred to as the bond's 'no-arbitrage value'\nIf the current market price equals the 'no-arbitrage value, discounting the cash flows by\neither spot rates or yield to maturity arrives to the same price.\nC. Incorrect because bond price (or value) determined using the spot rates is sometimes\nreferred to as the bond's 'no-arbitrage value'.\nIf the current market price equals the no-arbitrage value, discounting the cash flows by\neither spot rates or yield to maturity arrives to the same price. The level of the current\nmarket price vis a vis par has no bearing the no- arbitrage value.\nFixed Income: define spot rates and the spot curve, and calculate the price of a bond using\nspot rates", "qhtml": null}, {"n": 15, "q": "An analyst gathers the following information about a company that only has senior\nunsecured debt.\nType Total Amount Outstanding Time to Maturity\nFloating-rate note (FRN) $50 million 12 years\nFixed-rate bond $10 million 2 years\nIn a bankruptcy scenario, if the priority of claims is enforced, it is most likely that", "opts": ["fixed-rate bond is repaid first because it matures earlier.", "both bondholders are repaid proportionally to the amount owed.", "FRN is repaid first because it has the highest amount outstanding."], "ans": "B", "expl": "A. Incorrect because all creditors at the same level of the capital structure are treated as\none class, thus, a senior unsecured bondholder whose debt is due in 30 years has the same\npro rata claim in bankruptcy as one whose debt matures in six months. This provision is\nreferred to as bonds ranking pari passu ('on an equal footing\") in right of payment.\nB. Correct because both bonds represent forms of senior unsecured debt and therefore, all\ncreditors are at the same level of the capital structure and treated as one class, thus, a\nsenior unsecured bondholder whose debt is due in 30 years has the same pro rata claim in\nbankruptcy as one whose debt matures in six months. This provision is referred to as bonds\nranking pari passu ('on an equal footing\") in right of payment.\nC. Incorrect because all creditors at the same level of the capital structure are treated as\none class; thus, a senior unsecured bondholder whose debt is due in 30 years has the same\npro rata claim in bankruptcy as one whose debt matures in six months. This provision is\nreferred to as bonds ranking pari passu ('on an equal footing') in right of payment\nFixed Income: describe the seniority rankings of debt, secured versus unsecured debt and\nthe priority of claims in bankruptcy, and their impact on credit ratings", "qhtml": null}, {"n": 16, "q": "All else being equal, reinvestment risk is greatest for:", "opts": ["putable bonds.", "callable bonds.", "non-callable convertible bonds."], "ans": "B", "expl": "A. Incorrect because putable bonds are beneficial for the bondholder by guaranteeing a pre-\nspecified selling price at the redemption dates. If interest rates rise after the issue date, thus\ndepressing the bond's price, the bondholders can put the bond back to the issuer and get\ncash. This cash can be reinvested in bonds that offer higher yields, in line with the higher\nmarket interest rates. Thus reinvestment risk is lower for a putable bond than for a callable\nbond, all else being equal\nB. Correct because callable bonds present investors with a higher level of reinvestment risk\nthan non-callable bonds, that is, if the bonds are called, bondholders have to reinvest funds\nin a lower interest rate environment\nC. Incorrect because a convertible bond can be viewed as the combination of a straight\nbond (option-free bond) plus an embedded equity call option. Convertible bonds can also\ninclude additional provisions, the most common being a call provision. As there is no call\nprovision applicable in this instance, reinvestment risk will be lower than for an equivalent\nbond with a call provision: callable bonds present investors with a higher level of\nreinvestment risk than non-callable bonds, that is, if the bonds are called, bondholders have\nto reinvest funds in a lower interest rate environment\nFixed Income: describe common cash flow structures of fixed-income instruments and\ncontrast cash flow contingency provisions that benefit issuers and investors", "qhtml": null}, {"n": 17, "q": "An analyst is concerned that a bond might be downgraded one category by Standard &\nPoor's and become non- investment grade. The current rating of this bond is most likely.", "opts": ["A-", "BB-", "BBB-"], "ans": "C", "expl": "A. Incorrect because a bond rated A-can be downgraded one category (to BBB-) and still be\nan investment grade bond\nB. Incorrect because a bond rated BB- is already below investment grade before any\ndowngrade\nC. Correct because BBB- is the lowest rating for investment grade bonds. A one-category\ndowngrade (from BBB- to BB-) would make the bond non-investment grade\nFixed Income: describe the uses of ratings from credit rating agencies and their limitations", "qhtml": null}, {"n": 18, "q": "A corporation with a holding company structure has debt at both its parent holding\ncompany and operating subsidiaries Debt at the operating level must be serviced before funds\ncan be upstreamed to pay debt at the holding company. This arrangement best describes:", "opts": ["structural subordination.", "a cross-default provision.", "the corporate family rating."], "ans": "A", "expl": "A. Correct because another factor considered by rating agencies is structural subordination,\nwhich can arise when a corporation with a holding company structure has debt at both its\nparent holding company and operating subsidiaries. Debt at the operating subsidiaries will\nget serviced by the cash flow and assets of the subsidiaries before funds can be passed\n(\"upstreamed\") to the holding company to service debt at that level.\nB. Incorrect because cross-default provisions, occur when default such as non-payment of\ninterest on one bond trigger default on all outstanding debt. This is not structural\nsubordination\nC. Incorrect because rating agencies will typically provide both issuer and issue ratings,\nparticularly as they relate to corporate debt. Terminology used to distinguish between\nissuer and issue ratings includes corporate family rating. This is not structural subordination.\nFixed Income: describe the seniority rankings of debt, secured versus unsecured debt and\nthe priority of claims in bankruptcy, and their impact on credit ratings", "qhtml": null}, {"n": 19, "q": "For an option-free fixed-rate bond trading at a premium, as the coupon payment date\napproaches, Macaulay duration most likely", "opts": ["decreases.", "remains constant.", "increases."], "ans": "A", "expl": "A. Correct because as times passes during the coupon period (moving from right to left in\nthe diagram), the Macaulay duration declines smoothly and then jumps upward after the\ncoupon is paid. The usual pattern is that longer times-to-maturity correspond to higher\nMacaulay duration statistics. This pattern always holds for bonds trading at par value or at a\npremium above par Conversely, a shorter time to maturity corresponds to a lower Macaulay\nduration during the coupon period.\nB. Incorrect because the usual pattern is that longer times-to-maturity correspond to higher\nMacaulay duration statistics. This pattern always holds for bonds trading at par value or at a\npremium above par Macaulay duration statistic stays constant if the bond is a perpetuity.\nC. Incorrect because if the bond is priced at a discount [not at a premium], a longer time-to-\nmaturity might lead to a lower duration. This situation only occurs if the coupon rate is low\n(but not zero) relative to the yield and the time- to-maturity is long. Conversely, only for\nspecial cases of discount bonds, a shorter time to maturity might lead to a higher duration\nstatistic\nFixed Income: explain how a bond's maturity, coupon, and yield level affect its interest rate\nrisk", "qhtml": null}, {"n": 20, "q": "Using the rating scale from Standard & Poor's or Fitch, the lowest rating for an\ninvestment-grade bond is", "opts": ["BBB-", "BBB", "BBB+"], "ans": "A", "expl": "A. Correct because bonds rated Baa3 or higher by Moody's and BBB- or higher by Standard\n& Poor's and Fitch are considered investment grade.\nB. Incorrect because bonds rated Baa3 or higher by Moody's and BBB- or higher by Standard\n& Poor's and Fitch are considered investment grade\nC. Incorrect because bonds rated Baa3 or higher by Moody's and BBB- or higher by Standard\n& Poor's and Fitch are considered investment grade\nFixed Income: describe fixed-income market segments and their issuer and investor\nparticipants", "qhtml": null}, {"n": 21, "q": "The EBITDA/interest expense ratio is best classified as a:", "opts": ["leverage ratio.", "coverage ratio.", "profitability ratio."], "ans": "B", "expl": "A. Incorrect because EBITDA/interest is a coverage ratio, not a leverage ratio. There are a\nfew measures of leverage used by credit analysts. The most common are the debt/capital,\ndebt/EBITDA, and measures of funds or cash flows/debt ratios.\nB. Correct because coverage ratios measure an issuer's ability to meet-to \"cover-its interest\npayments. The two most common are the EBITDA/interest expense and EBIT/interest\nexpense ratios.\nC. Incorrect because while there are several measures of cash flow and profitability used in\ncredit analysis, EBITDA/interest is not a measure of profitability EBITDA is a commonly used\nmeasure of cash flow that takes operating income and adds back depreciation and\namortization expense because those are noncash items.\nFixed Income:calculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 22, "q": "Which of the following statements is most accurate? US commercial paper typically:", "opts": ["requires the issuer to pledge collateral", "requires the issuer to have a backup line of credit.", "has a maturity ranging from a few days up to two years."], "ans": "B", "expl": "A. incorrect because commercial paper is a short-term unsecured promissory note issued in\nthe public marker or via a private placement that represents a debt obligation of the issuer\nBeing unsecured the issuer is not required to pledge collateral\nB. Correct ancalase credit that agencies often require that commercial paper issuers secure\na backup line of credit from banks\nC. Incorrect because maturities for US commercial paper typically range from a few days up\nto 270 days.\nFixed Income: compare short-term funding alternatives available to corporations and\nfinancial institutions", "qhtml": null}, {"n": 23, "q": "The current yield for a 4.5% coupon, 10-year bond, with a maturity par value of $100 and\ncurrently priced at $85.70\nis closest to:", "opts": ["4.50%", "5.25%.", "5.93%."], "ans": "B", "expl": "A. Incorrect because it is the coupon of the bond.\nB. Correct because current yield is calculated as ($4.5 / $85.70) = 5.25%.\nC. Incorrect because it is calculated as follows:\n100 - 85.70 = 14.30\n14.30 / 10 = 1.43.\n4.5 + 1.43 = 5.93\nFixed Income: compare, calculate, and interpret yield and yield spread measures for fixed-\nrate bonds", "qhtml": null}, {"n": 24, "q": "Which of the following types of collateralized debt obligations (CDOS) are most likely\nbacked by asset-backed securities?", "opts": ["Structured finance CDOS", "Collateralized loan obligations", "Collateralized bond obligations"], "ans": "A", "expl": "A. Correct because collateralized debt obligation (CDO) is a generic term used to describe a\nsecurity backed by a diversified pool of one or more debt obligations: CDOs backed by ABS,\nRMBS, CMBS, and other CDOs are structured finance CDOS.\nB. Incorrect because collateralized debt obligation (CDO) is a generic term used to describe a\nsecurity backed by a diversified pool of one or more debt obligations. CDOs backed by\nleveraged bank loans are collateralized loan obligations (CLOS)\nC. Incorrect because collateralized debt obligation (CDO) is a generic term used to describe a\nsecurity backed by a diversified pool of one or more debt obligations CDOs backed by\ncorporate and emerging market bonds are collateralized bond obligations (CBOs).\nFixed Income: describe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 25, "q": "An analyst gathers the following information about a 6% coupon bond currently trading at\npar:\nBenchmark Rate Price per 100 of Par Value\n5.9% 100.75\n6.0% 100.00\n6.1% 99.26\nThe bond's effective duration is closest to:", "opts": ["3.75.", "7.45.", "7.50."], "ans": "B", "expl": "A. Incorrect because it uses the current price instead of the price if interest rates increase in\nthe numerator = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥curve x 𝑃𝑉 ) = (100.75 - 100.00) / (2 x 0.001 x 100.00) =\n+ 0 0\n3.75.\nB. Correct because effective duration - (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥curve x 𝑃𝑉 ) = (100.75 – 99.26) /\n+ 0 0\n(2 x 0.001 x 100.00) = 7.45.\nC. Incorrect because it uses the current price instead of the price if interest rates increase in\nthe numerator and fails to multiply by 2 in the denominator, = (𝑃𝑉 −𝑃𝑉 ) / (𝛥curve x 𝑃𝑉 )\n+ 0 0\n= (100.75 - 100.00) / (0.001 x 100.00) = 7.50.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": "<p>An analyst gathers the following information about a 6% coupon bond currently trading at par:</p><table class=\"qtable\"><thead><tr><th>Benchmark Rate</th><th>Price per 100 of Par Value</th></tr></thead><tbody><tr><td>5.9%</td><td>100.75</td></tr><tr><td>6.0%</td><td>100.00</td></tr><tr><td>6.1%</td><td>99.26</td></tr></tbody></table><p>The bond's effective duration is closest to:</p>"}, {"n": 26, "q": "An analyst gathers the following information about a pension plan's liabilities:\nInterest Rate Assumption Present Value of Liabilities (in $ Millions)\n0.5% 198\n1.0% 186\n1.5% 174\nIf interest rates are currently 1.0%, the effective duration of the liabilities is closest to:", "opts": ["6.5.", "12.9.", "25.8."], "ans": "B", "expl": "A. Incorrect because this response uses 1% for the change in the benchmark yield curve\n(ACurve), instead of 0.5%. Effective duration = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥curve x 𝑃𝑉 ) = ($198\n− + 0\nmillion - $174 million) / (2 x 0.01 x $186 million) = 6.4516 ≈ 6.5.\nB. Correct because effective duration = (𝑃𝑉 −𝑃𝑉 ) / (2 × 𝛥curve x 𝑃𝑉 ) = ($198 million -\n− + 0\n$174 million) / (2 x 0.005 x $186 million) = 12.9032 ≈ 12.9.\nC. Incorrect because this response uses an incorrect formula for effective duration; (𝑃𝑉 −\n−\n𝑃𝑉 ) / (𝛥curve x 𝑃𝑉 ) = ($198 million - $174 million)/(0.005 x $186 million) = 25.8065 ≈\n+ 0\n25.8.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": "<p>An analyst gathers the following information about a pension plan's liabilities:</p><table class=\"qtable\"><thead><tr><th>Interest Rate Assumption</th><th>Present Value of Liabilities (in $ Millions)</th></tr></thead><tbody><tr><td>0.5%</td><td>198</td></tr><tr><td>1.0%</td><td>186</td></tr><tr><td>1.5%</td><td>174</td></tr></tbody></table><p>If interest rates are currently 1.0%, the effective duration of the liabilities is closest to:</p>"}, {"n": 27, "q": "Which of the following is a curve duration measure?", "opts": ["Modified duration", "Effective duration", "Macaulay duration"], "ans": "B", "expl": "A. Incorrect because modified duration is a yield duration statistic. There are several types\nof bond duration. In general, these can be divided into yield duration and curve duration.\nYield duration is the sensitivity of the bond price with respect to the bond's own yield-to-\nmaturity.\nB. Correct because effective duration is a curve duration statistic in that it measures interest\nrate risk in terms of a parallel shift in the benchmark yield curve\nC. Incorrect because Macaulay duration is a weighted average of the time to receipt of . the\nbond's promised payments, where the weights are the shares of the full price that\ncorrespond to each of the bond's promised future payments\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 28, "q": "Bonds issued in the Eurobond market are most likely.", "opts": ["denominated only in euros.", "in the form of registered bonds.", "issued within the jurisdiction of the issuer's home country."], "ans": "B", "expl": "A. Incorrect because bonds issued and traded on the Eurobond market are called\nEurobonds, and they are named after the currency in which they are denominated. For\nexample, Eurodollar and Euroyen bonds are denominated in US dollars and Japanese yens,\nrespectively. Bonds that are denominated in euros are called euro- denominated\nEurobonds.\nB. Correct because Eurobonds, domestic, and foreign bonds are now registered bonds for\nwhich ownership is recorded by either name or serial number.\nC. Incorrect because Eurobonds are issued outside the jurisdiction of any single country, are\nusually unsecured, and may be denominated in any currency, including the issuer's domestic\ncurrency.\nFixed Income: describe how legal, regulatory, and tax considerations affect the issuance and\ntrading of fixed-income securities", "qhtml": null}, {"n": 29, "q": "For a coupon bond with a negative yield, compounding more frequently within the year\nresults in a yield-to-maturity that is:", "opts": ["more negative.", "the same.", "less negative."], "ans": "A", "expl": "A. Correct because compounding more frequently within the year results in a lower (more\nnegative) yield-to- maturity.\nB. Incorrect because compounding more frequently within the year results in a lower (more\nnegative) yield-to- maturity. Converting the annualized yield-to-maturity to quarterly and\nmonthly compounding results in the same rates of return.\nC. Incorrect because compounding more frequently within the year results in a lower (more\nnegative) yield-to- maturity.\nFixed Income: calculate annual yield on a bond for varying compounding periods in a year", "qhtml": null}, {"n": 30, "q": "All else being equal, expected loss for a debt instrument:", "opts": ["is independent of the recovery rate.", "decreases as the recovery rate increases.", "changes proportionally to the recovery rate."], "ans": "B", "expl": "A. Incorrect because Expected loss = Default probability x (1 - Recovery rate). Since expected\nloss is affected by changes in the recovery rate, it is not independent of the recovery rate.\nB. Correct because Expected loss = Default probability x Loss severity given default, where\nloss severity is often expressed as (1- Recovery rate), where the recovery rate is the\npercentage of the principal amount recovered in the event of default. Thus expected loss\ncan also be written as Expected loss = Default probability x (1- Recovery rate), which means\nthat the higher the recovery rate, the lower the expected loss.\nC. Incorrect because the relationship Expected loss = Default probability x (1 - Recovery rate)\nimplies that expected loss increases when the recovery rate decreases and vice versa, hence\nit does not change proportionally to the recovery rate.\nFixed Income: describe credit risk and its components, probability of default and loss given\ndefault", "qhtml": null}, {"n": 31, "q": "Matrix pricing is most likely used to estimate the price of a bond that", "opts": ["is highly liquid.", "is not yet issued.", "has unknown credit quality."], "ans": "B", "expl": "A. Incorrect because some fixed-rate bonds are not actively traded it is common to estimate\nthe market discount rate and price based on the quoted or flat prices of more frequently\ntraded comparable bonds. These comparable bonds have similar times-to-maturity, coupon\nrates, and credit quality. This estimation process is called matrix pricing. Highly liquid bonds\nare priced based on actual market pricing rather than matrix pricing.\nB. Correct because for bonds that are not yet issued it is common to estimate the market\ndiscount rate and price based on the quoted or flat prices of more frequently traded\ncomparable bonds. These comparable bonds have similar times-to-maturity, coupon rates,\nand credit quality. This estimation process is called matrix pricing.\nC. Incorrect because for comparable bonds that have similar times-to-maturity, coupon\nrates, and credit quality the estimation process is called matrix pricing. Bonds with uncertain\ncredit quality are not good candidates for matrix pricing\nFixed Income: describe matrix pricing", "qhtml": null}, {"n": 32, "q": "All else being equal, the risk of a strategic default for a non-recourse mortgage is most\nlikely.", "opts": ["lower than for a recourse mortgage.", "the same as for a recourse mortgage.", "greater than for a recourse mortgage."], "ans": "C", "expl": "A. Incorrect because for a non-recourse mortgage, the borrower may have an incentive to\ndefault on an underwater mortgage and allow the lender to foreclose on the property, even\nif resources are available to continue to make mortgage payments. This type of default by a\nborrower is referred to as a \"strategic default. Therefore, the risk of a strategic default is\nhigher (not lower) for a non-recourse mortgage.\nB. Incorrect because for a non-recourse mortgage, the borrower may have an incentive to\ndefault on an underwater mortgage and allow the lender to foreclose on the property, even\nif resources are available to continue to make mortgage payments. This type of default by a\nborrower is referred to as a \"strategic default.\" Therefore, the risk of a strategic default is\nhigher (not the same) for a non-recourse mortgage.\nC. Correct because for a non-recourse mortgage, the borrower may have an incentive to\ndefault on an underwater mortgage and allow the lender to foreclose on the property, even\nif resources are available to continue to make mortgage payments. This type of default by a\nborrower is referred to as a \"strategic default. In countries where residential mortgages are\nrecourse loans, a strategic default is less likely because the lender can seek to recover the\nshortfall from the borrower's other assets and/or income. Therefore, the risk of a strategic\ndefault is higher for a non-recourse mortgage\nFixed Income: describe fundamental features of residential mortgage loans that are\nsecuritized", "qhtml": null}, {"n": 33, "q": "For bonds with embedded options, the most appropriate measure of price sensitivity to\ninterest rate changes is:", "opts": ["effective duration.", "modified duration.", "Macaulay duration."], "ans": "A", "expl": "A. Correct because effective duration is essential to the measurement of the interest rate\nrisk of a complex bond, such as a bond that contains an embedded call option. In brief, a\ncallable bond does not have a well-defined internal rate of return (yield-to-maturity).\nTherefore, yield duration statistics, such as modified and Macaulay durations, do not apply\neffective duration is the appropriate duration measure\nB. Incorrect because in brief, [an option embedded) bond does not have a well-defined\ninternal rate of return (yield- to-maturity). Therefore, yield duration statistics, such as\nmodified and Macaulay durations, do not apply; effective duration is the appropriate\nduration measure.\nC. Incorrect because in brief. [an option embedded) bond does not have a well-defined\ninternal rate of return (yield- to-maturity). Therefore, yield duration statistics, such as\nmodified and Macaulay durations, do not apply effective duration is the appropriate\nduration measure.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 34, "q": "For a bond with an embedded option, effective duration is the most appropriate measure\nof interest rate risk because the bond's:", "opts": ["future cash flows are uncertain.", "internal rate of return is well-defined.", "pricing is sensitive to changes in credit spreads."], "ans": "A", "expl": "A. Correct because effective duration is essential to the measurement of the interest rate\nrisk of a complex bond, such as a bond that contains an embedded call option. The problem\nis that future cash flows are uncertain because they are contingent on future interest rates.\nThe issuer's decision to call the bond depends on the ability to refinance the debt at a lower\ncost of funds. Effective duration is the appropriate duration measure.\nB. Incorrect because a callable bond does not have a well-defined internal rate of return\n(yield-to-maturity). Therefore, yield duration statistics, such as modified and Macaulay\ndurations, do not apply; effective duration is the appropriate duration measure.\nC. Incorrect because effective duration measures the bond's sensitivity to changes in the\nbenchmark yield curve and not changes in credit spread, which are measured by other\nmeans (pricing models). This curve duration measure [effective duration] indicates the\nbond's sensitivity to the benchmark yield curve-in particular, the government par curve-\nassuming no change in the credit spread. A pricing model can be used to determine a 'credit\nduration statistic-that is, the sensitivity of the bond price to a change in the credit spread.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 35, "q": "An analyst gathers the following information about a spot curve:\nTerm to Maturity Spot Rate\n1 year 6%\n2 years 5%\n3 years 4%\nIf the coupon rate of a 3-year annual-pay bond is 4%, the price of the bond is closest to:", "opts": ["97.28.", "99.86.", "100.00."], "ans": "B", "expl": "A. Incorrect because the price of the bond is calculated using as discount rates the average\nof the spot rates; (6% + 5% + 4%)/3 = 15%/3 = 5%. Hence, PV ≠ 4/(1.05)¹ + 4/(1.05)2 +\n104/(1.05)3 = 4/1.05 + 4/1.1025+ 104/1.157625 = 3.8095 + 3.6281 + 89.8391= 97.276 ≈\n97.28.\nB. Correct because given the spot rates, the price of a bond can be calculated using the\nfollowing formula: PV = [PMT/(1+𝑍 )1+ PMT/(1+ 𝑍 )²+...+ (PMT + FV)/(1+ 𝑍 )N ] Hence, PV =\n1 2 𝑁\n4/(1+0.06)1 + 4/(1+0.05)² + (4 + 100)/(1+0.04)3 = 4/1.06 + 4/1.1025+ 104/1.1249 = 3.77358 +\n3.62812 + 92.4556 = 99.8573 ≈ 99.86.\nC. Incorrect because the price of the bond is calculated using the 3-year spot rate as\ndiscount rate for all cash flows.\nHence, PV ≠ 4/(1 + 0.04)¹ + 4/(1 + 0.04)2 + (4 + 100)/(1 + 0.04)3 = 4/1.04 + 4/1.0816 +\n104/1.1249 = 3.8461 + 3.6982 + 92.4527 = 99.9969 ≈ 100.00.\nFixed Income: define spot rates and the spot curve, and calculate the price of a bond using\nspot rates", "qhtml": null}, {"n": 36, "q": "The price of an option-free bond increases by 7% when the yield to maturity decreases by\n100 basis points. If the price of this bond decreases by 7%, the yield to maturity most likely\nincreases by:", "opts": ["less than 100 basis points.", "100 basis points.", "more than 100 basis points."], "ans": "C", "expl": "A. Incorrect because for the same coupon rate and time-to-maturity, the percentage price\nchange is greater (in absolute value, meaning without regard to the sign of the change)\nwhen the market discount rate goes down than when it goes up (the convexity effect).\nB. Incorrect because for the same coupon rate and time-to-maturity, the percentage price\nchange is greater (in absolute value, meaning without regard to the sign of the change)\nwhen the market discount rate goes down than when it goes up (the convexity effect).\nC. Correct because for the same coupon rate and time-to-maturity, the percentage price\nchange is greater (in absolute value, meaning without regard to the sign of the change)\nwhen the market discount rate goes down than when it goes up (the convexity effect)\nFixed Income: identify the relationships among a bond's price, coupon rate, maturity, and\nyield-to-maturity", "qhtml": null}, {"n": 37, "q": "All else being equal, the absolute value of the percentage price change for an option-free\nbond is most likely", "opts": ["less when the market discount rate decreases than when it increases by the same amount.", "the same whether the market discount rate decreases or increases by the same amount.", "greater when the market discount rate decreases than when it increases by the same amount."], "ans": "C", "expl": "A. Incorrect because the opposite is true due to the convexity effect. For the same coupon\nrate and time-to-maturity, the percentage price change is greater (in absolute value,\nmeaning without regard to the sign of the change) when the market discount rate goes\ndown than when it goes up (the convexity effect).\nB. Incorrect because it ignores the convexity effect of most option-free bonds. For the same\ncoupon rate and time. to-maturity, the percentage price change is greater (in absolute\nvalue, meaning without regard to the sign of the change) when the market discount rate\ngoes down than when it goes up (the convexity effect).\nC. Correct because for the same coupon rate and time-to-maturity, the percentage price\nchange is greater (in absolute value, meaning without regard to the sign of the change)\nwhen the market discount rate goes down than when it goes up (the convexity effect).\nFixed Income: identify the relationships among a bond's price, coupon rate, maturity, and\nyield-to-maturity", "qhtml": null}, {"n": 38, "q": "An analyst gathers the following information about three option-free bonds:\nBond 1 Bond 2 Bond 3\nCoupon rate 5% 3% 3%\nMaturity (years) 15 10 15\nAll else being equal, if the market discount rate decreases by 50 basis points, the bond most\nlikely to experience the greatest percentage price change is:", "opts": ["Bond 1.", "Bond 2.", "Bond 3"], "ans": "C", "expl": "A. Incorrect because for the same time-to-maturity, a lower-coupon bond has a greater\npercentage price change than a higher-coupon bond when their market discount rates\nchange by the same amount (the coupon effect). Bond 1 has the same time-to-maturity as\nBond 3 but a higher coupon, thus Bond 1 would experience a smaller percentage price\nchange compared to Bond 3.\nB. Incorrect because generally, for the same coupon rate, a longer-term bond has a greater\npercentage price change than a shorter-term bond when their market discount rates change\nby the same amount (the maturity effect). Bond 2 has the same coupon rate as Bond 3 but a\nshorter maturity, thus Bond 2 would experience a smaller percentage price change\ncompared to Bond 3.\nC. Correct because for the same time-to-maturity, a lower-coupon bond has a greater\npercentage price change than a higher-coupon bond when their market discount rates\nchange by the same amount (the coupon effect). Bond 3 has the same time-to-maturity as\nBond 1 but a lower coupon, thus Bond 3 would experience a greater percentage price\nchange compared to Bond 1. Also, generally, for the same coupon rate, a longer-term bond\nhas a greater percentage price change than a shorter-term bond when their market\ndiscount rates change by the same amount (the maturity effect). Bond 3 has the same\ncoupon rate as Bond 2 but a longer maturity, thus Bond 3 would experience a greater\npercentage price change compared to Bond 2.\nFixed Income: identify the relationships among a bond's price, coupon rate, maturity, and\nyield-to-maturity", "qhtml": "<p>An analyst gathers the following information about three option-free bonds:</p><table class=\"qtable\"><thead><tr><th></th><th>Bond 1</th><th>Bond 2</th><th>Bond 3</th></tr></thead><tbody><tr><td>Coupon rate</td><td>5%</td><td>3%</td><td>3%</td></tr><tr><td>Maturity (years)</td><td>15</td><td>10</td><td>15</td></tr></tbody></table><p>All else being equal, if the market discount rate decreases by 50 basis points, the bond most likely to experience the greatest percentage price change is:</p>"}, {"n": 39, "q": "Implied forward rates are best defined as the:", "opts": ["geometric average of spot rates.", "breakeven reinvestment rates between zero-coupon bonds.", "current yield to maturity on zero-coupon bonds of different maturities."], "ans": "B", "expl": "A. Incorrect because the spot curve can be calculated as the geometric average of the\nforward rates.\nB. Correct because implied forward rates (also known as forward yields) are calculated from\nspot rates. An implied forward rate is a break-even reinvestment rate. When the market is\nin equilibrium (no arbitrage) the implied forward rate is the same as the forward rate.\nC. Incorrect because spot rates are yields-to-maturity on zero-coupon bonds maturing at the\ndate of each cash flow.\nFixed Income: define spot rates and the spot curve, and calculate the price of a bond using\nspot rates", "qhtml": null}, {"n": 40, "q": "Effective duration is the most appropriate measure of interest rate risk for a bond with an\nembedded option because the bond does not have a well-defined:", "opts": ["effective convexity.", "internal rate of return.", "curve duration statistic."], "ans": "B", "expl": "A. Incorrect because bonds with embedded options have well-defined effective convexity.\nNegative convexity, which could be called \"concavity,\" is an important feature of callable\nbonds. Putable bonds, on the other hand, always have positive convexity.\nB. Correct because in brief, a callable bond does not have a well-defined internal rate of\nreturn (yield-to-maturity). Therefore, yield duration statistics, such as modified and\nMacaulay durations, do not apply; effective duration is the appropriate duration measure.\nC. Incorrect because effective duration is a curve duration statistic in that it measures\ninterest rate risk in terms of a parallel shift in the benchmark yield curve (𝛥Curve). The\ninterest rate risk of bonds with embedded options is most appropriately measured using\neffective duration, a curve statistic, which means that the sensitivity of a bond with an\nembedded-option to a change in the level of the benchmark yield curve is in fact well-\ndefined.\nFixed Income: explain why effective duration and effective convexity are the most\nappropriate measures of interest rate risk for bonds with embedded options", "qhtml": null}, {"n": 41, "q": "When interest rates increase, mortgage-backed securities most likely exhibit increased:", "opts": ["extension risk.", "contraction risk.", "reinvestment risk."], "ans": "A", "expl": "A. Correct because extension risk is the risk that when interest rates rise, prepayments will\nbe lower than forecasted because homeowners are reluctant to give up the benefits of a\ncontractual interest rate that now looks low. As a result, a security backed by mortgages will\ntypically have a longer maturity than was anticipated at the time of purchase.\nB. Incorrect because contraction risk is the risk that when interest rates decline, actual\nprepayments will be higher than forecasted because homeowners will refinance at now-\navailable lower interest rates. Thus, a security backed by mortgages will have a shorter\nmaturity than was anticipated at the time of purchase. Holding a security whose maturity\nbecomes shorter when interest rates decline has two adverse consequences for investors.\nFirst, investors must reinvest the proceeds at lower interest rates. Second, if the security is\nprepayable or callable, its price appreciation is not as great as that of an otherwise identical\nbond that does not have a prepayment or call option. Increased contraction risk occurs\nwhen interest rates decline, not increase.\nC. Incorrect because contraction risk is the risk that when interest rates decline, actual\nprepayments will be higher than forecasted because homeowners will refinance at now-\navailable lower interest rates. First, investors must reinvest the proceeds at lower interest\nrates. When interest rates decline, as opposed to increase, prepayments are likely to\nincrease and be reinvested at lower rates, thus increasing reinvestment risk. This is not likely\nto occur when interest rates rise.\nFixed Income: define prepayment risk and describe time tranching structures in\nsecuritizations and their purpose", "qhtml": null}, {"n": 42, "q": "Tightening corporate bond yield spreads are most likely associated with:", "opts": ["issuers' deteriorating creditworthiness.", "periods of high demand for corporate bonds.", "broker-dealers' reduced ability and willingness to make markets."], "ans": "B", "expl": "A. Incorrect because yield spreads widen based on two primary factors: (1) a decline in an\nissuer's creditworthiness, sometimes referred to as credit migration or downgrade risk, and\n(2) an increase in market liquidity risk.\nB. Correct because in periods of high demand for bonds, spreads will move tighter.\nC. Incorrect because yield spreads widen based on two primary factors: (1) a decline in an\nissuer's creditworthiness, sometimes referred to as credit migration or downgrade risk, and\n(2) an increase in market liquidity risk. Most markets beads trade primarily over the counter\nthrough broker-dealers trading for ther own accounts Their ability and willingness to make\nmarkets, as reflected in the bid-ask spread, is an important determinant of market liquidity\nrisk.\nFixed Income: describe macroeconomic, market, and issuer-specific factors that influence\nthe level and volatility of yield spreads", "qhtml": null}, {"n": 43, "q": "In a repurchase agreement:", "opts": ["only the lender of funds is exposed to credit risk.", "credit risk is eliminated by using highly rated sovereign bonds as collateral.", "the initial margin offers partial protection against changes in the market value of the collateral."], "ans": "C", "expl": "A. Incorrect because each repo contract participant is exposed to the risk that the other\nparty is unable to meet its obligations\nB. Incorrect because each repo contract participant is exposed to the risk that the other\nparty is unable to meet its obligations, regardless of the quality of the collateral used in the\nrepo transaction. The collateral should have little or no correlation with the credit risk of the\nrepo counterparty in order to diversify credit exposure.\nC. Correct because in addition to the high quality of underlying securities, repos include\nfeatures designed to reduce the risk of a collateral shortfall over the contract life. One such\nfeature is the provision of collateral in excess of the cash exchanged, known as initial\nmargin.\nFixed Income: describe repurchase agreements (repos), their uses, and their benefits and\nrisks", "qhtml": null}, {"n": 44, "q": "With respect to a bond with an embedded option, for parallel shifts in the benchmark\nyield curve, effective duration most likely indicates the same interest rate sensitivity as:", "opts": ["key rate durations.", "modified duration.", "Macaulay duration."], "ans": "A", "expl": "A. Correct because for parallel shifts in the benchmark yield curve, key rate durations will\nindicate the same interest rate sensitivity as effective duration.\nB. Incorrect because the difference between approximate modified duration and effective\nduration is in the denominator. Modified duration is a >yield duration statistic in that it\nmeasures interest rate risk in terms of a change in the band's own yield-to-maturity (AYield).\nThis question refers to changes in the benchmark yield curve, not the bond's own yield to\nmaturity, therefore, modified duration is an incorrect measure.\nC. Incorrect because the difference between approximate modified duration and effective\nduration is in the denominator. Modified duration is a yield duration statistic in that it\nmeasures interest rate risk in terms of a change in the band's own yield-to-maturity (AYield)\nAdditionally, The calculation of the modified duration (ModDur) statistic of a bond requires\na simple adjustment to Macaulay duration. It is the Macaulay duration statistic divided by\none plus the yield per period. Thus, the Macaulay duration, as a mathematical derivative of\nmodified duration, is also a measure of risk in terms of the change in a bond's own yield-to-\nmaturity. This question refers to changes in the benchmark yield curve, not the bond's own\nyield-to-maturity, therefore, modified duration is an incorrect measure.\nFixed Income: define key rate duration and describe its use to measure price sensitivity of\nfixed-income instruments to benchmark yield curve changes", "qhtml": null}, {"n": 45, "q": "In a securitization, a senior/subordinated structure is most likely a form of", "opts": ["time tranching", "credit tranching.", "prepayment risk management."], "ans": "B", "expl": "A. Incorrect because the creation of bond classes that possess different expected maturities\nis referred to as time a form of credit tranching, not time tranching.\nB. Correct because it is common for securitizations to include a form of internal credit\nenhancement called Subordination is subordination, also referred to as credit tranching. In\nsuch a structure, there is more than one bond class or tranche, and the bond classes differ\nas to how they will share any losses resulting from defaults of the borrowers whose loans\nare in the collateral. The bond classes are classified as senior bond classes or subordinated\nbond classes hence, the reason this structure is also referred to as a senior/subordinated\nstructure.\nC. Incorrect because prepayment risk is the uncertainty that the cash flows will be different\nfrom the scheduled cash flows as set forth in the loan agreement because of the borrowers'\nability to alter payments. This risk is related to time tranching, not credit tranching.\nFixed Income: describe typical credit enhancement structures used in securitizations", "qhtml": null}, {"n": 46, "q": "Modified duration is the most appropriate measure of interest rate risk for which of the\nfollowing securities?", "opts": ["Callable bond", "US Treasury bond", "Mortgage-backed bond"], "ans": "B", "expl": "A. Incorrect because a callable bond does not have a well-defined internal rate of return\n(yield-to-maturity). Therefore, yield duration statistics, such as modified and Macaulay\ndurations, do not apply effective duration is the appropriate duration measure\nB. Correct because modified duration can be used to measure the interest rate risk of a non-\ncomplex bond such as a US Treasury bond, while effective duration is essential to the\nmeasurement of the interest rate risk of a complex bond, such as a bond that contains an\nembedded call option.\nC. Incorrect because another fixed-income security for which yield duration statistics, such\nas modified and Macaulay durations, are not relevant is a mortgage-backed bond.\nFixed Income: define, calculate, and interpret modified duration, money duration, and the\nprice value of a basis point (PVBP)", "qhtml": null}, {"n": 47, "q": "The percentage price change for a bond, given a change in its yield to maturity, is best\nestimated by:", "opts": ["effective duration.", "modified duration.", "Macaulay duration."], "ans": "B", "expl": "A. Incorrect because the effective duration of a bond is the sensitivity of the bond's price to\na change in a benchmark yield curve, not to a change in the bond's yield to maturity\nB. Correct because modified duration is a yield duration statistic in that it measures interest\nrate risk in terms of a change in the bond's own yield-to-maturity. Modified duration\nprovides an estimate of the percentage price change for a bond given a change in its yield-\nto-maturity\nC. Incorrect because Macaulay duration is a weighted average of the time to receipt of the\nbond's promised payments, where the weights are the shares of the full price
