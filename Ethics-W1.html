<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

ndards with legal standards", "qhtml": null, "explfigs": null}, {"n": 2, "q": "A framework for ethical decision-making will most likely be effective when:", "opts": ["external stakeholders are considered.", "only verifiable information is included.", "the framework steps are followed in order."], "ans": "A", "expl": "The ethical decision-making framework is designed to help identify important factors in the decision-making process. After identifying relevant\ninformation, the next step is to consider situational influences, additional guidance or advice, and alternative actions and consequences. After a\ndecision is made and implemented, the decision-maker should assess the outcome.\nOne relevant factor is to identity all stakeholders (both internal and external) involved and the responsibilities that may be owed to each. It is also\nimportant to identify all potentially relevant facts of the situation, whether verifiable or not (Choice B), and any conflicts of interest, existing or\npotential, that impact this decision. Finally, it is important to identify the ethical principles that bear on the decision.\nThe framework is presented as a guide to a decision-making process, and while it is presented in a logical order (identify, consider, decide,\nassess), the steps may be applied in any order in practice (Choice C). Some steps may be repeated. For example, considering alternative\nactions may lead to identifying additional stakeholders or ethical principles.\nThings to remember:\nIn the decision-making framework, it is important to identify all stakeholders, facts, existing or potential conflicts of interest, and ethical principles\ninvolved. The remaining steps include considering situational influences, additional guidance, and alternative actions, and assessing the decision\nafter taking action. The process may not be linear; some steps may be repeated.\ndescribe a framework for ethical decision making", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0 8vRUAAAAASUVORK5CYII="]}, {"n": 3, "q": "Which of the following is most likely an appropriate goal of using an ethical decision-making framework?", "opts": ["Allow for potential unintended consequences", "Justify the decision to a broad range of stakeholders", "Minimize the perspectives included in the decision-making process"], "ans": "B", "expl": "A decision-making framework broadens the decision maker's approach by helping identify all relevant facts, stakeholders, possible conflicts\nof interest, duties owed, and ethical principles involved in a decision. Once stakeholders have been identified, the framework encourages a\ndecision maker to consider and include the stakeholders' multiple perspectives and concerns. Since a range of stakeholder concerns is\nincluded in the decision-making process, the decision maker can better justify the decision to stakeholders.\n(Choice A) A decision maker should try to minimize the potential for unintended consequences in order to avoid the possibility that one decision,\nin turn, will create new problems.\n(Choice C) Including multiple perspectives in the framework helps the decision maker consider factors that might otherwise be overlooked.\nThings to remember:\nA decision-making framework is most helpful when it broadens the decision maker's approach by helping identify all relevant facts, stakeholders,\npossible conflicts of interest, duties owed, and ethical principles involved in a decision. Since a range of stakeholder concerns is included in this\nprocess, the decision maker can better justify the decision to stakeholders.\ndescribe a framework for ethical decision making", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApkAAALuCAIAAABq6pp8AACYM0lEQVR42u39X1Bc95nnj78RCLCQQd2OkeUEJDWSR2MZ2TONJ1kPTiXlZitfo53Jn4KK5dmdcS5Acqo2k6tu+2YqN073VWZ+VbEMF3FmayynoOJ4U8LrXfBOdqS4MmN6RhZWSrGsloxiyyIjUGMhgwTid/EOzxyfppsG+s/p5v26oFqt0+d8zuec7uc878/zp2JxcRFCCCGEKFk2aQqEEEII2XIhhBBCyJYLIYQQQrZcCCGEkC0XQgghhGy5E e the relationship between bondholders and issuers. Indentures specify the features of the bond\n(eg, coupon rate, maturity date) as well as investor and issuer rights and obligations. For example, issuers are obligated to pay, and investors\nhave the right to receive, interest and principal. There may be contingency provisions that give the issuer the right to retire (ie, call) the bond\nbefore maturity or give investors the right to convert the bond into stock.\nProtective covenants are indenture provisions designed to protect the bondholders. These provisions are categorized as either:\naffirmative covenants, which require issuers to take specific actions that support the value of the bonds, or\nnegative covenants, which prohibit issuers from taking actions that might adversely affect the value of the bonds.\nAn incurrence test is a negative covenant that prohibits actions such as dividend payments, share repurchases, or debt issuance unless issuers\nsatisfy specified financial tests (eg, debt-to-EBITDA < 5).\n(Choice B) A pari passu (ie, from a Latin phrase meaning \"equal footing\") clause is an affirmative covenant requiring an issuer to give a bonds'\nholders treatment equal to that given holders of similar seniority debt securities from the same issuer.\n(Choice C) A cross-default clause is an affirmative covenant requiring an issuer to declare a bond in default, even in the absence of a failure to\npay, if the issuer defaults on any other debt obligation.\nThings to remember:\nBond indentures are legal contracts that define the relationship between bondholders and issuers. Many indenture provisions are protective\ncovenants; affirmative (negative) covenants require (prohibit) specified actions by the issuer in order to protect bondholders. An incurrence test is\na type of negative covenant.\nExplain ethics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAFzCAIAAAC4oEvGAAB3k0lEQVR42u39S4xj6XnnCT9RleWyOt3IU+VvMKjvm1EyqzYzDaiS e\neach person's self-interest with an awareness of how a person's actions affect others.\nCFA Institute has adopted the Code and Standards as its statement of shared principles, on the belief that ethics for the global investment industry\nshould be universal rather than based on local laws or customs. Global ethical standards are intended to create trust and integrity throughout the\nglobal financial system.\nIn this instance, a suitability standard is a legal obligation that requires just a minimal level of investment appropriateness without\nconsideration for other factors (eg, fees paid to the adviser). In contrast, a fiduciary obligation requires the adviser to adhere to a higher\nstandard that involves always serving the client's best interest, such as minimizing fees, all else being equal. Therefore, the Charterholder's\nactions were legal but unethical (Choices A and C).\nThings to remember:\nLegal standards alone are insufficient to shape appropriate behavior among investment professionals. A separate code of ethics can serve as a\nguide to appropriate moral conduct, which may exceed legal requirements.\nCompare and contrast ethical standards with legal standards", "qhtml": null, "explfigs": null}, {"n": 6, "q": "Which of the following best describes an illegal but ethical activity?", "opts": ["Whistle-blowers alerting authorities of corporate corruption.", "An analyst acting on a tip from a corporate insider in the United States.", "Managers sharing the firm's complete fee structure with potential clients and the public."], "ans": "A", "expl": "Legal vs. ethical behavior\nLegal Illegal\nEthical Adviser discloses fees to client Whistle-blower exposes corruption but violates disclosure laws\nUnethical Adviser is not fiduciary where not required by law Insider trading (US)\nLaws are not the ideal means to prevent unethical behavior since they are geographically inconsistent, slow to be enacted, and subject to\ncompliance. Financial regulations and securities laws define illegal activities. However, abiding by laws may or may not indicate ethical\nbehavior, which extends beyond laws and includes adhering to societal expectations of right and wrong. Thus, conduct can be legal but\nunethical.\nConversely, conduct can be ethical but illegal. An example of this is an act of civil disobedience, which calls attention to an unethical law yet may\nviolate local laws. Similarly, whistle-blowers who call attention to a company's illegal activity may be violating disclosure laws. Although alerting\nauthorities to wrongdoing is ethically correct, it may also be illegal.\n(Choice B) Using inside information to profit is morally wrong since perpetrators benefit to the detriment of others. This is true even where it is\nlegal. In the United States, using material nonpublic information is both illegal and unethical since it violates local laws.\n(Choice C) Managers publicly sharing fee information is legal and ethical. Firms have certain legal obligations regarding disclosures, including\nfees. It is also ethically correct to ensure that clients have enough information to make an informed decision.\nThings to remember:\nLaws are unsuited to prevent unethical behavior since they are geographically inconsistent, slow to be enacted, and subject to compliance.\nEthical behavior extends beyond abiding by laws and includes adhering to societal expectations of right and wrong. Actions can be legal, ethical,\nneither, or both.\nCompare and contrast ethical standards with legal standards", "qhtml": null, "explfigs": null}, {"n": 7, "q": "Which of the following best describes the purpose of the Code of Ethics for the global investment profession?", "opts": ["To build trust with all market participants", "To set the basis for laws and regulations", "To determine minimally acceptable behaviors"], "ans": "A", "expl": "Instruments for compliance with professional ethics\nInstrument Owner Describes\nCode of ethics Professional organization Shared principles\nStandards of conduct Professional organization Minimally acceptable behavior\nLaws and regulations Government Legal limits of behavior\nA code of ethics is a professional organization's statement of shared principles. It provides the moral compass for collective behavior. Ethical\nbehaviors are those actions that conform to society's expectations for honesty, transparency, and fairness, balancing each person's self-interest\nwith an awareness of how his or her actions affect others.\nCFA Institute has adopted the stance that ethics for the global investment industry should be universal and not based on local laws or customs.\nThis ubiquity creates trust and integrity in the whole global financial system. As stated in one of the principles in the CFA Institute Code of Ethics:\n\"Members and Candidates must:\nPromote the integrity and viability of the global capital markets for the ultimate benefit of society.\"\nA profession's code of ethics may or may not be accompanied by standards of conduct, whereas standards of conduct exist only to enhance their\nassociated code of ethics. CFA Institute has adopted both in its Code of Ethics and Standards of Professional Conduct (the Code and\nStandards). CFA charterholders and Candidates are expected to know and comply with both.\n(Choice B) It is a government's responsibility to establish legal limits of behavior through laws and regulations. The belief system used to create\nthese policies in one country may differ from that of another country and from the shared ethical principles of a global organization.\n(Choice C) Standards of conduct clarify the minimally acceptable behaviors required to conform to a profession's code of ethics and provide a\nguide to practicing its principles.\nThings to remember:\nA code of ethics is a professional organization's statement of shared principles. It provides the moral compass for collective behavior. A universal\nagreement on what is ethical for the global investment profession creates trust and integrity in the whole global financial system, which ultimately\nbenefits society.\nDescribe the role of a code of ethics in defining a profession", "qhtml": null, "explfigs": null}, {"n": 8, "q": "If a professional organization has standards of conduct in addition to its code of ethics, the purpose of the standards is most likely to describe:", "opts": ["shared principles.", "laws and regulations.", "acceptable behaviors."], "ans": "C", "expl": "Instruments for compliance with professional ethics\nInstrument Owner Describes\nCode of ethics Professional organization Shared principles\nStandards of conduct Professional organization Minimally acceptable behavior\nLaws and regulations Government Legal limits of behavior\nA code of ethics is a professional organization's statement of shared principles. Standards of conduct provide a guide to practicing the\nprinciples outlined in the code of ethics. Standards of conduct also clarify the minimally acceptable behaviors required to conform to the code\nof ethics. Although not addressed directly in standards of conduct, adherence to civil laws and regulations may be the minimally acceptable\nbehavior in some cases.\nStandards of conduct may be principle-based or rule-based. Principle-based standards are universally applicable to members of the profession\nand are based on the principles outlined in the code of ethics. Rule-based standards, while also relating to the principles in the code of ethics, are\nusually more narrowly applicable and specific to certain members or scenarios that may arise.\nA code of ethics may or may not be accompanied by standards of conduct whereas standards of conduct exist only to enhance their associated\ncode of ethics. CFA Institute has adopted both a code of ethics and standards of conduct (the \"Code and Standards\"); CFA charterholders and\ncandidates are expected to know and comply with both.\n(Choice A) Standards of conduct are used to describe minimally acceptable behaviors or practices, given the shared principles of the code of\nethics. The code of ethics describes the shared principles.\n(Choice B) Standards of conduct do not describe civil laws and regulations.\nThings to remember:\nStandards of conduct are used to clarify the minimally acceptable behaviors required to conform to the shared principles stated in a code of ethics;\nthey do not address applicable civil laws and regulations.\nDescribe the role of a code of ethics in defining a profession", "qhtml": null, "explfigs": null}, {"n": 9, "q": "An investment professional least likely displays a high level of professionalism when:", "opts": ["maximizing revenue for their employer.", "working late to help a co-worker finish a project.", "researching the efficacy of a new analytical model."], "ans": "A", "expl": "A profession is an occupation that has an established body of knowledge and standards of practice and behavior. Relative to craft guilds and\ntrade bodies, a profession holds itself to a higher ethical standard. A profession's primary goal is to establish trust between clients and society in\ngeneral. Examples of professions include doctors, lawyers, and accountants.\nCharacteristics of a profession include\nService to clients and society\nStandardized practitioner behavior\nHigh entry standards\nBody of expert knowledge\nEncouraging and facilitating continuing education\nProfessional conduct monitoring\nRecognized governing body\nMember engagement\nCollegiality\nBy adhering to the tenets of a profession and by establishing shared principles that all members of the profession agree to and live by, investment\nprofessionals build credibility, respect, and trust with clients and society. A profession maintains trust by establishing minimum standards of care\nthat ensure a culture of integrity and competency in practice.\nIn this instance, an investment professional has a duty to their employer, but not at the expense of their clients. The standard of care for an\ninvestment professional is a fiduciary standard. This requires acting in the client's best interest, which will not always allow for maximizing firm\nrevenue.\n(Choice B) Working late to help a co-worker finish a project is an example of collegiality.\n(Choice C) Researching the efficacy of a new analytical model is a form of continuing education.\nThings to remember:\nA profession is an occupation that shares an established body of knowledge and standards of practice and behavior. By adhering to the tenets of\na profession, investment professionals build credibility with the public, and, in turn, earn respect and build trust with clients and society.\nexplain professionalism in investment management", "qhtml": null, "explfigs": null}, {"n": 10, "q": "Which of the following best explains why recognition of investment management as a profession lags behind other professions? The investment management profession has not yet:", "opts": ["created high entry standards.", "established a body of knowledge.", "required membership in a professional body."], "ans": "C", "expl": "A profession is an occupation that has an established body of knowledge and standards of practice and behavior. Specialists (eg, physicians,\nlawyers, accountants) who share licensing, technical, or regulatory requirements may be recognized as belonging to a profession.\nInvestment management has most of the features of a recognized profession, such as an established body of knowledge (Choice B). However,\nthe investment management profession does not yet require membership in a professional organization, such as CFA Institute, to practice. In\ncontrast, lawyers in the US and many other countries must not only pass the bar exam but also be admitted to the bar (ie, be a member in good\nstanding of the bar association) to practice law.\n(Choice A) The investment management profession does offer certifications and licensing [eg, CFA, Series 7, Financial Risk Manager (FRM)] that\ncan act as high entry standards.\nThings to remember:\nA profession is an occupation that shares an established body of knowledge and standards of practice and behavior. Investment management\nhas most of the features of a recognized profession; however, it does not require membership in a professional organization.\nexplain professionalism in investment management", "qhtml": null, "explfigs": null}, {"n": 11, "q": "Which of the following is the least effective way for a professional association to build trust with clients? The association publicizes that it:", "opts": ["administers a difficult qualifying exam.", "operates in a highly regulated industry.", "monitors compliance with a code of ethics."], "ans": "B", "expl": "How a profession maintains trust\nEstablishes norms of practice\nRemains client focused\nMaintains high entry standards\nMonitors professional conduct\nNurtures a body of knowledge\nEncourages lifelong learning\nFunctions as an oversight body or\nregulatory adviser\nA respected profession must maintain credibility and build trust with clients (eg, the investment profession benefits from the trust of market\nparticipants). It does so most effectively through its own initiatives, not merely by operating in a highly regulated industry.\nThe fact that an industry is highly regulated does not necessarily signal trustworthy professional practice; it indicates only a high degree of\noversight. However, if the professional association shows initiative as an oversight body or a regulatory advisor, it suggests a degree of respect\nfor the association due to its stature as an authoritative resource. This enhances the association's and, by extension, the profession's\ntrustworthiness.\nAs shown in the image above, there are several ways that a profession can build trust. One way is creating a body of knowledge, maintaining high\nprofessional standards, and administering a qualifying exam to ensure that the standards are met (Choice A). Another is monitoring compliance\nwith an established code of ethics (Choice C).\nThings to remember:\nA respected profession must build trust with clients. It does so most effectively through its own initiatives, not merely by operating in a highly\nregulated industry.\ndescribe professions and how they establish trust", "qhtml": null, "explfigs": null}, {"n": 12, "q": "Which of the following best describes ethical conduct? Ethical conduct balances concerns for consequences to others with:", "opts": ["self-interest.", "legal outcomes.", "minimally acceptable behavior."], "ans": "A", "expl": "Ethics is defined as a set of principles that guide behavior. Those ethical principles are commonly held beliefs that designate good and bad,\ntolerable and intolerable, and required and optional behaviors.\nBelief in ethical principles should lead to ethical conduct: behavior that balances self-interest with concern for consequences to others.\nInvestment professionals often have to weigh the consequences of their actions for clients, employers, the profession, and/or the integrity of the\nfinancial markets against their own self-interest.\n(Choice B) Laws are defined by governing bodies, not necessarily by commonly accepted moral principles. Ethical behavior does not attempt to\nbalance concern for others with legal outcomes.\n(Choice C) Ethical conduct may exceed minimally acceptable behavior, which is often described as standards of conduct. Such standards often\naccompany the code of ethics that describes ethical principles.\nThings to remember:\nEthical principles are commonly held beliefs that define good and bad, tolerable and intolerable, and required and optional behaviors. Ethical\nprinciples are designed to lead to behavior that balances concern for consequences to others with self-interest.\nExplain ethics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAowAAAFgCAIAAAC+P7/lAAAnhElEQVR42u3db2xU973n8Y9t/v+xp1SN1ZKAw91SUQVjVC0oohcGCfogVwl2qkgXEYQt7Q1JS4LpXoUqbtagrKOlD2JoojbkXolBCeJKq2J nmaking, and risk management. These benefits can be delivered to society only if clients and employers trust the advice and direction of\ninvestment managers.\nSkillful and accurate analysis and valuation of assets leads to better investment management and, ultimately, better corporate practices. Knowing\nthat investment analysts and managers are analyzing results gives companies an incentive to strive for better corporate governance and\nperformance, which lead to more efficient allocation of capital to products and projects that deliver more value to society.\n(Choices B and C) Greater trust in the investment profession does lead to greater control of client decision-making since clients tend to follow the\nadvice of those they trust. However, the narrow goal of controlling client decision-making is not the most appropriate reason to build trust.\nSimilarly, the goal of increasing the prestige of the investment profession benefits the profession itself, not its clients or society; therefore, it is not\nthe most appropriate reason to build trust.\nThings to remember:\nInvestment managers deliver value to society by performing skillful valuations and providing sound advice to clients. This value can be delivered\nonly if clients and employers trust the advice and direction of investment managers.\ndescribe the need for high ethical standards in investment management", "qhtml": null, "explfigs": null}, {"n": 14, "q": "According to CFA Institute, which of the following best describes the motivation for codifying an investment firm's belief system?", "opts": ["Ethical behavior improves customer satisfaction.", "A firm's conformity to societal expectations benefits all stakeholders.", "An ethical environment based on altruistic motives attracts more clients."], "ans": "B", "expl": "According to CFA Institute, ethics extends past legal norms and incorporates moral principles and specific rules of conduct. Moral principles are\nsocially defined norms of appropriate and inappropriate conduct. They set expectations that ethical individuals must meet.\nInvestment firms often conform their codified set of moral beliefs to ethical expectations set by society. Conduct is considered ethical if it\nbenefits society and improves conditions for the stakeholders involved. Since the industry and society are both hurt if trust erodes, clients must\nbe able to trust investment professionals and hold them to the highest ethical standards\nUnethical behavior hurts clients directly and tarnishes the industry, and society pays for it with lower use of capital and higher regulatory (ie,\ntaxpayer-funded) oversight costs. The motivating force behind promoting and adopting an ethical program is to avoid this damage. Incidental\nbenefits, such as improving customer satisfaction or attracting more clients, are not the motivation (Choices A and C).\nThings to remember:\nEthics is a belief system identifying good and bad behavior. For investment firms, conduct is considered ethical if it benefits society and improves\nconditions for the stakeholders involved. Unethical behavior hurts clients, the industry, and society. The motivation behind promoting and\nadopting an ethical program is to avoid damage for society and stakeholders.\nExplain ethics", "qhtml": null, "explfigs": null}, {"n": 15, "q": "Which of the following best describes the need for high ethical standards in investment management?", "opts": ["To preserve the trust that supports the industry", "To increase the prestige of working in the industry", "To establish consistency across global laws and regulations"], "ans": "A", "expl": "How a profession maintains trust\nEstablishes norms of practice\nRemains client focused\nMaintains high entry standards\nMonitors professional conduct\nNurtures a body of knowledge\nEncourages lifelong learning\nFunctions as an oversight body or\nregulatory adviser\nProtecting and serving clients is the foundation of the investment management profession, and the relationship between the profession and its\nclients is predicated on trust. Clients trust that investment professionals will carry out their duties with the utmost care, placing clients' interests\nabove their own.\nThe industry:\nearns trust by establishing shared principles by which all members of the profession agree to live and\nmaintains trust by establishing minimum standards of care that ensure a culture of integrity and competency in practice.\nThe investment profession benefits society by creating trust with all market participants.\n(Choice B) By adhering to high ethical standards, the profession builds trust with clients and society. Increasing the prestige of an individual is\nnot a reason high ethical standards are needed.\n(Choice C) Ethical codes are created to define and govern moral conduct. The investment profession follows the CFA Institute Code of Ethics\nand Standards of Professional Conduct, which holds Members and Candidates to a higher standard than what is required by laws and\nregulations. Laws are unsuited to prevent unethical behavior since they are inconsistent across sovereignties, slow to be enacted, and subject to\ncompliance. Ethical behavior extends beyond abiding by laws; it includes adhering to societal expectations of right and wrong.\nThings to remember:\nThe effectiveness of the investment management profession is based on trust. The profession must build trust by requiring its members to agree\nto live and work by shared principles of integrity. Professional trust is maintained by establishing ethical standards of care that ensure integrity and\ncompetency.\ndescribe the need for high ethical standards in investment management", "qhtml": null, "explfigs": null}, {"n": 16, "q": "Of the following choices, \"fallen angels\" most appropriately describes bonds currently rated below investment grade that:", "opts": ["are considered distressed debt.", "investors believe are likely to default.", "were issued with an investment-grade rating."], "ans": "C", "expl": "Credit ratings are based on the probability of an issuer defaulting and the estimated loss to bondholders should default occur. Bonds with credit\nratings below investment grade expose investors to greater credit risk. Since investors must be compensated for the greater likelihood of credit-\nrelated losses, such bonds trade at wider credit spreads over sovereign debt, compared with investment-grade debt. Due to the relatively high\nYTMs the market requires on less-than-investment-grade securities, they are also known as high-yield bonds.\nMany high-yield issuers are newer or smaller corporations that are riskier due to less predictable earnings and less stable cash flow. Other bonds\ncurrently rated less than investment grade may have had an investment-grade rating when issued.\nHowever, due to adverse factors (eg, tough competitive environment, poor management decisions) there was a deterioration in profitability or\nasset values that negatively affected the company's capacity to meet its obligations. This reduction in credit quality results in a credit rating cut\nthat places the issue in the high-yield category. This fall from \"investment grade\" results in such issues being referred to as fallen angels.\n(Choices A and B) Distressed debt represents bonds currently in default, or whose issuer is in bankruptcy or in such poor financial condition that\nthere is a strong possibility of default and/or bankruptcy. A fallen angel's credit quality could deteriorate to this extent, but most fallen angels are\nnot in the distressed debt category.\nThings to remember:\nBonds with below-investment-grade ratings are also referred to as high-yield bonds. Bonds issued with an investment-grade rating but currently\nrated as high-yield bonds are known as fallen angels.\nExplain ethics", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuoAAAGrCAIAAAAZ6SWlAABG00lEQVR42u3dfXBcZ5Xv+2Vik2sPcdRyqDFEHqwWmBscHyxaEEKVJ/akVZALzmCnui stment profession most likely builds and maintains trust by:", "opts": ["advocating for increased legal penalties.", "establishing standards that match those of regulators.", "having its members accurately convey investment traits to clients."], "ans": "C", "expl": "How a profession maintains trust\nEstablishes norms of practice\nRemains client focused\nMaintains high entry standards\nMonitors professional conduct\nNurtures a body of knowledge\nEncourages lifelong learning\nFunctions as an oversight body or\nregulatory adviser\nA profession differs from an occupation in that it requires specialized skills, a commitment to help others, and a common code of ethics. An\noccupation can evolve into a profession if its members have a distinctive conviction toward ethical behavior, which may be embodied in a code of\nethics and standards of practice.\nA profession becomes respected by having its members create and maintain trust with stakeholders. Professions create trust when members'\nconduct reflects the profession's ethical principles. For example, within the investment management profession, Members and Candidates who\ntruthfully explain to clients an investment's characteristics (eg, risks, returns, fees) demonstrate ethical behavior. This way, clients can make\ninformed decisions, and investment professionals can earn clients' trust.\n(Choice A) Advocating for stiffer penalties against wrongdoers does not necessarily indicate that a profession is trustworthy, just that the industry\nis open to a high degree of regulatory oversight. A respected profession must build trust with clients through its own initiatives, not merely by\noperating in a highly regulated industry.\n(Choice B) A professional organization can set standards that differ from those of regulators and still maintain trust by providing a framework to\nresolve those differences, such as a code of ethics.\nThings to remember:\nA respected profession must build trust with clients. Professions create trust const CFG = {"title": "Wiley · Ethics And Trust in the Investment Profession", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Ethical & Professional Standards · 22 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
