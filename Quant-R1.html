<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  .expl-rich{white-space:normal}
  .expl-rich p{margin:.55em 0}
  .expl-rich p:first-child{margin-top:0}
  .expl-rich p:last-child{margin-bottom:0}
  .expl-rich .los{display:block;margin-top:10px;color:var(--muted);font-size:13px}
  .expl-rich .katex{font-size:1.04em}
  .expl-rich .kd{margin:6px 0;overflow-x:auto;overflow-y:hidden}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">

<script>
const DATA = [{"n":1,"q":"An investor buys a share of stock for $200.00 at time t = 0. At time t = 1, the investor buys an\nadditional share for $225.00. At time t = 2 the investor sells both shares for $235.00. During\nboth years, the stock paid a per share dividend of $5.00. What are the approximate time-\nweighted and money-weighted returns respectively?","opts":["10.8%; 9.4%.","7.7%; 7.7%.","9.0%; 15.0%."],"ans":"A","expl":"Lợi nhuận tính theo thời gian = (225 + 5 – 200) / 200 = 15%; (470 + 10 – 450) / 450 = 6,67%; [(1.15)\n1/2\n(1.0667)] – 1 = 10,8%\n2\nLợi nhuận tính theo tiền: 200 + [225 / (1 + return)] = [5 / (1 + return)] + [480 / (1 + return)];\nlợi tức tính theo tiền = khoảng 9,4%\nLưu ý rằng cách dễ nhất để tính lợi nhuận tính theo tiền là thiết lập phương trình\nvà đưa các lựa chọn trả lời vào để tìm tỷ lệ chiết khấu khiến dòng tiền chi bằng\ndòng vào.\nSử dụng máy tính tài chính để tính lợi nhuận tính theo tiền: (Sau đây\ntổ hợp phím giả định rằng các thanh ghi bộ nhớ tài chính đã bị xóa khỏi công việc trước đó.)\n®\nTI Business Analyst II Plus\nNhập CF: 200, +/-, Enter, mũi tên xuống\n0\nNhập CF: 220, +/-, Enter, mũi tên xuống, mũi tên xuống\nNhập CF: 480, Enter, mũi tên xuống, mũi tên xuống,\n2\nTính IRR: IRR, CPT\nKết quả: 9,39\n®\nHP 12C\nNhập CF: 200, CHS, g, CF\n00\nNhập CF: 220, CHS, g, CF\n1j\nNhập CF: 480, g, CF\n2j\nTính IRR: f, IRR\nKết quả: 9,39\n(Mô-đun 1.2, LOS 1.c)","explhtml":"<p><b>Lợi nhuận theo trọng số thời gian.</b>Tính lợi nhuận nắm giữ từng kỳ phụ:</p><div class=\"kd\">$$\\dfrac{225+5-200}{200}=15\\%,\\qquad \\dfrac{470+10-450}{450}=6.67\\%$$</div><p>Liên kết chúng về mặt hình học:</p><div class=\"kd\">$$\\left[(1.15)(1.0667)\\right]^{1/2}-1=10.8\\%$$</div><p><b>Lợi nhuận tính theo tiền.</b>Đây là tỷ lệ chiết khấu (IRR) đặt giá trị hiện tại của dòng tiền ra bằng với dòng tiền vào. Với dòng tiền\\(CF_0=-200,\\ CF_1=-220\\)(mua thêm cổ tức đầu tiên),\\(CF_2=+480\\), IRR xấp xỉ<b>9.39%</b>. Cách tiếp cận dễ dàng nhất là nhập dòng tiền và tính IRR hoặc kiểm tra các lựa chọn trả lời để tìm ra tỷ lệ giữa dòng tiền ra và dòng tiền vào.</p><p><i>TI BA II Plus:</i>CF0 = -200; CF1 = -220; CF2 = 480; IRR, CPT\\(\\Rightarrow 9.39\\).<br><i>HP12C:</i>200 CHS g CF0; 220 CHS g CFj; 480 g CFj; IRR\\(\\Rightarrow 9.39\\).</p><span class=\"los\">(Mô-đun 1.2, LOS 1.c)</span>"},{"n":2,"q":"An investor sold a 30-year bond at a price of $850 after he purchased it at $800 a year ago.\nHe received $50 of interest at the time of the sale. The annualized holding period return is:","opts":["12.5%.","6.25%.","15.0%."],"ans":"A","expl":"Lợi nhuận trong thời gian nắm giữ (HPR) được tính như sau:\nHPR = (P – P + D) / P\ntt-1tt\ntrong đó:\nP = giá mỗi cổ phiếu vào cuối khoảng thời gian t\nt\nD = phân phối tiền mặt nhận được trong khoảng thời gian t.\nt\nỞ đây, HPR = (850 – 800 + 50) / 800 = 0,1250 hoặc 12,50%.\n(Mô-đun 1.3, LOS 1.e)"},{"n":3,"q":"On January 1, Jonathan Wood invests $50,000. At the end of March, his investment is worth\n$51,000. On April 1, Wood deposits $10,000 into his account, and by the end of June, his\naccount is worth $60,000. Wood withdraws $30,000 on July 1 and makes no additional\ndeposits or withdrawals the rest of the year. By the end of the year, his account is worth\n$33,000. The time-weighted return for the year is closest to:","opts":["5.5%.","10.4%.","7.0%."],"ans":"B","expl":"Tháng 1 – Tháng 3 lợi nhuận = 51.000 / 50.000 − 1 = 2,00%\nLợi nhuận tháng 4 – tháng 6 = 60.000 / (51.000 + 10.000) − 1 = –1,64%\nLợi nhuận tháng 7 – tháng 12 = 33.000 / (60.000 − 30.000) − 1 = 10,00%\nLợi nhuận tính theo thời gian = [(1 + 0,02)(1 − 0,0164)(1 + 0,10)] − 1 = 0,1036 hoặc 10,36%\n(Mô-đun 1.2, LOS 1.c)"},{"n":4,"q":"The product of the arithmetic mean and the harmonic mean is the:","opts":["square root of the geometric mean.","geometric mean.","square of the geometric mean."],"ans":"C","expl":"Mối quan hệ toán học giữa các phương tiện số học, hình học và điều hòa như sau\n2\nnhư sau: trung bình số học × trung bình điều hòa = (trung bình hình học).\n(Mô-đun 1.1, LOS 1.b)","explhtml":"<p>Mối quan hệ giữa các phương tiện số học, hình học và điều hòa là:</p><div class=\"kd\">$$\\text{arithmetic mean}\\times\\text{harmonic mean}=(\\text{geometric mean})^2$$</div><span class=\"los\">(Học ​​phần 1.1, LOS 1.b)</span>"},{"n":5,"q":"A stock increased in value last year. Which will be greater, its continuously compounded or\nits holding period return?","opts":["Its continuously compounded return.","Its holding period return.","Neither, they will be equal."],"ans":"B","expl":"Khi một cổ phiếu tăng giá trị, lợi nhuận trong thời gian nắm giữ luôn lớn hơn\nlợi tức gộp liên tục cần thiết để tạo ra lợi tức\ntrong thời gian nắm giữ đó. Ví dụ: nếu một cổ phiếu tăng từ 1 đô la lên 1,10 đô la trong một năm, thì thời gian nắm giữ\nlợi nhuận là 10%. Tỷ lệ gộp liên tục cần thiết để tăng giá trị cổ phiếu lên\n10% là Ln(1,10) = 9,53%.\n(Mô-đun 1.3, LOS 1.d)"},{"n":6,"q":"Time-weighted returns are used by the investment management industry because they:","opts":["take all cash inflows and outflows into account using the internal rate of return.","are not affected by the timing of cash flows.","result in higher returns versus the money-weighted return calculation."],"ans":"B","expl":"Lợi nhuận tính theo thời gian không bị ảnh hưởng bởi thời gian của dòng tiền. Ngược lại, lợi nhuận\ntheo trọng số tiền sẽ cao hơn khi tiền được thêm vào thời kỳ đầu tư thuận lợi\nhoặc sẽ thấp hơn khi tiền được thêm vào trong thời kỳ không thuận lợi. Do đó, kết quả trả về\ntheo trọng số thời gian mang lại thước đo hiệu suất tốt hơn vì chúng không bị ảnh hưởng bởi thời gian\nluồng vào và ra khỏi tài khoản.\n(Mô-đun 1.2, LOS 1.c)"},{"n":7,"q":"Based on the advice of his financial advisor regarding dollar cost averaging, a client invests\n$2,000 each month into a blue-chip stock. The stock price on the date of purchase each\nmonth over a four-month stretch was $12, $14, $11, and $9. Using the harmonic mean, the\naverage cost per share of the stock is closest to:","opts":["$11.20.","$11.50.","$11.75."],"ans":"A","expl":"Công thức tính trung bình điều hòa bằng:\n4\n¯¯¯¯¯¯\nX\n= =11.2113\nH\n1111\n+++\n9\n121411\nLưu ý rằng giá cổ phiếu trung bình số học là $11,50 và vì giá trị trung bình hài hòa sẽ\nluôn nhỏ hơn hơn trung bình số học của bất kỳ tập dữ liệu nào có giá trị không bằng nhau, $11,75\nsẽ không bao giờ có thể xảy ra.\n(Mô-đun 1.1, LOS 1.b)","explhtml":"<p>Giá trị trung bình hài hòa là:</p><div class=\"kd\">$$\\bar{X}_H=\\dfrac{4}{\\frac{1}{9}+\\frac{1}{12}+\\frac{1}{14}+\\frac{1}{11}}=11.2113$$</div><p>Lưu ý rằng giá cổ phiếu trung bình số học là 11,50 USD. Bởi vì giá trị trung bình điều hòa luôn nhỏ hơn giá trị trung bình số học đối với bất kỳ tập dữ liệu nào có giá trị không bằng nhau nên sẽ không bao giờ có thể đạt được mức 11,75 USD.</p><span class=\"los\">(Học ​​phần 1.1, LOS 1.b)</span>"},{"n":8,"q":"The most appropriate measure of the increase in the purchasing power of a portfolio's value\nover a given span of time is a(n):","opts":["holding period return.","real return.","after-tax return."],"ans":"B","expl":"Lợi nhuận thực tế được điều chỉnh theo tác động của lạm phát và được sử dụng để đo lường mức tăng\nsức mua theo thời gian.\n(Mô-đun 1.3, LOS 1.e)"},{"n":9,"q":"Assuming at least some variations in a set of data, the:","opts":["arithmetic mean is greater than geometric mean, which is greater than the harmonic mean.","harmonic mean is greater than the geometric mean, which is greater than the arithmetic mean.","geometric mean is greater than the arithmetic mean, which is greater than the harmonic mean."],"ans":"A","expl":"Miễn là có sự thay đổi trong dữ liệu, thì trung bình số học sẽ lớn hơn trung bình hình học\n, lớn hơn trung bình điều hòa.\n(Module 1.1, LOS 1.b)"},{"n":10,"q":"For a given stated annual rate of return, compared to the effective rate of return with\ndiscrete compounding, the effective rate of return with continuous compounding will be:","opts":["the same.","lower.","higher."],"ans":"C","expl":"Tần suất gộp cao hơn dẫn đến tỷ suất lợi nhuận hiệu quả cao hơn. Do đó, tỷ lệ lợi nhuận\nhiệu quả khi ghép lãi liên tục sẽ lớn hơn bất kỳ\ntỷ suất lợi nhuận hiệu quả nào khi ghép lãi rời rạc.\n(Mô-đun 1.3, LOS 1.d)"},{"n":11,"q":"A stock that pays no dividend is currently priced at €42.00. One year ago the stock was\n€44.23. The continuously compounded rate of return is closest to:","opts":["–5.17%.","–5.04%.","+5.17%."],"ans":"A","expl":"S\n42.00\nln() = ln() = ln(0,9496) = −0,0517 = −5,17%\nS44.23\n0\n(Mô-đun 1.3, LOS 1.d)","explhtml":"<div class=\"kd\">$$\\ln\\!\\left(\\dfrac{S_1}{S_0}\\right)=\\ln\\!\\left(\\dfrac{42.00}{44.23}\\right)=\\ln(0.9496)=-0.0517=-5.17\\%$$</div><span class=\"los\">(Học ​​phần 1.3, LOS 1.d)</span>"},{"n":12,"q":"A bond was purchased exactly one year ago for $910 and was sold today for $1,020. During\nthe year, the bond made two semi-annual coupon payments of $30. What is the holding\nperiod return?","opts":["12.1%.","18.7%.","6.0%."],"ans":"B","expl":"HPY = (1.020 + 30 + 30 – 910) / 910 = 0,1868 hoặc 18,7%.\n(Mô-đun 1.3, LOS 1.e)"},{"n":13,"q":"T-bill yields can be thought of as:","opts":["nominal risk-free rates because they contain an inflation premium.","nominal risk-free rates because they do not contain an inflation premium.","real risk-free rates because they contain an inflation premium."],"ans":"A","expl":"Tín phiếu kho bạc là chứng khoán do chính phủ phát hành và do đó được coi là rủi ro vỡ nợ\nmiễn phí. Chính xác hơn, chúng là lãi suất phi rủi ro danh nghĩa chứ không phải lãi suất phi rủi ro thực tế vì\nchúng chứa phần bù cho lạm phát dự kiến.\n(Mô-đun 1.1, LOS 1.a)"},{"n":14,"q":"An investor buys a stock on March 24 for $63.25. The stock pays quarterly dividends of $0.54\non May 1 and August 1. On September 27, the investor sells the stock for $62.80. The\ninvestor's holding period return is closest to:","opts":["2.5%.","1.0%.","2.0%."],"ans":"B","expl":"62,80+0,54+0,54\n−1=0,01=1%\n. Vì chúng tôi được yêu cầu cung cấp HPR nên ngày bắt đầu\n63,25\nvà ngày kết thúc không liên quan. Nếu được yêu cầu tính toán lợi nhuận theo năm, chúng tôi sẽ\ncần biết khoảng thời gian nắm giữ.\n(Mô-đun 1.1, LOS 1.b)"},{"n":15,"q":"A security portfolio earns a gross return of 7.0% and a net return of 6.5%. The difference of\n0.5% most likely results from:","opts":["fees.","taxes.","inflation."],"ans":"A","expl":"Lợi nhuận ròng của danh mục đầu tư là lợi nhuận gộp trừ đi phí quản lý và hành chính\n. Lợi nhuận được điều chỉnh theo thuế được gọi là lợi nhuận sau thuế. Lợi nhuận được điều chỉnh theo\nlạm phát được gọi là lợi nhuận thực.\n(Mô-đun 1.3, LOS 1.e)"},{"n":16,"q":"An investor buys one share of stock for $100. At the end of year one she buys three more\nshares at $89 per share. At the end of year two she sells all four shares for $98 each. The\nstock paid a dividend of $1.00 per share at the end of year one and year two. What is the\ninvestor's money-weighted rate of return?","opts":["0.06%.","5.29%.","6.35%."],"ans":"C","expl":"T = 0: Mua cổ phiếu đầu tiên = -$100,00\nT = 1: Cổ tức từ cổ phiếu đầu tiên = +$1,00\nMua thêm 3 cổ phiếu = -$267,00\nT = 2: Cổ tức từ 4 cổ phiếu = +4,00\nTiền thu được từ việc bán cổ phiếu = +$392,00\nLợi nhuận tính theo tiền là tỷ lệ giải được phương trình:\n2\n$100,00 = -$266,00 / (1 + r) + 396,00 / (1 + r).\nCFO = -100; CF1 = -266; CF2 = 396; CPT IRR = 6,35%.\n→\n(Mô-đun 1.2, LOS 1.c)","explhtml":"<p>Trình bày các dòng tiền:</p><p>\\(t=0\\): mua cổ phần đầu tiên\\(=-\\$100.00\\).<br>\\(t=1\\): cổ tức từ cổ phiếu đầu tiên\\(+\\$1.00\\), mua thêm 3 cổ phiếu\\(-\\$267.00\\) \\(\\Rightarrow CF_1=-\\$266.00\\).<br>\\(t=2\\): cổ tức trên 4 cổ phiếu\\(+\\$4.00\\), tiền thu được từ việc bán\\(+\\$392.00\\) \\(\\Rightarrow CF_2=+\\$396.00\\).</p><p>Lợi nhuận tính theo tiền là tỷ lệ\\(r\\)giải quyết:</p><div class=\"kd\">$$-100-\\dfrac{266}{(1+r)}+\\dfrac{396}{(1+r)^2}=0$$</div><p>Với\\(CF_0=-100,\\ CF_1=-266,\\ CF_2=396\\): IRR CPT\\(=6.35\\%\\).</p><span class=\"los\">(Mô-đun 1.2, LOS 1.c)</span>"},{"n":17,"q":"Vega research has been conducting investor polls for Third State Bank. They have found the\nmost investors are not willing to tie up their money in a 1-year (2-year) CD unless they\nreceive at least 1.0% (1.5%) more than they would on an ordinary savings account. If the\nsavings account rate is 3%, and the bank wants to raise funds with 2-year CDs, the yield must\nbe at least:","opts":["4.0%, and this represents a required rate of return.","4.5%, and this represents a discount rate.","4.5%, and this represents a required rate of return."],"ans":"C","expl":"Vì chúng tôi đang xem xét số tiền tối thiểu cần thiết để thuyết phục các nhà đầu tư cho ngân hàng vay\ntiền nên đây được mô tả tốt nhất là tỷ suất lợi nhuận bắt buộc. Dựa trên\nthông tin số, tỷ lệ phải là 4,5% (= 3,0 + 1,5).\n(Mô-đun 1.1, LOS 1.a)"},{"n":18,"q":"An investor makes the following investments:\nShe purchases a share of stock for $50.00.\nAfter one year, she purchases an additional share for $75.00.\nAfter one more year, she sells both shares for $100.00 each.\nThere are no transaction costs or taxes.\nDuring year one, the stock paid a $5.00 per share dividend. In year 2, the stock paid a $7.50\nper share dividend. The investor's required return is 35%. Her money-weighted return is\nclosest to:","opts":["16.1%.","-7.5%.","48.9%."],"ans":"C","expl":"Để xác định tỷ suất lợi nhuận tính theo trọng số tiền, hãy sử dụng dòng tiền trong máy tính của bạn và hàm IRR\n. Các dòng tiền như sau:\nCF0: dòng tiền ra ban đầu để mua = $50\nCF1: dòng tiền cổ tức vào là $5 - dòng tiền ra để mua thêm $75 = dòng tiền ra ròng\ncủa -$70\nCF2: dòng tiền cổ tức vào (2 × $7,50 = $15) + dòng tiền vào từ việc bán (2 × $100 = $200) = tiền mặt ròng\ndòng vào $215\nNhập dòng tiền và tính IRR:\nCF0 = -50; CF1 = -70; CF2 = +215; CPT IRR = 48.8607\n(Mô-đun 1.2, LOS 1.c)"},{"n":19,"q":"Given a holding period return of R, the continuously compounded rate of return is:","opts":["R e – 1.","ln(1 + R).","ln(1 + R) – 1."],"ans":"B","expl":"Đây là công thức tính lãi suất gộp liên tục của return.\n(Mô-đun 1.3, LOS 1.d)"},{"n":20,"q":"If an investor bought a stock for $32 and sold it nine months later for $37.50 after receiving\n$2 in dividends, what was the holding period return on this investment?","opts":["32.42%.","17.19%.","23.44%."],"ans":"C","expl":"HPR = [giá trị kết thúc – giá trị bắt đầu] / giá trị bắt đầu\nHPR = [(2 + 37,50) – 32] / 32 = 0,2344.\n(Mô-đun 1.3, LOS 1.e)"},{"n":21,"q":"Which one of the following statements best describes the components of the required\ninterest rate on a security?","opts":["The real risk-free rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security.","The real risk-free rate, the expected inflation rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security.","The nominal risk-free rate, the expected inflation rate, the default risk premium, a liquidity premium and a premium to reflect the risk associated with the maturity of the security."],"ans":"B","expl":"Lãi suất yêu cầu đối với chứng khoán được tạo thành từ lãi suất danh nghĩa, sau đó\nđược tạo thành từ lãi suất phi rủi ro thực cộng với tỷ lệ lạm phát dự kiến. Nó cũng phải chứa\nphần bù về tính thanh khoản cũng như phần bù liên quan đến thời hạn của chứng khoán.\n(Mô-đun 1.1, LOS 1.a)"},{"n":22,"q":"Assume an investor makes the following investments:\nToday, she purchases a share of stock in Redwood Alternatives for $50.00.\nAfter one year, she purchases an additional share for $75.00.\nAfter one more year, she sells both shares for $100.00 each.\nThere are no transaction costs or taxes. The investor's required return is 35.0%.\nDuring year one, the stock paid a $5.00 per share dividend. In year two, the stock paid a\n$7.50 per share dividend.\nThe time-weighted return is:","opts":["51.4%.","23.2%.","51.7%."],"ans":"A","expl":"Để tính lợi nhuận theo trọng số thời gian:\nBước 1: Tách các khoảng thời gian thành các khoảng thời gian nắm giữ và tính lợi nhuận trong khoảng thời gian\nđó:\nThời gian nắm giữ 1: P = $50,00\n0\nD = $5,00\nP = $75,00 (từ thông tin về lần mua cổ phiếu thứ hai)\nHPR = (75 – 50 + 5) / 50 = 0,60 hoặc 60%\nThời gian nắm giữ 2: P = $75,00\nD = $7,50\n2\nP = $100,00\n2\nHPR = (100 – 75 + 7,50) / 75 = 0,433, hoặc 43,3%.\n2\nBước 2: Sử dụng giá trị trung bình hình học để tính lợi nhuận trong cả hai giai đoạn\n1/21/2\nReturn = [(1 + HPR) × (1 + HPR)] – 1 = [(1,60) × (1,433)] – 1 = 0,5142, hoặc\n12\n51,4%.\n(Mô-đun 1.2, LOS 1.c)","explhtml":"<p><b>Bước 1 - lợi nhuận của kỳ phụ.</b></p><p>Thời gian nắm giữ 1:\\(P_0=\\$50.00,\\ D_1=\\$5.00,\\ P_1=\\$75.00\\):</p><div class=\"kd\">$$HPR_1=\\dfrac{75-50+5}{50}=0.60=60\\%$$</div><p>Thời gian nắm giữ 2:\\(P_1=\\$75.00,\\ D_2=\\$7.50,\\ P_2=\\$100.00\\):</p><div class=\"kd\">$$HPR_2=\\dfrac{100-75+7.50}{75}=0.433=43.3\\%$$</div><p><b>Bước 2 - liên kết hình học.</b></p><div class=\"kd\">$$\\left[(1+HPR_1)(1+HPR_2)\\right]^{1/2}-1=\\left[(1.60)(1.433)\\right]^{1/2}-1=0.5142=51.4\\%$$</div><span class=\"los\">(Mô-đun 1.2, LOS 1.c)</span>"},{"n":23,"q":"The continuously compounded rate of return that will generate a one-year holding period\nreturn of -6.5% is closest to:","opts":["-5.7%.","-6.3%.","-6.7%."],"ans":"C","expl":"Tỷ lệ lợi nhuận gộp liên tục = ln(1 – 0,065) = -6,72%.\n(Mô-đun 1.3, LOS 1.d)"},{"n":24,"q":"An investor begins with a $100,000 portfolio. At the end of the first period, it generates\n$5,000 of income, which he does not reinvest. At the end of the second period, he\ncontributes $25,000 to the portfolio. At the end of the third period, the portfolio is valued at\n$123,000. The portfolio's money-weighted return per period is closest to:","opts":["0.94%.","1.20%.","–0.50%."],"ans":"A","expl":"Sử dụng máy tính tài chính, khoản đầu tư ban đầu (CF) là –100.000. Thu nhập là +5.000\n0\n(CF) và khoản đóng góp là –25.000 (CF2). Cuối cùng, giá trị cuối cùng là +123.000 (CF)\n13\ncó sẵn cho nhà đầu tư. Tính IRR = 0,94\n(Mô-đun 1.3, LOS 1.e)","explhtml":"<p>Sử dụng máy tính tài chính, nhập dòng tiền: đầu tư ban đầu\\(CF_0=-100{,}000\\); thu nhập của\\(+5{,}000\\)và sự đóng góp của\\(-25{,}000\\); và giá trị cuối cùng của\\(+123{,}000\\)sẵn có cho nhà đầu tư. Việc tính toán tỷ suất hoàn vốn nội bộ mang lại<b>IRR\\(=0.94\\%\\)</b>.</p><span class=\"los\">(Mô-đun 1.3, LOS 1.e)</span>"},{"n":25,"q":"Over a period of one year, an investor's portfolio has declined in value from 127,350 to\n108,427. What is the continuously compounded rate of return?","opts":["-13.84%.","-14.86%.","-16.09%."],"ans":"C","expl":"Tỷ suất lợi nhuận gộp liên tục = ln(S / S) = ln(108,427 / 127,350) = –\n10\n16,09%.\n(Mô-đun 1.3, LOS 1.d)","explhtml":"<div class=\"kd\">$$\\text{Continuously compounded return}=\\ln\\!\\left(\\dfrac{S_1}{S_0}\\right)=\\ln\\!\\left(\\dfrac{108{,}427}{127{,}350}\\right)=-16.09\\%$$</div><span class=\"los\">(Học ​​phần 1.3, LOS 1.d)</span>"},{"n":26,"q":"An analyst evaluates a dataset with eight values. From the dataset, she calculates the\ngeometric mean to be 8.50. If the arithmetic mean is equal to 8.90, the harmonic mean is\nclosest to:","opts":["9.30.","8.12.","8.63."],"ans":"B","expl":"Mối quan hệ giữa trung bình số học, hài hòa và trung bình hình học bằng:\n2\ntrung bình số học × trung bình điều hòa = (trung bình hình học)\n22\n8,90 × trung bình điều hòa = (trung bình hình học) = (8,50)\n2\n(8,50)\n=8,12\ntrung bình điều hòa =\n8,90\nLưu ý: Điều này cũng có thể là đã trả lời mà không thực hiện các phép tính, biết rằng\nđiều hòa < hình học < số học, trong đó các giá trị không bằng nhau.\n(Mô-đun 1.1, LOS 1.b)","explhtml":"<div class=\"kd\">$$\\text{arithmetic mean}\\times\\text{harmonic mean}=(\\text{geometric mean})^2$$</div><div class=\"kd\">$$8.90\\times\\text{harmonic mean}=(8.50)^2$$</div><div class=\"kd\">$$\\text{harmonic mean}=\\dfrac{(8.50)^2}{8.90}=8.12$$</div><p>Điều này cũng có thể được trả lời mà không cần tính toán, biết rằng điều hòa\\(<\\)hình học\\(<\\)phép tính khi các giá trị không bằng nhau.</p><span class=\"los\">(Học ​​phần 1.1, LOS 1.b)</span>"},{"n":27,"q":"A 10% coupon bond was purchased for $1,000. One year later the bond was sold for $915 to\nyield 11%. The investor's holding period yield on this bond is closest to:","opts":["9.0%.","1.5%.","18.5%."],"ans":"B","expl":"HPY = [(lãi suất + giá trị kết thúc) / giá trị đầu] – 1\n= [(100 + 915) / 1.000] – 1\n= 1,015 – 1 = 1,5%\n(Mô-đun 1.3, LOS 1.e)"},{"n":28,"q":"Selmer Jones has just inherited some money and wants to set some of it aside for a vacation\nin Hawaii one year from today. His bank will pay him 5% interest on any funds he deposits.\nIn order to determine how much of the money must be set aside and held for the trip, he\nshould use the 5% as a:","opts":["discount rate.","opportunity cost.","required rate of return."],"ans":"A","expl":"Anh ấy cần tính toán chi phí của chuyến đi trong một năm và sử dụng 5% làm tỷ lệ chiết khấu để chuyển đổi chi phí tương lai thành giá trị hiện tại. Do đó, trong bối cảnh này, tỷ giá\nđược xem tốt nhất là tỷ lệ chiết khấu.\n(Mô-đun 1.1, LOS 1.a)"},{"n":29,"q":"The real risk-free rate can be thought of as:","opts":["approximately the nominal risk-free rate plus the expected inflation rate.","approximately the nominal risk-free rate reduced by the expected inflation rate.","exactly the nominal risk-free rate reduced by the expected inflation rate."],"ans":"B","expl":"Mối quan hệ gần đúng giữa lãi suất danh nghĩa, lãi suất thực và lạm phát dự kiến\ntỷ lệ có thể được viết là:\nLãi suất phi rủi ro danh nghĩa = lãi suất phi rủi ro thực + lãi suất dự kiến tỷ lệ lạm phát.\nDo đó, chúng ta có thể viết lại phương trình này theo tỷ lệ phi rủi ro thực như sau:\nLãi suất phi rủi ro thực = Tỷ lệ phi rủi ro danh nghĩa – tỷ lệ lạm phát dự kiến\nMối quan hệ chính xác là: (1 + thực)(1 + lạm phát dự kiến) = (1 + danh nghĩa)\n(Mô-đun 1.1, LOS 1.a)"},{"n":30,"q":"Stock XYZ is purchased on January 2 at a price of $12 per share. The investor receives a\nquarterly dividend of $0.60 per share on April 1, and the stock closes on June 30 at $13 per\nshare. The holding period return is closest to:","opts":["13.33%.","8.33%.","18.33%."],"ans":"A","expl":"Lợi nhuận của thời gian nắm giữ bằng với sự thay đổi về giá trị từ đầu đến cuối\nthời gian nắm giữ, sẽ không chỉ bao gồm thay đổi về giá mà còn bất kỳ cổ tức nào\nnhận được trong khoảng thời gian này. Đối với mỗi cổ phiếu, giá tăng thêm 1 đô la và cổ tức\nnhận được là 0,60 đô la. Phép tính bằng:\n− +\nPPDiv13 − 12 + 0,60\ntt\n0\n==13,33%\nP12\n0\nBỏ qua cổ tức sẽ tạo ra cổ tức Lợi nhuận 8,33% và việc tăng gấp đôi cổ tức tạo ra lợi nhuận\n18,33%. Điều quan trọng cần lưu ý là chỉ nhận được một khoản cổ tức trong khoảng thời gian 6 tháng\nvà đó là vào ngày 1 tháng 4.\n(Mô-đun 1.1, LOS 1.b)","explhtml":"<p>Lợi nhuận trong thời gian nắm giữ phản ánh sự thay đổi về giá cộng với bất kỳ cổ tức nào nhận được. Đối với mỗi cổ phiếu, giá tăng 1 đô la và cổ tức là 0,60 đô la:</p><div class=\"kd\">$$\\dfrac{P_t-P_0+\\text{Div}}{P_0}=\\dfrac{13-12+0.60}{12}=13.33\\%$$</div><p>Bỏ qua cổ tức tạo ra lợi nhuận 8,33% và tăng gấp đôi cổ tức tạo ra 18,33%. Lưu ý rằng chỉ nhận được một khoản cổ tức trong thời gian sáu tháng (vào ngày 1 tháng 4).</p><span class=\"los\">(Học ​​phần 1.1, LOS 1.b)</span>"},{"n":31,"q":"Computing the internal rate of return of the inflows and outflows of a portfolio would give\nthe:","opts":["money-weighted return.","net present value.","time-weighted return."],"ans":"A","expl":"lợi nhuận tính theo tiền là tỷ suất lợi nhuận nội bộ của danh mục đầu tư cân bằng\ngiá trị hiện tại của dòng tiền vào và dòng tiền ra trong một khoảng thời gian.\n(Mô-đun 1.2, LOS 1.c)"},{"n":32,"q":"An investor buys a non-dividend paying stock for $100 at the beginning of the year with 50%\ninitial margin. At the end of the year, the stock price is $95. Deflation of 2% occurred during\nthe year. Which of the following return measures for this investment will be greatest?","opts":["Real return.","Nominal return.","Leveraged return."],"ans":"A","expl":"Không cần tính toán. Lợi nhuận thực tế lớn hơn lợi nhuận danh nghĩa vì\ntỷ lệ lạm phát âm. Lợi nhuận đòn bẩy âm hơn lợi nhuận danh nghĩa\nvì khoản đầu tư bị mất giá trị và đòn bẩy làm tăng mức lỗ.\n(Mô-đun 1.3, LOS 1.e)"},{"n":33,"q":"A dataset contains six values, none of which are equal. The arithmetic mean of the data is\n13.25, and the geometric mean of the data is 12.75. The harmonic mean will be:","opts":["greater than 13.25.","less than 12.75.","between 12.75 and 13.25."],"ans":"B","expl":"Đối với bất kỳ tập dữ liệu nào có các giá trị không bằng nhau, trung bình điều hòa sẽ nhỏ hơn trung bình hình học\n(do đó, sẽ nhỏ hơn trung bình số học). Ở đây,\ntrung bình số học là 13,25 và trung bình hình học là 12,75—vì vậy, trung bình điều hòa phải\nnhỏ hơn 12,75. Điều đáng lưu ý là cả ba phương tiện đều bằng nhau nếu mọi giá trị trong tập dữ liệu\nđều giống nhau.\n(Mô-đun 1.1, LOS 1.b)"},{"n":34,"q":"An investor expects a stock currently selling for $20 per share to increase to $25 by year-\nend. The dividend last year was $1 but he expects this year's dividend to be $1.25. What is\nthe expected holding period return on this stock?","opts":["24.00%.","28.50%.","31.25%."],"ans":"C","expl":"Trả về = [cổ tức + (giá trị cuối – giá trị đầu)] / giá trị đầu\n= [1,25 + (25 – 20)] / 20 = 6,25 / 20 = 0,3125\n(Mô-đun 1.3, LOS 1.e)"},{"n":35,"q":"An investor with a buy-and-hold strategy who makes quarterly deposits into an account\nshould most appropriately evaluate portfolio performance using the portfolio's:","opts":["arithmetic mean return.","geometric mean return.","money-weighted return."],"ans":"B","expl":"Lợi nhuận trung bình hình học (lợi nhuận theo thời gian) là phương pháp thích hợp nhất để\nđo lường hiệu suất vì phương pháp này không xem xét việc bổ sung hoặc rút khỏi tài khoản\n.\n(Mô-đun 1.3, LOS 1.e)"},{"n":36,"q":"Which of the following is most accurate with respect to the relationship of the money-\nweighted return to the time-weighted return? If funds are contributed to a portfolio just\nprior to a period of favorable performance, the:","opts":["money-weighted rate of return will tend to be depressed.","money-weighted rate of return will tend to be elevated.","time-weighted rate of return will tend to be elevated."],"ans":"B","expl":"Lợi nhuận tính theo thời gian là như hiện tại và sẽ không bị ảnh hưởng bởi dòng tiền vào hoặc\ndòng tiền ra. Lợi nhuận tính theo tiền dễ bị biến dạng do dòng tiền vào và dòng tiền ra\n. Lợi nhuận tính theo tiền sẽ có xu hướng tăng lên nếu số tiền\nđược đầu tư ngay trước giai đoạn hoạt động thuận lợi và sẽ bị lệch xuống nếu\nquỹ được đầu tư ngay trước giai đoạn hoạt động tương đối không thuận lợi.\nđiều ngược lại sẽ đúng với dòng tiền ra.\n(Mô-đun 1.2, LOS 1.c)"},{"n":37,"q":"Over the last four years, an investor's portfolio has the following returns: 5.26%, –2.10%,\n3.86%, and 8.18%. The arithmetic mean return is closest to:","opts":["3.76%.","3.73%.","3.80%."],"ans":"C","expl":"Trung bình số học bằng trung bình của bốn điểm dữ liệu, được tính bằng\ntổng tất cả bốn kết quả trả về và chia cho số kết quả trả về:\n(+++)\nRRRR(0,0526 − 0,0210 + 0,0386 + 0,0818)\n1234\n== 0,0380 hoặc 3,80%\n44\n(Mô-đun 1.1, LOS 1.b)","explhtml":"<p>Giá trị trung bình số học là tổng của bốn kết quả trả về chia cho số kết quả trả về:</p><div class=\"kd\">$$\\dfrac{R_1+R_2+R_3+R_4}{4}=\\dfrac{0.0526-0.0210+0.0386+0.0818}{4}=0.0380=3.80\\%$$</div><span class=\"los\">(Học ​​phần 1.1, LOS 1.b)</span>"},{"n":38,"q":"Wei Zhang has funds on deposit with Iron Range bank. The funds are currently earning 6%\ninterest. If he withdraws $15,000 to purchase an automobile, the 6% interest rate can be\nbest thought of as a(n):","opts":["discount rate.","financing cost.","opportunity cost."],"ans":"C","expl":"Vì Wei sẽ bỏ lãi trên số tiền đã rút nên lãi suất 6% có thể được coi là tốt nhất\nlà chi phí cơ hội — số tiền lãi mà anh ta có thể kiếm được bằng cách hoãn tự động\nmua hàng cho đến tương lai.\n(Mô-đun 1.1, LOS 1.a)"},{"n":39,"q":"A stock is currently worth $75. If the stock was purchased one year ago for $60, and the\nstock paid a $1.50 dividend during the year, what is the holding period return?","opts":["24.0%.","27.5%.","22.0%."],"ans":"B","expl":"HPR = [giá trị cuối – giá trị đầu] / giá trị đầu\n= (75 + 1,50 – 60) / 60 = 27,5%.\n(Mô-đun 1.3, LOS 1.e)"},{"n":40,"q":"Which of the following return measures is best described as purely representing time\npreference?","opts":["Nominal risk-free interest rate.","Real risk-free interest rate.","Total rate of return."],"ans":"B","expl":"Lãi suất phi rủi ro thực thể hiện ưu tiên về thời gian hoặc mức độ\n thích mức tiêu dùng ở hiện tại hơn mức tiêu thụ tương đương trong\ntương lai. Các thước đo lợi nhuận khác bao gồm ưu tiên về thời gian, nhưng nó cũng phản ánh các yếu tố khác,\nchẳng hạn như rủi ro hoặc lạm phát dự kiến.\n(Mô-đun 1.1, LOS 1.a)"},{"n":41,"q":"An asset manager's portfolio had the following annual rates of return:\nYearReturn\n20X7+6%\n20X8-37%\n20X9+27%\nThe manager states that the return for the period is −5.34%. The manager has reported the:","opts":["arithmetic mean return.","geometric mean return.","holding period return."],"ans":"B","expl":"√(1+0.06)(1−0.37)(1+0.27)\n3\nTrả về trung bình hình học = – 1 = –5,34%\nThu nhập thời gian nắm giữ = (1 + 0,06)(1 − 0,37)(1 + 0,27) − 1 = −15,2%\nThu nhập trung bình số học = (6% − 37% + 27%) / 3 = −1,33%.\n(Mô-đun 1.3, LOS 1.e)","qhtml":"<p>An asset manager's portfolio had the following annual rates of return:</p><table class=\"qtable\"><thead><tr><th>Year</th><th>Return</th></tr></thead><tbody><tr><td>20X7+</td><td>6%</td></tr><tr><td>20X8</td><td>-37%</td></tr><tr><td>20X9+</td><td>27%</td></tr></tbody></table><p>The manager states that the return for the period is −5.34%. The manager has reported the:</p>","explhtml":"<div class=\"kd\">$$\\text{Geometric mean return}=\\sqrt[3]{(1+0.06)(1-0.37)(1+0.27)}-1=-5.34\\%$$</div><div class=\"kd\">$$\\text{Holding period return}=(1.06)(0.63)(1.27)-1=-15.2\\%$$</div><div class=\"kd\">$$\\text{Arithmetic mean return}=\\dfrac{6\\%-37\\%+27\\%}{3}=-1.33\\%$$</div><span class=\"los\">(Mô-đun 1.3, LOS 1.e)</span>"},{"n":42,"q":"An investor buys one share of stock for $100. At the end of year one she buys three more\nshares at $89 per share. At the end of year two she sells all four shares for $98 each. The\nstock paid a dividend of $1.00 per share at the end of year one and year two. What is the\ninvestor's time-weighted rate of return?","opts":["0.06%.","11.24%.","6.35%."],"ans":"A","expl":"Lợi tức nắm giữ trong năm thứ nhất là ($89,00 – $100,00 + $1,00) / $100,00 = -10,00%.\nLợi tức nắm giữ trong năm thứ hai là ($98,00 – $89,00 + $1,00) / $89 = 11,24%.\n1/2\nLợi nhuận tính theo thời gian là [{1 + (-0,1000)}{1 + 0,1124}] – 1 = 0,06%.\n(Mô-đun 1.2, LOS 1.c)"},{"n":43,"q":"If a stock decreases from $90 to $80, the continuously compounded rate of return for the\nperiod is:","opts":["-0.1000.","-0.1250.","-0.1178."],"ans":"C","expl":"Điều này được tính bằng logarit tự nhiên của giá mới chia cho giá cũ; ln(80 / 90) =\n-0.1178.\n(Mô-đun 1.3, LOS 1.d)"}];
const CFG = {"title": "Rates and Returns", "subtitle": "CFA · Quantitative Methods · Reading 1 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl || q.explhtml){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts,q.explhtml));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options,richHtml){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  if(richHtml){
    const choice=document.createElement("article"); choice.className="expl-choice is-correct";
    const top=document.createElement("div"); top.className="expl-choice-top";
    const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=correctLetter;
    const state=document.createElement("span"); state.className="expl-state"; state.textContent="Đáp án đúng";
    top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
    const optionIndex=LETTERS.indexOf(correctLetter);
    if(options&&optionIndex>=0&&options[optionIndex]){ const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option); }
    const reason=document.createElement("div"); reason.className="expl-reason expl-rich"; reason.innerHTML=richHtml; choice.appendChild(reason); content.appendChild(choice);
  }else explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(!richHtml&&(data.reading||data.los)){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

</div>
<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
