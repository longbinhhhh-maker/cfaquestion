<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "Trading bloc members would most likely use a common currency in a:", "opts": ["free trade area.", "economic union.", "common market."], "ans": "B", "expl": "Trading blocs are formal agreements that reduce or eliminate barriers to trade. An economic union is a type of trading bloc characterized by\nthe greatest amount of economic integration and cooperation among its members. In addition to features of a common market, economic unions\nshare common economic institutions (eg, one central bank for all members) and policies.\nEconomic unions may also elect to adopt a common currency (eg, members of the European Union use the euro as their currency). An\neconomic union that adopts a common currency is known as a monetary union.\n(Choice A) A free trade area is a common trading bloc that eliminates barriers such as tariffs on goods and services between members.\nHowever, it lacks both coordinated trade policies against nonmembers and free movement of labor and capital between members.\n(Choice C) A common market shares many characteristics of an economic union, but it does not have common economic institutions or policies.\nNor does it adopt a common currency.\nThings to remember:\nAn economic union is a trading bloc that displays a large degree of economic integration among its members. It is the only type of trading bloc\ncharacterized by common economic institutions and policies. It is also the only trading bloc that might adopt a common currency for its members.\nIf that occurs, the economic union is known as a monetary union.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAHVCAIAAAB35bk1AAEAAElEQVR42uydZ4AVVdKGn5sn58AMQ85Jcs6oREHEBJjzmtd1zTmgn2sOGFBAVEABMYEYyElEcs5xIpPzzff7UTO91yEsKrgu1PNjd2z6dp8+ffp016m3qkyBQABFURRFURRFUZT/NczaBYqiKIqiKIqiqDGjKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiqDGjKIqiKIqiKIqixoyiKIqiKIqiK ment of the factors of production (ie, capital and labor) or common\nexternal trade policies.\nCustoms unions allow tariff-free trade in goods and services among members and require that member countries have common trade policies\n(eg, tariffs) with all nonmember countries. However, customs unions do not allow free movement of people or capital among member\ncountries.\n(Choice B) Free trade areas (FTAs) allow tariff-free trade in goods and services among member countries. However, FTAs neither require\ncommon trade policies with nonmember countries nor allow free movement of people or capital among member countries.\n(Choice C) Common markets allow tariff-free trade in goods and services and free movement of people and capital among member countries.\nMembers also have common trade policies with all nonmember countries.\nThings to remember:\nTypes of trading blocs include free trade areas, customs unions, and common markets. Customs unions allow tariff-free trade in goods and\nservices among members and require that member countries have common trade policies with all nonmember countries. However, customs\nunions do not allow free movement of people or capital among member countries.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAHVCAIAAAB35bk1AAEAAElEQVR42uydZ4AVVdKGn5sn58AMQ85Jcs6oREHEBJjzmtd1zTmgn2sOGFBAVEABMYEYyElEcs5xIpPzzff7UTO91yEsKrgu1PNjd2z6dp8+ffp016m3qkyBQABFURRFURRFUZT/NczaBYqiKIqiKIqiqDGjKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiqDGjKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiqDGjKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqixoyiKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqiqDGjKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqiqDGjKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqiqDGjKIqiKIqiKIoaM4qiKIqiKIqiKGrMKIqiKIqiKIqiqDGjKIqiKIqiKIoShFW7QFEU5Y+zZMmStWvX shrink trade deficits or increase trade surpluses.\nVoluntary export restraints are negotiated with countries currently running large surpluses. Foreign governments agreeing to constrain their\nexports will reduce domestic imports. Effective voluntary export restraint agreements reduce trade deficits.\n(Choice A) Reducing tariffs on raw materials and manufactured goods tends to make those foreign-sourced items less expensive. Tariff cuts\nincrease imports, which leads to higher trade deficits.\n(Choice B) Import quotas normally reduce trade deficits. Limiting foreign producers to a 20% market share in a market where foreign sales\naccount for only 5% of sales is an ineffective way to reduce the trade deficit.\nThings to remember:\nImposing quotas, raising tariffs, or negotiating voluntary export restraints tends to restrict foreign sales in the domestic market. All else constant,\nreduced imports shrink trade deficits (or increase trade surpluses).\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3YAAAFqCAIAAADZRF8TAAEAAElEQVR42ux9d7yP5f//673P+2x7ZRRFNilFWSEVKkIqKyNNo9CyiyZKmqIhUlKKKKs0lDJKSqhERtbhjPcevz+enefv6n6fo9Pnq6zX8w+P97nd93Vf9zVf1/O1bPF4XBQKhUKhUCgUimMHuzaBQqFQKBQKhUJFTIVCoVAoFAqFipgKhUKhUCgUChUxFQqFQqFQKBQKFTEVCoVCoVAoFCpiKhQKhUKhUChUxFQoFAqFQqFQKFTEVCgUCoVCoVCoiKlQKBQKhUKhUBFToVAoFAqFQqFQEVOhUCgUCoVCoSKmQqFQKBQKhUJFTIVCoVAoFAqFipgKhUKhUCgUCoWKmAqFQqFQKBQKFTEVCoVCoVAoFCpiKhQKhUKhUCgUKmIqFAqFQqFQKFTEVCgUCoVCoVCoiKlQKBQKhUKhUKiIqVAoFAqFQqFQEVOhUCgUCoVCoSKmQqFQKBQKhUKhIqZCoVAoFAqFQkVMhULxHyMej8fjcf4ZzQf/l/8VCoVCoVBhD5owSxCRWCwWi8VEJBwOh8PhxApEIpFIJMIyzXvMt8TyUdi3hMNhSyULfJ1ZbbwXdeZFv9/v9/v5UvPmSCTCK6x2YgmF1RNv53+ZVbWUwCuWt7ANLdf/Fmbhlg6yNAXrCUQikQI7TqFQKFTEVCgUCoVCoVAce9gKIxsUCsVpDhBpbrc7GAyKiMPhEBGn0wmWy+FwBAIBEUlKSpKCSK9YLOZ0OlGOx+MREZvtzwUHXB0KlAS6kb9dLpf8lV+02+0mwWnegzLj8XiBxZpAtVEl1MqsdjQaRbVZTigUQuFJSUmoBv6NRCJ  0.90 0.60 C Country Open economy 1.10 0.40 Z Country Z is an open economy, trading at world prices, and does not currently trade with any of the other three countries. Assuming equal consumption of both commodities, which country will benefit the most from a trading relationship with Country Z?", "opts": ["Country A", "Country B", "Country C"], "ans": "A", "expl": "An autarky is a country that produces all goods and services consumed internally and does not trade with others. An autarkic economy is\nconsidered a closed economy. Domestic prices within a country are a function of its ability to produce those goods with only domestic resources\nand are known as the autarkic prices.\nCountries that do not place restrictions on imports and exports are known as open economies. Open economies are said to practice free trade as\nthey import and export at the world's price for goods and services (eg, Country Z).\nThe further away the world price is relative to a country's autarkic price, the greater the potential trade benefit for the autarky. A country's\nterms of trade benefit the most if world export prices are greater than its autarkic price and world import prices are less than its autarkic price since\nthe country can achieve greater purchasing power.\nIn this scenario, all the autarkies produce coffee below world price and sugar above world price. Thus, if all three traded with other countries, each\nwould export coffee and import sugar. The net terms-of-trade improvement would be greatest for Country A since it would sell (ie, export) coffee at\nthe world price of $1.10 and buy (ie, import) sugar at the world price of $0.40, netting a $0.50 improvement.\n(Choices B and C) The net terms-of-trade improvement for Country B is $0.15. For Country C, it is $0.40.\nThings to remember:\nThe further away the world price is relative to a country's autarkic price, the greater the potential trade benefit. A country's terms of trade benefit\nthe most if world export prices are g cUxRcRERERURNfRERERETUxBcRERERETXxRURERERETXwRERERETXxRURERERETXwREREREVETX0RERERE1MQXEREREZEs/f+P3r4is8r/hAAAAABJRU5ErkJggg=="]}, {"n": 6, "q": "A country recently imposed a tariff on apples of €300 per metric ton. The pre-tariff price for apples was €2,000 per metric ton. The table below shows the quantity demanded and the quantity supplied by domestic producers, along with the pre- and post-tariff prices of apples: Pre-Tariff Post-Tariff Quantity demanded (metric tons) 200 150 Quantity supplied (domestic producers) 110 130 Price per metric ton €2,000 €2,300 The image below shows the market for apples in this country: The area labeled A in the image represents an increase in:", "opts": ["producer surplus.", "consumer surplus.", "government revenue."], "ans": "A", "expl": "A tariff is one type of trade restraint. It is a tax on imported goods that is usually paid by domestic consumers in the form of higher prices.\nAlthough tariffs are intended to protect domestic producers, they often lead to inefficiencies in an economy's production and consumption\nfunctions.\nArea A in the diagram above represents an increase in the producer surplus. This surplus is the sum of two components:\nThe higher revenue for the pre-tariff quantity sold: Before the tariff, domestic producers sold 110 metric tons of apples for €2,000 per metric\nton. They now sell those 110 metric tons for €2,300 per metric ton.\nThe revenue generated from the additional quantity produced: After the tariff, domestic producers increased their output from 110 to 130\nmetric tons.\n(Choice B) The tariff results in an increase in producer surplus but it also causes a decrease, not an increase, in consumer surplus. The\ndecrease consists of the sum of areas A, B, C, and D in the diagram.\n(Choice C) The government revenue from the tariff is the amount shown in area C in the diagram. It represents the amount of imports (ie, the\ndifference between the quantity demanded by domestic consumers and the quantity supplied by domestic producers) multiplied by the tariff.\nThings to remember:\nA tariff is a tax on imports. All else equal, it results in the price of the good increasing by the amount of the tariff, which is paid by domestic\nconsumers. Although tariffs are often imposed to protect domestic suppliers, they can cause inefficiencies for both consumers and producers.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAv4AAAG7CAIAAAA0egasAAA/oUlEQVR42u3dXWxc95nn+R9jy1LkjlmS1X5ZRFQRkS0hia1i+i29tpdVo0kwsL1L0sAsJvIFWY29GBk9oAoYNGzMRZF7Y01uSAKB3RfbzeKFncUCK5IDy9iZrJsl2N5OTydm0Up7ZVsBy1Iwih3FKjotWRZlay5+5j9H9SaK4ktV8fu5EMijU6dOnSJ5nnqe////tF27dk0AAACbw1e4BAAAgNAHAACA0AcAAIDQBwAAgNAHAACA0AcAAIDQBwAAgNAHAACA0AcAAIDQBwAAgNAHAACA0AcAABD6AAAAEPoAAAAQ+gAAABD6AAAAEPrcwNDQUFs1nZ2duVwul8vVeWwqlUqlUkNDQ7ypAACArA8AAIBub7QTSiaTkmZmZqIb8/l8KpWSFI/HvUOlkZERSbFYbN1Ota2t7dq1a/wMAQBA6LP68ZAjnnw+7y9c2EokEmNjY5J6enoc9MTj8Xg8Hh44NTU1MTEhqVQq9fT0SDpy5Ij/q1QqDQ8PSyoUCn7g4OCgj8mPBQAAouAFAAAgsj7ro1gsSurv7/e3TtgkEgnXuUqlktM/3d3dTguNjo56t1AIS6fT3tMZo1Qq5fxQNpuVVCgUXFObmZkh8QMAAKHPuoY4ZRO1Tpw44XpWb29vdHs2mw1Dfxz6BP42m80ODAx4SxgGNDU15RhocnJSkZra3NycHzg+Ps5PBgAAouAFAAAgsj5rrb+/3/mesglcdeZzOXsULV2F/JBTSsVisa2tTTWmmAEAAJH1AQAAEFmfVeShx6u1KHOpVCr7OmxJJBKzs7P8BAAAQOjTClwgm5iYCCOjPedrYmLCo5uHh4fz+bwiFS7P8Orp6Qlr/wAAAFHwAgAAEFmfhuIJ6qlUqrOzU1IsFvPA57Bsz/j4uNM8zvoUi0UPmg6T4QEAQOtprC5UxWLRY3FuuKiga1WJRCJM8nI/ilgsFm1kEbaXSqXKqVt+rvDAm13JkB5eAACIghcAAIDI+rTgtSPrAwCAyPoAAAAQ+gAAABD6AAAAEPoAAAAQ+gAAABD6AAAAEPoAAACoJRpZeAlmRdZ9dp+KsbGxsDqzpP7+fv9vMpkM6z4DAACxpGGzcIjT19cnaXZ2NkRCbsg1MDDQ09MTdpubmxscHPT+YWeWNAQAQBS8AAAARNan0Tjf49RO6LLe2dnp7M6RI0eqPiqdTh84cKDODmR9AAAg9FEDVru6urokXbhwwVumpqYc2YQtqjE2yDHT/Pw8oQ8AAKLgBQAAIGZ4NZRcLpdMJhVJAmUyGX/tYc6B53NNTk5qaSJYqVSSlM/no0cAAACEPo3rxIkT3d3d0fgmHo87Bopul+TtUZ4GT+gDAIAoeAEAAIisT+PzVK9MJlOWy6nM+gAAAJD1AQAAIuvToGKx2MLCQvRbL+0zPDy bile phone prices before and after the tariff's imposition: Before Tariff After Tariff Domestic quantity demanded (thousands) 8,200 7,000 Quantity supplied (domestic suppliers) (thousands) 4,000 6,500 Price (per phone) €200 €250 The total deadweight loss (in €) from the imposition of the tariff is closest to:", "opts": ["25.0 million", "62.5 million", "92.5 million"], "ans": "C", "expl": "A tariff is one type of trade restraint. It is a tax on imported goods that is usually paid as a higher price for the goods and usually results in a\nloss to the net welfare of the economy. Tariffs cause inefficiencies in both the supply and production functions of the economy; these losses are\nknown as deadweight losses. In the diagram above, the supply deadweight loss is Region B and the demand deadweight loss is Region D.\nBefore the tariff, all suppliers had per-unit production costs of €200 or less. The tariff caused the price to increase to €250 so domestic suppliers\nwhose production costs were greater than €200 could now compete. However, domestic supply increased (from 4 million to 6.5 million) while\ndomestic demand decreased (from 8.2 million to 7 million), therefore the additional domestic supply represented a reallocation of resources to\nphones when those resources could have been better employed elsewhere in the economy, creating an inefficiency.\nThe demand deadweight loss is evidenced from the reduced domestic demand after the tariff. Consumers who might have spent more than €200\nfor a phone but would not spend €250 were excluded from the market.\nThe deadweight loss is the sum of the areas of the triangles B and D:\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications\nC i ht©UW ld C i htCFAI tit t All i ht d\n8. A country initiating a free trade agreement with its major trading partners is least likely to experience:\nA. a wider variety of goods available to consumers.\n\nB. increased employment in industries facing import competition.\nC. higher wages in industries that expand due to increased exports.\nExplanation\nMost economists believe greater overall welfare is attained when countries engage in international trade rather than by attempting self-sufficiency\nin meeting domestic demand (ie, autarky). The gains from international trade derive from each country concentrating on the production of\ngoods it produces relatively more efficiently and trading for goods it produces relatively less efficiently. Gains result from specialization and\neconomies of scale.\nThe gains from trade are not shared equally; there are winners and losers. On one hand, industries expanding to meet export opportunities will\nbenefit from higher prices, due to increased foreign demand, and their employees will benefit from greater job opportunities and higher wages\n(Choice C). On the other hand, the industries' domestic customers must pay higher prices. In addition, industries facing import competition will\nsuffer domestic market share decline. As such industries contract, they will employ fewer workers.\n(Choice A) Increased trade results in greater consumer choice. This is due both to imported goods competing with domestic suppliers and the\nintroduction of previously unavailable products.\nThings to remember:\nThe gains from international trade result from greater efficiency due to specialization and economies of scale. These gains are not shared equally,\nhowever. Industries facing import competition will suffer domestic market share decline. As these industries contract, the number of their\nemployees will decline.\nDescribe the benefits and costs of international trade", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAo8AAAJBCAIAAACoEMjoAABgdElEQVR42u29XWxc55nn+dcXJVq2VZTbdjuxraJteSeDSVT0djbZjhuscvd40CPPspjMXHWwZA02QJILk8RcJJm5IAnsIMnNFOmLJECww2LgHuzuoMMiYGXR3m6zuGMPbKRhljoNZ9eyhyXbacfuWDpyLMv65F78W28fnSKL32SR9ftdCKXDU+e85z1vnec8//d5n2fPwsKCAAAAo ers.\n(Choice A) Increased trade results in greater consumer choice. This is due both to imported goods competing with domestic suppliers and the\nintroduction of previously unavailable products.\nThings to remember:\nThe gains from international trade result from greater efficiency due to specialization and economies of scale. These gains are not shared equally,\nhowever. Industries facing import competition will suffer domestic market share decline. As these industries contract, the number of their\nemployees will decline.\nDescribe the benefits and costs of international trade", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCgAAAGSCAIAAACuY2cfAAB6tElEQVR42u29T2xjV57f+5O73G5PZyCWs4jzAJeussxgLGr5JjFELjPpQOQuDQ8gajV+PQuKm3gyG4obd5wNycV0OitRQBc6O1GI07MUBWfmLcVykJdZBBFl4AUvm+gKaRs9bpf1Ft/Ub06dy3tFSZRKUn0+iwLr6t5zz/mdP/ec8/ud32/h/PzcAAAAAAAAbpI3EAEAAAAAALDwAAAAAAAAFh4AAAAAAAAsPAAAAAAAgIUHAAAAAACw8AAAAAAAAGDhAQAAAAAALDwAAAAAAABYeAAAAAAAAAsPAAAAAABg4QEAAAAAAMDCAwAAAAAAWHgAAAAAAAALDwAAAAAAABYeAAAAAADAwgMAAAAAAICFBwAAAAAAsPAAAAAAAAAWHgAAAAAAACw8AAAAAACAhQcAAAAAALDwAAAAAAAAYOEBAAAAAAAsPAAAAAAAAFh4AAAAAAAACw8AAAAAAGDhAQAAAAAAwMIDAAAAAABYeAAAAAAAAAsPAAAAAAAAFh4AAAAAAMDCAwAAAAAA4H/zCBEAPCQGg4GZTSYT/Xd7e/s1F0iapmZWKpXuVK6Gw+Hu7m6YvfX1dTNrNBpT7x+NRqPRSL91T5IkcxTRXZPPDZVrMBh417hHvSPM9mXzfBfa/3XyDwAPjIXz83OkAPBgqFarmqfqv69tBx+NRpubm2a2s7NjZpVK5e4sOcysXq9H17e2tsys2+1OfWp7e7vT6ej3wcHBXEo0mUwkorW1tQczHdQ8W7Iaj8eSVdg7vGvco94RZnvGPKdp6kLwNnOP8g8AhqkVAAAAAACAYWoFANDr9cys1Wrdzez1+/3wv1JxlMvlYmOYJElcxXF9sxntgq+uruq/a2trD6b2l5eX7YXeI6sUKpfLr0kvWF5ezhMCAICh8QAAAAAAAEPjAQBg98fK/76gox0X0mg08s6dP3gRzbFoeUdo6AUAACw8AGBuyPRINjZmtre3pyvyguW+krrdru7pdDo6D1oqlfSndrsd2vkMBgP5ZfL5nI5N9/t9TXpqtZquh/6X9Ce9ejgc+vRINjAbGxtTJ+J+UnY4HMo9TqlUqtVqnit/RavVUjaigpdKJc+MbLF2d3fd044el1FKt9ud3ZZJ+e/1ehKFJ6i8NZvNyNClWq16FYTOAOyi479ZaZfLZSXlRmUbGxsqqZ8qVrk2NjbCs+ODwSAy99rd3T08PNSdqutsuSSTWq0WCdyF7OVS9ur1uqSh+2u12iz5tGlej7a3tyPx6n7PTKlUikRhLyzKJN5yuaxchfmcKnMXjt+mltlsNrMLP6873ab8dzodtUBv Choice B) A quota limits the quantity of a good imported into a domestic country. A domestic government can generate revenue under a quota\nby selling import licenses to foreign exporters. Without licenses, quota rents will likely be captured by foreign exporters.\nThings to remember:\nA voluntary export restraint (VER) is a method that governments use to reduce trade deficits by limiting the amount of goods exported from one\ncountry to another. Since a VER is imposed by the exporting country, the importing country does not receive any quota rent.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3YAAAFqCAIAAADZRF8TAAEAAElEQVR42ux9d7yP5f//673P+2x7ZRRFNilFWSEVKkIqKyNNo9CyiyZKmqIhUlKKKKs0lDJKSqhERtbhjPcevz+enefv6n6fo9Pnq6zX8w+P97nd93Vf9zVf1/O1bPF4XBQKhUKhUCgUimMHuzaBQqFQKBQKhUJFTIVCoVAoFAqFipgKhUKhUCgUChUxFQqFQqFQKBQKFTEVCoVCoVAoFCpiKhQKhUKhUChUxFQoFAqFQqFQKFTEVCgUCoVCoVCoiKlQKBQKhUKhUBFToVAoFAqFQqFQEVOhUCgUCoVCoSKmQqFQKBQKhUJFTIVCoVAoFAqFipgKhUKhUCgUCoWKmAqFQqFQKBQKFTEVCoVCoVAoFCpiKhQKhUKhUCgUKmIqFAqFQqFQKFTEVCgUCoVCoVCoiKlQKBQKhUKhUKiIqVAoFAqFQqFQEVOhUCgUCoVCoSKmQqFQKBQKhUKhIqZCoVAoFAqFQkVMhULxHyMej8fjcf4ZzQf/l/8VCoVCoVBhD5owSxCRWCwWi8VEJBwOh8PhxApEIpFIJMIyzXvMt8TyUdi3hMNhSyULfJ1ZbbwXdeZFv9/v9/v5UvPmSCTCK6x2YgmF1RNv53+ZVbWUwCuWt7ANLdf/Fmbhlg6yNAXrCUQikQI7TqFQKFTEVCgUCoVCoVAce9gKIxsUCsVpDhBpbrc7GAyKiMPhEBGn0wmWy+FwBAIBEUlKSpKCSK9YLOZ0OlGOx+MREZvtzwUHXB0KlAS6kb9dLpf8lV+02+0mwWnegzLj8XiBxZpAtVEl1MqsdjQaRbVZTigUQuFJSUmoBv6NRCJut7uIjYnCUTL+NOvJOoiIz+cTkeTkZLO2SUlJaBmn02neLCLBYNCssN/v93q9/C/84MeaiMVibE/zIutjeRGqjUcSH1QoFAoVMRUKxd+Dkko8HoeoQenQIsOFQiH8F26j1GXKOhb5j4KaRVKJRqNHFxBjsRgkLYvMZEpLLNwUB+12O27g51BBHI1GIafyumVVpGRMWTlRg0zZ0XyWWm+Hw2E2kVlhy3XzSl5enoikpKQUKAUSdrvdvDMQCOBzElsSTReLxXCD2fhUjhfY/majFXgeoKCvUCgUqihXKBQKhUKhUIiymAqF4r8DabZIJGKymKTr6PVCqlLy9bxU8uKRcDhMatN0JSFhRpIsFAqZqudwOIw62Gw2PEi2zHInXxqNRvmIFKKw5ifIX4lDiy7+KBw const CFG = {"title": "Wiley · International Trade", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Economics · 9 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
