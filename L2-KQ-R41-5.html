 met (e.g., experience requirements) before Patel can use the designation.", "explhtml": "<p>An announcement that a member of a firm has received the right to use the CFA<sup>®<\/sup> designation is not a violation of the Code or Standards. However, Standard VII(B) requires that any reference to the charter must not misrepresent or exaggerate the meaning or implications of the CFA designation. A charterholder cannot claim that holding a charter leads to superior performance results. The letters &quot;CFA&quot; can only be used as an adjective (never a noun, as in &quot;he is a CFA&quot;). Finally, passing all three exams does not give one the right to use the designation. All criteria must be met (e.g., experience requirements) before Patel can use the designation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chandra Patel, CFA, manages private client portfolios for QED Investment Advisers. Part of QED's firm-wide policy is to adhere to CFA Institute Standards of Professional Conduct in the management of all client portfolios, and to this end, the firm requires that client objectives, investment experience, and financial limitations be clearly established at the outset of the relationship. This information is updated at regular intervals not to exceed eighteen months. The information is maintained in a written investment policy statement (IPS) for each client.<\/p><p>Anarudh Singh has been one of Patel's clients ever since she began managing money ten years ago. Shortly after his regular situational update, Singh calls to inform Patel that his uncle is ill, and it is not known how long he will survive. Singh expects to inherit \"a sizeable sum of money.\" mainly in the form of municipal bonds. His existing portfolio allocation guidelines are for 75% to be invested in bonds. Singh believes that the expected inheritance will allow him to assume a more aggressive investment profile and asks Patel to begin moving toward a 75% allocation to equities. He is specifically interested in opening sizable positions in several technology firms, some of which have only recently become publicly traded companies. Patel agrees to begin making the changes to the portfolio and the next day begins selling bonds from the portfolio and purchasing stocks in the technology sector as well as in other sectors. After placing the trade orders, Patel sends Singh an email to request that he come to her office sometime during the next week to update his IPS. Singh replies to Patel, saying that he can meet with her next Friday.<\/p><p>A few days before the meeting, however, Singh's uncle dies and the portfolio of municipal bonds is transferred to Singh's account with QED. Patel sees this as an opportunity to purchase more technology stocks for the portfolio and suggests taking such action during her meeting with Singh, who agrees. Patel reviews her files on technology companies and locates a report on NetWin. The analyst's recommendation is that this stock is a \"core holding\" in the technology sector. Patel decides to purchase the stock for Singh's account in addition to several other wealthy client accounts with high risk tolerance levels, but due to time constraints she does not review the holdings in each account. Patel does examine the aggregate holdings of the accounts to determine the approximate weight that NetWin should represent in each portfolio.<\/p><p>Since Patel has very recently passed the Level III examination, QED sends a promotional email to all of the firm's clients. The email states that \"QED is proud to announce that Chandra Patel is now a CFA (Chartered Financial Analyst). This distinction, which is the culmination of many years of work and study, is further evidence of the superior performance you've come to expect at QED.\" Patel also places phone calls to several brokers that she uses to place trades for her accounts, stating that she \"passed all three CFA examinations on the first attempt.\" One of the people Patel contacts is Max Spellman, a long-time friend and broker with TradeRight Brokers Inc. Patel uses the opportunity to discuss her exclusive trading agreement with TradeRight for Singh's account.<\/p><p>When ordering trades for Singh's account, Patel's agreement with TradeRight for brokerage services requires her to first offer the trade to TradeRight, and then to another broker if TradeRight declines to take the trade. TradeRight never refuses the trades from any manager's clients. Patel established the relationship with TradeRight because Singh, knowing the firm's fee schedule relative to other brokers, asked her to do so. However, because TradeRight is very expensive and offers only moderate quality of execution, Patel is considering directing trades on Singh's account to BullBroker, which charges lower commissions and generally completes trades sooner than TradeRight.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Which of the following is least accurate regarding the promotional announcement of Patel passing the Level III exam?<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "With respect to the choice of broker, did Patel violate any CFA Institute Standards of Professional Conduct?", "opts": ["Yes, since Patel is obligated to seek the best possible price and execution for all clients.", "No.", "Yes, since Patel failed to properly notify Singh that using TradeRight would lead to higher commissions and opportunity costs."], "ans": "B", "expl": "Since Singh directed Patel to use TradeRight, this should be considered client-directed brokerage. While Patel should inform Singh of the implications of that choice, Patel has no option but to follow the client's direction according to Standard III(A)—Loyalty, Prudence, and Care. Singh was fully aware of the fees charged by TradeRight relative to other brokerage firms, but elected to use them anyway. Investment managers are obligated to seek the best price and execution in the absence of client direction.", "explhtml": "<p>Since Singh directed Patel to use TradeRight, this should be considered client-directed brokerage. While Patel should inform Singh of the implications of that choice, Patel has no option but to follow the client&#x27;s direction according to Standard III(A)—Loyalty, Prudence, and Care. Singh was fully aware of the fees charged by TradeRight relative to other brokerage firms, but elected to use them anyway. Investment managers are obligated to seek the best price and execution in the absence of client direction.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chandra Patel, CFA, manages private client portfolios for QED Investment Advisers. Part of QED's firm-wide policy is to adhere to CFA Institute Standards of Professional Conduct in the management of all client portfolios, and to this end, the firm requires that client objectives, investment experience, and financial limitations be clearly established at the outset of the relationship. This information is updated at regular intervals not to exceed eighteen months. The information is maintained in a written investment policy statement (IPS) for each client.<\/p><p>Anarudh Singh has been one of Patel's clients ever since she began managing money ten years ago. Shortly after his regular situational update, Singh calls to inform Patel that his uncle is ill, and it is not known how long he will survive. Singh expects to inherit \"a sizeable sum of money.\" mainly in the form of municipal bonds. His existing portfolio allocation guidelines are for 75% to be invested in bonds. Singh believes that the expected inheritance will allow him to assume a more aggressive investment profile and asks Patel to begin moving toward a 75% allocation to equities. He is specifically interested in opening sizable positions in several technology firms, some of which have only recently become publicly traded companies. Patel agrees to begin making the changes to the portfolio and the next day begins selling bonds from the portfolio and purchasing stocks in the technology sector as well as in other sectors. After placing the trade orders, Patel sends Singh an email to request that he come to her office sometime during the next week to update his IPS. Singh replies to Patel, saying that he can meet with her next Friday.<\/p><p>A few days before the meeting, however, Singh's uncle dies and the portfolio of municipal bonds is transferred to Singh's account with QED. Patel sees this as an opportunity to purchase more technology stocks for the portfolio and suggests taking such action during her meeting with Singh, who agrees. Patel reviews her files on technology companies and locates a report on NetWin. The analyst's recommendation is that this stock is a \"core holding\" in the technology sector. Patel decides to purchase the stock for Singh's account in addition to several other wealthy client accounts with high risk tolerance levels, but due to time constraints she does not review the holdings in each account. Patel does examine the aggregate holdings of the accounts to determine the approximate weight that NetWin should represent in each portfolio.<\/p><p>Since Patel has very recently passed the Level III examination, QED sends a promotional email to all of the firm's clients. The email states that \"QED is proud to announce that Chandra Patel is now a CFA (Chartered Financial Analyst). This distinction, which is the culmination of many years of work and study, is further evidence of the superior performance you've come to expect at QED.\" Patel also places phone calls to several brokers that she uses to place trades for her accounts, stating that she \"passed all three CFA examinations on the first attempt.\" One of the people Patel contacts is Max Spellman, a long-time friend and broker with TradeRight Brokers Inc. Patel uses the opportunity to discuss her exclusive trading agreement with TradeRight for Singh's account.<\/p><p>When ordering trades for Singh's account, Patel's agreement with TradeRight for brokerage services requires her to first offer the trade to TradeRight, and then to another broker if TradeRight declines to take the trade. TradeRight never refuses the trades from any manager's clients. Patel established the relationship with TradeRight because Singh, knowing the firm's fee schedule relative to other brokers, asked her to do so. However, because TradeRight is very expensive and offers only moderate quality of execution, Patel is considering directing trades on Singh's account to BullBroker, which charges lower commissions and generally completes trades sooner than TradeRight.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>With respect to the choice of broker, did Patel violate any CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of the two clients are equal in value. One of the clients gets married and the assets of the new spouse and the client are combined. With the larger portfolio of the now married client, Hatfield determines that they can assume a higher level of risk and begins a change in the policy concerning that portfolio. Which of the following would violate Standard III(C), Suitability?", "opts": ["Implement a similar policy for the other client who did not just get married.", "Assess the time horizon of the newly married client and his spouse.", "Assess the return objectives of the newly married client and his spouse."], "ans": "A", "expl": "According to Standard III(C), Suitability, the analyst must assess the time horizon, return objectives, tax considerations, and liquidity needs of a client before changing an investment policy. The analyst must notify the client of the new policy. Implementing the policy for the other client may be a violation of the Standard unless that client's needs are totally reassessed and determined to be identical to the needs of the newly married client.", "explhtml": "<p>According to Standard III(C), Suitability, the analyst must assess the time horizon, return objectives, tax considerations, and liquidity needs of a client before changing an investment policy. The analyst must notify the client of the new policy. Implementing the policy for the other client may be a violation of the Standard unless that client&#x27;s needs are totally reassessed and determined to be identical to the needs of the newly married client.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of the two clients are equal in value. One of the clients gets married and the assets of the new spouse and the client are combined. With the larger portfolio of the now married client, Hatfield determines that they can assume a higher level of risk and begins a change in the policy concerning that portfolio. Which of the following would violate Standard III(C), Suitability?<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "Wanda Brunner, CFA, is reviewing a draft fund prospectus for her new \"Leveraged Long Coffee\" (LLC), a closed-end fund. LLC uses a of combination fundamental and technical trading models to evaluate individual securities. She notes the LLC prospectus has several disclosures which cause her to worry that prospective clients will avoid her fund. Disclosure 1: \"LLC charges a flat 3.00% of assets under management.\" Disclosure 2: \"LLC may invest up to 40% of the fund's assets in securities which are not related to coffee or other consumer products.\" Disclosure 3: \"LLC relies only on fundamental valuation of individual securities.\" Which of the following standards will most likely be violated by distribution of the prospectus?", "opts": ["Standard III(C) Duties to Clients: Suitability because the fund can hold an excessive portion of the portfolio in non-core assets.", "Standard III(C) Duties to Clients: Suitability because the fees are exorbitant.", "Standard III(C) Duties to Clients: Suitability because it misleads the reader as to the process by which securities are selected."], "ans": "C", "expl": "LLC must adequately disclose the basic security selection and portfolio construction process, and the portfolio manager recommendations and investment actions must be consistent with the stated objectives and constraints of the fund. By failing to acknowledge the fund's dependence on technical trading, the fund fails to meet this standard.", "explhtml": "<p>LLC must adequately disclose the basic security selection and portfolio construction process, and the portfolio manager recommendations and investment actions must be consistent with the stated objectives and constraints of the fund. By failing to acknowledge the fund&#x27;s dependence on technical trading, the fund fails to meet this standard.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Wanda Brunner, CFA, is reviewing a draft fund prospectus for her new &quot;Leveraged Long Coffee&quot; (LLC), a closed-end fund. LLC uses a of combination fundamental and technical trading models to evaluate individual securities. She notes the LLC prospectus has several disclosures which cause her to worry that prospective clients will avoid her fund.<\/p><p>Disclosure 1: &quot;LLC charges a flat 3.00% of assets under management.&quot; Disclosure 2: &quot;LLC may invest up to 40% of the fund&#x27;s assets in securities which are not related to coffee or other consumer products.&quot; Disclosure 3: &quot;LLC relies only on fundamental valuation of individual securities.&quot;<\/p><p>Which of the following standards will most likely be violated by distribution of the prospectus?<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "The following information pertains to the Galaxy Trust, a trust established by Stephen P. House and managed by Gamma Investment LLC: At the time the trust was established House provided $5 million in cash to fund the trust, but Gamma was aware that 93% of his personal assets were in the form of Oracle stock. Gamma has been asked to view his funds and the trust as a single entity for planning purposes, since House's will stipulates that all of his estate will pass to the trust upon his death. The investment policy statement, developed in September 1996, stipulates that the trust should maintain a short position in Oracle stock and use the proceeds to diversify the trust more adequately. House was able to sell all of his Oracle shares back to the corporation in January 1999 for cash. The policy statement redrawn in September 1999 continues to stipulate that the trust hold a short position in Oracle stock. House has given the portfolio manager in charge of the trust an all-expenses paid vacation package anywhere in the world each year at Christmas. The portfolio manager has reported this fact in writing to his immediate supervisor at Gamma.  Which of the following is most correct? The investment manager is:", "opts": ["in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances and is in violation with regard to the acceptance of the gift from House.", "in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances but is not in violation with regard to the acceptance of the gift from House.", "not in violation of the Code and Standards for not properly updating the investment policy statement in light of the change in the circumstances and is not in violation with regard to the acceptance of the gift from House."], "ans": "B", "expl": "The investment manager is in violation of the Standard requiring him to make a reasonable inquiry into the client's financial situation and update the investment policy statement since such a dramatic change in the client's circumstances would undoubtedly alter the investment policy statement and would probably eliminate the need to hold a short position in Oracle. The investment manager is not in violation of the Standard concerning additional compensation, since the gift has been reported to his supervisor and has come from a client. If there was a failure to report such a gift, if the firm had a rule in place against the acceptance of gifts from clients, or if the gift had come from a non-client, there would be a violation of the standard. ", "explhtml": "<p>The investment manager is in violation of the Standard requiring him to make a reasonable inquiry into the client&#x27;s financial situation and update the investment policy statement since such a dramatic change in the client&#x27;s circumstances would undoubtedly alter the investment policy statement and would probably eliminate the need to hold a short position in Oracle. The investment manager is not in violation of the Standard concerning additional compensation, since the gift has been reported to his supervisor and has come from a client. If there was a failure to report such a gift, if the firm had a rule in place against the acceptance of gifts from clients, or if the gift had come from a non-client, there would be a violation of the standard. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41.b<\/div><div class=\"qtext\"><p>The following information pertains to the Galaxy Trust, a trust established by Stephen P. House and managed by Gamma Investment LLC:<\/p><p>At the time the trust was established House provided $5 million in cash to fund the trust, but Gamma was aware that 93% of his personal assets were in the form of Oracle stock. Gamma has been asked to view his funds and the trust as a single entity for planning purposes, since House&#x27;s will stipulates that all of his estate will pass to the trust upon his death. The investment policy statement, developed in September 1996, stipulates that the trust should maintain a short position in Oracle stock and use the proceeds to diversify the trust more adequately. House was able to sell all of his Oracle shares back to the corporation in January 1999 for cash. The policy statement redrawn in September 1999 continues to stipulate that the trust hold a short position in Oracle stock. House has given the portfolio manager in charge of the trust an all-expenses paid vacation package anywhere in the world each year at Christmas. The portfolio manager has reported this fact in writing to his immediate supervisor at Gamma. <\/p><p>Which of the following is most correct? The investment manager is:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "Rey Sanchez, CFA, covers the specialty chemical industry for Rock Advisory Associates. Until today he has had a buy recommendation on ChemStar, and many of the firm's customers have purchased shares based upon his recommendation. The firm's client accounts are divided into two fundamental categories: trading and buy-and-hold accounts. The firm holds discretionary trading authority over the trading accounts, but not the buy-and-hold accounts. Sanchez has recently come to believe that the fundamentals are changing for the worse at ChemStar, and is preparing a sell recommendation. He calls a meeting of the firm's portfolio managers with accounts holding ChemStar and tells them of the pending release of the sell recommendation. On this basis, the portfolio managers sell all positions in the discretionary accounts but not in the buy-and-hold accounts. Sanchez completes and mails the report to all clients two days later, and, shortly thereafter, many of the buy-and-hold accounts sell their ChemStar positions. With regard to these actions, Sanchez is:", "opts": ["in violation of the Standard on Fair Dealing; the portfolio managers are in violation of the Standard on Fair Dealing.", "not in violation of the Standard on Fair Dealing; the portfolio managers are in violation of the Standard on Fair Dealing.", "in violation of the Standard on Fair Dealing; the portfolio managers are not in violation of the Standard on Fair Dealing."], "ans": "A", "expl": "Sanchez is in violation of the Standard III(B), Fair Dealing, since he has disseminated his recommendation preferentially to the portfolio managers in advance of making the report available to all clients who hold shares of ChemStar. The portfolio managers are in violation of the Standard since they are effectively giving preferential treatment to the trading accounts over the buy-and-hold accounts in the placement of orders based upon the change in recommendation.", "explhtml": "<p>Sanchez is in violation of the Standard III(B), Fair Dealing, since he has disseminated his recommendation preferentially to the portfolio managers in advance of making the report available to all clients who hold shares of ChemStar. The portfolio managers are in violation of the Standard since they are effectively giving preferential treatment to the trading accounts over the buy-and-hold accounts in the placement of orders based upon the change in recommendation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Rey Sanchez, CFA, covers the specialty chemical industry for Rock Advisory Associates. Until today he has had a buy recommendation on ChemStar, and many of the firm&#x27;s customers have purchased shares based upon his recommendation. The firm&#x27;s client accounts are divided into two fundamental categories: trading and buy-and-hold accounts. The firm holds discretionary trading authority over the trading accounts, but not the buy-and-hold accounts. Sanchez has recently come to believe that the fundamentals are changing for the worse at ChemStar, and is preparing a sell recommendation. He calls a meeting of the firm&#x27;s portfolio managers with accounts holding ChemStar and tells them of the pending release of the sell recommendation. On this basis, the portfolio managers sell all positions in the discretionary accounts but not in the buy-and-hold accounts. Sanchez completes and mails the report to all clients two days later, and, shortly thereafter, many of the buy-and-hold accounts sell their ChemStar positions. With regard to these actions, Sanchez is:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "With regard to disseminating investment recommendations, the recommended procedures for compliance with the Standard concerning fair dealing least likely state that members and candidates should:", "opts": ["maximize the number of people who know an investment recommendation is going to be disseminated.", "maintain a list of clients and their holdings, to facilitate notifying them of changes in investment recommendations.", "shorten the time frame between the decision to make an investment recommendation and its dissemination."], "ans": "A", "expl": "Recommended procedures for compliance with Standard III(B) Fair Dealing include limiting the number of people who know an investment recommendation is going to be disseminated", "explhtml": "<p>Recommended procedures for compliance with Standard III(B) Fair Dealing include limiting the number of people who know an investment recommendation is going to be disseminated<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>With regard to disseminating investment recommendations, the recommended procedures for compliance with the Standard concerning fair dealing least likely state that members and candidates should:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "In selling his clients' holdings in Aggregate, Watkins:", "opts": ["did not violate Standard II(A): Material Nonpublic Information because the information did not involve a tender offer.", "violated Standard II(A): Material Nonpublic Information by taking investment action.", "did not violate Standard II(A): Material Nonpublic Information because there was no breach of duty."], "ans": "B", "expl": "Watkins violated the CFA Institute Standards because the information was both material and nonpublic. It does not matter if the information was not misappropriated, not received in a breach of duty or not related to a tender offer. Watkins still cannot trade or cause others to trade. CFA candidates are indeed subject to the CFA Institute Standards. While the misappropriated information did not involve a tender offer, Watkins' use of it still violated the Standards simply because it was material nonpublic information.", "explhtml": "<p>Watkins violated the CFA Institute Standards because the information was both material and nonpublic. It does not matter if the information was not misappropriated, not received in a breach of duty or not related to a tender offer. Watkins still cannot trade or cause others to trade. CFA candidates are indeed subject to the CFA Institute Standards. While the misappropriated information did not involve a tender offer, Watkins&#x27; use of it still violated the Standards simply because it was material nonpublic information.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<\/summary><div class=\"vig-body\"><p>In August 2005, the following events occurred related to Aggregate Opportunities, Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v001.webp\" style=\"max-width:min(100%,638px)\" alt=\"• Aug. 8: The Wall Street Journal reported that Aggregate Opportunities had inflated its 2004 earnings due to questionable accounting practices. The story was based on interviews with unnamed sources within Aggregate and its auditor, Millennium Partners. On that day the stock fell 42 percent to $12.50 from $21.55. • Aug. 10: At 9 a.m., Aggregate revealed in a conference call to analysts a restatement of earnings for the previous three fiscal years that almost completely erased the reported net income for fiscal years 2002, 2003, and 2004. Aggregate&#x27;s chief financial officer personally sel\"><p>During July and August of 2005, the following actions were taken:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v002.webp\" style=\"max-width:min(100%,639px)\" alt=\"• July 20: Michael Cho, CFA, a highly respected analyst with 25 years of experience covering Aggregate&#x27;s industry, had spent several days reading Aggregate&#x27;s 10-K and 10-Q documents and other analysis published by some of his competitors at major brokerage houses. Based on his reading and conversations with Aggregate management concerning nonmaterial, nonpublic information, Cho concluded that Aggregate had inflated its earnings. On July 20, Cho issued a detailed research report to his clients and concluded that Aggregate should be sold. He subsequently participated in the Aug. 10 con\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"Cho&#x27;s research, then read Cho&#x27;s report on Aggregate, Immediately after finishing Cho&#x27;s report, Martinez sold the fund&#x27;s entire stake in Aggregate. Watkins and Martinez were not participants in the Aug. 10 conference call. • Aug. 8: Barb Henderson, a CFA charterholder, read the Wall Street Journal article in the morning and after going over her research papers, issued a sell recommendation for Aggregate. On Aug. 10, she participated in the conference call and heard the details of the earnings restatement. • Aug. 10: Lisa Sanders, CFA, participated in the Aggregate conference\"><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>In selling his clients&#x27; holdings in Aggregate, Watkins:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "After changing her recommendation on Aggregate, Sanders:", "opts": ["violated Standard VI(B): Priority of Transactions by trading Aggregate from her own account.", "violated Standard II(A): Material Nonpublic Information by taking investment action based on information not accessible to the public.", "did not violate Standard II(A): Material Nonpublic Information because the information was disclosed to a select group of analysts."], "ans": "B", "expl": "The way in which Aggregate handled the conference call was an instance of selective dissemination, Members and Candidates must be aware that disclosure to selected analysts is not necessarily public disclosure. Thus, until the material information is made public, Sanders cannot trade or cause others to trade. Once the information is made public, Sanders must disseminate the information to her clients first, and give them adequate time to act on the recommendation before trading for her own account. In the absence of knowledge of any company policy with stricter requirements, 3 hours is probably sufficient, and we cannot assume she violated Standard VI(B). Standard III(B) does not require equal dissemination of information but rather fair dissemination. Nothing in the question indicated that Sanders disseminated the information unfairly.", "explhtml": "<p>The way in which Aggregate handled the conference call was an instance of selective dissemination, Members and Candidates must be aware that disclosure to selected analysts is not necessarily public disclosure. Thus, until the material information is made public, Sanders cannot trade or cause others to trade. Once the information is made public, Sanders must disseminate the information to her clients first, and give them adequate time to act on the recommendation before trading for her own account. In the absence of knowledge of any company policy with stricter requirements, 3 hours is probably sufficient, and we cannot assume she violated Standard VI(B). Standard III(B) does not require equal dissemination of information but rather fair dissemination. Nothing in the question indicated that Sanders disseminated the information unfairly.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In August 2005, the following events occurred related to Aggregate Opportunities, Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v001.webp\" style=\"max-width:min(100%,638px)\" alt=\"• Aug. 8: The Wall Street Journal reported that Aggregate Opportunities had inflated its 2004 earnings due to questionable accounting practices. The story was based on interviews with unnamed sources within Aggregate and its auditor, Millennium Partners. On that day the stock fell 42 percent to $12.50 from $21.55. • Aug. 10: At 9 a.m., Aggregate revealed in a conference call to analysts a restatement of earnings for the previous three fiscal years that almost completely erased the reported net income for fiscal years 2002, 2003, and 2004. Aggregate&#x27;s chief financial officer personally sel\"><p>During July and August of 2005, the following actions were taken:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v002.webp\" style=\"max-width:min(100%,639px)\" alt=\"• July 20: Michael Cho, CFA, a highly respected analyst with 25 years of experience covering Aggregate&#x27;s industry, had spent several days reading Aggregate&#x27;s 10-K and 10-Q documents and other analysis published by some of his competitors at major brokerage houses. Based on his reading and conversations with Aggregate management concerning nonmaterial, nonpublic information, Cho concluded that Aggregate had inflated its earnings. On July 20, Cho issued a detailed research report to his clients and concluded that Aggregate should be sold. He subsequently participated in the Aug. 10 con\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"Cho&#x27;s research, then read Cho&#x27;s report on Aggregate, Immediately after finishing Cho&#x27;s report, Martinez sold the fund&#x27;s entire stake in Aggregate. Watkins and Martinez were not participants in the Aug. 10 conference call. • Aug. 8: Barb Henderson, a CFA charterholder, read the Wall Street Journal article in the morning and after going over her research papers, issued a sell recommendation for Aggregate. On Aug. 10, she participated in the conference call and heard the details of the earnings restatement. • Aug. 10: Lisa Sanders, CFA, participated in the Aggregate conference\"><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>After changing her recommendation on Aggregate, Sanders:<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "In selling his fund's stake in Aggregate, Martinez:", "opts": ["violated Standard III(A): Loyalty, Prudence, and Care by using information obtained from Watkins.", "violated no standards.", "violated Standard II(A): Material Nonpublic Information by using information obtained from Watkins."], "ans": "C", "expl": "Martinez was aware of how Watkins obtained the information; therefore, Martinez violated II(A) by trading on material nonpublic information. Martinez has no fiduciary duty to Watkins, and as such did not violate Standard III(A). It would be difficult to argue that Cho's thorough research is not sufficient reason to trade Aggregate stock, so Martinez did not violate Standard V(A).", "explhtml": "<p>Martinez was aware of how Watkins obtained the information; therefore, Martinez violated II(A) by trading on material nonpublic information. Martinez has no fiduciary duty to Watkins, and as such did not violate Standard III(A). It would be difficult to argue that Cho&#x27;s thorough research is not sufficient reason to trade Aggregate stock, so Martinez did not violate Standard V(A).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In August 2005, the following events occurred related to Aggregate Opportunities, Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v001.webp\" style=\"max-width:min(100%,638px)\" alt=\"• Aug. 8: The Wall Street Journal reported that Aggregate Opportunities had inflated its 2004 earnings due to questionable accounting practices. The story was based on interviews with unnamed sources within Aggregate and its auditor, Millennium Partners. On that day the stock fell 42 percent to $12.50 from $21.55. • Aug. 10: At 9 a.m., Aggregate revealed in a conference call to analysts a restatement of earnings for the previous three fiscal years that almost completely erased the reported net income for fiscal years 2002, 2003, and 2004. Aggregate&#x27;s chief financial officer personally sel\"><p>During July and August of 2005, the following actions were taken:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v002.webp\" style=\"max-width:min(100%,639px)\" alt=\"• July 20: Michael Cho, CFA, a highly respected analyst with 25 years of experience covering Aggregate&#x27;s industry, had spent several days reading Aggregate&#x27;s 10-K and 10-Q documents and other analysis published by some of his competitors at major brokerage houses. Based on his reading and conversations with Aggregate management concerning nonmaterial, nonpublic information, Cho concluded that Aggregate had inflated its earnings. On July 20, Cho issued a detailed research report to his clients and concluded that Aggregate should be sold. He subsequently participated in the Aug. 10 con\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"Cho&#x27;s research, then read Cho&#x27;s report on Aggregate, Immediately after finishing Cho&#x27;s report, Martinez sold the fund&#x27;s entire stake in Aggregate. Watkins and Martinez were not participants in the Aug. 10 conference call. • Aug. 8: Barb Henderson, a CFA charterholder, read the Wall Street Journal article in the morning and after going over her research papers, issued a sell recommendation for Aggregate. On Aug. 10, she participated in the conference call and heard the details of the earnings restatement. • Aug. 10: Lisa Sanders, CFA, participated in the Aggregate conference\"><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>In selling his fund&#x27;s stake in Aggregate, Martinez:<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "Which statement about violations of the Code and Standards is CORRECT?", "opts": ["Henderson violated the reasonable-basis standard, but Sanders did not violate the Standard regarding use of material nonpublic information.", "Aggregate’s CFO violated the market manipulation Standard, but Black did not violate the fiduciary-duties Standard.", "Martinez did not violate the Standard regarding use of material nonpublic information and did not violate the fiduciary-duties standard."], "ans": "B", "expl": "By participating in Aggregate's inflation of earnings and then selective disclosure, the CFO did violate the market manipulation Standard. While Black violated a number of Standards, his brother's fiduciary duty cannot be imposed on him. Black did not violate the fiduciary-duties Standard. While Cho did not violate the insider-trading standard because he came to his conclusions through the mosaic method, Watkins certainly did because he misappropriated the information. Martinez violated the Standard on material nonpublic information. Henderson did not violate the reasonable-basis Standard. Sanders did violate the insider-trading Standard.", "explhtml": "<p>By participating in Aggregate&#x27;s inflation of earnings and then selective disclosure, the CFO did violate the market manipulation Standard. While Black violated a number of Standards, his brother&#x27;s fiduciary duty cannot be imposed on him. Black did not violate the fiduciary-duties Standard. While Cho did not violate the insider-trading standard because he came to his conclusions through the mosaic method, Watkins certainly did because he misappropriated the information. Martinez violated the Standard on material nonpublic information. Henderson did not violate the reasonable-basis Standard. Sanders did violate the insider-trading Standard.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 12–15<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In August 2005, the following events occurred related to Aggregate Opportunities, Inc.:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v001.webp\" style=\"max-width:min(100%,638px)\" alt=\"• Aug. 8: The Wall Street Journal reported that Aggregate Opportunities had inflated its 2004 earnings due to questionable accounting practices. The story was based on interviews with unnamed sources within Aggregate and its auditor, Millennium Partners. On that day the stock fell 42 percent to $12.50 from $21.55. • Aug. 10: At 9 a.m., Aggregate revealed in a conference call to analysts a restatement of earnings for the previous three fiscal years that almost completely erased the reported net income for fiscal years 2002, 2003, and 2004. Aggregate&#x27;s chief financial officer personally sel\"><p>During July and August of 2005, the following actions were taken:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v002.webp\" style=\"max-width:min(100%,639px)\" alt=\"• July 20: Michael Cho, CFA, a highly respected analyst with 25 years of experience covering Aggregate&#x27;s industry, had spent several days reading Aggregate&#x27;s 10-K and 10-Q documents and other analysis published by some of his competitors at major brokerage houses. Based on his reading and conversations with Aggregate management concerning nonmaterial, nonpublic information, Cho concluded that Aggregate had inflated its earnings. On July 20, Cho issued a detailed research report to his clients and concluded that Aggregate should be sold. He subsequently participated in the Aug. 10 con\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-5/v003.webp\" style=\"max-width:min(100%,629px)\" alt=\"Cho&#x27;s research, then read Cho&#x27;s report on Aggregate, Immediately after finishing Cho&#x27;s report, Martinez sold the fund&#x27;s entire stake in Aggregate. Watkins and Martinez were not participants in the Aug. 10 conference call. • Aug. 8: Barb Henderson, a CFA charterholder, read the Wall Street Journal article in the morning and after going over her research papers, issued a sell recommendation for Aggregate. On Aug. 10, she participated in the conference call and heard the details of the earnings restatement. • Aug. 10: Lisa Sanders, CFA, participated in the Aggregate conference\"><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41.a<\/div><div class=\"qtext\"><p>Which statement about violations of the Code and Standards is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Concerning Standard III(B), Fair Dealing, which of the following actions is NOT a valid procedure for compliance with the Standard?", "opts": ["Communicate investment recommendations to all customers including those accounts for which the securities are not eligible for purchase.", "Communicate investment recommendations simultaneously within the firm and to customers, where possible.", "Limit the number of people that are involved and are privy to the fact that an investment recommendation is going to be disseminated."], "ans": "A", "expl": "To ensure compliance with the Standard, members should seek to communicate investment recommendations to all clients who have indicated an interest and also those for whom the securities are suitable. There is no need to communicate recommendations to clients for whom the securities are deemed unsuitable.", "explhtml": "<p>To ensure compliance with the Standard, members should seek to communicate investment recommendations to all clients who have indicated an interest and also those for whom the securities are suitable. There is no need to communicate recommendations to clients for whom the securities are deemed unsuitable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Concerning Standard III(B), Fair Dealing, which of the following actions is NOT a valid procedure for compliance with the Standard?<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "Which of the following statements regarding allocating trades is CORRECT? It is permissible under the Standards to allocate trades:", "opts": ["based upon any method the firm deems suitable so long as the allocation procedure has been disclosed to all clients.", "based upon compensation arrangements.", "on a pro-rata basis over all suitable accounts."], "ans": "C", "expl": "It is permissible to allocate trades on a pro-rata basis over all suitable accounts. It is not permissible to base allocations upon compensation arrangements. Any method is not necessarily suitable, and disclosure does not absolve the member from ensuring that the allocation is necessarily fair.", "explhtml": "<p>It is permissible to allocate trades on a pro-rata basis over all suitable accounts. It is not permissible to base allocations upon compensation arrangements. Any method is not necessarily suitable, and disclosure does not absolve the member from ensuring that the allocation is necessarily fair.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Which of the following statements regarding allocating trades is CORRECT? It is permissible under the Standards to allocate trades:<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "A money management firm has the following policy concerning new recommendations: When a new recommendation is made, each portfolio manager estimates the likely transaction size for each of their clients. Clients are notified of the new recommendation in the order of their estimated transaction size—largest first. All clients have signed a form where they acknowledge and consent to this allocation procedure. With respect to Standard III(B), Fair Dealing, this is:", "opts": ["not a violation because the clients have signed the consent form.", "not a violation because the clients are aware of the policy.", "a violation of the standard."], "ans": "C", "expl": "Such a policy is a violation of the Standard and client acknowledgement and/or consent does not change that fact.", "explhtml": "<p>Such a policy is a violation of the Standard and client acknowledgement and/or consent does not change that fact.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>A money management firm has the following policy concerning new recommendations: When a new recommendation is made, each portfolio manager estimates the likely transaction size for each of their clients. Clients are notified of the new recommendation in the order of their estimated transaction size—largest first. All clients have signed a form where they acknowledge and consent to this allocation procedure. With respect to Standard III(B), Fair Dealing, this is:<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Scott Andrews, CFA, is a stockbroker selling an oversubscribed stock issue. Which of the following best describes Andrews' actions regarding this sale? Andrews:", "opts": ["cannot offer an oversubscribed issue of stock to any clients.", "can offer this security on a prorated basis to all clients for which the security is appropriate.", "can only offer this security to clients for which it is appropriate on a first come first serve basis."], "ans": "B", "expl": "Standard III(B), Fair Dealing, applies. When new issues or secondary offerings are available or are being offered by the firm or if the firm is part of a selling syndicate, all clients for whom the security is appropriate are to be offered a chance to take part in the issue. If the issue is oversubscribed, then the issue is to be prorated to all subscribers.", "explhtml": "<p>Standard III(B), Fair Dealing, applies. When new issues or secondary offerings are available or are being offered by the firm or if the firm is part of a selling syndicate, all clients for whom the security is appropriate are to be offered a chance to take part in the issue. If the issue is oversubscribed, then the issue is to be prorated to all subscribers.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41.b<\/div><div class=\"qtext\"><p>Scott Andrews, CFA, is a stockbroker selling an oversubscribed stock issue. Which of the following best describes Andrews&#x27; actions regarding this sale? Andrews:<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "Lance Tuipulotu, CFA, manages investments for 400 individuals and families and often finds his resources stretched. When his largest investors petition him to include a 5% to 7% allocation of non-investment-grade bonds in their portfolios, he decides he needs additional help to meet the request. He considers various subadvisers who specialize in that asset class. To have a reasonable basis for selecting a subadviser, criteria that Tuipulotu should use should least likely include:", "opts": ["their internal controls.", "adherence to their stated strategies.", "consistently high historical returns."], "ans": "C", "expl": "Guidance for Standard V(A) Diligence and Reasonable Basis states that when reviewing external advisers, members and candidates should (at a minimum) evaluate the adviser's code of ethics, its compliance procedures and internal controls, its investment processes and adherence to its stated strategies, and the quality of its published information on returns.", "explhtml": "<p>Guidance for Standard V(A) Diligence and Reasonable Basis states that when reviewing external advisers, members and candidates should (at a minimum) evaluate the adviser&#x27;s code of ethics, its compliance procedures and internal controls, its investment processes and adherence to its stated strategies, and the quality of its published information on returns.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Lance Tuipulotu, CFA, manages investments for 400 individuals and families and often finds his resources stretched. When his largest investors petition him to include a 5% to 7% allocation of non-investment-grade bonds in their portfolios, he decides he needs additional help to meet the request. He considers various subadvisers who specialize in that asset class. To have a reasonable basis for selecting a subadviser, criteria that Tuipulotu should use should least likely include:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "Janet Reilly has just approached Betty Miller, CFA, about purchasing 10,000 shares of Brookshire Co., a newly incorporated real estate development firm. Reilly is a retired schoolteacher living off the income from her late husband's life insurance policy. This investment will represent a significant shift in her investment portfolio. Miller believes this trade is unsuitable with respect to Reilly's investment policy statement. Consistent with the Standards, Miller should most appropriately:", "opts": ["discuss with Reilly whether she wishes to update her investment policy statement.", "follow her firm’s procedures for obtaining Reilly’s approval to carry out the unsolicited trade request.", "not accept the order, because it is not a suitable investment for Reilly."], "ans": "A", "expl": "According to the guidance for Standard III(C) Suitability, a member who receives an unsolicited trade request that is not suitable for the client should discuss the trade with the client before carrying it out. The nature of this discussion depends on whether the trade has a material effect on the client's portfolio. Because this trade will have a material effect, Miller's most appropriate action is to discuss with the client whether this trade request reflects a change in her investment objectives and risk tolerance and thus whether she wishes to update her IPS.", "explhtml": "<p>According to the guidance for Standard III(C) Suitability, a member who receives an unsolicited trade request that is not suitable for the client should discuss the trade with the client before carrying it out. The nature of this discussion depends on whether the trade has a material effect on the client&#x27;s portfolio. Because this trade will have a material effect, Miller&#x27;s most appropriate action is to discuss with the client whether this trade request reflects a change in her investment objectives and risk tolerance and thus whether she wishes to update her IPS.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Janet Reilly has just approached Betty Miller, CFA, about purchasing 10,000 shares of Brookshire Co., a newly incorporated real estate development firm. Reilly is a retired schoolteacher living off the income from her late husband&#x27;s life insurance policy. This investment will represent a significant shift in her investment portfolio. Miller believes this trade is unsuitable with respect to Reilly&#x27;s investment policy statement. Consistent with the Standards, Miller should most appropriately:<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "Rickard Advisors recently had a trading error in a customer account that was subsequently discovered by Rickard. The firm felt embarrassed by the disclosure of this error, and, in order to induce the client to continue its relationship, Rickard offers the client preferential access to a new issue that is expected to be \"hot.\" Which Standard is violated, if any?", "opts": ["The Standard concerning Fiduciary Duty.", "The Standard concerning Independence and Objectivity.", "The Standard concerning Fair Dealing."], "ans": "C", "expl": "Rickard is in violation of the Standard concerning Fair Dealing by offering the client preferential access to a \"hot\" new issue. There is no obvious violation of Fiduciary Duty, since there is no evidence that Rickard is placing its own financial interest ahead of the client.", "explhtml": "<p>Rickard is in violation of the Standard concerning Fair Dealing by offering the client preferential access to a &quot;hot&quot; new issue. There is no obvious violation of Fiduciary Duty, since there is no evidence that Rickard is placing its own financial interest ahead of the client.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Rickard Advisors recently had a trading error in a customer account that was subsequently discovered by Rickard. The firm felt embarrassed by the disclosure of this error, and, in order to induce the client to continue its relationship, Rickard offers the client preferential access to a new issue that is expected to be &quot;hot.&quot; Which Standard is violated, if any?<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "Caroline Turner, an analyst for Lansing Asset Management, just completed an investment report in which she recommends changing a \"buy\" to a \"sell\" for Gallup Company. Her supervisor at Lansing approves of the change in recommendation. Turner wonders about whether she needs to disseminate this investment recommendation to Lansing's clients and if so, how to distribute this information. According to CFA Institute Standards of Professional Conduct, Turner is:", "opts": ["required to disseminate the change in a prior investment recommendation to all clients and customers on a uniform basis.", "required to design an equitable system to disseminate the change in a prior investment recommendation.", "not required to disseminate the change of recommendation from a buy to a sell because the change is not material."], "ans": "B", "expl": "Standard III(B) – Fair Dealing requires dealing fairly and objectively with all clients and prospects when disseminating material changes in prior investment recommendations. Note that the standard requires the dissemination be fair, but not necessarily equal due to the impossibility of contacting all clients simultaneously. A change of recommendation from \"buy\" to \"sell\" is generally material. ", "explhtml": "<p>Standard III(B) – Fair Dealing requires dealing fairly and objectively with all clients and prospects when disseminating material changes in prior investment recommendations. Note that the standard requires the dissemination be fair, but not necessarily equal due to the impossibility of contacting all clients simultaneously. A change of recommendation from &quot;buy&quot; to &quot;sell&quot; is generally material. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Caroline Turner, an analyst for Lansing Asset Management, just completed an investment report in which she recommends changing a &quot;buy&quot; to a &quot;sell&quot; for Gallup Company. Her supervisor at Lansing approves of the change in recommendation. Turner wonders about whether she needs to disseminate this investment recommendation to Lansing&#x27;s clients and if so, how to distribute this information. According to CFA Institute Standards of Professional Conduct, Turner is:<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "Pro rata allocation on the basis of an advance indication of interest means each account for which the shares are suitable:", "opts": ["shall receive m/n shares, where there are m shares available and n such accounts.", "and which has expressed an advance indication of interest, shall receive m/n fraction of their indication, where there are m shares available and indications of interest for n shares.", "and which has expressed an advance indication of interest, shall receive w*m shares, where w is the account's proportional value of all such accounts and there are m shares available."], "ans": "B", "expl": "Pro rata allocation on the basis of an advance indication of interest means that all accounts that have expressed an interest in the issue shall receive m/n fraction of their indication of interest, where there are m shares available and indications of interest for n shares.", "explhtml": "<p>Pro rata allocation on the basis of an advance indication of interest means that all accounts that have expressed an interest in the issue shall receive m/n fraction of their indication of interest, where there are m shares available and indications of interest for n shares.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Pro rata allocation on the basis of an advance indication of interest means each account for which the shares are suitable:<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "Steven Wade, CFA, writes an investment newsletter focusing on high-tech companies, which he distributes by e-mail to paid subscribers. Wade does not gather any information about his clients' needs and circumstances. Wade has developed several complex valuation models that serve as the basis for his recommendations. Each month, his newsletter contains a list of \"buy\" and \"sell\" recommendations. He states that his recommendations are suitable for all types of portfolios and clients. Because of their proprietary nature, Wade does not disclose, except in general terms, the nature of his valuation models. He conducted numerous statistical tests of these models and they appear to have worked well in the past. In his newsletter, Wade claims that subscribers who follow his recommendations can expect to earn superior returns because of the past success of his models. Wade violated all of the following CFA Institute Standards of Professional Conduct EXCEPT:", "opts": ["Standard III(B), Fair Dealing.", "Standard I(C), Misrepresentation.", "Standard V(B), Communication with Clients and Prospective Clients."], "ans": "A", "expl": "Wade did not violate Standard III(B), Fair Dealing, because this situation does not indicate that he failed to deal fairly and objectively with all clients when disseminating his newsletter containing investment recommendations. Wade violated Standard V(B), Communication with Clients and Prospective Clients, because he failed to include all relevant factors behind his recommendations. Without providing the basis for his recommendations, clients cannot evaluate the limitations or the risks inherent in his recommendations. Wade violated Standard I(C), Misrepresentation, because his claims about gaining superior expected returns are misleading to potential investors. ", "explhtml": "<p>Wade did not violate Standard III(B), Fair Dealing, because this situation does not indicate that he failed to deal fairly and objectively with all clients when disseminating his newsletter containing investment recommendations.<\/p><p>Wade violated Standard V(B), Communication with Clients and Prospective Clients, because he failed to include all relevant factors behind his recommendations. Without providing the basis for his recommendations, clients cannot evaluate the limitations or the risks inherent in his recommendations.<\/p><p>Wade violated Standard I(C), Misrepresentation, because his claims about gaining superior expected returns are misleading to potential investors. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41.b<\/div><div class=\"qtext\"><p>Steven Wade, CFA, writes an investment newsletter focusing on high-tech companies, which he distributes by e-mail to paid subscribers. Wade does not gather any information about his clients&#x27; needs and circumstances. Wade has developed several complex valuation models that serve as the basis for his recommendations. Each month, his newsletter contains a list of &quot;buy&quot; and &quot;sell&quot; recommendations. He states that his recommendations are suitable for all types of portfolios and clients. Because of their proprietary nature, Wade does not disclose, except in general terms, the nature of his valuation models. He conducted numerous statistical tests of these models and they appear to have worked well in the past. In his newsletter, Wade claims that subscribers who follow his recommendations can expect to earn superior returns because of the past success of his models.<\/p><p>Wade violated all of the following CFA Institute Standards of Professional Conduct EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "Concerning Standard III(B), Fair Dealing, which of the following statements is CORRECT? The Standard:", "opts": ["concerns the dissemination of investment recommendations but is not concerned with the taking of investment action.", "is not concerned with the dissemination of investment recommendations so long as the taking of investment action is inherently fair.", "concerns the dissemination of investment recommendations and the taking of investment action."], "ans": "C", "expl": "Standard III(B), Fair Dealing is concerned with both the dissemination of investment recommendations and with the taking of investment action. It follows that this concern is irrespective of whether or not there has been a prior recommendation on the securities in question.", "explhtml": "<p>Standard III(B), Fair Dealing is concerned with both the dissemination of investment recommendations and with the taking of investment action. It follows that this concern is irrespective of whether or not there has been a prior recommendation on the securities in question.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(B)<\/div><div class=\"qtext\"><p>Concerning Standard III(B), Fair Dealing, which of the following statements is CORRECT? The Standard:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "An analyst thinks that a major change in the tax law will benefit holders of utility company stocks. She immediately begins calling all her clients and telling them of the upside potential of investing in such assets now. Based upon this information, this is most likely:", "opts": ["a violation of Standard III(C), Suitability.", "congruent with Standard V(A), Diligence and Reasonable Basis.", "a violation of Standard V(A), Diligence and Reasonable Basis."], "ans": "A", "expl": "According to Standard III(C), the analyst needs to determine the suitability of an investment for each client. It is doubtful that all her clients are identical in their needs. According to the information, the analyst mentions the upside potential but does not mention the downside risk. Although the information says that she thinks that the change in the tax law will benefit holders of utility company stocks and says nothing of how she arrived at this conclusion, we do not know if she has or has not made her decision on a reasonable basis.", "explhtml": "<p>According to Standard III(C), the analyst needs to determine the suitability of an investment for each client. It is doubtful that all her clients are identical in their needs. According to the information, the analyst mentions the upside potential but does not mention the downside risk. Although the information says that she thinks that the change in the tax law will benefit holders of utility company stocks and says nothing of how she arrived at this conclusion, we do not know if she has or has not made her decision on a reasonable basis.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>An analyst thinks that a major change in the tax law will benefit holders of utility company stocks. She immediately begins calling all her clients and telling them o
