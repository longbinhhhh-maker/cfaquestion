<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.5 — Guidance for Standards III(B) and III(C) · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

    border:none;color:#fff}

</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

const DATA = [{"n": 1, "q": "Do QED's policies comply with CFA Institute Standards of Professional Conduct with respect to the information contained within the client IPS' and the frequency with which the information is updated? Information  Frequecy", "opts": ["No Yes", "No No", "Yes No"], "ans": "C", "expl": "According to Standard III(C)—Suitability, members and candidates must consider investment experience, objectives (risk and return), and constraints before investing funds on the client's behalf or recommending investments to the client. The firm has complied with the information content. The investment policy statement must be updated at least annually, or after significant changes in client circumstances, however, according to the guidance statement accompanying Standard III(C). Thus, the firm has not complied with Standard III(C) in this regard.", "explhtml": "<p>According to Standard III(C)—Suitability, members and candidates must consider investment experience, objectives (risk and return), and constraints before investing funds on the client&#x27;s behalf or recommending investments to the client. The firm has complied with the information content. The investment policy statement must be updated at least annually, or after significant changes in client circumstances, however, according to the guidance statement accompanying Standard III(C). Thus, the firm has not complied with Standard III(C) in this regard.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–6<\/summary><div class=\"vig-body\"><p>Chandra Patel, CFA, manages private client portfolios for QED Investment Advisers. Part of QED's firm-wide policy is to adhere to CFA Institute Standards of Professional Conduct in the management of all client portfolios, and to this end, the firm requires that client objectives, investment experience, and financial limitations be clearly established at the outset of the relationship. This information is updated at regular intervals not to exceed eighteen months. The information is maintained in a written investment policy statement (IPS) for each client.<\/p><p>Anarudh Singh has been one of Patel's clients ever since she began managing money ten years ago. Shortly after his regular situational update, Singh calls to inform Patel that his uncle is ill, and it is not known how long he will survive. Singh expects to inherit \"a sizeable sum of money.\" mainly in the form of municipal bonds. His existing portfolio allocation guidelines are for 75% to be invested in bonds. Singh believes that the expected inheritance will allow him to assume a more aggressive investment profile and asks Patel to begin moving toward a 75% allocation to equities. He is specifically interested in opening sizable positions in several technology firms, some of which have only recently become publicly traded companies. Patel agrees to begin making the changes to the portfolio and the next day begins selling bonds from the portfolio and purchasing stocks in the technology sector as well as in other sectors. After placing the trade orders, Patel sends Singh an email to request that he come to her office sometime during the next week to update his IPS. Singh replies to Patel, saying that he can meet with her next Friday.<\/p><p>A few days before the meeting, however, Singh's uncle dies and the portfolio of municipal bonds is transferred to Singh's account with QED. Patel sees this as an opportunity to purchase more technology stocks for the portfolio and suggests taking such action during her meeting with Singh, who agrees. Patel reviews her files on technology companies and locates a report on NetWin. The analyst's recommendation is that this stock is a \"core holding\" in the technology sector. Patel decides to purchase the stock for Singh's account in addition to several other wealthy client accounts with high risk tolerance levels, but due to time constraints she does not review the holdings in each account. Patel does examine the aggregate holdings of the accounts to determine the approximate weight that NetWin should represent in each portfolio.<\/p><p>Since Patel has very recently passed the Level III examination, QED sends a promotional email to all of the firm's clients. The email states that \"QED is proud to announce that Chandra Patel is now a CFA (Chartered Financial Analyst). This distinction, which is the culmination of many years of work and study, is further evidence of the superior performance you've come to expect at QED.\" Patel also places phone calls to several brokers that she uses to place trades for her accounts, stating that she \"passed all three CFA examinations on the first attempt.\" One of the people Patel contacts is Max Spellman, a long-time friend and broker with TradeRight Brokers Inc. Patel uses the opportunity to discuss her exclusive trading agreement with TradeRight for Singh's account.<\/p><p>When ordering trades for Singh's account, Patel's agreement with TradeRight for brokerage services requires her to first offer the trade to TradeRight, and then to another broker if TradeRight declines to take the trade. TradeRight never refuses the trades from any manager's clients. Patel established the relationship with TradeRight because Singh, knowing the firm's fee schedule relative to other brokers, asked her to do so. However, because TradeRight is very expensive and offers only moderate quality of execution, Patel is considering directing trades on Singh's account to BullBroker, which charges lower commissions and generally completes trades sooner than TradeRight.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>Do QED&#x27;s policies comply with CFA Institute Standards of Professional Conduct with respect to the information contained within the client IPS&#x27; and the frequency with which the information is updated? Information &nbsp; Frequecy<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "In light of Singh's comments during his telephone call to Patel prior to his uncle's death, which of the following actions that Patel can take comply with CFA Institute Standards of Professional Conduct?", "opts": ["Patel must adhere to the existing portfolio strategy until she meets with Singh to develop a new portfolio strategy based upon updated financial information, but may place trades which are consistent with the existing strategy.", "Patel may change the current portfolio strategy and begin trading based upon Singh’s expectations because he advised her to do so.", "Patel must not place any trades in the account until she meets with Singh to develop a new portfolio strategy based on the updated information."], "ans": "A", "expl": "According to Standard III(C)—Suitability, Patel must observe the written investment objectives now in effect as determined in cooperation with the client and may trade only on that basis. Because the anticipated change in Singh's financial condition was subject to an event of indeterminable timing, she should continue to honor the existing written investment objectives until a change is warranted by an actual increase in the client's total financial assets and has been agreed upon with her client.", "explhtml": "<p>According to Standard III(C)—Suitability, Patel must observe the written investment objectives now in effect as determined in cooperation with the client and may trade only on that basis. Because the anticipated change in Singh&#x27;s financial condition was subject to an event of indeterminable timing, she should continue to honor the existing written investment objectives until a change is warranted by an actual increase in the client&#x27;s total financial assets and has been agreed upon with her client.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 1–6<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body her meeting with Singh, who agrees. Patel reviews her files on technology companies and locates a report on NetWin. The analyst's recommendation is that this stock is a \"core holding\" in the technology sector. Patel decides to purchase the stock for Singh's account in addition to several other wealthy client accounts with high risk tolerance levels, but due to time constraints she does not review the holdings in each account. Patel does examine the aggregate holdings of the accounts to determine the approximate weight that NetWin should represent in each portfolio.<\/p><p>Since Patel has very recently passed the Level III examination, QED sends a promotional email to all of the firm's clients. The email states that \"QED is proud to announce that Chandra Patel is now a CFA (Chartered Financial Analyst). This distinction, which is the culmination of many years of work and study, is further evidence of the superior performance you've come to expect at QED.\" Patel also places phone calls to several brokers that she uses to place trades for her accounts, stating that she \"passed all three CFA examinations on the first attempt.\" One of the people Patel contacts is Max Spellman, a long-time friend and broker with TradeRight Brokers Inc. Patel uses the opportunity to discuss her exclusive trading agreement with TradeRight for Singh's account.<\/p><p>When ordering trades for Singh's account, Patel's agreement with TradeRight for brokerage services requires her to first offer the trade to TradeRight, and then to another broker if TradeRight declines to take the trade. TradeRight never refuses the trades from any manager's clients. Patel established the relationship with TradeRight because Singh, knowing the firm's fee schedule relative to other brokers, asked her to do so. However, because TradeRight is very expensive and offers only moderate quality of execution, Patel is considering directing trades on Singh's account to BullBroker, which charges lower commissions and generally completes trades sooner than TradeRight.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>In light of Singh&#x27;s comments during his telephone call to Patel prior to his uncle&#x27;s death, which of the following actions that Patel can take comply with CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "According to CFA Institute Standards of Professional Conduct, may Patel reallocate Singh's portfolio toward technology stocks after his Uncle dies, but before the meeting with Singh?", "opts": ["Yes—the total value of the municipal bonds received into the account will be too large relative to the other assets in the portfolio.", "No—Patel and Singh must meet and revise the IPS and portfolio strategy before reallocating.", "No—Patel must wait until the next annual meeting to reallocate."], "ans": "B", "expl": "According to Standard III(C)—Suitability, investment recommendations and actions must be consistent with a client's written objectives and constraints (typically in the form of an IPS). Because Singh's written IPS would not allow the large allocation to technology stocks prior to receiving the inheritance, the IPS must be updated by Singh and Patel prior to taking any actions that deviate from the original IPS. Patel will violate Standard III(C) by reallocating the portfolio before meeting with Singh.", "explhtml": "<p>According to Standard III(C)—Suitability, investment recommendations and actions must be consistent with a client&#x27;s written objectives and constraints (typically in the form of an IPS). Because Singh&#x27;s written IPS would not allow the large allocation to technology stocks prior to receiving the inheritance, the IPS must be updated by Singh and Patel prior to taking any actions that deviate from the original IPS. Patel will violate Standard III(C) by reallocating the portfolio before meeting with Singh.<\/p>", "qhtml": "<details pensive and offers only moderate quality of execution, Patel is considering directing trades on Singh's account to BullBroker, which charges lower commissions and generally completes trades sooner than TradeRight.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41: III(C)<\/div><div class=\"qtext\"><p>According to CFA Institute Standards of Professional Conduct, may Patel reallocate Singh&#x27;s portfolio toward technology stocks after his Uncle dies, but before the meeting with Singh?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Did Patel violate any CFA Institute Standards of Professional Conduct when she purchased the NetWin stock for Singh's portfolio or for the other clients' portfolios? Singh's Other portfolios portfolio", "opts": ["No Yes", "No No", "Yes Yes"], "ans": "C", "expl": "According to Standard III(C)—Suitability, Patel must analyze the appropriateness and suitability of NetWin.com stock on a case-by-case basis before buying it. This will necessarily consider the basic characteristics of the security and how these will affect overall portfolio characteristics relative to the existing investment strategy for each portfolio. Patel has not analyzed the effect that the stock will have on any of the individual portfolios in question and has thus violated the Standard. Patel cannot look at aggregate measures to determine the appropriate weight that the security should represent in the individual portfolios because the portfolios are being managed individually, not in aggregate.", "explhtml": "<p>According to Standard III(C)—Suitability, Patel must analyze the appropriateness and suitability of NetWin.com stock on a case-by-case basis before buying it. This will necessarily consider the basic characteristics of the security and how these will affect overall portfolio characteristics relative to the existing investment strategy for each portfolio. Patel has not analyzed the effect that the stock will have on any of the individual portfolios
