<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

a sequential pay structure.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 2, "q": "Due to adverse losses on a credit card receivable asset-backed security (ABS), the early amortization period was triggered. Which of the following best describes the impact on investors? ", "opts": ["Principal repayment begins", "All cash flows to investors stop", "Only finance charges and fees are paid to investors"], "ans": "A", "expl": "Internal credit enhancements are created by the asset-backed security (ABS) issuer to cover potential cash shortages in servicing the ABS.\nCommon forms of credit enhancement for credit card ABS include:\nExcess spread account\nOvercollateralization\nSequential pay structure\nEarly amortization period\nThe early amortization enhancement results from the use of a lockout period which, in turn, is used to prevent the ABS being paid off before its\nscheduled maturity. The collateral backing the ABS decreases as cardholders pay off their credit card balances.\nDuring the lockout period, principal payments are used to acquire additional receivables.\nOnce the lockout period expires, principal payments are applied toward retiring the ABS at maturity.\nHowever, during the lockout period, if losses or events (eg, credit losses, issuer merger) threaten investors' returns, the early amortization period\ncan be triggered and principal payments will begin (Choices B and C). This insulates investors from potential credit losses regardless of the\nlockout period. The early amortization feature is the only way the principal cash flow schedule of the ABS can be modified and is a unique\nfeature of credit card receivable ABS.\nThings to remember:\nIf the early amortization period is triggered, principal payments are initiated to insulate investors from potential credit losses. The triggering of the\nearly amortization feature is the only way the principal cash flow schedule can be modified and is a unique investor protection feature of credit\ncard receivable asset-backed securities.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 3, "q": "If a collateralized debt obligation provision is triggered, requiring the return of principal to the senior tranche, the most likely cause for the trigger is the failure: ", "opts": ["of prespecified risk tests.", "to return principal to the equity tranche investors.", "to earn a return higher than the costs of issuing the bonds."], "ans": "A", "expl": "Collateralized debt obligations (CDOs) are a type of asset securitization similar to asset-backed securities (ABS). Sponsors of both CDOs and\nABS create special purpose entities that issue multiple tranches (ie, different classes) of bonds to raise funds. The funds pay for assets that\nbecome the collateral (ie, asset portfolio) for the CDO. The cash flow from the collateral is used to make distributions to investors.\nCDO collateral can include different types of assets with varying degrees of credit risk and rates of return (eg, commercial mortgage loans,\ncorporate debt, credit default swaps). ABS usually are collateralized by a specific type of loan (eg, auto, credit cards).\nLeveraged CDOs are structured like a waterfall, with several tranches of different seniority, including an equity tranche. The CDO manager\nuses funds raised for investment to construct an asset portfolio designed to earn a return that is sufficient to:\n1. pay bondholders the bond's interest and principal, in order of seniority,\n2. then pay investors in the equity tranche, and\n3. only then pay the CDO manager.\nThis structure typically includes restrictions known as prespecified risk tests (eg, maintain agreed-upon levels of coverage ratios, collateral\nquality) to ensure adequate cash flows for the senior tranche. If the CDO fails any of the prespecified risk tests, a provision is triggered that\nrequires principal payments to be redirected from junior classes to the senior class until the CDO is back in compliance with the tests.\nFailure to earn a return higher than the cost of issuing bonds is determined by the return on the investments made by the CDO manager.\nSuch a failure lowers the CDO manager's compensation; it can also affect the return to the equity tranche of the CDO. However, these\ncircumstances can occur without triggering the prespecified risk tests or affecting the senior tranche (Choices B and C).\nThings to remember:\nCollateralized debt obligations (CDOs) are structured like a waterfall, with several tranches of different seniority, including an equity tranche.\nThese structures include prespecified risk tests to protect the senior tranche. If a CDO fails any of the tests, then all principal is directed to the\nsenior tranche until the CDO structure is back in compliance.\nDescribe collateralized debt obligations, including their cash flows and risks\n4.An arbitrage collateralized debt obligation (CDO) holding a portfolio of fixed coupon bonds is funded in part by a floating rate senior tranche.\nThe interest rate mismatch of fixed rate collateral versus a floating rate tranche is:\nA. the CDO sponsor's risk-free profit.\nB. an excess spread used to fund a cash reserve.\n\nC. hedged with a fixed-for-floating interest rate swap.\nExplanation\nCollateralized debt obligations (CDOs) are a type of asset securitization that has some similarities to asset-backed securities (ABS). Sponsors\nof both CDOs and ABS create special purpose entities (SPEs) that issue multiple tranches (ie, different classes of securities) to raise funds. The\nfunds raised pay for the assets comprising the collateral (ie, asset portfolio). The cash flow from the collateral is used to make distributions to\ninvestors.\nMany CDOs have asset/liability interest rate mismatches. Senior tranches (eg, CDO liabilities) usually pay floating rates, and the collateral is\noften a portfolio of fixed-rate bonds (eg, CDO assets). Large interest rate increases could cause the interest owed on the senior tranche to be\ngreater than collateral interest income. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\n(Choice A) Arbitrage CDO is a name given to certain transactions, but they are not riskless strategies, so a risk-free profit is not earned by the\nsponsor.\n(Choice B) An excess spread is the difference between the interest earned on the asset portfolio and the interest owed on the tranches. There is\nno excess spread in a CDO since any interest above the amount owed on the debt tranches is distributed to the equity tranche.\nThings to remember:\nCollateralized debt obligations (CDOs) often have an interest rate mismatch: senior tranches that pay floating interest rates versus an asset\nportfolio of fixed-rate bonds. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 4, "q": "An arbitrage collateralized debt obligation (CDO) holding a portfolio of fixed coupon bonds is funded in part by a floating rate senior tranche. The interest rate mismatch of fixed rate collateral versus a floating rate tranche is:", "opts": ["the CDO sponsor's risk-free profit.", "an excess spread used to fund a cash reserve.", "hedged with a fixed-for-floating interest rate swap."], "ans": "C", "expl": "Collateralized debt obligations (CDOs) are a type of asset securitization that has some similarities to asset-backed securities (ABS). Sponsors\nof both CDOs and ABS create special purpose entities (SPEs) that issue multiple tranches (ie, different classes of securities) to raise funds. The\nfunds raised pay for the assets comprising the collateral (ie, asset portfolio). The cash flow from the collateral is used to make distributions to\ninvestors.\nMany CDOs have asset/liability interest rate mismatches. Senior tranches (eg, CDO liabilities) usually pay floating rates, and the collateral is\noften a portfolio of fixed-rate bonds (eg, CDO assets). Large interest rate increases could cause the interest owed on the senior tranche to be\ngreater than collateral interest income. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\n(Choice A) Arbitrage CDO is a name given to certain transactions, but they are not riskless strategies, so a risk-free profit is not earned by the\nsponsor.\n(Choice B) An excess spread is the difference between the interest earned on the asset portfolio and the interest owed on the tranches. There is\nno excess spread in a CDO since any interest above the amount owed on the debt tranches is distributed to the equity tranche.\nThings to remember:\nCollateralized debt obligations (CDOs) often have an interest rate mismatch: senior tranches that pay floating interest rates versus an asset\nportfolio of fixed-rate bonds. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 5, "q": "During the lockout period for asset-backed securities (ABS) secured by credit card receivables, payments made by cardholders on the credit card debt balances are most likely used to:", "opts": ["establish a reserve fund to cover future defaults by cardholders.", "purchase additional credit card receivables to replace collateral that was paid off.", "reimburse the ABS issuer for any principal and/or interest it advanced to investors."], "ans": "B", "expl": "Credit card receivables can be used as collateral for asset-backed securities (ABS). Cash flows used to pay principal and interest on the ABS\ncome from two sources:\nPrincipal payments made by cardholders on their credit card debt\nInterest on outstanding card balances and other charges imposed by the credit card issuer\nAs cardholders pay off their credit card balances, the collateral backing the ABS decreases. To prevent the possibility of the ABS being paid off\nbefore its scheduled maturity, credit card ABS often include one or more lockout periods.\nDuring a lockout period, the ABS investors receive only the interest and late charges collected from cardholders, not payments on principal.\nThe ABS issuer uses principal payments to purchase additional receivables to replace the collateral that was paid off. When the lockout period\nends, the issuer resumes distributing all payments to the ABS investors.\n(Choice A) A reserve fund can be used to pay ABS investors if the securitized assets default, but it is not used to purchase additional collateral.\n(Choice C) Reimbursing an issuer for advances of interest and/or principal is unrelated to a lockout period.\nThings to remember:\nA lockout period is when the asset-backed securities (ABS) issuer uses payments made on the credit card debt principal to purchase additional\nreceivables, which replace the ABS's collateral that was paid off. During the lockout period, ABS investors receive interest payments made on\noutstanding credit card debt, and other charges imposed by the credit card company on cardholders.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 6, "q": "In a falling interest rate environment, an auto loan asset-backed security (ABS) most likely exposes an investor to:", "opts": ["balloon risk.", "extension risk.", "contraction risk."], "ans": "C", "expl": "Auto loan asset-backed securities: prepayment dynamics\nAmortizing auto loans and leases\nSecuritized by\nNonrecourse loans\nChanges in interest rates\nEarly loan payoff\nVehicle ownership change\nSubject to prepayment risk due to\nSales and trade-ins\nRepossessions and resale\nInsurance proceeds for destroyed autos\nAuto loan asset-backed securities (ABS) are securitized by amortizing, nonrecourse loans, which are prone to prepayments. Prepayment risk is\nnormally associated with changing interest rates, but auto loan ABS are also impacted by other factors. There are two forms of prepayment risk:\ncontraction risk and extension risk.\nContraction risk is most acute when interest rates fall and lead to refinancing (eg, mortgage, auto loan), which pay loans off early. More\nprepayments than expected shorten the life of the ABS, resulting in a reduction in the final maturity.\nExtension risk occurs when interest rates increase; higher rates result in slower prepayments than expected and lengthen the security's\nlife (Choice B).\nAuto loan ABSs have other elements that affect the speed of prepayments not directly tied to interest rates, which exposes investors to more\ncontraction risk.\nExamples include:\nborrowers who choose to pay the loan early\nsales and trade-ins\nrepossessions and resales\ninsurance proceeds for destroyed vehicles\n(Choice A) Balloon risk refers to a risk of partially amortizing and interest-only loans that have balloon payments due at the end of the loan.\nBalloon payments are unusual for auto loans and therefore are not a risk for holders of auto loan ABS.\nThings to remember:\nAuto loan asset-backed securities (ABS) are subject to contraction risk when more prepayments than expected shorten the maturity of the ABS.\nFalling interest rates play a large role when loans are refinanced, but other factors (eg, early loan payoff, sales, trade-ins, repossession, resale,\ninsurance proceeds for destroyed vehicles) also have impacts.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 7, "q": "Credit card receivable asset-backed securities (ABS) are not subject to contraction risk since the underlying pool of loans is most likely:", "opts": ["amortizing.", "non-amortizing.", "partially amortizing."], "ans": "B", "expl": "Credit card receivable asset-backed securities (ABS) have underlying collateral made up of credit card accounts (ie, consumer loans) that have\nbalances that:\nvary widely (eg, $0 or $20,000) and\nmay increase or decrease over the duration of the ABS.\nSince they do not have a fixed principal repayment schedule, the loans are non-amortizing. When non-amortizing loans serve as ABS collateral,\nthe collateral (and therefore the ABS) is not subject to the prepayment risks of contraction and extension.\nIn contrast, other kinds of ABS (eg, auto loans, home loans) may be backed by loans (ie, amortizing, partially amortizing) that require regular\nprincipal payments and are subject to prepayment risks (Choices A and C).\nThings to remember:\nCredit card receivable asset-backed securities (ABS) are collateralized by non-amortizing loans; therefore, they are not subject to the prepayment\nrisks of contraction and extension. In contrast, other kinds of ABS may be backed by loans (ie, amortizing, partially amortizing) that require regular\nprincipal payments and are subject to prepayment risks.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 8, "q": "If covered bondholders do not receive payments as scheduled and the bond has a soft-bullet redemption regime, the bond default is most likely:", "opts": ["delayed, and final maturity is extended.", "triggered, and bond payments are accelerated.", "delayed, and the bond converts to a pass-through structure."], "ans": "A", "expl": "Covered bond redemption regimes\nIf fund sponsor defaults:\nHard bullet Default triggered; payments accelerate\nSoft bullet Default delayed; final maturity date extended\nConditional pass- Pass-through mode triggered only if bonds are not retired at\nthrough original maturity date\nA type of asset-backed security (ABS), a covered bond is secured by collateral consisting of a pool of loans (eg, auto loans, home mortgages).\nInterest and principal payments on ABS depend exclusively on the timely payment of the interest and principal on the underlying loans.\nUnlike other ABS, covered bonds offer an additional layer of protection since bondholders have dual recourse, which allows a claim on both the\nissuer and the cover pool (ie, underlying pool of loans). Other kinds of ABS are typically issued by a special purpose entity so that the issuer\nremains bankruptcy remote.\nIf payments on covered bonds are not received as scheduled, stipulations in the issuing documents (ie, loan covenants) called redemption\nregimes determine how the bonds are impacted. The three types of covered bond redemption regimes are as follows:\nHard bullet: Bond default is triggered and all payments are due immediately. This is the typical treatment for bonds of all types in the event\nof issuer default (Choice B).\nSoft bullet: Bond default is delayed and payments continue on the original schedule. The issuer's failure to pay does not trigger default\nsince the maturity date is extended (eg, to 12 months). A failure to pay principal and interest on the new, extended maturity date will\ntrigger default.\nConditional pass-through: Bond default is not triggered and payments continue on the original schedule. If payments are not fully\nsatisfied at maturity (ie, conditional), the bond is converted to pass-through mode, in which payments are funneled directly from the\nunderlying pool to bondholders until the original expected cash flow payments are met (Choice C).\nThings to remember:\nA covered bond is a type of asset-backed security. Covered bonds may have hard-bullet, soft-bullet, or conditional pass-through redemption\nregimes.\nDescribe characteristics and risks of covered bonds and how they differ from other asset-backed securities", "qhtml": null}, {"n": 9, "q": "A mortgage-backed securities (MBS) issuer is concerned that interest rates will soon fall, so it structures tranches with various maturities to mitigate prepayment risk. This most likely describes: ", "opts": ["time tranching.", "credit tranching.", "floating-rate tranching."], "ans": "A", "expl": "Time tranching example\nTranche Average life (years)\nA 5.2\nB 12\nC 16\nD 22\nMortgage-backed securities (MBS) are bonds created by bundling residential or commercial mortgage loans. The principal repayments and\ninterest provide cash flow to MBS investors. To attract investors with different levels of risk tolerance or time preferences, MBS may be structured\nas multiple classes or tranches, which create different cash flows and therefore risk exposures for investors.\nOne risk borne by MBS investors is prepayment risk. When interest rates fall, borrowers may accelerate repayment of principal, either in part or in\nfull. This phenomenon (ie, contraction risk) reduces the maturity of the MBS and future cash flows to investors.\nTo mitigate prepayment risk for certain MBS investors, issuers structure different bond classes with different maturities. Known as time tranching,\nthis redistributes prepayment risk by allocating all principal payments, including all prepayments, to the tranches with shorter expected\nmaturities first. Once the shorter-lived tranches are retired, the principal payments are allocated to tranches with longer expected maturities.\n(Choice B) Credit tranching addresses default risk, which refers to the possibility that the borrowers of loans serving as collateral may default,\neither in part or in full.\n(Choice C) Floating-rate tranches are created by combining fix-rated collateral with floating-rate instruments. Floating-rate tranches are not\ndesigned to mitigate prepayment risk.\nThings to remember:\nMortgage-backed securities (MBS) issuers structure different bond classes with different maturities (ie, time tranching) to mitigate prepayment risk\nfor certain MBS investors. Time tranching redistributes prepayment risk by allocating all principal payments, including all prepayments, to the\ntranches with shorter expected maturities first.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}, {"n": 10, "q": "In securitizations that create residential mortgage-backed securities (RMBS), credit tranching most likely refers to multiple classes of bonds that offer unequal: ", "opts": ["default risk.", "extension risk.", "contraction risk."], "ans": "A", "expl": "Asset-backed securities are bonds created from securitizing cash-generating assets, such as residential mortgages or credit card receivables.\nAs the schematic above shows, the assets are bundled and sold to a special purpose entity (SPE) that uses them as collateral for bonds. The\ncash flows from the loans pay the bonds' interest and principal. Residential mortgage-backed securities (RMBS) are a type of ABS.\nOne type of risk that RMBS present to bondholders is default risk. This refers to the possibility that borrowers of the loans serving as collateral\ndefault, either in full or in part. Since the cash flows from the collateral are the primary source of payments for the bonds, defaults can\nsignificantly impact the bondholders' expected returns.\nSome securitization structures attempt to mitigate the risk of defaults through credit tranching. Instead of issuing only one class of bonds from\nthe securitization, a credit-tranched structure uses multiple classes. Subordinate classes are the first to absorb losses caused by defaults in the\ncollateral, which shields senior classes from some default risk.\n(Choices B and C) Extension risk and contraction risk are two types of prepayment risks. Securitizations may offer different classes of bonds\nthat allow investors to determine how much prepayment risk they want to be exposed to; this is known as time tranching.\nThings to remember:\nInvestors in mortgage-backed securities (MBS) are exposed to the risk that the borrowers for the loans that serve as the MBS collateral may\ndefault. A securitization structure that creates different classes of bonds that allocate default losses differently is known as credit tranching.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}, {"n": 11, "q": "Which of the following instruments is least likely to have loans as its collateral?", "opts": ["Credit card asset-backed security", "Nonagency residential mortgage-backed security", "Sequential-pay collateralized mortgage obligation"], "ans": "C", "expl": "Collateral for asset-backed securities (ABS)\nABS Typical collateral\nResidential mortgage-backed securities (RMBS) Residential mortgage loans\nCollateralized mortgage obligations (CMO) Mortgage-related products (eg, RMBS)\nCommercial mortgage-backed securities (CMBS) Commercial mortgage loans\nCollateralized debt obligations (CDO) Loans, other ABS, structured securities\nNon-mortgage asset-backed securities (ABS) Credit card loans, auto loans\nSecuritized debt instruments, broadly known as asset-backed securities (ABS), are created using collateral which is sold to a special purpose\nentity (SPE). The SPE then sells bonds backed by the collateral. As shown in the table above, there are different types of ABS, which have\ndifferent forms of collateral.\nResidential mortgage-backed securities (RMBS) are bonds that are securitized by pools of residential mortgage loans. Agency RMBS are issued\nand typically guaranteed by a sovereign government or one of its agencies. A nonagency RMBS is issued by a private entity and has no\ngovernment guarantee.\nThe collateral for agency and nonagency RMBS consists of residential mortgage loans (Choice B). Credit card receivables, which are unsecured\nloans, are the collateral for credit card ABS (Choice A).\nA collateralized mortgage obligation (CMO) is similar to a residential mortgage-backed security except that the collateral is one or more ABS\ninstead of actual loans. A typical CMO is structured with multiple tranches of bonds. Payments on the loans that secure the ABS are then\ndistributed to the CMO investors. A sequential-pay CMO is designed so that each tranche is retired in order of seniority; only the most senior\ntranche then existing receives principal payments until that tranche has been retired.\nThings to remember:\nAsset-backed securities (ABS) are collateralized bonds. The collateral varies with each type of ABS. Residential mortgage-backed securities and\ncredit card ABS are collateralized with loans. Collateralized mortgage obligations are generally collateralized with other ABS, not with actual\nloans.\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 12, "q": "A key distinction regarding collateral of a covered bond compared to other types of asset-backed securities is:", "opts": ["only covered bonds are overcollateralized.", "a covered bond's collateral remains on the issuer's balance sheet.", "the issuer of a covered bond does not substitute for defaulted collateral."], "ans": "B", "expl": "Covered bonds vs. other asset-backed securities (ABS)\nCovered bonds Other ABS\nAssets transferred to special entity\nAssets remain on issuer's balance sheet\nInvestors exposed to credit risk if collateral\nIssuer replaces nonperforming collateral\ndefaults\nA covered bond is a type of asset-backed security (ABS) secured by collateral consisting of pools of loans (eg, auto loans, home mortgages).\nInterest and principal payments on an ABS depend on timely payment of the interest and principal on the underlying loans. If the underlying loans\ndefault, the ABS investors risk not receiving interest and principal.\nMost ABS issues have a general structure in which the collateral is transferred to a special-purpose entity that becomes the security's legal issuer.\nBond indentures (ie, contracts governing the rights and obligations of the issuer and bondholders) typically allow bondholders to seek payment\nfrom the special entity if the ABS defaults. This can limit recovery since, in most cases, the special entity has no assets other than the ABS\ncollateral.\nCovered bonds mitigate bondholders' risk in two ways (ie, dual recourse). First, collateral remains on the issuer's balance sheet instead of\nbeing transferred to a special entity; this gives investors in a covered bond direct recourse against the issuer. Second, if the covered bond's\ncollateral is in default, the issuer must replace it with good collateral; this replacement feature is not commonly used in other types of ABS.\n(Choice A) Overcollateralization is an internal credit enhancement in which the issuer pledges collateral worth more than the bond's principal. It\ncan be used with all types of bonds, not just covered bonds.\n(Choice C) Covered bonds do use collateral substitution to protect bondholders against losses from collateral default.\nThings to remember:\nA covered bond is a type of asset-backed security (ABS). It differs from most types of ABS in that the security's collateral remains on the issuer's\nbalance sheet and the issuer commits to substitute defaulted collateral with good collateral.\nDescribe characteristics and risks of covered bonds and how they differ from other asset-backed securities", "qhtml": null}, {"n": 13, "q": "For asset securitization, credit tranching is most likely used:", "opts": ["as a waterfall structure.", "for mitigation of prepayment risk.", "as a method of overcollateralization."], "ans": "A", "expl": "Bond credit enhancements and uses\nEnhancement Use\nSubordination Senior tranches have priority over junior tranches\nInternal Overcollateralization Issuer pledges assets worth more than the amount borrowed\nReserve accounts Excess cash received from financed asset deposited in a separate account\nSurety bonds Payment guarantees issued by insurance companies\nExternal Letters of credit Guarantees from financial institutions other than insurance companies\nCash collateral accounts Cash deposited by guarantor that issuer can borrow\nThe process of securitizing pooled assets provides investors the opportunity to invest in tailored risk exposures and specified rates of returns.\nInvestors' exposure to credit risk is reduced with enhancements, or features designed to redistribute risk by absorbing or reallocating potential\nlosses.\nA common feature is credit tranching, in which pooled assets are segmented into tranches and each tranche is issued as a separate security,\nrepresenting a different priority claim on the security's cash flows. Losses are allocated to tranches in a predetermined manner, with lower-rated\ntranches absorbing losses first. This structure is primarily used to shield investors in more senior tranches from default risk. It is also known\nas a waterfall structure due to how payments are allocated across tranches.\n(Choice B) Time tranching, not credit tranching, is primarily used to mitigate prepayment risk since it relies on segmenting the asset pool by using\nsecurities with different maturities.\n(Choice C) Overcollateralization may be used in addition to credit tranching. Generally, absorbed losses need to first exhaust the full amount of\novercollateralization before the credit tranching structure applies.\nThings to remember:\nCredit tranching (ie, waterfall structure) is a type of enhancement used to protect investors from default risk. A waterfall structure allocates losses\nto lower-rated tranches first, thus shielding investors in more senior tranches from default risk.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}];
const CFG = {"title": "Wiley · Asset-Backed Security (ABS) Instrument and Market Features", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 13 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
