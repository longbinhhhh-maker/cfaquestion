<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An analyst compiles the following common-sized cash flow statements as a percentage of revenue for a company: 20X4 20X5 Net income 9.0% 11.1% Depreciation and amortization 5.0% 6.7% Changes in operating assets and liabilities −5.5% −7.2% Cash flow from operations 8.5% 10.6% Purchase of equipment −5.0% −6.7% Cash flow from investing −5.0% −6.7% Issuance of debt 6.0% 2.2% Repayment of debt −6.0% −1.7% Dividend payments −1.5% −1.7% Cash flow from financing −1.5% −1.1% Net change in cash 2.0% 2.8% Cash paid for interest 2.5% 2.2% The company had total revenue of MXN 1,000 million in 20X4, MXN 900 million in 20X5, and a tax rate of 20% for both years. The analyst's most appropriate conclusion is that the company is:", "opts": ["increasing its free cash flow to equity.", "growing its dividend in line with net income.", "expanding its net investments in equipment."], "ans": "A", "expl": "Common-size cash flow statements display each statement item either as a percentage of revenue or as a percentage of the company's total\ncash inflows or outflows. This allows analysts to compare the receipts and expenditures for companies of different sizes or for one company\nover time.\nIn this scenario, the common-size cash flow statement indicates that the company's free cash flow to equity (FCFE) as a percentage of revenue\nincreased between 20X4 and 20X5:\nfrom 3.5% (= 9% + 5% − 5.5% − 5% + 6% − 6%) in 20X4\nto 4.4% (= 11.1% + 6.7% −7.2% − 6.7% + 2.2% − 1.7%) in 20X5.\nThis equates to FCFE of MXN 35 million in 20X4 (= 1,000 × 0.035) and MXN 40 million in 20X5 (= 900 × 0.044).\nNote: After-tax cash paid for interest is used in the calculation of free cash flow to the firm (FCFF), not FCFE.\nThings to remember:\nCommon-size cash flow statements can present each item on the cash flow statement as a percentage of revenue. They allow analysts to\ncompare the receipts and expenditures that contribute to cash generation for companies of different sizes or for one company over time.\nAnalyze and interpret both reported and common-size cash flow statements", "qhtml": null}, {"n": 2, "q": "A company reports the following information: Cash flow item KRW millions Net income 660 Depreciation and amortization expense −260 Interest expense −40 Working capital expenditures −120 Capital expenditures −200 Proceeds from long-term debt 535 Repayments of long-term debt −500 If the company has a 25% tax rate, which of the following cash flow measures is greatest?", "opts": ["Free cash flow", "Free cash flow to equity", "Free cash flow to the firm"], "ans": "B", "expl": "Free cash flow (FCF) determines how much excess cash a company generates from its operations after covering its capital expenditures.\nFCF may be used in various ways (eg, reinvesting in the company's business, paying dividends, repaying debt). An analyst can calculate this\ncash flow's value to the company's suppliers of debt and equity capital (ie, free cash flow to the firm [FCFF]) or to only equity shareholders (ie, free\ncash flow to equity [FCFE]) by adjusting for cash items available to those groups.\nFCFF adds back after-tax interest payments since it includes suppliers of debt capital, and interest payments are paid to the company's\ndebtholders. Since FCFE is available to a company's equity shareholders, it adds back the net borrowing (ie. net change in debt). Companies\nmay use any additions to debt for the benefit of equity shareholders through dividend payments or share repurchases.\nFCF = NI + NCC − ΔWC − ΔFC\n= 660 + 260 − 120 − 200 = 600\nFCFE = NI + NCC − ΔWC − ΔFC + Net borrowing\n= FCF + Net borrowing\n= 600 + (535 − 500) = 635\nFCFF = NI + NCC − ΔWC − ΔFC + Int (1 − t)\n= FCF + Int (1 − t)\n= 600 + 40 (1 − 0.25) = 630\nIn this scenario, the largest measure of FCF is the company's FCFE, which is supported by KRW 40 million in net borrowing (Choices A and C).\nThings to remember:\nFree cash flow determines how much excess cash a company generates after covering its capital expenditures. An analyst can calculate this\ncash flow's value to the company's suppliers of debt and equity capital or to only equity shareholders by adjusting for cash items available to those\ngroups.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios\n3.An analyst gathers the following data on a company:\nThe company's tax rate is 25% and current year's free cash flow to the firm (FCFF) is SGD 196 million. Based only on this information, free cash\nflow to equity (FCFE) for the current year is closest to:\n A. SGD 176 million.\nB. SGD 181 million.\nC. SGD 191 million.\nExplanation\nFree cash flow metrics are commonly used in asset valuation and financial analysis. Free cash flow to the firm (FCFF) is the cash flow available\nto debt and equity providers after subtracting operating expenses and investments in fixed and working capital. Free cash flow to equity (FCFE) is\nthe cash flow available to equity providers (shareholders), which is FCFF adjusted for interest payments and any changes in debt from principal\nreduction and/or new borrowing.\nSince FCFF (196) is given in this question, start with FCFF, subtract the after-tax cost of interest, and then subtract the reduction in debt principal\nto obtain FCFE.\n(Choice B) SGD 181 million results from not including change in debt in the equation.\n(Choice C) SGD 191 million results from not subtracting the after-tax interest expense.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash flow available to equity providers (shareholders), which is the free cash flow to the firm (FCFF)\nadjusted for interest payments and any changes in debt from principal reduction and/or new borrowing.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 3, "q": "An analyst gathers the following data on a company: The company's tax rate is 25% and current year's free cash flow to the firm (FCFF) is SGD 196 million. Based only on this information, free cash flow to equity (FCFE) for the current year is closest to:", "opts": ["SGD 176 million.", "SGD 181 million.", "SGD 191 million."], "ans": "A", "expl": "Free cash flow metrics are commonly used in asset valuation and financial analysis. Free cash flow to the firm (FCFF) is the cash flow available\nto debt and equity providers after subtracting operating expenses and investments in fixed and working capital. Free cash flow to equity (FCFE) is\nthe cash flow available to equity providers (shareholders), which is FCFF adjusted for interest payments and any changes in debt from principal\nreduction and/or new borrowing.\nSince FCFF (196) is given in this question, start with FCFF, subtract the after-tax cost of interest, and then subtract the reduction in debt principal\nto obtain FCFE.\n(Choice B) SGD 181 million results from not including change in debt in the equation.\n(Choice C) SGD 191 million results from not subtracting the after-tax interest expense.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash flow available to equity providers (shareholders), which is the free cash flow to the firm (FCFF)\nadjusted for interest payments and any changes in debt from principal reduction and/or new borrowing.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 4, "q": "An analyst has compiled the following information for a company's latest fiscal year: $ millions Net income 39.0 Depreciation 15.0 Interest expense 6.0 Tax expense 13.0 Pretax income 52.0 In the same period, the company also purchased machinery for $10 million. Cash from operations (CFO) for the period was $14.5 million. If the company reports under US GAAP, the free cash flow to the firm (FCFF) is closest to:", "opts": ["$4.5 million", "$9.0 million", "$29.0 million"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) measures the cash available for the company's lenders and shareholders after the company has paid its\noperating expenses and made necessary investments in both long-term assets and working capital. The table below shows how to calculate\nFCFF:\nNot all variables are given in this question, so it is important to know how to use what is given to calculate the unknown quantities. For example,\ninterest expense is calculated on an after-tax basis, but when the tax rate is not provided it must be derived from dividing tax expense by pre-tax\nincome.\nAlso, the question provides no information on changes in short-term assets or short-term liabilities. However, such information is unnecessary if\ncash from operations (CFO) is known since changes in short-term assets and liabilities are used to calculate CFO. Similarly, noncash expenses\nare added back to net income to derive CFO, so the depreciation expense is irrelevant when CFO is known.\nWhen CFO is known, the above table simplifies to:\nInserting numbers results in:\n(Choice A) Although CFO encompasses interest expense, FCFF represents cash that is potentially available to lenders and shareholders. One\nassumption of FCFF is that neither lenders nor shareholders have priority in receiving available cash, so after-tax interest must be added back to\nCFO.\n(Choice C) This answer adds the long-term asset investment instead of subtracting it. FCFF is not the total cash that is available to the lenders\nand shareholders. Returning all its cash without making investments in machinery will eventually result in the firm's closure.\n5.This year, a company has\n£30 million in cash from operations (CFO),\n£6 million in after-tax interest expense that it treats as cash from financing (CFF),\n£2 million in interest received from other companies' bonds that it previously purchased, which it treats as cash from investing (CFI), and\n£15 million in capital expenditures.\nUnder IFRS, the company's free cash flow to the firm (FCFF) is closest to:\nA. £15 million\n\nB. £17 million\nC. £19 million\nExplanation\nFree cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 5, "q": "This year, a company has £30 million in cash from operations (CFO), £6 million in after-tax interest expense that it treats as cash from financing (CFF), £2 million in interest received from other companies' bonds that it previously purchased, which it treats as cash from investing (CFI), and £15 million in capital expenditures. Under IFRS, the company's free cash flow to the firm (FCFF) is closest to:", "opts": ["£15 million", "£17 million", "£19 million"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 6, "q": "A company reports the following information: MXN millions Prior Year Current Year Net income 550 600 Depreciation 75 90 Interest expense 100 100 Net working capital 200 220 Long-term debt 750 780 The company's tax rate is 30%. If capital expenditures for the year are MXN 300 million, then free cash flow to equity for the current year (in MXN millions) is closest to:", "opts": ["370", "400", "440"], "ans": "B", "expl": "Free cash flow to equity (FCFE) represents the remaining cash available to shareholders after making investments in working capital, fixed\ncapital (ie, property plant and equipment), and servicing debt. Companies may use FCFE to pay dividends to shareholders or buy back shares.\nIn this scenario, take the following steps:\nBegin with net income (600 million), an accrued figure that includes noncash components\nAdd back depreciation (90 million) since it is a noncash expense\nSubtract the investments in net working capital (20 million) (eg, accounts receivable, accounts payable, inventory) and fixed capital (300\nmillion) that are required to sustain operations\nAdd the change in net debt (an increase of 30 million) to reflect additional cash from net borrowing\nThis results in FCFE of MXN 400 million, which may be used to pay dividends to shareholders or to buy back shares.\n(Choice A) MXN 370 million results from failing to include changes to debt.\n(Choice C) MXN 440 million is the free cash flow to the firm (FCFF). The calculation for FCFF involves adding back after-tax interest expense\nand excluding changes to debt.\nThings to remember:\nFree cash flow to equity is the cash flow available to equity providers (ie, shareholders) after accounting for investments in fixed capital, working\ncapital, and changes in debt.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 7, "q": "An analyst has gathered the following information for a company's fiscal year 20X9: Based only on this information, under US GAAP, the company's interest coverage ratio is closest to:", "opts": ["3.6", "5.6", "5.9"], "ans": "B", "expl": "The interest coverage ratio, one of the tools used to determine a company's ability to service its debt, is a measure of firm solvency. It is\nusually calculated (using the income statement) as the ratio of EBIT to interest expense.\nWhen using a cash flow statement prepared under US GAAP, the interest coverage ratio is CFO plus back interest and taxes paid (similar to EBIT)\ndivided by interest paid. Adding back interest and taxes paid is necessary since net income (ie, net of interest and tax expense) is the starting\npoint for operating cash flow.\nUnder IFRS, if interest paid is classified as a financing activity, that portion of interest paid should not be added back to the numerator to determine\ninterest coverage.\n(Choice A) 3.6 times coverage is the result if interest paid is subtracted from the numerator.\n(Choice C) 5.9 times coverage is the result if all cash flow metrics (ie, CFO, cash flow from investing [CFI], cash flow from financing [CFF]) are\nincluded in the numerator.\nThings to remember:\nThe interest coverage ratio is calculated using the income or cash flow statement. When using a cash flow statement prepared under US GAAP,\nthe interest coverage ratio is CFO plus back interest and taxes paid divided by interest paid.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 8, "q": "A consultant gathers the following data on a company: If the company's tax rate is 20% and current year capital expenditures were BRL 60 million, then free cash flow to the firm (in BRL millions) for the current year is closest to:", "opts": ["540", "550", "560"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash flow available to capital providers (ie, lenders and shareholders) after subtracting operating expenses\nand investments in fixed and working capital. FCFF is commonly used in asset valuation and financial analysis.\nTo calculate FCFF, start with net income, add depreciation and after-tax interest expense, and then subtract capital expenditures and investments\nin working capital.\n(Choice A) 540 is free cash flow to equity (FCFE). FCFE equals FCFF minus after-tax interest expense and change in debt.\n(Choice C) 560 results from not tax-adjusting the interest expense by one minus the tax rate. For FCFF purposes, the after-tax interest expense\nis added back to net income since borrowers benefit from a tax-shield.\nThings to remember:\nFree cash flow to the firm (FCFF) is the cash flow available to capital providers (lenders and shareholders) after subtracting operating expenses\nand investments in fixed and working capital. To calculate FCFF, start with net income, add depreciation and after-tax interest expense, and then\nsubtract capital expenditures and investments in working capital.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null}, {"n": 9, "q": "An analyst reviews the following common-sized cash flow statement: Which of the following best describes the impact on net cash provided by operating activities? ", "opts": ["The increase in inventory decreases cash flow", "The decrease in accounts payable increases cash flow", "The decrease in accounts receivable decreases cash flow"], "ans": "A", "expl": "Common-sized cash flow statements may be reported as a percentage of net revenue. Increases in assets indicate a use of cash and are\nshown as negative numbers on a common-sized cash flow statement; decreases are shown as positive figures. In this question, inventory is\nincreasing, so it decreases cash flow and is shown as a negative percentage of net revenue. Increases in liabilities suggest a source of cash.\nIncreases in liabilities are shown as positive figures and decreases as negative figures on common-sized statements of cash flow.\n(Choice B) Accounts payable increases when a company purchases assets on credit and decreases as the company pays off those assets. It is\nthe increase, not the decrease, in accounts payable that increases cash flow.\n(Choice C) Accounts receivable increases when a company extends credit to customers and decreases when the company collects cash from\nthem. It is the increase, not the decrease, in accounts receivable that decreases cash flow.\nThings to remember:\nCommon-sized cash flow statements may be expressed as a percentage of net revenue. Increases in assets indicate a use of cash and are\npresented as negative figures. Increases in liabilities suggest a source of cash and are shown as positive figures.\nAnalyze and interpret both reported and common-size cash flow statements", "qhtml": null}];
const CFG = {"title": "Wiley · Analyzing Statements of Cash Flows II", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Financial Statement Analysis · 9 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
