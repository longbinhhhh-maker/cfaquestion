<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>

 interest payments since it includes suppliers of debt capital, and interest payments are paid to the company's\ndebtholders. Since FCFE is available to a company's equity shareholders, it adds back the net borrowing (ie. net change in debt). Companies\nmay use any additions to debt for the benefit of equity shareholders through dividend payments or share repurchases.\nFCF = NI + NCC − ΔWC − ΔFC\n= 660 + 260 − 120 − 200 = 600\nFCFE = NI + NCC − ΔWC − ΔFC + Net borrowing\n= FCF + Net borrowing\n= 600 + (535 − 500) = 635\nFCFF = NI + NCC − ΔWC − ΔFC + Int (1 − t)\n= FCF + Int (1 − t)\n= 600 + 40 (1 − 0.25) = 630\nIn this scenario, the largest measure of FCF is the company's FCFE, which is supported by KRW 40 million in net borrowing (Choices A and C).\nThings to remember:\nFree cash flow determines how much excess cash a company generates after covering its capital expenditures. An analyst can calculate this\ncash flow's value to the company's suppliers of debt and equity capital or to only equity shareholders by adjusting for cash items available to those\ngroups.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios\n3.An analyst gathers the following data on a company:\nThe company's tax rate is 25% and current year's free cash flow to the firm (FCFF) is SGD 196 million. Based only on this information, free cash\nflow to equity (FCFE) for the current year is closest to:\n A. SGD 176 million.\nB. SGD 181 million.\nC. SGD 191 million.\nExplanation\nFree cash flow metrics are commonly used in asset valuation and financial analysis. Free cash flow to the firm (FCFF) is the cash flow available\nto debt and equity providers after subtracting operating expenses and investments in fixed and working capital. Free cash flow to equity (FCFE) is\nthe cash flow available to equity providers (shareholders), which is FCFF adjusted for interest payments and any changes in debt from principal\nreduction and/or new borrowing.\nSince FCFF (196) is given in this question, start with FCFF, subtract the after-tax cost of interest, and then subtract the reduction in debt principal\nto obtain FCFE.\n(Choice B) SGD 181 million results from not including change in debt in the equation.\n(Choice C) SGD 191 million results from not subtracting the after-tax interest expense.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash flow available to equity providers (shareholders), which is the free cash flow to the firm (FCFF)\nadjusted for interest payments and any changes in debt from principal reduction and/or new borrowing.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2oAAAF2CAIAAACQwvyVAACdYUlEQVR42u29PXhbyZXnfcD2zu6zdgug9pmN1iLIiVcE5HRMAOzYAihvuBYA9aYWCfaE2wKgjs0PeVMTAJ2ORZC9qUlAE7cIauImAM1uNhZA+vEG9ph4g//L81TX/cDFF0Wp/79ADwRe1K2qW3XuqXNOnQoNBgMhhBBCCCEkGHPsAkIIIYQQQvWREEIIIYRQfSSEEEIIIVQfCSGEEEII1UdCCCGEEEL1kRBCCCGEUH1kFxBCCCGEEKqPhBBCCCGE6iMhhBBCCKH6SAghhBBCqD4SQgghhBCqj4QQQgghhOoju4AQQgghhFB9JIQQQgghVB8JIYQQQgjVR0IIIYQQQvWREEIIIYRQfSSEEEIIIVQf2QWEEEIIIYTqIyGEEEIIofpICCGEEEKoPhJCCCGEEKqPhBBCCCGE6iMhhBBCCKH6yC4gxIfBYDAYDHy+d34gN/l0rA9eF/ABEUII1UdCCCGEEPJ+CHE5TgiR92Q7DIVCE/4QEix4OWPflBBCiND6SEhw3+hMf/J9CwDQz2OocSgqFAppmaFQyCrH1UnN50IIIVQfCSGEEEKI0HlNiNwSi+Pk/k06Sd9v3zrvNa27E0IIofpIiJ/yYXlanYoLlZJRtUbtw6lo2KOqiVTrCSFE6LwmhBBCCCFC6yMh8iE4WH0MabRyBTH7zdp2y6dACCFUHwmZOWdnZyLy7t07V7UmFApdXV3pn2KxWDgcpvN6PFqtVr/fx+dkMjmVMjudTr1eFxGUPD8/v7Kyggd0cXEBhXJa9yKEEKHzmhBCCCGEEKH1kZCRSKVSItJoNIbMnFBIRI6Pj71MWXSbyjCHciqV0n6eXBC1Wi2UqRZNkM/nRaTdbk/xXoQQ8j3nB+wCQqaSUdwK4xsvJ/ZHljPItUVB6mbtfA/yk+fPn8u1z1pEMpmMiCwvL8diMRHZ3d29sXjK8S6Y1obxMZ7+GL099c6cSgOZBoEQofOaEEIIIYQIrY+EyEd6buGopzBbRhSnGSb44X5WUc50lTNNiulzC7MhztSMQztzJNNUr9cz/3twcGD+dxLro9Ou7NXwoR3ilQLT61d6QfDn6ByHPje1fuLs7fFaGtyUGGQU6QXYtTY3Nze07WPbI4N3GiFC6yMhhBBCCCFC6yMhN0an06l nd liabilities are used to calculate CFO. Similarly, noncash expenses\nare added back to net income to derive CFO, so the depreciation expense is irrelevant when CFO is known.\nWhen CFO is known, the above table simplifies to:\nInserting numbers results in:\n(Choice A) Although CFO encompasses interest expense, FCFF represents cash that is potentially available to lenders and shareholders. One\nassumption of FCFF is that neither lenders nor shareholders have priority in receiving available cash, so after-tax interest must be added back to\nCFO.\n(Choice C) This answer adds the long-term asset investment instead of subtracting it. FCFF is not the total cash that is available to the lenders\nand shareholders. Returning all its cash without making investments in machinery will eventually result in the firm's closure.\n5.This year, a company has\n£30 million in cash from operations (CFO),\n£6 million in after-tax interest expense that it treats as cash from financing (CFF),\n£2 million in interest received from other companies' bonds that it previously purchased, which it treats as cash from investing (CFI), and\n£15 million in capital expenditures.\nUnder IFRS, the company's free cash flow to the firm (FCFF) is closest to:\nA. £15 million\n\nB. £17 million\nC. £19 million\nExplanation\nFree cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": "<p>An analyst has compiled the following information for a company&#x27;s latest fiscal year:<\/p><img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkEAAAFXCAIAAAAqAQ3hAAAQU0lEQVR42u3d2XKjOhQFUHDx/7/MfUiXi8sgjpDE5LWeuhOMQE60rYn04zh2APBAH1UAgAwDABkGADIMABkGADIMAGQYADIM4Nf1fd/3vXp43htnjzPwy9G1+vWrGsbZ9Uwvo/q39MMA3tnx0ieTYQAP636JMRkG8DBbI2xi7P4GVQAIsO+//3Lrqnmj6uW+fsWDDAM6A4l1G/1pEbMTJr51nzrJurDgHS2rvcrtyzBApFWLq+XZ+v7f8u/Et9otI9w94ertf7+4G8Czl6/2YrdquEqX13wY0Jn9qp5nwTWQ10657ZaePqDK0pjCGpBhAL+42blRYE+/tewF/unMhwGUdMUiPYxjre3WyGGk3AsD7Huzy+HBRD0kbvaclSb6YcCPxthuS3ogb3ab+3suFJwtzmwURf2EDAOok2QeuddoijE99VglzGQYwK/sprphlVrTAdBZvvHcYduSd8GaDsCGsDsuuzi5Tlr3QYObxvTDAI5H2o8EWGKzc8Ua6P+v88xfgNOa71+bHltNmoqV8D2/dYkA1m40r4TCilp9ed2YlGGAFvzI7rFf  in capital expenditures. Under IFRS, the company's free cash flow to the firm (FCFF) is closest to:", "opts": ["£15 million", "£17 million", "£19 million"], "ans": "B", "expl": "Free cash flow to the firm (FCFF) is the cash available to a firm's providers of capital (eg, lenders and shareholders) after the firm has invested\nin long-term assets and working capital. When cash from operations (CFO) is known, the general formula for FCFF simplifies to the column on\nthe right in the above table.\nThis question presents an exception to the general rule concerning classification of interest and its impact on FCFF. Interest received or paid is\nnormally included as CFO. Firms reporting under IFRS may elect to treat interest paid as cash from financing (CFF). If the firm makes this\nelection, then after-tax interest expense is not added back to CFO, the after-tax interest expense of £6 million is not included in FCFF.\nFirms using IFRS may also elect to classify interest received as cash from investing (CFI). Cash interest received is available to the firm's\nlenders and shareholders and is added back to CFO if the firm elected to classify it as CFI. The £2 million interest received is included in FCFF,\nand the company's FCFF is £17 million as shown below:\n(Choice A) £15 million results from correctly omitting the interest paid from the FCFF calculation but fails to add the interest received.\n(Choice C) £19 million results comes from adding the after-tax interest expense to CFO. If the company elects to classify interest paid as CFF,\nthen after-tax interest is not added to CFO.\nThings to remember:\nA company reporting under IFRS may elect to classify interest paid as cash from financing (CFF) and interest received as cash from investing\n(CFI). For calculating free cash flow to the firm (FCFF), do not add interest expense if the company has elected to classify it as CFF. Add interest\nreceived if the company has elected to classify it as CFI.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4sAAAGRCAIAAABDo7HgAAB2M0lEQVR42u29TWwk15Xne1jS+NtgFOY1BrMpBms1bwCpgruegWRmrDyCZTBzM/ZYajBzYz9/AJmxsN3qXmTmwp+9yEzAlru9yUxY0tizySQso1+vMmgZ/XrHZAnomY2LQWEeBoPGgFFwqz+Eseot/uJ5V/dGREYmP4pF/n8LggxG3O977rnn3nPv2qNHj4QQQgghhJArwy0WASGEEEIIoYZKCCGEEEIINVRCCCGEEEINlRBCCCGEEGqohBBCCCGEGiohhBBCCCHUUAkhhBBCCDVUQgghhBBCqKESQgghhBBqqIQQQgghhFBDJYQQQgghhBoqIYQQQgihhkoIIYQQQgg1VEIIIYQQQg2VEEIIIYSQM/P0yl++9957Dx8+FJF33333/fffZ1ESQgghhBARuXXr1ic/+UkRWV9f/8hHPrJCCGuPHj1a9pvf/e53IvJ3f/d3n/jUp0Xkox/7+K2nnmJlEEJuMv/rf/6Pf/mv/jXLgRBCROT93//+n//pH0XkH/7+d3/wB38gIp/+9Ke5yk8IIYQQQuQGrfK/9957f/d3fyci6//y/3j66X/BEiSEEEIIISa3nnrq45/8lIj8i49+FHrjRz/60aWW+5fWUB8+fIjFfaqnhBBCCCGkSNF8+l9Ab3z48CGW+7nKTwghhBBC5EacNvXuu+9+9GMf/+jHPs6yI4QQQgghxUBvfPfdd+VC96G+//779NwnhBBCCCFSbk8qFEj68hNCCCGEEN4pRQghhBBCCDVUQgghhBBCDZUQQgghhBBqqIQQQgghhBoqIYQQQggh8gTdenqlePv+/YcPH4rInY07d+5ssDqvAqiRt+/fx5/PPf88y4SQ69rZtaezs1+1wVGlMcfHqzaE/eatt/DLM88+KyLr6+ss9muiof7qzV+KyCvf/paIvHN8bAjHz4jI6z//xbKVjbby4gufTf/+H849td6nPiEib/7lXy3bypGq9fV1tODfvPXWiy98VkQuIpF5vPjCf/jNW78ueOGP/+RP//hP/tTs1a98+5tvvPaa+Q6q43s//LMvvfSyFbiIFISvgX//u9/Rn5mg6t/8y/8774U3Xn/tlW99UxO5QnU8Wfzkxz/66te/Udy6Lr85kes0hL/y7W+KiNvZv/fDPxMRq7OX4fvf/Q6EXkFHXlkbWKG1Q1ZguNHsXFwiFw4iBZgCTcdHc3AsGB/LB17mzWJ97pVvf+snP/6R/nnVhE/BEJbZqr//3e8UjEooc20nCPz73/2OWQLK5178/Pd++EMR4URCuMpPCCGEEEKENtTz4o3XX/vaV74sIrCuffXr38CM8DdvvfXSF/+jiLz4wmff+uu/uQYVg0k/ZqUi8syzz+rvlwksuN/7wZ9l/vfOxh2dICLB1kxabS1f+8qXUVOfe/HzVvgLA7fm6C4LreZf+8qXv/TyyyLypZf+SDN1LYGB55Vvf6vYhvq4mhORa7EAanZ27emwP0E+r6+vWz1dnsCFCO1Qajz70ssvP5Z8meIrT0pb4yMkQMnx8Usvv7ww8GXfdOXST378o+/94Ici8syz9654q8YQ5rZqdwgrOTC99MUviMjb9w9f/YufaiDr6+uweX//u995/t/9oYjc/9v/xhX/J1hDfeVb30Rf1cVlOd0pgop/6YtfeOP111yD/DvvHL9z/M6y20p0Kw+0pXO0wGvIaI4Ldab19fXiZP/mrbeKg9I9u0stcK+ve2U+eeO1nyFH9//2v5qltL6+/uqf/xSxY2OG1b3X173y6TnL0jykqhsCROczzz5rygVzd11xpPqmGYLu0F s to debt.\nThings to remember:\nFree cash flow to equity is the cash flow available to equity providers (ie, shareholders) after accounting for investments in fixed capital, working\ncapital, and changes in debt.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABJ4AAAGzCAIAAADhe0ryAAAdt0lEQVR42u3d27arKroGULLbfP9Xzr4YrVKpqPhzUtTer9bKdHggRPlE4fV+vxMAAABX9n+KAAAAQLQDAABAtAMAAEC0AwAAEO0AAAAQ7QAAABDtAAAAEO0AAABEOwAAAEQ7AAAATvSv47per9fff7zf75nXCX391dIjq+jnd1G63eWuHr/zZ22049ary181BgDS5L12r9fru63z879wbmt1/nVeawdUKkcBAKRb9totO9b+Pnm9Xo03gH/iotvJyHX6sZW/XAcApBG9dqsNnZ+M10gTFm7m/X6f+Ls+d+u+FABg6gcyRzQI3FcGAABIxw+jMiLs/Yz3ULra4GgHu4t9DzCwtXB+JZE17ObbltVmxkiIPGP2+fPMwl2KsXqd3zv28yjv6p+XjoQRWWfH49qtDKtfaN/hPTJr2y3V1c9/+vO3RnMpLcPMaivGkon8wKvLP/M7aj/JRM4bmWocOUVktlt3igMAZol2h42o9tNYr+v0222KxSPQT9rc+jy+hmCnZXzfKr6ainiTefK2ohjrvsFMg7WxbrR3NbdXue4V/pS1jS7DjvtWveaW6poJkKUnmdLzxoiasFuG3hcFgNl77Xb7l7o8jRnsuFu9Z7wc3GW1hbE7BsxyhaWjyOwumdmxSMbOL9n41WRak43FuNv4y6+zqKOydG/jPRv5b6GurJY7EGkrV49mFFlbxd2WirtFwTL8+SUO2nrf8o9816Unmch5Y7caN1bX+LkIAEjTTn6QstMhtKeIikDyMypApIm/2ygJrqT0oCLbii+8umT+Mar2nr2+e1u6znj5rzZqRzw/3OW4WlJ342or1pa5IzO0DDuO/9EyHFSv6tp4kuleu0pXGDkXGbIFACaNdp+28iQX7HwLJtLQKQ2B8Zyw/KcuxdW+kuo1tBdjCjyy2D2Drba2u/dntpfVoK+g49q2cktd/G4pw7N+R33Lv/0kc8CJtOgUBwBce4TMxvvE+b+qu4M+NFldaxTyEY3jEXs7+qvp0rE8z3H1XW2XGHa5Mrz6Lo04b4hqAJCMkNnlVRzvafQtgeWXMmj4kDT35F3BsS7NFp2uNi2bslXHAEC0u1ijpH0sEC2zh2eAoaMsPjlOlA5mg/MGAHDbaFf6Ys+922fxl9BKN3H883szV7BPwR5w1+BOIeevoywzWOKRB/vwYHPAeQMASE941+6w5m/8Lb6tYdN/3rCaudEz+gW2cbOBXa6lfoME0ne1fcfqfEKKm2eX+ha+WAgAT4l28Vlrj2xG7LZsThyFb2v+3+v27eTrwOpQJfFCGPHVbI2eckCBV5TVtfKepzFPz0XHFLW8BwDPmteupZ1RN+nT7l5tTaq+tdigRlJwDI+W/FPxpln3OhAf5nRZCH2/mvy013XF21h6RWUV/710Ka66tR3W1t/dvRPvbhx8Jmm8eVQ9T8wpxwUApAPetfuMShd/QrLj1GSZ5za39upnOt3IYqObX8upIzJ71X3MzNRvZMKi3rCWQmgZ4aNub+Ojhowoq5bV1k2tFl/bVp0cN15l/Jxz/OCcB59J2s8b+Wo86 cAAEd6EAAAAKMFAAAYLQAAAIwWAAAARgsAADBaAAAAGC0AAACMFgAAYLQAAAAwWgAAABgtAADAaAEAAGC0AAAA7uL/AAU6P8U6lC/FAAAAAElFTkSuQmCC"]}, {"n": 7, "q": "An analyst has gathered the following information for a company's fiscal year 20X9: Based only on this information, under US GAAP, the company's interest coverage ratio is closest to:", "opts": ["3.6", "5.6", "5.9"], "ans": "B", "expl": "The interest coverage ratio, one of the tools used to determine a company's ability to service its debt, is a measure of firm solvency. It is\nusually calculated (using the income statement) as the ratio of EBIT to interest expense.\nWhen using a cash flow statement prepared under US GAAP, the interest coverage ratio is CFO plus back interest and taxes paid (similar to EBIT)\ndivided by interest paid. Adding back interest and taxes paid is necessary since net income (ie, net of interest and tax expense) is the starting\npoint for operating cash flow.\nUnder IFRS, if interest paid is classified as a financing activity, that portion of interest paid should not be added back to the numerator to determine\ninterest coverage.\n(Choice A) 3.6 times coverage is the result if interest paid is subtracted from the numerator.\n(Choice C) 5.9 times coverage is the result if all cash flow metrics (ie, CFO, cash flow from investing [CFI], cash flow from financing [CFF]) are\nincluded in the numerator.\nThings to remember:\nThe interest coverage ratio is calculated using the income or cash flow statement. When using a cash flow statement prepared under US GAAP,\nthe interest coverage ratio is CFO plus back interest and taxes paid divided by interest paid.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and coverage cash flow ratios", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjMAAAEKCAIAAABorUNtAAA97ElEQVR42u2d0XXivte1lW/97+NUMKaCMRXEVABUgF0BcQXEFQAVxFSAqQBTQZwK4lQQTwXzXuxv9tJPxoYkkJCZ/VzMmmFkWZaOpHOOjqSr379/GyGEEOJi+H+qAiGEEJ crease, not the decrease, in accounts payable that increases cash flow.\n(Choice C) Accounts receivable increases when a company extends credit to customers and decreases when the company collects cash from\nthem. It is the increase, not the decrease, in accounts receivable that decreases cash flow.\nThings to remember:\nCommon-sized cash flow statements may be expressed as a percentage of net revenue. Increases in assets indicate a use of cash and are\npresented as negative figures. Increases in liabilities suggest a source of cash and are shown as positive figures.\nAnalyze and interpret both reported and common-size cash flow statements", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApEAAAGlCAIAAAAtSjq6AABNr0lEQVR42u2d21Xjvve3xbt+95gKMBWMU0GcCkgqSFIBuIIkFSSpIE4FcSpIqABTAZ4KxlQw78Vnzf7rK+cEAwyH57lggZF1lrb21pZ89vv3bwcAAAAfnv9HFQAAACCzAQAAAJkNAACAzAYAAABkNgAAACCzAQAAkNkAAACAzAYAAABkNgAAADIbAAAAkNkAAACAzAYAAEBmAwAAADIbAAAAkNkAAACfhP8994WzszNqDQAA4O/5/fv380Twc18AAAAAh20cAAAAkNkAAADIbAAAAEBmAwAAADIbAAAAmQ0AAADIbAAAAGQ2AAAAILMBAAAAmQ0AAIDMBgAAAGQ2AAAAuLf8rhcAALwPnU5n5/Moiq6vr51zg8HgUxewLMskST51ESaTiXNuu90655IkmU6nyGwAgO/IdrtN09Q5p59GVVXD4dA59/Pnz9Fo9BmLNpvNnHPr9Xqz2XzeBprNZuPx2Dl3e3vrnPvx44fDNg4AAADo2QAAHxpp2E1luq5r6XmfVM9+enr6Aq3z9PSkBnprkzh6NgDAJyZJkiRJJLndn73hsix7vV6v1zv7w3A4rOvaD5ZlWZZleZ5fXV1dXV1dXFxst1ttx04mk8lkcnFxoXcVoCiKZhJnHs0kOp1Onud5nnc6HT+qPM8VIP9DWZadTsfftlcerq6uLH6VyI/fObfdbhXn2dmZYlByTQ8AxaaQzRK5/RvtlredJbVq9EOWZYnMBgAAAOewjQMAfDrqupbOak7XVVVJxZSpdrPZSB2cz+d6fn9/bxqkc242my0WCz2J41iKo+KcTqd6Mp/PnXO9Xu/x8dH3Y0/TVI5j+5LYbrdVVTnnRqORTPeKajgcdrtdpagkqqry3evyPJdL12KxsABZlil7yrBi7vV6enGxWNzd3SnyoJb0Yp7nMlzHcRyEVGaa7KvMyWRiJZW7WVmWyo9CRlGEng0AAADOOXf2+/dvagEA4CNO0GdnUjf103m7rfpls9lI1Z5MJtqTDo5O1XV9dXUlfVRqpTTFOI5Nz5YSeXFxsVqtmtpnr9e7ublxzt3d3Z2YxNnZmVRbnYDyk9C7aZrasWY/Nh0A81/0D0ArpLTnsiyDbGRZptdNqJ2dnSm3wUm5yWSiLW0zDDQVdAUwA4Pp3yrparVSSfdVu8M2DgDwDZG0DqROv9+XzDBjrJmj913D8vDw4AtjfxFgK4CdtmIJcsmn05MIbko50Wh8e3urzEwmE4n5siwlFK0G const LETTERS = "ABCDEFGHIJ".split("");

const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}

  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
