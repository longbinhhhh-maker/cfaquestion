<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Mark Guenin, CFA, covers the textile industry for a brokerage firm. While at his golf club on\nSaturday, he notices several executives from two of his covered companies entering a\nprivate dining room and sees a pro forma balance sheet combining the two companies\nprojected onto a screen. The executives greet Guenin and confirm that their companies\nintend to merge. Guenin's most appropriate course of action should be to:","opts":["divest his personal holdings of both companies.","encourage the companies to announce the merger.","write a research report updating the outlook for both companies."],"ans":"B","expl":"Guenin nên nỗ lực hợp lý để hai công ty công bố việc sáp nhập\nđể phổ biến tin tức một cách công khai. Một trong hai lựa chọn còn lại sẽ\nhành động hoặc khiến người khác hành động dựa trên thông tin quan trọng không công khai.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":2,"q":"Wallace Manaugh, CFA, is analyzing the stock of a manufacturer of fishing boats. By\nanalyzing public information, speaking with the firm's suppliers and customers, and counting\nthe new boats in the company's boat yard, Manaugh concludes that the company's new\nfishing boat is not meeting sales expectations. Anticipating that this will cause the stock price\nto decline, Manaugh takes a short position in the stock. Manaugh has:","opts":["an obligation under the Standards to make reasonable efforts to achieve public dissemination of the nonpublic information.","not violated CFA Institute Standards.","violated the Standards by acting on nonpublic information."],"ans":"B","expl":"Theo lý thuyết khảm, các nhà phân tích tài chính được tự do kết hợp thông tin công khai với\nthông tin phi vật chất không công khai và hành động dựa trên kết luận của họ. Tiêu chuẩn II(A)\nnghiêm cấm các thành viên và ứng cử viên hành động hoặc khiến người khác hành động dựa trên thông tin quan trọng\nkhông công khai. Nghĩa vụ thực hiện những nỗ lực hợp lý để đạt được\nphổ biến thông tin không công khai áp dụng cho các tình huống trong đó công ty\ntiết lộ thông tin chưa được công khai cho nhà phân tích.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":3,"q":"Ron Taylor, a Level I CFA candidate, trades cotton contracts for a small commodity broker.\nTaylor convinces a government cotton inspector to issue a warning that the Texas cotton\ncrop is in danger from insect infestation. The price of cotton soars. Taylor immediately\nshorts cotton futures. Once the position is created, the government inspector issues a\nsecond report reversing his original opinion and cotton prices plummet.\nCedric Sims, a Level III CFA candidate, would like to generate a tax loss on a security held in\nhis personal portfolio; however, he believes the security has significant upside potential. To\navoid the wash sale provisions of the income tax code, Sims sells the security and\nsimultaneously creates a synthetic long position using derivatives.\nWith regard to Standard II(B) Market Manipulation, which of the following statements\nconcerning Taylor's and Sims's conduct is CORRECT?","opts":["Both Taylor and Sims are in violation of Standard II(B).","Neither Taylor nor Sims is in violation of Standard II(B).","Taylor is in violation of Standard II(B), but Sims is not in violation."],"ans":"C","expl":"Taylor đã vi phạm Thao túng thị trường Tiêu chuẩn II(B) bằng cách tạo ra một kế hoạch\nkhiến người khác giao dịch dựa trên thông tin sai lệch. Sim không vi phạm Tiêu chuẩn II(B).\nTiêu chuẩn không cấm các giao dịch được thực hiện vì mục đích thuế.\n(Mô-đun 91.3, LOS 91: II(B))"},{"n":4,"q":"A stockbroker who is a member of CFA Institute has a part-time housekeeper who also\nworks for the CEO of Festival, Inc. One day the housekeeper mentions to the broker that she\nsaw the CEO of Festival having a conversation at his home with John Tater, who is a\nnationally known corporate lawyer and consultant. The stockbroker is restricted from\ntrading on this information:","opts":["for both of the reasons listed here.","if the housekeeper says the meeting concerned a tender offer and the broker knows that it is non-public information.","only if the broker knows that the meeting is non-public information."],"ans":"B","expl":"Tiêu chuẩn II(A), Thông tin quan trọng không công khai, nêu rõ \"một thành viên không thể giao dịch hoặc khiến\nngười khác giao dịch chứng khoán trong khi thành viên đó sở hữu thông tin quan trọng không công khai\"\nMột lời đề nghị chào mua chắc chắn sẽ là thông tin quan trọng không được công bố. Biết rằng cuộc họp\nđã diễn ra và không có gì khác, không hạn chế nhà môi giới. Một nhà đầu tư hợp lý\nsẽ cần biết nhiều hơn để xác định xem thông tin đó có quan trọng hay không."},{"n":5,"q":"The mosaic theory is the idea that an analyst can:","opts":["base his recommendations on nonpublic material information only for the clients of the company, but not for the general public.","make recommendations or trade based on several pieces of public or nonpublic information, each piece by itself being nonmaterial, but when compiled the information becomes material.","make investment recommendations on the basis of several pieces of nonpublic information as long as the aggregate information remains nonmaterial."],"ans":"B","expl":"Lý thuyết khảm cho phép nhà phân tích đưa ra khuyến nghị dựa trên một số\ncác phần thông tin công khai hoặc phi quan trọng, mặc dù kết quả tuân thủ vừa là\nquan trọng vừa không công khai."},{"n":6,"q":"An analyst manages the assets of a charitable organization. Her supervisor tells her to buy a\ncertain stock because the company's chief executive, who is also a board member in the\norganization, told her the company's earnings will exceed the market forecast when they are\nreleased next week. The analyst objects, but the supervisor says this is what they have\nalways done and sees no reason for changing now. The analyst complies with the request.\nThe analyst violated the Standard(s) concerning:","opts":["only material nonpublic information.","both loyalty and material nonpublic information.","only loyalty."],"ans":"A","expl":"Tuân thủ yêu cầu là vi phạm của Thông tin quan trọng không công khai Tiêu chuẩn II(A)\nnghiêm cấm giao dịch thông tin nội bộ. Tiêu chuẩn IV(A) Lòng trung thành giải quyết các vấn đề\nchẳng hạn như hành nghề độc lập, rời bỏ chủ lao động và tiếp tục hành động vì lợi ích tốt nhất\ncủa chủ lao động cho đến khi việc từ chức của họ có hiệu lực và tố cáo."},{"n":7,"q":"Which of the following is a violation of Standard II(B), Market Manipulation?","opts":["Engaging in a block trade to limit the effect on the price of a thinly traded security.","Implementing a trading strategy to exploit differences in market power and information.","Overstating an earnings projection in order to increase the price of a stock."],"ans":"C","expl":"Tiêu chuẩn II(B), Thao túng thị trường, không nhằm mục đích cấm các giao dịch được thực hiện\nnhằm giảm thiểu thuế thu nhập hoặc các chiến lược giao dịch không nhằm mục đích bóp méo\ngiá hoặc tăng khối lượng giao dịch một cách giả tạo. Phóng đại dự báo thu nhập để\ntăng giá cổ phiếu là vi phạm trực tiếp.\n(Mô-đun 91.3, LOS 91: II(B))"},{"n":8,"q":"Which of the following statements concerning material nonpublic information is most\naccurate? A member or candidate may not act or cause others to act on material nonpublic\ninformation:","opts":["if the information has been misappropriated.","if the information was obtained through a breach of duty.","until the information becomes available to the public."],"ans":"C","expl":"Các thành viên và ứng cử viên không được hành động hoặc yêu cầu người khác hành động dựa trên thông tin quan trọng không công khai\ncho đến khi thông tin tương tự đó được công khai. Sẽ không có vấn đề gì nếu\nthông tin không bị chiếm dụng hoặc không có được do vi phạm nghĩa vụ.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":9,"q":"Trude Front, CFA, is a portfolio manager. While in the normal course of her duties, she\nhappens to overhear material non-public information concerning the stock of VTT Bowser.\nShe purchases several exchange traded funds which contain VTT Bowser, while shorting\nsimilar exchange traded funds which do not contain VTT Bowser. This is most likely:","opts":["not a violation of Standard II(A) \"Material Non-Public Information.\"","only a violation of Standard II(A) \"Material Non-Public Information\" because Front is simultaneously shorting the funds which do not contain VTT Bowser.","a violation of Standard II(A) \"Material Non-Public Information.\""],"ans":"C","expl":"Đây là hành vi vi phạm Tiêu chuẩn II(A) \"Thông tin quan trọng phi công khai\" bất kể\ncho dù Front có đồng thời rút ngắn số tiền không chứa VTT Bowser hay không.\ncác giao dịch của cô ấy được thúc đẩy bởi thông tin quan trọng không công khai.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":10,"q":"Nancy McCoy, CFA, is preparing a report on Gourmet Food Mart. As part of her research, she\ncontacts the company's contractors, suppliers, and competitors. McCoy is told by the CEO of\na major produce vendor that he is about to file a lawsuit against Gourmet Food Mart,\nseeking significant damages. McCoy incorporates this information into her research report,\nwhich projects a decline in profitability for Gourmet Food Mart due to the impending\nlitigation. According to the CFA Institute Standards of Professional Conduct, McCoy:","opts":["has violated the Standards by utilizing material nonpublic information.","has not violated any Standard.","has violated the Standards by disseminating confidential information."],"ans":"A","expl":"Theo Tiêu chuẩn II(A) Thông tin quan trọng không công khai, nhà phân tích không được hành động hoặc\nkhiến người khác hành động dựa trên thông tin quan trọng không công khai. Thông tin về một tranh chấp pháp lý\nđáng kể được coi là quan trọng và trong trường hợp này là không công khai vì vụ kiện\nchưa được đệ trình và chưa phải là vấn đề được công khai.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":11,"q":"Which of the following statements regarding Standard II(A), Material, Nonpublic Information,\nis least accurate?","opts":["If you receive the information in a public forum, it has been disseminated, and you can trade on it.","Information received from an insider who is not breaching his fiduciary responsibility may be traded on.","Material, non-public information regarding a tender offer may not be traded on."],"ans":"B","expl":"Nếu thông tin là quan trọng và không công khai, Thành viên hoặc Ứng viên không thể giao dịch hoặc\nkhiến người khác giao dịch. Sẽ không có vấn đề gì nếu người trong cuộc không vi phạm trách nhiệm\nđược ủy thác của mình. Thông tin nội bộ vẫn là thông tin quan trọng và không công khai."},{"n":12,"q":"Which of the following is an example of information-based market manipulation?","opts":["Spreading false rumors about a stock on social media to influence its price.","Influencing futures prices by obtaining a dominant position in the underlying commodity.","Entering large offsetting buy and sell orders to inflate trading volume."],"ans":"A","expl":"Lan truyền tin đồn thất thiệt về một cổ phiếu là một ví dụ về thao túng thị trường dựa trên thông tin\n. Các lựa chọn khác là ví dụ về thao túng thị trường dựa trên giao dịch.\n(Mô-đun 91.3, LOS 91: II(B))"},{"n":13,"q":"Marion Klatt, CFA, is a representative for Thiel Financial Network. Klatt received a phone call\nat home from William Kind, a junior executive at Westtown Development Company, asking\nwhether Klatt had heard that Westtown had just reached an agreement to acquire a major\nshopping mall chain at a very favorable price. (Klatt had not heard this news, and Klatt was\nable to confirm that the information had not yet been made public.) Kind requested that\nKlatt acquire 10,000 shares of Westtown for Kind's personal account.\nKlatt should:","opts":["not acquire the shares until he has contacted Westtown's management and encouraged them to publicly announce the merger discussion.","not acquire the shares until the information is made public.","not acquire the shares."],"ans":"B","expl":"Tiêu chuẩn II(A) cấm các thành viên thực hiện hành động đầu tư nếu họ sở hữu thông tin quan trọng\nkhông công khai. Kind có nghĩa vụ giữ bí mật thông tin mà anh ấy có được\ntrong quá trình thực hiện nhiệm vụ của mình tại Westtown. Thông tin này rõ ràng là quan trọng nên Klatt không được phép kinh doanh thông tin đó. Klatt nên nỗ lực hợp lý để phổ biến thông tin\ncông khai bằng cách liên hệ với ban quản lý và khuyến khích họ\ncông khai thông tin. Klatt không được phép trao đổi thông tin cho đến khi nó được công khai\n.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":14,"q":"An analyst is allowed to trade on information that he has predicted, such as a corporate\naction or event, using perceptive assembly and analysis of public information and\nnonmaterial nonpublic information. This is called the:","opts":["assessment theory.","mosaic theory.","deduction theory."],"ans":"B","expl":"Dựa trên lý thuyết khảm, một thành viên hoặc ứng cử viên có thể hành động dựa trên sự kết hợp giữa thông tin công khai\nvà thông tin không công khai phi quan trọng mà không vi phạm Tiêu chuẩn II(A)\nMaterial Thông tin không công khai."},{"n":15,"q":"During a conference call with 30 analysts, a company's management discloses that its\nquarterly earnings, which will be announced at the end of the week, are equal to the\nconsensus forecast. The analysts participating in the conference call should consider this\ninformation:","opts":["material and nonpublic.","material, but public.","nonpublic, but not material."],"ans":"A","expl":"Bản công bố thu nhập là quan trọng vì các nhà đầu tư hợp lý sẽ muốn biết thông tin\ntrước khi đưa ra quyết định đầu tư. Thông tin này không được công khai cho đến khi\nđược phổ biến ra thị trường. Tiết lộ cho các nhà phân tích không phải là phổ biến công khai\n.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":16,"q":"Darlene Hess, CFA, manages a pension fund that has a sizeable position in Knoll Corporation\ncommon stock. Hess also holds Knoll common stock in her personal account. Hess\nparticipates in an analyst conference call in which Knoll's chief financial officer advises that\nthe company's current-quarter earnings will slip below consensus forecast. Knoll has not\ndisclosed this to the public. Hess believes news of the poor earnings will reduce the stock's\nvalue significantly. Hess may:","opts":["sell Knoll stock from the pension fund but may not sell it from her personal account.","sell Knoll stock from her personal account but may not sell it from the pension fund.","not sell Knoll stock from either the pension fund or her personal account."],"ans":"C","expl":"Việc bán cổ phiếu Knoll từ quỹ hưu trí hoặc tài khoản cá nhân của Hess sẽ là\ngiao dịch dựa trên thông tin quan trọng không công khai, vi phạm Tiêu chuẩn II(A) Vật chất Không công khai\nThông tin.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":17,"q":"Mark Williamson is \"bearish\" on ABC Manufacturing Company. Williamson is so convinced\nthat ABC is overpriced, two weeks ago, he shorted 100,000 shares. Today, Williamson is\n\"surfing\" several popular investment bulletin boards on the internet and posting false\nderogatory comments about company management. According to Standard II(B), Market\nManipulation, Williamson has engaged in:","opts":["both transaction-based manipulation and information-based manipulation.","transaction-based manipulation, but not information-based manipulation.","information-based manipulation, but not transaction-based manipulation."],"ans":"C","expl":"Williamson tham gia vi phạm Tiêu chuẩn II(B), Thao túng thị trường, bằng cách tham gia\nthao túng dựa trên thông tin. Thao túng dựa trên thông tin bao gồm nhưng không\ngiới hạn ở việc lan truyền tin đồn sai sự thật về một công ty nhằm xúi giục người khác giao dịch."},{"n":18,"q":"A CFO who is a CFA Institute member is careful to make his press releases—some of them\ncontaining material and previously undisclosed information—clear and understandable to\nhis readers. While writing a new release, he often has his current intern proofread rough\ndrafts. He also sends electronic copies to his brother, an English teacher, to get suggestions\nconcerning style and grammar. With respect to Standard II(A), Material Nonpublic\nInformation, the CFO is:","opts":["not in violation of the Standard.","only in violation by e-mailing the pre-release version to his brother but not the intern, because the intern is in essence an employee of the firm.","violating the standard by either showing the pre-release version to his intern or sending it to his brother."],"ans":"C","expl":"Tiêu chuẩn II(A), Thông tin quan trọng không công khai, quy định rằng thành viên phải cẩn thận\nxử lý thông tin quan trọng không công khai. Với tư cách là thành viên của Viện CFA, CFO phải\nhạn chế những người xem thông tin quan trọng trước khi thông tin đó được công bố. Sẽ không phù hợp\nkhi lôi một thực tập sinh hoặc người thân vào quá trình này."},{"n":19,"q":"A stockbroker who is a CFA Institute member is called on the telephone by the CEO of a large\ncompany. The CEO asks to buy shares of the CEO's company for the accounts of the CEO's\nchildren. In the course of the conversation, the CEO says this will really pay off when the\nupcoming takeover goes through. The stockbroker checks her sources and finds no\ninformation about the takeover. In this case the broker should:","opts":["do neither of the actions listed here.","execute the order for all clients as required by Standard III(B), Fair Dealing.","only execute the order in compliance with Standard III(A), Loyalty, Prudence, and Care. Since the client is buying the stock for the children, there is not a problem."],"ans":"A","expl":"Thực hiện bất kỳ hành động nào trong số này sẽ vi phạm Tiêu chuẩn II(A), Material Thông tin không công khai\n. Thành viên và Ứng viên không được hành động hoặc xúi giục người khác hành động dựa trên\nthông tin không công khai."},{"n":20,"q":"Which one of the following least accurately describes the CFA Institute Standard about using\nmaterial nonpublic information?","opts":["An analyst using material nonpublic information may be fined by CFA Institute.","An analyst may use nonmaterial nonpublic information as long as it has been developed under the Mosaic Theory.","An analyst may violate this Standard by passing information to others even when it has been obtained from outside the company."],"ans":"A","expl":"Không có quy định nào về việc Viện CFA ban hành tiền phạt cho các thành viên. Thành viên không được sử dụng\nthông tin quan trọng không công khai cho mục đích giao dịch. Thông tin phi vật chất, không công khai\ncó thể được sử dụng cùng với việc phân tích thông tin công khai theo Lý thuyết khảm."},{"n":21,"q":"The investment banking department of the XYZ Brokerage House often has information that\nwould be of significant use to the firm's brokerage clients. To comply with CFA Institute\nStandards of Professional Conduct, which of the following policies should XYZ adopt?","opts":["Establish physical and informational barriers to prevent the exchange of information between the investment banking and the brokerage operations.","Disseminate this information to all clients at the same time.","Encourage their investment banking clients to publicly disseminate this information."],"ans":"A","expl":"Rào cản vật lý và thông tin được dựng lên giữa các phòng ban để ngăn chặn\nviệc truyền đạt thông tin quan trọng không công khai từ bộ phận này sang bộ phận khác được\ngọi là \"tường lửa\". Các phòng ban nên được tách ra. Ví dụ: bộ phận đầu tư\nngân hàng và tài chính doanh nghiệp của một công ty môi giới phải được tách biệt\nkhỏi bộ phận bán hàng và nghiên cứu. Tài khoản thành viên gia đình đồng thời là khách hàng\nphải được đối xử giống như mọi tài khoản khách hàng khác và không được đối xử đặc biệt\nhoặc gặp bất lợi.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":22,"q":"Insider trading can be defined as information that is:","opts":["material and nonpublic.","material and public.","nonmaterial and nonpublic."],"ans":"A","expl":"Thông tin là quan trọng nếu nó quan trọng đối với nhà đầu tư trong việc đưa ra quyết định\nđầu tư của họ. Thông tin sẽ không được công khai nếu nó chưa được công bố rộng rãi.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":23,"q":"Klaus Gerber, CFA, is a regular contributor to the website WizeGuy. This past week Gerber\nhas been incorrectly quoted as recommending that investors buy shares in Bradford, Inc. He\nis unaware that this message has been placed on the site as the quote was placed as a prank\nby an unknown source. This is the third time this has happened over the past month and\neach time the stock being mentioned moved in price according to the buy or sell\nrecommendation.\nFritz Fox, CFA, maintains and updates the WizeGuy site and has learned how to determine if\nthe quotes being attributed to Gerber are actually valid. Several days later, he observes an\ninvestment recommendation, posted on the site, to buy Gresham, Inc. The investment\nrecommendation is purported to be from Gerber, but Fox actually knows it to be bogus. He\nimmediately sells 1,000 Gresham short and e-mails Gerber to inform him of the bogus\nrecommendation. Gerber immediately issues a rebuttal, and Gresham falls by 14%. Fox's\naction is:","opts":["a violation of the Standard concerning fiduciary duties.","not in violation of the Code and Standards.","a violation of the Standard concerning use of material nonpublic information."],"ans":"C","expl":"Mặc dù thông tin đó là sai, sự thật này chỉ có Fox biết và do đó là thông tin\nkhông công khai. Vì những khuyến nghị như vậy trước đây có ảnh hưởng đáng kể đến\ngiá của chứng khoán được đề cập nên thông tin rõ ràng là quan trọng. Fox vi phạm\nThông tin quan trọng không công khai Tiêu chuẩn II(A)."},{"n":24,"q":"Regarding non-public information, which one of the following statements is NOT correct?","opts":["A member can be summarily suspended for having received material non-public information.","An analyst may use some types of non-public information.","Disclosing material non-public information would have an impact on the price of a security or be of interest to a reasonable investor."],"ans":"A","expl":"Tất cả những điều này đều đúng ngoại trừ việc thành viên có thể bị đình chỉ vì đã nhận tài liệu\nthông tin không công khai. Thành viên có thể nhận được thông tin đó như một phần nhiệm vụ\nthường xuyên của mình hoặc do tình cờ. Bản thân cả hai đều không bị trừng phạt và các hình phạt chỉ áp dụng nếu\nthành viên giao dịch hoặc khiến người khác giao dịch dựa trên thông tin đó. Thành viên có thể có\nnhiệm vụ nhất định, chẳng hạn như cố gắng phổ biến thông tin sau khi nhận được. Nhà phân tích\ncó thể sử dụng thông tin phi vật chất, không công khai."},{"n":25,"q":"The term \"material\" in the phrase \"material nonpublic information\" refers to information\nthat is likely to affect significantly the market price of the issuing company's securities or\nthat:","opts":["is acquired by the financial analyst from a special or confidential relationship with the issuing company.","is likely to be considered important by reasonable investors in determining whether to trade a particular security.","is derived by the financial analyst from direct communication with an issuing company's management."],"ans":"B","expl":"Một mục thông tin là quan trọng nếu việc tiết lộ thông tin đó có thể có tác động đến\ngiá của một chứng khoán hoặc nếu các nhà đầu tư hợp lý muốn biết thông tin trước\nđầu tư."},{"n":26,"q":"Don Benjamin, CFA, is the compliance officer for a large brokerage firm. He wants to prevent\nthe communication of material nonpublic information and other sensitive information from\nhis firm's investment banking and corporate finance departments to its sales and research\ndepartments. The most common and widespread approach that Benjamin can use to\nprevent insider trading by employees is the:","opts":["fire wall.","legal list.","Wall Street Rule."],"ans":"A","expl":"Để tuân thủ Tiêu chuẩn II(A), tường lửa cung cấp một rào cản thông tin giúp ngăn chặn\nviệc truyền đạt thông tin quan trọng không công khai và thông tin nhạy cảm khác từ\nbộ phận này sang bộ phận khác trong công ty."},{"n":27,"q":"All of the following are violations of Standard II(B) Market Manipulation EXCEPT:","opts":["disseminating misleading information about the development of new products and technologies.","exploiting differences in market inefficiencies.","securing a controlling interest in an equity security in order to influence the price of a related derivative instrument."],"ans":"B","expl":"Thao túng thị trường Tiêu chuẩn II(B) nghiêm cấm các hành vi bóp méo giá cả hoặc thổi phồng khối lượng giao dịch một cách giả tạo\nvới mục đích đánh lừa những người tham gia thị trường. Tiêu chuẩn không\nnhằm cấm các chiến lược giao dịch hợp pháp khai thác sự khác biệt trong sự kém hiệu quả của thị trường\n.\n(Mô-đun 91.3, LOS 91: II(B))"},{"n":28,"q":"A brokerage firm has a trading department and an investment-banking department. Often\nthe investment-banking department receives material non-public information that would be\nvaluable in advising the firm's brokerage clients. In order to comply with the Standards, the\nfirm:","opts":["should restrict employee trading in securities for which the firm is in possession of material non-public information.","must divest one of the departments.","should record the exchange of information between the investment-banking department and the brokerage department."],"ans":"A","expl":"Hạn chế nhân viên giao dịch cổ phiếu mà công ty có thông tin quan trọng không công khai\nlà câu trả lời tốt nhất. Ghi lại quá trình trao đổi thông tin giữa hai bộ phận\nkhông phải là lựa chọn tốt nhất vì không nên có sự trao đổi thông tin\ngiữa hai bộ phận này. Việc loại bỏ một bộ phận không phải là phương pháp phù hợp để\ngiải quyết vấn đề tiềm ẩn này."},{"n":29,"q":"According to CFA Institute Standards of Professional Conduct, which of the following\nstatements about material nonpublic information is NOT correct? Information is:","opts":["material if reasonable investors would want to know the information before making an investment decision.","nonpublic until it has been disseminated to a select group of investors.","nonpublic until it has been disseminated to the marketplace in general."],"ans":"B","expl":"Tiêu chuẩn II(A), Thông tin quan trọng không công khai, nêu rõ rằng thông tin là \"không công khai\" cho đến khi\nnó được phổ biến ra thị trường nói chung thay vì một nhóm nhà đầu tư\nđược chọn.\n(Mô-đun 91.3, LOS 91: II(A))"},{"n":30,"q":"Andrea Waters is an investment analyst who has accumulated and analyzed several pieces of\nnonpublic information through her contacts with drug firms. Although no one piece of the\ninformation she collected is \"material,\" Waters correctly concluded that the earnings of one\nof the drug companies would be unexpectedly high in the coming year. According to CFA\nInstitute Standards of Professional Conduct, Waters:","opts":["can use the information to make investment recommendations and decisions.","cannot legally invest or make recommendations based on this information.","may use the information, but only after approval from a compliance officer or supervisor."],"ans":"A","expl":"Các thành viên có thể ghép các mục thông tin phi vật chất không công khai với thông tin\ncông khai, dựa trên lý thuyết khảm, có thể sử dụng thông tin đó cho các mục đích giao dịch\n."}];
const CFG = {"title": "Guidance for Standard II", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.3 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){

  function addMark(el,sym){

  function showResult(pass, badgeText){

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');

    ov.classList.add('show');

  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;

        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})

  function confetti(){

    for(var i=0;i<70;i++){(function(){

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<script id="qcheck-js">
/* Kiểm tra đáp án từng câu (chỉ áp dụng cho các đề Ethics theo Reading). */
(function(){
  function idx(card){ return (card.id && card.id.indexOf("q-")===0) ? +card.id.slice(2) : -1; }
  function addBtn(card){
    if(!card.classList || !card.classList.contains("card")) return;
    if(card.querySelector(".qcheck-wrap")) return;
    var i = idx(card); if(i<0) return;
    if(typeof CFG!=="undefined" && CFG && CFG.hasAnswers===false) return; // không có đáp án -> bỏ qua
    var wrap=document.createElement("div"); wrap.className="qcheck-wrap";
    var btn=document.createElement("button"); btn.type="button"; btn.className="qcheck-btn";
    btn.textContent="Kiểm tra đáp án";
    var msg=document.createElement("span"); msg.className="qcheck-msg";
    btn.onclick=function(){ checkOne(i, card, btn, msg); };
    wrap.appendChild(btn); wrap.appendChild(msg);
    var expl=card.querySelector(".expl");
    if(expl) card.insertBefore(wrap, expl); else card.appendChild(wrap);
  }
  function checkOne(i, card, btn, msg){
    if(typeof graded!=="undefined" && graded) return;      // đã nộp cả bài
    if(btn.classList.contains("done")) return;             // đã kiểm tra câu này
    var pick = (typeof answers!=="undefined") ? answers[i] : undefined;
    if(pick===undefined){
      msg.textContent="Hãy chọn một đáp án để kiểm tra."; msg.className="qcheck-msg warn";
      return;
    }
    var ans = (typeof DATA!=="undefined" && DATA[i]) ? DATA[i].ans : null;
    if(ans){
      var cb=document.getElementById("opt-"+i+"-"+ans);
      if(cb) cb.classList.add("correct");
      if(pick===ans){
        msg.textContent="Chính xác ✓"; msg.className="qcheck-msg ok";
      }else{
        var wb=document.getElementById("opt-"+i+"-"+pick);
        if(wb) wb.classList.add("wrong");
        msg.textContent="Chưa đúng — đáp án đúng là "+ans; msg.className="qcheck-msg bad";
      }
    }
    var e=document.getElementById("expl-"+i); if(e) e.classList.add("show");
    card.classList.add("qc-locked");
    btn.classList.add("done"); btn.textContent="Đã kiểm tra";
  }
  function scan(){
    if(document.body.classList.contains("qc-graded")) return;
    var cards=document.querySelectorAll("#quiz .card");
    for(var k=0;k<cards.length;k++) addBtn(cards[k]);
  }
  // Sau khi NỘP CẢ BÀI: ẩn nút kiểm tra từng câu (bài đã được chấm toàn bộ).
  if(typeof grade==="function"){
    var _g=grade;
    grade=function(a){ _g(a); document.body.classList.add("qc-graded"); };
  }
  // LÀM LẠI: bỏ trạng thái đã-chấm để nút kiểm tra từng câu hiện lại.
  if(typeof restart==="function"){
    var _r=restart;
    restart=function(){ document.body.classList.remove("qc-graded"); _r(); };
  }
  var quiz=document.getElementById("quiz");
  if(quiz){
    scan();
    new MutationObserver(function(){ scan(); }).observe(quiz,{childList:true});
  }
})();
</script>
<!--qcheck-end-->
