<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button id="submitBtn" class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">

<script>
const DATA = [{"n":1,"q":"To claim compliance with the GIPS standards, a firm is most likely required to:","opts":["have a verification of the firm's claim of compliance performed.","initially present a minimum of five years of compliant investment performance.","include all discretionary and non-discretionary fee-paying accounts in its composites."],"qhtml":null,"ans":"B","expl":"initially present a minimum of five years of compliant investment performance."},{"n":2,"q":"Tyler Cowen, CFA, retains all records relating to recommendations to buy or sell a security, but\ndiscards all notes that do not lead to a change in recommendations. Cowen's colleague Marie\nThomsen, CFA, maintains all her records in electronic form but does not retain hard copies for some\nof her recommendations. Who has most likely violated the Standard relating to record retention?","opts":["Cowen only","Thomsen only","Both Cowen and Thomsen"],"qhtml":null,"ans":"A","expl":"Cowen only"},{"n":3,"q":"Renee Robinson, CFA, an independent contractor, acts as chief compliance officer for multiple\nfirms, where she is responsible for overseeing adherence to security laws, firm policies, and the\nCFA Institute Standards of Professional Conduct. Robinson works remotely and determines her own\nhours. Her signed agreement with each firm outlines her responsibilities and discloses the potential\nconflicts of interest due to having multiple clients in the same role and industry. Is Robinson most\nlikely in violation of any CFA Institute Standard of Professional Conduct?","opts":["No","Yes, with regard to having multiple clients","Yes, with regard to being an independent contractor"],"qhtml":null,"ans":"A","expl":"No"},{"n":4,"q":"Kathy Lau, CFA, is a portfolio manager. After a comprehensive analysis, Lau buys Top Technology\nCompany (TTC) IPO for all her clients for whom the investment is appropriate, including her\nbrother's fee-paying account. Lau does not have beneficial ownership in her brother's account. Has\nLau violated the Standards by buying shares for her brother's account?","opts":["No","Yes, the Standard relating to disclosure of conflicts","Yes, the Standard relating to priority of transactions"],"qhtml":null,"ans":"A","expl":"No"},{"n":5,"q":"Ekta Prakash, CFA, works as an investment advisor for TXM Investments (TXM). Prakash advises a\nclient to transfer $150,000 from a tax-deferred investment account to TXM's multi-cap fund. Prakash\ndiscloses to her client that withdrawals from the tax-deferred account will attract a penalty of\n$15,000 but assures the client that the cost can be recovered through better investment returns\nfrom TXM's fund. Prakash has violated the Standard(s) relating to:","opts":["only misrepresentation.","only loyalty, prudence, and care.","both misrepresentation and loyalty, prudence, and care."],"qhtml":null,"ans":"C","expl":"both misrepresentation and loyalty, prudence, and care."},{"n":6,"q":"According to the GIPS standards, which of the following statements is most accurate? Verification:","opts":["ensures the accuracy of composite presentations.","is required to maintain compliance with the GIPS standards.","tests whether a firm has complied with composite construction requirements on a firm-wide\nbasis."],"qhtml":null,"ans":"C","expl":"tests whether a firm has complied with composite construction requirements on a\nfirm-wide basis."},{"n":7,"q":"John Smith, CFA, was hired by the Dunlap Investment Consulting Group to manage equity\ninvestments for the Allied Company Defined Benefit Pension Plan. Smith is required to report\nquarterly performance results to Allied Company's board. Smith owes a primary duty of loyalty,\nprudence, and care to:","opts":["Allied Company employees.","Dunlap Investment Consulting Group.","The Allied Company Pension Plan Trustees."],"qhtml":null,"ans":"A","expl":"Allied Company employees."},{"n":8,"q":"Shika Agarwal is a Level I candidate in the CFA program. Immediately after taking the exam,\nAgarwal posts in a social media group for CFA candidates arguing that the move to computer-based\ntesting would have an adverse impact on the quality of the CFA program. She also states how\nsurprised she was that the exam did not have quantitative questions on portfolio management. Has\nAgarwal violated the Standards?","opts":["No.","Yes, by stating that the exam did not have quantitative questions on portfolio management.","Yes, by arguing that the move to computer-based testing would have an adverse impact on\nthe quality of the CFA program."],"qhtml":null,"ans":"B","expl":"Yes, by stating that the exam did not have quantitative questions on portfolio\nmanagement."},{"n":9,"q":"Regarding ethical standards in the investment industry, which of the following is most accurate? The\nCFA Institute:","opts":["requires charterholders to engage in their professional communities.","aims to build market integrity by calling for regulations that align the interests of firms and\nclients.","promotes the highest standards of ethics, education, and professional excellence for the\nultimate benefit of shareholders."],"qhtml":null,"ans":"B","expl":"aims to build market integrity by calling for regulations that align the interests of firms\nand clients."},{"n":10,"q":"Jorge Fernandez, CFA, is an Equity analyst at a brokerage company. He suspects his colleague is\ntrading on shares prior to his research reports being distributed to clients. When Fernandez asks his\ncolleague about it, he is told to mind his own business. To comply with the Standard relating to\nknowledge of law, Fernandez should most likely:","opts":["report his suspicions to his supervisor.","continue to observe his colleague's trades.","discuss his colleague's trades with other analysts at the firm."],"qhtml":null,"ans":"A","expl":"report his suspicions to his supervisor."},{"n":11,"q":"Century Investment Management, Inc. (CIM), promotes Pierre Ash, CFA, to a supervisory position.\nAsh cannot discharge his supervisory responsibilities because CIM's compliance system is\ninadequate. Ash declines in writing to accept the supervisory responsibility. Has Ash violated the\nStandards?","opts":["No","Yes, the Standard relating to loyalty, prudence and care","Yes, the Standard relating to responsibilities of supervisors"],"qhtml":null,"ans":"A","expl":"No"},{"n":12,"q":"Maria Perez, CFA, is a portfolio manager for an advisory firm that utilizes external mutual funds. The\nfirm has a committee that selects external funds, using an analytical model to determine their\nchoices. Although Perez has no reason to question the committee's research process, she does not\nlike the committee's choice for a bond fund because it is not appropriate for all her clients. She\nresearches and selects a different bond fund that better meets her clients' needs, but her manager\ntells her that she is not permitted to make independent fund purchase decisions. She then invests in\nthe fund chosen by the committee for all of her clients. Has Perez most likely violated the\nStandards?","opts":["No","Yes, the Standard relating to suitability","Yes, the Standard relating to diligence and reasonable basis"],"qhtml":null,"ans":"B","expl":"Yes, the Standard relating to suitability"},{"n":13,"q":"Nidhi Mehta, CFA, is a fund manager at XYZ Investments. Mehta's fund delivers excellent returns\nfor the year. A large investor in the fund offers Mehta cash compensation along with free tickets to\nthe opening night of a sold-out opera as a reward for the fund's performance. Firm policy requires\nemployees to inform supervisors about monetary compensation received from clients. Mehta does\nnot inform her supervisor as she only accepts the tickets and not the cash compensation. Has\nMehta violated the Standards?","opts":["No","Yes, the Standard relating to fair dealing","Yes, the Standard relating to additional compensation arrangements"],"qhtml":null,"ans":"C","expl":"Yes, the Standard relating to additional compensation arrangements"},{"n":14,"q":"Which of the following is a recommended procedure for compliance with the Standard relating to\ndiligence and reasonable basis? Members should encourage their firms to:","opts":["consider the suitability of each investment solely on its own merits.","develop maximum levels of scenario testing of computer-based models used in evaluating\nfinancial instruments.","appoint an individual employee or a group of employees to determine that research reports\nhave a reasonable and adequate basis."],"qhtml":null,"ans":"C","expl":"appoint an individual employee or a group of employees to determine that research\nreports have a reasonable and adequate basis."},{"n":15,"q":"Faiza Hassan, CFA, is an equity analyst specializing in social media companies. Recently, she\nplaced a \"buy\" rating on WeGab Corp. Following her initial report on the company, Hassan's brother\nhas purchased a large amount of WeGab stock. Hassan has no beneficial ownership in her\nbrother's account. Hassan has been asked to write a follow-up report on WeGab because of strong\ntakeover rumors relating to the company. Will Hassan violate the Standards if she writes a follow-up\nreport without disclosing her brother's shareholding in the company?","opts":["No","Yes, the Standard relating to avoid or disclose conflicts","Yes, the Standard relating to loyalty, prudence, and care"],"qhtml":null,"ans":"A","expl":"No"},{"n":16,"q":"Asset owners most likely benefit from a firm being GIPS compliant because it:","opts":["eliminates the need for in-depth due diligence only.","facilitates the understanding of the sources of risk and excess return only.","both eliminates the need for in-depth due diligence and facilitates the understanding of the\nsources of risk and excess return."],"qhtml":null,"ans":"B","expl":"facilitates the understanding of the sources of risk and excess return only."},{"n":17,"q":"Which of the following policy recommendations is consistent with the Standards?\nRecommendation 1: Investment banking personnel should approve any changes in investment\nrecommendations from the research side.\nRecommendation 2: Firewalls should separate reporting structures for personnel on the research\nside and personnel on the investment banking side.\nRecommendation 3: Compensation arrangements should link research analyst remuneration\ndirectly to investment banking assignments in which analysts may participate as team members.","opts":["Recommendation 1","Recommendation 2","Recommendation 3"],"qhtml":null,"ans":"B","expl":"Recommendation 2"},{"n":18,"q":"A member receives referral fees for recommending third-party services to clients. Before entering\ninto an agreement with a new client, which of the following must the member disclose to the new\nclient?","opts":["Flat fees only","In kind benefits only","Both flat fees and in kind benefits"],"qhtml":null,"ans":"C","expl":"Both flat fees and in kind benefits"},{"n":19,"q":"For a retail client's account to be included in a GIPS-compliant firm's composite, it will most likely be\nin a composite:","opts":["restricted to retail accounts.","composed of discretionary accounts.","with both fee-paying and non-fee-paying accounts."],"qhtml":null,"ans":"B","expl":"composed of discretionary accounts."},{"n":20,"q":"Feng Liu, CFA, is an investment manager. Liu organizes nonviolent demonstrations on weekends to\nfight climate change. After repeated demonstrations, Liu is arrested and convicted for obstructing\npublic transit which is considered an act of civil disobedience in her country. Has Liu violated the\nStandards?","opts":["No","Yes, Liu has violated the Standard relating to loyalty","Yes, Liu has violated the Standard relating to misconduct"],"qhtml":null,"ans":"A","expl":"No"},{"n":21,"q":"Meghna Shah, CFA, manages a small-cap fund. Applying mosaic theory, Shah concludes that AK\nTech (AKT) is overpriced and sells the fund's significant holding in AKT. Shah is aware that her\ntransaction could impact AKT's price because the position is large enough to require disclosure to\nstock exchanges. A blog tracking stock news reports Shah's transaction, which leads to an 8%\ndecline in AKT's price, causing losses to other investors. Has Shah violated the Standards?","opts":["No","Yes, the Standard relating to market manipulation","Yes, the Standard relating to material nonpublic information"],"qhtml":null,"ans":"A","expl":"No"},{"n":22,"q":"Frank Schneider, CFA, a securities analyst, applies for a new position. In his application, he makes\ntwo statements:\nStatement 1: I passed all three CFA examinations in three consecutive attempts.\nStatement 2: Based on my success in the CFA Program, I have a superior ability to analyze stocks\ncompared to my peers.\nSchneider has most likely violated the Standards by making:","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"qhtml":null,"ans":"B","expl":"Statement 2 only"},{"n":23,"q":"Sue Kim, CFA, a US citizen, works as an analyst for a subsidiary of a US investment firm on a small\nisland that attracts offshore investment accounts. Local securities laws allow insider trading. While\nhaving dinner with the CEO of a local company, Kim learns that the firm is in negotiations to be\nacquired for a significant premium. Would Kim most likely comply with the CFA Institute Standards if\nshe purchased the company's shares for her client accounts?","opts":["No","Yes, because local laws allow insider trading","Yes, if she receives permission from her firm's compliance department"],"qhtml":null,"ans":"A","expl":"No"},{"n":24,"q":"A member works in a country where there is no regulation relating to investment performance\nstandards. In the absence of any regulatory guidance, the member is required to communicate\ninvestment performance information to her clients in accordance with:","opts":["the GIPS standards.","the Code and Standards.","stricter of the GIPS standards and the Code and Standards."],"qhtml":null,"ans":"B","expl":"the Code and Standards."},{"n":25,"q":"According to the Standard relating to preservation of confidentiality, if local laws require a\ninvestment personnel to maintain confidentiality, is a member permitted to share confidential client\ninformation?","opts":["No","Yes, if the information concerns activities of a former client","Yes, if the information is provided in support of an investigation by the CFA Institute\nProfessional Conduct Program into the member's conduct"],"qhtml":null,"ans":"A","expl":"No"},{"n":26,"q":"Which of the following member actions most likely violates the Standard relating to fair dealing?","opts":["Providing premium service levels to clients who pay higher fees","Selectively offering different service levels to prospective clients","Using different communication methods to recommend investments to clients"],"qhtml":null,"ans":"B","expl":"Selectively offering different service levels to prospective clients"},{"n":27,"q":"Sara Perkin, CFA, sends a stock recommendation in capsule form to clients and adds that\nadditional information is available upon request. Perkin's colleague, Tom Miller, CFA, uses a return\nforecasting model which has delivered positive results for his equity fund in each of the last seven\nyears. Miller provides the model output in a marketing brochure and notes: \"The fund will continue\nto deliver a positive return next year.\" Has the Standard relating to communication with clients and\nprospective clients been violated?","opts":["No","Yes, by Miller","Yes, by Perkin"],"qhtml":null,"ans":"B","expl":"Yes, by Miller"},{"n":28,"q":"An inventory system that reduces average inventory without affecting sales will most likely reduce\nthe:","opts":["quick ratio.","inventory turnover.","cash conversion cycle."],"qhtml":null,"ans":"C","expl":"cash conversion cycle."},{"n":29,"q":"With respect to fintech, which of the following statements is most accurate?","opts":["Big Data solves the issue of selection bias.","A neural network that learns a dataset too precisely may indicate overfitting.","Machine learning algorithms require assumptions on the underlying probability distribution of\nthe data."],"qhtml":null,"ans":"B","expl":"A neural network that learns a dataset too precisely may indicate overfitting."},{"n":30,"q":"In calculating basic and diluted EPS, if the numerators are the same but the denominators are\ndifferent, the company:","opts":["split its stock during the year.","had stock options outstanding at year end.","had convertible debt outstanding at year end."],"qhtml":null,"ans":"B","expl":"had stock options outstanding at year end."},{"n":31,"q":"Which of the following is most likely a feature of sole proprietorships?","opts":["Existence of a legal identity","Operational simplicity and flexibility","Taxation of business profits as corporate income"],"qhtml":null,"ans":"B","expl":"Operational simplicity and flexibility"},{"n":32,"q":"A risky project has an initial cash outflow followed by cash inflows only. If the project's IRR is zero,\nthe project's NPV is most likely:","opts":["negative.","zero.","positive."],"qhtml":null,"ans":"A","expl":"negative."},{"n":33,"q":"Which of the following is a common pitfall in capital allocation analysis?","opts":["Ignoring costs of internal financing","Performing analysis in nominal terms","Incorporating other companies' potential responses into the analysis"],"qhtml":null,"ans":"A","expl":"Ignoring costs of internal financing"},{"n":34,"q":"Which of the following best reflects good corporate governance?","opts":["Dual-class share structure","Established brand reputation","Diversity, experience, and independence of directors"],"qhtml":null,"ans":"C","expl":"Diversity, experience, and independence of directors"},{"n":35,"q":"Which of the following disclosures about intangible assets is required under US GAAP?","opts":["Why an asset is considered to have an indefinite life","Where amortization is included on the income statement","What the estimated amortization expense for the next five fiscal years will be"],"qhtml":null,"ans":"C","expl":"What the estimated amortization expense for the next five fiscal years will be"},{"n":36,"q":"An analyst forecasts the following results for a company.\nNet profit margin 18%\nDepreciation $6 million\nDecrease in working capital $1.5 million\nIncrease in fixed capital $6 millionMarket share 9%\nIf total industry sales are forecasted to be $3.3 billion and the company has no interest expense,\nthe company's forecasted free cash flow to the firm is closest to:","opts":["$43 million.","$52 million.","$55 million."],"qhtml":null,"ans":"C","expl":"$55 million."},{"n":37,"q":"Which of the following would best mitigate an analyst's confirmation bias when forecasting a firm's\nfinancial statements?","opts":["Speaking with management of the firm","Ignoring information about the firm's competitors","Reading the research from analysts with a negative opinion of the firm"],"qhtml":null,"ans":"C","expl":"Reading the research from analysts with a negative opinion of the firm"},{"n":38,"q":"Because of a problem with the production process, a manufacturer produced a batch of defective\nfinished goods with a total cost of $18,000. The sales value of this batch in its current condition is\n$6,000. With $3,000 of additional processing, however, the batch could be sold for $11,000. The\nvalue of the unsold inventory is closest to:","opts":["$8,000.","$9,000.","$11,000."],"qhtml":null,"ans":"A","expl":"$8,000."},{"n":39,"q":"A common market has a higher degree of economic integration than a(n):","opts":["customs union.","monetary union.","economic union."],"qhtml":null,"ans":"A","expl":"customs union."},{"n":40,"q":"An analyst runs a simple linear regression using 35 months of data to assess a country's short-term\ninterest rate as a function of its inflation rate, with the following results:\nSource Degrees of Freedom Sum of Squares Mean Square\nRegression 1 17.3009 17.3009\nError 33 20.2299 0.6130\nTotal 34 37.5308 ---\nThe percentage of the variation in the short-term interest rate that is explained by the inflation rate\nis closest to:","opts":["46%.","54%.","61%."],"qhtml":null,"ans":"A","expl":"46%."},{"n":41,"q":"An asset management firm generated the following annual returns in their US large-cap portfolio:\n2008: −34.8% | 2009: 32.2% | 2010: 11.1% | 2011: -1.4%\nThe 2012 return needed to achieve a trailing five-year geometric mean annualized return of 5%,\nwhen calculated at the end of 2012, is closest to:","opts":["17.9%.","27.6%.","35.2%."],"qhtml":null,"ans":"C","expl":"35.2%."},{"n":42,"q":"A central bank most likely:","opts":["will not lend money to banks facing shortages.","is a monopoly supplier of a country's currency.","does not manage a country's foreign currency reserves."],"qhtml":null,"ans":"B","expl":"is a monopoly supplier of a country's currency."},{"n":43,"q":"A lessee entering into a long-term lease most likely:","opts":["faces a higher risk of obsolescence compared to purchasing the asset with cash.","reports a lower total asset turnover in the year of acquisition compared to purchasing the\nasset with cash.","reports a greater investing cash outflow in the year of acquisition compared to purchasing\nthe asset with cash."],"qhtml":null,"ans":"B","expl":"reports a lower total asset turnover in the year of acquisition compared to purchasing\nthe asset with cash."},{"n":44,"q":"An analyst gathers the following information about a company:\nROE: 6% | ROA: 4% Average total asset: €600,000\nBased only on this information, average total liabilities are:","opts":["€200,000.","€300,000.","€400,000."],"qhtml":null,"ans":"A","expl":"€200,000."},{"n":45,"q":"In contrast to non-probability sampling, probability sampling:","opts":["depends on factors other than probability considerations.","has a high risk of generating a non-representative sample.","gives every member of the population an equal chance of being selected."],"qhtml":null,"ans":"C","expl":"gives every member of the population an equal chance of being selected."},{"n":46,"q":"In which phase of the business cycle is actual output most likely below potential output?","opts":["Recovery","Slowdown","Expansion"],"qhtml":null,"ans":"A","expl":"Recovery"},{"n":47,"q":"An analyst gathers the following information about a company that uses only common equity and\ndebt in its capital structure:\nCost of debt, estimated by yield to maturity: 5.1% | Cost of equity: 9.8% | Percent of capital from\ndebt: 40%\nIf the company's marginal tax rate is 25%, the WACC is closest to:","opts":["5.9%.","7.4%.","7.9%."],"qhtml":null,"ans":"B","expl":"7.4%."},{"n":48,"q":"The 'box' in a box and whisker plot represents the:","opts":["interquartile range.","range between the median and the arithmetic average.","range between the highest and lowest values of the distribution."],"qhtml":null,"ans":"A","expl":"interquartile range."},{"n":49,"q":"An analyst gathers the following information (in £ thousands) about equipment owned by a\ncompany:\nCarrying amount prior to impairment: 36 | Fair value: 34 | Selling costs: 4\nUndiscounted expected future cash flows: 38 | Discounted expected future cash flows: 32\nThe equipment is considered impaired under:","opts":["IFRS only.","US GAAP only.","both IFRS and US GAAP."],"qhtml":null,"ans":"A","expl":"IFRS only."},{"n":50,"q":"The reversal of a prior fiscal year inventory write-down is:","opts":["prohibited.","recognized as a reduction in cost of sales.","recognized as an increase in other operating income."],"qhtml":null,"ans":"B","expl":"recognized as a reduction in cost of sales."},{"n":51,"q":"The structural budget deficit is the deficit that exists if the economy:","opts":["is below full potential output.","is at full potential output.","is above full potential output."],"qhtml":null,"ans":"B","expl":"is at full potential output."},{"n":52,"q":"Two populations are normally distributed with unknown variances that are assumed to be equal. A\nlarge independent random sample is drawn from each population. The most appropriate test\nstatistic for testing the difference between the population means is:","opts":["t-statistic.","z-statistic.","F-statistic."],"qhtml":null,"ans":"A","expl":"t-statistic."},{"n":53,"q":"An analyst gathers the following information about a company's 3-year contract to produce\ncomputers:\nTotal sales price €200,000\nEstimated total costs €100,000\nActual costs incurred in Year 1 €50,000\nTotal contracted number of computers to be produced 100 units\nTotal number of computers produced in Year 1 30 units\nThe output method provides an appropriate measure of progress towards completing the contract\nand performance obligations are satisfied over time. Assuming it is highly probable that revenue will\nnot be subsequently reversed, revenue recognized in Year 1 is closest to:","opts":["€60,000.","€66,667.","€100,000."],"qhtml":null,"ans":"A","expl":"€60,000."},{"n":54,"q":"An analyst gathers the following USD/GBP exchange rate information:\nUSD/GBP spot rate: 1.11721 | USD/GBP 1-year forward rate: 1.11851\n(USD/GBP is the amount of USD per 1 GBP)\nThe 1-year forward points are closest to:","opts":["1.2.","13.0.","25.0."],"qhtml":null,"ans":"B","expl":"13.0."},{"n":55,"q":"Which of the following statements about financial reporting is most accurate?","opts":["Aggressive accounting choices in the current period may decrease the company's future\nreported earnings.","High-quality financial reports contain information that is relevant, complete, conservative,\nand free from error.","Conservative accounting choices help a company with good performance issue higher\nquality financial reports."],"qhtml":null,"ans":"A","expl":"Aggressive accounting choices in the current period may decrease the company's\nfuture reported earnings."},{"n":56,"q":"A mining company has received government approval for the development of a mining property and\nhas also consulted with members of the local community near the development site throughout the\nproject assessment process. The latter action is best described as an example of:","opts":["regulatory compliance.","stakeholder management.","principal-agent conflict mitigation."],"qhtml":null,"ans":"B","expl":"stakeholder management."},{"n":57,"q":"Under US GAAP, material income items that are unusual and infrequent are shown as part of:","opts":["continuing operations and presented separately.","continuing operations and not presented separately.","non-operating activities and not presented separately."],"qhtml":null,"ans":"A","expl":"continuing operations and presented separately."},{"n":58,"q":"A deferred tax liability could arise when:","opts":["interest is received in advance but taxed on a cash basis.","the carrying amount of an asset is higher than its tax base.","taxable income is higher than accounting profit due to temporary differences."],"qhtml":null,"ans":"B","expl":"the carrying amount of an asset is higher than its tax base."},{"n":59,"q":"Using long-term debt or equity to finance working capital needs most likely:","opts":["reduces the cost of financing working capital.","provides the opportunity to borrow only as needed.","reduces the need to access capital markets in times of stress."],"qhtml":null,"ans":"C","expl":"reduces the need to access capital markets in times of stress."},{"n":60,"q":"An analyst gathers the following information about a company:\nAverage variable cost per unit $12.50\nSelling price per unit $37.50\nTotal fixed costs $900,000\nThe minimum production level needed to continue operations over the long run is most likely:","opts":["24,000 units.","36,000 units.","72,000 units."],"qhtml":null,"ans":"B","expl":"36,000 units."},{"n":61,"q":"For an analyst estimating a company's target capital structure, which of the following methods is\nmost appropriate?","opts":["Use the company's capital structure at book value weights.","Use the average capital structure of a diversified group of companies","Infer the target capital structure by analyzing management statements on capital structure\npolicy."],"qhtml":null,"ans":"C","expl":"Infer the target capital structure by analyzing management statements on capital\nstructure policy."},{"n":62,"q":"Which of the following statements about kurtosis is most accurate?","opts":["A fat-tailed distribution is referred to as platykurtic.","All distributions with kurtosis above zero are fat-tailed.","The calculation for kurtosis involves finding the average of deviations from the mean raised\nto the fourth power."],"qhtml":null,"ans":"C","expl":"The calculation for kurtosis involves finding the average of deviations from the mean\nraised to the fourth power."},{"n":63,"q":"An analyst gathers the following information about a company:\nYear 2 Year 1\nRevenue €725,000 €720,000\nEBIT €93,500 €91,500\nNet income €57,500 €58,000\nWeighted average common shares outstanding during the year 650,000 635,000\nWhich of the following increased from Year 1 to Year 2?","opts":["Basic EPS","EBIT margin","Net profit margin"],"qhtml":null,"ans":"B","expl":"EBIT margin"},{"n":64,"q":"Monetary policy:","opts":["aims to redistribute wealth within the economy.","adjusts taxation rates to influence growth in the economy.","aims to control the quantity of money and credit in an economy."],"qhtml":null,"ans":"C","expl":"aims to control the quantity of money and credit in an economy."},{"n":65,"q":"An analyst examines the following quarterly returns for a client's portfolio:\nQuarter Return (%)\n1 8\n2 3\n3 −2\n4 10\n5 8\n6 0\n7 −3\n8 12\nIf the target return is 5% per quarter, the target downside deviation is closest to:","opts":["4.50%.","11.92%.","20.29%."],"qhtml":null,"ans":"A","expl":"4.50%."},{"n":66,"q":"An increase in a central bank's policy rate most likely leads to:","opts":["decreasing real domestic demand and increasing net external demand.","increasing real domestic demand and decreasing net external demand.","decreasing real domestic demand and decreasing net external demand."],"qhtml":null,"ans":"C","expl":"decreasing real domestic demand and decreasing net external demand."},{"n":67,"q":"If an auditor is experiencing some scope limitation, but can still issue an opinion, the auditor most\nlikely issues a(n):","opts":["adverse opinion.","qualified opinion.","disclaimer of opinion."],"qhtml":null,"ans":"B","expl":"qualified opinion."},{"n":68,"q":"An account has a stated annual interest rate of 3.6% with monthly compounding. The number of\nyears it will take for an initial investment in the account to double is closest to:","opts":["19.3.","19.6.","20.0."],"qhtml":null,"ans":"A","expl":"19.3."},{"n":69,"q":"Whenever Variable X increases by four units, Variable Y increases by one unit. The correlation\nbetween X and Y is:","opts":["0.25.","0.75.","1.00."],"qhtml":null,"ans":"C","expl":"1.00."},{"n":70,"q":"The F-statistic for the test of fit of a simple linear regression is given by the:","opts":["mean square regression divided by the mean square error.","mean square regression divided by the sum of squares total.","sum of squares regression divided by the sum of squares total."],"qhtml":null,"ans":"A","expl":"mean square regression divided by the mean square error."},{"n":71,"q":"An analyst gathers the following information (in € thousands) about a company:\nYear 2 Year 1\nRevenue 2,400 2,000\nCost of sales 1,800 1,400\nEnding accounts receivable 240 160\nThe number of days of sales outstanding for Year 2, based on a 365-day year, is closest to:","opts":["30 days.","33 days.","41 days."],"qhtml":null,"ans":"A","expl":"30 days."},{"n":72,"q":"With respect to national security, a country focusing on domestic economic factors most likely\nfocuses on:","opts":["growing national wealth.","standardization of industries.","securing essential resources through trade."],"qhtml":null,"ans":"A","expl":"growing national wealth."},{"n":73,"q":"Nationalization of i const CFG = {"title":"Premium Mock 3 (2026) — Session 1","subtitle":"CFA Level I · Premium 2026 · 90 câu · 2h15p","minutes":135,"passMark":70,"hasAnswers":true,"hasExpl":true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);

  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';

      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<style id="qnav-note-css">
  #navGrid .cell.noted::before{content:"\1F4DD";position:absolute;top:-4px;left:-3px;font-size:10px;line-height:1}
</style>
<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
