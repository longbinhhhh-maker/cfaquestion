kedasticity is least accurate?", "opts": ["Heteroskedasticity may occur in cross-sectional or time-series analyses.", "Heteroskedasticity results in an estimated variance that is too small and, therefore, affects statistical inference.", "The assumption of linear regression is that the residuals are heteroskedastic."], "ans": "C", "expl": "The assumption of regression is that the residuals are homoskedastic (i.e., the residuals are drawn from the same distribution).", "explhtml": "<p>The assumption of regression is that the residuals are homoskedastic (i.e., the residuals are drawn from the same distribution).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Which of the following statements regarding heteroskedasticity is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 53, "q": "May Jones estimated a regression that produced the following analysis of variance (ANOVA) table: Source Sum of squares Degrees of freedom Mean square Regression 20 1 20 Error 80 40 2 Total 100 41  The values of R² and the F-statistic for joint test of significance of all the slope coefficients are:", "opts": ["R² = 0.25 and F = 0.909.", "R² = 0.20 and F = 10.", "R² = 0.25 and F = 10."], "ans": "B", "expl": "R² = RSS / SST = 20 / 100 = 0.20 The F-statistic is equal to the ratio of the mean squared regression to the mean squared error. F = 20 / 2 = 10", "explhtml": "<p>R<sup>2<\/sup> = RSS / SST = 20 / 100 = 0.20<\/p><p>The F-statistic is equal to the ratio of the mean squared regression to the mean squared error.<\/p><p>F = 20 / 2 = 10<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>May Jones estimated a regression that produced the following analysis of variance (ANOVA) table:<\/p><div class=\"tbl\"><table><tr><td>Source<\/td><td>Sum of squares<\/td><td>Degrees of freedom<\/td><td>Mean square<\/td><\/tr><tr><td>Regression<\/td><td>20<\/td><td>1<\/td><td>20<\/td><\/tr><tr><td>Error<\/td><td>80<\/td><td>40<\/td><td>2<\/td><\/tr><tr><td>Total<\/td><td>100<\/td><td>41<\/td><td><\/td><\/tr><\/table><\/div><p>The values of R<sup>2<\/sup> and the F-statistic for joint test of significance of all the slope coefficients are:<\/p><\/div>", "subj": "quant"}, {"n": 54, "q": "The predicted price of a house that has 2,000 square feet of space and 4 bedrooms is closest to:", "opts": ["$114,000.", "$256,000.", "$185,000."], "ans": "B", "expl": "66,500 + 74.30(2,000) + 10,306(4) = $256,324", "explhtml": "<p>66,500 + 74.30(2,000) + 10,306(4) = $256,324<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–56<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 54–56). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The predicted price of a house that has 2,000 square feet of space and 4 bedrooms is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 55, "q": "The conclusion from the hypothesis test of H₀: b₁ = b₂ = 0, is that the null hypothesis should:", "opts": ["not be rejected as the calculated F of 40.73 is greater than the critical value of 3.29.", "be rejected as the calculated F of 40.73 is greater than the critical value of 3.33.", "be rejected as the calculated F of 40.73 is greater than the critical value of 3.29."], "ans": "B", "expl": "We can reject the null hypothesis that coefficients of both independent variables equal 0. The F value for comparison is F2,29 = 3.33. The degrees of freedom in the numerator is 2; equal to the number of independent variables. Degrees of freedom for the denominator is 32 − (2+1) = 29. The critical value of the F-test needed to reject the null hypothesis is thus 3.33. The actual value of the F-test statistic is 40.73, so the null hypothesis should be rejected, as the calculated F of 40.73 is greater than the critical value of 3.33.", "explhtml": "<p>We can reject the null hypothesis that coefficients of both independent variables equal 0. The F value for comparison is F<sub>2,29<\/sub> = 3.33. The degrees of freedom in the numerator is 2; equal to the number of independent variables. Degrees of freedom for the denominator is 32 − (2+1) = 29. The critical value of the F-test needed to reject the null hypothesis is thus 3.33. The actual value of the F-test statistic is 40.73, so the null hypothesis should be rejected, as the calculated F of 40.73 is greater than the critical value of 3.33.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–56<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>The conclusion from the hypothesis test of H<sub>0<\/sub>: b<sub>1<\/sub> = b<sub>2<\/sub> = 0, is that the null hypothesis should:<\/p><\/div>", "subj": "quant"}, {"n": 56, "q": "Which of the following is most likely to present a problem in using this regression for forecasting?", "opts": ["Heteroskedasticity.", "Multicollinearity.", "Autocorrelation."], "ans": "B", "expl": "Multicollinearity is present in a regression model when some linear combination of the independent variables are highly correlated. We are told that the two independent variables in this question are highly correlated. We also recognize that unconditional heteroskedasticity is present – but this would not pose any major problems in using this model for forecasting. No information is given about autocorrelation in residuals, but this is generally a concern with time series data (in this case, the model uses cross-sectional data).", "explhtml": "<p>Multicollinearity is present in a regression model when some linear combination of the independent variables are highly correlated. We are told that the two independent variables in this question are highly correlated. We also recognize that unconditional heteroskedasticity is present – but this would not pose any major problems in using this model for forecasting. No information is given about autocorrelation in residuals, but this is generally a concern with time series data (in this case, the model uses cross-sectional data).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 54–56<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>Which of the following is most likely to present a problem in using this regression for forecasting?<\/p><\/div>", "subj": "quant"}, {"n": 57, "q": "Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years and estimates the following equation (standard errors in parentheses): SALES = α + 0.004 POP + 1.031 INCOME + 2.002 ADV   (0.005) (0.337) (2.312) The critical t-statistic for a 95% confidence level is 2.120. Which of the independent variables is statistically different from zero at the 95% confidence level?", "opts": ["INCOME and ADV.", "ADV only.", "INCOME only."], "ans": "C", "expl": "The calculated test statistic is coefficient/standard error. Hence, the t-stats are 0.8 for POP, 3.059 for INCOME, and 0.866 for ADV. Since the t-stat for INCOME is the only one greater than the critical t-value of 2.120, only INCOME is significantly different from zero.", "explhtml": "<p>The calculated test statistic is coefficient/standard error. Hence, the t-stats are 0.8 for POP, 3.059 for INCOME, and 0.866 for ADV. Since the t-stat for INCOME is the only one greater than the critical t-value of 2.120, only INCOME is significantly different from zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years and estimates the following equation (standard errors in parentheses):<\/p><div class=\"tbl\"><table><tr><td>SALES<\/td><td>= α<\/td><td>+ 0.004 POP<\/td><td>+ 1.031 INCOME<\/td><td>+ 2.002 ADV<\/td><\/tr><tr><td><\/td><td><\/td><td>(0.005)<\/td><td>(0.337)<\/td><td>(2.312)<\/td><\/tr><\/table><\/div><p>The critical t-statistic for a 95% confidence level is 2.120. Which of the independent variables is statistically different from zero at the 95% confidence level?<\/p><\/div>", "subj": "quant"}, {"n": 58, "q": "Jacob Warner, CFA, is evaluating a regression analysis recently published in a trade journal that hypothesizes that the annual performance of the S&P 500 stock index can be explained by movements in the Federal Funds rate and the U.S. Producer Price Index (PPI). Which of the following statements regarding his analysis is most accurate?", "opts": ["If the p-value of a variable is less than the significance level, the null hypothesis can be rejected.", "If the t-value of a variable is less than the significance level, the null hypothesis should be rejected.", "If the p-value of a variable is less than the significance level, the null hypothesis cannot be rejected."], "ans": "A", "expl": "The p-value is the smallest level of significance for which the null hypothesis can be rejected. Therefore, for any given variable, if the p-value of a variable is less than the significance level, the null hypothesis can be rejected and the variable is considered to be statistically significant.", "explhtml": "<p>The p-value is the smallest level of significance for which the null hypothesis can be rejected. Therefore, for any given variable, if the p-value of a variable is less than the significance level, the null hypothesis can be rejected and the variable is considered to be statistically significant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Jacob Warner, CFA, is evaluating a regression analysis recently published in a trade journal that hypothesizes that the annual performance of the S&amp;P 500 stock index can be explained by movements in the Federal Funds rate and the U.S. Producer Price Index (PPI). Which of the following statements regarding his analysis is most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 59, "q": "Which of the following statements regarding serial correlation that might be encountered in regression analysis is least accurate?", "opts": ["Serial correlation occurs least often with time series data.", "Serial correlation does not affect consistency of regression coefficients.", "Positive serial correlation and heteroskedasticity can both lead to Type I errors."], "ans": "A", "expl": "Serial correlation, which is sometimes referred to as autocorrelation, occurs when the residual terms are correlated with one another, and is most frequently encountered with time series data. Positive serial correlation can lead to standard errors that are too small, which will cause computed t-statistics to be larger than they should be, which will lead to too many Type I errors (i.e. the rejection of the null hypothesis when it is actually true). Serial correlation however does not affect the consistency of the regression coefficients.", "explhtml": "<p>Serial correlation, which is sometimes referred to as autocorrelation, occurs when the residual terms are correlated with one another, and is most frequently encountered with time series data. Positive serial correlation can lead to standard errors that are too small, which will cause computed t-statistics to be larger than they should be, which will lead to too many Type I errors (i.e. the rejection of the null hypothesis when it is actually true). Serial correlation however does not affect the consistency of the regression coefficients.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Which of the following statements regarding serial correlation that might be encountered in regression analysis is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 60, "q": "Assume that in a particular multiple regression model, it is determined that the error terms are uncorrelated with each other. Which of the following statements is most accurate?", "opts": ["Serial correlation may be present in this multiple regression model, and can be confirmed only through a Durbin-Watson test.", "This model is in accordance with the basic assumptions of multiple regression analysis because the errors are not serially correlated.", "Unconditional heteroskedasticity present in this model should not pose a problem, but can be corrected by using robust standard errors."], "ans": "B", "expl": "One of the basic assumptions of multiple regression analysis is that the error terms are not correlated with each other. In other words, the error terms are not serially correlated. Multicollinearity and heteroskedasticity are problems in multiple regression that are not related to the correlation of the error terms.", "explhtml": "<p>One of the basic assumptions of multiple regression analysis is that the error terms are not correlated with each other. In other words, the error terms are not serially correlated. Multicollinearity and heteroskedasticity are problems in multiple regression that are not related to the correlation of the error terms.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Assume that in a particular multiple regression model, it is determined that the error terms are uncorrelated with each other. Which of the following statements is most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 61, "q": "An analyst runs a regression of monthly value-stock returns on five independent variables over 48 months. The total sum of squares is 430, and the sum of squared errors is 170. Test the null hypothesis at the 2.5% and 5% significance level that all five of the independent variables are equal to zero.", "opts": ["Rejected at 5% significance only.", "Rejected at 2.5% significance and 5% significance.", "Not rejected at 2.5% or 5.0% significance."], "ans": "B", "expl": "The F-statistic is equal to the ratio of the mean squared regression (MSR) to the mean squared error (MSE). RSS = SST – SSE = 430 – 170 = 260 MSR = 260 / 5 = 52 MSE = 170 / (48 – 5 – 1) = 4.05 F = 52 / 4.05 = 12.84 The critical F-value for 5 and 42 degrees of freedom at a 5% significance level is approximately 2.44. The critical F-value for 5 and 42 degrees of freedom at a 2.5% significance level is approximately 2.89. Therefore, we can reject the null hypothesis at either level of significance and conclude that at least one of the five independent variables explains a significant portion of the variation of the dependent variable.", "explhtml": "<p>The F-statistic is equal to the ratio of the mean squared regression (MSR) to the mean squared error (MSE).<\/p><p>RSS = SST – SSE = 430 – 170 = 260<\/p><p>MSR = 260 / 5 = 52<\/p><p>MSE = 170 / (48 – 5 – 1) = 4.05<\/p><p>F = 52 / 4.05 = 12.84<\/p><p>The critical F-value for 5 and 42 degrees of freedom at a 5% significance level is approximately 2.44. The critical F-value for 5 and 42 degrees of freedom at a 2.5% significance level is approximately 2.89. Therefore, we can reject the null hypothesis at either level of significance and conclude that at least one of the five independent variables explains a significant portion of the variation of the dependent variable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>An analyst runs a regression of monthly value-stock returns on five independent variables over 48 months. The total sum of squares is 430, and the sum of squared errors is 170. Test the null hypothesis at the 2.5% and 5% significance level that all five of the independent variables are equal to zero.<\/p><\/div>", "subj": "quant"}, {"n": 62, "q": "Wilson estimated a regression that produced the following analysis of variance (ANOVA) table: Source Sum of squares Degrees of freedom Mean square Regression 100 1 100.0 Error 300 40 7.5 Total 400 41  The values of R² and the F-statistic to test the null hypothesis that slope coefficients on all variables are equal to zero are:", "opts": ["R² = 0.20 and F = 13.333.", "R² = 0.25 and F = 0.930.", "R² = 0.25 and F = 13.333."], "ans": "C", "expl": "R² = RSS / SST = 100 / 400 = 0.25 The F-statistic is equal to the ratio of the mean squared regression to the mean squared error. F = 100 / 7.5 = 13.333", "explhtml": "<p>R<sup>2<\/sup> = RSS / SST = 100 / 400 = 0.25<\/p><p>The F-statistic is equal to the ratio of the mean squared regression to the mean squared error.<\/p><p>F = 100 / 7.5 = 13.333<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Wilson estimated a regression that produced the following analysis of variance (ANOVA) table:<\/p><div class=\"tbl\"><table><tr><td>Source<\/td><td>Sum of squares<\/td><td>Degrees of freedom<\/td><td>Mean square<\/td><\/tr><tr><td>Regression<\/td><td>100<\/td><td>1<\/td><td>100.0<\/td><\/tr><tr><td>Error<\/td><td>300<\/td><td>40<\/td><td>7.5<\/td><\/tr><tr><td>Total<\/td><td>400<\/td><td>41<\/td><td><\/td><\/tr><\/table><\/div><p>The values of R<sup>2<\/sup> and the F-statistic to test the null hypothesis that slope coefficients on all variables are equal to zero are:<\/p><\/div>", "subj": "quant"}, {"n": 63, "q": "Which of the following tests is least likely to be used to detect autocorrelation?", "opts": ["Durbin-Watson.", "Breusch-Godfrey.", "Breusch-Pagan."], "ans": "C", "expl": "Durbin-Watson and Breusch-Godfrey test statistic are used to detect autocorrelation. The Breusch-Pagan test is used to detect heteroskedasticity.", "explhtml": "<p>Durbin-Watson and Breusch-Godfrey test statistic are used to detect autocorrelation. The Breusch-Pagan test is used to detect heteroskedasticity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–65<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"kq-note\">Câu thuộc item set (câu 63–65). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following tests is least likely to be used to detect autocorrelation?<\/p><\/div>", "subj": "quant"}, {"n": 64, "q": "One of the most popular ways to correct heteroskedasticity is to:", "opts": ["improve the specification of the model.", "adjust the standard errors.", "use robust standard errors."], "ans": "C", "expl": "Using generalized least squares and calculating robust standard errors are possible remedies for heteroskedasticity. Improving specifications remedies serial correlation. The standard error cannot be adjusted, only the coefficient of the standard errors.", "explhtml": "<p>Using generalized least squares and calculating robust standard errors are possible remedies for heteroskedasticity. Improving specifications remedies serial correlation. The standard error cannot be adjusted, only the coefficient of the standard errors.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–65<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>One of the most popular ways to correct heteroskedasticity is to:<\/p><\/div>", "subj": "quant"}, {"n": 65, "q": "If a regression equation shows that no individual t-tests are significant, but the F-statistic is significant, the regression probably exhibits:", "opts": ["serial correlation.", "multicollinearity.", "heteroskedasticity."], "ans": "B", "expl": "Common indicators of multicollinearity include: high correlation (>0.7) between independent variables, no individual t-tests are significant but the F-statistic is, and signs on the coefficients that are opposite of what is expected.", "explhtml": "<p>Common indicators of multicollinearity include: high correlation (&gt;0.7) between independent variables, no individual t-tests are significant but the F-statistic is, and signs on the coefficients that are opposite of what is expected.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 63–65<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>If a regression equation shows that no individual t-tests are significant, but the F-statistic is significant, the regression probably exhibits:<\/p><\/div>", "subj": "quant"}, {"n": 66, "q": "A fund has changed managers twice during the past 10 years. An analyst wishes to measure whether either of the changes in managers has had an impact on performance. R is the return on the fund, and M is the return on a market index. Which of the following regression equations can appropriately measure the desired impacts?", "opts": ["The desired impact cannot be measured.", "R = a + bM + c₁D₁ + c₂D₂ + ε, where D₁ = 1 if the return is from the first manager, and D₂ = 1 if the return is from the third manager.", "R = a + bM + c₁D₁ + c₂D₂ + c₃D₃ + ε, where D₁ = 1 if the return is from the first manager, and D₂ = 1 if the return is from the second manager, and D₃ = 1 is the return is from the third manager."], "ans": "B", "expl": "The effect needs to be measured by two distinct dummy variables. The use of three variables will cause collinearity, and the use of one dummy variable will not appropriately specify the manager impact.", "explhtml": "<p>The effect needs to be measured by two distinct dummy variables. The use of three variables will cause collinearity, and the use of one dummy variable will not appropriately specify the manager impact.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"qtext\"><p>A fund has changed managers twice during the past 10 years. An analyst wishes to measure whether either of the changes in managers has had an impact on performance. R is the return on the fund, and M is the return on a market index. Which of the following regression equations can appropriately measure the desired impacts?<\/p><\/div>", "subj": "quant"}, {"n": 67, "q": "Consider the following regression equation: Salesᵢ = 20.5 + 1.5 R&Dᵢ + 2.5 ADVᵢ – 3.0 COMPᵢ where Sales is dollar sales in millions, R&D is research and development expenditures in millions, ADV is dollar amount spent on advertising in millions, and COMP is the number of competitors in the industry. Which of the following is NOT a correct interpretation of this regression information?", "opts": ["If R&D and advertising expenditures are $1 million each and there are 5 competitors, expected sales are $9.5 million.", "One more competitor will mean $3 million less in sales (holding everything else constant).", "If a company spends $1 more on R&D (holding everything else constant), sales are expected to increase by $1.5 million."], "ans": "C", "expl": "If a company spends $1 million more on R&D (holding everything else constant), sales are expected to increase by $1.5 million. Always be aware of the units of measure for the different variables.", "explhtml": "<p>If a company spends $1 million more on R&amp;D (holding everything else constant), sales are expected to increase by $1.5 million. Always be aware of the units of measure for the different variables.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Consider the following regression equation:<\/p><p>Sales<sub>i<\/sub> = 20.5 + 1.5 R&amp;D<sub>i<\/sub> + 2.5 ADV<sub>i<\/sub> – 3.0 COMP<sub>i<\/sub><\/p><p>where Sales is dollar sales in millions, R&amp;D is research and development expenditures in millions, ADV is dollar amount spent on advertising in millions, and COMP is the number of competitors in the industry.<\/p><p>Which of the following is NOT a correct interpretation of this regression information?<\/p><\/div>", "subj": "quant"}, {"n": 68, "q": "Which of the following is a potential remedy for multicollinearity?", "opts": ["Add dummy variables to the regression.", "Take first differences of the dependent variable.", "Omit one or more of the collinear variables."], "ans": "C", "expl": "The first differencing is not a remedy for the collinearity, nor is the inclusion of dummy variables. The best potential remedy is to attempt to eliminate highly correlated variables.", "explhtml": "<p>The first differencing is not a remedy for the collinearity, nor is the inclusion of dummy variables. The best potential remedy is to attempt to eliminate highly correlated variables.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Which of the following is a potential remedy for multicollinearity?<\/p><\/div>", "subj": "quant"}, {"n": 69, "q": "Which of the following conditions will least likely affect the statistical inference about regression parameters by itself?", "opts": ["Multicollinearity.", "Unconditional heteroskedasticity.", "Model misspecification."], "ans": "B", "expl": "Unconditional heteroskedasticity does not impact the statistical inference concerning the parameters. Misspecified models have inconsistent and biased regression parameters. Multicollinearity results in unreliable estimates of regression parameters.", "explhtml": "<p>Unconditional heteroskedasticity does not impact the statistical inference concerning the parameters. Misspecified models have inconsistent and biased regression parameters. Multicollinearity results in unreliable estimates of regression parameters.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Which of the following conditions will least likely affect the statistical inference about regression parameters by itself?<\/p><\/div>", "subj": "quant"}, {"n": 70, "q": "What is most likely represented by the Y intercept of the regression?", "opts": ["The drift of a random walk.", "The return on a particular trading day.", "The intercept is not a driver of returns, only the independent variables."], "ans": "B", "expl": "The omitted variable is represented by the intercept. So, if we have four variables to represent Monday through Thursday, the intercept would represent returns on Friday. Remember when we want to distinguish between \"n\" classes we always use one less dummy variable the number of classes (n – 1).", "explhtml": "<p>The omitted variable is represented by the intercept. So, if we have four variables to represent Monday through Thursday, the intercept would represent returns on Friday. Remember when we want to distinguish between &quot;n&quot; classes we always use one less dummy variable the number of classes (n – 1).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 70–73<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 70–73). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is most likely represented by the Y intercept of the regression?<\/p><\/div>", "subj": "quant"}, {"n": 71, "q": "What can be said of the overall explanatory power of the model at the 5% significance?", "opts": ["There is no value to calendar trading.", "There is value to calendar trading.", "The coefficient of determination for the above regression is significantly higher than the standard error of the estimate, and therefore there is value to calendar trading."], "ans": "A", "expl": "This question calls for a computation of the F-stat for all independent variables jointly. F = (0.0039 / 4) / (0.9534 / (780 – 4 – 1) = 0.79. The critical F is somewhere between 2.37 and 2.45 so we fail to reject the null that the coefficient are equal to zero.", "explhtml": "<p>This question calls for a computation of the F-stat for all independent variables jointly. F = (0.0039 / 4) / (0.9534 / (780 – 4 – 1) = 0.79. The critical F is somewhere between 2.37 and 2.45 so we fail to reject the null that the coefficient are equal to zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 70–73<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>What can be said of the overall explanatory power of the model at the 5% significance?<\/p><\/div>", "subj": "quant"}, {"n": 72, "q": "The test mentioned by Jessica is known as the:", "opts": ["Breusch-Pagan, which is a one-tailed test.", "Breusch-Pagan, which is a two-tailed test.", "Durbin-Watson, which is a two-tailed test."], "ans": "A", "expl": "The Breusch-Pagan is used to detect conditional heteroskedasticity and it is a one-tailed test. This is because we are only concerned about large values in the residuals coefficient of determination.", "explhtml": "<p>The Breusch-Pagan is used to detect conditional heteroskedasticity and it is a one-tailed test. This is because we are only concerned about large values in the residuals coefficient of determination.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 70–73<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>The test mentioned by Jessica is known as the:<\/p><\/div>", "subj": "quant"}, {"n": 73, "q": "Are Jessica and her son Jonathan correct in terms of the method used to correct for heteroskedasticity and the likely effects?", "opts": ["Neither is correct.", "Both are correct.", "One is correct."], "ans": "B", "expl": "Jessica is correct. White-corrected standard errors are also known as robust standard errors. Jonathan is correct because for financial data, generally, White-corrected errors are higher than the biased errors leading to lower computed t-statistics and, therefore, less frequent rejection of the null hypothesis (remember incorrectly rejecting a true null is Type I error).", "explhtml": "<p>Jessica is correct. White-corrected standard errors are also known as robust standard errors. Jonathan is correct because for financial data, generally, White-corrected errors are higher than the biased errors leading to lower computed t-statistics and, therefore, less frequent rejection of the null hypothesis (remember incorrectly rejecting a true null is Type I error).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 70–73<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Are Jessica and her son Jonathan correct in terms of the method used to correct for heteroskedasticity and the likely effects?<\/p><\/div>", "subj": "quant"}, {"n": 74, "q": "The adjusted R² of Model 2 is closest to:", "opts": ["0.39.", "0.37.", "0.36."], "ans": "B", "expl": "Given n = 120 months, k = 4 (for Model 2), and R² = 0.39: ₐ = 1 −[(  ) × (1 −0.39)] = 0.37 120−1 R² 120−4−1", "explhtml": "<p>Given n = 120 months, k = 4 (for Model 2), and R<sup>2<\/sup> = 0.39: <sub>a<\/sub> = 1 −[( &nbsp; ) × (1 −0.39)] = 0.37<\/p><p>120−1<\/p><p>R<sup>2<\/sup><\/p><p>120−4−1<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 74–77<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 74–77). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The adjusted R<sup>2<\/sup> of Model 2 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 75, "q": "The model better suited for prediction is:", "opts": ["Model 1 because it has a lower Bayesian information criterion.", "Model 2 because it has a higher Akaike information criterion.", "Model 2 because it has a lower Akaike information criterion."], "ans": "C", "expl": "The Akaike information criterion (AIC) is used if the goal is to have a better forecast, while the Bayesian information criterion (BIC) is used if the goal is a better goodness of fit. Lower values of both criteria indicate a better model. Both criteria are lower for Model 2.", "explhtml": "<p>The Akaike information criterion (AIC) is used if the goal is to have a better forecast, while the Bayesian information criterion (BIC) is used if the goal is a better goodness of fit. Lower values of both criteria indicate a better model. Both criteria are lower for Model 2.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 74–77<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>The model better suited for prediction is:<\/p><\/div>", "subj": "quant"}, {"n": 76, "q": "The F-statistic for testing H₀: coefficient of LIQ = 0 versus Hₐ: coefficient of LIQ ≠ 0 is closest to:", "opts": ["13.53.", "5.45.", "2.11."], "ans": "A", "expl": "(SSER−SSEU)/q F = (SSEU)/(n−k−1) where n = 120, k = 4, and q = 1: (38−34)/1 = 13.53 (34)/(120−4−1)", "explhtml": "<p>(SSE<sub>R<\/sub>−SSE<sub>U<\/sub>)/q<\/p><p>F =<\/p><p>(SSE<sub>U<\/sub>)/(n−k−1)<\/p><p>where n = 120, k = 4, and q = 1:<\/p><p>(38−34)/1<\/p><p>= 13.53<\/p><p>(34)/(120−4−1)<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 74–77<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>The F-statistic for testing H<sub>0<\/sub>: coefficient of LIQ = 0 versus H<sub>a<\/sub>: coefficient of LIQ ≠ 0 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 77, "q": "What is the predicted return for a stock using Model 1 when SMB = 3.30, HML = 1.25 and Rm-Rf = 5?", "opts": ["6.80%.", "7.88%.", "9.58%."], "ans": "A", "expl": "Model 1: Return = 1.22 + 0.23 × SMB + 0.34 × HML + 0.88 Rm-Rf = 1.22 + 0.23 × 3.30 + 0.34 × 1.25 + 0.88 × 5 = 6.80%.", "explhtml": "<p>Model 1:<\/p><p>Return = 1.22 + 0.23 × SMB + 0.34 × HML + 0.88 Rm-Rf<\/p><p>= 1.22 + 0.23 × 3.30 + 0.34 × 1.25 + 0.88 × 5<\/p><p>= 6.80%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 74–77<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>What is the predicted return for a stock using Model 1 when SMB = 3.30, HML = 1.25 and Rm-Rf = 5?<\/p><\/div>", "subj": "quant"}, {"n": 78, "q": "How many dummy variables should Rathod use?", "opts": ["Five.", "Six.", "Four."], "ans": "C", "expl": "There are 5 trading days in a week, but we should use (n − 1) or 4 dummies in order to ensure no violations of regression analysis occur.", "explhtml": "<p>There are 5 trading days in a week, but we should use (n − 1) or 4 dummies in order to ensure no violations of regression analysis occur.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 78–80<\/div> <div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 78–80). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>How many dummy variables should Rathod use?<\/p><\/div>", "subj": "quant"}, {"n": 79, "q": "What is most likely represented by the intercept of the regression?", "opts": ["The return on a particular trading day.", "The intercept is not a driver of returns, only the independent variables.", "The drift of a random walk."], "ans": "A", "expl": "The omitted variable is represented by the intercept. So, if we have four variables to represent Monday through Thursday, the intercept would represent returns on Friday.", "explhtml": "<p>The omitted variable is represented by the intercept. So, if we have four variables to represent Monday through Thursday, the intercept would represent returns on Friday.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 78–80<\/div> <div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"qtext\"><p>What is most likely represented by the intercept of the regression?<\/p><\/div>", "subj": "quant"}, {"n": 80, "q": "Are Jessica and her son Jonathan, correct in terms of the method used to correct for heteroskedasticity and the likely effects?", "opts": ["Both are correct.", "Neither is correct.", "One is correct."], "ans": "A", "expl": "Jessica is correct. White-corrected standard errors are also known as robust standard errors. Jonathan is correct because White-corrected errors are higher than the biased errors leading to lower computed t-statistics and therefore less frequent rejection of the Null Hypothesis (remember incorrectly rejecting a true Null is Type I error).", "explhtml": "<p>Jessica is correct. White-corrected standard errors are also known as robust standard errors. Jonathan is correct because White-corrected errors are higher than the biased errors leading to lower computed t-statistics and therefore less frequent rejection of the Null Hypothesis (remember incorrectly rejecting a true Null is Type I error).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 78–80<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Are Jessica and her son Jonathan, correct in terms of the method used to correct for heteroskedasticity and the likely effects?<\/p><\/div>", "subj": "quant"}, {"n": 81, "q": "An analyst regresses the return of a S&P 500 index fund against the S&P 500, and also regresses the return of an active manager against the S&P 500. The analyst uses the last five years of data in both regressions. Without making any other assumptions, which of the following is most accurate? The index fund:", "opts": ["regression should have higher sum of squares regression as a ratio to the total sum of squares.", "should have a lower coefficient of determination.", "should have a higher coefficient on the independent variable."], "ans": "A", "expl": "The index fund regression should provide a higher R² than the active manager regression. R² is the sum of squares regression divided by the total sum of squares.", "explhtml": "<p>The index fund regression should provide a higher R<sup>2<\/sup> than the active manager regression. R<sup>2<\/sup> is the sum of squares regression divided by the total sum of squares.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>An analyst regresses the return of a S&amp;P 500 index fund against the S&amp;P 500, and also regresses the return of an active manager against the S&amp;P 500. The analyst uses the last five years of data in both regressions. Without making any other assumptions, which of the following is most accurate? The index fund:<\/p><\/div>", "subj": "quant"}, {"n": 82, "q": "Suppose the analyst wants to add a dummy variable for whether a person has a business college degree and an engineering degree. What is the CORRECT representation if a person has both degrees? Business  Engineering | Degree Dummy  Degree Dummy | Variable  Variable", "opts": ["0 1", "0 0", "1 1"], "ans": "C", "expl": "Assigning a zero to both categories is appropriate for someone with neither degree. Assigning one to the business category and zero to the engineering category is appropriate for someone with only a business degree. Assigning zero to the business category and one to the engineering category is appropriate for someone with only an engineering degree. Assigning a one to both categories is correct because it reflects the possession of both degrees.", "explhtml": "<p>Assigning a zero to both categories is appropriate for someone with neither degree. Assigning one to the business category and zero to the engineering category is appropriate for someone with only a business degree. Assigning zero to the business category and one to the engineering category is appropriate for someone with only an engineering degree. Assigning a one to both categories is correct because it reflects the possession of both degrees.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"qtext\"><p>Suppose the analyst wants to add a dummy variable for whether a person has a business college degree and an engineering degree. What is the CORRECT representation if a person has both degrees?<\/p><div class=\"tbl\"><table><tr><td>Business<\/td><td>Engineering<\/td><\/tr><tr><td>Degree Dummy<\/td><td>Degree Dummy<\/td><\/tr><tr><td>Variable<\/td><td>Variable<\/td><\/tr><\/table><\/div><\/div>", "subj": "quant"}, {"n": 83, "q": "Which of the following statements regarding the R² is least accurate?", "opts": ["The adjusted-R² not appropriate to use in simple regression.", "It is possible for the adjusted-R² to decline as more variables are added to the multiple regression.", "The adjusted-R² is greater than the R² in multiple regression."], "ans": "C", "expl": "The adjusted-R² will always be less than R²in multiple regression.", "explhtml": "<p>The adjusted-R<sup>2<\/sup> will always be less than R<sup>2<\/sup>in multiple regression.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Which of the following statements regarding the R<sup>2<\/sup> is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 84, "q": "In regard to their conversation about the regression equation:", "opts": ["Brent’s statement is correct; Johnson’s statement is correct.", "Brent’s statement is correct; Johnson’s statement is incorrect.", "Brent’s statement is incorrect; Johnson’s statement is correct."], "ans": "C", "expl": "Expected sales is the dependent variable in the equation, while expenditures for marketing and salespeople are the independent variables. Therefore, a $1 million increase in marketing expenditures will increase the dependent variable (expected sales) by $1.6 million. Brent's statement is incorrect. Johnson's statement is correct. 12.6 is the intercept in the equation, which means that if all independent variables are equal to zero, expected sales will be $12.6 million.", "explhtml": "<p>Expected sales is the dependent variable in the equation, while expenditures for marketing and salespeople are the independent variables. Therefore, a $1 million increase in marketing expenditures will increase the dependent variable (expected sales) by $1.6 million. Brent&#x27;s statement is incorrect.<\/p><p>Johnson&#x27;s statement is correct. 12.6 is the intercept in the equation, which means that if all independent variables are equal to zero, expected sales will be $12.6 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 84–87<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 84–87). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>In regard to their conversation about the regression equation:<\/p><\/div>", "subj": "quant"}, {"n": 85, "q": "Regarding Brent's Statements 1 and 2:", "opts": ["Only Statement 1 is correct.", "Only Statement 2 is correct.", "Both statements are correct."], "ans": "C", "expl": "Statement 1 is correct. Comparing the formulae for computation of AIC and BIC, because ln(n) is greater than 2 for even small sample sizes, the BIC metric imposes a higher penalty for overfitting. Statement 2 is correct. Both AIC and BIC evaluate the quality of model fit among competing models for the same dependent variable. Lower values indicate a better model under either criteria. AIC is used if the goal is to have a better forecast, while BIC is used if the goal is a better goodness of fit.", "explhtml": "<p>Statement 1 is correct. Comparing the formulae for computation of AIC and BIC, because ln(n) is greater than 2 for even small sample sizes, the BIC metric imposes a higher penalty for overfitting. Statement 2 is correct. Both AIC and BIC evaluate the quality of model fit among competing models for the same dependent variable. Lower values indicate a better model under either criteria. AIC is used if the goal is to have a better forecast, while BIC is used if the goal is a better goodness of fit.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 84–87<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Regarding Brent&#x27;s Statements 1 and 2:<\/p><\/div>", "subj": "quant"}, {"n": 86, "q": "Assuming that next year's marketing expenditures are $3,500,000 and there are five salespeople, predicted sales for Mega Flowers should will be:", "opts": ["$11,600,000.", "$24,000,000.", "$24,200,000."], "ans": "C", "expl": "Using the information provided, expected sales equals 12.6 + (1.6 x 3.5) + (1.2 x 5) = $24.2 million. Remember to check the details - i.e. this equation is denominated in millions of dollars.", "explhtml": "<p>Using the information provided, expected sales equals 12.6 + (1.6 x 3.5) + (1.2 x 5) = $24.2 million. Remember to check the details - i.e. this equation is denominated in millions of dollars.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 84–87<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Assuming that next year&#x27;s marketing expenditures are $3,500,000 and there are five salespeople, predicted sales for Mega Flowers should will be:<\/p><\/div>", "subj": "quant"}, {"n": 87, "q": "Brent would like to further investigate whether at least one of the independent variables can explain a significant portion of the variation of the dependent variable. Which of the following methods would be best for Brent to use?", "opts": ["The F-statistic.", "The multiple coefficient of determination.", "An ANOVA table."], "ans": "A", "expl": "To determine whether at least one of the coefficients is statistically significant, the calculated F-statistic is compared with the critical F-value at the appropriate level of significance.", "explhtml": "<p>To determine whether at least one of the coefficients is statistically significant, the calculated F-statistic is compared with the critical F-value at the appropriate level of significance.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 84–87<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Brent would like to further investigate whether at least one of the independent variables can explain a significant portion of the variation of the dependent variable. Which of the following methods would be best for Brent to use?<\/p><\/div>", "subj": "quant"}, {"n": 88, "q": "Alex Wade, CFA, is analyzing the result of a regression analysis comparing the performance of gold stocks versus a broad equity market index. Wade believes that first lag serial correlation may be present and, in order to prove his theory, should use which of the following methods to detect its presence?", "opts": ["The Breusch-Pagan test.", "The Durbin-Watson statistic.", "The Hansen method."], "ans": "B", "expl": "The Durbin-Watson statistic is the most commonly used method for the detection of serial correlationat the first lag, although residual plots can also be utilized. For testing of serial correlation beyond the first lag, we can instead use the Breusch-Godfrey test (but is not one of the answer choices).", "explhtml": "<p>The Durbin-Watson statistic is the most commonly used method for the detection of serial correlationat the first lag, although residual plots can also be utilized. For testing of serial correlation beyond the first lag, we can instead use the Breusch-Godfrey test (but is not one of the answer choices).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Alex Wade, CFA, is analyzing the result of a regression analysis comparing the performance of gold stocks versus a broad equity market index. Wade believes that first lag serial correlation may be present and, in order to prove his theory, should use which of the following methods to detect its presence?<\/p><\/div>", "subj": "quant"}, {"n": 89, "q": "If GDP rises 2.2% and the price of fuels falls $0.15, Baltz's model will predict Company sales to be (in $ millions) closest to:", "opts": ["$82.00.", "$128.00.", "$206.00."], "ans": "C", "expl": "Sales will be closest to $78 + ($30.22 × 2.2) + [(−412.39) × (−$0.15)] = $206.34 million.", "explhtml": "<p>Sales will be closest to $78 + ($30.22 × 2.2) + [(−412.39) × (−$0.15)] = $206.34 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 89–91<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 89–91). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>If GDP rises 2.2% and the price of fuels falls $0.15, Baltz&#x27;s model will predict Company sales to be (in $ millions) closest to:<\/p><\/div>", "subj": "quant"}, {"n": 90, "q": "Baltz proceeds to test the hypothesis that none of the independent variables has significant explanatory power. He concludes that, at a 5% level of significance:", "opts": ["all of the independent variables have explanatory power, because the calculated Fstatistic exceeds its critical value.", "none of the independent variables has explanatory power, because the calculated F-statistic does not exceed its critical value.", "at least one of the independent variables has explanatory power, because the calculated F-statistic exceeds its critical value."], "ans": "C", "expl": "MSE = SSE / [n − (k + 1)] = 132.12 ÷ 27 = 4.89. From the ANOVA table, the calculated F-statistic is (mean square regression / mean square error) = 145.65 / 4.89 = 29.7853. From the F-distribution table (2 df numerator, 27 df denominator) the F-critical value may be interpolated to be 3.36. Because 29.7853 is greater than 3.36, Baltz rejects the null hypothesis and concludes that at least one of the independent variables has explanatory power.", "explhtml": "<p>MSE = SSE / [n − (k + 1)] = 132.12 ÷ 27 = 4.89. From the ANOVA table, the calculated F-statistic is (mean square regression / mean square error) = 145.65 / 4.89 = 29.7853. From the F-distribution table (2 df numerator, 27 df denominator) the F-critical value may be interpolated to be 3.36. Because 29.7853 is greater than 3.36, Baltz rejects the null hypothesis and concludes that at least one of the independent variables has explanatory power.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 89–91<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Baltz proceeds to test the hypothesis that none of the independent variables has significant explanatory power. He concludes that, at a 5% level of significance:<\/p><\/div>", "subj": "quant"}, {"n": 91, "q": "Presence of conditional heteroskedasticity is least likely to affect the:", "opts": ["computed F-statistic.", "coefficient estimates.", "computed t-statistic."], "ans": "B", "expl": "Conditional heteroskedasticity results in consistent coefficient estimates, but it biases standard errors, affecting the computed t-statistic and F-statistic.", "explhtml": "<p>Conditional heteroskedasticity results in consistent coefficient estimates, but it biases standard errors, affecting the computed t-statistic and F-statistic.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 89–91<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Presence of conditional heteroskedasticity is least likely to affect the:<\/p><\/div>", "subj": "quant"}, {"n": 92, "q": "When interpreting the results of a multiple regression analysis, which of the following terms represents the value of the dependent variable when the independent variables are all equal to zero?", "opts": ["Slope coefficient.", "p-value.", "Intercept term."], "ans": "C", "expl": "The intercept term is the value of the dependent variable when the independent variables are set to zero.", "explhtml": "<p>The intercept term is the value of the dependent variable when the independent variables are set to zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>When interpreting the results of a multiple regression analysis, which of the following terms represents the value of the dependent variable when the independent variables are all equal to zero?<\/p><\/div>", "subj": "quant"}, {"n": 93, "q": "An analyst is trying to determine whether fund return performance is persistent. The analyst divides funds into three groups based on whether their return performance was in the top third (group 1), middle third (group 2), or bottom third (group 3) during the previous year. The manager then creates the following equation: R = a + b₁D₁ + b₂D₂ + b₃D₃ + ε, where R is return premium on the fund (the return minus the return on the S&P 500 benchmark) and Dᵢ is equal to 1 if the fund is in group i. Assuming no other information, this equation will suffer from:", "opts": ["serial correlation.", "heteroskedasticity.", "multicollinearity."], "ans": "C", "expl": "When we use dummy variables, we have to use one less than the states of the world. In this case, there are three states (groups) possible. We should have used only two dummy variables. Multicollinearity is a problem in this case. Specifically, a linear combination of independent variables is perfectly correlated. X1 + X2 + X3 = 1. There are too many dummy variables specified, so the equation will suffer from multicollinearity.", "explhtml": "<p>When we use dummy variables, we have to use one less than the states of the world. In this case, there are three states (groups) possible. We should have used only two dummy variables. Multicollinearity is a problem in this case. Specifically, a linear combination of independent variables is perfectly correlated. X1 + X2 + X3 = 1.<\/p><p>There are too many dummy variables specified, so the equation will suffer from multicollinearity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>An analyst is trying to determine whether fund return performance is persistent. The analyst divides funds into three groups based on whether their return performance was in the top third (group 1), middle third (group 2), or bottom third (group 3) during the previous year. The manager then creates the following equation: R = a + b<sub>1<\/sub>D<sub>1<\/sub> + b<sub>2<\/sub>D<sub>2<\/sub> + b<sub>3<\/sub>D<sub>3<\/sub> + ε, where R is return<\/p><p>premium on the fund (the return minus the return on the S&amp;P 500 benchmark) and D<sub>i<\/sub> is equal<\/p><p>to 1 if the fund is in group i. Assuming no other information, this equation will suffer from:<\/p><\/div>", "subj": "quant"}, {"n": 94, "q": "Consider the following estimated regression equation, with calculated t-statistics of the estimates as indicated: AUTOₜ = 10.0 + 1.25 PIₜ + 1.0 TEENₜ – 2.0 INSₜ with a PI calculated t-statistic of 0.45, a TEEN calculated t-statistic of 2.2, and an INS calculated t-statistic of 0.63. The equation was estimated over 40 companies. Using a 5% level of significance, which of the independent variables significantly different from zero?", "opts": ["TEEN only.", "PI and INS only.", "PI only."], "ans": "A", "expl": "The critical t-values for 40-3-1 = 36 degrees of freedom and a 5% level of significance are ± 2.028. Therefore, only TEEN is statistically significant.", "explhtml": "<p>The critical t-values for 40-3-1 = 36 degrees of freedom and a 5% level of significance are ± 2.028. Therefore, only TEEN is statistically significant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Consider the following estimated regression equation, with calculated t-statistics of the estimates as indicated:<\/p><p>AUTO<sub>t<\/sub> = 10.0 + 1.25 PI<sub>t<\/sub> + 1.0 TEEN<sub>t<\/sub> – 2.0 INS<sub>t<\/sub><\/p><p>with a PI calculated t-statistic of 0.45, a TEEN calculated t-statistic of 2.2, and an INS calculated t-statistic of 0.63.<\/p><p>The equation was estimated over 40 companies. Using a 5% level of significance, which of the independent variables significantly different from zero?<\/p><\/div>", "subj": "quant"}, {"n": 95, "q": "Consider the following model of earnings (EPS) regressed against dummy variables for the quarters: EPSₜ = α + β₁Q₁ₜ + β₂Q₂ₜ + β₃Q₃ₜ where: EPSₜ is a quarterly observation of earnings per share Q₁ₜ takes on a value of 1 if period t is the second quarter, 0 otherwise Q₂ₜ takes on a value of 1 if period t is the third quarter, 0 otherwise Q₃ₜ takes on a value of 1 if period t is the fourth quarter, 0 otherwise Which of the following statements regarding this model is most accurate? The:", "opts": ["significance of the coefficients cannot be interpreted in the case of dummy variables.", "EPS for the first quarter is represented by the residual.", "coefficient on each dummy tells us about the difference in earnings per share between the respective quarter and the one left out (first quarter in this case)."], "ans": "C", "expl": "The coefficients on the dummy variables indicate the difference in EPS for a given quarter, relative to the first quarter.", "explhtml": "<p>The coefficients on the dummy variables indicate the difference in EPS for a given quarter, relative to the first quarter.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"qtext\"><p>Consider the following model of earnings (EPS) regressed against dummy variables for the quarters:<\/p><p>EPS<sub>t<\/sub> = α + β<sub>1<\/sub>Q<sub>1t<\/sub> + β<sub>2<\/sub>Q<sub>2t<\/sub> + β<sub>3<\/sub>Q<sub>3t<\/sub><\/p><p>where:<\/p><p>EPS<sub>t<\/sub> is a quarterly observation of earnings per share<\/p><p>Q<sub>1t<\/sub> takes on a value of 1 if period t is the second quarter, 0 otherwise<\/p><p>Q<sub>2t<\/sub> takes on a value of 1 if period t is the third quarter, 0 otherwise<\/p><p>Q<sub>3t<\/sub> takes on a value of 1 if period t is the fourth quarter, 0 otherwise<\/p><p>Which of the following statements regarding this model is most accurate? The:<\/p><\/div>", "subj": "quant"}, {"n": 96, "q": "The percentage of the total variation in quarterly stock returns explained by the independent variables is closest to:", "opts": ["32%.", "47%.", "42%."], "ans": "A", "expl": "The R² is the percentage of variation in the dependent variable explained by the independent variables. The R² is equal to the SSRegression/SSTotal, where the SSTotal is equal to SSRegression + SSError. R² = 126.00/ (126.00+267.00) = 32%.", "explhtml": "<p>The R<sup>2<\/sup> is the percentage of variation in the dependent variable explained by the independent variables. The R<sup>2<\/sup> is equal to the SS<sub>Regression<\/sub>/SS<sub>Total<\/sub>, where the SS<sub>Total<\/sub> is equal to SS<sub>Regression<\/sub> + SS<sub>Error<\/sub>. R<sup>2<\/sup> = 126.00/ (126.00+267.00) = 32%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 96–99<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 96–99). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The percentage of the total variation in quarterly stock returns explained by the independent variables is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 97, "q": "Using a 5% level of significance, there is:", "opts": ["evidence of first-lag serial correlation in residuals.", "evidence of second-lag serial correlation in residuals.", "no evidence of serial correlation in the residuals."], "ans": "B", "expl": "n=160, k=3. For lag 1, p = 1. (n-k-p-1 = 155). Critical F-stat (1, 155) = 3.90. BG Stat for lag 1 is given as 3.15. We fail to reject the null of no serial correlation in residuals. For lag 2, critical F (2,154) = 3.05. BG stat for lag 2 is given as 3.22 and exceeds the critical value and hence we reject the null of no serial correlation at the 2nd lag.", "explhtml": "<p>n=160, k=3. For lag 1, p = 1. (n-k-p-1 = 155). Critical F-stat (1, 155) = 3.90. BG Stat for lag 1 is given as 3.15. We fail to reject the null of no serial correlation in residuals. For lag 2, critical F (2,154) = 3.05. BG stat for lag 2 is given as 3.22 and exceeds the critical value and hence we reject the null of no serial correlation at the 2nd lag.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 96–99<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Using a 5% level of significance, there is:<\/p><\/div>", "subj": "quant"}, {"n": 98, "q": "What is the predicted quarterly stock return, given the following forecasts? Employment growth = 2.0% GDP growth = 1.0% Private investment growth = -1.0%", "opts": ["4.4%.", "4.7%.", "5.0%."], "ans": "C", "expl": "Predicted quarterly stock return is 9.50% + (−4.50)(2.0%) + (4.20)(1.0%) + (−0.30)(−1.0%) = 5.0%.", "explhtml": "<p>Predicted quarterly stock return is 9.50% + (−4.50)(2.0%) + (4.20)(1.0%) + (−0.30)(−1.0%) = 5.0%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 96–99<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>What is the predicted quarterly stock return, given the following forecasts?<\/p><p>Employment growth = 2.0% GDP growth = 1.0% Private investment growth = -1.0%<\/p><\/div>", "subj": "quant"}, {"n": 99, "q": "Assuming a restricted model with all three variables removed and a 5% level of significance, the most appropriate conclusion is:", "opts": ["With an F-statistic of 2.66, we fail to reject the null hypothesis of all slope coefficients equal to zero.", "With an F-statistic of 24.54, we reject the null hypothesis that all the slope coefficients are equal to zero.", "With an F-statistic of 0.472, we fail to reject the null hypothesis of all coefficients equal to zero."], "ans": "B", "expl": "We are testing that all slope coefficients are equal to 0. F = [RSS/K] / [SSE/(n-k-1)] = (126/3) / (267/156) = 42/1.711 = 24.54 Critical F(3,156) = 2.66 F-stat > critical F > reject null that all slope coefficients are equal to zero.", "explhtml": "<p>We are testing that all slope coefficients are equal to 0.<\/p><p>F = [RSS/K] / [SSE/(n-k-1)] = (126/3) / (267/156) = 42/1.711 = 24.54<\/p><p>Critical F(3,156) = 2.66<\/p><p>F-stat &gt; critical F &gt; reject null that all slope coefficients are equal to zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 96–99<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Assuming a restricted model with all three variables removed and a 5% level of significance, the most appropriate conclusion is:<\/p><\/div>", "subj": "quant"}, {"n": 100, "q": "Which of the following questions is least likely answered by using a qualitative dependent variable?", "opts": ["Based on the following company-specific financial ratios, will company ABC enter bankruptcy?", "Based on the following subsidiary and competition variables, will company XYZ divest itself of a subsidiary?", "Based on the following executive-specific and company-specific variables, how many shares will be acquired through the exercise of executive stock options?"], "ans": "C", "expl": "The number of shares can be a broad range of values and is, therefore, not considered a qualitative dependent variable.", "explhtml": "<p>The number of shares can be a broad range of values and is, therefore, not considered a qualitative dependent variable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Which of the following questions is least likely answered by using a qualitative dependent variable?<\/p><\/div>", "subj": "quant"}, {"n": 101, "q": "The percent of the variation in the fund's return that is explained by the regression is:", "opts": ["66.76%.", "81.71%.", "61.78%."], "ans": "A", "expl": "The R² tells us how much of the change in the dependent variable is explained by the changes in the independent variables in the regression: 0.667632.", "explhtml": "<p>The R<sup>2<\/sup> tells us how much of the change in the dependent variable is explained by the changes in the independent variables in the regression: 0.667632.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 101–106). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The percent of the variation in the fund&#x27;s return that is explained by the regression is:<\/p><\/div>", "subj": "quant"}, {"n": 102, "q": "Suppose the Breusch-Godfrey statistic is 3.22. At a 5% level of significance, which of the following is the most accurate conclusion regarding the presence of serial correlation (at two lags) in the residuals?", "opts": ["No, because the BG statistic is less than the critical test statistic of 3.49, we don't have evidence of serial correlation.", "No, because the BG statistic is less than the critical test statistic of 3.55, we don't have evidence of serial correlation.", "Yes, because the BG statistic exceeds the critical test statistic of 3.16, there is evidence of serial correlation."], "ans": "B", "expl": "Number of lags tested = p = 2. The appropriate test statistic for BG test is F-stat with (p = 2) and (n – p – k – 1 = 18) degrees of freedom. From the table, critical value = 3.55.", "explhtml": "<p>Number of lags tested = p = 2. The appropriate test statistic for BG test is F-stat with (p = 2) and (n – p – k – 1 = 18) degrees of freedom. From the table, critical value = 3.55.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Suppose the Breusch-Godfrey statistic is 3.22. At a 5% level of significance, which of the following is the most accurate conclusion regarding the presence of serial correlation (at two lags) in the residuals?<\/p><\/div>", "subj": "quant"}, {"n": 103, "q": "Gloucester subsequently revises the model to exclude the small cap index and finds that the revised model has a RSS of 106.332. Which of the following statements is most accurate? At a 5% level of significance, the test statistic:", "opts": ["of 1.40 indicates that we cannot reject the hypothesis that the coefficient of smallcap index is not significantly different from 0.", "of 13.39 indicates that we cannot reject the hypothesis that the coefficient of smallcap index is significantly different from 0.", "of 4.35 indicates that we cannot reject the hypothesis that the coefficient of smallcap index is significantly different from 0."], "ans": "A", "expl": "SSER = SST – RSSR = 164.9963 – 106.3320 = 58.6643 F = [(SSER – SSEU) / q] / [SSEU / (n – k – 1)] = [(58.6643 – 54.8395) / 1] / (54.8395 / 20) = 3.8248 / 2.742 = 1.40 Critical F(1, 20) = 4.35 (from Exhibit 1) Since the test statistic is not greater than the critical value, we cannot reject the null hypothesis that b₂ = 0.", "explhtml": "<p>SSE<sub>R<\/sub> = SST – RSS<sub>R<\/sub> = 164.9963 – 106.3320 = 58.6643<\/p><p>F = [(SSE<sub>R<\/sub> – SSE<sub>U<\/sub>) / q] / [SSE<sub>U<\/sub> / (n – k – 1)] = [(58.6643 – 54.8395) / 1] / (54.8395 / 20) = 3.8248 / 2.742 = 1.40<\/p><p>Critical F<sub>(1, 20)<\/sub> = 4.35 (from Exhibit 1)<\/p><p>Since the test statistic is not greater than the critical value, we cannot reject the null hypothesis that b<sub>2<\/sub> = 0.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Gloucester subsequently revises the model to exclude the small cap index and finds that the revised model has a RSS of 106.332. Which of the following statements is most accurate? At a 5% level of significance, the test statistic:<\/p><\/div>", "subj": "quant"}, {"n": 104, "q": "The best test for unconditional heteroskedasticity is:", "opts": ["the Breusch-Pagan test only.", "the Breusch-Godfrey test only.", "neither the Durbin-Watson test nor the Breusch-Pagan test."], "ans": "C", "expl": "Breusch-Godfrey and Durbin-Watson tests are for serial correlation. The Breusch-Pagan test is for conditional heteroskedasticity; it tests to see if the size of the independent variables influences the size of the residuals. Although tests for unconditional heteroskedasticity exist, they are not part of the CFA curriculum, and unconditional heteroskedasticity is generally considered less serious than conditional heteroskedasticity.", "explhtml": "<p>Breusch-Godfrey and Durbin-Watson tests are for serial correlation. The Breusch-Pagan test is for conditional heteroskedasticity; it tests to see if the size of the independent variables influences the size of the residuals. Although tests for unconditional heteroskedasticity exist, they are not part of the CFA curriculum, and unconditional heteroskedasticity is generally considered less serious than conditional heteroskedasticity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>The best test for unconditional heteroskedasticity is:<\/p><\/div>", "subj": "quant"}, {"n": 105, "q": "In the month of January, if both the small and large capitalization index have a zero return, we would expect the fund to have a return equal to:", "opts": ["2.799.", "2.322.", "2.561."], "ans": "B", "expl": "The forecast of the return of the fund would be the intercept plus the coefficient on the January effect: 2.322 = -0.238214 + 2.560552.", "explhtml": "<p>The forecast of the return of the fund would be the intercept plus the coefficient on the January effect: 2.322 = -0.238214 + 2.560552.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>In the month of January, if both the small and large capitalization index have a zero return, we would expect the fund to have a return equal to:<\/p><\/div>", "subj": "quant"}, {"n": 106, "q": "Assuming (for this question only) that the F-test was significant but that the t-tests of the independent variables were insignificant, this would most likely suggest:", "opts": ["multicollinearity.", "serial correlation.", "conditional heteroskedasticity."], "ans": "A", "expl": "When the F-test and the t-tests conflict, multicollinearity is indicated.", "explhtml": "<p>When the F-test and the t-tests conflict, multicollinearity is indicated.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 101–106<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>Assuming (for this question only) that the F-test was significant but that the t-tests of the independent variables were insignificant, this would most likely suggest:<\/p><\/div>", "subj": "quant"}, {"n": 107, "q": "Consider the following analysis of variance table: Source Sum of Squares Df Mean Square Regression  20  1  20 | Error  80  20  4 | Total  100  21 The F-statistic for a test of joint significance of all the slope coefficients is closest to:", "opts": ["0.2.", "0.05.", "5."], "ans": "C", "expl": "The F-statistic is equal to the ratio of the mean squared regression to the mean squared error. F = MSR / MSE = 20 / 4 = 5.", "explhtml": "<p>The F-statistic is equal to the ratio of the mean squared regression to the mean squared error.<\/p><p>F = MSR / MSE = 20 / 4 = 5.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Consider the following analysis of variance table:<\/p><div class=\"tbl\"><table><tr><td>Source<\/td><td>Sum of Squares<\/td><td>Df<\/td><td>Mean Square<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Regression<\/td><td>20<\/td><td>1<\/td><td>20<\/td><\/tr><tr><td>Error<\/td><td>80<\/td><td>20<\/td><td>4<\/td><\/tr><tr><td>Total<\/td><td>100<\/td><td>21<\/td><\/tr><\/table><\/div><p>The F-statistic for a test of joint significance of all the slope coefficients is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 108, "q": "If the number of analysts on NGR Corp. were to double to 4, the change in the forecast of NGR would be closest to?", "opts": ["−0.035.", "−0.055.", "−0.019."], "ans": "C", "expl": "Initially, the estimate is 0.1303 = 0.043 + ln(2)(−0.027) + ln(47000000)(0.006) Then, the estimate is 0.1116 = 0.043 + ln(4)(−0.027) + ln(47000000)(0.006) 0.1116 − 0.1303 = −0.0187, or −0.019", "explhtml": "<p>Initially, the estimate is 0.1303 = 0.043 + ln(2)(−0.027) + ln(47000000)(0.006)<\/p><p>Then, the estimate is 0.1116 = 0.043 + ln(4)(−0.027) + ln(47000000)(0.006)<\/p><p>0.1116 − 0.1303 = −0.0187, or −0.019<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–111<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 108–111). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>If the number of analysts on NGR Corp. were to double to 4, the change in the forecast of NGR would be closest to?<\/p><\/div>", "subj": "quant"}, {"n": 109, "q": "Based on a R² calculated from the information in Table 2, the analyst should conclude that the number of analysts and ln(market value) of the firm explain:", "opts": ["18.4% of the variation in returns.", "84.4% of the variation in returns.", "15.6% of the variation in returns."], "ans": "C", "expl": "R² is the percentage of the variation in the dependent variable (in this case, variation of returns) explained by the set of independent variables. R² is calculated as follows: R² = (SSR / SST) = (0.103 / 0.662) = 15.6%.", "explhtml": "<p>R<sup>2<\/sup> is the percentage of the variation in the dependent variable (in this case, variation of returns) explained by the set of independent variables. R<sup>2<\/sup> is calculated as follows: R<sup>2<\/sup> = (SSR / SST) = (0.103 / 0.662) = 15.6%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–111<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Based on a R<sup>2<\/sup> calculated from the information in Table 2, the analyst should conclude that the number of analysts and ln(market value) of the firm explain:<\/p><\/div>", "subj": "quant"}, {"n": 110, "q": "What is the F-statistic for the hypothesis that all slope coefficients are not statistically significantly different from 0? And, what can be concluded from its value at a 1% level of significance?", "opts": ["F = 17.00, reject a hypothesis that both of the slope coefficients are equal to zero.", "F = 1.97, fail to reject a hypothesis that both of the slope coefficients are equal to zero.", "F = 5.80, reject a hypothesis that both of the slope coefficients are equal to zero."], "ans": "A", "expl": "The F-statistic is calculated as follows: F = MSR / MSE = 0.051 / 0.003 = 17.00; and 17.00 > 4.61, which is the critical F-value for the given degrees of freedom and a 1% level of significance. However, when F-values are in excess of 10 for a large sample like this, a table is not needed to know that the value is significant.", "explhtml": "<p>The F-statistic is calculated as follows: F = MSR / MSE = 0.051 / 0.003 = 17.00; and 17.00 &gt; 4.61, which is the critical F-value for the given degrees of freedom and a 1% level of significance. However, when F-values are in excess of 10 for a large sample like this, a table is not needed to know that the value is significant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–111<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>What is the F-statistic for the hypothesis that all slope coefficients are not statistically significantly different from 0? And, what can be concluded from its value at a 1% level of significance?<\/p><\/div>", "subj": "quant"}, {"n": 111, "q": "Upon further analysis, Turner concludes that multicollinearity is a problem. What might have prompted this further analysis and what is intuition behind the conclusion?", "opts": ["At least one of the t-statistics was not significant, the F-statistic was significant, and a positive relationship between the number of analysts and the size of the firm would be expected.", "At least one of the t-statistics was not significant, the F-statistic was significant, and an intercept not significantly different from zero would be expected.", "At least one of the t-statistics was not significant, the F-statistic was not significant, and a positive relationship between the number of analysts and the size of the firm would be expected."], "ans": "A", "expl": "Multicollinearity occurs when there is a high correlation among independent variables and may exist if there is a significant F-statistic for the fit of the regression model, but at least one insignificant independent variable when we expect all of them to be significant. In this case the coefficient on ln(market value) was not significant at the 1% level, but the F-statistic was significant. It would make sense that the size of the firm, i.e., the market value, and the number of analysts would be positively correlated.", "explhtml": "<p>Multicollinearity occurs when there is a high correlation among independent variables and may exist if there is a significant F-statistic for the fit of the regression model, but at least one insignificant independent variable when we expect all of them to be significant. In this case the coefficient on ln(market value) was not significant at the 1% level, but the F-statistic was significant. It would make sense that the size of the firm, i.e., the market value, and the number of analysts would be positively correlated.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 108–111<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Upon further analysis, Turner concludes that multicollinearity is a problem. What might have prompted this further analysis and what is intuition behind the conclusion?<\/p><\/div>", "subj": "quant"}, {"n": 112, "q": "Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years. Which of the follow regression equations correctly represents Hilton's hypothesis?", "opts": ["SALES = α x β₁ POP x β₂ INCOME x β₃ ADV x ε.", "SALES = α + β₁ POP + β₂ INCOME + β₃ ADV + ε.", "INCOME = α + β₁ POP + β₂ SALES + β₃ ADV + ε."], "ans": "B", "expl": "SALES is the dependent variable. POP, INCOME, and ADV should be the independent variables (on the right hand side) of the equation (in any order). Regression equations are additive.", "explhtml": "<p>SALES is the dependent variable. POP, INCOME, and ADV should be the independent variables (on the right hand side) of the equation (in any order). Regression equations are additive.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years. Which of the follow regression equations correctly represents Hilton&#x27;s hypothesis?<\/p><\/div>", "subj": "quant"}, {"n": 113, "q": "A regression with three independent variables have VIF values of 3, 4, and 2 for the first, second, and third independent variables, respectively. Which of the following conclusions is most appropriate?", "opts": ["Total VIF of 9 indicates a serious multicollinearity problem.", "Only variable two has a problem with multicollinearity.", "Multicollinearity does not seem to be a problem with the model."], "ans": "C", "expl": "Multicollinearity occurs when an independent variable is highly correlated with a linear combination of the remaining independent variables. VIF values exceeding 5 need
