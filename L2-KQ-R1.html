 to be investigated while values exceeding 10 indicate strong evidence of multicollinearity.", "explhtml": "<p>Multicollinearity occurs when an independent variable is highly correlated with a linear combination of the remaining independent variables. VIF values exceeding 5 need to be investigated while values exceeding 10 indicate strong evidence of multicollinearity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>A regression with three independent variables have VIF values of 3, 4, and 2 for the first, second, and third independent variables, respectively. Which of the following conclusions is most appropriate?<\/p><\/div>", "subj": "quant"}, {"n": 114, "q": "Which of the following is least likely to be an assumption regarding linear regression?", "opts": ["The variance of the residuals is constant.", "The independent variable is correlated with the residuals.", "A linear relationship exists between the dependent and independent variables."], "ans": "B", "expl": "Although the linear regression model is fairly insensitive to minor deviations from any of these assumptions, the independent variable is typically uncorrelated with the residuals.", "explhtml": "<p>Although the linear regression model is fairly insensitive to minor deviations from any of these assumptions, the independent variable is typically uncorrelated with the residuals.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 114–117<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 114–117). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following is least likely to be an assumption regarding linear regression?<\/p><\/div>", "subj": "quant"}, {"n": 115, "q": "Based upon the information presented in the ANOVA table, what is the coefficient of determination?", "opts": ["0.839, indicating that company returns explain about 83.9% of the variability of industry returns.", "0.084, indicating that the variability of industry returns explains about 8.4% of the variability of company returns.", "0.916, indicating that the variability of industry returns explains about 91.6% of the variability of company returns."], "ans": "C", "expl": "The coefficient of determination (R²) is the percentage of the total variation in the dependent variable explained by the independent variable. The R² = (RSS / SS) Total = (3,257 / 3,555) = 0.916. This means that the variation of independent variable (the airline industry) explains 91.6% of the variations in the dependent variable (Pinnacle stock).", "explhtml": "<p>The coefficient of determination (R<sup>2<\/sup>) is the percentage of the total variation in the dependent variable explained by the independent variable.<\/p><p>The R<sup>2<\/sup> = (RSS / SS) Total = (3,257 / 3,555) = 0.916. This means that the variation of independent variable (the airline industry) explains 91.6% of the variations in the dependent variable (Pinnacle stock).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 114–117<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Based upon the information presented in the ANOVA table, what is the coefficient of determination?<\/p><\/div>", "subj": "quant"}, {"n": 116, "q": "Based upon her analysis, Carter has derived the following regression equation: Ŷ = 1.75 + 3.25X₁. The predicted value of the Y variable equals 50.50, if the:", "opts": ["predicted value of the dependent variable equals 15.", "predicted value of the independent variable equals 15.", "coefficient of the determination equals 15."], "ans": "B", "expl": "Note that the easiest way to answer this question is to plug numbers into the equation. The predicted value for Y = 1.75 + 3.25(15) = 50.50. The variable X₁ represents the independent variable.", "explhtml": "<p>Note that the easiest way to answer this question is to plug numbers into the equation.<\/p><p>The predicted value for Y = 1.75 + 3.25(15) = 50.50.<\/p><p>The variable X<sub>1<\/sub> represents the independent variable.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 114–117<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>Based upon her analysis, Carter has derived the following regression equation: Ŷ = 1.75 + 3.25X<sub>1<\/sub>. The predicted value of the Y variable equals 50.50, if the:<\/p><\/div>", "subj": "quant"}, {"n": 117, "q": "Carter realizes that although regression analysis is a useful tool when analyzing investments, there are certain limitations. Carter made a list of points describing limitations that Smith Brothers equity traders should be aware of when applying her research to their investment decisions. Point 1: Regression residuals may be homoskedastic. Point 2: Data from regression relationships tends to exhibit parameter instability. Point 3: Regression residuals may exhibit autocorrelation. Point 4: The variance of the error term may change with one or more independent variables. When reviewing Carter's list, one of the Smith Brothers' equity traders points out that not all of the points describe regression analysis limitations. Which of Carter's points most accurately describes the limitations to regression analysis?", "opts": ["Points 2, 3, and 4.", "Points 1, 3, and 4.", "Points 1, 2, and 3."], "ans": "A", "expl": "One of the basic assumptions of regression analysis is that the variance of the error terms is constant, or homoskedastic. Any violation of this assumption is called heteroskedasticity. Therefore, Point 1 is incorrect, but Point 4 is correct because it describes conditional heteroskedasticity, which results in unreliable estimates of standard errors. Points 2 and 3 also describe limitations of regression analysis.", "explhtml": "<p>One of the basic assumptions of regression analysis is that the variance of the error terms is constant, or homoskedastic. Any violation of this assumption is called heteroskedasticity. Therefore, Point 1 is incorrect, but Point 4 is correct because it describes conditional heteroskedasticity, which results in unreliable estimates of standard errors. Points 2 and 3 also describe limitations of regression analysis.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 114–117<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.c<\/div><div class=\"qtext\"><p>Carter realizes that although regression analysis is a useful tool when analyzing investments, there are certain limitations. Carter made a list of points describing limitations that Smith Brothers equity traders should be aware of when applying her research to their investment decisions.<\/p><p>Point 1: Regression residuals may be homoskedastic. Point 2: Data from regression relationships tends to exhibit parameter instability. Point 3: Regression residuals may exhibit autocorrelation. Point 4: The variance of the error term may change with one or more independent variables.<\/p><p>When reviewing Carter&#x27;s list, one of the Smith Brothers&#x27; equity traders points out that not all of the points describe regression analysis limitations. Which of Carter&#x27;s points most accurately describes the limitations to regression analysis?<\/p><\/div>", "subj": "quant"}, {"n": 118, "q": "The management of a large restaurant chain believes that revenue growth is dependent upon the month of the year. Using a standard 12 month calendar, how many dummy variables must be used in a regression model that will test whether revenue growth differs by month?", "opts": ["11.", "13.", "12."], "ans": "A", "expl": "The appropriate number of dummy variables is one less than the number of categories because the intercept captures the effect of the other effect. With 12 categories (months) the appropriate number of dummy variables is 11 = 12 – 1. If the number of dummy variables equals the number of categories, it is possible to state any one of the independent dummy variables in terms of the others. This is a violation of the assumption of the multiple linear regression model that none of the independent variables are linearly related.", "explhtml": "<p>The appropriate number of dummy variables is one less than the number of categories because the intercept captures the effect of the other effect. With 12 categories (months) the appropriate number of dummy variables is 11 = 12 – 1. If the number of dummy variables equals the number of categories, it is possible to state any one of the independent dummy variables in terms of the others. This is a violation of the assumption of the multiple linear regression model that none of the independent variables are linearly related.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"qtext\"><p>The management of a large restaurant chain believes that revenue growth is dependent upon the month of the year. Using a standard 12 month calendar, how many dummy variables must be used in a regression model that will test whether revenue growth differs by month?<\/p><\/div>", "subj": "quant"}, {"n": 119, "q": "Consider the following graph of residuals and the regression line from a time-series regression: These residuals exhibit the regression problem of:", "opts": ["heteroskedasticity.", "autocorrelation.", "homoskedasticity."], "ans": "A", "expl": "The residuals appear to be from two different distributions over time. In the earlier periods, the model fits rather well compared to the later periods.", "explhtml": "<p>The residuals appear to be from two different distributions over time. In the earlier periods, the model fits rather well compared to the later periods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Consider the following graph of residuals and the regression line from a time-series regression:<\/p><img class=\"pimg\" src=\"l2img/kq/r1-39fd495de8.jpeg\" style=\"max-width:min(100%,337px)\" loading=\"lazy\" alt=\"\"><p>These residuals exhibit the regression problem of:<\/p><\/div>", "subj": "quant"}, {"n": 120, "q": "Using the regression model represented in Exhibit 1, what is the predicted number of housing starts for 20X7?", "opts": ["1,394,420.", "1,751,000.", "1,394."], "ans": "B", "expl": "Housing starts = 0.42 − (1 × 0.07) + (0.03 × 46.7) = 1.751 million", "explhtml": "<p>Housing starts = 0.42 − (1 × 0.07) + (0.03 × 46.7) = 1.751 million<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 120–122<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 120–122). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the regression model represented in Exhibit 1, what is the predicted number of housing starts for 20X7?<\/p><\/div>", "subj": "quant"}, {"n": 121, "q": "Which of the following statements best describes the explanatory power of the estimated regression?", "opts": ["The independent variables explain 61.58% of the variation in housing starts.", "The residual standard error of only 0.3 indicates that the regression equation is a good fit for the sample data.", "The large F-statistic indicates that both independent variables help explain changes in housing starts."], "ans": "A", "expl": "The coefficient of determination is the statistic used to identify explanatory power. This can be calculated from the ANOVA table as 3.896/6.327 × 100 = 61.58%. The residual standard error of 0.3 indicates that the standard deviation of the residuals is 0.3 million housing starts. Without knowledge of the data for the dependent variable it is not possible to assess whether this is a small or a large error. The F-statistic does not enable us to conclude on both independent variables. It only allows us the reject the hypothesis that all regression coefficients are zero and accept the hypothesis that at least one isn't.", "explhtml": "<p>The coefficient of determination is the statistic used to identify explanatory power. This can be calculated from the ANOVA table as 3.896/6.327 × 100 = 61.58%.<\/p><p>The residual standard error of 0.3 indicates that the standard deviation of the residuals is 0.3 million housing starts. Without knowledge of the data for the dependent variable it is not possible to assess whether this is a small or a large error.<\/p><p>The F-statistic does not enable us to conclude on both independent variables. It only allows us the reject the hypothesis that all regression coefficients are zero and accept the hypothesis that at least one isn&#x27;t.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 120–122<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Which of the following statements best describes the explanatory power of the estimated regression?<\/p><\/div>", "subj": "quant"}, {"n": 122, "q": "Which of the following is the least appropriate statement in relation to R-square and adjusted R-square:", "opts": ["Adjusted R-square is a value between 0 and 1 and can be interpreted as a percentage.", "Adjusted R-square decreases when the added independent variable adds little value to the regression model.", "R-square typically increases when new independent variables are added to the regression regardless of their explanatory power."], "ans": "A", "expl": "Adjusted R-square can be negative for a large number of independent variables that have no explanatory power. The other two statements are correct.", "explhtml": "<p>Adjusted R-square can be negative for a large number of independent variables that have no explanatory power. The other two statements are correct.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 120–122<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Which of the following is the least appropriate statement in relation to R-square and adjusted R-square:<\/p><\/div>", "subj": "quant"}, {"n": 123, "q": "Using the regression model represented in Exhibit 1, what is the predicted number of housing starts for 20X7?", "opts": ["1,394.", "1,394,420.", "1,751,000."], "ans": "C", "expl": "Housing starts = 0.42 – (1 × 0.07) + (0.03 × 46.7) = 1.751 million", "explhtml": "<p>Housing starts = 0.42 – (1 × 0.07) + (0.03 × 46.7) = 1.751 million<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 123–125<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 123–125). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the regression model represented in Exhibit 1, what is the predicted number of housing starts for 20X7?<\/p><\/div>", "subj": "quant"}, {"n": 124, "q": "Which of the following statements best describes the explanatory power of the estimated regression?", "opts": ["The large F-statistic indicates that both independent variables help explain changes in housing starts.", "The residual standard error of only 0.3 indicates that the regression equation is a good fit for the sample data.", "The independent variables explain 61.58% of the variation in housing starts."], "ans": "C", "expl": "The coefficient of determination is the statistic used to identify explanatory power. This can be calculated from the ANOVA table as 3.896 / 6.327 × 100 = 61.58%. The residual standard error of 0.3 indicates that the standard deviation of the residuals is 0.3 million housing starts. Without knowledge of the data for the dependent variable, it is not possible to assess whether this is a small or a large error. The F-statistic does not enable us to conclude on both independent variables. It only allows us the reject the hypothesis that all regression coefficients are zero and accept the hypothesis that at least one isn't.", "explhtml": "<p>The coefficient of determination is the statistic used to identify explanatory power. This can be calculated from the ANOVA table as 3.896 / 6.327 × 100 = 61.58%.<\/p><p>The residual standard error of 0.3 indicates that the standard deviation of the residuals is 0.3 million housing starts. Without knowledge of the data for the dependent variable, it is not possible to assess whether this is a small or a large error.<\/p><p>The F-statistic does not enable us to conclude on both independent variables. It only allows us the reject the hypothesis that all regression coefficients are zero and accept the hypothesis that at least one isn&#x27;t.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 123–125<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Which of the following statements best describes the explanatory power of the estimated regression?<\/p><\/div>", "subj": "quant"}, {"n": 125, "q": "Which of the following is the least appropriate statement in relation to R-square and adjusted R-square?", "opts": ["Adjusted R-square decreases when the added independent variable adds little value to the regression model.", "R-square typically increases when new independent variables are added to the regression.", "Adjusted R-square can be higher than the coefficient of determination for a model with a good fit."], "ans": "C", "expl": "Adjusted R-squared cannot exceed R-squared (or coefficient of determination) for a multiple regression. .", "explhtml": "<p>Adjusted R-squared cannot exceed R-squared (or coefficient of determination) for a multiple regression. .<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 123–125<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Which of the following is the least appropriate statement in relation to R-square and adjusted R-square?<\/p><\/div>", "subj": "quant"}, {"n": 126, "q": "Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years and estimates the following equation (standard errors in parentheses): SALES = 0.000 + 0.004 POP + 1.031 INCOME + 2.002 ADV  (0.113) (0.005) (0.337) (2.312) For next year, Hilton estimates the following parameters: (1) the population under 20 will be 120 million, (2) disposable income will be $300,000,000, and (3) advertising expenditures will be $100,000,000. Based on these estimates and the regression equation, what are predicted sales for the industry for next year?", "opts": ["$557,143,000.", "$509,980,000.", "$656,991,000."], "ans": "B", "expl": "Predicted sales for next year are: SALES = α + 0.004 (120) + 1.031 (300) + 2.002 (100) = 509,980,000.", "explhtml": "<p>Predicted sales for next year are:<\/p><p>SALES = α + 0.004 (120) + 1.031 (300) + 2.002 (100) = 509,980,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Henry Hilton, CFA, is undertaking an analysis of the bicycle industry. He hypothesizes that bicycle sales (SALES) are a function of three factors: the population under 20 (POP), the level of disposable income (INCOME), and the number of dollars spent on advertising (ADV). All data are measured in millions of units. Hilton gathers data for the last 20 years and estimates the following equation (standard errors in parentheses):<\/p><div class=\"tbl\"><table><tr><td>SALES<\/td><td>= 0.000<\/td><td>+ 0.004 POP<\/td><td>+ 1.031 INCOME<\/td><td>+ 2.002 ADV<\/td><\/tr><tr><td><\/td><td>(0.113)<\/td><td>(0.005)<\/td><td>(0.337)<\/td><td>(2.312)<\/td><\/tr><\/table><\/div><p>For next year, Hilton estimates the following parameters: (1) the population under 20 will be 120 million, (2) disposable income will be $300,000,000, and (3) advertising expenditures will be $100,000,000. Based on these estimates and the regression equation, what are predicted sales for the industry for next year?<\/p><\/div>", "subj": "quant"}, {"n": 127, "q": "Which of the following is least likely a method of detecting serial correlations?", "opts": ["A scatter plot of the residuals over time.", "The Breusch-Pagan test.", "The Breusch-Godfrey test."], "ans": "B", "expl": "The Breusch-Pagan test is a test of the heteroskedasticity and not of serial correlation.", "explhtml": "<p>The Breusch-Pagan test is a test of the heteroskedasticity and not of serial correlation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Which of the following is least likely a method of detecting serial correlations?<\/p><\/div>", "subj": "quant"}, {"n": 128, "q": "A high-yield bond analyst is trying to develop an equation using financial ratios to estimate the probability of a company defaulting on its bonds. A technique that can be used to develop this equation is:", "opts": ["logistic regression model.", "dummy variable regression.", "multiple linear regression adjusting for heteroskedasticity."], "ans": "A", "expl": "The only one of the possible answers that estimates a probability of a discrete outcome is logit or logistic modeling.", "explhtml": "<p>The only one of the possible answers that estimates a probability of a discrete outcome is logit or logistic modeling.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.4, LOS 1.m<\/div><div class=\"qtext\"><p>A high-yield bond analyst is trying to develop an equation using financial ratios to estimate the probability of a company defaulting on its bonds. A technique that can be used to develop this equation is:<\/p><\/div>", "subj": "quant"}, {"n": 129, "q": "What is the expected salary (in $1,000) of a woman with 16 years of education and 10 years of experience?", "opts": ["59.18.", "65.48.", "54.98."], "ans": "A", "expl": "34.98 + 1.2(16) + 0.5(10) = 59.18", "explhtml": "<p>34.98 + 1.2(16) + 0.5(10) = 59.18<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 129–131<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 129–131). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the expected salary (in $1,000) of a woman with 16 years of education and 10 years of experience?<\/p><\/div>", "subj": "quant"}, {"n": 130, "q": "If the return on the industry index is 4%, the stock's expected return would be:", "opts": ["7.6%.", "9.7%.", "11.2%."], "ans": "B", "expl": "Y = b₀ + bX₁ Y = 2.1 + 1.9(4) = 9.7%", "explhtml": "<p>Y = b<sub>0<\/sub> + bX<sub>1<\/sub><\/p><p>Y = 2.1 + 1.9(4) = 9.7%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 129–131<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>If the return on the industry index is 4%, the stock&#x27;s expected return would be:<\/p><\/div>", "subj": "quant"}, {"n": 131, "q": "The percentage of the variation in the stock return explained by the variation in the industry index return is closest to:", "opts": ["84.9%.", "63.2%.", "72.1%."], "ans": "C", "expl": "The coefficient of determination, R², is the square the correlation coefficient. 0.849², = 0.721.", "explhtml": "<p>The coefficient of determination, R<sup>2<\/sup>, is the square the correlation coefficient. 0.849<sup>2<\/sup>, = 0.721.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 129–131<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>The percentage of the variation in the stock return explained by the variation in the industry index return is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 132, "q": "Which of the following statements least accurately describes one of the fundamental multiple regression assumptions?", "opts": ["The independent variables are not random.", " const CFG = {"title": "Reading 1 — Multiple Regression", "subtitle": "CFA Level II · 144 câu · Kaplan Schweser QBank 2025 (54 câu đơn · 90 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,

  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,

};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();

<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(false); }catch(e){} };
  window.showGradedResult=function(){ try{ afterGrade(true); }catch(e){} };

  function afterGrade(restored){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent, !restored);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText, celebrate){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      if(celebrate){ fetchEmoji('face-positive', emoji); confetti(); }
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
