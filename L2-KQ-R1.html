<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 1 — Multiple Regression · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}

</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}

    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}

  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;

  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}

  .qtext{font-size:16px;line-height:1.65}

  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}

  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);

  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}

  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}

  .pp-topic.set{color:#a855f7;background:color-mix(in srgb,#a855f7 12%,transparent)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "An analyst is estimating whether company sales is related to three economic variables. The regression exhibits conditional heteroskedasticity, serial correlation, and multicollinearity. The analyst uses White and Newey-West corrected standard errors. Which of the following is most accurate?", "opts": ["The regression will still exhibit heteroskedasticity and multicollinearity, but the serial correlation problem will be solved.", "The regression will still exhibit multicollinearity, but the heteroskedasticity and serial correlation problems will be solved.", "The regression will still exhibit serial correlation and multicollinearity, but the heteroskedasticity problem will be solved."], "ans": "B", "expl": "The correction mentioned solves for heteroskedasticity and serial correlation.", "explhtml": "<p>The correction mentioned solves for heteroskedasticity and serial correlation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>An analyst is estimating whether company sales is related to three economic variables. The regression exhibits conditional heteroskedasticity, serial correlation, and multicollinearity. The analyst uses White and Newey-West corrected standard errors. Which of the following is most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 2, "q": "Consider the following estimated regression equation, with the standard errors of the slope coefficients as noted: Salesᵢ = 10.0 + 1.25 R&Dᵢ + 1.0 ADVᵢ – 2.0 COMPᵢ + 8.0 CAPᵢ where the standard error for the estimated coefficient on R&D is 0.45, the standard error for the estimated coefficient on ADV is 2.2 , the standard error for the estimated coefficient on COMP is 0.63, and the standard error for the estimated coefficient on CAP is 2.5. The equation was estimated over 40 companies. Using a 5% level of significance, which of the estimated coefficients are significantly different from zero?", "opts": ["ADV and CAP only.", "R&D, ADV, COMP, and CAP.", "R&D, COMP, and CAP only."], "ans": "C", "expl": "The critical t-values for 40-4-1 = 35 degrees of freedom and a 5% level of significance are ± 2.03. The calculated t-values are: t for R&D = 1.25 / 0.45 = 2.777 t for ADV = 1.0/ 2.2 = 0.455 t for COMP = -2.0 / 0.63 = -3.175 t for CAP = 8.0 / 2.5 = 3.2 Therefore, R&D, COMP, and CAP are statistically significant.", "explhtml": "<p>The critical t-values for 40-4-1 = 35 degrees of freedom and a 5% level of significance are ± 2.03.<\/p><p>The calculated t-values are:<\/p><p>t for R&amp;D = 1.25 / 0.45 = 2.777<\/p><p>t for ADV = 1.0/ 2.2 = 0.455<\/p><p>t for COMP = -2.0 / 0.63 = -3.175<\/p><p>t for CAP = 8.0 / 2.5 = 3.2<\/p><p>Therefore, R&amp;D, COMP, and CAP are statistically significant.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Consider the following estimated regression equation, with the standard errors of the slope coefficients as noted:<\/p><p>Sales<sub>i<\/sub> = 10.0 + 1.25 R&amp;D<sub>i<\/sub> + 1.0 ADV<sub>i<\/sub> – 2.0 COMP<sub>i<\/sub> + 8.0 CAP<sub>i<\/sub><\/p><p>where the standard error for the estimated coefficient on R&amp;D is 0.45, the standard error for the estimated coefficient on ADV is 2.2 , the standard error for the estimated coefficient on COMP is 0.63, and the standard error for the estimated coefficient on CAP is 2.5.<\/p><p>The equation was estimated over 40 companies. Using a 5% level of significance, which of the estimated coefficients are significantly different from zero?<\/p><\/div>", "subj": "quant"}, {"n": 3, "q": "Which of the following is least likely a method used to detect heteroskedasticity?", "opts": ["Scatter plot.", "Breusch-Pagan test.", "Breusch-Godfrey test."], "ans": "C", "expl": "The Breusch-Godfrey test is used to detect serial correlation. The Breusch-Pagan test is a formal test used to detect heteroskedasticity while a scatter plot can give visual clues about presence of heteroscedasticity.", "explhtml": "<p>The Breusch-Godfrey test is used to detect serial correlation. The Breusch-Pagan test is a formal test used to detect heteroskedasticity while a scatter plot can give visual clues about presence of heteroscedasticity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>Which of the following is least likely a method used to detect heteroskedasticity?<\/p><\/div>", "subj": "quant"}, {"n": 4, "q": "One of the main assumptions of a multiple regression model is that the variance of the residuals is constant across all observations in the sample. A violation of the assumption is most likely to be described as:", "opts": ["unstable remnant deviation.", "positive serial correlation.", "heteroskedasticity."], "ans": "C", "expl": "Heteroskedasticity is present when the variance of the residuals is not the same across all observations in the sample, and there are sub-samples that are more spread out than the rest of the sample.", "explhtml": "<p>Heteroskedasticity is present when the variance of the residuals is not the same across all observations in the sample, and there are sub-samples that are more spread out than the rest of the sample.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>One of the main assumptions of a multiple regression model is that the variance of the residuals is constant across all observations in the sample. A violation of the assumption is most likely to be described as:<\/p><\/div>", "subj": "quant"}, {"n": 5, "q": "During the course of a multiple regression analysis, an analyst has observed several items that she believes may render incorrect conclusions. For example, the coefficient standard errors are too small, although the estimated coefficients are accurate. She believes that these small standard error terms will result in the computed t-statistics being too big, resulting in too many Type I errors. The analyst has most likely observed which of the following assumption violations in her regression analysis?", "opts": ["Positive serial correlation.", "Homoskedasticity.", "Multicollinearity."], "ans": "A", "expl": "Positive serial correlation is the condition where a positive regression error in one time period increases the likelihood of having a positive regression error in the next time period. The residual terms are correlated with one another, leading to coefficient error terms that are too small.", "explhtml": "<p>Positive serial correlation is the condition where a positive regression error in one time period increases the likelihood of having a positive regression error in the next time period. The residual terms are correlated with one another, leading to coefficient error terms that are too small.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>During the course of a multiple regression analysis, an analyst has observed several items that she believes may render incorrect conclusions. For example, the coefficient standard errors are too small, although the estimated coefficients are accurate. She believes that these small standard error terms will result in the computed t-statistics being too big, resulting in too many Type I errors. The analyst has most likely observed which of the following assumption violations in her regression analysis?<\/p><\/div>", "subj": "quant"}, {"n": 6, "q": "Using the regression model developed, the closest prediction of sales for December 20x6 is:", "opts": ["$44,000.", "$36,000.", "$55,000."], "ans": "B", "expl": "1.76 + 0.23 * (150) − 0.08 * (7.5) = 35.66.", "explhtml": "<p>1.76 + 0.23 * (150) − 0.08 * (7.5) = 35.66.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 6–11). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the regression model developed, the closest prediction of sales for December 20x6 is:<\/p><\/div>", "subj": "quant"}, {"n": 7, "q": "Will Stumper conclude that the housing starts coefficient is statistically different from zero and how will he interpret it at the 5% significance level:", "opts": ["not different from zero; sales will rise by $0 for every 100 house starts.", "different from zero; sales will rise by $100 for every 23 house starts.", "different from zero; sales will rise by $23 for every 100 house starts."], "ans": "C", "expl": "A p-value (0.017) below significance (0.05) indicates a variable which is statistically different from zero. The coefficient of 0.23 indicates that sales will rise by $23 for every 100 house starts.", "explhtml": "<p>A p-value (0.017) below significance (0.05) indicates a variable which is statistically different from zero. The coefficient of 0.23 indicates that sales will rise by $23 for every 100 house starts.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Will Stumper conclude that the housing starts coefficient is statistically different from zero and how will he interpret it at the 5% significance level:<\/p><\/div>", "subj": "quant"}, {"n": 8, "q": "Is the regression coefficient of changes in mortgage interest rates different from zero at the 5 percent level of significance?", "opts": ["no, because coefficient is negative.", "yes, because p-value < 0.05.", "yes, because -0.08 < 0.05."], "ans": "B", "expl": "A coefficient is statistically significantly different from zero if its p-value is less than the level of significance.", "explhtml": "<p>A coefficient is statistically significantly different from zero if its p-value is less than the level of significance.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Is the regression coefficient of changes in mortgage interest rates different from zero at the 5 percent level of significance?<\/p><\/div>", "subj": "quant"}, {"n": 9, "q": "In this multiple regression, the F-statistic indicates the:", "opts": ["degree of correlation between the independent variables.", "deviation of the estimated values from the actual values of the dependent variable.", "the joint significance of the independent variables."], "ans": "C", "expl": "The F-statistic indicates the joint significance of the independent variables. The deviation of the estimated values from the actual values of the dependent variable is the standard error of estimate. The degree of correlation between the independent variables is the coefficient of correlation.", "explhtml": "<p>The F-statistic indicates the joint significance of the independent variables. The deviation of the estimated values from the actual values of the dependent variable is the standard error of estimate. The degree of correlation between the independent variables is the coefficient of correlation.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>In this multiple regression, the F-statistic indicates the:<\/p><\/div>", "subj": "quant"}, {"n": 10, "q": "The regression statistics above indicate that for the period under study, the independent variables (housing starts, mortgage interest rate) together explained approximately what percentage of the variation in the dependent variable (sales)?", "opts": ["9.80.", "67.00.", "77.00."], "ans": "C", "expl": "The question is asking for the coefficient of determination.", "explhtml": "<p>The question is asking for the coefficient of determination.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>The regression statistics above indicate that for the period under study, the independent variables (housing starts, mortgage interest rate) together explained approximately what percentage of the variation in the dependent variable (sales)?<\/p><\/div>", "subj": "quant"}, {"n": 11, "q": "In this multiple regression, if Stumper discovers that the residuals exhibit positive serial correlation, the most likely effect is:", "opts": ["standard errors are not affected but coefficient estimate is inconsistent.", "standard errors are too low but coefficient estimate is consistent.", "standard errors are too high but coefficient estimate is consistent."], "ans": "B", "expl": "Positive serial correlation in residuals does not affect the consistency of coefficients (i.e., the coefficients are still consistent) but the estimated standard errors are too low leading to artificially high t-statistics.", "explhtml": "<p>Positive serial correlation in residuals does not affect the consistency of coefficients (i.e., the coefficients are still consistent) but the estimated standard errors are too low leading to artificially high t-statistics.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–11<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>In this multiple regression, if Stumper discovers that the residuals exhibit positive serial correlation, the most likely effect is:<\/p><\/div>", "subj": "quant"}, {"n": 12, "q": "Consider the following estimated regression equation: AUTOₜ = 10.0 + 1.25 PIₜ + 1.0 TEENₜ – 2.0 INSₜ The equation was estimated over 40 companies. The predicted value of AUTO if PI is 4, TEEN is 0.30, and INS = 0.6 is closest to:", "opts": ["14.90.", "14.10.", "17.50."], "ans": "B", "expl": "Predicted AUTO = 10 + 1.25 (4) + 1.0 (0.30) – 2.0 (0.6) = 10 + 5 + 0.3 – 1.2 = 14.10", "explhtml": "<p>Predicted AUTO<\/p><p>= 10 + 1.25 (4) + 1.0 (0.30) – 2.0 (0.6)<\/p><p>= 10 + 5 + 0.3 – 1.2<\/p><p>= 14.10<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>Consider the following estimated regression equation:<\/p><p>AUTO<sub>t <\/sub>= 10.0 + 1.25 PI<sub>t<\/sub> + 1.0 TEEN<sub>t<\/sub> – 2.0 INS<sub>t<\/sub><\/p><p>The equation was estimated over 40 companies. The predicted value of AUTO if PI is 4, TEEN is 0.30, and INS = 0.6 is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 13, "q": "Salve runs a regression using the squared residuals from the model using the original dependent variables. The coefficient of determination of this model is 6%. Which of the following is the most appropriate conclusion at a 5% level of significance?", "opts": ["Because the test statistic of 7.20 is higher than the critical value of 3.84, we reject the null hypothesis of no conditional heteroskedasticity in residuals.", "Because the test statistic of 7.20 is lower than the critical value of 7.81, we fail to reject the null hypothesis of no conditional heteroskedasticity in residuals.", "Because the test statistic of 3.60 is lower than the critical value of 3.84, we reject the null hypothesis of no conditional heteroskedasticity in residuals."], "ans": "B", "expl": "The chi-square test statistic = n × R² = 120 × 0.06 = 7.20. The one-tailed critical value for a chi-square distribution with k = 3 degrees of freedom and α of 5% is 7.81. Therefore, we should not reject the null hypothesis and conclude that we don't have a problem with conditional heteroskedasticity.", "explhtml": "<p>The chi-square test statistic = n × R<sup>2<\/sup> = 120 × 0.06 = 7.20.<\/p><p>The one-tailed critical value for a chi-square distribution with k = 3 degrees of freedom and α of 5% is 7.81. Therefore, we should not reject the null hypothesis and conclude that we don&#x27;t have a problem with conditional heteroskedasticity.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 13–16<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"kq-note\">Câu thuộc item set (câu 13–16). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Salve runs a regression using the squared residuals from the model using the original dependent variables. The coefficient of determination of this model is 6%. Which of the following is the most appropriate conclusion at a 5% level of significance?<\/p><\/div>", "subj": "quant"}, {"n": 14, "q": "Which of the following misspecifications is most likely to cause serial correlation in residuals?", "opts": ["Data improperly pooled.", "Improper variable scaling.", "Improper variable form."], "ans": "A", "expl": "Out of the four forms of model misspecifications, serial correlation in residuals may be caused by omission of important variables (not an answer choice) and by improper data pooling.", "explhtml": "<p>Out of the four forms of model misspecifications, serial correlation in residuals may be caused by omission of important variables (not an answer choice) and by improper data pooling.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 13–16<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.g<\/div><div class=\"qtext\"><p>Which of the following misspecifications is most likely to cause serial correlation in residuals?<\/p><\/div>", "subj": "quant"}, {"n": 15, "q": "Should Salve be concerned about residual serial correlation?", "opts": ["Yes, for one lag only.", "Yes, for two lags only.", "No."], "ans": "C", "expl": "The BG test statistic has an F-distribution with p and n – p – k – 1 degrees of freedom, where p = the number of lags tested. Given n = 120 and k = 3, critical F-values (5% level of significance) are 3.92 (p = 1) and 3.08 (p = 2). BG stats in  Indian Equities—Fama-French Model are lower than the critical F-values; therefore, serial correlation does not seem to be a problem for both lags.", "explhtml": "<p>The BG test statistic has an F-distribution with p and n – p – k – 1 degrees of freedom, where p = the number of lags tested. Given n = 120 and k = 3, critical F-values (5% level of significance) are 3.92 (p = 1) and 3.08 (p = 2). BG stats in  Indian Equities—Fama-French Model are lower than the critical F-values; therefore, serial correlation does not seem to be a problem for both lags.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 13–16<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.i<\/div><div class=\"qtext\"><p>Should Salve be concerned about residual serial correlation?<\/p><\/div>", "subj": "quant"}, {"n": 16, "q": "Should Salve be concerned about residual multicollinearity?", "opts": ["Yes, and Salve should exclude either variable SMB or HML from the model.", "Yes, and Salve should exclude variable Rm-Rf from the model.", "No."], "ans": "C", "expl": "Multicollinearity is detected using the variance inflation factor (VIF). VIF values greater than 5 (i.e., R² > 80%) warrant further investigation, while values above 10 (i.e., R² > 90%) indicate severe multicollinearity. None of the variables have VIF > 5.", "explhtml": "<p>Multicollinearity is detected using the variance inflation factor (VIF). VIF values greater than 5 (i.e., R<sup>2<\/sup> &gt; 80%) warrant further investigation, while values above 10 (i.e., R<sup>2<\/sup> &gt; 90%) indicate severe multicollinearity. None of the variables have VIF &gt; 5.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 13–16<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>Should Salve be concerned about residual multicollinearity?<\/p><\/div>", "subj": "quant"}, {"n": 17, "q": "When constructing a regression model to predict portfolio returns, an analyst runs a regression for the past five year period. After examining the results, she determines that an increase in interest rates two years ago had a significant impact on portfolio results for the time of the increase until the present. By performing a regression over two separate time periods, the analyst would be attempting to prevent which type of misspecification?", "opts": ["Incorrectly pooling data.", "Inappropriate variable scaling.", "Inappropriate variable form."], "ans": "A", "expl": "The relationship between returns and the dependent variables can change over time, so it is critical that the data be pooled correctly. Running the regression for multiple sub-periods (in this case two) rather than one time period can produce more accurate results.", "explhtml": "<p>The relationship between returns and the dependent variables can change over time, so it is critical that the data be pooled correctly. Running the regression for multiple sub-periods (in this case two) rather than one time period can produce more accurate results.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.g<\/div><div class=\"qtext\"><p>When constructing a regression model to predict portfolio returns, an analyst runs a regression for the past five year period. After examining the results, she determines that an increase in interest rates two years ago had a significant impact on portfolio results for the time of the increase until the present. By performing a regression over two separate time periods, the analyst would be attempting to prevent which type of misspecification?<\/p><\/div>", "subj": "quant"}, {"n": 18, "q": "Concerning the assumptions of multiple regression, Grimbles is:", "opts": ["correct to agree with Voiku’s list of assumptions.", "incorrect to agree with Voiku’s list of assumptions because one of the assumptions is stated incorrectly.", "incorrect to agree with Voiku’s list of assumptions because two of the assumptions are stated incorrectly."], "ans": "C", "expl": "Assumption 2 is stated incorrectly. Some correlation between independent variables is unavoidable; and high correlation results in multicollinearity. However, an exact linear relationship between linear combinations of two or more independent variables should not exist. Assumption 4 is also stated incorrectly. The assumption is that the residuals are serially uncorrelated (i.e., they are not serially correlated).", "explhtml": "<p>Assumption 2 is stated incorrectly. Some correlation between independent variables is unavoidable; and high correlation results in multicollinearity. However, an exact linear relationship between linear combinations of two or more independent variables should not exist.<\/p><p>Assumption 4 is also stated incorrectly. The assumption is that the residuals are serially uncorrelated (i.e., they are not serially correlated).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 18–20). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Concerning the assumptions of multiple regression, Grimbles is:<\/p><\/div>", "subj": "quant"}, {"n": 19, "q": "The most appropriate decision with regard to the F-statistic for testing the null hypothesis that all of the independent variables are simultaneously equal to zero at the 5 percent significance level is to:", "opts": ["reject the null hypothesis because the F-statistic is larger than the critical F-value of 2.66.", "reject the null hypothesis because the F-statistic is larger than the critical F-value of 3.19.", "fail to reject the null hypothesis because the F-statistic is smaller than the critical Fvalue of 2.66."], "ans": "A", "expl": "RSS = 368.7 – 140.3 = 228.4, F-statistic = (228.4 / 3) / (140.3 / 176) = 95.51. The critical value for a one-tailed 5% F-test with 3 and 176 degrees of freedom is 2.66. Because the F-statistic is greater than the critical F-value, the null hypothesis that all of the independent variables are simultaneously equal to zero should be rejected.", "explhtml": "<p>RSS = 368.7 – 140.3 = 228.4, F-statistic = (228.4 / 3) / (140.3 / 176) = 95.51. The critical value for a one-tailed 5% F-test with 3 and 176 degrees of freedom is 2.66. Because the F-statistic is greater than the critical F-value, the null hypothesis that all of the independent variables are simultaneously equal to zero should be rejected.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>The most appropriate decision with regard to the F-statistic for testing the null hypothesis that all of the independent variables are simultaneously equal to zero at the 5 percent significance level is to:<\/p><\/div>", "subj": "quant"}, {"n": 20, "q": "The multiple regression, as specified, most likely suffers from:", "opts": ["heteroskedasticity.", "multicollinearity.", "serial correlation of the error terms."], "ans": "B", "expl": "The regression is highly significant (based on the F-stat in Part 3), but the individual coefficients are not (all p-values > 0.05). This is a result of a regression with significant multicollinearity problems.", "explhtml": "<p>The regression is highly significant (based on the F-stat in Part 3), but the individual coefficients are not (all p-values &gt; 0.05). This is a result of a regression with significant multicollinearity problems.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>The multiple regression, as specified, most likely suffers from:<\/p><\/div>", "subj": "quant"}, {"n": 21, "q": "Which of the following statements regarding the R² is least accurate?", "opts": ["The R² of a regression will be greater than or equal to the adjusted-R2 for the same regression.", "R² is the coefficient of determination of the regression.", "The R² is the ratio of the unexplained variation to the explained variation of the dependent variable."], "ans": "C", "expl": "The R² is the ratio of the explained variation to the total variation.", "explhtml": "<p>The R<sup>2<\/sup> is the ratio of the explained variation to the total variation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>Which of the following statements regarding the R<sup>2<\/sup> is least accurate?<\/p><\/div>", "subj": "quant"}, {"n": 22, "q": "Using the regression model developed, the closest prediction of sales for December 20X6 is:", "opts": ["$36,000.", "$55,000.", "$44,000."], "ans": "A", "expl": "1.76 + 0.23 × (150) – 0.08 × (7.5) = 35.66.", "explhtml": "<p>1.76 + 0.23 × (150) – 0.08 × (7.5) = 35.66.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 22–26). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the regression model developed, the closest prediction of sales for December 20X6 is:<\/p><\/div>", "subj": "quant"}, {"n": 23, "q": "Will Jack conclude that the housing starts coefficient is statistically different from zero and how will he interpret it at the 5% significance level?", "opts": ["Different from zero; sales will rise by $100 for every 23 house starts.", "Not different from zero; sales will rise by $0 for every 100 house starts.", "Different from zero; sales will rise by $23 for every 100 house starts."], "ans": "C", "expl": "A p-value (0.017) below significance (0.05) indicates a variable that is statistically different from zero. The coefficient of 0.23 indicates that sales will rise by $23 for every 100 house starts. Remember the rule p-value < significance, then reject null.", "explhtml": "<p>A p-value (0.017) below significance (0.05) indicates a variable that is statistically different from zero. The coefficient of 0.23 indicates that sales will rise by $23 for every 100 house starts. Remember the rule p-value &lt; significance, then reject null.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Will Jack conclude that the housing starts coefficient is statistically different from zero and how will he interpret it at the 5% significance level?<\/p><\/div>", "subj": "quant"}, {"n": 24, "q": "In this multiple regression, the F-statistic indicates the:", "opts": ["the joint significance of the independent variables.", "degree of correlation between the independent variables.", "deviation of the estimated values from the actual values of the dependent variable."], "ans": "A", "expl": "The F-statistic is for the general linear F-test to test the null hypothesis that slope coefficients on all variables are equal to zero.", "explhtml": "<p>The F-statistic is for the general linear F-test to test the null hypothesis that slope coefficients on all variables are equal to zero.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>In this multiple regression, the F-statistic indicates the:<\/p><\/div>", "subj": "quant"}, {"n": 25, "q": "The regression statistics indicate that for the period under study, the independent variables (housing starts, mortgage interest rate) together explain approximately what percentage of the variation in the dependent variable (sales)?", "opts": ["67.00.", "9.80.", "77.00."], "ans": "C", "expl": "The question is asking for the coefficient of determination.", "explhtml": "<p>The question is asking for the coefficient of determination.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"qtext\"><p>The regression statistics indicate that for the period under study, the independent variables (housing starts, mortgage interest rate) together explain approximately what percentage of the variation in the dependent variable (sales)?<\/p><\/div>", "subj": "quant"}, {"n": 26, "q": "For this question only, assume that the regression of squared residuals on the independent variables has R² = 11%. At a 5% level of significance, which of the following conclusions is most accurate?", "opts": ["Because the critical value is 3.84, we reject the null hypothesis of no conditional heteroskedasticity.", "With a test statistic of 13.53, we can conclude the presence of conditional heteroskedasticity.", "With a test statistic of 0.22, we cannot reject the null hypothesis of no conditional heteroskedasticity."], "ans": "B", "expl": "Chi-square = n × R² = 123 × 0.11 = 13.53. Critical Chi-square (degree of freedom = k = 2) = 5.99. Because the test statistic exceeds the critical value, we reject the null hypothesis (of no conditional heteroskedasticity).", "explhtml": "<p>Chi-square = n × R<sup>2<\/sup> = 123 × 0.11 = 13.53. Critical Chi-square (degree of freedom = k = 2) = 5.99. Because the test statistic exceeds the critical value, we reject the null hypothesis (of no conditional heteroskedasticity).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 22–26<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>For this question only, assume that the regression of squared residuals on the independent variables has R<sup>2<\/sup> = 11%. At a 5% level of significance, which of the following conclusions is most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 27, "q": "Which model would be a better choice for making a forecast?", "opts": ["Model TWO because it has a higher adjusted R².", "Model TWO because serial correlation is not a problem.", "Model ONE because it has a higher R²."], "ans": "A", "expl": "Model TWO has a higher adjusted R² and thus would produce the more reliable estimates. As is always the case when a variable is removed, R² for Model TWO is lower. The increase in adjusted R² indicates that the removed variable, Q3, has very little explanatory power, and removing it should improve the accuracy of the estimates.", "explhtml": "<p>Model TWO has a higher adjusted R<sup>2<\/sup> and thus would produce the more reliable estimates. As is always the case when a variable is removed, R<sup>2<\/sup> for Model TWO is lower. The increase in adjusted R<sup>2<\/sup> indicates that the removed variable, Q3, has very little explanatory power, and removing it should improve the accuracy of the estimates.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 27–31<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 27–31). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which model would be a better choice for making a forecast?<\/p><\/div>", "subj": "quant"}, {"n": 28, "q": "Using Model ONE, what is the sales forecast for the second quarter of the next year?", "opts": ["$51.09 million.", "$46.31 million.", "$56.02 million."], "ans": "A", "expl": "The estimate for the second quarter of the following year would be (in millions): 31.4083 + (−2.4631) + (24 + 2) × 0.851786 = 51.091666.", "explhtml": "<p>The estimate for the second quarter of the following year would be (in millions):<\/p><p>31.4083 + (−2.4631) + (24 + 2) × 0.851786 = 51.091666.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 27–31<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>Using Model ONE, what is the sales forecast for the second quarter of the next year?<\/p><\/div>", "subj": "quant"}, {"n": 29, "q": "Which model misspecification is most likely to cause multicollinearity?", "opts": ["Inappropriate variable form.", "Ommission of important variable(s).", "Inappropriate variable scaling."], "ans": "C", "expl": "Inappropriate variable scaling may lead to multicollinearity or heteroskedasticity in residuals. Omission of important variable may lead to biased and inconsistent regression parameters and also heteroskedasticity/serial correlation in residuals. Inappropriate variable form can lead to heteroskedasticity in residuals.", "explhtml": "<p>Inappropriate variable scaling may lead to multicollinearity or heteroskedasticity in residuals. Omission of important variable may lead to biased and inconsistent regression parameters and also heteroskedasticity/serial correlation in residuals. Inappropriate variable form can lead to heteroskedasticity in residuals.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 27–31<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.g<\/div><div class=\"qtext\"><p>Which model misspecification is most likely to cause multicollinearity?<\/p><\/div>", "subj": "quant"}, {"n": 30, "q": "If it is determined that conditional heteroskedasticity is present in model one, which of the following inferences are most accurate?", "opts": ["Regression coefficients will be unbiased but standard errors will be biased.", "Both the regression coefficients and the standard errors will be biased.", "Regression coefficients will be biased but standard errors will be unbiased."], "ans": "A", "expl": "Presence of conditional heteroskedasticity will not affect the consistency of regression coefficients but will bias the standard errors leading to incorrect application of t-tests for statistical significance of regression parameters.", "explhtml": "<p>Presence of conditional heteroskedasticity will not affect the consistency of regression coefficients but will bias the standard errors leading to incorrect application of t-tests for statistical significance of regression parameters.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 27–31<\/div> <div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>If it is determined that conditional heteroskedasticity is present in model one, which of the following inferences are most accurate?<\/p><\/div>", "subj": "quant"}, {"n": 31, "q": "If Mercado determines that Model TWO is the appropriate specification, then he is essentially saying that for each year, value of sales from quarter three to four is expected to:", "opts": ["grow by more than $1,000,000.", "remain approximately the same.", "grow, but by less than $1,000,000."], "ans": "C", "expl": "The specification of Model TWO essentially assumes there is no difference attributed to the change of the season from the third to fourth quarter. However, the time trend is significant. The trend effect for moving from one season to the next is the coefficient on TREND times $1,000,000 which is $852,182 for Equation TWO.", "explhtml": "<p>The specification of Model TWO essentially assumes there is no difference attributed to the change of the season from the third to fourth quarter. However, the time trend is significant. The trend effect for moving from one season to the next is the coefficient on TREND times $1,000,000 which is $852,182 for Equation TWO.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 27–31<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>If Mercado determines that Model TWO is the appropriate specification, then he is essentially saying that for each year, value of sales from quarter three to four is expected to:<\/p><\/div>", "subj": "quant"}, {"n": 32, "q": "What is the correct interpretation of the coefficient of closed in the first regression?", "opts": ["If a model is closed to new investors, the expected excess fund return is 1.65%.", "A closed fund is likely to generate a return of 1.65%.", "A closed fund is estimated to have an extra return of 1.65% relative to funds that are not closed."], "ans": "C", "expl": "The interpretation of the coefficient is the extra return relative to the alternative outcome.", "explhtml": "<p>The interpretation of the coefficient is the extra return relative to the alternative outcome.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–34<\/div> <div class=\"pp-topic\">Module 1.4, LOS 1.l<\/div><div class=\"kq-note\">Câu thuộc item set (câu 32–34). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the correct interpretation of the coefficient of closed in the first regression?<\/p><\/div>", "subj": "quant"}, {"n": 33, "q": "To check for only the outliers in the sample, Lee should most appropriately use:", "opts": ["Studentized residuals.", "leverage.", "Breusch-Pagan statistic."], "ans": "A", "expl": "Outliers are extreme observations of the dependent variable. Studentized residuals are used to identify outliers. Leverage is used to identify high-leverage observations (in the independent variable),The Breusch-Pagan test statistic is used to identify conditional heteroskedasticity in residuals.", "explhtml": "<p>Outliers are extreme observations of the dependent variable. Studentized residuals are used to identify outliers. Leverage is used to identify high-leverage observations (in the independent variable),The Breusch-Pagan test statistic is used to identify conditional heteroskedasticity in residuals.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–34<\/div> <div class=\"pp-topic\">Module 1.4, LOS 1.k<\/div><div class=\"qtext\"><p>To check for only the outliers in the sample, Lee should most appropriately use:<\/p><\/div>", "subj": "quant"}, {"n": 34, "q": "Which of the following is least accurate statement about logit models?", "opts": ["Logistic regression (logit) models use log odds as the dependent variable.", "A logit model assumes that residuals have a normal distribution.", "The coefficients of the logit model are estimated using the maximum likelihood estimation methodology."], "ans": "B", "expl": "A logit model assumes that residuals have a logistic distribution, which is similar to a normal distribution but with fatter tails. The other statements are correct.", "explhtml": "<p>A logit model assumes that residuals have a logistic distribution, which is similar to a normal distribution but with fatter tails. The other statements are correct.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–34<\/div> <div class=\"pp-topic\">Module 1.4, LOS 1.m<\/div><div class=\"qtext\"><p>Which of the following is least accurate statement about logit models?<\/p><\/div>", "subj": "quant"}, {"n": 35, "q": "Regarding Sophie's statement on multiple regression:", "opts": ["only Statement 1 is correct.", "only Statement 2 is correct.", "both statements are correct."], "ans": "B", "expl": "Multiple regression models can be used to identify relations between variables, forecast the dependent variable, and test existing theories. Statement 1 is inaccurate in because it mentions forecast independent (and not dependent) variables.", "explhtml": "<p>Multiple regression models can be used to identify relations between variables, forecast the dependent variable, and test existing theories. Statement 1 is inaccurate in because it mentions forecast independent (and not dependent) variables.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 35–38). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Regarding Sophie&#x27;s statement on multiple regression:<\/p><\/div>", "subj": "quant"}, {"n": 36, "q": "Based on the credit spread model, if an issuer gets included in the CDX index and assuming everything else the same, which of the following statements most accurately describes the model's forecast?", "opts": ["The credit spread on the firm’s issue would decrease by 10 bps.", "The credit spread on the firm’s issue will increase by 32 bps.", "The credit spread on the firm’s issue will decrease by 32 bps."], "ans": "C", "expl": "The coefficient on the index dummy variable is –0.32, and if the variable takes a value of 1 (inclusion in the index), the credit spread would decrease by 0.32%, or 32 bps.", "explhtml": "<p>The coefficient on the index dummy variable is –0.32, and if the variable takes a value of 1 (inclusion in the index), the credit spread would decrease by 0.32%, or 32 bps.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Based on the credit spread model, if an issuer gets included in the CDX index and assuming everything else the same, which of the following statements most accurately describes the model&#x27;s forecast?<\/p><\/div>", "subj": "quant"}, {"n": 37, "q": "Which of the following is least likely an assumption of multiple linear regression?", "opts": ["The dependent variable is not serially correlated.", "There is no linear relationship between the independent variables.", "The error term is normally distributed."], "ans": "A", "expl": "The assumption calls for the residual (or errors) to be not serially correlated. The dependent variable can have serial correlation. Other assumptions are accurate.", "explhtml": "<p>The assumption calls for the residual (or errors) to be not serially correlated. The dependent variable can have serial correlation. Other assumptions are accurate.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.c<\/div><div class=\"qtext\"><p>Which of the following is least likely an assumption of multiple linear regression?<\/p><\/div>", "subj": "quant"}, {"n": 38, "q": "Which assumption of multiple regression is most likely evaluated using a QQ plot?", "opts": ["Serial correlation of residuals.", "Conditional heteroskedasticity.", "Error term is normally distributed."], "ans": "C", "expl": "A normal QQ plot of the residuals can visually indicate violation of the assumption that the residuals are normally distributed.", "explhtml": "<p>A normal QQ plot of the residuals can visually indicate violation of the assumption that the residuals are normally distributed.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 35–38<\/div> <div class=\"pp-topic\">Module 1.1, LOS 1.c<\/div><div class=\"qtext\"><p>Which assumption of multiple regression is most likely evaluated using a QQ plot?<\/p><\/div>", "subj": "quant"}, {"n": 39, "q": "Jason Fye, CFA, wants to check for seasonality in monthly stock returns (i.e., the January effect) after controlling for market cap and systematic risk. The type of model that Fye would most appropriately select is:", "opts": ["Neither multiple regression nor logistic regression.", "Multiple regression model.", "logistic regression model."], "ans": "B", "expl": "Fye wants to test a theory of January effect on stock returns (dependent variable) using a dummy (January = 1, other months = 0), market cap, and beta (independent variables). A multiple regression model would be most appropriate. Because the dependent variable (stock returns) is not a qualitative variable, a logistic regression would not apply.", "explhtml": "<p>Fye wants to test a theory of January effect on stock returns (dependent variable) using a dummy (January = 1, other months = 0), market cap, and beta (independent variables). A multiple regression model would be most appropriate. Because the dependent variable (stock returns) is not a qualitative variable, a logistic regression would not apply.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.a<\/div><div class=\"qtext\"><p>Jason Fye, CFA, wants to check for seasonality in monthly stock returns (i.e., the January effect) after controlling for market cap and systematic risk. The type of model that Fye would most appropriately select is:<\/p><\/div>", "subj": "quant"}, {"n": 40, "q": "One choice a researcher can use to test for nonstationarity is to use a:", "opts": ["Breusch-Pagan test, which uses a modified t-statistic.", "Dickey-Fuller test, which uses a modified t-statistic.", "Dickey-Fuller test, which uses a modified χ² statistic."], "ans": "B", "expl": "The Dickey-Fuller test estimates the equation (xₜ – xₜ₋₁) = b₀ + (b₁ - 1) * xₜ₋₁ + eₜ and tests if H₀: (b₁ – 1) = 0. Using a modified t-test, if it is found that (b₁– 1) is not significantly different from zero, then it is concluded that b₁ must be equal to 1.0 and the series has a unit root.", "explhtml": "<p>The Dickey-Fuller test estimates the equation (x<sub>t<\/sub> – x<sub>t-1<\/sub>) = b<sub>0<\/sub> + (b<sub>1<\/sub> - 1) * x<sub>t-1<\/sub> + e<sub>t<\/sub> and tests if H<sub>0<\/sub>: (b<sub>1<\/sub> – 1) = 0. Using a modified t-test, if it is found that (b<sub>1<\/sub>– 1) is not significantly different from zero, then it is concluded that b<sub>1<\/sub> must be equal to 1.0 and the series has a unit root.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.h<\/div><div class=\"qtext\"><p>One choice a researcher can use to test for nonstationarity is to use a:<\/p><\/div>", "subj": "quant"}, {"n": 41, "q": "According to the model and the data for the Chicago metropolitan area, the forecast of generator sales is:", "opts": ["$65 million above the average.", "$35.2 million above the average.", "$55 million above average."], "ans": "B", "expl": "The model uses a multiple regression equation to predict sales by multiplying the estimated coefficient by the observed value to get: [5 + (2 × 0.10) + (3 × 5) + (10 × 3) + (5 × (−3))] × $1,000,000 = $35.2 million.", "explhtml": "<p>The model uses a multiple regression equation to predict sales by multiplying the estimated coefficient by the observed value to get:<\/p><p>[5 + (2 × 0.10) + (3 × 5) + (10 × 3) + (5 × (−3))] × $1,000,000 = $35.2 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 41–45<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 41–45). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>According to the model and the data for the Chicago metropolitan area, the forecast of generator sales is:<\/p><\/div>", "subj": "quant"}, {"n": 42, "q": "Williams proceeds to test the hypothesis that none of the independent variables has significant explanatory power. Using the joint F-test for the significance of all slope coefficients, at a 5% level of significance:", "opts": ["all of the independent variables have explanatory power.", "none of the independent variables has explanatory power.", "at least one of the independent variables has explanatory power."], "ans": "C", "expl": "From the ANOVA table, the calculated F-statistic is (mean square regression / mean square error) = (83.80 / 28.88) = 2.9017. From the F distribution table (4 df numerator, 21 df denominator) the critical F value is 2.84. Because 2.9017 is greater than 2.84, Williams rejects the null hypothesis and concludes that at least one of the independent variables has explanatory power.", "explhtml": "<p>From the ANOVA table, the calculated F-statistic is (mean square regression / mean square error) = (83.80 / 28.88) = 2.9017. From the F distribution table (4 df numerator, 21 df denominator) the critical F value is 2.84. Because 2.9017 is greater than 2.84, Williams rejects the null hypothesis and concludes that at least one of the independent variables has explanatory power.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 41–45<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>Williams proceeds to test the hypothesis that none of the independent variables has significant explanatory power. Using the joint F-test for the significance of all slope coefficients, at a 5% level of significance:<\/p><\/div>", "subj": "quant"}, {"n": 43, "q": "With respect to testing the validity of the model's results, Williams may wish to perform:", "opts": ["both a Breusch-Godfrey test and a Breusch-Pagan test.", "a Breusch-Pagan test, but not Breusch-Godfrey.", "a Breusch-Godfrey test, but not a Breusch-Pagan test."], "ans": "A", "expl": "Since the model utilized is not an autoregressive time series, a test for serial correlation is appropriate so the Breusch-Godfrey test would be used. The Breusch-Pagan test for heteroskedasticity would also be a good idea.", "explhtml": "<p>Since the model utilized is not an autoregressive time series, a test for serial correlation is appropriate so the Breusch-Godfrey test would be used. The Breusch-Pagan test for heteroskedasticity would also be a good idea.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 41–45<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>With respect to testing the validity of the model&#x27;s results, Williams may wish to perform:<\/p><\/div>", "subj": "quant"}, {"n": 44, "q": "When Williams ran the model, the computer said the R² is 0.233. She examines the other output and concludes that this is the:", "opts": ["neither the unadjusted nor adjusted R² value, nor the coefficient of correlation.", "unadjusted R² value.", "adjusted R² value."], "ans": "C", "expl": "This can be answered by recognizing that the unadjusted R-square is (335.2 / 941.6) = 0.356. Thus, the reported value must be the adjusted R². To verify this we see that the adjusted R-squared is: 1− ((26 − 1) / (26 − 4 − 1)) × (1 − 0.356) = 0.233. Note that whenever there is more than one independent variable, the adjusted R² will always be less than R².", "explhtml": "<p>This can be answered by recognizing that the unadjusted R-square is (335.2 / 941.6) = 0.356. Thus, the reported value must be the adjusted R<sup>2<\/sup>. To verify this we see that the adjusted R-squared is: 1− ((26 − 1) / (26 − 4 − 1)) × (1 − 0.356) = 0.233. Note that whenever there is more than one independent variable, the adjusted R<sup>2<\/sup> will always be less than R<sup>2<\/sup>.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 41–45<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>When Williams ran the model, the computer said the R<sup>2<\/sup> is 0.233. She examines the other output and concludes that this is the:<\/p><\/div>", "subj": "quant"}, {"n": 45, "q": "In preparing and using this model, Williams has least likely relied on which of the following assumptions?", "opts": ["The residuals are homoscedastic.", "The disturbance or error term is normally distributed.", "There is a linear relationship between the independent variables."], "ans": "C", "expl": "Multiple regression models assume that there is no linear relationship between two or more of the independent variables. The other answer choices are both assumptions of multiple regression.", "explhtml": "<p>Multiple regression models assume that there is no linear relationship between two or more of the independent variables. The other answer choices are both assumptions of multiple regression.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 41–45<\/div> <div class=\"pp-topic\">Module 1.2, LOS 1.e<\/div><div class=\"qtext\"><p>In preparing and using this model, Williams has least likely relied on which of the following assumptions?<\/p><\/div>", "subj": "quant"}, {"n": 46, "q": "A multiple regression model has included independent variables that are not linearly related to the dependent variable. The model is most likely misspecified due to:", "opts": ["incorrect data pooling.", "incorrect variable form.", "incorrect variable scaling."], "ans": "B", "expl": "Incorrect variable form misspecification occurs if the relationship between dependent and independent variables is nonlinear.", "explhtml": "<p>Incorrect variable form misspecification occurs if the relationship between dependent and independent variables is nonlinear.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.g<\/div><div class=\"qtext\"><p>A multiple regression model has included independent variables that are not linearly related to the dependent variable. The model is most likely misspecified due to:<\/p><\/div>", "subj": "quant"}, {"n": 47, "q": "Consider the following regression equation: Salesᵢ = 10.0 + 1.25 R&Dᵢ + 1.0 ADVᵢ – 2.0 COMPᵢ + 8.0 CAPᵢ where Sales is dollar sales in millions, R&D is research and development expenditures in millions, ADV is dollar amount spent on advertising in millions, COMP is the number of competitors in the industry, and CAP is the capital expenditures for the period in millions of dollars. Which of the following is NOT a correct interpretation of this regression information?", "opts": ["If R&D and advertising expenditures are $1 million each, there are 5 competitors, and capital expenditures are $2 million, expected Sales are $8.25 million.", "If a company spends $1 million more on capital expenditures (holding everything else constant), Sales are expected to increase by $8.0 million.", "One more competitor will mean $2 million less in Sales (holding everything else constant)."], "ans": "A", "expl": "Predicted sales = $10 + 1.25 + 1 – 10 + 16 = $18.25 million.", "explhtml": "<p>Predicted sales = $10 + 1.25 + 1 – 10 + 16 = $18.25 million.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.1, LOS 1.b<\/div><div class=\"qtext\"><p>Consider the following regression equation:<\/p><p>Sales<sub>i<\/sub> = 10.0 + 1.25 R&amp;D<sub>i <\/sub>+ 1.0 ADV<sub>i<\/sub> – 2.0 COMP<sub>i<\/sub> + 8.0 CAP<sub>i<\/sub><\/p><p>where Sales is dollar sales in millions, R&amp;D is research and development expenditures in millions, ADV is dollar amount spent on advertising in millions, COMP is the number of competitors in the industry, and CAP is the capital expenditures for the period in millions of dollars.<\/p><p>Which of the following is NOT a correct interpretation of this regression information?<\/p><\/div>", "subj": "quant"}, {"n": 48, "q": "One possible problem that could jeopardize the validity of the employment growth rate model is multicollinearity. Which of the following would most likely suggest the existence of multicollinearity?", "opts": ["The variance of the observations has increased over time.", "The Durbin–Watson statistic is significant.", "The F-statistic suggests that the overall regression is significant, however the regression coefficients are not individually significant."], "ans": "C", "expl": "One symptom of multicollinearity is that the regression coefficients may not be individually statistically significant even when according to the F-statistic the overall regression is significant. The problem of multicollinearity involves the existence of high correlation between two or more independent variables. Clearly, as service employment rises, construction employment must rise to facilitate the growth in these sectors. Alternatively, as manufacturing employment rises, the service sector must grow to serve the broader manufacturing sector. The variance of observations suggests the possible existence of heteroskedasticity. If the Durbin–Watson statistic may be used to test for serial correlation at a single lag.", "explhtml": "<p>One symptom of multicollinearity is that the regression coefficients may not be individually statistically significant even when according to the F-statistic the overall regression is significant. The problem of multicollinearity involves the existence of high correlation between two or more independent variables. Clearly, as service employment rises, construction employment must rise to facilitate the growth in these sectors. Alternatively, as manufacturing employment rises, the service sector must grow to serve the broader manufacturing sector.<\/p><p>The variance of observations suggests the possible existence of heteroskedasticity. If the Durbin–Watson statistic may be used to test for serial correlation at a single lag.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>One possible problem that could jeopardize the validity of the employment growth rate model is multicollinearity. Which of the following would most likely suggest the existence of multicollinearity?<\/p><\/div>", "subj": "quant"}, {"n": 49, "q": "Consider the following estimated regression equation: Salesᵢ = 10.0 + 1.25 R&Dᵢ + 1.0 ADVᵢ − 2.0 COMPᵢ + 8.0 CAPᵢ Sales are in millions of dollars. An analyst is given the following predictions on the independent variables: R&D = 5, ADV = 4, COMP = 10, and CAP = 40. The predicted level of sales is closest to:", "opts": ["$310.25 million.", "$300.25 million.", "$320.25 million."], "ans": "C", "expl": "Predicted sales = $10 + 1.25 (5) + 1.0 (4) −2.0 (10) + 8 (40) = 10 + 6.25 + 4 − 20 + 320 = $320.25", "explhtml": "<p>Predicted sales<\/p><p>= $10 + 1.25 (5) + 1.0 (4) −2.0 (10) + 8 (40)<\/p><p>= 10 + 6.25 + 4 − 20 + 320 = $320.25<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.2, LOS 1.f<\/div><div class=\"qtext\"><p>Consider the following estimated regression equation:<\/p><p>Sales<sub>i<\/sub> = 10.0 + 1.25 R&amp;D<sub>i<\/sub> + 1.0 ADV<sub>i<\/sub> − 2.0 COMP<sub>i<\/sub> + 8.0 CAP<sub>i<\/sub><\/p><p>Sales are in millions of dollars. An analyst is given the following predictions on the independent variables: R&amp;D = 5, ADV = 4, COMP = 10, and CAP = 40.<\/p><p>The predicted level of sales is closest to:<\/p><\/div>", "subj": "quant"}, {"n": 50, "q": "When pooling the samples over multiple economic environments in a multiple regression model, which of the following errors is most likely to occur?", "opts": ["Model misspecification.", "Heteroskedasticity.", "Multicollinearity."], "ans": "A", "expl": "When data are improperly pooled over multiple economic environments in a multiple regression analysis, the model would be misspecified.", "explhtml": "<p>When data are improperly pooled over multiple economic environments in a multiple regression analysis, the model would be misspecified.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.g<\/div><div class=\"qtext\"><p>When pooling the samples over multiple economic environments in a multiple regression model, which of the following errors is most likely to occur?<\/p><\/div>", "subj": "quant"}, {"n": 51, "q": "An analyst runs a regression of portfolio returns on three independent variables. These independent variables are price-to-sales (P/S), price-to-cash flow (P/CF), and price-to-book (P/B). The analyst discovers that the p-values for each independent variable are relatively high. However, the F-test has a very small p-value. The analyst is puzzled and tries to figure out how the F-test can be statistically significant when the individual independent variables are not significant. What violation of regression analysis has occurred?", "opts": ["multicollinearity.", "conditional heteroskedasticity.", "serial correlation."], "ans": "A", "expl": "An indication of multicollinearity is when the independent variables individually are not statistically significant but the F-test suggests that the variables as a whole do an excellent job of explaining the variation in the dependent variable.", "explhtml": "<p>An indication of multicollinearity is when the independent variables individually are not statistically significant but the F-test suggests that the variables as a whole do an excellent job of explaining the variation in the dependent variable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 1.3, LOS 1.j<\/div><div class=\"qtext\"><p>An analyst runs a regression of portfolio returns on three independent variables. These independent variables are price-to-sales (P/S), price-to-cash flow (P/CF), and price-to-book (P/B). The analyst discovers that the p-values for each independent variable are relatively high. However, the F-test has a very small p-value. The analyst is puzzled and tries to figure out how the F-test can be statistically significant when the individual independent variables are not significant. What violation of regression analysis has occurred?<\/p><\/div>", "subj": "quant"}, {"n": 52, "q": "Which of the following statements regarding heteros
