<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a zero-coupon bond's annual YTM stated with a periodicity of 4 is 5.80%, then the annual YTM stated with a periodicity of 2 is closest to:", "opts": ["its zero-volatility spread is less than 125 bp.", "the put option value is 125 bp higher than the bond's government spread.", "the appropriate compensation for this bond's liquidity, credit, and volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted spread to be higher than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 2, "q": "Information on two bonds is shown below: If yields are stated on a quarterly basis, the difference in yields between Bonds A and B, measured in basis points (bps), is closest to:", "opts": ["its zero-volatility spread is less than 125 bp.", "the put option value is 125 bp higher than the bond's government spread.", "the appropriate compensation for this bond's liquidity, credit, and volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted spread to be higher than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 3, "q": "If a putable bond has an option-adjusted spread (OAS) of 125 basis points (bp), the most appropriate conclusion is that:", "opts": ["its zero-volatility spread is less than 125 bp.", "the put option value is 125 bp higher than the bond's government spread.", "the appropriate compensation for this bond's liquidity, credit, and volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted spread to be higher than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 4, "q": "Information on the yield spreads for three nonconvertible bonds, expressed in basis points, is as follows: Zero-volatility Option-adjusted spread (Z-spread) spread (OAS) Bond 1 145 130 Bond 2 100 120 Bond 3 125 115 Based on this data, the most appropriate conclusion is that:", "opts": ["Bond 1 and Bond 3 are putable.", "Bond 2 is putable and Bond 3 is callable.", "Bond 1 is putable and Bond 2 is callable."], "ans": "B", "expl": "Relationship between Z-spread, OAS, and embedded options\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nWhen the cash flows of a nongovernment bond are discounted using a government bond spot rate curve, the theoretical price is usually higher\nthan the market price. This is due to the spot rates not accounting for the risks of the nongovernment bond (eg, credit risk, liquidity). The Z-\nspread, or zero-volatility spread, is a constant percentage that is added to each spot rate; the combined rate is then used as the discount rate for\neach maturity. This adjustment to each discount rate makes the theoretical price equal to the market price.\nFor callable and putable bonds, the Z-spread includes the value of the embedded option. Subtracting this option value from the Z-spread results\nin a spread that accounts for risks other than the option; this spread is called the option-adjusted spread (OAS).\nAn embedded option affects the yield that an investor receives from owning a bond. A callable bond is disadvantageous to the investor since\nthe issuer can terminate the cash flows before maturity. This means that a portion of the additional yield incorporates the option value.\nSubtracting that option value compensates for the other risks mentioned above. A put option benefits the investor, so the OAS of the bond will be\ngreater than its Z-spread.\nThe type of each bond in this scenario is shown below:\nZero-volatility spread Option-adjusted spread OAS vs. Z-spread Type of bond\nBond 1 145 130 OAS < Z-spread Callable\nBond 2 100 120 OAS > Z-spread Putable\nBond 3 125 115 OAS < Z-spread Callable\n(Choice A) The OAS for both Bond 1 and Bond 3 is less than their respective Z-spreads, so these bonds are callable.\n(Choice C) Bond 2 is putable, not callable, since its OAS is greater than its Z-spread.\nThings to remember:\nA callable bond has an option-adjusted spread (OAS) that is less than the bond's zero-volatility spread (Z-spread). The OAS of a putable bond is\ngreater than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 5, "q": "An analyst gathers the following information: Both bonds pay coupon interest semiannually. The one-year and two-year spot rates are 3.50% and 5.09%, respectively. All rates are stated on a semiannual basis. The G-spread, measured in basis points (bps), between the two-year corporate bond and the two-year government bond is closest to:", "opts": ["552", "934", "968"], "ans": "A", "expl": "A bond with an embedded option trades at a price that reflects both the value of the option and the risk of an otherwise similar bond (ie, same\ncredit quality, coupon rate, maturity) with no embedded option.\nAn embedded call is a disadvantage to a bondholder since the call can be exercised by the issuer when market conditions are favorable. Thus,\nissuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nTo calculate the OAS of a bond, subtract the call option value (in basis points/year) from the Z-spread (eg, 760 − 208 = 552 basis points).\nThings to remember:\nIssuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 6, "q": "An analyst has compiled the following data about a bond that has an embedded call option and matures in 8 years: If an option pricing model determines that the value of the embedded call is 208 basis points/year, the option-adjusted spread for the bond (in basis points/year) is closest to:", "opts": ["552", "934", "968"], "ans": "A", "expl": "A bond with an embedded option trades at a price that reflects both the value of the option and the risk of an otherwise similar bond (ie, same\ncredit quality, coupon rate, maturity) with no embedded option.\nAn embedded call is a disadvantage to a bondholder since the call can be exercised by the issuer when market conditions are favorable. Thus,\nissuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nTo calculate the OAS of a bond, subtract the call option value (in basis points/year) from the Z-spread (eg, 760 − 208 = 552 basis points).\nThings to remember:\nIssuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 7, "q": "The I-spread is most appropriately defined as the difference between a bond's yield and:", "opts": ["a swap rate.", "the spot curve.", "a government bond's yield."], "ans": "A", "expl": "A yield spread is the difference between a bond's YTM and a benchmark yield. The bond's yield can be expressed as the sum of\nthe benchmark rate, which represents factors that affect all bonds, and\nthe spread, which represents factors that are more specific to a bond or issuer.\nDifferent yield spreads result from the use of different benchmarks. Bond yields are often used as a benchmark, but benchmarks can also be\nderived from an interest rate swap curve. The I-spread is defined as the spread that a bond earns versus a swap rate of the same tenor.\n(Choice B) The spot curve is used to derive the Z-spread, which is a spread applied across the benchmark curve that allows the bond's\ndiscounted cash flows to equal the bond's price.\n(Choice C) The excess yield a bond earns over a government bond is the G-spread.\nThings to remember:\nA yield spread is the difference between a bond's YTM and a benchmark yield. The I-spread is defined as the difference in yields between a bond\nand a swap rate of the same tenor.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 8, "q": "An analyst is reviewing the term structure of spreads for a group of fixed-rate corporate bonds. The bonds were all issued in the UK and have the same risk profile. The analyst would most appropriately use the:", "opts": ["I-spread.", "Z-spread.", "G-spread."], "ans": "C", "expl": "The G-spread, I-spread, and Z-spread are each used to compare the risk of a bond (or bonds with the same risk profile) to that of a benchmark.\nHowever, the:\nG-spread is the spread of a bond's YTM over a government benchmark YTM and differs for each time-to-maturity.\nI-spread is the spread of a bond's YTM over an interbank lending benchmark rate and differs for each time-to-maturity.\nZ-spread is the spread of a bond cash flow's discount rate over a government or interbank lending benchmark spot rate and is the same for\nall times-to-maturity.\nSince the G-spread and I-spread differ across times-to-maturity, they both reflect the term structure of spreads for bonds with the same risk\nprofile and different times-to-maturity. Therefore, an analyst interested in comparing how the risk differs across times-to-maturity for bonds with\nthe same risk profile would use the G-spread or I-spread.\nThe benchmark used for fixed-rate bonds in the UK, US, and Japan is the G-spread. The I-spread is used to price Euro-denominated corporate\nbonds. Since the bonds in this scenario are fixed-rate UK-issued bonds, the G-spread is most appropriate, not the I-spread (Choice A).\nThe Z-spread (ie, zero-volatility spread) is the constant yield spread that—when added to the benchmark spot rates (not YTMs as with the G- and\nI-spreads) and used to discount each bond cash flow—equates the present value of the cash flows with the bond's observed price. The Z-spread\nis the same for all times-to-maturity. Therefore, it does not reflect the difference in YTM above the benchmark (and thus the difference in risk)\nassociated with differences in times-to-maturity (ie, the term structure of spreads) (Choice B).\nThings to remember:\nThe G-spread reflects the term structure of spreads (ie, how spreads differ across times-to-maturity) for bonds with the same risk profile and\ndifferent times-to-maturity. The benchmark used for fixed-rate bonds in the UK, US, and Japan is the G-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 9, "q": "A bond has two future cash flows: SAR 5 in 1 year and SAR 105 in 2 years, and the 1- and 2-year benchmark spot rates are 3% and 4% respectively. If the Z-spread is 6%, the bond's price is closest to: ", "opts": ["Liquidity in trading", "Currency exchange rates", "Business conditions in the issuer's country"], "ans": "A", "expl": "A bond's yield-to-maturity (YTM) describes and quantifies the rate of return that investors demand given its maturity and perceived credit\nquality. YTM is given as a percentage, and is the sum of two components:\nThe benchmark rate, which is also known as the risk-free rate of return; and\nThe spread, which consists of the additional amount of return over the benchmark rate.\nThe benchmark rate applies to government bonds, which are assumed to have no risk of default and are therefore referred to as risk-free bonds.\nThe benchmark rate incorporates macroeconomic factors such as a government's fiscal and monetary policies, expected inflation, and exchange\nrates for the issuer's currency (Choices B and C).\nThe spread captures the impact of factors that are specific to the nongovernment issuer as well as the bond itself. These include the issuer's\ncredit risk, both in absolute terms and relative to that of other issuers; liquidity of the bond; and whether the bondholder is subject to income tax on\nthe coupon interest. All these factors are expressed as an additional percentage that compensates investors for the additional risks. A risky\nbond's YTM is the sum of the benchmark rate and the spread.\nThings to remember:\nYield-to-maturity is the sum of the benchmark (ie, risk-free) rate plus the spread, which is the additional percentage required to compensate a\nbondholder for investing in a nongovernment bond. The benchmark rate incorporates macroeconomic factors, whereas the spread captures\nfactors that apply to a risky bond and/or its issuer.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 10, "q": "Which of the following is most likely included in the spread component of a corporate bond's yield-to-maturity?", "opts": ["Liquidity in trading", "Currency exchange rates", "Business conditions in the issuer's country"], "ans": "A", "expl": "A bond's yield-to-maturity (YTM) describes and quantifies the rate of return that investors demand given its maturity and perceived credit\nquality. YTM is given as a percentage, and is the sum of two components:\nThe benchmark rate, which is also known as the risk-free rate of return; and\nThe spread, which consists of the additional amount of return over the benchmark rate.\nThe benchmark rate applies to government bonds, which are assumed to have no risk of default and are therefore referred to as risk-free bonds.\nThe benchmark rate incorporates macroeconomic factors such as a government's fiscal and monetary policies, expected inflation, and exchange\nrates for the issuer's currency (Choices B and C).\nThe spread captures the impact of factors that are specific to the nongovernment issuer as well as the bond itself. These include the issuer's\ncredit risk, both in absolute terms and relative to that of other issuers; liquidity of the bond; and whether the bondholder is subject to income tax on\nthe coupon interest. All these factors are expressed as an additional percentage that compensates investors for the additional risks. A risky\nbond's YTM is the sum of the benchmark rate and the spread.\nThings to remember:\nYield-to-maturity is the sum of the benchmark (ie, risk-free) rate plus the spread, which is the additional percentage required to compensate a\nbondholder for investing in a nongovernment bond. The benchmark rate incorporates macroeconomic factors, whereas the spread captures\nfactors that apply to a risky bond and/or its issuer.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 11, "q": "A callable corporate bond's option-adjusted spread (OAS) is most likely calculated using the value (in basis points per year) of the embedded option and the:", "opts": ["I-spread.", "Z-spread.", "G-spread."], "ans": "B", "expl": "Options embedded in callable bonds complicate comparisons with other bonds. Adjusting the market price of callable bonds for the value of\nembedded options makes it easier to assess the impact of other risk factors (eg, credit quality, liquidity) on relative value. For this analysis, the\noption-adjusted spread (OAS) is estimated by subtracting the value of the option (in basis points per year) from a bond's Z-spread.\nThe Z-spread is the constant spread to a benchmark (ie, government or swap) curve that results in a series of periodic discount rates that equate\nthe present value of a bond's cash flows to its market price. Discount rates based on a Z-spread capture all risks affecting price, including any\nembedded options. An option pricing model estimates how much narrower the Z-spread would be for an equivalent noncallable bond. The\ncallable bond's OAS is used to calculate an option-adjusted price and yield, allowing better comparisons with other securities.\n(Choices A and C) The G- and I-spreads are based on the difference between a bond's YTM and a benchmark rate of the same maturity (eg, 5-\nyear corporate bond versus a 5-year government bond or swap). Since these spreads are computed separately for each maturity, they widen as\nmaturities increase, reflecting the greater relative risk of corporate securities for longer time horizons.\nThings to remember:\nA callable bond's option-adjusted spread (OAS) is calculated by subtracting the value of the embedded option (in basis points per year) from the\nbond's Z-spread. The OAS is used to estimate the bond's option-adjusted price and yield to facilitate comparisons with other bonds.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 12, "q": "A three-year, zero-coupon bond is priced at 80 per 100 of par value. The annual yield-to-maturity (YTM), stated with a periodicity of 6, is closest to:", "opts": ["95.90", "96.07", "97.50 Explanation HP 12c TI BA II Plus A bond's no-arbitrage (ie, arbitrage-free) value is calculated by discounting each cash flow by the spot rate corresponding to when that cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remembe   Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
