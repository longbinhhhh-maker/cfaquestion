<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "If a zero-coupon bond's annual YTM stated with a periodicity of 4 is 5.80%, then the annual YTM stated with a periodicity of 2 is closest to:", "opts": ["its zero-volatility spread is less than 125 bp.", "the put option value is 125 bp higher than the bond's government spread.", "the appropriate compensation for this bond's liquidity, credit, and volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted spread to be higher than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAs8AAADMCAIAAAADG9lnAAAhl0lEQVR42u2dv5LbRtLAm18594IvsDL2AaQrMj9fFTe2EjK1LiFTX0SGConofCGRnJQSiS8mqmznRJXvARa1egHCeoK9oL/tGg3+8D9Fcn+/QKUlQWAw0zPT093T03p6ehIAAACAo/F/VAEAAACgbQAAAADaBgAAAADaBgAAAKBtAAAAANoGAAAAANoGAAAAoG0AAAAA2gYAAAAA2gYAAACgbQAAAACgbQAAAADaBgAAAKBtAAAAAKBtAAAAwOVqG0mSDAaDwWDQ+pLBYJCmaZqm1LJRFEUURVEUeZ+PRiOrtzMs9t3dnZbt7u7uEqs9iiKr3iPJZBzHh3rEbsJgP7m/v7+/vz+S9BZF4RZPKcvzOVBXIQ3VmyRJkiQm7a1Wq91ut9ttEcmyLMsyvZX77vr5FQxNk8lkMplcXLHjOD5g12tGb14n9iY2+/S+PM/zPG/oWdoHy5+frBL24Zt9fjwajfQ967SQJElEZDqdjsfjF65naPOPRqMwDEWECoFLVNoa+vsVrAQGg0HzWHcdioU3venb6QA1nU6R8zOfQUQkDMNLnEHwpAAAAICcqW1jMplsuMqZTCadTkdEer3eC18X5nmutg2P2Ww2m80Qx8tlOBwOh0O5dj+g++dqtQqC4OLeoq6vuW+nC0d3oe9+2+l0lsvldbSpmp8v19+tne4cut7Dw8P+N9HZ4enpqWEGscsub/x52p6HhwevZqfT6XQ69S5wdYt+v9/v98u30h+6Y1av1+v1eovFYrFYlK93K3c+n8/n806no6qMDRPeze2r5XK5XC7du+kdvGHIvl0sFt7NrWxeqdzBS28ShqEKhP6koavoHVxBcQuwWCy8O2t1aY3pf9wyuyyXS+/p4/F4PB6X77m2xU24wzDUUjVUe7kYy+Wy3+977+4KjIsVOAzDyt/2+30VsPJvtUHdrjh9xj6pE61yU4rIfD4vX2P170q1+8PyI7Se7YfW+pUvUikMymq18oYVbWJ38tNPyh3Nq/8gCLxu28zmY4grolakymp3hxEtjLW+3mG1WjWXqrJCVGzqKqRcvZ6ElEe2uhd3b6tN6clqGIblLuapOzZilO9Z2dfqKnPDscItTN3QFIZhQ51XjkuuYV8L3NDRdCBaOyCUZxkb0Ew8vMosP7Rh/KkTfv2JN3jajFNX4MoWNCldrVblV+73+16BvbnVHrF2BmmuBL2gPP7oEFQ3L+85YpTBkwIAAADnZ9vwFJ+GxbEu8afTaeUabq1jpXxnz+LUYNM2jdJb2XuLSHeho9eXbR51xtjKBbGnP+ry9yC2DbOXrC2P1nadldu9yba2jQbLedl85ZW/jK6BrNo9qQieqXwFb/m1tsk2tG2od8AeWrbZ1BnDGtYWDfFc+izP5NZg23DXuA0Lbnd11SyBDXbHHWwbzZa8SkGt6zj659pS7VAhx7BtaHdr6B3W08u2jfKIUZa0TYbHDccK94cHsW00v3i5rzU0mQ0IlbaNSvFotm00jz/6RG/8WduUW9k29ObNzaF29+PZNiotSW5Nelb/5uHCFVFsGwAAAHD5tg0zCWy4/lhrHbEV5Gq18pyUntrllty1VSyXS89DWV5vlRfElQ54d3XrLftsmeg5lcsrFbPl2H+sGJVu9U1sG/JlJIH7UK+  measured in basis points (bps), is closest to:", "opts": ["its zero-volatility spread is less than 125 bp.", "the put option value is 125 bp higher than the bond's government spread.", "the appropriate compensation for this bond's liquidity, credit, and volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted nd volatility risks is 125 bp."], "ans": "A", "expl": "Relationship between Z-spread, OAS, and embedded option\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nThe Z-spread, or zero-volatility spread, is a constant percentage that is added to the rate for each maturity in a government spot yield curve. This\nenhanced spot rate is used as the discount rate for a bond's cash flows and equates the present values for all cash flows to the bond's market\nprice.\nNongovernment bonds have credit risk and liquidity risk; these risks are generally not present in government bonds. The embedded options in\ncallable or putable bonds represent an additional type of risk. The Z-spread is the additional yield required to compensate investors for all these\nrisks, including the embedded options.\nTo compare bonds with options to option-free bonds, the value of the option must be subtracted from the Z-spread, which results the option-\nadjusted spread (OAS). A putable bond's OAS is higher than its Z-spread. In this question, the putable bond's OAS is 125 basis points (bp), so\nits Z-spread is less than 125 bp.\n(Choice B) The implied put value is 125 bp higher than the Z-spread, not the government spread.\n(Choice C) Volatility risk relates to the value of the embedded option. Since OAS essentially separates the option risk from the other risks, OAS\ndoes not account for volatility.\nThings to remember:\nThe Z-spread is a constant percentage added to the rate for each maturity in a government spot yield curve. When a bond's cash flows are\ndiscounted, the Z-spread makes the bond's calculated present value equal to its market price. The put option in a putable bond causes its option-\nadjusted spread to be higher than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": null}, {"n": 4, "q": "Information on the yield spreads for three nonconvertible bonds, expressed in basis points, is as follows: Zero-volatility Option-adjusted spread (Z-spread) spread (OAS) Bond 1 145 130 Bond 2 100 120 Bond 3 125 115 Based on this data, the most appropriate conclusion is that:", "opts": ["Bond 1 and Bond 3 are putable.", "Bond 2 is putable and Bond 3 is callable.", "Bond 1 is putable and Bond 2 is callable."], "ans": "B", "expl": "Relationship between Z-spread, OAS, and embedded options\nOAS = Z-spread − Option value\nOAS < Z-spread: Callable bond\nOAS > Z-spread: Putable bond\nWhen the cash flows of a nongovernment bond are discounted using a government bond spot rate curve, the theoretical price is usually higher\nthan the market price. This is due to the spot rates not accounting for the risks of the nongovernment bond (eg, credit risk, liquidity). The Z-\nspread, or zero-volatility spread, is a constant percentage that is added to each spot rate; the combined rate is then used as the discount rate for\neach maturity. This adjustment to each discount rate makes the theoretical price equal to the market price.\nFor callable and putable bonds, the Z-spread includes the value of the embedded option. Subtracting this option value from the Z-spread results\nin a spread that accounts for risks other than the option; this spread is called the option-adjusted spread (OAS).\nAn embedded option affects the yield that an investor receives from owning a bond. A callable bond is disadvantageous to the investor since\nthe issuer can terminate the cash flows before maturity. This means that a portion of the additional yield incorporates the option value.\nSubtracting that option value compensates for the other risks mentioned above. A put option benefits the investor, so the OAS of the bond will be\ngreater than its Z-spread.\nThe type of each bond in this scenario is shown below:\nZero-volatility spread Option-adjusted spread OAS vs. Z-spread Type of bond\nBond 1 145 130 OAS < Z-spread Callable\nBond 2 100 120 OAS > Z-spread Putable\nBond 3 125 115 OAS < Z-spread Callable\n(Choice A) The OAS for both Bond 1 and Bond 3 is less than their respective Z-spreads, so these bonds are callable.\n(Choice C) Bond 2 is putable, not callable, since its OAS is greater than its Z-spread.\nThings to remember:\nA callable bond has an option-adjusted spread (OAS) that is less than the bond's zero-volatility spread (Z-spread). The OAS of a putable bond is\ngreater than its Z-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": null}, {"n": 5, "q": "An analyst gathers the following information: Both bonds pay coupon interest semiannually. The one-year and two-year spot rates are 3.50% and 5.09%, respectively. All rates are stated on a semiannual basis. The G-spread, measured in basis points (bps), between the two-year corporate bond and the two-year government bond is closest to:", "opts": ["552", "934", "968"], "ans": "A", "expl": "A bond with an embedded option trades at a price that reflects both the value of the option and the risk of an otherwise similar bond (ie, same\ncredit quality, coupon rate, maturity) with no embedded option.\nAn embedded call is a disadvantage to a bondholder since the call can be exercised by the issuer when market conditions are favorable. Thus,\nissuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nTo calculate the OAS of a bond, subtract the call option value (in basis points/year) from the Z-spread (eg, 760 − 208 = 552 basis points).\nThings to remember:\nIssuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqAAAADMCAIAAAAj94aaAAAm90lEQVR42u2d4XXiutOHlff8v1+ngjgVLFQQU0GggkAF4ArAFQAVYCqAVICpIE4FcSq4vhXs++F3do6uDA5JNllu8jwf9gSvbMmSrNGMRqOLnz9/OgAAAPha/B9VAAAAgIAHAAAABDwAAAAg4AEAAAABDwAAAAh4AAAABDwAAAAg4AEAAAABDwAAAAh4AAAAQMADAAAg4AEAAAABDwAAAAh4AAAAQMADAADA7+B/r73h4uKCWgMAAPh8fv78+Qp5/arUAAAA4DDRAwAAAAIeAAAAEPAAAACAgAcAAEDAAwAAAAIeAAAAEPAAAACAgAcAAAAEPAAAgCNULQAAfAl6vd7B61EU3d7eOueGw2H7E8qyTNPUObfb7T6z5Mr07u6u0+mcT31ut1vnXKfTieO4+b91XSvB8/Pzjx8/nHP9fv/Ycx4fH51zV1dXShNFEQIeAABOpSiKJEmcc/rXqKpqNBpJFE2n05YnRFEU3Ps5crQsS+fcfD4/n8rM81yVttvtAgFf17WmU1VVaQYwm81MwG82G0upJ+R5rlotyzLLMufcw8PDJ4h5TPQAAABfEA6bAQD4KgP6xYVUyaaaPhgMpOL//fff51bs6+vr1WrVNDz8KRaLhfu1aiANPiiYtPA8z00RlwWi2+366Yui0KLJw8ODlh7qulYarZW0W1McJnoAAHgRCRitGTvnyrJcr9e+PJN5eTqdBmvwdV3rSp7nuiLpNZ/Pbb1cj5XYK8tSlufJZPKiALPyBBJUcvHu7k6FLIpCRvLVanVM1spaHsex7Py2HC7R679s05AePFBvutvtjvk0qNjD4dBs7KoKPfn+/l6FtD+soqIoGo/HVp6PFvCY6AEAABxe9AAA8B+jrmtppaZK1nUtxT1JEinr0oDrui6K4qBnvqm8UpoHg8HT05PUWdn/tTown8/1qCzL5IzW4jp3f39/0PlcZSjLcjKZSNNdLpfKVFbxOI59u8J8PpeKv9/v5ddmj1UZFouFlOndbqfiHePu7u5FxfqYS6Cq1yqwLMvmooPSmP0fDR4AAADQ4AEAvivSaAMtXBrnwYXn1Wrl7wHzb9RKc1mW8ssL1pvTNJUqvFwuD3r2xXEs7X86nR7bD6bsjmnM/X7f/kuqcLfblSo/n89lgZD5wRRl+yPLssAwID++gzvag2Ij4AEA4OyQfAosw3d3d8fiq7TIM8VmSZIkuEu32FyhKAqZwYNZhT+9OOYeb55x7oi1vCnylYvlpfUC/eu8Teo2p/mSktthogcAAHCY6AEA4L+OdOWP3n/lDjmONVVkFeZDVedjtoFjUWPd7zOTyFTgGhHuzOARx/GLaRDwAADw2VxdXblDtm73KwirTOhxHEvgBbMKC9XeIsz0X00p6I7Y9suyDCYTNzc3gZhXgdtd5X/LhOb+/j6YRuh9tdPdOffjxw/zGHD/3jjwOSF9MNEDAAA4TPQAAPAtkHqapql2lksNjaJI7ut5nktlHw6HuiKNfzgc2j54ucK1HGEnRfbx8fGgRT3LMunKSZIoi+12q833cRzrXm0on8/ndpqLStvpdD7OSi8dvdfr he call option value (in basis points/year) from the Z-spread (eg, 760 − 208 = 552 basis points).\nThings to remember:\nIssuers must offer callable bonds with higher yields (implied by the benchmark rate + Z-spread) than the yields required by investors for\ncomparable bonds with no embedded option (implied by the benchmark rate + OAS). The difference between those bonds is the presence of the\noption, and the difference in their spreads is the value of the option (Z-spread − OAS = option value).\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlEAAADKCAIAAAAKIIIgAAAiYElEQVR42u2d23Xazve3h3f9779yBRYVBFdgUUGkChAVYFUAqgCoAFEBuAJwBZYrsFxBlAryXnxW9pqfBDKOD8HO81xkEXk0J41mH2bPqPfr1y8HAADwD/D/6AIAAEDmAQAAIPMAAACQeQAAAMg8AAAAZB4AAAAyDwAAAJkHAACAzAMAAEDmAQAAMg8AAACZBwAAgMwDAABA5gEAACDzAAAA/ir/99Iber0evQYAAGfCi74C2+ObsQAA4PBtAgAAIPMAAACQeQAAAMg8AAAAZB4AAAAyDwAAAJkHAACAzAMAAEDmAQAAMg8AAACZBwAAgMwDAABwX/27CgB/hbIs8zx3zm23W10JwzBNU+fcZDJxzgVBcHpuRVE45x4eHubz+ZtXta5r+zcMw9dnmGWZc+7bt29q7zGGw2H7oiowGo2cc1EUvaY5b9IWAGQeQBdVVWlC15y72Wwk3kwKlmWp66fn+fT0ZDe+Of1+3+rzJnJC9XxWqO/3e0k1X7ZJRZCMX61W3VKzuznIPHD4NgEAALDzAN4GWSp1Xe92O9/cMWtGrr+qqs7EEJEz8K+gPplOp3ZFv8fjsf5Vghd11F9sDgB2HgAAADIP3Ndf2NPanpGmaZqmu91ut9v5y115nud53u/3e71er9fr9/v9ft+CX9yRNbOyLJMkSZKk95vxeFzXddvQyfP84uLi4uKinbkFkmRZlmWZFtKUfztz5e9bVHVdZ1lmmfd6PVmxr2Q+nytaZ71er9drvyGqv9VKlbRa+c0piqKjOf1+308A4PBtAvwBCrvI81zzbxzH379/d85FUSQ51whHNEkzn8/lxLu7u3O//XvKoS1Nlbmy2u12mvSXy6Wu39/f+37UoigkQsIwXC6XzrkkSR4fH5XDfr93zg0GAyWwGJx25rpumSskxzJX6/I8VwzLn0VdCuso1W06naqLZrPZarXy66kGZlmm635zfI9okiT6rxzOao56OIoiol0AOw8AAAA7D+AEG+Xx8dH255kDTRabwjRkVznnFouFjA8zjOyHcmjbeev1Wrc3NjxEUaRI/e12q0wWi4WSWSa6niSJ7KTpdDqbzZy3JU6FDgaDdubOOfOLRlHUzlzXLy4u3PsE2szn88buBe3ikG3XaI4qrGYOBgMZgn5IUa/XO6tgIgBkHnxiySeP33w+l69vv9+be9A5d39/b6t9EjP615/lj23I2+/35oE8mODh4cFfL2xLzY7dgZIf5j49mLkvPBqZB0HwGq/mMW5ubpy3x9E6R7XtKFHybLVaSVQ/PT3pxnfa7Ajg8G0CA .\nThings to remember:\nA yield spread is the difference between a bond's YTM and a benchmark yield. The I-spread is defined as the difference in yields between a bond\nand a swap rate of the same tenor.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAK2CAIAAADIbd5cAACTmUlEQVR42u39T2yk15nnez68lbKkK4wZqWwroUI6GRSs7IJ8sxicsQFjWgIjxga6URLAYNXK0oIRvbgoa3HJWLW9GTIaGFh3FeRGdm86ggu7VmUGAasGGJTBIKwG3LBmGKzsst1pt/hmOqfUlCaVQdfNkVSpGc7iV3zm5PvGP/6PIL+fRYKMDL7xxvvnnPec85znjOzt7RkAAAAADJv/gUMAAAAAgMYMAAAAANCYAQAAAAAaMwAAAABozAAAAAAAjRkAAAAAoDEDAAAAgMYMAAAAANCYAQAAAAAaMwAAAABAYwYAAAAAjRkAAAAAoDEDAAAAADRmAAAAANCYAQAAAIDBcIlDMAiazWar1dLPmUzGzFKpFIcFAAAAMEZmBk2r1Wq1WuVy+fLly5cvX56cnMzt0yv6udlscqy6KJfL5XJ5ZGRkZGQkl8sN+E7qnB7LOznvA37SAQyXRqPRaDRG+kD53OUYhgeKAwIaMwAAAABghJnZQI3JmJn6dXzgJZ1Op9Np/a9ebDQaetv6+rrtx54BAAAAoDFjZxgh482YVCq1urpqZtls1oL5M97aabVapVLJzNSkAQAAx0618N7eXqdae3FxUb/Ozs5yuAAjzAwAAAAAjJEZG6oYs6WlJf91dXU1HJOxIJtZtVo1s42NjYmJCTvgDLzl5WUzq9fr4ev5fH5hYSGMWKvVaisrK3plenrazDQK1Gw2FfNWqVTy+Xy4EZ/1ODc3p/craq5areqdjUZDnVgKk9Pn6v2xb6oBqHK53HM//f3avUajoVRvhULhoMdfn1Uulz3AT5vK5/OVSiVMIuffVDuztrZWq9V0BvVF9P5wJ7XNUqmk737onbRDTbs0s+Xl5Z4H03dSv1arVf1cr9e1w/Pz8/6te550fUQURTqqOkT+cXp/eAT0h6VSSfsZy+C3sLAQu97Ck65DejrHEwC8ovQxGZX8/ZdCXUpmlXj9lMwq+pIls9fXZjY7O6vavNFoaG8XFha8ZNa38MK2S8msT+xZMvv7fbN6gx4kgNM30nZQFSekXq/PzMz4k+6DBw+OceMqucbHx70Y0qfo9SiK9Ovm5qbaKuVyWaVeKpVS2aSSq9Vq6U/U3PJyysw8P4k25UXe5uZmOBco+fRs+5Fy2WxWG5+cnNQWPBW13tlqtWIHx+Pu9BGpVEp/4u0l2w8S6BKMpypBBz+M64s1uvR9w2/qc5liH5rcSY8M1H8ld1If2mUnPZih5zu7nHTtW6eT7nOx/FvoDX78ZX5+Xq217iddx0ef3mq19BHpdDr81ouLi14B66R7azmdTvt+htvMZDLJk67XD3TSAeCInUReWurpX504fdbIXUpm/eqlaJeSOaxGw5JZb/aOHi+Z9YZCoeAlczgv14vQtiVz+M4oipIlszYYm/SbzWa9+g6PAI+XMMLMAAAAAMAIMxsQW1tb9vjAhT0+bttpYZlkNFqSRpltfzBBXSm+5WKx6AM1ekP40ept8nHnYrFoZrVaTePOsSFm2+8uqlar6rnJZDLeBeVj3PpVYXWlUkmb8jEcbTOVSnk/k16/fPmyfmg0GvrWiprzsZH19XXvrPLBkD6Pvw+F+zf1EZtYGIDTsV spread.\nThe benchmark used for fixed-rate bonds in the UK, US, and Japan is the G-spread. The I-spread is used to price Euro-denominated corporate\nbonds. Since the bonds in this scenario are fixed-rate UK-issued bonds, the G-spread is most appropriate, not the I-spread (Choice A).\nThe Z-spread (ie, zero-volatility spread) is the constant yield spread that—when added to the benchmark spot rates (not YTMs as with the G- and\nI-spreads) and used to discount each bond cash flow—equates the present value of the cash flows with the bond's observed price. The Z-spread\nis the same for all times-to-maturity. Therefore, it does not reflect the difference in YTM above the benchmark (and thus the difference in risk)\nassociated with differences in times-to-maturity (ie, the term structure of spreads) (Choice B).\nThings to remember:\nThe G-spread reflects the term structure of spreads (ie, how spreads differ across times-to-maturity) for bonds with the same risk profile and\ndifferent times-to-maturity. The benchmark used for fixed-rate bonds in the UK, US, and Japan is the G-spread.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAK2CAIAAADIbd5cAACTc0lEQVR42u39T2yk15nnez68lbKkK4wZqWwroUI6GRSs7IJ8sxicsQFjWgKDYwPdKAlgsGplacGIXlyUtRgyVtfeXDIaGFh3FeRG5d40gwurVmUGAasGGJTBIKwG3LBmGKxs/+m0W3wznVNqSpPKoGvyyqrUvZzFr/jMyfeNeCP4P4L8fhYJMjL4xhvvn3Pec85znjO0t7dnAAAAADBo/jsOAQAAAAAaMwAAAABAYwYAAAAAaMwAAAAAoDEDAAAAADRmAAAAAIDGDAAAAAAaMwAAAABAYwYAAAAAaMwAAAAAAI0ZAAAAADRmAAAAAIDGDAAAAADQmAEAAABAYwYAAAAA+sMlDkE/aDabrVZLP+dyOTPLZDIcFgAAAMAYmek3rVar1WpVKpXLly9fvnx5fHx8cp9e0c/NZpNjlaJSqVQqlaGhoaGhocnJyT7fSZ3TY3kn573PTzqAwdJoNBqNxlAPKJ9TjmF4oDggoDEDAAAAAEaYmfXVmIyZqV/HB16y2Ww2m9X/6sVGo6G3ra+v237sGQAAAAAaM3aGETLejMlkMqurq2aWz+ctmD/jrZ1Wq1Uul81MTRoAAHDsVAvv7e11qrUXFhb068zMDIcLMMLMAAAAAMAYmbGBijFbXFz0X1dXV8MxGQuymS0vL5vZxsbG2NiYHXAG3tLSkpnV6/Xw9UKhMD8/H0as1Wq1lZUVvTI1NWVmGgVqN 's yield-to-maturity (YTM) describes and quantifies the rate of return that investors demand given its maturity and perceived credit\nquality. YTM is given as a percentage, and is the sum of two components:\nThe benchmark rate, which is also known as the risk-free rate of return; and\nThe spread, which consists of the additional amount of return over the benchmark rate.\nThe benchmark rate applies to government bonds, which are assumed to have no risk of default and are therefore referred to as risk-free bonds.\nThe benchmark rate incorporates macroeconomic factors such as a government's fiscal and monetary policies, expected inflation, and exchange\nrates for the issuer's currency (Choices B and C).\nThe spread captures the impact of factors that are specific to the nongovernment issuer as well as the bond itself. These include the issuer's\ncredit risk, both in absolute terms and relative to that of other issuers; liquidity of the bond; and whether the bondholder is subject to income tax on\nthe coupon interest. All these factors are expressed as an additional percentage that compensates investors for the additional risks. A risky\nbond's YTM is the sum of the benchmark rate and the spread.\nThings to remember:\nYield-to-maturity is the sum of the benchmark (ie, risk-free) rate plus the spread, which is the additional percentage required to compensate a\nbondholder for investing in a nongovernment bond. The benchmark rate incorporates macroeconomic factors, whereas the spread captures\nfactors that apply to a risky bond and/or its issuer.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmAAAAEJCAIAAAC8GgyIAAAqN0lEQVR42u2d7XWrPNNGlXc9DeAScAm4BFwCLsGUgEswJZgSQgmmBFNCKCGUkPfHte5ZOsJg/JHESfb+cZYPASFphEYzGkkvHx8fDgAAAP7l/6gCAAAAFCQAAAAKEgAAAAUJAACAggQAAEBBAgAAoCABAABQkAAAAChIAAAAFCQAAAAKEgAAAAUJAACAggQAAEBBAgAAAAoSAAAABQkAAICCBAAAQEECAACgIAEAAFCQAAAAKEg the issuer's currency (Choices B and C).\nThe spread captures the impact of factors that are specific to the nongovernment issuer as well as the bond itself. These include the issuer's\ncredit risk, both in absolute terms and relative to that of other issuers; liquidity of the bond; and whether the bondholder is subject to income tax on\nthe coupon interest. All these factors are expressed as an additional percentage that compensates investors for the additional risks. A risky\nbond's YTM is the sum of the benchmark rate and the spread.\nThings to remember:\nYield-to-maturity is the sum of the benchmark (ie, risk-free) rate plus the spread, which is the additional percentage required to compensate a\nbondholder for investing in a nongovernment bond. The benchmark rate incorporates macroeconomic factors, whereas the spread captures\nfactors that apply to a risky bond and/or its issuer.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5oAAAIECAIAAAD3jMZbAABwBElEQVR42u3dT2wj6Xnv+0czPW37pjNiw3EaFwFG1DI2PF3aXRx4ouIqJ7ANUaucYzsQuXESO4DEhe04WZBc+E8yC0lA7CTekMKxfZO7EQXbOOeuRGWMnAPYgEozuCdnp5LhIOjgBF0y+l7P9EyP7uLnfs7bVSRFSZRaf76fxUDDJqveeqvq5cvnfd63po6OjgwAAAC4ml6gCgAAAEB3FgAAAKA7CwAAANCdBQAAAN1ZAAAAgO4sAAAAQHcWAAAAoDsLAAAAurMAAAAA3VkAAACA7iwAAADozgIAAAB0ZwEAAAC6swAAAADdWQAAANCdBQAAAOjOAgAAAHRnAQAAALqzAAAAoDsLAAAA0J0FAAAA6M4CAACA7iwAAABAdxYAAACgOwsAAADQnQUAAADdWQAAAIDuLAAAAEB3FgAAAKA7CwAAgCvuFlWAK63b7e7s7JhZmqZ6JYqihYUFM4vjmPq5WrIsM7NSqXSpStXr9cxsY2MjLN7CwkKtVpvgZWxmBwcH+t9ms3nqTbXbbf0xMzNjZuMUst/vm5nuIzNbWloys3K5fPazedlO5cVfzxdTA37Sdd6HnfTLeX8BRnQWAAAAN9zU0dERtYCrJUkSM6vX6/73QHEcb25uGtGIS0/RwXq93ul0LltYvdfrLS4uFl9fWVlZXV2d1F4qlYrXg5mdpVmempry69/Mtre3bbzYXqvV0v/qI6c7C4r/aYNJkoyzd7uOIwwXXAN+0nXicjvt9/tqLS/h/QUYyQa4mdI01Xe/vja8dY7jWK90u1390e/31RG5gd+pV8ja2lqj0bi0xVtfX/e/1X+Nomjiv5G0zWtgdnbW782b2W16LjUQ7ii8ltbW1szsMt9fgJFsAAAAABCdxRXTaDQ8LmtmnU4nN++h2WwqfJskiUZv  from a bond's Z-spread.\nThe Z-spread is the constant spread to a benchmark (ie, government or swap) curve that results in a series of periodic discount rates that equate\nthe present value of a bond's cash flows to its market price. Discount rates based on a Z-spread capture all risks affecting price, including any\nembedded options. An option pricing model estimates how much narrower the Z-spread would be for an equivalent noncallable bond. The\ncallable bond's OAS is used to calculate an option-adjusted price and yield, allowing better comparisons with other securities.\n(Choices A and C) The G- and I-spreads are based on the difference between a bond's YTM and a benchmark rate of the same maturity (eg, 5-\nyear corporate bond versus a 5-year government bond or swap). Since these spreads are computed separately for each maturity, they widen as\nmaturities increase, reflecting the greater relative risk of corporate securities for longer time horizons.\nThings to remember:\nA callable bond's option-adjusted spread (OAS) is calculated by subtracting the value of the embedded option (in basis points per year) from the\nbond's Z-spread. The OAS is used to estimate the bond's option-adjusted price and yield to facilitate comparisons with other bonds.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAAHMCAIAAAA/BlJnAABYKElEQVR42u3dbXCU55X/+Z8MRtgIulE2PHiMaAaIk0pAzQRPsgFHrbgq3hjHtHDVVgayluQql8dUrSUR73/xG4S8L8zmn7Ek/6sgLldFkisws1VrEI5xKqklatmQimM8akFcHgwMDTgYSI2QABmBwdoXB12+uftBLaFnfT8vKNHqh7tvtVqnzznXuXJ6e3sFAACAO3YXpwAAAIC4CgAAgLgKAACAuAoAAADEVQAAAMRVAAAAxFUAAADEVQAAACCuAgAAIK4CAAAgrgIAACCuAgAAAHEVAAAAcRUAAABxFQAAAIirAAAAiKsAAACIqwAAAIirAAAAQFwFAABAXAUAAEBcBQAAQFwFAAAA4ioAAADiKgAAAOIqAAAAEFcBAAAQVwEAABBXAQAATHBTOQUYEvF4XFJnZ6f9NxwOSwoGg5wZAKP7/pBIJNy/kkKhkPsXIK7C2LJ161ZJ9fX17h3TKxwOV1dXS4pGo0P+0I2NjfYQ9h7tDqampsb+29LSEolEJvyPoLi4OBaL2de9vb3pToWkUTkbn erived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqoAAADKCAIAAADijPVOAAAml0lEQVR42u2dXVIbydKGE2OYGeMJtx0n5lxMOGgifG+xAqQVIFYgaQWyViC0AkkbsMQKECtArABxcybmCnkBtpvjiBMzYzDfxfs5o9wtCUmALeB5LgipadVfV1dWZmVlLV1eXhoAAAA8JB7RBAAAAIh/AAAAQPwDAAAA4h8AAAAQ/wAAAID4BwAAAMQ/AAAAIP4BAAAA8Q8AAACIfwAAAED8AwAAAOIfAAAA5uLx3L/krCAAAIAFYWlp6XbFv0v9y8tLfQ6v8AAAAAC+g7B3eZ8S/FPOAzD+AwAAGMb/K/T+y8vLL1++mNnFxcXFxYU+6Ir+YgYAAAC4VfP+o0ePHj16ZGbLy8vLy8v6oCtTGgAeTy/7JdQvLi4+f/5sZp8/f/7777/N7J9//jk/P9e/kP0AAAC3PQlYXl5+/Pixma2urq6u ent bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgQAAADcCAIAAACAki6qAAAgjElEQVR42u2d23XiSNeGy//67oeOwHIEliOwFIEhAlAERhGAIgBFAESAiAA5AuMILEdgTQTzX7yr96qWAIPdPuHnuZjlUQupVKd9rKqz//77zwEAwM/m/6gCAABAGAAAAMIAAAAQBgAAgDAAAACEAQAAIAwAAABhAAAACAMAAEAYAAAAwgAAABAGAACAMAAAAIQBAAAgDAAAAGEAAAAN/nfsD87Ozqg1AICvz1Fnl2EZAACAO+PYSwAAwDIAAACEAQAAIAwAAABhAAAACAMAAEAYAAAAwgAAABAGAACAMAAAAIQBAAAgDAAAwL1h11IA+LtsNhvnXJqmW//15uZmMBg45zqdzgcXLI7jyWTinAvDcOsNaZpWVeWcm81mjeKVZZllmXOu3+875/QJ743qUPXpEwSBihFF0cc3rkq1Xq93FXhXHTrn6rp2ziVJoq9Qc2AZAAAAlgHAiS 0 Explanation HP 12c TI BA II Plus A bond's no-arbitrage (ie, arbitrage-free) value is calculated by discounting each cash flow by the spot rate corresponding to when that cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAK2CAIAAADIbd5cAACTmUlEQVR42u39T2yk15nnez68lbKkK4wZqWwroUI6GRSs7IJ8sxicsQFjWgIjxga6URLAYNXK0oIRvbgoa3HJWLW9GTIaGFh3FeRGdm86ggu7VmUGAasGGJTBIKwG3LBmGKzsst1pt/hmOqfUlCaVQdfNkVSpGc7iV3zm5PvGP/6PIL+fRYKMDL7xxvvnnPec85znjOzt7RkAAAAADJv/gUMAAA , as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdQAAACrCAIAAABQRvqbAAAcgElEQVR42u2d7XWrvNKGlbPe/5ungpAKgiswVGBcQaACmwpsKsBUYFyBSQUmFZhUEFKBSQV5f9znmaUjPoztOF/7vn7s5U1ASCMxmhmN4Ob9/V0RQgj5XP5DERBCCJUvIYRQ+RJCCKHyJYQQKl9CCCFUvoQQQuVLCCGEypcQQqh8CSGEUPkSQgiVLyGEUPkSQgih8iWEECpfQgghVL6EEPLT+L9TL7i5uaHUCCGkyUmvR7/hy9QJIUQx7EAIIVS+hBBCqHwJIYTKlxBCCJUvIYRQ+RJCCKHyJYQQKl9CCCFUvoQQQuVLCCFUvoQQQqh8CSGEypcQQoj6zFdK/gKyLFNKPT4+1nWtlLIsSyk1mUyCIDi1qKqqlFKbzWaxWFyptnolL6QoCtS5v6VZlr2+vhoHb29vlVK+739UZS7pPtu2lVKu637b0WXb9qnVaxW7UurPnz8QO1r95aNIWK1WSqkgCFBsVVWbzUaGSnOMYfg1O66uawhtPp/T8iWEEHJd/rr3+YZhiGk2CAKYErBe8zx3HEcptdvtTrUlPc+7khjjOMaPD7GsUVpRFP1t9DyvLEulFAQCcATs9/tLrLAL8TwPptP1vI0Lqwfj7tTqtYodkofdul6vz3DO8jyHc6aU2m63H2j2Pj8/o1ao3t3dHaqHh8J13SRJdLv77u5uv9+3mvBhGCql7u/v/yrjl5YvIYQoxnyvCCzcLMswIRtz7GQymU6nsBQQYvsOFEXxJZHNphMgxgss6PV6zYfnE8SuG4ZhGJ4R7IZ9iu5TH7cIEccxzFgJcwdBgCdLhopYvmmaKqV83+9ymOAljEYj2M5fu6hA5Xst5du1cOH7/nK5NDoel6RpCn8Qf5rNZkdHv7Gm57rubDZrjqqqqhAKqKrKKBwlVFUFJ+729lZcTikcAx3nz2Yzo/CyLDHo0YoLlTgKh3YQSertlfq0tldWyWRZBn96eHgwprq6rlFtWZ95eHhoXcDJsqyrKFlaxE1RoDzktm1HUYQTRHp6bWUJCI3CJThHY eglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAs8AAADMCAIAAAADG9lnAAAhhUlEQVR42u2dv5LbRtLAm19d7gVfYGXsA0guMj9fFTe2EjK1LgFTX0SGConofCGRnJQSiS8mquzLiSrfAyxq9QKE9QT7BV3qGg/+8P+K5P5+gUpLgsBgpmemp7unp/P09CQAAAAAJ+P/qAIAAABA2wAAAAC0DQAAAAC0DQAAAEDbAAAAALQNAAAAALQNAAAAQNsAAAAAtA0AAAAAtA0AAABA2wAAAABA2wAAAAC0DQAAAEDbAAAAAEDbAAAAALQNAAAAQNuoJ03T0Wg0Go06f2Y0GmVZlmUZtWyUZRnHcRzH3ufj8djq7QyLfXd3p2W7u7u7xGqP49iq90QymSTJsR6xnzDYT+7v7+/v708kvWVZusVTqvJ8DjRVSEv1pmmapqlJe6fT6Xa73W5XRPI8z/Ncb+W+u35+BUPTdDqdTqcXV+wkSY7Y9drRmzeJvYnNIb2vKIqiKFp6lvbB6ufPVgmH8JdDfjwej/U9m7SQNE1FZDabTSaTF65naPOPx+MwDEWECoFLVNpa+vsVrARGo1H7WHcdioU3venb6QA1m82Q8zOfQUQkDMNLnEHwpAAAAICcqW1jOp1uucqZTqe9Xk9EBoPBC18XFkWhtg2P+Xw+n88Rx8sliqIoiuTa/YDun+v1OgiCi3uLpr7mvp0uHN2Fvvttr9dbrVbX0aZqfr5cf7d2unPoeg8PD4ffRGeHp6enlhnELru88edpdx4eHryanc1ms9nMu8DVLYbD4XA4rN5Kf+iOWYPBYDAYLJfL5XJZvd6t3MVisVgser2eqjI2THg3t69Wq9VqtXLvpnfwhiH7drlceje3snmlcgcvvUkYhioQ+pOWrqJ3cAXFLcByufTurNWlNab/ccvsslqtvKdPJpPJZFK958YWN+EOw1BL1VLt1WKsVqvhcOi9uyswLlbgMAxrfzscDlXAqr/VBnW74uwL9kmTaFWbUkQWi0X1Gqt/V6rdH1YfofVsP7TWr32RWmFQ1uu1N6xoE7uTn35S7Whe/QdB4HXbdrYfQ1wRtSLVVrs7jGhhrPX1Duv1ur1UtRWiYtNUIdXq9SSkOrI1vbh7W21KT1bDMKx2MU/dsRGjes/avtZUmVuOFW5hmoamMAxb6rx2XHIN+1rglo6mA9HGAaE6y9iAZuLhVWb1oS3jT5Pw60+8wdNmnKYC17agSel6va6+8nA49Arsza32iI0zSHsl6AXV8UeHoKZ5+cARowqeFAAAADg/24an+LQsjnWJP5vNatdwGx0r1Tt7FqcWm7ZplN7K3ltEugsdvb hat cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmAAAAEJCAIAAAC8GgyIAAAqNklEQVR42u2d7XmjvhOulXP9G8Al4BJwCbgEXIIpAZdgSjAlmBJMCaaEUEIoYc+H5/zmaIXB+CWJk73vD3t5CQhJIzSa0Uh6+/PnjwMAAIC/+T9UAQAAAAoSAAAABQkAAICCBAAAQEECAACgIAEAAFCQAAAAKEgAAAAUJAAAAAoSAAAABQkAAICCBAAAQEECAACgIAEAAAAFCQAAgIIEAABAQQIAAKAgAQAAUJAAAAAoSAAAABQkAAAAChIAAAAFCQAAgIIEAABAQQIAAKAgAQAAUJAAAAAoSAAAAEBBAgAAoCABAABQkD+XpmneZrNer9frNZV2Nz+0Jm/Kdp7neZ7bI13XdV33cz+KsizLsvzGzCyXS6t8viAUJAAAAAoSAAAA const CFG = {"title": "Wiley · Yield and Yield Spread Measures for Fixed-Rate Bonds", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 18 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
