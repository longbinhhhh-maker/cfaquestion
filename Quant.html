ng bình hình học của lợi nhuận trong thời gian nắm giữ, trong đó\\(R=\\dfrac{(P_1-P_0)+I}{P_0}\\):</p><div class=\"kd\">$$HPR_1=\\dfrac{(110-100)+10}{100}=0.20=20\\%$$</div><div class=\"kd\">$$HPR_2=\\dfrac{(230-220)+0}{220}=0.04545\\approx4.5\\%,\\quad\\text{where }220=110\\times2$$</div><div class=\"kd\">$$\\left[(1+HPR_1)(1+HPR_2)\\right]^{0.5}-1=\\left[(1.20)(1.04545)\\right]^{0.5}-1=0.12006\\approx12.0\\%$$</div><p><b>C. Không chính xác. </b>Điều này chỉ đơn giản là lấy trung bình số học của hai lợi nhuận trong thời gian nắm giữ:\\((20\\%+4.545\\%)/2=12.273\\%\\approx12.3\\%\\).</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận chính và mô tả cách sử dụng thích hợp của chúng</span>"},{"n":38,"q":"Ranked in ascending order, the 19th observation in a sample of 75 is in the second:","opts":["decile","quintile.","quartile."],"ans":"B","expl":"A. Không chính xác vì thập phân vị thứ hai bao gồm các quan sát nằm trên phân vị thứ 10\nvà bằng hoặc dưới phân vị thứ 20. Quan sát thứ 19 nằm trong nhóm thứ hai\ntrong số mười quan sát, nhưng nó không nằm trong thập phân vị thứ hai vì chỉ có 75 quan sát\ntrong mẫu.\nB. Đúng vì quan sát thứ 19 nằm ở phân vị thứ 25\n𝑦\nL = (1 + 𝑛)( )\ny\n100\n𝑦 19×100\n19 = (1 + 75)( ); y = ( ) = 25.0\n100 1 + 75\n,nằm trong nhóm thứ hai. Nhóm thứ hai bao gồm các quan sát ở trên\nphân vị thứ 20 và bằng hoặc dưới phân vị thứ 40.\nC. Không chính xác vì tứ phân vị thứ hai bao gồm các quan sát nằm trên phân vị thứ 25\nvà bằng hoặc dưới phân vị thứ 50. Vì quan sát thứ 19 nằm ở phân vị thứ 25\nnên nằm trong tứ phân vị đầu tiên.\nPhương pháp định lượng: tính toán, giải thích và đánh giá các thước đo về xu hướng trung tâm và\nvị trí để giải quyết vấn đề đầu tư","qhtml":null,"explhtml":"<p><b>A. Không chính xác. </b>Thập phân vị thứ hai bao gồm các quan sát trên phân vị thứ 10 và bằng hoặc dưới phân vị thứ 20. Quan sát thứ 19 rơi vào nhóm thứ hai trong số mười, nhưng nó không nằm trong thập phân vị thứ hai vì chỉ có 75 quan sát trong mẫu.</p><p><b>B. Đúng. </b>Quan sát thứ 19 nằm ở phân vị thứ 25. Sử dụng công thức vị trí\\(L=(1+n)\\dfrac{y}{100}\\):</p><div class=\"kd\">$$19=(1+75)\\dfrac{y}{100}\\ \\Rightarrow\\ y=\\dfrac{19\\times100}{1+75}=25.0$$</div><p>Phân vị thứ 25 nằm trong nhóm thứ hai, bao gồm các quan sát trên phân vị thứ 20 và bằng hoặc dưới phân vị thứ 40.</p><p><b>C. Không chính xác. </b>Tứ phân vị thứ hai bao gồm các quan sát trên phân vị thứ 25 và bằng hoặc dưới phân vị thứ 50. Bởi vì quan sát thứ 19 nằm ở phân vị thứ 25 nên nó nằm trong tứ phân vị đầu tiên.</p><span class=\"los\">Phương pháp định lượng: tính toán, giải thích và đánh giá các thước đo về xu hướng và vị trí trung tâm để giải quyết vấn đề đầu tư</span>"},{"n":39,"q":"For a given dataset with different non-negative observations, which of the following\nwill have the largest value?","opts":["Harmonic mean","Arithmetic mean","Geometric mean"],"ans":"B","expl":"A. Không chính xác vì đối với một tập dữ liệu nhất định có các quan sát khác nhau, giá trị trung bình điều hòa có\ngiá trị nhỏ nhất trong số các phương tiện điều hòa, hình học và số học. Trừ khi tất cả\nquan sát trong một tập dữ liệu có cùng giá trị, thì trung bình điều hòa sẽ nhỏ hơn\ntrung bình hình học, do đó, nhỏ hơn trung bình số học.\nB. Đúng vì trung bình số học của một tập dữ liệu nhất định với các quan sát khác nhau\ncao hơn trung bình số học và trung bình hình học. Trừ khi tất cả các quan sát trong tập dữ liệu\ncó cùng giá trị, thì trung bình điều hòa sẽ nhỏ hơn trung bình hình học, do đó,\nnhỏ hơn trung bình số học\nC. Không chính xác vì đối với một tập dữ liệu nhất định có các quan sát khác nhau, trung bình hình học\nlớn hơn trung bình điều hòa nhưng nhỏ hơn trung bình số học. Trừ khi tất cả\nquan sát trong một tập dữ liệu có cùng giá trị, thì trung bình điều hòa sẽ nhỏ hơn\ntrung bình hình học, do đó, nhỏ hơn trung bình số học.\nPhương pháp định lượng: tính toán và giải thích các phương pháp khác nhau để trả về phép đo\ntheo thời gian và mô tả cách sử dụng thích hợp của chúng","qhtml":null},{"n":40,"q":"Sampling error is the difference between the observed value of a:","opts":["random variable and the respective statistic.","random variable and its hypothesized value.","statistic and the quantity it is intended to estimate."],"ans":"C","expl":"A. Không chính xác vì lỗi lấy mẫu là sự chênh lệch giữa giá trị quan sát được của thống kê a\n và số lượng mà nó dự định ước tính.\nB. Không chính xác vì lỗi lấy mẫu là sự chênh lệch giữa giá trị quan sát được của thống kê a\n và số lượng mà nó dự định ước tính.\nC. Đúng vì lỗi lấy mẫu là sự chênh lệch giữa giá trị quan sát được của một\nthống kê và số lượng mà nó dự định ước tính.\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự tiện lợi và lấy mẫu mang tính phán đoán cũng như những tác động của chúng đối với lỗi lấy mẫu trong một\nvấn đề đầu tư","qhtml":null},{"n":41,"q":"The central limit theorem:","opts":["requires that the population be approximately normally distributed.","implies that the sample mean is a consistent estimator of the population mean.","states that the product of independent random variables is normally distributed."],"ans":"B","expl":"A. Không chính xác vì định lý giới hạn trung tâm cho phép chúng ta đưa ra các tuyên bố xác suất khá chính xác\nvề trung bình tổng thể bằng cách sử dụng trung bình mẫu, bất kể\nphân bố của tổng thể như thế nào (miễn là nó có phương sai hữu hạn), bởi vì trung bình mẫu\ntuân theo phân phối chuẩn gần đúng cho các mẫu có kích thước lớn. Do đó, việc có một\ntập hợp phân bố chuẩn không phải là yêu cầu bắt buộc để định lý giới hạn trung tâm được duy trì.\nB. Đúng vì định lý giới hạn trung tâm phát biểu rằng phương sai của phân bố\ntrung bình mẫu là σ²/n. Căn bậc hai dương của phương sai là độ lệch chuẩn.\nđộ lệch chuẩn của một thống kê mẫu được gọi là sai số chuẩn của thống kê.\ntrung bình mẫu, ngoài vai trò là một công cụ ước tính hiệu quả, còn là một công cụ ước tính nhất quán của\ntrung bình tổng thể: Khi cỡ mẫu n tiến đến vô cùng, sai số chuẩn của nó, olin, sẽ bằng 0 và\nphân bố lấy mẫu của nó trở nên tập trung ngay trên giá trị trung bình tổng thể, μ.\nC. Không chính xác vì định lý giới hạn trung tâm cho biết rằng tổng (và trung bình) [không phải\ntích] của một số lượng lớn các biến ngẫu nhiên độc lập gần như được phân phối\nthông thường.\nPhương pháp định lượng: giải thích định lý giới hạn trung tâm và tầm quan trọng của nó đối với\nphân phối và sai số chuẩn của trung bình mẫu","qhtml":null},{"n":42,"q":"An analyst assumes that a company's future EPS will be either $2.00, $2.20, or $2.40.\nIf each scenario is equally likely, the variance [in $] of the company's future EPS is closest\nto:","opts":["0.03","0.16.","0.20"],"ans":"A","expl":"A. Đúng vì phương sai của một biến ngẫu nhiên là giá trị kỳ vọng (xác suất -\ntrung bình có trọng số) của độ lệch bình phương so với giá trị kỳ vọng của biến ngẫu nhiên: o²(X) =\nE[X - E(X)]. Vì mỗi kịch bản đều có khả năng xảy ra như nhau (xác suất = 1/3), E(X) = (2.0 + 2.2 + 2.4)/3 =\n2.2, nên σ²(X) = [(2.0 - 2.2)² + (2.2 - 2.2)² + (2.4 - 2.2)2]/3 = [0,04 + 0,04]/3 = 0,08/3 = 0,0267 ~\n0,03 [bằng $2]\nB. Không chính xác vì đây là độ lệch chuẩn chứ không phải phương sai. Phương sai của biến\nngẫu nhiên là giá trị kỳ vọng (xác suất - trung bình có trọng số) của độ lệch bình phương\nso với giá trị kỳ vọng của biến ngẫu nhiên: σ2(X) = E[X - E(X)]2. Vì mỗi kịch bản\ncó khả năng xảy ra như nhau (xác suất = 1/3), E(X) = (2.0 + 2.2 + 2.4)/3 = 2.2, nên σ 2(X)= [(2.0 - 2.2)2 + (2.2\n- 2.2)2 + (2.4 - 2.2)2]/3 = [0,04 + 0,04]/3 = 0,08/3 = 0,0267 [bằng $2]. Độ lệch chuẩn là\ncăn bậc hai dương của phương sai. Do đó, σ(X) = (0,0267)0,5= 0,1633 0,16 [trong $]\nC. Không chính xác vì đây là sự khác biệt giữa mỗi cặp giá trị EPS, không phải phương sai:\n$2,40 - $2,20 =$2,20 - $2,00 = $0,20.\nPhương pháp định lượng: tính toán các giá trị dự kiến, phương sai và độ lệch chuẩn và\nthể hiện ứng dụng của chúng đối với đầu tư","qhtml":null},{"n":43,"q":"An analyst observes the following EPS for four companies: -£0.50, £0.50, £2.50, and\n£5.50. The 50th percentile of the EPS values is closest to","opts":["£1.50.","£2.00.","£2.50."],"ans":"A","expl":"A. Đúng vì phân vị thứ 50 là trung vị, là mức trung bình của hai\nmục ở giữa. (0,50 bảng Anh + 2,50 bảng Anh)/2 = 1,50 bảng Anh. Trong một mẫu được đánh số lẻ gồm n mục, trung vị\n chiếm vị trí (n + 1)/2. Trong mẫu được đánh số chẵn, chúng tôi xác định\ntrung vị là giá trị trung bình của các giá trị của các mục chiếm vị trí n/2 và (n + 2)/2 (\nhai mục ở giữa). Tính toán trung vị cũng có thể phức tạp hơn, để làm như vậy, chúng ta cần\nsắp xếp các quan sát từ nhỏ nhất đến lớn nhất, xác định xem cỡ mẫu là chẵn\nhay lẻ và trên cơ sở đó, áp dụng một trong hai phép tính. Ngoài ra, phân vị thứ 50\nkhi Ly, không phải là số nguyên hoặc số nguyên, Ly, nằm giữa hai số nguyên gần nhất\n(một ở trên và một ở dưới) và chúng tôi sử dụng phép nội suy tuyến tính giữa hai vị trí đó để\nxác định P. Nghĩa là, L, = (n + 1)(y/100) = (4 + 1)(50/100) = 2.5. Do đó, 2 là số nguyên\ngần nhất bên dưới vị trí được tính toán và 3 là số nguyên gần nhất phía trên vị trí\nđược tính toán. Sử dụng Nội suy tuyến tính, P0 = £0,50 + (£2,50 - £0,50) x (2,5 - 2) = £1,50,\nB. Không chính xác vì đó là vị trí của dải phân cách; n/2 = 4/2. Ngoài ra, đó cũng là EPS trung bình\n; ( - £0,50 + £0,50 + £2,50 + £5,50)/4= £2,00.\nC. Không chính xác vì đó là vị trí (hoặc vị trí) của phân vị thứ 50 thay vì phân vị thứ 50\n: (4 + 1) x 50/100 = 2,5. Công thức cho vị trí (hoặc vị trí) của phần trăm trong\nmột mảng có n mục được sắp xếp theo thứ tự tăng dần là L, = (n + 1)(y/100) trong đó y là\nđiểm phần trăm mà tại đó chúng ta đang chia phân phối và L, là vị trí (L) của\nphần trăm (P) trong mảng được sắp xếp theo thứ tự tăng dần. Giá trị của L, có thể hoặc không thể là một\nsố nguyên. Khi L, không phải là số nguyên hoặc số nguyên, L, nằm giữa hai số nguyên\ngần nhất (một ở trên và một ở dưới) và chúng tôi sử dụng phép nội suy tuyến tính giữa\nhai vị trí đó để xác định Py\nPhương pháp định lượng: tính toán, diễn giải và đánh giá các thước đo về xu hướng trung tâm và\nvị trí để giải quyết vấn đề đầu tư","qhtml":null},{"n":44,"q":"The standard error of the estimate in a simple linear regression is best described as:","opts":["a relative measure of fit for the regression.","the percentage of the variation of the dependent variable that is explained by the independent variable.","a measure of the distance between the observed values of the dependent variable and those predicted from the estimated regression."],"ans":"C","expl":"A. Không chính xác vì không giống như hệ số xác định và thống kê F - là những thước đo tương đối phù hợp\n, sai số chuẩn của ước tính là thước đo tuyệt đối của\nkhoảng cách của biến phụ thuộc được quan sát với đường hồi quy.\nB. Không chính xác vì đây là hệ số xác định chứ không phải sai số chuẩn của\nước tính. Hệ số xác định, còn được gọi là R - bình phương hoặc R², là\nphần trăm biến thể của biến phụ thuộc được giải thích bằng biến\nđộc lập.\nC. Đúng vì sai số chuẩn của ước tính là thước đo khoảng cách giữa\ngiá trị quan sát được của biến phụ thuộc và giá trị dự đoán từ\nhồi quy ước tính.\nPhương pháp định lượng: mô tả việc sử dụng phân tích phương sai (ANOVA) trong phân tích hồi quy\n, diễn giải kết quả ANOVA cũng như tính toán và diễn giải sai số chuẩn của ước tính\ntrong một tuyến tính đơn giản hồi quy","qhtml":null},{"n":45,"q":"An analyst gathers the following information about a portfolio's returns:\nYear | Return (%)\n1 — 6%\n2 — 7%\n3 — 3%\n4 — 2%\n5 — 4%\nIf the target return is 5%, the target downside deviation is closest to:","opts":["1.7%.","1.9%.","2.2%."],"ans":"B","expl":"A. Không chính xác vì n (5) được sử dụng trong phép tính thay vì n - 1: (14/5)0,5, dẫn đến\n1,67% ~1,7%.\nB. Đúng vì công thức tính độ lệch giảm mục tiêu là [E(X, - B)/(n - 1)]0,5, trong đó X,\nlà lợi nhuận trong kỳ, B là lợi nhuận mục tiêu và n là tổng số quan sát mẫu\n. Ngoài ra, tổng kết chỉ được lấy từ những quan sát (X)\nnhỏ hơn hoặc bằng mục tiêu B.\nTỷ suất lợi nhuận năm (%) Độ lệch so với mục tiêu Độ lệch bình phương\n1 6 0 0\n2 7 0 0\n3 3 - 2 4\n4 2 - 3 9\n5 4 - 1 1\nVì tổng độ lệch bình phương là 14 nên độ lệch nhược điểm mục tiêu = [14/(5 - 1)]0,5,\ndẫn đến 1,87% ~ 1,9%.\nC. Không chính xác vì tất cả kết quả trả về đều được sử dụng trong phép tính chứ không chỉ kết quả trả về bên dưới\nmục tiêu. Nói cách khác, độ lệch chuẩn so với lợi nhuận mục tiêu được tính toán. Vì\ntổng của tất cả các độ lệch bình phương là 14 + 5= 19, nên độ lệch giảm mục tiêu được tính\nlà: [19/(5 - 1)]0,5 dẫn đến 2,18% ~ 2,2%.\nCâu trả lời này cũng gần nhất nếu n được giả định là số lượng quan sát được sử dụng trong\nphép tính đúng (3): (14/3)0,5, dẫn đến 2,16% ~ 2,2%.\nPhương pháp định lượng: tính toán, giải thích và đánh giá các biện pháp phân tán để giải quyết\nvấn đề đầu tư","qhtml":"<p>An analyst gathers the following information about a portfolio&#x27;s returns:</p><table class=qt><thead><tr><th>Year</th><th>Return (%)</th></tr></thead><tbody><tr><td>1</td><td>6%</td></tr><tr><td>2</td><td>7%</td></tr><tr><td>3</td><td>3%</td></tr><tr><td>4</td><td>2%</td></tr><tr><td>5</td><td>4%</td></tr></tbody></table><p>If the target return is 5%, the target downside deviation is closest to:</p>"},{"n":46,"q":"Which of the following measures best quantifies the amount of risk per unit of mean\nreturn?","opts":["Sharpe ratio","Standard deviation","Coefficient of variation"],"ans":"C","expl":"A. Không chính xác vì tỷ lệ Sharpe là lợi nhuận trung bình vượt quá rủi ro - lãi suất phi rủi ro\nchia cho độ lệch chuẩn của lợi nhuận. Tỷ lệ này đo lường phần lợi nhuận vượt trội kiếm được\ntrên mỗi đơn vị độ lệch chuẩn của lợi nhuận. Do đó, tỷ lệ Sharpe không định lượng\nmức độ rủi ro trên mỗi đơn vị lợi nhuận trung bình.\nB. Không chính xác vì độ lệch chuẩn đo lường rủi ro, nhưng nó không lượng hóa\nmức độ rủi ro trên mỗi đơn vị lợi nhuận trung bình. Phương sai được định nghĩa là mức trung bình của độ lệch bình phương\nxung quanh giá trị trung bình. Độ lệch chuẩn là căn bậc hai dương của phương sai.\nC. Đúng vì hệ số biến thiên, CV, là tỷ lệ độ lệch chuẩn của một\ntập hợp các quan sát với giá trị trung bình của chúng. Ví dụ: khi các quan sát mang lại lợi nhuận,\nhệ số biến thiên đo lường mức độ rủi ro (độ lệch chuẩn) trên mỗi đơn vị\nlợi nhuận trung bình.\nPhương pháp định lượng: tính toán, diễn giải và đánh giá các biện pháp phân tán để giải quyết\nvấn đề đầu tư","qhtml":null},{"n":47,"q":"An analyst gathers the following returns for seven funds:\n12% 7% 5% 4% 8% 3% 3%\nThe second quartile return is","opts":["4%","5%.","6%,"],"ans":"B","expl":"A. Không chính xác vì nó nhầm lẫn vị trí của tứ phân vị thứ hai, được tính là L,\n= (7 + 1) x 50/100 = 4, với giá trị của tứ phân vị thứ hai, là lợi nhuận của quỹ\nthứ 4 sau khi đặt lợi nhuận của quỹ theo thứ tự tăng dần. 4% cũng tương ứng với lợi nhuận\ncủa quỹ thứ 4 (quỹ giữa) khi mảng chưa được sắp xếp theo thứ tự tăng dần,\nmà ứng viên có thể hiểu là phân vị thứ 50 (trung vị).\nB. Đúng vì công thức cho vị trí của phần trăm trong một mảng có n mục\nđược sắp xếp theo thứ tự tăng dần là L = (n + 1) x Y/100, trong đó y là điểm phần trăm mà tại đó chúng tôi\nđang chia phân phối và L, là vị trí (L) của phân vị (P) trong mảng được sắp xếp\ntheo thứ tự tăng dần với bảy mục nhập, vị trí của phần tư thứ hai, hoặc Phần trăm\nthứ 50 là: L= (7 + 1) x 50/100 = 4 Khi đặt lợi nhuận của quỹ theo thứ tự tăng dần\n(3%, 3%, 4%, 5% 7%, 8%; 12%), lợi nhuận của quỹ thứ 4 là 5%\nNgoài ra, ứng viên có thể nhận ra rằng quỹ thứ 4 là 5%\n phần tư hoặc phần trăm thứ 50 là\ntrung vị, Trung vị là giá trị của mục ở giữa của một tập hợp các mục đã được sắp xếp\ntheo thứ tự tăng dần hoặc giảm dần. Trong mẫu được đánh số lẻ gồm n mục, giá trị trung vị\nchiếm vị trí (n + 1)/2. Do đó, lợi nhuận trung bình là 5%.\nC. Không chính xác vì giá trị trung bình bị nhầm là phân vị thứ 50 hoặc tứ phân vị thứ hai, nghĩa\nreturn = (12% + 8% + 7% + 5% + 4% + 3% + 3% )/7=6%.\nPhương pháp định lượng: tính toán, diễn giải và đánh giá các thước đo về xu hướng trung tâm và\nvị trí để giải quyết vấn đề đầu tư","qhtml":"<p>An analyst gathers the following returns for seven funds:</p><table class=\"qtable\"><thead><tr><th>Fund 1</th><th>Fund 2</th><th>Fund 3</th><th>Fund 4</th><th>Fund 5</th><th>Fund 6</th><th>Fund 7</th></tr></thead><tbody><tr><td>12%</td><td>7%</td><td>5%</td><td>4%</td><td>8%</td><td>3%</td><td>3%</td></tr></tbody></table><p>The second quartile return is:</p>"},{"n":48,"q":"The correlation coefficient:","opts":["ranges from 0 to 1.","is not affected by outliers.","Indicates the strength of the linear relationship between two random variables."],"ans":"C","expl":"A. Không chính xác vì mối tương quan nằm trong khoảng - 1 và + 1 đối với hai biến ngẫu nhiên X và Y\nB. Không chính xác vì mối tương quan cũng có thể là một thước đo không đáng tin cậy khi các giá trị ngoại lệ\nxuất hiện ở một hoặc cả hai biến. Như chúng ta đã thấy, các giá trị ngoại lệ là số lượng nhỏ\nquan sát ở mức cực đoan (nhỏ hoặc lớn) của một mẫu. Mối tương quan có thể khá\nnhạy cảm với các giá trị ngoại lệ\nC. Đúng vì hệ số tương quan biểu thị cường độ của mối quan hệ\ntuyến tính giữa hai biến ngẫu nhiên.\nPhương pháp định lượng: diễn giải mối tương quan giữa hai biến để giải quyết\nvấn đề đầu tư","qhtml":null},{"n":49,"q":"If the covariance between two positively correlated random variables remains the\nsame but the variance of both variables increases, the correlation between the two\nvariables:","opts":["decreases","stays the same.","increases."],"ans":"A","expl":"A. Đúng vì mối tương quan giữa hai biến ngẫu nhiên, R và R, được xác định là\np(R,R)= Cov(R,R), [o(R),σ(R)], trong đó Cov biểu thị hiệp phương sai và σ độ lệch chuẩn\ni j i j i j\n. Vì độ lệch chuẩn của từng nội dung xảy ra ở mẫu số của công thức tương quan\n, nên rõ ràng là tất cả những nội dung khác đều bằng nhau. sự gia tăng phương sai (do đó\nđộ lệch chuẩn) của một trong hai biến sẽ làm giảm mối tương quan.\nB. Không chính xác vì mối tương quan giữa hai biến ngẫu nhiên, R và R, được định nghĩa là\np(R,R) = Cov(R,R)[ σ(R), σ(R)], trong đó Cov biểu thị hiệp phương sai và σ độ lệch chuẩn\ni j i j i j\n. Do đó, việc tăng phương sai sẽ làm giảm mối tương quan chứ không giữ nguyên.\nThí sinh có thể chọn đáp án này vì hiệp phương sai của các biến tương quan\ngiữ nguyên hoặc nếu họ cho rằng mối tương quan không phụ thuộc vào phương sai.\nC. Không chính xác vì mối tương quan giữa hai biến ngẫu nhiên, R và R, được xác định là\np(R,R = Cov(R,R /[ σ (R),σ(R)], trong đó Cov biểu thị hiệp phương sai và σ\ni j) i j i j\nđộ lệch chuẩn. Do đó, việc tăng phương sai sẽ làm giảm mối tương quan chứ không làm tăng nó.\nThí sinh có thể chọn câu trả lời này nếu họ nghĩ rằng nhiều phương sai hơn có nghĩa là hiệp phương sai nhiều hơn\nvà do đó có nhiều mối tương quan hơn hoặc nếu họ hoán đổi tử số và mẫu số của\ncông thức tương quan [σ(R),σ(R)]/Cov(R,R).\ni j i j\nPhương pháp định lượng: tính toán và giải thích giá trị kỳ vọng, phương sai, độ lệch\nchuẩn, hiệp phương sai và mối tương quan của lợi nhuận danh mục đầu tư","qhtml":null},{"n":50,"q":"The correlation between two variables measures:","opts":["only their linear relationship.","only their non-linear relationship.","both their linear and non-linear relationships."],"ans":"A","expl":"A. Đúng vì hệ số tương quan là thước đo mối liên hệ tuyến tính giữa\nhai biến; sẽ không phù hợp nếu sử dụng hệ số tương quan để đo lường\nmối quan hệ phi tuyến tính giữa các biến\nB. Không chính xác vì hệ số tương quan là thước đo mối liên hệ tuyến tính\ngiữa hai biến.\nC. Không chính xác vì hệ số tương quan là thước đo mối liên hệ tuyến tính\ngiữa hai biến Nó không đo lường mối quan hệ phi tuyến tính giữa các biến.\nPhương pháp định lượng: diễn giải mối tương quan giữa hai biến để giải quyết\nvấn đề đầu tư","qhtml":null},{"n":51,"q":"Which of the following is required to compute the standard error of a sample mean\nusing the bootstrap resampling method?","opts":["The mean of each resample","The mean of the original sample","The standard deviation of the original sample"],"ans":"A","expl":"A. Đúng vì phương trình ước tính sai số chuẩn của mẫu\ntính toán một cách hiệu quả độ lệch chuẩn mẫu của các phương tiện khác nhau được tạo ra\ntrên tất cả các mẫu lại. Tuy nhiên, không yêu cầu\ntrung bình cũng như độ lệch chuẩn của mẫu ban đầu\nB. Không chính xác vì phương trình ước tính sai số chuẩn của mẫu có nghĩa\ntính toán một cách hiệu quả độ lệch chuẩn mẫu của các giá trị trung bình khác nhau được tạo ra\ntrên tất cả các mẫu lại. Tuy nhiên, cả\ntrung bình cũng như độ lệch chuẩn của mẫu ban đầu là bắt buộc.\nC. Không chính xác vì phương trình ước tính sai số chuẩn của trung bình mẫu\ntính toán một cách hiệu quả độ lệch chuẩn mẫu của các giá trị trung bình khác nhau được tạo ra\ntrên tất cả các mẫu lại. Tuy nhiên, cả\ntrung bình lẫn độ lệch chuẩn đều không được yêu cầu. của mẫu ban đầu là bắt buộc.\nPhương pháp định lượng: mô tả việc sử dụng lấy mẫu lại (bootstrap, jackknife) để ước tính\nphân bổ lấy mẫu của một thống kê","qhtml":null},{"n":52,"q":"A discrete random variable X has the following probability distribution:\nProbability | Outcome\n0.20 — 35\n0.30 — 50\n0.50 — 80\nThe standard deviation of X is closest to:","opts":["18.73.","20.00.","22.91."],"ans":"A","expl":"A. Đúng vì giá trị kỳ vọng E(X) = Σ nP(X)X = (0,20 x 35) + (0,30 x 50) + (0,50 x\ni=1 i j\n80) = 62. Phương sai σ2(X) = E{[X - E(X)]2}= Σ nP(X)[X - E(X)]2 = 0,20 x (35 - 62)2 + 0,30 x (50\ni=1 i\n- 62)2 + 0,50 × (80 - 62)2 = 351. Độ lệch chuẩn là căn bậc hai dương của phương sai: σ =\n3511/2 ~ 18.73.\nB. Không chính xác vì nó sử dụng giá trị trung bình đơn giản của các kết quả thay vì giá trị\ndự kiến ​​trong phép tính. Xbar trung bình đơn giản = (35 + 50 + 80)/3 = 55. Do đó\nphương sai trở thành σ2(X) = Σ nP(X)[X — X ]2 =0,20 x (35 - 55)2 + 0,30 x (50 - 55)2 + 0,50 x\ni=1 i bar\n(80 - 55)2 = 400. Khi đó, độ lệch chuẩn bằng σ = 4001/2 = 20,00.\nC. Không chính xác vì nó bỏ qua rằng đây là một biến ngẫu nhiên và chỉ tính độ lệch chuẩn của mẫu\nthay cho một mẫu có 3 quan sát. Trung bình mẫu Xoar (35 + 50\n+ 80)/3 = 55. Do đó phương sai mẫu bằng σ2 = (Σ n [X - X ]2)/(n − 1) = [(35 −55)2\ni=1 bar\n+ (50 - 55)2 + (80 - 55)/(3 - 1) = 525. Khi đó, độ lệch chuẩn mẫu bằng σ =\n5251/2 ~ 22,91.\nPhương pháp định lượng: tính toán các giá trị kỳ vọng, phương sai và độ lệch chuẩn và\nchứng minh ứng dụng của chúng đối với các vấn đề đầu tư","qhtml":"<p>A discrete random variable X has the following probability distribution:</p><table class=qt><thead><tr><th>Probability</th><th>Outcome</th></tr></thead><tbody><tr><td>0.20</td><td>35</td></tr><tr><td>0.30</td><td>50</td></tr><tr><td>0.50</td><td>80</td></tr></tbody></table><p>The standard deviation of X is closest to:</p>"},{"n":53,"q":"A tree diagram contains the following information about the dividend per share\npayable by a company under two scenarios:\nScenario Probability of Scenario Dividend per Share Probability of Dividend\nFavorable 0.60 $2.00 0.80\n$1.50 0.20\nUnfavorable 0.40 $0.75 0.30\n$0.50 0.70\nThe expected dividend per share under the favorable scenario is closest to:","opts":["$1.14.","$1.37.","$1.90."],"ans":"C","expl":"A. Không chính xác vì nó nhân sai cổ tức dự kiến trên mỗi cổ phiếu dựa trên\nkịch bản thuận lợi ($1,90) với xác suất của kịch bản (0,60):\nXác suất của kịch bản thuận lợi x E(Cổ tức | Kịch bản thuận lợi)\n= 0,60 × [(0,80 x $2,00) + (0,20 x $1,50)]\n= 0,60 x $1,90\n= $1,14.\nB. Không chính xác vì đây là cổ tức dự kiến vô điều kiện trên mỗi cổ phiếu dựa trên quy tắc xác suất tổng\ncho giá trị kỳ vọng:\nE(Cổ tức | Kịch bản thuận lợi) = (0,80 x $2,00) + (0,20 x $1,50) = $1,90.\nE(Cổ tức | Kịch bản bất lợi) = (0,30 x 0,75 USD) + (0,70 x 0,50 USD) = 0,575 USD.\nE(Cổ tức) = (0,60 x 1,90 USD) + (0,40 x 0,575 USD) = 1,37 USD.\nC. Đúng vì giá trị kỳ vọng của biến ngẫu nhiên X cho một sự kiện hoặc kịch bản S được\nký hiệu là E(XS). Giả sử biến ngẫu nhiên X có thể nhận bất kỳ một trong n kết quả riêng biệt\nX , X , ….X , (những kết quả này tạo thành một tập hợp các sự kiện đầy đủ và loại trừ lẫn nhau).\n1 2 n\ngiá trị mong đợi của X có điều kiện trên S là kết quả đầu tiên, X, nhân với xác suất của kết quả\nđầu tiên cho trước S, P(X | S), cộng với kết quả thứ hai, X₂, nhân với xác suất của kết quả\nthứ hai cho trước S, P(X | S), v.v.\n2\nTrong trường hợp của chúng tôi,\nS = Tình huống thuận lợi,\nX = Cổ tức là 2,50 USD, P(X | S) = 0,80\n1 1\nX₂ = Cổ tức là 1,50 USD, P(X₂ | S) = 0,20.\nDo đó, cổ tức dự kiến trong trường hợp thuận lợi = (0,80 x $2,00) + (0,20 x $1,50) =\n$1,90.\nCây xác suất và kỳ vọng có điều kiện: hình thành một vấn đề đầu tư dưới dạng cây xác suất\nvà giải thích việc sử dụng các kỳ vọng có điều kiện trong ứng dụng đầu tư","qhtml":"<p>A tree diagram contains the following information about the dividend per share payable by a company under two scenarios:</p><table class=qt><thead><tr><th>Scenario</th><th>Probability of Scenario</th><th>Dividend per Share</th><th>Probability of Dividend</th></tr></thead><tbody><tr><td rowspan=2>Favorable</td><td rowspan=2>0.60</td><td>$2.00</td><td>0.80</td></tr><tr><td>$1.50</td><td>0.20</td></tr><tr><td rowspan=2>Unfavorable</td><td rowspan=2>0.40</td><td>$0.75</td><td>0.30</td></tr><tr><td>$0.50</td><td>0.70</td></tr></tbody></table><p>The expected dividend per share under the favorable scenario is closest to:</p>","explhtml":"<p><b>A. Không chính xác. </b>Điều này nhân sai số cổ tức dự kiến ​​trong kịch bản thuận lợi ($1,90) với xác suất của kịch bản đó (0,60):</p><div class=\"kd\">$$0.60\\times\\left[(0.80)(\\$2.00)+(0.20)(\\$1.50)\\right]=0.60\\times\\$1.90=\\$1.14$$</div><p><b>B. Không chính xác. </b>Đây là cổ tức dự kiến ​​vô điều kiện trên mỗi cổ phiếu (quy tắc tổng xác suất):</p><div class=\"kd\">$$E(\\text{Div}\\mid\\text{Fav})=(0.80)(\\$2.00)+(0.20)(\\$1.50)=\\$1.90$$</div><div class=\"kd\">$$E(\\text{Div}\\mid\\text{Unfav})=(0.30)(\\$0.75)+(0.70)(\\$0.50)=\\$0.575$$</div><div class=\"kd\">$$E(\\text{Div})=(0.60)(\\$1.90)+(0.40)(\\$0.575)=\\$1.37$$</div><p><b>C. Đúng. </b>Cổ tức dự kiến ​​có điều kiện trong kịch bản thuận lợi là giá trị trung bình theo xác suất của các kết quả trong kịch bản đó:</p><div class=\"kd\">$$E(\\text{Div}\\mid\\text{Fav})=(0.80)(\\$2.00)+(0.20)(\\$1.50)=\\$1.90$$</div><span class=\"los\">Cây xác suất và kỳ vọng có điều kiện: xây dựng bài toán đầu tư dưới dạng cây xác suất và giải thích việc sử dụng kỳ vọng có điều kiện trong ứng dụng đầu tư</span>"},{"n":54,"q":"The stated annual rate for Term Deposit 2 that should make the investor indifferent\nbetween the two term deposits is closest to An investor is considering two term deposits\nwith the following characteristics:\nTerm Deposit 1 Term Deposit 2\n• Compounding frequency Quarterly Continuous\n• Stated annual rate 4% ?","opts":["3.92%.","3.98%.","4.06%."],"ans":"B","expl":"A. Không chính xác vì nó lấy logarit tự nhiên của lãi suất hàng năm đã nêu của Tiền gửi có kỳ hạn 1\nthay vì lãi suất hàng năm thực tế (EAR). Tính toán: In(1,04) = 0,039221 = 3,92%.\nB. Đúng vì nhà đầu tư sẽ thờ ơ nếu EAR cho cả hai khoản tiền gửi có kỳ hạn\nnhư nhau. Do đó, chúng ta cần tìm lãi suất hàng năm đã nêu với lãi kép liên tục\ntương ứng với EAR của tiền gửi có kỳ hạn gộp hàng quý. Tính toán: EAR của\nTiền gửi có kỳ hạn 1 = (1 + 0,04/4)4 - 1= 0,040604. Do đó, EAR của Tiền gửi có kỳ hạn 2 = 0,040604=er -\n1, dẫn đến lãi suất hàng năm được nêu cho Tiền gửi có kỳ hạn 2 là r = In(1,040604) = 0,039801 = 3,98%.\nC. Không chính xác vì đây là EAR của Tiền gửi có kỳ hạn 1, không phải lãi suất hàng năm đã nêu của Khoản tiền gửi có kỳ hạn\n. EAR của Tiền gửi có kỳ hạn 1 = (1 + 0,04/4)4 - 1= 0,040604 = 4,06%. Câu trả lời này cũng\ngần nhất với các phép tính e0,04 - 1 = 0,040811 = 4,08% hoặc e0,040604 - 1 = 0,041440 = 4,14%.\n=\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận hàng năm và\nlợi nhuận gộp liên tục và mô tả cách sử dụng thích hợp của chúng","qhtml":"<p>An investor is considering two term deposits with the following characteristics:</p><table class=\"qtable\"><thead><tr><th></th><th>Term Deposit 1</th><th>Term Deposit 2</th></tr></thead><tbody><tr><td>Compounding frequency</td><td>Quarterly</td><td>Continuous</td></tr><tr><td>Stated annual rate</td><td>4%</td><td>?</td></tr></tbody></table><p>The stated annual rate for Term Deposit 2 that should make the investor indifferent between the two term deposits is closest to:</p>"},{"n":55,"q":"An investor invests a fixed amount of money into a fund each year for three years as follows:\nYear | Price per Share\n1 — €14.00\n2 — €12.00\n3 — €17.00\nThe investor's average cost per share is closest to","opts":["€14.05.","€14.33.","€14.63."],"ans":"A","expl":"A. Đúng vì giá trị trung bình điều hòa được dùng để xác định mức giá trung bình được trả trên mỗi\nchia sẻ khi sử dụng phương pháp tính trung bình chi phí.\n3\n= 14.05\n1 1 1\n+ +\n14 12 17\nCông thức trung bình có trọng số cũng có thể là được sử dụng, trong đó trọng số sẽ là tỷ lệ\ntrong tổng số cổ phiếu được mua. Tuy nhiên, để sử dụng phương pháp này, cần phải tạo một khoản đầu tư\ncố định.\nB. Không chính xác vì đây là giá trung bình trên mỗi cổ phiếu, không phải giá mỗi cổ phiếu; (14 + 12 +\n17)/3 = 14,33. Việc sử dụng giá trị trung bình số học giả định trọng số bằng nhau, điều này không phù hợp\nkhi số tiền đầu tư là cố định và giá cổ phiếu thay đổi.\nC. Không chính xác vì giá mỗi cổ phiếu được sử dụng không chính xác làm trọng số trong công thức trung bình\ncó trọng số:\n14 12 17\n14( ) + 12( ) + 17( ) = 14,63\n14 + 12 + 17 14 + 12 + 17 14 + 12 + 17\nPhương pháp định lượng: tính toán và giải thích các phương pháp khác nhau để trả về kết quả đo lường\ntheo thời gian và mô tả cách sử dụng thích hợp của chúng","qhtml":"<p>An investor invests a fixed amount of money into a fund each year for three years as follows:</p><table class=qt><thead><tr><th>Year</th><th>Price per Share</th></tr></thead><tbody><tr><td>1</td><td>€14.00</td></tr><tr><td>2</td><td>€12.00</td></tr><tr><td>3</td><td>€17.00</td></tr></tbody></table><p>The investor&#x27;s average cost per share is closest to</p>","explhtml":"<p><b>A. Đúng. </b>Giá trị trung bình hài hòa cho biết mức giá trung bình được trả cho mỗi cổ phiếu khi sử dụng phương pháp tính trung bình chi phí:</p><div class=\"kd\">$$\\dfrac{3}{\\frac{1}{14}+\\frac{1}{12}+\\frac{1}{17}}=14.05$$</div><p><b>B. Không chính xác. </b>Đây là giá trung bình số học trên mỗi cổ phiếu, không phải giá mỗi cổ phiếu:\\((14+12+17)/3=14.33\\). Giá trị trung bình số học giả định trọng số bằng nhau, điều này không phù hợp khi số tiền đầu tư được cố định.</p><p><b>C. Không chính xác. </b>Giá trên mỗi cổ phiếu được sử dụng không chính xác làm trọng số trong công thức tính giá trị trung bình:</p><div class=\"kd\">$$14\\!\\left(\\tfrac{14}{43}\\right)+12\\!\\left(\\tfrac{12}{43}\\right)+17\\!\\left(\\tfrac{17}{43}\\right)=14.63$$</div><span class=\"los\">Phương pháp định lượng: tính toán và giải thích các phương pháp khác nhau để trả về phép đo theo thời gian và mô tả cách sử dụng phù hợp của chúng</span>"},{"n":56,"q":"The simple linear regression model in which only the independent variable is in\nlogarithmic form is best described as the","opts":["log-lin model.","lin-log model.","log-log model"],"ans":"B","expl":"A. Không chính xác vì trong mô hình log - lin, biến phụ thuộc ở dạng logarit còn\nbiến độc lập thì không.\nB. Đúng vì mô hình lin - log tương tự như mô hình log - lin, nhưng chỉ có biến độc lập\nlà ở dạng logarit.\nC. Không chính xác vì mô hình log - log là mô hình trong đó cả biến phụ thuộc và biến độc lập\n đều tuyến tính ở dạng logarit của chúng. Trong mô hình lin - log chỉ có\nbiến độc lập ở dạng logarit.\nPhương pháp định lượng: mô tả các dạng hàm khác nhau của hồi quy tuyến tính đơn giản","qhtml":null},{"n":57,"q":"An analyst produces the following joint probability function for the returns on two\ncompanies, X and Y.\nReturn of Y=15% Return of Y=10% Return of Y=5%\nReturn of X = 20% 0.2 0 0\nReturn of X = 15% 0 0.4 0\nReturn of X = 10% 0 0 0\nThe expected returns of companies X and Y are 14% and 9%, respectively. The covariance\nof returns between X and Y (in percent squared) is closest to:","opts":["0.","5.","14."],"ans":"C","expl":"A. Không chính xác vì công thức hiệp phương sai được áp dụng sai là Cov(R ,R ) = ΣP(R ,,R )(R −\nA B A i B,j A,i\nE[R ]) + ΣP(R ‚R ) (R - E[R ]), thu được 0,2(2014) + 0,4(1514) + 0,4(10 - 14) + 0,2(159) +\nA A,i Bi B,i B\n0,4(109) + 0,4(5 - 9) = 1,2 + 0,4 + ( - 1,6) + 1,2 + 0,4 + ( - 1,6) = 0.\nB. Không chính xác vì công thức hiệp phương sai được áp dụng sai là Cov(R ,R ) = ΣP(R ,R )(R -\nA B A,i B,i A,i\nR ;) dẫn đến\nB, tôi\n0,2(20 - 15) + 0,4(15 - 10) + 0,4(10 - 5)\n= 0,2(5) + 0,4(5) + 0,4(5)\n= 1 + 2 + 2 = 5.\nCâu trả lời này cũng thể hiện sự khác biệt giữa lợi nhuận kỳ vọng của X và Y:\n14 - 9 = 5.\nC. Đúng vì công thức tính hiệp phương sai giữa các biến ngẫu nhiên R ,\nA\nvà R là Cov(R ,R ) = ΣΣP(R ,R )(R ) - E[R ])(R - E[R ]).\nB A B A,I B,i A,i A B,j B\nLợi nhuận kỳ vọng (đã cho) của mỗi công ty là:\nE[R ]= 0,2(20) + 0,4(15) + 0,4(10) = 4 + 6 + 4= 14,\nX\nE[R ] = 0,2(15) + 0,4(10) + 0,4(5)=3 + 4 + 2 = 9.\nY\nDo đó, Cov(R ,R ) = 0,2(2014) (15 - 9) + 0,4(15 - 14)(10 - 9) + 0,4(10 - 14)(5 - 9)=0,2(6)(6) +\nx y\n0,4(1)(1) + 0,4( - 4) ( - 4)=7,2 + 0,4 + 6,4 = 14.\nPhương pháp định lượng: tính toán và giải thích hiệp phương sai và tương quan của danh mục đầu tư\ntrả về bằng cách sử dụng hàm xác suất chung để trả về","qhtml":"<p>An analyst produces the following joint probability function for the returns on two companies, X and Y.</p><table class=\"qtable\"><thead><tr><th></th><th>Return of Y = 15%</th><th>Return of Y = 10%</th><th>Return of Y = 5%</th></tr></thead><tbody><tr><td>Return of X = 20%</td><td>0.2</td><td>0</td><td>0</td></tr><tr><td>Return of X = 15%</td><td>0</td><td>0.4</td><td>0</td></tr><tr><td>Return of X = 10%</td><td>0</td><td>0</td><td>0.4</td></tr></tbody></table><p>The expected returns of companies X and Y are 14% and 9%, respectively. The covariance of returns between X and Y (in percent squared) is closest to:</p>","explhtml":"<p>Lợi nhuận kỳ vọng là:</p><div class=\"kd\">$$E[R_X]=0.2(20)+0.4(15)+0.4(10)=14,\\qquad E[R_Y]=0.2(15)+0.4(10)+0.4(5)=9$$</div><p><b>C. Đúng. </b>Hiệp phương sai là tổng trọng số xác suất của các tích của độ lệch:</p><div class=\"kd\">$$\\text{Cov}(R_X,R_Y)=\\sum P_i\\,(R_{X,i}-E[R_X])(R_{Y,i}-E[R_Y])$$</div><div class=\"kd\">$$=0.2(6)(6)+0.4(1)(1)+0.4(-4)(-4)=7.2+0.4+6.4=14$$</div><p><b>A. Không chính xác. </b>Công thức hiệp phương sai bị áp dụng sai (bỏ qua tích chéo của độ lệch), cho kết quả 0.</p><p><b>B. Không chính xác. </b>Công thức hiệp phương sai bị áp dụng sai dưới dạng tổng các độ lệch, tạo ra\\(0.2(5)+0.4(5)+0.4(5)=5\\)— cũng bằng chênh lệch giữa lợi nhuận kỳ vọng,\\(14-9=5\\).</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích hiệp phương sai và mối tương quan của lợi nhuận danh mục đầu tư bằng cách sử dụng hàm xác suất chung cho lợi nhuận</span>"},{"n":58,"q":"An analyst gathers the following sample returns for a security:\nReturn\n• -2%\n• -1%\n• 1%\n• 2%\nThe mean absolute deviation of the sample returns is:","opts":["less than the sample standard deviation.","equal to the sample standard deviation.","greater than the sample standard deviation."],"ans":"A","expl":"A. Đúng vì độ lệch tuyệt đối trung bình 1,5% nhỏ hơn độ lệch chuẩn mẫu\nlà 1,83%. Độ lệch tuyệt đối trung bình, MAD, được tính như sau:\n∑𝑛 |𝑋 −𝑋|\n𝑖=1 𝑖\n𝑛\ntrong đó trung bình của mẫu,\n𝑋̅= ∑𝑛 𝑖=1 𝑋 𝑖\n𝑛\nVì trung bình mẫu là:\n𝑋̅= (−2−1 + 1 + 2) = 0\n4\nphép tính MAD là:\n|−2−0| + |−1−0| + |1−0| + |2−0| 2 + 2 + 1 + 1\n=\n4 4\n= 1,5000%, trong khi độ lệch chuẩn mẫu của n quan sát, X là\ni,\n∑𝑛 (𝑋 −𝑋)^2\nS = √ 𝑖=1 𝑖\n𝑛−1\ntại đây:\n(−2−0)2 + (−1−0)2 + (1−0)2 + (2−0)2 4 + 1 + 4 + 1\n√ = √ = √3.3333\n4−1 3\n= 1.8257%.\nB. Không chính xác vì độ lệch tuyệt đối trung bình, MAD, nhỏ hơn độ lệch chuẩn của\ntrả về trong mẫu. Độ lệch tuyệt đối trung bình, MAD, được tính như sau:\n∑𝑛 |𝑋 −𝑋|\n𝑖=1 𝑖\n𝑛\ntrong đó trung bình của mẫu,\n𝑋̅= ∑𝑛 𝑖=1 𝑋 𝑖\n𝑛\ndẫn đến MAD = 1,50% trong khi độ lệch chuẩn mẫu\n∑𝑛 (𝑋 −𝑋)^2\nS = √ 𝑖=1 𝑖\n𝑛−1\n= 1,83% do đó MAD nhỏ hơn độ lệch chuẩn của kết quả trả về mẫu.\nC. Không chính xác vì độ lệch tuyệt đối trung bình, MAD, nhỏ hơn độ lệch chuẩn của\ntrả về trong mẫu.\nĐộ lệch tuyệt đối trung bình, MAD, được tính như sau:\n∑𝑛 |𝑋 −𝑋̅|\n𝑖=1 𝑖\n𝑛\ntrong đó trung bình mẫu,\n𝑋̅= ∑𝑛 𝑖=1 𝑋 𝑖\n𝑛\nkết quả là MAD = 1,50% trong khi độ lệch chuẩn mẫu\n∑𝑛 (𝑋 −𝑋̅)2\nS = √ 𝑖=1 𝑖\n𝑛−1\n= 1,83% do đó MAD nhỏ hơn độ lệch chuẩn của kết quả trả về mẫu.\nPhương pháp định lượng: tính toán, diễn giải, và đánh giá các biện pháp phân tán để giải quyết\nvấn đề đầu tư","qhtml":null,"explhtml":"<p><b>A. Đúng. </b>Độ lệch tuyệt đối trung bình (MAD) nhỏ hơn độ lệch chuẩn mẫu. Với lợi nhuận\\(-2,\\,-1,\\,1,\\,2\\), giá trị trung bình mẫu là</p><div class=\"kd\">$$\\bar X=\\dfrac{-2-1+1+2}{4}=0$$</div><p>MAD là độ lệch tuyệt đối trung bình:</p><div class=\"kd\">$$\\text{MAD}=\\dfrac{|-2|+|-1|+|1|+|2|}{4}=\\dfrac{2+1+1+2}{4}=1.50\\%$$</div><p>Độ lệch chuẩn mẫu là:</p><div class=\"kd\">$$s=\\sqrt{\\dfrac{(-2)^2+(-1)^2+(1)^2+(2)^2}{4-1}}=\\sqrt{\\dfrac{10}{3}}=\\sqrt{3.3333}=1.8257\\%$$</div><p>Từ\\(1.50\\%<1.83\\%\\), MAD nhỏ hơn độ lệch chuẩn.</p><p><b>B và C. Không chính xác.</b>Các lựa chọn này không nhất quán với sự so sánh mà câu hỏi yêu cầu; phép tính trên cho thấy MAD = 1,50% và độ lệch chuẩn mẫu = 1,83%.</p><span class=\"los\">Phương pháp định lượng: tính toán, giải thích và đánh giá các biện pháp phân tán để giải quyết vấn đề đầu tư</span>"},{"n":59,"q":"An investor gathers the following information about a stock:\n• Stock price at t=0 $20\n• Dividend paid at t=1 $3\n• Stock price at t=1 $12\n• Dividend paid at t=2 $1\n• Stock price at t=2 $20\nThe investor purchased one unit of the stock at t = 0 and sold it at = 2 If the dividends\nwere not reinvested, the money-weighted rate of return is closest to:","opts":["10%.","15%.","20%."],"ans":"A","expl":"A. Đúng vì lợi nhuận có trọng số bằng tiền và cách tính toán của nó tương tự với\ntỷ suất lợi nhuận nội bộ và lợi tức đáo hạn. Giống như tỷ suất lợi nhuận nội bộ,\nsố tiền đầu tư là dòng tiền ra theo quan điểm của nhà đầu tư và số tiền được trả lại\nhoặc được nhà đầu tư rút ra hoặc số tiền còn lại ở cuối chu kỳ đầu tư,\nlà dòng tiền vào của nhà đầu tư. Đối với khoản đầu tư chứng khoán, giá trị này là: $20 $3/(1 + r) + ($20 +\n$1)/(1 + r)², mang lại lợi nhuận r = 10,24% ~10%.\nGiải pháp máy tính: CF0 = - 20; CF1 = 3; CF2 = 21; IRR CPT = 10,24.\nB. Không chính xác vì đó là tỷ suất lợi nhuận được tính theo thời gian chứ không phải tiền. Đối với khoản đầu tư cổ phiếu\n, lợi nhuận trong thời gian nắm giữ (HPR) trong hai giai đoạn là HPR, = ($12 - $20\n+ $3)/$20= - 0,25= - 25% và HPR₂ = ($20 - $12 + $1)/$12 = 0,75 = 75%. Do đó, TWR =\n√(0,75 x 1,75) - 1=0,1456 = 14,56% ~ 15%.\nC. Không chính xác vì nó nhầm lẫn giữa tiền - tỷ suất lợi nhuận có trọng số với 'tiền\nđược trả lại', Le. dòng tiền ròng: $20 + $3 + $1 - $20= $4, với khoản đầu tư ban đầu\n$20, tương ứng với lợi nhuận 20%; $4/$20 = 0,2 = 20%.\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận chính và mô tả\ncách sử dụng phù hợp","qhtml":null},{"n":60,"q":"Which of the following statements is most accurate? The money-weighted return:","opts":["ignores cash withdrawals and additional cash investments.","measures what the investor actually earned on the funds invested.","should be used to compare the performance of different investment managers."],"ans":"B","expl":"A. Không chính xác vì tiền lãi có trọng số và cách tính toán của nó tương tự với\ntỷ lệ hoàn vốn nội bộ và lợi tức đáo hạn. Giống như tỷ suất hoàn vốn nội bộ,\nsố tiền đầu tư là dòng tiền ra theo quan điểm của nhà đầu tư và số tiền được trả lại\nhoặc được nhà đầu tư rút ra hoặc số tiền còn lại ở cuối chu kỳ đầu tư,\nlà dòng tiền vào của nhà đầu tư Nghĩa là, việc rút tiền mặt và đầu tư được bao gồm trong\ntính toán lợi tức gia quyền, tuy nhiên, rút tiền mặt và đầu tư bị bỏ qua\ntrong tính toán trả về trung bình số học và hình học\nB. Đúng vì lợi nhuận có trọng số bằng tiền là thước đo chính xác về số tiền mà\nnhà đầu tư thực sự kiếm được từ số tiền đầu tư\nC. Không chính xác vì mặc dù lợi nhuận tính theo tiền là thước đo chính xác về những gì\nnhà đầu tư thực sự kiếm được từ số tiền đầu tư nhưng nó bị hạn chế về khả năng áp dụng cho các tình huống\nkhác. Ví dụ: nó không cho phép so sánh lợi nhuận giữa\ncác cá nhân khác nhau hoặc các cơ hội đầu tư khác nhau. Hai nhà đầu tư trong cùng một quỹ tương hỗ\ncó thể có số tiền khác nhau - lợi nhuận có trọng số vì họ đầu tư số tiền khác nhau trong\ncác năm khác nhau.\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận chính và mô tả\ncách sử dụng phù hợp","qhtml":null},{"n":61,"q":"In evaluating portfolio performance, the return measure most affected by an addition\nof funds to the portfolio just before a market downturn is the:","opts":["time-weighted return.","arithmetic mean return.","money-weighted return."],"ans":"C","expl":"A. Không chính xác vì thước đo đầu tư không nhạy cảm với việc bổ sung và rút tiền\nlà tỷ suất lợi nhuận gia quyền theo thời gian. Tỷ suất sinh lợi\ncó trọng số theo thời gian đo lường tốc độ tăng trưởng gộp của 1 đô la đầu tư ban đầu vào danh mục đầu tư trong một khoảng thời gian đo lường đã nêu. Để đánh giá danh mục đầu tư chứng khoán giao dịch công khai,\ntỷ lệ lợi nhuận gia quyền theo thời gian là thước đo hiệu suất ưu tiên vì nó vô hiệu hóa\ntác động của việc rút tiền mặt hoặc bổ sung vào danh mục đầu tư, thường nằm ngoài\nsự kiểm soát của người quản lý danh mục đầu tư.\nB. Không chính xác vì cách đơn giản nhất để tính lợi nhuận là lấy số học\ntrung bình đơn giản của tất cả lợi nhuận trong thời gian nắm giữ. Hơn nữa, lợi nhuận trung bình số học giả định rằng\nsố tiền đầu tư vào đầu mỗi kỳ là như nhau. Do đó, lợi nhuận trung bình số học\nkhông tính đến việc bổ sung tiền mặt vào danh mục đầu tư và nó không bị ảnh hưởng bởi chúng.\nC. Đúng vì tiền - tỷ suất lợi nhuận gia quyền ... đặt trọng số lớn hơn lên kết quả hoạt động tương đối kém của năm thứ hai... so với kết quả thực hiện tương đối tốt\ncủa năm đầu tiên..., vì nhiều tiền được đầu tư vào năm thứ hai hơn so với năm đầu tiên. Đó là ý nghĩa\ntrong đó lợi nhuận trong phương pháp tính toán hiệu suất này được tính theo trọng số tiền. Nếu một\nkhách hàng cấp cho người quản lý đầu tư nhiều tiền hơn để đầu tư vào thời điểm không thuận lợi, thì\ntỷ suất lợi nhuận có trọng số của tiền của người quản lý sẽ có xu hướng giảm xuống.\nPhương pháp định lượng: so sánh tỷ lệ lợi nhuận có trọng số theo tiền và theo thời gian\nvà đánh giá hiệu suất của danh mục đầu tư dựa trên các biện pháp này","qhtml":null},{"n":62,"q":"An equally weighted portfolio consists of two securities, each with a standard\ndeviation of 3%. If the two securities returns are uncorrelated, the portfolio's standard\ndeviation is closest to","opts":["0.0%.","2.1%.","3.0%"],"ans":"B","expl":"A. Không chính xác vì \"không tương quan\" bị hiểu sai là có giá trị tương quan là - 1\n(tức là sử dụng tương quan âm hoàn hảo thay vì 0) khi tính toán danh mục đầu tư\nđộ lệch chuẩn;\nσ =\np\n√(0,5)²(3)² + (0,5)²(3)² + 2(0,5)(0,5)(3)(3)(−1) = √0 = 0% -\nB. Đúng vì độ lệch chuẩn của danh mục đầu tư là 2,1%;\n√(0,5)2(3)2 + (0,5)2(3)2 + 2(0,5)(0,5)(3)(3)(0) = √4,5\nhoặc 2,12%, sử dụng công thức\n√σ2 = √w[Ww σ2 + W2 σ 2 + 2W W Cov(R ,R )\np 1 1 2 2 1 2 1 2\ntrong đó Cov(R ,R ) = P(R ,R )σ(R )σ(R )\n1 2 1 2 1 2\n, bằng 0 vì số tiền không tương quan;\nP(R , R )=0.\n1 2\nC. Không chính xác vì đây là mức trung bình có trọng số của độ lệch chuẩn của hai chứng khoán và\ntính độ lệch chuẩn của danh mục đầu tư như sau: σ = (0,5) (3%) + (0,5) (3%) = 3,0%.\nPhương pháp định lượng: tính toán và diễn giải giá trị kỳ vọng, phương sai, độ lệch chuẩn\n, hiệp phương sai và mối tương quan của lợi nhuận danh mục đầu tư","qhtml":null,"explhtml":"<p><b>A. Không chính xác. </b>\"Không tương quan\" bị hiểu sai là tương quan âm hoàn hảo\\((\\rho=-1)\\):</p><div class=\"kd\">$$\\sigma_p=\\sqrt{(0.5)^2(3)^2+(0.5)^2(3)^2+2(0.5)(0.5)(3)(3)(-1)}=\\sqrt{0}=0\\%$$</div><p><b>B. Đúng. </b>Vì các quỹ không tương quan nên hiệp phương sai bằng 0\\((\\rho=0)\\):</p><div class=\"kd\">$$\\sigma_p=\\sqrt{(0.5)^2(3)^2+(0.5)^2(3)^2+2(0.5)(0.5)(3)(3)(0)}=\\sqrt{4.5}=2.12\\%$$</div><p><b>C. Không chính xác. </b>Đây là giá trị trung bình có trọng số của hai độ lệch chuẩn:\\(\\sigma=(0.5)(3\\%)+(0.5)(3\\%)=3.0\\%\\).</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích giá trị kỳ vọng, phương sai, độ lệch chuẩn, hiệp phương sai và mối tương quan của lợi nhuận danh mục đầu tư</span>"},{"n":63,"q":"An investment requires 10 equal annual payments, starting today, and will pay out a\nlump sum of $500,000 15 years from today. If the interest rate is 4% per year compounded\nannually, the required annual payment is closest to","opts":["$32,913.","$34,230.","$40,044"],"ans":"A","expl":"A. Đúng vì giá trị hiện tại của khoản thanh toán một lần trong tương lai là PV = FV (1 + r) - N =\nN\n$500.000(1 + 0,04) - 15= $277.632,25. Khoản thanh toán hàng năm 10 hình thành một khoản thanh toán hàng năm đến hạn (vì\ncác khoản thanh toán bắt đầu từ hôm nay) có giá trị hiện tại bằng giá trị hiện tại của một khoản thanh toán hàng năm\nthông thường với 9 khoản thanh toán hàng năm cộng với khoản thanh toán đầu tiên, tức là PV = A + A[1 - 1/(1 + r)N ]/r=A(1 +\n[1 - 1/(1 + 0,04)9]/0,04)= 8,4353 (A). Đặt PV của dòng tiền ra (niên kim) bằng\nvới PV của dòng tiền vào (lợi nhuận sau 15 năm), chúng ta có thể giải quyết số tiền thanh toán hàng năm\n; A = $277.632,25/8,4353 $32.913.\nGiải pháp máy tính: BGN; N = 10; I/Y = 4; PV = 277.632,25; giải quyết PMT 32.913.\nB. Không chính xác vì nó nhầm các khoản thanh toán được yêu cầu là một niên kim thông thường, thay vì\nmột niên kim đến hạn, tính giá trị hiện tại của chúng là: PV = A[1 - 1/(1 + r)N]/r = A([1 - 1/(1 +\n0,04)10 ]/0,04)= 8.1109(A). Giá trị hiện tại của lợi nhuận tại thời điểm t = 15 là PV = FV (1 + r) - N=\n$500.000(1 + 0,04) - 15= $277.632,25. Việc đặt hai giá trị này bằng nhau và giải\nthanh toán hàng năm sẽ mang lại: A = $277.632,25/8.1109 $34.230.\nGiải pháp máy tính: END; N = 10; I/Y= 4; PV = 277.632,25; giải để tìm PMT = 34.230.\nC. Không chính xác vì nó giả định khoản hoàn trả 500.000 USD được trả ở mức t = 10 thay vì t = 15. Do đó,\ngiá trị hiện tại của khoản thanh toán này là PV = FV (1 + r) - N = 500.000 USD(1 + 0,04) - 10 =\n$337.782,08. Khoản thanh toán hàng năm 10 hình thành một khoản thanh toán hàng năm đến hạn (kể từ khi khoản thanh toán bắt đầu hôm nay)\ncó giá trị hiện tại bằng giá trị hiện tại của một niên kim thông thường với 9 khoản thanh toán hàng năm\ncộng với khoản thanh toán đầu tiên, tức là PV = A + A[1 - 1/(1 + r)N ]/r=A(1 + [1 - 1/(1 + 0,04)9\n/0.04)= 8.4353(A). Đặt PV của dòng tiền ra (niên kim) bằng PV của\ndòng tiền vào (lợi nhuận sau 15 năm), chúng ta có thể giải quyết số tiền thanh toán hàng năm; A =\n$337.782/8.4353 ~ $40.044.\nGiải pháp máy tính: BGN; N = 10; I/Y = 4; FV = 500.000; giải cho PMT = 40,044.\nPhương pháp định lượng: tính toán và diễn giải lợi nhuận ngụ ý của các công cụ thu nhập cố định\nvà lợi nhuận yêu cầu cũng như mức tăng trưởng ngầm định của các công cụ vốn dựa trên\ngiá trị hiện tại (PV) và dòng tiền","qhtml":null},{"n":64,"q":"The probability of correctly rejecting a false null hypothesis is best described as one\nminus the:","opts":["test statistic's p-value.","probability of a Type I error.","probability of a Type II error."],"ans":"C","expl":"A. Không chính xác vì công suất của thử nghiệm bằng một trừ đi xác suất xảy ra lỗi Loại II\n. Giá trị p là thước đo lỗi Loại I và đồng nghĩa với yếu tố phân tâm B.\nB. Không chính xác vì công suất của thử nghiệm bằng một trừ đi xác suất xảy ra lỗi Loại II\n. Giá trị p là thước đo lỗi Loại I và đồng nghĩa với yếu tố phân tâm B.\nC. Đúng vì sức mạnh của phép kiểm tra là xác suất của việc Đúng ly loại bỏ giá trị rỗng - đó\nlà xác suất loại bỏ giá trị rỗng khi nó sai. Không bác bỏ giả thuyết khống\nkhi nó sai là lỗi Loại II. Vì vậy, sức mạnh của thử nghiệm bằng một trừ đi\nxác suất xảy ra lỗi Loại II.\nPhương pháp định lượng: giải thích thử nghiệm giả thuyết và các thành phần của nó, bao gồm\ný nghĩa thống kê, lỗi Loại I và Loại II cũng như sức mạnh của thử nghiệm.","qhtml":null},{"n":65,"q":"All else being equal, which of the following would most likely lead to a wider\nprediction interval for the dependent variable when re-estimating a linear regression\nmodel? An increase in the","opts":["sample size","level of significance","standard error of the estimate"],"ans":"C","expl":"A. Không chính xác vì khoảng dự đoán bằng giá trị dự đoán của biến\nphụ thuộc cộng/trừ giá trị t tới hạn nhân với sai số chuẩn của dự báo. Kích thước mẫu\ntrong ước tính hồi quy càng lớn thì sai số chuẩn của dự báo\n càng nhỏ. Trong khi đó, khi kích thước mẫu lớn hơn, giá trị t tới hạn sẽ nhỏ hơn.\nCả hai sẽ dẫn đến khoảng dự đoán hẹp hơn nếu giữ các giá trị khác không đổi.\nB. Không chính xác vì khoảng dự đoán bằng với giá trị dự đoán của biến phụ thuộc\n cộng/trừ giá trị tới hạn nhân với sai số chuẩn của dự báo. Khi\nmức ý nghĩa tăng lên, giá trị tới hạn - sẽ giảm, điều này sẽ dẫn đến khoảng dự đoán\nhẹp hơn nếu giữ các giá trị khác không đổi.\nC. Đúng vì khoảng dự đoán bằng với giá trị dự đoán của biến phụ thuộc\ncộng/trừ giá trị tới hạn ! - giá trị nhân với sai số chuẩn của dự báo.\nmô hình hồi quy càng phù hợp thì sai số chuẩn của (các) ước tính càng nhỏ và\ndo đó, sai số chuẩn của dự báo càng nhỏ. Khi sai số chuẩn của\nước tính tăng lên, sai số chuẩn của dự báo sẽ tăng lên, điều này sẽ dẫn đến khoảng dự đoán rộng hơn\nnếu giữ các yếu tố khác không đổi.\nPhương pháp định lượng: tính toán và diễn giải giá trị dự đoán cho biến\nphụ thuộc và khoảng dự đoán cho biến đó, dựa trên mô hình hồi quy tuyến tính ước tính và giá trị a\ncho biến độc lập biến","qhtml":null},{"n":66,"q":"An investor needs to make the following payments to cover college tuition fees,\nstarting 10 years from today:\nAnnual fee (payable at the beginning of each year) $50,000\nNumber of years of fee payments 4\nIf the investor's annual discount rate is 3%, the minimum investment amount required\ntoday to fund all four years of college tuition is closest to","opts":["$138,294.","$142,442.","$146,716."],"ans":"B","expl":"A. Không chính xác vì niên kim được coi là niên kim thông thường chứ không phải là niên kim đến hạn,\n4\ndẫn đến PV 10 năm kể từ hôm nay của PV10 $50.000 x [1 - 1/(1,03) ]/0,03= $50.000 ×\n3,717098 = $185,855. PV của niên kim hôm nay sẽ bằng PV, = $185,855/(1,03)^10 =\n$138.294.\nGiải pháp máy tính: chế độ END, N = 4; I/Y = 3%; PMT 50.000; giải cho PV = 185.855.\nĐã chiết khấu trở lại 10 năm: N = 10; I/Y= 3%, FV= 185.855, giải cho PV = 138.294.\nĐây cũng là kết quả nếu PV của niên kim đến hạn được chiết khấu trở lại 11 năm thay vì 10\nnăm: $191,431/(1,03)^11 = $138.294.\nGiải pháp máy tính: chế độ BEGIN; N = 4; Tôi/Y=3% ; PMT = 50.000, giải cho PV 191.431.\nChiết khấu ngược 11 năm: N = 11, I/Y=3%; FV = 191,431, giải cho PV = 138,294.\nB. Đúng vì giá trị hiện tại (PV) của niên kim đáo hạn sau 10 năm kể từ hôm nay bằng PV\n10 = $50.000 + $50.000 [1 - 1/(1,03) ^3/0,03 =$50.000 + $50.000 x 2,828611 = $191.431.\nPV của niên kim hôm nay bằng PV $191,431/(1,03)^10 =$142.442.\nGiải pháp máy tính: chế độ BEGIN; N = 4; Tôi/Y=3%; PMT = 50.000; giải quyết cho PV 191.431.\nChiết khấu trở lại 10 năm: N = 10; I/Y= 3%, FV = 191.431, giải cho PV = 142.442.\nNgoài ra, niên kim có thể được coi là niên kim thông thường, với PV 9 năm kể từ\nhôm nay của PV,= $50.000 × [1 - 1/(1,03)^4/0,03 = 50.000 USD × 3,717098 = 185.855 USD. PV của\nniên kim hôm nay bằng PV₁ = $185.855/(1,03)^9 = $142.442.\nGiải pháp máy tính: chế độ END; N= 4; I/Y= 3%; PMT 50.000; giải cho PV = 185.855.\nĐã chiết khấu trở lại 9 năm: N = 9; I/Y= 3%, FV = 185.855; giải cho PV = 142,442\nC. Không chính xác vì PV của niên kim đến hạn được chiết khấu trở lại 9 năm thay vì 10\nnăm: $191.431/(1,03)^9 = $146.716.\nGiải pháp máy tính: Chế độ BEGIN: N = 4; Tôi/Y=3% ; PMT = 50.000; giải quyết cho PV 191.431,\nĐã chiết khấu trở lại 9 năm: N = 9; I/Y = 3%; FV = 191.431; giải cho PV = 146.716.\nCâu trả lời này cũng gần nhất với PV của toàn bộ số tiền được yêu cầu: $200.000/(1,03) 10 =\n$148.819.\nPhương pháp định lượng: tính toán và giải thích lợi nhuận ngụ ý của thu nhập cố định\ninstruments và lợi nhuận yêu cầu và tăng trưởng ngụ ý của các công cụ vốn với\ngiá trị hiện tại (PV) và dòng tiền","qhtml":null,"explhtml":"<p><b>B. Đúng. </b>Giá trị hiện tại của khoản tiền phải trả sau 10 năm kể từ ngày hôm nay là:</p><div class=\"kd\">$$PV_{10}=\\$50{,}000+\\$50{,}000\\times\\dfrac{1-1/(1.03)^{3}}{0.03}=\\$50{,}000+\\$50{,}000(2.828611)=\\$191{,}431$$</div><p>Giảm giá đến hôm nay:</p><div class=\"kd\">$$PV_0=\\dfrac{\\$191{,}431}{(1.03)^{10}}=\\$142{,}442$$</div><p>Máy tính: Chế độ BEGIN; N = 4; I/Y = 3%; PMT = 50.000; PV CPT = 191.431. Khi đó N = 10; I/Y = 3%; FV = 191.431; PV CPT = 142.442.</p><p><b>A. Không chính xác. </b>Điều này coi niên kim là thông thường chứ không phải là niên kim đến hạn:\\(PV_{10}=\\$50{,}000\\times[1-1/(1.03)^{4}]/0.03=\\$185{,}855\\), cho\\(PV_0=\\$185{,}855/(1.03)^{10}=\\$138{,}294\\).</p><p><b>C. Không chính xác. </b>Giá trị niên kim được chiết khấu trở lại 9 năm thay vì 10:\\(\\$191{,}431/(1.03)^{9}=\\$146{,}716\\).</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích lợi nhuận ngụ ý của các công cụ thu nhập cố định và lợi nhuận yêu cầu cũng như mức tăng trưởng ngụ ý của các công cụ vốn cổ phần dựa trên giá trị hiện tại (PV) và dòng tiền</span>"},{"n":67,"q":"An annuity makes seven annual payments of $10,000 each, with the first payment\noccurring five years from today. If the discount rate is 6% per year, the value of the\nannuity today is closest to","opts":["$ 41,715.","$44,218.","$55,824."],"ans":"B","expl":"A. Không chính xác vì nó giả định niên kim thông thường bắt đầu từ Năm 5 thay vì Năm 4.\ngiá trị hiện tại của một niên kim thông thường với 7 khoản thanh toán trị giá 10.000 USD với lãi suất chiết khấu 6% được\nđược tính như sau:\nPV=A[1 - 1/(1 + r)N]/r\nPV =$10.000 × [1 - 1/(1 + 0,06)7]/0,06\n4\nPV $55.823,81\n4\nSau đó, PV của khoản đầu tư được chiết khấu không chính xác từ Năm 5 thay vì Năm 4, chẳng hạn\nrằng:\nPV1 = FV5(1 + r) - N\nPV= $55.823,81 × (1 + 0,06) - 5\nPV= $41.714,80 ~ $41.715.\nGiải pháp máy tính:\n(1) chế độ END; N = 7; 1= 6; PMT = - 10.000; FV = 0; giải cho PV = 55.823,81.\n(2) chế độ END; N = 5; 1= 6; PMT = 0; FV = - 55.823,81; giải cho PV = 41.714,80.\nB. Đúng vì giá trị hiện tại trong Năm 4 của một niên kim thông thường với 7 khoản thanh toán\n$10.000 với lãi suất chiết khấu 6% được tính như sau:\nPV=A[1 - 1/(1 + r)N]/r\nPV $10.000 × [1 - 1/(1 + 0,06)7]/0,06\n4\nPV $55.823,81\n4\nSau đó, sử dụng dòng thời gian, PV của niên kim theo đô la ngày nay là\nPV = FV (1 + r) - N\n0 4\nPV $55.823,81 × (1 + 0,06) - 4\n0\nPV $44.217,69 ~ $44.218.\n0\nGiải pháp máy tính:\n(1) chế độ END; N = 7; 1= 6; PMT= - 10.000; FV = 0; giải cho PV = 55.823,81.\n(2) chế độ END; N = 4; 1= 6; PMT = 0; FV = - >55.823,81; giải cho PV = 44.217,69.\nC. Không chính xác vì đây là bước trung gian trong tính toán và nó đại diện cho giá trị\ncủa niên kim trong 4 năm. Giá trị hiện tại trong Năm 4 của một niên kim thông thường với 7 khoản thanh toán\nlà 10.000 USD với lãi suất chiết khấu 6% được tính như sau:\nPV=A[1 - 1/(1 + r)^N/r\nPV, 10.000 USD x [1 - 1/(1 + 0,06)^7]/0,06\nPV $55.823,81 ~ $55.824.\nGiải pháp máy tính: (1) Chế độ END, N = 7; 1= 6; PMT - 10.000; FV = 0; giải cho PV =\n55.823.81.\nPhương pháp định lượng: tính toán và giải thích giá trị hiện tại (PV) của các công cụ thu nhập cố định và\nvốn chủ sở hữu dựa trên dòng tiền dự kiến trong tương lai","qhtml":null,"explhtml":"<p><b>B. Đúng. </b>Giá trị hiện tại trong Năm thứ 4 của một khoản thanh toán hàng năm thông thường gồm 7 khoản thanh toán 10.000 USD với lãi suất 6% là:</p><div class=\"kd\">$$PV_4=\\$10{,}000\\times\\dfrac{1-1/(1.06)^{7}}{0.06}=\\$55{,}823.81$$</div><p>Giảm giá trở lại hôm nay (Năm 0):</p><div class=\"kd\">$$PV_0=\\$55{,}823.81\\times(1.06)^{-4}=\\$44{,}217.69\\approx\\$44{,}218$$</div><p>Máy tính: N = 7; I/Y = 6; PMT = -10.000; FV = 0; PV CPT = 55.823,81. Khi đó N = 4; I/Y = 6; PMT = 0; FV = -55.823,81; PV CPT = 44.217,69.</p><p><b>A. Không chính xác. </b>Mức giảm giá này từ Năm 5 thay vì Năm 4:\\(\\$55{,}823.81\\times(1.06)^{-5}=\\$41{,}714.80\\).</p><p><b>C. Không chính xác. </b>Đây là giá trị Năm thứ 4 của chính niên kim\\((\\$55{,}823.81)\\), một bước trung gian chứ không phải là giá trị ngày nay.</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích giá trị hiện tại (PV) của các công cụ vốn và thu nhập cố định dựa trên dòng tiền dự kiến ​​trong tương lai</span>"},{"n":68,"q":"With respect to simple linear regression, a residual is best described as the difference\nbetween the observed value of a dependent variable and:","opts":["Its mean.","Its estimated value using a fitted regression line based on the sample.","its expected value based on the true underlying population relationship."],"ans":"B","expl":"A. Không chính xác vì chúng tôi xem xét tổng độ lệch bình phương của các quan sát từ\ntrung bình để nắm bắt [sự biến đổi của biến phụ thuộc]. Mục tiêu của chúng tôi là hiểu điều gì\ngiải thích sự biến đổi của Y. Biến thể của Y thường được gọi là tổng bình phương tổng\n(SST) hoặc tổng bình phương. Do đó, sự khác biệt giữa một quan sát và\ngiá trị trung bình của biến phụ thuộc không phải là phần dư của quan sát.\nB. Đúng vì phần dư của quan sát, e, là giá trị quan sát của Y,\nkhác bao nhiêu so với [giá trị] ước tính bằng cách sử dụng đường hồi quy. Hơn nữa, phần dư đề cập đến\nmối quan hệ tuyến tính phù hợp dựa trên mẫu.\nC. Không chính xác vì thuật ngữ lỗi đề cập đến mối quan hệ tổng thể thực sự cơ bản,\ntrong khi phần dư đề cập đến mối quan hệ tuyến tính phù hợp dựa trên mẫu. Hơn nữa,\nthuật ngữ lỗi, hay đơn giản là lỗi, thể hiện sự khác biệt giữa giá trị quan sát được của Y\nvà giá trị dự kiến từ mối quan hệ tổng thể cơ bản thực sự giữa Y và X\nPhương pháp định lượng: mô tả một mô hình hồi quy tuyến tính đơn giản, cách sử dụng tiêu chí bình phương tối thiểu\nđể ước tính các hệ số hồi quy và cách giải thích các hệ số hồi quy này\ncác hệ số","qhtml":null},{"n":69,"q":"The time preference of individuals for current instead of future real consumption is\ncaptured by the","opts":["liquidity premium.","maturity premium","real risk-free interest rate"],"ans":"C","expl":"A. Không chính xác vì phí bảo hiểm thanh khoản bù đắp cho nhà đầu tư rủi ro thua lỗ\nso với giá trị hợp lý của khoản đầu tư nếu khoản đầu tư đó cần được chuyển đổi thành tiền mặt\nmột cách nhanh chóng. Ví dụ: hóa đơn T - Hoa Kỳ không chịu phí thanh khoản vì số lượng lớn\ncó thể được mua và bán mà không ảnh hưởng đến giá thị trường của chúng.\nB. Không chính xác vì phí bảo hiểm kỳ hạn bù đắp cho các nhà đầu tư về độ nhạy cảm\ncủa giá trị thị trường của nợ đối với sự thay đổi của lãi suất thị trường khi thời gian đáo hạn được kéo dài\n. Ví dụ: chênh lệch giữa lãi suất của nợ kho bạc có kỳ hạn dài hơn, thanh khoản\nvà nợ kho bạc ngắn hạn phản ánh phần bù kỳ hạn dương\nđối với nợ dài hạn.\nC. Đúng vì lãi suất phi rủi ro thực phản ánh sở thích về thời gian của các cá nhân đối với\ntiêu dùng thực tế hiện tại so với tương lai.\nPhương pháp định lượng: diễn giải lãi suất theo tỷ suất lợi nhuận yêu cầu, tỷ lệ chiết khấu hoặc\nchi phí cơ hội và giải thích lãi suất là tổng của rủi ro thực - lãi suất miễn phí và\nphí bù đắp cho các nhà đầu tư khi phải chịu các loại rủi ro khác nhau","qhtml":null},{"n":70,"q":"A portfolio has a mean return of 1.0% and a standard deviation of returns of 2.7%. If\nthe specified minimum target return is 1.0%, the sample target semideviation is","opts":["less than 2.7%.","equal to 2.7%.","greater than 2.7%."],"ans":"A","expl":"0,5\nA. Đúng vì độ lệch giảm giá mục tiêu = [(X - B)(n - 1)] , trong đó X là\nlợi nhuận định kỳ thấp hơn lợi nhuận mục tiêu, B là lợi nhuận mục tiêu và n là tổng số\ngiai đoạn. Vì mẫu có độ lệch chuẩn là 2,7% nên mẫu sẽ có các giá trị bên dưới và\ntrên giá trị trung bình là 1,0%. Vì độ lệch nhược điểm mục tiêu bỏ qua các độ lệch trên\ngiá trị trung bình nên nó sẽ nhỏ hơn độ lệch chuẩn.\nB. Không chính xác vì độ lệch giảm giá mục tiêu = [(X, - B)/(n - 1)], trong đó X là\nlợi nhuận định kỳ thấp hơn lợi nhuận mục tiêu, B là lợi nhuận mục tiêu và n là tổng số\ngiai đoạn. Vì mẫu có độ lệch chuẩn là 2,7% nên mẫu sẽ có các giá trị bên dưới và\ntrên giá trị trung bình là 1,0%. Vì độ lệch nhược điểm mục tiêu bỏ qua các độ lệch trên\ngiá trị trung bình nên nó sẽ nhỏ hơn độ lệch chuẩn.\n0,5\nC. Không chính xác vì độ lệch giảm giá mục tiêu = [(X - B)/(n - 1)] , trong đó X là\nlợi nhuận định kỳ thấp hơn lợi nhuận mục tiêu, B là lợi nhuận mục tiêu và n là tổng số\ngiai đoạn. Vì mẫu có độ lệch chuẩn là 2,7% nên mẫu sẽ có các giá trị bên dưới và\ntrên giá trị trung bình là 1,0%. Vì độ lệch mục tiêu giảm giá bỏ qua các độ lệch trên\ngiá trị trung bình nên nó sẽ nhỏ hơn độ lệch chuẩn.\nPhương pháp định lượng: tính toán, giải thích và đánh giá các biện pháp phân tán để giải quyết\nvấn đề đầu tư","qhtml":null,"explhtml":"<p><b>A. Đúng. </b>Độ lệch nhược điểm mục tiêu là</p><div class=\"kd\">$$\\sqrt{\\dfrac{\\sum (X_i-B)^2}{n-1}}$$</div><p>ở đâu\\(X_i\\)là lợi nhuận định kỳ dưới lợi nhuận mục tiêu\\(B\\)Và\\(n\\)là tổng số kỳ. Vì mẫu có độ lệch chuẩn là 2,7% với các giá trị cả dưới và trên giá trị trung bình là 1,0% và độ lệch nhược điểm mục tiêu bỏ qua các độ lệch trên mục tiêu nên nó phải nhỏ hơn độ lệch chuẩn.</p><p><b>B và C. Không chính xác.</b>Các tùy chọn này nêu không chính xác công thức độ lệch mục tiêu (bỏ qua cấu trúc độ lệch bình phương/căn bậc hai được hiển thị ở trên).</p><span class=\"los\">Phương pháp định lượng: tính toán, giải thích và đánh giá các biện pháp phân tán để giải quyết vấn đề đầu tư</span>"},{"n":71,"q":"An analyst discards the lowest 2.5% and the highest 2.5% of values in a sample, and\ncomputes the mean of the remaining 95% of values. The resulting mean is best described\nas a","opts":["trimmed mean.","harmonic mean.","winsorized mean."],"ans":"A","expl":"A. Đúng vì giá trị trung bình đã cắt bớt được tính bằng cách loại trừ một tỷ lệ phần trăm nhỏ\nđã nêu của các giá trị thấp nhất và cao nhất, sau đó tính giá trị trung bình số học của các giá trị\ncòn lại. Ví dụ: giá trị trung bình được cắt bớt 5% sẽ loại bỏ 2,5% thấp nhất và 2,5% giá trị cao nhất trong số\nvà tính giá trị trung bình của 95% giá trị còn lại.\nB. Không chính xác vì trung bình điều hòa là giá trị thu được bằng cách tính tổng các nghịch đảo\ncủa các quan sát - các số hạng có dạng 1/X - sau đó lấy trung bình tổng đó bằng cách chia cho\nsố quan sát n, và cuối cùng, lấy nghịch đảo của giá trị trung bình. Trung bình\nhài hòa có thể được xem như một loại trung bình có trọng số đặc biệt trong đó trọng số của một quan sát\ntỷ lệ nghịch với độ lớn của nó. Giá trị trung bình hài hòa không loại trừ hoặc thay thế\nbất kỳ giá trị ngoại lệ nào.\nC. Không chính xác vì giá trị trung bình được tối ưu hóa được tính bằng cách chỉ định tỷ lệ phần trăm đã nêu của\ngiá trị thấp nhất bằng một giá trị thấp được chỉ định và tỷ lệ phần trăm đã nêu của các giá trị\ncao nhất bằng một giá trị cao được chỉ định, sau đó nó tính giá trị trung bình từ dữ liệu\nđược trình bày lại. Ví dụ: giá trị trung bình được winorized 95% đặt 2,5% giá trị dưới cùng bằng giá trị\nbằng hoặc thấp hơn 2,5% của tất cả các giá trị (như sẽ thấy ngay sau đây, đây được gọi là\ngiá trị 'phân vị thứ 2,5') và 2,5% giá trị trên cùng bằng giá trị bằng hoặc thấp hơn\n97,5% trong tổng số các giá trị nằm (giá trị 'phân vị thứ 97,5').\nPhương pháp định lượng: tính toán, giải thích và đánh giá các thước đo về xu hướng trung tâm và\nvị trí để giải quyết vấn đề đầu tư","qhtml":null},{"n":72,"q":"If a stock's continuously compounded return is normally distributed, the future stock\nprice is most likely.","opts":["normally distributed.","uniformly distributed.","lognormally distributed."],"ans":"C","expl":"A. Không chính xác vì giá cổ phiếu sẽ được phân phối theo cách logic bình thường, không phải theo cách bình thường hoặc thống nhất.\nB. Không chính xác vì giá cổ phiếu sẽ được phân phối theo cách logic bình thường, không phải theo cách bình thường hoặc thống nhất.\nC. Đúng vì mối quan hệ giữa phân phối chuẩn và phân phối logarit chuẩn là nếu lợi nhuận gộp liên tục của một cổ phiếu\nđược phân phối chuẩn thì giá cổ phiếu trong tương lai\ncần được phân phối logarit chuẩn.\nPhương pháp định lượng: giải thích mối quan hệ giữa phân phối chuẩn và phân phối lognormal\nvà tại sao phân phối log chuẩn được sử dụng để lập mô hình giá tài sản khi sử dụng\nlợi nhuận tài sản gộp liên tục","qhtml":null},{"n":73,"q":"An analyst considers the population of all existing stocks and selects those where the\ncompany name starts with the letter P. This sampling procedure is most likely an example\nof","opts":["systematic sampling.","non-probability sampling.","two-stage cluster sampling"],"ans":"B","expl":"A. Không chính xác vì quy trình này không liên quan đến việc lựa chọn một cách có hệ thống mẫu\ntừ tổng thể. Với lấy mẫu có hệ thống, chúng tôi chọn mọi thành viên thứ k cho đến khi chúng tôi có mẫu\ncó kích thước mong muốn. Mẫu thu được từ quy trình này phải\ngần như ngẫu nhiên.\nB. Đúng vì quy trình lấy mẫu không mang lại cho mọi thành viên trong tổng thể\ncơ hội được chọn như nhau. Nó dựa trên sự thuận tiện của nhà phân tích. Lấy mẫu phi xác suất\nphụ thuộc vào các yếu tố khác ngoài việc xem xét xác suất, chẳng hạn như phán đoán\ncủa người lấy mẫu hoặc sự thuận tiện khi truy cập dữ liệu.\nC. Không chính xác vì việc lấy mẫu theo cụm yêu cầu phân chia hoặc phân loại quần thể\nthành các nhóm quần thể phụ, được gọi là cụm. Trong phương pháp này, tập hợp được chia thành\ncụm, mỗi cụm về cơ bản là một đại diện nhỏ của toàn bộ tập hợp. Sau đó\ncác cụm nhất định được chọn tổng thể bằng cách lấy mẫu ngẫu nhiên đơn giản. Nếu tất cả các thành viên trong\nmỗi cụm được lấy mẫu đều được lấy mẫu thì kế hoạch mẫu này được gọi là lấy mẫu cụm một giai đoạn\n. Nếu một mẫu phụ được chọn ngẫu nhiên từ mỗi cụm đã chọn thì kế hoạch\nđược gọi là lấy mẫu cụm hai giai đoạn. Chỉ chọn tên công ty bắt đầu bằng\nchữ P không phải là lấy mẫu cụm hai giai đoạn.\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự thuận tiện và lấy mẫu mang tính phán đoán cũng như những tác động của chúng đối với lỗi lấy mẫu trong\nvấn đề đầu tư","qhtml":null},{"n":74,"q":"A bank offers a savings account with a stated annual rate of 3% in the first year and\n5% in the second year. If returns are compounded quarterly and €90,000 is deposited in\nthe account at the beginning of the first year, the account's value at the end of the second\nyear is closest to","opts":["€97.200.","€97,335.","€97,455."],"ans":"C","expl":"A. Không chính xác vì nó không tính đến bất kỳ lãi kép nào: (3% + 5%) = 8%, 90.000 (1,08)\n= 97.200.\nB. Không chính xác vì nó không tính đến lãi gộp hàng quý, 90.000(1,03) (1,05) =\n97.335.\nC. Đúng vì lợi nhuận được gộp theo quý,\n90.000(1+ 0,03 )4(1+ 0,05 )4 = 97.455\n4 4\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận hàng năm và\nlợi nhuận gộp liên tục và mô tả cách sử dụng thích hợp của chúng","qhtml":null,"explhtml":"<p><b>C. Đúng. </b>Lợi nhuận được gộp theo quý:</p><div class=\"kd\">$$90{,}000\\left(1+\\dfrac{0.03}{4}\\right)^{4}\\left(1+\\dfrac{0.05}{4}\\right)^{4}=97{,}455$$</div><p><b>A. Không chính xác. </b>Điều này hoàn toàn bỏ qua việc gộp lãi:\\((3\\%+5\\%)=8\\%\\), Vì thế\\(90{,}000(1.08)=97{,}200\\).</p><p><b>B. Không chính xác. </b>Điều này bỏ qua việc gộp lãi hàng quý:\\(90{,}000(1.03)(1.05)=97{,}335\\).</p><span class=\"los\">Phương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận hàng năm và lợi nhuận gộp liên tục, đồng thời mô tả cách sử dụng thích hợp của chúng</span>"},{"n":75,"q":"The lognormal distribution:","opts":["is unbounded","is asymmetrical","has the same mean as that of its associated normal distribution."],"ans":"B","expl":"A. Không chính xác vì hai quan sát đáng chú ý nhất về phân phối lognormal\nlà nó bị giới hạn dưới 0 và bị lệch về bên phải\nB. Đúng vì hai quan sát đáng chú ý nhất về phân phối logic chuẩn\nlà nó bị giới hạn bên dưới bằng 0 và bị lệch sang phải (nó có đuôi dài bên phải), tức là\nkhông đối xứng.\nC. Không chính xác vì giống như phân phối chuẩn, phân phối logic chuẩn hoàn toàn\nđược mô tả bằng hai tham số. Không giống như các phân phối khác, phân phối logic chuẩn\nđược xác định theo các tham số của một phân phối khác. Hai tham số của phân phối logic chuẩn a\nlà giá trị trung bình và độ lệch chuẩn (hoặc phương sai) của phân phối chuẩn\ncó liên quan của nó. Hãy nhớ rằng, chúng ta phải theo dõi hai tập hợp phương tiện và độ lệch chuẩn\n(hoặc phương sai), giá trị trung bình và độ lệch chuẩn (hoặc phương sai) của phân bố chuẩn\ncó liên quan (đây là các tham số) và giá trị trung bình và độ lệch chuẩn (hoặc\nphương sai) của chính biến loga chuẩn. Giá trị trung bình của phân phối loga chuẩn không\nbằng giá trị trung bình của phân phối chuẩn liên quan.\nPhương pháp định lượng: giải thích mối quan hệ giữa phân phối chuẩn và lognormal\nvà lý do phân phối log chuẩn được sử dụng để lập mô hình giá tài sản khi sử dụng\nlợi nhuận tài sản gộp liên tục","qhtml":null},{"n":76,"q":"In simple linear regression analysis, the total sum of squares best describes:","opts":["a scatter plot.","the variation of the dependent variable.","a paired observation between variables."],"ans":"B","expl":"A. Không chính xác vì biểu đồ phân tán (hoặc biểu đồ phân tán) biểu thị hai biến thành hai\nkích thước. Sự biến thiên của Y [biến phụ thuộc] thường được gọi là tổng của\ntổng bình phương (SST) hoặc tổng bình phương.\nB. Đúng vì biến thể của Y [biến phụ thuộc] thường được gọi là\ntổng bình phương tổng (SST), hoặc tổng bình phương.\nC. Y [biến phụ thuộc] thường được gọi là tổng bình phương tổng (SST), hoặc\ntổng số bình phương.\nPhương pháp định lượng: mô tả mô hình hồi quy tuyến tính đơn giản, cách bình phương nhỏ nhất\ntiêu chí được sử dụng để ước tính các hệ số hồi quy và việc giải thích các hệ số này\nhệ số","qhtml":null},{"n":77,"q":"The process of representing ownership rights to physical assets on a distributed\nledger is referred to as","opts":["tokenization.","Initial coin offering","consensus mechanism"],"ans":"A","expl":"A. Đúng vì mã thông báo là quá trình thể hiện quyền sở hữu đối với tài sản\nvật lý trên chuỗi khối hoặc sổ cái phân tán.\nB. Không chính xác vì việc cung cấp tiền xu ban đầu (ICO) là một quy trình không được kiểm soát, trong đó\ncác công ty bán mã thông báo tiền điện tử của họ cho các nhà đầu tư để đổi lấy tiền định danh hoặc một loại tiền khác\nđã thỏa thuận về tiền điện tử.\nC. Không chính xác vì cơ chế đồng thuận được sử dụng để xác thực các giao dịch mới trong chuỗi khối\n; nó không phải là quá trình thể hiện quyền sở hữu đối với tài sản vật chất. Các giao dịch\nmới chỉ được chèn vào chuỗi sau khi xác thực thông qua cơ chế đồng thuận trong\nmà các thành viên được ủy quyền đồng ý về giao dịch và đơn đặt hàng hoặc lịch sử trước đó trong\ncác giao dịch trước đó đã xảy ra. Cơ chế đồng thuận được sử dụng để xác minh một giao dịch\nbao gồm một vấn đề về mật mã phải được giải quyết bởi một số máy tính trên\nmạng (được gọi là công cụ khai thác) mỗi khi giao dịch diễn ra.\nĐầu tư thay thế: mô tả các ứng dụng tài chính của công nghệ sổ cái phân tán","qhtml":null},{"n":78,"q":"A pension fund needs to pay a lump sum $10,000,000 to its participants in 15 years. If\nthe fund is expected to earn 5% per year compounded semi-annually, the amount needed\ntoday to meet its liability in 15 years is closest to","opts":["$4,767,427.","$4,810,171.","$4,892,771."],"ans":"A","expl":"A. Đúng vì sử dụng phương trình PV=FV (1 + r /m) - Nm\nN s\nở đâu\nm = số kỳ tính lãi trong năm\nr = lãi suất niêm yết hàng năm\nN = số năm\nchúng tôi tính toán PV = 10.000.000 USD × (1 + 0,05/2) - 15x2 = 4.767.426,85 USD ~ 4.767.427 USD.\nKhi áp dụng phương trình, chúng ta sử dụng lãi suất định kỳ (trong trường hợp này là lãi suất nửa năm) và\nsố kỳ thích hợp với lãi kép nửa năm một lần.\nGiải pháp thay thế sử dụng máy tính tài chính ở chế độ END:\nN = 30; I/Y= 0,025; PMT = 0; FV = 10.000.000; PV CPT = $4.767.426,852 ~ $4.767.427\nB. Không chính xác vì khi tính giá trị hiện tại, nó sử dụng 5% thay vì EAR để có được\n10.000.000 USD x (1,05) - 15= 4.810.170,98 USD ~ 4.810.171 USD.\nC. Không chính xác vì trong phương trình giá trị hiện tại, nó tính lãi kép không đúng\n(nhân với 2 thay vì chia) và không sử dụng số tiết thích hợp cho\nghép lãi nửa năm một lần (chia cho 2 thay vì nhân 2); không chính xác\ntính PV = 10.000.000 × (1 + 0,05x2) - 15/2= $4.892.770,68 ~ $4.892.771.\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận hàng năm và\nlợi nhuận gộp liên tục và mô tả cách sử dụng thích hợp của chúng","qhtml":null},{"n":79,"q":"Which of the following statements about distributed ledger technology is most\naccurate?","opts":["Bitcoin uses a permissioned network.","Miners execute smart contracts in the blockchain.","Tokenization can streamline the transfer of ownership of physical assets."],"ans":"C","expl":"A. Không chính xác vì bitcoin là một ứng dụng phổ biến của mạng mở không cần cấp phép. .\nB. Không chính xác vì người khai thác xác minh các giao dịch trong chuỗi khối nên họ không thực hiện các hợp đồng\nthông minh. Cơ chế đồng thuận được sử dụng để xác minh một giao dịch bao gồm một vấn đề mật mã\nphải được giải quyết bởi một số máy tính trên mạng (được gọi là máy khai thác) mỗi\nthời gian giao dịch diễn ra. Mặt khác, hợp đồng thông minh là các chương trình máy tính\ntự thực thi trên cơ sở các điều khoản và điều kiện được chỉ định trước được các bên\nđồng ý trong hợp đồng.\nC. Đúng vì thông qua mã thông báo, quy trình thể hiện quyền sở hữu đối với\ntài sản vật chất trên chuỗi khối hoặc sổ cái phân tán, DLT [công nghệ sổ cái phân tán] có\nkhả năng hợp lý hóa quy trình này bằng cách tạo một bản ghi quyền sở hữu kỹ thuật số duy nhất với\nđể xác minh quyền sở hữu và tính xác thực, bao gồm tất cả hoạt động lịch sử.\nĐầu tư thay thế: mô tả các ứng dụng tài chính của sổ cái phân tán công nghệ","qhtml":null},{"n":80,"q":"Which of the following is an underlying assumption of the simple linear regression\nmodel? The regression residuals:","opts":["are normally distributed.","have high correlations across observations","have different variances across observations"],"ans":"A","expl":"A. Đúng vì chúng ta cần đưa ra bốn giả định chính sau đây để có thể rút ra\nkết luận hợp lệ từ một mô hình hồi quy tuyến tính đơn giản. Một trong những giả định đó là\nphần dư hồi quy có phân phối chuẩn.\nB. Không chính xác vì một trong bốn giả định cơ bản cho hồi quy tuyến tính đơn giản là\nTính độc lập: Các quan sát, cặp Y và X, độc lập với nhau. Điều này\nngụ ý rằng phần dư hồi quy không tương quan [và không có mối tương quan cao] trên\nquan sát.\nC. Không chính xác vì một trong bốn giả định cơ bản cho hồi quy tuyến tính đơn giản là\nTính đồng nhất: Phương sai của phần dư hồi quy là như nhau [và không khác nhau]\nđối với tất cả quan sát.\nPhương pháp định lượng: giải thích các giả định cơ bản của mô hình hồi quy tuyến tính đơn giản\nvà mô tả phần dư và biểu đồ phần dư cho biết liệu những giả định này có thể\nđã xảy ra như thế nào vi phạm","qhtml":null},{"n":81,"q":"For a set of return observations, the coefficient of variation is best described as a\nmeasure of","opts":["risk per unit of mean return.","mean excess return earned per unit of risk","average absolute deviation around the mean return"],"ans":"A","expl":"A. Đúng vì khi quan sát trả về, hệ số biến thiên đo\nmức độ rủi ro (độ lệch chuẩn) trên mỗi đơn vị lợi nhuận trung bình.\nB. Không chính xác vì nó mô tả tỷ lệ Sharpe chứ không phải hệ số biến thiên. Tỷ lệ\nSharpe đo lường phần thưởng, xét về mặt lợi nhuận vượt quá trung bình, trên mỗi đơn vị rủi ro, trong đó\nlợi nhuận vượt mức trung bình được định nghĩa là tỷ suất lợi nhuận trung bình vượt quá lãi suất phi rủi ro.\nC. Không chính xác vì nó mô tả độ lệch tuyệt đối trung bình (MAD), chứ không phải hệ số của biến thể\n. MAD được định nghĩa là giá trị trung bình của các giá trị tuyệt đối của độ lệch so với\ntrung bình mẫu.\nPhương pháp định lượng: tính toán, diễn giải và đánh giá các biện pháp phân tán để giải quyết\nvấn đề đầu tư","qhtml":null},{"n":82,"q":"An analyst performs a hypothesis test concerning the difference between the mean\nreturns of two portfolios, assuming normally distributed populations with unknown but\nequal variances. If the analyst decides to change the hypothesized difference in mean\nreturns from 0% to 1%, which of the following will change?","opts":["The value of the test statistic","The degrees of freedom used in the test","The pooled estimate of the common population variance"],"ans":"A","expl":"A. Đúng vì khi các phương sai của tổng thể chưa biết bằng nhau, thì phép thử t dựa trên\n0,5\nmẫu ngẫu nhiên độc lập được cho bởi t = (X1 - X2 - μ₁ + µ₂)/(S ²/n + S ²/n ) , trong đó Sp2\np 1 p 2\nlà công cụ ước tính gộp của phương sai chung. Do đó, sự thay đổi về chênh lệch giả thuyết\nµ - µ sẽ thay đổi giá trị của thống kê kiểm tra.\n1 2\nB. Không chính xác vì số bậc tự do là n, + n₂ - 2 và nó độc lập\nvới sai phân giả thuyết µ - µ .\n1 2\nC. Không chính xác vì s 2 = ((n - 1)s ² + (n - 1)s ²)/(n + n₂ - 2) là công cụ ước tính gộp của\np 1 1 2 2 1\nphương sai chung. Nó độc lập với sự khác biệt được giả thuyết µ - µ .\n1 2\nPhương pháp định lượng: xây dựng các kiểm định giả thuyết và xác định\nmức ý nghĩa thống kê của chúng, các lỗi Loại I và Loại II liên quan cũng như sức mạnh của kiểm nghiệm cho trước\nmức ý nghĩa","qhtml":null,"explhtml":"<p><b>A. Đúng. </b>Khi các phương sai tổng thể chưa biết được giả định bằng nhau, phép thử t dựa trên các mẫu ngẫu nhiên độc lập là</p><div class=\"kd\">$$t=\\dfrac{(\\bar X_1-\\bar X_2)-(\\mu_1-\\mu_2)}{\\left(\\dfrac{s_p^2}{n_1}+\\dfrac{s_p^2}{n_2}\\right)^{1/2}}$$</div><p>Ở đâu\\(s_p^2\\)là ước lượng gộp của phương sai chung. Sự thay đổi về sự khác biệt giả định\\(\\mu_1-\\mu_2\\)thay đổi giá trị của thống kê kiểm tra.</p><p><b>B. Không chính xác. </b>Số bậc tự do là\\(n_1+n_2-2\\), độc lập với sự khác biệt giả thuyết\\(\\mu_1-\\mu_2\\).</p><p><b>C. Không chính xác. </b>Công cụ ước tính gộp của phương sai chung,\\(s_p^2=\\dfrac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}\\), độc lập với sự khác biệt giả thuyết\\(\\mu_1-\\mu_2\\).</p><span class=\"los\">Phương pháp định lượng: xây dựng các thử nghiệm giả thuyết và xác định ý nghĩa thống kê của chúng, các lỗi Loại I và Loại II liên quan cũng như độ mạnh của thử nghiệm với mức ý nghĩa nhất định</span>"},{"n":83,"q":"An analyst tabulates the ranks of four paired observations of random variables X and Y as follows:\nObservation | Rank of X | Rank of Y\n1 — 1 — 2\n2 — 2 — 3\n3 — 3 — 4\n4 — 4 — 1\nThe Spearman rank correlation coefficient between X and Y is closest to:","opts":["-0.2.","0.8.","1.0."],"ans":"A","expl":"A. Đúng vì với n là cỡ mẫu, mối tương quan xếp hạng Spearman được cho bởi:\nr = 1 - (6 Σd2)/(n(n2 – 1)) = 1 − 6(12)/(4(42 - 1)) = 1 - 6/5= - 1/5 = - 0,2, trong đó tổng của\ns i\nbình phương khác biệt\ntrong cấp bậc Σd2 = (2 - 1)2 + (3 - 2)2 + (4 - 3)2 + (1 - 4)2 = 1 + 1 + 1 + 9 = 12.\nB. Không chính xác vì câu trả lời này được tính bằng cách bỏ sót bội số (của\ntổng độ lệch bình phương) của 6, tạo ra mối tương quan xếp hạng là 1 - 1/5 = 4/5 = 0,8.\nC. Không chính xác vì thay vì sử dụng tổng chênh lệch bình phương ở cấp bậc, câu trả lời này\nsử dụng sai tổng các chênh lệch không bình phương ở cấp bậc (mà theo định nghĩa,
