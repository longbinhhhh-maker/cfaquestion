<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  .expl-rich{white-space:normal}
  .expl-rich p{margin:.55em 0}
  .expl-rich p:first-child{margin-top:0}
  .expl-rich p:last-child{margin-bottom:0}
  .expl-rich .los{display:block;margin-top:10px;color:var(--muted);font-size:13px}
  .expl-rich .katex{font-size:1.04em}
  .expl-rich .kd{margin:6px 0;overflow-x:auto;overflow-y:hidden}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following factors is not used in the calculation of a confidence interval?","opts":["Point estimate","Sampling error","Reliability factor"],"ans":"B","expl":"A. Không chính xác vì ước tính điểm được sử dụng để tính khoảng tin cậy; Điểm\nước tính ± Hệ số tin cậy x Sai số chuẩn = khoảng tin cậy.\nB. Đúng vì khoảng tin cậy cho một tham số được tính như sau: Ước tính điểm ±\nHệ số tin cậy x Sai số chuẩn, trong đó sai số chuẩn là sai số chuẩn của thống kê mẫu\ncung cấp ước tính điểm. Do đó, lỗi lấy mẫu không phải là một phần của phép tính.\nLỗi lấy mẫu là sự chênh lệch giữa giá trị quan sát được của một thống kê và số lượng mà nó\ndự kiến ​​ước tính. Đó là do lỗi lấy mẫu mà khoảng tin cậy được sử dụng.\nC. Không chính xác vì hệ số độ tin cậy được sử dụng để tính khoảng tin cậy, Ước tính điểm\nHệ số độ tin cậy x Sai số chuẩn = khoảng tin cậy.\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự thuận tiện và lấy mẫu phán đoán cũng như những tác động của chúng đối với lỗi lấy mẫu trong một\nvấn đề đầu tư","qhtml":null},{"n":2,"q":"An analyst performs a simple linear regression of a stock's monthly return on the\nmonthly return of a market index (both in %) and gathers the following information:\n• Estimated slope 1.0\n• Estimated intercept 1.2%\n• Standard error of the forecast 1.4%\n• Critical t-values at a 5% significance level 2.032\nThe 95% prediction interval for the stock's monthly return, given that the forecasted\nmonthly return on the index is 3.5%, is closest to:","opts":["0.7% to 6.3%.","1.9% to 7.5%.","3.3% to 6.1%."],"ans":"B","expl":"A. Không chính xác vì nó sử dụng giá trị dự báo của biến độc lập để xây dựng\nkhoảng dự đoán thay vì giá trị dự đoán của biến phụ thuộc. Trong các từ\nkhác, nó giả định rằng khoảng được cho bởi 𝑋 ±𝑡 𝑆 :3.5 %×1.4% ≈\n𝑓 𝑐𝑟𝑖𝑡𝑖𝑐𝑎𝑙 𝑓𝑜𝑟 𝑎/2 𝑡\n(0,7%, 6,3%).\nB. Đúng vì giá trị dự báo của biến phụ thuộc, 𝑌 , được xác định bằng cách sử dụng\n𝑓\nđiểm chặn và độ dốc ước tính, cũng như biến độc lập được mong đợi hoặc dự báo,\n𝑋 : 𝑌 = 𝑏 + 𝐵 𝑋 \" trong đó 𝑏 và 𝑏 , là điểm chặn ước tính và hệ số độ dốc,\n𝑓 𝑓 0 𝑓 𝑓 0 1\ntương ứng, 𝑌 = 1,2% + 1,0 x 3,5% = 4,7%.\n𝑓\nTiếp theo, khoảng dự đoán là 𝑋 ±𝑡 𝑆 \" trong đó 𝑆 , biểu thị sai số chuẩn\n𝑓 𝑐𝑟𝑖𝑡𝑖𝑐𝑎𝑙 𝑓𝑜𝑟 𝑎/2 𝑡 𝑓\ncủa dự báo. Do đó, khoảng dự đoán được tính bằng: 4,7% ± 1,4% x 2,032 ≈ (1,9%,\n7,5%).\nC. Không chính xác vì nó bỏ qua các giá trị t quan trọng khi xây dựng khoảng dự đoán\n. Nói cách khác, nó giả sử rằng khoảng được cho bởi 𝑌 ± 𝑠 ; 4,7% ± 1,4% (3,3%,\n𝑓 𝑓\n6,1%).\nPhương pháp định lượng: tính toán và diễn giải giá trị dự đoán cho biến\nphụ thuộc và khoảng dự đoán cho biến đó, dựa trên mô hình hồi quy tuyến tính ước tính và giá trị\ncho biến độc lập biến","qhtml":null},{"n":3,"q":"An investor purchases a stock for $100. Immediately after receiving a dividend of $7,\nthe investor sells the stock for $107. The holding period return of the investment is closest\nto","opts":["0%","7%","14%,"],"ans":"C","expl":"A. Không chính xác vì nó trừ cổ tức không chính xác thay vì cộng nó và do đó\ntính HPR = ($107 - $100 - $7)/$100= $0/$100 = 0%. Kết quả tương tự sẽ đạt được nếu\nlợi nhuận trong thời gian nắm giữ được tính như R = ($100 - $107 + $7)/$107= $0/S107 = 0%.\nB. Không chính xác vì nó bỏ qua cổ tức và tính R = ($107 - $100)/$100 = $7/$100 =\n7%. Đây cũng là tỷ lệ cổ tức nhận được trên khoản đầu tư ban đầu, $7/$100 = 7%.\nC. Đúng vì lợi nhuận trong thời gian nắm giữ là lợi nhuận kiếm được từ việc nắm giữ một tài sản trong một khoảng thời gian nhất định. Lợi nhuận này có thể được khái quát hóa và hiển thị dưới dạng biểu thức\ntrong đó P là giá và I là thu nhập: R = (P₁ - Po + D, VP, Do đó, R = ($107 -\n$100 + $7)/$100 = $14/$100 = 14%.\nPhương pháp định lượng: tính toán và diễn giải các thước đo lợi nhuận chính và mô tả\ncách sử dụng phù hợp","qhtml":null},{"n":4,"q":"For a sample of 50 observations, in which of the following situations is a nonparametric\ntest least likely to be appropriate? The data","opts":["contain outliers.","are given in ranks.","come from a population with a lognormal distribution."],"ans":"C","expl":"A. Không chính xác vì chúng tôi chủ yếu sử dụng các quy trình không tham số trong bốn trường hợp: (1) khi\ndữ liệu chúng tôi sử dụng không đáp ứng các giả định về phân phối, (2) khi có các giá trị ngoại lệ, (3)\nkhi dữ liệu được cung cấp theo thứ hạng hoặc sử dụng thang đo thứ tự hoặc (4) khi các giả thuyết mà chúng tôi đang giải quyết\nkhông liên quan đến một tham số. Đây là một trong những tình huống (tình huống 2) trong đó\nthử nghiệm phi tham số sẽ phù hợp.\nB. Không chính xác vì chúng tôi chủ yếu sử dụng các quy trình không tham số trong bốn trường hợp: (1) khi\ndữ liệu chúng tôi sử dụng không đáp ứng các giả định về phân phối, (2) khi có các giá trị ngoại lệ, (3)\nkhi dữ liệu được cung cấp theo thứ hạng hoặc sử dụng thang đo thứ tự hoặc (4) khi các giả thuyết mà chúng tôi đang giải quyết\nkhông liên quan đến một tham số. Đây là một trong những tình huống (tình huống 3) trong đó\nthử nghiệm phi tham số sẽ phù hợp.\nC. Đúng vì kiểm tra không tham số sẽ ít phù hợp hơn so với các câu trả lời\nkhác vì trong trường hợp này có thể sử dụng kiểm tra tham số. Chúng tôi có thể muốn kiểm tra một giả thuyết\nliên quan đến giá trị trung bình của tổng thể nhưng tin rằng cả các kiểm định phân bố t - và z đều không phù hợp\nvì mẫu nhỏ và có thể đến từ một tổng thể được phân bố không - thông thường\n. Trong trường hợp đó, chúng tôi có thể sử dụng thử nghiệm phi tham số. Trong trường hợp của chúng tôi, mẫu dữ liệu\ncó dung lượng lớn, do đó, có thể sử dụng thử nghiệm tham số thay thế\nPhương pháp định lượng: so sánh và đối chiếu các thử nghiệm tham số và không tham số, đồng thời\nmô tả các tình huống trong đó mỗi thử nghiệm là loại thử nghiệm phù hợp hơn","qhtml":null},{"n":5,"q":"Which of the following test statistics is most appropriate for a hypothesis test\nconcerning the mean difference between two normally distributed populations?","opts":["t-statistic","F-statistic","Chi-square statistic"],"ans":"A","expl":"A. Đúng vì để kiểm tra sự khác biệt trung bình (các quần thể được phân phối bình thường,\nphương sai của quần thể không xác định)... khi chúng tôi có dữ liệu bao gồm các quan sát được ghép nối\ntừ các mẫu được tạo ra bởi các quần thể được phân phối thông thường với phương sai không xác định, thử nghiệm t -\ndựa trên t = (d - d )/s, với n - 1 bậc tự do, trong đó n là số cặp\n0\nquan sát, d là chênh lệch trung bình mẫu.... và s, là sai số chuẩn của d\nB. Không chính xác vì đối với Kiểm tra sự khác biệt trung bình (Các quần thể được phân phối thông thường,\nCác phương sai của quần thể không xác định)... khi chúng tôi có dữ liệu bao gồm các quan sát được ghép đôi\ntừ các mẫu được tạo ra bởi các quần thể có phân bố thông thường với phương sai không xác định, thử nghiệm t -\ndựa trên t = (d - do)/s với n - 1 bậc tự do, trong đó n là số cặp\nquan sát, d là chênh lệch trung bình mẫu... và s là sai số chuẩn của d. F - test\ncó thể thích hợp cho các Thử nghiệm liên quan đến sự khác biệt giữa phương sai của hai\nQuần thể.\nC. Không chính xác vì đối với Kiểm tra sự khác biệt trung bình (Các quần thể được phân phối bình thường,\nCác phương sai của quần thể không xác định)... khi chúng tôi có dữ liệu bao gồm các quan sát được ghép đôi\ntừ các mẫu được tạo ra bởi các quần thể có phân bố thông thường với các phương sai không xác định, thử nghiệm t -\ndựa trên t = (d - Hdo)/s, với n - 1 bậc tự do, trong đó n là số\nquan sát được ghép nối, d là chênh lệch trung bình mẫu.... và s, là sai số chuẩn của d. Trong\ncác thử nghiệm liên quan đến phương sai của một tổng thể phân bố chuẩn [không phải sự khác biệt trung bình\n giữa hai quần thể], chúng tôi sử dụng thống kê kiểm tra chi - bình phương.\nPhương pháp định lượng: xây dựng các kiểm tra giả thuyết và xác định ý nghĩa thống kê\ncủa chúng, các lỗi Loại I và Loại II liên quan cũng như sức mạnh của thử nghiệm được đưa ra a\nmức ý nghĩa","qhtml":null,"explhtml":"<p><b>A. Đúng. </b>Đối với việc kiểm tra sự khác biệt trung bình (các quần thể có phân bố chuẩn, các phương sai chưa biết) với các quan sát theo cặp, thống kê kiểm tra là</p><div class=\"kd\">$$t=\\dfrac{\\bar d - d_0}{s_{\\bar d}}$$</div><p>với\\(n-1\\)bậc tự do, ở đâu\\(n\\)là số quan sát được ghép đôi,\\(\\bar d\\)là sự khác biệt trung bình mẫu, và\\(s_{\\bar d}\\)là sai số chuẩn của\\(\\bar d\\).</p><p><b>B. Không chính xác. </b>T-test so sánh theo cặp ở trên được áp dụng ở đây. Kiểm định F thích hợp cho các kiểm định liên quan đến sự khác biệt giữa phương sai của hai tổng thể, chứ không phải sự khác biệt trung bình.</p><p><b>C. Không chính xác. </b>T-test so sánh theo cặp ở trên được áp dụng ở đây. Thống kê kiểm tra chi bình phương được sử dụng trong các thử nghiệm liên quan đến phương sai của một quần thể có phân phối chuẩn - không phải là sự khác biệt trung bình giữa hai quần thể.</p><span class=\"los\">Phương pháp định lượng: xây dựng các thử nghiệm giả thuyết và xác định ý nghĩa thống kê của chúng, các lỗi Loại I và Loại II liên quan cũng như độ mạnh của thử nghiệm với mức ý nghĩa nhất định</span>"},{"n":6,"q":"An asset earns 13.1% over a 16-month period. The asset's annualized compound\nrate of return is closest to:","opts":["9.3%.","9.7%","9.8%"],"ans":"B","expl":"A. Không chính xác vì đó là tỷ suất lợi nhuận gộp mỗi tháng nhân 12; [(1 +\n0,13100)(1/16) - 1] × 12 =0,0077236 x 12 = 0,09268~ 9,3%. Đây cũng là trung bình hình học\nlợi nhuận mỗi tháng nhân với 12.\nB. Đúng vì đã đưa ra một phương trình tổng quát để tính lợi nhuận hàng năm, trong đó c là số\nsố kỳ trong một năm. Trong một quý, c = 4 và trong một tháng, c = 12: r = (1 + r )c - 1. Đó\nKỳ hạn hàng năm\nlà, trong 16 tháng, c = 16/12 = 0,75 và lợi nhuận hàng năm là (1 + 0,13100)0,75 - 1 =\n1,09672 - 1=0,09672 ~ 9,7%.\nC. Không chính xác vì nó là lợi nhuận trung bình số học mỗi tháng nhân 12; (0,13100/16) x 12\n= 0,0081875 x 12 = 0,09825~9,8%.\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận chính và mô tả\ncách sử dụng phù hợp","qhtml":null},{"n":7,"q":"Which of the following statements is most accurate? Cryptocurrencies:","opts":["exhibit low volatility","have no limits on the total amount of currency that may be issued.","allow transactions between parties without the need for an intermediary."],"ans":"C","expl":"A. Không chính xác vì điều quan trọng cần lưu ý là nhiều loại tiền điện tử đã trải qua\nmức độ biến động giá cao. Việc thiếu các nguyên tắc cơ bản rõ ràng làm cơ sở cho các loại tiền tệ này\nđã góp phần vào sự biến động của chúng.\nB. Không chính xác vì nhiều loại tiền điện tử có giới hạn tự áp đặt đối với tổng số tiền\nloại tiền mà chúng có thể phát hành.\nC. Đúng vì tiền điện tử, còn được gọi là tiền kỹ thuật số, hoạt động dưới dạng tiền điện tử\nvà cho phép giao dịch gần thời gian thực giữa các bên mà không cần\ntrung gian, chẳng hạn như ngân hàng.\nĐầu tư thay thế: mô tả các ứng dụng tài chính của công nghệ sổ cái phân tán","qhtml":null},{"n":8,"q":"A company estimates its revenue will be 50% higher than today in four years' time. The\ncompound annual growth rate is closest to:","opts":["10.7%.","11.8%.","12.5%."],"ans":"A","expl":"A. Đúng vì tốc độ tăng trưởng (g) được tính như g = (FV/PV)/N - 1, trong đó FV là giá trị\ntương lai, PV là giá trị hiện tại và N là số kỳ. Ở đây, g = (1,5/1)1/4 - 1 =\n0,10668~ 10,7%.\nB. Không chính xác vì nó được tính như In(1 + 0,5/4) - 1= In(1,125) - 1=0,11778 ~11,8%.\nC. Không chính xác vì nó được tính như sau: 50%/4 = 12,5%.\nPhương pháp định lượng: tính toán và diễn giải các thước đo lợi nhuận hàng năm và\nlợi nhuận gộp liên tục và mô tả cách sử dụng thích hợp của chúng","qhtml":null},{"n":9,"q":"An investor purchased a stock for $450 and then sold the stock immediately after\nreceiving a dividend of $2. If the holding period return is a loss of 10.2%, the investor sold\nthe stock at a price closest to:","opts":["$402","$404.","$406."],"ans":"A","expl":null,"qhtml":null},{"n":10,"q":"An investor considers the following certificates of deposit (CDs) available for purchase\nat face value:\nCD Interest Rate\n• 1 2.2%\n• 2 3.3%\n• 3 4.4%\nIf each CD has the same maturity and default risk, the opportunity cost of investing in CD 1\nis closest to","opts":["0.0%.","1.1%.","2.26."],"ans":"C","expl":"A. Không chính xác vì nhà đầu tư đang bỏ qua tỷ suất lợi nhuận cao hơn bằng cách đầu tư vào\nchứng khoán có lợi nhuận thấp nhất.\nB. Không chính xác vì 1,1% không phải là mức cao nhất mà nhà đầu tư đã đề cập trước đó; tuy nhiên, đó là sự khác biệt\nnếu sử dụng không chính xác lợi nhuận trung bình của ba chứng khoán.\nC. Đúng vì cả ba chứng khoán đều có kỳ hạn và rủi ro vỡ nợ như nhau nên\nnhà đầu tư sẽ bỏ qua 2,2% (4,4% - 2,2%) bằng cách đầu tư vào CD 1 thay vì đầu tư vào CD 3.\nPhương pháp định lượng: giải thích lãi suất là tỷ suất lợi nhuận yêu cầu, lãi suất chiết khấu hoặc\nchi phí cơ hội và giải thích lãi suất là tổng của lãi suất phi rủi ro thực và\nphí bảo hiểm đền bù cho các nhà đầu tư khi phải chịu các loại rủi ro riêng biệt","qhtml":null},{"n":11,"q":"Which of the following statements is most accurate with respect to the widespread\nadoption of algorithmic trading in financial markets?","opts":["The need for low-latency networks has grown.","Markets have become less fragmented in terms of trading venues.","Average trade size has increased as algorithmic trading is used to execute large institutional orders"],"ans":"A","expl":"A. Đúng vì giao dịch thuật toán yêu cầu quyền truy cập vào các mạng có độ trễ thấp và với\nviệc áp dụng giao dịch thuật toán trên diện rộng, nhu cầu về các mạng có độ trễ thấp đã\nhệ thống có độ trễ thấp - các hệ thống hoạt động trên các mạng truyền đạt khối lượng dữ liệu\ncao với độ trễ (độ trễ) tối thiểu - rất cần thiết cho các ứng dụng giao dịch tự động\nđưa ra quyết định dựa trên giá cả theo thời gian thực và các sự kiện thị trường. Ngược lại,\nhệ thống có độ trễ cao không yêu cầu quyền truy cập vào dữ liệu và tính toán theo thời gian thực. Giao dịch tần suất cao -\nlà một hình thức giao dịch theo thuật toán sử dụng số lượng lớn\ndữ liệu tài chính chi tiết (ví dụ: dữ liệu đánh dấu) để tự động thực hiện giao dịch khi đáp ứng một số điều kiện\n. Các giao dịch được thực hiện trên các mạng tốc độ cực cao, độ trễ thấp trong\nphần của giây.\nB. Không chính xác vì thị trường tài chính toàn cầu đã trải qua sự thay đổi đáng kể do thị trường\nđã phân mảnh thành nhiều điểm đến giao dịch bao gồm các sàn giao dịch điện tử,\nhệ thống giao dịch thay thế và cái gọi là vùng tối và quy mô giao dịch trung bình đã giảm.\nC. Không chính xác vì mặc dù giao dịch thuật toán ngày càng được sử dụng để thực hiện các lệnh tổ chức\nlớn, nhưng nó lại chia các lệnh thành các phần nhỏ hơn và thực hiện trên các sàn giao dịch\nvà địa điểm giao dịch khác nhau. Thị trường tài chính toàn cầu đã trải qua sự thay đổi đáng kể\nkhi thị trường bị phân mảnh thành nhiều điểm đến giao dịch bao gồm sàn giao dịch\nđiện tử, hệ thống giao dịch thay thế và cái gọi là vùng tối và quy mô giao dịch trung bình\nđã giảm.\nPhương pháp định lượng: mô tả các ứng dụng của Dữ liệu lớn và Khoa học dữ liệu vào quản lý đầu tư","qhtml":null},{"n":12,"q":"The failure of machine learning models to accurately predict outcomes can be the\nresult of","opts":["overfitting, but not underfitting.","underfitting, but not overfitting.","either overfitting or underfitting."],"ans":"C","expl":"A. Không chính xác vì trang bị không đủ cũng dẫn đến vấn đề này. Các mô hình không được trang bị đầy đủ sẽ\nthường không thể khám phá đầy đủ các mẫu làm nền tảng cho dữ liệu\" và do đó có thể không\ndự đoán chính xác kết quả. ML bao gồm việc chia tập dữ liệu thành ba tập con riêng biệt: tập dữ liệu huấn luyện\n, tập dữ liệu xác thực và tập dữ liệu thử nghiệm. Sau khi một thuật toán đã được huấn luyện, xác thực và kiểm tra, mô hình ML có thể được sử dụng để dự đoán kết quả dựa trên trên\ncác tập dữ liệu khác. Các mô hình ML cũng yêu cầu lượng dữ liệu đủ lớn và có thể không\nhoạt động tốt khi không có đủ dữ liệu để huấn luyện và xác thực mô hình.\nB. Không chính xác vì việc trang bị quá mức cũng dẫn đến vấn đề này. complex.\nC. Đúng vì mô hình ML được trang bị quá mức sẽ không thể dự đoán chính xác\nkết quả bằng cách sử dụng một tập dữ liệu khác và có thể quá phức tạp. Ngoài ra, các mô hình không được trang bị đầy đủ sẽ\nthường không thể khám phá đầy đủ các mẫu làm nền tảng cho dữ liệu và do đó có thể không thể\ndự đoán chính xác kết quả.\nĐịnh lượng. Phương pháp: mô tả Dữ liệu lớn, trí tuệ nhân tạo và học máy","qhtml":null},{"n":13,"q":"An investment pays $1,000 annually for five years, with the first payment occurring\nthree years from today. If the discount rate is 6% compounded annually, the present value\nof the investment today is closest to","opts":["$3,537.","$3,749.","$4,212"],"ans":"B","expl":"A. Không chính xác vì nó ghi nhận khoản đầu tư là một niên kim bị trì hoãn, nhưng nó sai\ngiả định rằng khoản thanh toán niên kim đầu tiên cho một niên kim thông thường sẽ bắt đầu ngay lập tức thay vì\nmột kỳ sau. Do đó, nó tính giá trị hiện tại của một niên kim thông thường ở mức t = 3 là PV2\n=A[1 - 1/(1 + r)N]/r= $1.000 × [1 - 1/(1 + 0,06)5/0,06 = $4,212,36.\nSử dụng công thức giá trị hiện tại cho một khoản tiền gộp để mang lại dòng tiền duy nhất từ t = 3 đến 1=\n0, PV2 = FV (1 + r) N = $4.212,36 (1 + 0,06) - 3= $3.536,78 ~ $3.537.\nN\nGiải pháp máy tính:\n(1) Chế độ KẾT THÚC: N = 5; 1= 6%, PMT= - 1.000; FV = 0; giải cho PV = 4.212,36.\n(1) chế độ END; N = 3; 1= 6%; PMT = 0; FV = 4.212,36; giải cho PV = 3.536,78 ~3.537.\nB. Đúng vì bằng cách vẽ đường thời gian, khoản đầu tư được ghi nhận là niên kim bị trì hoãn\nvới khoản thanh toán đầu tiên bắt đầu từ t=3.\nBước đầu tiên là tính giá trị hiện tại của một niên kim thông thường tại t = 2 vì\nthanh toán niên kim đầu tiên là\nsau đó cách đó một khoảng thời gian, vì PV2 =A[1 - 1/(1 + r)N] / r = $1.000 x [1 - 1/(1 + 0,06)5/0,06 =\n$4.212,36.\nSử dụng công thức giá trị hiện tại cho một lần để đưa dòng tiền duy nhất từ t = 2 đến\nt=0, PV=FVM(1 + r) -\nN = $4.212,36 (1 + 0,06) - 2= $3.748,99 ~ $3.749.\nGiải pháp máy tính:\n(1) chế độ END; N=5; 1= 6%; PMT= - 1.000; FV = 0; giải cho PV = 4.212,36.\n(2) chế độ END; N = 2; 1= 6%; PMT = 0; FV = 4.212,36, giải cho PV = 3.748,99 - 3.749.\nPhương pháp thứ hai để tính giá trị hiện tại của khoản đầu tư là ghi nhận nó là một\nniên kim đến hạn với khoản thanh toán đầu tiên ở mức f = 3, sau đó chiết khấu trở lại ba kỳ bằng cách sử dụng\ncông thức giá trị hiện tại cho một khoản tiền một lần. PV3= {A[1 − 1/(1 + r)N]/r}(1 + r) = $1.000 × ([1 - 1/(1 +\n0,06)5/0,06) × (1 + 0,06) = $4.465,11.\nSử dụng công thức giá trị hiện tại cho một khoản tiền một lần để mang lại dòng tiền duy nhất từ t=3 to\nt=0, PV=FVN(1 + r) -\nN = $4.465,11 (1 + 0,06) - 3= $3.748,99 ~ $3.749.\nGiải pháp máy tính:\n(1) Chế độ BGN; N = 5; 1= 6%; PMT= - 1.000; FV = 0; giải cho PV = 4,465.11.\n(2) chế độ END; N = 3; 1= 6%; PMT = 0; FV = 4.465,11; giải cho PV=3.748,99 - 3.749.\nMột phương pháp khác để tính Câu trả lời đúng là tính giá trị hiện tại của một chuỗi\ncác dòng tiền bằng nhau, với dòng tiền đầu tiên vào năm thứ ba. Sử dụng máy tính có CF0=0,\nCF1,=0, CF2=0, CF3=1000, CF4=1000, CF5=1000, CF6=1000, CF7=1000; Tôi=6%; giải quyết NPV=\n3.748,99 ~ 3.749.\nC. Không chính xác vì đây là giá trị hiện tại của khoản đầu tư dưới dạng t = 2 thay vì t = 0 và nó\nlà bước trung gian trong phép tính đúng. Nó tính giá trị hiện tại của một niên kim\nthông thường ở f = 3 dưới dạng PV,= A[1 - 1/(1 + r)N]/r= $1.000 × [1 - 1/(1 + 0,06)5/0,06 = $4.212,36.\nGiải pháp máy tính:\nEND; N = 5; 1=6%; PMT = - 1.000; FV = 0; giải cho PV = 4.212,36 - 4.212.\nPhương pháp định lượng: tính toán và diễn giải giá trị hiện tại (PV) của các công cụ thu nhập cố định và\nvốn chủ sở hữu dựa trên dòng tiền dự kiến ​​trong tương lai","qhtml":null},{"n":14,"q":"Which of the following is most likely an advantage of traditional financial advisers\nover fully automated digital wealth managers?","opts":["Lower account minimums","Dividend reinvestment options","Solutions that better address the needs of complex portfolios"],"ans":"C","expl":"A. Không chính xác vì robo - cố vấn thường có mức phí thấp và mức tài khoản tối thiểu thấp,\nthực hiện các đề xuất của họ với các quỹ tương hỗ chỉ số đa dạng, chi phí thấp hoặc\nquỹ giao dịch trao đổi (ETF). Các nhà quản lý tài sản kỹ thuật số hoàn toàn tự động là một loại dịch vụ\ntrong lĩnh vực tư vấn robo. Mô hình hoàn toàn tự động không dựa vào sự hỗ trợ\ntừ cố vấn tài chính con người. Các dịch vụ này tìm cách cung cấp giải pháp chi phí thấp để đầu tư\nvà đề xuất danh mục đầu tư thường bao gồm ETFS.\nB. Không chính xác vì [t]gói dịch vụ [được cung cấp bởi những người quản lý tài sản kỹ thuật số hoàn toàn tự động\n] có thể bao gồm tiền gửi trực tiếp, tái cân bằng định kỳ và các tùy chọn tái đầu tư cổ tức\n.\nC. Đúng vì khi độ phức tạp và quy mô danh mục đầu tư của nhà đầu tư tăng lên, các cố vấn robo -\ncó thể không thể đáp ứng đầy đủ các ưu tiên và nhu cầu cụ thể của nhà đầu tư\n. Trong trường hợp các nhà đầu tư cực kỳ giàu có có thể sở hữu nhiều loại tài sản\nbao gồm Đầu tư thay thế (ví dụ: đầu tư mạo hiểm, vốn cổ phần tư nhân, quỹ phòng hộ,\nvà bất động sản) ngoài cổ phiếu và trái phiếu toàn cầu và có nhu cầu tùy chỉnh\ncao hơn, cần có một nhóm cố vấn con người, mỗi người có lĩnh vực chuyên môn về\nđầu tư hoặc tài sản - quản lý cụ thể, có khả năng tồn tại lâu dài.\nPhương pháp định lượng: mô tả Dữ liệu lớn, trí tuệ nhân tạo và học máy","qhtml":null},{"n":15,"q":"To test whether a population's mean, μ, is greater than zero, the alternative\nhypothesis should be formulated as:","opts":["μ ≤ 0.","μ ≥ 0.","μ > 0."],"ans":"C","expl":"A. Không chính xác vì p 0 là giả thuyết không và không phải là giả thuyết thay thế trong thử nghiệm này. Chúng tôi nêu\ncác giả thuyết vô giá trị và thay thế sao cho chúng giải thích được tất cả các giá trị có thể có của tham số\n. Vì giả thuyết thay thế được hình thành bằng cách sử dụng điều kiện \"nghi ngờ\" p\n> 0, nên giả thuyết không nên được hình thành bằng cách sử dụng điều kiện μ ≤ 0.\nB. Không chính xác vì điều kiện \"nghi ngờ \" trong thử nghiệm này là p > 0, không phải μ ≥ 0. Công thức\ntốt nhất của giả thuyết thay thế sử dụng điều kiện 'nghi ngờ' hoặc 'hy vọng có điều kiện.\nC. Đúng vì mặc dù có nhiều cách khác nhau để hình thành các giả thuyết, nhưng chúng tôi luôn tiến hành\nkiểm tra giả thuyết không tại điểm bằng nhau, = 0. Chúng tôi có thể có điều kiện 'nghi ngờ' hoặc\n'hy vọng mà chúng tôi muốn tìm bằng chứng hỗ trợ. Trong trường hợp đó, chúng ta có thể\nxây dựng giả thuyết thay thế dưới dạng phát biểu rằng điều kiện này là đúng; giả thuyết null\nmà chúng tôi kiểm tra là tuyên bố rằng điều kiện này không đúng. Ở đây,\nđiều kiện \"nghi ngờ\" là giá trị trung bình của tổng thể lớn hơn 0 (μ > 0).\nPhương pháp định lượng: giải thích việc kiểm tra giả thuyết và các thành phần của nó, bao gồm ý nghĩa thống kê\n, lỗi Loại I và Loại II cũng như sức mạnh của kiểm tra.","qhtml":null},{"n":16,"q":"A test of independence is based on the data in a contingency table with 5 rows and 4\ncolumns. Using a nonparametric test statistic that is chi-square distributed, the number of\ndegrees of freedom is:","opts":["7.","12","20."],"ans":"B","expl":"A. Không chính xác vì đây là kết quả nếu thí sinh sử dụng r + c - 2=5 + 4 - 2=7, thay vì\nlà (r - 1)(c - 1). Công thức sai tương tự như bậc tự do của phép thử\nvề sự khác biệt về giá trị trung bình, là n, + n₂ - 2.\nB. Đúng vì đối với bảng dự phòng, chúng ta có thể thực hiện kiểm tra tính độc lập bằng cách sử dụng\nthống kê kiểm tra phi tham số có phân bố chi - bình phương thống kê kiểm tra này có (r - 1)(c - 1)\nbậc tự do, trong đó r là số hàng và c là số cột. Ở đây, r\n= 5 và c = 4, do đó bậc tự do = (5 - 1)(4 - 1)=4x3=12.\nC. Không chính xác vì đây là kết quả nếu ứng viên bỏ qua ' - 1' trong cả hai yếu tố, tức là rc = 5 x\n4 = 20, thay vì (r - 1)(c - 1) đúng.\nPhương pháp định lượng: giải thích các kiểm tra tính độc lập dựa trên dữ liệu bảng dự phòng","qhtml":null},{"n":17,"q":"In a parametric test of the correlation between two variables with a sample size of 51\nand sample correlation of 0.6. the t-statistic is closest to","opts":["0.07.","5.25.","6.64."],"ans":"B","expl":"A. Không chính xác vì đây là kết quả nếu vị trí của √(1 - 2) và √(n - 2) bị hoán đổi, tức là\ncông thức được sử dụng là\nN(1 - r2)/ √(n - 2) = (0,6)√(1 - 0,36)/ √ (51 - 2) = (0,6) (0,8)/7 = 0,06857 ~ 0,07.\nB. Đúng vì đối với Kiểm tra tham số của mối tương quan nếu hai biến được phân phối bình thường\n, chúng ta có thể kiểm tra để xác định xem giả thuyết khống (Ho: p = 0) có nên bị bác bỏ\nbằng cách sử dụng tương quan mẫu hay không, r. Công thức cho phép kiểm tra t - là\nN√(n - 2)/√(1 - 2)\" = (0.6)√(51 - 2)/ √(1 - 0.36) = (0.6)(7)/0.8 = 5.25.\nC. Không chính xác vì đây là kết quả nếu r ở mẫu số không phải là bình phương, tức là\n(n - 2)/(1 - r) = (0.6)√(51 - 2)/(1 - 0.6)=(0.6)(7)/0.63246 = 6.6408 ~ 6.64.\nPhương pháp định lượng: giải thích các kiểm định tham số và phi tham số của giả thuyết\nhệ số tương quan tổng thể bằng 0 và xác định xem giả thuyết có bị bác bỏ\nở một mức ý nghĩa nhất định hay không","qhtml":null},{"n":18,"q":"If a unimodal return distribution is negatively skewed, which of the following most\nlikely has the highest value?","opts":["Mean","Mode","Median"],"ans":"B","expl":"A. Không chính xác vì mode, không phải giá trị trung bình, là thước đo có giá trị cao nhất cho một\nphân phối đơn phương thức có độ lệch âm liên tục.\nB. Đúng vì đối với phân phối đơn thức có độ lệch âm liên tục, giá trị trung bình là\nnhỏ hơn số trung vị, nhỏ hơn mốt. Do đó, chế độ có mức cao nhất\ngiá trị.\nC. Không chính xác vì mode, không phải số trung vị, là số đo có giá trị cao nhất cho một\nphân phối đơn phương thức có độ lệch âm liên tục.\nPhương pháp định lượng: giải thích và đánh giá các thước đo về độ lệch và độ nhọn để\ngiải quyết vấn đề đầu tư","qhtml":null},{"n":19,"q":"A portfolio manager will invest €100,000 and is presented with the following\ninformation about three portfolios with normally distributed returns:\nExpected Annual Return Standard Deviation of Returns\n• Portfolio 1 23% 15%\n• Portfolio 2 12% 6%\n• Portfolio 3 15% 8%\nIf the manager wants to withdraw €5,000 in one year without invading initial capital, the\nsafety-first optimal portfolio Is","opts":["Portfolio 1.","Portfolio 2.","Portfolio 3."],"ans":"C","expl":"A. Không chính xác vì Danh mục 1 có lợi nhuận kỳ vọng cao nhất và chênh lệch cao nhất\ngiữa lợi nhuận kỳ vọng và độ lệch chuẩn, nhưng không phải là mức an toàn cao nhất - tỷ lệ đầu tiên.\nB. Không chính xác vì Danh mục 2 có độ lệch chuẩn lợi nhuận thấp nhất, nhưng không phải là\nan toàn cao nhất - tỷ lệ đầu tư 2 cũng có tỷ lệ lợi nhuận kỳ vọng cao nhất so với\nđộ lệch chuẩn (tức là khi bỏ qua ngưỡng lợi nhuận); 12%/6% = 2,00; Danh mục đầu tư 3: 15%/8% ~ 1,88.\nC. Đúng vì nếu lợi nhuận được phân phối bình thường, thì danh mục đầu tư an toàn - tối ưu\ntối đa hóa tỷ lệ an toàn - đầu tư SFRatio = [E(Rp) - R]/op. R, là lợi nhuận tối thiểu có thể chấp nhận được của nhà đầu tư và a, là độ lệch chuẩn\ncủa lợi nhuận danh mục đầu tư. Lợi nhuận tối thiểu có thể chấp nhận được là 5% (= €5.000/€100.000) vì\nnhà đầu tư cần rút €5.000 mà không xâm phạm vốn ban đầu\nSF , = (23% - 5%)/ 15% = 1,20:\nP1\nSF = (12% - 5%) / 6% ~ 1,17;\nP2\nSF (15% - 5%) / 8% = 1,25.\nP3\nDo đó, Danh mục 3 là an toàn - danh mục đầu tư tối ưu đầu tiên.\nPhương pháp định lượng: xác định rủi ro thiếu hụt, tính toán tỷ lệ an toàn - đầu tiên và xác định\ndanh mục đầu tư tối ưu bằng cách sử dụng tiêu chí an toàn - đầu tiên của Roy","qhtml":"<p>A portfolio manager will invest €100,000 and is presented with the following information about three portfolios with normally distributed returns:</p><table class=\"qtable\"><thead><tr><th></th><th>Expected Annual Return</th><th>Standard Deviation of Returns</th></tr></thead><tbody><tr><td>Portfolio 1</td><td>23%</td><td>15%</td></tr><tr><td>Portfolio 2</td><td>12%</td><td>6%</td></tr><tr><td>Portfolio 3</td><td>15%</td><td>8%</td></tr></tbody></table><p>If the manager wants to withdraw €5,000 in one year without invading initial capital, the safety-first optimal portfolio is:</p>"},{"n":20,"q":"Which of the following best describes when a transformation of the data may be\nneeded to enable the use of a simple linear regression model? When the","opts":["dependent variable is non-normally distributed","pairs of the dependent and independent variables are uncorrelated with one another","relationship between the independent variable and the dependent variable is non-linear"],"ans":"C","expl":"A. Không chính xác vì giả định về tính chuẩn đòi hỏi phần dư phải được phân phối bình thường\n. Điều này không có nghĩa là các biến phụ thuộc và độc lập phải\nđược phân phối chuẩn.\nB. Không chính xác vì đối với hồi quy tuyến tính đơn giản, chúng tôi giả định rằng các quan sát (cặp Y và X\n) không tương quan với nhau, nghĩa là chúng độc lập. Nếu có\nmối tương quan giữa các quan sát (nghĩa là tự tương quan), thì chúng không độc lập và\nphần dư sẽ tương quan với nhau. Vì các cặp không tương quan nên không cần\nchuyển đổi vì tính độc lập (các cặp quan sát không tương quan) là giả định của\nhồi quy tuyến tính đơn giản.\nC. Đúng vì nếu mối quan hệ giữa biến độc lập và biến\nphụ thuộc không tuyến tính, chúng ta thường có thể chuyển đổi một hoặc cả hai biến này để chuyển đổi mối quan hệ\nnày thành dạng tuyến tính, sau đó cho phép sử dụng hồi quy tuyến tính đơn giản.\nPhương pháp định lượng: mô tả các dạng hàm khác nhau của hồi quy tuyến tính đơn giản","qhtml":null},{"n":21,"q":"For a continuous positively skewed unimodal distribution:","opts":["both the mode and the median are less than the mean.","both the mode and the median are greater than the mean.","the mode is less than the mean and the median is greater than the mean."],"ans":"A","expl":"A. Đúng vì đối với phân phối đơn thức có độ lệch dương liên tục, chế độ\nnhỏ hơn trung vị, nhỏ hơn trung bình.\nB. Không chính xác vì đối với phân phối đơn thức có độ lệch dương liên tục, chế độ\nnhỏ hơn trung vị, nhỏ hơn giá trị trung bình. Đối với phân phối đơn mẫu\nđộ lệch âm liên tục, giá trị trung bình nhỏ hơn trung vị, nhỏ hơn chế độ.\nC. Không chính xác vì đối với phân phối đơn phương thức bị lệch dương liên tục, chế độ\nnhỏ hơn trung vị, nhỏ hơn giá trị trung bình.\nPhương pháp định lượng: diễn giải và đánh giá các thước đo về độ lệch và độ nhọn để\ngiải quyết vấn đề đầu tư","qhtml":null},{"n":22,"q":"In its broadest sense, fintech is best described as","opts":["the vast amount of data being generated by the financial services industry.","the execution of investment strategies through computer-generated algorithms.","technological innovation in the design and delivery of financial services and products."],"ans":"C","expl":"A. Không chính xác vì thuật ngữ Dữ liệu lớn đã được sử dụng từ cuối những năm 1990 và đề cập đến\nlượng dữ liệu khổng lồ được tạo ra bởi ngành công nghiệp, chính phủ, cá nhân và thiết bị\nđiện tử. Thuật ngữ fintech rộng hơn nhiều.\nB. Không chính xác vì giao dịch tự động, không phải fintech, đề cập đến việc thực hiện các quyết định đầu tư\nthông qua thuật toán máy tính hoặc ứng dụng giao dịch tự động. Thuật ngữ fintech\nrộng hơn nhiều.\nC. Đúng vì theo nghĩa rộng nhất, thuật ngữ 'fintech' thường đề cập đến sự đổi mới dựa trên công nghệ -\nxảy ra trong ngành dịch vụ tài chính. Với mục đích của việc đọc\nnày, fintech đề cập đến sự đổi mới công nghệ trong việc thiết kế và cung cấp các dịch vụ và sản phẩm\ntài chính. Tuy nhiên, xin lưu ý rằng trong cách sử dụng thông thường, fintech cũng có thể đề cập đến\ncác công ty (thường là các công ty mới, khởi nghiệp) tham gia phát triển các công nghệ mới và\nứng dụng của họ, cũng như lĩnh vực kinh doanh bao gồm các công ty đó.\nPhương pháp định lượng: mô tả các khía cạnh của \"fintech\" có liên quan trực tiếp đến việc\nthu thập và phân tích dữ liệu tài chính.","qhtml":null},{"n":23,"q":"An analyst estimates the following information from a simple linear regression:\n• Sum of squares error 280\n• Sum of squares regression 25\n• Number of paired observations 30\nThe standard error of the estimate is closest to:","opts":["2.5.","3.2.","10.0."],"ans":"B","expl":"A. Không chính xác vì đây là thống kê F được tính theo MSR/MSE, 25/10 = 2,5. Đối với hồi quy tuyến tính\nđơn giản, F - Thống kê là MSR chia cho MSE, trong đó hồi quy bình phương trung bình\n(MSR) giống với tổng hồi quy bình phương [SSR] và sai số bình phương trung bình (MSE)\nđược tính bằng tổng sai số bình phương (SSE) được điều chỉnh theo bậc tự do của nó, SSE / (n -\n2); 280/(30 - 2)= 10.\nB. Đúng vì đây là sai số chuẩn của ước tính được tính bằng căn bậc hai của\nsai số bình phương trung bình, (10)0,5=3,2. Sai số bình phương trung bình (MSE) được tính bằng SSE/(n - 2):\n280/(30 - 2)= 10,0, trong đó SSE là tổng của sai số bình phương.\nC. Không chính xác vì đây là sai số bình phương trung bình (MSE) được tính theo SSE / (n - 2), trong đó SSE\nlà tổng sai số bình phương, 280/(30 - 2)=10,0.\nPhương pháp định lượng: mô tả việc sử dụng phân tích phương sai (ANOVA) trong phân tích hồi quy\n, diễn giải kết quả ANOVA, tính toán và diễn giải sai số chuẩn của ước tính\ntrong hồi quy tuyến tính đơn giản","qhtml":null},{"n":24,"q":"An analyst draws samples from an original sample to estimate the standard error of a\npopulation mean. Which of the following best describes this sampling procedure?","opts":["Bootstrap method","Cluster sampling method","Convenience sampling method"],"ans":"A","expl":"A. Đúng vì trong bootstrap, chúng tôi liên tục lấy mẫu từ mẫu ban đầu và\nmỗi mẫu lại có cùng kích thước với mẫu ban đầu. Lưu ý rằng mỗi mục được rút ra sẽ được\nthay thế cho lần rút tiếp theo (tức là, phần tử giống hệt nhau được đưa trở lại nhóm để có thể rút ra\nnhiều lần) Giả sử chúng ta đang tìm lỗi tiêu chuẩn của\ntrung bình mẫu, chúng ta lấy nhiều mẫu lại rồi tính giá trị trung bình của mỗi mẫu lại.\nB. Không chính xác vì trong lấy mẫu cụm, các phần tử được chọn từ tổng thể chứ không phải mẫu gốc. Quần thể được chia thành các cụm, mỗi cụm về cơ bản là một đại diện nhỏ -\ncủa toàn bộ quần thể. Sau đó, một số cụm nhất định được chọn tổng thể bằng cách sử dụng\nlấy mẫu ngẫu nhiên đơn giản.\nC. Không chính xác vì trong lấy mẫu thuận tiện, các phần tử được chọn từ tổng thể\nkhông phải từ mẫu ban đầu. Một phần tử được chọn từ tổng thể dựa trên việc\nnhà nghiên cứu có thể truy cập được phần tử đó hay không hoặc dựa vào mức độ dễ dàng để nhà nghiên cứu truy cập vào phần tử\n. Vì các mẫu được chọn một cách thuận tiện nên chúng không nhất thiết\nđại diện cho toàn bộ tổng thể và do đó mức độ chính xác của việc lấy mẫu có thể bị hạn chế\n.\nPhương pháp định lượng: mô tả việc sử dụng phương pháp lấy mẫu lại bootstrap khi tiến hành mô phỏng\ndựa trên dữ liệu được quan sát trong các ứng dụng đầu tư","qhtml":null},{"n":25,"q":"An investor is considering buying a US T-bill. If the real risk-free rate is 1% and the\ninflation premium is 2%, the investor's opportunity cost of falling to make this investment\nis closest to","opts":["1%.","2%.","3%."],"ans":"C","expl":"A. Không chính xác vì lãi suất có thể được coi là chi phí cơ hội. Lãi suất thực tế - miễn phí\nlà lãi suất một kỳ cho một sự đảm bảo hoàn toàn không có rủi ro nếu dự kiến ​​không có\nlạm phát. Trong lý thuyết kinh tế, lãi suất phi rủi ro thực phản ánh sở thích về thời gian\ncủa các cá nhân đối với mức tiêu dùng thực tế hiện tại so với tương lai. Tổng của\nrủi ro thực tế - lãi suất phi lãi suất và phần bù lạm phát là lãi suất danh nghĩa - lãi suất phi rủi ro. Vì\nphần bù lạm phát là 2%, lãi suất phi rủi ro thực 1% không phải là chi phí cơ hội của việc mua\ntín phiếu kho bạc Hoa Kỳ.\nB. Không chính xác vì lãi suất có thể được coi là chi phí cơ hội. Phí lạm phát\nbù đắp cho các nhà đầu tư về lạm phát dự kiến. Lãi suất thực tế - không có rủi ro là\nlãi suất một kỳ cho một chứng khoán hoàn toàn không có rủi ro nếu không có lạm phát\ndự kiến. Trong lý thuyết kinh tế, lãi suất phi rủi ro thực phản ánh sở thích về thời gian của\ncác cá nhân đối với mức tiêu dùng thực tế hiện tại và tương lai. Tổng của rủi ro thực tế - lãi suất\nmiễn phí và phần bù lạm phát là rủi ro danh nghĩa - lãi suất miễn phí. Vì lãi suất thực\nkhông có rủi ro là 1% nên phần bù lạm phát 2% không phải là chi phí cơ hội của việc mua T\n- bill.\nC. Đúng vì lãi suất có thể được coi là chi phí cơ hội. Lãi suất thực tế - miễn phí\nlà lãi suất một kỳ cho một sự đảm bảo hoàn toàn không có rủi ro nếu dự kiến ​​không có\nlạm phát. Trong lý thuyết kinh tế, lãi suất phi rủi ro thực phản ánh sở thích về thời gian\ncủa các cá nhân đối với mức tiêu dùng thực tế hiện tại so với tương lai. Tổng của\nlãi suất thực - lãi suất phi rủi ro và phần bù lạm phát là lãi suất danh nghĩa - lãi suất phi rủi ro.\nNhiều quốc gia có nợ ngắn hạn của chính phủ mà lãi suất có thể được coi là\nđể thể hiện lãi suất danh nghĩa - lãi suất phi rủi ro ở quốc gia đó. Ví dụ: lãi suất trên tín phiếu Kho bạc Hoa Kỳ kỳ hạn 90 -\nngày (T - bill), thể hiện rủi ro danh nghĩa - lãi suất miễn phí\ntrong khoảng thời gian đó. Do đó, chi phí cơ hội của khoản đầu tư này là 1% + 2% = 3%.\nPhương pháp định lượng: diễn giải lãi suất là tỷ suất lợi nhuận yêu cầu, tỷ lệ chiết khấu hoặc\nchi phí cơ hội và giải thích lãi suất là tổng của rủi ro thực tế - lãi suất miễn phí và\nphí bảo hiểm bù đắp cho các nhà đầu tư khi phải chịu các loại rủi ro khác nhau","qhtml":null},{"n":26,"q":"An investor records the following information and transactions for a stock:\nYear | Price per Share at Beginning of Year | Cash Flow at Beginning of Year\n1 — $100 — $100 used to purchase one share\n2 — $100 — $9 received in dividends and not reinvested\n3 — $100 — $100 received from selling one share\nThe investor's money-weighted rate of return is closest to:","opts":["4.4%.","4.5%.","4.6%"],"ans":"C","expl":"A. Không chính xác vì đó là tiền - lợi nhuận gia quyền khi cổ tức được tái đầu tư.\nGiải pháp máy tính: CF0 = - 100, CF1 = 0, CF2 = 109, tính IRR = 4,403% ~ 4,4%. Câu trả lời\ncũng là lợi nhuận trung bình hình học; [(1 + 0,09)(1 + 0,00) ^0,5 - 1=0,04403 ~ 4,4%.\nB. Không chính xác vì đó là kết quả trả về trung bình số học; (0,09 + 0,00)/2 = 0,045 = 4,5%.\nlợi nhuận số học hoặc lợi nhuận trung bình được biểu thị bằng R và được tính bằng phương trình sau cho nội dung i,\ntrong đó R, là lợi nhuận trong kỳ t và T là tổng số kỳ: R= (R/ + R/2 + ... +\nR)/T. Lợi nhuận trong Năm 1 và Năm 2 được tính lần lượt là (100 - 100 + 9)/100 = 0,09 và (100 -\n100 + 0)/100 = 0,00.\nC. Đúng vì đó là tiền - lợi nhuận gia quyền khi cổ tức không được tái đầu tư.\nGiải pháp máy tính: CF0 = - 100, CF1 = 9, CF2 = 100, tính IRR = 4,601% ~4,6%.\nPhương pháp định lượng: so sánh tỷ suất lợi nhuận tính theo tiền và trọng số theo thời gian\nvà đánh giá hiệu suất của danh mục đầu tư dựa trên các thước đo này","qhtml":"<p>An investor records the following information and transactions for a stock:</p><table class=qt><thead><tr><th>Year</th><th>Price per Share at Beginning of Year</th><th>Cash Flow at Beginning of Year</th></tr></thead><tbody><tr><td>1</td><td>$100</td><td>$100 used to purchase one share</td></tr><tr><td>2</td><td>$100</td><td>$9 received in dividends and not reinvested</td></tr><tr><td>3</td><td>$100</td><td>$100 received from selling one share</td></tr></tbody></table><p>The investor&#x27;s money-weighted rate of return is closest to:</p>"},{"n":27,"q":"The null hypothesis for the F-distributed test statistic in a simple linear regression\nmodel tests whether the","opts":["slope is equal to zero.","intercept is equal to zero","slope is not equal to zero."],"ans":"A","expl":"A. Đúng vì trong phân tích hồi quy, chúng ta có thể sử dụng thống kê kiểm tra phân tán F để kiểm tra\nliệu các hệ số góc trong hồi quy có bằng 0 hay không, với các hệ số góc được chỉ định là b,\nchống lại giả thuyết thay thế rằng ít nhất một hệ số góc không bằng 0 đối với hồi quy tuyến tính\nđơn giản, những giả thuyết này đơn giản hóa thành H : b = 0. H b₁ ≠0.\n0 1 a\nB. Không chính xác vì trong phân tích hồi quy, chúng ta có thể sử dụng thống kê kiểm tra phân tán F để kiểm tra\nliệu các hệ số góc trong hồi quy có bằng 0 hay không, với các hệ số góc được chỉ định là b,\ntrái với giả thuyết thay thế rằng ít nhất một hệ số góc không bằng 0 đối với hồi quy tuyến tính\nđơn giản, những giả thuyết này đơn giản hóa thành H b₁ = 0. H b₁ ≠0.\n0 a\nC. Không chính xác vì trong phân tích hồi quy, chúng ta có thể sử dụng thống kê kiểm tra phân tán F để kiểm tra\nliệu các hệ số góc trong hồi quy có bằng 0 hay không, với các hệ số góc được chỉ định là b,\ntrái với giả thuyết thay thế rằng ít nhất một hệ số góc không bằng 0 đối với hồi quy tuyến tính\nđơn giản, những giả thuyết này đơn giản hóa thành H, b₁ = 0. H b₁ ≠ 0.\na\nPhương pháp định lượng: tính toán và giải thích các thước đo mức độ phù hợp, xây dựng và đánh giá\ncác thử nghiệm về mức độ phù hợp và hệ số hồi quy trong hồi quy tuyến tính đơn giản","qhtml":null},{"n":28,"q":"An analyst estimates the probabilities of three possible economic scenarios and the\nprobabilities of a stock having a positive or a negative return in each scenario. These\nscenarios are best represented by a","opts":["tree-map.","tree diagram.","probability density function"],"ans":"B","expl":"A. Không chính xác vì bản đồ cây là công cụ đồ họa để hiển thị dữ liệu phân loại. Nó bao gồm\nmột tập hợp các hình chữ nhật màu để biểu thị các nhóm riêng biệt và diện tích của mỗi hình chữ nhật\ntỷ lệ với giá trị của nhóm tương ứng. Các kích thước bổ sung của dữ liệu\nphân loại có thể được hiển thị bằng các hình chữ nhật lồng nhau.\nB. Đúng vì xác suất cho các tình huống khác nhau và các kết quả khác nhau được thể hiện tốt nhất\nbằng sơ đồ cây,\nC. Không chính xác vì ước tính xác suất dành cho hai biến ngẫu nhiên rời rạc, không phải\nmột biến ngẫu nhiên liên tục. Hàm xác suất chỉ định xác suất mà biến ngẫu nhiên\ncó một giá trị cụ thể. Đối với các biến ngẫu nhiên liên tục, hàm\nxác suất được gọi là hàm mật độ xác suất (pdf) hoặc chỉ là mật độ.\nPhương pháp định lượng: xây dựng bài toán đầu tư dưới dạng cây xác suất và giải thích\nviệc sử dụng các kỳ vọng có điều kiện trong ứng dụng đầu tư","qhtml":null},{"n":29,"q":"Which of the following is most likely used to detect sentiment shifts in an analyst's\ncommentary?","opts":["Tokenization","Data curation","Natural language processing"],"ans":"C","expl":"A. Không chính xác vì mã hóa là quá trình thể hiện quyền sở hữu đối với tài sản\nvật lý trên chuỗi khối hoặc sổ cái phân tán. Nó không thể phát hiện những thay đổi trong cảm xúc\ncủa nhà phân tích.\nB. Không chính xác vì việc quản lý dữ liệu đề cập đến quá trình đảm bảo chất lượng dữ liệu và\nđộ chính xác thông qua hoạt động làm sạch dữ liệu. Quá trình này bao gồm việc xem xét tất cả dữ liệu để\nphát hiện và phát hiện các lỗi dữ liệu - dữ liệu xấu hoặc không chính xác - và điều chỉnh\ndữ liệu bị thiếu khi thích hợp. Mặc dù dữ liệu được sử dụng để xử lý ngôn ngữ tự nhiên có thể\ncần được quản lý nhưng bản thân nó không thể phát hiện những thay đổi trong cảm xúc của nhà phân tích.\nC. Đúng vì NLP [xử lý ngôn ngữ tự nhiên] có thể được sử dụng để theo dõi bình luận\ncủa nhà phân tích nhằm hỗ trợ việc ra quyết định đầu tư. Vì các nhà phân tích có xu hướng không thường xuyên thay đổi các khuyến nghị mua,\nnắm giữ và bán cho một công ty, nên thay vào đó, họ có thể đưa ra những bình luận\nnhiều sắc thái mà không thực hiện thay đổi trong khuyến nghị đầu tư của mình. Do đó, NLP có thể được sử dụng để phát hiện, giám sát và gắn thẻ những thay đổi trong cảm xúc, có khả năng xảy ra trước sự thay đổi khuyến nghị của nhà phân tích.\nPhương pháp định lượng: mô tả các ứng dụng của Dữ liệu lớn và Khoa học dữ liệu để quản lý đầu tư","qhtml":null},{"n":30,"q":"Which of the following visualizations is most appropriate for interpreting the\ncorrelation between two variables?","opts":["Tree-map","Scatter plot","Clustered bar chart"],"ans":"B","expl":"A. Không chính xác vì bản đồ cây rất hữu ích trong việc hiển thị phân bố tần suất chứ không phải\ntương quan. Ngoài biểu đồ thanh và biểu đồ thanh được nhóm, một công cụ đồ họa khác để\nhiển thị dữ liệu phân loại là bản đồ dạng cây. Nó bao gồm một tập hợp các hình chữ nhật được tô màu để\nđại diện cho các nhóm riêng biệt và diện tích của mỗi hình chữ nhật tỷ lệ thuận với giá trị của nhóm\ntương ứng. Bản đồ cây có thể biểu thị dữ liệu với các kích thước bổ sung bằng cách\nhiển thị một tập hợp các hình chữ nhật lồng nhau.\nB. Đúng vì biểu đồ phân tán là một công cụ rất hữu ích để diễn giải hợp lý hệ số tương quan a\n. Biểu đồ phân tán là một loại biểu đồ để trực quan hóa sự biến đổi chung của\nhai biến số. Đây là một công cụ hữu ích để hiển thị và hiểu mối quan hệ tiềm ẩn\ngiữa các biến.\nC. Không chính xác vì biểu đồ thanh nhóm rất hữu ích khi hiển thị mức phân bổ tần suất,\nkhông phải mối tương quan. Trong trường hợp có hai biến phân loại, chúng ta cần phiên bản nâng cao của biểu đồ thanh\n, được gọi là biểu đồ thanh được nhóm (còn được gọi là biểu đồ thanh cụm), để hiển thị\ntần số chung.\nPhương pháp định lượng: diễn giải mối tương quan giữa hai biến để giải quyết\nvấn đề đầu tư","qhtml":null},{"n":31,"q":"An investor has three options for receiving payments from an investment.\n• Option 1: a single payment of $136,000 today.\n• Option 2: 30 annual payments of $12,000, beginning one year from today.\n• Option 3: 20 annual payments of $13,000, beginning today.\nIf the annual discount rate is 8%, the option with the highest present value is:","opts":["Option 1.","Option 2.","Option 3."],"ans":"C","expl":"A. Không chính xác vì Tùy chọn 3 (niên kim đến hạn với 20 khoản thanh toán, mỗi khoản là 13.000 USD) có\ngiá trị hiện tại cao nhất là 137.847 USD. PV của Phương án 1 là 136.000 USD.\nNếu ứng viên tính sai giá trị hiện tại của Phương án 3 như một niên kim thông thường,\nsố tiền gộp một lần là 136.000 USD sẽ có giá trị hiện tại cao nhất. Giải pháp\nmáy tính không chính xác cho Tùy chọn 3: Chế độ kết thúc; N = 20; I/Y = 8; PMT= - 13.000, tính PV = 127.636\nB. Không chính xác vì Tùy chọn 3 (niên kim đến hạn với 20 khoản thanh toán, mỗi khoản là 13.000 USD) có\ngiá trị hiện tại cao nhất là 137.847 USD. PV của Phương án 2 là 135.093 USD.\nNếu ứng viên bỏ qua tỷ lệ chiết khấu, phương án có 30 khoản thanh toán, mỗi khoản 12.000 USD\nsẽ có giá trị cao nhất. Nghĩa là, 30 khoản thanh toán 12.000 USD của Tùy chọn 2 với tổng số\n360.000 USD lớn hơn 20 khoản thanh toán 13.000 USD của Tùy chọn 3 với tổng số 260.000 USD và\nkhoản thanh toán một lần là 136.000 USD.\nC. Đúng vì Tùy chọn 3 (niên kim đến hạn với 20 khoản thanh toán, mỗi khoản là 13.000 USD) có\ngiá trị hiện tại cao nhất của các niên kim và tổng số tiền trả một lần là 136.000 USD.\nGiải pháp máy tính cho Tùy chọn 2: Chế độ kết thúc; N = 30; I/Y= 8; PMT= - 12.000, tính toán PV =\n135.093.\nGiải pháp máy tính cho Tùy chọn 3: Chế độ bắt đầu; N = 20; I/Y= 8; PMT= - 13.000; tính toán PV =\n137.847.\nPhương pháp định lượng: tính toán và diễn giải giá trị hiện tại (PV) của các công cụ thu nhập cố định và\nvốn chủ sở hữu dựa trên dòng tiền dự kiến ​​trong tương lai","qhtml":null},{"n":32,"q":"Roy's safety-first criterion:","opts":["evaluates only downside risk.","uses semideviation as a risk measure.","assumes asset prices are normally distributed."],"ans":"A","expl":"A. Đúng vì phân tích phương sai trung bình thường xem xét rủi ro một cách đối xứng theo nghĩa\nlà độ lệch chuẩn thể hiện sự biến thiên cả trên và dưới giá trị trung bình. Một\ncách tiếp cận thay thế chỉ đánh giá rủi ro giảm giá. Chúng tôi thảo luận về một cách tiếp cận như vậy, các quy tắc đầu tiên về an toàn -\n, vì nó cung cấp một minh họa tuyệt vời về việc áp dụng lý thuyết phân phối chuẩn\nvào các vấn đề đầu tư thực tế. An toàn - quy tắc đầu tiên tập trung vào rủi ro thiếu hụt, rủi ro\ngiá trị danh mục đầu tư sẽ giảm xuống dưới một số mức tối thiểu có thể chấp nhận được trong một khoảng thời gian.\nSự an toàn của Roy - tiêu chí đầu tiên nêu rõ rằng danh mục đầu tư tối ưu giảm thiểu xác suất mà\nlợi nhuận danh mục đầu tư, R, giảm xuống dưới mức ngưỡng, R\nB. Không chính xác vì tỷ lệ an toàn - thứ nhất sử dụng độ lệch chuẩn chứ không phải nửa độ lệch làm thước đo rủi ro. Danh mục đầu tư tối ưu an toàn - đầu tiên tối đa hóa tỷ lệ an toàn - đầu tiên (SFRatio):\nSFRatio = [E(R\nP\n) – R\nL\n]/σ\np\n. Đại lượng E(RP) – RL là khoảng cách từ lợi nhuận trung bình đến mức thiếu hụt\n. Chia khoảng cách này cho op sẽ cho khoảng cách theo đơn vị độ lệch chuẩn.\nMặc dù không được sử dụng trong sự an toàn của Roy - tiêu chí đầu tiên, bán phương sai, bán sai lệch và các biện pháp phân tán\ncó liên quan [cũng] tập trung vào rủi ro giảm giá. Bán phương sai được định nghĩa là độ lệch bình phương\ntrung bình dưới giá trị trung bình. Bán sai lệch (đôi khi được gọi là độ lệch bán chuẩn\n) là căn bậc hai dương của bán phương sai.\nC. Không chính xác vì sự an toàn của Roy - tiêu chí đầu tiên giả định rằng lợi nhuận danh mục đầu tư được phân phối bình thường\n. Nếu lợi nhuận được phân phối chuẩn, thì danh mục đầu tư an toàn - tối ưu đầu tiên sẽ tối đa hóa\ntỷ lệ an toàn - đầu tiên (SFRatio): SFRatio = [E(RP) – R]/σ\np\n. Tuy nhiên, phân phối chuẩn\nkhông phù hợp làm mô hình cho giá tài sản hơn là mô hình cho lợi nhuận. Biến\nngẫu nhiên bình thường không có giới hạn dưới. Đặc điểm này có một số ý nghĩa đối với các ứng dụng\nđầu tư. Giá tài sản chỉ có thể giảm xuống 0, tại thời điểm đó tài sản đó trở nên vô giá trị.\nDo đó, những người thực hành thường không sử dụng phân phối chuẩn để lập mô hình\nsự phân bổ giá tài sản.\nPhương pháp định lượng: xác định rủi ro thiếu hụt, tính toán tỷ lệ an toàn - đầu tiên và xác định\ndanh mục đầu tư tối ưu bằng cách sử dụng tiêu chí an toàn - tiêu chí đầu tiên của Roy","qhtml":null},{"n":33,"q":"All else being equal, when compared to non-probability sampling, probability\nsampling most likely yields:","opts":["a less representative sample.","an equally representative sample.","a more representative sample"],"ans":"C","expl":"A. Không chính xác vì việc lấy mẫu xác suất mang lại cho mọi thành viên trong tổng thể một cơ hội được chọn\nnhư nhau. Do đó, nó có thể tạo một mẫu đại diện cho tập hợp\n. Ngược lại, việc lấy mẫu phi xác suất phụ thuộc vào các yếu tố khác ngoài những cân nhắc về xác suất\n, chẳng hạn như phán đoán của người lấy mẫu hoặc sự thuận tiện khi truy cập dữ liệu.\nDo đó, có nguy cơ đáng kể là việc lấy mẫu phi xác suất có thể tạo ra một mẫu không mang tính đại diện\n. Nói chung, tất cả các yếu tố khác đều bằng nhau, việc lấy mẫu xác suất có thể mang lại\nđộ chính xác và độ tin cậy cao hơn so với lấy mẫu phi xác suất.\nB. Không chính xác vì việc lấy mẫu xác suất mang lại cho mọi thành viên trong tổng thể một sự thay đổi\nbằng nhau về việc được chọn. Do đó, nó có thể tạo một mẫu đại diện cho tập hợp\n. Ngược lại, việc lấy mẫu phi xác suất phụ thuộc vào các yếu tố khác ngoài những cân nhắc về xác suất\n, chẳng hạn như phán đoán của người lấy mẫu hoặc sự thuận tiện khi truy cập dữ liệu.\nDo đó, có nguy cơ đáng kể là việc lấy mẫu phi xác suất có thể tạo ra một mẫu không mang tính đại diện\n. Nói chung, tất cả các yếu tố khác đều bằng nhau, việc lấy mẫu xác suất có thể mang lại\nđộ chính xác và độ tin cậy cao hơn so với lấy mẫu phi xác suất.\nC. Đúng vì việc lấy mẫu xác suất mang lại cho mọi thành viên trong tổng thể một sự thay đổi\nbằng nhau về việc được chọn. Do đó, nó có thể tạo một mẫu đại diện cho tập hợp\n. Ngược lại, việc lấy mẫu phi xác suất phụ thuộc vào các yếu tố khác ngoài những cân nhắc về xác suất\n, chẳng hạn như phán đoán của người lấy mẫu hoặc sự thuận tiện khi truy cập dữ liệu.\nDo đó, có nguy cơ đáng kể là việc lấy mẫu phi xác suất có thể tạo ra một mẫu không mang tính đại diện\n. Nói chung, tất cả các yếu tố khác đều bằng nhau, việc lấy mẫu xác suất có thể mang lại\nđộ chính xác và độ tin cậy cao hơn so với lấy mẫu phi xác suất.\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự thuận tiện và lấy mẫu phán đoán cũng như những tác động của chúng đối với lỗi lấy mẫu trong một\nvấn đề đầu tư","qhtml":null},{"n":34,"q":"An analyst examines 30 paired monthly returns for two stock indexes. To determine if\nthe mean difference of the returns is zero, the number of degrees of freedom of the f-test\nis","opts":["28.","29.","58"],"ans":"B","expl":"A. Không chính xác vì t - thống kê cho thử nghiệm so sánh theo cặp có n - 1 bậc tự do\n, không phải n - 2 bậc tự do, trong đó n là số cặp quan sát.\nKhi n = 30, số bậc tự do là 30 - 1=29, không phải 30 - 2=28.\nB. Đúng vì thống kê t cho kiểm tra so sánh theo cặp có n - 1 bậc tự do\n, trong đó n là số cặp quan sát. Khi n = 30 thì số\nbậc tự do là 30 - 1=29.\nC. Không chính xác vì đây là số bậc tự do của thống kê t cho a\nkiểm tra giả thuyết liên quan đến sự bằng nhau của trung bình tổng thể của hai mẫu\nđộc lập, là n + n₂ - 2. Khi cả n và n₂ đều là 30, số bậc tự do\n1 1\ncủa t - thống kê cho a kiểm tra giả thuyết liên quan đến sự bằng nhau của trung bình tổng thể của\nhai mẫu độc lập là 30 + 30 - 2=58.\nPhương pháp định lượng: xây dựng các kiểm tra giả thuyết và xác định ý nghĩa thống kê\ncủa chúng, các lỗi Loại I và Loại II liên quan. và sức mạnh của bài kiểm tra được đưa ra ở một\nmức ý nghĩa","qhtml":null,"explhtml":"<p><b>A. Không chính xác. </b>Thống kê t cho bài kiểm tra so sánh cặp đôi có\\(n-1\\)bậc tự do, không\\(n-2\\), Ở đâu\\(n\\)là số cặp Khi\\(n=30\\), df\\(=30-1=29\\), không\\(30-2=28\\).</p><p><b>B. Đúng. </b>Thống kê t so sánh theo cặp có\\(n-1\\)bậc tự do. Khi\\(n=30\\), df\\(=30-1=29\\).</p><p><b>C. Không chính xác. </b>Đây là bậc tự do của phép thử sự bằng nhau của trung bình của hai mẫu độc lập, đó là\\(n_1+n_2-2\\). Khi\\(n_1=n_2=30\\), df\\(=30+30-2=58\\).</p><span class=\"los\">Phương pháp định lượng: xây dựng các thử nghiệm giả thuyết và xác định ý nghĩa thống kê của chúng, các lỗi Loại I và Loại II liên quan cũng như độ mạnh của thử nghiệm với mức ý nghĩa nhất định</span>"},{"n":35,"q":"An analyst calculates the following statistics for a sample with 100 observations:\nValue\nFirst quartile 11\nSecond quartile 62\nThird quartile 93\nFourth quartile 359\nThe interquartile range of the sample is equal to:","opts":["31.","82.","348."],"ans":"B","expl":"A. Không chính xác vì đó là sự khác biệt giữa tứ phân vị thứ ba và tứ phân vị thứ hai,\nQ3 - Q2 = 93 - 62 = 31. Phạm vi liên tứ phân vị (IQR) là sự khác biệt giữa tứ phân vị thứ ba\nvà tứ phân vị thứ nhất.\nB. Đúng vì phạm vi liên tứ phân vị (IQR) là sự khác biệt giữa tứ phân vị thứ ba,\nhoặc IQR = và tứ phân vị thứ nhất, Q3 - Q \" = 93 – 11 = 82. Các tứ phân vị chia phân bổ thành\ncác phần tư.\nC. Không chính xác vì đây là phạm vi của bốn số đã cho chứ không phải liên tứ phân vị\nrange. Q – Q = 359 - 11 = 348\n4 1\nPhương pháp định lượng: tính toán, giải thích và đánh giá các thước đo về xu hướng trung tâm và\nvị trí để giải quyết vấn đề đầu tư","qhtml":null,"explhtml":"<p><b>A. Không chính xác. </b>Đây là sự khác biệt giữa tứ phân vị thứ ba và thứ hai,\\(Q_3-Q_2=93-62=31\\). Khoảng tứ phân vị (IQR) là sự khác biệt giữa tứ phân vị thứ ba và tứ phân vị thứ nhất.</p><p><b>B. Đúng. </b>Khoảng tứ phân vị là sự khác biệt giữa tứ phân vị thứ ba và tứ phân vị thứ nhất,\\(Q_3-Q_1=93-11=82\\). Các phần tư chia phân phối thành các phần tư.</p><p><b>C. Không chính xác. </b>Đây là phạm vi của bốn số đã cho, không phải phạm vi liên tứ phân vị:\\(Q_4-Q_1=359-11=348\\).</p><span class=\"los\">Phương pháp định lượng: tính toán, giải thích và đánh giá các thước đo về xu hướng và vị trí trung tâm để giải quyết vấn đề đầu tư</span>"},{"n":36,"q":"The probability of correctly rejecting a null hypothesis is best defined as the","opts":["p-value","power of the test.","level of significance"],"ans":"B","expl":"A. Không chính xác vì giá trị p là mức ý nghĩa nhỏ nhất mà tại đó giá trị rỗng\ngiả thuyết có thể bị bác bỏ\nB. Đúng vì sức mạnh của bài kiểm tra là xác suất bác bỏ chính xác giá trị rỗng - đó\nlà xác suất bác bỏ giá trị rỗng khi nó sai.\nC. Không chính xác vì mức ý nghĩa của phép kiểm định là xác suất bác bỏ một giá trị không đúng\ngiả thuyết (tức là xác suất bác bỏ giả thuyết không một cách không chính xác).\nPhương pháp định lượng: giải thích việc kiểm tra giả thuyết và các thành phần của nó, bao gồm cả phương pháp thống kê\ný nghĩa, lỗi Loại I và Loại II, và sức mạnh của bài kiểm tra.","qhtml":null},{"n":37,"q":"An investor summarizes end-of-year cash outlays and proceeds from a two-year investment in a company's shares below:\nYear | Outlays | Proceeds\n0 — $100 to purchase the first share — —\n1 — $110 to purchase the second share — $10 dividend received from first share (not reinvested)\n2 — — — $230 received from selling two shares at $115 per share\nThe annualized time-weighted rate of return of the investment over the two-year period is closest to","opts":["9.7%.","12.0%","12.3%."],"ans":"B","expl":"A. Không chính xác vì đó là tỷ lệ hoàn vốn gia quyền của khoản đầu tư. Tiền\n- lợi nhuận có trọng số và cách tính của nó tương tự như tỷ suất lợi nhuận nội bộ. Tỷ lệ hoàn vốn nội bộ\nlà tỷ lệ chiết khấu mà tại đó tổng giá trị hiện tại của các dòng tiền này sẽ\nbằng 0.\nGiải pháp máy tính.: [CF0] = đầu tư vào cổ phiếu đầu tiên= - 100, [CF1] = đầu tư vào\ncổ phiếu thứ hai + cổ tức từ cổ phiếu đầu tiên = - 110 + 10 = - 100. [CF2] = số tiền thu được từ việc bán hai\ncổ phiếu = 230, [IRR] [CPT] = 0,09687 ~ 9,7%.\nB. Đúng vì tỷ suất lợi nhuận gia quyền theo thời gian đo lường tỷ lệ gộp của\ntăng trưởng của 1 đô la đầu tư ban đầu vào danh mục đầu tư trong một khoảng thời gian đo lường đã nêu.... Chúng tôi tìm thấy\nlợi nhuận gia quyền lần này bằng cách lấy trung bình hình học của hai lợi tức kỳ nắm giữ.\nLợi nhuận kỳ hạn nắm giữ là lợi tức kiếm được từ việc nắm giữ một tài sản trong một khoảng thời gian\nđược chỉ định.... Lợi tức này có thể được tổng quát hóa và biểu thị dưới dạng một biểu thức toán học trong\ntrong đó P là giá và / là thu nhập: R= [(P - Po) + I ]/Po. Chỉ số dưới cho biết\n1 1\nthời gian của giá hoặc thu nhập, (t = 0), là thời điểm bắt đầu của kỳ và (t = 1) là thời điểm kết thúc\nkỳ. Do đó, lợi nhuận của khoảng thời gian nắm giữ giữa thời gian 0 và 1 là\nHPR , = [(110 - 100) + 10]/100 = 0,2 = 20%,\nvà lợi nhuận của khoảng thời gian nắm giữ giữa thời gian 1 và 2 là\nHPR₂ = [(230 - 220) + 0/220 = 0,04545~4,5%, trong đó 220 = 110 x 2 là giá (giá trị) của\nhai cổ phiếu do nhà đầu tư nắm giữ tại thời điểm 1.\nTỷ suất lợi nhuận gia quyền theo thời gian khi đó là [(1 + HPR₁) × (1 + HPR₂)10,5 - 1 = [(1 + 0,2) × (1 +\n0,04545)]0,5 - 1=0,12006 ~ 12,0%.\nC. Không chính xác vì nó chỉ tính toán trung bình số học của hai kỳ trả về\n; (20% + 4,545%)/2= 12,273% ~12,3%.\nPhương pháp định lượng: tính toán và giải thích các thước đo lợi nhuận chính và mô tả\ncách sử dụng phù hợp","qhtml":"<p>An investor summarizes end-of-year cash outlays and proceeds from a two-year investment in a company&#x27;s shares below:</p><table class=qt><thead><tr><th>Year</th><th>Outlays</th><th>Proceeds</th></tr></thead><tbody><tr><td>0</td><td>$100 to purchase the first share</td><td>—</td></tr><tr><td>1</td><td>$110 to purchase the second share</td><td>$10 dividend received from first share (not reinvested)</td></tr><tr><td>2</td><td>—</td><td>$230 received from selling two shares at $115 per share</td></tr></tbody></table><p>The annualized time-weighted rate of return of the investment over the two-year period is closest to</p>","explhtml":"<p><b>A. Không chính xác. </b>Đây là tỷ suất lợi nhuận tính theo tiền, được tính giống như tỷ suất hoàn vốn nội bộ (tỷ lệ chiết khấu đặt tổng giá trị hiện tại của dòng tiền về 0). Máy tính:\\(CF_0=-100\\)(chia sẻ đầu tiên),\\(CF_1=-110+10=-100\\)(mua cổ phiếu thứ hai trừ cổ tức đầu tiên),\\(CF_2=230\\)(tiền bán 2 cổ phiếu); IRR\\(\\approx 9.7\\%\\).</p><p><b>B. Đúng. </b>Lợi nhuận gia quyền theo thời gian đo lường mức tăng trưởng kép của 1 đô la đầu tư trong kỳ - giá trị tru
