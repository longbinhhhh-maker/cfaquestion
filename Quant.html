 tổng bằng\n0), tạo ra mối tương quan xếp hạng là 1.\nPhương pháp định lượng: giải thích các thử nghiệm tham số và phi tham số của giả thuyết rằng\nhệ số tương quan tổng thể bằng 0 và xác định xem giả thuyết có bằng 0 hay không bị\ntừ chối ở mức ý nghĩa nhất định","qhtml":"<p>An analyst tabulates the ranks of four paired observations of random variables X and Y as follows:</p><table class=qt><thead><tr><th>Observation</th><th>Rank of X</th><th>Rank of Y</th></tr></thead><tbody><tr><td>1</td><td>1</td><td>2</td></tr><tr><td>2</td><td>2</td><td>3</td></tr><tr><td>3</td><td>3</td><td>4</td></tr><tr><td>4</td><td>4</td><td>1</td></tr></tbody></table><p>The Spearman rank correlation coefficient between X and Y is closest to:</p>"},{"n":84,"q":"An analyst runs a simple linear regression to test whether the variation in the\ndemand for corn explains the variation in the supply of wheat. In this model, the supply of\nwheat is a(n):","opts":["indicator variable.","explained variable.","independent variable."],"ans":"B","expl":"A. Không chính xác vì sự thay đổi trong nguồn cung lúa mì là một biến phụ thuộc không bị giới hạn ở\ngiá trị 0 hoặc 1. Giả sử chúng ta muốn kiểm tra xem thu nhập hàng quý\nthông báo của một công ty có ảnh hưởng đến lợi nhuận chứng khoán hàng tháng của công ty đó hay không. Trong trường hợp này, chúng ta có thể sử dụng biến chỉ báo\nhoặc biến giả chỉ nhận các giá trị 0 hoặc 1 làm biến\nđộc lập.\nB. Đúng vì sự thay đổi trong nhu cầu ngô đang được sử dụng để giải thích sự thay đổi trong\ncung cấp lúa mì. Do đó, sự thay đổi trong nguồn cung lúa mì là biến\nphụ thuộc, hoặc biến được giải thích. Chúng tôi gọi biến có biến thể đang được giải thích\nlà biến phụ thuộc hoặc biến được giải thích, biến này thường được ký hiệu là Y.\nC. Không chính xác vì sự thay đổi trong nhu cầu ngô đang được sử dụng để giải thích sự thay đổi\ntrong nguồn cung lúa mì. Do đó, sự thay đổi trong nhu cầu về ngô là biến độc lập\n. Chúng tôi đề cập đến biến có biến thể đang được sử dụng để giải thích biến thể\ncủa biến phụ thuộc là biến độc lập hoặc biến giải thích\n, biến này thường được biểu thị bằng X.\nPhương pháp định lượng: mô tả một mô hình hồi quy tuyến tính đơn giản, tiêu chí bình phương nhỏ nhất\nđược sử dụng để ước tính các hệ số hồi quy và cách giải thích các hệ số hồi quy này\ncác hệ số","qhtml":null},{"n":85,"q":"A return distribution with negative skew and a mean of zero most likely has","opts":["frequent small gains and a few extreme losses.","frequent small losses and a few extreme gains.","frequent extreme losses and a few small gains."],"ans":"A","expl":"A. Đúng vì phân phối lợi nhuận có độ lệch âm thường có mức tăng nhỏ và\nmột số khoản lỗ cực lớn.\nB. Không chính xác vì phân phối lợi nhuận có độ lệch dương thường có những khoản lỗ nhỏ và\nmột số lợi nhuận cực lớn. Phân phối lợi nhuận có độ lệch âm thường có mức tăng nhỏ và\nmột số khoản lỗ cực lớn.\nC. Không chính xác vì phân phối lợi nhuận có độ lệch dương thường có những khoản lỗ nhỏ và\nmột số lợi nhuận cực lớn. A\nphân phối lợi nhuận với độ lệch âm thường mang lại lợi ích nhỏ và một số tổn thất cực lớn.\nPhương pháp định lượng: diễn giải và đánh giá các thước đo về độ lệch và độ nhọn để\ngiải quyết vấn đề đầu tư","qhtml":null},{"n":86,"q":"If the relationship between the dependent variable and independent variable is\nlinear, the regression residuals when plotted against the independent value should appear\nto","opts":["be linear.","be random.","follow a pattern"],"ans":"B","expl":"A. Không chính xác vì khi chúng ta xem xét phần dư của một mô hình, điều chúng ta muốn thấy là\nphần dư là ngẫu nhiên. Phần dư không được biểu thị một mẫu khi được vẽ đồ thị\nđối với biến độc lập.\nB. Đúng vì khi chúng ta xem xét phần dư của một mô hình, điều chúng ta muốn thấy là\nphần dư là ngẫu nhiên. Phần dư không được biểu thị một mẫu khi được vẽ đồ thị\nđối với biến độc lập.\nC. Không chính xác vì khi chúng ta xem xét phần dư của một mô hình, điều chúng ta muốn thấy là\nphần dư là ngẫu nhiên. Phần dư không được thể hiện một khuôn mẫu khi được vẽ đồ thị\nđối với biến độc lập.\nPhương pháp định lượng: giải thích các giả định cơ bản của mô hình hồi quy tuyến tính đơn giản\nvà mô tả cách phần dư và đồ thị phần dư cho biết liệu các giả định này có thể\nđã bị vi phạm hay không","qhtml":null},{"n":87,"q":"In which of the following cases is cluster sampling most likely used? When:","opts":["conducting a market survey","auditing financial statements","creating a bond portfolio to mirror the performance of a specified index"],"ans":"A","expl":"A. Đúng vì vì, trong lấy mẫu cụm, tổng thể được chia thành các cụm, mỗi cụm\nvề cơ bản là một đại diện nhỏ của toàn bộ tổng thể. Sau đó, một số cụm nhất định\nđược chọn tổng thể bằng cách lấy mẫu ngẫu nhiên đơn giản Lấy mẫu cụm thường được sử dụng cho\nkhảo sát thị trường và phiên bản phổ biến nhất xác định các cụm dựa trên thông số\nđịa lý.\nB. Không chính xác vì việc lấy mẫu mang tính phán xét chứ không phải theo cụm bao gồm việc chọn lọc kỹ lưỡng các phần tử\ntừ tổng thể dựa trên kiến ​​thức của nhà nghiên cứu và phán đoán\nchuyên môn. Ví dụ: khi kiểm toán báo cáo tài chính, các kiểm toán viên dày dạn kinh nghiệm có thể áp dụng\n phán đoán đúng đắn của mình để chọn các tài khoản hoặc giao dịch có thể cung cấp phạm vi kiểm toán đầy đủ\n.\nC. Không chính xác vì việc tạo danh mục đầu tư trái phiếu để phản ánh hiệu suất của chỉ số\nđược chỉ định là một ứng dụng lấy mẫu phân tầng. Lập chỉ mục trái phiếu là một lĩnh vực trong đó việc lấy mẫu\nphân tầng, thay vì lấy mẫu theo cụm, thường được áp dụng. Lập chỉ mục là một chiến lược đầu tư\ntrong đó nhà đầu tư xây dựng một danh mục đầu tư để phản ánh hiệu suất của một\nchỉ mục cụ thể.\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự tiện lợi và lấy mẫu phán đoán cũng như tác động của chúng đối với lỗi lấy mẫu trong một\nvấn đề đầu tư","qhtml":null},{"n":88,"q":"Samples are drawn from a population that follows a binomial distribution with a\nprobability of success on a trial of 0.3. According to the central limit theorem, as the\nsample size increases, the distribution of the sample mean approaches a","opts":["negatively skewed distribution.","symmetric distribution.","positively skewed distribution"],"ans":"B","expl":"A. Không chính xác vì phân phối nhị thức cơ bản thể hiện độ lệch khi p\n≠ 0,5, chứ không phải phân phối lấy mẫu của giá trị trung bình mẫu. Vì kích thước mẫu lớn nên\nphân phối của giá trị trung bình mẫu sẽ gần như bình thường theo định lý giới hạn trung tâm\nvà do đó có tính đối xứng.\nB. Đúng vì theo định lý giới hạn trung tâm, phân bố lấy mẫu của trung bình mẫu\nsẽ xấp xỉ chuẩn khi cỡ mẫu n lớn. Phân phối\nbình thường có độ lệch bằng 0 (nó đối xứng). Vì phân phối nhị thức có giá trị trung bình\ncủa np và phương sai hữu hạn của np(1 - p), trong đó n là số lần thử và p là xác suất\nthành công, nên định lý giới hạn trung tâm đúng.\nC. Không chính xác vì phân phối nhị thức cơ bản thể hiện độ lệch khi p\n≠ 0,5, chứ không phải phân phối lấy mẫu của giá trị trung bình mẫu. Vì kích thước mẫu lớn nên\nphân phối của giá trị trung bình mẫu sẽ xấp xỉ bình thường theo định lý giới hạn trung tâm\nvà do đó có tính đối xứng.\nPhương pháp định lượng: giải thích định lý giới hạn trung tâm và tầm quan trọng của nó đối với\nphân phối và sai số chuẩn của giá trị trung bình mẫu","qhtml":null},{"n":89,"q":"A graphical depiction of a continuous distribution shows the left tail to be longer than\nthe right tail. The distribution is best described as having","opts":["negative skewness.","leptokurtosis.","positive skewness."],"ans":"A","expl":"A. Đúng vì Phân phối bị lệch âm xuất hiện như thể phần đuôi bên trái đã bị kéo ra khỏi giá trị trung bình\n. Độ lớn trung bình của độ lệch âm so với giá trị trung bình lớn hơn\nđộ lệch trung bình của độ lệch dương.\nB. Không chính xác vì Kurtosis đề cập đến độ cao tương đối của phân phối; bệnh leptokurtosis có nghĩa là\nđạt đỉnh nhiều hơn bình thường.\nC. Không chính xác vì Phân phối bị lệch âm xuất hiện như thể phần đuôi bên trái đã bị kéo đi\nkhỏi giá trị trung bình.\nPhương pháp định lượng: diễn giải và đánh giá các thước đo độ lệch và độ nhọn để\ngiải quyết vấn đề đầu tư","qhtml":null},{"n":90,"q":"A nonparametric test is most appropriate when:","opts":["comparing differences between means.","data are given in ranks.","data meet distributional assumptions"],"ans":"B","expl":"A. Không chính xác vì Các thử nghiệm liên quan đến sự khác biệt giữa các phương tiện liên quan đến một tham số.\nCác thử nghiệm phi tham số được sử dụng khi dữ liệu không liên quan đến một tham số hoặc dữ liệu không\nđáp ứng các giả định về phân phối.\nB. Đúng vì Thử nghiệm phi tham số được sử dụng trong ba trường hợp:\n1) khi dữ liệu không đáp ứng các giả định về phân phối,\n2) khi dữ liệu được đưa ra theo thứ hạng\nvà\n3) khi giả thuyết không liên quan đến một tham số.\nC. Không chính xác vì Khi dữ liệu đáp ứng các giả định về phân phối, thử nghiệm tham số sẽ được sử dụng\nthay vì thử nghiệm không tham số.\nPhương pháp định lượng: so sánh và đối chiếu loại thử nghiệm tham số phù hợp và\nkhông tham số, đồng thời mô tả các tình huống trong đó mỗi loại đều tốt hơn","qhtml":null},{"n":91,"q":"If a client controls the timing of cash flows into and out of a portfolio, which of the\nfollowing is most appropriate when evaluating the performance of the portfolio manager?","opts":["Time-weighted rate of return","Arithmetic mean rate of return","Money-weighted rate of return"],"ans":"A","expl":"A. Đúng vì tỷ suất lợi nhuận tính theo thời gian là thước đo hiệu quả ưa thích\nvì nó vô hiệu hóa tác động của việc rút tiền mặt hoặc bổ sung vào danh mục đầu tư, vốn\nthường nằm ngoài tầm kiểm soát của người quản lý danh mục đầu tư.\nB. Không chính xác vì kết quả trả về số học bị thiên lệch lên trên. Để đánh giá danh mục đầu tư\nchứng khoán giao dịch công khai, tỷ suất lợi nhuận gia quyền theo thời gian là thước đo hiệu quả hoạt động ưu tiên\n.\nC. Không chính xác vì các nhà quản lý đầu tư nhận thấy lợi nhuận tính theo thời gian có ý nghĩa hơn. Nếu\nmột khách hàng cung cấp cho người quản lý đầu tư nhiều tiền hơn để đầu tư vào thời điểm không thuận lợi,\ntiền của người quản lý - tỷ suất lợi nhuận gia quyền sẽ có xu hướng giảm. Nếu khách hàng nạp tiền\nvào thời điểm thuận lợi, lợi nhuận tính theo tiền sẽ có xu hướng tăng lên. Tỷ suất lợi nhuận theo trọng số theo thời gian -\nsẽ loại bỏ những ảnh hưởng này.\nPhương pháp định lượng: so sánh tỷ suất lợi nhuận theo trọng số theo tiền và theo thời gian\nvà đánh giá hiệu suất của danh mục đầu tư dựa trên các thước đo này","qhtml":null},{"n":92,"q":"Grouping all publicly traded US firms by sector and then randomly selecting\nsubsamples of firms from each sector according to the sector's proportion in the total\npopulation is an example of","opts":["cluster sampling","simple random sampling.","stratified random sampling."],"ans":"C","expl":"A. Không chính xác vì vì, trong lấy mẫu cụm, tổng thể được chia thành các cụm, mỗi cụm\nmà về cơ bản là một đại diện nhỏ của toàn bộ tổng thể. Sau đó, một số cụm\nđược chọn tổng thể bằng cách lấy mẫu ngẫu nhiên đơn giản. Phương pháp lấy mẫu mà\nnhà phân tích sử dụng không phải là lấy mẫu theo cụm vì thứ nhất, mỗi lĩnh vực không phải là một đại diện nhỏ của tất cả các công ty đại chúng\n, thứ hai, một số lĩnh vực nhất định không được chọn tổng thể.\nB. Không chính xác vì vì, trong lấy mẫu ngẫu nhiên đơn giản, một công ty đại chúng sẽ được chọn ngẫu nhiên\nmà không cần nhóm các công ty thành các ngành trước tiên. Mẫu ngẫu nhiên đơn giản là một tập hợp con của một\ntổng thể lớn hơn được tạo theo cách sao cho mỗi phần tử của tổng thể có\nxác suất được chọn vào tập hợp con đó như nhau.\nC. Đúng vì trong lấy mẫu ngẫu nhiên phân tầng, tổng thể được chia thành\ncác quần thể con (tầng lớp) dựa trên một hoặc nhiều tiêu chí phân loại. Sau đó, các mẫu ngẫu nhiên đơn giản\nđược rút ra từ mỗi tầng với kích thước tỷ lệ thuận với kích thước tương đối của từng tầng\ntrong dân số\nPhương pháp định lượng: so sánh và đối chiếu ngẫu nhiên đơn giản, ngẫu nhiên phân tầng, cụm,\nsự thuận tiện và lấy mẫu phán đoán cũng như tác động của chúng đối với lỗi lấy mẫu trong một\nvấn đề đầu tư","qhtml":null},{"n":93,"q":"In hypothesis testing, which of the following best describes a Type II error?","opts":["Rejecting a true null hypothesis","Rejecting a false null hypothesis","Failure to reject a false null hypothesis"],"ans":"C","expl":"A. Không chính xác vì nếu chúng ta bác bỏ giả thuyết khống một cách nhầm lẫn thì chúng ta chỉ có thể mắc một\nlỗi Loại I.\nB. Không chính xác vì việc bác bỏ một giả thuyết không sai là một quyết định đúng và do đó không phải là\nlỗi Loại II.\nC. Đúng vì khi đưa ra quyết định trong quá trình kiểm tra giả thuyết, chúng ta có nguy cơ mắc phải\nlỗi Loại I hoặc Loại II. Đây là những lỗi loại trừ lẫn nhau: Nếu chúng ta bác bỏ nhầm lẫn\ngiả thuyết không, thì chúng ta chỉ có thể mắc lỗi Loại I, nếu chúng ta không bác bỏ nhầm lẫn\nnull, thì chúng ta chỉ có thể mắc lỗi Loại II.\nPhương pháp định lượng: giải thích việc kiểm tra giả thuyết và các thành phần của nó, bao gồm ý nghĩa thống kê\n, lỗi Loại I và Loại II, cũng như sức mạnh của một kiểm tra.","qhtml":null}];
const CFG = {"title": "Quantitative Methods", "subtitle": "CFA Level 1 — Official Question Bank (Feb 2024)", "minutes": 186, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl || q.explhtml){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts,q.explhtml));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options,richHtml){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  if(richHtml){
    const choice=document.createElement("article"); choice.className="expl-choice is-correct";
    const top=document.createElement("div"); top.className="expl-choice-top";
    const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=correctLetter;
    const state=document.createElement("span"); state.className="expl-state"; state.textContent="Đáp án đúng";
    top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
    const optionIndex=LETTERS.indexOf(correctLetter);
    if(options&&optionIndex>=0&&options[optionIndex]){ const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option); }
    const reason=document.createElement("div"); reason.className="expl-reason expl-rich"; reason.innerHTML=richHtml; choice.appendChild(reason); content.appendChild(choice);
  }else explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(!richHtml&&(data.reading||data.los)){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<!--restart-confirm-start-->
<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
