<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A hedge fund has investors from several different countries. The hedge fund's obligations with respect to providing country-specific tax reporting information to investors will most likely be addressed by the:", "opts": ["side letter agreement.", "private placement memorandum.", "partnership operating agreement."], "ans": "A", "expl": "Common hedge fund documentation\nPrivate placement Marketing document that highlights the fund's\nmemorandum features and risks for potential investors\nAddresses legal and contractual relationship\nPartnership agreement\nbetween manager and investors\nAddresses additional legal, regulatory, tax, and\nSide letter agreement\nreporting requirements unique to specific investors\nA partnership agreement describes the contractual relationship between a hedge fund's manager (ie, general partner) and its investors (ie, limited\npartners). It often addresses matters such as investment strategy, fund structure, capital contribution, management fees, etc.\nFunds often use side letter agreements to address certain requirements (eg, legal, regulatory, tax) that are unique to specific investors. In\nthis scenario, the hedge fund would have a side letter agreement that addresses the requirements for investors with country-specific tax reporting\nneeds.\n(Choice B) A private placement memorandum is a marketing document provided to potential investors that highlights the standard financial\ninformation about the issuer, the purpose of the funds being raised, and other terms of investing in fund shares.\n(Choice C) A partnership operating agreement addresses the general relationship between the fund manager and the investors. It does not\naddress the special requirements unique to certain individual investors.\nThings to remember:\nFunds may use side letter agreements when they wish to address specific legal, regulatory, tax, operational, or reporting requirements. A\npartnership agreement dictates the general relationship between the fund manager and investors. A private placement memorandum is a\nmarketing document that highlights fund features and discloses risks to potential investors.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 2, "q": "A hedge fund has consistently outperformed traditional index-based mutual funds and ETFs due to the fund manager's ability to identify undervalued stocks. This type of superior performance is most appropriately attributed to:", "opts": ["market beta.", "strategy beta.", "idiosyncratic risk."], "ans": "C", "expl": "Sources of return for traditional funds vs. hedge funds\nSignificance level: Traditional funds Hedge funds\nMost Market exposure (beta) Idiosyncratic risk exposure\n↕ Sector/style exposure Sector/style exposure\nLeast Idiosyncratic risk exposure Market exposure (beta)\nHedge fund managers attempt to generate risk-adjusted excess returns (ie, alpha) by maximizing idiosyncratic returns (ie, returns unique to\ninvested companies/securities) while simultaneously minimizing market exposure. Managers can generate idiosyncratic returns through\nidentifying mispriced securities, properly timing the market, and using leverage. In this scenario, the fund manager's stock selection skills\nprovided idiosyncratic returns unique to each undervalued company's stock.\n(Choice A) Hedge fund returns are not typically attributed to market beta since hedge funds seek to minimize exposure to market risks. Instead,\nhedge funds focus on exposure to idiosyncratic (ie, company-specific) risk.\n(Choice B) Strategy beta is attributed to the hedge fund's investment style (eg, fundamental growth, fundamental value, convertible arbitrage).\nThings to remember:\nHedge fund managers attempt to generate risk-adjusted excess returns by maximizing idiosyncratic returns (ie, returns unique to invested\ncompanies/securities) while simultaneously minimizing market exposure. Managers can generate idiosyncratic returns through identifying\nmispriced securities, properly timing the market, and using leverage.\nAnalyze sources of risk, return, and diversification among hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 3, "q": "Theoretically, which of the following is the primary driver of hedge fund alpha?", "opts": ["Moderation of market risks", "Diversifying style/sector risks", "Exposure to idiosyncratic risks"], "ans": "C", "expl": "Sources of return for traditional funds vs. hedge funds\nSignificance level: Traditional funds Hedge funds\nMost Market exposure (beta) Idiosyncratic risk exposure\n↕ Sector/style exposure Sector/style exposure\nLeast Idiosyncratic risk exposure Market exposure (beta)\nHedge funds attempt to generate alpha primarily by optimizing idiosyncratic risk (ie, nonsystematic risk) exposure while minimizing market\nexposure, which is measured by beta. Managers can generate idiosyncratic returns through identifying mispriced securities, timing the market,\nand using leverage.\nIn contrast, traditional investment funds, especially index funds such as ETFs and mutual funds, typically mimic market returns by holding large\nsecurity portfolios that diversify away idiosyncratic risk. Therefore, traditional fund returns are primarily based on market risk exposure (ie, beta).\n(Choice A) The moderation of market risk is the least important source of alpha for hedge funds. Nullifying beta (ie, market risk) contributes the\nleast to a manager's pursuit of alpha.\n(Choice B) Diversifying away sector/style risks would simply insulate the portfolio from those sources of return, rather than serve as the primary\nsource of alpha. Hedge funds seek to diversify away market return risk, focusing instead on idiosyncratic returns (ie, returns unique to a security).\nThings to remember:\nHedge funds attempt to generate alpha primarily by optimizing idiosyncratic risk exposure (ie, returns unique to invested companies/securities)\nwhile minimizing market exposure, which is measured by beta. Managers can generate idiosyncratic returns through identifying mispriced\nsecurities, timing the market, and using leverage.\nAnalyze sources of risk, return, and diversification among hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 4, "q": "A large accredited investor wishing to invest in a hedge fund that holds the underlying assets in the investor's name would most appropriately choose a(n):", "opts": ["fund of one.", "master-feeder structure.", "separately managed account."], "ans": "C", "expl": "Hedge funds: forms of direct investment\nMost common fund form\nPooled investment vehicles\nMaster-feeder structure\nConsists of an offshore feeder fund and an onshore feeder\nfund that funnel capital into a master investment fund\nSuitable for large institutional or accredited investors\nFund of one Separate investment account created for an investor\nUnderlying assets held and registered in fund's name\nSuitable for large institutional or accredited investors\nSeparately managed\nSeparate investment account created for an investor\naccount (SMA)\nUnderlying assets held and registered in investor's name\nA hedge fund is generally a private pool investment vehicle funded by capital from multiple accredited investors (eg, institutions, high-net-worth\nindividuals). A general partner manages the fund's day-to-day operations and operates within guidelines set by the partnership agreement. Most\nhedge funds are formed with a master-feeder structure comprised of both onshore and offshore accounts that funnel capital to a master fund.\nLarger accredited investors enjoy exclusive access to individually managed accounts (instead of commingled funds accounts) through a\nseparately managed account (SMA) or a \"fund of one.\" In a SMA, the invested assets are held and registered under the investor's name while\nthe hedge fund manager manages the account.\n(Choice A) In a fund of one, a hedge fund is created specifically for a single investor and follows that investor's mandates, but the assets are\nregistered under the fund's name, instead of in the investor's name.\n(Choice B) A master-feeder structure is used to funnel investment funds to hedge fund management to invest in pooled investment vehicles. This\nstructure is not used to fund individually managed accounts.\nThings to remember:\nLarger institutional or accredited hedge fund investors may enjoy exclusive access to individually managed accounts instead of commingled funds\naccounts. In a separately managed account, the invested assets are held and registered under the investor's name while the hedge fund manager\nmanages the account. In a fund of one, a hedge fund is created specifically for a single investor and follows that investor's mandates, but the\nassets are registered under the fund's name.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 5, "q": "A hedge fund is subject to a margin call and is unable to post additional collateral. The most likely outcome is that the:", "opts": ["lockup period allows for an orderly liquidation.", "prime broker realizes a loss on the margin loan.", "margin call magnifies the losses for the hedge fund."], "ans": "C", "expl": "Alternative investment managers commonly use leverage to successfully implement investment strategies. Hedge funds borrow from a prime\nbroker to finance trades using the initial margin requirements.\nThe prime broker protects its capital by imposing a maintenance margin requirement that specifies the minimum equity percentage (eg, 30%) that\nmust be maintained. If the equity value drops below the minimum, a margin call is issued, and the investor (ie, hedge fund) must contribute\nadditional equity. If the hedge fund is unable or unwilling to contribute additional cash or collateral, the prime broker sells the entire position to\nrecoup the loan and prevent losses to the firm.\nWhen the position is closed by the prime broker, losses on the position are \"locked in\" by a forced liquidation. Due to the abrupt and\nimmediate nature of a forced liquidation, closing the position can negatively impact the security; as the prime broker liquidates its position, the\nprice may fall significantly, further magnifying losses for the hedge fund.\n(Choice A) A lockup period restricts withdrawals by investors for a certain period of time after they invest. Lockups allow for an orderly liquidation\nof positions due to investor redemptions, not a forced liquidation due to a margin call.\n(Choice B) The prime broker implements the margin call to avoid suffering losses on its loan to the hedge fund.\nThings to remember:\nIf a hedge fund is unable or unwilling to contribute additional cash or collateral to a margin call, the forced liquidation leads to \"locked-in\" and often\nmagnified losses.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAKfCAIAAADozoqiAAEAAElEQVR42uydZ5wTVRfGn0m2Lyy9F5EO0ovSLIhifUEECwjYKyooxQbYsCDYUESkiQ1RFLAACopIUxBFKQKKIErvsLAtybwfnt3rOJNkAyLN5/+BX8hOZu7ceye5557nnGPZtg0hhBBCCCGEONHwqQuEEEIIIYQQMmaEEEIIIYQQQsaMEEIIIYQQQsiYEUIIIYQQQsiYEUIIIYQQQggZM0IIIYQQQgghY0YIIYQQQgghY0YIIYQQQgghZMwIIYQQQgghhIwZIYQQQgghhJAxI4QQQgghhJAxI4QQQgghhBAyZoQQQgghhBBCxowQQgghhBBCxowQQgghhBBCyJgRQgghhBBCCBkzQgghhBBCCBkzQgghhBBCCCFjRgghhBBCCCFkzAghhBBCCCGEjBkhhBBCCCGEjBkhhBBCCCGEkDEjhBBCCCGEEDJmhBBCCCGEEDJmhBDiOMG2bdu2Xf/1vuM9MhQKhUKh6OeMcsyhtirs+2HfiX6qfN+PpcGRuuifX917v96hCTsckc4Q5Z1D7bQoox9jD8TSqkhDHMsc8M7eQ73fw55OQgghY0YIIYQQQgghjg2WdmuEEDhxHDIALMuK9A733S3L4ju2bZs/OY+M9H5YeE6fzxf2ouZUznNGdzt4DzMn9B5j/uRtRtiL5ns7kdoZ5UainNP1J+9wuBoce2NMP7g6x3utfG85xoGIMoJRxi56F7k+6O2QfLvokNrg+pNrzkSZ9mFnlxBCyJgRQoh/17YJuxqLsmjz/tf1J+e6M4oNE70x0S8ay9oxilVz1GzFKEvhGC2rKDZPvgMX4wo+dkMu35Pna47GPgqx2EXm0qYHvB2er/kU3d6LYp/LbhFCQDIzIYQQQgghhIA8M0IIgUPfet+5cyeARx55ZNeuXXBs8N9///0A6tSpYz6Y R1YSIwli93Uc5/DDDwdGjBgh80r//ve/gSVLlogNXm1miqIoiqIoiqKgNjNFUdhy0wH9boDBPL+ioiIRZHwh2E/7U7+ZshU/FPIUmKYpz4X/X3Fj+o+JoigKW07TzCoLlvTo0aO0tBR47bXXxFi+YsWKfv36AWI/A+644w7g9ttvl0pikUhEGlaec845QQPbwIEDu3XrBmy33Xay0WbNml111VWAlDtzXVf+DIVC48aNA5o2bXr//feTdvMOGDDAr5zWq1cvoLS0tHv37sDixYuffPJJoHPnzsBee+2lfWYURVEURVEURdlKMHSeVVHYtqdtAMdxJHlGygD4f/oL6A+Fsu3ky/oSjcz/WZYV/FNRFIWtrtFWlRpORrKNBjOKomzWUY38FMh/HccJFkLR86Nsm4GNX0JHu8ooirLVT2tuuT90ajNTFEVRFEVRFAW1mSmKwlY2VaMoqtLoSVAURdFgRlEURVEURVEU1HiG2swURVEURVEURUGVGT0LiqIoiqIoiqJscfw/XgfYxuZBVdUAAAAASUVORK5CYII="]}, {"n": 6, "q": "A hedge fund that is most likely to use a top-down approach to identify investments is a:", "opts": ["macro fund.", "distressed investing fund.", "convertible arbitrage fund."], "ans": "A", "expl": "Hedge fund strategies and characteristics\nCategory Characteristics\nCapitalize on short-term corporate events (eg, mergers)\nEvent-driven strategies Company-level analysis (ie, \"bottom-up\")\nUse long and short strategies\nExploit short-term pricing discrepancies of related securities\nRelative value strategies\nMost common example is convertible arbitrage\nIdentify long-term economic trends (ie, \"big picture\")\nMacro funds Industry-level analysis (ie, \"top-down\")\nTake long and short positions\nFocus on publicly traded common stock\nEquity hedge funds \"Bottom-up\" analysis\nTake long and short positions to hedge unwanted risk\nMacro hedge funds focus on investment opportunities based on economic trends. Their expertise is to recognize the early signs of how one or\nmore markets are likely to move, and then use different strategies to exploit the movement. In general, macro funds focus on an entire industry or\nsector rather than specific companies, so they employ a top-down approach to evaluating investment opportunities.\n(Choice B) A distressed investing fund is a type of event-driven fund. These funds purchase debt of a company experiencing severe financial\ndifficulties. The debt is priced at a significant discount, and the fund profits if the company can successfully restructure so that the value of its debt\nincreases.\n(Choice C) A convertible arbitrage fund attempts to profit from perceived mispricing between a convertible bond and the underlying common\nstock. In efficient markets, the relative mispricing exists for a very short time, as supply and demand will cause any arbitrage opportunities to\nquickly disappear.\nThings to remember:\nHedge funds use several different investment strategies. Most strategies are based on short-term situations, such as mergers or arbitrage\nopportunities involving related securities. Macro funds invest to profit from economic or market trends, and those investment strategies tend to be\nmore long term.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 7, "q": "Which of the following best describes an advantage of investing in a fund of hedge funds over an individual hedge fund? A fund of hedge funds:", "opts": ["can have less restrictive redemption terms.", "typically has a more simplified fee structure.", "provides higher returns by shorting underperforming hedge funds."], "ans": "A", "expl": "Fund of hedge fund advantages and disadvantages\nLess investor due diligence required\nImproved accessibility\nAdvantages\nBetter redemption terms\nMore diversified\nMore complex\nDisadvantages\nMore expensive\nA fund of hedge funds (aka a fund of funds) is a fund that invests in multiple hedge funds. This creates a diversified portfolio of hedge funds\nthat potentially spans multiple strategies or geographic areas. A fund of hedge funds' returns are generated by the underlying individual hedge\nfunds.\nFund of funds managers are assumed to have expertise in conducting due diligence on the funds they invest in, saving investors the time and\nresources of doing due diligence on the multiple funds themselves.\nIn addition, fund managers may have better relationships or more leverage than individual investors with the hedge funds in which they invest.\nThis would provide individual investors potential benefits otherwise unavailable to them, including better redemption terms. For instance,\nindividual hedge funds may impose redemption terms, which include lockup periods (ie, notice periods before withdrawals can be made) and\nredemption fees.\n(Choice B) Funds of funds investors typically pay a management fee and may pay an incentive fee to the fund manager. Any fees charged by\nthe individual hedge funds are also passed through to the investors by the fund of funds. This makes funds of funds' fee structure more complex\nand more expensive than those for individual hedge funds.\n(Choice C) Since funds of funds managers purchase and redeem their investments directly from hedge funds and not on the open market, the\nfunds cannot be borrowed and shorted.\nThings to remember:\nFunds of hedge funds (also known as funds of funds) create a portfolio of hedge funds for investors. They can provide several advantages over\nindividual hedge fund investments, including the potential to negotiate better redemption terms than individual investors receive. However, the\nfunds of funds' fee structure is more complex and more expensive than those for individual hedge funds.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 8, "q": "A retail investor who wishes to obtain hedge fund exposure by diversifying across strategies and managers would most appropriately choose to invest in a(n):", "opts": ["fund of funds (FoF).", "multi-strategy hedge fund.", "managed futures account (MFA)."], "ans": "A", "expl": "Advantages of hedge fund investing through a fund of funds (FoF)\nAdvantage Rationale\nBetter diversification One investment gains exposure to multiple funds\nEnhanced FoF managers presumably offer better due diligence of\nmanagement potential funds\nSome hedge funds are closed to direct investment, but may\nAccess\nbe accessible through FoF\nMinimum investment May offer lower initial investment\nEnhanced redemption FoF may have preferred status with respect to redemptions\nability from underlying hedge funds\nA hedge fund is a private pooled investment vehicle defined by its investment strategy (eg, long/short, merger arbitrage, convertible bond\narbitrage). Many hedge funds utilize leverage, short selling, and/or exotic instruments coupled with complex strategies to enhance returns. Due to\ntheir complex nature and lack of regulation, hedge funds are directly available only to accredited investors (eg, institutions, high-net-worth\nindividuals).\nHowever, retail investors can still gain indirect exposure to hedge funds by investing in a fund of funds (FoF): a fund that invests in multiple\nunderlying hedge funds. This structure allows for greater public access and improves diversification.\nThe main disadvantage to the FoF approach is a higher fee structure. The FoF's return is reduced by the fees imposed by each of the underlying\nhedge funds. In addition, the FoF itself charges both a fee on assets under management and an incentive fee, so the investor's return is reduced\nby two layers of fees.\n(Choice B) A multi-strategy hedge fund deploys relative value strategies across asset classes and instruments. However, a multi-strategy hedge\nfund is still restricted to accredited investors.\n(Choice C) A managed futures account (MFA) may provide higher returns, as well as diversification within assets that utilize futures. However,\nthese benefits are not across a broad spectrum of potential hedge fund investments.\nThings to remember:\nRetail investors can gain indirect exposure to hedge funds by investing in a fund of funds (FoF): a fund that invests in multiple underlying hedge\nfunds. This structure allows retail investors access to hedge fund strategies with improved diversification. The main disadvantage to the FoF\napproach is a higher fee structure.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 9, "q": "Which of the following hedge fund strategies is least likely to use short selling?", "opts": ["Activist", "Market-neutral", "Merger arbitrage"], "ans": "A", "expl": "Select hedge fund categories and strategies\nStrategy name Common strategy description\nMarket neutral Long/short to neutralize market risk\nEquity hedge Fundamental growth Fundamental analysis to identify high growth stocks\nQuantitative directional Technical analysis to identify over/undervalued stocks\nFixed income general Long/short to identify relative value discrepancies\nRelative value\nVolatility Buy/sell options to long/short market volatility\nMerger arbitrage Purchase target while selling acquirer\nEvent-driven\nActivist Purchase equity to influence company decisions\nMacro Macro Top-down approach to identify economic trends\nHedge funds are aggressively managed pooled investment vehicles. Their returns and risk are often elevated with leverage, derivates, and short\nselling. Different hedge fund strategies focus on different areas of the market and take on different types of risk.\nActivist shareholder (ie, activist) strategies are event-driven strategies that focus on influencing a company's strategic direction or decision-\nmaking (eg, divestitures, capital distributions). Activists may also seek to add members to the company's board of directors or to replace part of\nthe company's executive management team.\nSince activists seek influence, their primary strategy is to purchase a company's common shares until they become one of its largest\nshareholders. Short selling is not likely to be a part of this strategy. Activist strategies can be especially effective if activists are able to enlist other\nshareholders in their cause.\n(Choice B) Short selling is an important part of market-neutral hedge fund strategies, which aim to identify and purchase undervalued securities\nwhile simultaneously short selling overvalued securities to remain neutral with regard to market risk.\n(Choice C) Short selling is an important part of merger arbitrage hedge fund strategies. Such strategies aim to profit from the deal spread of an\nannounced merger, typically by purchasing the stock of the target company while simultaneously short selling the stock of the acquiring company.\nThings to remember:\nActivist hedge funds focus on acquiring large portions of a company's equity to affect the company's strategic direction or decision-making. For\nthis reason, an activist primarily purchases common shares with the aim of becoming one of the company's largest shareholders. This strategy is\nnot likely to include short selling.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 10, "q": "At the time of a merger announcement, a hedge fund manager purchases stock of the target company and shorts the stock of the acquirer. Which type of hedge fund strategy best characterizes this approach?", "opts": ["Macro", "Event-driven", "Relative-value"], "ans": "B", "expl": "Hedge fund strategies and characteristics\nCategory Characteristics\nCapitalize on short-term corporate events (eg, mergers)\nEvent-driven strategies Company-level analysis (ie, \"bottom-up\")\nUse long and short strategies\nExploit short-term pricing discrepancies of related securities\nRelative value strategies\nMost common example is convertible arbitrage\nIdentify long-term economic trends (ie, \"big picture\")\nMacro funds Industry-level analysis (ie, \"top-down\")\nTake long and short positions\nFocus on publicly traded common stock\nEquity hedge funds \"Bottom-up\" analysis\nTake long and short positions to hedge unwanted risk\nHedge funds are pooled investment vehicles that pursue high returns by engaging in strategies that may be high risk. They can be categorized by\nthe types of assets they invest in or by their strategy. Hedge funds pursuing event-driven strategies seek profits from stock price changes\nrelated to an event that affects specific companies. Merger arbitrage hedge funds are categorized as event-driven strategies.\nIn a merger, frequently the market perceives that the acquiring company overpays. This often results in the acquirer's stock price decreasing while\nthe price of the target company increases. Merger arbitrage funds try to exploit this by buying (ie, go long) the stock of the target and selling (ie,\ngo short) the stock of the acquiring company.\n(Choice A) Macro hedge funds focus on opportunities based on economic trends, not on events that affect specific companies. In general, macro\nfunds focus on an entire industry or sector rather than on specific companies (ie, employing a top-down evaluation approach).\n(Choice C) Relative-value strategies seek to exploit short-term pricing discrepancies between related securities. The price discrepancies are\nexpected to resolve within a short time frame. For example, fixed-income convertible arbitrage strategies may involve simultaneously buying\nconvertible stock and selling common stock for the same company.\nThings to remember:\nEvent-driven hedge fund strategy managers pursue profits from stock price changes related to an event (eg, a merger announcement) that affects\nspecific companies.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 11, "q": "Which of the following is most likely a direct form of hedge fund investment?", "opts": ["Fund of hedge funds", "Master feeder structure", "Hedge fund replication ETFs"], "ans": "B", "expl": "Forms of hedge fund investments\nDirect forms Indirect forms\nMaster feeder structure Fund of hedge funds\nSeparately managed accounts Hedge fund replication ETFs\nHedge funds are commonly established as privately managed investment partnerships, either onshore or in offshore locations. These funds\naccept investments from individuals who meet specific criteria related to their income and/or overall financial worth.\nHedge fund investments can be direct or indirect. The most common direct form is a master feeder structure, which allows eligible investors to\ninvest through either an onshore or offshore feeder fund to optimize tax advantages. The feeder funds feed into a master fund that then invests\nthe capital.\nAnother example of direct investing is the separately managed account (SMA). SMAs are personalized investment portfolios tailored to meet\ninvestors' specific requirements. They are particularly suitable for larger institutional investors.\nIndirect investments, such as a fund of hedge funds or a hedge fund replication ETF, are better suited for smaller investors who have limited\nresources and expertise (Choices A and C). The advantages of an indirect arrangement for smaller investors include reduced management fees\nand increased performance transparency and liquidity.\nA fund of hedge funds is a professionally managed investment portfolio that consists of multiple hedge funds. Hedge fund replication ETFs seek\nto replicate the investment styles of hedge funds using liquid assets, either through indexing or active management. Their goal is to mimic the\nreturns of established hedge fund strategies, such as long/short equity, market neutral, and event-driven approaches.\nThings to remember:\nDirect forms of hedge fund investment, such as a master feeder structure or separately managed account (SMA), allow eligible investors to invest\nthrough either an onshore or offshore feeder fund to optimize tax advantages. The feeder investments funnel into a master fund that invests the\ncapital.\nDescribe investment forms and vehicles used in hedge fund investments", "qhtml": null, "explfigs": null}, {"n": 12, "q": "Compared with an individual hedge fund, a fund of funds will more likely:", "opts": ["have a simpler fee structure.", "offer less restrictive redemption terms.", "be used by large investors to attain hedge fund exposure."], "ans": "B", "expl": "Fund of hedge fund advantages and disadvantages\nLess investor due diligence required\nImproved accessibility\nAdvantages\nBetter redemption terms\nMore diversified\nMore complex\nDisadvantages\nMore expensive\nA fund of hedge funds (ie, fund of funds [FoF]) is a fund that invests in multiple hedge funds. This creates a portfolio of hedge funds that can\nspan multiple strategies or geographic markets.\nFoF managers provide individual investors with potential benefits, including better redemption terms. FoFs can negotiate the terms directly with\nhedge funds; such negotiations are usually beyond the ability of individual investors.\n(Choice A) FoF investors typically pay a management fee and sometimes an incentive fee to the FoF manager. In addition, individual hedge fund\nfees flow to the investor via the FoF. This makes FoFs more complex and expensive in their fee structure than individual funds.\n(Choice C) Large investors (eg, high-net-worth individuals, institutional investors) rely less on FoFs since they have direct access to individual\nhedge funds. Smaller investors often cannot meet the minimum capital requirements of hedge funds, so the FoF structure is sometimes the only\nway they can obtain hedge fund exposure.\nThings to remember:\nFunds of hedge funds (ie, funds of funds [FoF]) provide a portfolio of hedge funds for investors. FoFs offer several advantages over individual\nhedge funds, including the ability of FoF managers to negotiate better redemption terms for their clients. However, FoFs typically have more\nexpensive and complex fee structures than individual hedge funds.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 13, "q": "Compared to investing in a single hedge fund, which of the following is most likely an advantage of investing in a fund-of-funds?", "opts": ["Greater tax efficiency", "Avoiding the double fee structure", "Resources to better perform due diligence"], "ans": "C", "expl": "Fund-of-funds vs. single hedge fund\nDiversification\nInvestment expertise\nAdvantages Due diligence expertise\nLower investment minimums\nEnhanced redemption ability\nDisadvantage Additional layer of fees to overcome\nA fund-of-funds (FOF) is an alternative investment vehicle that invests in multiple underlying hedge funds. The main advantages of an FOF\nare as follows:\nDiversification: Risk is spread out over numerous hedge fund investment strategies.\nInvestment expertise: Similar to a traditional fund manager, portfolio holdings (ie, hedge funds) are constantly evaluated.\nDue diligence expertise: FOFs conduct extensive due diligence, evaluating underlying investment strategies, processes, and operational\ndetails.\nLower minimum investment: A single investment in an FOF accesses numerous underlying funds. If invested individually with each\nhedge fund, each fund has its own minimum, requiring significantly more capital.\nEnhanced redemption ability: FOFs can often negotiate better redemption terms, shortening lockups or redemption periods.\nThe main disadvantage of the FOF approach is the two layers of fees imposed on investors (Choice B). The FOF charges a fee on assets under\nmanagement and an incentive fee, in addition to the underlying hedge fund fees that are passed through to the investor by the FOF manager.\n(Choice A) FOFs are not known for their tax efficiency. They have a reputation for being \"fast\" money, quickly redeeming from underlying funds\nat any signs of underperformance, creating taxable events.\nThings to remember:\nThe main benefits of a fund-of-funds (FOF) structure include due diligence expertise, diversification, a lower minimum investment, preferred\nredemption status, and access to funds that would otherwise be closed to new investors. The main disadvantage is that the FOF approach\nimposes two layers of fees.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 14, "q": "A wealthy investor is considering a sizable investment in either a hedge fund or a fund-of-funds. From the investor's perspective, the fund-of- funds is least likely to offer the benefit of:", "opts": ["less risk.", "a lower fee structure.", "enhanced due diligence."], "ans": "B", "expl": "Advantages of hedge fund investing through a fund of funds (FoF)\nAdvantage Rationale\nBetter diversification One investment gains exposure to multiple funds\nEnhanced FoF managers presumably offer better due diligence of\nmanagement potential funds\nSome hedge funds are closed to direct investment, but may\nAccess\nbe accessible through FoF\nMinimum investment May offer lower initial investment\nEnhanced redemption FoF may have preferred status with respect to redemptions\nability from underlying hedge funds\nA fund-of-funds is an alternative investment vehicle that invests in multiple underlying hedge funds. This type of investment affords an investor\ndiversification among different hedge funds through a single investment. Other advantages include enhanced due diligence and potential access\nto funds that are otherwise closed to direct investment (Choice C).\nThe main disadvantage to the fund-of-funds approach is a higher fee structure. The fund-of-funds return is reduced by the fees imposed by\neach of the underlying investments. In addition, the fund-of-funds itself charges both a fee on assets under management and an incentive fee, so\nthe investor's return is reduced by two layers of fees.\n(Choice A) The added diversification from exposure to multiple underlying hedge funds reduces the investor's risk. This is an advantage of the\nfund-of-funds structure.\nThings to remember:\nA fund-of-funds invests in multiple hedge funds. Investors benefit from this structure through increased due diligence, more diversification, lower\ninitial investment, preferred redemption status, and access to funds that would otherwise be closed for new investment. The main disadvantage to\nthe fund-of-funds approach is that it imposes two layers of fees on the investment, which diminishes the investor's return relative to investment in a\nsingle fund.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}, {"n": 15, "q": "A recently launched hedge fund that is subject to a prime broker's margin call will most likely benefit from a:", "opts": ["drawdown.", "lockup period.", "committed capital drawdown."], "ans": "B", "expl": "Hedge fund investor redemption restrictions\nMinimum time an investor is committed to the\nLockup period fund before withdrawals are allowed\nUsually less than 2 years\nRequires investor to notify the fund of\nRedemption notice period planned redemption\nUsually 30−90 days\nHedge funds commonly use leverage to implement investment strategies by borrowing from a prime broker. If the equity value of the account\ndrops below a minimum level, a margin call is issued. The fund is then forced to reduce its leverage, usually by liquidating existing positions.\nMargin calls can magnify losses for a hedge fund since the forced liquidation creates a negative feedback loop: the selling forced by the margin\ncall drives the price down even more, leading to investor redemptions, which force more selling, etc.\nRedemption notices and lockup periods help protect a hedge fund from investor redemptions that would further worsen its position. In this\nscenario, most if not all investors in the recently launched hedge fund will be subject to a lockup period, restricting withdrawals immediately\nfollowing their initial investments.\n(Choice A) A drawdown is a reduction in a hedge fund's net asset value below the high-water mark, not a helpful development during a margin\ncall.\n(Choice C) Committed capital refers to an amount the limited partners in a private equity (PE) fund (ie, not a hedge fund), agree to provide the\nfund upon request to finance a new investment. The PE fund will draw down this capital commitment, usually over 3 to 5 years.\nThings to remember:\nA hedge fund benefits from a lockup period, which restricts investor withdrawals for a period of time immediately following an initial investment. If\nthe hedge fund receives a margin call and must sell off positions to satisfy the margin, the lockup period protects the fund from further losses.\nExplain investment features of hedge funds and contrast them with other asset classes", "qhtml": null, "explfigs": null}];
const CFG = {"title": "Wiley · Hedge Funds", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Alternative Investments · 15 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  .qnote{margin-top:12px;border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:8px 10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{width:100%;resize:vertical;min-height:40px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
</style>
<script>
/* ===== Ghi chú cá nhân cho mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      if(card.querySelector(".qnote")) continue;
      var k = keyFor(card);
      if(k===null) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú của bạn</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.rows = 2;
      ta.setAttribute("placeholder","Viết ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      card.appendChild(wrap);
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
