<script>
const DATA = [{"n": 1, "q": "Cash generated from operations (CGO) is least appropriately calculated as:", "opts": ["operating cash flow + cash interest paid + cash taxes paid.", "net income − cash flow from operations − cash flow from investing.", "EBIT + non-cash charges − increase in working capital."], "ans": "B", "expl": "The following is an appropriate formula for calculating cash flow based accruals, not CGO: cash flow based accruals = net income − cash flow from operations − cash flow from investing.", "explhtml": "<p>The following is an appropriate formula for calculating cash flow based accruals, not CGO: cash flow based accruals = net income − cash flow from operations − cash flow from investing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Cash generated from operations (CGO) is least appropriately calculated as:<\/p><\/div>", "subj": "fsa"}, {"n": 2, "q": "An analyst finds return-on-equity (ROE) (based on beginning of the year equity) a good measure of management performance and wants to compare two firms: Firm A and Firm B. Firm A reports net income of $3.2 million and has a ROE of 18. Firm B reports income of $16 million and has an ROE of 16. A review of the notes to the financial statements for Firm A, shows that the earnings include a loss from smelting operations of $400,000 and that the firm has exited this business. In addition, the firm sold the smelting equipment and had a gain on the sale of $300,000. A similar review of the notes for Firm B discloses that the $16 million in net income includes $2.6 million gain on the sale of no longer needed office property. Assume that the tax rate for both firms is 36%, and that the notes describe pre-tax amounts. Which of the following is closest to the \"normalized\" ROE for Firm A and for Firm B, respectively?", "opts": ["18.4 and 14.3.", "17.1 and 16.9.", "16.0 and 18.0."], "ans": "A", "expl": "The ROE for Firm A is adjusted for the $400,000 loss on discontinued operations and the $300,000 non-recurring gain. The ROE for Firm B is adjusted to remove the effects of the $2.6 million one-time gain. The first step in this problem is to solve for equity using ROE. Then, \"normalize\" net income by adjusting for discontinued operations and non-recurring items. Then, solve for \"normalized\" ROE. Firm A: 18% = 3,200,000 / EquityA EquityA = 17,777,778 (rounding) Normalized Net IncomeA = 3,200,000 + (1 – 0.36)(400,000 – 300,000) Normalized ROEA = 3,264,000 / 17,777,778 = 18.360% Firm B: 16% = 16,000,000 / EquityB EquityB = 100,000,000 Normalized Net IncomeB = 16,000,000 + (1 – 0.36)(–2,600,000) Normalized ROEB = 14,336,000 / 100,000,000 = 14.336% 18.360 and 14.336 are closest to 18.4 and 14.3", "explhtml": "<p>The ROE for Firm A is adjusted for the $400,000 loss on discontinued operations and the $300,000 non-recurring gain. The ROE for Firm B is adjusted to remove the effects of the $2.6 million one-time gain.<\/p><p>The first step in this problem is to solve for equity using ROE. Then, &quot;normalize&quot; net income by adjusting for discontinued operations and non-recurring items. Then, solve for &quot;normalized&quot; ROE.<\/p><p>Firm A:<\/p><p>18% = 3,200,000 / Equity<sub>A<\/sub><\/p><p>Equity<sub>A<\/sub> = 17,777,778 (rounding)<\/p><p>Normalized Net Income<sub>A<\/sub> = 3,200,000 + (1 – 0.36)(400,000 – 300,000)<\/p><p>Normalized ROE<sub>A<\/sub> = 3,264,000 / 17,777,778 = 18.360%<\/p><p>Firm B:<\/p><p>16% = 16,000,000 / Equity<sub>B<\/sub><\/p><p>Equity<sub>B<\/sub> = 100,000,000<\/p><p>Normalized Net Income<sub>B<\/sub> = 16,000,000 + (1 – 0.36)(–2,600,000)<\/p><p>Normalized ROE<sub>B<\/sub> = 14,336,000 / 100,000,000 = 14.336%<\/p><p>18.360 and 14.336 are closest to 18.4 and 14.3<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>An analyst finds return-on-equity (ROE) (based on beginning of the year equity) a good measure of management performance and wants to compare two firms: Firm A and Firm B. Firm A reports net income of $3.2 million and has a ROE of 18. Firm B reports income of $16 million and has an ROE of 16.<\/p><p>A review of the notes to the financial statements for Firm A, shows that the earnings include a loss from smelting operations of $400,000 and that the firm has exited this business. In addition, the firm sold the smelting equipment and had a gain on the sale of $300,000.<\/p><p>A similar review of the notes for Firm B discloses that the $16 million in net income includes $2.6 million gain on the sale of no longer needed office property. Assume that the tax rate for both firms is 36%, and that the notes describe pre-tax amounts. Which of the following is closest to the &quot;normalized&quot; ROE for Firm A and for Firm B, respectively?<\/p><\/div>", "subj": "fsa"}, {"n": 3, "q": "An analyst is analyzing a discount manufacturer of parts and supplies. She has followed her firm's suggested financial analysis framework and has communicated with company suppliers, customers, and competitors. This is an input that occurs while:", "opts": ["collecting data.", "processing data.", "establishing the objective of the analysis."], "ans": "A", "expl": "Communication with management, suppliers, customers, and competitors is an input during the data collection step. Processing data is the third phase of the financial analysis framework. Establishing the objective of the analysis is part of the \"define the purpose\" phase of the financial analysis framework.", "explhtml": "<p>Communication with management, suppliers, customers, and competitors is an input during the data collection step. Processing data is the third phase of the financial analysis framework. Establishing the objective of the analysis is part of the &quot;define the purpose&quot; phase of the financial analysis framework.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.1, LOS 12.a<\/div><div class=\"qtext\"><p>An analyst is analyzing a discount manufacturer of parts and supplies. She has followed her firm&#x27;s suggested financial analysis framework and has communicated with company suppliers, customers, and competitors. This is an input that occurs while:<\/p><\/div>", "subj": "fsa"}, {"n": 4, "q": "Which of the following statements about how a cash flow statement is prepared under IFRS and US GAAP is most accurate?", "opts": ["Under IFRS, dividends paid must be classified as an financing activity.", "Under US GAAP, dividends received must be classified as an operating activity.", "Under IFRS, interest paid must be classified as an operating activity."], "ans": "B", "expl": "IFRS allows some flexibility in the classifications of certain cash flows, specifically interest and dividends paid. Under IFRS, these kinds of transactions may be classified either as an operating activity or financing activity. By comparison, under US GAAP, dividends received (for example) can only be reported as an operating activity and not a financing activity. Because of this, when comparing IFRS firms to those following U.S. GAAP, it may be necessary to reclassify cash flows for comparison purposes.", "explhtml": "<p>IFRS allows some flexibility in the classifications of certain cash flows, specifically interest and dividends paid. Under IFRS, these kinds of transactions may be classified either as an operating activity or financing activity. By comparison, under US GAAP, dividends received (for example) can only be reported as an operating activity and not a financing activity. Because of this, when comparing IFRS firms to those following U.S. GAAP, it may be necessary to reclassify cash flows for comparison purposes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Which of the following statements about how a cash flow statement is prepared under IFRS and US GAAP is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 5, "q": "The aggregate accruals (in $M's) for SnapPrints and the accrual ratio for NetPhoto are closest to:", "opts": ["2,500 and −2.04%.", "−4,500 and −1.49%.", "3,700 and −0.51%."], "ans": "A", "expl": "Aggregate accruals using the cash flow method are calculated as net income minus cash flow from operation minus cash flow from investing activities. For SnapPrints we have: accrualsCF = NI − CFO − CFI accrualsCF = 5,500 − 6,500 − (−3,500) = 2,500 In order to calculate the accrual ratio for NetPhoto, the first step is to compute the net operating assets. Net operating assets are equal to operating assets minus operating liabilities, where operating assets are total assets minus cash, cash equivalents, and marketable securities, and operating liabilities are total liabilities minus total debt.  2009 2008 Total Assets 58,500 58,300 Cash −5,500 −4,500 Operating Assets 53,000 53,800    Total Liabilities 38,800 40,550 Short-term Notes Payable −5,800 −6,500 Long-Term Debt −28,500 −29,750 Operating Liabilities 4,500 4,300    Net Operating Assets 48,500 49,500 The accruals ratio for NetPhoto using the balance sheet approach is: (NOAEND −NOABEG) accruals ratioBS = (NOAEND + NOABEG)/2 (48,500 −49,500) accruals ratioBS =  = −2.04% (48,500 + 49,500)/2", "explhtml": "<p>Aggregate accruals using the cash flow method are calculated as net income minus cash flow from operation minus cash flow from investing activities. For SnapPrints we have:<\/p><p>accruals<sup>CF<\/sup> = NI − CFO − CFI<\/p><p>accruals<sup>CF<\/sup> = 5,500 − 6,500 − (−3,500) = 2,500<\/p><p>In order to calculate the accrual ratio for NetPhoto, the first step is to compute the net operating assets. Net operating assets are equal to operating assets minus operating liabilities, where operating assets are total assets minus cash, cash equivalents, and marketable securities, and operating liabilities are total liabilities minus total debt.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>2009<\/td><td>2008<\/td><\/tr><tr><td>Total Assets<\/td><td>58,500<\/td><td>58,300<\/td><\/tr><tr><td>Cash<\/td><td>−5,500<\/td><td>−4,500<\/td><\/tr><tr><td>Operating Assets<\/td><td>53,000<\/td><td>53,800<\/td><\/tr><tr><td>Total Liabilities<\/td><td>38,800<\/td><td>40,550<\/td><\/tr><tr><td>Short-term Notes Payable<\/td><td>−5,800<\/td><td>−6,500<\/td><\/tr><tr><td>Long-Term Debt<\/td><td>−28,500<\/td><td>−29,750<\/td><\/tr><tr><td>Operating Liabilities<\/td><td>4,500<\/td><td>4,300<\/td><\/tr><tr><td>Net Operating Assets<\/td><td>48,500<\/td><td>49,500<\/td><\/tr><\/table><\/div><p>The accruals ratio for NetPhoto using the balance sheet approach is:<\/p><p>(NOA<sup>END<\/sup> −NOA<sup>BEG<\/sup>)<\/p><p>accruals ratio<sup>BS<\/sup> =<\/p><p>(NOA<sup>END<\/sup> + NOA<sup>BEG<\/sup>)/2<\/p><p>(48,500 −49,500) accruals ratio<sup>BS<\/sup> = &nbsp; = −2.04%<\/p><p>(48,500 + 49,500)/2<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–9<\/summary><div class=\"vig-body\"><p>SnapPrints and NetPhoto Case Scenario Josephine Howard, CFA, is an equity analyst for an investment bank. She is preparing financial reports for two publicly traded digital photography companies, SnapPrints and Net Photo. Howard just attended a CFA Institute-sponsored conference on detecting quality issues in financial statements and is eager to apply what she has learned.<\/p><p>SnapPrints provides photo prints and various other photo-related products, including calendars, T-shirts, and coffee mugs. NetPhoto is SnapPrints' largest competitor. NetPhoto has been receiving increasing attention from the analyst community due to its high sales growth rate, although NetPhoto's sales are still less than 50% of SnapPrints' sales.<\/p><p>During the conference, Howard learned about the importance of analyzing accruals to evaluate earnings quality. Therefore, Howard is going to analyze the accruals for each company as part of her review. Howard remembers a discussion from the conference about disaggregating income into its major components to improve earnings forecasts, but she cannot remember which component (cash or accruals) should receive a higher weighting in the forecast.<\/p><p>Howard gathered the following data from the income statement and statement of cash flows for SnapPrints.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v001.webp\" style=\"max-width:min(100%,666px)\" alt=\"Selected SnapPrints Income Statement Items (000s) Year Ended December 31, 2009 45,000 Sales (30,000) Cost of Good Sold (3,000) Depreciation Expense (2,000) SG&amp;A Expense (1,500) Interest Expense (3,000) Income Tax Expense 5,500 Net Income Cash Flows for SnapPrints (000s) Year Ended December 31, 2009 6,500 Cash from Operations (3,500) Cash from Investing (1,200) Cash from Financing 1,800 Change in Cash Howard collected the following balance sheet data for NetPhoto. Selected Balance Sheet items for NetPhoto as of December 31, in $Ms 2009 2009 2008 2008 5,500 4,300 4,500 4,500 Accounts Payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v002.webp\" style=\"max-width:min(100%,666px)\" alt=\"4,700 Retained Earnings 4,950 Total Liabilities and 58,500 58,300 Total Assets 58,300 58,500 Equity Howard has concerns about revenue recognition practices at both firms and has collected the following data. 2006 2007 2008 2009 SnapPrints 38,500 45,000 44,400 44,000 Revenue 44,000 Cash Collections 45,000 37,000 43,000 NetPhoto 11,500 22,000 7,500 15,000 Revenue 12,000 7,000 Cash Collections 11,000 8,500\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>The aggregate accruals (in $M&#x27;s) for SnapPrints and the accrual ratio for NetPhoto are closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 6, "q": "Compared to aggregate accruals, the accrual ratio is especially useful when:", "opts": ["comparing across companies.", "comparing year-over-year accruals.", "the cash component is large."], "ans": "A", "expl": "The accrual ratio presents accruals for the period as a proportion of average net operating assets. This ratio is especially useful for comparing accruals across companies.", "explhtml": "<p>The accrual ratio presents accruals for the period as a proportion of average net operating assets. This ratio is especially useful for comparing accruals across companies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>SnapPrints and NetPhoto Case Scenario Josephine Howard, CFA, is an equity analyst for an investment bank. She is preparing financial reports for two publicly traded digital photography companies, SnapPrints and Net Photo. Howard just attended a CFA Institute-sponsored conference on detecting quality issues in financial statements and is eager to apply what she has learned.<\/p><p>SnapPrints provides photo prints and various other photo-related products, including calendars, T-shirts, and coffee mugs. NetPhoto is SnapPrints' largest competitor. NetPhoto has been receiving increasing attention from the analyst community due to its high sales growth rate, although NetPhoto's sales are still less than 50% of SnapPrints' sales.<\/p><p>During the conference, Howard learned about the importance of analyzing accruals to evaluate earnings quality. Therefore, Howard is going to analyze the accruals for each company as part of her review. Howard remembers a discussion from the conference about disaggregating income into its major components to improve earnings forecasts, but she cannot remember which component (cash or accruals) should receive a higher weighting in the forecast.<\/p><p>Howard gathered the following data from the income statement and statement of cash flows for SnapPrints.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v001.webp\" style=\"max-width:min(100%,666px)\" alt=\"Selected SnapPrints Income Statement Items (000s) Year Ended December 31, 2009 45,000 Sales (30,000) Cost of Good Sold (3,000) Depreciation Expense (2,000) SG&amp;A Expense (1,500) Interest Expense (3,000) Income Tax Expense 5,500 Net Income Cash Flows for SnapPrints (000s) Year Ended December 31, 2009 6,500 Cash from Operations (3,500) Cash from Investing (1,200) Cash from Financing 1,800 Change in Cash Howard collected the following balance sheet data for NetPhoto. Selected Balance Sheet items for NetPhoto as of December 31, in $Ms 2009 2009 2008 2008 5,500 4,300 4,500 4,500 Accounts Payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v002.webp\" style=\"max-width:min(100%,666px)\" alt=\"4,700 Retained Earnings 4,950 Total Liabilities and 58,500 58,300 Total Assets 58,300 58,500 Equity Howard has concerns about revenue recognition practices at both firms and has collected the following data. 2006 2007 2008 2009 SnapPrints 38,500 45,000 44,400 44,000 Revenue 44,000 Cash Collections 45,000 37,000 43,000 NetPhoto 11,500 22,000 7,500 15,000 Revenue 12,000 7,000 Cash Collections 11,000 8,500\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Compared to aggregate accruals, the accrual ratio is especially useful when:<\/p><\/div>", "subj": "fsa"}, {"n": 7, "q": "Based on her calculations of accruals, Howard believes that NetPhoto has a higher accruals ratio over the recent past compared with SnapPrints. If both companies have recently had extreme earnings, Howard would most likely conclude that:", "opts": ["NetPhoto’s income will revert to its mean more quickly than SnapPrints’.", "SnapPrints’ income will revert to its mean, but NetPhoto’s income will not.", "SnapPrints’ income will revert to its mean more quickly than NetPhoto’s."], "ans": "A", "expl": "Analysts should be aware that extreme earnings levels will not persist and that earnings will typically revert to normal levels over time. Additionally, the larger the accruals component of earnings relative to the cash component, the more rapidly earnings will revert to their mean. All else equal, if NetPhoto has a higher accruals ratio than SnapPrints, NetPhoto's earnings should revert to the mean more rapidly.", "explhtml": "<p>Analysts should be aware that extreme earnings levels will not persist and that earnings will typically revert to normal levels over time. Additionally, the larger the accruals component of earnings relative to the cash component, the more rapidly earnings will revert to their mean. All else equal, if NetPhoto has a higher accruals ratio than SnapPrints, NetPhoto&#x27;s earnings should revert to the mean more rapidly.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>SnapPrints and NetPhoto Case Scenario Josephine Howard, CFA, is an equity analyst for an investment bank. She is preparing financial reports for two publicly traded digital photography companies, SnapPrints and Net Photo. Howard just attended a CFA Institute-sponsored conference on detecting quality issues in financial statements and is eager to apply what she has learned.<\/p><p>SnapPrints provides photo prints and various other photo-related products, including calendars, T-shirts, and coffee mugs. NetPhoto is SnapPrints' largest competitor. NetPhoto has been receiving increasing attention from the analyst community due to its high sales growth rate, although NetPhoto's sales are still less than 50% of SnapPrints' sales.<\/p><p>During the conference, Howard learned about the importance of analyzing accruals to evaluate earnings quality. Therefore, Howard is going to analyze the accruals for each company as part of her review. Howard remembers a discussion from the conference about disaggregating income into its major components to improve earnings forecasts, but she cannot remember which component (cash or accruals) should receive a higher weighting in the forecast.<\/p><p>Howard gathered the following data from the income statement and statement of cash flows for SnapPrints.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v001.webp\" style=\"max-width:min(100%,666px)\" alt=\"Selected SnapPrints Income Statement Items (000s) Year Ended December 31, 2009 45,000 Sales (30,000) Cost of Good Sold (3,000) Depreciation Expense (2,000) SG&amp;A Expense (1,500) Interest Expense (3,000) Income Tax Expense 5,500 Net Income Cash Flows for SnapPrints (000s) Year Ended December 31, 2009 6,500 Cash from Operations (3,500) Cash from Investing (1,200) Cash from Financing 1,800 Change in Cash Howard collected the following balance sheet data for NetPhoto. Selected Balance Sheet items for NetPhoto as of December 31, in $Ms 2009 2009 2008 2008 5,500 4,300 4,500 4,500 Accounts Payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v002.webp\" style=\"max-width:min(100%,666px)\" alt=\"4,700 Retained Earnings 4,950 Total Liabilities and 58,500 58,300 Total Assets 58,300 58,500 Equity Howard has concerns about revenue recognition practices at both firms and has collected the following data. 2006 2007 2008 2009 SnapPrints 38,500 45,000 44,400 44,000 Revenue 44,000 Cash Collections 45,000 37,000 43,000 NetPhoto 11,500 22,000 7,500 15,000 Revenue 12,000 7,000 Cash Collections 11,000 8,500\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Based on her calculations of accruals, Howard believes that NetPhoto has a higher accruals ratio over the recent past compared with SnapPrints. If both companies have recently had extreme earnings, Howard would most likely conclude that:<\/p><\/div>", "subj": "fsa"}, {"n": 8, "q": "Based on the revenue and cash collections data for SnapPrints and NetPhoto, Howard would most likely conclude that:", "opts": ["SnapPrints is accelerating revenue.", "NetPhoto is accelerating revenue.", "SnapPrints is misclassifying nonrecurring and nonoperating revenue."], "ans": "B", "expl": "Typically, the ratio of revenue to cash collections is relatively stable. If a firm's ratio is increasing significantly over time (as NetPhoto's is), the firm may be accelerating revenue recognition through aggressive accounting methods. Comparative Revenue / Cash Collections by Firm  2009 2008 2007 2006 SnapPrints 105% 98% 101% 104% NetPhoto 200% 125% 135% 107%", "explhtml": "<p>Typically, the ratio of revenue to cash collections is relatively stable. If a firm&#x27;s ratio is increasing significantly over time (as NetPhoto&#x27;s is), the firm may be accelerating revenue recognition through aggressive accounting methods.<\/p><p>Comparative Revenue / Cash Collections by Firm<\/p><div class=\"tbl\"><table><tr><td><\/td><td>2009<\/td><td>2008<\/td><td>2007<\/td><td>2006<\/td><\/tr><tr><td>SnapPrints<\/td><td>105%<\/td><td>98%<\/td><td>101%<\/td><td>104%<\/td><\/tr><tr><td>NetPhoto<\/td><td>200%<\/td><td>125%<\/td><td>135%<\/td><td>107%<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>SnapPrints and NetPhoto Case Scenario Josephine Howard, CFA, is an equity analyst for an investment bank. She is preparing financial reports for two publicly traded digital photography companies, SnapPrints and Net Photo. Howard just attended a CFA Institute-sponsored conference on detecting quality issues in financial statements and is eager to apply what she has learned.<\/p><p>SnapPrints provides photo prints and various other photo-related products, including calendars, T-shirts, and coffee mugs. NetPhoto is SnapPrints' largest competitor. NetPhoto has been receiving increasing attention from the analyst community due to its high sales growth rate, although NetPhoto's sales are still less than 50% of SnapPrints' sales.<\/p><p>During the conference, Howard learned about the importance of analyzing accruals to evaluate earnings quality. Therefore, Howard is going to analyze the accruals for each company as part of her review. Howard remembers a discussion from the conference about disaggregating income into its major components to improve earnings forecasts, but she cannot remember which component (cash or accruals) should receive a higher weighting in the forecast.<\/p><p>Howard gathered the following data from the income statement and statement of cash flows for SnapPrints.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v001.webp\" style=\"max-width:min(100%,666px)\" alt=\"Selected SnapPrints Income Statement Items (000s) Year Ended December 31, 2009 45,000 Sales (30,000) Cost of Good Sold (3,000) Depreciation Expense (2,000) SG&amp;A Expense (1,500) Interest Expense (3,000) Income Tax Expense 5,500 Net Income Cash Flows for SnapPrints (000s) Year Ended December 31, 2009 6,500 Cash from Operations (3,500) Cash from Investing (1,200) Cash from Financing 1,800 Change in Cash Howard collected the following balance sheet data for NetPhoto. Selected Balance Sheet items for NetPhoto as of December 31, in $Ms 2009 2009 2008 2008 5,500 4,300 4,500 4,500 Accounts Payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v002.webp\" style=\"max-width:min(100%,666px)\" alt=\"4,700 Retained Earnings 4,950 Total Liabilities and 58,500 58,300 Total Assets 58,300 58,500 Equity Howard has concerns about revenue recognition practices at both firms and has collected the following data. 2006 2007 2008 2009 SnapPrints 38,500 45,000 44,400 44,000 Revenue 44,000 Cash Collections 45,000 37,000 43,000 NetPhoto 11,500 22,000 7,500 15,000 Revenue 12,000 7,000 Cash Collections 11,000 8,500\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Based on the revenue and cash collections data for SnapPrints and NetPhoto, Howard would most likely conclude that:<\/p><\/div>", "subj": "fsa"}, {"n": 9, "q": "In reviewing the footnotes to NetPhoto's financial statements, Howard discovers that the firm has engaged in a LIFO liquidation. The most likely effects on the financial statements (compared to no LIFO liquidation) are:", "opts": ["a decrease in COGS and an increase in the net profit margin.", "a decrease in inventory turnover and an increase in the gross profit margin.", "an increase in the gross profit margin and an increase in days of inventory."], "ans": "A", "expl": "A LIFO liquidation refers to slowing the purchase of inventory items so that older lower costs are used to calculate COGS. Compared to following regular purchase policies, this will reduce COGS, reduce inventory, and artificially increase gross and net margins. Since the percentage decrease in inventory is likely greater than the percentage decrease in COGS, the inventory turnover ratio is likely increased, rather than decreased, by a LIFO liquidation.", "explhtml": "<p>A LIFO liquidation refers to slowing the purchase of inventory items so that older lower costs are used to calculate COGS. Compared to following regular purchase policies, this will reduce COGS, reduce inventory, and artificially increase gross and net margins. Since the percentage decrease in inventory is likely greater than the percentage decrease in COGS, the inventory turnover ratio is likely increased, rather than decreased, by a LIFO liquidation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 5–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>SnapPrints and NetPhoto Case Scenario Josephine Howard, CFA, is an equity analyst for an investment bank. She is preparing financial reports for two publicly traded digital photography companies, SnapPrints and Net Photo. Howard just attended a CFA Institute-sponsored conference on detecting quality issues in financial statements and is eager to apply what she has learned.<\/p><p>SnapPrints provides photo prints and various other photo-related products, including calendars, T-shirts, and coffee mugs. NetPhoto is SnapPrints' largest competitor. NetPhoto has been receiving increasing attention from the analyst community due to its high sales growth rate, although NetPhoto's sales are still less than 50% of SnapPrints' sales.<\/p><p>During the conference, Howard learned about the importance of analyzing accruals to evaluate earnings quality. Therefore, Howard is going to analyze the accruals for each company as part of her review. Howard remembers a discussion from the conference about disaggregating income into its major components to improve earnings forecasts, but she cannot remember which component (cash or accruals) should receive a higher weighting in the forecast.<\/p><p>Howard gathered the following data from the income statement and statement of cash flows for SnapPrints.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v001.webp\" style=\"max-width:min(100%,666px)\" alt=\"Selected SnapPrints Income Statement Items (000s) Year Ended December 31, 2009 45,000 Sales (30,000) Cost of Good Sold (3,000) Depreciation Expense (2,000) SG&amp;A Expense (1,500) Interest Expense (3,000) Income Tax Expense 5,500 Net Income Cash Flows for SnapPrints (000s) Year Ended December 31, 2009 6,500 Cash from Operations (3,500) Cash from Investing (1,200) Cash from Financing 1,800 Change in Cash Howard collected the following balance sheet data for NetPhoto. Selected Balance Sheet items for NetPhoto as of December 31, in $Ms 2009 2009 2008 2008 5,500 4,300 4,500 4,500 Accounts Payable\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r12/v002.webp\" style=\"max-width:min(100%,666px)\" alt=\"4,700 Retained Earnings 4,950 Total Liabilities and 58,500 58,300 Total Assets 58,300 58,500 Equity Howard has concerns about revenue recognition practices at both firms and has collected the following data. 2006 2007 2008 2009 SnapPrints 38,500 45,000 44,400 44,000 Revenue 44,000 Cash Collections 45,000 37,000 43,000 NetPhoto 11,500 22,000 7,500 15,000 Revenue 12,000 7,000 Cash Collections 11,000 8,500\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>In reviewing the footnotes to NetPhoto&#x27;s financial statements, Howard discovers that the firm has engaged in a LIFO liquidation. The most likely effects on the financial statements (compared to no LIFO liquidation) are:<\/p><\/div>", "subj": "fsa"}, {"n": 10, "q": "MKF Consolidated reports $500 million in goodwill on its balance sheet. The market consensus indicates that the value of MKF's intangible assets is $300 million. How should an analyst adjust MKF's balance sheet? Reduce goodwill and:", "opts": ["increase liabilities by $200 million.", "equity by $200 million.", "equity by $500 million while increasing liabilities by $300 million."], "ans": "B", "expl": "If goodwill has no economic value apart from the firm, it should be eliminated from the balance sheet. If the value of the intangibles can be reliably estimated they can be substituted for accounting goodwill.", "explhtml": "<p>If goodwill has no economic value apart from the firm, it should be eliminated from the balance sheet. If the value of the intangibles can be reliably estimated they can be substituted for accounting goodwill.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>MKF Consolidated reports $500 million in goodwill on its balance sheet. The market consensus indicates that the value of MKF&#x27;s intangible assets is $300 million. How should an analyst adjust MKF&#x27;s balance sheet? Reduce goodwill and:<\/p><\/div>", "subj": "fsa"}, {"n": 11, "q": "Which of the following equations is least likely to provide a useful measure of measure the degree of accruals present in a firm's earnings?", "opts": ["(NIₜ − NIt−1)/[(NOAₜ + NOAt−1)/2]", "(NOAₜ − NOAt−1)/[(NOAₜ + NOAt−1)/2]", "[NIₜ − (CFOₜ + CFIₜ)]/[(NOAₜ + NOAt−1)/2]"], "ans": "A", "expl": "The accruals ratio based on the balance sheet = (NOAₜ − NOAt−1)/[(NOAₜ + NOAt−1)/2]. The accruals ratio based on the cash flow statement = [NIₜ − (CFOₜ + CFIₜ)]/[(NOAₜ + NOAt−1)/2].", "explhtml": "<p>The accruals ratio based on the balance sheet = (NOA<sub>t<\/sub> − NOA<sub>t−1<\/sub>)/[(NOA<sub>t<\/sub> + NOA<sub>t−1<\/sub>)/2]. The accruals ratio based on the cash flow statement = [NI<sub>t<\/sub> − (CFO<sub>t<\/sub> + CFI<sub>t<\/sub>)]/[(NOA<sub>t<\/sub> + NOA<sub>t−1<\/sub>)/2].<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.d<\/div><div class=\"qtext\"><p>Which of the following equations is least likely to provide a useful measure of measure the degree of accruals present in a firm&#x27;s earnings?<\/p><\/div>", "subj": "fsa"}, {"n": 12, "q": "Legacy Inc owns a 25% equity interest in Simali Corporation, a publicly traded firm located in Indonesia. Legacy's market capitalization is € 122 billion while that of Simali is Rp 126 trillion. Rp/€ exchange rate is Rp 16,940. The implied value of Legacy (excluding Simali) is what proportion of Legacy's total market capitalization?", "opts": ["83%", "63%", "98%"], "ans": "C", "expl": "Rp 126 trillion = Rp 126,000 billion = 126,000/16,940 = €7.44 billion. 25% = €1.86 billion. Implied value of Legacy (excluding Simali) = 122 – 1.86 = 120.14 billion As a proportion = 120.14 / 122 = 0.98 or 98%", "explhtml": "<p>Rp 126 trillion = Rp 126,000 billion = 126,000/16,940 = €7.44 billion. 25% = €1.86 billion.<\/p><p>Implied value of Legacy (excluding Simali) = 122 – 1.86 = 120.14 billion<\/p><p>As a proportion = 120.14 / 122 = 0.98 or 98%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.6, LOS 12.e<\/div><div class=\"qtext\"><p>Legacy Inc owns a 25% equity interest in Simali Corporation, a publicly traded firm located in Indonesia.<\/p><p>Legacy&#x27;s market capitalization is € 122 billion while that of Simali is Rp 126 trillion.<\/p><p>Rp/€ exchange rate is Rp 16,940. The implied value of Legacy (excluding Simali) is what proportion of Legacy&#x27;s total market capitalization?<\/p><\/div>", "subj": "fsa"}, {"n": 13, "q": "Star Chemical Inc. (SCI) reported the following year-end data: Depreciation expense $25 million Net income $35 million Dividends $10 million Total assets $250 million Shareholder's equity $195 million Effective tax rate 35 percent SCI also reported that it changed from an accelerated depreciation method to straight line depreciation. The change resulted in a decrease in depreciation expense of $5 million. Management felt that the change \"would not have a material effect on financial performance measures.\" Ignoring deferred taxes, what are the return on assets (ROA) and return on equity (ROE) measures under the old depreciation methods?", "opts": ["ROA is 13.30% and ROE is 17.05%.", "ROA is 13.50% and ROE is 17.51%.", "ROA is 12.96% and ROE is 16.56%."], "ans": "C", "expl": "The change in depreciation methods results in net income increasing by $3.25 million ($5 million × (1-0.35)) and total assets increasing by $5 million. Without the change in depreciation methods SCI would have reported: Depreciation expense $30 million ($25 + $5) Net income $31.75 million ($35 – $3.25) Total assets $245 million ($250 – $5) Shareholder's equity $191.75 million ($195 − $3.25) Note that assets would have been lower by $5 million due to the accelerated depreciation and equity would be lower by $3.25 million ($5 × (1 − 0.35)) due to lower retained earnings. In order to balance the $5 million reduction in assets, equity will fall by $3.25 million and tax liabilities will fall by $1.75 million. Therefore, ROA would have been 12.96% ($31.75 / $245) and ROE would have been 16.56% ($31.75 / $191.75).", "explhtml": "<p>The change in depreciation methods results in net income increasing by $3.25 million ($5 million × (1-0.35)) and total assets increasing by $5 million. Without the change in depreciation methods SCI would have reported:<\/p><div class=\"tbl\"><table><tr><td>Depreciation expense<\/td><td>$30 million<\/td><td>($25 + $5)<\/td><\/tr><tr><td>Net income<\/td><td>$31.75 million<\/td><td>($35 – $3.25)<\/td><\/tr><tr><td>Total assets<\/td><td>$245 million<\/td><td>($250 – $5)<\/td><\/tr><tr><td>Shareholder&#x27;s equity<\/td><td>$191.75 million<\/td><td>($195 − $3.25)<\/td><\/tr><\/table><\/div><p>Note that assets would have been lower by $5 million due to the accelerated depreciation and equity would be lower by $3.25 million ($5 × (1 − 0.35)) due to lower retained earnings. In order to balance the $5 million reduction in assets, equity will fall by $3.25 million and tax liabilities will fall by $1.75 million. Therefore, ROA would have been 12.96% ($31.75 / $245) and ROE would have been 16.56% ($31.75 / $191.75).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>Star Chemical Inc. (SCI) reported the following year-end data:<\/p><div class=\"tbl\"><table><tr><td>Depreciation expense<\/td><td>$25 million<\/td><\/tr><tr><td>Net income<\/td><td>$35 million<\/td><\/tr><tr><td>Dividends<\/td><td>$10 million<\/td><\/tr><tr><td>Total assets<\/td><td>$250 million<\/td><\/tr><tr><td>Shareholder&#x27;s equity<\/td><td>$195 million<\/td><\/tr><tr><td>Effective tax rate<\/td><td>35 percent<\/td><\/tr><\/table><\/div><p>SCI also reported that it changed from an accelerated depreciation method to straight line depreciation. The change resulted in a decrease in depreciation expense of $5 million. Management felt that the change &quot;would not have a material effect on financial performance measures.&quot; Ignoring deferred taxes, what are the return on assets (ROA) and return on equity (ROE) measures under the old depreciation methods?<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Express Delivery Inc. (EDI) reported the following year-end data: Depreciation expense $30 million Net income $30 million Total assets $535 million Shareholder's equity $150 million Effective tax rate 35 percent Last year EDI purchased a fleet of delivery vehicles for $140 million. For the first year, straight-line depreciation was used assuming a depreciable life of 7 years with no salvage value. However, at year-end EDI's management determined that assumptions of a useful life of 5 years with a salvage value of 10 percent of the original value were more appropriate. How would the return on assets (ROA) and return on equity (ROE) for last year change due to the change in depreciation assumptions? ROA and ROE would be closest to:", "opts": ["ROA 5.3% and ROE 20.5%.", "ROA 5.0% and ROE 18.2%.", "ROA 5.7% and ROE 19.5%."], "ans": "B", "expl": "The reported ROA and ROE are 5.6% (30/535) and 20.0% (30/150) respectively. Under the new depreciation assumptions, depreciation expense would be (140-14)/5 = 25.2 million. Under the original assumptions depreciation of the fleet was 20 million. Therefore depreciation increases by 5.2 million. With the change in depreciation methods EDI would have reported: Depreciation expense $35.20 million (30 + 5.2) Net income $26.62 million (30 − (5.2 × (1-0.35))) Total assets $529.80 million (535 − 5.2 ) Shareholder's equity $146.62 million (150 − 3.38) Note that assets would have been lower by $5.2 million due to the new depreciation assumptions and shareholder's equity by $3.38 million (5.2 × (1 − 0.35)) due to lower retained earnings. Tax liabilities would have fallen by $1.82 million to balance the $5.2 million reduction in assets. Therefore, ROA would have been 5.0% (26.62 / 529.80) and ROE would have been 18.16% (26.62 / 146.62).", "explhtml": "<p>The reported ROA and ROE are 5.6% (30/535) and 20.0% (30/150) respectively. Under the new depreciation assumptions, depreciation expense would be (140-14)/5 = 25.2 million. Under the original assumptions depreciation of the fleet was 20 million. Therefore depreciation increases by 5.2 million. With the change in depreciation methods EDI would have reported:<\/p><div class=\"tbl\"><table><tr><td>Depreciation expense<\/td><td>$35.20 million<\/td><td>(30 + 5.2)<\/td><\/tr><tr><td>Net income<\/td><td>$26.62 million<\/td><td>(30 − (5.2 × (1-0.35)))<\/td><\/tr><tr><td>Total assets<\/td><td>$529.80 million<\/td><td>(535 − 5.2 )<\/td><\/tr><tr><td>Shareholder&#x27;s equity<\/td><td>$146.62 million<\/td><td>(150 − 3.38)<\/td><\/tr><\/table><\/div><p>Note that assets would have been lower by $5.2 million due to the new depreciation assumptions and shareholder&#x27;s equity by $3.38 million (5.2 × (1 − 0.35)) due to lower retained earnings. Tax liabilities would have fallen by $1.82 million to balance the $5.2 million reduction in assets. Therefore, ROA would have been 5.0% (26.62 / 529.80) and ROE would have been 18.16% (26.62 / 146.62).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>Express Delivery Inc. (EDI) reported the following year-end data:<\/p><div class=\"tbl\"><table><tr><td>Depreciation expense<\/td><td>$30 million<\/td><\/tr><tr><td>Net income<\/td><td>$30 million<\/td><\/tr><tr><td>Total assets<\/td><td>$535 million<\/td><\/tr><tr><td>Shareholder&#x27;s equity<\/td><td>$150 million<\/td><\/tr><tr><td>Effective tax rate<\/td><td>35 percent<\/td><\/tr><\/table><\/div><p>Last year EDI purchased a fleet of delivery vehicles for $140 million. For the first year, straight-line depreciation was used assuming a depreciable life of 7 years with no salvage value. However, at year-end EDI&#x27;s management determined that assumptions of a useful life of 5 years with a salvage value of 10 percent of the original value were more appropriate. How would the return on assets (ROA) and return on equity (ROE) for last year change due to the change in depreciation assumptions? ROA and ROE would be closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "Wanda Brunner, CFA, is analyzing Straight Elements, Inc., (SE). SE is a discount manufacturer of parts and supplies for the railroad industry. She has followed her firm's suggested financial analysis framework, and has assembled output from processing data. When applying the financial analysis framework, which of the following is the best example of output from processing data?", "opts": ["Audited financial statements.", "A written list of questions to be answered by the analysis.", "Common-size financial statements."], "ans": "C", "expl": "Common-size financial statements are created in the data processing step of the framework for financial analysis. Audited financial statements would be obtained during the \"collect input\" phase of the financial analysis framework. Creating a written list of questions to be answered by the analysis is part of the \"define the purpose\" phase of the financial analysis framework.", "explhtml": "<p>Common-size financial statements are created in the data processing step of the framework for financial analysis. Audited financial statements would be obtained during the &quot;collect input&quot; phase of the financial analysis framework. Creating a written list of questions to be answered by the analysis is part of the &quot;define the purpose&quot; phase of the financial analysis framework.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.1, LOS 12.a<\/div><div class=\"qtext\"><p>Wanda Brunner, CFA, is analyzing Straight Elements, Inc., (SE). SE is a discount manufacturer of parts and supplies for the railroad industry. She has followed her firm&#x27;s suggested financial analysis framework, and has assembled output from processing data. When applying the financial analysis framework, which of the following is the best example of output from processing data?<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "A firm seeking to lower current tax liability may elect to use which method of inventory valuation during an inflationary period?", "opts": ["Average cost.", "LIFO.", "FIFO."], "ans": "B", "expl": "During an inflationary period, using LIFO would increase COGS, since the most recent (highest cost) inventory would be sold. Therefore, earnings and taxes would be lowest under LIFO.", "explhtml": "<p>During an inflationary period, using LIFO would increase COGS, since the most recent (highest cost) inventory would be sold. Therefore, earnings and taxes would be lowest under LIFO.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>A firm seeking to lower current tax liability may elect to use which method of inventory valuation during an inflationary period?<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "Recently, Galaxy Corporation lowered its allowance for doubtful accounts by reducing bad debt expense from 2 percent of sales to 1 percent of sales. Ignoring taxes, what are the immediate effects on Galaxy's operating income and operating cash flow? Operating  Operating cash | income  flow", "opts": ["Lower Lower", "Higher No effect", "No effect Higher"], "ans": "B", "expl": "Lower bad debt expense will result in higher operating income. Operating cash flow is not affected until Galaxy actually collects the receivables.", "explhtml": "<p>Lower bad debt expense will result in higher operating income. Operating cash flow is not affected until Galaxy actually collects the receivables.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Recently, Galaxy Corporation lowered its allowance for doubtful accounts by reducing bad debt expense from 2 percent of sales to 1 percent of sales. Ignoring taxes, what are the immediate effects on Galaxy&#x27;s operating income and operating cash flow?<\/p><div class=\"tbl\"><table><tr><td>Operating<\/td><td>Operating cash<\/td><\/tr><tr><td>income<\/td><td>flow<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 18, "q": "Holdall Corporation recently reclassified many of their assets such that the average useful life of their depreciable assets was reduced. Which of the following is the most likely result from this change on net income and inventory turnover? (Assume everything else remains constant.) Net income will:", "opts": ["increase and inventory turnover will not change.", "decrease and inventory turnover will rise.", "decrease and inventory turnover may or may not change."], "ans": "C", "expl": "Depreciation expense increases as the depreciable life of an asset decreases. Thus, net income will decline. Depreciation will only affect inventory turnover if depreciation has been allocated to individual inventory items; when and why this happens is outside the scope of the Level II curriculum.", "explhtml": "<p>Depreciation expense increases as the depreciable life of an asset decreases. Thus, net income will decline. Depreciation will only affect inventory turnover if depreciation has been allocated to individual inventory items; when and why this happens is outside the scope of the Level II curriculum.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>Holdall Corporation recently reclassified many of their assets such that the average useful life of their depreciable assets was reduced. Which of the following is the most likely result from this change on net income and inventory turnover? (Assume everything else remains constant.) Net income will:<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "In order to compare companies using a common size statement, the various line items in a company's income statement are most likely to be divided by the company's:", "opts": ["net earnings.", "revenues.", "total assets."], "ans": "B", "expl": "In a common size income statement, all the line items in a company's income statement are divided by the company's revenues. Common size statements make comparability across companies much easier. An analyst might use a common size statement to compare trends in income statement variables (such as gross margins) for a group of companies. ", "explhtml": "<p>In a common size income statement, all the line items in a company&#x27;s income statement are divided by the company&#x27;s revenues. Common size statements make comparability across companies much easier. An analyst might use a common size statement to compare trends in income statement variables (such as gross margins) for a group of companies. <\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.2, LOS 12.c<\/div><div class=\"qtext\"><p>In order to compare companies using a common size statement, the various line items in a company&#x27;s income statement are most likely to be divided by the company&#x27;s:<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "An investor relations spokesperson for the Square Door Corporation was quoted as saying that Square Door shares were a bargain, selling at a price-to-earnings (P/E) ratio of 12, relative to the S&P 500 average P/E of 15.3. The financial statements reported net earnings of $126 million, or $4.00 per share. The notes to the financial statements included a statement that income for the year included a $31.5 million (after-tax) gain from the reclassification of certain assets from its investment portfolio to its trading portfolio. What would be the normalized P/E?", "opts": ["13.", "15.", "16."], "ans": "C", "expl": "Since the P/E ratio was 12 and EPS was $4, the price of the stock was $48 (12 × 4). After removing the nonrecurring gain, earnings will be $94.5 million (126 − 31.5). We know the number of shares is 31.5 million (126 Million ÷ 4). So the new EPS number is 3 (94.5 million ÷ 31.5 million) and new P/E ratio is 16 (48 ÷ 3).", "explhtml": "<p>Since the P/E ratio was 12 and EPS was $4, the price of the stock was $48 (12 × 4). After removing the nonrecurring gain, earnings will be $94.5 million (126 − 31.5). We know the number of shares is 31.5 million (126 Million ÷ 4). So the new EPS number is 3 (94.5 million ÷ 31.5 million) and new P/E ratio is 16 (48 ÷ 3).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>An investor relations spokesperson for the Square Door Corporation was quoted as saying that Square Door shares were a bargain, selling at a price-to-earnings (P/E) ratio of 12, relative to the S&amp;P 500 average P/E of 15.3. The financial statements reported net earnings of $126 million, or $4.00 per share. The notes to the financial statements included a statement that income for the year included a $31.5 million (after-tax) gain from the reclassification of certain assets from its investment portfolio to its trading portfolio. What would be the normalized P/E?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Inventories are listed on the balance sheet at $600,000, retained earnings are $1.9 Million. In the notes to financial statements, you find a LIFO reserve of $125,000. Also, the probability of a LIFO liquidation is high. Assuming a tax rate of 36%, what will be the adjusted value of retained earnings?", "opts": ["$1,855,000.00", "$1,980,000.00", "$1,820,000.00"], "ans": "B", "expl": "The highly probably LIFO liquidation suggests net income, income tax expense, and equity will rise. The analyst can make this adjustment now for forecasting purposes. The adjustment to retained earnings will be: $125,000 × (1 − 0.36).", "explhtml": "<p>The highly probably LIFO liquidation suggests net income, income tax expense, and equity will rise. The analyst can make this adjustment now for forecasting purposes. The adjustment to retained earnings will be: $125,000 × (1 − 0.36).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>Inventories are listed on the balance sheet at $600,000, retained earnings are $1.9 Million. In the notes to financial statements, you find a LIFO reserve of $125,000. Also, the probability of a LIFO liquidation is high. Assuming a tax rate of 36%, what will be the adjusted value of retained earnings?<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "ABC Tie Company reports income for the year 2009 as $450,000. The notes to its financial statements state that the firm uses the last in, first out (LIFO) convention to value its inventories, and that had it used first in, first out (FIFO) instead, inventories would have been $62,000 greater for the year 2008 and $78,000 greater for the year 2009. If earnings were restated using FIFO to determine the cost of goods sold (COGS), what would the net income be for the year 2009? Assume a tax rate of 36%. Net income would have been:", "opts": ["$460,240.", "$455,760.", "$439,760."], "ans": "A", "expl": "The reduction in COGS would result in an increase in net income (62,000 − 78,000) × (1 − 0.36).", "explhtml": "<p>The reduction in COGS would result in an increase in net income (62,000 − 78,000) × (1 − 0.36).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>ABC Tie Company reports income for the year 2009 as $450,000. The notes to its financial statements state that the firm uses the last in, first out (LIFO) convention to value its inventories, and that had it used first in, first out (FIFO) instead, inventories would have been $62,000 greater for the year 2008 and $78,000 greater for the year 2009. If earnings were restated using FIFO to determine the cost of goods sold (COGS), what would the net income be for the year 2009? Assume a tax rate of 36%. Net income would have been:<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "Eclipse Inc operates in several business segments. A breakdown of assets and capital expenditures by segments along with common size calculations are presented below: Segment       Assets 20X3  20X4  20X5  Online  $2,610 28.74%  $2,481 27.72%  $1,651 20.20% | B&M  $3,840 42.28%  $3,239 36.19%  $3,824 46.78% | B to B  $2,172 23.91%  $2,718 30.38%  $2,054 25.12% | Services  $460  5.07%  $512  5.72%  $646  7.90% | Total  $9,082 100.00% $8,950 100.00% $8,176 100.00% CapEx Online  $287  28.93%  $260  28.02%  $173  20.10% | B&M  $499  50.31%  $389  41.81%  $459  53.22% | B to B  $174  17.51%  $245  26.32%  $185  21.44% | Services  $32  3.25%  $36  3.86%  $45  5.24% | Total  $992  100%  $930  100%  $862  100% Which of the following conclusions is most appropriate? From 20X3 to 20X5:", "opts": ["Eclipse is growing its investment in online segment while reducing its investment in Services segment.", "Eclipse is growing its investment in B&M segment while reducing its investment in Services segment.", "Eclipse is growing its investment in B to B segment while reducing its investment in Online segment."], "ans": "B", "expl": "A ratio of CapEx % to assets % will indicate whether a company is growing its investment in a segment or reducing it. A value greater than 1 indicates growing a segment while a value less than 1 indicates shrinking a segment. Segment CapEx%/Assets%   Revenues 20x3 20x4 20x5 Online  1.01  1.01  1.00 | B&M  1.19  1.16  1.14 | B to B  0.73  0.87  0.85 | Services  0.64  0.67  0.66 For 20X3, B&M ratio = 50.31 / 42.28 = 1.19 Online segment seems to be at par. Company is emphasizing investment in B&M while reducing investment in B to B and services sector.", "explhtml": "<p>A ratio of CapEx % to assets % will indicate whether a company is growing its investment in a segment or reducing it. A value greater than 1 indicates growing a segment while a value less than 1 indicates shrinking a segment.<\/p><div class=\"tbl\"><table><tr><td>Segment<\/td><td colspan=3>CapEx%/Assets%<\/td><\/tr><tr><td>Revenues<\/td><td>20x3<\/td><td>20x4<\/td><td>20x5<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Online<\/td><td>1.01<\/td><td>1.01<\/td><td>1.00<\/td><\/tr><tr><td>B&amp;M<\/td><td>1.19<\/td><td>1.16<\/td><td>1.14<\/td><\/tr><tr><td>B to B<\/td><td>0.73<\/td><td>0.87<\/td><td>0.85<\/td><\/tr><tr><td>Services<\/td><td>0.64<\/td><td>0.67<\/td><td>0.66<\/td><\/tr><\/table><\/div><p>For 20X3, B&amp;M ratio = 50.31 / 42.28 = 1.19<\/p><p>Online segment seems to be at par. Company is emphasizing investment in B&amp;M while reducing investment in B to B and services sector.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.3, LOS 12.b<\/div><div class=\"qtext\"><p>Eclipse Inc operates in several business segments. A breakdown of assets and capital expenditures by segments along with common size calculations are presented below:<\/p><div class=\"tbl\"><table><tr><td>Segment<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Assets<\/td><td>20X3<\/td><td><\/td><td>20X4<\/td><td><\/td><td>20X5<\/td><td><\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td>Online<\/td><td>$2,610 28.74%<\/td><td>$2,481 27.72%<\/td><td>$1,651 20.20%<\/td><\/tr><tr><td>B&amp;M<\/td><td>$3,840 42.28%<\/td><td>$3,239 36.19%<\/td><td>$3,824 46.78%<\/td><\/tr><tr><td>B to B<\/td><td>$2,172 23.91%<\/td><td>$2,718 30.38%<\/td><td>$2,054 25.12%<\/td><\/tr><tr><td>Services<\/td><td>$460<\/td><td>5.07%<\/td><td>$512<\/td><td>5.72%<\/td><td>$646<\/td><td>7.90%<\/td><\/tr><tr><td>Total<\/td><td>$9,082 100.00% $8,950 100.00% $8,176 100.00%<\/td><\/tr><\/table><\/div><p>CapEx<\/p><div class=\"tbl\"><table><tr><td>Online<\/td><td>$287<\/td><td>28.93%<\/td><td>$260<\/td><td>28.02%<\/td><td>$173<\/td><td>20.10%<\/td><\/tr><tr><td>B&amp;M<\/td><td>$499<\/td><td>50.31%<\/td><td>$389<\/td><td>41.81%<\/td><td>$459<\/td><td>53.22%<\/td><\/tr><tr><td>B to B<\/td><td>$174<\/td><td>17.51%<\/td><td>$245<\/td><td>26.32%<\/td><td>$185<\/td><td>21.44%<\/td><\/tr><tr><td>Services<\/td><td>$32<\/td><td>3.25%<\/td><td>$36<\/td><td>3.86%<\/td><td>$45<\/td><td>5.24%<\/td><\/tr><tr><td>Total<\/td><td>$992<\/td><td>100%<\/td><td>$930<\/td><td>100%<\/td><td>$862<\/td><td>100%<\/td><\/tr><\/table><\/div><p>Which of the following conclusions is most appropriate? From 20X3 to 20X5:<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "Which of the following statements is CORRECT when inventory prices are falling?", "opts": ["LIFO results in lower COGS, lower earnings, lower taxes, and higher cash flows.", "LIFO results in higher COGS, lower earnings, higher taxes, and higher cash flows.", "LIFO results in lower COGS, higher earnings, higher taxes, and lower cash flows."], "ans": "C", "expl": "Remember, prices are falling. Under LIFO, the most recent purchases flow to COGS. So, LIFO results in lower COGS, higher earnings, higher taxes, and lower cash flows.", "explhtml": "<p>Remember, prices are falling. Under LIFO, the most recent purchases flow to COGS. So, LIFO results in lower COGS, higher earnings, higher taxes, and lower cash flows.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Which of the following statements is CORRECT when inventory prices are falling?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "Coastal Drilling Corp (CDC) reported the following year-end data: EBIT $23 million EBT $20 million Effective tax rate 40 percent CDC reported in the footnotes to its financial statements that it had increased the expected return on pension plan assets assumption which resulted in an increase of EBIT of $2 million. Analyst Wanda Brunner, CFA, thinks this change in assumptions is unfounded and removes the $2 million increase in EBIT. Which of the following is closest to the tax burden ratio after adjustment?", "opts": ["55.6%.", "60.0%.", "61.9%."], "ans": "B", "expl": "Tax burden = NI/EBT or 1 - the effective tax rate. The increase in the return on pension plan assets assumption increased EBIT, EBT, Income Taxes, and Net Income from what it would have been. Removing $2 million from the reported numbers will reduce EBIT, EBT, Income Taxes, and Net Income. However, the tax burden ratio will still be 1 - the effective tax rate.", "explhtml": "<p>Tax burden = NI/EBT or 1 - the effective tax rate. The increase in the return on pension plan assets assumption increased EBIT, EBT, Income Taxes, and Net Income from what it would have been. Removing $2 million from the reported numbers will reduce EBIT, EBT, Income Taxes, and Net Income. However, the tax burden ratio will still be 1 - the effective tax rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Coastal Drilling Corp (CDC) reported the following year-end data:<\/p><div class=\"tbl\"><table><tr><td>EBIT<\/td><td>$23 million<\/td><\/tr><tr><td>EBT<\/td><td>$20 million<\/td><\/tr><tr><td>Effective tax rate<\/td><td>40 percent<\/td><\/tr><\/table><\/div><p>CDC reported in the footnotes to its financial statements that it had increased the expected return on pension plan assets assumption which resulted in an increase of EBIT of $2 million. Analyst Wanda Brunner, CFA, thinks this change in assumptions is unfounded and removes the $2 million increase in EBIT. Which of the following is closest to the tax burden ratio after adjustment?<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "An analyst is analyzing TRK Construction (TRK) for possible recommendation to his firm's clients. He wants to use TRK's financial statements to answer such questions as \"Is TRK suitable for firm clients?\", \"Is TRK priced properly relative to peers?\", \"What is TRK's earnings quality?\" The analyst is most likely to begin with:", "opts": ["a review of his firm’s framework for analysis of financial statements.", "analysts adjustments to the financial statements.", "a DuPont analysis."], "ans": "A", "expl": "Analysis of financial statements should be performed in the context of an overall framework for the analysis of financial statements. Specific adjustments or analysis of specific ratios is a secondary concern.", "explhtml": "<p>Analysis of financial statements should be performed in the context of an overall framework for the analysis of financial statements. Specific adjustments or analysis of specific ratios is a secondary concern.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.1, LOS 12.a<\/div><div class=\"qtext\"><p>An analyst is analyzing TRK Construction (TRK) for possible recommendation to his firm&#x27;s clients. He wants to use TRK&#x27;s financial statements to answer such questions as &quot;Is TRK suitable for firm clients?&quot;, &quot;Is TRK priced properly relative to peers?&quot;, &quot;What is TRK&#x27;s earnings quality?&quot; The analyst is most likely to begin with:<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "Trifecta Enterprises, a US based company owns a 30% equity interest in Biata Corporation, a publicly traded firm located in India. Trifecta's market capitalization is $ 16 billion while that of Biata is Rs 1126 billion. Trifecta reported earnings of $1 billion and Biaca reported earnings of Rs. 75 billion. Year-end Rs/$ exchange rate is Rs 84.67/$ while the average rate during the year is Rs. 84.22/$. Trifecta's implied P/E without the results of investing in Biata is what proportion of its P/E?", "opts": ["83%", "103%", "97%"], "ans": "B", "expl": "Trifecta's P/E = market cap / earnings = 16 / 1 = 16 Removing the value of investment in associate from Trifecta's market cap (at year-end exchange rate)\" Trifecta'stand-alone market cap = $ 16 billion – (0.30 x Rs. 1126 billion x 1/84.67) = $12.01B Removing the earnings of associate (at average exchange rate) from Trifecta's earnings: Trifecta's stand-alone earnings = $1 billion – (0.30 x Rs. 75 billion x 1/84.22) = $0.73 B Trifecta's implied P/E (without investment in Biata) = 12.01 / 0.73 = 16.45 Implied P/E as a proportion of actual P/E= 16.45 / 16 = 1.03", "explhtml": "<p>Trifecta&#x27;s P/E = market cap / earnings = 16 / 1 = 16<\/p><p>Removing the value of investment in associate from Trifecta&#x27;s market cap (at year-end exchange rate)&quot;<\/p><p>Trifecta&#x27;stand-alone market cap = $ 16 billion – (0.30 x Rs. 1126 billion x 1/84.67) = $12.01B<\/p><p>Removing the earnings of associate (at average exchange rate) from Trifecta&#x27;s earnings:<\/p><p>Trifecta&#x27;s stand-alone earnings = $1 billion – (0.30 x Rs. 75 billion x 1/84.22) = $0.73 B<\/p><p>Trifecta&#x27;s implied P/E (without investment in Biata) = 12.01 / 0.73 = 16.45<\/p><p>Implied P/E as a proportion of actual P/E= 16.45 / 16 = 1.03<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.6, LOS 12.e<\/div><div class=\"qtext\"><p>Trifecta Enterprises, a US based company owns a 30% equity interest in Biata Corporation, a publicly traded firm located in India. Trifecta&#x27;s market capitalization is $ 16 billion while that of Biata is Rs 1126 billion. Trifecta reported earnings of $1 billion and Biaca reported earnings of Rs. 75 billion.<\/p><p>Year-end Rs/$ exchange rate is Rs 84.67/$ while the average rate during the year is Rs. 84.22/$. Trifecta&#x27;s implied P/E without the results of investing in Biata is what proportion of its P/E?<\/p><\/div>", "subj": "fsa"}, {"n": 28, "q": "If segmental cash flow data has not been reported, we can most appropriately approximate cash flow as:", "opts": ["EBIT + depreciation + amortization.", "EBIT + non-cash charges + increase in working capital.", "operating cash flow − cash interest − cash taxes."], "ans": "A", "expl": "We are most likely to approximate segment cash flow as EBIT plus depreciation and amortization. This calculation is necessary because segmental cash flow data is generally not reported.", "explhtml": "<p>We are most likely to approximate segment cash flow as EBIT plus depreciation and amortization. This calculation is necessary because segmental cash flow data is generally not reported.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.2, LOS 12.c<\/div><div class=\"qtext\"><p>If segmental cash flow data has not been reported, we can most appropriately approximate cash flow as:<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "Endrun Company reported net income of $4.7 million in 1999, and $4.3 million in 2000. In reviewing the annual report an analyst notices that the Endrun took a charge of $2.4 million in 1999 for the costs of relocating its main office, and in 2000 booked a gain of $900,000 on the sale of its previous office building. What would \"normalized earnings\" be for 1999 and 2000 if we assume a tax rate of 36% for both years?", "opts": ["$7.1 million and $5.2 million.", "$6.236 million and $3.724 million.", "$3.99 million and $2.54 million."], "ans": "B", "expl": "You will increase 1999 earnings by the tax-adjusted value of the 2.4 million one-time charge (2.4 × (1 - 0.36) = +1.536), and you would decrease Y2000 earnings by the tax-adjusted amount of the $0.9 million one-time gain (0.9 × (1 - 0.36) = -0.576).", "explhtml": "<p>You will increase 1999 earnings by the tax-adjusted value of the 2.4 million one-time charge (2.4 × (1 - 0.36) = +1.536), and you would decrease Y2000 earnings by the tax-adjusted amount of the $0.9 million one-time gain (0.9 × (1 - 0.36) = -0.576).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>Endrun Company reported net income of $4.7 million in 1999, and $4.3 million in 2000. In reviewing the annual report an analyst notices that the Endrun took a charge of $2.4 million in 1999 for the costs of relocating its main office, and in 2000 booked a gain of $900,000 on the sale of its previous office building. What would &quot;normalized earnings&quot; be for 1999 and 2000 if we assume a tax rate of 36% for both years?<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Highplains is a rapidly-growing regional bank that operates across 19 states in the Southeast, Mid-Atlantic, and Midwestern United States. Highplains' balance sheet assets for 20X3 and 20X4 are shown below: Category 20X3 20X4 Cash and Marketable Securities 1100 1133 Other Current Assets 2245 2750 Fixed Assets 4422 6512 Goodwill 1250 2120 Total Assets 9017 12515 Which of the following conclusions would be most appropriate based on an analysis of the assets?", "opts": ["Highplains has obsolete inventory.", "Highplains made significant investments in fixed assets in 20X4", "Highplains made significant acquisitions in 20X4."], "ans": "C", "expl": "For a typical bank, major sources of earnings are (1) net interest income, (2) service income, and (3) trading income. Of these, trading income is the most volatile year-to-year, and, hence, on a relative basis, banks with proportionally higher net interest income and service income would have more sustainable earnings. Category 20X3 20X4 20X3 20X4 Cash and Marketable Securities 1100 1133 12% 9% Other Current Assets 2245 2750 25% 22% Fixed Assets 4422 6512 49% 52% Goodwill 1250 2120 14% 17% Total Assets 9017 12515 100% 100% It appears that goodwill has increased significantly in 20x4 indicating additional acquisitions in 20X4. The increase in fixed assets is probably due to consolidation of fixed assets at fair value of the acquired subsidiaries. We don't have information about inventory values – and those would be affected by consolidation as well.", "explhtml": "<p>For a typical bank, major sources of earnings are (1) net interest income, (2) service income, and (3) trading income. Of these, trading income is the most volatile year-to-year, and, hence, on a relative basis, banks with proportionally higher net interest income and service income would have more sustainable earnings.<\/p><div class=\"tbl\"><table><tr><td>Category<\/td><td>20X3<\/td><td>20X4<\/td><td>20X3<\/td><td>20X4<\/td><\/tr><tr><td>Cash and Marketable Securities<\/td><td>1100<\/td><td>1133<\/td><td>12%<\/td><td>9%<\/td><\/tr><tr><td>Other Current Assets<\/td><td>2245<\/td><td>2750<\/td><td>25%<\/td><td>22%<\/td><\/tr><tr><td>Fixed Assets<\/td><td>4422<\/td><td>6512<\/td><td>49%<\/td><td>52%<\/td><\/tr><tr><td>Goodwill<\/td><td>1250<\/td><td>2120<\/td><td>14%<\/td><td>17%<\/td><\/tr><tr><td>Total Assets<\/td><td>9017<\/td><td>12515<\/td><td>100%<\/td><td>100%<\/td><\/tr><\/table><\/div><p>It appears that goodwill has increased significantly in 20x4 indicating additional acquisitions in 20X4. The increase in fixed assets is probably due to consolidation of fixed assets at fair value of the acquired subsidiaries. We don&#x27;t have information about inventory values – and those would be affected by consolidation as w 42.83 million, respectively.<\/p><p>As compared to the year ended 2007, High Plains&#x27; cash flow accrual ratio for the year ended 2008 is:<\/p><\/div>", "subj": "fsa"}, {"n": 33, "q": "A firm has reported net income of $136 million, but the notes to financial statements includes a statement that the results \"include a $27 million charge for non-insured earthquake damage\" and a \"gain on the sale of certain assets during restructuring of $16 million.\" If we assume that both of these items are given on a pre-tax basis and the effective tax rate is 36%, what would be the \"normal income\"?", "opts": ["$94.08 million.", "$147.00 million.", "$143.04 million."], "ans": "C", "expl": "To normalize earnings you would increase it by the non-recurring charge of $27 million and decrease it by the non-recurring gain, both tax adjusted. $136 + (27 - 16)(1 - 0.36) = $143.04.", "explhtml": "<p>To normalize earnings you would increase it by the non-recurring charge of $27 million and decrease it by the non-recurring gain, both tax adjusted.<\/p><p>$136 + (27 - 16)(1 - 0.36) = $143.04.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 12.5, LOS 12.e<\/div><div class=\"qtext\"><p>A firm has reported net income of $136 million, but the notes to financial statements includes a statement that the results &quot;include a $27 million charge for non-insured earthquake damage&quot; and a &quot;gain on the sale of certain assets during restructuring of $16 million.&quot; If we assume that both of these items are given on a pre-tax basis and the effective tax rate is 36%, what would be the &quot;normal income&quot;?<\/p><\/div>", "subj": "fsa"}, {"n": 34, "q": "An analyst is developing a framework for financial statement analysis for his firm. The primary goal of financial statement analysis is to:", "opts": ["document portfolio changes for purposes of the Prudent Investor Rule.", "justify trading decisions for purposes of the Statement of Code and Standards.", "facilitate an economic deci const CFG = {"title": "Reading 12 — Integration of Financial Statement Analysis Techniques", "subtitle": "CFA Level II · 34 câu · Kaplan Schweser QBank 2025 (29 câu đơn · 5 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}
