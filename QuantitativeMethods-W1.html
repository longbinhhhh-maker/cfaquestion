e formula.\nThings to remember:\nIf an investment's return is compounded more than once per year, then the investor's effective annual rate of return is greater than the stated\nannual rate of return. All else being equal, a greater number of compounding periods means a greater return for the investor, based on a given\nstated annual rate.\nCalculate and interpret annualized return measures and continuously compounded returns, and describe their appropriate uses", "qhtml": null}, {"n": 35, "q": "An investor buys a share of stock for €50 today. At the end of the Year 1, the investor buys another share of the same stock for €60 and receives a dividend of €2. At the end of Year 2, the investor receives total dividends of €4 and then sells both shares for €130. The money- weighted rate of return is closest to:", "opts": ["12.05%", "13.05%", "15.68%"], "ans": "C", "expl": "The money-weighted rate of return (MWR) and the time weighted-rated of return (TWR) are two methods used to calculate portfolio return over\ntime. The TWR is often used to measure an investment manager's return performance. The MWR is often used to measure an investor's change\nin wealth when an investor has control over cash flows.\nThe MWR is the internal rate of return on a portfolio. The MWR is the rate that equates the present value of the investor's cash outflows\n(contributions) to the investor's cash inflows (withdrawals). Due to this relationship, MWR is determined by the timing and amount of cash flows.\nTo solve for the MWR, first determine net cash flow for each period:\nThen, input net cash flows into a financial calculator:\n(Choice A) This results from excluding dividends when solving for MWR.\n(Choice B) This results from incorrectly treating the dividend as a cash outflow to the investor at T = 1.\nThings to remember:\nThe money-weighted rate of return (MWR) is the internal rate of return on a portfolio. It equates the present value of the investor's cash outflows\n(contributions) to the investor's cash inflows (withdrawals). MWR is heavily influenced by the timing and amount of cash flows. MWR is\nappropriate when an investor has control over withdrawals and contributions.\ncompare the money-weighted and time-weighted rates of return and evaluate the performance of portfolios based on these measures", "qhtml": null}, {"n": 36, "q": "An analyst has gathered the following data to calculate the expected return of an asset: The asset's expected return is closest to:", "opts": ["7.99%", "8.80%", "9.05%"], "ans": "C", "expl": "An investment's return is the investor's compensation for delaying consumption and bearing risk. Therefore, expected return is a function of:\nReal risk-free rate (ie, compensation for delaying consumption)\nExpected inflation rate (ie, compensation for the loss of purchasing power)\nExpected risk premium (ie, compensation for bearing the risks of an investment)\nThe expected return in this scenario is calculated as:\n(Choice A) 7.99% is the result of incorrectly using the economic growth rate instead of the real rate of return to calculate expected inflation.\n(Choice B) 8.80% is the result of adding the real risk-free rate, expected risk premium, and expected inflation. Although that is one way to\napproximate expected return, it does not result in the exact expected return.\nThings to remember:\nThe expected return of an asset is the investor's compensation for postponing consumption and bearing risks. Expected return = [(1 + real risk-\nfree rate) ⨯ (1 + expected inflation) ⨯ (1 + expected risk premium)] − 1.\nCalculate and interpret major return measures and describe their appropriate uses", "qhtml": null}, {"n": 37, "q": "An asset's one-year continuously compounded return is 9.2%. Assuming no income from the asset, if its beginning price is BRL 136.50, then its price at the end of one year (in BRL) is closest to:", "opts": ["149.06", "149.65", "150.33"], "ans": "B", "expl": "In a discretely compounded return, an investment's return compounds periodically (eg, monthly, quarterly) for a defined number of periods within a\ncertain time frame. In a continuously compounded return, an investment's return compounds over infinite periods within a certain time frame.\nThe continuously compounded return equals the natural log of the ratio of ending price to beginning price. It should be noted that the ratio of the\nending price to the beginning price is equivalent to 1 + Holding period return.\nIn this scenario, the asset's ending price is calculated through the following steps:\n(Choice A) 149.06 is the result of treating 9.2% as the asset's holding period return. The incorrect setup would have been r = In(1 + 0.092).\nt,t+1\n(Choice C) 150.33 is the result of treating 9.2% as the asset's discount yield. The incorrect setup would have been: (Face value − Purchase\nprice) / Face value = 0.092.\nThings to remember:\nIn a continuously compounded return, an investment's return compounds over infinite periods within a certain time frame. The continuously\ncompounded return is the natural log of the ratio of the ending price to the beginning price. This ratio is equivalent to (1 + Holding period return).\nCalculate and interpret annualized return measures and continuously compounded returns, and describe their appropriate uses", "qhtml": null}, {"n": 38, "q": "A portfolio manager has compiled an investment's annual returns for three years: Time Period Return (%) Year 1 −3% Year 2 11% Year 3 −5% The average annual compounded return on the investment over the three-year holding period is closest to: ", "opts": ["0.76%", "1.00%", "2.29%"], "ans": "A", "expl": "The compounded periodic rate of return for an asset is the geometric mean return. It is used to measure the periodic average of investment\nperformance over multiple consecutive periods.\nCompounding assumes that one period's ending investment value is the next period's beginning value (ie, that returns accumulate). The\ngeometric mean is the average periodic rate of return that accounts for compounding and includes accumulated returns in subsequent periods. In\nthis instance, there are three annual periods (ie, N = 3), so the geometric mean is:\n(Choice B) 1.00% is the arithmetic mean, which is calculated as the simple average of multiple periodic returns and does not reflect\ncompounding.\n(Choice C) 2.29% is the holding period return, which is the total cumulative return received over the three-year period, not the annual return.\nThings to remember:\nThe geometric mean is the average periodic rate of return that accounts for compounding and includes accumulated returns in subsequent\nperiods. It is used to measure investment performance over multiple consecutive periods.\nCalculate and interpret different approaches to return measurement over time and describe their appropriate uses", "qhtml": null}, {"n": 39, "q": "An investor deposits ¥100 million into a fund at the beginning of Year 1 and deposits another ¥50 million at the beginning of Year 2. At the beginning of Year 3, the investor withdraws ¥15 million. The fund has the following returns: Year Return (%) 1 20 2 10 3 −20 The investor's money-weighted annual rate of return over the three-year period is closest to: ", "opts": ["0.7%", "1.0%", "1.8%"], "ans": "A", "expl": "The money-weighted return (MWR), an application of the internal rate of return (IRR), measures investment performance based on an\ninvestor's cash flows (ie, deposits and withdrawals). By contrast, the arithmetic mean and time-weighted return do not account for cash flows into\nand out of the portfolio.\nAs an application of the IRR, the MWR discounts cash flows so that their net present value (NPV) is equal to zero and the initial investment is\nequal to the future discounted deposits and withdrawals. For the investor, deposits are outflows and withdrawals are inflows.\nWhen calculating MWR, the investment's ending value is assumed to be the final cash inflow (if positive) or outflow (if negative). Therefore, to\ncalculate the MWR, the ending balance must be calculated first, using the investor's deposits and withdrawals and the return on the investment\nover each period.\n(¥ millions) Year 1 Year 2 Year 3\nBalance at beginning of year 0 120 187\nInvestor's deposits (withdrawals) 100 50 −15\nNet balance after deposits (withdrawals) 100 170 172\nReturn for the year 20% 10% −20%\nInvestment gain (loss) 20 17 −34.4\nBalance at end of year [= Net balance + Investment gain (loss)] 120 187 137.6\nAfter the cash flows have been identified, solve for the MWR using a financial calculator. Enter positive values for cash inflows and negative\nvalues for cash outflows.\nThings to remember:\nThe money-weighted return is an application of the internal rate of return. It measures the actual return on an investment based on the amount of\ncontributions and withdrawals and the periodic returns on the investment.\nCalculate and interpret major return measures and describe their appropriate uses\n40.An individual makes the following deposits, one every six months with the first deposit beginning today:\nIf the stated interest rate is 5.4% compounded monthly, the value of the account (in SGD) six months after the last deposit is made is closest to:\nA. 46,540\nB. 47,779\n\nC. 47,811\nExplanation\nThis time value of money question requires the candidate to calculate the future value of a bank account that is funded by a series of three\nunequal cash flows. The first deposit is made today, and subsequent deposits occur every six months.\nEach deposit is a different amount, so the future value cannot be calculated as an annuity. Instead, each deposit's future value must be\ncalculated separately as the amount of the deposit (ie, its present value) multiplied by a future value factor:\nThe stated rate of 5.4% is compounded monthly, so there are 12 compounding periods per year. To account for monthly compounding, the stated\nrate must be converted to a monthly rate: 0.054 ÷ 12 = 0.0045.\n(Choice A) SGD 46,540 results from forgetting to compound for the 6-month period following the last deposit or from incorrectly assuming that all\ndeposits occur at the end of the period rather than at the beginning.\n(Choice B) SGD 47,779 results from assuming semiannual, rather than monthly, compounding. It may be useful to remember that if two series\nare identical with respect to the stated rate, amount, and timing of cash flows, the series with the more frequent compounding always produces a\nhigher future value.\nThings to remember:\nThe future value of a series of uneven cash flows is the sum of the cash flows' future values. The series cannot be calculated as an annuity since\neach deposit is a different amount.\nCalculate and interpret annualized return measures and continuously compounded returns, and describe their appropriate uses", "qhtml": null}, {"n": 40, "q": "An individual makes the following deposits, one every six months with the first deposit beginning today: If the stated interest rate is 5.4% compounded monthly, the value of the account (in SGD) six months after the last deposit is made is closest to:", "opts": ["46,540", "47,779", "47,811"], "ans": "C", "expl": "This time value of money question requires the candidate to calculate the future value of a bank account that is funded by a series of three\nunequal cash flows. The first deposit is made today, and subsequent deposits occur every six months.\nEach deposit is a different amount, so the future value cannot be calculated as an annuity. Instead, each deposit's future value must be\ncalculated separately as the amount of the deposit (ie, its present value) multiplied by a future value factor:\nThe stated rate of 5.4% is compounded monthly, so there are 12 compounding periods per year. To account for monthly compounding, the stated\nrate must be converted to a monthly rate: 0.054 ÷ 12 = 0.0045.\n(Choice A) SGD 46,540 results from forgetting to compound for the 6-month period following the last deposit or from incorrectly assuming that all\ndeposits occur at the end of the period rather than at the beginning.\n(Choice B) SGD 47,779 results from assuming semiannual, rather than monthly, compounding. It may be useful to remember that if two series\nare identical with respect to the stated rate, amount, and timing of cash flows, the series with the more frequent compounding always produces a\nhigher future value.\nThings to remember:\nThe future value of a series of uneven cash flows is the sum of the cash flows' future values. The series cannot be calculated as an annuity since\neach deposit is a different amount.\nCalculate and interpret annualized return measures and continuously compounded returns, and describe their appropriate uses", "qhtml": null}, {"n": 41, "q": "Country A and Country B are both large issuers of government debt, and each country issues approximately the same amount of debt. The interest rate for one-year government debt is 3% in Country A and 3.5% in Country B. With respect to variables such as credit rating and issuance in multiple maturities, the characteristics of each country's government debt are similar. Based only on the information given, which of the following risk premiums most likely accounts for the difference in the interest rates?", "opts": ["Default premium", "Inflation premium", "Liquidity premium"], "ans": "B", "expl": "Interest rates are based on a real risk-free rate, which is the return that investors demand for a bond with no default risk or inflation expectations.\nThe other premiums shown above compensate investors who hold riskier bonds. Interest rates are influenced by supply and demand for\nborrowed funds; therefore, each premium quantifies the additional compensation investors demand for lending when specific risks are present.\nIn this scenario, both countries issue approximately the same amount of debt, so both countries' bonds should be similarly liquid. A liquidity\npremium most likely applies when a country issues fewer bonds since smaller issues tend to trade less frequently (Choice C). Less trading\nmeans less liquidity since the supply and demand forces that contribute to market prices are absent.\n(Choice A) The countries' similar credit ratings indicate a similar default risk; however, a default risk premium does not apply to this scenario.\nThis leaves only the possibility that lenders anticipate higher inflation in Country B and demand an appropriate premium to compensate for the\nrisk.\nThings to remember:\nInterest rates are based on a real risk-free rate, which is the return that investors demand for a bond with no default risk or inflation expectations.\nPremiums for specific risks such as liquidity, default, and inflation are added to the real risk-free rate to compensate investors for assuming those\nrisks.\nInterpret interest rates as required rates of return, discount rates, or opportunity costs and explain an interest rate as the sum of a real risk-free\nrate and premiums that compensate investors for bearing distinct types of risk", "qhtml": null}, {"n": 42, "q": "An investor creates a portfolio by buying one share of stock for CAD 100 today. At the end of the Year 1, the investor buys another share of the same stock for CAD 105. At the end of Year 2, the investor sells both shares for CAD 115 each. The stock paid a dividend of CAD 10 at the end of Year 1 and paid total dividends of CAD 20 at the end of Year 2. The dividend at the end of Year 1 was reinvested in the portfolio. The time- weighted rate of return is closest to:", "opts": ["9.23%", "14.32%", "17.01%"], "ans": "B", "expl": "The time-weighted rate of return (TWR) and the money-weighted rate of return (MWR) are two methods used to calculate portfolio returns over\ntime. The MWR is often used to measure an investor's increase in wealth. The TWR is often used to measure an investment return performance;\nit is the preferred measure of the two.\nThe TWR measures a portfolio's compounded rate of growth over time. The main advantage of the TWR is that unlike the MWR, the TWR is\nnot affected by the investor's own contributions or withdrawals—both of which may alter portfolio returns.\nTo calculate the TWR, divide the portfolio's overall time horizon into sub-periods based on the dates of contributions or withdrawals. Value the\nportfolio right before these cash flows. Determine the holding period return (HPR) for each sub-period. Finally, link the HPR of each holding sub-\nperiod.\nDetermine activities and calculate HPR (amounts in CAD):\nInput HPR:\nA TWR of 14.32% means that a dollar initially invested into this portfolio grew at a compound annual rate of 14.32% over the two years.\n(Choice A) 9.23% results from excluding dividends received of $10 from the HPR calculation for the first sub-period.\n(Choice C) 17.01% results from not including the reinvested dividends in P when calculating the HPR for the second sub-period.\n1\nThings to remember:\nThe time-weighted rate of return (TWR) is the preferred method for calculating portfolio returns. The TWR measures a portfolio's compound rate\nof growth over time. Its main advantage is that it is not impacted by contributions and withdrawals.\ncompare the money-weighted and time-weighted rates of return and evaluate the performance of portfolios based on these measures", "qhtml": null}];
const CFG = {"title": "Wiley · Rates and Returns", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Quantitative Methods · 42 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
