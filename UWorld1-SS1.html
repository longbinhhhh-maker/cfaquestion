<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following best describes the purpose of the Code of Ethics for the global\ninvestment profession?", "opts": ["To build trust with all market participants", "To set the basis for laws and regulations", "To determine minimally acceptable behaviors"], "ans": "A", "expl": "Instruments for compliance with professional ethics\nInstrument Owner Describes\nCode of ethics Professional organization Shared principles\nStandards of conduct Professional organization Minimally acceptable behavior\nLaws and regulations Government Legal limits of behavior\nA code of ethics is a professional organization's statement of shared principles . It\nprovides the moral compass for collective behavior. Ethical behaviors are those actions that\nconform to society's expectations for honesty, transparency, and fairness, balancing each\nperson's self-interest with an awareness of how his or her actions affect others.\nCFA Institute has adopted the stance that ethics for the global investment industry should\nbe universal and not based on local laws or customs. This ubiquity\ncreates trust and integrity in the whole global financial system. As stated in one of the\nprinciples in the CFA Institute Code of Ethics:\n\" Members and Candidates must:\nPromote the integrity and viability of the global capital markets for the ultimate benefit\nof society .\"\nA profession's code of ethics may or may not be accompanied by standards of conduct,\nwhereas standards of conduct exist only to enhance their associated code of ethics. CFA\nInstitute has adopted both in its Code of Ethics and Standards of Professional Conduct (the\nCode and Standards). CFA charterholders and Candidates are expected to know and comply\nwith both.\n(Choice B) It is a government's responsibility to establish legal limits of behavior\nthrough laws and regulations . The belief system used to create these policies in one country\nmay differ from that of another country and from the shared ethical principles of a global\norganization.\n(Choice C) Standards of conduct clarify the minimally acceptable behaviors required to\nconform to a profession's code of ethics and provide a guide to practicing its principles.\nThings to remember:\nA code of ethics is a professional organization's statement of shared principles. It provides the\nmoral compass for collective behavior. A universal agreement on what is ethical for the global\ninvestment profession creates trust and integrity in the whole global financial system, which\nultimately benefits society.\nDescribe the role of a code of ethics in defining a profession\nLOS", "qhtml": null}, {"n": 2, "q": "Stella Smith, CFA, works for Aqua Investment Consulting. She is invited to share her\neconomic outlook at a conference hosted by Zenat Securities Corp., an investment\nmanagement firm used by Aqua. Zenat pays all speakers' travel expenses and entices\nspeakers by offering a free spa day during the conference. Smith most likely violates\nStandard I(B) Independence and Objectivity if she accepts Zenat's offer for:", "opts": ["only her travel.", "only the spa day.", "both her travel and the spa day."], "ans": "B", "expl": "\" Members and Candidates must use reasonable care and judgment\nto achieve and maintain independence and objectivity in their\nprofessional activities. Members and Candidates must not offer,\nsolicit, or accept any gift, benefit, compensation, or consideration\nthat reasonably could be expected to compromise their own or\nanother's independence and objectivity. \"\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid\nactions that compromise their independence and objectivity or create conflicts of interest.\nIn many cases, Members and Candidates should refrain from accepting payment for travel\nexpenses to avoid any appearance of compromised independence or objectivity.\nIn this scenario, Stella Smith has been invited to speak on the economic outlook at an\ninvestment conference hosted by Zenat Securities Corp. Since she is not making any\ninvestment recommendations or endorsing Zenat in any way, accepting payment to cover her\ntravel expenses in this case is not likely to compromise her independence or\nobjectivity (Choices A and C) .\nHowever, the spa day can be considered an extravagant gift. Since Zenat has a vendor-\nclient relationship with Smith's firm, Aqua Investment Consulting, this gift might be seen as an\nattempt to compromise Smith's independence and objectivity in making investment\nrecommendations to Aqua's clients.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid\nactions that compromise their independence and objectivity. Accepting compensation or gifts\nother than travel expenses from firms when there is a vendor-client relationship may\ncompromise independence and objectivity with regard to investment recommendations.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 3, "q": "Mina Pappas, CFA, is the sole proprietor of Milos Capital, providing financial advice to high-net-\nworth clients. Pappas invests client's equity assets through a separately managed account\nstrategy consisting of a portfolio of 20 equally weighted, large-cap stocks. Part of Pappas'\nsales pitch to clients and prospects is that she invests \"alongside\" her clients by investing her\nown assets in the same strategy.\nPappas decides to sell one of the holdings and replace it with her best new idea. Pappas\nenters the buy and sell orders for all clients, including herself, and executes the trades. All\nclients receive the same execution prices, including Pappas. According to Standard VI(B)\nPriority of Transactions, Pappas most likely :", "opts": ["is in full compliance with the Standard.", "violated the Standard by not adhering to a blackout period.", "violated the Standard by not executing the client's trades first."], "ans": "A", "expl": "\"Investment transactions for clients and employers must have\npriority over investment transactions in which a Member or\nCandidate is the beneficial owner.\"\nStandard VI(B) Priority of Transactions requires members and candidates to\nplace clients' and employers' financial interests before their own when conducting\ninvestment transactions. It is not uncommon for a member or candidate to transact in the\nsame investments as clients, or even alongside clients . A Member or Candidate does not\nviolate the Standard provided that:\nthe client is not disadvantaged by the trade,\nthe member or candidate does not benefit from the client transactions, and\nthe member or candidate adheres to all applicable regulatory requirements.\nIn this scenario, Pappas complied with the Standard .\n(Choice B) Blackout periods are specifically intended to prevent \"front-running,\" which is\nplacing personal trades or a firm's proprietary trades ahead of client trades. In this instance,\nby combining and executing all trades at once, Pappas is investing alongside her clients, as\nshe has previously communicated. Therefore, a blackout period is not applicable given the\ncircumstances.\n(Choice C) In this case, the client was not disadvantaged nor did Pappas benefit from the\nclient transactions; therefore, Pappas did not violate the Standard by executing her trades\nalongside her clients' trades.\nThings to remember:\nStandard VI(B) requires Members and Candidates to place clients' and employers' financial\ninterests before their own with respect to investment transactions. However, it is not\nuncommon and not a violation for a Member or Candidate to transact in the same investments\nas clients, or even alongside clients.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 4, "q": "Joanna Krakowski, CFA, is the chief compliance officer (CCO) at Universal Investment\nManagers (UIM). Krakowski recently hired John Smith, CFA, as a compliance manager. Smith\nwill report directly to Krakowski, who believes the current compliance systems and procedures\nare adequate.\nAs Smith settles into his new position, he discovers numerous deficiencies including outdated\nsoftware, excessive manual processes, a compliance manual that has not been updated in four\nyears, and inadequately trained and understaffed compliance personnel.\nSmith meets with Krakowski to address these shortcomings, as he does not believe he can\nadequately perform his duties given the circumstances. Krakowski informs Smith that there is\nno money in the budget for new software or additional employees. Smith's most\nappropriate action is to:", "opts": ["improve the compliance program using his best efforts, given his duty is to his employer.", "decline his supervisory responsibilities in writing until the compliance systems are improved.", "immediately submit a written resignation from UIM, since the compliance program is deficient."], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure that\nanyone subject to their supervision or authority complies with applicable laws,\nrules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who\nsupervise employees to encourage behavior that complies with local laws, rules established by\ntheir firms, and the Code and Standards. They also must take reasonable steps to detect and\nprevent violations. A Member or Candidate who encounters an inadequate compliance system\nshould bring the shortcomings of the system to the attention of the company's managers and\nmake recommendations for corrective actions.\nAny Member or Candidate who cannot perform supervisory responsibilities due to these\nshortcomings should decline to accept supervisory responsibility , in writing , until the\ncompliance system is improved and allows for adequate controls. Accepting a supervisory\nrole when the compliance system is inadequate would not allow the Member or Candidate to\nadequately monitor compliance by subordinates, and thus would violate the Standard.\n(Choice A) Smith has a duty to his employer to improve the compliance program using his\nbest efforts but must decline the supervisory responsibilities of the job until the firm has\ncommitted to investing appropriate resources into the compliance program.\n(Choice C) The Standard does not require the Member or Candidate to resign but to decline\nthe supervisory responsibilities of the job until the compliance program is sufficiently\nimproved.\nThings to remember:\nWhen Members or Candidates encounter an inadequate compliance system, they should bring\nthe shortcomings of the system to the attention of company managers and make\nrecommendations for corrective actions. Members and Candidates should decline to take on\nsupervisory responsibility in writing until the compliance system is fixed and allows for\nadequate controls.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 5, "q": "If a firm chooses to verify its compliance with the GIPS standards, the verification must be\nperformed by:", "opts": ["an independent third party.", "the firm's chief compliance officer.", "the local securities market regulatory authority."], "ans": "A", "expl": "GIPS verification\nIs recommended but not required\nMust be performed by an independent third party\nApplies to the entire firm, not just specific composites\nIncreases confidence in a firm's claim of GIPS compliance\nCompliance with GIPS (Global Investment Performance Standards) is voluntary, but a firm\nmust fully comply to claim compliance; there is no partial compliance. For the firm that claims\ncompliance, CFA Institute recommends (but does not require) that compliance be verified to\nenhance the reliability of the firm's assertion.\nVerification must be made by an independent third party and is applied to an entire firm ,\nnot individual composites. Verification does not ensure the accuracy of the composites but\ntests whether the firm:\nhas complied with all GIPS requirements when constructing its composites and\nfollows a process for calculating and presenting performance returns that complies with\nGIPS.\n(Choice B) A firm can assert that it is GIPS compliant, but it cannot self-verify its assertion.\nA firm's chief compliance officer, or any other person who is part of the firm, is not allowed to\nperform the verification.\n(Choice C) Regulatory bodies are not involved in verifying GIPS compliance.\nThings to remember:\nCFA Institute recommends that firms verify their compliance with GIPS if they choose to claim\nthey are GIPS compliant. Verification must be performed by an independent third party.\nDescribe the concept of independent verification\nLOS", "qhtml": null}, {"n": 6, "q": "Which of the following best describes the need for high ethical standards in investment\nmanagement?", "opts": ["To preserve the trust that supports the industry", "To increase the prestige of working in the industry", "To establish consistency across global laws and regulations"], "ans": "A", "expl": "How a profession maintains trust\nEstablishes norms of practice\nRemains client focused\nMaintains high entry standards\nMonitors professional conduct\nNurtures a body of knowledge\nEncourages lifelong learning\nFunctions as an oversight body or\nregulatory adviser\nProtecting and serving clients is the foundation of the investment management profession ,\nand the relationship between the profession and its clients is predicated on trust . Clients\ntrust that investment professionals will carry out their duties with the utmost care, placing\nclients' interests above their own.\nThe industry:\nearns trust by establishing shared principles by which all members of the profession\nagree to live and\nmaintains trust by establishing minimum standards of care that ensure a culture of\nintegrity and competency in practice.\nThe investment profession benefits society by creating trust with all market participants.\n(Choice B) By adhering to high ethical standards, the profession builds trust with clients and\nsociety. Increasing the prestige of an individual is not a reason high ethical standards are\nneeded.\n(Choice C) Ethical codes are created to define and govern moral conduct. The investment\nprofession follows the CFA Institute Code of Ethics and Standards of Professional Conduct,\nwhich holds Members and Candidates to a higher standard than what is required by laws and\nregulations. Laws are unsuited to prevent unethical behavior since they are inconsistent\nacross sovereignties, slow to be enacted, and subject to compliance. Ethical behavior extends\nbeyond abiding by laws; it includes adhering to societal expectations of right and wrong.\nThings to remember:\nThe effectiveness of the investment management profession is based on trust. The profession\nmust build trust by requiring its members to agree to live and work by shared principles of\nintegrity. Professional trust is maintained by establishing ethical standards of care that ensure\nintegrity and competency.\ndescribe the need for high ethical standards in investment management\nLOS", "qhtml": null}, {"n": 7, "q": "Ishani Gupta works in the manufacturing industry and wants to transition into a financial\nservices role. She believes a CFA charter can help with this transition. Gupta recently sat for\nLevel III of the CFA exam and is excited to update her resume to send to potential employers,\nalthough she has not yet received her results. Which of the following statements can\nshe most appropriately use on her resume to adhere to the Standards?", "opts": ["\"The knowledge gained from the CFA program makes me a superior candidate.\"", "\"I will be eligible for a CFA charter after completing my required work experience.\"", "\"My studies in the CFA program have enhanced my knowledge and skills in finance.\""], "ans": "C", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA\ndesignation, or candidacy in the CFA Program, Members and Candidates must\nnot misrepresent or exaggerate the meaning or implications of membership in\nCFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program\nregulates how Members and Candidates may use the CFA designation. Stating objective\nfacts about the benefits of achieving the CFA designation or the intensity and rigor of the\nCFA program is allowed . This includes statements about knowledge and skills gained .\nHowever, the Standard forbids Members and Candidates from exaggerating the meaning or\nimplication of their CFA charters, such as declaring superior competency as an investment\nprofessional or suggesting charter holders are more qualified than non–charter\nholders (Choice A) .\n(Choice B) Gupta sat for the Level III exam but has not yet received her results. She does\nnot yet know if she passed, and therefore saying that she will be eligible for the charter after\ncompleting the required work experience is a violation of the Standard.\nThings to remember:\nStandard VII(B) forbids Members and Candidates from exaggerating the meaning or\nimplication of their CFA charters. Stating facts about the CFA designation and program is\nallowed, including statements about knowledge or skills gained. However, the Standard does\nnot allow statements that tie the CFA designation to an ability to achieve superior\nperformance.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 8, "q": "GIPS standards prevent firms from using misleading performance measurement practices such\nas presenting:", "opts": ["average returns that exclude terminated portfolios.", "fewer periods of returns than exist for an investment strategy.", "returns of investment strategies that consist of a single portfolio."], "ans": "A", "expl": "Common misleading performance reporting practices\nRepresentative Selecting top-performing portfolios to represent overall\naccounts results\nSurvivorship\nExcluding terminated portfolios from average performance\nbias\nVarying\nPresenting only selected periods of strong performance\ntime periods\nThe global standard for investment performance reporting known as GIPS (Global Investment\nPerformance Standards) provides a uniform approach for calculating and presenting historical\ninvestment performance. Without the GIPS standards, a firm's reporting of its investment\nperformance may be unreliable due to:\nselectively presenting top-performing portfolios to represent the firm's results for a given\nstrategy,\nexcluding portfolios that performed poorly and were terminated, or\npresenting returns for a period of strong performance while excluding periods of weaker\nperformance.\nGIPS require that firms include terminated client accounts, funds, and portfolios as part\nof the historical performance of a composite. This practice results in a more accurate\nrepresentation of a firm's complete performance. Excluding terminated portfolios that\nunderperformed results in overstating performance and leads to misleading reporting.\n(Choice B) GIPS standards prevent firms from selectively presenting performance periods by\nmandating a minimum number of consecutive years to present. If the strategy has existed for\nmore than the minimum number of required reporting years, firms are allowed to present\nfewer periods of historical performance than exist.\n(Choice C) Firms can present results of a single portfolio if it is the only one for a given\nstrategy.\nThings to remember:\nThe performance reporting standards known as GIPS (Global Investment Performance\nStandards) provide a uniform approach for presenting historical investment performance.\nGIPS require that firms include terminated portfolios as part of the historical performance of a\ncomposite.\nDescribe the key concepts of the GIPS standards for firms\nLOS", "qhtml": null}, {"n": 9, "q": "A client names a Member in a written complaint involving potential misconduct and files the\ncomplaint with the Member's firm. At a minimum , CFA Institute's Code and Standards require\nthat the Member:", "opts": ["self-disclose the incident on the annual Professional Conduct Statement.", "immediately disclose the incident to CFA Institute's Professional Conduct Program staff.", "self-disclose the incident on the annual Professional Conduct Statement only if the firm finds wrongdoing."], "ans": "A", "expl": "Professional conduct\nAll Members and Candidates must file an annual Professional Conduct\nStatement\nAny matter that questions professional conduct must be disclosed\nWritten complaints sent directly to CFA Institute Professional Conduct Program\nstaff can result in an investigation\nCFA Institute staff may also investigate if they become aware of questionable\nconduct\nThe CFA Institute Professional Conduct Program provides a framework for handling inquiries\nabout Members' and Candidates' professional conduct. The Professional Conduct Program\nstaff can initiate an inquiry based on either an external complaint or an internal investigation.\nThe staff works with the Disciplinary Review Committee to enforce the Code and Standards.\nMembers and Candidates are required to submit a completed Professional Conduct Statement\nannually. This statement is a pledge to adhere to the Code and Standards and the\nProfessional Conduct Program. It also provides an opportunity to self-disclose questionable\nbehavior.\nWhen a Member or Candidate receives a written complaint that questions his or her\nprofessional conduct, the complaint must be disclosed to Professional Conduct Program\nstaff. CFA Institute encourages disclosure at the time of the event, but at a minimum the\nmatter must be disclosed when filing the annual Professional Conduct Statement (Choice\nB) .\n(Choice C) Regardless of the outcome of any internal (ie, firm) investigation, the Member or\nCandidate must self-disclose the incident on the annual Professional Conduct Statement or\ndirectly to Professional Conduct Program staff.\nThings to remember:\nMembers and Candidates must disclose written complaints that question their professional\nconduct to Professional Conduct Program staff. At a minimum, disclosure should occur when\nfiling the annual Professional Conduct Statement.\nDescribe the structure of the CFA Institute Professional Conduct Program and the process for the\nenforcement of the Code and Standards\nLOS", "qhtml": null}, {"n": 10, "q": "A fixed income investment firm specializes in trading relative value opportunities among\ndomestic and international corporate bonds. One of the firm's clients does not want exposure\nto international securities, which hinders the implementation of the firm's strategy, so the firm\nmanages the client's portfolio by investing exclusively in domestic fixed income. According to\nGIPS standards, can the firm appropriately include the client's portfolio in its composites?", "opts": ["No", "Yes, since the client is still trading in fixed income", "Yes, since the firm has investment management responsibility for the portfolio"], "ans": "A", "expl": "GIPS requirements for portfolio inclusion\nAccount type Composites Firm assets\nFee-paying, discretionary Include Include\nNon–fee-paying, discretionary Include Include\nFee-paying, nondiscretionary Exclude Include\nNon–fee-paying, nondiscretionary Exclude Include\n(GIPS®)\nGlobal Investment Performance Standards comprise core principles that include:\nProper (broadest) definition of the firm\nNo misleading or false information\nAdherence to laws and regulations\nDelivery of GIPS reports to clients and prospects\nCompliance with GIPS standards requires firms to define discretion , based on who makes\ninvestment decisions for the portfolio:\nIn discretionary portfolios, the firm makes the investment decisions.\nIn nondiscretionary portfolios, the client makes the investment decisions.\nPortfolios defined as discretionary are the only portfolios included in a firm's composites.\nTherefore, the definition dictates whether a portfolio should be included or excluded from\ncomposites, which in turn affects the firm's reported performance.\nIn this scenario, since the client imposed a restriction on buying international bonds, the\nclient's portfolio does not follow the firm's strategy . As a result, the firm should classify\nthe portfolio as nondiscretionary and must not include it in any of the firm's composites.\n(Choices B and C) The client's portfolio invests exclusively in domestic fixed income, a\nspecialty of the firm. In addition, the firm has investment management responsibility for the\nportfolio. However, the portfolio does not represent the firm's strategy, so it cannot be\nincluded in any of the firm's composites.\nThings to remember:\nCompliance with GIPS standards requires firms to define discretion. A portfolio that does not\nrepresent the firm's strategy due to restrictions imposed by the client should be classified as\nnondiscretionary. Only discretionary portfolios can be included in the firm's composites and\naffect the reported performance.\nExplain the purpose of composites in performance reporting\nLOS", "qhtml": null}, {"n": 11, "q": "Marcos Silva, CFA, and Clara Neves, CFA, are analysts at Alpha Capital, an independent\nresearch firm. Silva reads a blog post about Northwest Bank that details several fresh insights\non company-specific growth. After doing his own thorough research on Northwest, Silva\nagrees with the blogger's analysis, although he expects this growth to take longer than the\nblogger predicts.\nSilva then writes a research report on Northwest and includes a restatement of the blogger's\ninsights. Since he has changed some of the wording and the expected time horizon for\ngrowth, he does not reference the blog.\nNeves proofreads the report at Silva's request and agrees with his conclusion about the bank.\nWith Silva's approval, Neves adds a chart from the US Federal Reserve, which is not\ncopyrighted, that shows expected growth in bank reserves over the next year. She properly\ncites the US Federal Reserve as the source. According to the Code and Standards:", "opts": ["both Silva and Neves have violated the Standards.", "Silva has violated the Standards, but Neves has not.", "Neves has violated the Standards, but Silva has not."], "ans": "B", "expl": "\"Members and Candidates must not knowingly make any misrepresentations relating\nto investment analysis, recommendations, actions, or other professional activities.\"\nStandard I(C) Misrepresentation protects investors against statements and information\nprovided by the investing community that may undermine investor trust in the integrity of the\nprofession. Misrepresentation can include:\nPlagiarism: quoting information without acknowledgment or citation of the source\nOmission: presenting incomplete information or data in order to mislead\nExaggeration: inflating professional credentials or performance results\nThe use of another's work without attribution is plagiarism , even if the work is not\nquoted verbatim from the original or slight changes have been made . Others' work can be\npresented to clients as long as the original source is clearly identified.\nIn this scenario, Marcos Silva restates an excerpt from a blog, changing only the time horizon\nof the expected growth while effectively copying important substance about the sources of\nthat growth. Silva does not make significant changes to the original author's work, nor does\nhe attribute the work to that author; this is plagiarism, and Silva has violated the\nStandard (Choice C) .\n(Choice A) Clara Neves includes a chart from the US Federal Reserve, which is not her\noriginal work. However, Neves does not commit plagiarism since the material is not\ncopyrighted, allowing it to be repurposed without permission, and she properly cites the\noriginal source; therefore, she has not violated the Standard.\nThings to remember:\nStandard I(C) protects investors against statements and information from the investing\ncommunity that may undermine investor trust in the integrity of the profession. Making only\nslight changes to another's work and failing to cite the source is considered plagiarism, which\nmisleads investors and is a violation of the Standard.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 12, "q": "Eric Saul, CFA, is a portfolio manager with Skye Group. He reads several social media posts\nfrom industry experts about the health benefits attributed to a new herbal tea made with rose\npetals. Based on these posts, Saul reviews industry publications and finds several articles that\nspeculate herbal rose tea will be the next big beverage craze. Saul visits a senior vice\npresident of Gamma Company, a conglomerate with a significant market share in the beverage\nindustry, who confirms that the market for herbal tea has considerable potential. After\nreviewing Gamma's financial statements and public disclosures, Saul uses industry-standard\nfinancial models to determine the intrinsic value of Gamma's stock. He concludes that Gamma\nwill introduce an herbal tea made with rose petals. Based on this conclusion, Saul buys\nGamma stock for all suitable client portfolios. A few weeks later, Gamma announces a new\nline of herbal rose tea. Did Saul most likely violate Standard II(A) Material Nonpublic\nInformation?", "opts": ["No", "Yes, by purchasing Gamma for clients", "Yes, by acting on information from company management"], "ans": "A", "expl": "\" Members and Candidates who possess material nonpublic\ninformation that could affect the value of an investment must not act\nor cause others to act on the information .\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates\nfrom trading on or recommending investments based on material nonpublic\ninformation . However, analysts may piece together public and nonmaterial nonpublic\ndata from multiple sources to form investment conclusions.\nThis research approach is referred to as the mosaic theory, and it recognizes that analysts\nform conclusions from various sources of information. Conclusions formed through the mosaic\nprocess, even when based on information that would be considered material and nonpublic if it\ncame directly from a reliable source (eg, the company), do not violate the Standard.\nIn this scenario, Eric Saul used public information, including social media posts, industry\npublications, and financial statements. His discussion at Gamma Company, although\nnonpublic, is not material since the senior vice president simply confirmed Saul's market\nresearch and indicated nothing about Gamma's intentions (Choice C) .\n(Choice B) Saul's purchase of Gamma did not violate the Standard since he did not use\nmaterial nonpublic information to reach his conclusion regarding Gamma. He also treated\nSkye's clients in an equitable manner by purchasing the stock for all suitable client portfolios.\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from trading\non or recommending investments based on material nonpublic information. Mosaic theory\nsuggests an approach that uses a combination of public and nonmaterial nonpublic information\nto arrive at investment conclusions that is not considered a violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 13, "q": "Aisha Nazari, CFA, manages a small-cap stock portfolio for Sanctuary Capital. As the portfolio\nhas grown, Nazari has noticed that trading costs are increasing due to low liquidity in small-\ncap stocks. To reduce these costs, she adds derivatives that mimic the returns of the small-\ncap stocks she invests in. Nazari updates the portfolio's information on Sanctuary's social\nmedia page, which is used for marketing to prospective clients. Existing clients can access the\nsocial media page, but it generally is not used to communicate with them. Nazari does not\nuse any other communication to tell existing clients about these changes. Nazari:", "opts": ["does not violate the Standards.", "violates the Standards by not communicating separately with existing clients.", "violates the Standards by using social media to communicate an investment strategy."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Disclose to clients and prospective clients the basic format and\ngeneral principles of the investment processes they use to\nanalyze investments, select securities, and construct portfolios\nand must promptly disclose any changes that might materially\naffect those processes.\n2. Disclose to clients and prospective clients significant limitations\nand risks associated with the investment process.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and\nCandidates to inform both clients and prospective clients about\nthe limitations and risks of an asset or investment process. The communications must use\nlanguage that is easy for clients to understand but that also conveys enough information for\nthem to recognize the relevant risks and limitations.\nFurther, any changes in the general characteristics of an asset or investment process (eg,\nstrategies, risks) also must be disclosed . Communications about changes allow clients to\ndecide whether the asset or process still aligns with their risk and return objectives after the\nchanges are made. The addition of derivatives to a portfolio changes its risk profile; this is\nimportant information for all clients to know.\nCommunicating investment details or changes in investment characteristics through social\nmedia is not a violation of Standard V(B) (Choice C) . However, if a social media platform is\nused, special care must be taken to ensure all clients receive the communications and are\ntreated fairly.\nIn this scenario, since Sanctuary Capital and Aisha Nazari do not generally use the company's\nsocial media page to communicate with existing clients, just updating that page is insufficient\ndisclosure of important information. Additional communication is needed to ensure all clients\nare aware of the change. Nazari violates the Standard by failing to provide the additional\ninformation (Choice A) .\nThings to remember:\nStandard V(B) requires Members and Candidates to inform both clients and prospective clients\nabout the limitations and risks of an investment asset. Any changes to the components, risks,\nor investment strategy of the asset must also be disclosed. If a social media platform is used,\nspecial care must be taken to ensure all clients receive the communications.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 14, "q": "A profession most likely establishes trust with members of the public by:", "opts": ["overseeing firms' robust compliance procedures.", "developing a pervasive culture of integrity among all professionals.", "working with regulators to create a highly regulated, protective environment."], "ans": "B", "expl": "How a profession maintains trust\nEstablishes norms of practice\nRemains client focused\nMaintains high entry standards\nMonitors professional conduct\nNurtures a body of knowledge\nEncourages lifelong learning\nFunctions as an oversight body or\nregulatory adviser\nTo establish and maintain trust and become respected and successful, a profession must build\ncredibility with the public. The profession:\nearns trust by establishing shared principles that all members of the profession agree\nto and live by.\nmaintains trust by establishing minimum standards of care that ensure a culture\nof integrity and competency in practice.\nThe investment profession benefits by creating trust with all market participants and end\nusers.\n(Choice A) Firm-level compliance oversight alone is insufficient for building trust with the\npublic. Employers' standards and practices are not necessarily consistent with those of the\nprofessional organization. For the investment profession, trust is built by putting clients'\ninterests first and nurtured through the collective ethical behavior of the industry's\nprofessionals, not by any individual firm's compliance.\n(Choice C) The global investment industry is highly regulated by various governments' rules\nand laws. However, the fact that an industry is highly regulated does not guarantee\ntrustworthy professional practice; it indicates only a high degree of compliance and/or\ngovernment oversight.\nThings to remember:\nTo become respected, a profession must build trust with the public by agreeing to live and\nwork by shared principles of integrity. Professional trust is maintained by establishing\nstandards of care that ensure integrity and competency. A profession does this most\neffectively through its own initiatives, not merely by operating in a highly regulated\nenvironment or relying only on firm compliance.\ndescribe professions and how they establish trust\nLOS", "qhtml": null}, {"n": 15, "q": "Zhao Fen, CFA, is an independent investor. She holds a large position of Formula Industries, a\nlightly traded stock with low liquidity, in one of her two personal accounts. If Zhao wishes to\nexit the position, which of the following would most likely violate the Standards?", "opts": ["Using an intermediary to sell the position outside of the market to avoid price impacts.", "Selling her holdings as one position, which would likely cause a large drop in the price.", "Trading the stock between personal accounts to attract interest from other market participants."], "ans": "C", "expl": "\"Members and Candidates must not engage in practices that distort\nprices or artificially inflate trading volume with the intent to mislead\nmarket participants.\"\nStandard II(B) Market Manipulation prohibits activities by Members or Candidates that\ndeceive market participants by distorting securities prices or volumes. Manipulation can\noccur through:\ninformation-based activities (eg, issuing false or misleading information) and/or\ntransaction-based activities (eg, exaggerated trading between two accounts).\nThe Standard does not prevent the use of legitimate trading strategies, even if they cause\nprice movements or are designed to purposefully limit the impact on the market. The key\nelement in determining whether the Standard is violated is intent: if the strategy is\nintended to deceive investors, it violates the Standard .\nIn this scenario, if Zhao Fen traded Formula Industries stock between her personal accounts, it\nwould give market participants a false impression of higher trading volume since the trading is\nnot done between unique market participants. Deceiving participants through transaction-\nbased manipulation violates the Standard.\n(Choice A) Using an intermediary (eg, block house) to sell the position outside the market or\nbreak the order into smaller batches is a legitimate trading strategy. This practice aims to\nreduce a sale's impact on the market, but the resulting trades are done with other market\nparticipants and therefore do not violate the Standard.\n(Choice B) While selling all the holdings in one position might drive down the price, Zhao\nmay do so without intending to manipulate market participants; therefore, it is not the action\nmost likely to violate the Standard. The Standards do not require Members or Candidates to\ndisadvantage themselves to uphold market integrity, so this strategy can be used if cash is\nneeded quickly.\nThings to remember:\nStandard II(B) prohibits activities by Members or Candidates that deceive market participants\nto distort securities prices or volumes. The Standard allows the use of legitimate trading\nstrategies, even if they impact security prices. The key element in determining whether the\nStandard is violated is intent.\nDemonstrate the application of the Code of Ethics and Standards of Professional Conduct to\nsituations involving issues of professional integrity\nLOS", "qhtml": null}, {"n": 16, "q": "Maya Levine, CFA, is a research analyst at a hedge fund. Levine covers the global alternative\nenergy industry and regularly uses an expert network to keep abreast of new developments.\nDuring a recent expert network call with a junior scientific researcher at an electric car\nmanufacturer, Levine asks about a new battery technology that was disclosed in the last\nearnings release. The researcher echoes the optimistic tone of the press release, suggesting\npossible commercial development within a short period, but also notes that the rare earth\nelements needed for commercial production are in short supply.\nBased on this conversation, Levine begins researching rare earth mining stocks that could\npotentially benefit from large-scale commercialization were the technology adopted. After\nconducting her research, Levine identifies and recommends the purchase for the hedge fund of\nan attractively valued rare earth mining company, believing that this new technology could\nprovide an upside to her valuation estimate.\nAccording to the Standard II(A) Material Nonpublic Information, Levine:", "opts": ["did not violate the Standard.", "violated the Standard by acting on material nonpublic information.", "violated the Standard by not reporting the receipt of material nonpublic information to her supervisor or compliance staff."], "ans": "A", "expl": "\"Members and Candidates who possess material nonpublic information that\ncould affect the value of an investment must not act or cause others to act on\nthe information.\"\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates\nfrom acting on or recommending investments based on material nonpublic information .\nHowever, analysts may piece together public and nonmaterial nonpublic data from\nmultiple sources to form an investment conclusion. This process is referred to as mosaic\ntheory . Recommendations based on mosaic theory do not violate the Standard since, rather\nthan rely on company insiders, the conclusions depend on the analyst's skill in synthesizing\ninformation from disparate sources.\nIn this scenario, the researcher reiterates the company's already publicly released statement\non the prospects and timeline for commercial development of a new battery technology, so no\nnonpublic information was disclosed. The researcher's comments regarding rare earth\nelements being in short supply might provide some additional nonmaterial information since it\ncan be reasonably assumed that the information is included in the company's publicly released\nforecasts or otherwise publicly available.\nTherefore, Maya Levine did not violate the Standard since she disclosed no material nonpublic\ninformation. Levine used this information in applying mosaic theory to assist with the\ninvestment thesis for the rare earth mining company (Choice B) .\n(Choice C) Although it is recommended that Members and Candidates report the receipt of\npotentially material nonpublic information to their supervisor or compliance staff, it is not\nrequired in all circumstances, and Members and Candidates are urged to exercise their own\njudgment, as appropriate.\nThings to remember:\nStandard II(A) Material Nonpublic Information prohibits Members and Candidates from acting\non or recommending investments based on material nonpublic information. However, using\nmosaic theory, an approach that combines public and nonmaterial nonpublic information to\narrive at investment conclusions, is not considered a violation of the Standard.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 17, "q": "Trevor Johnson, CFA, joins Pinnacle Advisors as an equity trader. Pinnacle uses Research\nMarket Brokers (RMB) for all trades from accounts that allow soft dollar arrangements and\nCost Cutter Brokers (CCB) for those that do not. RMB does not have the lowest execution\nprice but offers research used for the benefit of Pinnacle's clients. CCB offers the lowest price\nexecution available for Pinnacle. After a slow trading month, Pinnacle is below its soft dollar\ntrading commitment to RMB. RMB offers to temporarily lower the price of its trades to match\nCCB until the commitment is reached as long as all trades, including those on accounts that do\nnot allow soft dollar arrangements, are made through their brokerage. Based on the Code and\nStandards, Johnson:", "opts": ["can temporarily trade all accounts through RMB since it lowered its price.", "can only trade stocks through CCB for all accounts since it is usually the lowest-priced.", "cannot use trades for accounts that prohibit soft dollar arrangements to meet the commitment."], "ans": "A", "expl": "\" Members and Candidates have a duty of loyalty to their clients and must act with\nreasonable care and exercise prudent judgment. Members and Candidates must act\nfor the benefit of their clients and place their clients' interests before their employer's\nor their own interests.\"\nStandard III(A) Loyalty, Prudence, and Care requires Members and Candidates to seek best\nprice and best execution for client trades. \"Best price\" and \"best execution\" do not\nnecessarily mean the lowest trading commission, but commissions paid to brokers to execute\nthe trades must be commensurate with the value received.\nSoft dollar brokerage refers to the practice of using a portion of brokerage\ncommissions to purchase investment services (eg, research). Since the client \"pays\" the\ncommission out of client assets, these investment services are the property of the client, not\nthe investment management firm, and must be used to benefit the client. Typically, brokers\nthat offer value-added investment services charge higher commissions. Clients can choose\nnot to have their accounts traded on a soft dollar basis if they do not feel the value is worth\nthe cost.\nIn this scenario, Johnson does not violate the Standard even though he directs all account\ntrading to RMB. RMB reduced its commissions to match CCB's commissions; therefore, the\nclients that do not allow soft dollars are not paying extra to subsidize the research used by\nclients that allow soft dollars (Choice C) . When RMB raises its prices, Johnson must switch\naccounts that do not allow soft dollars back to CCB.\n(Choice B) Johnson is not required to trade through only CCB despite them having the\nlowest commissions since RMB adds value to Pinnacle's clients through the research they offer,\nso long as the research is used to benefit Pinnacle's clients.\nThings to remember:\nSoft dollar brokerage refers to the practice of using a portion of brokerage commissions to pay\nfor investment research. The research purchased through these agreements is considered an\nasset of the client, not the investment manager. Clients may opt out of trading with brokers\nwith higher commissions and soft dollar arrangements.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 18, "q": "A firm creating and maintaining GIPS-compliant composites is most likely required to:", "opts": ["assign portfolios to composites on an ex ante basis.", "ensure that each composite contains multiple portfolios.", "include every portfolio with a similar strategy in a composite."], "ans": "A", "expl": "A composite aggregates all a firm's portfolios that are managed according to a certain\ninvestment mandate, objective, or strategy. GIPS require that each fee-paying, discretionary\nportfolio must be included in at least one composite.\nThe decision to include a portfolio in a composite must be based on pre-established\ncriteria , referred to as ex ante , rather than ex post (ie, after the fact), criteria. This prevents\nmanagers from presenting only their best-performing portfolios in the composite. Including all\nsimilarly managed portfolios provides a complete representation of the firm's performance\nwith that strategy.\n(Choice B) Including only one portfolio in a composite is allowed if it is the firm's only\nportfolio using that investment mandate, objective, or strategy.\n(Choice C) A firm is required only to include fee-paying, discretionary portfolios in\ncomposites. Non–fee-paying portfolios that are discretionary also may be included. However,\nall nondiscretionary portfolios must be excluded since they reflect clients', not the firm's,\ndecisions and performance.\nThings to remember:\nA composite is an aggregate of one or more portfolios based on a specific investment\nmandate, objective, or strategy. The decision to include a portfolio in a composite must be\nbased on pre-established (ie, ex ante ) criteria.\nExplain the purpose of composites in performance reporting\nLOS", "qhtml": null}, {"n": 19, "q": "The fundamental purpose of the GIPS standards for firms is best described as:", "opts": ["fully, fairly, and ethically presenting a firm's investment performance.", "serving as the global regulatory source to address controversial performance reporting.", "setting a minimum threshold for composite performance reporting, verified by a third party."], "ans": "A", "expl": "(GIPS®)\nGlobal Investment Performance Standards are a standardized approach for\ninvestment performance presentation. GIPS standards are based on the ethical principle that\nfair representation and full disclosure of investment performance are critical to the integrity of\nthe capital markets and the investment profession. For firms , the fundamental purpose of\nGIPS compliance is to present investment performance fully , fairly , and ethically .\n(Choice B) CFA Institute is not a regulatory body. GIPS standards are a self-regulatory set\nof standards that lays out a framework for global performance reporting without attempting to\naddress every element (controversial or not) of performance reporting practices.\n(Choice C) The GIPS standards set a much higher bar than a minimum threshold for\ncomposite performance reporting. In addition, third-party verification is optional, although it\nis considered best practice.\nThings to remember:\nFor firms, the fundamental purpose of GIPS is to present investment performance fully, fairly,\nand ethically.\nExplain why the GIPS standards were created, who can claim compliance, and who benefits from\ncompliance\nLOS", "qhtml": null}, {"n": 20, "q": "For CFA Institute Members and Candidates, which of the following best describes an action\nthat violates the Code and Standards?", "opts": ["Delegating supervisory duties to subordinates who are not charterholders", "Accepting supervisory responsibility if the compliance system is inadequate", "Failing to detect violations despite instituting an effective compliance system"], "ans": "B", "expl": "\"Members and Candidates must make reasonable efforts to ensure\nthat anyone subject to their supervision or authority complies with\napplicable laws, rules, regulations, and the Code and Standards.\"\nStandard IV(C) Responsibilities of Supervisors requires Members and Candidates who\nsupervise employees to encourage behavior that complies with local laws, rules established by\ntheir firms, and the Code and Standards. They also must take reasonable steps to detect and\nprevent violations. A Member or Candidate who encounters an inadequate compliance\nsystem should bring the shortcomings of the system to the attention of the\ncompany's managers and make recommendations for corrective actions.\nAny Member or Candidate who is prevented from carrying out supervisory responsibilities due\nto these shortcomings should decline in writing to take on supervisory responsibility\nuntil the compliance system is fixed and is allowing for adequate controls. Accepting a\nsupervisory role when the compliance system is inadequate would not allow the Member or\nCandidate to promote compliance by subordinates and thus would violate the Standard.\n(Choice A) Under Standard IV(C), supervisors who supervise large numbers of employees\ncan delegate supervision. The employee to whom those supervisory responsibilities are\ndelegated does not have to be a CFA charterholder.\n(Choice C) Supervisors should make a reasonable effort to detect unethical behavior.\nHowever, failing to detect such behavior does not imply a violation of the Standard as long as\nthe supervisor ensures that a proper compliance system is in place. In such a case, the\nsystem may need to be reviewed.\nThings to remember:\nWhen Members or Candidates encounter an inadequate compliance system, they should bring\nthe shortcomings of the system to the attention of company managers and make\nrecommendations for corrective actions. Members and Candidates should decline in writing to\ntake on supervisory responsibility until the compliance system is fixed and is allowing for\nadequate controls.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 21, "q": "Hiroshi Tanaka, CFA, is a research analyst for Fuji Investments and covers the insurance\nsector. Due to client demand, Tanaka's manager asks him to initiate coverage on insurance\nbrokers. Tanaka owns stock in Union Insurance, the country's second-largest public insurance\nbroker, in a long-term investment account for his daughter's education. He cannot sell shares\nfrom the account since it is managed by a third party. Tanaka's wife is on the Union board of\ndirectors. To comply with the Code and Standards, Tanaka should most appropriately disclose\nto Fuji:", "opts": ["only his stock holdings in Union.", "only his wife's board position with Union.", "both his stock holdings and his wife's board position."], "ans": "C", "expl": "\"Members and Candidates must make full and fair disclosure of all\nmatters that could reasonably be expected to impair their\nindependence and objectivity or interfere with respective duties to\ntheir clients, prospective clients, and employer. Members and\nCandidates must ensure that such disclosures are prominent, are\ndelivered in plain language, and communicate the relevant\ninformation effectively . \"\nStandard VI(A) Disclosure of Conflicts aims to protect employers and clients by promoting\ntransparency, allowing them to evaluate whether a Member or Candidate is acting\nindependently and objectively when offering investment advice or recommendations. When\na conflict can be reasonably viewed as interfering with a Member's or Candidate's ability\nto conduct unbiased investment evaluations , the employer and clients must\nbe informed on all pertinent details of the conflict.\nFor employers, disclosure provides the opportunity to decide whether the Member's or\nCandidate's objectivity might be impaired and then take proper actions to limit or prevent\nconflicts of interest. Both financial and nonfinancial conflicts must be disclosed.\nIn this scenario, Hiroshi Tanaka's ownership of Union Insurance stock represents a conflict of\ninterest. Even though he cannot sell the stock, he still benefits from the capital appreciation;\nthus, the holdings must be disclosed to Fuji Investments. Tanaka's wife's position on the\nUnion board of directors represents a potential conflict of interest. Even though he is not on\nthe board, his wife's role gives him incentive to see Union succeed; thus, her position also\nmust be disclosed to Fuji (Choices A and B) .\nThings to remember:\nWhen a conflict can be reasonably viewed as interfering with a Member's or Candidate's ability\nto conduct unbiased investment evaluations, the employer and clients must be informed of the\nconflict. For employers, disclosure provides the opportunity to decide whether the Member's\nor Candidate's objectivity might be impaired and take proper actions to limit or prevent\nconflicts of interest.\nRecommend practices and procedures designed to prevent violations of the Code of Ethics and\nStandards of Professional Conduct\nLOS", "qhtml": null}, {"n": 22, "q": "Chang Xue, CFA, is hired as an associate research analyst by Phoenix Capital, where she helps\nher senior analyst in writing research reports. After several months, Chang notices that her\nsenior analyst receives material nonpublic information during discussions with management of\ncovered companies. She suspects this information is sometimes used to change the\nrecommendations on those companies, although the specific information is not disclosed in the\nresearch reports.\nActing on material nonpublic information is against the law in the country where Phoenix\noperates, but since the report does not disclose any material nonpublic information, Chang is\nnot sure what to do. She brings this up to Li Tengfei, the chief compliance officer for Phoenix.\nLi tells Chang that she would not be found guilty of breaking the law since no information is\ndisclosed in the report, so she should continue to assist in writing the reports. To best comply\nwith the Standards, Chang should:", "opts": ["dissociate from her role collecting data for her senior analyst.", "do nothing since she is not the person using material nonpublic information.", "do nothing since she received approval to continue from the firm's compliance officer."], "ans": "A", "expl": "\"Members and Candidates must understand and comply with\nall applicable laws, rules, and regulations (including the CFA\nInstitute Code of Ethics and Standards of Professional\nConduct) of any government, regulatory organization,\nlicensing agency, or professional association governing their\nprofessional activities. In the event of conflict, Members\nand Candidates must comply with the more strict law, rule,\nor regulation. Members and Candidates must not knowingly\nparticipate or assist in and must dissociate from any\nviolation of such laws, rules, or regulations.\"\nStandard I(A) Knowledge of the Law requires Members and Candidates to understand the laws\nof all countries where they reside and do business in order to know if their actions may\ncontribute to violations. If an action that a Member or Candidate assists with is believed to\nbe a violation , the Member or Candidate should notify a supervisor or the\nfirm's compliance department to stop the action. If the violation continues , the\nStandard requires the Member or Candidate to dissociate from the action.\nWhen there is doubt if an action is a violation, the Member or Candidate should seek\nadvice of legal counsel or compliance personnel . However, this advice does not\nabsolve the Member or Candidate from potential violations of the Standard if the action is\nillegal. Members and Candidates are still required to know local laws and report on or\ndissociate from violations, if necessary (Choice C) .\nIn this scenario, Chang has already brought the potential violation to the attention of the\nfirm's compliance department. Based on the Standard, Chang's next step should be to\ndissociate from the activity.\n(Choice B) Although Chang is not the person using material nonpublic information, she is\nstill required to report on or dissociate from violations, if necessary.\nThings to remember:\nStandard I(A) requires Members and Candidates to understand the laws of all countries where\nthey reside and do business. When in doubt about a possible violation, the Member or\nCandidate should seek advice of legal counsel or compliance personnel. Members and\nCandidates should first report a violation to a supervisor or compliance department; if the\nviolation continues, the Member or Candidate should dissociate from the activity.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 23, "q": "Himari Sato just got home from taking Level I of the CFA exam. She goes onto a popular\nonline forum and writes, \"Just got back from Level I. Definitely a hard exam, much harder\nthan I expected based on my studying, but I think I passed! However, I still disagree with CFA\nInstitute's policy of providing ranges for the weights of each subject on the exam. Just tell us\nwhat to expect! I studied way too hard for derivatives, but the number of questions was at\nthe bottom of the range. I wasted so much time on this.\" Sato violated the Standards by:", "opts": ["disagreeing with CFA Institute's exam policies.", "expressing an opinion on the difficulty of the exam.", "providing information about topics tested on the exam."], "ans": "C", "expl": "\"Members and Candidates must not engage in any conduct that compromises\nthe reputation or integrity of CFA Institute or the CFA designation or the\nintegrity, validity, or security of CFA Institute programs.\"\nStandard VII(A) Conduct as Participants in CFA Institute Programs mandates that Members\nand Candidates maintain the reputation, integrity, validity, and security of CFA Institute exams\nand programs. The Standard prohibits behavior that would compromise the public's\nconfidence in the level of merit needed to achieve a CFA charter.\nCandidates taking the exam must sign the Candidate Pledge, which identifies behaviors that\nare prohibited before, during, and after the
