ZaU/ARCVOAAAAHJLapPWlGt+LXY9WrQ8CtK+LK45rcl1VnSLblaVEmq/1th3wWg0uuaD2z7E43GX9LJvPKvkiuyFuNY+9oUpkUismaZ2KWjXt80Omj1XMBi0H9zKsoFAwDWu1KpjMN0GKw0IrZr7s7l6lh2ZnTu2/hNn28TjcRuo6ybm2BfWFhvuvZ7LpzYv4noF+e90bTlXKcW6PpBuELTLV6leBScUCtmlt+aUpUgk4t7D9q+duNpGslp3Jc4uc//e2lO4vd3oVeMSLa47Ze0Hjr0POzo66r7xUqmUfSL19/dXjUBw+2w749/nla6X2tyef8ar+61EIuF6O63epHeVI+nGMKzz/eZGytsjZLPZdY61cKlNl5arSnaWSiX3ee4mfvKXlNwSAABAA+nY20VMofW1lgmHw5sYyrDn+vv7XTKJU4ld5lJ6sVjMjViSr0e524D3J7SFZKdbIGiHJu5AVOKw/hXlmitOAvZcMBi0cowbfmtVjHK57NYII04CICpxAAAAIrekNqjE7U5rmW3XaGvXQ+3XN19SLpez6dYupeTvJQFoaylMBrQQLUENsqJcy6zwBWgX2366Tj82oKRqXT/KcABEJQ4AAEDkltQeo7ybtBIHaE9zS1aJq624UYMDIDoIAAAAiEocAAAA0RIAAADREgAAANESAAAA0RIAAADREgAAANESAAAAiJYAAACIlgAAAIiWAAAAiJYAAACIlgAAAIiWAAAAms7/D38nTya4G/t7AAAAAElFTkSuQmCC\" alt=\"exhibit\">A small country imposes a tariff on a popular imported consumer product, and an analyst\ngraphs domestic supply and demand curves for the import.\nAll else equal, and based only on the analyst's image, most likely :"},{"n":41,"q":"Due to a drop in demand for its product during a recession, a firm is selling at a price below\naverage variable cost. Of the following, the most appropriate profit-maximizing strategy for\nthe firm is to:","opts":["exit the business.","continue to operate.","temporarily cease production."],"ans":"C","expl":"Các công ty kiếm được lợi nhuận kinh tế khi bán theo đơn giá ( P ) lớn hơn tổng chi phí trung bình\n(ATC). Tuy nhiên, đôi khi, các điều kiện thị trường dẫn đến P < ATC và các công ty phải gánh chịu những tổn thất kinh tế\n . Trong trường hợp này, hành động tối đa hóa lợi nhuận/giảm thiểu tổn thất phụ thuộc vào việc\nmức giá tương đối thấp được xem là điều kiện ngắn hạn hay dài hạn. Ba hướng hành động\nlà:\ntiếp tục hoạt động,\ntạm thời ngừng hoạt động hoặc\nthoát khỏi thị trường.\nTrong trường hợp này, tạm thời ngừng hoạt động là điều tối ưu vì mức giá tương đối thấp có thể\nlà một tình trạng ngắn hạn (tức là suy thoái). Với P < AVC (chi phí biến đổi trung bình), mỗi đơn vị được bán\nlàm tăng tổn thất của công ty, do đó, hành động tốt nhất là ngừng hoạt động cho đến khi P ≥ AVC.\nNgay cả khi P < ATC trong ngắn hạn, miễn là P ≥ AVC , công ty vẫn tiếp tục hoạt động , vì\nmỗi đơn vị được bán góp phần bù đắp một phần chi phí cố định (Lựa chọn B) .\nTrong khi các quyết định ngắn hạn giữa việc tiếp tục hoạt động hay ngừng hoạt động phụ thuộc\nvào P so với AVC, thì lựa chọn dài hạn tối ưu lại phụ thuộc vào P so với ATC. P < ATC (tức là\ntổng doanh thu < tổng chi phí) có nghĩa là một công ty đang tích lũy tổn thất kinh tế. Nếu điều kiện này\ndự kiến ​​sẽ tiếp tục tồn tại, ngay cả khi P ≥ AVC (tức là tổng doanh thu ≥ chi phí biến đổi), thì tổn thất sẽ\ntích lũy theo thời gian và công ty sẽ không thể duy trì khả năng thanh toán tài chính; kết quả là nó\nsẽ rời khỏi thị trường (Lựa chọn C) . Những cân nhắc này áp dụng cho tất cả các cấu trúc thị trường.\nNhững điều cần nhớ:\nNếu P < ATC và đây được xem là điều kiện ngắn hạn, các công ty có hai lựa chọn thay thế: tiếp tục\nhoạt động hoặc tạm thời đóng cửa cho đến khi giá có thể tăng. Khi P < AVC, các công ty nên\ntạm thời đóng cửa.\nXác định và giải thích các điểm hòa vốn và điểm ngừng sản xuất, cũng như mức độ kinh tế\nvà tính phi kinh tế theo quy mô ảnh hưởng đến chi phí trong điều kiện cạnh tranh hoàn hảo và không hoàn hảo\nLOS","qhtml":null},{"n":42,"q":"An analyst wants to know if a company has decreased its risk of defaulting on its long-term\nobligations. An increase in which of the following measures is the most appropriate indicator?","opts":["Cash ratio","Interest coverage ratio","Financial leverage ratio"],"ans":"B","expl":"Tỷ lệ khả năng thanh toán—cả tỷ lệ khả năng thanh toán và tỷ lệ nợ—được các nhà phân tích sử dụng cùng với các số liệu khác\nđể xác định rủi ro các công ty không trả được nợ dài hạn. Các tỷ lệ này thường\ndùng để so sánh một công ty với các công ty cùng ngành hoặc quan sát xu hướng của công ty theo thời gian.\nTỷ lệ thanh toán lãi vay đo lường khả năng của công ty trong việc trang trải các khoản thanh toán lãi suất định kỳ\nbằng thu nhập được tạo ra từ hoạt động. Vì EBIT là tử số nên tỷ lệ\ncao hơn cho thấy rằng một công ty có thu nhập hoạt động cao hơn để trang trải các khoản thanh toán và\ndo đó giảm rủi ro vỡ nợ đối với các nghĩa vụ dài hạn của mình.\n(Lựa chọn A) Tỷ lệ tiền mặt là tỷ lệ thanh khoản, đo lường khả năng của công ty trong việc trang trải các nghĩa vụ\nngắn hạn, không phải dài hạn.\n(Lựa chọn C) Tỷ lệ đòn bẩy tài chính, tỷ lệ nợ, đo lường số lượng tài sản\ncủa công ty so với vốn chủ sở hữu của nó. Tỷ lệ tài sản trên vốn chủ sở hữu cao hơn cho thấy rằng nhiều tài sản\ncủa công ty được tài trợ bằng nợ, do đó, mức tăng sẽ cho thấy rủi ro vỡ nợ cao hơn.\nNhững điều cần nhớ:\nCác tỷ lệ khả năng thanh toán được các nhà phân tích sử dụng để xác định rủi ro vỡ nợ của một công ty đối với các nghĩa vụ\ndài hạn. Tỷ lệ thanh toán lãi suất đo lường khả năng của một công ty trong việc trang trải các khoản thanh toán lãi\nđịnh kỳ bằng thu nhập được tạo ra từ hoạt động. Tỷ lệ cao hơn cho thấy\nrủi ro vỡ nợ giảm.\nTính toán và giải thích các tỷ lệ hoạt động, thanh khoản, khả năng thanh toán và khả năng sinh lời\nLOS","qhtml":null},{"n":43,"q":"A machine learning model treats noise in a training data set as valid parameters and\nsubsequently fails when applied in reality. This outcome is most likely a result of:","opts":["overfitting.","using structured data.","using unstructured data."],"ans":"A","expl":"Các lỗi tiềm ẩn trong quá trình học máy\nXử lý các tham số không đáng kể là tham số quan trọng\nOverfit\nKết quả từ phân tích quá chính xác\nXử lý các tham số quan trọng như các tham số không đáng kể\nKhông phù hợp\nKết quả từ phân tích quá đơn giản\nHọc máy (ML) sử dụng thuật toán để xác định các mẫu và mối quan hệ từ\ndữ liệu huấn luyện (tức là dữ liệu đầu vào) để dự đoán kết quả cho các tập dữ liệu khác. Sau khi xác định được một mẫu\ntrong dữ liệu huấn luyện, mẫu đó sẽ được xác thực và kiểm tra trước khi áp dụng cho dữ liệu thực.\nCác nhà phân tích nên lưu ý các lỗi phát sinh từ việc trang bị quá mức hoặc không phù hợp dữ liệu huấn luyện\ntrong quá trình học. Quá khớp xảy ra khi thuật toán xác định các mối quan hệ hoặc mẫu\ngiả (tức là nhiễu) là đáng kể và dẫn đến việc xác định các mối quan hệ\nkhông hợp lệ khi áp dụng bên ngoài dữ liệu huấn luyện.\nViệc khớp quá mức xảy ra khi thuật toán đặt trọng số quá nhỏ lên các tham số hợp lệ và xử lý\nchúng như thể chúng là nhiễu. Việc phân tích dữ liệu quá đơn giản này dẫn đến các mối quan hệ hoặc mẫu\nquan trọng chưa được khám phá, dẫn đến lỗi dự đoán trong tương lai.\n(Lựa chọn B và C) Dữ liệu có cấu trúc và không cấu trúc là các phân loại của dữ liệu lớn, không phải lỗi mô hình ML\n. Dữ liệu có cấu trúc đề cập đến dữ liệu có thể được lưu trữ dễ dàng trong cơ sở dữ liệu, chẳng hạn như\ngiá cổ phiếu lịch sử, thu nhập của công ty hoặc thống kê kinh tế. Dữ liệu phi cấu trúc phần lớn\nbao gồm các nguồn dữ liệu thay thế như bài đăng trên mạng xã hội và thông tin giao dịch\ntừ sổ đăng ký điểm bán hàng trong các cửa hàng bán lẻ.\nNhững điều cần nhớ:\nHọc máy sử dụng thuật toán để xác định các mẫu và mối quan hệ trong dữ liệu huấn luyện để sau đó\ndự đoán kết quả cho các tập dữ liệu khác. Quá khớp xảy ra khi thuật toán nhầm nhiễu\nvới dữ liệu hợp lệ và xác định các mối quan hệ hoặc mẫu giả là quan trọng; việc trang bị thiếu\nxảy ra khi thuật toán bỏ qua dữ liệu hợp lệ và do đó không xác định được các mẫu quan trọng hoặc các mối quan hệ\n. Cả hai lỗi đều dẫn đến lỗi dự đoán.\nMô tả Dữ liệu lớn, trí tuệ nhân tạo và học máy\nLOS","qhtml":null},{"n":44,"q":"The following data is for a firm operating under perfect competition:\nQuantity produced Total economic cost (€)\n100 510\n101 511\n102 513\n103 516\n104 520\n105 525\n106 531\nIf the price per unit is €5, economic profits are maximized when the firm produces:","opts":["104 units.","105 units.","106 units."],"ans":"B","expl":"Trong cạnh tranh hoàn hảo, các công ty phải đối mặt với một đường cầu nằm ngang với giá thị trường bằng\ndoanh thu biên. Mức sản lượng tối đa hóa lợi nhuận kinh tế cũng là mức hòa vốn\nkinh tế, trong đó doanh thu cận biên (MR) bằng chi phí biên (MC) và tổng chi phí\ntrung bình (ATC): MR = MC = ATC. Tại thời điểm đó, việc sản xuất:\ncác đơn vị bổ sung sẽ dẫn đến tổn thất kinh tế, trong đó MR < MC và ATC và\nít đơn vị hơn sẽ dẫn đến mất lợi nhuận, trong đó MR > MC.\nTrong trường hợp này, lợi nhuận đạt tối đa 105 đơn vị, điểm mà tại đó MR trên mỗi đơn vị (tức là giá thị trường €5),\nMC và ATC đều bằng bằng nhau.\nDữ liệu sản xuất với đơn giá €5\nSố lượng sản xuất Tổng chi phí MC trên mỗi đơn vị MR trên mỗi đơn vị ATC trên mỗi đơn vị\n100 510 − 5 5,10\n101 511 1 5 5,07\n102 513 2 5 5.03\n103 516 3 5 5.01\n104 520 4 5 5.00\n105 525 5 5 5.00\n106 531 6 5 5.03\nLưu ý: Mặc dù điều này câu hỏi đặc biệt đề cập đến cạnh tranh hoàn hảo, điều kiện các công ty\ntối đa hóa lợi nhuận khi MR = MC áp dụng cho tất cả các cấu trúc thị trường.\n(Lựa chọn A) Tại 104 đơn vị sản xuất, ATC trên mỗi đơn vị giống như đối với 105 đơn vị (€5,00).\nTuy nhiên, MC (€4) nhỏ hơn MR (€5) và vẫn đang tăng nên công ty vẫn chưa đạt mức tối đa\nlợi nhuận kinh tế.\n(Lựa chọn C) Ở 106 đơn vị sản xuất, cả MC (€6) và ATC (€5,03) đều lớn hơn MR (€5),\nnên việc sản xuất đơn vị thứ 106 sẽ dẫn đến tổn thất kinh tế.\nNhững điều cần nhớ:\nTrong một thị trường cạnh tranh hoàn hảo, lợi nhuận kinh tế được tối đa hóa khi doanh thu cận biên\nbằng chi phí cận biên và chi phí cận biên bằng tổng chi phí trung bình.\nGiải thích mối quan hệ cung cầu trong cạnh tranh độc quyền, bao gồm cả\ngiá và sản lượng tối ưu cho doanh nghiệp cũng như chiến lược định giá - LOS","qhtml":null},{"n":45,"q":"A retail analyst gathers a company's current-year financial results in order to forecast next\nyear's results.\n(in € millions) Current Year (actual)\nRevenue 200.00\nCOGS 80.00\nGross Profit 120.00\nSG&A 90.00\nEBIT 30.00\nThe analyst assumes that next year:\nVolume will contribute 5% to sales growth.\nPrice / mix will contribute 4% to sales growth.\nCOGS as a percentage of revenue will increase by 2 percentage points from the current\nyear.\nSG&A as a percentage of revenue will increase by 1 percentage point from the current\nyear.\nBased on this information, the analyst's most appropriate forecast is that:","opts":["EBIT will decrease by 12.64%.","gross profit will be €116 million.","organic revenue growth will be 9.00%."],"ans":"A","expl":"Mô hình tài chính chiếu lệ dựa trên doanh số dựa trên doanh thu dự báo, dựa trên\nmức tăng trưởng khối lượng và mức tăng giá dự kiến. Trong kịch bản này, tổng mức tăng trưởng doanh thu là 9,2% [=\n(1,05)(1,04) − 1] và dự báo doanh thu cho năm tới là 218,40 triệu euro.\nSau khi dự báo doanh thu, các nhà phân tích thường dự báo chi phí (ví dụ: COGS và SG&A) dựa trên\ntheo tỷ lệ phần trăm doanh thu . Điều quan trọng trước tiên là tính toán phần trăm chi phí\ncủa năm hiện tại và sử dụng chúng làm cơ sở để điều chỉnh khi dự báo\nchi phí cho năm tới.\nTrong trường hợp này, giá vốn hàng bán của năm hiện tại là 40% doanh thu, do đó, mức tăng 2% sẽ dẫn đến\n42% cho năm tới. SG&A năm nay là 45% doanh thu; mức tăng 1% mang lại 46%\ncho năm tới. Sau khi áp dụng tỷ lệ phần trăm chi phí của năm tới vào doanh thu của năm tới,\nEBIT cuối kỳ là 26,21 triệu euro. Do đó, EBIT của năm tới tương đương với mức giảm 12,64% [= (26,21 /\n30) − 1] so với cùng kỳ năm trước. Mức giảm này chủ yếu là do chi phí tăng\nnhiều hơn doanh thu.\n(Lựa chọn B) Lợi nhuận gộp dự báo là 116 triệu euro là kết quả của việc nhân\ndoanh thu của năm hiện tại với tỷ lệ phần trăm giá vốn hàng bán của năm tới không chính xác.\n(Lựa chọn C) Tăng trưởng doanh thu hữu cơ là 9,00% giả định phép tính đơn giản. Doanh thu hữu cơ\ntăng trưởng theo cấp số nhân [(1,05)(1,04) − 1 = 0,092 hoặc 9,2%.\nNhững điều cần nhớ:\nTrong mô hình tài chính chiếu lệ dựa trên doanh số, doanh thu được dự báo bằng cách sử dụng các giả định về\ntăng trưởng khối lượng và thay đổi về giá. Sau khi dự báo doanh thu, các nhà phân tích thường dự báo\nchi phí dựa trên phần trăm doanh thu.\nThể hiện sự phát triển của mô hình công ty theo quy ước dựa trên doanh số\nLOS","qhtml":null},{"n":46,"q":"A mutual fund contains 250 constituent companies.\n12% of the companies are categorized as healthcare stocks.\n16% of the companies are categorized as small-cap stocks.\n4% of the companies are categorized as both healthcare and small-cap stocks.\nIf the categories are not mutually exclusive, then the probability that any constituent company\nis a healthcare or small-cap stock is closest to:","opts":["24.0%","26.1%","28.0%"],"ans":"A","expl":"Đối với các sự kiện không loại trừ lẫn nhau, xác suất xảy ra ít nhất một sự kiện\nbằng tổng xác suất của các sự kiện riêng lẻ trừ đi xác suất chung của chúng\nxác suất (tức là P ( A và B )). Xác suất chung để cổ phiếu này vừa là cổ phiếu chăm sóc sức khỏe\nvà cổ phiếu vốn hóa nhỏ được thể hiện ở vùng chồng chéo trong biểu đồ bên dưới. Vì\nvùng chồng chéo này chia sẻ kết quả với Sự kiện A và Sự kiện B , nên P ( A và B ) phải được trừ\nkhỏi tổng xác suất riêng lẻ của chúng để tránh tính hai lần.\n(Lựa chọn B) 26,1% là kết quả của việc trừ tích của P ( A ) và P ( B ) khỏi tổng\ncủa P ( A ) và P ( B ). Không thể tính xác suất chung của hai sự kiện P ( A và B ) bằng cách\nnhân xác suất của hai sự kiện trong một kịch bản không loại trừ lẫn nhau.\n(Lựa chọn C) 28,0% là do không trừ P ( A và B ) khỏi tổng của P ( A ) và P ( B ).\nNhững điều cần nhớ:\nĐối với các sự kiện không loại trừ lẫn nhau, xác suất xảy ra ít nhất một sự kiện\nbằng tổng xác suất của các sự kiện riêng lẻ trừ đi xác suất chung của chúng.\nXây dựng bài toán đầu tư dưới dạng cây xác suất và giải thích việc sử dụng các kỳ vọng\ncó điều kiện trong ứng dụng đầu tư\nLOS","qhtml":null},{"n":47,"q":"A company reports net income of CNY 250 million and weighted average shares outstanding of\n100 million for its fiscal year. The company also has convertible bonds outstanding with a par\nvalue of CNY 120 million. The bonds pay a 10% coupon and are convertible into a total of 10\nmillion shares of common stock. If the company's tax rate is 25%, then its diluted earnings\nper share (in CNY) are closest to:","opts":["2.27","2.30","2.35"],"ans":"C","expl":"Các công ty báo cáo thu nhập suy giảm trên mỗi cổ phiếu (EPS) để cho thấy tác động tiềm ẩn của chứng khoán\n suy giảm đối với giá trị cổ phiếu. EPS pha loãng cho biết EPS của một công ty lẽ ra là bao nhiêu\ntất cả chứng khoán có khả năng suy giảm của công ty đã được chuyển đổi thành cổ phiếu phổ thông .\nPhương pháp if-converted giả định rằng chuyển đổi xảy ra vào đầu năm.\nKhi chứng khoán có khả năng suy giảm được chuyển đổi để tính EPS pha loãng,\nsố lượng cổ phiếu phổ thông đang lưu hành của công ty sẽ tăng lên và các chi phí liên quan đối với những chứng khoán hiện-\nđã chuyển đổi (ví dụ: cổ tức ưu đãi, lãi trái phiếu) được cộng lại vào thu nhập ròng\ncó sẵn cho các cổ đông phổ thông.\nTrong trường hợp này, nếu công ty đã chuyển đổi trái phiếu chuyển đổi thành cổ phiếu phổ thông vào\nđầu kỳ, EPS của nó sẽ là 2,35 CNY. Vì công ty sẽ không\ntrả chi phí lãi vay sau thuế 9 triệu CNY, số tiền này sẽ được cộng trở lại vào thu nhập ròng ở\ntử số. Nó cũng sẽ phát hành 10 triệu cổ phiếu phổ thông mới, làm tăng\ncổ phiếu bình quân gia quyền đang lưu hành ở mẫu số.\nSố liệu tính bằng triệu CNY (ngoại trừ EPS) EPS cơ bản EPS pha loãng\nThu nhập ròng 250 250\n+ Chi phí lãi vay sau thuế (có thể chuyển đổi\n- 9\ntrái phiếu)\nTử số 250 259\nSố lượng cổ phiếu phổ thông đang lưu hành 100 100\n+ Số cổ phiếu mới từ chuyển đổi nợ - 10\nMẫu số 100 110\nEPS 250 / 100 = 2,50 259 / 110 = 2,35\nLưu ý: Chi phí lãi vay sau thuế = 120 khoản nợ chuyển đổi × lãi suất 10% × (1 −\nthuế suất 25%) = 9.\n(Lựa chọn A) EPS tính toán là 2,27 sẽ là kết quả của việc thêm 10 triệu trái phiếu chuyển đổi\ncổ phiếu vào cổ phiếu của công ty tổng số cổ phiếu đang lưu hành nhưng không cộng tiền lãi trả trên\ntrái phiếu chuyển đổi vào thu nhập ròng.\n(Lựa chọn B) EPS tính toán là 2,30 sẽ là kết quả của việc cộng thuế trả trên lãi trái phiếu chuyển đổi\n(tức là 3 triệu CNY) vào thu nhập ròng thay vì số tiền sau thuế.\nNhững điều cần nhớ:\nSử dụng Theo phương pháp nếu được chuyển đổi, thu nhập suy giảm trên mỗi cổ phiếu (EPS) được tính toán với giả định rằng\nviệc chuyển đổi chứng khoán có khả năng suy giảm xảy ra vào đầu năm. Đối với\ncác công ty có nợ chuyển đổi, EPS pha loãng được tính bằng cách cộng lại chi phí lãi vay sau thuế\nvào thu nhập ròng và thêm cổ phiếu phổ thông mới từ chuyển đổi thành cổ phiếu phổ thông mới\ncổ phiếu đang lưu hành bình quân gia quyền.\nMô tả cách tính thu nhập trên mỗi cổ phiếu, tính toán và diễn giải thu nhập cơ bản và\nbị pha loãng trên mỗi cổ phiếu của một công ty đối với các công ty có cấu trúc vốn đơn giản và phức tạp bao gồm\nnhững người có chứng khoán có tính suy giảm suy giảm\nLOS","qhtml":null},{"n":48,"q":"Which of the following reporting practices is most likely considered aggressive accounting?","opts":["Presenting pro forma earnings per share (EPS) that are lower than reported EPS.","Capitalizing, instead of expensing, in-process research and development (R&D) costs.","Using the criteria of available-for-sale securities, rather than trading securities, to treat bond investment gains."],"ans":"B","expl":"Kế toán linh hoạt và kế toán thận trọng\nBảo thủ hung hăng\nChi phí vốn hóa Chi phí chi phí\nPhân loại các khoản đầu tư Phân loại các khoản đầu tư\nchứng khoán kinh doanh chứng khoán sẵn sàng để bán\nTrình bày kết quả theo quy trình tốt hơn Trình bày kết quả theo quy trình\nkết quả cao hơn kết quả IFRS hoặc GAAP gần với kết quả IFRS hoặc GAAP\nCác lựa chọn kế toán ảnh hưởng đến chất lượng tài chính của công ty\nkết quả. Các lựa chọn kế toán linh hoạt có xu hướng làm tăng hiệu quả tài chính (ví dụ: thu nhập, dòng tiền)\ntrong giai đoạn hiện tại nhưng có thể đánh giá thấp hiệu quả hoạt động trong giai đoạn tương lai . Lựa chọn bảo thủ\nthường đánh giá thấp hiệu suất trong giai đoạn hiện tại nhưng có thể nâng cao hiệu suất trong tương lai.\nTận dụng (thay vì chi tiêu) chi phí nghiên cứu và phát triển (R&D) trong quá trình báo cáo\nkỳ sẽ ấn định những chi phí đó cho một tài sản trên bảng cân đối kế toán. Sau đó chúng được khấu hao định kỳ như một\nchi phí trên báo cáo thu nhập. Việc vốn hóa chi phí sẽ tạo ra:\nthu nhập ròng cao hơn trong giai đoạn hiện tại vì toàn bộ chi phí không được ghi vào chi phí ngay lập tức mà\nthu nhập ròng thấp hơn trong các giai đoạn tương lai vì chi phí còn lại được tính vào chi phí theo thời gian.\nVì vậy, vốn hóa là một lựa chọn kế toán tích cực. Chi phí R&D nên\nchỉ được vốn hóa khi sản phẩm đó chắc chắn sẽ tạo ra doanh thu trong tương lai và không\ncòn được coi là đang trong quá trình.\n(Lựa chọn A) Thu nhập theo quy định thường bao gồm nhiều điều chỉnh quản lý (tức là các khoản bổ sung)\nkhiến chúng khác với thu nhập được báo cáo (tức là thu nhập theo GAAP hoặc IFRS). Nói chung,\nban quản lý trình bày thu nhập theo quy định cao hơn thu nhập được báo cáo và do đó\nđược coi là hung hăng.\n(Lựa chọn C) Khi các khoản đầu tư trái phiếu được coi là chứng khoán sẵn sàng để bán, mọi khoản lãi về giá trị hợp lý\nđược tính vào thu nhập toàn diện khác trên bảng cân đối kế toán thay vì ghi thẳng vào thu nhập ròng\n(thu nhập). Vì vậy, điều trị này là một sự lựa chọn thận trọng.\nNhững điều cần nhớ:\nCác lựa chọn kế toán linh hoạt có xu hướng làm tăng hiệu quả tài chính (ví dụ: thu nhập, dòng tiền) trong\nkỳ hiện tại nhưng có thể đánh giá thấp hiệu quả hoạt động trong các giai đoạn tương lai. Lựa chọn kế toán thận trọng\nthường đánh giá thấp hiệu suất trong giai đoạn hiện tại nhưng có thể nâng cao hiệu suất trong tương lai.\nTận dụng chi phí nghiên cứu và phát triển trong quá trình được coi là một lựa chọn kế toán tích cực.\nGiải thích sự khác biệt giữa kế toán thận trọng và tích cực\nLOS","qhtml":null},{"n":49,"q":"If a central bank wants to increase the money supply, the most appropriate action it can take\nis to:","opts":["increase the policy rate.","reduce the reserve requirements.","sell government bonds to commercial banks."],"ans":"B","expl":"Công cụ chính sách tiền tệ\nCông cụ Mô tả Thu hẹp mở rộng\nThị trường mở Giao dịch chứng khoán (thường là chính phủ Mua\nBán chứng khoán\nchứng khoán hoạt động) chứng khoán\nLãi suất chính sách Đặt lãi suất dùng để báo hiệu thị trường Giảm Tăng\nĐặt tỷ lệ phần trăm tiền gửi ngân hàng được giữ trong\nYêu cầu dự trữ Giảm Tăng\ndự trữ\nTrong hệ thống ngân hàng dự trữ phân đoạn, yêu cầu dự trữ là một công cụ chính sách được\nngân hàng trung ương sử dụng để kiểm soát nguồn cung tiền, từ đó kiểm soát chi tiêu và tăng trưởng kinh tế.\nYêu cầu dự trữ đặt ra tỷ lệ phần trăm tối thiểu các khoản nợ tiền gửi của ngân hàng thương mại\nphải được giữ dưới dạng dự trữ; các ngân hàng cho vay với số tiền gửi vượt mức.\nViệc giảm yêu cầu dự trữ bắt buộc đối với các ngân hàng thương mại cho phép các ngân hàng đó cho vay\nnhiều tiền hơn . Về lý thuyết, điều này sẽ làm tăng cung tiền vì số tiền bổ sung\nđược ngân hàng cho vay có thể được gửi và cho vay nhiều lần.\nDo đó, có mối quan hệ nghịch đảo giữa yêu cầu dự trữ và số tiền\nđược tạo ra, như được phản ánh bởi hệ số nhân tiền. Tất cả các yếu tố khác đều bằng nhau,\nyêu cầu dự trữ càng nhỏ thì:\nhệ số nhân tiền càng lớn (nhỏ) và\nngân hàng dự trữ một phần tạo ra càng nhiều (ít) tiền và\ncung tiền càng lớn (nhỏ).\n(Lựa chọn A) Việc tăng lãi suất chính sách khiến cho việc vay ngắn hạn trở nên khó khăn hơn từ ngân hàng\ntrung ương đắt hơn đối với các ngân hàng thương mại. Điều này thường khiến các ngân hàng thương mại\ntăng lãi suất cho vay, làm giảm nhu cầu vay và giảm nguồn cung tiền\n.\n(Lựa chọn C) Bán chứng khoán cho các ngân hàng thương mại làm giảm dự trữ của ngân hàng thương mại\nvà thường khiến họ ít sẵn sàng và/hoặc có khả năng cho vay hơn, điều này làm giảm nguồn cung tiền\n.\nNhững điều cần nhớ:\nViệc giảm yêu cầu dự trữ bắt buộc đối với các ngân hàng thương mại cho phép các ngân hàng đó cho vay nhiều hơn\ntiền. Về lý thuyết, điều này sẽ làm tăng cung tiền vì số tiền bổ sung được ngân hàng cho vay\ncó thể được gửi và cho vay nhiều lần. Do đó, có một mối quan hệ nghịch đảo\ngiữa yêu cầu dự trữ và lượng tiền được tạo ra.\nMô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế,\nlạm phát, lãi suất và tỷ giá hối đoái\nLOS","qhtml":null},{"n":50,"q":"In the short term, for a firm operating under perfect competition, the most appropriate point\nfor a shutdown is when:","opts":["marginal cost falls below average total cost.","market price falls below average variable cost.","average total cost equals average variable cost."],"ans":"B","expl":"Từ góc độ kinh tế, một công ty hòa vốn khi tổng doanh thu bằng tổng kinh tế\nchi phí và lợi nhuận kinh tế bằng 0, hoặc (trên mỗi đơn vị) khi doanh thu bình quân bằng tổng bình quân\nchi phí (ATC). Tổng chi phí bao gồm cả chi phí cố định và chi phí biến đổi. Doanh thu cận biên (MR) là\ndoanh thu tăng thêm được tạo ra từ việc bán thêm một đơn vị và chi phí cận biên (MC) là\nchi phí để sản xuất thêm một đơn vị.\nVới sự cạnh tranh hoàn hảo, hãng có đường cầu nằm ngang và do đó MR và\ndoanh thu trung bình đều bằng giá thị trường. Điểm hòa vốn khi MR = ATC\n= MC; tại thời điểm này, MR \"bao gồm\" ATC, bao gồm chi phí cố định và biến đổi.\nTrong ngắn hạn, chi phí cố định là chi phí chìm vì chi phí cố định không phụ thuộc vào số lượng\nđược sản xuất. Nếu giá giảm đến mức MR < MC, hãng có thể tiếp tục sản xuất cho đến khi MR\nlớn hơn hoặc bằng chi phí biến đổi trung bình (AVC): vì chi phí biến đổi vẫn được chi trả,\nvẫn còn một số lợi nhuận từ sản xuất (Lựa chọn A). Tuy nhiên, nếu giá giảm đến mức MR\n< MC < AVC, thì công ty không trang trải được chi phí cố định hoặc biến đổi và nên đóng cửa\nxuống.\n(Lựa chọn C) AVC là một thành phần của ATC và do đó sẽ không bao giờ bằng nhau, bất kể thế nào\nnhiều đơn vị được sản xuất.\nNhững điều cần nhớ:\nTrong thị trường cạnh tranh hoàn hảo, nếu giá giảm xuống dưới mức hòa vốn thì doanh thu cận biên (MR)\nnhỏ hơn chi phí biên (MC), doanh nghiệp có thể tiếp tục sản xuất trong ngắn hạn miễn là\nMR lớn hơn hoặc bằng chi phí biến đổi trung bình (AVC): vì chi phí biến đổi vẫn\nđược trang trải (và chi phí cố định là chi phí chìm), vẫn có một số lợi nhuận từ sản xuất. Tuy nhiên,\nnếu giá giảm đến mức MR < AVC thì hãng nên đóng cửa.\nXác định và giải thích các điểm hòa vốn và điểm dừng sản xuất, cũng như cách các nền kinh tế\nvà tính phi kinh tế theo quy mô ảnh hưởng đến chi phí trong điều kiện cạnh tranh hoàn hảo và không hoàn hảo\nLOS","qhtml":null},{"n":51,"q":"An analyst compares the performance of portfolios that receive annual contributions in\naddition to earning returns. The analyst most appropriately uses a(n):","opts":["internal rate of return.","time-weighted rate of return","money-weighted rate of return."],"ans":"B","expl":"Tỷ suất lợi nhuận tính theo thời gian (TWR) phù hợp hơn để so sánh các danh mục đầu tư vì phép tính\ncủa nó vô hiệu hóa tác động lên hiệu suất khi giá trị thị trường của danh mục đầu tư thay đổi\ndo sự đóng góp hoặc rút tiền của nhà đầu tư chứ không phải lợi nhuận mà chính khoản đầu tư\ntạo ra. Các khoản đóng góp làm tăng giá trị thị trường của khoản đầu tư nhưng không nên\nđược đưa vào như một phần hiệu quả của khoản đầu tư. TWR vô hiệu hóa các khoản đóng góp bằng cách\nchia một giai đoạn hoạt động thành các giai đoạn phụ nhỏ hơn mỗi khi thực hiện đóng góp.\nTWR được tìm thấy bằng cách liên kết hình học lợi tức giai đoạn nắm giữ của mỗi giai đoạn phụ. Điều này dẫn đến\ntốc độ tăng trưởng gộp.\n(Lựa chọn A và C) Tỷ suất lợi nhuận tính theo tiền (MWR) là một ứng dụng của tỷ suất lợi nhuận nội bộ\n. MWR bao gồm tất cả các dòng tiền, kể cả các khoản đóng góp và\nrút khỏi danh mục đầu tư, bằng cách đánh đồng giá trị hiện tại của dòng tiền ra của nhà đầu tư với\ngiá trị hiện tại của dòng tiền vào của nhà đầu tư. Do đó, nó không chỉ tính toán\nlợi nhuận từ thu nhập thực tế của danh mục đầu tư.\nNhững điều cần nhớ:\nCác nhà phân tích thích tỷ suất lợi nhuận tính theo thời gian để so sánh hiệu suất của danh mục đầu tư\nvì tính toán của nó vô hiệu hóa tác động lên hiệu suất khi có những thay đổi về giá trị thị trường của danh mục đầu tư\ndo đóng góp thay vì đóng góp trở lại. Nó vô hiệu hóa tác động của các khoản đóng góp\nbằng cách chia giai đoạn hoạt động thành các giai đoạn nhỏ hơn mỗi khi có\nđóng góp.\nso sánh tỷ suất lợi nhuận tính theo tiền và tính theo thời gian và đánh giá hiệu suất của\ndanh mục đầu tư dựa trên các biện pháp này\nLOS","qhtml":null},{"n":52,"q":"A company reports the following data (in millions):\nIncome statement Indirect cash flow statement\nNet sales $1,500 Net income $200\nCost of goods sold 800 Depreciation and amortization 150\nAdjustments for changes to net\nworking capital:\nGross profit 700 Increase in inventory −10\nSales and wage expenses 250 Decrease in accounts receivable 20\nDepreciation and amortization 150 Decrease in wages payable −15\nOperating income 300 Decrease in accounts payable −5\nInterest expense 50 Increase in interest payable 0\nTax expense 50 Increase in taxes payable 5\nNet income 200 Cash from operating activities 345\nBased on only this information, the cash paid to suppliers (in $ millions) reported on the\ncompany's cash flow statement in the direct format would be closest to:","opts":["785","805","815"],"ans":"C","expl":"Các thành phần của báo cáo lưu chuyển tiền tệ trực tiếp\nTiền nhận được từ khách hàng Doanh thu − Δ các khoản phải thu\nTiền mặt trả cho nhà cung cấp COGS + Δ hàng tồn kho − Δ tài khoản phải trả\nTiền mặt trả cho nhân viên Chi phí tiền lương − Δ tiền lương phải trả\nTiền mặt trả lãi vay Chi phí lãi vay − Δ lãi vay phải trả\nTiền mặt trả thuế Chi phí thuế − Δ thuế phải trả\nLưu ý: Δ phản ánh những thay đổi trong số dư, vì vậy các dấu hiệu có thể khác với báo cáo lưu chuyển tiền mặt gián tiếp\n.\nDòng tiền từ hoạt động kinh doanh có thể được trình bày trong báo cáo lưu chuyển tiền tệ của công ty bằng cách sử dụng\nphương pháp trực tiếp hoặc gián tiếp. Phương pháp trực tiếp hiển thị dòng tiền vào (ví dụ: tiền mặt nhận được\ntừ khách hàng) và dòng tiền ra (ví dụ: tiền mặt trả cho nhà cung cấp). Báo cáo lưu chuyển tiền tệ gián tiếp\ncó thể được chuyển đổi sang định dạng trực tiếp bằng cách điều chỉnh những thay đổi trong các khoản mục vốn lưu động được tìm thấy\ntrên báo cáo.\nĐể giải quyết câu hỏi này, các nguồn và cách sử dụng tiền mặt trên báo cáo lưu chuyển tiền tệ gián tiếp phải được\nchuyển đổi thành những thay đổi của số dư trên bảng cân đối kế toán, sau đó được sử dụng trong các phương trình trong\nhình ảnh chính. Trên báo cáo lưu chuyển tiền tệ gián tiếp:\nDòng tiền ròng âm từ hàng tồn kho cho thấy sự gia tăng (tức là thay đổi tích cực) trong\nhàng tồn kho khi mua hàng (tức là sử dụng tiền mặt) đã vượt quá giá vốn hàng bán. Trong trường hợp này, sự thay đổi trong\nhàng tồn kho là −10 trên báo cáo lưu chuyển tiền tệ gián tiếp cho thấy sự gia tăng trong số dư hàng tồn kho\ntrên bảng cân đối kế toán. Điều này dẫn đến số tiền mặt trả cho nhà cung cấp tăng lên 10.\nDòng tiền ròng âm từ các tài khoản phải trả cho thấy sự giảm (tức là\nthay đổi âm) trong các tài khoản phải trả do công ty thanh toán cho nhà cung cấp (tức là sử dụng tiền mặt) nhiều hơn\nmà họ mua bằng tín dụng (tức là một nguồn tiền mặt). Trong trường hợp này, sự thay đổi tài khoản phải trả\n−5 làm giảm số dư tài khoản phải trả. Điều này dẫn đến số tiền mặt trả cho\nnhà cung cấp tăng lên 5.\nLưu ý: vì hàng tồn kho là tài sản trong khi tài khoản phải trả là nợ phải trả, nên dấu hiệu của chúng trên báo cáo lưu chuyển tiền mặt\ncho thấy các hướng thay đổi khác nhau của tiền mặt.\nTiền mặt trả cho nhà cung cấp = giá vốn hàng bán + Δ hàng tồn kho − Δ tài khoản phải trả\nTiền mặt trả cho nhà cung cấp = 800 + 10 − (−5) = 815\n(Lựa chọn A) 785 được tính bằng cách không ghi nhận dòng tiền âm ròng khi hàng tồn kho tăng\n và dòng tiền ròng dương khi các khoản phải trả giảm.\n(Lựa chọn B) 805 được tính bằng cách không ghi nhận dòng tiền dương ròng khi giảm trong\ncác tài khoản phải trả.\nNhững điều cần nhớ:\nBáo cáo lưu chuyển tiền tệ ở định dạng trực tiếp hiển thị các khoản thu tiền mặt từ khách hàng và phân loại\nchi phí tiền mặt. Báo cáo lưu chuyển tiền tệ gián tiếp có thể được chuyển đổi sang định dạng trực tiếp bằng cách điều chỉnh\ncác mục thu nhập đối với những thay đổi trong các mục vốn lưu động có trên báo cáo.\nThể hiện việc chuyển đổi dòng tiền từ phương pháp gián tiếp sang phương pháp trực tiếp - LOS","qhtml":null},{"n":53,"q":"Which of the following statements best describes an aspect of lessee accounting for operating\nleases under US GAAP? The value reported for the right-of-use (ROU) asset is:","opts":["reduced by periodic interest payments.","amortized using the straight-line method.","equal to the ending balance of the lease liability each period."],"ans":"C","expl":"Thuê vận hành có tính chất tương tự về mặt kinh tế với hợp đồng cho thuê ngắn hạn. Bên cho thuê (tức là\nngười cho vay tài sản) cấp cho bên thuê (tức là khách hàng) quyền sử dụng tài sản trong một khoảng thời gian để\nđổi lấy các khoản thanh toán tiền thuê theo lịch trình.\nKhi bắt đầu thuê, bên thuê phải đồng thời ghi nhận nợ phải trả cho thuê và một\ntài sản có quyền sử dụng ( ROU ) tương ứng , mỗi tài sản có giá trị bằng PV của tương lai thuê\nthanh toán, trên bảng cân đối kế toán. Theo thời gian, số dư cho cả nợ phải trả và tài sản\nđược giảm đi theo phần trả nợ gốc của mỗi khoản thanh toán tiền thuê (tức là được khấu hao).\nDo đó, tài sản ROU và nợ phải trả cho thuê có số dư cuối kỳ giống nhau cho mỗi kỳ.\nVí dụ cho thấy khấu hao định kỳ cho hợp đồng thuê hoạt động 4 năm với tỷ lệ chiết khấu 7%\nvà Thanh toán tiền thuê hàng năm là 10.000 USD. Khi bắt đầu, bên thuê sẽ ghi nhận một khoản nợ\nvà một tài sản, mỗi tài sản trị giá 33.872 USD, là PV của các khoản thanh toán. Sau đó, cả\ntài sản và nợ phải trả đều giảm dần theo các khoản thanh toán gốc cho đến khi số dư đạt\n0 khi kết thúc hợp đồng thuê.\n(Lựa chọn A) Đối với hợp đồng thuê hoạt động theo US GAAP, tài sản ROU được khấu hao bằng\nsố tiền giảm gốc cho mỗi lần thanh toán tiền thuê, không phải bằng chi phí lãi vay được trả bằng\nmỗi khoản thanh toán.\n(Lựa chọn B) Theo US GAAP, tài sản ROU có thể được khấu hao bằng phương pháp đường thẳng\nchỉ đối với hợp đồng thuê tài chính, không phải đối với hợp đồng thuê hoạt động.\nNhững điều cần nhớ:\nKhi bắt đầu hợp đồng thuê hoạt động, bên thuê sẽ đồng thời ghi nhận trách nhiệm pháp lý đối với hợp đồng thuê\nvà một tài sản có quyền sử dụng tương ứng, mỗi tài sản bằng giá trị hiện tại của các khoản thanh toán cho thuê\ntrong tương lai. Theo thời gian, số dư của cả nợ phải trả và tài sản sẽ giảm dần theo\ncác khoản thanh toán gốc. Do đó, tài sản và nợ phải trả có số dư cuối kỳ như nhau cho\nmỗi kỳ.\nGiải thích báo cáo tài chính về hợp đồng thuê từ góc độ của bên cho thuê và bên thuê\nLOS","qhtml":null},{"n":54,"q":"An analyst compiles the following information about a company:\n20X2 20X3\nROE 16.7% 17.2%\nTotal asset turnover 1.06 1.07\nLeverage 1.53 1.61\nBased on only this information, the most appropriate conclusion is that:","opts":["return on assets increased and net profit margin increased.","return on assets decreased and net profit margin increased.","return on assets decreased and net profit margin decreased."],"ans":"C","expl":"ROE của một công ty đo lường mức lợi nhuận, được đo bằng thu nhập ròng, công ty có thể\ntạo ra bằng vốn cổ phần do các cổ đông đầu tư. Phân tích của DuPont chia ROE thành\ncác yếu tố thành phần để hiểu yếu tố nào đang thúc đẩy lợi nhuận của công ty.\nCấp phân tích đầu tiên của DuPont tách ROE thành tỷ lệ lợi nhuận trên tài sản\n(ROA) và tỷ lệ đòn bẩy. ROA sau đó được chia thành tỷ suất lợi nhuận ròng và\ntỷ lệ vòng quay tổng tài sản. Quá trình này tách ROE thành ba yếu tố:\nKhả năng sinh lời, được đo bằng tỷ suất lợi nhuận ròng\nHiệu quả, được đo bằng tỷ lệ vòng quay tài sản\nĐòn bẩy, được đo bằng tỷ lệ đòn bẩy\nNhững yếu tố đó có thể được chia nhỏ theo các cấp độ phân tích bổ sung của DuPont.\nTrong trường hợp này, ROA của công ty được xác định từ Tỷ lệ ROE và đòn bẩy như\nnhư sau:\nROE = ROA × Đòn bẩy\nROA = ROE / Đòn bẩy\nROA = 0,167 / 1,53 ≈ 10,9%\n20X2\nROA = 0,172 / 1,61 ≈ 10,7%\n20X3\nTrong khoảng thời gian từ 20X2 đến 20X3, ROA của công ty đã giảm từ 10,9% xuống 10,7% (Lựa chọn A) .\nROA được tính toán có thể được sử dụng để xác định tỷ suất lợi nhuận ròng của công ty như sau:\nROA = Biên lợi nhuận ròng × Vòng quay tổng tài sản\nBiên lợi nhuận ròng = ROA / Tổng doanh thu tài sản\nBiên lợi nhuận ròng = 0,109 / 1,06 ≈ 10,3%\n20X2\nBiên lợi nhuận ròng = 0,107 / 1,07 = 10,0%\n20X3\nTrong khoảng thời gian từ 20X2 đến 20X3, tỷ suất lợi nhuận ròng của công ty đã giảm từ 10,3% xuống\n10,0% (Lựa chọn B) .\nNhững điều cần nhớ:\nPhân tích DuPont phân tích ROE của một công ty để xác định yếu tố thành phần nào của nó\nlái xe trở lại. Cấp độ phân tích đầu tiên của DuPont tách ROE thành tỷ lệ lợi nhuận trên tài sản\n(ROA) và tỷ lệ đòn bẩy. ROA sau đó có thể được chia thành tỷ suất lợi nhuận ròng\nvà tỷ lệ vòng quay tổng tài sản.\nChứng minh việc áp dụng phân tích DuPont về lợi nhuận trên vốn chủ sở hữu và tính toán cũng như diễn giải\ntác động của những thay đổi trong các thành phần của nó\nLOS","qhtml":null},{"n":55,"q":"An investor is testing whether the returns of two private equity funds are uncorrelated. The\ninvestor finds that returns are asymmetrical, with an unusual number of extreme values.\nBefore calculating the correlation coefficient, which of the following steps would be most\nappropriate ?","opts":["Determine the distributional assumptions of both populations.","Calculate the squared differences between ranked pairs of observations.","Treat the effect of skewness and outliers in both data sets before using the Pearson correlation."],"ans":"B","expl":"Kiểm tra giả thuyết được sử dụng để đưa ra suy luận và rút ra kết luận về các tham số tổng thể\n, chẳng hạn như xác định xem hai biến có tương quan hay không. Tùy thuộc vào\ngiả định phân phối của tổng thể, các nhà phân tích có thể sử dụng:\nKiểm tra tham số, dựa trên phân bố cụ thể và các tham số tổng thể đã biết.\nMối tương quan Pearson được sử dụng để tính r , tương quan mẫu.\nKiểm tra phi tham số , thường được sử dụng khi có thể đưa ra một vài giả định về\ntập hợp cơ bản, chẳng hạn như khi nó được phân phối không chuẩn.\nHệ số tương quan xếp hạng Spearman là thước đo phi tham số thường được sử dụng.\nNó không đưa ra giả định nào về phân bố của tập dữ liệu ; thay vào đó, nó sử dụng các quan sát\nđược xếp hạng từ mỗi phân phối không chuẩn và sự khác biệt bình phương giữa\nmỗi cặp được xếp hạng .\nTrong trường hợp này, nhà đầu tư nhận thấy rằng lợi nhuận không đối xứng (tức là bị lệch) và rằng\ncó một số giá trị cực trị bất thường (tức là các giá trị ngoại lệ). Do đó, bộ dữ liệu này\ngợi ý rằng các biến không được phân phối bình thường và nhà đầu tư nên sử dụng\nkiểm tra phi tham số (Spearman) thay vì kiểm tra tham số (Pearson).\n(Lựa chọn A) Các giả định phân phối chỉ được sử dụng cho kiểm tra tham số. Các thử nghiệm\nkhông tham số như Spearman dựa trên dữ liệu được quan sát chứ không dựa trên các giả định về tổng thể\nvà các tham số của nó.\n(Lựa chọn C) Nhà phân tích có thể chuyển đổi dữ liệu để giải quyết độ lệch và các giá trị ngoại lệ, nhưng điều này\nsẽ không làm cho mối tương quan Pearson trở nên phù hợp vì phân phối không bình thường.\nNhững điều cần nhớ:\nCác thử nghiệm giả thuyết có thể được sử dụng để xác định xem hai biến có tương quan hay không.\nCác thử nghiệm tham số dựa trên một phân bố cụ thể và thường sử dụng tương quan Pearson.\nCác thử nghiệm không tham số dựa trên dữ liệu được quan sát và nên sử dụng xếp hạng Spearman\nhệ số tương quan.\nGiải thích các thử nghiệm tham số và phi tham số của giả thuyết rằng mối tương quan tổng thể\nbằng 0 và xác định xem giả thuyết có bị bác bỏ ở mức\ný nghĩa\nLOS","qhtml":null},{"n":56,"q":"Assuming assets have a unimodal return distribution, which of the following assets would\nbe most appropriate for an investor aiming to maximize mean returns? An asset with an\nexpected return distribution that is:","opts":["symmetrical.","positively skewed.","negatively skewed."],"ans":"B","expl":"Các nhà đầu tư thường xem xét mức độ đối xứng trong phân phối lợi nhuận.\nĐối với phân phối đơn phương thức, nếu phân phối lợi nhuận hoàn toàn đối xứng, trong đó\nsố học giá trị trung bình, trung vị và chế độ bằng nhau thì xác suất đạt được bằng\nnhư xác suất thua lỗ. Độ lệch đề cập đến sự thiếu đối xứng trong một phân phối.\nPhân phối lợi nhuận bị lệch dương có đuôi dài bên phải với:\nlợi nhuận ít hơn nhưng lớn hơn mức trung bình và\nlợi nhuận thường xuyên nhưng nhỏ hơn dưới mức trung bình.\nNhững lợi nhuận lớn này kéo giá trị trung bình sang bên phải của chế độ và đường trung vị, vì vậy giá trị trung bình\nlớn hơn giá trị trung bình trung vị, lớn hơn mốt. Lợi nhuận có độ lệch dương là\nthích hợp nhất cho nhà đầu tư muốn tối đa hóa lợi nhuận trung bình vì lợi nhuận kỳ vọng trung bình\nlợi nhuận kỳ vọng lớn hơn đối với những tài sản có phân phối đối xứng hoặc bị lệch âm ,\ntất cả các yếu tố khác đều bằng nhau (Lựa chọn A và C) .\nNếu phân phối lợi nhuận bị lệch âm, nó có đuôi dài bên trái: ít hơn nhưng lợi nhuận lớn hơn\ndưới mức trung bình với lợi nhuận thường xuyên nhưng nhỏ hơn trên mức trung bình. Giá trị trung bình nhỏ hơn\ntrung vị, nhỏ hơn chế độ và lợi nhuận kỳ vọng trung bình thấp hơn giá trị trung bình của phân phối không theo phương thức đối xứng hoặc lệch dương.\nNhững điều cần nhớ:\nPhân phối lợi nhuận bị lệch dương có đuôi phải dài và giá trị trung bình lớn hơn trung vị\n, lớn hơn giá trị trung bình chế độ. Đối với lợi nhuận có độ lệch dương, lợi nhuận kỳ vọng trung bình\nlớn hơn so với tài sản có phân phối đối xứng hoặc lệch âm, tất cả các yếu tố khác\nbằng nhau.\nGiải thích và đánh giá các thước đo độ lệch và độ nhọn để giải quyết vấn đề đầu tư\nLOS","qhtml":null},{"n":57,"q":"The top two companies in an industry, by market share, are merging. All else equal, under\nwhich of the following scenarios will the Herfindahl-Hirschman Index (HHI) most\nlikely overestimate market power?","opts":["The industry has low price elasticity of demand due to product homogeneity.","The merged companies will have a 20% market share in a new, high-growth tech market.","The companies will have the largest market share in an industry with low barriers to entry."],"ans":"C","expl":"Tỷ lệ nồng độ Chỉ số Herfindal-Hirschman (HHI)\nTổng tỷ lệ phần trăm bình phương của thị trường\nTổng tỷ lệ phần trăm thị trường\ncổ phiếu của N công ty hàng đầu\ncổ phiếu của N công ty lớn nhất\nMột ngành có M công ty có bằng\nTính toán\n0 là cạnh tranh hoàn hảo\nthị phần có HHI bằng 1/ M\nvà 100% là độc quyền\n1 là độc quyền\nĐơn giản để tính toán và\nĐo lường sức mạnh thị trường tốt hơn\nƯu điểm\ntrực quan hơn\nKhông phải thước đo trực tiếp\nsức mạnh thị trường\nKhông bị ảnh hưởng bởi top Hơi phức tạp hơn và kém trực quan hơn\nsáp nhập đương nhiệm Không xem xét khả năng\nNhược điểm\nKhông xem xét khả năng gia nhập thị trường\nkhả năng gia nhập thị trường Không xem xét độ co giãn của cầu\nKhông xem xét nhu cầu\nđộ co giãn\nTỷ lệ tập trung và Chỉ số Herfindahl-Hirschman (HHI) đều đo lường mức độ tập trung thị phần\ncủa ngành. Tỷ lệ tập trung đo lường tổng thị phần của các công ty\nhàng đầu (ví dụ: ba công ty hàng đầu) dưới dạng phần trăm trên doanh số bán hàng của toàn ngành.\nHHI được tính bằng tổng bình phương thị phần của\nn công ty hàng đầu. Nếu có M công ty trong một ngành và mỗi công ty có thị phần bằng nhau thì\nHHI bằng (1/ M ). HHI có thể minh họa rõ hơn mức độ ảnh hưởng của việc sáp nhập đến sức mạnh thị trường so với tỷ lệ tập trung\n. Tuy nhiên, cả HHI lẫn tỷ lệ tập trung đều không xem xét\nkhả năng gia nhập thị trường hoặc độ co giãn của cầu theo giá. Mặc dù thị trường có thể bị\nchi phối bởi một số công ty lớn và do đó có tỷ lệ tập trung và HHI cao,\nrào cản gia nhập có thể thấp. Rào cản thấp sẽ ngăn cản các công ty hàng đầu khai thác\nsức mạnh thị trường của họ vì sợ khuyến khích những người mới tham gia và cạnh tranh nhiều hơn; HHI sẽ\ncó thể đánh giá quá cao sức mạnh thị trường.\n(Lựa chọn A) Độ co giãn của cầu theo giá thấp sẽ khuyến khích các công ty lớn nhất khai thác\nsức mạnh thị trường của họ: Người tiêu dùng ít nhạy cảm hơn với những thay đổi về giá và có thể tiếp tục mô hình mua sắm\nmặc dù giá cao hơn. Trong trường hợp này, HHI có thể sẽ đánh giá thấp sức mạnh thị trường.\n(Lựa chọn B) Một công nghệ mới đầy hứa hẹn có thể ngăn cản những người tham gia không thể\nsao chép nó do bằng sáng chế hoặc kiến ​​thức độc quyền. Trong trường hợp này, HHI có thể đánh giá thấp\nsức mạnh thị trường của công ty được sáp nhập.\nNhững điều cần nhớ:\nChỉ số Herfindahl-Hirschman là một cách hữu ích để đo lường mức độ tập trung của ngành, nhưng nó\nkhông xem xét các rào cản gia nhập thị trường hoặc độ co giãn của cầu theo giá sản phẩm, cả hai điều này\ncũng ảnh hưởng đến mối quan hệ giữa tập trung thị trường và thị trường sức mạnh.\nXác định loại cấu trúc thị trường trong đó một công ty hoạt động và mô tả việc sử dụng cũng như\ncác hạn chế của các biện pháp tập trung\nLOS","qhtml":null},{"n":58,"q":"Which of the following best describes a financial tool that reinforces geopolitical cooperation?","opts":["The free exchange of currencies across borders.","The US Federal Reserve's global leadership in monetary policy.","The dominance of large banks in the international interbank market."],"ans":"A","expl":"Các công cụ địa chính trị\nVí dụ về loại công cụ\nLiên minh (ví dụ: NATO)\nVũ trang xung đột\nAn ninh quốc gia\nGián điệp\nCác hiệp định thương mại đa phương (ví dụ: NAFTA)\nKinh tế\nQuốc hữu hóa\nTự do trao đổi tiền tệ\nCho phép đầu tư nước ngoài\nTài chính Giảm khả năng tiếp cận thị trường tiền tệ địa phương\nHạn chế đầu tư nước ngoài\nCó ba loại công cụ địa chính trị: công cụ an ninh quốc gia, công cụ kinh tế và\ncông cụ tài chính. Các tác nhân địa chính trị có thể sử dụng những công cụ này để thúc đẩy hợp tác toàn cầu hoặc\nleo thang xung đột (tức là bất hợp tác). Các công cụ tài chính có thể giảm rủi ro địa chính trị nếu chúng\nkhuyến khích tiếp cận kinh tế và/hoặc trao đổi tài chính mở.\nViệc trao đổi tự do tiền tệ xuyên biên giới là một trong những ví dụ mạnh mẽ nhất về một\ncông cụ tài chính giúp củng cố hợp tác địa chính trị và giảm rủi ro địa chính trị. Ngoài ra, việc cho phép đầu tư nước ngoài khuyến khích dòng chảy hàng hóa, dịch vụ, vốn,\nvà lao động giữa các quốc gia tăng lên.\nMặc dù thị trường ngoại hối mang lại lợi ích cho các quốc gia tham gia, nhưng nó cũng có thể tạo ra những lỗ hổng mang tính hệ thống\n:\nTầm quan trọng của đồng đô la Mỹ trên thị trường ngoại hối có thể khiến các loại tiền tệ khác gặp phải những thay đổi lớn\nở Hoa Kỳ chính sách tiền tệ. Cụ thể, chính sách tiền tệ chặt chẽ hơn của Hoa Kỳ có thể ảnh hưởng tiêu cực\ndòng vốn, tăng trưởng tín dụng và cho vay ngân hàng của các quốc gia khác thông qua những thay đổi về\nlãi suất và tỷ giá hối đoái (Lựa chọn B) .\nSự thống trị của những người chơi lớn (ví dụ: các ngân hàng lớn) trên thị trường liên ngân hàng quốc tế\ncó thể gây bất lợi cho một số quốc gia. Đặc biệt, các ngân hàng ở các quốc gia\ntrải qua thời kỳ khủng hoảng ngân hàng kéo dài hoặc nhiều ngân hàng phá sản trước đây có thể được\ncoi là có rủi ro tín dụng đối tác lớn hơn và do đó có thể bị loại khỏi\ntham gia đầy đủ vào hoạt động liên ngân hàng (Lựa chọn C).\nNhững điều cần nhớ:\nViệc trao đổi tiền tệ tự do xuyên biên giới là một trong những ví dụ điển hình nhất về một công cụ\ntài chính giúp củng cố hợp tác địa chính trị và giảm rủi ro địa chính trị. Ngoài ra, việc cho phép\nđầu tư nước ngoài khuyến khích dòng hàng hóa, dịch vụ, vốn và lao động tăng lên\ngiữa các quốc gia.\nMô tả các công cụ địa chính trị và tác động của chúng đối với các khu vực và nền kinh tế\nLOS","qhtml":null},{"n":59,"q":"Under US GAAP, a company discloses interest received in advance, with a carrying amount of\n$100,000 and a tax base of $0, most likely resulting in:","opts":["no recognition of a deferred tax item.","the recognition of a deferred tax asset.","the recognition of a deferred tax liability."],"ans":"B","expl":"Tạo tài sản thuế thu nhập hoãn lại (DTA) và nợ phải trả (DTL)\nMục trong bảng cân đối kế toán Kịch bản\nGiá trị ghi sổ > Cơ sở tính thuế → DTL\nTài sản\nGiá trị ghi sổ < Cơ sở tính thuế → DTA\nGiá trị ghi sổ > Cơ sở tính thuế → DTA\nTrách nhiệm\nGiá trị ghi sổ < Cơ sở thuế → DTL\nSự khác biệt tạm thời giữa lợi nhuận kế toán và lợi nhuận chịu thuế có thể phát sinh từ\nthời điểm ghi nhận các khoản thu và chi nhất định. Những khác biệt này được phản ánh\ntrong tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả . Vì sự khác biệt sẽ được đảo ngược\ntrong tương lai nên chúng được coi là tạm thời. Không có mục thuế thu nhập hoãn lại nào được ghi nhận khi không có\nsự khác biệt tạm thời.\nKhi một công ty nhận được tiền lãi trước, như trong trường hợp này, công ty sẽ ghi nhận một khoản nợ phải trả trên bảng cân đối kế toán\n, phản ánh việc nhận được tiền mặt trước khi kiếm được thu nhập từ tiền lãi. Vì\nnợ phải trả có giá trị ghi sổ lớn hơn cơ sở tính thuế, chênh lệch tạm thời giữa\nlợi nhuận kế toán và lợi nhuận chịu thuế dẫn đến tài sản thuế thu nhập hoãn lại.\n(Lựa chọn A) Sẽ không được ghi nhận sự kiện thuế thu nhập hoãn lại nếu chênh lệch giữa\nlợi nhuận kế toán và lợi nhuận chịu thuế được coi là cố định.\n(Lựa chọn C) Việc ghi nhận nợ thuế thu nhập hoãn lại sẽ được tạo ra bởi sự khác biệt\ntạm thời, khi tài sản có giá trị ghi sổ lớn hơn cơ sở tính thuế hoặc nợ phải trả\ncó cơ sở tính thuế lớn hơn giá trị ghi sổ, nhưng trường hợp này cũng không xảy ra.\nNhững điều cần nhớ:\nSự khác biệt tạm thời giữa lợi nhuận kế toán và lợi nhuận chịu thuế có thể phát sinh từ thời điểm ghi nhận\n một số khoản thu nhập và chi phí nhất định và được phản ánh trong tài sản thuế thu nhập hoãn lại và\nthuế thu nhập hoãn lại phải trả. Nếu một khoản nợ phải trả có giá trị ghi sổ lớn hơn (hoặc nhỏ hơn) cơ sở tính thuế của nó,\nđiều này dẫn đến tài sản (hoặc nợ thuế thu nhập hoãn lại). Không có khoản mục thuế thu nhập hoãn lại nào được ghi nhận cho\nchênh lệch vĩnh viễn.\nLợi nhuận kế toán tương phản, thu nhập chịu thuế, thuế phải nộp và chi phí thuế thu nhập và chênh lệch tạm thời\nso với chênh lệch vĩnh viễn giữa lợi nhuận kế toán và thu nhập chịu thuế\nLOS","qhtml":null},{"n":60,"q":"For an economy with a floating exchange-rate regime, the impact of changes in exchange\nrates on a country's trade balance will most likely be immediately accompanied by an impact\non that country's:","opts":["capital flows.","interest rates.","money supply."],"ans":"A","expl":"Khi biến động tỷ giá hối đoái ảnh hưởng đến cán cân thương mại, tác động đó phải được cân bằng bởi\ntác động ngang bằng đối với dòng vốn.\nThặng dư thương mại ( X > M ) phải được cân bằng bởi thặng dư tài chính ( T > G , tức là chính phủ tăng\nnhiều thuế hơn mức chi tiêu) và/hoặc phần dư trong tiết kiệm tư nhân so với đầu tư ( S > I ).\nThặng dư này tài trợ cho thâm hụt của các đối tác thương mại. Một quốc gia có thâm hụt thương mại (tức là nhập khẩu >\nxuất khẩu) phải vay hoặc bán tài sản cho người nước ngoài để tài trợ cho thâm hụt.\nCác nhà đầu tư mong đợi một sự thay đổi lớn về tỷ giá hối đoái sẽ mua (bán) một loại tiền tệ\n(giảm giá) tăng giá và vốn sẽ chảy vào (ra khỏi) quốc gia đó. Các dòng vốn này\nphải:\ntrùng với sự thay đổi trong cán cân thương mại (vì tài khoản vốn và cán cân thương mại\nphải bù đắp) hoặc\nbị cản trở bởi những thay đổi về giá tài sản và tỷ giá hối đoái.\nCác quyết định chi tiêu và tiết kiệm cũng như giá hàng hóa thay đổi chậm hơn giá tài sản và\nđầu tư quyết định, do đó phần lớn các điều chỉnh trong thương mại xảy ra trên thị trường tài chính. Điều này\ncho phép các dòng vốn thực tế vẫn nhất quán với các dòng thương mại.\n(Lựa chọn B) Điều chỉnh lãi suất là phản ứng thứ cấp đối với sự mất cân bằng thương mại xảy ra\nkhi ngân hàng trung ương trong chế độ tỷ giá hối đoái cố định không thể duy trì tỷ giá cố định.\n(Lựa chọn C) Ở một số quốc gia, ngân hàng trung ương có thể phản ứng với sự mất cân bằng thương mại bằng cách thay đổi\ncung tiền, tuy nhiên, các phát hiện thực nghiệm cho thấy có mối quan hệ tiêu cực\ngiữa cung tiền và cán cân thương mại.\nNhững điều cần nhớ:\nBiến động tỷ giá hối đoái ảnh hưởng đến cán cân thương mại phải được bù đắp bằng dòng vốn. Trong a\nthặng dư thương mại, tiết kiệm vượt mức tài trợ cho thâm hụt của các đối tác thương mại. Phần lớn sự mất cân bằng thương mại\nđược giải quyết bằng sự điều chỉnh nhanh chóng về tỷ giá hối đoái và giá của tài sản\ntài chính.\nMô tả chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\nthương mại quốc tế và dòng vốn\nLOS","qhtml":null},{"n":61,"q":"Which of the following most likely limits the effectiveness of fiscal policy in stabilizing\naggregate demand? The government's inability to:","opts":["run a budget deficit large enough to stimulate the economy.","slow an overheated economy by reducing government spending.","borrow during recessions due to investor preference for corporate debt."],"ans":"A","expl":"Các vấn đề kinh tế vĩ mô cản trở chính sách tài khóa hiệu quả\nViệc làm cao hơn sẽ làm tăng lạm phát, do đó\nThất nghiệp/lạm phát\ncác chính sách nhằm giảm lạm phát tạo ra nhiều\nsự đánh đổi\nthất nghiệp\nThị trường hạn chế quyền truy cập và/hoặc tăng chi phí của\nGiới hạn thâm hụt ngân sách\nnợ, ngăn chặn chi tiêu kích thích thích hợp\nKhó xác định chính xác vì\nchính sách mở rộng cho một nền kinh tế ở mức đầy đủ\nGDP toàn dụng\nviệc làm tạo ra lạm phát mà không tăng\ntăng trưởng\nSự thiếu hụt lao động hoặc vốn ngăn cản\nYếu tố hạn chế chính sách mở rộng tăng trưởng và\ncó thể dẫn đến lạm phát cao hơn\nVay nợ chính phủ thay thế khu vực tư nhân\nTăng cường vay mượn, do đó bù đắp chi tiêu tư nhân giảm\ntăng chi tiêu chính phủ\nỔn định tổng cầu là mục tiêu chính của chính sách tài khóa. Những điều chỉnh về chi tiêu\nvà thuế suất là những công cụ chính sách tài chính chính mà chính phủ sử dụng. Nhiều yếu tố có thể\ncản trở thành công của họ:\nSự chậm trễ trong nhận thức, hành động và tác động\nCác vấn đề kinh tế vĩ mô\nSự không chắc chắn về:\ntương lai của nền kinh tế và\nphản ứng của khu vực tư nhân đối với các hành động chính sách\nNgân sách chính phủ đang có khả năng đã bị thâm hụt trong thời kỳ suy thoái.\nPhản ứng của thị trường tài chính (tức là lãi suất cao hơn) hoặc áp lực chính trị có thể ngăn cản chính phủ\ntăng thâm hụt bằng cách tăng chi tiêu hoặc giảm thuế suất. Trong trường hợp đó,\nchính phủ có thể không thể giải quyết thâm hụt đủ lớn để ổn định tổng cầu\nvà kích thích phục hồi kinh tế .\n(Lựa chọn B) Chi tiêu của chính phủ là một yếu tố đóng góp đáng kể vào GDP, do đó việc giảm\nchi tiêu dẫn đến giảm GDP. Nếu ý chí chính trị tồn tại, chi tiêu của chính phủ có thể bị cắt giảm để\nlàm chậm tốc độ tăng trưởng của nền kinh tế.\n(Lựa chọn C) Là người đi vay có uy tín cao nhất trong nền kinh tế, chính phủ thường có thể\nphát hành nợ, ngay cả trong thời kỳ suy thoái. Tuy nhiên, việc vay mượn quá mức có thể làm tăng lãi suất\nvà/hoặc lấn át (thay thế) những người đi vay tư nhân.\nNhững điều cần nhớ:\nMục tiêu chính của chính sách tài khóa là ổn định tổng cầu. Trong thời kỳ suy thoái,\ncác chính phủ có thể không có đủ khả năng thâm hụt đủ lớn để cung cấp đủ kích thích nhằm\ntạo ra tăng trưởng kinh tế.\nGiải thích việc thực hiện chính sách tài khóa và những khó khăn khi thực hiện cũng như liệu\nchính sách tài chính là mở rộng hay thu hẹp\nLOS","qhtml":null},{"n":62,"q":"An analyst uses bootstrap resampling to estimate the risk and return of an investment. One\nof the steps of the bootstrap process consists of generating random samples:","opts":["of different sizes, with replacement.","from a specified probability distribution.","that will be used to infer the statistical parameters of the population."],"ans":"C","expl":"Các phương pháp mô phỏng thường được sử dụng nhiều nhất để ước tính rủi ro và lợi tức đầu tư\ncác ứng dụng. Những kỹ thuật như vậy thường bao gồm việc tạo ra một số lượng đáng kể\nmẫu, cho phép các nhà phân tích kiểm tra các kịch bản và định giá chứng khoán.\nViệc lấy mẫu lại Bootstrap là một công cụ tính toán có thể được sử dụng khi không xác định được sự phân bố của tổng thể dữ liệu\n . Quá trình khởi động ước tính các tham số tổng thể dựa trên\ndựa trên dữ liệu được quan sát (tức là mẫu ban đầu có kích thước n ) bằng cách thực hiện các bước sau:\n1. Vẽ các phần tử từ mẫu ban đầu, mỗi lần một phần tử, có thay thế (tức là\ntrả phần tử đó về mẫu trước khi vẽ phần tử tiếp theo)\n2. Tiếp tục vẽ cho đến khi mẫu bootstrap có n phần tử (tức là giống với kích thước mẫu\nban đầu)\n3. Lặp lại quy trình nhiều lần, tạo nhiều mẫu bootstrap\n4. Tính toán số liệu thống kê quan tâm từ các mẫu và suy ra các thông số\ncủa tổng thể\n5. Ước tính rủi ro và lợi nhuận của khoản đầu tư dựa trên phân tích\nDo thay thế, một số quan sát có thể được đưa vào mẫu lại nhiều lần. Điều này\ncho phép các mẫu lại nắm bắt được sự biến đổi có trong dữ liệu được quan sát và nói rộng ra là\ntrong quần thể đang được phân tích.\n(Lựa chọn A) Tất cả các mẫu bootstrap đều có cùng kích thước, bằng với kích thước mẫu\nban đầu.\n(Lựa chọn B) Việc lấy mẫu lại Bootstrap dựa trên dữ liệu được quan sát . Một ví dụ về phương pháp mô phỏng\ndựa trên phân bố xác suất được chỉ định là mô phỏng Monte Carlo.\nNhững điều cần nhớ:\nViệc lấy mẫu lại Bootstrap là một công cụ tính toán ước tính các tham số tổng thể dựa trên\ndữ liệu quan sát được, vẽ các phần tử có thay thế. Việc lấy mẫu lại bootstrap có thể được sử dụng khi\nkhông xác định được sự phân bố thống kê của dữ liệu.\nMô tả việc sử dụng việc lấy mẫu lại bootstrap trong việc tiến hành mô phỏng dựa trên dữ liệu được quan sát trong\ncác ứng dụng đầu tư\nLOS","qhtml":null},{"n":63,"q":"A company provides the following balance sheet information:\nCompared to the prior year, a current year common-size balance sheet would most likely show\na(n):","opts":["increase in current assets.","increase in common stock.","decrease in current liabilities."],"ans":"C","expl":"Bảng cân đối kế toán có kích thước chung hiển thị từng mục hàng dưới dạng phần trăm của tổng tài sản .\nCác nhà phân tích thường xây dựng bảng cân đối kế toán có kích thước chung để so sánh thành phần của các mục\ntheo thời gian hoặc giữa các công ty.\nTrong câu hỏi này, tỷ lệ phần trăm tương ứng được xác định bằng cách chia các mục cho tổng\ntài sản. Kết quả cho thấy nợ ngắn hạn giảm so với năm trước theo tỷ lệ phần trăm của tổng tài sản từ 13,8% xuống 12,5% mặc dù số lượng tăng lên. Tương tự,\ntài sản lưu động và cổ phiếu phổ thông tăng so với năm trước trên cơ sở tuyệt đối nhưng\ngiảm theo phần trăm của tổng tài sản (Lựa chọn A và B) .\nNhững điều cần nhớ:\nBảng cân đối kế toán có kích thước thông thường hiển thị từng mục dưới dạng phần trăm của tổng tài sản. Các nhà phân tích thường\nxây dựng bảng cân đối quy mô chung để so sánh thành phần của các khoản mục theo thời gian hoặc\ngiữa các công ty.\nTính toán và giải thích bảng cân đối quy mô chung và các tỷ số tài chính liên quan\nLOS","qhtml":"<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlEAAAJRCAIAAADqHnWJAABqsUlEQVR42u2d3XXiPNeGd771nMepIKaCmAowFWAqwK4AXAFQgXEFmApwKsBUgFNBnAriVPB+B/eavTSy+UkmEJLc18EsxpFlWZK1f7Ql3fzvf/8TQggh5Bfwf6wCQgghlHmEEEIIZR4hhBBCmUcIIYRQ5hFCCCGUeYQQQghlHiGEEEKZRwghhFDmEUIIIZR5hBBCKPMIIYQQyjxCCCGEMo8QQgihzCOEEEIo8wghhJAv5b/33nBzc8NaI4QQcj2cfhDsDc+MJYQQIvRtEkIIIZR5hBBCCGUeIYQQQplHCCGEUOYRQgghlHmEEEIIZR4hhBBCmUcIIYRQ5hFCCKHMI4QQQijzCCGEEMo8QgghRH76uQqEENKkrmsRKcsS//V9n3VCKPMIIT9Q1MVxnGWZed1xHBFJkiQMw2/3UlVVQXgHQfBL2nHfIXFoxyAIkiTR/7ZSFIWI9Pv9Kz+rh75NQgghtPMIIeSYkdfv9/F7s9nIH5dmXddxHItIFEVqKHyj94qiCC/ye+w8EIbhaDSyTF5UCP67XC733et5nnYDyjxCyA8kyzL4AJ+fn13XFcMhhsGxLEsIvw8Lj7qu8QhzgtCcOzSvY4CuqgqFMYskDe8l/sVIfcBl96twX :64,"q":"After entering a finance lease agreement, the lessor most appropriately records periodic:","opts":["lease income.","interest revenue.","depreciation expense."],"ans":"B","expl":"Báo cáo tài chính tác động đến bên cho thuê\nBảng cân đối kế toán Báo cáo thu nhập Báo cáo lưu chuyển tiền tệ\nXóa khoản thuê Ghi lại lãi suất Thanh toán tiền thuê\ndoanh thu tài sản nhận được: CFO\nGhi nhận hợp đồng thuê\nThuê tài chính\ncó thể thu được\nLãi hoặc lỗ ghi nhận\nGiữ lại tài sản cho thuê Ghi lại hợp đồng thuê Thanh toán tiền thuê\nthu nhập nhận được: CFO\nĐang hoạt động\nGhi chép\nlease\nkhấu hao\nCFO = dòng tiền từ hoạt động kinh doanh, CFI = dòng tiền từ hoạt động tài chính\nTrong hợp đồng cho thuê, bên cho thuê cấp cho bên thuê quyền sử dụng tài sản trong một khoảng thời gian cụ thể\nđể đổi lấy các khoản thanh toán định kỳ theo lịch trình. Vì mục đích kế toán, hầu hết các hợp đồng thuê\nđược phân loại là cho thuê tài chính, mặc dù một số trường hợp ngoại lệ (ví dụ: nhà ga sân bay) được coi\nlà hợp đồng thuê hoạt động.\nTừ quan điểm của bên cho thuê, hợp đồng thuê tài chính tương đương về mặt kinh tế với việc tài trợ cho việc bán tài sản\ncho bên thuê (khách hàng). Khi bắt đầu hợp đồng thuê, bên cho thuê loại bỏ tài sản\ncho thuê khỏi bảng cân đối kế toán và đồng thời ghi nhận khoản phải thu. Sau đó,\nbên cho thuê báo cáo doanh thu lãi thu được từ khoản tài trợ cung cấp cho khách hàng.\nNgược lại, hợp đồng thuê hoạt động được coi giống như hợp đồng cho thuê. Bên cho thuê giữ lại tài sản\nkhi bắt đầu và sau đó ghi lại thu nhập cho thuê (tức là hợp đồng thuê) và khấu hao (Lựa chọn A\nvà C).\nNhững điều cần nhớ:\nTừ quan điểm của bên cho thuê, hợp đồng thuê tài chính tương đương về mặt kinh tế với việc tài trợ cho việc bán tài sản\ncho bên thuê. Khi bắt đầu hợp đồng thuê, bên cho thuê loại bỏ tài sản cho thuê khỏi bảng cân đối kế toán\nvà đồng thời ghi nhận khoản phải thu. Sau đó, bên cho thuê báo cáo\ndoanh thu lãi thu được từ nguồn tài chính cung cấp cho khách hàng.\nGiải thích báo cáo tài chính của hợp đồng thuê từ quan điểm của bên cho thuê và bên thuê\nLOS","qhtml":null},{"n":65,"q":"A real estate analyst wants to analyze the relationship between the price of single-family\nhomes and their square footage. A linear regression of 50 houses results in:\nan intercept of $85,501.89 with a standard error of $19,800.12, and\na slope coefficient of $176.34 with a standard error of $13.41.\nIf the critical t -values at a 5% significance level are 2.0106 (two-sided) and 1.6772 (one-\nsided), the most appropriate conclusion is that:","opts":["the houses in the sample cost, on average, $176.34 per square foot.","there is evidence supporting the hypothesis that the slope is greater than $155.","there is evidence supporting the hypothesis that the slope is different from $205."],"ans":"C","expl":"Thống kê t được dùng để đánh giá tầm quan trọng thống kê của hồi quy tuyến tính đơn giản.\nCác nhà phân tích có thể kiểm tra xem phần chặn tổng thể ( b ) và độ dốc ( b ) có khác nhau không from\n0 1\ngiá trị giả thuyết (nghĩa là nếu b ≠ B , b > B hoặc b < B ). Thử nghiệm t so sánh:\ni i i i i\ngiá trị t tới hạn thích hợp, dựa trên mức mong muốn\ntầm quan trọng và mức độ tự do, với\nt -statistic, được hiển thị ở trên dưới dạng tỷ lệ chênh lệch giữa độ dốc ước tính\nvà giá trị giả thuyết của nó với sai số chuẩn của nó.\nTrong trường hợp này, nhà phân tích bất động sản chạy hồi quy tuyến tính dẫn đến phương trình:\nGiá nhà (tính bằng đô la) = 85.501,89 + [176,34 × Diện tích nhà (tính bằng feet vuông)]\nNhà phân tích muốn tìm hiểu xem liệu có bằng chứng nào ủng hộ hai giả thuyết hay không: rằng\nđộ dốc lớn hơn $155 (tức là một đầu) test) và độ dốc khác với $205 (tức là\nthử nghiệm hai đuôi). Các thử nghiệm như sau:\nDo đó, có đủ bằng chứng ủng hộ giả thuyết rằng\nđộ dốc khác với $205 , do đó thử nghiệm bác bỏ giả thuyết khống cho rằng độ dốc =\n205. Tuy nhiên, dữ liệu không ủng hộ giả thuyết rằng độ dốc lớn hơn\n$155 (Lựa chọn B) , do đó, thử nghiệm không thể bác bỏ giả thuyết rằng độ dốc có thể nhỏ hơn hoặc\nbằng 155.\nLưu ý rằng độ dốc không phải là dấu hiệu cho thấy giá mỗi foot vuông vì phần giao điểm cũng phải được xem xét\ntrong phép tính. Ví dụ: một ngôi nhà rộng 1.000 foot vuông sẽ có giá trung bình\n$261.841,89 (= 85.501,89 + 176,34 × 1.000) hoặc $261,84 mỗi vuông\nfoot (Lựa chọn A) .\nNhững điều cần nhớ:\nT -statistic là tỷ lệ chênh lệch giữa hệ số ước tính và\ngiá trị giả thuyết của nó với sai số chuẩn của nó. Thống kê t có thể được sử dụng để kiểm tra xem\nđiểm chặn và độ dốc tổng thể có khác với các giá trị giả thuyết hay không.\nTính toán và giải thích các thước đo về mức độ phù hợp, xây dựng và đánh giá các thử nghiệm về mức độ phù hợp và hệ số hồi quy\ntrong hồi quy tuyến tính đơn giản\nLOS","qhtml":null},{"n":66,"q":"An analyst gathers the following data to analyze the year-over-year change in a company's\nliquidity position:\n20X4 20X3\nCash 202 210\nShort-term marketable securities 25 25\nAccounts receivable 40 42\nInventory 65 48\nAccounts payable 135 140\nCurrent portion of long-term debt 65 80\nBased only on this information, which of the following most likely contributed to the year-over-year\nincrease in the quick ratio?","opts":["increase in inventory.","decrease in accounts receivable.","decrease in current portion of long-term debt."],"ans":"C","expl":"Tỷ lệ nhanh là tỷ lệ thanh khoản đo lường khả năng đáp ứng các khoản nợ hiện tại của công ty\nbằng tài sản nhanh. Đây là một biện pháp thận trọng hơn tỷ lệ hiện tại vì tỷ lệ thanh toán nhanh\nkhông bao gồm hàng tồn kho, thường là tài sản lưu động có tính thanh khoản thấp nhất. Tuy nhiên, tỷ lệ thanh toán nhanh ít\nbảo toàn hơn tỷ lệ tiền mặt vì tỷ lệ thanh toán nhanh bao gồm các khoản phải thu.\n20X4 20X3 Thay đổi\nTiền mặt 202 210 −8\nChứng khoán thị trường ngắn hạn 25 25 0\nCác khoản phải thu 40 42 −2\nTài sản nhanh 267 277 −10\nCác khoản phải trả 135 140 −5\nPhần nợ dài hạn hiện tại 65 80 −15\nNợ ngắn hạn 200 220 −20\nTỷ lệ thanh toán nhanh\n1,34 1,26\n(Tài sản nhanh / Nợ ngắn hạn)\nTrong kịch bản này, hệ số thanh toán nhanh tăng từ 1,26 lên 1,34; dựa trên số liệu này, công ty\nđã cải thiện khả năng đáp ứng các nghĩa vụ hiện tại của mình. Sự gia tăng này là do nợ\nnợ ngắn hạn giảm từ 220 xuống 200, phần lớn là do phần hiện tại của nợ\ndài hạn giảm.\n(Lựa chọn A) Việc tăng hàng tồn kho sẽ làm tăng tỷ lệ thanh toán hiện thời chứ không phải tỷ lệ thanh toán nhanh, vì\nhàng tồn kho không được đưa vào tính tỷ lệ thanh toán nhanh.\n(Lựa chọn B) Việc giảm các khoản phải thu sẽ dẫn đến giảm tỷ lệ thanh toán nhanh.\nNhững điều cần nhớ:\nTỷ lệ thanh toán nhanh là tỷ lệ thanh khoản đo lường khả năng đáp ứng các khoản nợ ngắn hạn\nbằng tài sản nhanh của công ty. Tài sản nhanh thường bao gồm tiền mặt, chứng khoán có thể bán được và các tài khoản\ncó thể thu được. Nợ ngắn hạn thường bao gồm các tài khoản phải trả và phần hiện tại của khoản nợ dài hạn\n(nếu có khoản nợ chịu lãi đến hạn trong vòng một năm).\nTính toán và giải thích các tỷ lệ hoạt động, thanh khoản, khả năng thanh toán và khả năng sinh lời - LOS","qhtml":null},{"n":67,"q":"A firm invests in publicly traded corporate bonds. The firm's management does not intend to\nactively trade these bonds but may consider selling if a profitable opportunity arises. The firm\nshould most appropriately capture changes to the fair values of the bonds in:","opts":["the income statement.","cash flows from investing.","other comprehensive income."],"ans":"C","expl":"Các công cụ tài chính mà một công ty không có ý định nắm giữ đến ngày đáo hạn nên\nđược đo lường và báo cáo theo giá trị hợp lý . Hai phương pháp báo cáo giá trị hợp lý là giá trị hợp lý\nthông qua thu nhập ròng (FVNI) và giá trị hợp lý thông qua thu nhập toàn diện khác\n(FVOCI). Phương pháp thích hợp được xác định theo mục đích của ban quản lý.\nNếu ban quản lý có ý định tích cực giao dịch khoản đầu tư thì khoản đầu tư đó phải được hạch toán\nbằng cách sử dụng phương pháp FVNI: thay đổi về giá trị hợp lý (tức là, lãi và\nlỗ chưa thực hiện) được ghi nhận là lãi (hoặc lỗ) trong báo cáo thu nhập (Lựa chọn A).\nNếu ban quản lý không có ý định chủ động giao dịch khoản đầu tư, nhưng có thể bán nếu\ncơ hội phù hợp xuất hiện , thì khoản đầu tư phải được hạch toán bằng cách sử dụng\nphương pháp FVOCI: lãi và lỗ chưa thực hiện bỏ qua báo cáo thu nhập và xuất hiện dưới dạng\nOCI trên báo cáo thu nhập toàn diện.\nTrong trường hợp này, công ty có thể cân nhắc bán nếu có cơ hội phù hợp, vì vậy\ntrái phiếu doanh nghiệp nên được phân loại là FVOCI chứng khoán.\n(Lựa chọn B) Những thay đổi về giá trị hợp lý (tức là lãi và lỗ chưa thực hiện) không phản ánh bất kỳ\ntrao đổi chứng khoán lấy tiền mặt. Lãi (hoặc lỗ) thực hiện trên chứng khoán FVOCI được ghi vào\ndòng tiền từ hoạt động đầu tư (CFI) khi chứng khoán được bán lấy tiền mặt.\nNhững điều cần nhớ:\nNếu ban quản lý không có ý định chủ động giao dịch một công cụ tài chính nhưng có thể bán trong\ncác trường hợp phù hợp, công cụ đó được coi là \"có sẵn để bán\" và thay đổi thành giá trị hợp lý\n(tức là lãi và lỗ chưa thực hiện) sẽ được báo cáo dưới dạng thu nhập toàn diện khác thông qua\nFVOCI. Nếu ban quản lý có ý định tích cực giao dịch một công cụ tài chính thì\nlãi (hoặc lỗ) chưa thực hiện sẽ được báo cáo trên báo cáo kết quả hoạt động kinh doanh thông qua phương pháp FVNI\n.\nGiải thích báo cáo tài chính và công bố thông tin liên quan đến công cụ tài chính\nLOS","qhtml":null},{"n":68,"q":"In a period of increasing inventory costs, a company using FIFO instead of LIFO will most\nlikely experience a lower:","opts":["current ratio.","gross profit margin.","inventory turnover ratio."],"ans":"C","expl":"Việc thay đổi chi phí đơn vị hàng tồn kho có tác động khác nhau đến báo cáo tài chính của công ty,\ntùy thuộc vào phương pháp định giá hàng tồn kho của công ty. Với phương pháp FIFO, các đơn vị\nđã mua cũ nhất được sử dụng để tính giá vốn hàng bán (COGS) trong khi các đơn vị\nbổ sung gần đây nhất được sử dụng để định giá hàng tồn kho. Trong thời kỳ chi phí tồn kho tăng cao, các đơn vị\nđắt nhất \"vẫn\" trong kho trong khi các đơn vị rẻ nhất được sử dụng\ncho giá vốn hàng bán. Để so sánh, một công ty sử dụng LIFO có giá vốn hàng bán lớn hơn và\nhàng tồn kho nhỏ hơn.\nTỷ lệ vòng quay hàng tồn kho của một công ty đo lường hiệu quả của công ty đó trong việc quản lý hàng tồn kho của mình.\nTrong giai đoạn chi phí hàng tồn kho tăng, một công ty báo cáo bằng phương pháp FIFO thay vì\nLIFO sẽ báo cáo giá vốn hàng tồn kho thấp hơn, là tử số của tỷ lệ vòng quay hàng tồn kho,\nvà hàng tồn kho cao hơn, là mẫu số. Do đó, tỷ lệ hàng tồn kho của công ty\nsẽ thấp hơn khi sử dụng FIFO so với LIFO.\n(Lựa chọn A) Tỷ lệ hiện tại cao hơn đối với các công ty báo cáo trong FIFO trong thời gian chi phí hàng tồn kho\ntăng, vì hàng tồn kho lớn hơn và nợ ngắn hạn không thay đổi.\n(Lựa chọn B) Tỷ suất lợi nhuận gộp cao hơn đối với các công ty sử dụng FIFO trong thời gian tăng\nchi phí hàng tồn kho, vì giá vốn hàng bán thấp hơn dẫn đến lợi nhuận gộp cao hơn và doanh thu không thay đổi\nkhông thay đổi.\nNhững điều cần nhớ:\nVì một công ty sử dụng FIFO tính giá vốn hàng bán của mình với các đơn vị cũ nhất được mua, trong\nthời kỳ chi phí hàng tồn kho tăng, các đơn vị rẻ nhất sẽ được sử dụng trong giá vốn hàng bán. Điều này dẫn đến\ngiá vốn hàng bán thấp hơn và hàng tồn kho trung bình cao hơn, do đó, tỷ lệ vòng quay hàng tồn kho thấp hơn.\nTính toán và giải thích lạm phát và giảm phát chi phí hàng tồn kho ảnh hưởng đến báo cáo tài chính\nvà tỷ lệ của các công ty sử dụng các phương pháp định giá hàng tồn kho khác nhau\nLOS","qhtml":null},{"n":69,"q":"An analyst compiles the following financial data for two companies:\nSelected Financial Data\nCompany A ($ millions)\nCash and cash equivalents 300 Accounts payable 140\nMarketable securities 60 Taxes payable 40\nAccounts receivable 90 Short-term debt 420\nInventories 240\nCompany B\nCash ratio 0.56\nQuick ratio 0.85\nCurrent ratio 1.09\nBased only on this data, which ratio indicates that Company A has a greater risk of being\nunable to meet its short-term obligations than Company B?","opts":["Cash ratio","Quick ratio","Current ratio"],"ans":"B","expl":"Các tỷ lệ trên bảng cân đối kế toán chẳng hạn như tỷ lệ thanh khoản có thể cung cấp một số thông tin chuyên sâu về tình hình tài chính ngắn hạn và dài hạn\ncủa công ty. Tỷ lệ thanh khoản phản ánh khả năng của một công ty\ntrong việc đáp ứng các khoản nợ ngắn hạn bằng cách sử dụng tài sản ngắn hạn của mình.\nTrong trường hợp này, tỷ lệ thanh khoản của hai công ty đang được so sánh. Tỷ lệ thấp hơn cho thấy\nrủi ro lớn hơn mà một công ty có thể gặp khó khăn trong việc đáp ứng các nghĩa vụ ngắn hạn của mình (tức là công ty\ncó nhiều rủi ro thanh khoản hơn vì công ty có ít tài sản sẵn có hơn để \"trang trải\" các khoản nợ của mình). Công ty\nTỷ lệ thanh toán nhanh của công ty A có thể được tính như sau:\nTỷ lệ thanh toán nhanh 0,75 của Công ty A nhỏ hơn tỷ lệ thanh toán nhanh 0,85 của Công ty B. Điều này cho thấy\nCông ty A có giá trị tài sản ngắn hạn ít hơn so với các nghĩa vụ ngắn hạn và\nnguy cơ không thể đáp ứng các nghĩa vụ ngắn hạn của mình cao hơn Công ty B.\n(Lựa chọn A) Tỷ lệ tiền mặt 0,60 của Công ty A lớn hơn tỷ lệ tiền mặt 0,56 của Công ty B.\nTỷ lệ này cho thấy Công ty A có ít rủi ro hơn khi không thể thực hiện được đáp ứng các nghĩa vụ ngắn hạn của mình.\n(Lựa chọn C) Tỷ lệ thanh toán hiện thời của Công ty A là 1,15 lớn hơn tỷ lệ thanh toán hiện thời của Công ty B là\n1,09. Tỷ lệ này cho thấy Công ty A có ít rủi ro hơn khi không thể đáp ứng các nghĩa vụ\nngắn hạn của mình.\nNhững điều cần nhớ:\nTỷ lệ thanh khoản có thể cung cấp cái nhìn sâu sắc về khả năng đáp ứng các khoản nợ ngắn hạn\nbằng cách sử dụng tài sản ngắn hạn của công ty. Tỷ lệ thấp hơn cho thấy rủi ro lớn hơn là một công ty có thể gặp khó khăn trong việc\nđáp ứng các nghĩa vụ ngắn hạn của mình vì công ty có ít tài sản hơn để \"trang trải\" các khoản nợ của mình.\nTính toán và giải thích các bảng cân đối kế toán thông thường và các tỷ số tài chính liên quan\nLOS","qhtml":null},{"n":70,"q":"A country's legislature appoints the head of its central bank. In addition, the country's finance\nminister is charged by law to set the definition of, and the acceptable level of, inflation for the\ncentral bank. This central bank most likely has:","opts":["target independence.","operational independence.","both target and operational independence."],"ans":"B","expl":"Nhiều ngân hàng trung ương và các nhà hoạch định chính sách của chính phủ tin rằng cách tốt nhất để duy trì sự ổn định về giá\nlà nhắm mục tiêu một mức hoặc phạm vi lạm phát rõ ràng . Ở nhiều nền kinh tế, khuôn khổ\nlạm phát mục tiêu là nền tảng của chính sách tiền tệ và kinh tế vĩ mô.\nSự độc lập của ngân hàng trung ương được cho là có thể bảo vệ việc quyết định và thực hiện chính sách\nkhỏi áp lực chính trị, làm tăng hiệu quả chính sách. Ngân hàng trung ương có thể:\nmục tiêu độc lập và do đó có thể xác định tỷ lệ mục tiêu hoặc phạm vi lạm phát;\nđộc lập về mặt hoạt động, do đó ngân hàng có thể xác định cách tiếp cận chính sách và các công cụ được sử dụng để\ntiếp cận/duy trì mục tiêu;\ncả mục tiêu và hoạt động độc lập; hoặc\nkhông có mục tiêu cũng như không độc lập về mặt hoạt động.\nTrong trường hợp này, nhiệm vụ của ngân hàng trung ương là duy trì mục tiêu lạm phát được giao bởi\nbộ trưởng tài chính, người bị ràng buộc bởi luật pháp để đặt ra định nghĩa và mức độ lạm phát có thể chấp nhận được\n. Do đó, ngân hàng trung ương này có độc lập hoạt động nhưng không độc lập về mục tiêu\n(Lựa chọn A và C).\nMột số ngân hàng trung ương vừa độc lập về hoạt động vừa độc lập về mục tiêu. Các ngân hàng\ntrung ương như vậy không chỉ có khả năng linh hoạt trong việc lựa chọn các công cụ chính sách tiền tệ để duy trì sự ổn định giá\nmà còn có thể xác định định nghĩa về lạm phát, tỷ lệ lạm phát mà họ\nmục tiêu và thời hạn để đạt được mục tiêu.\nNhững điều cần nhớ:\nSự độc lập của ngân hàng trung ương với chính phủ được coi là một chỉ báo về tiền tệ\nhiệu quả chính sách. Mục tiêu của chính sách tiền tệ đối với hầu hết các ngân hàng trung ương là duy trì sự ổn định về giá\n; Một cách tiếp cận là sử dụng mục tiêu lạm phát. Ngân hàng trung ương có thể có sự độc lập\nmục tiêu (khả năng xác định mục tiêu lạm phát); tính độc lập trong hoạt động (khả năng\nxác định việc thực hiện chính sách của mình); cả hai loại độc lập; hoặc không loại nào.\nMô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất và\nnhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ\nLOS","qhtml":null},{"n":71,"q":"A company acquires an asset that has a cost of ¥90 million, a useful life of 3 years, and zero\nsalvage value. The asset will be abandoned at the end of 3 years. The company does not pay\ndividends. All else being equal, expensing the cost of this asset, instead of capitalizing it,\nwill most likely result in:","opts":["higher return on equity at the end of the first year.","lower cash from investing activities in the first year.","the same retained earnings at the end of the asset's useful life."],"ans":"C","expl":"Việc chi tiêu một tài sản sẽ ghi lại toàn bộ chi phí của nó trên báo cáo thu nhập khi tài sản đó được\nmua. Ngược lại, việc vốn hóa một tài sản ban đầu ghi lại toàn bộ chi phí của nó như một tài sản dài hạn\ntrên bảng cân đối kế toán và sau đó phân bổ chi phí khấu hao của nó vào báo cáo thu nhập\ntrong suốt thời gian sử dụng hữu ích của tài sản đó.\nDo sự khác biệt về thời gian này, việc chi tiêu dẫn đến thu nhập ròng ban đầu thấp hơn và thu nhập ròng\nròng cao hơn trong những năm tiếp theo. Ngược lại, thu nhập ròng đồng đều hơn mỗi năm trong suốt thời gian sử dụng hữu ích của tài sản\nkhi chi phí của nó được vốn hóa. Tuy nhiên, tổng thu nhập ròng trong suốt vòng đời của tài sản\nlà như nhau theo cả hai phương pháp. Vì thu nhập giữ lại là sự tích lũy của\nthu nhập ròng, ròng của bất kỳ cổ tức nào được trả (trong trường hợp này là bằng 0), thu nhập giữ lại vào cuối\nvòng đời của tài sản đều giống nhau cho dù tài sản đó được vốn hóa hay chi phí.\nVí dụ: giả sử công ty này bắt đầu hoạt động vào Năm 0 với 200 triệu yên tiền mặt và\nmua tài sản vào Năm 1. Hơn nữa, giả sử tài sản tạo ra doanh thu hàng năm\n100 triệu yên, như được hiển thị:\nNếu được tính vào chi phí, toàn bộ chi phí 90 triệu yên sẽ được ghi nhận là thu nhập ròng trong Năm 1. Nếu được viết hoa,\n90 triệu yên sẽ xuất hiện trên bảng cân đối kế toán trong phần Tổng PPE trong Năm 1 và sau đó làm giảm\nthu nhập mỗi năm xuống 30 triệu yên (trước đó tax) trong khấu hao (giả sử phương pháp\nđường thẳng được sử dụng). Vào cuối 3 năm, thu nhập giữ lại trong cả hai kịch bản bằng 168 yên\ntriệu.\n(Lựa chọn A) Việc chi tiêu (so với vốn hóa) một tài sản dẫn đến ROE thấp hơn (= thu nhập ròng\n/ vốn chủ sở hữu trung bình của cổ đông) trong năm đầu tiên kể từ khi thu nhập ròng của Năm 1 giảm theo tỷ lệ\nso với cổ đông trung bình vốn chủ sở hữu.\n(Lựa chọn B) Việc chi tiêu một tài sản dẫn đến dòng tiền lớn hơn từ hoạt động đầu tư vì\ntoàn bộ chi phí, là dòng tiền âm, được phản ánh bằng tiền từ hoạt động kinh doanh.\nNhững điều cần nhớ:\nChi phí hoặc vốn hóa việc mua tài sản ban đầu ảnh hưởng đến kết quả tài chính của công ty\ntheo cách khác nhau, nhưng tác động tích lũy đến thu nhập giữ lại theo cả hai các phương pháp đều giống nhau\ntheo thời gian.\nPhân tích và giải thích các thông tin công bố trên báo cáo tài chính liên quan đến tài sản, nhà xưởng, thiết bị và\ntài sản vô hình\nLOS","qhtml":null},{"n":72,"q":"A company sells a machine with a carrying amount of $500,000 and incurs a loss of\n$100,000. The accumulated depreciation on the machine at the time of sale is $200,000.\nWhat is the most likely impact on the financial statements?","opts":["Cash flows from investing activities increase by $400,000.","Cash flows from operating activities decrease by $100,000.","The gross book value of noncurrent assets is reduced by $300,000."],"ans":"A","expl":"Lãi (lỗ) khi bán tài sản = Giá bán − Giá trị ghi sổ\nGiá bán = Lãi (lỗ) khi bán tài sản + Giá trị ghi sổ\n= (100.000) + 500.000 = 400.000\nCác công ty thường xử lý tài sản dài hạn (ví dụ: thiết bị) bằng cách bán chúng. Lãi\n(lỗ) khi bán là chênh lệch giữa tiền bán hàng và số tiền còn lại\ncủa tài sản (= Giá gốc − Khấu hao lũy kế) tại thời điểm bán. Số tiền còn lại\ncũng có thể được gọi là giá trị sổ sách ròng.\nTrong trường hợp này, giá trị còn lại của tài sản là 500.000, do đó khoản lỗ 100.000 từ việc bán nó\nngụ ý số tiền thu được từ việc bán hàng là 400.000.\nCông ty lẽ ra đã ghi nhận:\nmột khoản lỗ về 100.000 USD từ việc bán tài sản, sẽ được báo cáo trên báo cáo thu nhập\n,\nviệc loại bỏ 500.000 tài sản dài hạn khỏi bảng cân đối kế toán và\nsự gia tăng dòng tiền từ khoản đầu tư 400.000 trên báo cáo lưu chuyển tiền tệ.\n(Lựa chọn B) Dòng tiền từ hoạt động kinh doanh không bị ảnh hưởng bởi lỗ từ việc bán\ndo việc xử lý tài sản dài hạn được coi là một hoạt động đầu tư. Lưu ý rằng CFO\nchủ yếu được hiển thị ở định dạng gián tiếp, là bảng đối chiếu giữa thu nhập ròng\nvà CFO. Mặc dù lợi nhuận (lỗ) sẽ được trừ (thêm) vào thu nhập ròng, nhưng nó chỉ nhằm mục đích đối chiếu\nvà không thể hiện sự thay đổi thực tế của CFO.\n(Lựa chọn C) Tổng giá trị sổ sách của tài sản không lưu hành sẽ bị giảm đi bởi\nchi phí lịch sử của máy, là 700.000 USD (= 500.000 USD + 200.000 USD).\nNhững điều cần nhớ:\nCác công ty thường xử lý tài sản dài hạn bằng cách bán chúng. Lãi (lỗ) từ việc bán là\nchênh lệch giữa số tiền thu được từ việc bán và giá trị còn lại của tài sản tại thời điểm\nbán. Tiền thu được từ việc bán được báo cáo theo dòng tiền từ hoạt động đầu tư.\nGiải thích và đánh giá mức độ suy giảm và ngừng ghi nhận của tài sản, nhà xưởng, thiết bị cũng như\ntài sản vô hình ảnh hưởng đến báo cáo tài chính và các tỷ số\nLOS","qhtml":null},{"n":73,"q":"An analyst compares the risk of Portfolio A to Portfolio B over the last four years and gathers the\nfollowing
