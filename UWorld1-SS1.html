UfSL19/dXjUBw+2w749/nla6X2tyef8ar+61EIuF6O63epHeVI+nGMKzz/eZGytsjZLPZdY61cKlNl5arSnaWSiX3ee4mfvKXlNwSAABAA+nY20VMofW1lgmHw5sYyrDn+vv7XTKJU4ld5lJ6sVjMjViSr0e524D3J7SFZKdbIGiHJu5AVOKw/hXlmitOAvZcMBi0cowbfmtVjHK57NYII04CICpxAAAAIrekNqjE7U5rmW3XaGvXQ+3XN19SLpez6dYupeTvJQFoaylMBrQQLUENsqJcy6zwBWgX2366Tj82oKRqXT/KcABEJQ4AAEDkltQeo7ybtBIHaE9zS1aJq624UYMDIDoIAAAAiEocAAAA0RIAAADREgAAANESAAAA0RIAAADREgAAANESAAAAiJYAAACIlgAAAIiWAAAAiJYAAACIlgAAAIiWAAAAms7/D38nTya4G/t7AAAAAElFTkSuQmCC\" alt=\"exhibit\">A small country imposes a tariff on a popular imported consumer product, and an analyst\ngraphs domestic supply and demand curves for the import.\nAll else equal, and based only on the analyst's image, most likely :"}, {"n": 41, "q": "Due to a drop in demand for its product during a recession, a firm is selling at a price below\naverage variable cost. Of the following, the most appropriate profit-maximizing strategy for\nthe firm is to:", "opts": ["exit the business.", "continue to operate.", "temporarily cease production."], "ans": "C", "expl": "Firms earn economic profits when selling at unit prices ( P ) greater than average total costs\n(ATC). However, at times, market conditions result in P < ATC , and firms incur economic\nlosses . In this case, profit-maximizing/loss-minimizing action depends on whether the\nrelatively low prices are viewed as a short-run or long-run condition. The three courses of\naction are to:\ncontinue to operate,\ntemporarily shut down, or\nexit the market.\nIn this scenario, it is optimal to temporarily shut down, since the relatively low price is likely\na short-run condition (ie, recession). With P < AVC (average variable cost), each unit sold\nincrease the firm's losses, so the best course of action is to cease operation until P ≥ AVC.\nEven if P < ATC in the short run, as long as P ≥ AVC , the firm continues to operate , since\neach unit sold contributes to partially covering fixed costs (Choice B) .\nWhereas short-run decisions between continuing operations or shutting down depend\non P relative to AVC, the optimal long-run choice depends on P relative to ATC. P < ATC (ie,\ntotal revenue < total costs) means that a firm is accruing economic losses. If this condition is\nexpected to persist, even if P ≥ AVC (ie, total revenue ≥ variable costs), losses will\naccumulate over time and the firm will be unable to maintain financial solvency; as a result, it\nshould exit the market (Choice C) . These considerations apply to all market structures.\nThings to remember:\nIf P < ATC and this is viewed as a short-run condition, firms have two alternatives: continue\noperations or temporarily shut down until prices can rise. When P < AVC, firms should\ntemporarily shut down.\nDetermine and interpret breakeven and shutdown points of production, as well as how economies\nand diseconomies of scale affect costs under perfect and imperfect competition\nLOS", "qhtml": null}, {"n": 42, "q": "An analyst wants to know if a company has decreased its risk of defaulting on its long-term\nobligations. An increase in which of the following measures is the most appropriate indicator?", "opts": ["Cash ratio", "Interest coverage ratio", "Financial leverage ratio"], "ans": "B", "expl": "Solvency ratios—both coverage and debt ratios—are used by analysts along with other metrics\nto identify the risk of companies defaulting on long-term obligations. These ratios typically\nserve to compare a company to its peers or observe the company's trends over time.\nAn interest coverage ratio measures a company's ability to cover its recurring interest\npayments with income generated from operations. Since EBIT is the numerator, a higher\nratio indicates that a company has more operating income to cover the payments and\ntherefore a decreased risk of defaulting on its long-term obligations.\n(Choice A) The cash ratio is a liquidity ratio, which measures a company's ability to cover its\nshort-term, not long-term, obligations.\n(Choice C) The financial leverage ratio, a debt ratio, measures the amount of a company's\nassets relative to its equity. A higher ratio of assets to equity indicates that more of a\ncompany's assets are funded by debt, so an increase would indicate a greater risk of default.\nThings to remember:\nSolvency ratios are used by analysts to identify a company's risk of defaulting on long-term\nobligations. The interest coverage ratio measures a company's ability to cover its recurring\ninterest payments with income generated from operations. A higher ratio indicates a reduced\nrisk of default.\nCalculate and interpret activity, liquidity, solvency, and profitability ratios\nLOS", "qhtml": null}, {"n": 43, "q": "A machine learning model treats noise in a training data set as valid parameters and\nsubsequently fails when applied in reality. This outcome is most likely a result of:", "opts": ["overfitting.", "using structured data.", "using unstructured data."], "ans": "A", "expl": "Potential errors in the machine learning process\nTreats insignificant parameters as significant parameters\nOverfit\nResults from overly precise analysis\nTreats significant parameters as insignificant parameters\nUnderfit\nResults from overly simplistic analysis\nMachine learning (ML) uses algorithms to identify patterns and relationships from\ntraining data (ie, input data) to predict outcomes for other data sets. Once a pattern is\nidentified in the training data, it is then validated and tested before being applied to real data.\nAnalysts should be aware of errors that arise from overfitting or underfitting training data\nduring the learning process. Overfitting happens when the algorithm identifies spurious\nrelationships or patterns (ie, noise) as significant, and results in identifying invalid\nrelationships when applied outside the training data.\nUnderfitting happens when the algorithm puts too little weight on valid parameters and treats\nthem as if they were noise. This overly simplistic data analysis results in important\nrelationships or patterns left undiscovered, leading to prediction errors in the future.\n(Choices B and C) Structured and unstructured data are classifications of big data, not ML\nmodel errors. Structured data refers to data that can be easily stored in a database, such as\nhistorical stock prices, company earnings, or economic statistics. Unstructured data largely\nencompasses alternative data sources such as social media postings and transaction\ninformation from point-of-sale registers in retail stores.\nThings to remember:\nMachine learning uses algorithms to identify patterns and relationships in training data to then\npredict outcomes for other data sets. Overfitting happens when the algorithm mistakes noise\nfor valid data and identifies spurious relationships or patterns as significant; underfitting\nhappens when the algorithm ignores valid data and thus fails to identify critical patterns or\nrelationships. Both errors lead to predictive failures.\nDescribe Big Data, artificial intelligence, and machine learning\nLOS", "qhtml": null}, {"n": 44, "q": "The following data is for a firm operating under perfect competition:\nQuantity produced Total economic cost (€)\n100 510\n101 511\n102 513\n103 516\n104 520\n105 525\n106 531\nIf the price per unit is €5, economic profits are maximized when the firm produces:", "opts": ["104 units.", "105 units.", "106 units."], "ans": "B", "expl": "Under perfect competition, firms face a horizontal demand curve with the market price equal to\nmarginal revenue. The level of output that maximizes economic profit is also the economic\nbreakeven, where marginal revenue (MR) equals marginal cost (MC) and average total\ncost (ATC): MR = MC = ATC. At that point, production of:\nadditional units would result in an economic loss, wherein MR < MC and ATC, and\nfewer units would result in a missed profit, wherein MR > MC.\nIn this case, profit is maximized at 105 units, the point at which MR per unit (ie, €5 market price),\nMC, and ATC are all equal.\nProduction data at a unit price of €5\nQuantity produced Total cost MC per unit MR per unit ATC per unit\n100 510 − 5 5.10\n101 511 1 5 5.07\n102 513 2 5 5.03\n103 516 3 5 5.01\n104 520 4 5 5.00\n105 525 5 5 5.00\n106 531 6 5 5.03\nNote: Although this question specifically addresses perfect competition, the condition that firms\nmaximize profits when MR = MC applies to all market structures.\n(Choice A) At 104 units of production, ATC per unit is the same as for 105 units (€5.00).\nHowever, MC (€4) is less than MR (€5) and still rising, so the firm has not yet reached maximum\neconomic profit.\n(Choice C) At 106 units of production, both MC (€6) and ATC (€5.03) are greater than MR (€5),\nso the production of the 106th unit would result in an economic loss.\nThings to remember:\nIn a market under perfect competition, economic profits are maximized when marginal revenue\nequals marginal cost and marginal cost equals average total cost.\nExplain supply and demand relationships under monopolistic competition, including the optimal\nprice and output for firms as well as pricing strategy - LOS", "qhtml": null}, {"n": 45, "q": "A retail analyst gathers a company's current-year financial results in order to forecast next\nyear's results.\n(in € millions) Current Year (actual)\nRevenue 200.00\nCOGS 80.00\nGross Profit 120.00\nSG&A 90.00\nEBIT 30.00\nThe analyst assumes that next year:\nVolume will contribute 5% to sales growth.\nPrice / mix will contribute 4% to sales growth.\nCOGS as a percentage of revenue will increase by 2 percentage points from the current\nyear.\nSG&A as a percentage of revenue will increase by 1 percentage point from the current\nyear.\nBased on this information, the analyst's most appropriate forecast is that:", "opts": ["EBIT will decrease by 12.64%.", "gross profit will be €116 million.", "organic revenue growth will be 9.00%."], "ans": "A", "expl": "A sales-based pro forma financial model is based on forecasted revenue , given its\nexpected volume growth and price growth. In this scenario, total revenue growth is 9.2% [=\n(1.05)(1.04) − 1] and next year's revenue forecast is €218.40 million.\nAfter forecasting revenue, analysts often forecast expenses (eg, COGS and SG&A) based\non percentages of revenue . It is critical to first calculate the current year's expense\npercentages and use those as a baseline for adjustments when forecasting next year's\nexpenses.\nIn this scenario, the current year's COGS is 40% of revenue, so an increase of 2% results in\n42% for next year. The current year's SG&A is 45% of revenue; a 1% increase results in 46%\nfor next year. After applying next year's expense percentages to next year's revenue, the\nending EBIT is €26.21 million. Therefore, next year's EBIT equates to a 12.64% [= (26.21 /\n30) − 1] decrease year over year. This decrease is primarily driven by expenses increasing by\nmore than revenue.\n(Choice B) A forecasted gross profit of €116 million results from incorrectly multiplying the\ncurrent year's revenue by next year's COGS percentage.\n(Choice C) Organic revenue growth of 9.00% assumes simple addition. Organic revenue\ngrowth is multiplicative [(1.05)(1.04) − 1 = 0.092, or 9.2%].\nThings to remember:\nIn a sales-based pro forma financial model, revenue is forecasted using assumptions about\nvolume growth and price changes. After forecasting revenue, analysts often forecast\nexpenses based on percentages of revenue.\nDemonstrate the development of a sales-based pro forma company model\nLOS", "qhtml": null}, {"n": 46, "q": "A mutual fund contains 250 constituent companies.\n12% of the companies are categorized as healthcare stocks.\n16% of the companies are categorized as small-cap stocks.\n4% of the companies are categorized as both healthcare and small-cap stocks.\nIf the categories are not mutually exclusive, then the probability that any constituent company\nis a healthcare or small-cap stock is closest to:", "opts": ["24.0%", "26.1%", "28.0%"], "ans": "A", "expl": "For events that are not mutually exclusive, the probability that at least one event will occur\nequals the sum of the individual events' probabilities minus their joint\nprobability (ie, P ( A and B )). The joint probability that the stock is both a healthcare stock\nand a small-cap stock is captured in the overlapping area in the diagram below. Since this\noverlapping area shares outcomes with Event A and Event B , P ( A and B ) should be subtracted\nfrom the sum of their individual probabilities to avoid double counting.\n(Choice B) 26.1% results from subtracting the product of P ( A ) and P ( B ) from the sum\nof P ( A ) and P ( B ). The joint probability of two events P ( A and B ) cannot be calculated from\nmultiplying the probabilities of two events in a non–mutually exclusive scenario.\n(Choice C) 28.0% results from failing to subtract P ( A and B ) from the sum of P ( A ) and P ( B ).\nThings to remember:\nFor events that are not mutually exclusive, the probability that at least one event will occur\nequals the sum of the individual events' probabilities minus their joint probability.\nFormulate an investment problem as a probability tree and explain the use of conditional\nexpectations in investment application\nLOS", "qhtml": null}, {"n": 47, "q": "A company reports net income of CNY 250 million and weighted average shares outstanding of\n100 million for its fiscal year. The company also has convertible bonds outstanding with a par\nvalue of CNY 120 million. The bonds pay a 10% coupon and are convertible into a total of 10\nmillion shares of common stock. If the company's tax rate is 25%, then its diluted earnings\nper share (in CNY) are closest to:", "opts": ["2.27", "2.30", "2.35"], "ans": "C", "expl": "Companies report diluted earnings per share (EPS) to show the potential effect of dilutive\nsecurities on share value. Diluted EPS indicate what a company's EPS would have been had\nall the company's potentially dilutive securities been converted into common stock .\nThe if-converted method assumes that conversion occurred at the beginning of the year.\nWhen potentially dilutive securities are converted to calculate diluted EPS, the company's\nnumber of common shares outstanding is increased , and the costs related to those now-\nconverted securities (eg, preferred dividends, bond interest) are added back to net income\navailable to common shareholders.\nIn this scenario, if the company had converted its convertible bonds to common shares at the\nbeginning of the period , its EPS would have been CNY 2.35. Since the company would not\nhave paid after-tax interest expense of CNY 9 million, this is added back to net income in the\nnumerator. It also would have issued 10 million new common shares, which increases the\nweighted average shares outstanding in the denominator.\nFigures in millions of CNY (except EPS) Basic EPS Diluted EPS\nNet Income 250 250\n+ After-tax interest expense (convertible\n- 9\nbonds)\nNumerator 250 259\nWeighted common shares outstanding 100 100\n+ New shares from debt conversion - 10\nDenominator 100 110\nEPS 250 / 100 = 2.50 259 / 110 = 2.35\nNote: After-tax interest expense = 120 convertible debt × 10% interest rate × (1 −\n25% tax rate) = 9.\n(Choice A) A calculated EPS of 2.27 would result from adding the 10 million convertible bond\nshares to the company's total shares outstanding but failing to add the interest paid on the\nconvertible bonds to net income.\n(Choice B) A calculated EPS of 2.30 would result from adding the tax paid on the convertible\nbond interest (ie, CNY 3 million) to net income instead of the after-tax amount.\nThings to remember:\nUsing the if-converted method, diluted earnings per share (EPS) are calculated assuming that\nthe conversion of potentially dilutive securities occurred at the beginning of the year. For\ncompanies with convertible debt, diluted EPS are calculated by adding back after-tax interest\ncost to net income and adding new common shares from conversion to weighted average\nshares outstanding.\nDescribe how earnings per share is calculated and calculate and interpret a company’s basic and\ndiluted earnings per share for companies with simple and complex capital structures including\nthose with antidilutive securities\nLOS", "qhtml": null}, {"n": 48, "q": "Which of the following reporting practices is most likely considered aggressive accounting?", "opts": ["Presenting pro forma earnings per share (EPS) that are lower than reported EPS.", "Capitalizing, instead of expensing, in-process research and development (R&D) costs.", "Using the criteria of available-for-sale securities, rather than trading securities, to treat bond investment gains."], "ans": "B", "expl": "Aggressive accounting vs. conservative accounting\nAggressive Conservative\nCapitalizing costs Expensing costs\nClassifying investments as Classifying investments as\ntrading securities available-for-sale securities\nPresenting better pro forma Presenting pro forma results\nresults than IFRS or GAAP results close to IFRS or GAAP results\nAccounting choices affect the quality of a company's financial\nresults. Aggressive accounting choices tend to inflate financial performance (eg, earnings, cash flow)\nin the current period but may understate performance in future periods . Conservative choices\ntypically understate performance in the current period but may enhance future performance.\nCapitalizing (instead of expensing) in-process research and development (R&D) costs in a reporting\nperiod assigns those costs to an asset on the balance sheet. They are then amortized periodically as an\nexpense on the income statement. The capitalization of a cost will produce:\nhigher net income in the current period since the entire cost is not expensed immediately, but\nlower net income in future periods since the remaining cost is expensed over time.\nTherefore, capitalization is an aggressive accounting choice. R&D costs should\nbe capitalized only when the product is reasonably certain to generate future revenue and is no\nlonger considered to be in process .\n(Choice A) Pro forma earnings typically include numerous management adjustments (ie, add-backs)\nthat cause them to differ from reported earnings (ie, those under GAAP or IFRS). In general,\nmanagement presents pro forma earnings that are higher than reported earnings and therefore\nconsidered aggressive.\n(Choice C) When bond investments are treated as available-for-sale securities, any gains in fair value\nare included in other comprehensive income on the balance sheet instead of going directly to net income\n(earnings). Therefore, this treatment is a conservative choice.\nThings to remember:\nAggressive accounting choices tend to inflate financial performance (eg, earnings, cash flow) in the\ncurrent period but may understate performance in future periods. Conservative accounting choices\ntypically understate performance in the current period but may enhance future performance.\nCapitalizing in-process research and development costs is considered an aggressive accounting choice.\nExplain the difference between conservative and aggressive accounting\nLOS", "qhtml": null}, {"n": 49, "q": "If a central bank wants to increase the money supply, the most appropriate action it can take\nis to:", "opts": ["increase the policy rate.", "reduce the reserve requirements.", "sell government bonds to commercial banks."], "ans": "B", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market Trade securities (usually government Buy\nSell securities\noperations securities) securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nSet percentage of bank deposits held in\nReserve requirements Decrease Increase\nreserves\nIn a system of fractional reserve banking, reserve requirements are one policy tool used by\ncentral banks to control the money supply and, in turn, spending and economic growth.\nReserve requirements set the minimum percentage of commercial banks' deposit liabilities\nthat must be held as reserves; banks make loans with the excess deposits.\nLowering the reserve requirements for commercial banks allows those banks to lend\nmore money . In theory, this should increase the money supply since additional money\nlent by banks can be deposited and lent multiple times.\nThus, there is an inverse relationship between reserve requirements and the amount of money\ncreated, as reflected by the money multiplier. All else being equal, the smaller (larger) the\nreserve requirement is:\nthe larger (smaller) the money multiplier, and\nthe more (less) money is created by fractional reserve banking, and\nthe greater (smaller) the money supply.\n(Choice A) Increasing the policy rate makes taking out short-term loans from the central\nbank more expensive for commercial banks. This typically causes commercial banks to\nincrease their own lending rates, which lowers demand for loans and reduces the money\nsupply.\n(Choice C) Selling securities to commercial banks reduces the commercial banks' reserves\nand typically makes them less willing and/or able to make loans, which reduces the money\nsupply.\nThings to remember:\nLowering the reserve requirements for commercial banks allows those banks to lend more\nmoney. In theory, this should increase the money supply since additional money that is lent\nby banks can be deposited and lent multiple times. Thus, there is an inverse relationship\nbetween reserve requirements and the amount of money created.\nDescribe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth,\ninflation, interest, and exchange rates\nLOS", "qhtml": null}, {"n": 50, "q": "In the short term, for a firm operating under perfect competition, the most appropriate point\nfor a shutdown is when:", "opts": ["marginal cost falls below average total cost.", "market price falls below average variable cost.", "average total cost equals average variable cost."], "ans": "B", "expl": "From an economic perspective, a firm breaks even when total revenues equal total economic\ncosts and economic profit is zero, or (per unit) when average revenue equals average total\ncost (ATC). Total costs include both fixed and variable costs. Marginal revenue (MR) is the\nadditional revenue generated from selling one additional unit, and marginal cost (MC) is the\ncost of producing one additional unit.\nWith perfect competition, the firm has a horizontal demand curve, and therefore MR and\naverage revenue are both equal to the market price. The breakeven point is when MR = ATC\n= MC; at this point, MR \"covers\" ATC, including fixed and variable costs.\nIn the short term, fixed costs are sunk costs since fixed costs are independent of quantity\nproduced. If the price falls so that MR < MC, the firm can continue to produce as long as MR\nis greater than or equal to average variable cost (AVC): since variable costs are still covered,\nthere is still some profit from production (Choice A) . However, if the price falls such that MR\n< MC < AVC, then the firm is not covering either its fixed or variable costs and should shut\ndown.\n(Choice C) AVC is a component of ATC and therefore will never be equal, no matter how\nmany units are produced.\nThings to remember:\nWith perfect competition, if the price falls below the breakeven so that marginal revenue (MR)\nis less than marginal cost (MC), a firm can continue to produce in the short term as long as\nMR is greater than or equal to average variable cost (AVC): since variable costs are still\ncovered (and fixed costs are sunk costs), there is still some profit from production. However,\nif the price falls such that MR < AVC, the firm should shut down.\nDetermine and interpret breakeven and shutdown points of production, as well as how economies\nand diseconomies of scale affect costs under perfect and imperfect competition\nLOS", "qhtml": null}, {"n": 51, "q": "An analyst compares the performance of portfolios that receive annual contributions in\naddition to earning returns. The analyst most appropriately uses a(n):", "opts": ["internal rate of return.", "time-weighted rate of return", "money-weighted rate of return."], "ans": "B", "expl": "A time-weighted rate of return (TWR) is more appropriate for comparing portfolios since its\ncalculation neutralizes the impact on performance when the portfolio's market value changes\ndue to investor contributions or withdrawals rather than the returns that the investment itself\ngenerates. Contributions increase the market value of the investment but should not be\nincluded as part of the investment's performance. The TWR neutralizes contributions by\nsplitting a performance period into smaller sub-periods each time contributions are made.\nA TWR is found by geometrically linking each sub-period's holding period return. This results\nin a compounded growth rate.\n(Choices A and C) A money-weighted rate of return (MWR) is an application of the internal\nrate of return. The MWR includes all the cash flows, including contributions to and\nwithdrawals from a portfolio, by equating the present value of the investor's cash outflows to\nthe present value of the investor's cash inflows. Therefore, it does not calculate just the\nreturn from the portfolio's actual earnings.\nThings to remember:\nAnalysts prefer the time-weighted rate of return to compare the performance of portfolios\nsince its calculation neutralizes the impact on performance when there are changes in the\nportfolio's market value due to contributions rather than returns. It neutralizes the impact of\ncontributions by splitting a performance period into smaller sub-periods each time there is a\ncontribution.\ncompare the money-weighted and time-weighted rates of return and evaluate the performance of\nportfolios based on these measures\nLOS", "qhtml": null}, {"n": 52, "q": "A company reports the following data (in millions):\nIncome statement Indirect cash flow statement\nNet sales $1,500 Net income $200\nCost of goods sold 800 Depreciation and amortization 150\nAdjustments for changes to net\nworking capital:\nGross profit 700 Increase in inventory −10\nSales and wage expenses 250 Decrease in accounts receivable 20\nDepreciation and amortization 150 Decrease in wages payable −15\nOperating income 300 Decrease in accounts payable −5\nInterest expense 50 Increase in interest payable 0\nTax expense 50 Increase in taxes payable 5\nNet income 200 Cash from operating activities 345\nBased on only this information, the cash paid to suppliers (in $ millions) reported on the\ncompany's cash flow statement in the direct format would be closest to:", "opts": ["785", "805", "815"], "ans": "C", "expl": "Components of direct cash flow statement\nCash received from customers Revenue − Δ accounts receivable\nCash paid to suppliers COGS + Δ inventory − Δ accounts payable\nCash paid to employees Wage expense − Δ wages payable\nCash paid for interest Interest expense − Δ interest payable\nCash paid for taxes Tax expense − Δ taxes payable\nNote: Δ reflects changes to balances, so signs may differ from indirect cash\nflow statement.\nCash flow from operating activities can be presented in a company's cash flow statement using\neither the direct or indirect method. The direct method displays cash inflows (eg, cash received\nfrom customers) and cash outflows (eg, cash paid to suppliers). An indirect cash flow statement\ncan be converted to the direct format by adjusting for the changes in working capital items found\non the statement.\nTo solve this question, the sources and uses of cash on the indirect cash flow statement must be\nconverted to changes of balances on the balance sheet, which are then used in the equations in\nthe main image. On the indirect cash flow statement:\nA net negative cash flow from inventory indicates an increase (ie, a positive change ) in\ninventory as purchases (ie, a use of cash) exceeded COGS. In this case, the change in\ninventory of −10 on the indirect cash flow statement indicates an increase in the inventory\nbalance on the balance sheet. This results in an increase to cash paid to suppliers of 10.\nA net negative cash flow from accounts payable indicates a decrease (ie, a negative\nchange ) in accounts payable as the company paid more to suppliers (ie, a use of cash) than\nit purchased on credit (ie, a source of cash). In this case, a change of accounts payable of\n−5 is a decrease in the accounts payable balance. This results in an increase to cash paid to\nsuppliers of 5.\nNote: since inventories are an asset while accounts payable are a liability, their signs on the cash\nflow statement indicate different directions for the change in cash.\nCash paid to suppliers = COGS + Δ inventory − Δ accounts payable\nCash paid to suppliers = 800 + 10 − (−5) = 815\n(Choice A) 785 is calculated by failing to recognize the net negative cash flow as an increase in\ninventory and the net positive cash flow as a decrease in accounts payable.\n(Choice B) 805 is calculated by failing to recognize the net positive cash flow as a decrease in\naccounts payable.\nThings to remember:\nA cash flow statement in the direct format displays cash receipts from customers and categorized\ncash costs. An indirect cash flow statement can be converted to the direct format by adjusting\nincome items for the changes in working capital items found on the statement.\nDemonstrate the conversion of cash flows from the indirect to direct method - LOS", "qhtml": null}, {"n": 53, "q": "Which of the following statements best describes an aspect of lessee accounting for operating\nleases under US GAAP? The value reported for the right-of-use (ROU) asset is:", "opts": ["reduced by periodic interest payments.", "amortized using the straight-line method.", "equal to the ending balance of the lease liability each period."], "ans": "C", "expl": "An operating lease is economically similar to a short-term rental contract. The lessor (ie,\nasset lender) grants the lessee (ie, customer) the right to use an asset for a period of time in\nexchange for scheduled lease payments.\nAt lease inception, the lessee should simultaneously recognize a lease liability and a\ncorresponding right-of-use ( ROU ) asset , each with a value equal to the PV of future lease\npayments, on the balance sheet. Over time, the balances for both the liability and the asset\nare reduced by the principal repayment portion of each lease payment (ie, amortized).\nTherefore, the ROU asset and lease liability have the same ending balances for each period.\nThe example shows the periodic amortization for a 4-year operating lease with a 7% discount\nrate and $10,000 annual lease payment. At inception, the lessee would recognize a liability\nand an asset, each equal to $33,872, which is the PV of payments. Subsequently, both the\nasset and the liability are gradually reduced by the principal payments until the balances reach\nzero at the end of the lease.\n(Choice A) For an operating lease under US GAAP, the ROU asset is amortized by the\namount of principal reduction for each lease payment, not by the interest expense paid with\neach payment.\n(Choice B) Under US GAAP, the ROU asset can be amortized using the straight-line method\nonly for a finance lease, not for an operating lease.\nThings to remember:\nAt the inception of the operating lease, the lessee would simultaneously recognize a lease\nliability and a corresponding right-of-use asset, each equal to the present value of future lease\npayments. Over time, the balances for both the liability and the asset are reduced by the\nprincipal payments. Therefore, the asset and the liability have the same ending balances for\neach period.\nExplain the financial reporting of leases from the perspectives of lessors and lessees\nLOS", "qhtml": null}, {"n": 54, "q": "An analyst compiles the following information about a company:\n20X2 20X3\nROE 16.7% 17.2%\nTotal asset turnover 1.06 1.07\nLeverage 1.53 1.61\nBased on only this information, the most appropriate conclusion is that:", "opts": ["return on assets increased and net profit margin increased.", "return on assets decreased and net profit margin increased.", "return on assets decreased and net profit margin decreased."], "ans": "C", "expl": "A company's ROE measures the level of profit, as measured by net income, the company can\ngenerate with the equity invested by shareholders. DuPont analysis breaks down ROE into\nits component factors to understand which elements are driving the company's returns.\nThe first level of DuPont analysis separates ROE into the return on assets ratio\n(ROA) and the leverage ratio. ROA is then broken down into the net profit margin and\ntotal asset turnover ratios. This process separates ROE into three elements:\nProfitability, measured by the net profit margin ratio\nEfficiency, measured by the asset turnover ratio\nLeverage, measured by the leverage ratio\nThose elements can be broken down by additional levels of DuPont analysis.\nIn this scenario, the company's ROA is determined from the ROE and leverage ratios as\nfollows:\nROE = ROA × Leverage\nROA = ROE / Leverage\nROA = 0.167 / 1.53 ≈ 10.9%\n20X2\nROA = 0.172 / 1.61 ≈ 10.7%\n20X3\nBetween 20X2 and 20X3, the company's ROA declined from 10.9% to 10.7% (Choice A) .\nThe calculated ROA can be used to determine the company's net profit margin as follows:\nROA = Net profit margin × Total asset turnover\nNet profit margin = ROA / Total asset turnover\nNet profit margin = 0.109 / 1.06 ≈ 10.3%\n20X2\nNet profit margin = 0.107 / 1.07 = 10.0%\n20X3\nBetween 20X2 and 20X3, the company's net profit margin declined from 10.3% to\n10.0% (Choice B) .\nThings to remember:\nDuPont analysis breaks down a company's ROE to identify which of its component factors are\ndriving returns. The first level of DuPont analysis separates ROE into the return on assets\nratio (ROA) and the leverage ratio. ROA can then be broken down into the net profit margin\nand total asset turnover ratios.\nDemonstrate the application of DuPont analysis of return on equity and calculate and interpret\neffects of changes in its components\nLOS", "qhtml": null}, {"n": 55, "q": "An investor is testing whether the returns of two private equity funds are uncorrelated. The\ninvestor finds that returns are asymmetrical, with an unusual number of extreme values.\nBefore calculating the correlation coefficient, which of the following steps would be most\nappropriate ?", "opts": ["Determine the distributional assumptions of both populations.", "Calculate the squared differences between ranked pairs of observations.", "Treat the effect of skewness and outliers in both data sets before using the Pearson correlation."], "ans": "B", "expl": "Hypothesis tests are used to make inferences and draw conclusions about population\nparameters, such as determining whether two variables are uncorrelated. Depending on the\ndistributional assumptions of the population, analysts may use:\nParametric tests, based on a specific distribution and known population parameters.\nThe Pearson correlation is used to calculate r , the sample correlation.\nNonparametric tests , which are typically used when few assumptions about the\nunderlying population can be made, such as when it is non-normally distributed.\nThe Spearman rank correlation coefficient is a commonly used nonparametric measure.\nIt makes no assumptions about the data set's distribution ; instead, it uses the ranked\nobservations from each non-normal distribution and the squared differences between\neach ranked pair .\nIn this instance, the investor finds that the returns are asymmetrical (ie, skewed) and that\nthere is an unusual number of extreme values (ie, outliers). Therefore, this data set\nsuggests that the variables are not normally distributed and that the investor should use\nthe nonparametric test (Spearman) instead of the parametric test (Pearson).\n(Choice A) Distributional assumptions are used only for parametric tests. Nonparametric\ntests like Spearman are based on observed data, not on assumptions about the population\nand its parameters.\n(Choice C) The analyst may transform the data to address skewness and outliers, but this\nwill not make the Pearson correlation suitable since the distribution is not normal.\nThings to remember:\nHypothesis tests can be used to determine whether two variables are uncorrelated.\nParametric tests are based on a specific distribution and typically use the Pearson correlation.\nNonparametric tests are based on the observed data and should use the Spearman rank\ncorrelation coefficient.\nExplain parametric and nonparametric tests of the hypothesis that the population correlation\ncoefficient equals zero, and determine whether the hypothesis is rejected at a given level of\nsignificance\nLOS", "qhtml": null}, {"n": 56, "q": "Assuming assets have a unimodal return distribution, which of the following assets would\nbe most appropriate for an investor aiming to maximize mean returns? An asset with an\nexpected return distribution that is:", "opts": ["symmetrical.", "positively skewed.", "negatively skewed."], "ans": "B", "expl": "Investors commonly consider the level of symmetry in a return distribution.\nFor unimodal distributions, if the return distribution is perfectly symmetrical, where\nthe arithmetic mean, median, and mode are equal, then the probability of a gain is the same\nas the probability of a loss. Skewness refers to the lack of symmetry in a distribution.\nA positively skewed return distribution has a long right tail with:\nfewer but large returns above the mean and\nfrequent but smaller returns below the mean.\nThese large returns pull the mean to the right of the mode and the median, so the mean is\ngreater than the median, which is greater than the mode. Positively skewed returns are\nmost appropriate for the investor aiming to maximize mean returns since the mean expected\nreturn is greater than for assets with symmetrical or negatively skewed distributions ,\nall else equal (Choices A and C) .\nIf a return distribution is negatively skewed, it has a long left tail: fewer but larger returns\nbelow the mean with frequent but smaller returns above the mean. The mean is less than the\nmedian, which is less than the mode, and the mean expected return is less than that for a\nsymmetrical or positively skewed unimodal distribution.\nThings to remember:\nA positively skewed return distribution has a long right tail, and the mean is greater than the\nmedian, which is greater than the mode. For positively skewed returns, the mean expected\nreturn is greater than for assets with symmetrical or negatively skewed distributions, all else\nequal.\nInterpret and evaluate measures of skewness and kurtosis to address an investment problem\nLOS", "qhtml": null}, {"n": 57, "q": "The top two companies in an industry, by market share, are merging. All else equal, under\nwhich of the following scenarios will the Herfindahl-Hirschman Index (HHI) most\nlikely overestimate market power?", "opts": ["The industry has low price elasticity of demand due to product homogeneity.", "The merged companies will have a 20% market share in a new, high-growth tech market.", "The companies will have the largest market share in an industry with low barriers to entry."], "ans": "C", "expl": "Concentration Ratio Herfindal-Hirschman Index (HHI)\nSum of the squared percentage market\nSum of percentage market\nshares of the top N companies\nshares of N largest firms\nAn industry with M firms having equal\nCalculation\n0 is perfect competition\nmarket shares has an HHI equal to 1/ M\nand 100% is monopoly\n1 is a monopoly\nSimple to compute and\nBetter measure of market power\nAdvantages\nmore intuitive\nNot a direct measure of\nmarket power\nUnaffected by top Slightly more complex and less intuitive\nincumbent mergers Does not consider the possibility of\nDisadvantages\nDoes not consider the market entry\npossibility of market entry Does not consider demand elasticity\nDoes not consider demand\nelasticity\nThe concentration ratio and Herfindahl-Hirschman Index (HHI) both measure industry market\nshare concentration. The concentration ratio measures the total market share of the top\nfirms (eg, top three) as a percentage of the entire industry's sales.\nHHI is calculated as the sum of the squared percentage market shares of the\ntop N companies. If there are M firms in an industry and each has equal market shares, the\nHHI equals (1/ M ). The HHI can better illustrate how mergers affect market power than the\nconcentration ratio. However, neither the HHI nor the concentration ratio considers the\npossibility of market entry or price elasticity of demand. Although a market may be\ndominated by a few large firms and therefore have a high concentration ratio and HHI,\nbarriers to entry may be low. Low barriers would discourage the top firms from exploiting\ntheir market power for fear of encouraging new entrants and more competition; HHI would\nlikely overestimate market power.\n(Choice A) Low price elasticity of demand would encourage the largest firms to exploit their\nmarket power: Consumers are less sensitive to price changes and may continue their buying\npatterns despite higher prices. In this case, the HHI would likely underestimate market power.\n(Choice B) A promising new technology may discourage entrants that may be unable to\nreplicate it due to patents or proprietary knowledge. In this case, HHI may underestimate the\nmerged firm's market power.\nThings to remember:\nThe Herfindahl-Hirschman Index is a useful way to measure industry concentration, but it does\nnot consider barriers to market entry or the product price elasticity of demand, both of which\nalso affect the relationship between market concentration and market power.\nIdentify the type of market structure within which a firm operates and describe the use and\nlimitations of concentration measures\nLOS", "qhtml": null}, {"n": 58, "q": "Which of the following best describes a financial tool that reinforces geopolitical cooperation?", "opts": ["The free exchange of currencies across borders.", "The US Federal Reserve's global leadership in monetary policy.", "The dominance of large banks in the international interbank market."], "ans": "A", "expl": "Geopolitical tools\nTool type Examples\nAlliances (eg, NATO)\nArmed conflict\nNational security\nEspionage\nMultilateral trade agreements (eg, NAFTA)\nEconomic\nNationalization\nFree exchange of currencies\nPermitting foreign investments\nFinancial Reducing access to local currency markets\nLimiting foreign investments\nThere are three types of geopolitical tools: national security tools, economic tools, and\nfinancial tools. Geopolitical actors can use these tools to promote global cooperation or to\nescalate conflict (ie, noncooperation). Financial tools can reduce geopolitical risk if they\nencourage economic access and/or open financial exchange.\nThe free exchang e of currencies across borders is one of the strongest examples of a\nfinancial tool that reinforces geopolitical cooperation and reduces geopolitical risk. In\naddition, allowing foreign investment encourages an increased flow of goods, services, capital,\nand labor between countries.\nAlthough the FX market benefits participating countries, it can also create systemic\nvulnerabilities:\nThe US dollar's significance in the FX market may expose other currencies to major\nchanges in US monetary policy. Specifically, tighter US monetary policy may negatively\naffect other countries' capital flows, credit growth, and bank lending via changes in\ninterest rates and FX rates (Choice B) .\nThe dominance of large players (eg, large banks) in the international interbank\nmarket may disadvantage some countries. In particular, banks located in countries that\nexperience extended periods of banking crisis or more historical bank failures may be\nseen as representing greater counterparty credit risk and thus may be excluded from\nparticipating fully in interbank activity (Choice C) .\nThings to remember:\nThe free exchange of currencies across borders is one of the strongest examples of a financial\ntool that reinforces geopolitical cooperation and reduces geopolitical risk. In addition, allowing\nforeign investment encourages an increased flow of goods, services, capital, and labor\nbetween countries.\nDescribe tools of geopolitics and their impact on regions and economies\nLOS", "qhtml": null}, {"n": 59, "q": "Under US GAAP, a company discloses interest received in advance, with a carrying amount of\n$100,000 and a tax base of $0, most likely resulting in:", "opts": ["no recognition of a deferred tax item.", "the recognition of a deferred tax asset.", "the recognition of a deferred tax liability."], "ans": "B", "expl": "Creation of deferred tax assets (DTA) and liabilities (DTL)\nBalance sheet item Scenario\nCarrying amount > Tax base → DTL\nAsset\nCarrying amount < Tax base → DTA\nCarrying amount > Tax base → DTA\nLiability\nCarrying amount < Tax base → DTL\nTemporary differences between accounting profit and taxable profit may arise from the\ntiming of recognizing certain revenues and expenses. These differences are reflected\nin deferred tax assets and deferred tax liabilities . Since the differences will be reversed\nin the future, they are considered temporary. No deferred tax item is recognized when there\nare no temporary differences.\nWhen a company receives interest in advance, as in this scenario, it records a liability on its\nbalance sheet, reflecting the receipt of cash before the interest income is earned. Since the\nliability has a carrying amount greater than its tax base, a temporary difference between\naccounting profit and taxable profit results in a deferred tax asset.\n(Choice A) There would be no recognition of a deferred tax event if the difference between\naccounting profit and taxable profit were considered permanent.\n(Choice C) The recognition of a deferred tax liability would be generated by a temporary\ndifference, either when an asset has a greater carrying amount than a tax base or a liability\nhas a greater tax base than carrying amount, but neither is the case here.\nThings to remember:\nTemporary differences between accounting profit and taxable profit may arise from the timing\nof recognizing certain revenues and expenses and are reflected in deferred tax assets and\ndeferred tax liabilities. If a liability has a carrying amount greater (or less) than its tax base,\nthis results in a deferred tax asset (or liability). No deferred tax item is recognized for\npermanent differences.\nContrast accounting profit, taxable income, taxes payable, and income tax expense and temporary\nversus permanent differences between accounting profit and taxable income\nLOS", "qhtml": null}, {"n": 60, "q": "For an economy with a floating exchange-rate regime, the impact of changes in exchange\nrates on a country's trade balance will most likely be immediately accompanied by an impact\non that country's:", "opts": ["capital flows.", "interest rates.", "money supply."], "ans": "A", "expl": "When exchange rate movements affect the trade balance, that effect must be balanced by\nan equal impact on capital flows.\nA trade surplus ( X > M ) must be balanced by a fiscal surplus ( T > G , ie, government raises\nmore taxes than it spends) and/or an excess in private saving over investment ( S > I ).\nThis surplus finances trading partners' deficits. A country with a trade deficit (ie, imports >\nexports) must either borrow from or sell assets to foreigners to finance the deficit.\nInvestors expecting a major change in exchange rates will buy (sell) an appreciating\n(depreciating) currency, and capital will flow into (out of) that country. These capital flows\nmust either:\ncoincide with a change in the trade balance (as the capital account and trade balances\nmust offset), or\nbe impeded by changes in asset prices and exchange rates.\nSpending and saving decisions and prices of goods change more slowly than asset prices and\ninvestment decisions, so the bulk of adjustments in trade occur in the financial markets. This\nallows actual capital flows to remain consistent with trade flows.\n(Choice B) Adjusting interest rates is a secondary response to a trade imbalance that occurs\nwhen a central bank within a fixed exchange-rate regime is unable to maintain the rate peg.\n(Choice C) In some countries, a central bank may react to a trade imbalance by altering the\nmoney supply, however, empirical findings have shown there is a negative relationship\nbetween money supply and the trade balance.\nThings to remember:\nExchange rate movements affecting the trade balance must be offset by capital flows. In a\ntrade surplus, excess saving finances the deficits of trading partners. The bulk of trade\nimbalances are met with rapid adjustments in exchange rates and the prices of financial\nassets.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’\ninternational trade and capital flows\nLOS", "qhtml": null}, {"n": 61, "q": "Which of the following most likely limits the effectiveness of fiscal policy in stabilizing\naggregate demand? The government's inability to:", "opts": ["run a budget deficit large enough to stimulate the economy.", "slow an overheated economy by reducing government spending.", "borrow during recessions due to investor preference for corporate debt."], "ans": "A", "expl": "Macroeconomic issues that inhibit effective fiscal policy\nHigher employment increases inflation, so\nUnemployment/inflation\npolicies to lower inflation create more\ntradeoff\nunemployment\nMarkets limit access to and/or increase cost of\nBudget deficit limits\ndebt, preventing adequate stimulus spending\nDifficult to determine accurately since\nexpansionary policy for an economy at full\nFull-employment GDP\nemployment creates inflation without increasing\ngrowth\nShortages of labor or capital prevent\nFactor constraints expansionary policy from increasing growth and\nmay result in higher inflation\nGovernment borrowing displaces private sector\nCrowding out borrowing, so reduced private spending offsets\nincreases in government spending\nStabilizing aggregate demand is a primary objective of fiscal policy. Adjustments to spending\nand tax rates are the main fiscal policy tools governments use. A variety of factors can\nimpede their success:\nRecognition, action, and impact lags\nMacroeconomic issues\nUncertainty as to:\nthe future of the economy and\nthe reaction of the private sector to policy actions\nGovernment budgets are likely to already be operating at a deficit during a recession.\nFinancial market reaction (ie, higher interest rates) or political pressure may prevent a\ngovernment from increasing the deficit by increased spending or lower tax rates. In that case,\nthe government may be unable to run a deficit large enough to stabilize aggregate demand\nand stimulate economic recovery .\n(Choice B) Government spending is a significant contributor to GDP, so reductions in\nspending result in lowering GDP. If the political will exists, government spending can be cut to\nslow an economy's rate of growth.\n(Choice C) As the most creditworthy borrower in an economy, a government usually is able\nto issue debt, even during recessions. However, excessive borrowing may increase interest\nrates and/or crowd out (displace) private borrowers.\nThings to remember:\nThe primary objective of fiscal policy is to stabilize aggregate demand. During recessions,\ngovernments may not be able to run large enough deficits to provide adequate stimulus to\ncreate economic growth.\nExplain the implementation of fiscal policy and difficulties of implementation as well as whether a\nfiscal policy is expansionary or contractionary\nLOS", "qhtml": null}, {"n": 62, "q": "An analyst uses bootstrap resampling to estimate the risk and return of an investment. One\nof the steps of the bootstrap process consists of generating random samples:", "opts": ["of different sizes, with replacement.", "from a specified probability distribution.", "that will be used to infer the statistical parameters of the population."], "ans": "C", "expl": "Simulation methods are most often used to estimate the risk and return of investment\napplications. Such techniques typically consist of generating a significant number of\nsamples , allowing analysts to test scenarios and value securities.\nBootstrap resampling is a computational tool that can be used when the\npopulation's distribution is unknown . Bootstrapping estimates population parameters based\non observed data (ie, an original sample of size n ) using the following steps:\n1. Drawing elements from the original sample, one at a time, with replacement (ie,\nreturning the element to the sample before drawing the next one)\n2. Continuing to draw until the bootstrap sample has n elements (ie, same as original\nsample size)\n3. Repeating the process multiple times, creating multiple bootstrap samples\n4. Calculating statistics of interest from the samples and inferring the population\nparameters\n5. Estimating the risk and return of the investment based on the analysis\nDue to replacement, some observations may be included in a resample more than once. This\nallows the resamples to capture the variability present in the observed data and, by extension,\nin the population being analyzed.\n(Choice A) All bootstrap samples have the same size, which is equal to the original sample\nsize.\n(Choice B) Bootstrap resampling is based on observed data . An example of a simulation\nmethod based on a specified probability distribution is Monte Carlo simulation.\nThings to remember:\nBootstrap resampling is a computational tool that estimates population parameters based on\nobserved data, drawing elements with replacement. Bootstrap resampling can be used when\nthe statistical distribution of data is unknown.\nDescribe the use of bootstrap resampling in conducting a simulation based on observed data in\ninvestment applications\nLOS", "qhtml": null}, {"n": 63, "q": "A company provides the following balance sheet information:\nCompared to the prior year, a current year common-size balance sheet would most likely show\na(n):", "opts": ["increase in current assets.", "increase in common stock.", "decrease in current liabilities."], "ans": "C", "expl": "Common-size balance sheets display each line item as a percentage of total assets .\nAnalysts often construct common-size balance sheets to compare the composition of items\nover time or across companies.\nIn this question, the respective percentages are determined by dividing the items by total\nassets. The output shows that current liabilities decreased from the prior year as a\npercentage of total assets from 13.8% to 12.5% despite increasing in amount. Similarly,\ncurrent assets and common stock increased from the prior year on an absolute basis but\ndecreased as a percentage of total assets (Choices A and B) .\nThings to remember:\nCommon-size balance sheets display each item as a percentage of total assets. Analysts often\nconstruct common-size balance sheets to compare the composition of items over time or\nacross companies.\nCalculate and interpret common-size balance sheets and related financial ratios\nLOS", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlEAAAJRCAIAAADqHnWJAABqsUlEQVR42u2d3XXiPNeGd771nMepIKaCmAowFWAqwK4AXAFQgXEFmApwKsBUgFNBnAriVPB+B/eavTSy+UkmEJLc18EsxpFlWZK1f7Ql3fzvf/8TQggh5Bfwf6wCQgghlHmEEEIIZR4hhBBCmUcIIYRQ5hFCCCGUeYQQQghlHiGEEEKZRwghhFDmEUIIIZR5hBBCKPMIIYQQyjxCCCGEMo8QQgihzCOEEEIo8wghhJAv5b/33nBzc8NaI4QQcj2cfhDsDc+MJYQQIvRtEkIIIZR5hBBCCG
