 test. These behaviors include:\ngiving or receiving information about the exam before or during the exam, and\nproviding information about the exam to others after the exam, including broad\ntopic areas tested, until it is publicly released by CFA Institute.\nIn this scenario, Himari Sato violates the Standard by disclosing information about the exam.\nEven though she did not disclose information about specific questions, she did disclose that\nthe number of questions about derivatives was at the bottom of the given range. Learning\nthis could give those who have not yet taken the exam an unfair advantage.\n(Choice A) The Standard allows Members and Candidates to share opinions that disagree\nwith CFA Institute policies (eg, allowing only two types of calculators) and stances on key\nissues (eg, advocacy articles).\n(Choice B) Members and Candidates are allowed to share opinions about the exams or CFA\nInstitute as long as the opinions do not reveal specific information about the exams.\nThings to remember:\nStandard VII(A) requires Members and Candidates to refrain from engaging in conduct that\nundermines the integrity of the CFA exam process. This includes disclosing confidential\ninformation, including specific details about questions or broad topic areas tested on the\nexam, until it is publicly released by CFA Institute.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 24, "q": "David Landry, CFA, is director of investor relations at a small-cap industrial company and has\nbeen directed by the CEO to elevate the investment profile of the company. Landry contacts\nindependent research providers regarding writing an investment research report on the\ncompany for distribution to buy-side analysts.\nLandry obtains quotes from two analysts. Nora O'Connor, CFA, proposes a variable fee\nstructure based on the number of new buy-side investors. George Novogratz, CFA, proposes a\nflat fee for the research report plus $2,500 for distributing the report to 10 of his buy-side\ncontacts. After evaluating both offers, Landry hires O'Connor.\nAccording to Standard I(B) Independence and Objectivity, the Standard was violated by:", "opts": ["Landry and O'Connor only.", "O'Connor and Novogratz only.", "Landry, O'Connor, and Novogratz."], "ans": "A", "expl": "\"Members and Candidates must use reasonable care and judgment to achieve\nand maintain independence and objectivity in their professional activities.\nMembers and Candidates must not offer, solicit, or accept any gift, benefit,\ncompensation, or consideration that reasonably could be expected to\ncompromise their own or another's independence and objectivity.\"\nStandard I(B) Independence and Objectivity requires Members and Candidates\nto avoid actions that compromise their independence and objectivity or create conflicts\nof interest .\nProducing issuer-paid research is an acceptable practice as long as the analyst conducts\nthe research with due diligence, remains independent, and discloses all conflicts. One way\nto maintain independence is to accept only a flat fee for this type of work, since a variable\nfee linked to conclusions, recommendations, or outcomes could inhibit the analyst's\nindependence and objectivity. In this scenario, Landry and O'Connor both violated the\nStandard by agreeing to tie compensation to outcomes (ie, new investors).\n(Choices B and C) Novogratz did not violate the Standard by proposing his distribution\narrangement since this compensation is not based on any specific outcome and cannot be\nseen as compromising his independence.\nThings to remember:\nStandard I(B) Independence and Objectivity mandates that Members and Candidates avoid\nactions that compromise their independence and objectivity or create conflicts of interest.\nProducing issuer-paid research is an acceptable practice if the analyst conducts the research\nwith due diligence, remains independent, and discloses all conflicts.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 25, "q": "Trevor Collins, CFA, is a financial adviser for Starlight Advisory. Some of his clients require\nadditional services outside his expertise. Collins refers clients who need life insurance to\nanother department at Starlight. The life insurance department gives Collins 10% of each\nclient's initial life insurance payment as a referral fee. Collins does not disclose this\narrangement to clients since the referral is internal to his company. Collins refers clients who\nneed advanced tax services to Accounting Hub, a third-party accounting firm. For every 10\nreferrals, Accounting Hub invites Collins to join the firm's managers in their corporate box for\na professional football game. Collins discloses to clients that he has a referral agreement with\nAccounting Hub but does not disclose the details. Collins most likely violated the Standards\nwith respect to:", "opts": ["only the internal life insurance referral.", "only the third-party advanced tax services referral.", "both the internal life insurance and third-party advanced tax services referrals."], "ans": "C", "expl": "\"Members and Candidates must disclose to their employer, clients, and\nprospective clients, as appropriate, any compensation, consideration, or\nbenefit received from or paid to others for the recommendation of products or\nservices.\"\nStandard VI(C) Referral Fees requires Members and Candidates to notify their employers,\nexisting clients, and prospective clients of any benefit they receive for recommending a\nproduct or service . Disclosing referral arrangements allows employers and clients to\ndetermine if conflicts of interest exist and whether a recommendation is impartial. A referral\nfee is broadly defined and includes any cash or noncash rewards.\nIn this question, Trevor Collins violates the Standard for both referrals since the Standard\nstipulates that all referral agreements must be disclosed. The referral for life insurance must\nbe disclosed to clients since the referral fee can cause a conflict of interest for Collins whether\nit comes from an internal or external source (Choice B) . The referral for advanced tax\nservices must be disclosed to clients with full details so clients can make informed judgments;\nit is not enough to simply disclose the existence of an agreement (Choice A) .\nThings to remember:\nMembers and Candidates must notify their employers, existing clients, and prospective clients\nof any benefit they receive for recommending a product or service. This disclosure allows\nemployers and clients to determine if conflicts of interest exist. Disclosures must include the\ndetailed arrangements of the referral and must be made regardless of whether the\narrangement is with an internal or external party.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 26, "q": "Munira Alam, CFA, is a financial adviser for Rahmi Hadi. Hadi reads a report about Force\nGaming Inc. (FGI) and calls Alam to purchase the stock. After thorough research, Alam\nconcludes that FGI is too risky for the parameters of Hadi's investment policy statement (IPS),\nalthough the amount of the proposed purchase would have only a minimal effect on his overall\nportfolio. She calls Hadi to inform him about the risk. Hadi acknowledges Alam's warning but\ninsists that FGI stock be added to his portfolio, even if the IPS must be modified. To comply\nwith the Standards, Alam should:", "opts": ["purchase FGI based on Hadi's request.", "cease her advisory relationship with Hadi.", "refuse to purchase FGI for Hadi's portfolio."], "ans": "A", "expl": "\"When Members and Candidates are in an advisory relationship with a client,\nthey must:\nb. Determine that an investment is suitable to the client's financial\nsituation and consistent with the client's written objectives, mandates,\nand constraints before making an investment recommendation or taking\ninvestment action.\nc. Judge the suitability of investments in the context of the client's total\nportfolio.\"\nStandard III(C) Suitability addresses the adviser's responsibility for assessing the suitability of\ninvestments for each client. This responsibility entails researching a client's specific\ninvestment goals, constraints, and risk tolerance. These form the building blocks of the\nclient's investment policy statement (IPS) and determine the suitability of proposed\ninvestments.\nClients sometimes wish to make investments that do not align with their IPSs . In such a\ncase, the Member or Candidate should discuss the proposed investment with the client\nbefore making the trade, explaining why the investment diverges from the IPS . If the\ninvestment has minimal impact on the portfolio, the Member or Candidate can purchase the\ninvestment without modifying the IPS after receiving the proper client approval, subject to the\nfirm's guidelines.\nIn this scenario, Munira Alam may purchase Force Gaming Inc. (FGI) stock for Rahmi Hadi's\nportfolio since she educated him on the deviation between the stock's risk profile and the IPS\nand received Hadi's acknowledgment that the position is inconsistent with his current IPS.\n(Choice B) Alam would have to consider ceasing her advisory relationship with Hadi only if\nthe unsolicited trade were material to Hadi's portfolio and he refused to update his IPS.\n(Choice C) Alam does not have to refuse to purchase FGI stock even though it does not align\nwith Hadi's IPS. Since the trade will be immaterial to Hadi's portfolio, Alam only needs to\neducate Hadi and have him acknowledge that the trade is inconsistent with his IPS.\nThings to remember:\nWhen a client requests an investment that does not align with the client's own investment\npolicy statement, the Member or Candidate should discuss the investment with the client. If\nthe investment has minimal impact on the portfolio, the Member or Candidate can purchase\nthe investment, according to the firm's guidelines, on client approval.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 27, "q": "Grace Lee, CFA, is an investment advisor at Apex Investments. After considerable research,\nLee recommends the XYZ 130/30 long/short exchange traded fund (ETF) to her retail clients\nas their primary equity exposure, if it is suitable for their portfolios. The XYZ fund invests in a\nselection of benchmark equity securities while employing leverage (130% long) and short\npositions (30% short) to arrive at an equivalent 100% long position.\nLee is very comfortable recommending the ETF, as it has historically outperformed the\nbenchmark index while exhibiting a similar level of volatility. When discussing the ETF with\nclients and prospects, Lee touts the relative outperformance and low tracking error versus the\nbenchmark, referring to it as an \"enhanced index fund.\" Lee has most likely :", "opts": ["remained in full compliance with the Standards.", "violated the Standards by not adequately disclosing the risks of the ETF.", "violated the Standards by using the ETF as equity exposure for retail clients."], "ans": "B", "expl": "\"Members and Candidates must:\nUse reasonable judgement in identifying which factors are important\nto their investment analyses, recommendations, or actions, and\ninclude those factors in communications with clients and prospective\nclients.\"\nStandard V(B) Communication with Clients and Prospective Clients requires Members and\nCandidates to inform both clients and prospective clients about the limitations\nand risks of an asset or investment process. The communications must use plain language\nthat is easy for clients to understand but also conveys enough information for them to\nrecognize the relevant risks and limitations.\nIn this instance, Lee violated the Standard by oversimplifying the exchange traded fund\n(ETF) as an \"enhanced index fund,\" which inappropriately downplays the underlying risks\nassociated with the investment. Specifically, the ETF is not an index fund and employs an\nactive approach, leverage, and short positions, which should all be clearly acknowledged and\ndetailed when communicating the risks of the investment with clients and\nprospects (Choice A) .\n(Choice C) The fact that Lee uses the ETF as primary equity exposure for retail clients does\nnot specifically violate the Standard. Lee conducted considerable research before\nrecommending this investment and is acting in what she believes to be in the best interest of\nher clients. The issue is in how she communicated the favorable aspects of the investment\nbut failed to mention the considerable risks that a well-informed investor would want to know.\nThings to remember:\nStandard V(B) Communication with Clients and Prospective Clients requires Members and\nCandidates to inform both clients and prospective clients about the limitations and risks of an\nasset or investment process. The communications must use language that is easy for clients\nto understand but also conveys enough information for them to recognize the relevant risks\nand limitations.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 28, "q": "Champion Partners is an asset management firm that employs both Charterholders and non-\nCharterholders as portfolio managers. Lorraine Dubois, CFA, is a portfolio manager for\nChampion who wishes to use third-party research reports in her investment process.\nChampion's portfolio managers are allowed to use third-party research only from firms whose\nresearch is vetted by the firm's senior managers. Dubois receives a report from Dominion\nFinancial, one of the third-party research firms approved by Champion's senior managers. To\ncomply with the Standards, most likely Dubois:", "opts": ["cannot use any third-party research in her process.", "can use the research report without further due diligence.", "must conduct her own due diligence on the third-party research."], "ans": "B", "expl": "\"Members and Candidates must:\n1. Exercise diligence, independence, and thoroughness in analyzing\ninvestments, making investment recommendations, and taking\ninvestment actions.\n2. Have a reasonable and adequate basis, supported by appropriate\nresearch and investigation, for any investment analysis,\nrecommendation, or action.\"\nStandard V(A) Diligence and Reasonable Basis requires Members and Candidates who are\nmanagers or advisors to conduct thorough and diligent analysis on all investments made\non behalf of their clients. As long as they ascertain the soundness of the research, Member or\nCandidate managers or advisors may use research from:\nsecondary sources (analysis completed by another member of the same firm), or\nthird-party sources (analysis completed outside the firm) ( Choice A ).\nMembers or Candidates may trust others in the same firm to determine if\nsuch research is reliable .\nIn this scenario, Lorraine Dubois can use the third-party research she received without further\ndue diligence since the vetting was already done by the firm's senior managers. The Standard\nallows her to trust the due diligence done, so she does not need to do her own due diligence\nbefore using it (Choice C) .\nThings to remember:\nStandard V(A) requires Members and Candidates who are managers or advisors to conduct\nthorough and diligent analysis of all investments made on behalf of their clients. Using\nsecondary and third-party research is allowed. Members or Candidates may trust others\nwithin the same firm to determine if such research is reliable.\nIdentify conduct that conforms to the Code and Standards and conduct that violates the Code and\nStandards\nLOS", "qhtml": null}, {"n": 29, "q": "Dimitri Federov, CFA, is a financial adviser for Arrow Financial. One of Federov's clients,\nNatasha Popova, offers Federov the use of her vacation home next January if her portfolio\nachieves 10% return this year. Federov accepts Popova's offer without disclosing it to Arrow\nsince it is only a nonmonetary offer. Federov later joins the Safe Bank board of directors,\nwhich he discloses to Arrow. As part of his compensation, Federov will receive Safe stock\noptions for each of his clients that he enrolls as a client of Safe's trust services. Federov does\nnot disclose this arrangement to Arrow since he does not have any clients who currently need\nSafe's trust services and has not recommended them to anyone. Federov most likely violated\nthe Standards:", "opts": ["only by accepting Popova's offer without disclosing it to Arrow.", "only by failing to disclose the options compensation from Safe.", "both by accepting Popova's offer and failing to disclose the options compensation from Safe."], "ans": "C", "expl": "\"Members and Candidates must not accept gifts, benefits, compensation, or\nconsideration that competes with or might reasonably be expected to create a\nconflict of interest with their employer's interest unless they obtain written\nconsent from all parties involved.\"\nStandard IV(B) Additional Compensation Arrangements allows additional compensation\nagreements with third parties, including clients. However, Members and Candidates must\ndisclose such agreements in full and obtain written permission from all parties\ninvolved before accepting compensation that could be reasonably seen as creating\na conflict with their employers . Gifts, benefits, and other compensation do not need to be\nmonetary to require approval.\nIn this scenario, Dimitri Federov's actions violate the Standard in both arrangements. His\noptions compensation agreement with Safe Bank must be disclosed to Arrow Financial in full\nbefore he accepts it. The fact that he has not recommended Safe's trust services to his clients\nand has not received any options does not excuse him from disclosing the arrangement to\nArrow, as it could create a conflict of interest later (Choice A) .\nLikewise, his compensation agreement with Natasha Popova must be approved in writing by\nArrow before he accepts it since the Standard applies to both monetary and nonmonetary\ncompensation (Choice B) .\nThings to remember:\nStandard IV(B) requires Members and Candidates to disclose third-party compensation\nagreements in full and obtain written permission before accepting them. Such arrangements\ncan create a conflict with an employer's interest. The Standard applies to both monetary and\nnonmonetary compensation.\nEvaluate practices, policies, and conduct relative to the CFA Institute Code of Ethics and Standards\nof Professional Conduct\nLOS", "qhtml": null}, {"n": 30, "q": "Anisa Bhandari recently received notice that she passed Level I of the CFA program. She\nupdates her credentials on a popular social media platform by stating, \"CFA Candidate: Passed\nLevel I of the CFA Program.\" As Bhandari is looking for new full-time employment, she has\ndecided not to enroll for the Level II exam until her work situation is more settled and she can\nbe sure she can commit the time and energy needed to pass the exam. Did Bhandari most\nlikely violate the Standards?", "opts": ["No.", "Yes, by stating that she is a CFA Candidate.", "Yes, by stating that she passed Level I of the CFA program."], "ans": "B", "expl": "\"When referring to CFA Institute, CFA Institute membership, the CFA\ndesignation, or candidacy in the CFA Program, Members and Candidates must\nnot misrepresent or exaggerate the meaning or implications of membership in\nCFA Institute, holding the CFA designation, or candidacy in the CFA Program.\"\nStandard VII(B) Reference to CFA Institute, the CFA Designation, and the CFA Program\nregulates how Members and Candidates may use the CFA designation. Candidates are those\nwho have:\nregistered with CFA Institute and are enrolled to sit for an exam , or\nsat for an exam and are awaiting results .\nSince Anisa Bhandari has received her results but has not registered for the next\nscheduled exam, she is no longer considered an active Candidate (Choice A) . When Bhandari\nsuccessfully registers for Level II, she can consider herself a Candidate again.\n(Choice C) Candidates may disclose their prior participation in the CFA program or may\nfactually state that they passed a certain exam. Language such as \"Passed Level I of the CFA\nProgram\" is acceptable.\nThings to remember:\nStandard VII(B) regulates how Candidates disclose their participation in the CFA program.\nCandidates may reference their candidacy for a future exam only if they are registered and\nenrolled.\nExplain how the practices, policies, and conduct do or do not violate the CFA Institute Code of\nEthics and Standards of Professional Conduct\nLOS", "qhtml": null}, {"n": 31, "q": "An independent auditor determines that a company's financial statements are fairly presented\nexcept that the company's records regarding accounts payable are materially incomplete. The\nauditor will most appropriately give an opinion that is:", "opts": ["adverse.", "qualified.", "unqualified."], "ans": "B", "expl": "Regulatory agencies usually require that publicly traded companies have their annual financial\nreports audited by an independent accounting firm; the auditor provides an opinion designated\nas unqualified, qualified, or adverse based on the audit's conclusions. Auditors use sampling\ntechniques with an overall goal to:\nprovide reasonable assurance that the financial statements are free from material errors\nor misstatements and\ndetermine whether the financial statements have been prepared in accordance with the\napplicable accounting standards (eg, US GAAP, IFRS).\nThe auditor then gives an opinion based on what is sampled. A qualified opinion is used\nwhen financial statements are largely presented fairly but:\nthe audit is limited in scope (eg, incomplete records) or\nthere is an exception from the applicable accounting standards .\nA qualified audit opinion suggests that a company's financial statements are less reliable than\nstatements with an unqualified, or \"clean,\" opinion. In this situation, the auditor appends the\nopinion with additional details explaining the exception so users of the financial statements\ncan decide whether the exception is important.\n(Choice A) An adverse opinion is given when an auditor determines that a company's\nfinancial statements differ materially from applicable accounting standards in a way that would\naffect investors' decision-making.\n(Choice C) An unqualified opinion is given when an auditor deems that the financial reports\nare fairly presented in all respects and in accordance with applicable accounting standards.\nThings to remember:\nAn audit concludes with the auditor's assignment of an unqualified, qualified, or adverse\nopinion to financial reports, which depends on the reports' scope, quality, and adherence to\naccounting standards. A qualified audit opinion implies that the audit was limited in scope\n(eg, incomplete records) or there was an exception from the applicable accounting standards.\nCompanies prefer to receive an unqualified audit opinion.\nDescribe the importance of regulatory filings, financial statement notes and supplementary\ninformation, management’s commentary, and audit reports\nLOS", "qhtml": null}, {"n": 32, "q": "Which of the following best describes a mechanism that disciplines financial reporting quality?", "opts": ["Auditors seek to detect and prevent fraud.", "Debt covenants require high-quality reporting.", "FASB and IASB set, but do not enforce, financial reporting standards"], "ans": "C", "expl": "Primary mechanisms that enhance financial reporting discipline\nRecognize and enforce disclosure standards applicable to all\nRegulators\ncompanies\nOpinions that statements comply with standards and fairly present\nAuditors\nthe company's finanical condition\nFeatures such as debt covenants create special financial reporting\nInvestors\nrequirements to aid creditors\nWhile the market itself disciplines the financial reporting of companies to be low risk and high\nquality, so too do regulators, auditors, and investors. Standard-setting organizations ,\nsuch as FASB and ISAB , are self-regulated organizations that are responsible for developing\nand issuing accounting standards . These organizations establish the principles and\nguidelines that prescribe the preparation and presentation of financial statements and\nthus set the standards for financial reporting quality . Generally, these organizations have\nno authority to enforce these standards, which is typically a responsibility of regulatory\nauthorities.\n(Choice A) Auditors review financial statements to verify compliance with accounting\nstandards. However, auditors can only work from data provided by the company and may not\nbe able to discipline financial reporting quality based on manipulated data.\n(Choice B) Debt covenants allow lenders to monitor the borrower's financial condition.\nHowever, this may motivate borrowers to manipulate financial results to avoid breaching debt\ncovenants.\nThings to remember:\nStandard-setting organizations, such as FASB and ISAB, are self-regulated organizations that\nare responsible for developing and issuing accounting standards that prescribe financial\nreporting quality. Contractual arrangements such as debt covenants can actually\nproduce poor reporting quality, while auditing has inherent limitations.\nDescribe mechanisms that discipline financial reporting quality and the potential limitations of\nthose mechanisms\nLOS", "qhtml": null}, {"n": 33, "q": "An investment has an effective annual rate of 7.7% with monthly compounding. Its stated\nannual rate is closest to:", "opts": ["7.44%", "7.70%", "7.97%"], "ans": "A", "expl": "If an investment's return is compounded more than once per year, then the investor's effective\nannual rate (EAR) of return is greater than the stated annual rate of return. All else being\nequal, the more frequently a return is compounded , the greater the return for the\ninvestor, as measured by the EAR.\nIn this scenario, since 7.44% is less than the EAR, it is the only possible correct answer. To\ncalculate the stated annual rate associated with an EAR of 7.7% with monthly compounding,\nrearrange the EAR formula and substitute as follows:\nTo convert a monthly periodic rate to a stated annual rate, multiply the monthly rate by 12.\nTherefore, the annual stated rate is 12 × 0.62% = 7.44%\n(Choice B) 7.70% is the EAR. If the periodic rate is compounded more than once per year,\nthe EAR must be greater than, not equal to, the stated annual rate.\n(Choice C) 7.97% results from mistakenly swapping the EAR and the periodic rate in the\nformula.\nThings to remember:\nIf an investment's return is compounded more than once per year, then the investor's effective\nannual rate of return is greater than the stated annual rate of return. All else being equal, a\ngreater number of compounding periods means a greater return for the investor, based on a\ngiven stated annual rate.\nCalculate and interpret annualized return measures and continuously compounded returns, and\ndescribe their appropriate uses - LOS", "qhtml": null}, {"n": 34, "q": "An analyst conducts two hypothesis tests using different samples. The null and alternative\nhypotheses are the same for each test:\nH : population mean is less than or equal to zero\n0\nH : population mean is greater than zero\na\nThe tests are at the 0.05 significance level, and the critical value is 1.685. In Test 1, the value\nof the test statistic is 1.745, and in Test 2 the p -value is 0.0027. Assume that the probability\nof an outcome less than 1.745 is 95.95%. Test 2's evidence to reject the null hypothesis\nis most likely :", "opts": ["weaker than Test 1's evidence.", "the same as Test 1's evidence.", "stronger than Test 1's evidence."], "ans": "C", "expl": "For a given hypothesis test, the p -value is the probability of an outcome more extreme than\nthe resulting test statistic. For example, in Test 1, the test statistic is 1.745. Considering\na one-tailed test and assuming the probability of an outcome less than 1.745 is 0.9595, the\nprobably of an outcome greater than 1.745 is 1 − 0.9595 = 0.0405. Thus, the p -value\ncorresponding to a test statistic of t = 1.745 is p = 0.0405.\nThe p -value is useful since it can be compared directly to the critical value to determine:\nthe outcome of the hypothesis test, and/or\nthe strength of the evidence to reject the null hypothesis (ie, a lower value means that\nthere is more evidence to reject the null).\nIn this scenario, the level of significance is α = 0.05. In Test 1, p = 0.0405, which is less\nthan α, so the result of the test is to reject the null hypothesis. In Test 2, p = 0.0027. The p-\nvalue for Test 2 is much less than for Test 1, so the Test 2 confidence level of 1 − 0.0027 =\n0.9973 is much higher than for Test 1. The appropriate conclusion is that Test 2 provides\nstronger evidence to reject the null hypothesis (Choices A and B) .\nThings to remember:\nFor a given hypothesis test, the p -value is the probability of an outcome more extreme than\nthe test statistic. The p -value is useful since it can be compared directly to the critical value to\ndetermine the outcome of the hypothesis test and/or the strength of the evidence to reject the\nnull hypothesis.\nConstruct hypothesis tests and determine their statistical significance, the associated Type I and\nType II errors, and power of the test given a significance level\nLOS", "qhtml": null}, {"n": 35, "q": "In an oligopoly market producing homogeneous goods, the dominant firm is also the low-cost\nproducer and has a 60% market share. There are six other competitors with approximately\nequal shares of the remaining 40% market share. All else equal, the best strategy for the\nindividual small competitors to maximize profits is to price their products:", "opts": ["below the dominant firm's price.", "equal to the dominant firm's price.", "above the dominant firm's price."], "ans": "B", "expl": "Oligopoly dominant firm price leadership\nOligopolies are market structures characterized by small numbers of\ncompetitors selling homogeneous products . The small numbers of firms and high barriers\nto entry in these markets result in individual firms having some pricing power (ie, a\ndownward-sloping industry demand curve). However, since there are so few firms, each must\nadopt pricing strategies that consider competitors' actions to maximize profits (ie,\ninterdependent pricing strategies).\nThe image illustrates an oligopolistic market with a dominant firm acting as a price\nleader (ie, price maker) and smaller competitors as price takers. The dominant company\nmaximizes profit at output levels where its marginal cost equals its marginal revenue (MC =\nDC\nMR ). The profit-maximizing pricing strategy for smaller firms is to match the dominant\nDC\ncompany's price ( P ) since any other price results in lower profits. Since all firms' products\nDC\nare good substitutes (ie, homogeneous), setting a price above the dominant firm's price\nresults in lost sales: customers will switch to other producers that have not raised\nprices (Choice C) .\nSetting a price below the dominant firm's price is potentially even riskier for smaller firms\nbecause the dominant firm/price leader is the low-cost producer. Any attempt by smaller\ncompetitors to steal market share by reducing selling prices is likely to result in a price war as\nthe dominant firm reduces its price to retain market share. And as the low-cost producer, the\ndominant firm is better able to cover its costs at lower prices than any of its smaller\ncompetitors (Choice A) .\nThings to remember:\nOligopolies are market structures characterized by small numbers of competitors selling\nhomogeneous products. In an oligopolistic market with a dominant firm acting as a price\nleader, the profit-maximizing pricing strategy for smaller firms is to match the dominant firm's\nprice since any other pricing strategy results in lower profits.\nExplain supply and demand relationships under oligopoly, including the optimal price and output\nfor firms as well as pricing strategy\nLOS", "qhtml": null}, {"n": 36, "q": "A currency trader observes the following currency spot exchange rates from two dealers:\nSource Currency Exchange Rate\nDealer 1 CNY/THB 0.22\nDealer 1 INR/THB 2.35\nDealer 2 INR/CNY 10.75\nBased on only this information, the arbitrage profit available per every CNY 1 is closest to:", "opts": ["INR 0.0682", "INR 0.0064", "CNY 0.0682"], "ans": "A", "expl": "A cross-rate is the exchange rate implied by two related exchange rates, assuming that\nno arbitrage opportunities exist. If the actual exchange rate differs from the no-arbitrage\nexchange rate implied by the cross-rate, then an arbitrage opportunity exists . An investor\ncan profit by purchasing a currency from the source where it\nis underpriced and simultaneously selling the same currency to the source where it\nis overpriced .\nFinding an arbitrage opportunity from cross-rates can be conceptualized as a triangle, as\nshown above. Potential arbitrage profits can be observed by moving from one currency to\nanother in two directions around the triangle. When moving around the triangle, one currency\nis multiplied by the actual exchange rate to convert to another currency.\nIn this scenario, the INR/CNY rate from Dealer 2 is 10.75. Using the INR/THB and CNY/THB\nrates quoted by Dealer 1, Dealer 1's INR/CNY cross-rate is 10.6818. The arbitrage profit is\nthe difference between buying CNY 1 for INR 10.6818 from Dealer 1 and simultaneously\nselling CNY 1 for INR 10.75 to Dealer 2. The profit is INR 10.75 − INR 10.6818 = INR 0.0682\nper every CNY 1 (Choice C) .\n(Choice B) 0.0064 is the potential arbitrage profit in CNY, not INR.\nThings to remember:\nIf an actual exchange rate differs from a cross-rate derived from two related exchange rates,\nan arbitrage opportunity becomes available by purchasing a currency from the underpriced\nsource and selling the same currency to the overpriced source.\nCalculate and interpret currency cross-rates\nLOS", "qhtml": null}, {"n": 37, "q": "In 20X5, a company recorded:\na restructuring charge related to workforce reduction,\na loss from disposal of capital equipment previously used in core operations, and\na loss from discontinuing a segment of its operations.\nBased only on this information, which item should least appropriately be included in operating\nincome?", "opts": ["The restructuring charge", "The loss from disposal of capital equipment", "The loss from discontinuing a segment of operations"], "ans": "C", "expl": "When a company discontinues a segment of its operations, income (loss) from\nthe discontinued operations is deemed nonrecurring and is excluded from operating\nincome . Analysts have discretion to remove the impacts of nonrecurring items to forecast\nfuture earnings more accurately and should be aware of how such items are reported. There\nare four categories of nonrecurring items:\nUnusual or infrequent items\nDiscontinued operations\nChanges in accounting policy\nChanges in scope and exchange rates\nAccounting standards prescribe that unusual or infrequent items (eg, restructuring charges\nrelated to business reorganization, gain on disposal of assets), although considered unlikely to\nrecur in the future, are material or relevant to a company's financial performance and should\nbe reported on the income statement as a part of continuing operations, before\ntaxes (Choices A and B) .\nThings to remember:\nIncome from discontinued operations is deemed nonrecurring and is not included in operating\nincome on the income statement. Unusual or infrequent items (eg, restructuring charges,\ngain on disposal of assets), although presumed to be unlikely to recur, are considered material\nto operating performance and thus are reported as a component of operating income.\nDescribe the financial reporting treatment and analysis of non-recurring items (including\ndiscontinued operations, unusual or infrequent items) and changes in accounting policies\nLOS", "qhtml": null}, {"n": 38, "q": "Which of the following most likely limits a central bank's ability to implement effective\nexpansionary monetary policy? The central bank is unable to:", "opts": ["reduce the policy interest rate below the neutral rate.", "increase the amount of excess reserves held by commercial banks.", "increase businesses and consumers' willingness to hold bank deposits."], "ans": "C", "expl": "In a system of fractional reserve banking, banks hold reserves to back their deposits. Central\nbanks directly control commercial bank reserves but not the money supply. To increase the\nmoney supply, the usual transition mechanism for expansionary monetary policy is:\ncentral banks create excess bank reserves by\nbuying securities through open market operations or\nreducing reserve requirements for commercial banks;\ncommercial banks use their excess reserves to make loans;\nborrowers use loan proceeds to make payments; and\nrecipients of the payments deposit the money into their banks.\nThe increase in deposits increases the money supply.\nHowever, the effectiveness of expansionary policy may be limited by businesses' and\nconsumers' unwillingness to hold money in bank deposits (eg, when interest rates are\nlow). Furthermore, money in deposits is exposed to the bank's credit risk, which may in turn\ncause withdrawals from the bank. This reduces the money supply and limits the effect of the\nexpansionary policy.\n(Choices A and B) Central banks face few limits on setting policy rates or creating excess\nreserves. Central banks can pursue these policies to the extent they deem appropriate, so the\ninability to reduce the policy rate or increase excess bank reserves are not impediments to\npursuing expansionary policies.\nThings to remember:\nCentral banks face few limits on reducing policy rates or creating excess reserves. A major\nconstraint on expansionary monetary policy is central banks' inability to control businesses'\nand consumers' willingness to hold bank deposits.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and\nexchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy\nLOS", "qhtml": null}, {"n": 39, "q": "A portfolio comprises two stocks, A and B, with the following characteristics:\nAll values expressed as % A B\nPortfolio weight ( w ) 40 60\nReturn 3 6\nStandard deviation ( σ ) 5 10\nIf the portfolio standard deviation equals 5.40%, the correlation between Stocks A and B\nis closest to:", "opts": ["−0.4517", "−0.0023", "0.1733"], "ans": "A", "expl": "Portfolio variance and standard deviation can be used to measure the dispersion of\nportfolio returns . A high overall variance represents a high degree of dispersion and\ntherefore high overall risk .\nA key benefit of holding a diversified portfolio is that the overall variance of a portfolio can\nbe lower than the simple weighted average of the variance of its component assets . The\nmagnitude of this effect depends on the correlation between the assets held in the portfolio.\nAs shown in the equation for the variance of a two-stock portfolio, the portfolio weights, stock\nvariances, and correlation between the stocks are used to calculate the variance.\nThe smaller the correlation's value , the smaller the portfolio variance .\nIn this scenario, the portfolio standard deviation is given. The variance must first be derived,\nthen the equation above can be used to solve for the correlation:\nThe correlation is closest to −0.4517.\n(Choice B) −0.0023 is the covariance between Stocks A and B, which is related to\ncorrelation and equals the product of the correlation and each of the standard deviations.\n(Choice C) 0.1733 is the result of incorrectly applying Stock A weights to Stock B's standard\ndeviation, and vice versa.\nThings to remember:\nIn a two-stock portfolio, all else equal, a smaller correlation value will result in a smaller\nvariance. The portfolio's variance is a function of the weight and standard deviation of each\nasset and the correlation between assets.\nCalculate expected values, variances, and standard deviations and demonstrate their application to\ninvestment problems\nLOS", "qhtml": null}, {"n": 40, "q": "A small country imposes a tariff on a popular imported consumer product, and an analyst\ngraphs domestic supply and demand curves for the import.\nAll else equal, and based only on the analyst's image, most likely :", "opts": ["Region C represents domestic producer surplus created by the tariff.", "Region A represents domestic consumer surplus created by the tariff.", "Regions B and D represent the deadweight loss to the domestic society"], "ans": "C", "expl": "The deadweight loss impact of tariffs on society\nA primary objective of tariffs on imports is to protect domestic industries. While a portion of\nthe quantity demanded for a good may be produced domestically, imports are needed to meet\nfull demand. However, tariffs reduce the quantity demanded for imported goods by\nincreasing their price (P ) above the free-trade world (P ) price.\nT W\nDue to the tariff-caused higher price, domestic production will increase (from Q to Q ),\nS0 S1\nleading to a producer surplus (ie, for Region A). A deadweight loss (ie, for Regions B and D)\nto society occurs from inefficiencies in both consumption and production :\nRegion B represents inefficiencies in production. Tariffs encourage uneconomical\ndomestic producers to enter (or remain in) the market, leading to an unproductive\nallocation of resources, which has a cost to society.\nRegion D represents inefficiency in consumption (ie, the deadweight loss to consumers).\nAfter a tariff, the price to domestic consumers rises from P to P ; thus, overall domestic\nW T\ndemand (of both imports and domestic supply) is reduced (Q − Q ). Consumers who\nD0 D1\nwere willing to pay more than P but less than P are now either unable or unwilling to\nW T\nconsume the product, so there is a deadweight loss to consumers and no consumer\nsurplus is created (Choice B) .\nThe additional tax revenue to the government generated by the tariff (Q − Q ) is\nD1 S1\nrepresented by Region C (Choice A) .\nTogether, Regions B and D represent the loss in economic activity (eg, welfare loss) of\ndomestic consumers due to tariffs that are not offset by gains to producers or the\ngovernment.\nThings to remember:\nTariffs on imports create deadweight loss to a society when they result in inefficiencies in both\nconsumption and production. The loss in consumer surplus is greater than the sum of the\ngain in producer surplus and government revenue from the tariff.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their\neconomic implications - LOS", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAw8AAAKyCAIAAAAcnXWeAABU5ElEQVR42u3dX2yb953v+Y/W6ZFTY6VQBeQYqJ2Isn3c2krSIdNtA3ubIuTFSBmgdYYEpJ6Ltjsg7ezN7NkLMnuz2ZsJn4tZnJuNTWLQ9uJEAsjGLdBIcyEa7Rx70sGJOJPENkaILSqVAzg2EDES1qh1Gq/34nv0myck9f8f/7xfF4ZIPyIfPg8f6svv9/f7/joePXokAAAArOB/4BAAAAAQLQEAABAtAQAAEC0BAAAQLQEAABAtAQAAEC0BAAAQLQEAABAtAQAAEC0BAACAaAkAAIBoCQAAgGgJAACAaAkAAIBoCQAAoPWipUKh0LEqz/PWfJB0Op1Op3t6enbzpb744osvvvgipxwAAGzIY5v+zfn5+UAg4L+nVCpJikajdjOVSq30u5lMxv27O37961//wz/8g/3wgx/8gBMPAABEJQ4AAKCxoqVQKBQKhWKxWKFQKBQKDfU6/9N/+k9VPwAAAGhHK3GrcBW6dDotqVQqVSoVV6pLJBK2QS6Xm5+fty3L5bKkZDIpqVg
