<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Which of the following best describes the purpose of the Code of Ethics for the global\ninvestment profession?","opts":["To build trust with all market participants","To set the basis for laws and regulations","To determine minimally acceptable behaviors"],"ans":"A","expl":"Công cụ tuân thủ đạo đức nghề nghiệp\nChủ sở hữu nhạc cụ mô tả\nQuy tắc đạo đức Tổ chức nghề nghiệp Nguyên tắc chung\nTiêu chuẩn ứng xử Tổ chức chuyên nghiệp Hành vi tối thiểu có thể chấp nhận được\nPháp luật và các quy định Chính phủ Các giới hạn pháp lý đối với hành vi\nQuy tắc đạo đức là tuyên bố của một tổ chức chuyên nghiệp về các nguyên tắc chung. Nó\ncung cấp la bàn đạo đức cho hành vi tập thể. Hành vi đạo đức là những hành động\nphù hợp với mong đợi của xã hội về sự trung thực, minh bạch và công bằng, cân bằng giữa các yếu tố\nlợi ích cá nhân của một người với nhận thức về hành động của mình ảnh hưởng đến người khác như thế nào.\nViện CFA đã thông qua quan điểm rằng đạo đức đối với ngành đầu tư toàn cầu nên\nmang tính phổ quát và không dựa trên luật pháp hoặc phong tục địa phương. Sự phổ biến này\ntạo ra niềm tin và tính toàn vẹn trong toàn bộ hệ thống tài chính toàn cầu. Như đã nêu ở một trong những\nnguyên tắc trong Quy tắc đạo đức của Viện CFA:\n\"Các Thành viên và Ứng viên phải:\nThúc đẩy tính toàn vẹn và khả năng tồn tại của thị trường vốn toàn cầu vì lợi ích cuối cùng\ncủa xã hội.\"\nQuy tắc đạo đức nghề nghiệp có thể có hoặc không kèm theo các tiêu chuẩn ứng xử,\ntrong khi các tiêu chuẩn ứng xử tồn tại chỉ để nâng cao quy tắc đạo đức liên quan của họ. CFA\nViện đã áp dụng cả Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp (Quy tắc\nQuy tắc và Tiêu chuẩn). Các chủ sở hữu và ứng viên CFA phải biết và tuân thủ\nvới cả hai.\n(Lựa chọn B) Trách nhiệm của chính phủ là thiết lập các giới hạn pháp lý cho hành vi\nthông qua luật pháp và các quy định. Hệ thống niềm tin được sử dụng để tạo ra các chính sách này ở một quốc gia\ncó thể khác với quốc gia khác và với các nguyên tắc đạo đức chung của một nền kinh tế toàn cầu\ntổ chức.\n(Lựa chọn C) Các tiêu chuẩn ứng xử làm rõ các hành vi được chấp nhận tối thiểu cần thiết để\ntuân thủ quy tắc đạo đức nghề nghiệp và cung cấp hướng dẫn thực hành các nguyên tắc của nó.\nNhững điều cần nhớ:\nQuy tắc đạo đức là tuyên bố về các nguyên tắc chung của một tổ chức chuyên nghiệp. Nó cung cấp\nla bàn đạo đức cho hành vi tập thể. Một thỏa thuận chung về đạo đức cho toàn cầu\nNghề đầu tư tạo ra sự tin cậy và liêm chính trong toàn bộ hệ thống tài chính toàn cầu,\ncuối cùng mang lại lợi ích cho xã hội.\nMô tả vai trò của quy tắc đạo đức trong việc xác định nghề nghiệp\nLOS","qhtml":null},{"n":2,"q":"Stella Smith, CFA, works for Aqua Investment Consulting. She is invited to share her\neconomic outlook at a conference hosted by Zenat Securities Corp., an investment\nmanagement firm used by Aqua. Zenat pays all speakers' travel expenses and entices\nspeakers by offering a free spa day during the conference. Smith most likely violates\nStandard I(B) Independence and Objectivity if she accepts Zenat's offer for:","opts":["only her travel.","only the spa day.","both her travel and the spa day."],"ans":"B","expl":"\" Thành viên và Ứng viên phải có sự quan tâm và phán đoán hợp lý\nđể đạt được và duy trì tính độc lập và khách quan trong\nhoạt động nghề nghiệp của mình. Thành viên và Ứng viên không được đề nghị,\ngạ gẫm hoặc chấp nhận bất kỳ quà tặng, lợi ích, thù lao hoặc sự cân nhắc\ncó thể làm tổn hại đến sự độc lập và khách quan của chính họ hoặc\n\"\nTính độc lập và khách quan của Tiêu chuẩn I(B) yêu cầu các Thành viên và Ứng viên tránh\ncác hành động làm tổn hại đến tính độc lập và khách quan của họ hoặc tạo ra xung đột lợi ích.\nTrong nhiều trường hợp, Thành viên và Ứng viên không nên chấp nhận thanh toán chi phí đi lại\nđể tránh bất kỳ biểu hiện nào thể hiện sự độc lập hoặc khách quan bị tổn hại.\nTrong trường hợp này, Stella Smith đã được mời phát biểu về triển vọng kinh tế tại một\nhội nghị đầu tư do Zenat Securities Corp tổ chức. khoản thanh toán để trang trải chi phí đi lại\ntrong trường hợp này không có khả năng ảnh hưởng đến tính độc lập hoặc\ntính khách quan của cô ấy (Lựa chọn A và C) .\nTuy nhiên, ngày đi spa có thể được coi là một món quà xa hoa. Vì Zenat có mối quan hệ nhà cung cấp-\nkhách hàng với công ty của Smith, Aqua Investment Consulting, nên món quà này có thể được coi là một\nnỗ lực nhằm làm tổn hại đến tính độc lập và khách quan của Smith trong việc đưa ra các đề xuất đầu tư\ncho khách hàng của Aqua.\nNhững điều cần nhớ:\nTiêu chuẩn I(B) Tính độc lập và khách quan yêu cầu các Thành viên và Ứng viên tránh những hành động\nlàm tổn hại đến tính độc lập và khách quan của họ. Việc nhận thù lao hoặc quà tặng\nngoài chi phí đi lại từ các công ty khi có mối quan hệ giữa nhà cung cấp và khách hàng có thể\ngây ảnh hưởng đến tính độc lập và khách quan đối với các khuyến nghị đầu tư.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":3,"q":"Mina Pappas, CFA, is the sole proprietor of Milos Capital, providing financial advice to high-net-\nworth clients. Pappas invests client's equity assets through a separately managed account\nstrategy consisting of a portfolio of 20 equally weighted, large-cap stocks. Part of Pappas'\nsales pitch to clients and prospects is that she invests \"alongside\" her clients by investing her\nown assets in the same strategy.\nPappas decides to sell one of the holdings and replace it with her best new idea. Pappas\nenters the buy and sell orders for all clients, including herself, and executes the trades. All\nclients receive the same execution prices, including Pappas. According to Standard VI(B)\nPriority of Transactions, Pappas most likely :","opts":["is in full compliance with the Standard.","violated the Standard by not adhering to a blackout period.","violated the Standard by not executing the client's trades first."],"ans":"A","expl":"\"Các giao dịch đầu tư dành cho khách hàng và người sử dụng lao động phải được\nưu tiên hơn các giao dịch đầu tư trong đó Thành viên hoặc\nỨng viên là chủ sở hữu hưởng lợi.\"\nƯu tiên giao dịch theo tiêu chuẩn VI(B) yêu cầu các thành viên và ứng viên\nđặt lợi ích tài chính của khách hàng và người sử dụng lao động lên trên lợi ích tài chính của họ khi thực hiện\ngiao dịch đầu tư. Không có gì lạ khi một thành viên hoặc ứng viên giao dịch\ncác khoản đầu tư giống như khách hàng hoặc thậm chí cùng với khách hàng. Thành viên hoặc Ứng viên không\nvi phạm Tiêu chuẩn với điều kiện:\nkhách hàng không bị thiệt thòi trong giao dịch,\nthành viên hoặc ứng viên không được hưởng lợi từ các giao dịch của khách hàng và\nthành viên hoặc ứng viên tuân thủ tất cả các yêu cầu quy định hiện hành.\nTrong trường hợp này, Pappas đã tuân thủ Tiêu chuẩn .\n(Lựa chọn B) Khoảng thời gian tạm dừng được thiết kế đặc biệt để ngăn chặn \"chạy trước\", nghĩa là\nđặt các giao dịch cá nhân hoặc các giao dịch độc quyền của công ty trước các giao dịch của khách hàng. Trong trường hợp này,\nbằng cách kết hợp và thực hiện tất cả giao dịch cùng một lúc, Pappas đang đầu tư cùng với khách hàng của mình, như\ncô đã thông báo trước đó. Do đó, khoảng thời gian tạm dừng không được áp dụng trong các trường hợp\n.\n(Lựa chọn C) Trong trường hợp này, khách hàng không bị thiệt thòi và Pappas cũng không được hưởng lợi từ\ngiao dịch với khách hàng; do đó, Pappas đã không vi phạm Tiêu chuẩn khi thực hiện các giao dịch của mình\ncùng với các giao dịch của khách hàng của mình.\nNhững điều cần nhớ:\nTiêu chuẩn VI(B) yêu cầu Thành viên và Ứng viên đặt lợi ích tài chính\ncủa khách hàng và người sử dụng lao động lên trên lợi ích của họ trong các giao dịch đầu tư. Tuy nhiên, việc một Thành viên hoặc Ứng viên giao dịch trong cùng một khoản đầu tư\nvới tư cách là khách hàng hoặc thậm chí cùng với khách hàng không phải là điều hiếm gặp và không phải là vi phạm.\nGiải thích cách thức các thông lệ, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử chuyên nghiệp của Viện CFA\nLOS","qhtml":null},{"n":4,"q":"Joanna Krakowski, CFA, is the chief compliance officer (CCO) at Universal Investment\nManagers (UIM). Krakowski recently hired John Smith, CFA, as a compliance manager. Smith\nwill report directly to Krakowski, who believes the current compliance systems and procedures\nare adequate.\nAs Smith settles into his new position, he discovers numerous deficiencies including outdated\nsoftware, excessive manual processes, a compliance manual that has not been updated in four\nyears, and inadequately trained and understaffed compliance personnel.\nSmith meets with Krakowski to address these shortcomings, as he does not believe he can\nadequately perform his duties given the circumstances. Krakowski informs Smith that there is\nno money in the budget for new software or additional employees. Smith's most\nappropriate action is to:","opts":["improve the compliance program using his best efforts, given his duty is to his employer.","decline his supervisory responsibilities in writing until the compliance systems are improved.","immediately submit a written resignation from UIM, since the compliance program is deficient."],"ans":"B","expl":"\"Các Thành viên và Ứng viên phải nỗ lực hợp lý để đảm bảo rằng\nbất kỳ ai chịu sự giám sát hoặc thẩm quyền của họ đều tuân thủ luật hiện hành,\ncác quy tắc, quy định và Quy tắc và Tiêu chuẩn.\"\nTrách nhiệm của Tiêu chuẩn IV(C) của Giám sát viên yêu cầu các Thành viên và Ứng viên\ngiám sát nhân viên khuyến khích hành vi tuân thủ luật pháp địa phương, các quy tắc do\ncông ty của họ thiết lập cũng như Quy tắc và Tiêu chuẩn. Họ cũng phải thực hiện các bước hợp lý để phát hiện và\nngăn chặn hành vi vi phạm. Thành viên hoặc Ứng viên gặp phải hệ thống tuân thủ không đầy đủ\nnên thông báo cho các nhà quản lý công ty về những thiếu sót của hệ thống và\nđưa ra khuyến nghị về hành động khắc phục.\nBất kỳ Thành viên hoặc Ứng viên nào không thể thực hiện trách nhiệm giám sát do những thiếu sót này\nnên từ chối nhận trách nhiệm giám sát bằng văn bản cho đến khi\nhệ thống tuân thủ được cải thiện và cho phép kiểm soát đầy đủ. Chấp nhận vai trò giám sát\nkhi hệ thống tuân thủ không đầy đủ sẽ không cho phép Thành viên hoặc Ứng viên\ngiám sát đầy đủ việc tuân thủ của cấp dưới và do đó sẽ vi phạm Tiêu chuẩn.\n(Lựa chọn A) Smith có nghĩa vụ với người sử dụng lao động của mình là cải thiện chương trình tuân thủ bằng những nỗ lực tốt nhất của mình nhưng phải từ chối trách nhiệm giám sát công việc cho đến khi công ty\ncam kết đầu tư nguồn lực thích hợp vào chương trình tuân thủ.\n(Lựa chọn C) Tiêu chuẩn không yêu cầu Thành viên hoặc Ứng viên từ chức nhưng từ chối\ntrách nhiệm giám sát công việc cho đến khi chương trình tuân thủ được cải thiện đầy đủ\n.\nNhững điều cần nhớ:\nKhi Thành viên hoặc Ứng viên gặp phải hệ thống tuân thủ không thỏa đáng, họ nên lưu ý\nnhững thiếu sót của hệ thống đến các nhà quản lý công ty và đưa ra\ncác đề xuất về hành động khắc phục. Các Thành viên và Ứng viên nên từ chối nhận\ntrách nhiệm giám sát bằng văn bản cho đến khi hệ thống tuân thủ được khắc phục và cho phép\nkiểm soát đầy đủ.\nThể hiện việc áp dụng Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp cho\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":5,"q":"If a firm chooses to verify its compliance with the GIPS standards, the verification must be\nperformed by:","opts":["an independent third party.","the firm's chief compliance officer.","the local securities market regulatory authority."],"ans":"A","expl":"Xác minh GIPS\nĐược khuyến nghị nhưng không bắt buộc\nPhải được thực hiện bởi bên thứ ba độc lập\nÁp dụng cho toàn bộ công ty, không chỉ các tổ hợp cụ thể\nTăng niềm tin vào tuyên bố tuân thủ GIPS của công ty\nTuân thủ GIPS (Tiêu chuẩn hiệu suất đầu tư toàn cầu) là tự nguyện, nhưng công ty\nphải tuân thủ đầy đủ để tuân thủ tuyên bố; không có sự tuân thủ một phần. Đối với công ty tuyên bố\ntuân thủ, Viện CFA khuyến nghị (nhưng không yêu cầu) rằng việc xác minh việc tuân thủ để\nnâng cao độ tin cậy cho khẳng định của công ty.\nViệc xác minh phải được thực hiện bởi một bên thứ ba độc lập và được áp dụng cho toàn bộ công ty,\nkhông phải các tổ hợp riêng lẻ. Việc xác minh không đảm bảo tính chính xác của các thành phần tổng hợp nhưng\nkiểm tra xem công ty:\ncó tuân thủ tất cả các yêu cầu GIPS khi xây dựng các thành phần tổng hợp của mình hay không và\ncó tuân theo quy trình tính toán và trình bày lợi nhuận hiệu suất tuân thủ\nGIPS hay không.\n(Lựa chọn B) Một công ty có thể khẳng định rằng mình tuân thủ GIPS, nhưng không thể tự xác minh khẳng định của mình.\nGiám đốc tuân thủ của một công ty hoặc bất kỳ người nào khác là thành viên của công ty, không được phép\nthực hiện việc xác minh.\n(Lựa chọn C) Các cơ quan quản lý không tham gia vào việc xác minh việc tuân thủ GIPS.\nNhững điều cần nhớ:\nViện CFA khuyến nghị các công ty nên xác minh việc tuân thủ GIPS của họ nếu họ chọn làm như vậy khẳng định\nchúng tuân thủ GIPS. Việc xác minh phải được thực hiện bởi bên thứ ba độc lập.\nMô tả khái niệm xác minh độc lập\nLOS","qhtml":null},{"n":6,"q":"Which of the following best describes the need for high ethical standards in investment\nmanagement?","opts":["To preserve the trust that supports the industry","To increase the prestige of working in the industry","To establish consistency across global laws and regulations"],"ans":"A","expl":"Cách một nghề duy trì sự tin cậy\nThiết lập các chuẩn mực thực hành\nLuôn tập trung vào khách hàng\nDuy trì các tiêu chuẩn đầu vào cao\nGiám sát hành vi chuyên môn\nNuôi dưỡng nền tảng kiến thức\nKhuyến khích học tập suốt đời\nChức năng như một cơ quan giám sát hoặc\ncố vấn pháp lý\nBảo vệ và phục vụ khách hàng là nền tảng của nghề quản lý đầu tư ,\nvà mối quan hệ giữa nghề nghiệp và khách hàng của nó được xác định dựa trên sự tin cậy . Khách hàng\ntin tưởng rằng các chuyên gia đầu tư sẽ thực hiện nhiệm vụ của họ một cách cẩn thận nhất, đặt\nlợi ích của khách hàng lên trên lợi ích của chính họ.\nNgành:\ncó được sự tin tưởng bằng cách thiết lập các nguyên tắc chung mà theo đó tất cả các thành viên trong nghề\nđồng ý sống và\nduy trì niềm tin bằng cách thiết lập các tiêu chuẩn chăm sóc tối thiểu đảm bảo văn hóa\ntính chính trực và năng lực trong thực tế.\nNghề đầu tư mang lại lợi ích cho xã hội bằng cách tạo niềm tin với tất cả những người tham gia thị trường.\n(Lựa chọn B) Bằng cách tuân thủ các tiêu chuẩn đạo đức cao, nghề này tạo dựng niềm tin với khách hàng và\nxã hội. Việc nâng cao uy tín của một cá nhân không phải là lý do cần có các tiêu chuẩn đạo đức cao\n.\n(Lựa chọn C) Các quy tắc đạo đức được tạo ra để xác định và chi phối hành vi đạo đức. Nghề đầu tư\ntuân theo Quy tắc đạo đức và tiêu chuẩn ứng xử nghề nghiệp của Viện CFA,\ntrong đó yêu cầu các Thành viên và Ứng viên phải đạt tiêu chuẩn cao hơn những gì luật pháp và\nquy định yêu cầu. Luật pháp không phù hợp để ngăn chặn hành vi phi đạo đức vì chúng không nhất quán\ntrên các quốc gia có chủ quyền, chậm được ban hành và phải tuân thủ. Hành vi đạo đức mở rộng\nngoài việc tuân thủ luật pháp; nó bao gồm việc tuân thủ những kỳ vọng của xã hội về đúng và sai.\nNhững điều cần nhớ:\nHiệu quả của nghề quản lý đầu tư dựa trên sự tin tưởng. Nghề\nphải xây dựng niềm tin bằng cách yêu cầu các thành viên của mình đồng ý sống và làm việc theo các nguyên tắc chung về\nliêm chính. Niềm tin nghề nghiệp được duy trì bằng cách thiết lập các tiêu chuẩn đạo đức về chăm sóc nhằm đảm bảo\ntính chính trực và năng lực.\nmô tả sự cần thiết của các tiêu chuẩn đạo đức cao trong quản lý đầu tư\nLOS","qhtml":null},{"n":7,"q":"Ishani Gupta works in the manufacturing industry and wants to transition into a financial\nservices role. She believes a CFA charter can help with this transition. Gupta recently sat for\nLevel III of the CFA exam and is excited to update her resume to send to potential employers,\nalthough she has not yet received her results. Which of the following statements can\nshe most appropriately use on her resume to adhere to the Standards?","opts":["\"The knowledge gained from the CFA program makes me a superior candidate.\"","\"I will be eligible for a CFA charter after completing my required work experience.\"","\"My studies in the CFA program have enhanced my knowledge and skills in finance.\""],"ans":"C","expl":"\"Khi đề cập đến Viện CFA, tư cách thành viên của Viện CFA, chỉ định CFA\nhoặc ứng cử viên trong Chương trình CFA, các Thành viên và Ứng viên không được\nkhông xuyên tạc hoặc phóng đại ý nghĩa hoặc hàm ý của tư cách thành viên trong\nViện CFA, có chứng chỉ CFA hoặc ứng cử viên trong Chương trình CFA.\"\nTiêu chuẩn VII(B) Tham chiếu đến Viện CFA, Chỉ định CFA và Chương trình CFA\nquy định cách Thành viên và Ứng viên có thể sử dụng chỉ định CFA. Cho phép nêu rõ các thông tin khách quan\nvề lợi ích của việc đạt được chứng chỉ CFA hoặc mức độ và tính nghiêm ngặt của\nchương trình CFA . Điều này bao gồm các tuyên bố về kiến thức và kỹ năng đạt được .\nTuy nhiên, Tiêu chuẩn cấm các Thành viên và Ứng viên phóng đại ý nghĩa hoặc\nngụ ý của các điều lệ CFA của họ, chẳng hạn như tuyên bố năng lực vượt trội với tư cách là một chuyên gia đầu tư\nhoặc đề xuất những người nắm giữ điều lệ có trình độ cao hơn những người không có điều lệ\n(Lựa chọn A) .\n(Lựa chọn B) Gupta đã dự thi cấp III nhưng vẫn chưa nhận được kết quả. Cô ấy\nchưa biết liệu mình có đậu hay không và do đó nói rằng cô ấy sẽ đủ điều kiện tham gia điều lệ sau khi\nhoàn thành kinh nghiệm làm việc cần thiết là vi phạm Tiêu chuẩn.\nNhững điều cần nhớ:\nTiêu chuẩn VII(B) cấm Thành viên và Ứng viên phóng đại ý nghĩa hoặc\nngụ ý trong điều lệ CFA của họ.\ncho phép nêu các thông tin thực tế về chứng chỉ và chương trình CFA, bao gồm cả các tuyên bố về kiến ​​thức hoặc kỹ năng đạt được. Tuy nhiên, Tiêu chuẩn không\nkhông cho phép các tuyên bố ràng buộc chỉ định CFA với khả năng đạt được hiệu suất\nvượt trội.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":8,"q":"GIPS standards prevent firms from using misleading performance measurement practices such\nas presenting:","opts":["average returns that exclude terminated portfolios.","fewer periods of returns than exist for an investment strategy.","returns of investment strategies that consist of a single portfolio."],"ans":"A","expl":"Các phương pháp báo cáo hiệu suất gây hiểu lầm thường gặp\nĐại diện Chọn danh mục đầu tư hoạt động tốt nhất để thể hiện tổng thể\nkết quả tài khoản\nSống sót\nLoại trừ danh mục đầu tư đã chấm dứt khỏi hiệu suất trung bình\nxu hướng\nThay đổi\nChỉ trình bày các giai đoạn được chọn có hiệu suất mạnh\nkhoảng thời gian\nTiêu chuẩn toàn cầu về báo cáo hiệu suất đầu tư được gọi là GIPS (Đầu tư toàn cầu\nHiệu suất Standards) cung cấp một cách tiếp cận thống nhất để tính toán và trình bày hiệu suất đầu tư trước đây\n. Nếu không có tiêu chuẩn GIPS, báo cáo của một công ty về hiệu suất đầu tư\ncó thể không đáng tin cậy do:\ntrình bày có chọn lọc các danh mục đầu tư có hiệu suất cao nhất để thể hiện kết quả của công ty đối với một\nchiến lược nhất định,\nloại trừ các danh mục đầu tư hoạt động kém và đã bị chấm dứt hoặc\ntrình bày lợi nhuận trong một khoảng thời gian hoạt động mạnh mẽ nhưng loại trừ các giai đoạn hoạt động mạnh mẽ yếu hơn\nhiệu suất.\nGIPS yêu cầu các công ty bao gồm các tài khoản khách hàng đã chấm dứt, quỹ và danh mục đầu tư như một phần\ncủa hiệu suất lịch sử của một tổng hợp. Cách thực hành này mang lại kết quả thể hiện\nchính xác hơn về hiệu quả hoạt động hoàn chỉnh của công ty. Việc loại trừ các danh mục đầu tư đã chấm dứt\nhoạt động kém sẽ dẫn đến đánh giá quá cao hiệu suất và dẫn đến báo cáo sai lệch.\n(Lựa chọn B) Tiêu chuẩn GIPS ngăn cản các công ty trình bày có chọn lọc các giai đoạn hoạt động bằng cách\nbắt buộc phải trình bày số lượng tối thiểu các năm liên tiếp. Nếu chiến lược đã tồn tại trong\nnhiều hơn số năm báo cáo tối thiểu được yêu cầu, thì các công ty được phép trình bày\nít giai đoạn hoạt động trước đây hơn so với hiện tại.\n(Lựa chọn C) Các công ty có thể trình bày kết quả của một danh mục đầu tư duy nhất nếu đó là danh mục duy nhất cho một chiến lược\nnhất định.\nNhững điều cần nhớ:\nBáo cáo hiệu suất các tiêu chuẩn được gọi là GIPS (Hiệu suất đầu tư toàn cầu\nTiêu chuẩn) cung cấp một cách tiếp cận thống nhất để trình bày hiệu suất đầu tư trước đây.\nGIPS yêu cầu các công ty đưa danh mục đầu tư đã chấm dứt vào như một phần hiệu suất trước đây của a\ntổng hợp.\nMô tả các khái niệm chính của tiêu chuẩn GIPS dành cho các công ty\nLOS","qhtml":null},{"n":9,"q":"A client names a Member in a written complaint involving potential misconduct and files the\ncomplaint with the Member's firm. At a minimum , CFA Institute's Code and Standards require\nthat the Member:","opts":["self-disclose the incident on the annual Professional Conduct Statement.","immediately disclose the incident to CFA Institute's Professional Conduct Program staff.","self-disclose the incident on the annual Professional Conduct Statement only if the firm finds wrongdoing."],"ans":"A","expl":"Hành vi chuyên nghiệp\nTất cả Thành viên và Ứng viên phải nộp Hồ sơ Ứng xử Chuyên nghiệp hàng năm\nTuyên bố\nMọi vấn đề liên quan đến hành vi chuyên nghiệp phải được được tiết lộ\nCác khiếu nại bằng văn bản được gửi trực tiếp đến Chương trình Ứng xử Chuyên nghiệp của Viện CFA\nnhân viên có thể dẫn đến một cuộc điều tra\nNhân viên của Viện CFA cũng có thể điều tra nếu họ biết về hành vi\ncó nghi vấn\nChương trình Ứng xử Chuyên nghiệp của Viện CFA cung cấp một khuôn khổ để xử lý các câu hỏi\nvề hành vi chuyên môn của Thành viên và Ứng viên. Nhân viên của Chương trình Ứng xử Chuyên nghiệp\ncó thể bắt đầu một cuộc điều tra dựa trên khiếu nại bên ngoài hoặc cuộc điều tra nội bộ.\nNhân viên làm việc với Ủy ban Xem xét Kỷ luật để thực thi Quy tắc và Tiêu chuẩn.\nCác thành viên và Ứng viên phải nộp Bản Tuyên bố về Đạo đức Chuyên nghiệp đã hoàn chỉnh\nhàng năm. Tuyên bố này là lời cam kết tuân thủ Quy tắc và Tiêu chuẩn cũng như\nChương trình ứng xử chuyên nghiệp. Nó cũng tạo cơ hội để tự tiết lộ hành vi\ncó nghi vấn.\nKhi Thành viên hoặc Ứng viên nhận được khiếu nại bằng văn bản đặt câu hỏi về hành vi chuyên môn\ncủa họ, khiếu nại đó phải được tiết lộ cho nhân viên của Chương trình Ứng xử Chuyên nghiệp\n. Viện CFA khuyến khích tiết lộ tại thời điểm diễn ra sự kiện, nhưng tối thiểu\nvấn đề phải được tiết lộ khi nộp Tuyên bố về đạo đức nghề nghiệp hàng năm (Lựa chọn\nB) .\n(Lựa chọn C) Bất kể kết quả của bất kỳ cuộc điều tra nội bộ nào (tức là công ty), Thành viên hoặc\nỨng viên phải tự tiết lộ sự việc trên Tuyên bố về hành vi chuyên nghiệp hàng năm hoặc\ntrực tiếp cho nhân viên Chương trình Ứng xử Chuyên nghiệp.\nNhững điều cần nhớ:\nCác Thành viên và Ứng viên phải tiết lộ các khiếu nại bằng văn bản đặt câu hỏi về hành vi ứng xử chuyên nghiệp\ncủa họ cho nhân viên Chương trình Ứng xử Chuyên nghiệp. Ở mức tối thiểu, việc tiết lộ phải diễn ra khi\ngửi Tuyên bố về đạo đức nghề nghiệp hàng năm.\nMô tả cấu trúc của Chương trình đạo đức nghề nghiệp của Viện CFA và quy trình\nthực thi Quy tắc và Tiêu chuẩn\nLOS","qhtml":null},{"n":10,"q":"A fixed income investment firm specializes in trading relative value opportunities among\ndomestic and international corporate bonds. One of the firm's clients does not want exposure\nto international securities, which hinders the implementation of the firm's strategy, so the firm\nmanages the client's portfolio by investing exclusively in domestic fixed income. According to\nGIPS standards, can the firm appropriately include the client's portfolio in its composites?","opts":["No","Yes, since the client is still trading in fixed income","Yes, since the firm has investment management responsibility for the portfolio"],"ans":"A","expl":"Các yêu cầu về GIPS để đưa vào danh mục đầu tư\nLoại tài khoản Tổng hợp Tài sản công ty\nTrả phí, tùy ý Bao gồm Bao gồm\nKhông trả phí, tùy ý Bao gồm Bao gồm\nTrả phí, không tùy ý Loại trừ Bao gồm\nKhông trả phí, không tùy ý Loại trừ Bao gồm\n(GIPS®)\nTiêu chuẩn hiệu suất đầu tư toàn cầu bao gồm các nguyên tắc cốt lõi bao gồm:\nThích hợp định nghĩa (rộng nhất) về công ty\nKhông có thông tin sai lệch hoặc sai lệch\nTuân thủ luật pháp và quy định\nViệc cung cấp báo cáo GIPS cho khách hàng và khách hàng tiềm năng\nViệc tuân thủ các tiêu chuẩn GIPS yêu cầu các công ty xác định quyền tự quyết định, dựa trên người đưa ra\nquyết định đầu tư cho danh mục đầu tư:\nTrong danh mục đầu tư tùy ý, công ty đưa ra quyết định đầu tư.\nTrong danh mục đầu tư không tùy ý, khách hàng đưa ra quyết định đầu tư.\nDanh mục đầu tư được xác định là danh mục tùy ý là danh mục đầu tư duy nhất có trong danh mục tổng hợp của công ty.\nDo đó, định nghĩa chỉ ra liệu danh mục đầu tư nên được bao gồm hay loại trừ khỏi\ntổng hợp, từ đó ảnh hưởng đến hiệu suất được báo cáo của công ty.\nTrong trường hợp này, do khách hàng áp đặt hạn chế mua trái phiếu quốc tế nên\ndanh mục đầu tư của khách hàng không tuân theo chiến lược của công ty . Do đó, công ty nên phân loại\ndanh mục đầu tư là không tùy ý và không được đưa nó vào bất kỳ tổ hợp nào của công ty.\n(Lựa chọn B và C) Danh mục đầu tư của khách hàng chỉ đầu tư vào thu nhập cố định trong nước, một\nchuyên môn của công ty. Ngoài ra, công ty còn có trách nhiệm quản lý đầu tư đối với\ndanh mục đầu tư. Tuy nhiên, danh mục đầu tư không đại diện cho chiến lược của công ty nên không thể\nđược đưa vào bất kỳ danh mục tổng hợp nào của công ty.\nNhững điều cần nhớ:\nViệc tuân thủ các tiêu chuẩn GIPS yêu cầu các công ty phải xác định quyền quyết định. Danh mục đầu tư không\nđại diện cho chiến lược của công ty do các hạn chế do khách hàng áp đặt nên được phân loại là\nkhông tùy ý. Chỉ các danh mục đầu tư tùy ý mới có thể được đưa vào tổng hợp của công ty và\nảnh hưởng đến hiệu suất được báo cáo.\nGiải thích mục đích của tổng hợp trong báo cáo hiệu suất\nLOS","qhtml":null},{"n":11,"q":"Marcos Silva, CFA, and Clara Neves, CFA, are analysts at Alpha Capital, an independent\nresearch firm. Silva reads a blog post about Northwest Bank that details several fresh insights\non company-specific growth. After doing his own thorough research on Northwest, Silva\nagrees with the blogger's analysis, although he expects this growth to take longer than the\nblogger predicts.\nSilva then writes a research report on Northwest and includes a restatement of the blogger's\ninsights. Since he has changed some of the wording and the expected time horizon for\ngrowth, he does not reference the blog.\nNeves proofreads the report at Silva's request and agrees with his conclusion about the bank.\nWith Silva's approval, Neves adds a chart from the US Federal Reserve, which is not\ncopyrighted, that shows expected growth in bank reserves over the next year. She properly\ncites the US Federal Reserve as the source. According to the Code and Standards:","opts":["both Silva and Neves have violated the Standards.","Silva has violated the Standards, but Neves has not.","Neves has violated the Standards, but Silva has not."],"ans":"B","expl":"\"Thành viên và Ứng viên không được cố ý đưa ra bất kỳ thông tin xuyên tạc nào liên quan đến\nvề phân tích đầu tư, khuyến nghị, hành động hoặc các hoạt động chuyên môn khác.\"\nSự trình bày sai theo Tiêu chuẩn I(C) bảo vệ nhà đầu tư trước những tuyên bố và thông tin\ndo cộng đồng đầu tư cung cấp có thể làm suy yếu niềm tin của nhà đầu tư vào tính chính trực của nghề\n. Trình bày sai có thể bao gồm:\nĐạo văn: trích dẫn thông tin mà không ghi nhận hoặc trích dẫn nguồn\nBỏ sót: trình bày thông tin hoặc dữ liệu không đầy đủ nhằm đánh lừa\nPhóng đại: thổi phồng thông tin chuyên môn hoặc kết quả thực hiện\nViệc sử dụng tác phẩm của người khác mà không ghi công là đạo văn , ngay cả khi tác phẩm đó được thực hiện không\ntrích dẫn nguyên văn từ bản gốc hoặc đã có những thay đổi nhỏ . Tác phẩm của những người khác có thể được\ntrình bày cho khách hàng miễn là nguồn ban đầu được xác định rõ ràng.\nTrong trường hợp này, Marcos Silva trình bày lại một đoạn trích từ một blog, chỉ thay đổi khoảng thời gian\ncủa mức tăng trưởng dự kiến ​​trong khi sao chép một cách hiệu quả nội dung quan trọng về nguồn gốc của\nsự tăng trưởng đó. Silva không thực hiện những thay đổi đáng kể đối với tác phẩm của tác giả gốc, và\nông cũng không gán tác phẩm đó cho tác giả đó; đây là đạo văn và Silva đã vi phạm\nTiêu chuẩn (Lựa chọn C) .\n(Lựa chọn A) Clara Neves bao gồm một biểu đồ từ Cục Dự trữ Liên bang Hoa Kỳ, đây không phải là tác phẩm gốc\ncủa cô ấy. Tuy nhiên, Neves không phạm tội đạo văn vì tài liệu không\ncó bản quyền, cho phép nó được sử dụng lại mà không được phép và cô ấy đã trích dẫn chính xác nguồn gốc\n; do đó, cô ấy không vi phạm Tiêu chuẩn.\nNhững điều cần nhớ:\nTiêu chuẩn I(C) bảo vệ nhà đầu tư trước những tuyên bố và thông tin từ cộng đồng đầu tư\ncó thể làm suy yếu niềm tin của nhà đầu tư vào tính trung thực của nghề nghiệp. Chỉ thực hiện\nnhững thay đổi nhỏ đối với tác phẩm của người khác và không trích dẫn nguồn bị coi là đạo văn, điều này\ngây hiểu lầm cho các nhà đầu tư và vi phạm Tiêu chuẩn.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":12,"q":"Eric Saul, CFA, is a portfolio manager with Skye Group. He reads several social media posts\nfrom industry experts about the health benefits attributed to a new herbal tea made with rose\npetals. Based on these posts, Saul reviews industry publications and finds several articles that\nspeculate herbal rose tea will be the next big beverage craze. Saul visits a senior vice\npresident of Gamma Company, a conglomerate with a significant market share in the beverage\nindustry, who confirms that the market for herbal tea has considerable potential. After\nreviewing Gamma's financial statements and public disclosures, Saul uses industry-standard\nfinancial models to determine the intrinsic value of Gamma's stock. He concludes that Gamma\nwill introduce an herbal tea made with rose petals. Based on this conclusion, Saul buys\nGamma stock for all suitable client portfolios. A few weeks later, Gamma announces a new\nline of herbal rose tea. Did Saul most likely violate Standard II(A) Material Nonpublic\nInformation?","opts":["No","Yes, by purchasing Gamma for clients","Yes, by acting on information from company management"],"ans":"A","expl":"\" Các Thành viên và Ứng viên sở hữu thông tin quan trọng không công khai\ncó thể ảnh hưởng đến giá trị của khoản đầu tư không được hành động\nhoặc khiến người khác hành động dựa trên thông tin đó .\"\nThông tin quan trọng không công khai theo Tiêu chuẩn II(A) nghiêm cấm các Thành viên và Ứng viên\ngiao dịch hoặc đề xuất đầu tư dựa trên thông tin quan trọng không công khai\n . Tuy nhiên, các nhà phân tích có thể ghép dữ liệu công khai và không công khai\ntừ nhiều nguồn để đưa ra kết luận đầu tư.\nPhương pháp nghiên cứu này được gọi là lý thuyết khảm và nó công nhận rằng các nhà phân tích\nđưa ra kết luận từ nhiều nguồn thông tin khác nhau. Các kết luận được hình thành thông qua quy trình khảm\n, ngay cả khi dựa trên thông tin được coi là quan trọng và không công khai nếu thông tin đó\nđến trực tiếp từ một nguồn đáng tin cậy (ví dụ: công ty), không vi phạm Tiêu chuẩn.\nTrong trường hợp này, Eric Saul đã sử dụng thông tin công khai, bao gồm các bài đăng trên mạng xã hội, ấn phẩm\nvà báo cáo tài chính của ngành. Cuộc thảo luận của ông tại Công ty Gamma, mặc dù\nkhông công khai, nhưng không quan trọng vì phó chủ tịch cấp cao chỉ xác nhận nghiên cứu thị trường\ncủa Saul và không cho biết gì về ý định của Gamma (Lựa chọn C) .\n(Lựa chọn B) Việc Saul mua Gamma không vi phạm Tiêu chuẩn vì ông không sử dụng\nthông tin quan trọng không công khai để đưa ra kết luận về Gamma. Ông cũng đối xử\nkhách hàng của Skye một cách công bằng bằng cách mua cổ phiếu cho tất cả danh mục đầu tư của khách hàng phù hợp.\nNhững điều cần nhớ:\nThông tin quan trọng không công khai theo tiêu chuẩn II(A) nghiêm cấm Thành viên và Ứng viên giao dịch\nhoặc đề xuất đầu tư dựa trên thông tin quan trọng không công khai. Lý thuyết Khảm\nđề xuất một cách tiếp cận sử dụng kết hợp thông tin công khai và phi vật chất, không công khai\nđể đi đến kết luận đầu tư không bị coi là vi phạm Tiêu chuẩn.\nGiải thích cách thực tiễn, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp của Viện CFA\nLOS","qhtml":null},{"n":13,"q":"Aisha Nazari, CFA, manages a small-cap stock portfolio for Sanctuary Capital. As the portfolio\nhas grown, Nazari has noticed that trading costs are increasing due to low liquidity in small-\ncap stocks. To reduce these costs, she adds derivatives that mimic the returns of the small-\ncap stocks she invests in. Nazari updates the portfolio's information on Sanctuary's social\nmedia page, which is used for marketing to prospective clients. Existing clients can access the\nsocial media page, but it generally is not used to communicate with them. Nazari does not\nuse any other communication to tell existing clients about these changes. Nazari:","opts":["does not violate the Standards.","violates the Standards by not communicating separately with existing clients.","violates the Standards by using social media to communicate an investment strategy."],"ans":"B","expl":"\"Thành viên và Ứng viên phải:\n1. Tiết lộ cho khách hàng và khách hàng tiềm năng định dạng cơ bản và\ncác nguyên tắc chung của quy trình đầu tư mà họ sử dụng để\nphân tích các khoản đầu tư, chọn chứng khoán và xây dựng danh mục đầu tư\nvà phải tiết lộ kịp thời mọi thay đổi có thể\nảnh hưởng nghiêm trọng đến các quy trình đó.\n2. Tiết lộ cho khách hàng và khách hàng tiềm năng những hạn chế đáng kể\nvà rủi ro liên quan đến quy trình đầu tư.\"\nGiao tiếp tiêu chuẩn V(B) với Khách hàng và Khách hàng tiềm năng yêu cầu Thành viên và\nỨng cử viên để thông báo cho cả khách hàng và khách hàng tiềm năng về\nnhững hạn chế và rủi ro của một tài sản hoặc quy trình đầu tư. Thông tin liên lạc phải sử dụng\nngôn ngữ dễ hiểu cho khách hàng nhưng cũng truyền tải đủ thông tin để\nhọ nhận ra những rủi ro và hạn chế liên quan.\nHơn nữa, mọi thay đổi về đặc điểm chung của tài sản hoặc quy trình đầu tư (ví dụ:\nchiến lược, rủi ro) cũng phải được tiết lộ . Thông báo về các thay đổi cho phép khách hàng\nquyết định xem tài sản hoặc quy trình có còn phù hợp với các mục tiêu rủi ro và lợi nhuận của họ sau khi\nthay đổi được thực hiện hay không. Việc bổ sung các công cụ phái sinh vào danh mục đầu tư sẽ làm thay đổi hồ sơ rủi ro của nó; đây là\nthông tin quan trọng mà tất cả khách hàng cần biết.\nTruyền đạt thông tin chi tiết về đầu tư hoặc những thay đổi về đặc điểm đầu tư thông qua phương tiện truyền thông xã hội\nkhông vi phạm Tiêu chuẩn V(B) (Lựa chọn C) . Tuy nhiên, nếu sử dụng nền tảng truyền thông xã hội\n thì phải đặc biệt cẩn thận để đảm bảo tất cả khách hàng nhận được thông tin liên lạc và được\nđối xử công bằng.\nTrong trường hợp này, vì Sanctuary Capital và Aisha Nazari thường không sử dụng trang truyền thông xã hội\ncủa công ty để liên lạc với khách hàng hiện tại nên chỉ cập nhật trang đó là không đủ\ntiết lộ thông tin quan trọng. Cần có thêm thông tin liên lạc để đảm bảo tất cả khách hàng\nbiết được sự thay đổi. Nazari vi phạm Tiêu chuẩn khi không cung cấp\nthông tin bổ sung (Lựa chọn A).\nNhững điều cần nhớ:\nTiêu chuẩn V(B) yêu cầu Thành viên và Ứng viên phải thông báo cho cả khách hàng và khách hàng tiềm năng\nvề những hạn chế và rủi ro của tài sản đầu tư. Mọi thay đổi về thành phần, rủi ro,\nhoặc chiến lược đầu tư của tài sản cũng phải được tiết lộ. Nếu sử dụng nền tảng truyền thông xã hội,\nphải đặc biệt cẩn thận để đảm bảo tất cả khách hàng đều nhận được thông tin liên lạc.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":14,"q":"A profession most likely establishes trust with members of the public by:","opts":["overseeing firms' robust compliance procedures.","developing a pervasive culture of integrity among all professionals.","working with regulators to create a highly regulated, protective environment."],"ans":"B","expl":"Cách một nghề duy trì niềm tin\nThiết lập các chuẩn mực thực hành\nLuôn tập trung vào khách hàng\nDuy trì ở mức cao tiêu chuẩn đầu vào\nGiám sát hành vi chuyên môn\nNuôi dưỡng nền tảng kiến thức\nKhuyến khích học tập suốt đời\nChức năng như một cơ quan giám sát hoặc\ncố vấn pháp lý\nĐể thiết lập và duy trì niềm tin cũng như được tôn trọng và thành công, một nghề phải xây dựng\nsự tín nhiệm với công chúng. Nghề nghiệp:\nkiếm được lòng tin bằng cách thiết lập các nguyên tắc chung mà tất cả thành viên trong nghề đều đồng ý\nvà tuân theo.\nduy trì niềm tin bằng cách thiết lập các tiêu chuẩn chăm sóc tối thiểu nhằm đảm bảo văn hóa\nliêm chính và năng lực trong thực tế.\nNghề đầu tư được hưởng lợi bằng cách tạo niềm tin với tất cả những người tham gia thị trường và người dùng cuối\n.\n(Lựa chọn A) Chỉ giám sát tuân thủ ở cấp công ty là không đủ để tạo dựng niềm tin với công chúng\n. Các tiêu chuẩn và thông lệ của người sử dụng lao động không nhất thiết phải nhất quán với các tiêu chuẩn và thông lệ của tổ chức chuyên nghiệp\n. Đối với nghề đầu tư, niềm tin được xây dựng bằng cách đặt\nlợi ích của khách hàng lên hàng đầu và được nuôi dưỡng thông qua hành vi đạo đức tập thể của các chuyên gia\ntrong ngành chứ không phải bởi sự tuân thủ của bất kỳ công ty riêng lẻ nào.\n(Lựa chọn C) Ngành đầu tư toàn cầu được quản lý chặt chẽ bởi các quy tắc\nvà luật pháp của nhiều chính phủ. Tuy nhiên, thực tế là một ngành được quản lý chặt chẽ không đảm bảo\nhoạt động chuyên môn đáng tin cậy; nó chỉ biểu thị mức độ tuân thủ cao và/hoặc\nsự giám sát của chính phủ.\nNhững điều cần nhớ:\nĐể được tôn trọng, một nghề phải tạo dựng niềm tin với công chúng bằng cách đồng ý sống và\nlàm việc theo các nguyên tắc chung về liêm chính. Niềm tin nghề nghiệp được duy trì bằng cách thiết lập\ntiêu chuẩn chăm sóc nhằm đảm bảo tính liêm chính và năng lực. Một ngành thực hiện điều này\nmột cách hiệu quả nhất thông qua các sáng kiến ​​riêng của mình, không chỉ bằng cách hoạt động trong một môi trường\nđược quản lý chặt chẽ hoặc chỉ dựa vào sự tuân thủ của công ty.\nmô tả các ngành nghề và cách họ thiết lập niềm tin\nLOS","qhtml":null},{"n":15,"q":"Zhao Fen, CFA, is an independent investor. She holds a large position of Formula Industries, a\nlightly traded stock with low liquidity, in one of her two personal accounts. If Zhao wishes to\nexit the position, which of the following would most likely violate the Standards?","opts":["Using an intermediary to sell the position outside of the market to avoid price impacts.","Selling her holdings as one position, which would likely cause a large drop in the price.","Trading the stock between personal accounts to attract interest from other market participants."],"ans":"C","expl":"\"Thành viên và Ứng viên không được tham gia vào các hoạt động bóp méo\ngiá cả hoặc thổi phồng khối lượng giao dịch một cách giả tạo nhằm mục đích đánh lừa\nthị trường người tham gia.\"\nThao túng thị trường theo Tiêu chuẩn II(B) nghiêm cấm các hoạt động của Thành viên hoặc Ứng viên\nlừa dối người tham gia thị trường bằng cách bóp méo giá hoặc khối lượng chứng khoán. Việc thao túng có thể\nxảy ra thông qua:\ncác hoạt động dựa trên thông tin (ví dụ: cung cấp thông tin sai lệch hoặc gây nhầm lẫn) và/hoặc\ncác hoạt động dựa trên giao dịch (ví dụ: giao dịch phóng đại giữa hai tài khoản).\nTiêu chuẩn không ngăn cản việc sử dụng các chiến lược giao dịch hợp pháp, ngay cả khi chúng gây ra\nbiến động giá hoặc được thiết kế nhằm mục đích hạn chế tác động trên thị trường. Yếu tố then chốt\ntrong việc xác định xem Tiêu chuẩn có bị vi phạm hay không là mục đích: nếu chiến lược\nnhằm đánh lừa các nhà đầu tư thì chiến lược đó sẽ vi phạm Tiêu chuẩn .\nTrong trường hợp này, nếu Zhao Fen giao dịch cổ phiếu của Formula Industries giữa các tài khoản cá nhân của cô ấy, thì điều đó\nsẽ khiến những người tham gia thị trường có ấn tượng sai lầm về khối lượng giao dịch cao hơn do giao dịch\nkhông được thực hiện giữa những người tham gia thị trường duy nhất. Lừa dối người tham gia thông qua thao tác dựa trên giao dịch-\nvi phạm Tiêu chuẩn.\n(Lựa chọn A) Sử dụng một bên trung gian (ví dụ: nhà khối) để bán vị thế bên ngoài thị trường hoặc\nchia đơn hàng thành các đợt nhỏ hơn là một chiến lược giao dịch hợp pháp. Hoạt động này nhằm mục đích\ngiảm tác động của giao dịch mua bán trên thị trường, nhưng kết quả giao dịch được thực hiện với những người tham gia thị trường\nvà do đó không vi phạm Tiêu chuẩn.\n(Lựa chọn B) Mặc dù việc bán tất cả cổ phần ở một vị thế có thể khiến giá giảm, Zhao\ncó thể làm như vậy mà không có ý định thao túng những người tham gia thị trường; do đó, đây không phải là hành động\ncó nhiều khả năng vi phạm Tiêu chuẩn nhất. Tiêu chuẩn không yêu cầu Thành viên hoặc Ứng viên\ngây bất lợi cho bản thân để duy trì tính toàn vẹn của thị trường, vì vậy, chiến lược này có thể được sử dụng nếu cần tiền mặt\nmột cách nhanh chóng.\nNhững điều cần nhớ:\nTiêu chuẩn II(B) nghiêm cấm các hoạt động của Thành viên hoặc Ứng viên lừa dối những người tham gia thị trường\nđể bóp méo giá hoặc khối lượng chứng khoán. Tiêu chuẩn cho phép sử dụng các chiến lược giao dịch\nhợp pháp, ngay cả khi chúng tác động đến giá chứng khoán. Yếu tố chính trong việc xác định liệu\nTiêu chuẩn có bị vi phạm hay không là ý định.\nThể hiện việc áp dụng Quy tắc đạo đức và Tiêu chuẩn ứng xử nghề nghiệp trong\ncác tình huống liên quan đến vấn đề liêm chính nghề nghiệp\nLOS","qhtml":null},{"n":16,"q":"Maya Levine, CFA, is a research analyst at a hedge fund. Levine covers the global alternative\nenergy industry and regularly uses an expert network to keep abreast of new developments.\nDuring a recent expert network call with a junior scientific researcher at an electric car\nmanufacturer, Levine asks about a new battery technology that was disclosed in the last\nearnings release. The researcher echoes the optimistic tone of the press release, suggesting\npossible commercial development within a short period, but also notes that the rare earth\nelements needed for commercial production are in short supply.\nBased on this conversation, Levine begins researching rare earth mining stocks that could\npotentially benefit from large-scale commercialization were the technology adopted. After\nconducting her research, Levine identifies and recommends the purchase for the hedge fund of\nan attractively valued rare earth mining company, believing that this new technology could\nprovide an upside to her valuation estimate.\nAccording to the Standard II(A) Material Nonpublic Information, Levine:","opts":["did not violate the Standard.","violated the Standard by acting on material nonpublic information.","violated the Standard by not reporting the receipt of material nonpublic information to her supervisor or compliance staff."],"ans":"A","expl":"\"Các Thành viên và Ứng viên sở hữu thông tin quan trọng không công khai\ncó thể ảnh hưởng đến giá trị của khoản đầu tư không được hành động hoặc khiến người khác hành động dựa trên\nthông tin đó.\"\nThông tin quan trọng không công khai theo Tiêu chuẩn II(A) nghiêm cấm các Thành viên và Ứng viên\nhành động hoặc đề xuất đầu tư dựa trên thông tin quan trọng không công khai .\nTuy nhiên, các nhà phân tích có thể ghép dữ liệu công khai và phi quan trọng không công khai từ\nnhiều nguồn để đưa ra kết luận đầu tư. Quá trình này được gọi là lý thuyết khảm\n. Các đề xuất dựa trên lý thuyết khảm không vi phạm Tiêu chuẩn vì\nthay vì dựa vào người trong nội bộ công ty, kết luận phụ thuộc vào kỹ năng của nhà phân tích trong việc tổng hợp\nthông tin từ các nguồn khác nhau.\nTrong trường hợp này, nhà nghiên cứu nhắc lại tuyên bố đã được công bố công khai của công ty\nvề triển vọng và tiến trình phát triển thương mại của một công nghệ pin mới, vì vậy không\nthông tin không công khai đã được tiết lộ. Nhận xét của nhà nghiên cứu về việc các nguyên tố đất hiếm\nđang bị thiếu hụt có thể cung cấp thêm một số thông tin phi vật chất vì\ncó thể được giả định một cách hợp lý rằng thông tin đó có trong các dự báo\nđược phát hành công khai của công ty hoặc có sẵn công khai.\nDo đó, Maya Levine không vi phạm Tiêu chuẩn vì cô không tiết lộ thông tin quan trọng nào\n. Levine đã sử dụng thông tin này khi áp dụng lý thuyết khảm để hỗ trợ luận án đầu tư\ncho công ty khai thác đất hiếm (Lựa chọn B) .\n(Lựa chọn C) Mặc dù các Thành viên và Ứng viên nên báo cáo việc nhận được\nthông tin không công khai có khả năng quan trọng cho người giám sát hoặc nhân viên tuân thủ của họ, nhưng điều đó không\nbắt buộc trong mọi trường hợp và các Thành viên và Ứng viên không được khuyến khích thực hiện quyền của mình riêng\nphán quyết, nếu thích hợp.\nNhững điều cần nhớ:\nThông tin quan trọng không công khai theo Tiêu chuẩn II(A) cấm các Thành viên và Ứng viên hành động\nhoặc đề xuất đầu tư dựa trên thông tin quan trọng không công khai. Tuy nhiên, việc sử dụng\nlý thuyết khảm, một cách tiếp cận kết hợp thông tin công khai và phi vật chất, không công khai để\nđạt được kết luận đầu tư, không bị coi là vi phạm Tiêu chuẩn.\nGiải thích cách thực tiễn, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":17,"q":"Trevor Johnson, CFA, joins Pinnacle Advisors as an equity trader. Pinnacle uses Research\nMarket Brokers (RMB) for all trades from accounts that allow soft dollar arrangements and\nCost Cutter Brokers (CCB) for those that do not. RMB does not have the lowest execution\nprice but offers research used for the benefit of Pinnacle's clients. CCB offers the lowest price\nexecution available for Pinnacle. After a slow trading month, Pinnacle is below its soft dollar\ntrading commitment to RMB. RMB offers to temporarily lower the price of its trades to match\nCCB until the commitment is reached as long as all trades, including those on accounts that do\nnot allow soft dollar arrangements, are made through their brokerage. Based on the Code and\nStandards, Johnson:","opts":["can temporarily trade all accounts through RMB since it lowered its price.","can only trade stocks through CCB for all accounts since it is usually the lowest-priced.","cannot use trades for accounts that prohibit soft dollar arrangements to meet the commitment."],"ans":"A","expl":"\" Thành viên và Ứng viên có nghĩa vụ trung thành với khách hàng của mình và phải hành động\nmột cách thận trọng và đưa ra phán đoán thận trọng. Thành viên và Ứng viên phải hành động\nvì lợi ích của khách hàng của họ và đặt lợi ích của khách hàng lên trên\nhoặc lợi ích của chính họ.\"\nTiêu chuẩn III(A) Sự trung thành, thận trọng và cẩn thận yêu cầu các Thành viên và Ứng viên phải tìm kiếm\ngiá tốt nhất và khả năng thực thi tốt nhất cho các giao dịch của khách hàng. \"Giá tốt nhất\" và \"thực thi tốt nhất\" không nhất thiết\ncó nghĩa là hoa hồng giao dịch thấp nhất, nhưng hoa hồng trả cho người môi giới để thực hiện\ncác giao dịch phải tương xứng với giá trị nhận được.\nMôi giới đồng đô la mềm đề cập đến việc sử dụng một phần hoa hồng môi giới\nđể mua dịch vụ đầu tư (ví dụ: nghiên cứu). Vì khách hàng \"trả\" hoa hồng\ntừ tài sản của khách hàng nên các dịch vụ đầu tư này là tài sản của khách hàng chứ không phải\ncông ty quản lý đầu tư và phải được sử dụng để mang lại lợi ích cho khách hàng. Thông thường, các nhà môi giới\ncung cấp dịch vụ đầu tư giá trị gia tăng sẽ tính phí hoa hồng cao hơn. Khách hàng có thể chọn\nkhông giao dịch tài khoản của mình trên cơ sở đồng đô la mềm nếu họ cảm thấy giá trị đó không xứng đáng với chi phí\n.\nTrong trường hợp này, Johnson không vi phạm Tiêu chuẩn mặc dù anh ta chỉ đạo tất cả tài khoản\ngiao dịch sang Nhân dân tệ. RMB giảm hoa hồng để phù hợp với hoa hồng của CCB; do đó, những\nkhách hàng không cho phép đô la mềm sẽ không trả thêm tiền để trợ cấp cho nghiên cứu được sử dụng bởi\nnhững khách hàng cho phép đô la mềm (Lựa chọn C). Khi RMB tăng giá, Johnson phải chuyển\ncác tài khoản không cho phép đô la mềm trở lại CCB.\n(Lựa chọn B) Johnson không bắt buộc chỉ giao dịch qua CCB mặc dù họ có\nhoa hồng thấp nhất vì RMB tăng thêm giá trị cho khách hàng của Pinnacle thông qua nghiên cứu mà họ cung cấp,\nmiễn là nghiên cứu đó được sử dụng để mang lại lợi ích cho Pinnacle's client.\nNhững điều cần nhớ:\nMôi giới đô la mềm đề cập đến việc sử dụng một phần hoa hồng môi giới để thanh toán\ncho nghiên cứu đầu tư. Nghiên cứu được mua thông qua các thỏa thuận này được coi là\ntài sản của khách hàng, không phải của người quản lý đầu tư. Khách hàng có thể chọn không tham gia giao dịch với các nhà môi giới\nvới mức hoa hồng cao hơn và thỏa thuận đồng đô la mềm.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":18,"q":"A firm creating and maintaining GIPS-compliant composites is most likely required to:","opts":["assign portfolios to composites on an ex ante basis.","ensure that each composite contains multiple portfolios.","include every portfolio with a similar strategy in a composite."],"ans":"A","expl":"Một tổng hợp tổng hợp tất cả các danh mục đầu tư của công ty được quản lý theo một\nnhiệm vụ, mục tiêu hoặc chiến lược đầu tư nhất định. GIPS yêu cầu mỗi danh mục đầu tư\ntùy ý, trả phí phải được đưa vào ít nhất một danh mục tổng hợp.\nQuyết định đưa danh mục đầu tư vào danh mục tổng hợp phải dựa trên các tiêu chí\nđược thiết lập trước, được gọi là tiêu chí trước đó, thay vì sau này (tức là sau thực tế). Điều này ngăn cản người quản lý\nchỉ trình bày danh mục đầu tư hoạt động tốt nhất của họ trong tổng hợp. Việc bao gồm tất cả\ndanh mục đầu tư được quản lý tương tự sẽ thể hiện đầy đủ hiệu suất của công ty\nvới chiến lược đó.\n(Lựa chọn B) Chỉ cho phép bao gồm một danh mục đầu tư trong một tổ hợp nếu đó là danh mục\nduy nhất của công ty sử dụng nhiệm vụ, mục tiêu hoặc chiến lược đầu tư đó.\n(Lựa chọn C) Một công ty chỉ được yêu cầu bao gồm trả phí, danh mục đầu tư tùy ý trong\ntổng hợp. Danh mục đầu tư không trả phí tùy ý cũng có thể được đưa vào. Tuy nhiên,\ntất cả các danh mục đầu tư không tùy ý phải được loại trừ vì chúng phản ánh các quyết định và hiệu quả hoạt động của khách hàng chứ không phải của công ty.\nNhững điều cần nhớ:\nTổng hợp là tổng hợp của một hoặc nhiều danh mục đầu tư dựa trên một nhiệm vụ, mục tiêu hoặc chiến lược đầu tư cụ thể. Quyết định đưa danh mục đầu tư vào một danh mục tổng hợp phải\ndựa trên các tiêu chí được thiết lập trước (tức là trước đó).\nGiải thích mục đích của các danh mục tổng hợp trong báo cáo hiệu suất\nLOS","qhtml":null},{"n":19,"q":"The fundamental purpose of the GIPS standards for firms is best described as:","opts":["fully, fairly, and ethically presenting a firm's investment performance.","serving as the global regulatory source to address controversial performance reporting.","setting a minimum threshold for composite performance reporting, verified by a third party."],"ans":"A","expl":"(GIPS®)\nTiêu chuẩn hiệu suất đầu tư toàn cầu là một cách tiếp cận được tiêu chuẩn hóa để trình bày\nhiệu suất đầu tư. Các tiêu chuẩn GIPS dựa trên nguyên tắc đạo đức rằng\nsự trình bày công bằng và tiết lộ đầy đủ về hiệu suất đầu tư là rất quan trọng đối với tính toàn vẹn của\nthị trường vốn và nghề đầu tư. Đối với các công ty , mục đích cơ bản của\ntuân thủ GIPS là trình bày hiệu suất đầu tư một cách đầy đủ, công bằng và có đạo đức .\n(Lựa chọn B) Viện CFA không phải là cơ quan quản lý. Tiêu chuẩn GIPS là một bộ tiêu chuẩn\ntự điều chỉnh đặt ra một khuôn khổ cho báo cáo hiệu suất toàn cầu mà không cố gắng\ngiải quyết mọi yếu tố (có thể gây tranh cãi hoặc không) trong các phương pháp báo cáo hiệu suất.\n(Lựa chọn C) Tiêu chuẩn GIPS đặt ra tiêu chuẩn cao hơn nhiều so với ngưỡng tối thiểu cho\nbáo cáo hiệu suất tổng hợp. Ngoài ra, xác minh của bên thứ ba là tùy chọn, mặc dù nó\nđược coi là phương pháp hay nhất.\nNhững điều cần nhớ:\nĐối với các công ty, mục đích cơ bản của GIPS là trình bày hiệu suất đầu tư một cách đầy đủ, công bằng,\nvà có đạo đức.\nGiải thích lý do tại sao các tiêu chuẩn GIPS được tạo ra, ai có thể yêu cầu tuân thủ và ai được hưởng lợi từ\ntuân thủ\nLOS","qhtml":null},{"n":20,"q":"For CFA Institute Members and Candidates, which of the following best describes an action\nthat violates the Code and Standards?","opts":["Delegating supervisory duties to subordinates who are not charterholders","Accepting supervisory responsibility if the compliance system is inadequate","Failing to detect violations despite instituting an effective compliance system"],"ans":"B","expl":"\"Các Thành viên và Ứng viên phải nỗ lực hợp lý để đảm bảo\nrằng bất kỳ ai chịu sự giám sát hoặc thẩm quyền của họ đều tuân thủ\nluật, quy tắc, quy định hiện hành và Quy tắc và Tiêu chuẩn.\"\nTrách nhiệm của Tiêu chuẩn IV(C) của Giám sát viên yêu cầu các Thành viên và Ứng viên\ngiám sát nhân viên khuyến khích hành vi tuân thủ luật pháp địa phương, các quy tắc do\ncông ty của họ thiết lập cũng như Quy tắc và Tiêu chuẩn. Họ cũng phải thực hiện các bước hợp lý để phát hiện và\nngăn chặn hành vi vi phạm. Thành viên hoặc Ứng viên gặp phải hệ thống\ntuân thủ không đầy đủ nên thông báo cho những người quản lý\ncông ty về những thiếu sót của hệ thống và đưa ra khuyến nghị về hành động khắc phục.\nBất kỳ Thành viên hoặc Ứng viên nào bị ngăn cản thực hiện trách nhiệm giám sát do\ndo những thiếu sót này nên từ chối bằng văn bản để nhận trách nhiệm giám sát\ncho đến khi hệ thống tuân thủ được khắc phục và đang cho phép kiểm soát đầy đủ. Việc chấp nhận\nvai trò giám sát khi hệ thống tuân thủ không đầy đủ sẽ không cho phép Thành viên hoặc\nỨng viên thúc đẩy sự tuân thủ của cấp dưới và do đó sẽ vi phạm Tiêu chuẩn.\n(Lựa chọn A) Theo Tiêu chuẩn IV(C), những người giám sát giám sát số lượng lớn nhân viên\ncó thể ủy quyền giám sát. Nhân viên được giao những trách nhiệm giám sát\nkhông nhất thiết phải là chủ sở hữu hợp đồng CFA.\n(Lựa chọn C) Người giám sát nên nỗ lực hợp lý để phát hiện hành vi phi đạo đức.\nTuy nhiên, việc không phát hiện hành vi đó không có nghĩa là vi phạm Tiêu chuẩn miễn là\nngười giám sát đảm bảo rằng có một hệ thống tuân thủ phù hợp. Trong trường hợp đó, hệ thống\ncó thể cần được xem xét lại.\nNhững điều cần nhớ:\nKhi Thành viên hoặc Ứng viên gặp phải hệ thống tuân thủ không đầy đủ, họ nên lưu ý\nnhững thiếu sót của hệ thống đến các nhà quản lý công ty và đưa ra\ncác đề xuất về hành động khắc phục. Các Thành viên và Ứng viên nên từ chối bằng văn bản để\nđảm nhận trách nhiệm giám sát cho đến khi hệ thống tuân thủ được khắc phục và cho phép\nkiểm soát đầy đủ.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":21,"q":"Hiroshi Tanaka, CFA, is a research analyst for Fuji Investments and covers the insurance\nsector. Due to client demand, Tanaka's manager asks him to initiate coverage on insurance\nbrokers. Tanaka owns stock in Union Insurance, the country's second-largest public insurance\nbroker, in a long-term investment account for his daughter's education. He cannot sell shares\nfrom the account since it is managed by a third party. Tanaka's wife is on the Union board of\ndirectors. To comply with the Code and Standards, Tanaka should most appropriately disclose\nto Fuji:","opts":["only his stock holdings in Union.","only his wife's board position with Union.","both his stock holdings and his wife's board position."],"ans":"C","expl":"\"Các Thành viên và Ứng viên phải tiết lộ đầy đủ và công bằng tất cả các thông tin\nnhững vấn đề có thể được dự kiến một cách hợp lý sẽ làm suy giảm khả năng của họ\nđộc lập và khách quan hoặc can thiệp vào các nghĩa vụ tương ứng của\nkhách hàng, khách hàng tiềm năng và nhà tuyển dụng của họ. Thành viên và\nỨng viên phải đảm bảo rằng những thông tin tiết lộ đó phải nổi bật, được\nđược cung cấp bằng ngôn ngữ đơn giản và truyền đạt những nội dung liên quan\nthông tin một cách hiệu quả. \"\nTiêu chuẩn VI(A) Công bố xung đột nhằm mục đích bảo vệ người sử dụng lao động và khách hàng bằng cách thúc đẩy\nminh bạch, cho phép họ đánh giá xem Thành viên hoặc Ứng viên có đang hành động hay không\nmột cách độc lập và khách quan khi đưa ra lời khuyên hoặc khuyến nghị đầu tư. Khi nào\nmột xung đột có thể được xem một cách hợp lý là cản trở khả năng của Thành viên hoặc Ứng viên\nđể tiến hành đánh giá đầu tư một cách khách quan, người sử dụng lao động và khách hàng phải\nđược thông báo về tất cả các chi tiết thích hợp của cuộc xung đột.\nĐối với người sử dụng lao động, việc tiết lộ mang lại cơ hội quyết định liệu Thành viên hay\nTính khách quan của ứng viên có thể bị suy giảm và sau đó phải thực hiện các hành động thích hợp để hạn chế hoặc ngăn chặn\nxung đột lợi ích. Cả xung đột tài chính và phi tài chính đều phải được tiết lộ.\nTrong kịch bản này, quyền sở hữu cổ phiếu của Union Insurance của Hiroshi Tanaka thể hiện sự xung đột giữa\ntiền lãi. Mặc dù không thể bán cổ phiếu nhưng anh ta vẫn được hưởng lợi từ việc tăng vốn;\ndo đó, cổ phần nắm giữ phải được tiết lộ cho Fuji Investments. Vị trí của vợ Tanaka trên\nBan giám đốc công đoàn đại diện cho một xung đột lợi ích tiềm ẩn. Mặc dù anh ấy không ở trên\ntrong hội đồng quản trị, vai trò của vợ anh ấy mang lại cho anh ấy động lực để chứng kiến ​​Union thành công; do đó, vị trí của cô ấy cũng\nphải được tiết lộ cho Fuji (Lựa chọn A và B) .\nNhững điều cần nhớ:\nKhi xung đột có thể được xem một cách hợp lý là cản trở khả năng của Thành viên hoặc Ứng viên\nĐể tiến hành đánh giá đầu tư một cách khách quan, người sử dụng lao động và khách hàng phải được thông báo về\nxung đột. Đối với người sử dụng lao động, việc tiết lộ thông tin mang đến cơ hội quyết định liệu Thành viên có\nhoặc Tính khách quan của Ứng viên có thể bị suy giảm và cần có những hành động thích hợp để hạn chế hoặc ngăn chặn\nxung đột lợi ích.\nĐề xuất các biện pháp và thủ tục được thiết kế để ngăn chặn hành vi vi phạm Quy tắc đạo đức và\nTiêu chuẩn ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":22,"q":"Chang Xue, CFA, is hired as an associate research analyst by Phoenix Capital, where she helps\nher senior analyst in writing research reports. After several months, Chang notices that her\nsenior analyst receives material nonpublic information during discussions with management of\ncovered companies. She suspects this information is sometimes used to change the\nrecommendations on those companies, although the specific information is not disclosed in the\nresearch reports.\nActing on material nonpublic information is against the law in the country where Phoenix\noperates, but since the report does not disclose any material nonpublic information, Chang is\nnot sure what to do. She brings this up to Li Tengfei, the chief compliance officer for Phoenix.\nLi tells Chang that she would not be found guilty of breaking the law since no information is\ndisclosed in the report, so she should continue to assist in writing the reports. To best comply\nwith the Standards, Chang should:","opts":["dissociate from her role collecting data for her senior analyst.","do nothing since she is not the person using material nonpublic information.","do nothing since she received approval to continue from the firm's compliance officer."],"ans":"A","expl":"\"Thành viên và Ứng viên phải hiểu và tuân thủ\ntất cả luật, quy tắc và quy định hiện hành (bao gồm cả CFA\nQuy tắc đạo đức và quy định của Viện Tiêu chuẩn ứng xử\nchuyên nghiệp) của bất kỳ chính phủ, tổ chức quản lý, cơ quan cấp phép\n hoặc hiệp hội nghề nghiệp nào quản lý các hoạt động nghề nghiệp của họ. Trong trường hợp có xung đột, các Thành viên\nvà Ứng viên phải tuân thủ luật, quy tắc,\nhoặc quy định nghiêm ngặt hơn. phải tránh mọi\nvi phạm luật, quy tắc hoặc quy định đó.\"\nKiến thức về Tiêu chuẩn I(A) về Luật yêu cầu Thành viên và Ứng viên hiểu rõ luật\ncủa tất cả các quốc gia nơi họ cư trú và kinh doanh để biết liệu hành động của họ có thể\ngóp phần vi phạm hay không. Nếu một hành động
