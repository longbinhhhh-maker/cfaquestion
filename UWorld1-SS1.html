ease, the lessor removes the leased asset from its\nbalance sheet and simultaneously records a receivable. Subsequently, the lessor reports\ninterest revenue earned from the financing provided to the customer.\nExplain the financial reporting of leases from the perspectives of lessors and lessees\nLOS", "qhtml": null}, {"n": 65, "q": "A real estate analyst wants to analyze the relationship between the price of single-family\nhomes and their square footage. A linear regression of 50 houses results in:\nan intercept of $85,501.89 with a standard error of $19,800.12, and\na slope coefficient of $176.34 with a standard error of $13.41.\nIf the critical t -values at a 5% significance level are 2.0106 (two-sided) and 1.6772 (one-\nsided), the most appropriate conclusion is that:", "opts": ["the houses in the sample cost, on average, $176.34 per square foot.", "there is evidence supporting the hypothesis that the slope is greater than $155.", "there is evidence supporting the hypothesis that the slope is different from $205."], "ans": "C", "expl": "The t -statistic is used to evaluate the statistical significance of a simple linear regression.\nAnalysts can test whether the population intercept ( b ) and slope ( b ) differ from\n0 1\nhypothesized values (ie, if b ≠ B , b > B , or b < B ). The t -test compares:\ni i i i i i\nthe appropriate critical t -value , which is based on the desired level of\nsignificance and degrees of freedom, with\nthe t -statistic , shown above as the ratio of the difference between the estimated slope\nand its hypothesized value to its standard error.\nIn this scenario, the real estate analyst runs a linear regression that results in the equation:\nHome price (in $) = 85,501.89 + [176.34 × Home area (in square feet)]\nThe analyst wants to understand if there is evidence supporting two hypotheses: that the\nslope is greater than $155 (ie, a one-tailed test) and that the slope is different from $205 (ie,\na two-tailed test). The tests are as follows:\nTherefore, there is sufficient evidence supporting the hypothesis that\nthe slope is different from $205 , so the test rejects the null hypothesis that the slope =\n205. However, the data do not support the hypothesis that the slope is greater than\n$155 (Choice B) , so the test fails to reject the hypothesis that the slope could be less than or\nequal to 155.\nNote that the slope is not an indication of price per square foot since the intercept must also\nbe considered in the calculation. For example, a 1,000-square-foot home should cost\n$261,841.89 (= 85,501.89 + 176.34 × 1,000) on average, or $261.84 per square\nfoot (Choice A) .\nThings to remember:\nThe t -statistic is the ratio of the difference between the estimated coefficient and its\nhypothesized value to its standard error. The t -statistic can be used to test whether the\npopulation intercept and slope differ from hypothesized values.\nCalculate and interpret measures of fit and formulate and evaluate tests of fit and of regression\ncoefficients in a simple linear regression\nLOS", "qhtml": null}, {"n": 66, "q": "An analyst gathers the following data to analyze the year-over-year change in a company's\nliquidity position:\n20X4 20X3\nCash 202 210\nShort-term marketable securities 25 25\nAccounts receivable 40 42\nInventory 65 48\nAccounts payable 135 140\nCurrent portion of long-term debt 65 80\nBased only on this information, which of the following most likely contributed to the year-over-year\nincrease in the quick ratio?", "opts": ["increase in inventory.", "decrease in accounts receivable.", "decrease in current portion of long-term debt."], "ans": "C", "expl": "The quick ratio is a liquidity ratio that measures a company's ability to meet its current liabilities\nwith its quick assets. It is a more conservative measure than the current ratio since the quick ratio\nexcludes inventory, which is usually the least liquid current asset. However, the quick ratio is less\nconservative than the cash ratio since the quick ratio includes accounts receivable.\n20X4 20X3 Change\nCash 202 210 −8\nShort-term marketable securities 25 25 0\nAccounts receivable 40 42 −2\nQuick assets 267 277 −10\nAccounts payable 135 140 −5\nCurrent portion of long-term debt 65 80 −15\nCurrent liabilities 200 220 −20\nQuick ratio\n1.34 1.26\n(Quick assets / Current liabilities)\nIn this scenario, the quick ratio increased from 1.26 to 1.34; based on this metric, the company\nimproved its ability to meet its current obligations. This increase is due to the decrease in current\nliabilities from 220 to 200, which is mostly due to the decrease in the current portion of long-term\ndebt.\n(Choice A) An increase in inventory would increase the current ratio, not the quick ratio, since\ninventory is not included in calculating the quick ratio.\n(Choice B) A decrease in accounts receivable would result in a decrease in the quick ratio.\nThings to remember:\nThe quick ratio is a liquidity ratio that measures a company's ability to meet its current liabilities\nwith its quick assets. Quick assets typically consist of cash, marketable securities, and accounts\nreceivable. Current liabilities typically consist of accounts payable and current portion of long-term\ndebt (if there is interest-bearing debt due within a year).\nCalculate and interpret activity, liquidity, solvency, and profitability ratios - LOS", "qhtml": null}, {"n": 67, "q": "A firm invests in publicly traded corporate bonds. The firm's management does not intend to\nactively trade these bonds but may consider selling if a profitable opportunity arises. The firm\nshould most appropriately capture changes to the fair values of the bonds in:", "opts": ["the income statement.", "cash flows from investing.", "other comprehensive income."], "ans": "C", "expl": "Financial instruments that a firm does not intend to hold to maturity should\nbe measured and reported at fair value . The two fair value reporting methods are fair\nvalue through net income (FVNI) and fair value through other comprehensive income\n(FVOCI). The appropriate method is determined by management's intent.\nIf management intends to actively trade the investment, then the investment should be\naccounted for using the FVNI method: changes to fair value (ie, unrealized gains and\nlosses) are captured as income statement gains (or losses) (Choice A) .\nIf management does not intend to actively trade the investment, but may sell if\nthe right opportunity arises , then the investment should be accounted for using the\nFVOCI method: unrealized gains and losses bypass the income statement and appear as\nOCI on the statement of comprehensive income.\nIn this scenario, the firm may consider selling if the right opportunity surfaces, so the\ncorporate bonds should be classified as FVOCI securities.\n(Choice B) Changes in fair value (ie, unrealized gains and losses) do not reflect any\nexchange of securities for cash. Realized gains (or losses) on FVOCI securities are captured in\ncash flow from investing activities (CFI) when the securities are sold for cash.\nThings to remember:\nIf management does not intend to actively trade a financial instrument, but may sell under the\nright circumstances, the instrument is considered \"available for sale\" and changes to fair value\n(ie, unrealized gains and losses) will be reported as other comprehensive income through the\nFVOCI method. If management intends to actively trade a financial instrument, then\nunrealized gains (or losses) will be reported on the income statement through the FVNI\nmethod.\nExplain the financial reporting and disclosures related to financial instruments\nLOS", "qhtml": null}, {"n": 68, "q": "In a period of increasing inventory costs, a company using FIFO instead of LIFO will most\nlikely experience a lower:", "opts": ["current ratio.", "gross profit margin.", "inventory turnover ratio."], "ans": "C", "expl": "Changing inventory unit costs have different effects on a company's reported financials,\ndepending on its inventory valuation method. With the FIFO method, the oldest units\npurchased are used in the calculation of cost of goods sold (COGS) whereas the most recent\nadditions are used to value inventory. During periods of rising inventory costs , the most\nexpensive units \"remain\" in inventory whereas the least expensive units are used\nfor COGS . In comparison, a company using LIFO experiences a larger COGS and smaller\ninventory.\nA company's inventory turnover ratio measures its efficiency in managing its inventories.\nIn periods of rising inventory costs, a company reporting with the FIFO method instead of\nLIFO will report lower COGS , which is the numerator of the inventory turnover ratio,\nand higher inventory , which is the denominator . Therefore, the company's inventory ratio\nwill be lower using FIFO compared to LIFO.\n(Choice A) Current ratios are higher for companies reporting in FIFO during periods of rising\ninventory costs, since inventories are larger and current liabilities are unchanged.\n(Choice B) Gross profit margins are higher for companies using FIFO during periods of rising\ninventory costs, since a lower COGS results in a higher gross profit and revenue remains\nunchanged.\nThings to remember:\nSince a company using FIFO calculates its COGS with the oldest units purchased, during\nperiods of rising inventory costs, the least expensive units are used in COGS. This results in a\nlower COGS and a higher average inventory and, therefore, a lower inventory turnover ratio.\nCalculate and explain how inflation and deflation of inventory costs affect the financial statements\nand ratios of companies that use different inventory valuation methods\nLOS", "qhtml": null}, {"n": 69, "q": "An analyst compiles the following financial data for two companies:\nSelected Financial Data\nCompany A ($ millions)\nCash and cash equivalents 300 Accounts payable 140\nMarketable securities 60 Taxes payable 40\nAccounts receivable 90 Short-term debt 420\nInventories 240\nCompany B\nCash ratio 0.56\nQuick ratio 0.85\nCurrent ratio 1.09\nBased only on this data, which ratio indicates that Company A has a greater risk of being\nunable to meet its short-term obligations than Company B?", "opts": ["Cash ratio", "Quick ratio", "Current ratio"], "ans": "B", "expl": "Balance sheet ratios such as liquidity ratios can provide some insights into a company's short-\nterm and long-term financial health. Liquidity ratios address a\ncompany's ability to meet its short-term liabilities using its short-term assets.\nIn this scenario, two companies' liquidity ratios are being compared. Lower ratios indicate\ngreater risk that a company may struggle to meet its short-term obligations (ie, the company\nhas more liquidity risk since it has fewer assets available to \"cover\" its liabilities). Company\nA's ratios can be calculated as:\nCompany A's quick ratio of 0.75 is less than Company B's quick ratio of 0.85. This suggests\nCompany A has less short-term asset value relative to its short-term obligations and greater\nrisk of being unable to meet its short-term obligations than Company B.\n(Choice A) Company A's cash ratio of 0.60 is greater than Company B's cash ratio of 0.56.\nThis ratio suggests Company A has less risk of being unable to meet its short-term obligations.\n(Choice C) Company A's current ratio of 1.15 is greater than Company B's current ratio of\n1.09. This ratio suggests Company A has less risk of being unable to meet its short-term\nobligations.\nThings to remember:\nLiquidity ratios can provide insight into a company's ability to meet its short-term liabilities\nusing its short-term assets. Lower ratios indicate greater risk that a company may struggle to\nmeet its short-term obligations since it has fewer assets available to \"cover\" its liabilities.\nCalculate and interpret common-size balance sheets and related financial ratios\nLOS", "qhtml": null}, {"n": 70, "q": "A country's legislature appoints the head of its central bank. In addition, the country's finance\nminister is charged by law to set the definition of, and the acceptable level of, inflation for the\ncentral bank. This central bank most likely has:", "opts": ["target independence.", "operational independence.", "both target and operational independence."], "ans": "B", "expl": "Many central bankers and government policymakers believe the best way to maintain price\nstability is to target an explicit level or range of inflation . In many economies, an\ninflation-targeting framework is the foundation of monetary and macroeconomic policy.\nCentral bank independence is believed to protect policy determination and implementation\nfrom political pressures, which increases policy effectiveness. A central bank may be:\ntarget independent and thus able to define the target rate or range of inflation;\noperationally independent, so it can define the policy approach and tools used to\nreach/maintain the target;\nboth target and operationally independent; or\nneither target nor operationally independent.\nIn this scenario, it is the task of the central bank to maintain the inflation target assigned by\nthe finance minister, who is bound by law to set the definition and acceptable level of\ninflation. Therefore, this central bank has operational independence but not target\nindependence (Choices A and C) .\nSome central banks are both operationally independent and target independent. Such central\nbanks not only have the flexibility to choose the monetary policy tools for maintaining price\nstability, but they can also determine the definition of inflation, the rate of inflation that they\ntarget, and the horizon for achieving the target.\nThings to remember:\nA central bank's independence from the government is considered an indicator of monetary\npolicy effectiveness. A goal of monetary policy for most central banks is maintaining price\nstability; one approach is to use inflation targets. A central bank may have target\nindependence (ability to define the inflation target); operational independence (ability to\ndetermine its policy implementation); both kinds of independence; or neither kind.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and\nexchange rate targeting in expansionary or contractionary monetary policy; and describe the\nlimitations of monetary policy\nLOS", "qhtml": null}, {"n": 71, "q": "A company acquires an asset that has a cost of ¥90 million, a useful life of 3 years, and zero\nsalvage value. The asset will be abandoned at the end of 3 years. The company does not pay\ndividends. All else being equal, expensing the cost of this asset, instead of capitalizing it,\nwill most likely result in:", "opts": ["higher return on equity at the end of the first year.", "lower cash from investing activities in the first year.", "the same retained earnings at the end of the asset's useful life."], "ans": "C", "expl": "Expensing an asset captures its full cost on the income statement when the asset is\npurchased. In contrast, capitalizing an asset initially captures its full cost as a long-term asset\non the balance sheet and subsequently spreads its depreciation expense to the income\nstatement over the asset's useful life.\nDue to this timing difference, expensing results in lower net income initially and higher net\nincome in subsequent years. In contrast, net income is more even each year during the\nasset's useful life when its cost is capitalized. However , the total net income over the\nasset's life is the same under both methods. Since retained earnings are the accumulation of\nnet income, net of any dividends paid (which in this case is zero), retained earnings at the end\nof the asset's life are identical whether the asset is capitalized or expensed.\nFor example, assume this company begins operations in Year 0 with ¥200 million in cash and\npurchases the asset in Year 1. Furthermore, assume the asset generates annual revenue of\n¥100 million, as shown:\nIf expensed, the full ¥90 million cost is captured as net income in Year 1. If capitalized, the\n¥90 million appears on the balance sheet under Gross PPE in Year 1 and subsequently reduces\neach year's income by ¥30 million (before tax) in depreciation (assuming the straight-line\nmethod is used). At the end of 3 years, retained earnings under both scenarios equal ¥168\nmillion.\n(Choice A) Expensing (compared to capitalizing) an asset results in lower ROE (= net income\n/ average shareholders' equity) during the first year since Year 1's net income is proportionally\nreduced more than average shareholders' equity.\n(Choice B) Expensing an asset results in greater cash flow from investing activities since the\nfull cost, which is a negative cash flow, is reflected in cash from operating activities.\nThings to remember:\nExpensing or capitalizing an asset purchase initially affects the company's financial results\ndifferently, but the cumulative impact to retained earnings under both methods is the same\nover time.\nAnalyze and interpret financial statement disclosures regarding property, plant, and equipment and\nintangible assets\nLOS", "qhtml": null}, {"n": 72, "q": "A company sells a machine with a carrying amount of $500,000 and incurs a loss of\n$100,000. The accumulated depreciation on the machine at the time of sale is $200,000.\nWhat is the most likely impact on the financial statements?", "opts": ["Cash flows from investing activities increase by $400,000.", "Cash flows from operating activities decrease by $100,000.", "The gross book value of noncurrent assets is reduced by $300,000."], "ans": "A", "expl": "Gain (loss) on sale of assets = Sales price − Carrying amount\nSales price = Gain (loss) on sale of assets + Carrying amount\n= (100,000) + 500,000 = 400,000\nCompanies often dispose of long-term assets (eg, equipment) by selling them. The gain\n(loss) on the sale is the difference between the sales proceeds and the asset's carrying\namount (= Historical cost − Accumulated depreciation) at the time of sale. The carrying\namount can also be referred to as the net book value.\nIn this scenario, the carrying amount of the asset is 500,000, so a 100,000 loss from selling it\nimplies sales proceeds of 400,000.\nThe company would have recognized:\na loss of $100,000 from sale of assets, which would be reported on the income\nstatement,\nthe removal of 500,000 of long-term assets off the balance sheet, and\nan increase in cash flows from investing of 400,000 on the cash flow statement.\n(Choice B) Cash flows from operating activities are not impacted by the loss from the sale\nsince disposing of long-term assets is considered an investing activity. Note that CFO is\nprimarily shown in the indirect format, which is a reconciliation schedule between net income\nand CFO. Although gains (losses) would be subtracted (added) to net income, it is simply for\nreconciliation purposes and does not represent an actual CFO change.\n(Choice C) The gross book value of noncurrent assets would be reduced by the machine's\nhistorical cost, which is $700,000 (= $500,000 + $200,000).\nThings to remember:\nCompanies often dispose of long-term assets by selling them. The gain (loss) on the sale is\nthe difference between the proceeds from the sale and the asset's carrying amount at the time\nof sale. Proceeds from the sale are reported under cash flows from investing activities.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and\nintangible assets affect the financial statements and ratios\nLOS", "qhtml": null}, {"n": 73, "q": "An analyst compares the risk of Portfolio A to Portfolio B over the last four years and gathers the\nfollowing information about both portfolios:\nPortfolio B\nAnnual Returns (%)\n−4\n11\n2\n−13\nPortfolio A Portfolio B\nMean (%) 1 −1\nRange (%) 23\nMean Absolute Deviation 8\nSample Standard Deviation 10.49 10.10\nThe comparison shows that Portfolio B is riskier in terms of the:", "opts": ["range only.", "range and mean absolute deviation only.", "range, mean absolute deviation, and standard deviation."], "ans": "A", "expl": "To answer this question, you need to calculate only the mean absolute deviation (MAD) of Portfolio\nB. The range is included in each answer choice, and the standard deviations of both portfolios are\ngiven.\nMean absolute deviation (MAD), like standard deviation and range, is a measure of variability\n(dispersion) around a mean and can be used to gauge risk . MAD is calculated as follows:\n1. Determine the mean of the observations.\n2. Calculate the absolute difference between each observation and its mean (this eliminates the\npossibility of negative numbers).\n3. Sum all the calculations from the previous step and divide the sum by the number of\nobservations.\nMAD for Portfolio B is calculated as:\nPortfolio B's range of returns [11 − (−13) = 24%] is greater than the Portfolio A's range of returns\n(23%), so Portfolio B has greater risk in terms of range.\nPortfolio A Portfolio B\nMean (%) 1 −1\nRange (%) 23 24\nMean Absolute Deviation 8 7.5\nSample Standard Deviation 10.49 10.10\nThe MAD of Portfolio B is less than the MAD of Portfolio A, which indicates that Portfolio B's returns\nhave less variability around the mean and less risk than Portfolio A. The standard deviation of\nPortfolio B is less than that of Portfolio A as shown above, also indicating less risk (Choices B and\nC) .\nThings to remember:\nMean absolute deviation (MAD), like standard deviation and range, is a measure of variability\n(dispersion) around a mean and can be used to gauge risk. Less dispersion around the mean\nindicates less variability and less risk.\nCalculate, interpret, and evaluate measures of dispersion to address an investment problem - LOS", "qhtml": null}, {"n": 74, "q": "An analyst runs a regression with 25 observations to determine how the debt-to-capital ratio\naffects a company's bond yield spread. Selected data are presented below:\nCoefficient Standard error\nIntercept 0.9037 0.2266\nDebt-to-capital ratio 0.0963 0.0064\nBoth variables are percentages (eg, a debt-to-capital ratio of 50% is stated as 50). The critical t -\nvalues at a 5% significance level ( α ) are 2.069 (two-sided) and 1.714 (one-sided). Assuming that\nthe standard error of the forecast ( s ) is 0.4130, the prediction interval for the bond yield spread of\nf\na company with a 40% debt-to-capital ratio is closest to:", "opts": ["3.90 to 5.61", "4.04 to 5.46", "4.34 to 5.17"], "ans": "A", "expl": "Simple linear regressions can be used to predict a dependent variable ( Ŷ ) based on a forecasted\nf\nvalue of the independent variable ( X ). The forecast's prediction interval is the expected\nf\nrange of values around Ŷ for a given level of significance ( α ). While a confidence interval\nf\nestablishes the range for population parameters, the prediction interval applies to individual\nobservations.\nFor example, if α = 10%, there is a 90% probability that the actual value of Y will be within the\nprediction interval . The range (ie, the width) of the interval is a function of:\nthe critical t -value, which is a reliability factor, and\nthe standard error of the forecast ( s ), which measures the accuracy of the forecast (for a\nf\ngiven value of X ).\nf\nIn this scenario, the debt-to-capital ratio is 40%, so X = 40, the standard error of the forecast is\nf\ngiven as s = 0.4130, and α = 5%. The prediction interval is calculated as follows:\nf\nSo the prediction interval is from 3.90 to 5.61 .\n(Choice B) A prediction interval of 4.04 to 5.46 results from incorrectly calculating the interval\nwith the one-sided t (1.714). The interval is a range of probable outcomes with a lower bound\nc\nand upper bound around Ŷ , so the analyst must use the two-sided t .\nf c\n(Choice C) A prediction interval of 4.34 to 5.17 results from calculating Ŷ ± s , incorrectly\nf f\nignoring t , which produces a narrower prediction interval.\nc\nThings to remember:\nA forecast's prediction interval is the expected range of values around the predicted dependent\nvariable. The greater (or less) the level of significance and the number of observations, and the\nbetter (or worse) the accuracy of the regression, the narrower (or wider) the interval will be.\nCalculate and Interpret the predicted value for the dependent variable, and a prediction interval for\nit, given an estimated linear regression model and a value for the independent variable - LOS", "qhtml": null}, {"n": 75, "q": "An analyst gathers the following information on two competitors, concerning their differences in\naccounting methods.\nCompany 1 Company 2\nClassification of investments\nAvailable-for-sale Trading securities\nheld indefinitely\nMajority consists\nComposition of intangible assets No goodwill\nof goodwill\nDepreciation method on fixed assets Straight line Accelerated\nTo facilitate proper financial comparison, the analyst should most appropriately :", "opts": ["adjust Company 2's gross book value of fixed assets.", "reduce Company 1's net income for fair value investment gains.", "reduce Company 1's amount of intangible assets by its goodwill balance."], "ans": "C", "expl": "Common analyst adjustments\nCategory Issue Adjustment\nAvailable-for-sale vs. trading securities Adjust net income and/or other\nInvestments\nclassification comprehensive income\nComparing different cost methods (FIFO,\nInventory Adjust COGS and inventory balance\nLIFO, weighted average, specific ID)\nStraight-line vs. accelerated depreciation Adjust depreciation expense and fixed\nFixed assets\nmethods assets' net book value\nSignificant M&A growth vs. internal organic Adjust book value of intangible assets\nGoodwill\ngrowth for goodwill\nM&A = mergers and acquisitions.\nAnalysts often compare companies that use different accounting methods and/or rely on\ndistinct assumptions and estimates when preparing financial results. Differences between IFRS\nand US GAAP may also distort comparison. Analysts often adjust financial statements for such\ndifferences and/or requirements to facilitate \"apples-to-apples\" comparisons.\nIn this scenario, Company 1's intangible assets include significant goodwill, while Company 2 has\nno goodwill. Goodwill results purely from mergers and acquisitions activities and represents the\npurchase premium over an acquired company's fair value of net identifiable assets. Although\ngoodwill is periodically tested for impairment, its value is subjective (ie, based on what the\nacquirer paid) and may overstate the acquirer's assets. Therefore, an analyst should adjust\nCompany 1's book value of intangible assets for better comparison with Company 2.\n(Choice A) Net book value, not gross book value of fixed assets, should be adjusted when\ncomparing companies that use different depreciation methods. Gross book value represents the\nhistorical purchase price and remains constant. Net book value is gross book value adjusted for\naccumulated depreciation.\n(Choice B) Company 1 appropriately classifies investments that are held indefinitely as available-\nfor-sale. Fair value gains bypass net income and flow directly into other comprehensive income.\nThus, no adjustment to Company 1's net income is necessary.\nThings to remember:\nDifferent companies often use different accounting methods and rely on distinct assumptions and\nestimates when preparing financial results. Differences between IFRS and US GAAP may also\ndistort comparison. Analysts often adjust financial statements for such differences and/or\nrequirements to facilitate comparisons.\nDescribe accounting methods (choices and estimates) that could be used to manage earnings,\ncash flow, and balance sheet items - LOS", "qhtml": null}, {"n": 76, "q": "A company reports the following information:\nCash flow item KRW millions\nNet income 660\nDepreciation and amortization expense −260\nInterest expense −40\nWorking capital expenditures −120\nCapital expenditures −200\nProceeds from long-term debt 535\nRepayments of long-term debt −500\nIf the company has a 25% tax rate, which of the following cash flow measures is greatest ?", "opts": ["Free cash flow", "Free cash flow to equity", "Free cash flow to the firm"], "ans": "B", "expl": "Free cash flow (FCF) determines how much excess cash a company generates from its\noperations after covering its capital expenditures . FCF may be used in various ways (eg,\nreinvesting in the company's business, paying dividends, repaying debt). An analyst can calculate\nthis cash flow's value to the company's suppliers of debt and equity capital (ie, free cash flow to\nthe firm [FCFF]) or to only equity shareholders (ie, free cash flow to equity [FCFE]) by adjusting\nfor cash items available to those groups.\nFCFF adds back after-tax interest payments since it includes suppliers of debt capital, and interest\npayments are paid to the company's debtholders. Since FCFE is available to a company's equity\nshareholders, it adds back the net borrowing (ie. net change in debt). Companies may use any\nadditions to debt for the benefit of equity shareholders through dividend payments or share\nrepurchases.\nFCF = NI + NCC − ΔWC − ΔFC\n=660 + 260 − 120 − 200 = 600\nFCFE = NI + NCC − ΔWC − ΔFC + Net borrowing\n=FCF + Net borrowing\n=600 + (535 − 500) = 635\nFCFF = NI + NCC − ΔWC − ΔFC + Int (1 − t )\n=FCF + Int (1 − t )\n=600 + 40 (1 − 0.25) = 630\nIn this scenario, the largest measure of FCF is the company's FCFE, which is supported by KRW 35\nmillion in net borrowing (Choices A and C) .\nThings to remember:\nFree cash flow determines how much excess cash a company generates after covering its capital\nexpenditures. An analyst can calculate this cash flow's value to the company's suppliers of\ndebt and equity capital or to only equity shareholders by adjusting for cash items available to\nthose groups.\nCalculate and interpret free cash flow to the firm, free cash flow to equity, and performance and\ncoverage cash flow ratios - LOS", "qhtml": null}, {"n": 77, "q": "An analyst has developed a screening test to determine whether a company's earnings will\ndecrease. If the company does not pass the test, it is likely that its earnings will decrease in the\nnext quarter. The table below shows relevant information:\nEvent Probability\nProbability of an earnings decrease in the next quarter 0.47\nProbability of passing the test 0.62\nProbability of an earnings decrease in the next quarter\n0.90\ngiven it did not pass the test\nBased on this information, the probability that the company's earnings will decrease in the next\nquarter given that the company passes the test is closest to:", "opts": ["0.13", "0.21", "0.34"], "ans": "B", "expl": "This question asks the candidate to calculate the probability that a company's earnings will\ndecrease given that it passes a screening test [ P (Earnings decrease | Passes test)]. This is an\nexample of a conditional probability. The question does not provide the information needed to\ndirectly solve for the answer, but the solution can be derived using the total probability rule.\nThe total probability of an event is the sum of the joint probabilities of its mutually exclusive\nand exhaustive scenarios. In this question, the total probability of an earnings decrease is the sum\nof:\nP (Passes test AND Earnings decrease) and\nP (Does not pass the test AND Earnings decrease).\nEach joint probability is the product of two probabilities . The first term is the unconditional\nprobability of the company passing (or does not pass) the test, and the second is a conditional\nprobability (ie, its earnings decrease given that it passes (or not passes) the test). The joint\nprobability is P(A and B) = P(A) × P(B | A) . The information needed to calculate the probability\nthat the company will not pass the test AND have an earnings decrease [ P (Does not pass test AND\nEarnings decrease)] is given: (1 − 0.62) × 0.90 ≈ 0.34 (Choice C) .\nThe information needed to calculate the probability that the company will pass the test AND have\nan earnings decrease is not given; however, it can be deduced since the total probability of an\nearnings decrease is given as 0.47. These two joint probabilities of an earnings decrease are\nmutually exclusive and exhaustive and sum to the total probability (0.47); therefore, the unknown\njoint probability is 0.47 − 0.342 = 0.128 (Choice A) .\nOnce the joint probability P (Passes test AND Earnings decrease) is known, and since the\nunconditional probability of passing the test is given [ P (Passes test) = 0.62], the conditional\nprobability can be calculated by rearranging the formula for joint probability: P ( B | A ) = P ( A and B )\n/ P ( A ), or\nP (Passes test AND Earnings decrease) / P (Passes test) = 0.128 / 0.62 ≈ 0.21\nThings to remember:\nThe total probability of an event is the sum of the probabilities of its mutually exclusive and\nexhaustive scenarios. Each scenario can consist of a joint probability of two events, where one\nprobability is unconditional and the other is conditioned on whether the first event occurs.\nFormulate an investment problem as a probability tree and explain the use of conditional\nexpectations in investment application - LOS", "qhtml": null}, {"n": 78, "q": "A company reporting under US GAAP has deferred tax assets that exceed deferred tax\nliabilities. All else equal, a reduction in the tax rate will most likely increase the company's:", "opts": ["operating profit.", "debt-to-asset ratio.", "shareholders' equity."], "ans": "B", "expl": "Deferred tax asset vs. deferred tax liability\nIncome tax expense < taxes payable\nDeferred tax asset\nCreated by overpaying tax in current period\nIncome tax expense > taxes payable\nDeferred tax liability\nCreated by underpaying tax in current period\nDeferred tax items (ie, deferred tax assets and liabilities) arise from the difference\nbetween income tax expense (for accounting purposes) and taxes payable (for tax\nreporting) for a period. Differences can occur as tax expense is calculated according to\naccounting standards whereas taxes payable are calculated according to the tax code.\nDeferred tax assets (DTA) arise when taxable profit is greater than accounting profit and\ntaxes payable are greater than tax expense.\nDeferred tax liabilities (DTL) arise when taxable profit is less than accounting profit and\ntaxes payable are less than tax expense.\nIn this scenario, the value of deferred tax items is directly correlated with the tax rate .\nAll else equal, when the tax rate decreases (as is the case in this scenario), DTA and DTL\ndecrease. Since the company's DTA exceeds its DTL, it has a net DTA balance, which is\nreported as a net long-term asset under US GAAP. Therefore, a decrease in the tax rate\nultimately reduces total assets, which increases the debt-to-asset (debt/asset) ratio.\n(Choice A) Operating profit is pre-tax, so a decrease in tax expense will not affect operating\nprofit.\n(Choice C) Since the company has a net DTA, decreasing the tax rate also reduces the DTA.\nFrom the accounting equation assets = liabilities + equity, equity would have to decrease, not\nincrease, to maintain the balance.\nThings to remember:\nThe value of deferred tax items is directly correlated with the tax rate. When there is a net\ndeferred tax asset balance, a decrease in the tax rate decreases that balance and thus total\nassets, increasing the debt-to-asset ratio and decreasing shareholders' equity.\nCalculate, interpret, and contrast an issuer’s effective tax rate, statutory tax rate, and cash tax\nrate\nLOS", "qhtml": null}, {"n": 79, "q": "In an economy that operates under an exchange rate targeting policy, which of the following\nconditions is most likely ?", "opts": ["The central bank is required to maintain a fixed policy interest rate.", "Monetary policy can focus on internal rather than external considerations.", "Target country inflation (deflation) is imported regardless of the effect on the domestic economy."], "ans": "C", "expl": "Monetary policy targets\nStated Long-run Country\npolicy target economic goal characteristics\nFixed rate or Price stability leading\nInflation range for specified to better long-run\nprice index performance\nLarger,\nmore developed\nOptimize across\neconomies\nInterest Target adjusted over multiple goals\nrates business cycle (employment,\nGDP growth)\nSmaller,\nStability versus less developed\nExchange Fixed rate or range\neconomies of major with significant\nrate versus target currency\ntrading partners import/export\nsectors\nThe goal of monetary policy is to optimize economic welfare, although central banks are given\na variety of policy targets intended to attain that goal. Central banks may have:\nOne policy target (ie, single mandate) that guides all policy actions:\nA specific inflation target (eg, 2%) or a specified range\nAn exchange rate target , which is a fixed level or band of values versus a major\ncurrency (eg, EUR)\nMultiple policy targets that seek an optimal balance among potentially conflicting goals:\nHigh employment\nGDP growth\nStable prices\nStable exchange rate\nWhen a country uses exchange rate targeting, its policies are designed to maintain an\nexchange rate target (or range) with another currency, usually from a larger and/or more\nstable economy. As a result, if the target currency's economy experiences inflation or\ndeflation, so does the economy that targets it.\nIn this situation, since all policy actions must be aimed at maintaining the targeted currency\nexchange value, the targeting economy gives up monetary policy independence . This may\nadversely affect both the targeting economy and its ability to address any adverse effects. For\nexample, exchange rate targeting may keep a central bank from exercising independent\nmonetary policies based solely on domestic conditions, such as maintaining a fixed policy\ninterest rate or adjusting monetary policy (Choices A and B) .\nThings to remember:\nExchange rate targeting results in giving up monetary policy independence. Maintaining the\ntarget often means tolerating conditions that adversely affect the domestic economy.\nDescribe tools used to implement monetary policy tools and the monetary transmission\nmechanism, and explain the relationships between monetary policy and economic growth,\ninflation, interest, and exchange rates\nLOS", "qhtml": null}, {"n": 80, "q": "The following table shows an investment's closing price on each day:\nDate Closing Price\nMarch 1 50\nApril 1 74\nMay 1 65\nBased only on this information, the continuously compounded return of the investment from\nMarch 1 to May 1 is closest to:", "opts": ["23.1%", "26.2%", "30.0%"], "ans": "B", "expl": "A continuously compounded rate of return is one way to measure an asset's change in\nvalue over a holding period, assuming that changes in value are compounded continuously.\nThis differs from discrete compounding, which assumes that compounding occurs at evenly\nspaced intervals, such as weekly or annually. The asset's change in value has two elements:\nChange in price over the period (ie, gain, loss)\nIncome received from the asset over the period\nThese two elements are used to calculate the asset's total return. The formula for calculating\ntotal return is:\nThe total return is used to calculate the holding period return (HPR), which is (Total return\n− 1).\nIn this scenario, the investment does not pay interest or a dividend, so its HPR from March 1\nto May 1 is (65 / 50) − 1 = 0.3, or 30%. The continuously compounded return over this\nperiod is the natural logarithm of (1 + HPR) = the natural logarithm of (Total return), or ln(1\n+ 0.3) ≈ 26.2%.\n(Choice A) 23.1% is the approximate result incorrectly calculating the HPR as the average of\nthe three prices divided by the beginning price, and then calculating the natural logarithm of\n(1 + result), as shown above.\n(Choice C) 30.0% is the HPR, not the continuously compounded return, for the asset over\nthe time period.\nThings to remember:\nAn asset's continuously compounded return is the natural logarithm of [1 + Holding period\nreturn (HPR)]. The HPR is the asset's (Total return − 1). When an asset does not pay income\n(eg, interest, dividends) over the period, total return is the ending price divided by the\nbeginning price.\nCalculate and interpret annualized return measures and continuously compounded returns, and\ndescribe their appropriate uses\nLOS", "qhtml": null}, {"n": 81, "q": "An analyst compiles the following data from a company's financial statements:\nSAR millions 20X6 20X5 20X4\nRevenue 1,600 1,400 1,300\nNet income 200 100 100\nCurrent assets 550 500 500\nTotal assets 2,150 1,700 1,600\nCurrent liabilities 350 300 300\nTotal debt 1,100 800 800\nTotal liabilities 1,350 1,000 900\nBased on only this information, the change in which of the following ratios from 20X5 to 20X6 most\nlikely would be considered an improvement to profitability or solvency?", "opts": ["Debt-to-equity ratio", "Return on equity ratio", "Financial leverage ratio"], "ans": "B", "expl": "Financial ratios can be useful indicators of a company's health and performance and therefore are\nused extensively in financial analysis. Ratios typically require context, either comparing them to\nother companies or to the same ratio in prior periods.\nIn this scenario, the level of debt affects all three ratios. The debt-to-equity ratio and financial\nleverage ratio both measure a company's leverage. Greater proportions of debt increase a\ncompany's leverage, causing both ratios to increase. Debt also increases a company's interest\nexpense, causing its net income and return on equity (ROE) to be more sensitive to changes in\noperating income.\nROE is a profitability ratio that measures the return (ie, net income) earned by a\ncompany's equity shareholders . Higher ROE ratios indicate a higher rate of return for each\ndollar of equity invested. In this scenario, equity must be calculated before calculating ROE.\nLiabilities are used to calculate equity since a company's shareholders have claims on its assets\nonly after all obligations (eg, debt, accounts payable) have been paid.\nSteps 20X6 20X5\nEquity = Equity =\n20X6 20X5\n2,150 − 1,350 = 800 1,700 − 1,000 = 700\nCalculate year-end equity:\nAssets − Liabilities\nEquity = Equity =\n20X5 20X4\n1,700 − 1,000 = 700 1,600 − 900 = 700\nEquity = Equity =\nAvg Avg\nCalculate average equity\n(800 + 700) / 2 = 750 (700 + 700) / 2 = 700\nCalculate ROE: ROE = ROE =\nNet income / Average equity 200 / 750 = 26.7% 100 / 700 = 14.3%\nThe company's ROE increased from 14.3% in 20X5 to 26.7% in 20X6, indicating an improvement\nof profitability.\n(Choice A) The company's debt-to-equity ratio increased from 1.14 in 20X5 to 1.38 in 20X6,\nindicating a decline in solvency.\n(Choice C) The company's financial leverage ratio increased from 2.43 in 20X5 to 2.69 in 20X6,\nindicating a decline in solvency.\nThings to remember:\nReturn on equity is a profitability ratio that measures the return earned by a company's equity\nshareholders.\nDescribe relationships among ratios and evaluate a company using ratio analysis - LOS", "qhtml": null}, {"n": 82, "q": "A company purchased equipment at the beginning of 20X2. At the end of 20X2, the fair value\nof the equipment fell to €10,000 below its book value. Using the revaluation model and\nignoring tax effects, on the 20X2 financial reports, this most likely results in a €10,000\nreduction in:", "opts": ["net income.", "accumulated depreciation.", "other comprehensive income."], "ans": "A", "expl": "Financial statement treatment of revaluation of noncurrent assets — IFRS\nonly\nUpward revaluation Downward revaluation\nGain recognized in other\nLoss recognized on income\ncomprehensive income (OCI) as\nInitial\nstatement\nrevaluation surplus\nRecognized on income statement to\nReduces revaluation surplus\nthe extent of previous recognized\nIf revaluation surplus = 0,\nlosses\nSubsequent\nrecognized on income statement\nGain in excess of previous losses\nas loss\nrecognized as revaluation surplus\nCompanies that report under IFRS are permitted to revalue long-term assets to their current\nfair value. An upward revaluation occurs when an asset's fair value exceeds its carrying\namount (ie, net book value). A downward revaluation occurs when an asset's fair value falls\nbelow its carrying amount.\nThe accounting treatment for each case is:\nFor an initial upward revaluation , the initial gain from the asset mark-up bypasses the\nincome statement and directly increases other comprehensive income , reported as a\ncomponent of shareholders' equity on the balance sheet.\nFor an initial downward adjustment , the initial loss from the asset mark-down appears\non the income statement and reduces net income , which then flows to shareholders'\nequity on the balance sheet.\nThe different treatments of the upward and downward revaluations reflect accounting\nstandards' conservative bias: the company must \"own\" the downward revaluation and report it\nas directly affecting net income, and thus earnings performance, but cannot similarly \"take\ncredit\" for an upward revaluation.\nIn this scenario, the fair value of the asset drops below its balance sheet book value, so a\ndownward revaluation occurs. This directly reduces net income by €10,000.\n(Choice B) Since the downward revaluation occurs at the end of 20X2, the depreciation\nexpense will be adjusted going forward. Therefore, there is no change to accumulated\ndepreciation in 20X2.\n(Choice C) Only upward revaluations impact other comprehensive income on the balance\nsheet.\nThings to remember:\nCompanies reporting under IFRS are allowed to use the revaluation model. For an initial\nupward revaluation, the initial gain from the asset mark-up bypasses the income statement\nand directly increases other comprehensive income on the balance sheet. For an initial\ndownward adjustment, the initial loss from the asset mark-down appears on the income\nstatement and reduces net income.\nExplain and evaluate how impairment and derecognition of property, plant, and equipment and\nintangible assets affect the financial statements and ratios\nLOS", "qhtml": null}, {"n": 83, "q": "An analyst runs a linear regression of a dependent variable ( Y ) against one independent variable\n( X ), resulting in the following ANOVA table:\nSource Degrees of freedom Sum of squares Mean squares\nRegression 1 32.8841 32.8841\nResidual 13 70.8710 5.4516\nTotal 14 103.7552\nBased only on the data, the most appropriate conclusion is that:", "opts": ["the standard deviation of the regression residuals is 8.418.", "the proportion of the change in Y explained by X is 46.40%.", "the regression is statistically significant, assuming a critical value of 4.6672."], "ans": "C", "expl": "An analysis of variance ( ANOVA ) table summarizes key information about a linear regression and\nis used to calculate different measures of goodness of fit. These measures complement each other\nand are usually analyzed and interpreted together. For example:\nThe standard error of the estimate ( s ) measures the accuracy of the regression. It\ne\nrepresents the standard deviation of the regression residuals and is calculated as √MSE; in\nthis situation, s = 2.335 (= √5.4516).\ne\nR2\nThe coefficient of determination ( ) measures the proportion of the change in Y explained\nby X . It is a number between 0 and 1, calculated as the ratio of SSR to SST. In this\nR2\ncase, = 0.317 (= 32.8841 / 103.7552).\nThe F -statistic is used to test whether the regression results are random or statistically\nsignificant. It is calculated as the ratio of MSR to MSE . In this situation, the F -statistic\n(6.032 = 32.8841 / 5.4516) is greater than the critical F -value (4.6672), so there is\nevidence that the regression is statistically significant .\n(Choice A) 8.418 results from calculating s as √ SSE (ie, the total unexplained variability of Y )\ne\ninstead of √MSE, which measures the average unexplained variability.\nR2 R2\n(Choice B) 46.40% results from incorrectly calculating as the ratio of SSR to SSE. is the\nproportion of total variability explained by the regression (ie, SSR / SST).\nThings to remember:\nAn ANOVA table summarizes key information about a linear regression and is used to calculate\nR2\nmeasures of goodness of fit: s measures the accuracy of the regression, measures the\ne\nproportion of the change in Y explained by X , and the F -statistic is used to test whether the\nregression results are random or statistically significant.\nDescribe the use of analysis of variance (ANOVA) in regression analysis, interpret ANOVA results,\nand calculate and interpret the standard error of Estimate in a simple linear regression - LOS", "qhtml": null}, {"n": 84, "q": "An analyst gathers information on three non-US countries' currency regimes:\nCountry Currency Regime\nX Currency board\nY Dollarized (USD)\nZ Free-floating\nAll else equal, which country's currency regime creates the most exchange-rate risk for a US-\nbased investor?", "opts": ["Country X", "Country Y", "Country Z"], "ans": "C", "expl": "Domestic investors in foreign markets are subject to varying levels of exchange rate risk,\ndepending in part on the foreign government's currency regime. FX rates reflect not only\nprivate sector market forces but also government-imposed policies (fiscal and monetary) and\ninterventions to manage FX rates.\nIn this scenario, Country Z has a free-floating exchange rate , so investments denominated\nin its currency carry the most exchange rate risk for a foreign investor. Since Country Z's\ncurrency floats independently against the other currencies, its central bank is able to conduct\nmonetary policy without regard to other central banks' monetary policy actions.\nIn contrast, Country X follows a currency board system, which entails a legal commitment\nfrom its central bank to maintain a fixed-rate parity and to back the domestic currency with\nforeign currency reserves. Under a currency board system, there is some\nvariation in exchange rates and thus some currency risk, though the risk is much less than\nin a floating exchange rate regime (Choice A) .\nFinally, Country Y has a dollarized economy (ie, it uses the US dollar as its official domestic\ncurrency), so there is no exchange rate risk for a US-based investor. A country adopting\nfull dollarization uses a substitute foreign currency, such as the USD, as legal tender and\nrelinquishes its power to vary its exchange rate, which has the effect of constraining fiscal and\nmonetary policy (Choice B) .\nThings to remember:\nFor a US-based investor, foreign-currency denominated assets that are priced in the currency\nof a country using an independently floating exchange rate carry the most risk since FX rates\nare primarily market-determined. At the other end of the spectrum, assets in a foreign\ncountry with a dollarization regime that uses the US dollar (or a similar currency substitute)\ncarry minimal FX risk.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’\ninternational trade and capital flows\nLOS", "qhtml": null}, {"n": 85, "q": "A developed country has a high government debt-to-GDP ratio. Its trend real GDP growth rate\nis 3%. The weighted-average interest rate on its debt is currently 4% in real terms. All else\nequal, if this relationship persists for the foreseeable future, the country's debt-to-GDP ratio\nwill most likely :", "opts": ["worsen, if taxes are not raised.", "remain constant, as tax revenue is also growing in real terms.", "improve, as economic growth is positive."], "ans": "A", "expl": "If the ratio of government debt to GDP rises to excessive levels, a country's solvency is at\nrisk. Typically, if an economy grows in real (inflation-adjusted) terms, so do real tax revenues\nand thus the ability to service the growing real debt (assuming tax rates stay at constant\nlevels). An important issue for governments is whether greater deficit spending leads to\nenough tax revenues to pay the interest on the additional debt.\nHowever, it is the interest rate charged on the debt that can determine whether the debt-to-\nGDP ratio rises or falls despite the real growth in the economy. If the real growth\nrate is less than the real interest rate on the debt, then the debt-to-GDP ratio will worsen\neven though the economy is growing. In this case, the debt burden (ie, the real interest rate\nmultiplied by the debt) is growing faster than the economy (Choices B and C) . If interest\npayments increase quickly, investors may lose confidence in a government's ability to manage\nits debt.\nThings to remember:\nTypically, if an economy grows in real (inflation-adjusted) terms, so do real tax revenues and\nthus the ability to service the growing real debt (assuming tax rates remain constant).\nHowever, if the real growth rate in the economy is less than the real interest rate on the debt,\nthen the debt-to-GDP ratio will worsen, even though the economy is growing, since the debt\nburden is growing faster than the economy.\nDescribe roles and objectives of fiscal policy as well as arguments as to whether the size of a\nnational debt relative to GDP matters\nLOS", "qhtml": null}, {"n": 86, "q": "A company finalizes a contract to sell a product that will be delivered to the customer 2\nmonths from today. The customer will pay the full amount of the contract next month. If the\ncompany expects no problems in delivering the product or receiving payments, then it\nwill most appropriately recognize revenue:", "opts": ["immediately.", "when cash is received.", "when the product is delivered."], "ans": "C", "expl": "Cash\nAccrual accounting\naccounting\nRevenue is earned\nSeller substantially completes all of its\nobligations\nGoods delivered\nRevenue Cash is\nServices provided\nrecognition received\nSeller (usually) completes obligations before\nreceiving payment\nExample: Payment is due 30 days after\ninvoice\nExpense is incurred\nExpense Mirror image of revenue recognition\nCash is paid\nrecognition Goods received\nServices accepted or consumed\nUnder both IFRS and US GAAP, revenue is recognized when it is earned , independent of when\ncash is received, as under accrual accounting . The seller earns revenue from a sale when it\nhas satisfied its performance obligations , effectively transferring the risk and rewards of\nownership. This typically occurs when a good or service is delivered to the buyer.\nUnder accrual accounting, the recognition of revenue occurs independently of when the seller\nreceives cash for the sale, which is when the revenue is recognized in cash basis\naccounting (Choice B) . In accrual accounting, when a company delivers goods or services at\na different time from when it receives cash, it creates an asset or liability on its balance sheet\nto account for the different events of recognizing revenue and receiving cash.\nIn this scenario, the company finalized a contract to deliver a product 2 months from today.\nTherefore, no revenue is recognized immediately since no product is delivered\nimmediately (Choice A) . Revenue will be recognized on the income statement when the\ndelivery is made in 2 months since that is when the risk and rewards of ownership are\ntransferred.\nThings to remember:\nUnder accrual accounting, which is typically used for income statements, revenue is\nrecognized when it is earned; this occurs when the seller satisfies its performance obligations\nby transferring the risk and rewards of ownership. This recognition of revenue occurs\nindependently of when the seller receives cash for the sale.\nDescribe general principles of revenue recognition, specific revenue recognition applications, and\nimplications of revenue recognition choices for financial analysis\nLOS", "qhtml": null}, {"n": 87, "q": "A company reporting under US GAAP and using FIFO assesses its inventory's net realizable\nvalue as being €200,000 less than its carrying value. The company records a write-down and\nincreases COGS by €200,000. In the subsequent period, a new assessment of the inventory's\nnet realizable value is €250,000 higher than its revised carrying value. The company's most\nappropriate action is to reduce COGS by:", "opts": ["€0", "€200,000", "€250,000"], "ans": "A", "expl": "Inventory write-downs and reversals\nWhen to When to reverse Maximum\nwrite down a write-down reversal\nUS GAAP\nNet realizable value Reversals\n(FIFO, weighted N/A\n< cost prohibited\naverage)\nUS GAAP\nMarket value Reversals\n(LIFO, retail N/A\n< cost prohibited\ninventory)\nNet realizable value Net realizable value Amount of\nIFRS\n< cost > carrying value write-down\nInventory costs may decline due to spoilage, obsolescence, or reduced selling prices.\nCompanies reporting under IFRS and US GAAP using any inventory valuation method other\nthan the LIFO and retail inventory methods must value their inventory at the lower of cost and\nnet realizable value. Net realizable value is the estimated selling price in the normal course of\nbusiness less the costs to complete the sales of inventory.\nIf the net realizable value of a company's inventory becomes lower than its cost , the\ncompany must write down the inventory to its net realizable value. At the same time, the\ncompany must increase COGS by the same amount. This becomes the inventory's new\ncarrying value.\nUnder US GAAP, reversals of write-downs are prohibited . Therefore, in this scenario, the\ncompany should do nothing even though the net realizable value of its inventory rose above\nits carrying cost following the write-down. It should not reduce COGS.\nUnder IFRS, write-downs can be reversed in subsequent periods if net realizable value rises\nabove the new carrying value. However, a reversal cannot exceed the value of the write-\ndown (Choices B and C) .\nThings to remember:\nIf the net realizable value of a company's inventory becomes lower than its cost, the company\nmust report a write-down and increase COGS by the amount of the write-down. Under US\nGAAP, reversals of write-downs are prohibited.\nDescribe the measurement of inventory at the lower of cost and net realisable value and its\nimplications for financial statements and ratios\nLOS", "qhtml": null}, {"n": 88, "q": "An analyst compares portfolios in which the amount invested changes each year. Which of the\nfollowing is the most appropriate measure for the analyst to use in comparing the portfolios'\nreturns over a multiyear period?", "opts": ["Holding period return", "Arithmetic mean return", "Geometric mean return"], "ans": "C", "expl": "A portfolio's value can change during a period due to contributions, withdrawals, and/or\nincome earned. Changes in portfolio value should be included in the beginning value in each\nsubsequent period so that those changes are compounded.\nThe geometric mean return ( G in the image above) provides a better representation of a\nportfolio's return since it allows for the compounding of returns and the varying amounts\ninvested . The geometric mean return produces an average periodic return from actual\nperiodic returns (eg, three-year average annual return from annual returns over three years).\nAnalysts prefer the geometric mean return since it allows for better\nperformance comparisons between investments with different amounts invested each year.\n(Choice A) A holding period return is an asset's return earned over a specific period of time\nsuch as a day, week, or year. However, this return will be inaccurate if the amounts invested\nchange during the period. It is best used as a periodic return when the amount invested\nremains the same.\n(Choice B) An arithmetic mean return (ie, simple average return) assumes an equal base\namount invested at the beginning of each period.\nThings to remember:\nThe geometric mean return converts performance data from multiple periods into a\ncomparable format and produces a constant periodic return. It provides a better\nrepresentation of an portfolio's return since it allows for the compounding of returns and the\nvarying base amounts invested.\nCalculate and interpret major return measures and describe their appropriate uses\nLOS", "qhtml": null}, {"n": 89, "q": "Which of the following statements is correct ? Credit cycles:", "opts": ["tend to peak just after a recession gets underway.", "tend to be longer, deeper, and sharper than business cycles.", "with a strong peak are inversely related to systemic banking crises."], "ans": "B", "expl": "A credit cycle refers to the periodic expansion and contraction of credit (ie, credit\navailability) in an economy. It is a key aspect of the broader financial cycle and has significant\nimplications for economic indicators such as investment, employment, and consumer\nspending.\nThe availability of credit reflects access to financing for households and businesses, which\naffects their ability to invest, eventually flowing through to falling asset prices. The peak\nphase of the credit cycle marks the height of an economic expansion . Credit conditions\nmay remain favorable, but there are signs that the economy is reaching its limits. In the\ncontraction phase, or recession , credit becomes less available as lenders become more\ncautious about the risks associated with lending (Choice A) .\nStrong peaks in the financial cycle are closely associated with systemic banking crises.\nSpecifically, domestic banking crises typically occur at, or close to, the peak of a credit cycle\nwhen an economy is already under stress (Choice C) .\nThings to remember:\nA credit cycle refers to the periodic availability of credit, which reflects households' and\nbusinesses' access to financing, which in turn affects their ability to invest, eventually flowing\nthrough to falling asset prices. The peak phase of the credit cycle marks the height of an\neconomic expansion. In the contraction phase, credit becomes less available as lenders\nbecome more cautious about the risks associated with lending.\nDescribe credit cycles\nLOS", "qhtml": null}, {"n": 90, "q": "An analyst who is evaluating the probability that a company will fire its CEO if EPS decreases\nthis year gathers the following relevant estimates:\nProbability that EPS decreases 0.35\nProbability that company fires CEO if EPS decreases 0.85\nProbability that company does not fire CEO if EPS does not decrease 0.75\nThe analyst later learns that the company did not fire the CEO after reporting EPS. The\nupdated probability that the company's EPS decreased is closest to:", "opts": ["0.05", "0.10", "0.15"], "ans": "B", "expl": "Probability estimates are often revised based on new information. In this scenario,\nthe conditional probability that the CEO is not fired depends on whether the company's\nearnings per share (EPS) have decreased. Two relevant conditional probabilities are as\nfollows:\nThe CEO is not fired given that EPS did not decrease [P(CEO not fired | no EPS\ndecrease)]\nThe CEO is not fired given that EPS decreased [P(CEO not fired | EPS decrease)]\nThe diagram above shows that the probabilities that the CEO is not fired are:\n0.0525 if EPS decreased and\n0.4875 if EPS did not decrease.\nThe total probability that the CEO is not fired, regardless of what happens to EPS, is 0.0525 +\n0.4875 = 0.54. Bayes' formula can be used to reverse the conditional probability and\nanswer the question, \"What is the probability that EPS decreased given that the CEO was not\nfired\"? However, it is often easier to invert the tree diagram using previously calculated\nprobabilities than to memorize and apply Bayes' formula:\nBefore the analyst learned the outcome for the CEO, the estimated probability of an EPS\ndecrease was 0.35. Given the updated information (ie, CEO was not fired) and using Bayes'\nformula, the revised probability that EPS decreased is reduced to approximately 0.10 (ie,\n0.0972).\n(Choice A) 0.05 (ie, 0.0525) represents the joint probability that the CEO is not\nfired and that there is a decrease in EPS.\n(Choice C) 0.15 is the conditional probability that the CEO is not fired given that EPS\ndecreased.\nThings to remember:\nBayes' formula is a way to update probabilities of related events based on new information.\nCalculate and interpret an updated probability in an investment setting using Bayes’ formula\nLOS", "qhtml": null}];
const CFG = {"title": "UWorld Mock Exam 1 — Session 1", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
