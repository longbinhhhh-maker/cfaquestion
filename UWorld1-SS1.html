 information about both portfolios:\nPortfolio B\nAnnual Returns (%)\n−4\n11\n2\n−13\nPortfolio A Portfolio B\nMean (%) 1 −1\nRange (%) 23\nMean Absolute Deviation 8\nSample Standard Deviation 10.49 10.10\nThe comparison shows that Portfolio B is riskier in terms of the:","opts":["range only.","range and mean absolute deviation only.","range, mean absolute deviation, and standard deviation."],"ans":"A","expl":"Để trả lời câu hỏi này, bạn chỉ cần tính độ lệch tuyệt đối trung bình (MAD) của Danh mục đầu tư\nB. Không chính xác vì Phạm vi được bao gồm trong mỗi lựa chọn câu trả lời và độ lệch chuẩn của cả hai danh mục đầu tư đều được đưa ra\n.\nĐộ lệch tuyệt đối trung bình (MAD), giống như độ lệch chuẩn và phạm vi, là thước đo độ biến thiên\n(độ phân tán) xung quanh giá trị trung bình và có thể được sử dụng để đánh giá rủi ro . MAD được tính như sau:\n1. Xác định giá trị trung bình của các quan sát.\n2. Tính toán sự khác biệt tuyệt đối giữa mỗi quan sát và giá trị trung bình của nó (điều này giúp loại bỏ\nkhả năng của số âm).\n3. Tổng tất cả các phép tính từ bước trước và chia tổng cho số\nquan sát.\nMAD cho Danh mục B được tính như sau:\nPhạm vi lợi nhuận của Danh mục B [11 − (−13) = 24%] lớn hơn phạm vi lợi nhuận của Danh mục A\n(23%), do đó Danh mục B có rủi ro lớn hơn trong thuật ngữ phạm vi.\nDanh mục A Danh mục đầu tư B\nTrung bình (%) 1 −1\nPhạm vi (%) 23 24\nĐộ lệch tuyệt đối trung bình 8 7,5\nĐộ lệch chuẩn mẫu 10,49 10,10\nMAD của Danh mục B nhỏ hơn MAD của Danh mục A, điều này cho thấy rằng lợi nhuận của Danh mục B\ncó ít biến động xung quanh mức trung bình và ít rủi ro hơn Danh mục A. Độ lệch chuẩn của\nDanh mục B nhỏ hơn so với Danh mục A như đã trình bày ở trên, cũng cho thấy ít rủi ro hơn (Lựa chọn B và\nC) .\nNhững điều cần làm hãy nhớ:\nĐộ lệch tuyệt đối trung bình (MAD), giống như độ lệch chuẩn và phạm vi, là thước đo độ biến thiên\n(độ phân tán) xung quanh giá trị trung bình và có thể được sử dụng để đánh giá rủi ro. Độ phân tán ít hơn xung quanh mức trung bình\ncho thấy ít biến động hơn và ít rủi ro hơn.\nTính toán, giải thích và đánh giá các biện pháp phân tán để giải quyết vấn đề đầu tư - LOS","qhtml":null},{"n":74,"q":"An analyst runs a regression with 25 observations to determine how the debt-to-capital ratio\naffects a company's bond yield spread. Selected data are presented below:\nCoefficient Standard error\nIntercept 0.9037 0.2266\nDebt-to-capital ratio 0.0963 0.0064\nBoth variables are percentages (eg, a debt-to-capital ratio of 50% is stated as 50). The critical t -\nvalues at a 5% significance level ( α ) are 2.069 (two-sided) and 1.714 (one-sided). Assuming that\nthe standard error of the forecast ( s ) is 0.4130, the prediction interval for the bond yield spread of\nf\na company with a 40% debt-to-capital ratio is closest to:","opts":["3.90 to 5.61","4.04 to 5.46","4.34 to 5.17"],"ans":"A","expl":"Hồi quy tuyến tính đơn giản có thể được sử dụng để dự đoán biến phụ thuộc ( Ŷ ) dựa trên giá trị\nf\ndự báo của biến độc lập ( X ). Khoảng dự đoán của dự báo là phạm vi\nf\ndự kiến ​​xung quanh Ŷ đối với một mức ý nghĩa nhất định ( α ). Mặc dù khoảng tin cậy\nf\nthiết lập phạm vi cho các tham số tổng thể, nhưng khoảng dự đoán sẽ áp dụng cho các quan sát\nriêng lẻ.\nVí dụ: nếu α = 10% thì có xác suất 90% rằng giá trị thực của Y sẽ nằm trong\nkhoảng dự đoán . Phạm vi (tức là độ rộng) của khoảng là hàm của:\ngiá trị t tới hạn, là hệ số tin cậy và\nsai số chuẩn của dự báo ( s ), đo lường độ chính xác của dự báo (đối với a\nf\ngiá trị đã cho của X ).\nf\nTrong kịch bản này, tỷ lệ nợ trên vốn là 40%, do đó X = 40, sai số chuẩn của dự báo là\nf\nđược cho là s = 0,4130 và α = 5%. Khoảng dự đoán được tính như sau:\nf\nVì vậy, khoảng dự đoán là từ 3,90 đến 5,61 .\n(Lựa chọn B) Khoảng dự đoán từ 4,04 đến 5,46 là kết quả của việc tính toán sai khoảng\nvới t một phía (1,714). Khoảng là một phạm vi các kết quả có thể xảy ra với giới hạn dưới\nc\nvà giới hạn trên xung quanh Ŷ , do đó, nhà phân tích phải sử dụng t .\nf c\n(Lựa chọn C) Khoảng dự đoán từ 4,34 đến 5,17 là kết quả của việc tính toán Ŷ ± s , không chính xác\nf f\nbỏ qua t , điều này tạo ra khoảng dự đoán hẹp hơn.\nc\nNhững điều cần nhớ:\nKhoảng dự đoán của dự báo là phạm vi giá trị dự kiến xung quanh biến phụ thuộc\nđược dự đoán. Mức ý nghĩa và số lượng quan sát càng lớn (hoặc ít hơn), đồng thời\nđộ chính xác của hồi quy càng tốt (hoặc tệ hơn), thì khoảng đó sẽ càng hẹp (hoặc rộng hơn).\nTính toán và diễn giải giá trị dự đoán cho biến phụ thuộc và khoảng dự đoán cho\nnó, dựa trên mô hình hồi quy tuyến tính ước tính và một giá trị cho biến độc lập - LOS","qhtml":null},{"n":75,"q":"An analyst gathers the following information on two competitors, concerning their differences in\naccounting methods.\nCompany 1 Company 2\nClassification of investments\nAvailable-for-sale Trading securities\nheld indefinitely\nMajority consists\nComposition of intangible assets No goodwill\nof goodwill\nDepreciation method on fixed assets Straight line Accelerated\nTo facilitate proper financial comparison, the analyst should most appropriately :","opts":["adjust Company 2's gross book value of fixed assets.","reduce Company 1's net income for fair value investment gains.","reduce Company 1's amount of intangible assets by its goodwill balance."],"ans":"C","expl":"Các điều chỉnh chung của nhà phân tích\nĐiều chỉnh vấn đề danh mục\n Chứng khoán có sẵn để bán so với chứng khoán giao dịch Điều chỉnh thu nhập ròng và/hoặc chứng khoán khác\nĐầu tư\nphân loại thu nhập toàn diện\nSo sánh các phương pháp chi phí khác nhau (FIFO,\nĐiều chỉnh hàng tồn kho COGS và số dư hàng tồn kho\nLIFO, bình quân gia quyền, ID cụ thể)\nKhấu hao đường thẳng so với khấu hao nhanh Điều chỉnh chi phí khấu hao và cố định\nTài sản cố định\ngiá trị sổ sách ròng của tài sản phương pháp\nTăng trưởng M&A đáng kể so với nội bộ hữu cơ Điều chỉnh giá trị sổ sách của tài sản vô hình\nThiện chí\ntăng trưởng lợi thế thương mại\nM&A = sáp nhập và mua lại.\nCác nhà phân tích thường so sánh các công ty sử dụng các phương pháp kế toán khác nhau và/hoặc dựa vào\ncác giả định và ước tính khác biệt khi lập kết quả tài chính. Sự khác biệt giữa IFRS\nvà GAAP của Hoa Kỳ cũng có thể làm sai lệch sự so sánh. Các nhà phân tích thường điều chỉnh báo cáo tài chính về những khác biệt và/hoặc yêu cầu như vậy\nđể tạo điều kiện so sánh \"táo với táo\".\nTrong trường hợp này, tài sản vô hình của Công ty 1 bao gồm lợi thế thương mại đáng kể, trong khi Công ty 2 không có lợi thế thương mại. Lợi thế thương mại là kết quả hoàn toàn từ các hoạt động mua bán và sáp nhập và thể hiện\nphần bù mua trên giá trị hợp lý của tài sản ròng có thể xác định được của công ty bị mua lại. Mặc dù\nlợi thế thương mại được kiểm tra định kỳ về khả năng suy giảm giá trị, giá trị của nó mang tính chủ quan (tức là dựa trên số tiền mà\nbên mua đã trả) và có thể phóng đại tài sản của bên mua. Do đó, nhà phân tích nên điều chỉnh\ngiá trị sổ sách của tài sản vô hình của Công ty 1 để so sánh tốt hơn với Công ty 2.\n(Lựa chọn A) Giá trị sổ sách ròng, không phải tổng giá trị sổ sách của tài sản cố định, nên được điều chỉnh khi\nso sánh các công ty sử dụng các phương pháp khấu hao khác nhau. Tổng giá trị sổ sách thể hiện\ngiá mua lịch sử và không đổi. Giá trị sổ sách ròng là tổng giá trị sổ sách được điều chỉnh theo\nkhấu hao lũy kế.\n(Lựa chọn B) Công ty 1 phân loại một cách thích hợp các khoản đầu tư được nắm giữ vô thời hạn dưới dạng sẵn có-\nđể bán. Lợi nhuận giá trị hợp lý bỏ qua thu nhập ròng và chuyển trực tiếp vào thu nhập toàn diện khác.\nDo đó, không cần điều chỉnh thu nhập ròng của Công ty 1.\nNhững điều cần nhớ:\nCác công ty khác nhau thường sử dụng các phương pháp kế toán khác nhau và dựa vào các giả định và\nước tính riêng biệt khi chuẩn bị kết quả tài chính. Sự khác biệt giữa IFRS và GAAP của Hoa Kỳ cũng có thể\nlàm sai lệch sự so sánh. Các nhà phân tích thường điều chỉnh báo cáo tài chính cho những khác biệt và/hoặc\ncác yêu cầu đó để tạo điều kiện so sánh.\nMô tả các phương pháp kế toán (lựa chọn và ước tính) có thể được sử dụng để quản lý thu nhập,\ndòng tiền và các mục trong bảng cân đối kế toán - LOS","qhtml":null},{"n":76,"q":"A company reports the following information:\nCash flow item KRW millions\nNet income 660\nDepreciation and amortization expense −260\nInterest expense −40\nWorking capital expenditures −120\nCapital expenditures −200\nProceeds from long-term debt 535\nRepayments of long-term debt −500\nIf the company has a 25% tax rate, which of the following cash flow measures is greatest ?","opts":["Free cash flow","Free cash flow to equity","Free cash flow to the firm"],"ans":"B","expl":"Dòng tiền tự do (FCF) xác định lượng tiền mặt dư thừa mà một công ty tạo ra từ\nhoạt động sau khi trang trải chi phí vốn của mình. FCF có thể được sử dụng theo nhiều cách khác nhau (ví dụ:\ntái đầu tư vào hoạt động kinh doanh của công ty, trả cổ tức, trả nợ). Một nhà phân tích có thể tính toán\ngiá trị của dòng tiền này cho các nhà cung cấp nợ và vốn cổ phần của công ty (tức là dòng tiền tự do cho\ncông ty [FCFF]) hoặc chỉ cho các cổ đông vốn (tức là dòng tiền tự do vào vốn chủ sở hữu [FCFE]) bằng cách điều chỉnh\nđối với các khoản tiền mặt có sẵn cho các nhóm đó.\nFCFF cộng lại các khoản thanh toán lãi sau thuế vì nó bao gồm các nhà cung cấp vốn nợ và các khoản thanh toán lãi\nđược trả cho các chủ nợ của công ty. Vì FCFE có sẵn cho các cổ đông\nvốn chủ sở hữu của công ty nên nó sẽ cộng lại khoản vay ròng (tức là thay đổi ròng trong nợ). Các công ty có thể sử dụng bất kỳ\nphần bổ sung nào vào nợ vì lợi ích của cổ đông thông qua việc trả cổ tức hoặc mua lại cổ phần\n.\nFCF = NI + NCC − ΔWC − ΔFC\n=660 + 260 − 120 − 200 = 600\nFCFE = NI + NCC − ΔWC − ΔFC + Vay ròng\n=FCF + Vay ròng\n=600 + (535 − 500) = 635\nFCFF = NI + NCC − ΔWC − ΔFC + Int (1 − t )\n=FCF + Int (1 − t )\n=600 + 40 (1 − 0,25) = 630\nTrong trường hợp này, thước đo lớn nhất của FCF là FCFE của công ty, được hỗ trợ bởi khoản vay ròng 35\ntriệu KRW (Lựa chọn A và C).\nNhững điều cần nhớ:\nDòng tiền tự do xác định số tiền dư thừa một công ty tạo ra sau khi trang trải các chi phí về vốn\n. Một nhà phân tích có thể tính toán giá trị của dòng tiền này đối với các nhà cung cấp\nnợ và vốn cổ phần của công ty hoặc chỉ cho các cổ đông bằng cách điều chỉnh các khoản mục tiền mặt có sẵn cho\ncác nhóm đó.\nTính toán và diễn giải dòng tiền tự do của công ty, dòng tiền tự do trên vốn chủ sở hữu, hiệu suất và\ntỷ lệ dòng tiền khả dụng - LOS","qhtml":null},{"n":77,"q":"An analyst has developed a screening test to determine whether a company's earnings will\ndecrease. If the company does not pass the test, it is likely that its earnings will decrease in the\nnext quarter. The table below shows relevant information:\nEvent Probability\nProbability of an earnings decrease in the next quarter 0.47\nProbability of passing the test 0.62\nProbability of an earnings decrease in the next quarter\n0.90\ngiven it did not pass the test\nBased on this information, the probability that the company's earnings will decrease in the next\nquarter given that the company passes the test is closest to:","opts":["0.13","0.21","0.34"],"ans":"B","expl":"Câu hỏi này yêu cầu ứng viên tính xác suất thu nhập của một công ty sẽ\ngiảm khi công ty đó vượt qua bài kiểm tra sàng lọc [ P (Thu nhập giảm | Đạt bài kiểm tra)]. Đây là một\nví dụ về xác suất có điều kiện. Câu hỏi không cung cấp thông tin cần thiết để\ntrực tiếp giải quyết câu trả lời, nhưng có thể rút ra lời giải bằng cách sử dụng quy tắc tổng xác suất.\nTổng xác suất của một sự kiện là tổng các xác suất chung của các kịch bản\nloại trừ lẫn nhau và đầy đủ của nó. Trong câu hỏi này, tổng xác suất giảm thu nhập là tổng\ncủa:\nP (Đạt bài kiểm tra VÀ Thu nhập giảm) và\nP (Không vượt qua bài kiểm tra VÀ Thu nhập giảm).\nMỗi xác suất chung là tích của hai xác suất . Thuật ngữ đầu tiên là xác suất\nvô điều kiện của công ty vượt qua (hoặc không vượt qua) bài kiểm tra và thuật ngữ thứ hai là xác suất\ncó điều kiện (tức là thu nhập của công ty giảm khi nó vượt qua (hoặc không vượt qua) bài kiểm tra). Xác suất kết hợp\nlà P(A và B) = P(A) × P(B | A) . Thông tin cần thiết để tính xác suất\nrằng công ty sẽ không vượt qua bài kiểm tra VÀ bị giảm thu nhập [ P (Không vượt qua bài kiểm tra AND\nThu nhập giảm)] được đưa ra: (1 − 0,62) × 0,90 ≈ 0,34 (Lựa chọn C) .\nThông tin cần thiết để tính xác suất công ty sẽ vượt qua bài kiểm tra VÀ có\nkhông đưa ra mức giảm thu nhập; tuy nhiên, điều này có thể được suy ra vì tổng xác suất giảm thu nhập\nđược cho là 0,47. Hai xác suất chung về việc giảm thu nhập này\nloại trừ lẫn nhau và đầy đủ và có tổng bằng tổng xác suất (0,47); do đó, xác suất chung\nkhông xác định là 0,47 − 0,342 = 0,128 (Lựa chọn A) .\nKhi đã biết xác suất chung P (Đậu bài kiểm tra VÀ Thu nhập giảm) và vì\nxác suất vượt qua bài kiểm tra vô điều kiện được cho [ P (Đạt bài kiểm tra) = 0,62] nên điều kiện\nxác suất có thể được tính bằng cách sắp xếp lại công thức cho xác suất chung: P ( B | A ) = P ( A và B )\n/ P ( A ), hoặc\nP (Đạt bài kiểm tra VÀ Thu nhập giảm) / P (Đạt bài kiểm tra) = 0,128 / 0,62 ≈ 0,21\nNhững điều cần nhớ:\nTổng xác suất của một sự kiện là tổng xác suất của các kịch bản loại trừ lẫn nhau và\ntoàn diện của nó. Mỗi kịch bản có thể bao gồm xác suất chung của hai sự kiện, trong đó một\nxác suất là vô điều kiện và kịch bản còn lại phụ thuộc vào việc liệu sự kiện đầu tiên có xảy ra hay không.\nHình thành một vấn đề đầu tư dưới dạng cây xác suất và giải thích việc sử dụng các kỳ vọng\ncó điều kiện trong ứng dụng đầu tư - LOS","qhtml":null},{"n":78,"q":"A company reporting under US GAAP has deferred tax assets that exceed deferred tax\nliabilities. All else equal, a reduction in the tax rate will most likely increase the company's:","opts":["operating profit.","debt-to-asset ratio.","shareholders' equity."],"ans":"B","expl":"Tài sản thuế thu nhập hoãn lại so với thuế thu nhập hoãn lại phải trả\nChi phí thuế thu nhập < số thuế phải nộp\nTài sản thuế thu nhập hoãn lại\nĐược tạo ra do nộp thừa thuế trong kỳ hiện hành\nChi phí thuế thu nhập > thuế phải nộp\nThuế thu nhập hoãn lại phải trả\nĐược tạo ra do nộp thiếu thuế trong kỳ hiện tại\nCác khoản mục thuế thu nhập hoãn lại (tức là tài sản thuế thu nhập hoãn lại và thuế thu nhập hoãn lại phải trả) phát sinh từ chênh lệch\ngiữa chi phí thuế thu nhập (cho mục đích kế toán) và số thuế phải nộp (cho mục đích tính thuế).\nbáo cáo) trong một khoảng thời gian. Sự khác biệt có thể xảy ra khi chi phí thuế được tính theo\nchuẩn mực kế toán trong khi số thuế phải nộp được tính theo mã số thuế.\nTài sản thuế thu nhập hoãn lại (DTA) phát sinh khi lợi nhuận tính thuế lớn hơn lợi nhuận kế toán và\nsố thuế phải nộp lớn hơn chi phí tính thuế.\nThuế thu nhập hoãn lại phải trả (DTL) phát sinh khi lợi nhuận tính thuế nhỏ hơn lợi nhuận kế toán và\nsố thuế phải nộp nhỏ hơn chi phí tính thuế.\nTrong trường hợp này, giá trị của các khoản thuế thu nhập hoãn lại có tương quan trực tiếp với thuế suất.\nTất cả các yếu tố khác đều như nhau, khi thuế suất giảm (như trường hợp trong trường hợp này), DTA và DTL\ngiảm đi. Do DTA của công ty vượt quá DTL nên công ty có số dư DTA ròng, tức là\nđược báo cáo là tài sản dài hạn ròng theo US GAAP. Vì vậy, việc giảm thuế suất\ncuối cùng làm giảm tổng tài sản, làm tăng tỷ lệ nợ trên tài sản (nợ/tài sản).\n(Đáp án A) Lợi nhuận hoạt động là trước thuế nên chi phí thuế giảm sẽ không ảnh hưởng đến hoạt động kinh doanh.\nlợi nhuận.\n(Lựa chọn C) Vì công ty có DTA ròng nên việc giảm thuế suất cũng làm giảm DTA.\nTừ phương trình kế toán tài sản = nợ phải trả + vốn chủ sở hữu, vốn chủ sở hữu sẽ phải giảm chứ không phải\ntăng lên để duy trì sự cân bằng.\nNhững điều cần nhớ:\nGiá trị của các khoản thuế thu nhập hoãn lại có tương quan trực tiếp với thuế suất. Khi có mạng\nsố dư tài sản thuế thu nhập hoãn lại, việc giảm thuế suất sẽ làm giảm số dư tài sản thuế thu nhập hoãn lại và do đó tổng\ntài sản, tăng tỷ lệ nợ trên tài sản và giảm vốn chủ sở hữu.\nTính toán, giải thích và đối chiếu thuế suất hiệu quả của tổ chức phát hành, thuế suất theo luật định và thuế tiền mặt\ntỷ lệ\nLOS","qhtml":null},{"n":79,"q":"In an economy that operates under an exchange rate targeting policy, which of the following\nconditions is most likely ?","opts":["The central bank is required to maintain a fixed policy interest rate.","Monetary policy can focus on internal rather than external considerations.","Target country inflation (deflation) is imported regardless of the effect on the domestic economy."],"ans":"C","expl":"Mục tiêu chính sách tiền tệ\nQuốc gia dài hạn đã nêu\nđặc điểm mục tiêu kinh tế của mục tiêu chính sách\nTỷ giá cố định hoặc Dẫn đầu ổn định giá\nPhạm vi lạm phát được chỉ định để tốt hơn trong dài hạn\nhiệu suất chỉ số giá\nLớn hơn,\nphát triển hơn\nTối ưu hóa trên\ncác nền kinh tế\nMục tiêu sở thích được điều chỉnh theo nhiều mục tiêu\ntỷ lệ chu kỳ kinh doanh (việc làm,\nTăng trưởng GDP)\nNhỏ hơn,\nTính ổn định so với kém phát triển\nTrao đổi Tỷ lệ hoặc phạm vi cố định\ncác nền kinh tế lớn có tỷ lệ\nso với tiền tệ mục tiêu\nđối tác thương mại nhập/xuất\nngành\nMục tiêu của chính sách tiền tệ là tối ưu hóa phúc lợi kinh tế, mặc dù các ngân hàng trung ương được giao\nnhiều mục tiêu chính sách nhằm đạt được mục tiêu đó. Các ngân hàng trung ương có thể có:\nMột mục tiêu chính sách (tức là nhiệm vụ duy nhất) hướng dẫn tất cả các hành động chính sách:\nMục tiêu lạm phát cụ thể (ví dụ: 2%) hoặc một phạm vi cụ thể\nMục tiêu tỷ giá hối đoái, là mức hoặc dải giá trị cố định so với một loại tiền tệ\nchính (ví dụ: EUR)\nNhiều mục tiêu chính sách nhằm tìm kiếm sự cân bằng tối ưu giữa các tiềm năng các mục tiêu xung đột nhau:\nViệc làm cao\nTăng trưởng GDP\nGiá cả ổn định\nTỷ giá hối đoái ổn định\nKhi một quốc gia sử dụng nhắm mục tiêu tỷ giá hối đoái, các chính sách của quốc gia đó được thiết kế để duy trì\nmục tiêu (hoặc phạm vi) tỷ giá hối đoái với một loại tiền tệ khác, thường là từ một nền kinh tế lớn hơn và/hoặc hơn\nổn định. Kết quả là, nếu nền kinh tế của đồng tiền mục tiêu gặp phải lạm phát hoặc\ngiảm phát, thì nền kinh tế nhắm mục tiêu đó cũng vậy.\nTrong tình huống này, vì tất cả các hành động chính sách phải nhằm mục đích duy trì giá trị trao đổi của đồng tiền mục tiêu\n, nền kinh tế mục tiêu sẽ từ bỏ sự độc lập về chính sách tiền tệ . Điều này có thể\nảnh hưởng xấu đến cả nền kinh tế mục tiêu và khả năng giải quyết mọi tác động bất lợi của nó. Ví dụ\n, nhắm mục tiêu tỷ giá hối đoái có thể ngăn ngân hàng trung ương thực hiện\nchính sách tiền tệ độc lập chỉ dựa trên các điều kiện trong nước, chẳng hạn như duy trì chính sách cố định\nlãi suất hoặc điều chỉnh chính sách tiền tệ (Lựa chọn A và B) .\nNhững điều cần nhớ:\nNhắm mục tiêu tỷ giá hối đoái dẫn đến việc mất đi tính độc lập của chính sách tiền tệ. Duy trì\nmục tiêu thường có nghĩa là chấp nhận các điều kiện ảnh hưởng xấu đến nền kinh tế trong nước.\nMô tả các công cụ được sử dụng để thực hiện các công cụ chính sách tiền tệ và cơ chế truyền tải tiền tệ\nvà giải thích mối quan hệ giữa chính sách tiền tệ và tăng trưởng kinh tế,\nlạm phát, lãi suất và tỷ giá hối đoái\nLOS","qhtml":null},{"n":80,"q":"The following table shows an investment's closing price on each day:\nDate Closing Price\nMarch 1 50\nApril 1 74\nMay 1 65\nBased only on this information, the continuously compounded return of the investment from\nMarch 1 to May 1 is closest to:","opts":["23.1%","26.2%","30.0%"],"ans":"B","expl":"Tỷ suất lợi nhuận gộp liên tục là một cách để đo lường sự thay đổi về giá trị\ncủa một tài sản trong khoảng thời gian nắm giữ, giả định rằng những thay đổi về giá trị được gộp liên tục.\nĐiều này khác với việc gộp riêng biệt, giả định rằng việc gộp xảy ra ở các khoảng cách đều\n, chẳng hạn như hàng tuần hoặc hàng năm. Sự thay đổi về giá trị của nội dung có hai yếu tố:\nThay đổi giá trong kỳ (tức là lãi, lỗ)\nThu nhập nhận được từ nội dung trong kỳ\nHai yếu tố này được sử dụng để tính tổng lợi nhuận của nội dung. Công thức tính\ntổng lợi nhuận là:\nTổng lợi nhuận được sử dụng để tính lợi nhuận trong thời gian nắm giữ (HPR), tức là (Tổng lợi nhuận\n− 1).\nTrong trường hợp này, khoản đầu tư không trả lãi hoặc cổ tức, do đó HPR của nó từ ngày 1 tháng 3\nđến ngày 1 tháng 5 là (65 / 50) − 1 = 0,3, hay 30%. Lợi nhuận gộp liên tục trong khoảng thời gian\nnày là logarit tự nhiên của (1 + HPR) = logarit tự nhiên của (Tổng lợi nhuận) hoặc ln(1\n+ 0,3) ≈ 26,2%.\n(Lựa chọn A) 23,1% là kết quả gần đúng khi tính toán sai HPR làm mức trung bình của\n ba giá chia cho giá bắt đầu, sau đó tính logarit tự nhiên của\n(1 + kết quả), như được hiển thị ở trên.\n(Lựa chọn C) 30,0% là HPR, không phải lợi nhuận gộp liên tục, cho tài sản trong\nkhoảng thời gian.\nNhững điều cần nhớ:\nLợi nhuận gộp liên tục của tài sản là tự nhiên logarit của [1 + Thời gian nắm giữ\nreturn (HPR)]. HPR là tài sản (Tổng lợi nhuận - 1). Khi một tài sản không trả thu nhập\n(ví dụ: tiền lãi, cổ tức) trong kỳ, tổng lợi nhuận là giá cuối cùng chia cho\ngiá ban đầu.\nTính toán và giải thích các thước đo lợi nhuận hàng năm và lợi nhuận gộp liên tục, đồng thời\nmô tả cách sử dụng thích hợp của chúng\nLOS","qhtml":null},{"n":81,"q":"An analyst compiles the following data from a company's financial statements:\nSAR millions 20X6 20X5 20X4\nRevenue 1,600 1,400 1,300\nNet income 200 100 100\nCurrent assets 550 500 500\nTotal assets 2,150 1,700 1,600\nCurrent liabilities 350 300 300\nTotal debt 1,100 800 800\nTotal liabilities 1,350 1,000 900\nBased on only this information, the change in which of the following ratios from 20X5 to 20X6 most\nlikely would be considered an improvement to profitability or solvency?","opts":["Debt-to-equity ratio","Return on equity ratio","Financial leverage ratio"],"ans":"B","expl":"Các tỷ số tài chính có thể là chỉ số hữu ích về tình trạng và hiệu quả hoạt động của công ty và do đó\nđược sử dụng rộng rãi trong phân tích tài chính. Các tỷ lệ thường yêu cầu bối cảnh, so sánh chúng với\ncác công ty khác hoặc với tỷ lệ tương tự trong các kỳ trước.\nTrong trường hợp này, mức nợ ảnh hưởng đến cả ba tỷ lệ. Tỷ lệ nợ trên vốn chủ sở hữu và tỷ lệ đòn bẩy tài chính\n đều đo lường đòn bẩy của công ty. Tỷ lệ nợ lớn hơn làm tăng đòn bẩy của công ty\n, khiến cả hai tỷ lệ đều tăng. Nợ cũng làm tăng chi phí\ncủa công ty, khiến thu nhập ròng và lợi nhuận trên vốn chủ sở hữu (ROE) của công ty trở nên nhạy cảm hơn với những thay đổi trong\nthu nhập hoạt động.\nROE là tỷ suất lợi nhuận đo lường lợi nhuận (tức là thu nhập ròng) mà các cổ đông vốn cổ phần của công ty kiếm được\n . Tỷ lệ ROE cao hơn cho thấy tỷ lệ lợi nhuận cao hơn cho mỗi\nđô la vốn cổ phần được đầu tư. Trong trường hợp này, vốn chủ sở hữu phải được tính trước khi tính ROE.\nNợ phải trả được sử dụng để tính vốn chủ sở hữu vì các cổ đông của công ty chỉ có quyền yêu cầu đối với tài sản của mình\nsau khi tất cả các nghĩa vụ (ví dụ: nợ, tài khoản phải trả) đã được thanh toán.\nCác bước 20X6 20X5\nVốn chủ sở hữu = Vốn chủ sở hữu =\n20X6 20X5\n2.150 − 1.350 = 800 1.700 − 1.000 = 700\nTính vốn chủ sở hữu cuối năm:\nTài sản − Nợ phải trả\nVốn chủ sở hữu = Vốn chủ sở hữu =\n20X5 20X4\n1.700 − 1.000 = 700 1.600 − 900 = 700\nVốn chủ sở hữu = Vốn chủ sở hữu =\nTr.bình bình quân\nTính vốn chủ sở hữu trung bình\n(800 + 700) / 2 = 750 (700 + 700) / 2 = 700\nTính ROE: ROE = ROE =\nThu nhập ròng / Vốn chủ sở hữu trung bình 200 / 750 = 26,7% 100 / 700 = 14,3%\nROE của công ty đã tăng từ 14,3% năm 20X5 lên 26,7% vào năm 20X6, cho thấy sự cải thiện\nkhả năng sinh lời.\n(Lựa chọn A) Tỷ lệ nợ trên vốn chủ sở hữu của công ty đã tăng từ 1,14 trong 20X5 lên 1,38 trong 20X6,\ncho thấy khả năng thanh toán suy giảm.\n(Lựa chọn C) Tỷ lệ đòn bẩy tài chính của công ty tăng từ 2,43 trong 20X5 đến 2,69 trong 20X6,\ncho thấy sự suy giảm khả năng thanh toán.\nNhững điều cần nhớ:\nLợi nhuận trên vốn chủ sở hữu là tỷ suất sinh lời đo lường lợi nhuận kiếm được từ vốn chủ sở hữu của công ty\ncổ đông.\nMô tả mối quan hệ giữa các tỷ lệ và đánh giá một công ty bằng cách sử dụng tỷ lệ phân tích - LOS","qhtml":null},{"n":82,"q":"A company purchased equipment at the beginning of 20X2. At the end of 20X2, the fair value\nof the equipment fell to €10,000 below its book value. Using the revaluation model and\nignoring tax effects, on the 20X2 financial reports, this most likely results in a €10,000\nreduction in:","opts":["net income.","accumulated depreciation.","other comprehensive income."],"ans":"A","expl":"Xử lý báo cáo tài chính về việc đánh giá lại tài sản dài hạn — IFRS\nchỉ\nĐánh giá lại theo hướng tăng Đánh giá lại theo hướng giảm\nLãi được ghi nhận trong\nLỗ được ghi nhận trên thu nhập\nthu nhập toàn diện (OCI) dưới dạng\nban đầu\nbáo cáo\nthặng dư đánh giá lại\nĐược ghi nhận trên báo cáo thu nhập thành\nGiảm thặng dư đánh giá lại\nmức độ ghi nhận trước đó\nNếu thặng dư đánh giá lại = 0,\ntổn thất\nTiếp theo\nghi nhận trên báo cáo thu nhập\nLãi vượt quá khoản lỗ trước đó\ndưới dạng lỗ\nđược ghi nhận là thặng dư đánh giá lại\nCác công ty báo cáo theo IFRS được phép đánh giá lại tài sản dài hạn theo giá trị hợp lý\nhiện tại của chúng. Việc đánh giá lại tăng lên xảy ra khi giá trị hợp lý của một tài sản vượt quá giá trị ghi sổ của nó (tức là giá trị sổ sách ròng). Việc đánh giá lại đi xuống xảy ra khi giá trị hợp lý của một tài sản giảm\nthấp hơn giá trị ghi sổ của nó.\nPhương pháp kế toán cho từng trường hợp là:\nĐối với việc đánh giá lại ban đầu theo hướng tăng, lợi nhuận ban đầu từ việc tăng giá tài sản sẽ bỏ qua\nbáo cáo thu nhập và trực tiếp làm tăng thu nhập toàn diện khác, được báo cáo là một\nthành phần vốn chủ sở hữu của cổ đông trên số dư sheet.\nĐối với lần điều chỉnh giảm ban đầu , khoản lỗ ban đầu do giảm giá tài sản sẽ xuất hiện\ntrên báo cáo thu nhập và làm giảm thu nhập ròng, sau đó chuyển sang vốn chủ sở hữu của các cổ đông\ntrên bảng cân đối kế toán.\nCác cách xử lý khác nhau đối với việc đánh giá lại lên và xuống phản ánh xu hướng thận trọng của các chuẩn mực kế toán: công ty phải \"sở hữu\" việc đánh giá lại đi xuống và báo cáo nó\nvì ảnh hưởng trực tiếp đến thu nhập ròng và do đó hiệu suất thu nhập, nhưng không thể \"nhận\ntín dụng\" tương tự cho việc đánh giá lại tăng lên.\nTrong trường hợp này, giá trị hợp lý của tài sản giảm xuống dưới giá trị sổ sách của bảng cân đối kế toán, do đó\nviệc đánh giá lại đi xuống xảy ra. Điều này trực tiếp làm giảm thu nhập ròng €10.000.\n(Lựa chọn B) Do việc đánh giá lại đi xuống xảy ra vào cuối năm 20X2 nên chi phí khấu hao\nsẽ được điều chỉnh trong tương lai. Do đó, không có thay đổi nào về khấu hao\ntích lũy trong năm 20X2.\n(Lựa chọn C) Chỉ những lần đánh giá tăng lên mới ảnh hưởng đến thu nhập toàn diện khác trên bảng cân đối kế toán\n.\nNhững điều cần nhớ:\nCác công ty báo cáo theo IFRS được phép sử dụng mô hình đánh giá lại. Đối với việc đánh giá lại ban đầu\ntăng dần, lợi nhuận ban đầu từ việc tăng giá tài sản sẽ bỏ qua báo cáo thu nhập\nvà trực tiếp làm tăng thu nhập toàn diện khác trên bảng cân đối kế toán. Đối với điều chỉnh giảm ban đầu\n, khoản lỗ ban đầu do giảm giá tài sản sẽ xuất hiện trên báo cáo thu nhập\nvà làm giảm thu nhập ròng.\nGiải thích và đánh giá mức độ suy giảm và ngừng ghi nhận của tài sản, nhà xưởng, thiết bị và\ntài sản vô hình ảnh hưởng đến báo cáo tài chính và các tỷ lệ\nLOS","qhtml":null},{"n":83,"q":"An analyst runs a linear regression of a dependent variable ( Y ) against one independent variable\n( X ), resulting in the following ANOVA table:\nSource Degrees of freedom Sum of squares Mean squares\nRegression 1 32.8841 32.8841\nResidual 13 70.8710 5.4516\nTotal 14 103.7552\nBased only on the data, the most appropriate conclusion is that:","opts":["the standard deviation of the regression residuals is 8.418.","the proportion of the change in Y explained by X is 46.40%.","the regression is statistically significant, assuming a critical value of 4.6672."],"ans":"C","expl":"Bảng phân tích phương sai ( ANOVA ) tóm tắt thông tin chính về hồi quy tuyến tính và\nđược dùng để tính toán các thước đo khác nhau về mức độ phù hợp. Các thước đo này bổ sung cho nhau\nvà thường được phân tích và diễn giải cùng nhau. Ví dụ:\nSai số chuẩn của ước tính ( s ) đo lường độ chính xác của hồi quy. Nó\ne\nbiểu thị độ lệch chuẩn của phần dư hồi quy và được tính bằng √MSE; trong\ntình huống này, s = 2,335 (= √5,4516).\ne\nR2\nHệ số xác định ( ) đo lường tỷ lệ thay đổi trong Y được giải thích\nbởi X . Đó là một số từ 0 đến 1, được tính bằng tỷ lệ giữa SSR và SST. Trong trường hợp\nR2\nnày, = 0,317 (= 32,8841 / 103,7552).\nF -statistic được sử dụng để kiểm tra xem kết quả hồi quy là ngẫu nhiên hay có ý nghĩa thống kê\n. Nó được tính bằng tỷ lệ giữa MSR và MSE. Trong trường hợp này, F -statistic\n(6,032 = 32,8841 / 5,4516) lớn hơn giá trị F tới hạn (4,6672), do đó có\nbằng chứng cho thấy hồi quy có ý nghĩa thống kê .\n(Lựa chọn A) 8,418 là kết quả của việc tính s dưới dạng √ SSE (tức là, tổng biến thiên không giải thích được của Y )\ne\nthay vì √MSE, đo lường mức biến thiên trung bình không giải thích được.\nR2 R2\n(Lựa chọn B) 46,40% là kết quả của việc tính toán không chính xác theo tỷ lệ giữa SSR và SSE. là\ntỷ lệ của tổng biến thiên được giải thích bởi hồi quy (tức là SSR / SST).\nNhững điều cần nhớ:\nBảng ANOVA tóm tắt thông tin chính về hồi quy tuyến tính và được dùng để tính\nR2\nđo lường mức độ phù hợp: s đo lường độ chính xác của hồi quy, đo lường\ne\ntỷ lệ thay đổi trong Y được giải thích bởi X và F -statistic được sử dụng để kiểm tra xem\nkết quả hồi quy là ngẫu nhiên hay có ý nghĩa thống kê.\nMô tả việc sử dụng phân tích phương sai (ANOVA) trong phân tích hồi quy, diễn giải kết quả ANOVA,\nvà tính toán và giải thích sai số chuẩn của Ước tính trong hồi quy tuyến tính đơn giản - LOS","qhtml":null},{"n":84,"q":"An analyst gathers information on three non-US countries' currency regimes:\nCountry Currency Regime\nX Currency board\nY Dollarized (USD)\nZ Free-floating\nAll else equal, which country's currency regime creates the most exchange-rate risk for a US-\nbased investor?","opts":["Country X","Country Y","Country Z"],"ans":"C","expl":"Các nhà đầu tư trong nước ở thị trường nước ngoài phải chịu mức độ rủi ro tỷ giá hối đoái khác nhau,\ntùy thuộc một phần vào chế độ tiền tệ của chính phủ nước ngoài. Tỷ giá hối đoái không chỉ phản ánh\ncác lực lượng thị trường khu vực tư nhân mà còn phản ánh các chính sách do chính phủ áp đặt (tài chính và tiền tệ) và\ncác biện pháp can thiệp để quản lý tỷ giá hối đoái.\nTrong kịch bản này, Quốc gia Z có tỷ giá hối đoái thả nổi tự do , do đó các khoản đầu tư bằng tiền tệ\nbằng tiền tệ của quốc gia đó mang lại rủi ro tỷ giá hối đoái cao nhất cho nhà đầu tư nước ngoài. Vì\ntiền tệ của Quốc gia Z trôi nổi độc lập so với các loại tiền tệ khác, nên ngân hàng trung ương của quốc gia này có thể thực hiện\nchính sách tiền tệ mà không quan tâm đến các hành động chính sách tiền tệ của các ngân hàng trung ương khác.\nNgược lại, Quốc gia X tuân theo hệ thống bảng tiền tệ, đòi hỏi phải có cam kết pháp lý\ntừ ngân hàng trung ương của mình để duy trì tỷ giá ngang giá cố định và hỗ trợ đồng nội tệ với\ndự trữ ngoại tệ. Trong hệ thống bảng tiền tệ, có một số\nbiến đổi trong tỷ giá hối đoái và do đó có một số rủi ro tiền tệ, mặc dù rủi ro này ít hơn nhiều so với\ntrong chế độ tỷ giá hối đoái thả nổi (Lựa chọn A) .\nCuối cùng, Quốc gia Y có nền kinh tế bị đô la hóa (tức là quốc gia này sử dụng đồng đô la Mỹ làm tiền tệ nội địa chính thức\n), do đó, không có rủi ro tỷ giá hối đoái đối với nhà đầu tư ở Hoa Kỳ. Một quốc gia áp dụng\nđô la hóa hoàn toàn sử dụng một loại ngoại tệ thay thế, chẳng hạn như USD, làm đồng tiền hợp pháp và\ntừ bỏ quyền thay đổi tỷ giá hối đoái, điều này có tác dụng hạn chế chính sách tài chính và\ntiền tệ (Lựa chọn B) .\nNhững điều cần nhớ:\nĐối với nhà đầu tư ở Hoa Kỳ, ngoại tệ tài sản có mệnh giá được định giá bằng đơn vị tiền tệ\ncủa một quốc gia sử dụng tỷ giá hối đoái thả nổi độc lập sẽ có nhiều rủi ro nhất vì tỷ giá hối đoái\nchủ yếu được xác định bởi thị trường. Ở đầu bên kia của quang phổ, tài sản ở một quốc gia\nnước ngoài có chế độ đô la hóa sử dụng đồng đô la Mỹ (hoặc một loại tiền thay thế tương tự)\ncó rủi ro ngoại hối tối thiểu.\nMô tả chế độ tỷ giá hối đoái và giải thích tác động của tỷ giá hối đoái đối với\nthương mại quốc tế và dòng vốn\nLOS","qhtml":null},{"n":85,"q":"A developed country has a high government debt-to-GDP ratio. Its trend real GDP growth rate\nis 3%. The weighted-average interest rate on its debt is currently 4% in real terms. All else\nequal, if this relationship persists for the foreseeable future, the country's debt-to-GDP ratio\nwill most likely :","opts":["worsen, if taxes are not raised.","remain constant, as tax revenue is also growing in real terms.","improve, as economic growth is positive."],"ans":"A","expl":"Nếu tỷ lệ nợ chính phủ trên GDP tăng lên quá mức, khả năng thanh toán của một quốc gia sẽ gặp rủi ro\n. Thông thường, nếu một nền kinh tế tăng trưởng theo điều kiện thực tế (được điều chỉnh theo lạm phát), thì doanh thu thuế thực tế\nvà do đó khả năng giải quyết khoản nợ thực tế ngày càng tăng (giả sử thuế suất không đổi\nmức). Một vấn đề quan trọng đối với các chính phủ là liệu chi tiêu thâm hụt lớn hơn có dẫn đến\nđủ doanh thu từ thuế để trả lãi cho khoản nợ bổ sung hay không.\nTuy nhiên, chính lãi suất tính trên khoản nợ có thể xác định liệu tỷ lệ nợ trên\nGDP tăng hay giảm bất chấp tốc độ tăng trưởng thực sự của nền kinh tế. Nếu tốc độ tăng trưởng thực\ntốc độ thấp hơn lãi suất thực của khoản nợ thì tỷ lệ nợ trên GDP sẽ xấu đi\nmặc dù nền kinh tế đang phát triển. Trong trường hợp này, gánh nặng nợ (tức là lãi suất thực\nnhân với nợ) đang tăng nhanh hơn nền kinh tế (Lựa chọn B và C) . Nếu các khoản thanh toán lãi\ntăng nhanh, các nhà đầu tư có thể mất niềm tin vào khả năng quản lý\nnợ của chính phủ.\nNhững điều cần nhớ:\nThông thường, nếu một nền kinh tế tăng trưởng theo điều kiện thực tế (được điều chỉnh theo lạm phát), thì doanh thu thuế thực tế và\ndo đó khả năng trả nợ thực tế ngày càng tăng (giả định thuế suất vẫn giữ nguyên) không đổi).\nTuy nhiên, nếu tốc độ tăng trưởng thực của nền kinh tế thấp hơn lãi suất thực của khoản nợ,\nthì tỷ lệ nợ trên GDP sẽ xấu đi, mặc dù nền kinh tế đang phát triển, vì gánh nặng nợ\nđang tăng nhanh hơn nền kinh tế.\nMô tả vai trò và mục tiêu của chính sách tài khóa cũng như các lập luận về việc liệu quy mô của một\nquốc gia nợ liên quan đến vấn đề GDP\nLOS","qhtml":null},{"n":86,"q":"A company finalizes a contract to sell a product that will be delivered to the customer 2\nmonths from today. The customer will pay the full amount of the contract next month. If the\ncompany expects no problems in delivering the product or receiving payments, then it\nwill most appropriately recognize revenue:","opts":["immediately.","when cash is received.","when the product is delivered."],"ans":"C","expl":"Tiền mặt\nKế toán dồn tích\nkế toán\nDoanh thu kiếm được\nNgười bán về cơ bản hoàn thành tất cả các\nnghĩa vụ\nHàng hóa được giao\nDoanh thu Tiền mặt là\nDịch vụ được cung cấp\nghi nhận đã nhận được\nNgười bán (thường) hoàn thành nghĩa vụ trước khi\nnhận thanh toán\nVí dụ: Hạn thanh toán là 30 ngày sau\nhóa đơn\nChi phí phát sinh\nChi phí Hình ảnh phản chiếu ghi nhận doanh thu\nTiền mặt được thanh toán\nghi nhận Hàng hóa đã nhận\nDịch vụ được chấp nhận hoặc tiêu thụ\nTheo cả IFRS và IFRS Theo GAAP của Hoa Kỳ, doanh thu được ghi nhận khi kiếm được , độc lập với thời điểm\nnhận được tiền mặt, như theo kế toán dồn tích . Người bán kiếm được doanh thu từ việc bán hàng khi\nđã đáp ứng các nghĩa vụ thực hiện của mình, chuyển giao rủi ro và lợi ích của quyền sở hữu\nmột cách hiệu quả. Điều này thường xảy ra khi hàng hóa hoặc dịch vụ được giao cho người mua.\nTheo kế toán dồn tích, việc ghi nhận doanh thu xảy ra độc lập với thời điểm người bán\nnhận được tiền mặt từ việc bán hàng, tức là khi doanh thu được ghi nhận trên cơ sở tiền mặt\nkế toán (Lựa chọn B). Trong kế toán dồn tích, khi một công ty cung cấp hàng hóa hoặc dịch vụ vào\nthời điểm khác với thời điểm nhận tiền mặt, công ty sẽ tạo ra một tài sản hoặc nợ phải trả trên bảng cân đối kế toán\nđể tính đến các sự kiện ghi nhận doanh thu và nhận tiền mặt khác nhau.\nTrong trường hợp này, công ty đã hoàn tất hợp đồng giao sản phẩm sau 2 tháng kể từ hôm nay.\nDo đó, không có doanh thu nào được ghi nhận ngay lập tức vì không có sản phẩm nào được giao\nngay lập tức (Lựa chọn A) . Doanh thu sẽ được ghi nhận trên báo cáo thu nhập khi\ngiao hàng được thực hiện trong 2 tháng vì đó là thời điểm rủi ro và lợi ích của quyền sở hữu được chuyển giao\n.\nNhững điều cần nhớ:\nTheo kế toán dồn tích, thường được sử dụng cho báo cáo thu nhập, doanh thu\nđược ghi nhận khi kiếm được; điều này xảy ra khi người bán đáp ứng các nghĩa vụ thực hiện của mình\nbằng cách chuyển giao rủi ro và lợi ích về quyền sở hữu. Việc ghi nhận doanh thu này diễn ra\nđộc lập với thời điểm người bán nhận được tiền mặt khi bán hàng.\nMô tả các nguyên tắc chung về ghi nhận doanh thu, các ứng dụng ghi nhận doanh thu cụ thể và\ný nghĩa của các lựa chọn ghi nhận doanh thu cho phân tích tài chính\nLOS","qhtml":null},{"n":87,"q":"A company reporting under US GAAP and using FIFO assesses its inventory's net realizable\nvalue as being €200,000 less than its carrying value. The company records a write-down and\nincreases COGS by €200,000. In the subsequent period, a new assessment of the inventory's\nnet realizable value is €250,000 higher than its revised carrying value. The company's most\nappropriate action is to reduce COGS by:","opts":["€0","€200,000","€250,000"],"ans":"A","expl":"Ghi giảm và đảo ngược hàng tồn kho\nThời điểm cần đảo ngược mức tối đa\nghi lại khoản đảo ngược ghi giảm\nUS GAAP\nGiá trị ròng có thể thực hiện được Đảo ngược\n(FIFO, N/A có trọng số\n< chi phí bị cấm\ntrung bình)\nGAAP Hoa Kỳ\nGiá trị thị trường Đảo ngược\n(LIFO, N/A bán lẻ\n< chi phí bị cấm\ninventory)\nGiá trị thuần có thể thực hiện được Giá trị thuần có thể thực hiện được Số lượng\nIFRS\n< cost > ghi giảm giá trị ghi sổ\nChi phí hàng tồn kho có thể giảm do hư hỏng, lỗi thời hoặc giảm giá bán.\nCác công ty báo cáo theo IFRS và US GAAP sử dụng bất kỳ phương pháp định giá hàng tồn kho nào khác\nso với LIFO và phương pháp kiểm kê bán lẻ phải định giá hàng tồn kho của mình ở mức thấp hơn chi phí và\ngiá trị thuần có thể thực hiện được. Giá trị thuần có thể thực hiện được là giá bán ước tính trong quá trình kinh doanh\nthông thường trừ đi các chi phí để hoàn tất việc bán hàng tồn kho.\nNếu giá trị thuần có thể thực hiện được của hàng tồn kho của công ty thấp hơn chi phí, thì\ncông ty phải ghi giảm hàng tồn kho xuống giá trị thuần có thể thực hiện được. Đồng thời, công ty\nphải tăng giá vốn hàng bán lên một lượng tương tự. Giá trị này trở thành giá trị mang\nmới của khoảng không quảng cáo.\nTheo US GAAP, việc đảo ngược các khoản ghi giảm đều bị cấm . Do đó, trong trường hợp này, công ty\nkhông nên làm gì mặc dù giá trị thuần có thể thực hiện được của hàng tồn kho đã tăng cao hơn\nchi phí lưu trữ sau khi ghi giảm. Nó sẽ không làm giảm giá vốn hàng bán.\nTheo IFRS, việc ghi giảm có thể được đảo ngược trong các kỳ tiếp theo nếu giá trị thuần có thể thực hiện được tăng\ntrên giá trị ghi sổ mới. Tuy nhiên, việc đảo ngược không thể vượt quá giá trị ghi-\ndown (Lựa chọn B và C) .\nNhững điều cần nhớ:\nNếu giá trị thuần có thể thực hiện được của hàng tồn kho của công ty trở nên thấp hơn chi phí, công ty\nphải báo cáo ghi giảm và tăng giá vốn hàng bán theo số tiền ghi giảm. Theo US\nGAAP, việc đảo ngược các khoản ghi giảm đều bị cấm.\nMô tả việc đo lường hàng tồn kho ở mức thấp hơn giá gốc và giá trị thuần có thể thực hiện được cũng như\ný nghĩa của nó đối với báo cáo tài chính và các tỷ số\nLOS","qhtml":null},{"n":88,"q":"An analyst compares portfolios in which the amount invested changes each year. Which of the\nfollowing is the most appropriate measure for the analyst to use in comparing the portfolios'\nreturns over a multiyear period?","opts":["Holding period return","Arithmetic mean return","Geometric mean return"],"ans":"C","expl":"Giá trị của danh mục đầu tư có thể thay đổi trong một khoảng thời gian do đóng góp, rút ​​tiền và/hoặc\nthu nhập kiếm được. Những thay đổi về giá trị danh mục đầu tư phải được bao gồm trong giá trị ban đầu trong mỗi\ngiai đoạn tiếp theo để những thay đổi đó được gộp lại.\nLợi nhuận trung bình hình học ( G trong hình ảnh ở trên) thể hiện rõ hơn lợi nhuận của danh mục đầu tư\nvì nó cho phép gộp lợi nhuận và số tiền đầu tư\nđầu tư khác nhau. Lợi nhuận trung bình hình học tạo ra lợi nhuận trung bình định kỳ từ\nlợi nhuận định kỳ thực tế (ví dụ: lợi nhuận trung bình hàng năm trong ba năm từ lợi nhuận hàng năm trong ba năm).\nCác nhà phân tích thích lợi nhuận trung bình hình học vì nó cho phép so sánh hiệu suất\ntốt hơn giữa các khoản đầu tư với số tiền đầu tư khác nhau mỗi năm.\n(Lựa chọn A) Lợi nhuận trong thời gian nắm giữ là lợi nhuận của một tài sản kiếm được trong một khoảng thời gian cụ thể\nchẳng hạn như ngày, tuần hoặc năm. Tuy nhiên, khoản lợi nhuận này sẽ không chính xác nếu số tiền đầu tư\nthay đổi trong kỳ. Tốt nhất nên sử dụng nó làm lợi nhuận định kỳ khi số tiền đầu tư\nkhông đổi.\n(Lựa chọn B) Lợi nhuận trung bình số học (tức là lợi nhuận trung bình đơn giản) giả định một cơ sở bằng nhau\nsố tiền đầu tư vào đầu mỗi kỳ.\nNhững điều cần nhớ:\nLợi nhuận trung bình hình học chuyển đổi dữ liệu hiệu suất từ nhiều giai đoạn thành a\ncó thể so sánh được và tạo ra lợi nhuận định kỳ không đổi. Nó cung cấp\ntrình bày tốt hơn về lợi nhuận của danh mục đầu tư vì nó cho phép gộp lợi nhuận và\nsố tiền cơ sở khác nhau được đầu tư.\nTính toán và giải thích các thước đo lợi nhuận chính và mô tả cách sử dụng thích hợp của chúng\nLOS","qhtml":null},{"n":89,"q":"Which of the following statements is correct ? Credit cycles:","opts":["tend to peak just after a recession gets underway.","tend to be longer, deeper, and sharper than business cycles.","with a strong peak are inversely related to systemic banking crises."],"ans":"B","expl":"Chu kỳ tín dụng đề cập đến việc mở rộng và thu hẹp tín dụng định kỳ (tức là tín dụng\nkhả dụng) trong một nền kinh tế. Đây là một khía cạnh quan trọng của chu kỳ tài chính rộng hơn và có\ný nghĩa quan trọng đối với các chỉ số kinh tế như đầu tư, việc làm và chi tiêu của người tiêu dùng\n.\nTính sẵn có của tín dụng phản ánh khả năng tiếp cận nguồn tài chính cho các hộ gia đình và doanh nghiệp, điều này\nảnh hưởng đến khả năng đầu tư của họ, cuối cùng dẫn đến giá tài sản giảm. Giai đoạn\ncao điểm của chu kỳ tín dụng đánh dấu đỉnh cao của sự mở rộng kinh tế . Điều kiện tín dụng\ncó thể vẫn thuận lợi nhưng có dấu hiệu cho thấy nền kinh tế đang đạt đến giới hạn. Trong\ngiai đoạn thu hẹp hoặc suy thoái , tín dụng trở nên ít khả dụng hơn khi người cho vay trở nên thận trọng hơn\nthận trọng hơn về những rủi ro liên quan đến việc cho vay (Lựa chọn A).\nCác đỉnh cao trong chu kỳ tài chính có liên quan chặt chẽ với các cuộc khủng hoảng ngân hàng mang tính hệ thống.\nĐặc biệt, các cuộc khủng hoảng ngân hàng trong nước thường xảy ra ở hoặc gần với đỉnh điểm của chu kỳ tín dụng\nkhi nền kinh tế đang gặp khó khăn (Lựa chọn C) .\nNhững điều cần nhớ:\nChu kỳ tín dụng đề cập đến khả năng cung cấp tín dụng định kỳ, phản ánh khả năng tiếp cận tài chính của các hộ gia đình và\ndo đó ảnh hưởng đến khả năng đầu tư của họ, cuối cùng dẫn đến giá tài sản giảm. Giai đoạn cao điểm của chu kỳ tín dụng đánh dấu đỉnh cao của sự mở rộng kinh tế\n. Trong giai đoạn thu hẹp, tín dụng trở nên ít khả dụng hơn khi người cho vay\ntrở nên thận trọng hơn về những rủi ro liên quan đến việc cho vay.\nMô tả chu kỳ tín dụng\nLOS","qhtml":null},{"n":90,"q":"An analyst who is evaluating the probability that a company will fire its CEO if EPS decreases\nthis year gathers the following relevant estimates:\nProbability that EPS decreases 0.35\nProbability that company fires CEO if EPS decreases 0.85\nProbability that company does not fire CEO if EPS does not decrease 0.75\nThe analyst later learns that the company did not fire the CEO after reporting EPS. The\nupdated probability that the company's EPS decreased is closest to:","opts":["0.05","0.10","0.15"],"ans":"B","expl":"Ước tính xác suất thường được sửa đổi dựa trên thông tin mới. Trong trường hợp này,\nxác suất có điều kiện để CEO không bị sa thải phụ thuộc vào việc\nthu nhập trên mỗi cổ phiếu (EPS) của công ty có giảm hay không. Hai xác suất có điều kiện có liên quan như sau\nsau:\nGiám đốc điều hành không bị sa thải do EPS không giảm [P(CEO không bị sa thải | không có EPS\ngiảm)]\nGiám đốc điều hành không bị sa thải do EPS giảm [P(CEO không bị sa thải | EPS giảm)]\nBiểu đồ trên cho thấy xác suất mà CEO bị sa thải không bị sa thải là:\n0,0525 nếu EPS giảm và\n0,4875 nếu EPS không giảm.\nTổng xác suất để CEO không bị sa thải, bất kể điều gì xảy ra với EPS, là 0,0525 +\n0,4875 = 0,54. Công thức Bayes có thể được sử dụng để đảo ngược xác suất có điều kiện và\ntrả lời câu hỏi \"Xác suất EPS giảm khi CEO không bị\nsa thải\" là bao nhiêu? Tuy nhiên, việc đảo ngược sơ đồ cây bằng cách sử dụng các xác suất\nđã tính toán trước đó thường dễ dàng hơn là ghi nhớ và áp dụng công thức của Bayes:\nTrước khi nhà phân tích biết được kết quả dành cho CEO, xác suất ước tính về mức giảm EPS\nlà 0,35. Với thông tin cập nhật (tức là Giám đốc điều hành không bị sa thải) và sử dụng công thức\ncủa Bayes, xác suất sửa đổi khiến EPS giảm xuống khoảng 0,10 (tức là\n0,0972).\n(Lựa chọn A) 0,05 (tức là 0,0525) thể hiện xác suất chung rằng Giám đốc điều hành không\nbị sa thải và rằng có EPS giảm.\n(Lựa chọn C) 0,15 là xác suất có điều kiện mà CEO không bị sa thải do EPS\ngiảm.\nNhững điều cần nhớ:\nCông thức của Bayes là một cách để cập nhật xác suất của các sự kiện liên quan dựa trên thông tin mới.\nTính toán và diễn giải xác suất cập nhật trong cài đặt đầu tư bằng cách sử dụng Công thức của Bayes\nLOS","qhtml":null}];
const CFG = {"title": "UWorld Mock Exam 1 — Session 1", "subtitle": "UWorld · CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
