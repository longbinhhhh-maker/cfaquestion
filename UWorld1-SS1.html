mà Thành viên hoặc Ứng viên hỗ trợ được cho là\nlà vi phạm thì Thành viên hoặc Ứng viên phải thông báo cho người giám sát hoặc bộ phận tuân thủ\ncủa công ty để dừng hành động đó. Nếu vi phạm vẫn tiếp tục ,\nTiêu chuẩn yêu cầu Thành viên hoặc Ứng viên ngừng thực hiện hành động đó.\nKhi có nghi ngờ liệu một hành động có phải là vi phạm hay không, Thành viên hoặc Ứng viên nên tìm kiếm\nlời khuyên của cố vấn pháp lý hoặc nhân viên tuân thủ . Tuy nhiên, lời khuyên này không\nmiễn cho Thành viên hoặc Ứng viên khỏi khả năng vi phạm Tiêu chuẩn nếu hành động đó\nbất hợp pháp. Các Thành viên và Ứng viên vẫn phải biết luật pháp địa phương và báo cáo về hoặc\nngăn chặn các vi phạm, nếu cần thiết (Lựa chọn C).\nTrong trường hợp này, Chang đã thông báo cho bộ phận tuân thủ\ncủa công ty về vi phạm tiềm ẩn. Dựa trên Tiêu chuẩn, bước tiếp theo của Chang là\ntách khỏi hoạt động.\n(Lựa chọn B) Mặc dù Chang không phải là người sử dụng thông tin quan trọng không công khai nhưng cô\nvẫn phải báo cáo hoặc tách khỏi các vi phạm, nếu cần.\nNhững điều cần nhớ:\nTiêu chuẩn I(A) yêu cầu Thành viên và Ứng viên phải hiểu luật pháp của tất cả các quốc gia nơi\nhọ cư trú và kinh doanh. Khi nghi ngờ về một hành vi vi phạm có thể xảy ra, Thành viên hoặc\nỨng viên nên tìm kiếm lời khuyên của cố vấn pháp lý hoặc nhân viên tuân thủ. Các thành viên và\nỨng viên trước tiên phải báo cáo vi phạm cho người giám sát hoặc bộ phận tuân thủ; nếu\nvi phạm tiếp tục xảy ra, Thành viên hoặc Ứng viên phải ngừng hoạt động.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":23,"q":"Himari Sato just got home from taking Level I of the CFA exam. She goes onto a popular\nonline forum and writes, \"Just got back from Level I. Definitely a hard exam, much harder\nthan I expected based on my studying, but I think I passed! However, I still disagree with CFA\nInstitute's policy of providing ranges for the weights of each subject on the exam. Just tell us\nwhat to expect! I studied way too hard for derivatives, but the number of questions was at\nthe bottom of the range. I wasted so much time on this.\" Sato violated the Standards by:","opts":["disagreeing with CFA Institute's exam policies.","expressing an opinion on the difficulty of the exam.","providing information about topics tested on the exam."],"ans":"C","expl":"\"Thành viên và Ứng viên không được tham gia vào bất kỳ hành vi nào làm tổn hại đến\ndanh tiếng hoặc tính liêm chính của Viện CFA hoặc chức danh CFA hoặc\ntính toàn vẹn, hiệu lực hoặc bảo mật của các chương trình của Viện CFA.\"\nTiêu chuẩn VII(A) Ứng xử với tư cách là Người tham gia các Chương trình của Viện CFA yêu cầu các Thành viên\nvà Thí sinh duy trì danh tiếng, tính toàn vẹn, tính hợp lệ và tính bảo mật của các kỳ thi của Viện CFA\nvà các chương trình. Tiêu chuẩn nghiêm cấm hành vi có thể làm tổn hại đến niềm tin\ncủa công chúng về mức độ thành tích cần thiết để đạt được điều lệ CFA.\nThí sinh tham gia kỳ thi phải ký vào Cam kết của thí sinh, trong đó xác định các hành vi\nbị cấm trước, trong và sau kỳ thi. Những hành vi này bao gồm:\ncung cấp hoặc nhận thông tin về kỳ thi trước hoặc trong kỳ thi và\ncung cấp thông tin về kỳ thi cho người khác sau kỳ thi, bao gồm\ncác lĩnh vực chủ đề rộng đã được kiểm tra cho đến khi được Viện CFA công bố công khai.\nTrong trường hợp này, Himari Sato vi phạm Tiêu chuẩn bằng cách tiết lộ thông tin về kỳ thi.\nMặc dù cô ấy đã làm như vậy không tiết lộ thông tin về các câu hỏi cụ thể, cô ấy đã tiết lộ rằng\nsố lượng câu hỏi về công cụ phái sinh nằm ở cuối phạm vi nhất định. Việc học\nđiều này có thể mang lại lợi thế không công bằng cho những người chưa tham gia kỳ thi.\n(Lựa chọn A) Tiêu chuẩn cho phép Thành viên và Thí sinh chia sẻ những ý kiến không đồng ý\nvới các chính sách của Viện CFA (ví dụ: chỉ cho phép hai loại máy tính) và lập trường về các vấn đề chính\n(ví dụ: các bài viết ủng hộ).\n(Lựa chọn B) Thành viên và Thí sinh được phép chia sẻ ý kiến về các kỳ thi hoặc CFA\nViện miễn là các ý kiến đó không tiết lộ thông tin cụ thể về các kỳ thi.\nNhững điều cần nhớ:\nTiêu chuẩn VII(A) yêu cầu các Thành viên và Thí sinh không được tham gia vào các hành vi\nlàm suy yếu tính liêm chính của quy trình thi CFA. Điều này bao gồm việc tiết lộ thông tin\nbí mật, bao gồm chi tiết cụ thể về các câu hỏi hoặc lĩnh vực chủ đề rộng được kiểm tra trong kỳ thi\n, cho đến khi được Viện CFA công bố công khai.\nXác định hành vi tuân thủ Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":24,"q":"David Landry, CFA, is director of investor relations at a small-cap industrial company and has\nbeen directed by the CEO to elevate the investment profile of the company. Landry contacts\nindependent research providers regarding writing an investment research report on the\ncompany for distribution to buy-side analysts.\nLandry obtains quotes from two analysts. Nora O'Connor, CFA, proposes a variable fee\nstructure based on the number of new buy-side investors. George Novogratz, CFA, proposes a\nflat fee for the research report plus $2,500 for distributing the report to 10 of his buy-side\ncontacts. After evaluating both offers, Landry hires O'Connor.\nAccording to Standard I(B) Independence and Objectivity, the Standard was violated by:","opts":["Landry and O'Connor only.","O'Connor and Novogratz only.","Landry, O'Connor, and Novogratz."],"ans":"A","expl":"\"Các Thành viên và Ứng viên phải có sự quan tâm và phán đoán hợp lý để đạt được\nvà duy trì tính độc lập và khách quan trong các hoạt động nghề nghiệp của mình.\nCác Thành viên và Ứng viên phải không đề nghị, gạ gẫm hoặc nhận bất kỳ quà tặng, lợi ích,\nbồi thường hoặc sự cân nhắc nào có thể được cho là\nthỏa hiệp với sự độc lập và khách quan của chính họ hoặc của người khác.\"\nTính độc lập và khách quan của Tiêu chuẩn I(B) yêu cầu các Thành viên và Ứng viên\ntránh các hành động làm tổn hại đến tính độc lập và khách quan của họ hoặc tạo ra xung đột\nlợi ích .\nThực hiện nghiên cứu do nhà phát hành trả tiền là một phương pháp có thể chấp nhận được miễn là nhà phân tích tiến hành\nnghiên cứu một cách cẩn thận, độc lập và tiết lộ mọi xung đột. Một cách\nđể duy trì tính độc lập là chỉ chấp nhận một khoản phí cố định cho loại công việc này, vì một khoản phí\ncó thể thay đổi liên quan đến kết luận, đề xuất hoặc kết quả có thể hạn chế sự độc lập và khách quan\ncủa nhà phân tích. Trong trường hợp này, Landry và O'Connor đều vi phạm\nTiêu chuẩn bằng cách đồng ý ràng buộc khoản bồi thường theo kết quả (tức là, các nhà đầu tư mới).\n(Lựa chọn B và C) Novogratz đã không vi phạm Tiêu chuẩn khi đề xuất thỏa thuận phân phối\nvì khoản bồi thường này không dựa trên bất kỳ kết quả cụ thể nào và không thể được\ncoi là ảnh hưởng đến sự độc lập của anh ta.\nNhững điều cần nhớ:\nTiêu chuẩn I(B) Tính độc lập và khách quan yêu cầu các Thành viên và Ứng viên tránh\ncác hành động làm tổn hại đến tính độc lập và khách quan của họ hoặc tạo ra xung đột lợi ích.\nThực hiện nghiên cứu do nhà phát hành trả tiền là một phương pháp được chấp nhận nếu nhà phân tích tiến hành nghiên cứu\nmột cách cẩn trọng, duy trì tính độc lập và tiết lộ mọi xung đột.\nĐánh giá các thực tiễn, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nVề ứng xử chuyên nghiệp\nLOS","qhtml":null},{"n":25,"q":"Trevor Collins, CFA, is a financial adviser for Starlight Advisory. Some of his clients require\nadditional services outside his expertise. Collins refers clients who need life insurance to\nanother department at Starlight. The life insurance department gives Collins 10% of each\nclient's initial life insurance payment as a referral fee. Collins does not disclose this\narrangement to clients since the referral is internal to his company. Collins refers clients who\nneed advanced tax services to Accounting Hub, a third-party accounting firm. For every 10\nreferrals, Accounting Hub invites Collins to join the firm's managers in their corporate box for\na professional football game. Collins discloses to clients that he has a referral agreement with\nAccounting Hub but does not disclose the details. Collins most likely violated the Standards\nwith respect to:","opts":["only the internal life insurance referral.","only the third-party advanced tax services referral.","both the internal life insurance and third-party advanced tax services referrals."],"ans":"C","expl":"\"Các Thành viên và Ứng viên phải tiết lộ cho chủ lao động, khách hàng và\nkhách hàng tiềm năng của mình mọi khoản bồi thường, cân nhắc hoặc\nlợi ích nhận được từ hoặc được trả cho người khác để giới thiệu sản phẩm hoặc\ndịch vụ.\"\nPhí giới thiệu tiêu chuẩn VI(C) yêu cầu Thành viên và Ứng viên phải thông báo cho người sử dụng lao động,\nkhách hàng hiện tại và khách hàng tiềm năng về bất kỳ lợi ích nào họ nhận được khi giới thiệu\nsản phẩm hoặc dịch vụ . Việc tiết lộ các thỏa thuận giới thiệu cho phép người sử dụng lao động và khách hàng\nxác định xem có tồn tại xung đột lợi ích hay không và liệu đề xuất đó có khách quan hay không. Phí giới thiệu\nđược định nghĩa rộng rãi và bao gồm mọi phần thưởng bằng tiền mặt hoặc không bằng tiền mặt.\nTrong câu hỏi này, Trevor Collins vi phạm Tiêu chuẩn cho cả hai lần giới thiệu vì Tiêu chuẩn\nquy định rằng tất cả các thỏa thuận giới thiệu phải được tiết lộ. Việc giới thiệu bảo hiểm nhân thọ\nphải được tiết lộ cho khách hàng vì phí giới thiệu có thể gây ra xung đột lợi ích cho Collins cho dù\nnó đến từ nguồn nội bộ hay bên ngoài (Lựa chọn B) . Việc giới thiệu các dịch vụ thuế nâng cao\nphải được tiết lộ đầy đủ thông tin chi tiết cho khách hàng để khách hàng có thể đưa ra đánh giá sáng suốt;\nviệc chỉ tiết lộ sự tồn tại của một thỏa thuận (Lựa chọn A) là chưa đủ .\nNhững điều cần nhớ:\nCác thành viên và Ứng viên phải thông báo cho người sử dụng lao động, khách hàng hiện tại và khách hàng tiềm năng\nvề bất kỳ lợi ích nào họ nhận được khi giới thiệu sản phẩm hoặc dịch vụ. Việc tiết lộ này cho phép người sử dụng lao động và khách hàng\nxác định xem có tồn tại xung đột lợi ích hay không. Việc tiết lộ phải bao gồm\ncác thỏa thuận chi tiết về việc giới thiệu và phải được thực hiện bất kể\nthỏa thuận đó là với bên nội bộ hay bên ngoài.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nỨng xử chuyên nghiệp\nLOS","qhtml":null},{"n":26,"q":"Munira Alam, CFA, is a financial adviser for Rahmi Hadi. Hadi reads a report about Force\nGaming Inc. (FGI) and calls Alam to purchase the stock. After thorough research, Alam\nconcludes that FGI is too risky for the parameters of Hadi's investment policy statement (IPS),\nalthough the amount of the proposed purchase would have only a minimal effect on his overall\nportfolio. She calls Hadi to inform him about the risk. Hadi acknowledges Alam's warning but\ninsists that FGI stock be added to his portfolio, even if the IPS must be modified. To comply\nwith the Standards, Alam should:","opts":["purchase FGI based on Hadi's request.","cease her advisory relationship with Hadi.","refuse to purchase FGI for Hadi's portfolio."],"ans":"A","expl":"\"Khi Thành viên và Ứng viên có mối quan hệ tư vấn với khách hàng,\nhọ phải:\nB. Không chính xác vì Xác định rằng khoản đầu tư phù hợp với tình hình tài chính\ncủa khách hàng và nhất quán với các mục tiêu, nhiệm vụ,\nvà các ràng buộc bằng văn bản của khách hàng trước khi đưa ra đề xuất đầu tư hoặc thực hiện\nhành động đầu tư.\nC. Không chính xác vì Đánh giá tính phù hợp của các khoản đầu tư trong bối cảnh tổng\ndanh mục đầu tư của khách hàng.\"\nTiêu chuẩn III(C) Sự phù hợp giải quyết vấn đề trách nhiệm của cố vấn trong việc đánh giá sự phù hợp của các khoản đầu tư\nđối với từng khách hàng. Trách nhiệm này đòi hỏi phải nghiên cứu\nmục tiêu đầu tư cụ thể của khách hàng, những hạn chế và khả năng chấp nhận rủi ro. Những điều này tạo nên nền tảng của\ntuyên bố chính sách đầu tư (IPS) của khách hàng và xác định tính phù hợp của các khoản đầu tư\nđược đề xuất.\nKhách hàng đôi khi muốn thực hiện các khoản đầu tư không phù hợp với IPS của họ . Trong trường hợp\nnhư vậy, Thành viên hoặc Ứng viên nên thảo luận về khoản đầu tư được đề xuất với khách hàng\ntrước khi thực hiện giao dịch, giải thích lý do tại sao khoản đầu tư lại khác với IPS . Nếu khoản đầu tư\ncó tác động tối thiểu đến danh mục đầu tư, thì Thành viên hoặc Ứng viên có thể mua khoản đầu tư\nmà không cần sửa đổi IPS sau khi nhận được sự chấp thuận thích hợp của khách hàng, tuân theo các nguyên tắc của công ty\n.\nTrong trường hợp này, Munira Alam có thể mua cổ phiếu của Force Gaming Inc. (FGI) cho danh mục đầu tư\ncủa Rahmi Hadi kể từ khi cô ấy đã giáo dục anh ta về sự khác biệt giữa hồ sơ rủi ro của cổ phiếu và IPS\nvà nhận được sự thừa nhận của Hadi rằng vị trí này không phù hợp với IPS hiện tại của anh ta.\n(Lựa chọn B) Alam sẽ phải xem xét việc chấm dứt mối quan hệ cố vấn với Hadi chỉ khi\ngiao dịch không được yêu cầu là quan trọng đối với danh mục đầu tư của Hadi và anh ta từ chối cập nhật IPS của mình.\n(Lựa chọn C) Alam không phải từ chối mua cổ phiếu FGI mặc dù nó không phù hợp\nvới IPS của Hadi. Vì giao dịch này sẽ không quan trọng đối với danh mục đầu tư của Hadi nên Alam chỉ cần\ngiáo dục cho Hadi và yêu cầu anh ta thừa nhận rằng giao dịch này không phù hợp với IPS của anh ta.\nNhững điều cần nhớ:\nKhi khách hàng yêu cầu một khoản đầu tư không phù hợp với tuyên bố chính sách đầu tư của chính khách hàng\n, Thành viên hoặc Ứng viên nên thảo luận về khoản đầu tư với khách hàng. Nếu\nkhoản đầu tư có tác động tối thiểu đến danh mục đầu tư, Thành viên hoặc Ứng viên có thể mua\nkhoản đầu tư, theo hướng dẫn của công ty, sau khi được khách hàng chấp thuận.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":27,"q":"Grace Lee, CFA, is an investment advisor at Apex Investments. After considerable research,\nLee recommends the XYZ 130/30 long/short exchange traded fund (ETF) to her retail clients\nas their primary equity exposure, if it is suitable for their portfolios. The XYZ fund invests in a\nselection of benchmark equity securities while employing leverage (130% long) and short\npositions (30% short) to arrive at an equivalent 100% long position.\nLee is very comfortable recommending the ETF, as it has historically outperformed the\nbenchmark index while exhibiting a similar level of volatility. When discussing the ETF with\nclients and prospects, Lee touts the relative outperformance and low tracking error versus the\nbenchmark, referring to it as an \"enhanced index fund.\" Lee has most likely :","opts":["remained in full compliance with the Standards.","violated the Standards by not adequately disclosing the risks of the ETF.","violated the Standards by using the ETF as equity exposure for retail clients."],"ans":"B","expl":"\"Thành viên và Ứng viên phải:\nĐưa ra phán đoán hợp lý để xác định yếu tố nào là quan trọng\nđối với các phân tích, đề xuất hoặc hành động đầu tư của họ và\nbao gồm những yếu tố đó trong giao tiếp với khách hàng và\nkhách hàng tiềm năng.\"\nGiao tiếp theo tiêu chuẩn V(B) với khách hàng và khách hàng tiềm năng yêu cầu Thành viên và\nỨng viên thông báo cho cả khách hàng và khách hàng tiềm năng về những hạn chế\nvà rủi ro của một tài sản hoặc quy trình đầu tư. Thông tin liên lạc phải sử dụng ngôn ngữ đơn giản\ndễ hiểu cho khách hàng nhưng cũng truyền tải đủ thông tin để họ\nnhận ra những rủi ro và hạn chế có liên quan.\nTrong trường hợp này, Lee đã vi phạm Tiêu chuẩn bằng cách đơn giản hóa quá mức quỹ giao dịch trao đổi\n(ETF) như một \"quỹ chỉ số nâng cao\", làm giảm nhẹ những rủi ro cơ bản\nliên quan một cách không thích hợp với khoản đầu tư. Cụ thể, ETF không phải là một quỹ chỉ số và sử dụng\ncách tiếp cận tích cực, đòn bẩy và các vị thế bán khống, tất cả đều phải được thừa nhận rõ ràng và\nchi tiết khi thông báo rủi ro của khoản đầu tư với khách hàng và\ntriển vọng (Lựa chọn A) .\n(Lựa chọn C) Thực tế là Lee sử dụng ETF làm mức tiếp xúc vốn chủ sở hữu chính cho khách hàng bán lẻ\nkhông vi phạm cụ thể Tiêu chuẩn. Lee đã tiến hành nghiên cứu đáng kể trước khi\nđề xuất khoản đầu tư này và đang hành động theo những gì cô tin là mang lại lợi ích tốt nhất cho\nkhách hàng của mình. Vấn đề là ở cách cô ấy truyền đạt những khía cạnh thuận lợi của khoản đầu tư\nnhưng không đề cập đến những rủi ro đáng kể mà một nhà đầu tư có hiểu biết tốt muốn biết.\nNhững điều cần nhớ:\nGiao tiếp tiêu chuẩn V(B) với khách hàng và khách hàng tiềm năng yêu cầu Thành viên và\nỨng viên phải thông báo cho cả khách hàng và khách hàng tiềm năng về những hạn chế và rủi ro của một\ntài sản hoặc quy trình đầu tư. Thông tin liên lạc phải sử dụng ngôn ngữ dễ hiểu cho khách hàng\nnhưng cũng truyền tải đủ thông tin để họ nhận ra những rủi ro liên quan\nvà những hạn chế.\nGiải thích cách các thông lệ, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp của Viện CFA\nLOS","qhtml":null},{"n":28,"q":"Champion Partners is an asset management firm that employs both Charterholders and non-\nCharterholders as portfolio managers. Lorraine Dubois, CFA, is a portfolio manager for\nChampion who wishes to use third-party research reports in her investment process.\nChampion's portfolio managers are allowed to use third-party research only from firms whose\nresearch is vetted by the firm's senior managers. Dubois receives a report from Dominion\nFinancial, one of the third-party research firms approved by Champion's senior managers. To\ncomply with the Standards, most likely Dubois:","opts":["cannot use any third-party research in her process.","can use the research report without further due diligence.","must conduct her own due diligence on the third-party research."],"ans":"B","expl":"\"Các Thành viên và Ứng viên phải:\n1. Cần mẫn, độc lập, kỹ lưỡng trong phân tích\nđầu tư, đưa ra khuyến nghị đầu tư và thực hiện\nhành động đầu tư.\n2. Có căn cứ hợp lý, đầy đủ, được hỗ trợ bởi các chính sách phù hợp\nnghiên cứu và điều tra, cho bất kỳ phân tích đầu tư nào,\nkhuyến nghị hoặc hành động.\"\nTiêu chuẩn V(A) Sự siêng năng và Cơ sở hợp lý yêu cầu các Thành viên và Ứng viên phải\ncác nhà quản lý hoặc cố vấn tiến hành phân tích kỹ lưỡng và siêng năng về tất cả các khoản đầu tư được thực hiện\nthay mặt cho khách hàng của họ. Miễn là họ xác định được tính đúng đắn của nghiên cứu, Thành viên hoặc\nNgười quản lý hoặc cố vấn ứng viên có thể sử dụng nghiên cứu từ:\nnguồn thứ cấp (phân tích được hoàn thành bởi một thành viên khác của cùng công ty), hoặc\nnguồn của bên thứ ba (phân tích được hoàn thành bên ngoài công ty) ( Lựa chọn A ).\nCác Thành viên hoặc Ứng viên có thể tin tưởng những người khác trong cùng công ty để xác định xem liệu\nnghiên cứu như vậy là đáng tin cậy.\nTrong trường hợp này, Lorraine Dubois có thể sử dụng nghiên cứu của bên thứ ba mà cô ấy nhận được mà không cần phải làm gì thêm.\nsự thẩm định vì việc kiểm tra đã được thực hiện bởi các nhà quản lý cấp cao của công ty. Tiêu chuẩn\ncho phép cô ấy tin tưởng vào sự thẩm định đã được thực hiện, vì vậy cô ấy không cần phải tự mình thực hiện thẩm định\ntrước khi sử dụng nó (Lựa chọn C).\nNhững điều cần nhớ:\nTiêu chuẩn V(A) yêu cầu các Thành viên và Ứng viên là người quản lý hoặc cố vấn phải tiến hành\nphân tích kỹ lưỡng và siêng năng về tất cả các khoản đầu tư được thực hiện thay mặt cho khách hàng của họ. sử dụng\nnghiên cứu thứ cấp và bên thứ ba được cho phép. Thành viên hoặc Ứng viên có thể tin tưởng người khác\ntrong cùng một công ty để xác định xem nghiên cứu đó có đáng tin cậy hay không.\nXác định hành vi phù hợp với Quy tắc và Tiêu chuẩn cũng như hành vi vi phạm Quy tắc và\nTiêu chuẩn\nLOS","qhtml":null},{"n":29,"q":"Dimitri Federov, CFA, is a financial adviser for Arrow Financial. One of Federov's clients,\nNatasha Popova, offers Federov the use of her vacation home next January if her portfolio\nachieves 10% return this year. Federov accepts Popova's offer without disclosing it to Arrow\nsince it is only a nonmonetary offer. Federov later joins the Safe Bank board of directors,\nwhich he discloses to Arrow. As part of his compensation, Federov will receive Safe stock\noptions for each of his clients that he enrolls as a client of Safe's trust services. Federov does\nnot disclose this arrangement to Arrow since he does not have any clients who currently need\nSafe's trust services and has not recommended them to anyone. Federov most likely violated\nthe Standards:","opts":["only by accepting Popova's offer without disclosing it to Arrow.","only by failing to disclose the options compensation from Safe.","both by accepting Popova's offer and failing to disclose the options compensation from Safe."],"ans":"C","expl":"\"Thành viên và Ứng viên không được nhận quà tặng, lợi ích, thù lao hoặc\nsự xem xét cạnh tranh hoặc có thể được cho là sẽ tạo ra\nxung đột lợi ích với họ lợi ích của người sử dụng lao động trừ khi họ nhận được sự đồng ý bằng văn bản\ncủa tất cả các bên liên quan.\"\nThỏa thuận bồi thường bổ sung theo tiêu chuẩn IV(B) cho phép các thỏa thuận bồi thường bổ sung\nvới các bên thứ ba, bao gồm cả khách hàng. Tuy nhiên, Thành viên và Ứng viên phải\ntiết lộ đầy đủ các thỏa thuận đó và nhận được sự cho phép bằng văn bản từ tất cả các bên\ncó liên quan trước khi chấp nhận khoản bồi thường có thể được coi là hợp lý khi tạo ra\nxung đột với người sử dụng lao động của họ . Quà tặng, lợi ích và các khoản thù lao khác không nhất thiết phải là\ntiền tệ mới được phê duyệt.\nTrong trường hợp này, hành động của Dimitri Federov vi phạm Tiêu chuẩn trong cả hai thỏa thuận.\nThỏa thuận bồi thường quyền chọn của anh ấy với Safe Bank phải được tiết lộ đầy đủ\ncho Arrow Financial trước khi anh ấy chấp nhận. Việc anh ấy không giới thiệu các dịch vụ ủy thác của Safe cho khách hàng của mình\nvà chưa nhận được bất kỳ lựa chọn nào không có nghĩa là anh ấy không được tiết lộ thỏa thuận với\nArrow, vì nó có thể tạo ra xung đột lợi ích sau này (Lựa chọn A) .\nTương tự như vậy, thỏa thuận bồi thường của anh ấy với Natasha Popova phải được\nArrow phê duyệt bằng văn bản trước khi anh ấy chấp nhận vì Tiêu chuẩn áp dụng cho cả tiền tệ và khoản bồi thường phi tiền tệ\n(Lựa chọn B) .\nNhững điều cần nhớ:\nTiêu chuẩn IV(B) yêu cầu Thành viên và Ứng viên tiết lộ đầy đủ các thỏa thuận bồi thường của bên thứ ba\n và phải có sự cho phép bằng văn bản trước khi chấp nhận chúng. Những thỏa thuận như vậy\ncó thể tạo ra xung đột với lợi ích của người sử dụng lao động. Tiêu chuẩn áp dụng cho cả khoản thù lao bằng tiền và\nphi tiền tệ.\nĐánh giá các thông lệ, chính sách và hành vi liên quan đến Quy tắc đạo đức và tiêu chuẩn của Viện CFA\nvề ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":30,"q":"Anisa Bhandari recently received notice that she passed Level I of the CFA program. She\nupdates her credentials on a popular social media platform by stating, \"CFA Candidate: Passed\nLevel I of the CFA Program.\" As Bhandari is looking for new full-time employment, she has\ndecided not to enroll for the Level II exam until her work situation is more settled and she can\nbe sure she can commit the time and energy needed to pass the exam. Did Bhandari most\nlikely violate the Standards?","opts":["No.","Yes, by stating that she is a CFA Candidate.","Yes, by stating that she passed Level I of the CFA program."],"ans":"B","expl":"\"Khi đề cập đến Viện CFA, tư cách thành viên của Viện CFA, chỉ định CFA\nhoặc ứng cử viên trong Chương trình CFA, các Thành viên và Ứng viên phải\nkhông xuyên tạc hoặc phóng đại ý nghĩa hoặc hàm ý của tư cách thành viên trong\nViện CFA, có chứng chỉ CFA hoặc ứng cử viên trong Chương trình CFA.\"\nTiêu chuẩn VII(B) Tham chiếu đến Viện CFA, Chỉ định CFA và Chương trình CFA\nquy định cách Thành viên và Ứng viên có thể sử dụng chỉ định CFA. Thí sinh là những người\nđã:\nđăng ký với Viện CFA và đăng ký dự thi , hoặc\nđã tham gia kỳ thi và đang chờ kết quả .\nVì Anisa Bhandari đã nhận được kết quả nhưng chưa đăng ký cho kỳ thi theo lịch tiếp theo\n nên cô ấy không còn được coi là Ứng viên tích cực (Lựa chọn A) . Khi Bhandari\nđăng ký thành công Cấp độ II, cô ấy có thể coi mình là Ứng viên một lần nữa.\n(Lựa chọn C) Ứng viên có thể tiết lộ việc tham gia trước đây của họ vào chương trình CFA hoặc có thể\ntuyên bố thực tế rằng họ đã vượt qua một kỳ thi nhất định. Ngôn ngữ như \"Đạt cấp I của Chương trình CFA\nNhững điều cần nhớ:\nTiêu chuẩn VII(B) quy định cách Thí sinh tiết lộ việc tham gia chương trình CFA.\nThí sinh chỉ có thể tham khảo tư cách ứng cử của mình cho kỳ thi trong tương lai nếu họ đã đăng ký và\nđăng ký.\nGiải thích cách các thông lệ, chính sách và hành vi vi phạm Quy tắc\nĐạo đức và Tiêu chuẩn ứng xử nghề nghiệp\nLOS","qhtml":null},{"n":31,"q":"An independent auditor determines that a company's financial statements are fairly presented\nexcept that the company's records regarding accounts payable are materially incomplete. The\nauditor will most appropriately give an opinion that is:","opts":["adverse.","qualified.","unqualified."],"ans":"B","expl":"Các cơ quan quản lý thường yêu cầu các công ty giao dịch đại chúng phải có báo cáo tài chính hàng năm\nđược kiểm toán bởi một công ty kế toán độc lập; kiểm toán viên đưa ra ý kiến ​​được chỉ định\nlà không đủ tiêu chuẩn, đủ tiêu chuẩn hoặc bất lợi dựa trên kết luận kiểm toán. Kiểm toán viên sử dụng kỹ thuật lấy mẫu\nvới mục tiêu tổng thể là:\ncung cấp sự đảm bảo hợp lý rằng báo cáo tài chính không có sai sót trọng yếu\nhoặc sai sót và\nxác định xem báo cáo tài chính có được lập tuân theo\nchuẩn mực kế toán hiện hành hay không (ví dụ: GAAP của Hoa Kỳ, IFRS).\nThe kiểm toán viên sau đó đưa ra ý kiến dựa trên những gì được lấy mẫu. Ý kiến ​​đủ điều kiện được sử dụng\nkhi báo cáo tài chính phần lớn được trình bày công bằng nhưng:\ncuộc kiểm toán bị giới hạn về phạm vi (ví dụ: hồ sơ không đầy đủ) hoặc\ncó ngoại lệ so với các chuẩn mực kế toán hiện hành .\nÝ kiến ​​kiểm toán đủ điều kiện cho thấy báo cáo tài chính của công ty kém tin cậy hơn\nbáo cáo có ý kiến ​​không đủ tiêu chuẩn hoặc \"sạch\". Trong trường hợp này, kiểm toán viên bổ sung\ný kiến với các chi tiết bổ sung giải thích ngoại lệ để người sử dụng báo cáo tài chính\ncó thể quyết định liệu ngoại lệ có quan trọng hay không.\n(Lựa chọn A) Ý kiến bất lợi được đưa ra khi kiểm toán viên xác định rằng\nbáo cáo tài chính của một công ty khác biệt đáng kể so với các chuẩn mực kế toán hiện hành theo cách sẽ\nảnh hưởng đến nhà đầu tư ra quyết định.\n(Lựa chọn C) Ý kiến chấp nhận toàn phần được đưa ra khi kiểm toán viên cho rằng báo cáo tài chính\nđược trình bày công bằng ở mọi khía cạnh và phù hợp với các chuẩn mực kế toán hiện hành.\nNhững điều cần nhớ:\nCuộc kiểm toán kết thúc với việc kiểm toán viên đưa ra ý kiến không đủ tiêu chuẩn, đủ điều kiện hoặc bất lợi\nđối với báo cáo tài chính, tùy thuộc vào phạm vi, chất lượng và sự tuân thủ\nchuẩn mực kế toán của báo cáo. Ý kiến ​​kiểm toán đủ điều kiện ngụ ý rằng cuộc kiểm toán bị giới hạn về phạm vi\n(ví dụ: hồ sơ không đầy đủ) hoặc có ngoại lệ so với các chuẩn mực kế toán hiện hành.\nCác công ty muốn nhận được ý kiến ​​kiểm toán không đủ tiêu chuẩn.\nMô tả tầm quan trọng của hồ sơ pháp lý, thuyết minh báo cáo tài chính và thông tin bổ sung\n, bình luận của ban quản lý và báo cáo kiểm toán\nLOS","qhtml":null},{"n":32,"q":"Which of the following best describes a mechanism that disciplines financial reporting quality?","opts":["Auditors seek to detect and prevent fraud.","Debt covenants require high-quality reporting.","FASB and IASB set, but do not enforce, financial reporting standards"],"ans":"C","expl":"Các cơ chế chính nâng cao kỷ luật báo cáo tài chính\nNhận biết và thực thi các tiêu chuẩn công bố thông tin áp dụng cho tất cả\nCơ quan quản lý\ncác công ty\nÝ kiến cho rằng các báo cáo tuân thủ các tiêu chuẩn và trình bày khá rõ ràng\nKiểm toán viên\ntình trạng tài chính của công ty\nCác đặc điểm như khế ước nợ tạo ra báo cáo tài chính đặc biệt\nNhà đầu tư\nyêu cầu hỗ trợ các chủ nợ\nMặc dù bản thân thị trường quy định việc báo cáo tài chính của các công ty phải có mức độ rủi ro thấp và chất lượng\ncao, các cơ quan quản lý, kiểm toán viên và nhà đầu tư cũng vậy. Các tổ chức thiết lập tiêu chuẩn ,\nchẳng hạn như FASB và ISAB , là các tổ chức tự quản lý chịu trách nhiệm phát triển\nvà ban hành các tiêu chuẩn kế toán . Các tổ chức này thiết lập các nguyên tắc và\nhướng dẫn quy định việc lập và trình bày báo cáo tài chính và\ndo đó đặt ra các tiêu chuẩn về chất lượng báo cáo tài chính. Nói chung, các tổ chức này\nkhông có thẩm quyền thực thi các tiêu chuẩn này. Đây thường là trách nhiệm của các cơ quan quản lý\n.\n(Lựa chọn A) Kiểm toán viên xem xét báo cáo tài chính để xác minh việc tuân thủ các tiêu chuẩn kế toán\n. Tuy nhiên, kiểm toán viên chỉ có thể làm việc từ dữ liệu do công ty cung cấp và không\ncó khả năng xử lý chất lượng báo cáo tài chính dựa trên dữ liệu bị thao túng.\n(Lựa chọn B) Các giao ước nợ cho phép người cho vay giám sát tình trạng tài chính của người đi vay.\nTuy nhiên, điều này có thể thúc đẩy người vay thao túng kết quả tài chính để tránh vi phạm nợ\ncác giao ước.\nMọi thứ cần nhớ:\nCác tổ chức thiết lập tiêu chuẩn, chẳng hạn như FASB và ISAB, là các tổ chức tự quản lý\nchịu trách nhiệm phát triển và ban hành các chuẩn mực kế toán quy định chất lượng báo cáo tài chính\n. Các thỏa thuận hợp đồng như giao ước nợ thực sự có thể\ntạo ra chất lượng báo cáo kém, trong khi việc kiểm toán có những hạn chế cố hữu.\nMô tả các cơ chế kiểm soát chất lượng báo cáo tài chính và những hạn chế tiềm ẩn của\ncác cơ chế đó\nLOS","qhtml":null},{"n":33,"q":"An investment has an effective annual rate of 7.7% with monthly compounding. Its stated\nannual rate is closest to:","opts":["7.44%","7.70%","7.97%"],"ans":"A","expl":"Nếu lợi tức đầu tư được gộp nhiều lần mỗi năm, thì tỷ suất lợi tức hàng năm (EAR) hiệu quả\ncủa nhà đầu tư lớn hơn tỷ suất lợi tức hàng năm đã nêu. Tất cả các yếu tố khác đều\nbằng nhau, lợi nhuận gộp càng thường xuyên thì lợi nhuận dành cho nhà đầu tư\n càng lớn, được đo bằng EAR.\nTrong trường hợp này, vì 7,44% nhỏ hơn EAR nên đây là câu trả lời đúng duy nhất. Để\ntính lãi suất hàng năm đã nêu gắn liền với lãi suất EAR là 7,7% với lãi gộp hàng tháng,\nhãy sắp xếp lại công thức EAR và thay thế như sau:\nĐể chuyển đổi lãi suất định kỳ hàng tháng thành lãi suất hàng năm đã nêu, hãy nhân lãi suất hàng tháng với 12.\nDo đó, lãi suất hàng năm là 12 × 0,62% = 7,44%\n(Lựa chọn B) 7,70% là EAR. Nếu lãi suất định kỳ được gộp nhiều lần mỗi năm,\nEAR phải lớn hơn, không bằng, lãi suất hàng năm đã nêu.\n(Lựa chọn C) 7,97% là do hoán đổi nhầm EAR và lãi suất định kỳ trong công thức\n.\nNhững điều cần nhớ:\nNếu lợi tức đầu tư được gộp nhiều hơn một lần mỗi năm, thì tỷ suất lợi nhuận hiệu quả hàng năm\ncủa nhà đầu tư lớn hơn tỷ suất lợi nhuận hàng năm đã nêu. Tất cả các yếu tố khác đều bằng nhau,\nsố kỳ gộp lãi lớn hơn có nghĩa là lợi nhuận gộp lớn hơn cho nhà đầu tư, dựa trên\nlãi suất hàng năm đã nêu.\nTính toán và giải thích các thước đo lợi nhuận gộp hàng năm và lợi nhuận gộp liên tục, đồng thời\nmô tả cách sử dụng thích hợp của chúng - LOS","qhtml":null},{"n":34,"q":"An analyst conducts two hypothesis tests using different samples. The null and alternative\nhypotheses are the same for each test:\nH : population mean is less than or equal to zero\n0\nH : population mean is greater than zero\na\nThe tests are at the 0.05 significance level, and the critical value is 1.685. In Test 1, the value\nof the test statistic is 1.745, and in Test 2 the p -value is 0.0027. Assume that the probability\nof an outcome less than 1.745 is 95.95%. Test 2's evidence to reject the null hypothesis\nis most likely :","opts":["weaker than Test 1's evidence.","the same as Test 1's evidence.","stronger than Test 1's evidence."],"ans":"C","expl":"Đối với một thử nghiệm giả thuyết nhất định, giá trị p là xác suất của một kết quả cực đoan hơn\nthống kê kiểm tra kết quả. Ví dụ: trong Bài kiểm tra 1, thống kê kiểm tra là 1,745. Đang xem xét\nkiểm định một phía và giả sử xác suất của một kết quả nhỏ hơn 1,745 là 0,9595 thì\nkhả năng xảy ra kết quả lớn hơn 1,745 là 1 − 0,9595 = 0,0405. Do đó, giá trị p\ntương ứng với thống kê kiểm định t = 1,745 là p = 0,0405.\nGiá trị p rất hữu ích vì nó có thể được so sánh trực tiếp với giá trị tới hạn để xác định:\nkết quả của việc kiểm tra giả thuyết và/hoặc\nsức mạnh của bằng chứng bác bỏ giả thuyết không (nghĩa là giá trị thấp hơn có nghĩa là\ncó nhiều bằng chứng hơn để bác bỏ điều không).\nTrong kịch bản này, mức ý nghĩa là α = 0,05. Trong Thử nghiệm 1, p = 0,0405, nhỏ hơn\nhơn α, do đó kết quả kiểm định là bác bỏ giả thuyết không. Trong thử nghiệm 2, p = 0,0027. P-\ngiá trị của Kiểm tra 2 nhỏ hơn nhiều so với Kiểm tra 1, do đó mức độ tin cậy của Kiểm tra 2 là 1 − 0,0027 =\n0,9973 cao hơn nhiều so với Thử nghiệm 1. Kết luận phù hợp là Thử nghiệm 2 cung cấp\nbằng chứng mạnh mẽ hơn để bác bỏ giả thuyết không (Lựa chọn A và B).\nNhững điều cần nhớ:\nĐối với một thử nghiệm giả thuyết nhất định, giá trị p là xác suất của một kết quả cực đoan hơn\nthống kê kiểm tra. Giá trị p rất hữu ích vì nó có thể được so sánh trực tiếp với giá trị tới hạn để\nxác định kết quả của việc kiểm tra giả thuyết và/hoặc sức mạnh của bằng chứng để bác bỏ giả thuyết\ngiả thuyết vô giá trị.\nXây dựng các kiểm định giả thuyết và xác định ý nghĩa thống kê của chúng, Loại I và\nLỗi loại II và độ mạnh của phép kiểm tra ở mức ý nghĩa\nLOS","qhtml":null},{"n":35,"q":"In an oligopoly market producing homogeneous goods, the dominant firm is also the low-cost\nproducer and has a 60% market share. There are six other competitors with approximately\nequal shares of the remaining 40% market share. All else equal, the best strategy for the\nindividual small competitors to maximize profits is to price their products:","opts":["below the dominant firm's price.","equal to the dominant firm's price.","above the dominant firm's price."],"ans":"B","expl":"Công ty độc quyền dẫn đầu về giá\nĐộc quyền nhóm là cấu trúc thị trường được đặc trưng bởi một số lượng nhỏ\nđối thủ cạnh tranh bán các sản phẩm đồng nhất. Số lượng doanh nghiệp nhỏ và rào cản cao\nviệc thâm nhập vào các thị trường này sẽ dẫn đến việc các công ty riêng lẻ có một số quyền lực về giá (tức là,\nđường cầu của ngành dốc xuống). Tuy nhiên, vì có quá ít doanh nghiệp nên mỗi doanh nghiệp phải\náp dụng chiến lược định giá có xem xét hành động của đối thủ cạnh tranh để tối đa hóa lợi nhuận (nghĩa là\nchiến lược định giá phụ thuộc lẫn nhau).\nHình ảnh minh họa một thị trường độc quyền nhóm với một công ty thống trị đóng vai trò là người định giá\nngười dẫn đầu (tức là người ấn định giá) và các đối thủ cạnh tranh nhỏ hơn với tư cách là người chấp nhận giá. Công ty thống trị\ntối đa hóa lợi nhuận ở mức sản lượng tại đó chi phí biên bằng doanh thu biên (MC =\nDC\nMR ). Chiến lược định giá tối đa hóa lợi nhuận của các công ty nhỏ hơn là phù hợp với chiến lược định giá ưu thế\nDC\ngiá của công ty ( P ) vì bất kỳ mức giá nào khác đều dẫn đến lợi nhuận thấp hơn. Bởi vì tất cả các sản phẩm của công ty\nDC\nlà những sản phẩm thay thế tốt (nghĩa là đồng nhất), đặt giá cao hơn giá của công ty thống lĩnh\ndẫn đến mất doanh thu: khách hàng sẽ chuyển sang nhà sản xuất khác chưa tăng\ngiá (Lựa chọn C).\nViệc đặt giá thấp hơn giá của công ty thống lĩnh thậm chí còn có thể rủi ro hơn đối với các công ty nhỏ hơn.\nbởi vì hãng chiếm ưu thế/người dẫn đầu về giá là nhà sản xuất có chi phí thấp. Bất kỳ nỗ lực nào nhỏ hơn\nđối thủ cạnh tranh giành thị phần bằng cách giảm giá bán có thể dẫn đến chiến tranh về giá vì\ncông ty thống trị giảm giá để giữ thị phần. Và với tư cách là nhà sản xuất có chi phí thấp,\nCông ty thống trị có khả năng bù đắp chi phí tốt hơn với mức giá thấp hơn bất kỳ công ty nhỏ hơn nào.\nđối thủ cạnh tranh (Lựa chọn A).\nNhững điều cần nhớ:\nĐộc quyền nhóm là cấu trúc thị trường được đặc trưng bởi một số lượng nhỏ các đối thủ cạnh tranh bán\nsản phẩm đồng nhất. Trong một thị trường độc quyền với một công ty thống lĩnh đóng vai trò là người định giá\nlãnh đạo, chiến lược định giá tối đa hóa lợi nhuận của các công ty nhỏ hơn là phù hợp với chiến lược định giá của công ty thống trị.\nvì bất kỳ chiến lược định giá nào khác đều mang lại lợi nhuận thấp hơn.\nGiải thích mối quan hệ cung và cầu dưới sự độc quyền nhóm, bao gồm giá cả và sản lượng tối ưu\ncho doanh nghiệp cũng như chiến lược giá cả\nLOS","qhtml":null},{"n":36,"q":"A currency trader observes the following currency spot exchange rates from two dealers:\nSource Currency Exchange Rate\nDealer 1 CNY/THB 0.22\nDealer 1 INR/THB 2.35\nDealer 2 INR/CNY 10.75\nBased on only this information, the arbitrage profit available per every CNY 1 is closest to:","opts":["INR 0.0682","INR 0.0064","CNY 0.0682"],"ans":"A","expl":"Tỷ giá chéo là tỷ giá hối đoái được ngụ ý bởi hai tỷ giá hối đoái liên quan, giả định rằng\nkhông tồn tại cơ hội kinh doanh chênh lệch giá. Nếu tỷ giá hối đoái thực tế khác với tỷ giá hối đoái không chênh lệch giá\nđược ngụ ý bởi tỷ giá chéo thì cơ hội chênh lệch giá sẽ tồn tại . Nhà đầu tư\ncó thể kiếm lợi nhuận bằng cách mua một loại tiền tệ từ nguồn mà nó\nđược định giá thấp và đồng thời bán loại tiền tệ đó cho nguồn mà nó\nđược định giá quá cao .\nViệc tìm kiếm cơ hội kinh doanh chênh lệch giá từ tỷ giá chéo có thể được khái niệm hóa như một hình tam giác, như\nhiển thị ở trên. Lợi nhuận chênh lệch giá tiềm năng có thể được quan sát bằng cách di chuyển từ một loại tiền tệ này sang\nmột loại tiền tệ khác theo hai hướng quanh tam giác. Khi di chuyển quanh tam giác, một loại tiền tệ\nđược nhân với tỷ giá hối đoái thực tế để chuyển đổi sang một loại tiền tệ khác.\nTrong trường hợp này, tỷ giá INR/CNY từ Đại lý 2 là 10,75. Sử dụng tỷ giá INR/THB và CNY/THB\nđược trích dẫn bởi Đại lý 1, tỷ giá chéo INR/CNY của Đại lý 1 là 10,6818. Lợi nhuận chênh lệch giá là\nchênh lệch giữa việc mua 1 CNY với giá 10,6818 INR từ Đại lý 1 và đồng thời\nbán 1 CNY với giá 10,75 INR cho Đại lý 2. Lợi nhuận là 10,75 INR − 10,6818 INR = 0,0682 INR\ntrên mỗi 1 CNY (Lựa chọn C) .\n(Lựa chọn B) 0,0064 là lợi nhuận chênh lệch giá tiềm năng bằng CNY, không phải INR.\nNhững điều cần nhớ:\nNếu tỷ giá hối đoái thực tế khác với tỷ giá chéo bắt nguồn từ hai tỷ giá hối đoái liên quan,\ncơ hội chênh lệch giá sẽ có sẵn bằng cách mua một loại tiền tệ từ nguồn\nđược định giá thấp và bán cùng một loại tiền tệ với nguồn được định giá quá cao.\nTính toán và giải thích tỷ giá chéo tiền tệ\nLOS","qhtml":null},{"n":37,"q":"In 20X5, a company recorded:\na restructuring charge related to workforce reduction,\na loss from disposal of capital equipment previously used in core operations, and\na loss from discontinuing a segment of its operations.\nBased only on this information, which item should least appropriately be included in operating\nincome?","opts":["The restructuring charge","The loss from disposal of capital equipment","The loss from discontinuing a segment of operations"],"ans":"C","expl":"Khi một công ty ngừng một phân khúc của nó hoạt động, thu nhập (lỗ) từ\ncác hoạt động đã ngừng hoạt động được coi là không định kỳ và được loại trừ khỏi hoạt động\nthu nhập . Các nhà phân tích có toàn quyền loại bỏ tác động của các khoản mục không định kỳ để dự báo\nthu nhập trong tương lai chính xác hơn và cần biết cách báo cáo các khoản mục đó. Có\ncó bốn loại mục không định kỳ:\nCác mục bất thường hoặc không thường xuyên\nHoạt động bị ngừng\nThay đổi trong chính sách kế toán\nThay đổi về phạm vi và tỷ giá hối đoái\nCác chuẩn mực kế toán quy định rằng các mục bất thường hoặc không thường xuyên (ví dụ: phí cơ cấu lại\nliên quan đến việc tái tổ chức kinh doanh, thu được từ việc xử lý tài sản), mặc dù được coi là khó có thể\ntái diễn trong tương lai, nhưng là trọng yếu hoặc có liên quan đến hiệu quả tài chính của công ty và phải\nđược báo cáo trên báo cáo thu nhập như một phần của hoạt động liên tục, trước\nthuế (Lựa chọn A và B) .\nNhững điều cần nhớ:\nThu nhập từ các hoạt động đã ngừng hoạt động được coi là không định kỳ và không được tính vào thu nhập\nhoạt động trên báo cáo kết quả hoạt động kinh doanh. Các khoản mục bất thường hoặc không thường xuyên (ví dụ: phí tái cơ cấu,\nlợi nhuận từ việc xử lý tài sản), mặc dù được cho là không có khả năng tái diễn, được coi là\nquan trọng đối với hiệu suất hoạt động và do đó được báo cáo như một thành phần của thu nhập hoạt động.\nMô tả cách xử lý và phân tích báo cáo tài chính đối với các khoản mục không định kỳ (bao gồm\ncác hoạt động bị gián đoạn, bất thường hoặc không thường xuyên mục) và những thay đổi trong chính sách kế toán\nLOS","qhtml":null},{"n":38,"q":"Which of the following most likely limits a central bank's ability to implement effective\nexpansionary monetary policy? The central bank is unable to:","opts":["reduce the policy interest rate below the neutral rate.","increase the amount of excess reserves held by commercial banks.","increase businesses and consumers' willingness to hold bank deposits."],"ans":"C","expl":"Trong hệ thống ngân hàng dự trữ phân đoạn, các ngân hàng giữ dự trữ để đảm bảo cho khoản tiền gửi của họ. Các ngân hàng trung ương\ntrực tiếp kiểm soát dự trữ ngân hàng thương mại nhưng không kiểm soát nguồn cung tiền. Để tăng\ncung tiền, cơ chế chuyển đổi thông thường cho chính sách tiền tệ mở rộng là:\nngân hàng trung ương tạo ra dự trữ ngân hàng dư thừa bằng cách\nmua chứng khoán thông qua hoạt động thị trường mở hoặc\ngiảm yêu cầu dự trữ bắt buộc đối với các ngân hàng thương mại;\nngân hàng thương mại sử dụng dự trữ vượt mức của họ để cho vay;\nngười vay sử dụng tiền vay để thanh toán; và\nngười nhận thanh toán gửi tiền vào ngân hàng của họ.\nTiền gửi tăng làm tăng cung tiền.\nTuy nhiên, hiệu quả của chính sách mở rộng có thể bị hạn chế do doanh nghiệp và\nngười tiêu dùng không sẵn sàng giữ tiền trong tiền gửi ngân hàng (ví dụ: khi lãi suất\nthấp). Hơn nữa, tiền gửi có thể gặp rủi ro tín dụng của ngân hàng, điều này có thể\ngây ra việc rút tiền từ ngân hàng. Điều này làm giảm nguồn cung tiền và hạn chế tác động của\nchính sách mở rộng.\n(Lựa chọn A và B) Các ngân hàng trung ương phải đối mặt với một số giới hạn trong việc thiết lập lãi suất chính sách hoặc tạo ra dư thừa\ndự trữ. Các ngân hàng trung ương có thể theo đuổi các chính sách này trong phạm vi mà họ cho là phù hợp, do đó\nkhông có khả năng giảm lãi suất chính sách hoặc tăng dự trữ ngân hàng dư thừa không phải là trở ngại cho việc\ntheo đuổi các chính sách mở rộng.\nNhững điều cần nhớ:\nCác ngân hàng trung ương phải đối mặt với một số giới hạn trong việc giảm lãi suất chính sách hoặc tạo dự trữ vượt mức. Một\nhạn chế chính đối với chính sách tiền tệ mở rộng là việc ngân hàng trung ương không có khả năng kiểm soát\ncủa doanh nghiệp và sự sẵn lòng giữ tiền gửi ngân hàng của người tiêu dùng.\nMô tả phẩm chất của các ngân hàng trung ương hiệu quả; đối chiếu việc họ sử dụng lạm phát, lãi suất và\nnhắm mục tiêu tỷ giá hối đoái trong chính sách tiền tệ mở rộng hoặc thu hẹp; và mô tả\nhạn chế của chính sách tiền tệ\nLOS","qhtml":null},{"n":39,"q":"A portfolio comprises two stocks, A and B, with the following characteristics:\nAll values expressed as % A B\nPortfolio weight ( w ) 40 60\nReturn 3 6\nStandard deviation ( σ ) 5 10\nIf the portfolio standard deviation equals 5.40%, the correlation between Stocks A and B\nis closest to:","opts":["−0.4517","−0.0023","0.1733"],"ans":"A","expl":"Có thể sử dụng phương sai danh mục đầu tư và độ lệch chuẩn để đo lường độ phân tán của\nlợi nhuận danh mục đầu tư . Phương sai tổng thể cao thể hiện mức độ phân tán cao và\ndo đó rủi ro tổng thể cao .\nLợi ích chính của việc nắm giữ một danh mục đầu tư đa dạng là phương sai tổng thể của danh mục đầu tư có thể\nthấp hơn mức trung bình có trọng số đơn giản của phương sai của các tài sản thành phần của nó . Mức độ\ncủa hiệu ứng này phụ thuộc vào mối tương quan giữa các tài sản nắm giữ trong danh mục đầu tư.\nNhư được thể hiện trong phương trình tính phương sai của danh mục đầu tư hai cổ phiếu, trọng số danh mục đầu tư, phương sai cổ phiếu\nvà mối tương quan giữa các cổ phiếu được sử dụng để tính toán phương sai.\nGiá trị tương quan càng nhỏ thì phương sai danh mục đầu tư càng nhỏ .\nTrong kịch bản này, độ lệch chuẩn của danh mục đầu tư được đưa ra. Trước tiên, phương sai phải được rút ra,\nsau đó, phương trình trên có thể được sử dụng để giải mối tương quan:\nMối tương quan gần nhất với −0,4517.\n(Lựa chọn B) −0,0023 là hiệp phương sai giữa Cổ phiếu A và B, có liên quan đến\ntương quan và bằng tích của mối tương quan và từng tiêu chuẩn độ lệch.\n(Lựa chọn C) 0,1733 là kết quả của việc áp dụng không chính xác trọng số Cổ phiếu A cho độ lệch chuẩn\ncủa Cổ phiếu B và ngược lại.\nNhững điều cần nhớ:\nTrong danh mục đầu tư hai cổ phiếu, tất cả các yếu tố khác đều bằng nhau, giá trị tương quan nhỏ hơn sẽ dẫn đến phương sai\nnhỏ hơn. Phương sai của danh mục đầu tư là hàm số của trọng số và độ lệch chuẩn của từng\ntài sản cũng như mối tương quan giữa các tài sản.\nTính toán các giá trị, phương sai và độ lệch chuẩn dự kiến ​​và chứng minh ứng dụng của chúng cho\ncác vấn đề đầu tư\nLOS","qhtml":null},{"n":40,"q":"A small country imposes a tariff on a popular imported consumer product, and an analyst\ngraphs domestic supply and demand curves for the import.\nAll else equal, and based only on the analyst's image, most likely :","opts":["Region C represents domestic producer surplus created by the tariff.","Region A represents domestic consumer surplus created by the tariff.","Regions B and D represent the deadweight loss to the domestic society"],"ans":"C","expl":"Tác động tổn thất vô ích của thuế quan đối với xã hội\nMục tiêu chính của thuế quan đối với hàng nhập khẩu là để bảo vệ các ngành công nghiệp trong nước. Mặc dù một phần\nlượng cầu về một hàng hóa có thể được sản xuất trong nước nhưng vẫn cần nhập khẩu để đáp ứng\ntoàn bộ nhu cầu. Tuy nhiên, thuế quan làm giảm lượng cầu đối với hàng hóa nhập khẩu bằng cách\ntăng giá (P ) cao hơn giá thế giới thương mại tự do (P ).\nT W\nDo giá cao hơn do thuế gây ra, sản xuất trong nước sẽ tăng (từ Q lên Q ),\nS0 S1\ndẫn đến thặng dư nhà sản xuất (tức là đối với Khu vực A). Tổn thất vô ích (tức là đối với Khu vực B và D)\nđối với xã hội xảy ra do sự thiếu hiệu quả trong cả tiêu dùng và sản xuất :\nKhu vực B thể hiện sự thiếu hiệu quả trong sản xuất. Thuế quan khuyến khích các nhà sản xuất trong nước\nkhông kinh tế tham gia (hoặc ở lại) thị trường, dẫn đến việc phân bổ tài nguyên\nkhông hiệu quả, gây ra chi phí cho xã hội.\nKhu vực D thể hiện sự thiếu hiệu quả trong tiêu dùng (tức là tổn thất vô ích cho người tiêu dùng).\nSau thuế quan, giá đối với người tiêu dùng trong nước tăng từ P lên P ; do đó, tổng cầu trong nước\nW T\n(của cả nhập khẩu và cung trong nước) đều giảm (Q − Q ). Người tiêu dùng\nD0 D1\nsẵn sàng trả nhiều hơn P nhưng thấp hơn P hiện không thể hoặc không muốn\nW T\ntiêu dùng sản phẩm, do đó, người tiêu dùng bị tổn thất nặng nề và không có thặng dư tiêu dùng\nthặng dư nào được tạo ra (Lựa chọn B) .\nDoanh thu thuế bổ sung mà chính phủ tạo ra theo thuế quan (Q − Q ) là\nD1 S1\nđại diện bởi Khu vực C (Lựa chọn A).\nCùng với nhau, Khu vực B và D thể hiện tổn thất trong hoạt động kinh tế (ví dụ: mất phúc lợi) của\nngười tiêu dùng trong nước do thuế quan không được bù đắp bằng lợi ích dành cho nhà sản xuất hoặc\nchính phủ.\nNhững điều cần nhớ:\nThuế quan đối với hàng nhập khẩu tạo ra tổn thất vô ích cho xã hội khi chúng dẫn đến sự kém hiệu quả trong cả\ntiêu dùng và sản xuất. Thiệt hại trong thặng dư tiêu dùng lớn hơn tổng\nthặng dư của nhà sản xuất và doanh thu của chính phủ từ thuế quan.\nSo sánh các loại hạn chế thương mại, chẳng hạn như thuế quan, hạn ngạch và trợ cấp xuất khẩu cũng như\ný nghĩa kinh tế của chúng - LOS","qhtml":"<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAw8AAAKyCAIAAAAcnXWeAABU5ElEQVR42u3dX2yb953v+Y/W6ZFTY6VQBeQYqJ2Isn3c2krSIdNtA3ubIuTFSBmgdYYEpJ6Ltjsg7ezN7NkLMnuz2ZsJn4tZnJuNTWLQ9uJEAsjGLdBIcyEa7Rx70sGJOJPENkaILSqVAzg2EDES1qh1Gq/34nv0myck9f8f/7xfF4ZIPyIfPg8f6svv9/f7/joePXokAAAArOB/4BAAAAAQLQEAABAtAQAAEC0B
