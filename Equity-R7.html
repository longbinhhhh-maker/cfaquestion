<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Revenue for ABC Company will close the year at $15 million. In projecting next year's\nrevenue, the CFO assumes nominal GDP growth of 3% and company revenue growing 15%\nfaster than GDP. Projected revenue next year will be closest to:", "opts": ["$15,450,000.", "$15,472,500.", "$15,517,500."], "ans": "C", "expl": "If GDP is expected to grow 3%, company revenue growing 15% faster is equivalent to\n3.45% growth (3% × (1 + 0.15) = 3.45%). So, $15 million in revenues × 1.0345 = $15,517,500.\nThe number $15,450,000 reflects revenue growth of only 3% (the GDP growth alone), and\n$15,472,500 reflects revenue growth of 3.15%.\n(Module 45.1, LOS 45.b)"}, {"n": 2, "q": "An analyst is most likely to forecast summary measures for a company, rather than\nforecasting specific financial statement items, when:", "opts": ["users of the forecast require transparency.", "ad hoc items affect the results.", "summary measures are relatively stable over time."], "ans": "C", "expl": "Forecasting summary measures is most useful when these measures do not fluctuate\nsignificantly from period to period. Such forecasts are less transparent to users than\nforecasts based on financial statement items. Ad hoc items refer to events that a\ncompany's past financial results do not reflect and typically need to be accounted for\nexplicitly in a forecast.\n(Module 45.1, LOS 45.a)"}, {"n": 3, "q": "Current year balances for working capital accounts are $8 million for accounts payable, $13\nmillion for inventory, and $10 million for accounts receivable. If the former is forecasted to\ngrow 3% and the latter two line items are forecasted to grow 4%, an analyst will estimate a\nworking capital total closest to:", "opts": ["$15,450,000.", "$15,600,000.", "$15,680,000."], "ans": "C", "expl": "Based on forecasted growth totals, next year's amounts will be equal to the following:\nAccounts payable: $8,000,000 × 1.03 = $8,240,000\nInventory: $13,000,000 × 1.04 = $13,520,000\nAccounts receivable: $10,000,000 × 1.04 = $10,400,000\nForecasted working capital = $10,400,000 + $13,520,000 – $8,240,000 = $15,680,000\nThe number $15,450,000 results from growing all three line items at 3%, and $15,600,000\nresults from growing all three line items at 4%.\n(Module 45.1, LOS 45.c)"}, {"n": 4, "q": "In creating a forecast for capital spending devoted to maintenance projects, an analyst will\noften start her analysis by looking at a company's:", "opts": ["historical depreciation expenses in prior years.", "prior-year asset sales.", "current year gross property, plant, and equipment balance."], "ans": "A", "expl": "Historical depreciation expense gives an analyst an idea of how old the current asset\ninfrastructure is, and what maintenance and replacements may need to be made. Prior-\nyear sales and current year gross PP&E balances do not provide insight into the amount of\nmaintenance costs a company should budget for the next year.\n(Module 45.1, LOS 45.d)"}, {"n": 5, "q": "Based on growth strategies outlined by the company's CEO, an analyst forecasts overall\ngrowth of 5%. With inflation forecasted by economists at 3%, an analyst will likely forecast\ncapital expenditures related to maintenance to grow by what percentage next year?", "opts": ["3%.", "8%.", "5%."], "ans": "A", "expl": "Maintenance-related capital expenditures are typically forecasted to grow by the inflation\nrate (3%, in this case). Capital expenditures related to growth will align with the overall\nforecasted growth rate of the company (5% here). The 8% answer choice incorrectly sums\nthe two forecasts.\n(Module 45.1, LOS 45.d)"}, {"n": 6, "q": "Forecasting a fixed growth rate is most appropriate for estimating:", "opts": ["cost of goods sold.", "selling expenses.", "administrative expenses."], "ans": "C", "expl": "General and administrative expenses are often more fixed than variable and can be\nmodeled using a fixed growth rate that includes expected inflation. Cost of goods sold and\nselling expenses are related to sales volumes and are more appropriately modeled based\non expected revenues.\n(Module 45.1, LOS 45.c)"}, {"n": 7, "q": "Which of the following measures will an analyst most likely use to develop a forecasted\ncapital structure mix for a company he is reviewing?", "opts": ["Debt-to-equity ratio.", "Current ratio.", "Working capital."], "ans": "A", "expl": "A firm's capital structure, which represents the sources of funding for a company, consists\nof liabilities and equity on its balance sheet. The debt-to-equity ratio is a measure of\nleverage (solvency) and may be used to forecast capital structure. The current ratio is a\nliquidity measure that divides current assets by current liabilities. Working capital is equal\nto current assets less current liabilities. Neither the current ratio nor working capital will\nprovide information on a firm's capital structure.\n(Module 45.1, LOS 45.d)"}, {"n": 8, "q": "A company's days sales outstanding (DSO) is equal to 42 days. With current revenues of $20\nmillion and 8% forecasted growth, accounts receivable on the pro forma balance sheet will\nbe closest to:", "opts": ["$2,301,370.", "$2,485,480.", "$2,684,320."], "ans": "B", "expl": "Forecasted accounts receivable can be calculated by multiplying the days sales\noutstanding by forecasted revenue and then dividing by 365. With forecasted revenue of\n$21,600,000 ($20 million × 1.08) and DSO of 42, forecasted receivables will be equal to (42\n× $21,600,000) / 365 = $2,485,480.\nThe number $2,301,370 incorrectly uses $20,000,000 as forecasted revenues, and\n$2,684,320 incorrectly incorporates the 8% growth to the DSO total as well.\n(Module 45.1, LOS 45.c)"}, {"n": 9, "q": "Current-year sales for ABC Co. are $20 million. Although Annie Mann, CFA, forecasts overall\ngrowth of 5% heading into next year, she would like to further refine her estimates by\nassigning the following probabilities based on actions she thinks the competition may take.\nGrowthProbability\n6 percent30%\n5 percent20%\n4 percent50%\nUsing these probabilities, what is Mann's forecasted sales total for next year?", "opts": ["$20,800,000.", "$21,000,000.", "$20,960,000."], "ans": "C", "expl": "The weighted average probability of the three scenarios is equal to 4.8% (6% × 30%) + (5%\n× 20%) + (4% × 50%); $20,000,000 × 1.048 = $20,960,000. The number $20,800,000 assumes\n4% growth (because 50% is the highest probability), and $21,000,000 assumes 5% growth\n(because that is the overall figure).\n(Module 45.1, LOS 45.e)", "qhtml": "<p>Current-year sales for ABC Co. are $20 million. Although Annie Mann, CFA, forecasts overall</p><p>growth of 5% heading into next year, she would like to further refine her estimates by</p><p>assigning the following probabilities based on actions she thinks the competition may take.</p><table class=\"qtable\"><thead><tr><th>Growth</th><th>Probability</th></tr></thead><tbody><tr><td>6 percent</td><td>30%</td></tr><tr><td>5 percent</td><td>20%</td></tr><tr><td>4 percent</td><td>50%</td></tr></tbody></table><p>Using these probabilities, what is Mann's forecasted sales total for next year?</p>"}, {"n": 10, "q": "In forecasting revenues, gains, and losses for the next year, an analyst should most likely\nexclude which of the following situations from his forecast?", "opts": ["Losses stemming from the launch of a new product that is not expected to be profitable for two years.", "Gains on the sales of aged fixed assets that were replaced by newer assets with longer useful lives.", "Significant gains due to the remeasurement of subsidiary financial statements."], "ans": "C", "expl": "In forecasting revenue, an analyst will look to exclude nonrecurring items because they are\nnot deemed to be sustainable going forward. Gains due to the remeasurement of\nsubsidiary financial statements result from exchange rate changes, and those are not\npredictable.\nThe sale and replacement of aged fixed assets occurs on a regular basis for companies,\nand if gains on sale of older assets occur regularly, an analyst should include them in\nforecasts. New products often lose money early on. These losses should not be excluded\nbecause they are predictable with reasonable confidence.\n(Module 45.1, LOS 45.b)"}, {"n": 11, "q": "A company has a market share of 5% and sales of $16 million. If overall industry sales are\nforecasted to grow 4% and the company's market share is expected to increase to 6%,\nexpected sales for the company will be closest to:", "opts": ["$17,600,000.", "$19,968,000.", "$16,640,000."], "ans": "B", "expl": "With company sales of $16 million and market share of 5%, sales for the industry are equal\nto $320 million ($16 million / 0.05). If overall industry sales are forecasted to grow 4%,\nindustry sales will be equal to $332,800,000. With a forecasted market share of 6%, the\ncompany's forecasted revenue will be $332,800,000 × 0.06 = $19,968,000.\nThe number $16,640,000 is the current $16,000,000 in revenues grown by the 4% industry\ngrowth, and $17,600,000 is the current $16,000,000 in revenues grown by the combination\nof 4% industry growth and the 6% market share.\n(Module 45.1, LOS 45.b)"}, {"n": 12, "q": "An analyst attends a management call where the CEO projects revenue and operating\nexpense growth of 4%–6% next year, respectively. Understanding the natural tendency of\nmanagement when communicating these numbers, an analyst will most likely project which\nof the following?", "opts": ["Operating expense growth of 4%–6%.", "Operating expense growth of 5%–7%.", "Revenue growth of 5%– 7%."], "ans": "C", "expl": "In an effort to show better actual results than estimated, management will often project\nlower revenue growth and higher operating expense growth. So, with management\nproviding estimated growth of 4%–6% for both, an analyst is likely to project revenue\ngrowth higher and operating expense growth lower than management estimates.\n(Module 45.1, LOS 45.a)"}, {"n": 13, "q": "In estimating sales for future years, an analyst will most likely account for which of the\nfollowing potential assumptions?", "opts": ["Tax rate changes.", "Reductions in fixed costs due to new negotiations with warehouse landlords.", "New product launches by the competition."], "ans": "C", "expl": "While sales will likely be directly impacted by competitors' actions such as new product\nlaunches, tax rate changes and fixed cost reductions will not have a direct impact on sales\ntotals.\n(Module 45.1, LOS 45.e)"}, {"n": 14, "q": "Which of the following represents a benefit to an analyst incorporating scenario analysis into\nher forecasting?", "opts": ["Solidifying a single forecasted number for bottom-line profits.", "Adjusting past results for unidentified errors.", "Accounting for potential changes in the company’s economic environment."], "ans": "C", "expl": "Because analysts must use estimates and assumptions in forecasting future financial\nstatements, scenario analysis accounts for the reality that unforeseen changes may impact\nline items in a positive or negative way. The analyst will, therefore, be able to produce a\nrange of estimates based on potential changes in the economy, rather than having to stick\nto one point estimate. Past results are not adjusted for unidentified errors, and a single\nforecasted number is not \"solidified\" through scenario analysis.\n(Module 45.1, LOS 45.e)"}, {"n": 15, "q": "An analyst is using an historical base rate convergence approach to estimate the growth rate\nof a company in an established industry. If the analyst forecasts sales growth for this\ncompany of 4% next year, it is most likely because:", "opts": ["sales have grown 6% over the last couple of years and are due to grow more next year.", "GDP growth is forecasted to remain stable.", "the industry average is forecasted at 4%."], "ans": "C", "expl": "With the historical base rate convergence approach, an analyst will estimate growth in line\nwith the industry overall, median growth rate, or a macroeconomic measure such as gross\ndomestic product (GDP). Forecasted sales growth of 4% would make sense under this\napproach if the industry average were expected to be similar. If GDP growth is forecasted\nto be stable, that would not drive a growth projection of 4%. Also, sales growth of 6% in\nprevious years that is expected to increase even more would not drive a 4% growth\nestimate.\n(Module 45.1, LOS 45.a)"}, {"n": 16, "q": "An analyst forecasts average selling prices for each product and service a company provides,\nas well as expected sales volumes. Using these estimates is an example of which type of\nrevenue forecasting?", "opts": ["Bottom up.", "Top down.", "Economic driven."], "ans": "A", "expl": "A bottom-up approach to revenue forecasting begins with an analysis of an individual\ncompany. This will include forecasting selling prices and expected sales volumes. Top-\ndown approaches begin with estimates of macroeconomic variables such as gross\ndomestic product (GDP). Economic driven is not a formal approach.\n(Module 45.1, LOS 45.b)"}, {"n": 17, "q": "Sandra Page, CFA, is preparing a pro forma balance sheet for a company. Page is planning to\nincorporate several ad hoc additions into her forecast that are not currently accounted for\non the company's recently published balance sheet from the prior year. Which of the\nfollowing items will Page most likely need to add?", "opts": ["Forecasted losses due to exchange rate fluctuations over the course of the year.", "Unrealized gains on equity securities since the date of the previous balance sheet.", "A potential gain stemming from a lawsuit in which the company was the plaintiff."], "ans": "C", "expl": "Contingent gains (e.g., those stemming from lawsuits) are not recorded on the financial\nstatements until they have occurred. So, Page may want to incorporate these gains as a\nreceivable (for the amount to be paid to the company) on the balance sheet and a gain on\nthe income statement. Exchange rate fluctuations are unpredictable and would not likely\nbe accounted for in a pro forma. Market value changes cause unrealized gains or losses on\nequity securities, and these are unlikely to qualify as ad hoc items incorporated into a\nforecasted balance sheet.\n(Module 45.1, LOS 45.a)"}, {"n": 18, "q": "Which of the following scenarios may an analyst use to forecast sales growth for a company\nin the next fiscal year?", "opts": ["30% chance of sales increasing, 40% chance of no growth, 40% chance of sales decreasing.", "20% chance of sales increasing, 50% chance of no growth, 20% chance of sales decreasing.", "40% chance of sales increasing, 30% chance of no growth, 30% chance of sales decreasing."], "ans": "C", "expl": "In a scenario analysis used to forecast a change in sales, the probabilities associated with\neach scenario must be between 0% and 100% and must sum to 100%. The correct answer\nchoice sums to 100% (40% chance of an increase + 30% chance of no growth + 30% chance\nof sales decreasing). The other two choices do not sum to 100%.\n(Module 45.1, LOS 45.e)"}, {"n": 19, "q": "A company's CFO plans to spend $45 million on capital expenditures in the next year. These\nexpenditures will be funded through cash held in the company's bank accounts ($30 million)\nand $15 million coming from a planned debt issuance at the end of the current year. An\nanalyst forecasting the capital structure of the firm will project which of the following?", "opts": ["An increase in cash flows from investing activities.", "A decrease in financial leverage.", "An increase in the debt-to-equity ratio."], "ans": "C", "expl": "A new debt issuance will increase the amount of debt for a company, with no change to\nequity. The debt-to-equity ratio, therefore, will increase, which is an increase in financial\nleverage. Cash flows from investing activities will decrease, with the outflow of $45 million\nfor capital expenditures.\n(Module 45.1, LOS 45.d)"}, {"n": 20, "q": "Pam Jones, CFA, creates pro forma financial statements for a company she is analyzing. In\ndeveloping the income statements, she needs to forecast growth for the selling, general, and\nadministrative (SG&A) line item. Her forecasted number will most likely be driven by:", "opts": ["inflation forecasts for fixed SG&A, and sales growth for variable SG&A.", "sales growth for fixed SG&A, and inflation forecasts for variable SG&A.", "sales growth for both fixed and variable SG&A."], "ans": "A", "expl": "SG&A costs are both fixed and variable. The fixed portion will be less impacted by sales,\nwhich means an inflation growth factor would be appropriate. Variable SG&A will have a\nhigher correlation to sales, so sales growth is appropriate as a driving factor.\n(Module 45.1, LOS 45.c)"}, {"n": 21, "q": "A top-down revenue forecast is most likely to be based on expected:", "opts": ["product prices and volumes.", "sales at existing and new outlets.", "GDP growth."], "ans": "C", "expl": "Top-down forecasts are based on macro variables such as GDP growth. Bottom-up\nforecasts are based on company-specific factors such as product prices and volumes or\nsales at existing and new outlets.\n(Module 45.1, LOS 45.b)"}, {"n": 22, "q": "An analyst would like to use historical results as a baseline to prepare his forecasted\nfinancial statements for the next year. Which of the following types of companies are\nappropriate for this type of approach?", "opts": ["Companies in cyclical industries.", "Mature-stage companies.", "Companies moving to a differentiation strategy."], "ans": "B", "expl": "Companies that are in a mature stage are more stable (less volatile), which means\nhistorical results are more useful as predictors for future performance. Cyclical industry\ncompanies are heavily impacted by economic business cycles, which makes historical data\nless relevant depending on the current cycle of the economy. Also, companies changing\ncompetitive strategies will have historical data based on the old strategy rather than the\nnew strategy.\n(Module 45.1, LOS 45.a)"}, {"n": 23, "q": "Using a baseline revenue amount of $6 million for A Co., an analyst estimates that next\nyear's revenue will grow by 3%. If the forecasted gross margin is equal to 65%, forecasted\ncost of goods sold (COGS) will be closest to:", "opts": ["$4,017,000.", "$1,920,000.", "$2,163,000."], "ans": "C", "expl": "On a baseline of $6 million and forecasted 3% revenue growth, next year's revenue will be\nestimated at $6,180,000 ($6 million × 1.03). COGS as a percentage of sales will be 35%,\ngiven a gross margin of 65%. Forecasted COGS is equal to $6,180,000 × 35% = $2,163,000.\nThe number $1,920,000 is equal to the baseline of $6 million multiplied by 32% (which\nassumes the gross margin of 65% grows by 3%), and $4,017,000 is equal to the forecasted\n$6,180,000 multiplied by 65%.\n(Module 45.1, LOS 45.c)"}];
const CFG = {"title": "Company Analysis Forecasting", "subtitle": "CFA · Equity Investments · Reading 45 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem";
    if(q.qhtml){ stem.innerHTML = q.qhtml; } else { stem.textContent = q.q; }
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
