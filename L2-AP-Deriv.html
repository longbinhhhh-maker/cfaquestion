tes and finds that the relevant 3-month and 6-month interest rates have discount factors of 0.990005 and 0.979639, respectively.<\/p><p>The next item of business to be discussed concerns Brownstone&#x27;s working capital management. Coleman tells Holden that the company will be depositing USD 13,500,000 next month and is considering taking a long position in a 1 x 6 forward rate agreement (FRA). The terms of this FRA stipulate that when it expires in one month, the interest rate for the floating leg will be set and a payment will be made based on the difference between the exercise rate and the prevailing reference rate. Holden responds with the following two statements:<\/p><p>Statement A: &quot;The FRA position that Brownstone is considering is the equivalent of going long a one-month Libor deposit and short a six-month Libor deposit.&quot;<\/p><p>Statement B: &quot;If Brownstone takes this FRA position, the company will receive payments based on a fixed rate.&quot;<\/p><p>Finally, the two colleagues discuss Brownstone&#x27;s longer-term borrowing needs. Coleman informs Holden that, next month, Brownstone will be taking out a 5-year bank loan with annual floating-rate interest payments based on Libor. Coleman adds that she would like to convert this loan into a fixed-rate obligation. Holden advises that Brownstone enter a 5-year, pay-fixed, receive Libor interest rate swap. Specifically, he recommends Libor swap rates equal to 45 basis points plus the zero-coupon Treasury spot rates shown below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0247.webp\" style=\"max-width:min(100%,299px)\" alt=\"Exhibit 1: Zero-coupon spot curve\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0248.webp\" style=\"max-width:min(100%,374px)\" alt=\"Term Zero-coupon rate (years) (annual)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0249.webp\" style=\"max-width:min(100%,374px)\" alt=\"1 4.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0250.webp\" style=\"max-width:min(100%,374px)\" alt=\"2 4.70%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0251.webp\" style=\"max-width:min(100%,374px)\" alt=\"3 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0252.webp\" style=\"max-width:min(100%,374px)\" alt=\"4 5.15%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0253.webp\" style=\"max-width:min(100%,374px)\" alt=\"5 5.25%\"><p>After listening to his recommendation, Coleman asks Holden &quot;Is an interest rate swap essentially a series of forward rate agreements?&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most accurate assessment of Holden&#x27;s statements about the forward rate agreement position being considered by Brownstone?<\/p><\/div>", "subj": "derivatives"}, {"n": 53, "q": "The hedge ratio for the put option on ABC stock in Graves' example is closest to:", "opts": ["-0.54.", "-0.58.", "-0.71."], "ans": "B", "expl": "The hedge ratio for a put option is a crucial metric in options trading, representing the ratio of the change in the price of the put option per unit change in the price of the underlying asset. It is calculated using the formula: where h is the hedge ratio, p+ is the value of the put option if the spot price of the underlying increases, p− is the value of the put option if the spot price of the underlying decreases, S + is the future spot price if it increases, and S − is the future spot price if it decreases. In the given scenario, the underlying stock price can increase to \\$50.00 or decrease to \\$38.00. The exercise price of the put option is \\$45.00. If the stock price rises to \\$50.00, the put option will be out of the money and hence worthless (p+ = 0). If the stock price falls to \\$38.00, the put option will be in the money, and its intrinsic value will be $45.00 − $38.00 = $7.00 (p− = 7). Plugging these values into the formula gives: This calculation shows that the hedge ratio for the put option is approximately -0.58, which aligns with option B. A is incorrect. It suggests a hedge ratio of -0.54, which does not match the calculated value of -0.583. The discrepancy arises because the calculation of the hedge ratio must strictly follow the formula for determining the sensitivity of the put option's price relative to changes in the underlying asset's price. Any deviation from the correct values used in the formula, such as different assumptions about the option's payoff under various scenarios, would lead to an incorrect hedge ratio. The precise calculation based on the given data points directly to -0.583, thus making option A incorrect. C is incorrect. It suggests a hedge ratio of -0.71, which significantly deviates from the calculated value of -0.583. This option might result from a misunderstanding of the put option's behavior or incorrect application of the hedge ratio formula. The hedge ratio must reflect the proportionate change in the option's price relative to the change in the stock price, and any miscalculation or misinterpretation of the values involved (such as the put option's payoff in different scenarios or the potential future prices of the underlying asset) would result in an inaccurate hedge ratio. The correct application of the formula, as demonstrated, yields a hedge ratio of -0.583, confirming that option C is incorrect. ", "explhtml": "<p>The hedge ratio for a put option is a crucial metric in options trading, representing the ratio of the change in the price of the put option per unit change in the price of the underlying asset. It is calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0258.webp\" style=\"max-width:min(100%,106px)\" alt=\"p+ −p− h = S + −S −\"><p>where h is the hedge ratio, p<sup>+<\/sup> is the value of the put option if the spot price of the underlying increases, p<sup>−<\/sup> is the value of the put option if the spot price of the underlying decreases, S <sup>+<\/sup> is the future spot price if it increases, and S <sup>−<\/sup> is the future spot price if it decreases.<\/p><p>In the given scenario, the underlying stock price can increase to \\$50.00 or decrease to \\$38.00. The exercise price of the put option is \\$45.00. If the stock price rises to \\$50.00, the put option will be out of the money and hence worthless (p<sup>+<\/sup> = 0). If the stock price falls to \\$38.00, the put option will be in the money, and its intrinsic value will be $45.00 − $38.00 = $7.00 (p<sup>−<\/sup> = 7). Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0259.webp\" style=\"max-width:min(100%,175px)\" alt=\"0 −7 h = 50 −38 = −0.583\"><p>This calculation shows that the hedge ratio for the put option is approximately -0.58, which aligns with option B.<\/p><p><b>A is incorrect<\/b>. It suggests a hedge ratio of -0.54, which does not match the calculated value of -0.583. The discrepancy arises because the calculation of the hedge ratio must strictly follow the formula for determining the sensitivity of the put option&#x27;s price relative to changes in the underlying asset&#x27;s price. Any deviation from the correct values used in the formula, such as different assumptions about the option&#x27;s payoff under various scenarios, would lead to an incorrect hedge ratio. The precise calculation based on the given data points directly to -0.583, thus making option A incorrect.<\/p><p><b>C is incorrect<\/b>. It suggests a hedge ratio of -0.71, which significantly deviates from the calculated value of -0.583. This option might result from a misunderstanding of the put option&#x27;s behavior or incorrect application of the hedge ratio formula. The hedge ratio must reflect the proportionate change in the option&#x27;s price relative to the change in the stock price, and any miscalculation or misinterpretation of the values involved (such as the put option&#x27;s payoff in different scenarios or the potential future prices of the underlying asset) would result in an inaccurate hedge ratio. The correct application of the formula, as demonstrated, yields a hedge ratio of -0.583, confirming that option C is incorrect. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (I): Describe how a delta hedge is executed<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Hector Graves<\/summary><div class=\"vig-body\"><p>Hector Graves and Eva Patriquin provide professional training for financial advisors at Great Plains Investments, a US-based wealth management firm. Today, Graves and Patriquin are presenting a seminar on options as a low-cost vehicle for creating exposure to various asset classes compared to the capital requirements associated with directly investing in the underlying assets.<\/p><p>Graves opens the seminar by noting that options fall into contingent claims, adding &quot;Unlike forward commitments, contingent claims have a non-zero value at the initiation. Specifically, the long party to a call or put contract (the buyer) pays an upfront premium to the short party (the seller).&quot;<\/p><p>Graves then provides an example to illustrate the expectations approach for determining the price of a put option using the one-period binomial model. &quot;In this example, the underlying stock, ABC, does not pay a dividend and is currently trading at $43.00. In one year, ABC shares are expected to trade for either $50.00 or $38.00. Assuming that the relevant risk-free rate is 3.5%, what is the premium of a European-style put option on ABC stock with an exercise price of $45.00 that expires in one year, if we use the expectations approach?&quot;<\/p><p>Graves makes the following statement on the differences between the expectations approach and the no-arbitrage approach: “In the above example, the no-arbitrage approach would have yielded the same price for the put option on ABC stock. However, unlike the no-arbitrage approach, the expectations approach uses a subjective discount rate specific to an investor&#x27;s preferences.” Graves notesthat the no-arbitrage model relies on a key input known as the hedge ratio, which cannot have a positive value for put options.<\/p><p>After a break, Patriquin resumes the seminar by discussing interest rate options, noting that borrowers and lenders use these derivatives to manage their overall exposure to interest rates. Patriquin also notes that different interest rate options can be combined: &quot;For example, consider an investor who is simultaneously long an interest rate floor and short an interest rate cap - both with the same exercise rate of 5%.&quot;<\/p><p>Patriquin concludes the seminar by discussing the differences between European options, which can only be exercised at expiry, and American options, which may be exercised before expiry.<\/p><\/div><\/details><div class=\"qtext\"><p>The hedge ratio for the put option on ABC stock in Graves&#x27; example is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "Graves’ statement on the differences between the expectations approach and the no-arbitrage approach is most likely:", "opts": ["Correct.", "Incorrect because the expectations approach uses an objective discount rate.", "Incorrect because the no-arbitrage approach would have yielded a different price for the put option on ABC stock."], "ans": "B", "expl": "Graves' statement regarding the differences between the expectations approach and the no-arbitrage approach in option pricing is incorrect because he mischaracterizes the nature of the discount rate used in the expectations approach. Contrary to his claim, the expectations approach does not use a subjective discount rate tailored to an investor's preferences. Instead, it utilizes an objective measure, specifically the risk-free rate, to discount expected future payoffs of the option. The risk-free rate is universally accepted as objective because it is based on government securities that are considered free from default risk, and it does not vary between different investors' personal risk assessments or preferences. The key error in Graves' statement lies in his description of the discount rate used in the expectations approach. He incorrectly states that this approach uses a subjective discount rate, which would imply variability based on individual investor preferences. However, in practice, the expectations approach applies the risk-free rate to discount the expected payoffs of the option. This rate is objective and consistent across all calculations, providing a standardized measure for evaluating the present value of future cash flows in financial models. A is incorrect. While Graves correctly notes that both the expectations approach and the no-arbitrage approach might yield the same price for the put option under certain conditions, his overall statement is misleading due to the incorrect information about the discount rate used in the expectations approach. The statement that the expectations approach uses a subjective discount rate is fundamentally incorrect, as it actually employs the risk-free rate, which is not subject to individual investor preferences but is a universally accepted benchmark for discounting in financial models. C is incorrect. Graves' claim that the no-arbitrage approach would yield the same price as the expectations approach in the given example is plausible and not inherently incorrect. However, the option C's statement that the no-arbitrage approach would have yielded a different price is not supported by the information provided. The no-arbitrage approach, like the expectations approach, can indeed arrive at the same pricing under certain assumptions and inputs, such as the hedge ratio and the risk-free rate. Therefore, the statement in option C lacks a basis without additional context or evidence suggesting a discrepancy in pricing between the two approaches. ", "explhtml": "<p>Graves&#x27; statement regarding the differences between the expectations approach and the no-arbitrage approach in option pricing is incorrect because he mischaracterizes the nature of the discount rate used in the expectations approach. Contrary to his claim, the expectations approach does not use a subjective discount rate tailored to an investor&#x27;s preferences. Instead, it utilizes an objective measure, specifically the risk-free rate, to discount expected future payoffs of the option. The risk-free rate is universally accepted as objective because it is based on government securities that are considered free from default risk, and it does not vary between different investors&#x27; personal risk assessments or preferences.<\/p><p>The key error in Graves&#x27; statement lies in his description of the discount rate used in the expectations approach. He incorrectly states that this approach uses a subjective discount rate, which would imply variability based on individual investor preferences. However, in practice, the expectations approach applies the risk-free rate to discount the expected payoffs of the option. This rate is objective and consistent across all calculations, providing a standardized measure for evaluating the present value of future cash flows in financial models.<\/p><p><b>A is incorrect<\/b>. While Graves correctly notes that both the expectations approach and the no-arbitrage approach might yield the same price for the put option under certain conditions, his overall statement is misleading due to the incorrect information about the discount rate used in the expectations approach. The statement that the expectations approach uses a subjective discount rate is fundamentally incorrect, as it actually employs the risk-free rate, which is not subject to individual investor preferences but is a universally accepted benchmark for discounting in financial models.<\/p><p><b>C is incorrect<\/b>. Graves&#x27; claim that the no-arbitrage approach would yield the same price as the expectations approach in the given example is plausible and not inherently incorrect. However, the option C&#x27;s statement that the no-arbitrage approach would have yielded a different price is not supported by the information provided. The no-arbitrage approach, like the expectations approach, can indeed arrive at the same pricing under certain assumptions and inputs, such as the hedge ratio and the risk-free rate. Therefore, the statement in option C lacks a basis without additional context or evidence suggesting a discrepancy in pricing between the two approaches. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (c): Identify an arbitrage opportunity involving options and describe the related arbitrage<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Hector Graves<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Graves and Eva Patriquin provide professional training for financial advisors at Great Plains Investments, a US-based wealth management firm. Today, Graves and Patriquin are presenting a seminar on options as a low-cost vehicle for creating exposure to various asset classes compared to the capital requirements associated with directly investing in the underlying assets.<\/p><p>Graves opens the seminar by noting that options fall into contingent claims, adding &quot;Unlike forward commitments, contingent claims have a non-zero value at the initiation. Specifically, the long party to a call or put contract (the buyer) pays an upfront premium to the short party (the seller).&quot;<\/p><p>Graves then provides an example to illustrate the expectations approach for determining the price of a put option using the one-period binomial model. &quot;In this example, the underlying stock, ABC, does not pay a dividend and is currently trading at $43.00. In one year, ABC shares are expected to trade for either $50.00 or $38.00. Assuming that the relevant risk-free rate is 3.5%, what is the premium of a European-style put option on ABC stock with an exercise price of $45.00 that expires in one year, if we use the expectations approach?&quot;<\/p><p>Graves makes the following statement on the differences between the expectations approach and the no-arbitrage approach: “In the above example, the no-arbitrage approach would have yielded the same price for the put option on ABC stock. However, unlike the no-arbitrage approach, the expectations approach uses a subjective discount rate specific to an investor&#x27;s preferences.” Graves notesthat the no-arbitrage model relies on a key input known as the hedge ratio, which cannot have a positive value for put options.<\/p><p>After a break, Patriquin resumes the seminar by discussing interest rate options, noting that borrowers and lenders use these derivatives to manage their overall exposure to interest rates. Patriquin also notes that different interest rate options can be combined: &quot;For example, consider an investor who is simultaneously long an interest rate floor and short an interest rate cap - both with the same exercise rate of 5%.&quot;<\/p><p>Patriquin concludes the seminar by discussing the differences between European options, which can only be exercised at expiry, and American options, which may be exercised before expiry.<\/p><\/div><\/details><div class=\"qtext\"><p>Graves’ statement on the differences between the expectations approach and the no-arbitrage approach is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 55, "q": "In Graves' example, the risk-neutral probability that ABC shares trade for $38.00 in one year is closest to:", "opts": ["46%.", "50%.", "54%."], "ans": "A", "expl": "In the given example, the risk-neutral probability that ABC shares trade for $38.00 in one year is calculated using the one-period binomial model. This model is a fundamental tool in financial mathematics for pricing options, where the future price of the underlying asset can move up to a higher price (u) or down to a lower price (d) over one period. The formula to calculate the risk-neutral probability (π) of an upward movement is: Where: FV (1) is the future value of one unit of currency, adjusted for the risk-free rate, which in this case is 1.035 (1 + 3.5%). u is the up factor, calculated as S + where S0 is the current spot price ($43.00) and S + is the spot price if it increases ($50.00), resulting in u = 5403..0000 = 1.1628. d is the down factor, calculated as S − where S− is the spot price if it decreases ($38.00), resulting in d = 3483..0000= 0.8837. Plugging these values into the formula gives: This indicates a 54.21% probability of the stock price increasing to $50.00. Consequently, the probability of the stock price decreasing to $38.00 is 1 − 0.5421 = 0.4579 or 45.79%, which rounds to approximately 46%. B is incorrect. Option B suggests a 50% probability for the downward movement of the stock price, which does not align with the calculations derived from the binomial model. The risk-neutral probability calculation specifically accounts for the expected upward and downward movements based on the risk-free rate and the potential high and low future prices of the stock. The calculated probability of 45.79% (rounded to 46%) for a decrease in stock price is based on these specific inputs and the formula used, which does not yield a 50% probability. C is incorrect. Option C, which states a 54% probability for the downward movement, directly contradicts the calculated result of 45.79% for this outcome. This option appears to confuse the probability of an upward movement with that of a downward movement. The calculation clearly shows a higher probability for the stock price to increase to $50.00 (54.21%) and a lower probability (45.79%) for it to decrease to $38.00. Thus, stating a 54% probability for a decrease is incorrect and not supported by the binomial model calculations. ", "explhtml": "<p>In the given example, the risk-neutral probability that ABC shares trade for $38.00 in one year is calculated using the one-period binomial model. This model is a fundamental tool in financial mathematics for pricing options, where the future price of the underlying asset can move up to a higher price (u) or down to a lower price (d) over one period. The formula to calculate the risk-neutral probability (π) of an upward movement is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0260.webp\" style=\"max-width:min(100%,122px)\" alt=\"FV (1) −d π = u −d\"><p>Where:<\/p><p>FV (1) is the future value of one unit of currency, adjusted for the risk-free rate, which<\/p><p>in this case is 1.035 (1 + 3.5%).<\/p><p>u is the up factor, calculated as <sup>S<\/sup> <sup>+<\/sup> where S<sub>0<\/sub> is the current spot price ($43.00) and S <sup>+<\/sup><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0261.webp\" style=\"max-width:min(100%,707px)\" alt=\"S0\"><p>is the spot price if it increases ($50.00), resulting in u =<sup> 5<\/sup><sub>4<\/sub><sup>0<\/sup><sub>3<\/sub><sup>.<\/sup><sub>.<\/sub><sup>0<\/sup><sub>0<\/sub><sup>0<\/sup><sub>0<\/sub> = 1.1628.<\/p><p>d is the down factor, calculated as <sup>S<\/sup> <sup>−<\/sup> where S<sup>−<\/sup> is the spot price if it decreases<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0262.webp\" style=\"max-width:min(100%,718px)\" alt=\"S0\"><p>($38.00), resulting in d =<sup> 3<\/sup><sub>4<\/sub><sup>8<\/sup><sub>3<\/sub><sup>.<\/sup><sub>.<\/sub><sup>0<\/sup><sub>0<\/sub><sup>0<\/sup><sub>0<\/sub>= 0.8837.<\/p><p>Plugging these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0263.webp\" style=\"max-width:min(100%,225px)\" alt=\"1.035 −0.8837 π = 1.1628 −0.8837 = 0.5421\"><p>This indicates a 54.21% probability of the stock price increasing to $50.00. Consequently, the probability of the stock price decreasing to $38.00 is 1 − 0.5421 = 0.4579 or 45.79%, which rounds to approximately 46%.<\/p><p><b>B is incorrect<\/b>. Option B suggests a 50% probability for the downward movement of the stock price, which does not align with the calculations derived from the binomial model. The risk-neutral probability calculation specifically accounts for the expected upward and downward movements based on the risk-free rate and the potential high and low future prices of the stock. The calculated probability of 45.79% (rounded to 46%) for a decrease in stock price is based on these specific inputs and the formula used, which does not yield a 50% probability.<\/p><p><b>C is incorrect<\/b>. Option C, which states a 54% probability for the downward movement, directly contradicts the calculated result of 45.79% for this outcome. This option appears to confuse the probability of an upward movement with that of a downward movement. The calculation clearly shows a higher probability for the stock price to increase to $50.00 (54.21%) and a lower probability (45.79%) for it to decrease to $38.00. Thus, stating a 54% probability for a decrease is incorrect and not supported by the binomial model calculations. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (c): Identify an arbitrage opportunity involving options and describe the related arbitrage<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Hector Graves<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Graves and Eva Patriquin provide professional training for financial advisors at Great Plains Investments, a US-based wealth management firm. Today, Graves and Patriquin are presenting a seminar on options as a low-cost vehicle for creating exposure to various asset classes compared to the capital requirements associated with directly investing in the underlying assets.<\/p><p>Graves opens the seminar by noting that options fall into contingent claims, adding &quot;Unlike forward commitments, contingent claims have a non-zero value at the initiation. Specifically, the long party to a call or put contract (the buyer) pays an upfront premium to the short party (the seller).&quot;<\/p><p>Graves then provides an example to illustrate the expectations approach for determining the price of a put option using the one-period binomial model. &quot;In this example, the underlying stock, ABC, does not pay a dividend and is currently trading at $43.00. In one year, ABC shares are expected to trade for either $50.00 or $38.00. Assuming that the relevant risk-free rate is 3.5%, what is the premium of a European-style put option on ABC stock with an exercise price of $45.00 that expires in one year, if we use the expectations approach?&quot;<\/p><p>Graves makes the following statement on the differences between the expectations approach and the no-arbitrage approach: “In the above example, the no-arbitrage approach would have yielded the same price for the put option on ABC stock. However, unlike the no-arbitrage approach, the expectations approach uses a subjective discount rate specific to an investor&#x27;s preferences.” Graves notesthat the no-arbitrage model relies on a key input known as the hedge ratio, which cannot have a positive value for put options.<\/p><p>After a break, Patriquin resumes the seminar by discussing interest rate options, noting that borrowers and lenders use these derivatives to manage their overall exposure to interest rates. Patriquin also notes that different interest rate options can be combined: &quot;For example, consider an investor who is simultaneously long an interest rate floor and short an interest rate cap - both with the same exercise rate of 5%.&quot;<\/p><p>Patriquin concludes the seminar by discussing the differences between European options, which can only be exercised at expiry, and American options, which may be exercised before expiry.<\/p><\/div><\/details><div class=\"qtext\"><p>In Graves&#x27; example, the risk-neutral probability that ABC shares trade for $38.00 in one year is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 56, "q": "In Graves' example, the value of the put option on ABC stock closest to:", "opts": ["$3.10.", "$3.21.", "$3.67."], "ans": "A", "expl": "Using the expectations approach and a one-period binomial model, the value of a put option is calculated by discounting the expected payoff of the option at the risk-free rate. The formula for the expected payoff of a put option in a binomial model is given by: where: π is the risk-neutral probability of the stock price increasing, p+ is the payoff of the put if the stock price increases, p− is the payoff of the put if the stock price decreases, In this example, the stock price can either increase to \\$50.00 or decrease to \\$38.00, with a current price of \\$43.00. The exercise price of the put option is \\$45.00. The risk-free rate is given as 3.5%. Using these values, we calculate the up and down factors u and d as follows: The future value of one unit of currency considering the risk-free rate is: The risk-neutral probability π is calculated as: The payoff p+ is \\$0.00 because if the stock price increases to \\$50.00, the put option is out of the money and worthless. The payoff p− is \\$7.00 because if the stock price decreases to \\$38.00, the put option is in the money and its intrinsic value is the difference between the strike price (\\$45.00) and the lower stock price (\\$38.00). Substituting these values into the formula gives: B is incorrect. The calculation for option B likely involves a mistake in the computation of either the risk-neutral probabilities or the discounting process. A precise calculation using the correct parameters and formulas as outlined leads to a value of $3.10, not $3.21. It is essential to use accurate values and formulas to derive the correct option pricing in financial models. C is incorrect. The value of $3.67 for the put option could result from incorrect assumptions about the volatility of the underlying asset or errors in the calculation of the expected payoff. The binomial model provided, along with the correct inputs and calculations, clearly shows that the put option's value should be $3.10. Any deviation from this could be due to computational errors or misinterpretation of the model's parameters. ", "explhtml": "<p>Using the expectations approach and a one-period binomial model, the value of a put option is calculated by discounting the expected payoff of the option at the risk-free rate. The formula for the expected payoff of a put option in a binomial model is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0264.webp\" style=\"max-width:min(100%,163px)\" alt=\"πp+ + (1 −π)p− p = 1 + r\"><p>where:<\/p><p>π is the risk-neutral probability of the stock price increasing,<\/p><p>p<sup>+<\/sup> is the payoff of the put if the stock price increases,<\/p><p>p<sup>−<\/sup> is the payoff of the put if the stock price decreases,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0265.webp\" style=\"max-width:min(100%,210px)\" alt=\"r is the risk-free rate.\"><p>In this example, the stock price can either increase to \\$50.00 or decrease to \\$38.00, with a current price of \\$43.00. The exercise price of the put option is \\$45.00. The risk-free rate is given as 3.5%. Using these values, we calculate the up and down factors u and d as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0266.webp\" style=\"max-width:min(100%,16px)\" alt=\"+\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0267.webp\" style=\"max-width:min(100%,206px)\" alt=\"u = S + = 50.00 = 1.1628 S0 43.00 d = S − = 38.00 = 0.8837 S0 43.00\"><p>The future value of one unit of currency considering the risk-free rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0268.webp\" style=\"max-width:min(100%,210px)\" alt=\"FV (1) = 1 + 3.5% = 1.035\"><p>The risk-neutral probability π is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0269.webp\" style=\"max-width:min(100%,321px)\" alt=\"π = FV (1) −d = 1.035 −0.8837 = 0.5421 u −d 1.1628 −0.8837\"><p>The payoff p<sup>+<\/sup> is \\$0.00 because if the stock price increases to \\$50.00, the put option is out of the money and worthless. The payoff p<sup>−<\/sup> is \\$7.00 because if the stock price decreases to \\$38.00, the put option is in the money and its intrinsic value is the difference between the strike price (\\$45.00) and the lower stock price (\\$38.00).<\/p><p>Substituting these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0270.webp\" style=\"max-width:min(100%,259px)\" alt=\"p = 0.5421 × 0 + 0.4579 × 7 = 3.10 1.035\"><p><b>B is incorrect<\/b>. The calculation for option B likely involves a mistake in the computation of either the risk-neutral probabilities or the discounting process. A precise calculation using the correct parameters and formulas as outlined leads to a value of $3.10, not $3.21. It is essential to use accurate values and formulas to derive the correct option pricing in financial models.<\/p><p><b>C is incorrect<\/b>. The value of $3.67 for the put option could result from incorrect assumptions about the volatility of the underlying asset or errors in the calculation of the expected payoff. The binomial model provided, along with the correct inputs and calculations, clearly shows that the put option&#x27;s value should be $3.10. Any deviation from this could be due to computational errors or misinterpretation of the model&#x27;s parameters. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (c): Identify an arbitrage opportunity involving options and describe the related arbitrage<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Hector Graves<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hector Graves and Eva Patriquin provide professional training for financial advisors at Great Plains Investments, a US-based wealth management firm. Today, Graves and Patriquin are presenting a seminar on options as a low-cost vehicle for creating exposure to various asset classes compared to the capital requirements associated with directly investing in the underlying assets.<\/p><p>Graves opens the seminar by noting that options fall into contingent claims, adding &quot;Unlike forward commitments, contingent claims have a non-zero value at the initiation. Specifically, the long party to a call or put contract (the buyer) pays an upfront premium to the short party (the seller).&quot;<\/p><p>Graves then provides an example to illustrate the expectations approach for determining the price of a put option using the one-period binomial model. &quot;In this example, the underlying stock, ABC, does not pay a dividend and is currently trading at $43.00. In one year, ABC shares are expected to trade for either $50.00 or $38.00. Assuming that the relevant risk-free rate is 3.5%, what is the premium of a European-style put option on ABC stock with an exercise price of $45.00 that expires in one year, if we use the expectations approach?&quot;<\/p><p>Graves makes the following statement on the differences between the expectations approach and the no-arbitrage approach: “In the above example, the no-arbitrage approach would have yielded the same price for the put option on ABC stock. However, unlike the no-arbitrage approach, the expectations approach uses a subjective discount rate specific to an investor&#x27;s preferences.” Graves notesthat the no-arbitrage model relies on a key input known as the hedge ratio, which cannot have a positive value for put options.<\/p><p>After a break, Patriquin resumes the seminar by discussing interest rate options, noting that borrowers and lenders use these derivatives to manage their overall exposure to interest rates. Patriquin also notes that different interest rate options can be combined: &quot;For example, consider an investor who is simultaneously long an interest rate floor and short an interest rate cap - both with the same exercise rate of 5%.&quot;<\/p><p>Patriquin concludes the seminar by discussing the differences between European options, which can only be exercised at expiry, and American options, which may be exercised before expiry.<\/p><\/div><\/details><div class=\"qtext\"><p>In Graves&#x27; example, the value of the put option on ABC stock closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 57, "q": "For derivative instrument construction techniques discussed in the seminar, the speaker is accurate concerning:", "opts": ["Technique 1", "Technique 2", "Both Techniques 1 and 2"], "ans": "C", "expl": "Technique 1 is correct when properly interpreted. The original description was misleading. A \"pay-equity, receive-fixed\" swap requires you to make payments tied to equity performance and receive fixed payments. This is accurately replicated by purchasing a fixed-rate bond (which generates the fixed cash inflows) and shorting an equity portfolio (which creates the obligation to pay the equity return, fulfilling the \"pay-equity\" leg). The core principle of replicating the swap's cash flows is sound, making the technique itself accurate. Technique 2 is correct within the context of the seminar and Jill's subsequent analysis. While the candidate's original concern about American options having an early exercise premium is theoretically valid, the seminar's statement holds because Jill uses the technique with European options for her arbitrage analysis. The put-call parity relationship is exact for European options, allowing for the perfect replication of a synthetic long bond by buying a put, shorting a call, and buying the underlying stock. Therefore, for the purpose of the seminar and the case at hand, the technique is accurately presented as effective. A and B are incorrect. This disregards the validity of Technique 2, which is equally correct. The construction of a synthetic long bond using put-call parity is a widely accepted method in derivative markets.", "explhtml": "<p>Technique 1 is correct when properly interpreted. The original description was misleading. A &quot;pay-equity, receive-fixed&quot; swap requires you to make payments tied to equity performance and receive fixed payments. This is accurately replicated by purchasing a fixed-rate bond (which generates the fixed cash inflows) and shorting an equity portfolio (which creates the obligation to pay the equity return, fulfilling the &quot;pay-equity&quot; leg). The core principle of replicating the swap&#x27;s cash flows is sound, making the technique itself accurate.<\/p><p>Technique 2 is correct within the context of the seminar and Jill&#x27;s subsequent analysis. While the candidate&#x27;s original concern about American options having an early exercise premium is theoretically valid, the seminar&#x27;s statement holds because Jill uses the technique with European options for her arbitrage analysis. The put-call parity relationship is exact for European options, allowing for the perfect replication of a synthetic long bond by buying a put, shorting a call, and buying the underlying stock. Therefore, for the purpose of the seminar and the case at hand, the technique is accurately presented as effective.<\/p><p><b>A and B are incorrect.<\/b> This disregards the validity of Technique 2, which is equally correct. The construction of a synthetic long bond using put-call parity is a widely accepted method in derivative markets.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1(g): Describe how equity swaps are priced, and calculate and interpret their no- arbitrage value.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jane Jill<\/summary><div class=\"vig-body\"><p>Jane Jill, CFA, is a fund manager at Greene &amp; Gamble (GG). GG is a US-based Hedge Fund. Jill<\/p><p>recently attended a derivatives seminar where they discussed how different positions can be<\/p><p>replicated. Two techniques stood out for Jill:<\/p><p>Technique 1: A pay-equity, receive-fixed swap position can be replicated by purchasing a fixed-<\/p><p>rate bond and shorting an equity index portfolio.<\/p><p>Technique 2: By leveraging put-call parity, a synthetic long bond position can be created through<\/p><p>the purchase of a put option, the short sale of a call option, and the acquisition of the underlying<\/p><p>stock. This approach is equally effective European options.<\/p><p>The next week after the seminar, Jill decides to evaluate arbitrage opportunities using the put-<\/p><p>call parity. Using European put and call options, Jill analyzes the options with an es the options<\/p><p>with an exercise price of $ 82.50. The options expire in 180 days. The underlying stock is<\/p><p>currently sold at $ 89.90, and no cash payments will be over the life of the options. The current<\/p><p>price of the put and call options are $ 7.67 and $ 10.51. The risk-free rate is 3.5%.<\/p><p>Jill proceeds to analyze the stock of Lux Corporation (LC), a company specializing in high-tech<\/p><p>agricultural equipment. Her clients collectively own one million LC shares. Lux Corporation has<\/p><p>announced plans to introduce a new piece of equipment, Lux 3. Following standard industry<\/p><p>practice, newly launched farm equipment undergoes a testing phase with users. The commercial<\/p><p>production of Lux 3 will begin only if it receives user approval.<\/p><p>Martin Gavy, a junior analyst at GG, anticipates that LUX 3 will not proceed to commercial<\/p><p>production. He believes the product will be rejected by equipment users eight months after it is<\/p><p>launched for testing. Greene has gathered both current and projected data on LC (see Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0271.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit 1: LC Selected Financial Data Current Share Price $65.72 Projected Share Price in nine months $54.00 Expected Annual Volatility of Returns 21% Current Annual Risk-Free Rate 3.5%\"><p>Gavy predicts that LC&#x27;s share price will drop following the anticipated rejection. Based on this forecast, he advises Jill as follows:<\/p><p>&quot;To shield your clients from potential losses due to the expected decline in LC&#x27;s share price, I<\/p><p>strongly recommend purchasing nine-month European put options right away.&quot;<\/p><p>He has compiled a summary of prices and additional relevant information regarding four<\/p><p>alternative nine-month European puts and calls currently available for LC shares (see Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0272.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 2: Market Data for Nine-month European Options on LC Shares Option 1 2 3 4 Option type Put Call Put Call N(d1) 0.6484 0.5930 0.5930 0.4556 N(d2) 0.5790 0.5213 0.5213 0.3846 Exercise price $64.0 $65.72 $65.72 $70.00\"><p>After reviewing Gavy&#x27;s recommendation, Jill engages in a discussion with her fellow manager.<\/p><p>She inquires about the potential effects of changes in his input estimates on call and put option<\/p><p>prices. Gavy shares his perspective:<\/p><p><b>Implication 1:<\/b> “If I extend the expiration dates from eight to ten months, option 2 should<\/p><p>decrease in value, but option 4 should increase”<\/p><p><b>Implication 2:<\/b> “Since corporate shares are the underlying asset, I wouldn&#x27;t be overly concerned<\/p><p>or excited about the effect of a change in the risk-free rate on call or put option prices.”<\/p><p>Gavy further explains to Jill how he determined LC&#x27;s expected annual volatility of 21%:<\/p><p>“I calculated the 21% volatility using LC’s monthly stock price data from the past decade. This<\/p><p>data served as the foundation for estimating the variance of continuously compounded LC<\/p><p>monthly stock returns, which was then converted to an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>For derivative instrument construction techniques discussed in the seminar, the speaker is accurate concerning:<\/p><\/div>", "subj": "derivatives"}, {"n": 58, "q": "Based on Exhibits 1 and 2 along with the Black-Scholes-Merton model, the call option with the lowest price is:", "opts": ["Option 2", "Option 4", "Option 1"], "ans": "B", "expl": "For call options, a higher exercise price typically leads to a lower call option price, as the likelihood of the option finishing in-the-money decreases. Given the provided data in Exhibit 2, we calculate the call option as follows: Where: S = Current Stock Price N (d1) and N(d2)= Values from the cumulative normal distribution function X= Exercise price e−rT = Represents the discount factor with r being the continuously compounded risk-free rate and T the time to expiration. The higher exercise price and lower probability values imply Option 4 has the lowest price among the calls. A is incorrect. This option has a lower exercise price than Option 4, making it more likely to finish in-the-money. Consequently, its price will be higher. C is incorrect. This is not a call option—it’s a put option. The question specifically asks about call options, so this answer is irrelevant.", "explhtml": "<p>For call options, a higher exercise price typically leads to a lower call option price, as the likelihood of the option finishing in-the-money decreases. Given the provided data in <b>Exhibit 2<\/b>, we calculate the call option as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0273.webp\" style=\"max-width:min(100%,205px)\" alt=\"C = SN(d1) −e−rTXN(d2)\"><p>Where:<\/p><p>S = Current Stock Price<\/p><p>N (d<sub>1<\/sub>) and N(d<sub>2<\/sub>)= Values from the cumulative normal distribution function<\/p><p>X= Exercise price<\/p><p>e<sup>−rT<\/sup> = Represents the discount factor with r being the continuously compounded risk-free rate and T the time to expiration.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0274.webp\" style=\"max-width:min(100%,427px)\" alt=\"9 C = (65.72 × 0.4556) − e−0.035×12(70 × 0.3846) = $3.72\"><p>The higher exercise price and lower probability values imply Option 4 has the lowest price among the calls.<\/p><p><b>A is incorrect.<\/b> This option has a lower exercise price than Option 4, making it more likely to finish in-the-money. Consequently, its price will be higher.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0275.webp\" style=\"max-width:min(100%,451px)\" alt=\"9 C = (65.72 × 0.5930) − e−0.035×12 (65.72 × 0.5213) = $5.60\"><p><b>C is incorrect.<\/b> This is not a call option—it’s a put option. The question specifically asks about call options, so this answer is irrelevant.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(g): Interpret the components of the Black–Scholes–Merton model as applied to call options in terms of a leveraged position in the underlying.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jane Jill<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Jill, CFA, is a fund manager at Greene &amp; Gamble (GG). GG is a US-based Hedge Fund. Jill<\/p><p>recently attended a derivatives seminar where they discussed how different positions can be<\/p><p>replicated. Two techniques stood out for Jill:<\/p><p>Technique 1: A pay-equity, receive-fixed swap position can be replicated by purchasing a fixed-<\/p><p>rate bond and shorting an equity index portfolio.<\/p><p>Technique 2: By leveraging put-call parity, a synthetic long bond position can be created through<\/p><p>the purchase of a put option, the short sale of a call option, and the acquisition of the underlying<\/p><p>stock. This approach is equally effective European options.<\/p><p>The next week after the seminar, Jill decides to evaluate arbitrage opportunities using the put-<\/p><p>call parity. Using European put and call options, Jill analyzes the options with an es the options<\/p><p>with an exercise price of $ 82.50. The options expire in 180 days. The underlying stock is<\/p><p>currently sold at $ 89.90, and no cash payments will be over the life of the options. The current<\/p><p>price of the put and call options are $ 7.67 and $ 10.51. The risk-free rate is 3.5%.<\/p><p>Jill proceeds to analyze the stock of Lux Corporation (LC), a company specializing in high-tech<\/p><p>agricultural equipment. Her clients collectively own one million LC shares. Lux Corporation has<\/p><p>announced plans to introduce a new piece of equipment, Lux 3. Following standard industry<\/p><p>practice, newly launched farm equipment undergoes a testing phase with users. The commercial<\/p><p>production of Lux 3 will begin only if it receives user approval.<\/p><p>Martin Gavy, a junior analyst at GG, anticipates that LUX 3 will not proceed to commercial<\/p><p>production. He believes the product will be rejected by equipment users eight months after it is<\/p><p>launched for testing. Greene has gathered both current and projected data on LC (see Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0271.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit 1: LC Selected Financial Data Current Share Price $65.72 Projected Share Price in nine months $54.00 Expected Annual Volatility of Returns 21% Current Annual Risk-Free Rate 3.5%\"><p>Gavy predicts that LC&#x27;s share price will drop following the anticipated rejection. Based on this forecast, he advises Jill as follows:<\/p><p>&quot;To shield your clients from potential losses due to the expected decline in LC&#x27;s share price, I<\/p><p>strongly recommend purchasing nine-month European put options right away.&quot;<\/p><p>He has compiled a summary of prices and additional relevant information regarding four<\/p><p>alternative nine-month European puts and calls currently available for LC shares (see Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0272.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 2: Market Data for Nine-month European Options on LC Shares Option 1 2 3 4 Option type Put Call Put Call N(d1) 0.6484 0.5930 0.5930 0.4556 N(d2) 0.5790 0.5213 0.5213 0.3846 Exercise price $64.0 $65.72 $65.72 $70.00\"><p>After reviewing Gavy&#x27;s recommendation, Jill engages in a discussion with her fellow manager.<\/p><p>She inquires about the potential effects of changes in his input estimates on call and put option<\/p><p>prices. Gavy shares his perspective:<\/p><p><b>Implication 1:<\/b> “If I extend the expiration dates from eight to ten months, option 2 should<\/p><p>decrease in value, but option 4 should increase”<\/p><p><b>Implication 2:<\/b> “Since corporate shares are the underlying asset, I wouldn&#x27;t be overly concerned<\/p><p>or excited about the effect of a change in the risk-free rate on call or put option prices.”<\/p><p>Gavy further explains to Jill how he determined LC&#x27;s expected annual volatility of 21%:<\/p><p>“I calculated the 21% volatility using LC’s monthly stock price data from the past decade. This<\/p><p>data served as the foundation for estimating the variance of continuously compounded LC<\/p><p>monthly stock returns, which was then converted to an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2 along with the Black-Scholes-Merton model, the call option with the lowest price is:<\/p><\/div>", "subj": "derivatives"}, {"n": 59, "q": "Did Gavy accurately determine the effects of changes in input estimates on option prices?", "opts": ["Yes, regarding implication 1 only.", "Yes, regarding both implications.", "No."], "ans": "A", "expl": "Gavy correctly states that extending the expiration dates impacts option prices differently. According to the Black-Scholes-Merton model, longer expiration times (all else being equal) tend to increase option values because of higher time value. This applies to both call and put options. B and C are incorrect. Gavy's assertion about the risk-free rate's minimal impact contradicts the theoretical foundation of option pricing models and Gavy's explanation of implication 1 is valid.", "explhtml": "<p>Gavy correctly states that extending the expiration dates impacts option prices differently. According to the Black-Scholes-Merton model, longer expiration times (all else being equal) tend to increase option values because of higher time value. This applies to both call and put options.<\/p><p><b>B and C are incorrect.<\/b> Gavy&#x27;s assertion about the risk-free rate&#x27;s minimal impact contradicts the theoretical foundation of option pricing models and Gavy&#x27;s explanation of implication 1 is valid.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(g): Interpret the components of the Black–Scholes–Merton model as applied to call options in terms of a leveraged position in the underlying.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jane Jill<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Jill, CFA, is a fund manager at Greene &amp; Gamble (GG). GG is a US-based Hedge Fund. Jill<\/p><p>recently attended a derivatives seminar where they discussed how different positions can be<\/p><p>replicated. Two techniques stood out for Jill:<\/p><p>Technique 1: A pay-equity, receive-fixed swap position can be replicated by purchasing a fixed-<\/p><p>rate bond and shorting an equity index portfolio.<\/p><p>Technique 2: By leveraging put-call parity, a synthetic long bond position can be created through<\/p><p>the purchase of a put option, the short sale of a call option, and the acquisition of the underlying<\/p><p>stock. This approach is equally effective European options.<\/p><p>The next week after the seminar, Jill decides to evaluate arbitrage opportunities using the put-<\/p><p>call parity. Using European put and call options, Jill analyzes the options with an es the options<\/p><p>with an exercise price of $ 82.50. The options expire in 180 days. The underlying stock is<\/p><p>currently sold at $ 89.90, and no cash payments will be over the life of the options. The current<\/p><p>price of the put and call options are $ 7.67 and $ 10.51. The risk-free rate is 3.5%.<\/p><p>Jill proceeds to analyze the stock of Lux Corporation (LC), a company specializing in high-tech<\/p><p>agricultural equipment. Her clients collectively own one million LC shares. Lux Corporation has<\/p><p>announced plans to introduce a new piece of equipment, Lux 3. Following standard industry<\/p><p>practice, newly launched farm equipment undergoes a testing phase with users. The commercial<\/p><p>production of Lux 3 will begin only if it receives user approval.<\/p><p>Martin Gavy, a junior analyst at GG, anticipates that LUX 3 will not proceed to commercial<\/p><p>production. He believes the product will be rejected by equipment users eight months after it is<\/p><p>launched for testing. Greene has gathered both current and projected data on LC (see Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0271.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit 1: LC Selected Financial Data Current Share Price $65.72 Projected Share Price in nine months $54.00 Expected Annual Volatility of Returns 21% Current Annual Risk-Free Rate 3.5%\"><p>Gavy predicts that LC&#x27;s share price will drop following the anticipated rejection. Based on this forecast, he advises Jill as follows:<\/p><p>&quot;To shield your clients from potential losses due to the expected decline in LC&#x27;s share price, I<\/p><p>strongly recommend purchasing nine-month European put options right away.&quot;<\/p><p>He has compiled a summary of prices and additional relevant information regarding four<\/p><p>alternative nine-month European puts and calls currently available for LC shares (see Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0272.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 2: Market Data for Nine-month European Options on LC Shares Option 1 2 3 4 Option type Put Call Put Call N(d1) 0.6484 0.5930 0.5930 0.4556 N(d2) 0.5790 0.5213 0.5213 0.3846 Exercise price $64.0 $65.72 $65.72 $70.00\"><p>After reviewing Gavy&#x27;s recommendation, Jill engages in a discussion with her fellow manager.<\/p><p>She inquires about the potential effects of changes in his input estimates on call and put option<\/p><p>prices. Gavy shares his perspective:<\/p><p><b>Implication 1:<\/b> “If I extend the expiration dates from eight to ten months, option 2 should<\/p><p>decrease in value, but option 4 should increase”<\/p><p><b>Implication 2:<\/b> “Since corporate shares are the underlying asset, I wouldn&#x27;t be overly concerned<\/p><p>or excited about the effect of a change in the risk-free rate on call or put option prices.”<\/p><p>Gavy further explains to Jill how he determined LC&#x27;s expected annual volatility of 21%:<\/p><p>“I calculated the 21% volatility using LC’s monthly stock price data from the past decade. This<\/p><p>data served as the foundation for estimating the variance of continuously compounded LC<\/p><p>monthly stock returns, which was then converted to an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>Did Gavy accurately determine the effects of changes in input estimates on option prices?<\/p><\/div>", "subj": "derivatives"}, {"n": 60, "q": "The volatility estimation technique used by Gavy is most likely?", "opts": ["Estimates volatility as the standard deviation of a stock’s discrete annualized return over a recent historical period.", "Can be used to derive future volatility estimates.", "Is not a valid future volatility estimation technique."], "ans": "C", "expl": "Gavy’s method involves calculating the variance of continuously compounded monthly stock returns from the past decade and then converting that variance into an annual standard deviation (21%). This approach is based solely on historical data and assumes that past return behaviour will remain unchanged. In practice, this method does not reliably forecast future volatility because volatility is dynamic—it can change with market conditions and may not be constant over time. Therefore, using only historical data without adjustments or models that account for volatility shifts makes it an invalid technique for accurately estimating expected future volatility. A is incorrect. Describes a technique that calculates the standard deviation of a stock’s discrete annualized return. However, Gavy used continuously compounded returns rather than discrete returns. His method and the type of return calculated differ. B is incorrect. It suggests that the method “can be used to derive future volatility estimates.” While historical volatility estimates are often used as a rough indicator, Gavy’s approach—based solely on past data—cannot reliably predict future volatility. Financial markets are subject to changes and shocks that historical averages may not capture. Therefore, the method lacks the robustness needed for forecasting future volatility.", "explhtml": "<p>Gavy’s method involves calculating the variance of continuously compounded monthly stock returns from the past decade and then converting that variance into an annual standard deviation (21%). This approach is based solely on historical data and assumes that past return behaviour will remain unchanged. In practice, this method does not reliably forecast future volatility because volatility is dynamic—it can change with market conditions and may not be constant over time. Therefore, using only historical data without adjustments or models that account for volatility shifts makes it an invalid technique for accurately estimating expected future volatility.<\/p><p><b>A is incorrect.<\/b> Describes a technique that calculates the standard deviation of a stock’s discrete annualized return. However, Gavy used continuously compounded returns rather than discrete returns. His method and the type of return calculated differ.<\/p><p><b>B is incorrect.<\/b> It suggests that the method “can be used to derive future volatility estimates.” While historical volatility estimates are often used as a rough indicator, Gavy’s approach—based solely on past data—cannot reliably predict future volatility. Financial markets are subject to changes and shocks that historical averages may not capture. Therefore, the method lacks the robustness needed for forecasting future volatility.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(n): Define implied volatility and explain how it is used in options trading.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Jane Jill<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jane Jill, CFA, is a fund manager at Greene &amp; Gamble (GG). GG is a US-based Hedge Fund. Jill<\/p><p>recently attended a derivatives seminar where they discussed how different positions can be<\/p><p>replicated. Two techniques stood out for Jill:<\/p><p>Technique 1: A pay-equity, receive-fixed swap position can be replicated by purchasing a fixed-<\/p><p>rate bond and shorting an equity index portfolio.<\/p><p>Technique 2: By leveraging put-call parity, a synthetic long bond position can be created through<\/p><p>the purchase of a put option, the short sale of a call option, and the acquisition of the underlying<\/p><p>stock. This approach is equally effective European options.<\/p><p>The next week after the seminar, Jill decides to evaluate arbitrage opportunities using the put-<\/p><p>call parity. Using European put and call options, Jill analyzes the options with an es the options<\/p><p>with an exercise price of $ 82.50. The options expire in 180 days. The underlying stock is<\/p><p>currently sold at $ 89.90, and no cash payments will be over the life of the options. The current<\/p><p>price of the put and call options are $ 7.67 and $ 10.51. The risk-free rate is 3.5%.<\/p><p>Jill proceeds to analyze the stock of Lux Corporation (LC), a company specializing in high-tech<\/p><p>agricultural equipment. Her clients collectively own one million LC shares. Lux Corporation has<\/p><p>announced plans to introduce a new piece of equipment, Lux 3. Following standard industry<\/p><p>practice, newly launched farm equipment undergoes a testing phase with users. The commercial<\/p><p>production of Lux 3 will begin only if it receives user approval.<\/p><p>Martin Gavy, a junior analyst at GG, anticipates that LUX 3 will not proceed to commercial<\/p><p>production. He believes the product will be rejected by equipment users eight months after it is<\/p><p>launched for testing. Greene has gathered both current and projected data on LC (see Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0271.webp\" style=\"max-width:min(100%,379px)\" alt=\"Exhibit 1: LC Selected Financial Data Current Share Price $65.72 Projected Share Price in nine months $54.00 Expected Annual Volatility of Returns 21% Current Annual Risk-Free Rate 3.5%\"><p>Gavy predicts that LC&#x27;s share price will drop following the anticipated rejection. Based on this forecast, he advises Jill as follows:<\/p><p>&quot;To shield your clients from potential losses due to the expected decline in LC&#x27;s share price, I<\/p><p>strongly recommend purchasing nine-month European put options right away.&quot;<\/p><p>He has compiled a summary of prices and additional relevant information regarding four<\/p><p>alternative nine-month European puts and calls currently available for LC shares (see Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0272.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit 2: Market Data for Nine-month European Options on LC Shares Option 1 2 3 4 Option type Put Call Put Call N(d1) 0.6484 0.5930 0.5930 0.4556 N(d2) 0.5790 0.5213 0.5213 0.3846 Exercise price $64.0 $65.72 $65.72 $70.00\"><p>After reviewing Gavy&#x27;s recommendation, Jill engages in a discussion with her fellow manager.<\/p><p>She inquires about the potential effects of changes in his input estimates on call and put option<\/p><p>prices. Gavy shares his perspective:<\/p><p><b>Implication 1:<\/b> “If I extend the expiration dates from eight to ten months, option 2 should<\/p><p>decrease in value, but option 4 should increase”<\/p><p><b>Implication 2:<\/b> “Since corporate shares are the underlying asset, I wouldn&#x27;t be overly concerned<\/p><p>or excited about the effect of a change in the risk-free rate on call or put option prices.”<\/p><p>Gavy further explains to Jill how he determined LC&#x27;s expected annual volatility of 21%:<\/p><p>“I calculated the 21% volatility using LC’s monthly stock price data from the past decade. This<\/p><p>data served as the foundation for estimating the variance of continuously compounded LC<\/p><p>monthly stock returns, which was then converted to an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>The volatility estimation technique used by Gavy is most likely?<\/p><\/div>", "subj": "derivatives"}, {"n": 61, "q": "If Gamble’s expectations are assumed to be accurate, and stock prices are expected to increase, what will be the general impact on call and put option values?", "opts": ["Price of put option: increases; Price of call options: decreases.", "Price of put option: decreases; Price of call options: increases.", "Price of put option: increases; Price of call options: increases."], "ans": "C", "expl": "When considering the impact of Gamble's expectations on the values of call-and-put options, it is essential to understand the relationship between stock price movements and option pricing. If the stock prices are expected to increase, as Saranne predicts due to the launch of an efficient solar panel by McGrath Ltd., the value of call options would generally increase. This is because call options give the holder the right to buy the stock at a predetermined price. If the actual stock price exceeds this predetermined price (strike price), the call options become more valuable. Additionally, the expected increase in volatility, as indicated by Gamble, further enhances the value of call options. Volatility is a critical factor in option pricing as it measures the uncertainty or risk about the size of changes in the stock's value. Higher volatility increases the potential for the stock price to swing above the strike price, thereby increasing the potential payoff of a call option. A is incorrect. When stock prices are expected to rise, put options generally decrease in value. A put option gives the holder the right to sell the stock at a predetermined price. If the stock price increases, the likelihood of the stock being sold at a lower strike price diminishes, reducing the value of the put option. Furthermore, the value of call options would increase, not decrease, as the potential for the stock price to exceed the strike price grows. B is incorrect. While this option correctly states that the price of put options decreases and the price of call options increases due to rising stock prices, it fails to account for the expected increase in volatility. Higher volatility typically raises the value of both call and put options because it increases the uncertainty and potential range of stock price movements, which enhances the overall potential payoff for both types of options.", "explhtml": "<p>When considering the impact of Gamble&#x27;s expectations on the values of call-and-put options, it is essential to understand the relationship between stock price movements and option pricing. If the stock prices are expected to increase, as Saranne predicts due to the launch of an efficient solar panel by McGrath Ltd., the value of call options would generally increase. This is because call options give the holder the right to buy the stock at a predetermined price. If the actual stock price exceeds this predetermined price (strike price), the call options become more valuable. Additionally, the expected increase in volatility, as indicated by Gamble, further enhances the value of call options. Volatility is a critical factor in option pricing as it measures the uncertainty or risk about the size of changes in the stock&#x27;s value. Higher volatility increases the potential for the stock price to swing above the strike price, thereby increasing the potential payoff of a call option.<\/p><p><b>A is incorrect.<\/b> When stock prices are expected to rise, put options generally decrease in value. A put option gives the holder the right to sell the stock at a predetermined price. If the stock price increases, the likelihood of the stock being sold at a lower strike price diminishes, reducing the value of the put option. Furthermore, the value of call options would increase, not decrease, as the potential for the stock price to exceed the strike price grows.<\/p><p><b>B is incorrect.<\/b> While this option correctly states that the price of put options decreases and the price of call options increases due to rising stock prices, it fails to account for the expected increase in volatility. Higher volatility typically raises the value of both call and put options because it increases the uncertainty and potential range of stock price movements, which enhances the overall potential payoff for both types of options.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(n): Define implied volatility and explain how it is used in options trading.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Anthony Gamble<\/summary><div class=\"vig-body\"><p>Anthony Gamble, CFA, is a Financial Analyst working for a UK-based fund manager Yorkshire<\/p><p>Asset Managers. Gamble has been forecasting short-term stock price movements of McGrath<\/p><p>Ltd. The current share price of Mc Grath Ltd is £ 330. The current economic outlook has been<\/p><p>turbulent, and Gamble believes this volatility will likely increase in the future. However, his<\/p><p>immediate supervisor, Amber Greene, considers McGrath stock a blue-chip investment with fairly<\/p><p>stable historical stock prices. She expects the stock value to remain nearly constant in the<\/p><p>future.<\/p><p>McGrath Ltd is a leading real estate brokerage firm, and Gamble expects them to acquire<\/p><p>another real estate firm within a year, increasing the value of the company’s stock. As this news<\/p><p>trickles through the market, there has been a spike in premiums for call options. The details of<\/p><p>the options are summarized in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0276.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit 1: Summary of the one-year European options  Option 1 Option 2 Option 3 Strike Price (£) 330 300 350 Option Type Put Put Call\"><p>Gamble’s clients have purchased one-year call options on McGrath stocks. Expected dividends<\/p><p>within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0277.webp\" style=\"max-width:min(100%,339px)\" alt=\"Exhibit 2: McGrath’s Dividend Information 6 Month 12 Month Dividend (£) 2.34 3.43\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Gamble made the following<\/p><p>statements about the model&#x27;s assumptions:<\/p><p>Statement 1: “If a short sale on the underlying asset results in immediate cash flows, the cash<\/p><p>flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is<\/p><p>important because the risk-free rate would fluctuate if we invested in an asset with cash flows<\/p><p>higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>If Gamble’s expectations are assumed to be accurate, and stock prices are expected to increase, what will be the general impact on call and put option values?<\/p><\/div>", "subj": "derivatives"}, {"n": 62, "q": "Assuming that two of Yorkshire Asset Managers’ major clients enter into a long position through purchasing Option 2, what will be the impact of the future dividends on the option value?", "opts": ["The option value will decrease.", "The option value will increase.", "There will be no impact on the option value, as the BSM model ignores cash flows generated through the underlying asset."], "ans": "B", "expl": "When clients take a long position by purchasing Option 2 (a put option with a strike price of £300), the future dividends expected from McGrath Ltd directly affect the underlying stock price. When dividends are paid, the stock price typically decreases by approximately the dividend amount. This anticipated drop in the stock price can make put options more valuable because the likelihood of the stock price falling below the strike price increases. Hence, the value of the put option increases. A is incorrect. It overlooks the impact of dividends on put options. As discussed, dividends generally decrease the stock price, which increases the intrinsic value of a put option. Therefore, it is unlikely for the option value to decrease when future dividends are considered. C is incorrect. While the Black-Scholes-Merton (BSM) model does not directly incorporate dividend payments, it can be adjusted to account for their impact. In practice, the expected cash flows from dividends are factored into the pricing of options, especially when the underlying stock’s dividends are significant. Ignoring these cash flows would lead to inaccurate valuation.", "explhtml": "<p>When clients take a long position by purchasing Option 2 (a put option with a strike price of £300), the future dividends expected from McGrath Ltd directly affect the underlying stock price. When dividends are paid, the stock price typically decreases by approximately the dividend amount. This anticipated drop in the stock price can make put options more valuable because the likelihood of the stock price falling below the strike price increases. Hence, the value of the put option increases.<\/p><p><b>A is incorrect.<\/b> It overlooks the impact of dividends on put options. As discussed, dividends generally decrease the stock price, which increases the intrinsic value of a put option. Therefore, it is unlikely for the option value to decrease when future dividends are considered.<\/p><p><b>C is incorrect.<\/b> While the Black-Scholes-Merton (BSM) model does not directly incorporate dividend payments, it can be adjusted to account for their impact. In practice, the expected cash flows from dividends are factored into the pricing of options, especially when the underlying stock’s dividends are significant. Ignoring these cash flows would lead to inaccurate valuation.<\/p><p class=\"los\">SDerivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (e): Describe how the value of a European option can be analyzed as the present value of the option’s expected payoff at expiration.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Anthony Gamble<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anthony Gamble, CFA, is a Financial Analyst working for a UK-based fund manager Yorkshire<\/p><p>Asset Managers. Gamble has been forecasting short-term stock price movements of McGrath<\/p><p>Ltd. The current share price of Mc Grath Ltd is £ 330. The current economic outlook has been<\/p><p>turbulent, and Gamble believes this volatility will likely increase in the future. However, his<\/p><p>immediate supervisor, Amber Greene, considers McGrath stock a blue-chip investment with fairly<\/p><p>stable historical stock prices. She expects the stock value to remain nearly constant in the<\/p><p>future.<\/p><p>McGrath Ltd is a leading real estate brokerage firm, and Gamble expects them to acquire<\/p><p>another real estate firm within a year, increasing the value of the company’s stock. As this news<\/p><p>trickles through the market, there has been a spike in premiums for call options. The details of<\/p><p>the options are summarized in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0276.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit 1: Summary of the one-year European options  Option 1 Option 2 Option 3 Strike Price (£) 330 300 350 Option Type Put Put Call\"><p>Gamble’s clients have purchased one-year call options on McGrath stocks. Expected dividends<\/p><p>within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0277.webp\" style=\"max-width:min(100%,339px)\" alt=\"Exhibit 2: McGrath’s Dividend Information 6 Month 12 Month Dividend (£) 2.34 3.43\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Gamble made the following<\/p><p>statements about the model&#x27;s assumptions:<\/p><p>Statement 1: “If a short sale on the underlying asset results in immediate cash flows, the cash<\/p><p>flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is<\/p><p>important because the risk-free rate would fluctuate if we invested in an asset with cash flows<\/p><p>higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that two of Yorkshire Asset Managers’ major clients enter into a long position through purchasing Option 2, what will be the impact of the future dividends on the option value?<\/p><\/div>", "subj": "derivatives"}, {"n": 63, "q": "Two American put options with the same exercise prices as Options 1 and 2 are being evaluated by Gamble. He deduces that similarly to European put options, their value will increase with greater time to expiration. This deduction is most likely:", "opts": ["Incorrect, the BSM model does not apply to American Options and therefore, their value will not increase about time to expiration.", "Correct.", "Incorrect, European Options do not necessarily increase with greater time to expiration."], "ans": "C", "expl": "It highlights the intricate relationship between European options and their time to expiration. Unlike American options, the value of European options does not always rise as the expiration period extends. This is because, while longer durations can elevate potential volatility, they also reduce the present value of the expected payoff at maturity. European options are valued based on the present value of their anticipated payoff, which is discounted back to the present using a risk-free rate. As the expiration period lengthens, the discount factor grows, which can diminish the present value of the payoff. This balance between heightened volatility and reduced present value results in a more complex and less predictable relationship between European options' values and their time to expiration. A is incorrect. The Black-Scholes-Merton (BSM) model can indeed be used to approximate the value of American options, though it requires certain adjustments. More importantly, American options differ from European options as they can be exercised at any time before expiration, making their behaviour concerning timeless straightforward. Gamble’s statement is not invalid because the BSM model is inapplicable, but rather because his reasoning conflates American and European
