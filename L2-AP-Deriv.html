option behaviors. B is incorrect. Gamble's deduction is not correct for European options. While it is true that the value of American options usually increases with time to expiration due to the flexibility of early exercise, this reasoning cannot be extended to European options. European options’ value depends on the balance between increased volatility (which raises value) and the reduced present value of the payoff due to discounting (which can lower value). As such, Gamble's statement is not universally true for European options.", "explhtml": "<p>It highlights the intricate relationship between European options and their time to expiration. Unlike American options, the value of European options does not always rise as the expiration period extends. This is because, while longer durations can elevate potential volatility, they also reduce the present value of the expected payoff at maturity. European options are valued based on the present value of their anticipated payoff, which is discounted back to the present using a risk-free rate. As the expiration period lengthens, the discount factor grows, which can diminish the present value of the payoff. This balance between heightened volatility and reduced present value results in a more complex and less predictable relationship between European options&#x27; values and their time to expiration.<\/p><p><b>A is incorrect.<\/b> The Black-Scholes-Merton (BSM) model can indeed be used to approximate the value of American options, though it requires certain adjustments. More importantly, American options differ from European options as they can be exercised at any time before expiration, making their behaviour concerning timeless straightforward. Gamble’s statement is not invalid because the BSM model is inapplicable, but rather because his reasoning conflates American and European option behaviors.<\/p><p><b>B is incorrect.<\/b> Gamble&#x27;s deduction is not correct for European options. While it is true that the value of American options usually increases with time to expiration due to the flexibility of early exercise, this reasoning cannot be extended to European options. European options’ value depends on the balance between increased volatility (which raises value) and the reduced present value of the payoff due to discounting (which can lower value). As such, Gamble&#x27;s statement is not universally true for European options.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (e): Describe how the value of a European option can be analyzed as the present value of the option’s expected payoff at expiration.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Anthony Gamble<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anthony Gamble, CFA, is a Financial Analyst working for a UK-based fund manager Yorkshire<\/p><p>Asset Managers. Gamble has been forecasting short-term stock price movements of McGrath<\/p><p>Ltd. The current share price of Mc Grath Ltd is £ 330. The current economic outlook has been<\/p><p>turbulent, and Gamble believes this volatility will likely increase in the future. However, his<\/p><p>immediate supervisor, Amber Greene, considers McGrath stock a blue-chip investment with fairly<\/p><p>stable historical stock prices. She expects the stock value to remain nearly constant in the<\/p><p>future.<\/p><p>McGrath Ltd is a leading real estate brokerage firm, and Gamble expects them to acquire<\/p><p>another real estate firm within a year, increasing the value of the company’s stock. As this news<\/p><p>trickles through the market, there has been a spike in premiums for call options. The details of<\/p><p>the options are summarized in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0276.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit 1: Summary of the one-year European options  Option 1 Option 2 Option 3 Strike Price (£) 330 300 350 Option Type Put Put Call\"><p>Gamble’s clients have purchased one-year call options on McGrath stocks. Expected dividends<\/p><p>within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0277.webp\" style=\"max-width:min(100%,339px)\" alt=\"Exhibit 2: McGrath’s Dividend Information 6 Month 12 Month Dividend (£) 2.34 3.43\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Gamble made the following<\/p><p>statements about the model&#x27;s assumptions:<\/p><p>Statement 1: “If a short sale on the underlying asset results in immediate cash flows, the cash<\/p><p>flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is<\/p><p>important because the risk-free rate would fluctuate if we invested in an asset with cash flows<\/p><p>higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>Two American put options with the same exercise prices as Options 1 and 2 are being evaluated by Gamble. He deduces that similarly to European put options, their value will increase with greater time to expiration. This deduction is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 64, "q": "The statement made by Gamble is most likely:", "opts": ["Correct.", "Incorrect, short sale proceeds need not be invested at the risk-free rate.", "Incorrect, the underlying asset cannot be sold short while a derivative is based on it."], "ans": "B", "expl": "The Black-Scholes-Merton (BSM) model, a cornerstone of financial derivatives valuation, relies on specific assumptions about market behaviour and cash flow management in trading. One key assumption is the unrestricted ability to short-sell the underlying asset and use the proceeds as the investor chooses. This flexibility is essential because it allows traders to replicate an option's payoff, enabling accurate pricing within the model. The proceeds from short sales are not required to be reinvested at the risk-free rate; instead, they can be utilized in ways that align with the investor’s strategies and risk management needs. Such flexibility supports the no-arbitrage principle, which is a fundamental aspect of the BSM model’s framework. A is incorrect. Gamble's statement does not align with the assumptions of the BSM model. The model allows for the unrestricted use of short sale proceeds, meaning they do not have to be invested at a risk-free rate. Claiming Gamble’s statement is correct ignores this critical aspect of the BSM framework. C is incorrect. The BSM model explicitly allows short selling of the underlying asset. The ability to short-sell is one of its foundational assumptions and is necessary for replicating option payoffs and ensuring accurate pricing. Therefore, it is not true that the underlying asset cannot be sold short while a derivative is based on it.", "explhtml": "<p>The Black-Scholes-Merton (BSM) model, a cornerstone of financial derivatives valuation, relies on specific assumptions about market behaviour and cash flow management in trading. One key assumption is the unrestricted ability to short-sell the underlying asset and use the proceeds as the investor chooses. This flexibility is essential because it allows traders to replicate an option&#x27;s payoff, enabling accurate pricing within the model. The proceeds from short sales are not required to be reinvested at the risk-free rate; instead, they can be utilized in ways that align with the investor’s strategies and risk management needs. Such flexibility supports the no-arbitrage principle, which is a fundamental aspect of the BSM model’s framework.<\/p><p><b>A is incorrect.<\/b> Gamble&#x27;s statement does not align with the assumptions of the BSM model. The model allows for the unrestricted use of short sale proceeds, meaning they do not have to be invested at a risk-free rate. Claiming Gamble’s statement is correct ignores this critical aspect of the BSM framework.<\/p><p><b>C is incorrect.<\/b> The BSM model explicitly allows short selling of the underlying asset. The ability to short-sell is one of its foundational assumptions and is necessary for replicating option payoffs and ensuring accurate pricing. Therefore, it is not true that the underlying asset cannot be sold short while a derivative is based on it.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(f): Identify assumptions of the Black–Scholes–Merton option valuation model.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Anthony Gamble<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Anthony Gamble, CFA, is a Financial Analyst working for a UK-based fund manager Yorkshire<\/p><p>Asset Managers. Gamble has been forecasting short-term stock price movements of McGrath<\/p><p>Ltd. The current share price of Mc Grath Ltd is £ 330. The current economic outlook has been<\/p><p>turbulent, and Gamble believes this volatility will likely increase in the future. However, his<\/p><p>immediate supervisor, Amber Greene, considers McGrath stock a blue-chip investment with fairly<\/p><p>stable historical stock prices. She expects the stock value to remain nearly constant in the<\/p><p>future.<\/p><p>McGrath Ltd is a leading real estate brokerage firm, and Gamble expects them to acquire<\/p><p>another real estate firm within a year, increasing the value of the company’s stock. As this news<\/p><p>trickles through the market, there has been a spike in premiums for call options. The details of<\/p><p>the options are summarized in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0276.webp\" style=\"max-width:min(100%,423px)\" alt=\"Exhibit 1: Summary of the one-year European options  Option 1 Option 2 Option 3 Strike Price (£) 330 300 350 Option Type Put Put Call\"><p>Gamble’s clients have purchased one-year call options on McGrath stocks. Expected dividends<\/p><p>within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0277.webp\" style=\"max-width:min(100%,339px)\" alt=\"Exhibit 2: McGrath’s Dividend Information 6 Month 12 Month Dividend (£) 2.34 3.43\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Gamble made the following<\/p><p>statements about the model&#x27;s assumptions:<\/p><p>Statement 1: “If a short sale on the underlying asset results in immediate cash flows, the cash<\/p><p>flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is<\/p><p>important because the risk-free rate would fluctuate if we invested in an asset with cash flows<\/p><p>higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>The statement made by Gamble is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 65, "q": "Based on Exhibit 1, the no-arbitrage forward price is closest to:", "opts": ["$ 3,760.00", "$ 3,956.45", "$ 3,962.66"], "ans": "B", "expl": "The no-arbitrage forward price of an equity forward contract can be calculated using the formula: Where; S0= The current spot price of the index r= The continuously compounded risk-free rate δ = The continuously compounded dividend yield T = The time to maturity of the contract in years A is incorrect. This is the current forward price. C is incorrect. It uses the current forward price instead of the current spot price of the index, $ 3,689.", "explhtml": "<p>The no-arbitrage forward price of an equity forward contract can be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0280.webp\" style=\"max-width:min(100%,168px)\" alt=\"F(0, T) = S0 × e(r−δ)T\"><p>Where;<\/p><p>S<sub>0<\/sub>= The current spot price of the index<\/p><p>r= The continuously compounded risk-free rate<\/p><p>δ = The continuously compounded dividend yield<\/p><p>T = The time to maturity of the contract in years<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0281.webp\" style=\"max-width:min(100%,302px)\" alt=\"F(0, T) = 3, 689 × e(0.05−0.015)×2 F(0, T) = 3, 689 × e0.0350 F(0, T) = 3, 689 × 1.0725 = $3,956.45\"><p><b>A is incorrect.<\/b> This is the current forward price.<\/p><p><b>C is incorrect.<\/b> It uses the current forward price instead of the current spot price of the index, $ 3,689.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0282.webp\" style=\"max-width:min(100%,304px)\" alt=\"F(0,T) = 3, 760 × 1.0539 = $3, 962.66\"><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Billy Beck<\/summary><div class=\"vig-body\"><p>Billy Beck, CFA, is a derivatives analyst at Dutton Wealth Managers Ltd. Beck is analyzing a<\/p><p>forward position the fund has taken to hedge a $ 120 million exposure to the global MSCI. The<\/p><p>details of the forward contract are presented in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0278.webp\" style=\"max-width:min(100%,409px)\" alt=\"Exhibit 1: Equity Forward Contract The current value of the index 3, 689 The current forward price 3, 760 Maturity 2 years Continuously compounded risk-free rate 5% Continuously compounded dividend yield 1.5%\"><p>From his observations, it is clear that the equity forward contract is underpriced, which presents<\/p><p>an arbitrage opportunity. Beck attempts to determine the most profitable strategy for investors<\/p><p>without an index stock. Three months after initiation, Beck noticed that the value of the index<\/p><p>increased to 3,830. He attempts to find out how the change affects the value of the equity<\/p><p>forward.<\/p><p>Next, Beck evaluates a long forward position undertaken by the fund on shares of Zane Ltd. The<\/p><p>forward’s valuation is + $220 at inception. Beck wants to find out how the forward price of the<\/p><p>contract has been derived. In addition to domestic equities, the index fund includes an allocation<\/p><p>to international equities, such as Australian and UK stocks. The fund’s currency allocation<\/p><p>manager states that a need to hedge exposure to an anticipated decline of the Australian dollar<\/p><p>(AUD).<\/p><p>She proposes a 6-month currency forward. The exhibit below summarizes key information<\/p><p>concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0279.webp\" style=\"max-width:min(100%,430px)\" alt=\"Exhibit 2: Currency Forward Contract Position Contract Value AUD 32 million Contract Maturity 6 months Australian interest rate 2.14% U.S interest rate 1.89% Current Spot rate (AUD per 1 USD) 1.58 Expected spot rate (in 6 months) 1.44\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the no-arbitrage forward price is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 66, "q": "Which set of transactions executed today would enable the investor to achieve arbitrage profits on the equity index fund?", "opts": ["Take out a loan to purchase the equity index stocks and simultaneously enter into a forward contract to sell the index.", "Purchase equity index stocks and simultaneously enter into a forward contract to sell the index.", "Sell the equity index stocks short, reinvest the proceeds, and enter into a forward contract to purchase the index."], "ans": "C", "expl": "The investor shorts the equity index stocks, reinvests the proceeds, and buys a forward contract on the index. The equity forward is underpriced (actual forward price = 3,760 vs. fair value = 3,957). This creates an arbitrage opportunity for investors without existing index exposure. A is incorrect.By taking out a loan to purchase the equity index stocks and simultaneously entering into a forward contract to sell the index, the investor effectively locks in a risk-free profit based on the difference between the forward price and the cost of carrying the index (i.e., the interest on the borrowed funds minus the dividend yield of the index). This strategy assumes the forward is overpriced (fair value < actual forward price). Here, the forward is underpriced (3,760 < 3,957). Executing this would lock in a loss. B is incorrect. The investor purchases the equity index stocks and enters into a forward contract to sell the index. However, without borrowing funds, the investor cannot take advantage of the cost-of-carry relationship (i.e., the difference between the interest rate and dividend yield) to create arbitrage profits. This approach does not fully exploit the arbitrage opportunity and, as such, does not guarantee risk-free profits.", "explhtml": "<p>The investor shorts the equity index stocks, reinvests the proceeds, and buys a forward contract on the index. The equity forward is underpriced (actual forward price = 3,760 vs. fair value = 3,957). This creates an arbitrage opportunity for investors without existing index exposure.<\/p><p><b>A is incorrect.<\/b>By taking out a loan to purchase the equity index stocks and simultaneously entering into a forward contract to sell the index, the investor effectively locks in a risk-free profit based on the difference between the forward price and the cost of carrying the index (i.e., the interest on the borrowed funds minus the dividend yield of the index). This strategy assumes the forward is overpriced (fair value &lt; actual forward price). Here, the forward is underpriced (3,760 &lt; 3,957). Executing this would lock in a loss.<\/p><p><b>B is incorrect.<\/b> The investor purchases the equity index stocks and enters into a forward contract to sell the index. However, without borrowing funds, the investor cannot take advantage of the cost-of-carry relationship (i.e., the difference between the interest rate and dividend yield) to create arbitrage profits. This approach does not fully exploit the arbitrage opportunity and, as such, does not guarantee risk-free profits.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Billy Beck<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billy Beck, CFA, is a derivatives analyst at Dutton Wealth Managers Ltd. Beck is analyzing a<\/p><p>forward position the fund has taken to hedge a $ 120 million exposure to the global MSCI. The<\/p><p>details of the forward contract are presented in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0278.webp\" style=\"max-width:min(100%,409px)\" alt=\"Exhibit 1: Equity Forward Contract The current value of the index 3, 689 The current forward price 3, 760 Maturity 2 years Continuously compounded risk-free rate 5% Continuously compounded dividend yield 1.5%\"><p>From his observations, it is clear that the equity forward contract is underpriced, which presents<\/p><p>an arbitrage opportunity. Beck attempts to determine the most profitable strategy for investors<\/p><p>without an index stock. Three months after initiation, Beck noticed that the value of the index<\/p><p>increased to 3,830. He attempts to find out how the change affects the value of the equity<\/p><p>forward.<\/p><p>Next, Beck evaluates a long forward position undertaken by the fund on shares of Zane Ltd. The<\/p><p>forward’s valuation is + $220 at inception. Beck wants to find out how the forward price of the<\/p><p>contract has been derived. In addition to domestic equities, the index fund includes an allocation<\/p><p>to international equities, such as Australian and UK stocks. The fund’s currency allocation<\/p><p>manager states that a need to hedge exposure to an anticipated decline of the Australian dollar<\/p><p>(AUD).<\/p><p>She proposes a 6-month currency forward. The exhibit below summarizes key information<\/p><p>concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0279.webp\" style=\"max-width:min(100%,430px)\" alt=\"Exhibit 2: Currency Forward Contract Position Contract Value AUD 32 million Contract Maturity 6 months Australian interest rate 2.14% U.S interest rate 1.89% Current Spot rate (AUD per 1 USD) 1.58 Expected spot rate (in 6 months) 1.44\"><\/div><\/details><div class=\"qtext\"><p>Which set of transactions executed today would enable the investor to achieve arbitrage profits on the equity index fund?<\/p><\/div>", "subj": "derivatives"}, {"n": 67, "q": "The forward contract price on the equity forward contract concerning the Zane Ltd. stock is most likely determined:", "opts": ["In the process of negotiation between two parties.", "By demand and supply forces in the forward market.", "By discounting the price of the asset at the risk-free rate."], "ans": "A", "expl": "The forward contract price on the equity forward contract concerning Zane Ltd's stock is determined through negotiation between two parties, primarily because it is an off-market forward rate agreement (FRA). In typical market conditions, forward contracts are priced at a no-arbitrage value, meaning the contract has a zero value at initiation. However, the forward contract in question has a nonzero value at initiation (+$ 220), indicating that it does not adhere to the standard pricing mechanism of being set at the no-arbitrage value. Instead, the price of this forward contract is set through negotiations between the buyer and the seller, who agree on terms that do not necessarily reflect the current market conditions or the typical calculation of forward prices using risk-free rates. This negotiation process allows both parties to tailor the terms of the forward contract to meet specific financial goals or risk management strategies. B is incorrect. The notion that forward prices are determined by supply and demand forces in the forward market applies primarily to exchange-traded instruments. However, equity forward contracts like the one described in the case are traded in OTC markets, where prices are decided privately between counterparties rather than by collective market forces. Hence, demand and supply alone do not determine the pricing. C is incorrect. While discounting the price of an asset at the risk-free rate is a theoretical method for deriving the no-arbitrage forward price, it doesn’t apply to real-world scenarios where factors like credit risk, funding costs, and dividend yield adjustments are considered during negotiation. The case explicitly states that the forward contract was overpriced, suggesting deviations from a strict theoretical calculation.", "explhtml": "<p>The forward contract price on the equity forward contract concerning Zane Ltd&#x27;s stock is determined through negotiation between two parties, primarily because it is an off-market forward rate agreement (FRA). In typical market conditions, forward contracts are priced at a no-arbitrage value, meaning the contract has a zero value at initiation. However, the forward contract in question has a nonzero value at initiation (+$ 220), indicating that it does not adhere to the standard pricing mechanism of being set at the no-arbitrage value. Instead, the price of this forward contract is set through negotiations between the buyer and the seller, who agree on terms that do not necessarily reflect the current market conditions or the typical calculation of forward prices using risk-free rates. This negotiation process allows both parties to tailor the terms of the forward contract to meet specific financial goals or risk management strategies.<\/p><p><b>B is incorrect.<\/b> The notion that forward prices are determined by supply and demand forces in the forward market applies primarily to exchange-traded instruments. However, equity forward contracts like the one described in the case are traded in OTC markets, where prices are decided privately between counterparties rather than by collective market forces. Hence, demand and supply alone do not determine the pricing.<\/p><p><b>C is incorrect.<\/b> While discounting the price of an asset at the risk-free rate is a theoretical method for deriving the no-arbitrage forward price, it doesn’t apply to real-world scenarios where factors like credit risk, funding costs, and dividend yield adjustments are considered during negotiation. The case explicitly states that the forward contract was overpriced, suggesting deviations from a strict theoretical calculation.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Billy Beck<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billy Beck, CFA, is a derivatives analyst at Dutton Wealth Managers Ltd. Beck is analyzing a<\/p><p>forward position the fund has taken to hedge a $ 120 million exposure to the global MSCI. The<\/p><p>details of the forward contract are presented in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0278.webp\" style=\"max-width:min(100%,409px)\" alt=\"Exhibit 1: Equity Forward Contract The current value of the index 3, 689 The current forward price 3, 760 Maturity 2 years Continuously compounded risk-free rate 5% Continuously compounded dividend yield 1.5%\"><p>From his observations, it is clear that the equity forward contract is underpriced, which presents<\/p><p>an arbitrage opportunity. Beck attempts to determine the most profitable strategy for investors<\/p><p>without an index stock. Three months after initiation, Beck noticed that the value of the index<\/p><p>increased to 3,830. He attempts to find out how the change affects the value of the equity<\/p><p>forward.<\/p><p>Next, Beck evaluates a long forward position undertaken by the fund on shares of Zane Ltd. The<\/p><p>forward’s valuation is + $220 at inception. Beck wants to find out how the forward price of the<\/p><p>contract has been derived. In addition to domestic equities, the index fund includes an allocation<\/p><p>to international equities, such as Australian and UK stocks. The fund’s currency allocation<\/p><p>manager states that a need to hedge exposure to an anticipated decline of the Australian dollar<\/p><p>(AUD).<\/p><p>She proposes a 6-month currency forward. The exhibit below summarizes key information<\/p><p>concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0279.webp\" style=\"max-width:min(100%,430px)\" alt=\"Exhibit 2: Currency Forward Contract Position Contract Value AUD 32 million Contract Maturity 6 months Australian interest rate 2.14% U.S interest rate 1.89% Current Spot rate (AUD per 1 USD) 1.58 Expected spot rate (in 6 months) 1.44\"><\/div><\/details><div class=\"qtext\"><p>The forward contract price on the equity forward contract concerning the Zane Ltd. stock is most likely determined:<\/p><\/div>", "subj": "derivatives"}, {"n": 68, "q": "Assuming the expected spot rate is realized, the credit risk of the currency forward at expiration is equal to:", "opts": ["$5,050,000 and is faced by the party long to the forward contract.", "$4,022,000 and is faced by the party short to the forward contract.", "$4,542,080 and is faced by the party short to the forward contract."], "ans": "C", "expl": "To assess the credit risk, the initial forward exchange rate is calculated using the interest rate parity formula. This formula asserts that the forward rate is derived by adjusting the spot rate to account for the interest rate differential between the two currencies over the duration of the contract. The formula is expressed as follows: This calculated forward rate (1.58194 AUD per USD) represents the agreed rate at which the currency will be exchanged at the end of six months. If the actual spot rate at expiration is 1.44 AUD per USD, the value of the forward contract from the perspective of the party short (seller) to the contract is positive, as they can buy USD at a lower rate than agreed in the forward contract. The credit risk, therefore, is the difference between the forward rate and the spot rate, multiplied by the contract value: B and C are incorrect. It claims a credit risk of $4,022,000 faced by the party short to the forward contract. However, this figure is inconsistent with the accurate calculation of credit risk, which is $4,542,080. This discrepancy suggests an error in the computation or a misunderstanding of the contract details.", "explhtml": "<p>To assess the credit risk, the initial forward exchange rate is calculated using the interest rate parity formula. This formula asserts that the forward rate is derived by adjusting the spot rate to account for the interest rate differential between the two currencies over the duration of the contract. The formula is expressed as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0283.webp\" style=\"max-width:min(100%,553px)\" alt=\"(1 + rAUD)0.5 F0(AUD / USD, 0.5) = S0(AUD / USD, ) × (1 + rUSD)0.5 (1 + 0.0214)0.5 1.010643 F0(AUD / USD, 0.5) = 1.58 × (1 + 0.0189)0.5 = 1.58 × 1.009405 = 1.58194\"><p>This calculated forward rate (1.58194 AUD per USD) represents the agreed rate at which the currency will be exchanged at the end of six months. If the actual spot rate at expiration is 1.44 AUD per USD, the value of the forward contract from the perspective of the party short (seller) to the contract is positive, as they can buy USD at a lower rate than agreed in the forward contract. The credit risk, therefore, is the difference between the forward rate and the spot rate, multiplied by the contract value:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0284.webp\" style=\"max-width:min(100%,467px)\" alt=\"Credit Risk = (1.58194 −1.44) × 32, 000, 000 = $4,542, 080\"><p><b>B and C are incorrect.<\/b> It claims a credit risk of $4,022,000 faced by the party short to the forward contract. However, this figure is inconsistent with the accurate calculation of credit risk, which is $4,542,080. This discrepancy suggests an error in the computation or a misunderstanding of the contract details.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Billy Beck<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Billy Beck, CFA, is a derivatives analyst at Dutton Wealth Managers Ltd. Beck is analyzing a<\/p><p>forward position the fund has taken to hedge a $ 120 million exposure to the global MSCI. The<\/p><p>details of the forward contract are presented in Exhibit 1 below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0278.webp\" style=\"max-width:min(100%,409px)\" alt=\"Exhibit 1: Equity Forward Contract The current value of the index 3, 689 The current forward price 3, 760 Maturity 2 years Continuously compounded risk-free rate 5% Continuously compounded dividend yield 1.5%\"><p>From his observations, it is clear that the equity forward contract is underpriced, which presents<\/p><p>an arbitrage opportunity. Beck attempts to determine the most profitable strategy for investors<\/p><p>without an index stock. Three months after initiation, Beck noticed that the value of the index<\/p><p>increased to 3,830. He attempts to find out how the change affects the value of the equity<\/p><p>forward.<\/p><p>Next, Beck evaluates a long forward position undertaken by the fund on shares of Zane Ltd. The<\/p><p>forward’s valuation is + $220 at inception. Beck wants to find out how the forward price of the<\/p><p>contract has been derived. In addition to domestic equities, the index fund includes an allocation<\/p><p>to international equities, such as Australian and UK stocks. The fund’s currency allocation<\/p><p>manager states that a need to hedge exposure to an anticipated decline of the Australian dollar<\/p><p>(AUD).<\/p><p>She proposes a 6-month currency forward. The exhibit below summarizes key information<\/p><p>concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0279.webp\" style=\"max-width:min(100%,430px)\" alt=\"Exhibit 2: Currency Forward Contract Position Contract Value AUD 32 million Contract Maturity 6 months Australian interest rate 2.14% U.S interest rate 1.89% Current Spot rate (AUD per 1 USD) 1.58 Expected spot rate (in 6 months) 1.44\"><\/div><\/details><div class=\"qtext\"><p>Assuming the expected spot rate is realized, the credit risk of the currency forward at expiration is equal to:<\/p><\/div>", "subj": "derivatives"}, {"n": 69, "q": "The no-arbitrage price for a 3-month maturity futures contract on FTSE 100 is closest to?", "opts": ["8,600.22", "8,687.30", "8,727.57"], "ans": "C", "expl": "The arbitrage-free price of a three-month futures contract on the FTSE 100 index is determined using a formula that factors in the index's current spot price, the risk-free interest rate, and the dividend yield. The formula is expressed as follows: Where F= The futures price S = The spot price r = The risk-free rate q = The dividend yield T = The time to maturity A is incorrect. This value is lower than the given spot price of 8,687.30, which is unexpected in a scenario with a positive net cost-of-carry (i.e., when the risk-free rate exceeds the dividend yield). B is incorrect. This figure exactly matches the spot price of the index. However, the formula for pricing futures contracts inherently adjusts the spot price for the cost-of-carry over the maturity period.", "explhtml": "<p>The arbitrage-free price of a three-month futures contract on the FTSE 100 index is determined using a formula that factors in the index&#x27;s current spot price, the risk-free interest rate, and the dividend yield. The formula is expressed as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0287.webp\" style=\"max-width:min(100%,122px)\" alt=\"F = S × e(r−q)T\"><p>Where<\/p><p>F= The futures price<\/p><p>S = The spot price<\/p><p>r = The risk-free rate<\/p><p>q = The dividend yield<\/p><p>T = The time to maturity<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0288.webp\" style=\"max-width:min(100%,283px)\" alt=\"3 F = 8, 687.30 × e(0.025−0.0065) 12 F = 8, 687.30 × e0.004625 = 8, 727.57\"><p><b>A is incorrect.<\/b> This value is lower than the given spot price of 8,687.30, which is unexpected in a scenario with a positive net cost-of-carry (i.e., when the risk-free rate exceeds the dividend yield).<\/p><p><b>B is incorrect.<\/b> This figure exactly matches the spot price of the index. However, the formula for pricing futures contracts inherently adjusts the spot price for the cost-of-carry over the maturity period.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (d): Calculate and interpret the no-arbitrage value of interest rate, currency, and equity swaps.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Jennifer Ha-eun<\/summary><div class=\"vig-body\"><p>Jennifer Ha-eun, CFA, is a portfolio manager at Ray Fund Ltd, a US-based hedge fund. The firm<\/p><p>is exposed to fixed income and equity securities in the Japanese and UK markets and is always<\/p><p>on the lookout for arbitrage opportunities in currency, fixed income, derivatives and equities. Ha-<\/p><p>eun manages a portfolio of $ 300 million, half of which is invested in Japanese business entities<\/p><p>and the rest is invested in UK equities.<\/p><p>Ha-eun is worried that the UK equities’ value will decrease due to the recent macroeconomic<\/p><p>environment in the UK. To protect the portfolio value, Ha-eun makes the following decisions:<\/p><p>1. Sell 3-month maturity futures on the GBP. 2. Sell 3-month maturity index futures on FTSE 100. 3. Buy a 3-month maturity put option on the GBP.<\/p><p>Ha-eun presents the following data to support her decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0285.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Market Trading Data Current price of the FTSE 100 index 8, 687.30 Dividend yield 0.65%∗ Risk-free interest rate GBP 2.50%∗ USD GBP exchange rate USD 1.29 per GBP Risk-free interest rate on USD 3.65%∗ 3-month futures USD 1.29 per GBP Call option on GBP Maturity 3 months Strike price GBP 1.\"><p>Ray Fund Ltd has allocated close to $150 million towards equity securities of Japanese<\/p><p>companies, denominated in Yen. According to Ha-eun, Japan’s economy shows no signs of<\/p><p>achieving growth momentum despite the government&#x27;s efforts. The firm&#x27;s internal analysis<\/p><p>indicates that Japanese equities are moderately overvalued and unlikely to experience significant<\/p><p>growth in the upcoming year. Ha-eun intends to implement a strategy of writing covered calls on<\/p><p>these equities, using binomial models to calculate call prices based on the provided data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0286.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Nikkei Index Call Option Data Maturity of a call option 2 years Nodes for the binomial pricing model 2 Risk-free interest rate 2.50% Spot Nikkei 38, 028 Strike price 38, 028\"><p>Price increment in one period = 11% Price decrement in one period = 10%<\/p><p>Ha-eun consults Sandra Brook, a senior equity analyst at Ray Fund Ltd, about his strategy. Brook<\/p><p>points out that the accuracy of the binomial option pricing model could be enhanced. She<\/p><p>recommends that Tim explore using the Black-Scholes option pricing model for valuing call<\/p><p>options on the Nikkei index.<\/p><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage price for a 3-month maturity futures contract on FTSE 100 is closest to?<\/p><\/div>", "subj": "derivatives"}, {"n": 70, "q": "The trading transaction that will provide an arbitrage profit in currency futures and the amount of arbitrage profit for Ray Fund Ltd are closest to:", "opts": ["Selling spot GBP and buying futures GBP results in a profit of GBP 0.0037 per USD", "Selling spot GBP and buying futures GBP results in a profit of USD 0.0037 per GBP", "Buying spot GBP and selling futures GBP results in a profit of USD 0.0037 per GBP"], "ans": "B", "expl": "It accurately reflects the arbitrage opportunity based on the mispricing of the Euro in the futures market. The no-arbitrage price of a 3-month maturity futures contract on the GBP can be calculated using the formula for the future price of a currency, which is given by: Where S = The spot rate rd = The domestic risk-free rate rf = The foreign risk-free rate T = The time to maturity in years Plugging in the values from the question, we have: The market price of the futures contract is given as 1.29 USD/GBP, indicating that the futures are underpriced. By buying the futures at 1.29 USD/GBP and planning to sell at the no-arbitrage price of 1.2937 USD/GBP, an arbitrage profit of 1.2937−1.29 = 0.0037 USD per GBP can be realized. A is incorrect. It suggests selling spot GBP and buying futures GBP, which would indeed exploit the mispricing if the profit were calculated in GBP per USD. However, the profit is denominated incorrectly in the option. The arbitrage calculation and the resulting profit should be expressed in terms of the currency being speculated on, which in this case is GBP, not USD. The misstatement of the currency in which the profit is denominated leads to confusion and makes this option incorrect. C is incorrect. It suggests buying spot GBP and selling futures GBP, which is the opposite of the correct arbitrage strategy. The futures are underpriced, not overpriced, so buying them (not selling them) and selling at a higher spot rate in the future would yield a profit. This option incorrectly identifies the direction of the trade that would exploit the arbitrage opportunity, leading to a misunderstanding of the fundamental principles of arbitrage in currency futures markets.", "explhtml": "<p>It accurately reflects the arbitrage opportunity based on the mispricing of the Euro in the futures market. The no-arbitrage price of a 3-month maturity futures contract on the GBP can be calculated using the formula for the future price of a currency, which is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0289.webp\" style=\"max-width:min(100%,115px)\" alt=\"F = S × erd×T erf×T\"><p>Where<\/p><p>S = The spot rate<\/p><p>rd = The domestic risk-free rate<\/p><p>rf = The foreign risk-free rate<\/p><p>T = The time to maturity in years<\/p><p>Plugging in the values from the question, we have:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0290.webp\" style=\"max-width:min(100%,319px)\" alt=\"e0.0365×0.25 F = 1.29 × = 1.2937 USD/GBP e0.025×0.25\"><p>The market price of the futures contract is given as 1.29 USD/GBP, indicating that the futures are underpriced. By buying the futures at 1.29 USD/GBP and planning to sell at the no-arbitrage price of 1.2937 USD/GBP, an arbitrage profit of 1.2937−1.29 = 0.0037 USD per GBP can be realized.<\/p><p><b>A is incorrect.<\/b> It suggests selling spot GBP and buying futures GBP, which would indeed exploit the mispricing if the profit were calculated in GBP per USD. However, the profit is denominated incorrectly in the option. The arbitrage calculation and the resulting profit should be expressed in terms of the currency being speculated on, which in this case is GBP, not USD. The misstatement of the currency in which the profit is denominated leads to confusion and makes this option incorrect.<\/p><p><b>C is incorrect.<\/b> It suggests buying spot GBP and selling futures GBP, which is the opposite of the correct arbitrage strategy. The futures are underpriced, not overpriced, so buying them (not selling them) and selling at a higher spot rate in the future would yield a profit. This option incorrectly identifies the direction of the trade that would exploit the arbitrage opportunity, leading to a misunderstanding of the fundamental principles of arbitrage in currency futures markets.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (c): Identify an arbitrage opportunity involving options and describe the related arbitrage.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Jennifer Ha-eun<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Ha-eun, CFA, is a portfolio manager at Ray Fund Ltd, a US-based hedge fund. The firm<\/p><p>is exposed to fixed income and equity securities in the Japanese and UK markets and is always<\/p><p>on the lookout for arbitrage opportunities in currency, fixed income, derivatives and equities. Ha-<\/p><p>eun manages a portfolio of $ 300 million, half of which is invested in Japanese business entities<\/p><p>and the rest is invested in UK equities.<\/p><p>Ha-eun is worried that the UK equities’ value will decrease due to the recent macroeconomic<\/p><p>environment in the UK. To protect the portfolio value, Ha-eun makes the following decisions:<\/p><p>1. Sell 3-month maturity futures on the GBP. 2. Sell 3-month maturity index futures on FTSE 100. 3. Buy a 3-month maturity put option on the GBP.<\/p><p>Ha-eun presents the following data to support her decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0285.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Market Trading Data Current price of the FTSE 100 index 8, 687.30 Dividend yield 0.65%∗ Risk-free interest rate GBP 2.50%∗ USD GBP exchange rate USD 1.29 per GBP Risk-free interest rate on USD 3.65%∗ 3-month futures USD 1.29 per GBP Call option on GBP Maturity 3 months Strike price GBP 1.\"><p>Ray Fund Ltd has allocated close to $150 million towards equity securities of Japanese<\/p><p>companies, denominated in Yen. According to Ha-eun, Japan’s economy shows no signs of<\/p><p>achieving growth momentum despite the government&#x27;s efforts. The firm&#x27;s internal analysis<\/p><p>indicates that Japanese equities are moderately overvalued and unlikely to experience significant<\/p><p>growth in the upcoming year. Ha-eun intends to implement a strategy of writing covered calls on<\/p><p>these equities, using binomial models to calculate call prices based on the provided data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0286.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Nikkei Index Call Option Data Maturity of a call option 2 years Nodes for the binomial pricing model 2 Risk-free interest rate 2.50% Spot Nikkei 38, 028 Strike price 38, 028\"><p>Price increment in one period = 11% Price decrement in one period = 10%<\/p><p>Ha-eun consults Sandra Brook, a senior equity analyst at Ray Fund Ltd, about his strategy. Brook<\/p><p>points out that the accuracy of the binomial option pricing model could be enhanced. She<\/p><p>recommends that Tim explore using the Black-Scholes option pricing model for valuing call<\/p><p>options on the Nikkei index.<\/p><\/div><\/details><div class=\"qtext\"><p>The trading transaction that will provide an arbitrage profit in currency futures and the amount of arbitrage profit for Ray Fund Ltd are closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 71, "q": "Suppose Ha-eun saw a rounded current USD GBP exchange rate. The actual rate is 1.3231. In this case, the no-arbitrage price of a 3-month maturity put option with a strike price of GBP 1.29, based on the put-call parity relationship, is closest to:", "opts": ["$ 0.0139", "$ 0.0031", "$ 0.032"], "ans": "A", "expl": "To grasp the reasoning, we must utilize the put-call parity principle, a foundational concept in options pricing that links the values of European call and put options sharing the same strike price and expiration date. The put-call parity relationship is expressed through the formula: Rearranging the formula to solve for the put option price P, we get: Plugging in the values from Exhibit 1. B is incorrect. This value is significantly lower than the calculated no-arbitrage price of $0.0139. This might also stem from overly aggressive discounting, reducing the put price to a value that doesn't reflect the actual cost of holding the option. C is incorrect. This value is notably higher than the correct put price. It likely results from neglecting the discount factors and entirely or from a miscalculation where the spot price term is underestimated, inflating the put option value.", "explhtml": "<p>To grasp the reasoning, we must utilize the put-call parity principle, a foundational concept in options pricing that links the values of European call and put options sharing the same strike price and expiration date. The put-call parity relationship is expressed through the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0291.webp\" style=\"max-width:min(100%,183px)\" alt=\"C + Xe−rT = P + Se−qT\"><p>Rearranging the formula to solve for the put option price P, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0292.webp\" style=\"max-width:min(100%,183px)\" alt=\"P = C + Xe−rT −Se−qT\"><p>Plugging in the values from Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0293.webp\" style=\"max-width:min(100%,484px)\" alt=\"P = 0.04 + 1.29 × e−0.0365×0.25 −1.3231 × e−0.025×0.25 = 0.0139\"><p><b>B is incorrect.<\/b> This value is significantly lower than the calculated no-arbitrage price of $0.0139. This might also stem from overly aggressive discounting, reducing the put price to a value that doesn&#x27;t reflect the actual cost of holding the option.<\/p><p><b>C is incorrect.<\/b> This value is notably higher than the correct put price. It likely results from neglecting the discount factors and entirely or from a miscalculation where the spot price term is underestimated, inflating the put option value.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(e): Describe how the value of a European option can be analyzed as the present value of the option’s expected payoff at expiration.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Jennifer Ha-eun<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Ha-eun, CFA, is a portfolio manager at Ray Fund Ltd, a US-based hedge fund. The firm<\/p><p>is exposed to fixed income and equity securities in the Japanese and UK markets and is always<\/p><p>on the lookout for arbitrage opportunities in currency, fixed income, derivatives and equities. Ha-<\/p><p>eun manages a portfolio of $ 300 million, half of which is invested in Japanese business entities<\/p><p>and the rest is invested in UK equities.<\/p><p>Ha-eun is worried that the UK equities’ value will decrease due to the recent macroeconomic<\/p><p>environment in the UK. To protect the portfolio value, Ha-eun makes the following decisions:<\/p><p>1. Sell 3-month maturity futures on the GBP. 2. Sell 3-month maturity index futures on FTSE 100. 3. Buy a 3-month maturity put option on the GBP.<\/p><p>Ha-eun presents the following data to support her decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0285.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Market Trading Data Current price of the FTSE 100 index 8, 687.30 Dividend yield 0.65%∗ Risk-free interest rate GBP 2.50%∗ USD GBP exchange rate USD 1.29 per GBP Risk-free interest rate on USD 3.65%∗ 3-month futures USD 1.29 per GBP Call option on GBP Maturity 3 months Strike price GBP 1.\"><p>Ray Fund Ltd has allocated close to $150 million towards equity securities of Japanese<\/p><p>companies, denominated in Yen. According to Ha-eun, Japan’s economy shows no signs of<\/p><p>achieving growth momentum despite the government&#x27;s efforts. The firm&#x27;s internal analysis<\/p><p>indicates that Japanese equities are moderately overvalued and unlikely to experience significant<\/p><p>growth in the upcoming year. Ha-eun intends to implement a strategy of writing covered calls on<\/p><p>these equities, using binomial models to calculate call prices based on the provided data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0286.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Nikkei Index Call Option Data Maturity of a call option 2 years Nodes for the binomial pricing model 2 Risk-free interest rate 2.50% Spot Nikkei 38, 028 Strike price 38, 028\"><p>Price increment in one period = 11% Price decrement in one period = 10%<\/p><p>Ha-eun consults Sandra Brook, a senior equity analyst at Ray Fund Ltd, about his strategy. Brook<\/p><p>points out that the accuracy of the binomial option pricing model could be enhanced. She<\/p><p>recommends that Tim explore using the Black-Scholes option pricing model for valuing call<\/p><p>options on the Nikkei index.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose Ha-eun saw a rounded current USD GBP exchange rate. The actual rate is 1.3231. In this case, the no-arbitrage price of a 3-month maturity put option with a strike price of GBP 1.29, based on the put-call parity relationship, is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 72, "q": "The price of a 2-year maturity call option on the Nikkei Index according to a two-period binomial option pricing model is closest to:", "opts": ["2,976", "8,826", "4,545"], "ans": "A", "expl": "It calculates the price of a call option on the Nikkei index with a two-year maturity by employing a two-period binomial option pricing model. To achieve this, the risk-neutral probability of an upward price movement (p) is first determined using the formula. Where: U = The up-move factor D = The down-move factor RF = The risk-free rate Next, we calculate the projected Nikkei spot prices at each node: SU=42,211.08, SD=34,225.20, SUU=46,854.30, SUD = 37,989.97, and SDD=30,802.68. The call option payoffs at the end of year 2 are VUU=8,826.30, VUD=0, and VDD =0. The call option price at time 0 is then calculated as the expected present value of these payoffs, discounted at the risk-free rate, resulting in B is incorrect. This figure matches the maximum call option payoff (VUU) at the end of the second year, assuming the Nikkei index spot price reaches the highest node SUU = 46,854.30. C is incorrect. This value likely represents a partial calculation or an arithmetic average of payoffs, rather than the correct discounted expected value derived from the binomial framework.", "explhtml": "<p>It calculates the price of a call option on the Nikkei index with a two-year maturity by employing a two-period binomial option pricing model. To achieve this, the risk-neutral probability of an upward price movement (p) is first determined using the formula.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0294.webp\" style=\"max-width:min(100%,139px)\" alt=\"(1 + RF) −D p = U −D\"><p>Where:<\/p><p>U = The up-move factor<\/p><p>D = The down-move factor<\/p><p>R<sub>F<\/sub> = The risk-free rate<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0295.webp\" style=\"max-width:min(100%,196px)\" alt=\"1.025 −0.9 p = 1.11 −0.9 = 0.5952\"><p>Next, we calculate the projected Nikkei spot prices at each node: SU=42,211.08, SD=34,225.20, SUU=46,854.30, SUD = 37,989.97, and SDD=30,802.68. The call option payoffs at the end of year 2 are VUU=8,826.30, VUD=0, and VDD =0. The call option price at time 0 is then calculated as the expected present value of these payoffs, discounted at the risk-free rate, resulting in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0296.webp\" style=\"max-width:min(100%,248px)\" alt=\"0.59522 × 8, 826.30 V0 = = 2, 976 1.0252\"><p><b>B is incorrect.<\/b> This figure matches the maximum call option payoff (VUU) at the end of the second year, assuming the Nikkei index spot price reaches the highest node SUU = 46,854.30.<\/p><p><b>C is incorrect.<\/b> This value likely represents a partial calculation or an arithmetic average of payoffs, rather than the correct discounted expected value derived from the binomial framework.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(b): Calculate the no-arbitrage values of European and American options using a two-period binomial model.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Jennifer Ha-eun<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jennifer Ha-eun, CFA, is a portfolio manager at Ray Fund Ltd, a US-based hedge fund. The firm<\/p><p>is exposed to fixed income and equity securities in the Japanese and UK markets and is always<\/p><p>on the lookout for arbitrage opportunities in currency, fixed income, derivatives and equities. Ha-<\/p><p>eun manages a portfolio of $ 300 million, half of which is invested in Japanese business entities<\/p><p>and the rest is invested in UK equities.<\/p><p>Ha-eun is worried that the UK equities’ value will decrease due to the recent macroeconomic<\/p><p>environment in the UK. To protect the portfolio value, Ha-eun makes the following decisions:<\/p><p>1. Sell 3-month maturity futures on the GBP. 2. Sell 3-month maturity index futures on FTSE 100. 3. Buy a 3-month maturity put option on the GBP.<\/p><p>Ha-eun presents the following data to support her decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0285.webp\" style=\"max-width:min(100%,485px)\" alt=\"Exhibit 1: Market Trading Data Current price of the FTSE 100 index 8, 687.30 Dividend yield 0.65%∗ Risk-free interest rate GBP 2.50%∗ USD GBP exchange rate USD 1.29 per GBP Risk-free interest rate on USD 3.65%∗ 3-month futures USD 1.29 per GBP Call option on GBP Maturity 3 months Strike price GBP 1.\"><p>Ray Fund Ltd has allocated close to $150 million towards equity securities of Japanese<\/p><p>companies, denominated in Yen. According to Ha-eun, Japan’s economy shows no signs of<\/p><p>achieving growth momentum despite the government&#x27;s efforts. The firm&#x27;s internal analysis<\/p><p>indicates that Japanese equities are moderately overvalued and unlikely to experience significant<\/p><p>growth in the upcoming year. Ha-eun intends to implement a strategy of writing covered calls on<\/p><p>these equities, using binomial models to calculate call prices based on the provided data.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0286.webp\" style=\"max-width:min(100%,618px)\" alt=\"Exhibit 2: Nikkei Index Call Option Data Maturity of a call option 2 years Nodes for the binomial pricing model 2 Risk-free interest rate 2.50% Spot Nikkei 38, 028 Strike price 38, 028\"><p>Price increment in one period = 11% Price decrement in one period = 10%<\/p><p>Ha-eun consults Sandra Brook, a senior equity analyst at Ray Fund Ltd, about his strategy. Brook<\/p><p>points out that the accuracy of the binomial option pricing model could be enhanced. She<\/p><p>recommends that Tim explore using the Black-Scholes option pricing model for valuing call<\/p><p>options on the Nikkei index.<\/p><\/div><\/details><div class=\"qtext\"><p>The price of a 2-year maturity call option on the Nikkei Index according to a two-period binomial option pricing model is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 73, "q": "Given his objective, the number of MLC shares that Skorupinski must sell short is closest to:", "opts": ["-5,280", "6,720", "1,440"], "ans": "C", "expl": "Skorupinski's approach focuses on establishing a delta-neutral position to mitigate the risks tied to the options he has sold. This requires neutralizing the net delta of the options portfolio by short selling MLC shares. Delta, in this context, signifies the rate at which an option's price changes in response to a one-unit fluctuation in the underlying asset's price. For the call options (Option Y), each has a delta value of 0.44. Given that Skorupinski sold 12,000 of these options, the aggregate delta contribution from the call options amounts to: For the put options (Option X), each has a delta of -0.56, and with 12,000 sold, the total delta contribution is: The net delta of this position is: To neutralize this, Skorupinski must short sell 1,440 shares of MLC, as each share has a delta of 1.0. By short selling 1,440 shares, he adds a delta of -1,440, which balances the net delta to zero, achieving a delta-neutral position. A is incorrect. This represents the total delta contribution from the call options (Option Y), calculated as: However, this value only accounts for the delta of the call options and does not consider the offsetting contribution from the put options (Option X), which have a positive delta when sold. Since the goal is to calculate the net delta of the combined position, -5,280 on its own is incomplete and incorrect. Additionally, this figure does not address the number of MLC shares needed to neutralize the portfolio's overall delta. B is incorrect. This corresponds to the total delta contribution from the put options (Option X), calculated as: While this value correctly accounts for the put options' impact, it also does not consider the call options' negative delta contribution. The net delta of the entire position requires summing both the call and put contributions. Focusing solely on the put options' delta leads to an inaccurate answer for the number of MLC shares required for a delta-neutral position.", "explhtml": "<p>Skorupinski&#x27;s approach focuses on establishing a delta-neutral position to mitigate the risks tied to the options he has sold. This requires neutralizing the net delta of the options portfolio by short selling MLC shares. Delta, in this context, signifies the rate at which an option&#x27;s price changes in response to a one-unit fluctuation in the underlying asset&#x27;s price. For the call options (Option Y), each has a delta value of 0.44. Given that Skorupinski sold 12,000 of these options, the aggregate delta contribution from the call options amounts to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0298.webp\" style=\"max-width:min(100%,211px)\" alt=\"−12, 000 × 0.44 = −5, 280\"><p>For the put options (Option X), each has a delta of -0.56, and with 12,000 sold, the total delta contribution is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0299.webp\" style=\"max-width:min(100%,211px)\" alt=\"−12, 000 × −0.56 = 6, 720\"><p>The net delta of this position is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0300.webp\" style=\"max-width:min(100%,202px)\" alt=\"−5, 280 + 6, 720 = 1, 440\"><p>To neutralize this, Skorupinski must short sell 1,440 shares of MLC, as each share has a delta of 1.0. By short selling 1,440 shares, he adds a delta of -1,440, which balances the net delta to zero, achieving a delta-neutral position.<\/p><p><b>A is incorrect.<\/b> This represents the total delta contribution from the call options (Option Y), calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0301.webp\" style=\"max-width:min(100%,211px)\" alt=\"−12, 000 × 0.44 = −5, 280\"><p>However, this value only accounts for the delta of the call options and does not consider the offsetting contribution from the put options (Option X), which have a positive delta when sold. Since the goal is to calculate the net delta of the combined position, -5,280 on its own is incomplete and incorrect. Additionally, this figure does not address the number of MLC shares needed to neutralize the portfolio&#x27;s overall delta.<\/p><p><b>B is incorrect.<\/b> This corresponds to the total delta contribution from the put options (Option X), calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0302.webp\" style=\"max-width:min(100%,211px)\" alt=\"−12, 000 × −0.56 = 6, 720\"><p>While this value correctly accounts for the put options&#x27; impact, it also does not consider the call options&#x27; negative delta contribution. The net delta of the entire position requires summing both the call and put contributions. Focusing solely on the put options&#x27; delta leads to an inaccurate answer for the number of MLC shares required for a delta-neutral position.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(l): Describe how a delta hedge is executed.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Donald Skorupinski<\/summary><div class=\"vig-body\"><p>Donald Skorupinski, CFA, is a derivatives trader at Michelle &amp; Donovan Asset Managers. His<\/p><p>primary responsibilities involve buying and selling put and call options on behalf of clients<\/p><p>aiming to manage portfolio risk. Recently, Skorupinski sold 12,000 put options and 12,000 call<\/p><p>options on Myles Co.’s stock, ticker symbol MLC, which trades on the London Stock Exchange.<\/p><p>MLC does not pay dividends, and its current share price is £125.<\/p><p>To reduce exposure from the trade on MLC, Skorupinski will execute a delta-neutral hedge by<\/p><p>borrowing and short selling MLC shares. The relevant option data is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0297.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: European Style Options on MLC Shares (GBP per share price) Option Type Exercise Time to Price Delta Gamma price expiry X Put 135 3 months 8.456 −0.56 Y Call 135 3 months 4.192 0.44 0.042\"><p>Melanie Ligard, a graduate trainee who recently joined the firm, inquired about the factors<\/p><p>affecting option prices. She asserted that the time value of options diminishes at a constant<\/p><p>linear rate over time. Skorupinski disagreed, explaining, &quot;The rate of time value decay slows as<\/p><p>an option approaches maturity.&quot;<\/p><p>The discussion shifted to the volatility metrics of options, collectively referred to as the Greeks.<\/p><p>Observing the two option contracts recently sold by Skorupinski, Ligard remarked, &quot;Vega and<\/p><p>rho will both be positive for Options X and Y.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Given his objective, the number of MLC shares that Skorupinski must sell short is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 74, "q": "As a result of Skorupinski selling MLC shares short, the total level of non-linearity risk to which his positions are exposed will most likely:", "opts": ["Increase", "Remain the same.", "Decrease"], "ans": "B", "expl": "Gamma reflects how delta changes in response to fluctuations in the price of the underlying asset, while delta indicates how sensitive an option's price is to such changes. When Skorupinski opts to sell MLC shares short, he is directly interacting with the underlying asset rather than the options themselves. The gamma of an option is determined solely by its intrinsic features, such as its strike price, the volatility of the underlying asset, and the time remaining to expiration. These characteristics are unaffected by any positions taken in the underlying asset. Consequently, short selling the shares does not impact the options' gamma or the associated non-linearity risk. Thus, Skorupinski's decision to short sell shares does not alter the gamma of the options he has written, leaving the non-linearity risk exposure of his positions unchanged. A is incorrect. This choice assumes that short selling MLC shares directly increases the non-linearity risk of Skorupinski's positions, implying that gamma would rise as a result of this action. However, gamma is exclusively determined by the characteristics of the options themselves, such as strike price, volatility, and time to expiration. These factors remain unchanged regardless of whether Skorupinski sells the underlying shares short, as the gamma is not influenced by transactions involving the underlying asset. Therefore, the assumption that non-linearity risk increases is incorrect. C is incorrect. This choice suggests that short selling MLC shares reduces the non-linearity risk of Skorupinski's positions, implying that gamma would decline as a result. However, as gamma is unaffected by changes in the underlying asset positions, short selling shares does not alter the intrinsic characteristics of the options, such as strike price, volatility, or time to expiration. Since gamma and non-linearity risk remain constant irrespective of underlying asset transactions, the idea that the risk decreases is also incorrect.", "explhtml": "<p>Gamma reflects how delta changes in response to fluctuations in the price of the underlying asset, while delta indicates how sensitive an option&#x27;s price is to such changes. When Skorupinski opts to sell MLC shares short, he is directly interacting with the underlying asset rather than the options themselves. The gamma of an option is determined solely by its intrinsic features, such as its strike price, the volatility of the underlying asset, and the time remaining to expiration. These characteristics are unaffected by any positions taken in the underlying asset. Consequently, short selling the shares does not impact the options&#x27; gamma or the associated non-linearity risk. Thus, Skorupinski&#x27;s decision to short sell shares does not alter the gamma of the options he has written, leaving the non-linearity risk exposure of his positions unchanged.<\/p><p><b>A is incorrect.<\/b><\/p><p>This choice assumes that short selling MLC shares directly increases the non-linearity risk of Skorupinski&#x27;s positions, implying that gamma would rise as a result of this action. However, gamma is exclusively determined by the characteristics of the options themselves, such as strike price, volatility, and time to expiration. These factors remain unchanged regardless of whether Skorupinski sells the underlying shares short, as the gamma is not influenced by transactions involving the underlying asset. Therefore, the assumption that non-linearity risk increases is incorrect.<\/p><p><b>C is incorrect.<\/b><\/p><p>This choice suggests that short selling MLC shares reduces the non-linearity risk of Skorupinski&#x27;s positions, implying that gamma would decline as a result. However, as gamma is unaffected by changes in the underlying asset positions, short selling shares does not alter the intrinsic characteristics of the options, such as strike price, volatility, or time to expiration. Since gamma and non-linearity risk remain constant irrespective of underlying asset transactions, the idea that the risk decreases is also incorrect.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (k): Interpret each of the option Greeks.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Donald Skorupinski<spa
