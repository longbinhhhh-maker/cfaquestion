of option X instead of the call price of option Y.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0306.webp\" style=\"max-width:min(100%,469px)\" alt=\"^ c = 8.456 + 0.44(126 −125) + 0.042 × (126 −125)2 = 8.917 2\"><p><b>B is incorrect.<\/b> This is the price of option X.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (m): Describe the role of gamma risk in options trading.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Donald Skorupinski<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Donald Skorupinski, CFA, is a derivatives trader at Michelle &amp; Donovan Asset Managers. His<\/p><p>primary responsibilities involve buying and selling put and call options on behalf of clients<\/p><p>aiming to manage portfolio risk. Recently, Skorupinski sold 12,000 put options and 12,000 call<\/p><p>options on Myles Co.’s stock, ticker symbol MLC, which trades on the London Stock Exchange.<\/p><p>MLC does not pay dividends, and its current share price is £125.<\/p><p>To reduce exposure from the trade on MLC, Skorupinski will execute a delta-neutral hedge by<\/p><p>borrowing and short selling MLC shares. The relevant option data is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0297.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: European Style Options on MLC Shares (GBP per share price) Option Type Exercise Time to Price Delta Gamma price expiry X Put 135 3 months 8.456 −0.56 Y Call 135 3 months 4.192 0.44 0.042\"><p>Melanie Ligard, a graduate trainee who recently joined the firm, inquired about the factors<\/p><p>affecting option prices. She asserted that the time value of options diminishes at a constant<\/p><p>linear rate over time. Skorupinski disagreed, explaining, &quot;The rate of time value decay slows as<\/p><p>an option approaches maturity.&quot;<\/p><p>The discussion shifted to the volatility metrics of options, collectively referred to as the Greeks.<\/p><p>Observing the two option contracts recently sold by Skorupinski, Ligard remarked, &quot;Vega and<\/p><p>rho will both be positive for Options X and Y.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, after a GBP 1.00 increase in the price of MLC shares, the price of Option Y will be closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 76, "q": "The most accurate statement about Option X's gamma measure is that it:", "opts": ["Is equal to 0.042.", "Must have a negative value.", "Must be greater than 0.042."], "ans": "A", "expl": "Gamma represents the rate at which an option's delta changes relative to a one-unit shift in the price of the underlying asset. Since Option Y and Option X are both tied to the same underlying asset, Myles Co, and share identical strike prices and expiration dates, the changes in their deltas in response to fluctuations in the underlying asset’s price will be comparable. As a result, the gamma values for both options should be identical, provided that other factors—such as volatility and time to expiration—remain constant. Given that Option Y has a gamma of 0.042, it follows logically that Option X, under these equivalent conditions, would also have a gamma of 0.042. This concept is vital in options trading and risk management, as it facilitates the prediction of changes in an option's delta based on shifts in the underlying asset’s price, thereby influencing effective hedging strategies. B is incorrect. This choice suggests that Option X's gamma could be negative. However, gamma measures the rate of change of delta with respect to the underlying asset’s price, and it is always positive for standard call and put options. Gamma reflects the non-linearity of how delta responds to price changes, indicating increased sensitivity near the money. Since Option X is a typical option tied to the underlying asset Myles Co, it cannot have a negative gamma unless it is part of a specific non-standard financial structure, which is not mentioned here. Therefore, this answer is factually incorrect. C is incorrect. This choice implies that Option X's gamma must exceed the value of 0.042. However, as stated, both Option X and Option Y share identical characteristics—strike prices, expiration dates, underlying asset, volatility, and time to expiration—which dictate their gamma values. Under these constant conditions, their gamma measures should be equal, as gamma is dependent on these intrinsic characteristics. Since Option Y’s gamma is specified as 0.042, it logically follows that Option X's gamma cannot be greater than this value under the same conditions. Therefore, this choice is incorrect.", "explhtml": "<p>Gamma represents the rate at which an option&#x27;s delta changes relative to a one-unit shift in the price of the underlying asset. Since Option Y and Option X are both tied to the same underlying asset, Myles Co, and share identical strike prices and expiration dates, the changes in their deltas in response to fluctuations in the underlying asset’s price will be comparable. As a result, the gamma values for both options should be identical, provided that other factors—such as volatility and time to expiration—remain constant. Given that Option Y has a gamma of 0.042, it follows logically that Option X, under these equivalent conditions, would also have a gamma of 0.042. This concept is vital in options trading and risk management, as it facilitates the prediction of changes in an option&#x27;s delta based on shifts in the underlying asset’s price, thereby influencing effective hedging strategies.<\/p><p><b>B is incorrect.<\/b> This choice suggests that Option X&#x27;s gamma could be negative. However, gamma measures the rate of change of delta with respect to the underlying asset’s price, and it is always positive for standard call and put options. Gamma reflects the non-linearity of how delta responds to price changes, indicating increased sensitivity near the money. Since Option X is a typical option tied to the underlying asset Myles Co, it cannot have a negative gamma unless it is part of a specific non-standard financial structure, which is not mentioned here. Therefore, this answer is factually incorrect.<\/p><p><b>C is incorrect.<\/b> This choice implies that Option X&#x27;s gamma must exceed the value of 0.042. However, as stated, both Option X and Option Y share identical characteristics—strike prices, expiration dates, underlying asset, volatility, and time to expiration—which dictate their gamma values. Under these constant conditions, their gamma measures should be equal, as gamma is dependent on these intrinsic characteristics. Since Option Y’s gamma is specified as 0.042, it logically follows that Option X&#x27;s gamma cannot be greater than this value under the same conditions. Therefore, this choice is incorrect.<\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (m): Describe the role of gamma risk in options trading.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Donald Skorupinski<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Donald Skorupinski, CFA, is a derivatives trader at Michelle &amp; Donovan Asset Managers. His<\/p><p>primary responsibilities involve buying and selling put and call options on behalf of clients<\/p><p>aiming to manage portfolio risk. Recently, Skorupinski sold 12,000 put options and 12,000 call<\/p><p>options on Myles Co.’s stock, ticker symbol MLC, which trades on the London Stock Exchange.<\/p><p>MLC does not pay dividends, and its current share price is £125.<\/p><p>To reduce exposure from the trade on MLC, Skorupinski will execute a delta-neutral hedge by<\/p><p>borrowing and short selling MLC shares. The relevant option data is presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0297.webp\" style=\"max-width:min(100%,565px)\" alt=\"Exhibit 1: European Style Options on MLC Shares (GBP per share price) Option Type Exercise Time to Price Delta Gamma price expiry X Put 135 3 months 8.456 −0.56 Y Call 135 3 months 4.192 0.44 0.042\"><p>Melanie Ligard, a graduate trainee who recently joined the firm, inquired about the factors<\/p><p>affecting option prices. She asserted that the time value of options diminishes at a constant<\/p><p>linear rate over time. Skorupinski disagreed, explaining, &quot;The rate of time value decay slows as<\/p><p>an option approaches maturity.&quot;<\/p><p>The discussion shifted to the volatility metrics of options, collectively referred to as the Greeks.<\/p><p>Observing the two option contracts recently sold by Skorupinski, Ligard remarked, &quot;Vega and<\/p><p>rho will both be positive for Options X and Y.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The most accurate statement about Option X&#x27;s gamma measure is that it:<\/p><\/div>", "subj": "derivatives"}, {"n": 77, "q": "What type of swap will Goldberg Inc. undertake and what is the approximate value of the swap?", "opts": ["Goldberg Inc will undertake a pay fixed/receive floating swap, and the value of the swap is $ 600,000.", "Goldberg Inc will undertake a floating/ receive fixed swap, and the value of the swap is -$ 600,000.", "Goldberg Inc will undertake a pay fixed/receive floating swap, and the value of the swap is $ 0."], "ans": "C", "expl": "Goldberg Inc. aims to mitigate the risk of rising interest rates, which could increase their borrowing costs as they prepare to issue $12 million in bonds. A suitable approach in this situation is to use an interest rate swap, specifically a pay-fixed/receive-floating swap. This arrangement enables Goldberg Inc. to pay a fixed interest rate on the notional amount while receiving a floating rate. By locking in the borrowing cost, the fixed payment provides financial stability, regardless of fluctuations in market interest rates. If the floating rate, often benchmarked to LIBOR, exceeds the fixed rate, the company receives payments that can help offset higher interest costs on other liabilities. On the other hand, if the floating rate falls below the fixed rate, Goldberg Inc. will incur net payments, but these will be balanced out by reduced interest expenses on their floating rate liabilities. This strategy effectively protects the company from the risk of rising interest rates. A is incorrect. While Goldberg Inc. does indeed undertake a pay fixed/receive floating swap as a strategy to hedge against rising interest rates, the stated value of $600,000 is incorrect. The swap’s value represents the net cash flows or exposure at the time of undertaking the swap, and in this case, it begins with a value of $0 because the swap is constructed to offset risk rather than having an immediate gain or loss. Thus, assigning a value of $600,000 is misleading and does not align with the mechanics of the swap's construction or purpose. B is incorrect. Goldberg Inc.’s objective is to hedge against rising interest rates, which increases borrowing costs. A floating/receive fixed swap would expose the company further to interest rate risk rather than protect it. To achieve stability and mitigate the risk of higher rates, Goldberg Inc. must enter a pay fixed/receive floating swap, not the opposite. Similar to choice A, the swap initially has a value of $0 because it is designed to neutralize interest rate risk rather than immediately generate a profit or loss. A value of -$600,000 does not accurately reflect the net position at initiation.", "explhtml": "<p>Goldberg Inc. aims to mitigate the risk of rising interest rates, which could increase their borrowing costs as they prepare to issue $12 million in bonds. A suitable approach in this situation is to use an interest rate swap, specifically a pay-fixed/receive-floating swap. This arrangement enables Goldberg Inc. to pay a fixed interest rate on the notional amount while receiving a floating rate. By locking in the borrowing cost, the fixed payment provides financial stability, regardless of fluctuations in market interest rates. If the floating rate, often benchmarked to LIBOR, exceeds the fixed rate, the company receives payments that can help offset higher interest costs on other liabilities. On the other hand, if the floating rate falls below the fixed rate, Goldberg Inc. will incur net payments, but these will be balanced out by reduced interest expenses on their floating rate liabilities. This strategy effectively protects the company from the risk of rising interest rates.<\/p><p><b>A is incorrect.<\/b> While Goldberg Inc. does indeed undertake a pay fixed/receive floating swap as a strategy to hedge against rising interest rates, the stated value of $600,000 is incorrect. The swap’s value represents the net cash flows or exposure at the time of undertaking the swap, and in this case, it begins with a value of $0 because the swap is constructed to offset risk rather than having an immediate gain or loss. Thus, assigning a value of $600,000 is misleading and does not align with the mechanics of the swap&#x27;s construction or purpose.<\/p><p><b>B is incorrect.<\/b> Goldberg Inc.’s objective is to hedge against rising interest rates, which increases borrowing costs. A floating/receive fixed swap would expose the company further to interest rate risk rather than protect it. To achieve stability and mitigate the risk of higher rates, Goldberg Inc. must enter a pay fixed/receive floating swap, not the opposite. Similar to choice A, the swap initially has a value of $0 because it is designed to neutralize interest rate risk rather than immediately generate a profit or loss. A value of -$600,000 does not accurately reflect the net position at initiation.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe and compare how interest rate, currency, and equity swaps are priced and valued.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Myke &amp; Motley Asset Managers (M&amp;M)<\/summary><div class=\"vig-body\"><p>Myke &amp; Motley Asset Managers (M&amp;M) arranges derivative contracts for their clients. The<\/p><p>majority of their clients are high-net-worth, U.S.-based individuals. In addition to their U.S.<\/p><p>operations, M&amp;M has contracts denominated in international currencies.<\/p><p>Goldberg Inc., a U.S. gold mining company, is planning to expand its operations in South Africa.<\/p><p>To finance this expansion, the company is looking to issue $12 million worth of bonds. During a<\/p><p>prior meeting between Goldberg Inc. and M&amp;M, Goldberg’s CEO expressed concerns regarding<\/p><p>the proposed bond issue, arguing that it would increase the company’s gearing, potentially<\/p><p>raising borrowing costs. The M&amp;M team agreed with the CEO and stated, “We need a strategy<\/p><p>that will protect us from the effect of rising interest rates on borrowing costs.”<\/p><p>The M&amp;M team proposed a one-year interest rate swap based on a notional principal of $12<\/p><p>million. The swap payments will be made semi-annually. Information regarding the term<\/p><p>structure is provided in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0307.webp\" style=\"max-width:min(100%,274px)\" alt=\"Exhibit 1: Current Term Structure Days LIBOR (%) 180 10.62 360 10.73\"><p>Goldberg’s CEO asked the M&amp;M team to explain how a swap contract is constructed, to which<\/p><p>the team replied:<\/p><p>Statement 1: “Swaps can also be built using options, with each option&#x27;s expiration date aligning<\/p><p>with the swap payment schedule. For example, a pay-fixed swap can be replicated by purchasing<\/p><p>a call option while simultaneously selling a put option.”<\/p><p>Statement 2: “Swap contracts can be created using either forward or futures contracts. For<\/p><p>forward contracts, a sequence of forward agreements priced consistently with the swap rate can<\/p><p>be utilized to construct the swap. However, futures contracts can only serve this purpose when<\/p><p>future interest rates are guaranteed, effectively equating them to forward contracts.”<\/p><p>M&amp;M also caters to the needs of Maxmill Ltd, a steel manufacturing company. To manage<\/p><p>Maxmill’s risk, M&amp;M uses FRAs and swaps. M&amp;M evaluates a four-year, MRR-based interest rate swap with annual resets by utilizing the present value factors provided in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0308.webp\" style=\"max-width:min(100%,258px)\" alt=\"Exhibit 2: Present Value Factors Years PV Factors 1 0.980 2 0.961 3 0.942 4 0.924\"><p>M&amp;M applies the present value factors from Exhibit 2 to calculate the value of an interest rate<\/p><p>swap initiated one year ago, where the bank acts as the pay-fixed (receive-floating) counterparty.<\/p><p>Relevant data for the swap is outlined in Exhibit 3. Additionally, M&amp;M observes that the<\/p><p>prevailing equilibrium two-year fixed swap rate is 2.02%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0309.webp\" style=\"max-width:min(100%,491px)\" alt=\"Exhibit 3: Selected Fixed for Floating Interest Rate Swap Data Swap notional amount $65 million Fixed swap rate 4.20% Original swap term 4 years\"><\/div><\/details><div class=\"qtext\"><p>What type of swap will Goldberg Inc. undertake and what is the approximate value of the swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 78, "q": "The CFO is most accurate regarding statement ?", "opts": ["Statement 1.", "Statement 2.", "Both statement 1 or 2."], "ans": "C", "expl": "Statement 1: The CFO is correct in stating that swaps can be constructed using options. A pay-fixed swap, for instance, can be replicated by purchasing a call option and simultaneously selling a put option, with the options' expiration dates aligned with the swap payment schedule. This method mirrors the cash flow structure of a pay-fixed swap and is an established financial technique. Statement 2: This statement is also accurate. Swaps can be constructed using forward contracts priced consistently with the swap rate. Similarly, futures contracts can be used under the condition that future interest rates are certain, making them equivalent to forward contracts. This explanation aligns with how swaps are structured in practice and demonstrates an understanding of the mechanics of such derivatives. A is incorrect. It implies that only Statement 1 is correct, while Statement 2 is inaccurate. This is not true because Statement 2 provides a valid explanation of how swaps can be constructed using forwards or futures. Rejecting Statement 2 would ignore the financial principles supporting this method of swap construction. B is incorrect. It suggests that only Statement 2 is accurate, while Statement 1 is flawed. However, Statement 1 correctly explains how swaps can be built using options with expirations matching the swap payment schedule. To dismiss Statement 1 would be to disregard a well-recognized strategy for replicating swaps.", "explhtml": "<p>Statement 1: The CFO is correct in stating that swaps can be constructed using options. A pay-fixed swap, for instance, can be replicated by purchasing a call option and simultaneously selling a put option, with the options&#x27; expiration dates aligned with the swap payment schedule. This method mirrors the cash flow structure of a pay-fixed swap and is an established financial technique.<\/p><p>Statement 2: This statement is also accurate. Swaps can be constructed using forward contracts priced consistently with the swap rate. Similarly, futures contracts can be used under the condition that future interest rates are certain, making them equivalent to forward contracts. This explanation aligns with how swaps are structured in practice and demonstrates an understanding of the mechanics of such derivatives.<\/p><p><b>A is incorrect.<\/b> It implies that only Statement 1 is correct, while Statement 2 is inaccurate. This is not true because Statement 2 provides a valid explanation of how swaps can be constructed using forwards or futures. Rejecting Statement 2 would ignore the financial principles supporting this method of swap construction.<\/p><p><b>B is incorrect.<\/b> It suggests that only Statement 2 is accurate, while Statement 1 is flawed. However, Statement 1 correctly explains how swaps can be built using options with expirations matching the swap payment schedule. To dismiss Statement 1 would be to disregard a well-recognized strategy for replicating swaps.<\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe and compare how interest rate, currency, and equity swaps are priced and valued.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · Myke &amp; Motley Asset Managers (M&amp;M)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Myke &amp; Motley Asset Managers (M&amp;M) arranges derivative contracts for their clients. The<\/p><p>majority of their clients are high-net-worth, U.S.-based individuals. In addition to their U.S.<\/p><p>operations, M&amp;M has contracts denominated in international currencies.<\/p><p>Goldberg Inc., a U.S. gold mining company, is planning to expand its operations in South Africa.<\/p><p>To finance this expansion, the company is looking to issue $12 million worth of bonds. During a<\/p><p>prior meeting between Goldberg Inc. and M&amp;M, Goldberg’s CEO expressed concerns regarding<\/p><p>the proposed bond issue, arguing that it would increase the company’s gearing, potentially<\/p><p>raising borrowing costs. The M&amp;M team agreed with the CEO and stated, “We need const CFG = {"title": "AnalystPrep — Derivatives", "subtitle": "CFA Level II · 80 câu · 20 item sets · AnalystPrep 2026", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,

  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];

    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

}

      }})

  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
</body>
</html>
