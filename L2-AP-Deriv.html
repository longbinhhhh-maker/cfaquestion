min(100%,295px)\" alt=\"150-day LIBOR 11.35%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0069.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 12.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0070.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 13.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0071.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 14.00%\"><p>Thirty days after entering into the FRA agreement, the yield curve shifted upward. As a result, the term structure of interest rates is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0072.webp\" style=\"max-width:min(100%,290px)\" alt=\"Exhibit 2 Term Structure of Interest Rates\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0073.webp\" style=\"max-width:min(100%,295px)\" alt=\"Current LIBOR 7.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0074.webp\" style=\"max-width:min(100%,295px)\" alt=\"30-day LIBOR 7.65%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0075.webp\" style=\"max-width:min(100%,295px)\" alt=\"60-day LIBOR 8.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0076.webp\" style=\"max-width:min(100%,295px)\" alt=\"90-day LIBOR 9.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0077.webp\" style=\"max-width:min(100%,295px)\" alt=\"120-day LIBOR 11.25%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0078.webp\" style=\"max-width:min(100%,295px)\" alt=\"150-day LIBOR 13.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0079.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 14.24%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0080.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 15.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0081.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 15.25%\"><p>Janice Howell, CFA, is a portfolio manager and owner of an asset management firm. She conducts her investing activities from the U.S. Her clients&#x27; portfolios comprise of global securities and are thus exposed to significant currency risk. Howell enters into currency forward contracts denominated in Australian dollars to protect the portfolios from losses due to exchange rate fluctuations. Since Australian stocks are a favorite among her clients, Howell deems it essential to hedge the inherent foreign exchange risk. The U.S. and Australian risk-free rates are 3.50% and 5.00%, respectively. The contract will expire in three months and has a current price of USD 0.98 per AUD.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the value of the FRA agreement 30 days following contract initiation (Use the information in Exhibit 2 and the initial rate on the FRA agreement undertaken by Test Manufacturing)?<\/p><\/div>", "subj": "derivatives"}, {"n": 17, "q": "Two American put options with the same exercise prices as Options Y and Z are being evaluated by Saranne. She deduces that similarly to European put options, their value will increase with greater time to expiration. This deduction is most likely:", "opts": ["Correct.", "Incorrect, European Options do not necessarily increase with greater time to expiration.", "Incorrect, the BSM model is not applicable to American Options and therefore, their value will not increase in relation to time to expiration."], "ans": "B", "expl": "The correct answer is option B because it addresses the nuanced behavior of European options with respect to time to expiration. European options, unlike their American counterparts, do not always increase in value as the expiration time increases. This is primarily due to the fact that while longer durations can indeed increase the potential for volatility, they simultaneously reduce the present value of the expected payoff at expiration. The value of a European option is essentially the present value of its expected payoff, discounted back to the present using a risk-free rate. As the time to expiration increases, the discount factor increases, which can reduce the present value of the payoff. This interplay between increased volatility and decreased present value makes the behavior of European options' values with respect to time to expiration less straightforward and not necessarily always increasing. A is incorrect. The statement that American put options increase in value as the time to expiration increases is generally true due to the added flexibility they offer over European options, including the ability to exercise at any time prior to and including the expiration date. This flexibility can indeed increase their value as the expiration extends. However, the statement in option A that this reasoning applies similarly to European put options is incorrect. European options can only be exercised at expiration, which means their value's dependency on time is influenced more by volatility and the discount rate, rather than the flexibility of exercise. C is incorrect. While it is true that the Black-Scholes-Merton (BSM) model primarily applies to European options due to its assumptions of no early exercise, the reasoning provided in option C is flawed. The statement that American options' values will not increase in relation to time to expiration is incorrect. American options generally increase in value with more time to expiration due to the greater flexibility they offer. The BSM model's inapplicability to American options does not imply that their value does not increase with time; rather, it suggests that a different valuation model might be needed to accurately capture their value. ", "explhtml": "<p>The correct answer is option B because it addresses the nuanced behavior of European options with respect to time to expiration. European options, unlike their American counterparts, do not always increase in value as the expiration time increases. This is primarily due to the fact that while longer durations can indeed increase the potential for volatility, they simultaneously reduce the present value of the expected payoff at expiration. The value of a European option is essentially the present value of its expected payoff, discounted back to the present using a risk-free rate. As the time to expiration increases, the discount factor increases, which can reduce the present value of the payoff. This interplay between increased volatility and decreased present value makes the behavior of European options&#x27; values with respect to time to expiration less straightforward and not necessarily always increasing.<\/p><p><b>A is incorrect<\/b>. The statement that American put options increase in value as the time to expiration increases is generally true due to the added flexibility they offer over European options, including the ability to exercise at any time prior to and including the expiration date. This flexibility can indeed increase their value as the expiration extends. However, the statement in option A that this reasoning applies similarly to European put options is incorrect. European options can only be exercised at expiration, which means their value&#x27;s dependency on time is influenced more by volatility and the discount rate, rather than the flexibility of exercise.<\/p><p><b>C is incorrect<\/b>. While it is true that the Black-Scholes-Merton (BSM) model primarily applies to European options due to its assumptions of no early exercise, the reasoning provided in option C is flawed. The statement that American options&#x27; values will not increase in relation to time to expiration is incorrect. American options generally increase in value with more time to expiration due to the greater flexibility they offer. The BSM model&#x27;s inapplicability to American options does not imply that their value does not increase with time; rather, it suggests that a different valuation model might be needed to accurately capture their value. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (e): Describe how the value of a European option can be analyzed as the present value of the option’s expected payoff at expiration<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Saranne Coates<\/summary><div class=\"vig-body\"><p>Saranne Coates is a derivative analyst at Georgia Advisory Firm located in Detroit, U.S.A. Her job description includes forecasting short-term price movements in stocks. Her current stock price forecast for FireMatt Inc. is $200. The current economic conditions have triggered increasingly fluctuating prices, and Coates believes that the volatility will only continue to increase. However, her immediate supervisor, Elisabeth Connor, considers FireMatt stock a blue chip investment with fairly stable historical stock prices. She expects the stock value to remain nearly constant in the future.<\/p><p>FireMatt Inc. is a pioneer in renewable energy generation, and Saranne expects them to launch an efficient solar panel within a year, increasing the value of the company’s stock. As this news trickles through the market, there has been a spike in premiums for call options. <\/p><p>Exhibit 1 summarizes the one-year European options available on FireMatt: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0095.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0096.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option X Option Y Option Z\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0097.webp\" style=\"max-width:min(100%,608px)\" alt=\"Type of Option Call Put Put\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0098.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise Price ($) 220 180 200\"><p>Saranne’s clients have purchased one-year call options on FireMatt stocks. Expected dividends within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0099.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0100.webp\" style=\"max-width:min(100%,548px)\" alt=\"6 months 12 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0101.webp\" style=\"max-width:min(100%,548px)\" alt=\"Dividends ($) 1.45 1.75\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Saranne made the following statements about the model&#x27;s assumptions:<\/p><p>Statement 1:   “It is prudent to calculate the implied volatility of the stock you are analyzing as historical volatility does not incorporate the effect of future expected events. However, for the application of the BSM model, we need a known and constant volatility rate, which is why it can only correctly analyze European Options.”<\/p><p>Statement 2:   “If a short sale on the underlying asset results in immediate cash flows, the cash flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is important because the risk-free rate would fluctuate if we invested in an asset with cash flows higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>Two American put options with the same exercise prices as Options Y and Z are being evaluated by Saranne. She deduces that similarly to European put options, their value will increase with greater time to expiration. This deduction is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 18, "q": "Determine whether the statement regarding the volatility considered while valuing options is correct with regard to Implied and historical volatility rates, and the assumption with its reasoning for inclusion in the BSM model.", "opts": ["Correct", "Incorrect, implied volatility does not incorporate future expected events.", "Incorrect, the reasoning behind the volatility assumption is wrong."], "ans": "C", "expl": "The Black-Scholes-Merton (BSM) model is a fundamental tool in financial mathematics used for pricing European options. One of its key assumptions is that the volatility of the underlying asset is constant over the life of the option. This assumption simplifies the model and makes it mathematically tractable. However, in reality, volatility is not constant and can be influenced by market dynamics and future events. Implied volatility, which is derived from the market prices of options, reflects the market's expectation of future volatility and incorporates upcoming events and uncertainties. Saranne's statement that historical volatility does not consider future events is accurate, which is why implied volatility is often preferred for more accurate option pricing. However, the claim that the constant volatility assumption is the reason why the BSM model can only analyze European options is incorrect. The BSM model primarily applies to European options because they can only be exercised at expiration, not because of volatility assumptions. American options, which can be exercised at any time before and at expiration, require more complex modeling to account for the timing of exercise decisions. The reasoning behind the volatility assumption in the BSM model is indeed incorrect as stated by Saranne. While it is true that the BSM model assumes constant volatility for the reasons of mathematical simplicity and model stability, this assumption does not restrict the model's application solely to European options. The primary reason the BSM model is used for European options is due to the nature of these options, which can only be exercised at their expiration date, simplifying their mathematical treatment under the model. The incorrect linkage between volatility assumption and the type of options applicable under the BSM model is why this option is correct. A is incorrect. The statement is not entirely correct, as it correctly identifies the role of implied and historical volatility. Implied volatility does indeed incorporate expectations about future events, which historical volatility, being a measure based on past price movements, does not. The BSM model uses a constant volatility assumption for mathematical simplicity and tractability, not because it is the only type of volatility that can be used. The model's limitation to European options is due to their exercise restrictions, not volatility assumptions. B is incorrect. This option is incorrect because it states that implied volatility does not incorporate future expected events, which is false. Implied volatility is specifically valued by the market and includes adjustments based on traders' collective expectations about future volatility and other market factors. It is a forward-looking measure, unlike historical volatility, which is backward-looking. Therefore, the statement in option B misrepresents the nature of implied volatility and its relevance in option pricing. ", "explhtml": "<p>The Black-Scholes-Merton (BSM) model is a fundamental tool in financial mathematics used for pricing European options. One of its key assumptions is that the volatility of the underlying asset is constant over the life of the option. This assumption simplifies the model and makes it mathematically tractable. However, in reality, volatility is not constant and can be influenced by market dynamics and future events. Implied volatility, which is derived from the market prices of options, reflects the market&#x27;s expectation of future volatility and incorporates upcoming events and uncertainties. Saranne&#x27;s statement that historical volatility does not consider future events is accurate, which is why implied volatility is often preferred for more accurate option pricing. However, the claim that the constant volatility assumption is the reason why the BSM model can only analyze European options is incorrect. The BSM model primarily applies to European options because they can only be exercised at expiration, not because of volatility assumptions. American options, which can be exercised at any time before and at expiration, require more complex modeling to account for the timing of exercise decisions.<\/p><p>The reasoning behind the volatility assumption in the BSM model is indeed incorrect as stated by Saranne. While it is true that the BSM model assumes constant volatility for the reasons of mathematical simplicity and model stability, this assumption does not restrict the model&#x27;s application solely to European options. The primary reason the BSM model is used for European options is due to the nature of these options, which can only be exercised at their expiration date, simplifying their mathematical treatment under the model. The incorrect linkage between volatility assumption and the type of options applicable under the BSM model is why this option is correct.<\/p><p><b>A is incorrect<\/b>. The statement is not entirely correct, as it correctly identifies the role of implied and historical volatility. Implied volatility does indeed incorporate expectations about future events, which historical volatility, being a measure based on past price movements, does not. The BSM model uses a constant volatility assumption for mathematical simplicity and tractability, not because it is the only type of volatility that can be used. The model&#x27;s limitation to European options is due to their exercise restrictions, not volatility assumptions.<\/p><p><b>B is incorrect<\/b>. This option is incorrect because it states that implied volatility does not incorporate future expected events, which is false. Implied volatility is specifically valued by the market and includes adjustments based on traders&#x27; collective expectations about future volatility and other market factors. It is a forward-looking measure, unlike historical volatility, which is backward-looking. Therefore, the statement in option B misrepresents the nature of implied volatility and its relevance in option pricing. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (f): Identify assumptions of the Black–Scholes–Merton option valuation model<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Saranne Coates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Saranne Coates is a derivative analyst at Georgia Advisory Firm located in Detroit, U.S.A. Her job description includes forecasting short-term price movements in stocks. Her current stock price forecast for FireMatt Inc. is $200. The current economic conditions have triggered increasingly fluctuating prices, and Coates believes that the volatility will only continue to increase. However, her immediate supervisor, Elisabeth Connor, considers FireMatt stock a blue chip investment with fairly stable historical stock prices. She expects the stock value to remain nearly constant in the future.<\/p><p>FireMatt Inc. is a pioneer in renewable energy generation, and Saranne expects them to launch an efficient solar panel within a year, increasing the value of the company’s stock. As this news trickles through the market, there has been a spike in premiums for call options. <\/p><p>Exhibit 1 summarizes the one-year European options available on FireMatt: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0095.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0096.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option X Option Y Option Z\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0097.webp\" style=\"max-width:min(100%,608px)\" alt=\"Type of Option Call Put Put\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0098.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise Price ($) 220 180 200\"><p>Saranne’s clients have purchased one-year call options on FireMatt stocks. Expected dividends within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0099.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0100.webp\" style=\"max-width:min(100%,548px)\" alt=\"6 months 12 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0101.webp\" style=\"max-width:min(100%,548px)\" alt=\"Dividends ($) 1.45 1.75\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Saranne made the following statements about the model&#x27;s assumptions:<\/p><p>Statement 1:   “It is prudent to calculate the implied volatility of the stock you are analyzing as historical volatility does not incorporate the effect of future expected events. However, for the application of the BSM model, we need a known and constant volatility rate, which is why it can only correctly analyze European Options.”<\/p><p>Statement 2:   “If a short sale on the underlying asset results in immediate cash flows, the cash flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is important because the risk-free rate would fluctuate if we invested in an asset with cash flows higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>Determine whether the statement regarding the volatility considered while valuing options is correct with regard to Implied and historical volatility rates, and the assumption with its reasoning for inclusion in the BSM model.<\/p><\/div>", "subj": "derivatives"}, {"n": 19, "q": "The second statement made by Saranne is most likely:", "opts": ["Correct.", "Incorrect, short sale proceeds need not be invested at the risk-free rate.", "Incorrect, the underlying asset cannot be sold short while a derivative is based on it."], "ans": "B", "expl": "The Black-Scholes-Merton (BSM) model, a fundamental tool in financial derivatives valuation, operates under specific assumptions about market behavior and the treatment of cash flows from trading activities. One of these assumptions is the unrestricted ability to sell the underlying asset short and to use the proceeds from the short sale as the investor sees fit. This flexibility is crucial because it allows traders to replicate the payoff of an option, thereby enabling the model to price the option accurately. The proceeds from a short sale do not necessarily have to be reinvested at the risk-free rate; they can be used in various ways that suit the investor's strategy and risk management practices. This flexibility in the use of proceeds helps in maintaining the no-arbitrage condition, which is a core principle in the BSM model's framework. A is incorrect. The statement that short sale proceeds must be invested at the risk-free rate to generate a risk-free return is a misunderstanding of the BSM model's assumptions. While investing in risk-free assets like Treasury Bills is a common strategy to achieve a risk-free return, the BSM model itself does not mandate such an investment. The model primarily requires that the funds be used in a way that supports the no-arbitrage condition, which can include a variety of investment options, not limited to those yielding the risk-free rate. This flexibility is essential for the proper functioning of the model in a dynamic market environment. C is incorrect. This option is based on a misconception about the relationship between the underlying asset and its derivatives. The ability to sell short the underlying asset is not only permitted but is a necessary component of many derivatives strategies, including those involving options. The BSM model, in particular, assumes the possibility of continuous trading and short selling of the underlying asset. This capability is crucial for creating a replicating portfolio that mimics the returns of the option, thereby enabling accurate pricing through the model. The statement that an underlying asset cannot be sold short while a derivative is based on it is incorrect and misrepresents the flexibility allowed in derivative markets. ", "explhtml": "<p>The Black-Scholes-Merton (BSM) model, a fundamental tool in financial derivatives valuation, operates under specific assumptions about market behavior and the treatment of cash flows from trading activities. One of these assumptions is the unrestricted ability to sell the underlying asset short and to use the proceeds from the short sale as the investor sees fit. This flexibility is crucial because it allows traders to replicate the payoff of an option, thereby enabling the model to price the option accurately. The proceeds from a short sale do not necessarily have to be reinvested at the risk-free rate; they can be used in various ways that suit the investor&#x27;s strategy and risk management practices. This flexibility in the use of proceeds helps in maintaining the no-arbitrage condition, which is a core principle in the BSM model&#x27;s framework.<\/p><p><b>A is incorrect<\/b>. The statement that short sale proceeds must be invested at the risk-free rate to generate a risk-free return is a misunderstanding of the BSM model&#x27;s assumptions. While investing in risk-free assets like Treasury Bills is a common strategy to achieve a risk-free return, the BSM model itself does not mandate such an investment. The model primarily requires that the funds be used in a way that supports the no-arbitrage condition, which can include a variety of investment options, not limited to those yielding the risk-free rate. This flexibility is essential for the proper functioning of the model in a dynamic market environment.<\/p><p><b>C is incorrect<\/b>. This option is based on a misconception about the relationship between the underlying asset and its derivatives. The ability to sell short the underlying asset is not only permitted but is a necessary component of many derivatives strategies, including those involving options. The BSM model, in particular, assumes the possibility of continuous trading and short selling of the underlying asset. This capability is crucial for creating a replicating portfolio that mimics the returns of the option, thereby enabling accurate pricing through the model. The statement that an underlying asset cannot be sold short while a derivative is based on it is incorrect and misrepresents the flexibility allowed in derivative markets. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (f): Identify assumptions of the Black–Scholes–Merton option valuation model<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Saranne Coates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Saranne Coates is a derivative analyst at Georgia Advisory Firm located in Detroit, U.S.A. Her job description includes forecasting short-term price movements in stocks. Her current stock price forecast for FireMatt Inc. is $200. The current economic conditions have triggered increasingly fluctuating prices, and Coates believes that the volatility will only continue to increase. However, her immediate supervisor, Elisabeth Connor, considers FireMatt stock a blue chip investment with fairly stable historical stock prices. She expects the stock value to remain nearly constant in the future.<\/p><p>FireMatt Inc. is a pioneer in renewable energy generation, and Saranne expects them to launch an efficient solar panel within a year, increasing the value of the company’s stock. As this news trickles through the market, there has been a spike in premiums for call options. <\/p><p>Exhibit 1 summarizes the one-year European options available on FireMatt: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0095.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0096.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option X Option Y Option Z\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0097.webp\" style=\"max-width:min(100%,608px)\" alt=\"Type of Option Call Put Put\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0098.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise Price ($) 220 180 200\"><p>Saranne’s clients have purchased one-year call options on FireMatt stocks. Expected dividends within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0099.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0100.webp\" style=\"max-width:min(100%,548px)\" alt=\"6 months 12 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0101.webp\" style=\"max-width:min(100%,548px)\" alt=\"Dividends ($) 1.45 1.75\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Saranne made the following statements about the model&#x27;s assumptions:<\/p><p>Statement 1:   “It is prudent to calculate the implied volatility of the stock you are analyzing as historical volatility does not incorporate the effect of future expected events. However, for the application of the BSM model, we need a known and constant volatility rate, which is why it can only correctly analyze European Options.”<\/p><p>Statement 2:   “If a short sale on the underlying asset results in immediate cash flows, the cash flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is important because the risk-free rate would fluctuate if we invested in an asset with cash flows higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>The second statement made by Saranne is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 20, "q": "If the underlying asset makes a cash payment, it is more feasible to buy an:", "opts": ["American Call Option.", "European Call Option.", "European Put Option."], "ans": "A", "expl": "When considering the impact of cash payments such as dividends on the valuation of options, American options generally provide more flexibility and potential benefit compared to European options. This is particularly true for call options. American call options can be exercised at any time before and including the day of expiration, which allows the holder to capture dividends by exercising the option just before the ex-dividend date. By exercising early, the holder can own the stock and receive the dividend, which would not be possible with a European call option since it can only be exercised on the expiration date. This strategic advantage of capturing dividend payments makes American call options particularly attractive when the underlying asset issues significant dividends. This is supported by financial theories and models that suggest option value can be critically dependent on dividend payments and timing of these payments. B is incorrect. European call options do not offer the flexibility of early exercise, which is a significant disadvantage when dealing with underlying assets that make cash payments such as dividends. Holders of European call options can only exercise their option at the expiration date, which means they cannot capture dividends unless they are paid out exactly at expiration, an unlikely scenario. This inability to exercise the option early to capture dividends generally makes European call options less valuable compared to their American counterparts in scenarios where the underlying asset pays dividends during the life of the option. C is incorrect. European put options, similar to European call options, can only be exercised at the expiration date. While put options are generally used to hedge against or benefit from a decline in the underlying asset's price, the timing of dividends does not typically incentivize early exercise in the same way it does with call options. Holders of a European put option would not benefit from dividends in a direct manner; instead, their strategy revolves around the anticipated decrease in the stock's price, potentially exacerbated by the stock's drop in value post-dividend payout. However, this does not provide a direct mechanism to capitalize on the dividend payments themselves, making this option less relevant in the context of capturing dividend payments. ", "explhtml": "<p>When considering the impact of cash payments such as dividends on the valuation of options, American options generally provide more flexibility and potential benefit compared to European options. This is particularly true for call options. American call options can be exercised at any time before and including the day of expiration, which allows the holder to capture dividends by exercising the option just before the ex-dividend date. By exercising early, the holder can own the stock and receive the dividend, which would not be possible with a European call option since it can only be exercised on the expiration date. This strategic advantage of capturing dividend payments makes American call options particularly attractive when the underlying asset issues significant dividends. This is supported by financial theories and models that suggest option value can be critically dependent on dividend payments and timing of these payments.<\/p><p><b>B is incorrect<\/b>. European call options do not offer the flexibility of early exercise, which is a significant disadvantage when dealing with underlying assets that make cash payments such as dividends. Holders of European call options can only exercise their option at the expiration date, which means they cannot capture dividends unless they are paid out exactly at expiration, an unlikely scenario. This inability to exercise the option early to capture dividends generally makes European call options less valuable compared to their American counterparts in scenarios where the underlying asset pays dividends during the life of the option.<\/p><p><b>C is incorrect<\/b>. European put options, similar to European call options, can only be exercised at the expiration date. While put options are generally used to hedge against or benefit from a decline in the underlying asset&#x27;s price, the timing of dividends does not typically incentivize early exercise in the same way it does with call options. Holders of a European put option would not benefit from dividends in a direct manner; instead, their strategy revolves around the anticipated decrease in the stock&#x27;s price, potentially exacerbated by the stock&#x27;s drop in value post-dividend payout. However, this does not provide a direct mechanism to capitalize on the dividend payments themselves, making this option less relevant in the context of capturing dividend payments. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (b): Calculate the no-arbitrage values of European and American options using a two-period binomial model<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Saranne Coates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Saranne Coates is a derivative analyst at Georgia Advisory Firm located in Detroit, U.S.A. Her job description includes forecasting short-term price movements in stocks. Her current stock price forecast for FireMatt Inc. is $200. The current economic conditions have triggered increasingly fluctuating prices, and Coates believes that the volatility will only continue to increase. However, her immediate supervisor, Elisabeth Connor, considers FireMatt stock a blue chip investment with fairly stable historical stock prices. She expects the stock value to remain nearly constant in the future.<\/p><p>FireMatt Inc. is a pioneer in renewable energy generation, and Saranne expects them to launch an efficient solar panel within a year, increasing the value of the company’s stock. As this news trickles through the market, there has been a spike in premiums for call options. <\/p><p>Exhibit 1 summarizes the one-year European options available on FireMatt: <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0095.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0096.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option X Option Y Option Z\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0097.webp\" style=\"max-width:min(100%,608px)\" alt=\"Type of Option Call Put Put\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0098.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise Price ($) 220 180 200\"><p>Saranne’s clients have purchased one-year call options on FireMatt stocks. Expected dividends within this time are highlighted in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0099.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0100.webp\" style=\"max-width:min(100%,548px)\" alt=\"6 months 12 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0101.webp\" style=\"max-width:min(100%,548px)\" alt=\"Dividends ($) 1.45 1.75\"><p>While explaining the Black-Scholes-Merton model to a junior analyst, Saranne made the following statements about the model&#x27;s assumptions:<\/p><p>Statement 1:   “It is prudent to calculate the implied volatility of the stock you are analyzing as historical volatility does not incorporate the effect of future expected events. However, for the application of the BSM model, we need a known and constant volatility rate, which is why it can only correctly analyze European Options.”<\/p><p>Statement 2:   “If a short sale on the underlying asset results in immediate cash flows, the cash flows need to be immediately invested in Treasury Bills to generate a risk-free return. This is important because the risk-free rate would fluctuate if we invested in an asset with cash flows higher or lower than the risk-free rate.”<\/p><\/div><\/details><div class=\"qtext\"><p>If the underlying asset makes a cash payment, it is more feasible to buy an:<\/p><\/div>", "subj": "derivatives"}, {"n": 21, "q": "In the context of the facts discussed by the executive, which of the following facts has been least accurately outlined?", "opts": ["1", "2", "Neither 1 nor 2."], "ans": "C", "expl": "Fact 1 and Fact 2, as outlined by the executive, both provide accurate descriptions of how swap contracts can be constructed using derivative instruments. Fact 1 explains that swap contracts can be constructed using a series of forward contracts, each priced at the same rate as the swap rate, or using futures contracts when future interest rates are certain. This description is correct as it aligns with the fundamental principles of financial derivatives where forwards and futures serve as commitments to future transactions at predetermined rates, thus providing a basis for swap construction. A is incorrect. Fact 1 is accurately outlined because it correctly identifies the relationship between swaps and forward contracts. In financial derivatives, a swap can indeed be seen as a series of forward rate agreements where each segment of the swap is essentially a forward contract that has been standardized to the terms of the swap agreement. The statement that futures can only be used when future interest rates are certain is a simplification but serves to highlight the typical use of futures in constructing swaps under stable interest rate predictions, thus making the explanation provided both practical and relevant to typical market conditions. B is incorrect. Fact 2 is also accurately outlined as it describes the construction of a swap using options. The explanation that a pay-fixed swap can be replicated by buying a call option and selling a put option is a valid strategy known as a collar strategy in options trading. This strategy effectively locks in the maximum and minimum rates that the pay-fixed party would receive or pay, which mirrors the cash flows of a fixed-for-floating interest rate swap. The description provided by the executive correctly captures the essence of how options can be used to simulate the payments and receipts of a swap contract. ", "explhtml": "<p>Fact 1 and Fact 2, as outlined by the executive, both provide accurate descriptions of how swap contracts can be constructed using derivative instruments. Fact 1 explains that swap contracts can be constructed using a series of forward contracts, each priced at the same rate as the swap rate, or using futures contracts when future interest rates are certain. This description is correct as it aligns with the fundamental principles of financial derivatives where forwards and futures serve as commitments to future transactions at predetermined rates, thus providing a basis for swap construction.<\/p><p><b>A is incorrect<\/b>. Fact 1 is accurately outlined because it correctly identifies the relationship between swaps and forward contracts. In financial derivatives, a swap can indeed be seen as a series of forward rate agreements where each segment of the swap is essentially a forward contract that has been standardized to the terms of the swap agreement. The statement that futures can only be used when future interest rates are certain is a simplification but serves to highlight the typical use of futures in constructing swaps under stable interest rate predictions, thus making the explanation provided both practical and relevant to typical market conditions.<\/p><p><b>B is incorrect<\/b>. Fact 2 is also accurately outlined as it describes the construction of a swap using options. The explanation that a pay-fixed swap can be replicated by buying a call option and selling a put option is a valid strategy known as a collar strategy in options trading. This strategy effectively locks in the maximum and minimum rates that the pay-fixed party would receive or pay, which mirrors the cash flows of a fixed-for-floating interest rate swap. The description provided by the executive correctly captures the essence of how options can be used to simulate the payments and receipts of a swap contract. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe and compare how interest rate, currency, and equity swaps are priced and valued<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Terisemo Associates<\/summary><div class=\"vig-body\"><p>Terisemo Associates arranges derivative contracts on behalf of its clients. The firm’s client base is dominated by corporate clients and a few high net-worth individuals. In addition to domestic U.S. clients, Terisemo Associates has also ventured into international markets where contracts are denominated in international currencies. <\/p><p>Furnace Works Ltd., a U.S. steel manufacturer, seeks to expand its production with an eye on a global outreach to boost its financial performance. The manufacturer will need to issue bonds worth $6 million to fund the expansion. However, in a meeting between the CEO and a Terisemo Associates executive to discuss potential financial issues, the CEO expresses his concerns about rising interest rates, which may increase the manufacturing firm’s borrowing costs. The CEO states, “We need a strategy which will protect us from the effects of rising interest rates on borrowing costs.”<\/p><p>The executive states that the best strategy for Furnace Works Ltd. would be to undertake a 1.5 years interest rate swap contract based on a notional principal of $6 million. Swap payments will be made on a semi-annual basis. The current term structure is illustrated in the exhibit below (exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0102.webp\" style=\"max-width:min(100%,214px)\" alt=\"Exhibit 1 Current Term Structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0103.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0104.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 9.23\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0105.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 9.31\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0106.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 9.42\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0107.webp\" style=\"max-width:min(100%,284px)\" alt=\"720 9.75\"><p>Additionally, the CEO asks the executive how swap contracts can be constructed using derivative instruments. The executive replies by sharing two facts:<\/p><p>Fact 1: “Swap contracts may be constructed using forwards and futures. In the case of the former, a series of forward contracts each priced at the same rate as the swap rate may be used to construct a swap. Futures contracts may only be used to construct swaps when future interest rates are certain (making them equivalent to forward contracts).”<\/p><p>Fact 2: “A swap can be constructed from options each with expirations corresponding to the swap payment dates. For instance, a pay fixed swap can be replicated by buying a call option and selling a put option.”<\/p><p>Alpha Corp., a local construction firm, won a bid for a construction project in Spain. The firm had to borrow some $25 million (converted into U.S. $) to finance the project. However, high quoted borrowing rates from Spanish banks (in the foreign country) discouraged the firm from seeking financing within Spain. To resolve the firm’s financing concerns, Terisemo Associates had identified a Spanish construction firm, Beta Build, in the same situation as Alpha Corp. Beta Build’s project involved the construction of an art gallery in the United States. A senior manager at Terisemo Associates arranged a meeting between executives of the two construction firms and recommended both parties engage in a currency swap. The recommended swap was a two-year contract covering both parties’ loan period with semi-annual payments. Beta Build was to pay a fixed rate of 3.45%, and Alpha Corp. a floating rate. The term structure - applicable to both construction firms 180 days into the swap - is illustrated below (exhibit 2). The exchange rate at swap initiation was $0.85 per €1. The current exchange rate is $0.90 per €1. The LIBOR at contract initiation was 4.00%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0108.webp\" style=\"max-width:min(100%,296px)\" alt=\"Exhibit 2 Spanish and U.S. Term Structures\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0109.webp\" style=\"max-width:min(100%,400px)\" alt=\"Days Euribor (%) LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0110.webp\" style=\"max-width:min(100%,400px)\" alt=\"180 3.00% 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0111.webp\" style=\"max-width:min(100%,400px)\" alt=\"360 3.12% 5.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0112.webp\" style=\"max-width:min(100%,400px)\" alt=\"540 3.25% 5.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0113.webp\" style=\"max-width:min(100%,400px)\" alt=\"720 3.35% 6.30%\"><p>Terisemo Associates is conducting a workshop for its employees to educate them further on the mechanics of swaps. The workshop will feature a discussion by Dustin Hughes, a senior analyst who has been following the derivatives market for many years. During the workshop Hughes introduces the concept of swaptions. He states, “The added benefit of a swaption is investor flexibility. An investor may have several motives for entering into a swaption.”<\/p><p>To carry his discussion further, Hughes attempts to demonstrate the mechanics of swaptions by walking the firm’s employees through a series of illustrations. The exhibit below (exhibit 3) contains term structure information discussed as part of his illustrations. The information pertains to a two-year European receiver swaption on a one-year swap with quarterly payments.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0114.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0115.webp\" style=\"max-width:min(100%,487px)\" alt=\"Term Structure of Interest Rates at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0116.webp\" style=\"max-width:min(100%,360px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0117.webp\" style=\"max-width:min(100%,360px)\" alt=\"90 4.55\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0118.webp\" style=\"max-width:min(100%,360px)\" alt=\"180 4.88\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0119.webp\" style=\"max-width:min(100%,360px)\" alt=\"270 4.90\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0120.webp\" style=\"max-width:min(100%,360px)\" alt=\"360 5.00\"><p>Hughes discusses the issue of credit risk often associated with currency, equity, and interest rate swaps with firm employees. He cites re-pricing as a potential solution to the credit risk problem. Using the interest rate swap contract utilized by Furnace Works Ltd. for illustration purposes, Hughes explains how a swap contract can be re-priced. The term structure of the swap 90 days after entering Furnace Works Ltd. is illustrated in the exhibit below (exhibit 4).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0121.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 4 Term Structure of Interest Rates.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0122.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0123.webp\" style=\"max-width:min(100%,284px)\" alt=\"90 10.05\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0124.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 10.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0125.webp\" style=\"max-width:min(100%,284px)\" alt=\"270 10.45\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0126.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 10.49\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0127.webp\" style=\"max-width:min(100%,284px)\" alt=\"450 10.53\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0128.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 10.58\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0129.webp\" style=\"max-width:min(100%,284px)\" alt=\"630 10.60\"><\/div><\/details><div class=\"qtext\"><p>In the context of the facts discussed by the executive, which of the following facts has been least accurately outlined?<\/p><\/div>", "subj": "derivatives"}, {"n": 22, "q": "The value of the swap to Beta Build, 180 days after initiation, is closest to:", "opts": ["–$2,300,000", "–$1,600,000", "–$1,400,000"], "ans": "B", "expl": "The value of the swap to Beta Build, 180 days after initiation, is best understood by calculating the present value (PV) of both the fixed and floating payments involved in the swap and then determining the net value to Beta Build. The swap involves Beta Build paying a fixed rate and receiving a floating rate. The fixed rate payments are calculated based on the Euribor rates provided in Exhibit 2, and the floating rate payments are based on the LIBOR rates. To determine the value of the swap to Beta Build, we first calculate the Euro discount factors for the respective periods. The formula for the discount factor is where r is the rate and t is the time in days. Using the Euribor rates provided: - For 180 days: - For 360 days: - For 540 days: Next, we calculate the present value of the fixed payments Beta Build makes, which are based on a semi-annual fixed rate of 1.725% (half of the annual rate of 3.45%). The PV of these fixed payments in Euros is: PVFixed = 0.01725 × (0.98522167 + 0.96974399 + 0.95351609) + 1.0 × 0.95351609 = 1.00368740 Converting this to USD at the current exchange rate of $0.90 per €1 and considering the notional principal of $25 million initially converted at $0.85 per €1, the total PV of fixed payments in USD is: The PV of floating payments, which reset at the current LIBOR rate, is simply the notional principal of $25,000,000. The value of the swap to Beta Build is the difference between the PV of floating payments received and fixed payments made: Value of Swap = 25, 000, 000 −26, 568, 195.89 = −1, 568,195.89 ≈−1, 600, 000 A is incorrect. It suggests a swap value of –$2,300,000, which significantly deviates from the calculated value. This discrepancy arises because the calculation in Option A likely assumes incorrect or exaggerated rates or misapplies the exchange rate changes. The precise calculations based on the given Euribor rates, the fixed payment rate, and the current exchange rate lead to a different valuation, closer to –$1,600,000. It is essential to use accurate financial data and formulas to derive the correct swap value. C is incorrect. It estimates the swap value at –$1,400,000, which is also not aligned with our detailed calculations. This underestimation could result from an inaccurate assessment of the discount factors or a miscalculation in converting the Euro-denominated payments into USD. Ensuring that each step of the calculation is followed meticulously is crucial for arriving at the precise valuation of financial instruments like swaps. ", "explhtml": "<p>The value of the swap to Beta Build, 180 days after initiation, is best understood by calculating the present value (PV) of both the fixed and floating payments involved in the swap and then determining the net value to Beta Build. The swap involves Beta Build paying a fixed rate and receiving a floating rate. The fixed rate payments are calculated based on the Euribor rates provided in Exhibit 2, and the floating rate payments are based on the LIBOR rates.<\/p><p>To determine the value of the swap to Beta Build, we first calculate the Euro discount factors for the respective periods. The formula for the discount factor is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0130.webp\" style=\"max-width:min(100%,140px)\" alt=\"1 Bt = 1 + (r × 360 t )\"><p>where r is the rate and t is the time in days. Using the Euribor rates provided: - For 180 days: - For 360 days: - For 540 days: Next, we calculate the present value of the fixed payments Beta Build makes, which are based on a semi-annual fixed rate of 1.725% (half of the annual rate of 3.45%). The PV of these fixed payments in Euros is:<\/p><p>PV<sub>Fixed<\/sub> = 0.01725 × (0.98522167 + 0.96974399 + 0.95351609) + 1.0 × 0.95351609 = 1.00368740<\/p><p>Converting this to USD at the current exchange rate of $0.90 per €1 and considering the notional principal of $25 million initially converted at $0.85 per €1, the total PV of fixed payments in USD is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0131.webp\" style=\"max-width:min(100%,505px)\" alt=\"25, 000, 000 PVFixed USD = 1.00368740 × ( 0.85 ) × 0.90 = 26, 568, 195.89\"><p>The PV of floating payments, which reset at the current LIBOR rate, is simply the notional principal of $25,000,000. The value of the swap to Beta Build is the difference between the PV of floating payments received and fixed payments made:<\/p><p>Value of Swap = 25, 000, 000 −26, 568, 195.89 = −1, 568,195.89 ≈−1, 600, 000<\/p><p><b>A is incorrect<\/b>. It suggests a swap value of –$2,300,000, which significantly deviates from the calculated value. This discrepancy arises because the calculation in Option A likely assumes incorrect or exaggerated rates or misapplies the exchange rate changes. The precise calculations based on the given Euribor rates, the fixed payment rate, and the current exchange rate lead to a different valuation, closer to –$1,600,000. It is essential to use accurate financial data and formulas to derive the correct swap value.<\/p><p><b>C is incorrect<\/b>. It estimates the swap value at –$1,400,000, which is also not aligned with our detailed calculations. This underestimation could result from an inaccurate assessment of the discount factors or a miscalculation in converting the Euro-denominated payments into USD. Ensuring that each step of the calculation is followed meticulously is crucial for arriving at the precise valuation of financial instruments like swaps. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe and compare how interest rate, currency, and equity swaps are priced and valued<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Terisemo Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Terisemo Associates arranges derivative contracts on behalf of its clients. The firm’s client base is dominated by corporate clients and a few high net-worth individuals. In addition to domestic U.S. clients, Terisemo Associates has also ventured into international markets where contracts are denominated in international currencies. <\/p><p>Furnace Works Ltd., a U.S. steel manufacturer, seeks to expand its production with an eye on a global outreach to boost its financial performance. The manufacturer will need to issue bonds worth $6 million to fund the expansion. However, in a meeting between the CEO and a Terisemo Associates executive to discuss potential financial issues, the CEO expresses his concerns about rising interest rates, which may increase the manufacturing firm’s borrowing costs. The CEO states, “We need a strategy which will protect us from the effects of rising interest rates on borrowing costs.”<\/p><p>The executive states that the best strategy for Furnace Works Ltd. would be to undertake a 1.5 years interest rate swap contract based on a notional principal of $6 million. Swap payments will be made on a semi-annual basis. The current term structure is illustrated in the exhibit below (exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0102.webp\" style=\"max-width:min(100%,214px)\" alt=\"Exhibit 1 Current Term Structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0103.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0104.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 9.23\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0105.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 9.31\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0106.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 9.42\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0107.webp\" style=\"max-width:min(100%,284px)\" alt=\"720 9.75\"><p>Additionally, the CEO asks the executive how swap contracts can be constructed using derivative instruments. The executive replies by sharing two facts:<\/p><p>Fact 1: “Swap contracts may be constructed using forwards and futures. In the case of the former, a series of forward contracts each priced at the same rate as the swap rate may be used to construct a swap. Futures contracts may only be used to construct swaps when future interest rates are certain (making them equivalent to forward contracts).”<\/p><p>Fact 2: “A swap can be constructed from options each with expirations corresponding to the swap payment dates. For instance, a pay fixed swap can be replicated by buying a call option and selling a put option.”<\/p><p>Alpha Corp., a local construction firm, won a bid for a construction project in Spain. The firm had to borrow some $25 million (converted into U.S. $) to finance the project. However, high quoted borrowing rates from Spanish banks (in the foreign country) discouraged the firm from seeking financing within Spain. To resolve the firm’s financing concerns, Terisemo Associates had identified a Spanish construction firm, Beta Build, in the same situation as Alpha Corp. Beta Build’s project involved the construction of an art gallery in the United States. A senior manager at Terisemo Associates arranged a meeting between executives of the two construction firms and recommended both parties engage in a currency swap. The recommended swap was a two-year contract covering both parties’ loan period with semi-annual payments. Beta Build was to pay a fixed rate of 3.45%, and Alpha Corp. a floating rate. The term structure - applicable to both construction firms 180 days into the swap - is illustrated below (exhibit 2). The exchange rate at swap initiation was $0.85 per €1. The current exchange rate is $0.90 per €1. The LIBOR at contract initiation was 4.00%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0108.webp\" style=\"max-width:min(100%,296px)\" alt=\"Exhibit 2 Spanish and U.S. Term Structures\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0109.webp\" style=\"max-width:min(100%,400px)\" alt=\"Days Euribor (%) LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0110.webp\" style=\"max-width:min(100%,400px)\" alt=\"180 3.00% 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0111.webp\" style=\"max-width:min(100%,400px)\" alt=\"360 3.12% 5.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0112.webp\" style=\"max-width:min(100%,400px)\" alt=\"540 3.25% 5.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0113.webp\" style=\"max-width:min(100%,400px)\" alt=\"720 3.35% 6.30%\"><p>Terisemo Associates is conducting a workshop for its employees to educate them further on the mechanics of swaps. The workshop will feature a discussion by Dustin Hughes, a senior analyst who has been following the derivatives market for many years. During the workshop Hughes introduces the concept of swaptions. He states, “The added benefit of a swaption is investor flexibility. An investor may have several motives for entering into a swaption.”<\/p><p>To carry his discussion further, Hughes attempts to demonstrate the mechanics of swaptions by walking the firm’s employees through a series of illustrations. The exhibit below (exhibit 3) contains term structure information discussed as part of his illustrations. The information pertains to a two-year European receiver swaption on a one-year swap with quarterly payments.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0114.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0115.webp\" style=\"max-width:min(100%,487px)\" alt=\"Term Structure of Interest Rates at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0116.webp\" style=\"max-width:min(100%,360px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0117.webp\" style=\"max-width:min(100%,360px)\" alt=\"90 4.55\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0118.webp\" style=\"max-width:min(100%,360px)\" alt=\"180 4.88\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0119.webp\" style=\"max-width:min(100%,360px)\" alt=\"270 4.90\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0120.webp\" style=\"max-width:min(100%,360px)\" alt=\"360 5.00\"><p>Hughes discusses the issue of credit risk often associated with currency, equity, and interest rate swaps with firm employees. He cites re-pricing as a potential solution to the credit risk problem. Using the interest rate swap contract utilized by Furnace Works Ltd. for illustration purposes, Hughes explains how a swap contract can be re-priced. The term structure of the swap 90 days after entering Furnace Works Ltd. is illustrated in the exhibit below (exhibit 4).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0121.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 4 Term Structure of Interest Rates.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0122.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0123.webp\" style=\"max-width:min(100%,284px)\" alt=\"90 10.05\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0124.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 10.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0125.webp\" style=\"max-width:min(100%,284px)\" alt=\"270 10.45\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0126.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 10.49\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0127.webp\" style=\"max-width:min(100%,284px)\" alt=\"450 10.53\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0128.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 10.58\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0129.webp\" style=\"max-width:min(100%,284px)\" alt=\"630 10.60\"><\/div><\/details><div class=\"qtext\"><p>The value of the swap to Beta Build, 180 days after initiation, is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 23, "q": "The swaption discussed by Hughes is at expiration. Using the information in exhibit 3 and assuming the exercise rate on a receiver swaption is 3%, the most likely course of action is to:", "opts": ["Exercise the receiver swaption.", "Let the swaption expire and enter into a new receive fixed swap at the current market swap rate.", "Roll the expiring receiver swaption into a new swaption at the current market swap rate."], "ans": "B", "expl": "To determine the most appropriate action at the expiration of the receiver swaption, it is crucial to compare the exercise rate of the swaption with the prevailing market swap rates. The exercise rate given is 3%. Using the term structure data from Exhibit 3, we can calculate the implied market swap rate. The calculation involves discounting future cash flows based on the term structure rates and then annualizing the result to compare it with the exercise rate. The discount factors for each period are calculated as follows: The implied market swap rate is calculated by taking the difference between the sum of the discount factors and 1, then dividing by the sum of the discount factors, and finally annualizing the result: Market swap rate = (1 −0.95238095) / (0.98875294 + 0.97618118 + 0.96455269 + 0.95238095) × A is incorrect. Exercising the receiver swaption to enter into a swap at a fixed rate of 3% would be suboptimal because the current market offers a higher rate of 4.92%. By exercising the swaption, the holder would lock in a lower rate than what could be obtained in the open market, leading to lower fixed payments than potentially achievable. C is incorrect. Rolling the expiring receiver swaption into a new swaption at the current market swap rate of 4.92% might seem like a viable option. However, this action involves unnecessary complexity and potential additional costs associated with setting up a new swaption. Directly entering into a new swap at the prevailing higher rate is a more straightforward and likely more cost-effective strategy.", "explhtml": "<p>To determine the most appropriate action at the expiration of the receiver swaption, it is crucial to compare the exercise rate of the swaption with the prevailing market swap rates. The exercise rate given is 3%. Using the term structure data from Exhibit 3, we can calculate the implied market swap rate. The calculation involves discounting future cash flows based on the term structure rates and then annualizing the result to compare it with the exercise rate.<\/p><p>The discount factors for each period are calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0132.webp\" style=\"max-width:min(100%,620px)\" alt=\"1 Discount factor for 90 days = = 0.98875294 1 + ( 4.55% 100 × 360 90 ) 1 Discount factor for 180 days = = 0.97618118 1 + ( 4.88% 100 × 180 360 ) 1 Discount factor for 270 days = = 0.96455269 1 + ( 4.90% 100 × 270 360 ) 1 Discount factor for 360 days = = 0.95238095 1 + ( 5.00% 100 × 360 360 )\"><p>The implied market swap rate is calculated by taking the difference between the sum of the discount factors and 1, then dividing by the sum of the discount factors, and finally annualizing the result:<\/p><p>Market swap rate = (1 −0.95238095) / (0.98875294 + 0.97618118 + 0.96455269 + 0.95238095) ×<\/p><p><b>A is incorrect<\/b>. Exercising the receiver swaption to enter into a swap at a fixed rate of 3% would be suboptimal because the current market offers a higher rate of 4.92%. By exercising the swaption, the holder would lock in a lower rate than what could be obtained in the open market, leading to lower fixed payments than potentially achievable.<\/p><p><b>C is incorrect<\/b>. Rolling the expiring receiver swaption into a new swaption at the current market swap rate of 4.92% might seem like a viable option. However, this action involves unnecessary complexity and potential additional costs associated with setting up a new swaption. Directly entering into a new swap at the prevailing higher rate is a more straightforward and likely more cost-effective strategy.<\/p><p class=\"los\">Study Session 13, Learning Module 34: Valuation of Contingent Claims, LOS 34(j): Describe how the Black model is used to value European interest rate options and European swaptions<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Terisemo Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Terisemo Associates arranges derivative contracts on behalf of its clients. The firm’s client base is dominated by corporate clients and a few high net-worth individuals. In addition to domestic U.S. clients, Terisemo Associates has also ventured into international markets where contracts are denominated in international currencies. <\/p><p>Furnace Works Ltd., a U.S. s l fixed rate after re-pricing the swap purchased by Furnace Works Ltd. is closest to:", "opts": ["8.35%", "8.62%", "10.07%"], "ans": "A", "expl": "The correct answer is option A, which states that the new annual fixed rate after re-pricing the swap purchased by Furnace Works Ltd. is closest to 8.35%. To understand why this is the correct answer, we need to consider the term structure of interest rates provided in Exhibit 4. The term structure shows increasing LIBOR rates over different periods, which are used to calculate the present value factors for each period. The calculation involves discounting the future cash flows of the swap at these increasing LIBOR rates, adjusted for the period they cover. The formula used for each period is Applying this formula to the given LIBOR rates and days, we calculate the present value factors. Step 1: The original swap has a 540-day tenor with semi-annual payments. We are 90 days into this swap. Therefore, the remaining payment dates from the current point in time are: The next payment is in 90 days (which is 180 days from the original start). The following payment is in 270 days (360 days from the original start). The final payment is in 450 days (540 days from the original start). Step 2: Identify the Correct Discount Rates We must use the LIBOR rates from Exhibit 4 that correspond to the periods until each of these future payment dates: Rate for 90 days (next payment): 10.05% Rate for 270 days (second payment): 10.45% Rate for 450 days (final payment): 10.53% Step 3: Calculate the Present Value Factors (Discount Factors) Step 4: Sum the Present Value Factors This is the present value of an annuity that pays $1 at each of the remaining payment dates. Step 5: Calculate the New Fixed Swap Rate (SFR) The standard formula for the fixed rate on a swap with a notional principal of 1 is: The day count convention for LIBOR-based swaps is typically Actual/360. The period between payments is 180 days. The detailed calculations show that the fixed rate that balances these present value factors over the swap's term is approximately 8.35%, confirming that option A is correct. B is incorrect. Option B suggests that the new annual fixed rate is 8.62%. This option is incorrect because it does not accurately reflect the calculations based on the term structure of interest rates provided. When the present value factors calculated from the given LIBOR rates are summed and used to determine the fixed rate, the result is closer to 9.88% rather than 8.62%. The discrepancy indicates that option B overestimates the required fixed rate to balance the present value of future cash flows against the notional amount, based on the current interest rate environment as depicted in Exhibit 4. C is incorrect. Option C suggests that the new annual fixed rate is 10.07%. This option is significantly higher than what the calculations based on the provided LIBOR rates suggest. The method of calculating the fixed rate involves discounting future cash flows at the given LIBOR rates, and the resulting fixed rate necessary to equate these present values with the notional amount is much lower than 10.07%. This option fails to accurately reflect the impact of the current interest rate environment on the re-pricing of the swap, as it substantially overestimates the fixed rate needed.", "explhtml": "<p>The correct answer is option A, which states that the new annual fixed rate after re-pricing the swap purchased by Furnace Works Ltd. is closest to 8.35%. To understand why this is the correct answer, we need to consider the term structure of interest rates provided in Exhibit 4. The term structure shows increasing LIBOR rates over different periods, which are used to calculate the present value factors for each period. The calculation involves discounting the future cash flows of the swap at these increasing LIBOR rates, adjusted for the period they cover. The formula used for each period is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0133.webp\" style=\"max-width:min(100%,189px)\" alt=\"1 . 1 + (LIBOR rate + D36ay0s)\"><p>Applying this formula to the given LIBOR rates and days, we calculate the present value factors.<\/p><p>Step 1: The original swap has a 540-day tenor with semi-annual payments. We are 90 days into this swap. Therefore, the remaining payment dates from the current point in time are:<\/p><p>The next payment is in 90 days (which is 180 days from the original start).<\/p><p>The following payment is in 270 days (360 days from the original start).<\/p><p>The final payment is in 450 days (540 days from the original start).<\/p><p>Step 2: Identify the Correct Discount Rates We must use the LIBOR rates from Exhibit 4 that correspond to the periods until each of these future payment dates:<\/p><p>Rate for 90 days (next payment): 10.05%<\/p><p>Rate for 270 days (second payment): 10.45%<\/p><p>Rate for 450 days (final payment): 10.53%<\/p><p>Step 3: Calculate the Present Value Factors (Discount Factors)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0134.webp\" style=\"max-width:min(100%,439px)\" alt=\"1 1 PVF₁(90 days) : 1 + (0.1005 × ( 360 90 )) = 1.025125 = 0.9755 1 1 PVF₂(270 days) : 1 + (0.1045 × ( 270 360 )) = 1.078375 = 0.9273 1 1 PVF₃(450 days) : 1 + (0.1053 × ( 450 360 )) = 1.131625 = 0.8837\"><p>Step 4: Sum the Present Value Factors<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0135.webp\" style=\"max-width:min(100%,400px)\" alt=\"Sum of PVFs = 0.9755 + 0.9273 + 0.8837 = 2.7865\"><p>This is the present value of an annuity that pays $1 at each of the remaining payment dates.<\/p><p>Step 5: Calculate the New Fixed Swap Rate (SFR)<\/p><p>The standard formula for the fixed rate on a swap with a notional principal of 1 is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0136.webp\" style=\"max-width:min(100%,436px)\" alt=\"(1 −Final PVF) 360 SFR_annual = × ( ) (Sum of PVFs) Day Count Convention\"><p>The day count convention for LIBOR-based swaps is typically Actual/360. The period between payments is 180 days.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0137.webp\" style=\"max-width:min(100%,238px)\" alt=\"(1 −0.8837) SFR_annual = × 2 2.7865\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0138.webp\" style=\"max-width:min(100%,64px)\" alt=\"0 1163\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0139.webp\" style=\"max-width:min(100%,361px)\" alt=\"0.1163 SFR_annual = ( ) × 2 2.7865 SFR_annual = 0.04175 × 2 = 0.0835 or 8.35%\"><p>The detailed calculations show that the fixed rate that balances these present value factors over the swap&#x27;s term is approximately 8.35%, confirming that option A is correct.<\/p><p><b>B is incorrect<\/b>. Option B suggests that the new annual fixed rate is 8.62%. This option is incorrect because it does not accurately reflect the calculations based on the term structure of interest rates provided. When the present value factors calculated from the given LIBOR rates are summed and used to determine the fixed rate, the result is closer to 9.88% rather than 8.62%. The discrepancy indicates that option B overestimates the required fixed rate to balance the present value of future cash flows against the notional amount, based on the current interest rate environment as depicted in Exhibit 4.<\/p><p><b>C is incorrect<\/b>. Option C suggests that the new annual fixed rate is 10.07%. This option is significantly higher than what the calculations based on the provided LIBOR rates suggest. The method of calculating the fixed rate involves discounting future cash flows at the given LIBOR rates, and the resulting fixed rate necessary to equate these present values with the notional amount is much lower than 10.07%. This option fails to accurately reflect the impact of the current interest rate environment on the re-pricing of the swap, as it substantially overestimates the fixed rate needed.<\/p><p class=\"los\">Study Session 13, Learning Module 33: Pricing and Valuation of Forward Commitments, LOS 33 (d): Calculate and interpret the no-arbitrage value of interest rate, currency, and equity swaps<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Terisemo Associates<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Terisemo Associates arranges derivative contracts on behalf of its clients. The firm’s client base is dominated by corporate clients and a few high net-worth individuals. In addition to domestic U.S. clients, Terisemo Associates has also ventured into international markets where contracts are denominated in international currencies. <\/p><p>Furnace Works Ltd., a U.S. steel manufacturer, seeks to expand its production with an eye on a global outreach to boost its financial performance. The manufacturer will need to issue bonds worth $6 million to fund the expansion. However, in a meeting between the CEO and a Terisemo Associates executive to discuss potential financial issues, the CEO expresses his concerns about rising interest rates, which may increase the manufacturing firm’s borrowing costs. The CEO states, “We need a strategy which will protect us from the effects of rising interest rates on borrowing costs.”<\/p><p>The executive states that the best strategy for Furnace Works Ltd. would be to undertake a 1.5 years interest rate swap contract based on a notional principal of $6 million. Swap payments will be made on a semi-annual basis. The current term structure is illustrated in the exhibit below (exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0102.webp\" style=\"max-width:min(100%,214px)\" alt=\"Exhibit 1 Current Term Structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0103.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0104.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 9.23\
