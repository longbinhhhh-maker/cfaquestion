 500, the price of the call option with the same strike price and maturity is closest to:", "opts": ["39", "42", "45"], "ans": "B", "expl": "The correct price of the call option can be determined using the put-call parity principle, which is a fundamental relationship between the prices of European put and call options with the same strike price and expiration date. According to the put-call parity, the price of a call option (C) can be calculated using the formula: Where: P is the price of the put option, which is given as \\$58.70. S0 is the current spot price of the S&P 500, which is 1,680. δ is the dividend yield on the S&P 500, which is 1.00% or 0.01 in decimal form. T is the time to maturity of the options, expressed in years. Since the maturity is 1 X is the strike price of the options, which is 1,700. r is the risk-free rate, which is 3.60% or 0.036 in decimal form. Substituting these values into the put-call parity formula, we get: Calculating further: This calculation shows that the price of the call option is approximately \\$42.31, which rounds to \\$42, making option B the correct answer. A is incorrect. It suggests that the price of the call option is \\$39. This is incorrect because it does not align with the calculation based on the put-call parity. The put-call parity provides a theoretical result based on no-arbitrage conditions and the actual market data provided. The calculation clearly shows a result closer to \\$42, not \\$39. Therefore, option A underestimates the value of the call option, ignoring the effects of the dividend yield and the risk-free rate properly accounted for in the put-call parity equation. C is incorrect. It suggests that the price of the call option is \\$45. This option overestimates the value of the call option. The put-call parity calculation, which is a reliable method for pricing options when the market conditions of no-arbitrage hold, yields a value approximately equal to \\$42.31. The suggestion of \\$45 does not conform to this calculation and incorrectly assumes a higher value without any basis from the given market data or the put-call parity relationship. ", "explhtml": "<p>The correct price of the call option can be determined using the put-call parity principle, which is a fundamental relationship between the prices of European put and call options with the same strike price and expiration date. According to the put-call parity, the price of a call option (C) can be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0234.webp\" style=\"max-width:min(100%,294px)\" alt=\"C = P + S0 × (1 + δ)−T −X × (1 + r)−T\"><p>Where:<\/p><p>P is the price of the put option, which is given as \\$58.70.<\/p><p>S<sub>0<\/sub> is the current spot price of the S&amp;P 500, which is 1,680.<\/p><p>δ is the dividend yield on the S&amp;P 500, which is 1.00% or 0.01 in decimal form.<\/p><p>T is the time to maturity of the options, expressed in years. Since the maturity is 1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0235.webp\" style=\"max-width:min(100%,125px)\" alt=\"month, T = 112.\"><p>X is the strike price of the options, which is 1,700.<\/p><p>r is the risk-free rate, which is 3.60% or 0.036 in decimal form.<\/p><p>Substituting these values into the put-call parity formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0236.webp\" style=\"max-width:min(100%,458px)\" alt=\"1 1 C = 58.70 + 1, 680 × (1 + 0.01)−12 − 1, 700 × (1 + 0.036)−12\"><p>Calculating further:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0237.webp\" style=\"max-width:min(100%,382px)\" alt=\"C = 58.70 + 1, 680 × 0.99917 −1, 700 × 0.99697 C = 58.70 + 1, 678.0056 −1,694.849\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0238.webp\" style=\"max-width:min(100%,88px)\" alt=\"C = 42.31\"><p>This calculation shows that the price of the call option is approximately \\$42.31, which rounds to \\$42, making option B the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests that the price of the call option is \\$39. This is incorrect because it does not align with the calculation based on the put-call parity. The put-call parity provides a theoretical result based on no-arbitrage conditions and the actual market data provided. The calculation clearly shows a result closer to \\$42, not \\$39. Therefore, option A underestimates the value of the call option, ignoring the effects of the dividend yield and the risk-free rate properly accounted for in the put-call parity equation.<\/p><p><b>C is incorrect<\/b>. It suggests that the price of the call option is \\$45. This option overestimates the value of the call option. The put-call parity calculation, which is a reliable method for pricing options when the market conditions of no-arbitrage hold, yields a value approximately equal to \\$42.31. The suggestion of \\$45 does not conform to this calculation and incorrectly assumes a higher value without any basis from the given market data or the put-call parity relationship. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Joel Garner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joel Garner is a portfolio manager with Caribbean Asset Management Company. The firm is planning to introduce a mutual fund for retail investors. The mutual fund will consist of large cap equities and high quality corporate bonds in equal proportions. Garner is the designated portfolio manager for this mutual fund. He believes that the issue shall be able to attract $200 million in managed assets, and the fund shall be available for investment by the public in a month.<\/p><p>Garner forecasts that the central bank is likely to reduce policy interest rates. Asset prices have already started rising. Garner decides to assume a derivative position in the equity and fixed income markets in preparation for investing in mutual fund assets.<\/p><p>He collects the following data for the equity and fixed income markets. All rates are effective annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0214.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot – S&amp;P 500 1,680\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0215.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk free rate 3.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0216.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on S&amp;P 500 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0217.webp\" style=\"max-width:min(100%,608px)\" alt=\"One month futures on S&amp;P 500 1,682.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0218.webp\" style=\"max-width:min(100%,608px)\" alt=\"Options\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0219.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 1,700\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0220.webp\" style=\"max-width:min(100%,608px)\" alt=\"Put Premium 58.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0221.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 1 month\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0222.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity Period US Treasury Interest Rate\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0223.webp\" style=\"max-width:min(100%,608px)\" alt=\"1 – month 2.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0224.webp\" style=\"max-width:min(100%,608px)\" alt=\"2 – months 2.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0225.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 – months 2.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0226.webp\" style=\"max-width:min(100%,608px)\" alt=\"4 – months 3.50%\"><p>Garner is considering taking the following alternative positions:<\/p><p>Long position in futures contract on S&amp;P 500<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0227.webp\" style=\"max-width:min(100%,212px)\" alt=\"Short position in FRA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0228.webp\" style=\"max-width:min(100%,215px)\" alt=\"Long call on S&amp;P 500 Short put on S&amp;P 500\"><p>The Caribbean Asset Management investment committee asks Garner to present his investment plans. One of the committee members suggests Treasury bond futures contracts and equity swaps.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming that the market has correctly priced the put option on the S&amp;P 500, the price of the call option with the same strike price and maturity is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 45, "q": "Which of the statements made by Keller regarding arbitrage is most likely correct?", "opts": ["Statement 1", "Statement 2", "Statement 3"], "ans": "B", "expl": "Statement 2 is correct because it accurately describes the pricing and valuation of forward contracts. At the initiation of a forward contract, the price is set to ensure that the initial value of the contract is zero. This means that neither party has an immediate financial advantage or disadvantage when the contract is established. As time progresses, the value of the forward contract can change due to fluctuations in the market conditions affecting the underlying asset. However, the agreed-upon price at which the asset will be exchanged at the contract's expiration remains constant, regardless of these market changes. This characteristic is fundamental to the nature of forward contracts and is crucial for understanding how they are used in financial markets to hedge against price risks or to speculate. Statement 1 is incorrect because it inaccurately describes the principles of arbitrage. While it is true that arbitrage involves attempting to profit from price discrepancies without taking on risk, the statement that arbitrage should not involve borrowed money is incorrect. In practice, arbitrage often requires significant capital, and using borrowed money (leverage) is common to increase potential returns. Arbitrageurs frequently rely on borrowed funds to execute trades quickly before discrepancies in market prices can be corrected. Therefore, the ability to use leverage is typically considered an essential aspect of arbitrage strategies, contrary to the statement in Statement 1. Statement 3 is incorrect because it mischaracterizes the cash flow mechanics of an interest rate swap. In an interest rate swap, the principal amounts are not exchanged at the initiation or at any other time during the life of the swap. Instead, only interest payments based on a notional principal amount are exchanged. These payments are typically made periodically and can be fixed or floating, depending on the terms agreed upon by the parties involved. The statement incorrectly suggests that cash is exchanged at the initiation of the swap, which is not the case. The actual cash flows in an interest rate swap are limited to the interest payments, and understanding this is crucial for proper valuation and management of swap contracts. ", "explhtml": "<p>Statement 2 is correct because it accurately describes the pricing and valuation of forward contracts. At the initiation of a forward contract, the price is set to ensure that the initial value of the contract is zero. This means that neither party has an immediate financial advantage or disadvantage when the contract is established. As time progresses, the value of the forward contract can change due to fluctuations in the market conditions affecting the underlying asset. However, the agreed-upon price at which the asset will be exchanged at the contract&#x27;s expiration remains constant, regardless of these market changes. This characteristic is fundamental to the nature of forward contracts and is crucial for understanding how they are used in financial markets to hedge against price risks or to speculate.<\/p><p><b>Statement 1 is incorrect<\/b> because it inaccurately describes the principles of arbitrage. While it is true that arbitrage involves attempting to profit from price discrepancies without taking on risk, the statement that arbitrage should not involve borrowed money is incorrect. In practice, arbitrage often requires significant capital, and using borrowed money (leverage) is common to increase potential returns. Arbitrageurs frequently rely on borrowed funds to execute trades quickly before discrepancies in market prices can be corrected. Therefore, the ability to use leverage is typically considered an essential aspect of arbitrage strategies, contrary to the statement in Statement 1.<\/p><p><b>Statement 3 is incorrect<\/b> because it mischaracterizes the cash flow mechanics of an interest rate swap. In an interest rate swap, the principal amounts are not exchanged at the initiation or at any other time during the life of the swap. Instead, only interest payments based on a notional principal amount are exchanged. These payments are typically made periodically and can be fixed or floating, depending on the terms agreed upon by the parties involved. The statement incorrectly suggests that cash is exchanged at the initiation of the swap, which is not the case. The actual cash flows in an interest rate swap are limited to the interest payments, and understanding this is crucial for proper valuation and management of swap contracts. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Justin Keller<\/summary><div class=\"vig-body\"><p>Justin Keller has decided to open his trading firm seeking to exploit arbitrage opportunities after several years of trading for a major Swiss bank. Keller begins by studying general principles of arbitrage-free pricing, so he shares the following with one of his employees, Kyle Reynolds:<\/p><p>Statement 1: The two fundamental rules of arbitrage are that one should not take any price risk and not use borrowed money in any transactions.<\/p><p>Statement 2: The price and value of forward commitments can differ. At initiation, the price of a forward contract is determined such that the value is 0. Over the life of the contract, the value of a forward contract can fluctuate but the exchange price at expiration remains the same.<\/p><p>Statement 3: An interest rate swap contract describes the terms under which a series of fixed payments are exchanged for a series of floating payments, and an amount upon initiation of the agreement.<\/p><p>Keller explores whether his firm can take positions in a forward contract and the underlying (CA 40) index at the same time to earn arbitrage profits. The index’s continuously compounded dividend yield is 2.45%, and the CAC 40’s current level is 4,551. Also, the continuous annual risk-free rate is 1.25%. The price of a six-month forward contract on the CAC 40 index is 4,578.<\/p><p>Reynolds suggests that Keller’s firm should also analyze whether pricing in the market for forward rate agreements (FRAs) obeys no-arbitrage principles. Reynolds asserts that FRAs have the following properties:<\/p><p>Property 1: An FRA is a standardized contract traded on exchanges where the underlying is an interest rate.<\/p><p>Property 2: In an FRA, cash is exchanged between the two parties at initiation and whenever interest is paid on each leg of the agreement.<\/p><p>Property 3: In a 3 x 9 FRA, the party that is long will receive a settlement amount based on the difference between paying a Libor deposit in three months and earning the six-month Libor rate.<\/p><p>Keller is intrigued by Reynolds’ suggestion, so he analyzes the pricing of a receive-floating 3 x 9 FRA contract. The three-month CHF Libor rate is 0.56% and the nine-month CHF Libor is 0.85%. Keller is interested in the fixed rate that should be offered by this 3 x 9 FRA, assuming no arbitrage.<\/p><p>In addition to forward contracts, Keller’s firm trades other types of securities. Reynolds shares the following comments about valuing fixed-income futures contracts:<\/p><p>Comment 1: If we purchase a bond from a country that only lists the clean price, we need to add the accrued interest to the price to get the full price.<\/p><p>Comment 2: When the seller of a futures contract can choose which bond to deliver at maturity, the full price of a bond reflects the cheapest-to-deliver adjustment needed.<\/p><p>One of Keller’s initial sources of funding for his company is a floating-rate bond that pays Libor. Keller hedged the risk of this bond by converting to fixed-rate payments using interest rate swaps. Two years ago, Keller purchased a CHF 400,000 five-year receive-fixed Libor-based interest rate swap with annual resets (30/360-day count). Reynolds collects present value data of the current Libor term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0239.webp\" style=\"max-width:min(100%,554px)\" alt=\"Exhibit 1: Present value factors for current Libor term structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0240.webp\" style=\"max-width:min(100%,464px)\" alt=\"Maturity (years) Present value factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0241.webp\" style=\"max-width:min(100%,464px)\" alt=\"1 0.98754\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0242.webp\" style=\"max-width:min(100%,464px)\" alt=\"2 0.97895\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0243.webp\" style=\"max-width:min(100%,464px)\" alt=\"3 0.95521\"><p>The fixed rate in the swap contract initiated two years ago is 1.7%. Keller is interested in the current value of the receive-fixed interest rate swap.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements made by Keller regarding arbitrage is most likely correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 46, "q": "Which property observed by Reynolds regarding FRAs is most likely correct?", "opts": ["Property 1", "Property 2", "Property 3"], "ans": "C", "expl": "Property 3 is the correct answer because it accurately describes the mechanics of a Forward Rate Agreement (FRA). An FRA is a financial contract between two parties to exchange interest payments on a predetermined principal during a future period. A 3 × 9 FRA specifically involves a settlement that starts in 3 months and ends in 9 months, effectively making it a 6-month agreement from the start of the settlement period. The long party in a 3 × 9 FRA will benefit if the 6-month LIBOR rate at the start of the agreement (3 months from now) is higher than the agreed rate in the FRA. This property correctly captures the essence of how FRAs function, focusing on the difference between the LIBOR rates at different points, which is crucial for understanding the potential gains or obligations resulting from the contract. Property 1 is incorrect. Property 1 mistakenly identifies FRAs as standardized contracts traded on exchanges. In reality, FRAs are over-the-counter (OTC) derivatives, meaning they are negotiated directly between parties and not traded on a standardized exchange. This distinction is important because it affects how the contracts can be customized and the associated liquidity and credit risk. Standardized exchange contracts typically offer more liquidity and less credit risk compared to OTC contracts. Therefore, understanding that FRAs are OTC is crucial for proper risk management and valuation. Property 2 is incorrect. Property 2 incorrectly states that cash is exchanged at the initiation of an FRA and whenever interest is paid on each leg of the agreement. In fact, no cash is exchanged at the initiation of an FRA. FRAs are agreements to pay or receive the difference between the contracted rate and the market rate on a notional amount at the settlement date. The cash flow only occurs at the settlement date, not at initiation or periodically during the term of the agreement. This misunderstanding could lead to significant mispricing and mismanagement of liquidity needs in handling FRAs. ", "explhtml": "<p>Property 3 is the correct answer because it accurately describes the mechanics of a Forward Rate Agreement (FRA). An FRA is a financial contract between two parties to exchange interest payments on a predetermined principal during a future period. A 3 × 9 FRA specifically involves a settlement that starts in 3 months and ends in 9 months, effectively making it a 6-month agreement from the start of the settlement period. The long party in a 3 × 9 FRA will benefit if the 6-month LIBOR rate at the start of the agreement (3 months from now) is higher than the agreed rate in the FRA. This property correctly captures the essence of how FRAs function, focusing on the difference between the LIBOR rates at different points, which is crucial for understanding the potential gains or obligations resulting from the contract.<\/p><p><b>Property 1 is incorrect<\/b>. Property 1 mistakenly identifies FRAs as standardized contracts traded on exchanges. In reality, FRAs are over-the-counter (OTC) derivatives, meaning they are negotiated directly between parties and not traded on a standardized exchange. This distinction is important because it affects how the contracts can be customized and the associated liquidity and credit risk. Standardized exchange contracts typically offer more liquidity and less credit risk compared to OTC contracts. Therefore, understanding that FRAs are OTC is crucial for proper risk management and valuation.<\/p><p><b>Property 2 is incorrect<\/b>. Property 2 incorrectly states that cash is exchanged at the initiation of an FRA and whenever interest is paid on each leg of the agreement. In fact, no cash is exchanged at the initiation of an FRA. FRAs are agreements to pay or receive the difference between the contracted rate and the market rate on a notional amount at the settlement date. The cash flow only occurs at the settlement date, not at initiation or periodically during the term of the agreement. This misunderstanding could lead to significant mispricing and mismanagement of liquidity needs in handling FRAs. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (a): Describe and compare how equity, interest rate, fixed income, and currency forward and futures contracts are priced and valued.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Justin Keller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justin Keller has decided to open his trading firm seeking to exploit arbitrage opportunities after several years of trading for a major Swiss bank. Keller begins by studying general principles of arbitrage-free pricing, so he shares the following with one of his employees, Kyle Reynolds:<\/p><p>Statement 1: The two fundamental rules of arbitrage are that one should not take any price risk and not use borrowed money in any transactions.<\/p><p>Statement 2: The price and value of forward commitments can differ. At initiation, the price of a forward contract is determined such that the value is 0. Over the life of the contract, the value of a forward contract can fluctuate but the exchange price at expiration remains the same.<\/p><p>Statement 3: An interest rate swap contract describes the terms under which a series of fixed payments are exchanged for a series of floating payments, and an amount upon initiation of the agreement.<\/p><p>Keller explores whether his firm can take positions in a forward contract and the underlying (CA 40) index at the same time to earn arbitrage profits. The index’s continuously compounded dividend yield is 2.45%, and the CAC 40’s current level is 4,551. Also, the continuous annual risk-free rate is 1.25%. The price of a six-month forward contract on the CAC 40 index is 4,578.<\/p><p>Reynolds suggests that Keller’s firm should also analyze whether pricing in the market for forward rate agreements (FRAs) obeys no-arbitrage principles. Reynolds asserts that FRAs have the following properties:<\/p><p>Property 1: An FRA is a standardized contract traded on exchanges where the underlying is an interest rate.<\/p><p>Property 2: In an FRA, cash is exchanged between the two parties at initiation and whenever interest is paid on each leg of the agreement.<\/p><p>Property 3: In a 3 x 9 FRA, the party that is long will receive a settlement amount based on the difference between paying a Libor deposit in three months and earning the six-month Libor rate.<\/p><p>Keller is intrigued by Reynolds’ suggestion, so he analyzes the pricing of a receive-floating 3 x 9 FRA contract. The three-month CHF Libor rate is 0.56% and the nine-month CHF Libor is 0.85%. Keller is interested in the fixed rate that should be offered by this 3 x 9 FRA, assuming no arbitrage.<\/p><p>In addition to forward contracts, Keller’s firm trades other types of securities. Reynolds shares the following comments about valuing fixed-income futures contracts:<\/p><p>Comment 1: If we purchase a bond from a country that only lists the clean price, we need to add the accrued interest to the price to get the full price.<\/p><p>Comment 2: When the seller of a futures contract can choose which bond to deliver at maturity, the full price of a bond reflects the cheapest-to-deliver adjustment needed.<\/p><p>One of Keller’s initial sources of funding for his company is a floating-rate bond that pays Libor. Keller hedged the risk of this bond by converting to fixed-rate payments using interest rate swaps. Two years ago, Keller purchased a CHF 400,000 five-year receive-fixed Libor-based interest rate swap with annual resets (30/360-day count). Reynolds collects present value data of the current Libor term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0239.webp\" style=\"max-width:min(100%,554px)\" alt=\"Exhibit 1: Present value factors for current Libor term structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0240.webp\" style=\"max-width:min(100%,464px)\" alt=\"Maturity (years) Present value factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0241.webp\" style=\"max-width:min(100%,464px)\" alt=\"1 0.98754\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0242.webp\" style=\"max-width:min(100%,464px)\" alt=\"2 0.97895\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0243.webp\" style=\"max-width:min(100%,464px)\" alt=\"3 0.95521\"><p>The fixed rate in the swap contract initiated two years ago is 1.7%. Keller is interested in the current value of the receive-fixed interest rate swap.<\/p><\/div><\/details><div class=\"qtext\"><p>Which property observed by Reynolds regarding FRAs is most likely correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 47, "q": "Do the spot and forward prices of CAC 40 most likely imply an arbitrage opportunity?", "opts": ["Yes, there is a carry arbitrage opportunity.", "Yes, there is a reverse carry arbitrage opportunity.", "No, the prices are efficient."], "ans": "A", "expl": "The correct answer is A, indicating that there is a carry arbitrage opportunity. To understand why this is the case, we need to calculate the theoretical forward price of the CAC 40 index using the carry arbitrage model. The formula for the forward price under the carry arbitrage model is given by: Where: F0(T ) is the theoretical forward price of the index at time T . S0 is the current spot price of the index, which is 4,551. rc is the continuous risk-free rate, given as 1.25% or 0.0125. θ represents the carry costs, which are 0 in this scenario as no carry costs are γ is the carry benefit, represented by the dividend yield of 2.45% or 0.0245. T is the time to maturity of the forward contract, which is 6 months or 0.5 years. Plugging these values into the formula, we get: This calculated forward price of 4,524 is lower than the actual forward price of 4,578. This discrepancy suggests that the actual forward price is too high, and thus, by selling the forward contract and buying the underlying index, an arbitrageur can profit from the difference as the prices converge. This strategy is known as carry arbitrage. B is incorrect. A reverse carry arbitrage opportunity would imply that the actual forward price is lower than the theoretical forward price, suggesting a strategy of buying the forward and selling the spot. However, in this case, the actual forward price of 4,578 is higher than the theoretical price of 4,524. Therefore, the scenario described does not support a reverse carry arbitrage but rather a standard carry arbitrage, where the forward is sold and the spot is bought. C is incorrect. The statement that the prices are efficient would be correct if the actual forward price matched the theoretical forward price calculated using the carry arbitrage model. Since there is a discrepancy between the theoretical forward price (4,524) and the actual forward price (4,578), it indicates inefficiency in the pricing of the forward contract. This inefficiency creates an arbitrage opportunity, contradicting the notion that the prices are efficient. ", "explhtml": "<p>The correct answer is A, indicating that there is a carry arbitrage opportunity. To understand why this is the case, we need to calculate the theoretical forward price of the CAC 40 index using the carry arbitrage model. The formula for the forward price under the carry arbitrage model is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0244.webp\" style=\"max-width:min(100%,159px)\" alt=\"F0(T) = S0e(rc+θ−γ)T\"><p>Where:<\/p><p>F<sub>0<\/sub>(T ) is the theoretical forward price of the index at time T .<\/p><p>S<sub>0<\/sub> is the current spot price of the index, which is 4,551.<\/p><p>r<sub>c<\/sub> is the continuous risk-free rate, given as 1.25% or 0.0125.<\/p><p>θ represents the carry costs, which are 0 in this scenario as no carry costs are<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0245.webp\" style=\"max-width:min(100%,88px)\" alt=\"indicated.\"><p>γ is the carry benefit, represented by the dividend yield of 2.45% or 0.0245.<\/p><p>T is the time to maturity of the forward contract, which is 6 months or 0.5 years.<\/p><p>Plugging these values into the formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0246.webp\" style=\"max-width:min(100%,326px)\" alt=\"F0(0.5) = 4, 551e(0.0125−0.0245)×0.5 = 4, 524\"><p>This calculated forward price of 4,524 is lower than the actual forward price of 4,578. This discrepancy suggests that the actual forward price is too high, and thus, by selling the forward contract and buying the underlying index, an arbitrageur can profit from the difference as the prices converge. This strategy is known as carry arbitrage.<\/p><p><b>B is incorrect<\/b>. A reverse carry arbitrage opportunity would imply that the actual forward price is lower than the theoretical forward price, suggesting a strategy of buying the forward and selling the spot. However, in this case, the actual forward price of 4,578 is higher than the theoretical price of 4,524. Therefore, the scenario described does not support a reverse carry arbitrage but rather a standard carry arbitrage, where the forward is sold and the spot is bought.<\/p><p><b>C is incorrect<\/b>. The statement that the prices are efficient would be correct if the actual forward price matched the theoretical forward price calculated using the carry arbitrage model. Since there is a discrepancy between the theoretical forward price (4,524) and the actual forward price (4,578), it indicates inefficiency in the pricing of the forward contract. This inefficiency creates an arbitrage opportunity, contradicting the notion that the prices are efficient. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (c): Identify an arbitrage opportunity involving options and describe the related arbitrage<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Justin Keller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justin Keller has decided to open his trading firm seeking to exploit arbitrage opportunities after several years of trading for a major Swiss bank. Keller begins by studying general principles of arbitrage-free pricing, so he shares the following with one of his employees, Kyle Reynolds:<\/p><p>Statement 1: The two fundamental rules of arbitrage are that one should not take any price risk and not use borrowed money in any transactions.<\/p><p>Statement 2: The price and value of forward commitments can differ. At initiation, the price of a forward contract is determined such that the value is 0. Over the life of the contract, the value of a forward contract can fluctuate but the exchange price at expiration remains the same.<\/p><p>Statement 3: An interest rate swap contract describes the terms under which a series of fixed payments are exchanged for a series of floating payments, and an amount upon initiation of the agreement.<\/p><p>Keller explores whether his firm can take positions in a forward contract and the underlying (CA 40) index at the same time to earn arbitrage profits. The index’s continuously compounded dividend yield is 2.45%, and the CAC 40’s current level is 4,551. Also, the continuous annual risk-free rate is 1.25%. The price of a six-month forward contract on the CAC 40 index is 4,578.<\/p><p>Reynolds suggests that Keller’s firm should also analyze whether pricing in the market for forward rate agreements (FRAs) obeys no-arbitrage principles. Reynolds asserts that FRAs have the following properties:<\/p><p>Property 1: An FRA is a standardized contract traded on exchanges where the underlying is an interest rate.<\/p><p>Property 2: In an FRA, cash is exchanged between the two parties at initiation and whenever interest is paid on each leg of the agreement.<\/p><p>Property 3: In a 3 x 9 FRA, the party that is long will receive a settlement amount based on the difference between paying a Libor deposit in three months and earning the six-month Libor rate.<\/p><p>Keller is intrigued by Reynolds’ suggestion, so he analyzes the pricing of a receive-floating 3 x 9 FRA contract. The three-month CHF Libor rate is 0.56% and the nine-month CHF Libor is 0.85%. Keller is interested in the fixed rate that should be offered by this 3 x 9 FRA, assuming no arbitrage.<\/p><p>In addition to forward contracts, Keller’s firm trades other types of securities. Reynolds shares the following comments about valuing fixed-income futures contracts:<\/p><p>Comment 1: If we purchase a bond from a country that only lists the clean price, we need to add the accrued interest to the price to get the full price.<\/p><p>Comment 2: When the seller of a futures contract can choose which bond to deliver at maturity, the full price of a bond reflects the cheapest-to-deliver adjustment needed.<\/p><p>One of Keller’s initial sources of funding for his company is a floating-rate bond that pays Libor. Keller hedged the risk of this bond by converting to fixed-rate payments using interest rate swaps. Two years ago, Keller purchased a CHF 400,000 five-year receive-fixed Libor-based interest rate swap with annual resets (30/360-day count). Reynolds collects present value data of the current Libor term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0239.webp\" style=\"max-width:min(100%,554px)\" alt=\"Exhibit 1: Present value factors for current Libor term structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0240.webp\" style=\"max-width:min(100%,464px)\" alt=\"Maturity (years) Present value factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0241.webp\" style=\"max-width:min(100%,464px)\" alt=\"1 0.98754\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0242.webp\" style=\"max-width:min(100%,464px)\" alt=\"2 0.97895\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0243.webp\" style=\"max-width:min(100%,464px)\" alt=\"3 0.95521\"><p>The fixed rate in the swap contract initiated two years ago is 1.7%. Keller is interested in the current value of the receive-fixed interest rate swap.<\/p><\/div><\/details><div class=\"qtext\"><p>Do the spot and forward prices of CAC 40 most likely imply an arbitrage opportunity?<\/p><\/div>", "subj": "derivatives"}, {"n": 48, "q": "Which of the following is most accurate about Reynolds' comments about valuing fixed-income futures contracts?", "opts": ["Comment 1 and Comments 2 are both correct.", "Comment 1 is correct but Comment 2 is incorrect.", "Comment 2 is correct but Comment 1 is incorrect."], "ans": "B", "expl": "B is the correct answer. Comment 1 is indeed correct as it accurately describes the process of determining the full price of a bond. The clean price of a bond represents the price excluding any accrued interest. Accrued interest is the interest that has accumulated since the last coupon payment and must be paid by the buyer of the bond along with the clean price to arrive at the full or dirty price. This is a standard practice in bond trading to ensure that the seller is compensated for the period they held the bond during which they were not receiving coupon payments. This method ensures that the bond's yield remains consistent regardless of the purchase date. A is incorrect. While Comment 1 is correct, Comment 2 contains a misunderstanding regarding the pricing of futures contracts. In futures contracts, particularly those involving the option for the seller to choose which bond to deliver (cheapest-to-deliver option), the full price of the bond does not directly reflect the cheapest-to-deliver adjustment. Instead, the futures price is adjusted using a conversion factor, which normalizes the differences in coupon rates and time to maturity among eligible bonds. This conversion factor ensures that the futures contract is fair and equitable regardless of which specific bond is delivered. Therefore, stating that the full price reflects the cheapest-to-deliver adjustment is incorrect because it is the conversion factor applied to the futures price that accounts for these differences, not the full price of the bond itself. C is incorrect. Comment 2 is incorrect for the reasons mentioned above. The statement that the full price of a bond reflects the cheapest-to-deliver adjustment needed is a misunderstanding of how futures contracts are priced. The cheapest-to-deliver option allows the seller to deliver any bond from an approved list, and the conversion factor is used to adjust the futures price, not the full price of the bond. This ensures that the contract remains fair regardless of the bond delivered, as the conversion factor compensates for variations in bond characteristics. Therefore, stating that Comment 2 is correct misrepresents the mechanics of futures pricing. ", "explhtml": "<p><b>B is the correct answer<\/b>. Comment 1 is indeed correct as it accurately describes the process of determining the full price of a bond. The clean price of a bond represents the price excluding any accrued interest. Accrued interest is the interest that has accumulated since the last coupon payment and must be paid by the buyer of the bond along with the clean price to arrive at the full or dirty price. This is a standard practice in bond trading to ensure that the seller is compensated for the period they held the bond during which they were not receiving coupon payments. This method ensures that the bond&#x27;s yield remains consistent regardless of the purchase date.<\/p><p><b>A is incorrect<\/b>. While Comment 1 is correct, Comment 2 contains a misunderstanding regarding the pricing of futures contracts. In futures contracts, particularly those involving the option for the seller to choose which bond to deliver (cheapest-to-deliver option), the full price of the bond does not directly reflect the cheapest-to-deliver adjustment. Instead, the futures price is adjusted using a conversion factor, which normalizes the differences in coupon rates and time to maturity among eligible bonds. This conversion factor ensures that the futures contract is fair and equitable regardless of which specific bond is delivered. Therefore, stating that the full price reflects the cheapest-to-deliver adjustment is incorrect because it is the conversion factor applied to the futures price that accounts for these differences, not the full price of the bond itself.<\/p><p><b>C is incorrect<\/b>. Comment 2 is incorrect for the reasons mentioned above. The statement that the full price of a bond reflects the cheapest-to-deliver adjustment needed is a misunderstanding of how futures contracts are priced. The cheapest-to-deliver option allows the seller to deliver any bond from an approved list, and the conversion factor is used to adjust the futures price, not the full price of the bond. This ensures that the contract remains fair regardless of the bond delivered, as the conversion factor compensates for variations in bond characteristics. Therefore, stating that Comment 2 is correct misrepresents the mechanics of futures pricing. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (a): Describe and compare how equity, interest rate, fixed-income, and currency forward and futures contracts are priced and valued<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Justin Keller<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Justin Keller has decided to open his trading firm seeking to exploit arbitrage opportunities after several years of trading for a major Swiss bank. Keller begins by studying general principles of arbitrage-free pricing, so he shares the following with one of his employees, Kyle Reynolds:<\/p><p>Statement 1: The two fundamental rules of arbitrage are that one should not take any price risk and not use borrowed money in any transactions.<\/p><p>Statement 2: The price and value of forward commitments can differ. At initiation, the price of a forward contract is determined such that the value is 0. Over the life of the contract, the value of a forward contract can fluctuate but the exchange price at expiration remains the same.<\/p><p>Statement 3: An interest rate swap contract describes the terms under which a series of fixed payments are exchanged for a series of floating payments, and an amount upon initiation of the agreement.<\/p><p>Keller explores whether his firm can take positions in a forward contract and the underlying (CA 40) index at the same time to earn arbitrage profits. The index’s continuously compounded dividend yield is 2.45%, and the CAC 40’s current level is 4,551. Also, the continuous annual risk-free rate is 1.25%. The price of a six-month forward contract on the CAC 40 index is 4,578.<\/p><p>Reynolds suggests that Keller’s firm should also analyze whether pricing in the market for forward rate agreements (FRAs) obeys no-arbitrage principles. Reynolds asserts that FRAs have the following properties:<\/p><p>Property 1: An FRA is a standardized contract traded on exchanges where the underlying is an interest rate.<\/p><p>Property 2: In an FRA, cash is exchanged between the two parties at initiation and whenever interest is paid on each leg of the agreement.<\/p><p>Property 3: In a 3 x 9 FRA, the party that is long will receive a settlement amount based on the difference between paying a Libor deposit in three months and earning the six-month Libor rate.<\/p><p>Keller is intrigued by Reynolds’ suggestion, so he analyzes the pricing of a receive-floating 3 x 9 FRA contract. The three-month CHF Libor rate is 0.56% and the nine-month CHF Libor is 0.85%. Keller is interested in the fixed rate that should be offered by this 3 x 9 FRA, assuming no arbitrage.<\/p><p>In addition to forward contracts, Keller’s firm trades other types of securities. Reynolds shares the following comments about valuing fixed-income futures contracts:<\/p><p>Comment 1: If we purchase a bond from a country that only lists the clean price, we need to add the accrued interest to the price to get the full price.<\/p><p>Comment 2: When the seller of a futures contract can choose which bond to deliver at maturity, the full price of a bond reflects the cheapest-to-deliver adjustment needed.<\/p><p>One of Keller’s initial sources of funding for his company is a floating-rate bond that pays Libor. Keller hedged the risk of this bond by converting to fixed-rate payments using interest rate swaps. Two years ago, Keller purchased a CHF 400,000 five-year receive-fixed Libor-based interest rate swap with annual resets (30/360-day count). Reynolds collects present value data of the current Libor term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0239.webp\" style=\"max-width:min(100%,554px)\" alt=\"Exhibit 1: Present value factors for current Libor term structure\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0240.webp\" style=\"max-width:min(100%,464px)\" alt=\"Maturity (years) Present value factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0241.webp\" style=\"max-width:min(100%,464px)\" alt=\"1 0.98754\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0242.webp\" style=\"max-width:min(100%,464px)\" alt=\"2 0.97895\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0243.webp\" style=\"max-width:min(100%,464px)\" alt=\"3 0.95521\"><p>The fixed rate in the swap contract initiated two years ago is 1.7%. Keller is interested in the current value of the receive-fixed interest rate swap.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is most accurate about Reynolds&#x27; comments about valuing fixed-income futures contracts?<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "Holden's most accurate response to Coleman's question would be?", "opts": ["Yes", "No, because interest rate swaps are contingent claims", "No, because interest rate swaps are exchange-traded derivatives"], "ans": "A", "expl": "Interest rate swaps can indeed be described as a series of forward rate agreements (FRAs). Each payment in an interest rate swap is essentially a settlement of a forward rate agreement where the fixed rate agreed upon at the inception of the swap is compared against the prevailing floating rate at the time of each payment. This comparison determines the net cash flow between the counterparties. The structure of an interest rate swap involves multiple periods, typically ranging from one year to as long as ten years or more, covering the entire term of the swap. Each of these periods can be viewed as an individual FRA, where the fixed rate payer is betting that the floating rate will rise above the fixed rate, while the floating rate payer bets on the opposite. This series of exchanges makes the swap akin to a chain of FRAs linked together over the life of the swap. B is incorrect. Interest rate swaps are not contingent claims. Contingent claims, such as options, provide the holder the right but not the obligation to execute the terms of the contract. In contrast, interest rate swaps require both parties to fulfill their obligations regardless of how interest rates move. Both parties are bound by the terms agreed upon at the outset, which stipulate the fixed and floating rates to be exchanged. The payments are obligatory and not contingent on an external event or choice, distinguishing them from typical contingent claims like options or credit derivatives. C is incorrect. Interest rate swaps are not exchange-traded derivatives but are instead traded over-the-counter (OTC). This means they are negotiated privately between parties and not on a centralized exchange. Exchange-traded derivatives, such as futures and certain options, are standardized contracts traded on public exchanges that provide a central clearing mechanism and standardized contract specifications. In contrast, interest rate swaps are customizable and their terms, such as notional amount, duration, and rates, can be tailored to meet the specific needs of the counterparties involved. This flexibility is a key feature of OTC derivatives, allowing for precise management of interest rate exposure. ", "explhtml": "<p>Interest rate swaps can indeed be described as a series of forward rate agreements (FRAs). Each payment in an interest rate swap is essentially a settlement of a forward rate agreement where the fixed rate agreed upon at the inception of the swap is compared against the prevailing floating rate at the time of each payment. This comparison determines the net cash flow between the counterparties. The structure of an interest rate swap involves multiple periods, typically ranging from one year to as long as ten years or more, covering the entire term of the swap. Each of these periods can be viewed as an individual FRA, where the fixed rate payer is betting that the floating rate will rise above the fixed rate, while the floating rate payer bets on the opposite. This series of exchanges makes the swap akin to a chain of FRAs linked together over the life of the swap.<\/p><p><b>B is incorrect<\/b>. Interest rate swaps are not contingent claims. Contingent claims, such as options, provide the holder the right but not the obligation to execute the terms of the contract. In contrast, interest rate swaps require both parties to fulfill their obligations regardless of how interest rates move. Both parties are bound by the terms agreed upon at the outset, which stipulate the fixed and floating rates to be exchanged. The payments are obligatory and not contingent on an external event or choice, distinguishing them from typical contingent claims like options or credit derivatives.<\/p><p><b>C is incorrect<\/b>. Interest rate swaps are not exchange-traded derivatives but are instead traded over-the-counter (OTC). This means they are negotiated privately between parties and not on a centralized exchange. Exchange-traded derivatives, such as futures and certain options, are standardized contracts traded on public exchanges that provide a central clearing mechanism and standardized contract specifications. In contrast, interest rate swaps are customizable and their terms, such as notional amount, duration, and rates, can be tailored to meet the specific needs of the counterparties involved. This flexibility is a key feature of OTC derivatives, allowing for precise management of interest rate exposure. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1(b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed- income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Trevor Holden<\/summary><div class=\"vig-body\"><p>Trevor Holden advises corporate finance and treasury departments on borrowing decisions and working capital management. In particular, Holden specializes in analyzing and recommending derivatives strategies that help his clients maintain an acceptable level of exposure to market-based risks.<\/p><p>Holden meets with Martha Coleman, CFO of Brownstone Design (Brownstone), a US-based office furniture manufacturer. Nine months ago, Brownstone Designs reached a strategic partnership with Elemental Interiors that would see the two firms collaborate on certain projects. As part of the partnership, Brownstone signed a forward agreement to purchase 100,000 shares of Elemental Interiors&#x27; stock, which trades under the ticker symbol ETI and does not pay a dividend, of USD 35.50 per share one year later. The current market price of ETI shares is USD 38.21.<\/p><p>Coleman asks for Holden&#x27;s advice on valuing this forward contract, which expires in three months. In particular, she is concerned because Brownstone&#x27;s internal valuation models generate prices thats appear inconsistent with the market price of new 6-month futures contracts on ETI stock, which are currently trading for USD 39.00 on a per share basis. Holden looks up the latest quotes and finds that the relevant 3-month and 6-month interest rates have discount factors of 0.990005 and 0.979639, respectively.<\/p><p>The next item of business to be discussed concerns Brownstone&#x27;s working capital management. Coleman tells Holden that the company will be depositing USD 13,500,000 next month and is considering taking a long position in a 1 x 6 forward rate agreement (FRA). The terms of this FRA stipulate that when it expires in one month, the interest rate for the floating leg will be set and a payment will be made based on the difference between the exercise rate and the prevailing reference rate. Holden responds with the following two statements:<\/p><p>Statement A: &quot;The FRA position that Brownstone is considering is the equivalent of going long a one-month Libor deposit and short a six-month Libor deposit.&quot;<\/p><p>Statement B: &quot;If Brownstone takes this FRA position, the company will receive payments based on a fixed rate.&quot;<\/p><p>Finally, the two colleagues discuss Brownstone&#x27;s longer-term borrowing needs. Coleman informs Holden that, next month, Brownstone will be taking out a 5-year bank loan with annual floating-rate interest payments based on Libor. Coleman adds that she would like to convert this loan into a fixed-rate obligation. Holden advises that Brownstone enter a 5-year, pay-fixed, receive Libor interest rate swap. Specifically, he recommends Libor swap rates equal to 45 basis points plus the zero-coupon Treasury spot rates shown below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0247.webp\" style=\"max-width:min(100%,299px)\" alt=\"Exhibit 1: Zero-coupon spot curve\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0248.webp\" style=\"max-width:min(100%,374px)\" alt=\"Term Zero-coupon rate (years) (annual)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0249.webp\" style=\"max-width:min(100%,374px)\" alt=\"1 4.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0250.webp\" style=\"max-width:min(100%,374px)\" alt=\"2 4.70%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0251.webp\" style=\"max-width:min(100%,374px)\" alt=\"3 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0252.webp\" style=\"max-width:min(100%,374px)\" alt=\"4 5.15%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0253.webp\" style=\"max-width:min(100%,374px)\" alt=\"5 5.25%\"><p>After listening to his recommendation, Coleman asks Holden &quot;Is an interest rate swap essentially a series of forward rate agreements?&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Holden&#x27;s most accurate response to Coleman&#x27;s question would be?<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "The forward rate agreement being considered by Brownstone is most accurately characterized as:", "opts": ["Set in arrears, advanced settled.", "Advanced set, settled in arrears.", "Advanced set, advanced settled."], "ans": "C", "expl": "Option C is correct because it accurately describes the nature of the forward rate agreement (FRA) being considered by Brownstone. In an FRA, the interest rate applicable to the agreement is determined at the start of the contract period, which is known as \"advanced set.\" This means that the rate is fixed at the beginning rather than being based on the rate prevailing at the end of the contract period. Additionally, in the case of \"advanced settled\" FRAs, the payment is calculated based on the difference between the agreed rate and the reference rate at the time of contract initiation, and this payment is made at the end of the contract period. This is in contrast to \"settled in arrears,\" where the payment would be made at a future date based on rates applicable at that later time. The FRA in question involves both setting and settling the rates at the start, hence making option C the correct characterization. A is incorrect. The description \"Set in arrears, advanced settled\" is not applicable to the FRA being considered by Brownstone. In this incorrect option, \"set in arrears\" would imply that the interest rate applicable to the FRA is determined at the end of the contract period, which contradicts the actual structure of typical FRAs where the rate is determined at the beginning. Furthermore, \"advanced settled\" suggests that the payment is made at the end of the contract period based on the initially determined rate, which only half aligns with the FRA's structure. The combination described in option A does not exist in typical FRA agreements, making it incorrect. B is incorrect. The option \"Advanced set, settled in arrears\" incorrectly describes the settlement process of the FRA. While it is correct that the rate is determined at the start (\"advanced set\"), the \"settled in arrears\" part inaccurately suggests that the payment based on the rate difference is deferred beyond the contract's expiration. In the FRA under consideration, the settlement occurs at the end of the contract period, not delayed further, which contradicts the \"settled in arrears\" description. This misalignment makes option B an incorrect characterization of the FRA. ", "explhtml": "<p>Option C is correct because it accurately describes the nature of the forward rate agreement (FRA) being considered by Brownstone. In an FRA, the interest rate applicable to the agreement is determined at the start of the contract period, which is known as &quot;advanced set.&quot; This means that the rate is fixed at the beginning rather than being based on the rate prevailing at the end of the contract period. Additionally, in the case of &quot;advanced settled&quot; FRAs, the payment is calculated based on the difference between the agreed rate and the reference rate at the time of contract initiation, and this payment is made at the end of the contract period. This is in contrast to &quot;settled in arrears,&quot; where the payment would be made at a future date based on rates applicable at that later time. The FRA in question involves both setting and settling the rates at the start, hence making option C the correct characterization.<\/p><p><b>A is incorrect<\/b>. The description &quot;Set in arrears, advanced settled&quot; is not applicable to the FRA being considered by Brownstone. In this incorrect option, &quot;set in arrears&quot; would imply that the interest rate applicable to the FRA is determined at the end of the contract period, which contradicts the actual structure of typical FRAs where the rate is determined at the beginning. Furthermore, &quot;advanced settled&quot; suggests that the payment is made at the end of the contract period based on the initially determined rate, which only half aligns with the FRA&#x27;s structure. The combination described in option A does not exist in typical FRA agreements, making it incorrect.<\/p><p><b>B is incorrect<\/b>. The option &quot;Advanced set, settled in arrears&quot; incorrectly describes the settlement process of the FRA. While it is correct that the rate is determined at the start (&quot;advanced set&quot;), the &quot;settled in arrears&quot; part inaccurately suggests that the payment based on the rate difference is deferred beyond the contract&#x27;s expiration. In the FRA under consideration, the settlement occurs at the end of the contract period, not delayed further, which contradicts the &quot;settled in arrears&quot; description. This misalignment makes option B an incorrect characterization of the FRA. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (a): Describe and compare how equity, interest rate, fixed-income, and currency forward and futures contracts are priced and valued<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Trevor Holden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Trevor Holden advises corporate finance and treasury departments on borrowing decisions and working capital management. In particular, Holden specializes in analyzing and recommending derivatives strategies that help his clients maintain an acceptable level of exposure to market-based risks.<\/p><p>Holden meets with Martha Coleman, CFO of Brownstone Design (Brownstone), a US-based office furniture manufacturer. Nine months ago, Brownstone Designs reached a strategic partnership with Elemental Interiors that would see the two firms collaborate on certain projects. As part of the partnership, Brownstone signed a forward agreement to purchase 100,000 shares of Elemental Interiors&#x27; stock, which trades under the ticker symbol ETI and does not pay a dividend, of USD 35.50 per share one year later. The current market price of ETI shares is USD 38.21.<\/p><p>Coleman asks for Holden&#x27;s advice on valuing this forward contract, which expires in three months. In particular, she is concerned because Brownstone&#x27;s internal valuation models generate prices thats appear inconsistent with the market price of new 6-month futures contracts on ETI stock, which are currently trading for USD 39.00 on a per share basis. Holden looks up the latest quotes and finds that the relevant 3-month and 6-month interest rates have discount factors of 0.990005 and 0.979639, respectively.<\/p><p>The next item of business to be discussed concerns Brownstone&#x27;s working capital management. Coleman tells Holden that the company will be depositing USD 13,500,000 next month and is considering taking a long position in a 1 x 6 forward rate agreement (FRA). The terms of this FRA stipulate that when it expires in one month, the interest rate for the floating leg will be set and a payment will be made based on the difference between the exercise rate and the prevailing reference rate. Holden responds with the following two statements:<\/p><p>Statement A: &quot;The FRA position that Brownstone is considering is the equivalent of going long a one-month Libor deposit and short a six-month Libor deposit.&quot;<\/p><p>Statement B: &quot;If Brownstone takes this FRA position, the company will receive payments based on a fixed rate.&quot;<\/p><p>Finally, the two colleagues discuss Brownstone&#x27;s longer-term borrowing needs. Coleman informs Holden that, next month, Brownstone will be taking out a 5-year bank loan with annual floating-rate interest payments based on Libor. Coleman adds that she would like to convert this loan into a fixed-rate obligation. Holden advises that Brownstone enter a 5-year, pay-fixed, receive Libor interest rate swap. Specifically, he recommends Libor swap rates equal to 45 basis points plus the zero-coupon Treasury spot rates shown below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0247.webp\" style=\"max-width:min(100%,299px)\" alt=\"Exhibit 1: Zero-coupon spot curve\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0248.webp\" style=\"max-width:min(100%,374px)\" alt=\"Term Zero-coupon rate (years) (annual)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0249.webp\" style=\"max-width:min(100%,374px)\" alt=\"1 4.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0250.webp\" style=\"max-width:min(100%,374px)\" alt=\"2 4.70%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0251.webp\" style=\"max-width:min(100%,374px)\" alt=\"3 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0252.webp\" style=\"max-width:min(100%,374px)\" alt=\"4 5.15%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0253.webp\" style=\"max-width:min(100%,374px)\" alt=\"5 5.25%\"><p>After listening to his recommendation, Coleman asks Holden &quot;Is an interest rate swap essentially a series of forward rate agreements?&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>The forward rate agreement being considered by Brownstone is most accurately characterized as:<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "On a per share basis, the value of the Brownstone's forward contract to purchase ETI stock is closest to:", "opts": ["2.97.", "3.06.", "3.10."], "ans": "B", "expl": "The valuation of a forward contract on a non-dividend-paying stock like ETI involves calculating the present value of the difference between the forward price and the strike price. To determine the forward price, we first need to calculate the future value of the current stock price using the appropriate interest rate. The forward contract in question was established nine months ago with a strike price of USD 35.50 and expires in three months. The current market price of ETI stock is USD 38.21. The relevant 3-month interest rate can be derived from the given discount factor of 0.990005. The formula to find the annualized interest rate r from the discount factor for a period of t years is: Here, t is 0.25 years (3 months). Solving for r gives an annualized rate of approximately 4.1%. Using this rate, the forward price F of the stock can be calculated as: The difference between the forward price and the strike price is: The present value of this difference, discounted back at the same annual rate for three months, is: Thus, the value of the forward contract per share is closest to USD 3.06. A is incorrect. The calculation for option A results in a value of USD 2.97, which does not align with the correct methodology for valuing forward contracts. The error in this option likely stems from incorrect assumptions about the interest rate or the misapplication of the discounting process. It is essential to use the exact interest rate derived from the discount factor and apply it correctly to both the calculation of the forward price and its subsequent discounting to present value. C is incorrect. The value of USD 3.10 suggested by option C is slightly higher than the correct calculation. This discrepancy could be due to rounding errors or a slight miscalculation in either the determination of the forward price or its discounting. It is crucial to apply precise mathematical operations and use the exact figures provided for interest rates and prices to arrive at the accurate valuation of the forward contract. ", "explhtml": "<p>The valuation of a forward contract on a non-dividend-paying stock like ETI involves calculating the present value of the difference between the forward price and the strike price. To determine the forward price, we first need to calculate the future value of the current stock price using the appropriate interest rate. The forward contract in question was established nine months ago with a strike price of USD 35.50 and expires in three months. The current market price of ETI stock is USD 38.21.<\/p><p>The relevant 3-month interest rate can be derived from the given discount factor of 0.990005. The formula to find the annualized interest rate r from the discount factor for a period of t years is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0254.webp\" style=\"max-width:min(100%,159px)\" alt=\"1 0.990005 = (1 + r)t\"><p>Here, t is 0.25 years (3 months). Solving for r gives an annualized rate of approximately 4.1%. Using this rate, the forward price F of the stock can be calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0255.webp\" style=\"max-width:min(100%,434px)\" alt=\"F = 38.21× (1 + 0.041)0.25 = 38.21× 1.0101 = 38.5959\"><p>The difference between the forward price and the strike price is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0256.webp\" style=\"max-width:min(100%,211px)\" alt=\"38.5959 −35.50 = 3.0959\"><p>The present value of this difference, discounted back at the same annual rate for three months, is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0257.webp\" style=\"max-width:min(100%,238px)\" alt=\"3.0959 = 3.0648 ≈3.06 (1 + 0.041)0.25\"><p>Thus, the value of the forward contract per share is closest to USD 3.06.<\/p><p><b>A is incorrect<\/b>. The calculation for option A results in a value of USD 2.97, which does not align with the correct methodology for valuing forward contracts. The error in this option likely stems from incorrect assumptions about the interest rate or the misapplication of the discounting process. It is essential to use the exact interest rate derived from the discount factor and apply it correctly to both the calculation of the forward price and its subsequent discounting to present value.<\/p><p><b>C is incorrect<\/b>. The value of USD 3.10 suggested by option C is slightly higher than the correct calculation. This discrepancy could be due to rounding errors or a slight miscalculation in either the determination of the forward price or its discounting. It is crucial to apply precise mathematical operations and use the exact figures provided for interest rates and prices to arrive at the accurate valuation of the forward contract. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Trevor Holden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Trevor Holden advises corporate finance and treasury departments on borrowing decisions and working capital management. In particular, Holden specializes in analyzing and recommending derivatives strategies that help his clients maintain an acceptable level of exposure to market-based risks.<\/p><p>Holden meets with Martha Coleman, CFO of Brownstone Design (Brownstone), a US-based office furniture manufacturer. Nine months ago, Brownstone Designs reached a strategic partnership with Elemental Interiors that would see the two firms collaborate on certain projects. As part of the partnership, Brownstone signed a forward agreement to purchase 100,000 shares of Elemental Interiors&#x27; stock, which trades under the ticker symbol ETI and does not pay a dividend, of USD 35.50 per share one year later. The current market price of ETI shares is USD 38.21.<\/p><p>Coleman asks for Holden&#x27;s advice on valuing this forward contract, which expires in three months. In particular, she is concerned because Brownstone&#x27;s internal valuation models generate prices thats appear inconsistent with the market price of new 6-month futures contracts on ETI stock, which are currently trading for USD 39.00 on a per share basis. Holden looks up the latest quotes and finds that the relevant 3-month and 6-month interest rates have discount factors of 0.990005 and 0.979639, respectively.<\/p><p>The next item of business to be discussed concerns Brownstone&#x27;s working capital management. Coleman tells Holden that the company will be depositing USD 13,500,000 next month and is considering taking a long position in a 1 x 6 forward rate agreement (FRA). The terms of this FRA stipulate that when it expires in one month, the interest rate for the floating leg will be set and a payment will be made based on the difference between the exercise rate and the prevailing reference rate. Holden responds with the following two statements:<\/p><p>Statement A: &quot;The FRA position that Brownstone is considering is the equivalent of going long a one-month Libor deposit and short a six-month Libor deposit.&quot;<\/p><p>Statement B: &quot;If Brownstone takes this FRA position, the company will receive payments based on a fixed rate.&quot;<\/p><p>Finally, the two colleagues discuss Brownstone&#x27;s longer-term borrowing needs. Coleman informs Holden that, next month, Brownstone will be taking out a 5-year bank loan with annual floating-rate interest payments based on Libor. Coleman adds that she would like to convert this loan into a fixed-rate obligation. Holden advises that Brownstone enter a 5-year, pay-fixed, receive Libor interest rate swap. Specifically, he recommends Libor swap rates equal to 45 basis points plus the zero-coupon Treasury spot rates shown below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0247.webp\" style=\"max-width:min(100%,299px)\" alt=\"Exhibit 1: Zero-coupon spot curve\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0248.webp\" style=\"max-width:min(100%,374px)\" alt=\"Term Zero-coupon rate (years) (annual)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0249.webp\" style=\"max-width:min(100%,374px)\" alt=\"1 4.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0250.webp\" style=\"max-width:min(100%,374px)\" alt=\"2 4.70%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0251.webp\" style=\"max-width:min(100%,374px)\" alt=\"3 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0252.webp\" style=\"max-width:min(100%,374px)\" alt=\"4 5.15%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0253.webp\" style=\"max-width:min(100%,374px)\" alt=\"5 5.25%\"><p>After listening to his recommendation, Coleman asks Holden &quot;Is an interest rate swap essentially a series of forward rate agreements?&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>On a per share basis, the value of the Brownstone&#x27;s forward contract to purchase ETI stock is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 52, "q": "Which of the following is the most accurate assessment of Holden's statements about the forward rate agreement position being considered by Brownstone?", "opts": ["Both Statement A and Statement B are incorrect", "Statement A is correct and Statement B is incorrect", "Statement B is correct and Statement A is incorrect"], "ans": "A", "expl": "Statement A is incorrect because it misrepresents the nature of the forward rate agreement (FRA) position that Brownstone is considering. In an FRA, the party taking the long position agrees to pay a fixed interest rate and receive a floating rate, which is adjusted according to the market interest rate at the time of settlement. Holden's description in Statement A suggests the opposite of the actual mechanics of an FRA. Specifically, he describes the position as equivalent to going long on a one-month Libor deposit and short on a six-month Libor deposit. This configuration would actually represent a short position in an FRA, where the party is effectively speculating that interest rates will decrease. In contrast, a long position in an FRA, which Brownstone is considering, would be more accurately represented by being short on a one-month Libor deposit and long on a six-month Libor deposit, reflecting an expectation of rising interest rates. Statement B is incorrect because it inaccurately describes the cash flows associated with holding a long position in an FRA. Holden's statement that Brownstone would receive payments based on a fixed rate contradicts the fundamental structure of an FRA. When a party is long in an FRA, they agree to pay a fixed rate, not receive it. The actual cash flow for the long position involves receiving the difference if the floating rate (which is determined at the settlement of the FRA) exceeds the agreed fixed rate. Conversely, if the floating rate is lower than the fixed rate, the party in the long position must pay the difference. Therefore, the statement that Brownstone would receive fixed-rate payments is fundamentally flawed, as the payments depend on the relative movements of the fixed and floating rates, with the fixed rate being the payment obligation, not the receipt. ", "explhtml": "<p>Statement A is incorrect because it misrepresents the nature of the forward rate agreement (FRA) position that Brownstone is considering. In an FRA, the party taking the long position agrees to pay a fixed interest rate and receive a floating rate, which is adjusted according to the market interest rate at the time of settlement. Holden&#x27;s description in Statement A suggests the opposite of the actual mechanics of an FRA. Specifically, he describes the position as equivalent to going long on a one-month Libor deposit and short on a six-month Libor deposit. This configuration would actually represent a short position in an FRA, where the party is effectively speculating that interest rates will decrease. In contrast, a long position in an FRA, which Brownstone is considering, would be more accurately represented by being short on a one-month Libor deposit and long on a six-month Libor deposit, reflecting an expectation of rising interest rates.<\/p><p><b>Statement B is incorrect<\/b> because it inaccurately describes the cash flows associated with holding a long position in an FRA. Holden&#x27;s statement that Brownstone would receive payments based on a fixed rate contradicts the fundamental structure of an FRA. When a party is long in an FRA, they agree to pay a fixed rate, not receive it. The actual cash flow for the long position involves receiving the difference if the floating rate (which is determined at the settlement of the FRA) exceeds the agreed fixed rate. Conversely, if the floating rate is lower than the fixed rate, the party in the long position must pay the difference. Therefore, the statement that Brownstone would receive fixed-rate payments is fundamentally flawed, as the payments depend on the relative movements of the fixed and floating rates, with the fixed rate being the payment obligation, not the receipt. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (a): Describe and compare how equity, interest rate, fixed-income, and currency forward and futures contracts are priced and valued<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Trevor Holden<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Trevor Holden advises corporate finance and treasury departments on borrowing decisions and working capital management. In particular, Holden specializes in analyzing and recommending derivatives strategies that help his clients maintain an acceptable level of exposure to market-based risks.<\/p><p>Holden meets with Martha Coleman, CFO of Brownstone Design (Brownstone), a US-based office furniture manufacturer. Nine months ago, Brownstone Designs reached a strategic partnership with Elemental Interiors that would see the two firms collaborate on certain projects. As part of the partnership, Brownstone signed a forward agreement to purchase 100,000 shares of Elemental Interiors&#x27; stock, which trades under the ticker symbol ETI and does not pay a dividend, of USD 35.50 per share one year later. The current market price of ETI shares is USD 38.21.<\/p><p>Coleman asks for Holden&#x27;s advice on valuing this forward contract, which expires in three months. In particular, she is concerned because Brownstone&#x27;s internal valuation models generate prices thats appear inconsistent with the market price of new 6-month futures contracts on ETI stock, which are currently trading for USD 39.00 on a per share basis. Holden looks up the latest quo
