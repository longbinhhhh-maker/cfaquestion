he following sentiments:<\/p><p>Implication 1: “Corporate shares being the underlying asset, I would not be too worried or enthusiastic about the impact of a change in risk-free rate on call or put option prices.”<\/p><p>Implication 2: “If I extend the expiration dates from eight to ten months, option L should decrease in value, but option M should increase.”<\/p><p>Greene also shares how he has derived BC’s 19% expected annual volatility with Stewart:<\/p><p>“I have estimated the 19% volatility using BC’s monthly stock price data from the past ten years. This stock price data was used as a starting point to obtain the variance estimate of continuously compounded BC monthly stock returns. It was then converted into an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>The volatility estimation technique used by Greene:<\/p><\/div>", "subj": "derivatives"}, {"n": 9, "q": "The most appropriate response to Question 1 is that current credit risk is relatively:", "opts": ["Equal.", "Lower.", "Higher."], "ans": "B", "expl": "The correct answer to Question 1 is that current credit risk is relatively lower. Currency swaps involve the exchange of notional principals and interest payments in different currencies, which inherently carries credit risk due to the possibility of default by one of the parties involved. However, at the initiation of the contract, the credit risk is minimal because no exchanges have yet occurred, and both parties have agreed to the terms based on their current credit assessments and market conditions. As the swap progresses, especially towards the middle and end of its term, the credit risk increases. This is because the value of the exchanged cash flows can vary due to changes in interest rates and exchange rates, potentially leading to a significant exposure if one party's financial condition deteriorates over the term of the swap. Therefore, the current credit risk at the time of contract initiation is lower compared to the potential credit risk that could develop as the swap approaches its maturity. A is incorrect. The statement that current credit risk is equal to potential credit risk is incorrect because it fails to account for the dynamic nature of credit risk over the life of a currency swap. Initially, the risk is low as no payments have been exchanged and the agreement is based on the current financial standing of the parties. Over time, however, the risk can increase significantly due to changes in market conditions and the financial health of the involved parties. Thus, stating that the risks are equal at all times oversimplifies the complexities involved in a currency swap. C is incorrect. Suggesting that current credit risk is higher is inaccurate because it overlooks the fact that at the initiation of the swap, the parties have just agreed to the terms based on their present circumstances, which typically involves a thorough credit assessment. The credit risk is inherently lower at this point because there has yet to be any exchange of principals or interest payments that could be affected by changes in market conditions or the creditworthiness of the parties. As the swap progresses, the potential for credit risk increases, particularly if the financial conditions of either party deteriorate or if significant fluctuations in interest or exchange rates occur. ", "explhtml": "<p>The correct answer to Question 1 is that current credit risk is relatively lower. Currency swaps involve the exchange of notional principals and interest payments in different currencies, which inherently carries credit risk due to the possibility of default by one of the parties involved. However, at the initiation of the contract, the credit risk is minimal because no exchanges have yet occurred, and both parties have agreed to the terms based on their current credit assessments and market conditions. As the swap progresses, especially towards the middle and end of its term, the credit risk increases. This is because the value of the exchanged cash flows can vary due to changes in interest rates and exchange rates, potentially leading to a significant exposure if one party&#x27;s financial condition deteriorates over the term of the swap. Therefore, the current credit risk at the time of contract initiation is lower compared to the potential credit risk that could develop as the swap approaches its maturity.<\/p><p><b>A is incorrect<\/b>. The statement that current credit risk is equal to potential credit risk is incorrect because it fails to account for the dynamic nature of credit risk over the life of a currency swap. Initially, the risk is low as no payments have been exchanged and the agreement is based on the current financial standing of the parties. Over time, however, the risk can increase significantly due to changes in market conditions and the financial health of the involved parties. Thus, stating that the risks are equal at all times oversimplifies the complexities involved in a currency swap.<\/p><p><b>C is incorrect<\/b>. Suggesting that current credit risk is higher is inaccurate because it overlooks the fact that at the initiation of the swap, the parties have just agreed to the terms based on their present circumstances, which typically involves a thorough credit assessment. The credit risk is inherently lower at this point because there has yet to be any exchange of principals or interest payments that could be affected by changes in market conditions or the creditworthiness of the parties. As the swap progresses, the potential for credit risk increases, particularly if the financial conditions of either party deteriorate or if significant fluctuations in interest or exchange rates occur. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (f): Describe how currency swaps are priced, and calculate and interpret their no- arbitrage value<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · K2Sports IMEX<\/summary><div class=\"vig-body\"><p>K2Sports IMEX is a maker of athletic clothing and gear which prepares and presents its financial statements in Euros and is based in the Netherlands. This year, the company’s chief executive officer announced a business expansion plan whereby multiple stores will be opened across the US. The company will need to borrow $300 million to finance its expansion plan and would like to protect against a potential rise in interest rates. The company’s chief financial officer (CFO) proposes Sports IMEX engage Jonathon Knowles, a derivatives specialist, in devising a potential solution.<\/p><p>Knowles proposes the company enter into a 1-year quarterly paying currency swap which will allow the company to:<\/p><p>pay US dollars at a fixed rate of 3.00%,<\/p><p>receive Euros at a floating rate, and<\/p><p>convert Euros to dollars at a current spot rate of €0.75.<\/p><p>The CFO agrees to the proposal and enters into the swap on behalf of the company. Thirty days after entering into the swap, the CFO calls a meeting with Knowles where he puts forth the following questions:<\/p><p>Question 1: How does current credit risk compare to potential credit risk for currency swaps on the contract initiation date?<\/p><p>Question 2: I have heard that swaps can be equated to forwards and futures contacts. How true is this assertion?<\/p><p>Upon the CFO’s request, Knowles values the swap sixty days after contract initiation. The current spot rate is now €0.80. Exhibit 1 illustrates the discount factors associated with the LIBOR and Euribor rates at swap payment dates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0050.webp\" style=\"max-width:min(100%,242px)\" alt=\"Exhibit 1: Discount Factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0051.webp\" style=\"max-width:min(100%,608px)\" alt=\"Day LIBOR Discount Factor Euribor Discount Factor\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0052.webp\" style=\"max-width:min(100%,608px)\" alt=\"30 0.99494 0.99215\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0053.webp\" style=\"max-width:min(100%,608px)\" alt=\"120 0.98945 0.98425\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0054.webp\" style=\"max-width:min(100%,608px)\" alt=\"210 0.97816 0.96830\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0055.webp\" style=\"max-width:min(100%,608px)\" alt=\"300 0.96823 0.95609\"><p>Later on during the meeting, Knowles discusses how the swap spread is implicit in the fixed swap rate and how it can vary over it’s maturity.<\/p><p>Knowles has been asked to devise a suitable strategy for protecting a sum of €5 million, to be received by the company two years from today, from a potential decline in interest rates and loss in investment income. The amount is to be invested for three years. The chosen strategy should allow the company to later engage at a more favorable market rate.<\/p><p>Knowles proposes an interest rate swaption with an annual paying swap as the underlying to hedge the company&#x27;s investment. He presents the term structure and associated discount factors anticipated at the expiration of the swaption (Exhibit 2). He intends to use these rates to determine the swap fixed rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0056.webp\" style=\"max-width:min(100%,292px)\" alt=\"Exhibit 2: Euribor Term Structure at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0057.webp\" style=\"max-width:min(100%,379px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0058.webp\" style=\"max-width:min(100%,379px)\" alt=\"360 3.50\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0059.webp\" style=\"max-width:min(100%,379px)\" alt=\"720 3.95\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0060.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,080 4.20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0061.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,440 4.75\"><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 1 is that current credit risk is relatively:<\/p><\/div>", "subj": "derivatives"}, {"n": 10, "q": "The most appropriate response to Question 2 is that the equivalence least likely holds true for:", "opts": ["Futures", "Forwards", "Both forwards and futures"], "ans": "C", "expl": "Swaps and forwards are both financial derivatives used for hedging or speculation, but they have distinct characteristics that make them suitable for different purposes. A swap typically involves a series of cash flows between the two parties based on different interest rates or currencies, and these cash flows occur at regular intervals over the life of the contract. For example, in an interest rate swap, one party might agree to pay a fixed rate while receiving a floating rate, or vice versa. This series of exchanges allows for continuous adjustment to changing market conditions over the term of the swap. A is incorrect. Futures contracts, unlike swaps, are standardized contracts that are traded on an exchange. Futures involve a commitment to buy or sell an asset at a future date at a price agreed upon today. These contracts are marked to market daily, meaning the gains and losses are settled at the end of each trading day. Futures contracts also involve a clearinghouse that acts as the counterparty to both sides of the transaction, significantly reducing the credit risk for the parties involved. This standardization and daily settlement differentiate futures significantly from swaps, which are customized contracts with more flexible terms negotiated between two parties and settled at the end of the contract term or at specified intervals. B is incorrect. Forwards are more similar to swaps than futures because both forwards and swaps are typically customized OTC contracts between two parties. A forward contract involves an agreement to buy or sell an asset at a specified price on a future date. Like swaps, forwards are not marked to market daily, and they do not involve a clearinghouse. The main difference between forwards and swaps is that forwards consist of a single transaction at maturity, whereas swaps involve multiple transactions over the life of the contract. Despite these differences, the basic principle of locking in a future price or rate is common to both forwards and swaps, making them more comparable to each other than to futures. ", "explhtml": "<p>Swaps and forwards are both financial derivatives used for hedging or speculation, but they have distinct characteristics that make them suitable for different purposes. A swap typically involves a series of cash flows between the two parties based on different interest rates or currencies, and these cash flows occur at regular intervals over the life of the contract. For example, in an interest rate swap, one party might agree to pay a fixed rate while receiving a floating rate, or vice versa. This series of exchanges allows for continuous adjustment to changing market conditions over the term of the swap.<\/p><p><b>A is incorrect<\/b>. Futures contracts, unlike swaps, are standardized contracts that are traded on an exchange. Futures involve a commitment to buy or sell an asset at a future date at a price agreed upon today. These contracts are marked to market daily, meaning the gains and losses are settled at the end of each trading day. Futures contracts also involve a clearinghouse that acts as the counterparty to both sides of the transaction, significantly reducing the credit risk for the parties involved. This standardization and daily settlement differentiate futures significantly from swaps, which are customized contracts with more flexible terms negotiated between two parties and settled at the end of the contract term or at specified intervals.<\/p><p><b>B is incorrect<\/b>. Forwards are more similar to swaps than futures because both forwards and swaps are typically customized OTC contracts between two parties. A forward contract involves an agreement to buy or sell an asset at a specified price on a future date. Like swaps, forwards are not marked to market daily, and they do not involve a clearinghouse. The main difference between forwards and swaps is that forwards consist of a single transaction at maturity, whereas swaps involve multiple transactions over the life of the contract. Despite these differences, the basic principle of locking in a future price or rate is common to both forwards and swaps, making them more comparable to each other than to futures. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe how interest rate forwards and futures are priced, and calculate and interpret their no-arbitrage value<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · K2Sports IMEX<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>K2Sports IMEX is a maker of athletic clothing and gear which prepares and presents its financial statements in Euros and is based in the Netherlands. This year, the company’s chief executive officer announced a business expansion plan whereby multiple stores will be opened across the US. The company will need to borrow $300 million to finance its expansion plan and would like to protect against a potential rise in interest rates. The company’s chief financial officer (CFO) proposes Sports IMEX engage Jonathon Knowles, a derivatives specialist, in devising a potential solution.<\/p><p>Knowles proposes the company enter into a 1-year quarterly paying currency swap which will allow the company to:<\/p><p>pay US dollars at a fixed rate of 3.00%,<\/p><p>receive Euros at a floating rate, and<\/p><p>convert Euros to dollars at a current spot rate of €0.75.<\/p><p>The CFO agrees to the proposal and enters into the swap on behalf of the company. Thirty days after entering into the swap, the CFO calls a meeting with Knowles where he puts forth the following questions:<\/p><p>Question 1: How does current credit risk compare to potential credit risk for currency swaps on the contract initiation date?<\/p><p>Question 2: I have heard that swaps can be equated to forwards and futures contacts. How true is this assertion?<\/p><p>Upon the CFO’s request, Knowles values the swap sixty days after contract initiation. The current spot rate is now €0.80. Exhibit 1 illustrates the discount factors associated with the LIBOR and Euribor rates at swap payment dates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0050.webp\" style=\"max-width:min(100%,242px)\" alt=\"Exhibit 1: Discount Factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0051.webp\" style=\"max-width:min(100%,608px)\" alt=\"Day LIBOR Discount Factor Euribor Discount Factor\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0052.webp\" style=\"max-width:min(100%,608px)\" alt=\"30 0.99494 0.99215\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0053.webp\" style=\"max-width:min(100%,608px)\" alt=\"120 0.98945 0.98425\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0054.webp\" style=\"max-width:min(100%,608px)\" alt=\"210 0.97816 0.96830\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0055.webp\" style=\"max-width:min(100%,608px)\" alt=\"300 0.96823 0.95609\"><p>Later on during the meeting, Knowles discusses how the swap spread is implicit in the fixed swap rate and how it can vary over it’s maturity.<\/p><p>Knowles has been asked to devise a suitable strategy for protecting a sum of €5 million, to be received by the company two years from today, from a potential decline in interest rates and loss in investment income. The amount is to be invested for three years. The chosen strategy should allow the company to later engage at a more favorable market rate.<\/p><p>Knowles proposes an interest rate swaption with an annual paying swap as the underlying to hedge the company&#x27;s investment. He presents the term structure and associated discount factors anticipated at the expiration of the swaption (Exhibit 2). He intends to use these rates to determine the swap fixed rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0056.webp\" style=\"max-width:min(100%,292px)\" alt=\"Exhibit 2: Euribor Term Structure at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0057.webp\" style=\"max-width:min(100%,379px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0058.webp\" style=\"max-width:min(100%,379px)\" alt=\"360 3.50\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0059.webp\" style=\"max-width:min(100%,379px)\" alt=\"720 3.95\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0060.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,080 4.20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0061.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,440 4.75\"><\/div><\/details><div class=\"qtext\"><p>The most appropriate response to Question 2 is that the equivalence least likely holds true for:<\/p><\/div>", "subj": "derivatives"}, {"n": 11, "q": "Which of the following factors will most likely cause swap spreads to widen?", "opts": ["Economic recessions", "Default of the swap counterparty", "Credit ratings downgrade of a swap counterparty."], "ans": "A", "expl": "Swap spreads are essentially the difference between the yield on a fixed-rate swap and the yield on a risk-free government bond of similar maturity. They are influenced by various factors, including the overall credit risk in the financial markets. During economic recessions, the uncertainty and risk in the financial markets generally increase. Investors demand higher yields for taking on more risk, which leads to wider swap spreads. This is because, in a recession, the likelihood of default and credit spread increases, affecting all credit-related instruments. As a result, the swap spreads widen as the market demands a higher premium for taking on increased risk. This widening is reflective of a broader economic impact rather than the condition of a specific counterparty. B is incorrect. While the default of a swap counterparty does impact the perceived risk and could potentially affect the terms and conditions of that specific swap, it does not generally lead to a widening of swap spreads market-wide. Swap spreads are more reflective of systemic credit risk rather than isolated incidents of default. Therefore, while a default might impact the specific swap involved, it does not typically influence the overall market's swap spreads. C is incorrect. A credit rating downgrade of a swap counterparty affects the perceived risk of the specific swap contracts associated with that counterparty. However, similar to a default, this is an isolated event affecting only the involved parties. While it might increase the spread of the affected swaps, it does not necessarily lead to a wider spread in the swap market as a whole. Swap spreads are influenced more by broader economic conditions and systemic financial risk rather than by changes in the credit quality of individual counterparties. ", "explhtml": "<p>Swap spreads are essentially the difference between the yield on a fixed-rate swap and the yield on a risk-free government bond of similar maturity. They are influenced by various factors, including the overall credit risk in the financial markets. During economic recessions, the uncertainty and risk in the financial markets generally increase. Investors demand higher yields for taking on more risk, which leads to wider swap spreads. This is because, in a recession, the likelihood of default and credit spread increases, affecting all credit-related instruments. As a result, the swap spreads widen as the market demands a higher premium for taking on increased risk. This widening is reflective of a broader economic impact rather than the condition of a specific counterparty.<\/p><p><b>B is incorrect<\/b>. While the default of a swap counterparty does impact the perceived risk and could potentially affect the terms and conditions of that specific swap, it does not generally lead to a widening of swap spreads market-wide. Swap spreads are more reflective of systemic credit risk rather than isolated incidents of default. Therefore, while a default might impact the specific swap involved, it does not typically influence the overall market&#x27;s swap spreads.<\/p><p><b>C is incorrect<\/b>. A credit rating downgrade of a swap counterparty affects the perceived risk of the specific swap contracts associated with that counterparty. However, similar to a default, this is an isolated event affecting only the involved parties. While it might increase the spread of the affected swaps, it does not necessarily lead to a wider spread in the swap market as a whole. Swap spreads are influenced more by broader economic conditions and systemic financial risk rather than by changes in the credit quality of individual counterparties. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe how interest rate forwards and futures are priced, and calculate and interpret their no-arbitrage value.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · K2Sports IMEX<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>K2Sports IMEX is a maker of athletic clothing and gear which prepares and presents its financial statements in Euros and is based in the Netherlands. This year, the company’s chief executive officer announced a business expansion plan whereby multiple stores will be opened across the US. The company will need to borrow $300 million to finance its expansion plan and would like to protect against a potential rise in interest rates. The company’s chief financial officer (CFO) proposes Sports IMEX engage Jonathon Knowles, a derivatives specialist, in devising a potential solution.<\/p><p>Knowles proposes the company enter into a 1-year quarterly paying currency swap which will allow the company to:<\/p><p>pay US dollars at a fixed rate of 3.00%,<\/p><p>receive Euros at a floating rate, and<\/p><p>convert Euros to dollars at a current spot rate of €0.75.<\/p><p>The CFO agrees to the proposal and enters into the swap on behalf of the company. Thirty days after entering into the swap, the CFO calls a meeting with Knowles where he puts forth the following questions:<\/p><p>Question 1: How does current credit risk compare to potential credit risk for currency swaps on the contract initiation date?<\/p><p>Question 2: I have heard that swaps can be equated to forwards and futures contacts. How true is this assertion?<\/p><p>Upon the CFO’s request, Knowles values the swap sixty days after contract initiation. The current spot rate is now €0.80. Exhibit 1 illustrates the discount factors associated with the LIBOR and Euribor rates at swap payment dates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0050.webp\" style=\"max-width:min(100%,242px)\" alt=\"Exhibit 1: Discount Factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0051.webp\" style=\"max-width:min(100%,608px)\" alt=\"Day LIBOR Discount Factor Euribor Discount Factor\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0052.webp\" style=\"max-width:min(100%,608px)\" alt=\"30 0.99494 0.99215\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0053.webp\" style=\"max-width:min(100%,608px)\" alt=\"120 0.98945 0.98425\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0054.webp\" style=\"max-width:min(100%,608px)\" alt=\"210 0.97816 0.96830\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0055.webp\" style=\"max-width:min(100%,608px)\" alt=\"300 0.96823 0.95609\"><p>Later on during the meeting, Knowles discusses how the swap spread is implicit in the fixed swap rate and how it can vary over it’s maturity.<\/p><p>Knowles has been asked to devise a suitable strategy for protecting a sum of €5 million, to be received by the company two years from today, from a potential decline in interest rates and loss in investment income. The amount is to be invested for three years. The chosen strategy should allow the company to later engage at a more favorable market rate.<\/p><p>Knowles proposes an interest rate swaption with an annual paying swap as the underlying to hedge the company&#x27;s investment. He presents the term structure and associated discount factors anticipated at the expiration of the swaption (Exhibit 2). He intends to use these rates to determine the swap fixed rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0056.webp\" style=\"max-width:min(100%,292px)\" alt=\"Exhibit 2: Euribor Term Structure at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0057.webp\" style=\"max-width:min(100%,379px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0058.webp\" style=\"max-width:min(100%,379px)\" alt=\"360 3.50\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0059.webp\" style=\"max-width:min(100%,379px)\" alt=\"720 3.95\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0060.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,080 4.20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0061.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,440 4.75\"><\/div><\/details><div class=\"qtext\"><p>Which of the following factors will most likely cause swap spreads to widen?<\/p><\/div>", "subj": "derivatives"}, {"n": 12, "q": "The most suitable swaption contract will permit Sports IMEX to:", "opts": ["Receive and pay a floating rate.", "Receive a fixed and pay a floating rate", "Receive a floating and pay a fixed rate."], "ans": "B", "expl": "Sports IMEX aims to protect its future investment of €5 million from potential declines in interest rates and consequent loss in investment income. To achieve this, the company should consider entering into a receiver swaption. A receiver swaption provides the holder the right, but not the obligation, to enter into an interest rate swap where they will receive a fixed rate and pay a floating rate. This strategy is particularly beneficial in a declining interest rate environment, as it allows Sports IMEX to lock in a higher fixed rate while paying a lower floating rate, thus maintaining a higher level of income. The fixed rate received acts as a hedge against falling rates, ensuring that the company's investment yields do not diminish significantly even if the market rates decrease. A is incorrect. It suggests that Sports IMEX should receive and pay a floating rate. This strategy would not serve as an effective hedge against declining interest rates because both the received and paid rates would decrease in a falling rate environment. Consequently, the company would not be able to secure a stable or increased income over the investment period, leaving the investment exposed to rate volatility and potential reduction in returns. C is incorrect. Option C, which involves receiving a floating rate and paying a fixed rate, is also unsuitable for Sports IMEX's objectives. In this setup, if interest rates fall, the floating rate that Sports IMEX receives would decrease, while the fixed rate they pay remains constant. This mismatch would lead to increased costs relative to income, effectively reducing the company's net income from the investment. This scenario is exactly what Sports IMEX aims to avoid by hedging against interest rate declines. ", "explhtml": "<p>Sports IMEX aims to protect its future investment of €5 million from potential declines in interest rates and consequent loss in investment income. To achieve this, the company should consider entering into a receiver swaption. A receiver swaption provides the holder the right, but not the obligation, to enter into an interest rate swap where they will receive a fixed rate and pay a floating rate. This strategy is particularly beneficial in a declining interest rate environment, as it allows Sports IMEX to lock in a higher fixed rate while paying a lower floating rate, thus maintaining a higher level of income. The fixed rate received acts as a hedge against falling rates, ensuring that the company&#x27;s investment yields do not diminish significantly even if the market rates decrease.<\/p><p><b>A is incorrect<\/b>. It suggests that Sports IMEX should receive and pay a floating rate. This strategy would not serve as an effective hedge against declining interest rates because both the received and paid rates would decrease in a falling rate environment. Consequently, the company would not be able to secure a stable or increased income over the investment period, leaving the investment exposed to rate volatility and potential reduction in returns.<\/p><p><b>C is incorrect<\/b>. Option C, which involves receiving a floating rate and paying a fixed rate, is also unsuitable for Sports IMEX&#x27;s objectives. In this setup, if interest rates fall, the floating rate that Sports IMEX receives would decrease, while the fixed rate they pay remains constant. This mismatch would lead to increased costs relative to income, effectively reducing the company&#x27;s net income from the investment. This scenario is exactly what Sports IMEX aims to avoid by hedging against interest rate declines. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe how interest rate forwards and futures are priced, and calculate and interpret their no-arbitrage value.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · K2Sports IMEX<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>K2Sports IMEX is a maker of athletic clothing and gear which prepares and presents its financial statements in Euros and is based in the Netherlands. This year, the company’s chief executive officer announced a business expansion plan whereby multiple stores will be opened across the US. The company will need to borrow $300 million to finance its expansion plan and would like to protect against a potential rise in interest rates. The company’s chief financial officer (CFO) proposes Sports IMEX engage Jonathon Knowles, a derivatives specialist, in devising a potential solution.<\/p><p>Knowles proposes the company enter into a 1-year quarterly paying currency swap which will allow the company to:<\/p><p>pay US dollars at a fixed rate of 3.00%,<\/p><p>receive Euros at a floating rate, and<\/p><p>convert Euros to dollars at a current spot rate of €0.75.<\/p><p>The CFO agrees to the proposal and enters into the swap on behalf of the company. Thirty days after entering into the swap, the CFO calls a meeting with Knowles where he puts forth the following questions:<\/p><p>Question 1: How does current credit risk compare to potential credit risk for currency swaps on the contract initiation date?<\/p><p>Question 2: I have heard that swaps can be equated to forwards and futures contacts. How true is this assertion?<\/p><p>Upon the CFO’s request, Knowles values the swap sixty days after contract initiation. The current spot rate is now €0.80. Exhibit 1 illustrates the discount factors associated with the LIBOR and Euribor rates at swap payment dates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0050.webp\" style=\"max-width:min(100%,242px)\" alt=\"Exhibit 1: Discount Factors\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0051.webp\" style=\"max-width:min(100%,608px)\" alt=\"Day LIBOR Discount Factor Euribor Discount Factor\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0052.webp\" style=\"max-width:min(100%,608px)\" alt=\"30 0.99494 0.99215\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0053.webp\" style=\"max-width:min(100%,608px)\" alt=\"120 0.98945 0.98425\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0054.webp\" style=\"max-width:min(100%,608px)\" alt=\"210 0.97816 0.96830\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0055.webp\" style=\"max-width:min(100%,608px)\" alt=\"300 0.96823 0.95609\"><p>Later on during the meeting, Knowles discusses how the swap spread is implicit in the fixed swap rate and how it can vary over it’s maturity.<\/p><p>Knowles has been asked to devise a suitable strategy for protecting a sum of €5 million, to be received by the company two years from today, from a potential decline in interest rates and loss in investment income. The amount is to be invested for three years. The chosen strategy should allow the company to later engage at a more favorable market rate.<\/p><p>Knowles proposes an interest rate swaption with an annual paying swap as the underlying to hedge the company&#x27;s investment. He presents the term structure and associated discount factors anticipated at the expiration of the swaption (Exhibit 2). He intends to use these rates to determine the swap fixed rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0056.webp\" style=\"max-width:min(100%,292px)\" alt=\"Exhibit 2: Euribor Term Structure at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0057.webp\" style=\"max-width:min(100%,379px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0058.webp\" style=\"max-width:min(100%,379px)\" alt=\"360 3.50\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0059.webp\" style=\"max-width:min(100%,379px)\" alt=\"720 3.95\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0060.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,080 4.20\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0061.webp\" style=\"max-width:min(100%,379px)\" alt=\"1,440 4.75\"><\/div><\/details><div class=\"qtext\"><p>The most suitable swaption contract will permit Sports IMEX to:<\/p><\/div>", "subj": "derivatives"}, {"n": 13, "q": "The initial forward price for the wheat futures contract is closest to:", "opts": ["AUD 972", "AUD 1,000", "AUD 1,029"], "ans": "C", "expl": "The correct answer is option C, which is AUD 1,029. To determine the no-arbitrage forward price of the wheat futures contract, we use the formula for calculating the forward price in a risk-free environment. The formula is given by: Where F(0, T) is the forward price of the commodity at time T , S0 is the current spot price of the commodity, r is the risk-free rate, and T is the time to maturity of the contract in years. Plugging in the values provided: S0 = AUD 1, 000, r = 5%, and T = 172 years (since 7 months is 172 of a year). Calculating the forward price: This calculation shows that the no-arbitrage forward price, rounded to the nearest dollar, is approximately AUD 1,029, which matches option C. A is incorrect. It suggests a forward price of AUD 972. This value is significantly lower than the calculated no-arbitrage forward price. The discrepancy arises because the formula for the forward price incorporates the effect of the risk-free rate compounding over the period until the contract's maturity. Ignoring or incorrectly applying the compounding effect of the risk-free rate would result in an inaccurate and lower forward price, as seen in option A. B is incorrect. It suggests a forward price of AUD 1,000, which is exactly the current spot price of wheat. This option does not account for the time value of money reflected through the risk-free rate over the contract period. The forward price should be higher than the spot price in a positive interest rate environment, as the cost of carrying the commodity includes the opportunity cost of not investing at the risk-free rate. Therefore, option B underestimates the forward price by not incorporating the interest accrual over the seven months. ", "explhtml": "<p>The correct answer is option C, which is AUD 1,029. To determine the no-arbitrage forward price of the wheat futures contract, we use the formula for calculating the forward price in a risk-free environment. The formula is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0082.webp\" style=\"max-width:min(100%,178px)\" alt=\"F(0,T) = S0 × (1 + r)T\"><p>Where F(0, T) is the forward price of the commodity at time T , S<sub>0<\/sub> is the current spot price of the commodity, r is the risk-free rate, and T is the time to maturity of the contract in years. Plugging in the values provided:<\/p><p>S<sub>0<\/sub> = AUD 1, 000, r = 5%, and T =<sub> 1<\/sub><sup>7<\/sup><sub>2<\/sub> years (since 7 months is <sub>1<\/sub><sup>7<\/sup><sub>2<\/sub> of a year).<\/p><p>Calculating the forward price:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0083.webp\" style=\"max-width:min(100%,491px)\" alt=\"7 F(0, T ) = 1000 × (1 + 0.05)12 ≈ AUD 1, 028.8698 ≈ AUD 1, 029\"><p>This calculation shows that the no-arbitrage forward price, rounded to the nearest dollar, is approximately AUD 1,029, which matches option C.<\/p><p><b>A is incorrect<\/b>. It suggests a forward price of AUD 972. This value is significantly lower than the calculated no-arbitrage forward price. The discrepancy arises because the formula for the forward price incorporates the effect of the risk-free rate compounding over the period until the contract&#x27;s maturity. Ignoring or incorrectly applying the compounding effect of the risk-free rate would result in an inaccurate and lower forward price, as seen in option A.<\/p><p><b>B is incorrect<\/b>. It suggests a forward price of AUD 1,000, which is exactly the current spot price of wheat. This option does not account for the time value of money reflected through the risk-free rate over the contract period. The forward price should be higher than the spot price in a positive interest rate environment, as the cost of carrying the commodity includes the opportunity cost of not investing at the risk-free rate. Therefore, option B underestimates the forward price by not incorporating the interest accrual over the seven months. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe how interest rate forwards and futures are priced, and calculate and interpret their no-arbitrage value.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Nicholas Cohen<\/summary><div class=\"vig-body\"><p>Nicholas Cohen, based in Australia, is an investor who frequently invests in various commodities and fixed income securities. Cohen typically invests for a period of no longer than twelve months. His chief objective is to earn arbitrage profits on his investments.<\/p><p>One of Cohen’s commodity investments includes Australian wheat. Although Cohen has never hedged his investments in the past, the recent flooding situation in Queensland has destabilized the market and created volatility in wheat forward prices. To secure the value of his commodity investments, Cohen has decided to enter into a wheat forward contract, which will enable him to sell his investment in seven months. The current spot price for wheat is AUD 1,000, and the Australian risk-free rate is 5%.<\/p><p>Before entering into the contract, Cohen discovered that the wheat forward price for a contract expiring in seven months is AUD 1,500. Cohen wants to know if he can earn an additional return if he enters into a contract at the current forward price instead of the no-arbitrage forward price.<\/p><p>Cohen’s fixed income investments include corporate bonds issued by Test Manufacturing, a surgical equipment manufacturer. Test Manufacturing (TM) has had a healthy record of delivering high-quality surgical equipment. However, in the recent past, 56% of the units of specialized equipment failed the company’s internal quality test. Quite a large number of units of this equipment have been shipped out to various hospitals, most of which have reported similar sentiments regarding the equipment’s efficiency. As a result, quality standards authorities have notified the manufacturer to call back all distributed equipment, cancel pending orders, and temporarily halt production until the problem is fixed. TM’s CEO estimates losses amounting to AUD 20 million due to the regulatory intervention. Rating agencies have also taken cue from consumers and downgraded Test Manufacturing corporate bonds, dramatically increasing the bonds’ yields.  Due to the current and further anticipated increases in yield, Cohen has protected his corporate bond investment by going short a forward contract on the corporate bond investment, maturing a day after the third coupon payment. The underlying bond has a maturity of seven years, and pays a coupon of AUD 85 on a semi-annual basis. 200 days into the investment, the current price of the underlying bond is AUD 1,250.50. The first three coupon payments are due in 181, 365, and 547 days. The initial forward price at the time of contract initiation was AUD 1,075.45. Cohen would like to sell the underlying bond upon receiving the third coupon payment. <\/p><p>Lance Easel is an employee working at Test Manufacturing’s finance department. Easel has estimated rectification costs at $5 million to rectify the quality issue. Easel determines that TM will have to arrange a loan with a notional principal amounting to 50% of the rectification costs to finance the rectification. This six-month loan will be taken in two months and mature in eight months. Easel recommends that Test Manufacturing undertake a forward rate agreement beginning today and expiring in two months. Easelbelieves that by locking itself into such an agreement, TM can be protected from increases in interest rates, which may increase borrowing costs if left unhedged. Easel has compiled data on the term structure of the interest rates with the current LIBOR rate at 6.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0062.webp\" style=\"max-width:min(100%,227px)\" alt=\"Exhibit 1 Term Structure of LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0063.webp\" style=\"max-width:min(100%,295px)\" alt=\"Current LIBOR 6.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0064.webp\" style=\"max-width:min(100%,295px)\" alt=\"30-day LIBOR 6.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0065.webp\" style=\"max-width:min(100%,295px)\" alt=\"60-day LIBOR 7.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0066.webp\" style=\"max-width:min(100%,295px)\" alt=\"90-day LIBOR 8.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0067.webp\" style=\"max-width:min(100%,295px)\" alt=\"120-day LIBOR 9.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0068.webp\" style=\"max-width:min(100%,295px)\" alt=\"150-day LIBOR 11.35%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0069.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 12.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0070.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 13.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0071.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 14.00%\"><p>Thirty days after entering into the FRA agreement, the yield curve shifted upward. As a result, the term structure of interest rates is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0072.webp\" style=\"max-width:min(100%,290px)\" alt=\"Exhibit 2 Term Structure of Interest Rates\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0073.webp\" style=\"max-width:min(100%,295px)\" alt=\"Current LIBOR 7.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0074.webp\" style=\"max-width:min(100%,295px)\" alt=\"30-day LIBOR 7.65%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0075.webp\" style=\"max-width:min(100%,295px)\" alt=\"60-day LIBOR 8.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0076.webp\" style=\"max-width:min(100%,295px)\" alt=\"90-day LIBOR 9.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0077.webp\" style=\"max-width:min(100%,295px)\" alt=\"120-day LIBOR 11.25%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0078.webp\" style=\"max-width:min(100%,295px)\" alt=\"150-day LIBOR 13.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0079.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 14.24%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0080.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 15.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0081.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 15.25%\"><p>Janice Howell, CFA, is a portfolio manager and owner of an asset management firm. She conducts her investing activities from the U.S. Her clients&#x27; portfolios comprise of global securities and are thus exposed to significant currency risk. Howell enters into currency forward contracts denominated in Australian dollars to protect the portfolios from losses due to exchange rate fluctuations. Since Australian stocks are a favorite among her clients, Howell deems it essential to hedge the inherent foreign exchange risk. The U.S. and Australian risk-free rates are 3.50% and 5.00%, respectively. The contract will expire in three months and has a current price of USD 0.98 per AUD.<\/p><\/div><\/details><div class=\"qtext\"><p>The initial forward price for the wheat futures contract is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 14, "q": "Using the AUD 1,500 current forward price and the forward price obtained in the solution to Part 1, the forward position Cohen will undertake and the annualized rate of return earned on the position, respectively, are:", "opts": ["A long position and the annualized rate of return is 50.0%.", "A short position and the annualized rate of return is 51.4%.", "A short position and the annualized rate of return is 100.4%."], "ans": "C", "expl": "Nicholas Cohen, considering the current forward price of AUD 1,500 against the no-arbitrage forward price of AUD 1,029, identifies an arbitrage opportunity. The no-arbitrage forward price is calculated based on the spot price of AUD 1,000 and the Australian risk-free rate of 5% for a seven-month period. The formula for the no-arbitrage forward price is given by where r is the risk-free rate and t is the time in years. Substituting the values, we get Since the market forward price (AUD 1,500) is significantly higher than the no-arbitrage forward price, Cohen should take a short position, meaning he commits to selling the wheat at the forward price of AUD 1,500. The return from this transaction for seven months is calculated as or 50%. To annualize this return, we use the formula which gives or 100.4%. Hence, the annualized rate of return is 100.4%. A is incorrect. It suggests that Cohen should take a long position and the annualized rate of return is 50.0%. This is incorrect because taking a long position would mean agreeing to buy wheat at the forward price, which is not beneficial when the forward price is higher than the no-arbitrage price. Additionally, the annualized return calculation in option A is incorrect as it does not properly convert the seven-month return to an annualized figure, which should be 100.4% as calculated. B is incorrect. It states that Cohen should take a short position and the annualized rate of return is 51.4%. While the recommendation for a short position is correct, the specified annualized rate of return of 51.4% is incorrect. The correct annualized return, based on the calculations provided, should be 100.4%, not 51.4%. This discrepancy in the return calculation leads to the incorrectness of option B. ", "explhtml": "<p>Nicholas Cohen, considering the current forward price of AUD 1,500 against the no-arbitrage forward price of AUD 1,029, identifies an arbitrage opportunity. The no-arbitrage forward price is calculated based on the spot price of AUD 1,000 and the Australian risk-free rate of 5% for a seven-month period. The formula for the no-arbitrage forward price is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0084.webp\" style=\"max-width:min(100%,275px)\" alt=\"Forward Price = Spot Price × e(r×t)\"><p>where r is the risk-free rate and t is the time in years. Substituting the values, we get<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0085.webp\" style=\"max-width:min(100%,326px)\" alt=\"7 Forward Price = 1000 × e(0.05×12) = 1029.\"><p>Since the market forward price (AUD 1,500) is significantly higher than the no-arbitrage forward price, Cohen should take a short position, meaning he commits to selling the wheat at the forward price of AUD 1,500. The return from this transaction for seven months is calculated as<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0086.webp\" style=\"max-width:min(100%,133px)\" alt=\"1500 −1 = 0.50 1000\"><p>or 50%. To annualize this return, we use the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0087.webp\" style=\"max-width:min(100%,147px)\" alt=\"12 (1 + Return) 7 − 1\"><p>which gives<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0088.webp\" style=\"max-width:min(100%,142px)\" alt=\"12 1.5 7 − 1 = 1.004\"><p>or 100.4%. Hence, the annualized rate of return is 100.4%.<\/p><p><b>A is incorrect<\/b>. It suggests that Cohen should take a long position and the annualized rate of return is 50.0%. This is incorrect because taking a long position would mean agreeing to buy wheat at the forward price, which is not beneficial when the forward price is higher than the no-arbitrage price. Additionally, the annualized return calculation in option A is incorrect as it does not properly convert the seven-month return to an annualized figure, which should be 100.4% as calculated.<\/p><p><b>B is incorrect<\/b>. It states that Cohen should take a short position and the annualized rate of return is 51.4%. While the recommendation for a short position is correct, the specified annualized rate of return of 51.4% is incorrect. The correct annualized return, based on the calculations provided, should be 100.4%, not 51.4%. This discrepancy in the return calculation leads to the incorrectness of option B. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1(c): Describe how interest rate forwards and futures are priced, and calculate and interpret their no-arbitrage value.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Nicholas Cohen<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Nicholas Cohen, based in Australia, is an investor who frequently invests in various commodities and fixed income securities. Cohen typically invests for a period of no longer than twelve months. His chief objective is to earn arbitrage profits on his investments.<\/p><p>One of Cohen’s commodity investments includes Australian wheat. Although Cohen has never hedged his investments in the past, the recent flooding situation in Queensland has destabilized the market and created volatility in wheat forward prices. To secure the value of his commodity investments, Cohen has decided to enter into a wheat forward contract, which will enable him to sell his investment in seven months. The current spot price for wheat is AUD 1,000, and the Australian risk-free rate is 5%.<\/p><p>Before entering into the contract, Cohen discovered that the wheat forward price for a contract expiring in seven months is AUD 1,500. Cohen wants to know if he can earn an additional return if he enters into a contract at the current forward price instead of the no-arbitrage forward price.<\/p><p>Cohen’s fixed income investments include corporate bonds issued by Test Manufacturing, a surgical equipment manufacturer. Test Manufacturing (TM) has had a healthy record of delivering high-quality surgical equipment. However, in the recent past, 56% of the units of specialized equipment failed the company’s internal quality test. Quite a large number of units of this equipment have been shipped out to various hospitals, most of which have reported similar sentiments regarding the equipment’s efficiency. As a result, quality standards authorities have notified the manufacturer to call back all distributed equipment, cancel pending orders, and temporarily halt production until the problem is fixed. TM’s CEO estimates losses amounting to AUD 20 million due to the regulatory intervention. Rating agencies have also taken cue from consumers and downgraded Test Manufacturing corporate bonds, dramatically increasing the bonds’ yields.  Due to the current and further anticipated increases in yield, Cohen has protected his corporate bond investment by going short a forward contract on the corporate bond investment, maturing a day after the third coupon payment. The underlying bond has a maturity of seven years, and pays a coupon of AUD 85 on a semi-annual basis. 200 days into the investment, the current price of the underlying bond is AUD 1,250.50. The first three coupon payments are due in 181, 365, and 547 days. The initial forward price at the time of contract initiation was AUD 1,075.45. Cohen would like to sell the underlying bond upon receiving the third coupon payment. <\/p><p>Lance Easel is an employee working at Test Manufacturing’s finance department. Easel has estimated rectification costs at $5 million to rectify the quality issue. Easel determines that TM will have to arrange a loan with a notional principal amounting to 50% of the rectification costs to finance the rectification. This six-month loan will be taken in two months and mature in eight months. Easel recommends that Test Manufacturing undertake a forward rate agreement beginning today and expiring in two months. Easelbelieves that by locking itself into such an agreement, TM can be protected from increases in interest rates, which may increase borrowing costs if left unhedged. Easel has compiled data on the term structure of the interest rates with the current LIBOR rate at 6.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0062.webp\" style=\"max-width:min(100%,227px)\" alt=\"Exhibit 1 Term Structure of LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0063.webp\" style=\"max-width:min(100%,295px)\" alt=\"Current LIBOR 6.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0064.webp\" style=\"max-width:min(100%,295px)\" alt=\"30-day LIBOR 6.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0065.webp\" style=\"max-width:min(100%,295px)\" alt=\"60-day LIBOR 7.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0066.webp\" style=\"max-width:min(100%,295px)\" alt=\"90-day LIBOR 8.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0067.webp\" style=\"max-width:min(100%,295px)\" alt=\"120-day LIBOR 9.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0068.webp\" style=\"max-width:min(100%,295px)\" alt=\"150-day LIBOR 11.35%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0069.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 12.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0070.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 13.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0071.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 14.00%\"><p>Thirty days after entering into the FRA agreement, the yield curve shifted upward. As a result, the term structure of interest rates is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0072.webp\" style=\"max-width:min(100%,290px)\" alt=\"Exhibit 2 Term Structure of Interest Rates\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0073.webp\" style=\"max-width:min(100%,295px)\" alt=\"Current LIBOR 7.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0074.webp\" style=\"max-width:min(100%,295px)\" alt=\"30-day LIBOR 7.65%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0075.webp\" style=\"max-width:min(100%,295px)\" alt=\"60-day LIBOR 8.50%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0076.webp\" style=\"max-width:min(100%,295px)\" alt=\"90-day LIBOR 9.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0077.webp\" style=\"max-width:min(100%,295px)\" alt=\"120-day LIBOR 11.25%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0078.webp\" style=\"max-width:min(100%,295px)\" alt=\"150-day LIBOR 13.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0079.webp\" style=\"max-width:min(100%,295px)\" alt=\"180-day LIBOR 14.24%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0080.webp\" style=\"max-width:min(100%,295px)\" alt=\"210-day LIBOR 15.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0081.webp\" style=\"max-width:min(100%,295px)\" alt=\"240-day LIBOR 15.25%\"><p>Janice Howell, CFA, is a portfolio manager and owner of an asset management firm. She conducts her investing activities from the U.S. Her clients&#x27; portfolios comprise of global securities and are thus exposed to significant currency risk. Howell enters into currency forward contracts denominated in Australian dollars to protect the portfolios from losses due to exchange rate fluctuations. Since Australian stocks are a favorite among her clients, Howell deems it essential to hedge the inherent foreign exchange risk. The U.S. and Australian risk-free rates are 3.50% and 5.00%, respectively. The contract will expire in three months and has a current price of USD 0.98 per AUD.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the AUD 1,500 current forward price and the forward price obtained in the solution to Part 1, the forward position Cohen will undertake and the annualized rate of return earned on the position, respectively, are:<\/p><\/div>", "subj": "derivatives"}, {"n": 15, "q": "Using the information in exhibit 1, the initial rate on the FRA agreement undertaken by Test Manufacturing is:", "opts": ["11.98%", "15.97%", "16.32%"], "ans": "B", "expl": "The initial rate on the FRA agreement undertaken by Test Manufacturing is calculated using the formula for the forward rate agreement (FRA) rate, which is designed to determine the interest rate applicable to a future period, hedging against the risk of interest rate fluctuations. The formula for the FRA rate is: Where: L0(h) is the LIBOR rate for the initial period h. L0(h + m) is the LIBOR rate for the total period h + m. h is the duration until the FRA starts, in days. m is the duration from the start of the FRA to the end of the loan period, in days. In this scenario, h = 60 days (2 months), and m = 180 days (the period from the start of the FRA to the end of the loan period, which is 240 days - 60 days). Using the term structure from Exhibit 1, L0(60) = 7.50% and L0(240) = 14.00%. Plugging these values into the formula: A is incorrect. The option A value of 11.98% does not align with the calculated FRA rate. This discrepancy can be attributed to either a miscalculation or incorrect application of the FRA formula. The correct application, as demonstrated, leads to a rate significantly higher than 11.98%, reflecting the higher interest rates projected over the longer term as indicated in the term structure. C is incorrect. The value of 16.32% suggested in option C is higher than the calculated FRA rate. This could be due to an overestimation of the rates or a misinterpretation of the term structure's impact over the specified period. The precise calculation using the correct inputs and formula results in a rate closer to 15.97%, thus invalidating option C. ", "explhtml": "<p>The initial rate on the FRA agreement undertaken by Test Manufacturing is calculated using the formula for the forward rate agreement (FRA) rate, which is designed to determine the interest rate applicable to a future period, hedging against the risk of interest rate fluctuations. The formula for the FRA rate is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0089.webp\" style=\"max-width:min(100%,369px)\" alt=\"⎛ 1 + L0(h + m) × h+m 360 ⎞ 360 FRA(0, h, m) = ⎜ ⎝ 1 + L0(h) × 360 h −1 ⎟ ⎠ × m\"><p>Where:<\/p><p>L<sub>0<\/sub>(h) is the LIBOR rate for the initial period h.<\/p><p>L<sub>0<\/sub>(h + m) is the LIBOR rate for the total period h + m.<\/p><p>h is the duration until the FRA starts, in days.<\/p><p>m is the duration from the start of the FRA to the end of the loan period, in days.<\/p><p>In this scenario, h = 60 days (2 months), and m = 180 days (the period from the start of the FRA to the end of the loan period, which is 240 days - 60 days). Using the term structure from Exhibit 1, L<sub>0<\/sub>(60) = 7.50% and L<sub>0<\/sub>(240) = 14.00%. Plugging these values into the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0090.webp\" style=\"max-width:min(100%,428px)\" alt=\"⎛ 1 + 0.14 × 240 360 ⎞ 360 FRA(0,60, 180) = −1 × = 15.97% ⎝ 1 + 0.075 × 60 360 ⎠ 180\"><p><b>A is incorrect<\/b>. The option A value of 11.98% does not align with the calculated FRA rate. This discrepancy can be attributed to either a miscalculation or incorrect application of the FRA formula. The correct application, as demonstrated, leads to a rate significantly higher than 11.98%, reflecting the higher interest rates projected over the longer term as indicated in the term structure.<\/p><p><b>C is incorrect<\/b>. The value of 16.32% suggested in option C is higher than the calculated FRA rate. This co itial rate on the FRA agreement undertaken by Test Manufacturing)?", "opts": ["+AUD 2,273", "+AUD1,738", "+ AUD 14,620"], "ans": "B", "expl": "The value of the Forward Rate Agreement (FRA) can be calculated using the formula for the value of an FRA on day g after initiation, which is given by: Where Lg is the LIBOR rate at day g, h is the initial term of the FRA, and m is the maturity of the FRA from the start. Plugging in the values from Exhibit 2: Calculating the above expression: Given the notional principal of AUD 2.5 million, the value of the FRA after 30 days is: A is incorrect. The value calculated using the correct formula and the data provided does not match with option A, which is - AUD 2,273. This negative value suggests a loss, whereas the calculated positive value indicates a gain, reflecting an increase in the value of the FRA due to the interest rate changes. C is incorrect. The calculated value of approximately AUD 1,738 is significantly lower than the value given in option C, which is + AUD 14,620. This large discrepancy indicates that option C greatly overestimates the value of the FRA, possibly due to a misunderstanding of the scale of interest rate changes or the calculation method. ", "explhtml": "<p>The value of the Forward Rate Agreement (FRA) can be calculated using the formula for the value of an FRA on day g after initiation, which is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0091.webp\" style=\"max-width:min(100%,485px)\" alt=\"⎛ 1 ⎞ ⎛ 1 + FRA(0, h, m) × 360 m ⎞ Vg(0, h, m) = ⎜ ⎝ 1 + Lg(h −g) × h−g 360 ⎟ ⎠ − ⎜ ⎝ 1 + Lg(h + m −g) × h+m−g 360 ⎟ ⎠\"><p>Where L<sub>g<\/sub> is the LIBOR rate at day g, h is the initial term of the FRA, and m is the maturity of the FRA from the start. Plugging in the values from Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0092.webp\" style=\"max-width:min(100%,434px)\" alt=\"⎛ 1 ⎞ ⎛ 1 + 0.15971 × 180 360 ⎞ V30(0, 60, 180) = − ⎝ 1 + 0.0765 × 30 360 ⎠ ⎝ 1 + 0.15
