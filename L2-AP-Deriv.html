mg\" loading=\"lazy\" src=\"l2img/ap07/f0200.webp\" style=\"max-width:min(100%,587px)\" alt=\"Borrow USD at 2.5%. Convert USD to EUR at the spot rate of 1.10 and invest the EUR at 1.5%. Take a long position in the EUR futures contract at 1.10.\"><p>This set of transactions locks in a risk-free profit with no initial investment, aligning with the principles of the carry arbitrage model.<\/p><p><b>A is incorrect<\/b>. It states the futures is overvalued and suggests selling it. This is the opposite of the correct arbitrage strategy. An arbitrageur would want to buy an undervalued asset, not sell it.<\/p><p><b>C is incorrect<\/b>. It claims the market is in equilibrium. Our calculation proves it is not. The difference of 0.0028 USD per EUR is a significant arbitrage opportunity that would be quickly exploited by market participants. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(h): Describe how the Black–Scholes–Merton model is used to value European options on equities and currencies<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Tim Laman<\/summary><div class=\"vig-body\"><p>Tim Laman, CFA, is a portfolio manager with Pete Associates, a US-based hedge fund. The firm has significant equity and fixed income European and Japanese securities investments. The hedge fund is always open to exploiting any arbitrage opportunity in international equity, fixed income, currency, or derivative markets.<\/p><p>Tim&#x27;s portfolio manages has nearly $150 million invested in European equities and an equal amount invested in Yen denominated securities of Japanese business entities.<\/p><p>Due to recent macroeconomic developments in the European Union, Tim is worried about Pete Associates’ European equities portfolio value. To protect the portfolio value, Tim makes the following decisions:<\/p><p>Sell 3-month maturity index futures on Stoxx, a widely followed European equity index<\/p><p>Sell 3-month maturity futures on the Euro<\/p><p>Buy 3-month maturity put option on the Euro<\/p><p>Tim has the following data available to support his decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0181.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0182.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Stoxx 3,230\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0183.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on Stoxx 0.75% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0184.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on EUR 1.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0185.webp\" style=\"max-width:min(100%,608px)\" alt=\"USD EUR exchange rate USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0186.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on USD 2.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0187.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 months futures on Euro USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0188.webp\" style=\"max-width:min(100%,608px)\" alt=\"Call option on EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0189.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 3 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0190.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike price Euro 1.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0191.webp\" style=\"max-width:min(100%,608px)\" alt=\"Premium USD 0.03\"><p>Pete Associates has invested nearly $150 million in Yen denominated equity securities of Japanese firms. Tim believes that Japan’s economy is not gaining growth momentum despite its government&#x27;s best efforts. Pete Associates’ internal research suggests that Japanese equities are somewhat overvalued and unlikely to increase further next year. Tim plans to write covered calls on Japanese equities. He decides to compute call prices based on binomial models and the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0192.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0193.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity of call option 2 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0194.webp\" style=\"max-width:min(100%,608px)\" alt=\"Nodes for the binomial pricing 2 model\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0195.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0196.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Nikkei 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0197.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0198.webp\" style=\"max-width:min(100%,608px)\" alt=\"Price increment in one period = Price decrement in one period = 10% 9.09%\"><p>Tim discusses his plan with Ira Block, a senior equity analyst with Pete Associates. Block indicates that the pricing accuracy of the binomial option pricing model can be improved. She suggests that Tim consider the Black-Scholes option pricing model for valuing call options on the Nikkei.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data provided in Exhibit 1, the no-arbitrage price of a 3-month futures contract on the Euro (EUR/USD) and the nature of any arbitrage opportunity is closest to?<\/p><\/div>", "subj": "derivatives"}, {"n": 34, "q": "The no-arbitrage price for a 3-month maturity futures contract on Stoxx is closest to", "opts": ["3230", "3236", "3242"], "ans": "B", "expl": "The no-arbitrage price for a 3-month maturity futures contract on the Stoxx index can be calculated using the formula that incorporates the spot price of the index, the risk-free interest rate, and the dividend yield. The formula is given by where F is the futures price, S is the spot price, r is the risk-free rate, q is the dividend yield, and T is the time to maturity in years. Plugging in the values from the question, we have S = 3230,  r = 1.50% (continuously compounded), q = 0.75% (continuously compounded), and T = 0.25 years (3 months). Therefore, the calculation becomes This calculation shows that the futures price, adjusted for the interest rate and dividend yield over the specified period, is approximately 3236, which corresponds to option B. A is incorrect. The value of 3230 represents the spot price of the Stoxx index without any adjustments for the risk-free rate or the dividend yield. Futures prices need to account for these factors to avoid arbitrage opportunities. Simply using the spot price as the futures price does not incorporate the cost of carry, which includes the benefits of holding the underlying asset (like receiving dividends) and the costs (like paying interest). Therefore, using the spot price directly as the futures price ignores these critical economic factors and results in an incorrect valuation. C is incorrect. The value of 3242 suggests a calculation that might have either overestimated the risk-free rate or underestimated the dividend yield, or incorrectly calculated the time factor in the exponent. As shown in the correct calculation, the precise adjustment of these values leads to a futures price of approximately 3236. Any deviation in these input values or their application in the formula can lead to an inaccurate futures price, which does not properly reflect the no-arbitrage condition in financial markets. ", "explhtml": "<p>The no-arbitrage price for a 3-month maturity futures contract on the Stoxx index can be calculated using the formula that incorporates the spot price of the index, the risk-free interest rate, and the dividend yield. The formula is given by<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0201.webp\" style=\"max-width:min(100%,122px)\" alt=\"F = S × e(r−q)T\"><p>where F is the futures price, S is the spot price, r is the risk-free rate, q is the dividend yield, and T is the time to maturity in years. Plugging in the values from the question, we have S = 3230,  r = 1.50% (continuously compounded), q = 0.75% (continuously compounded), and T = 0.25 years (3 months). Therefore, the calculation becomes<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0202.webp\" style=\"max-width:min(100%,430px)\" alt=\"F = 3230 × e(0.015−0.0075)×0.25 = 3230 × e0.001875 ≈3236.\"><p>This calculation shows that the futures price, adjusted for the interest rate and dividend yield over the specified period, is approximately 3236, which corresponds to option B.<\/p><p><b>A is incorrect<\/b>. The value of 3230 represents the spot price of the Stoxx index without any adjustments for the risk-free rate or the dividend yield. Futures prices need to account for these factors to avoid arbitrage opportunities. Simply using the spot price as the futures price does not incorporate the cost of carry, which includes the benefits of holding the underlying asset (like receiving dividends) and the costs (like paying interest). Therefore, using the spot price directly as the futures price ignores these critical economic factors and results in an incorrect valuation.<\/p><p><b>C is incorrect<\/b>. The value of 3242 suggests a calculation that might have either overestimated the risk-free rate or underestimated the dividend yield, or incorrectly calculated the time factor in the exponent. As shown in the correct calculation, the precise adjustment of these values leads to a futures price of approximately 3236. Any deviation in these input values or their application in the formula can lead to an inaccurate futures price, which does not properly reflect the no-arbitrage condition in financial markets. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (d): Calculate and interpret the no-arbitrage value of interest rate, currency, and equity swaps<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Tim Laman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Laman, CFA, is a portfolio manager with Pete Associates, a US-based hedge fund. The firm has significant equity and fixed income European and Japanese securities investments. The hedge fund is always open to exploiting any arbitrage opportunity in international equity, fixed income, currency, or derivative markets.<\/p><p>Tim&#x27;s portfolio manages has nearly $150 million invested in European equities and an equal amount invested in Yen denominated securities of Japanese business entities.<\/p><p>Due to recent macroeconomic developments in the European Union, Tim is worried about Pete Associates’ European equities portfolio value. To protect the portfolio value, Tim makes the following decisions:<\/p><p>Sell 3-month maturity index futures on Stoxx, a widely followed European equity index<\/p><p>Sell 3-month maturity futures on the Euro<\/p><p>Buy 3-month maturity put option on the Euro<\/p><p>Tim has the following data available to support his decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0181.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0182.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Stoxx 3,230\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0183.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on Stoxx 0.75% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0184.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on EUR 1.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0185.webp\" style=\"max-width:min(100%,608px)\" alt=\"USD EUR exchange rate USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0186.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on USD 2.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0187.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 months futures on Euro USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0188.webp\" style=\"max-width:min(100%,608px)\" alt=\"Call option on EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0189.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 3 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0190.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike price Euro 1.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0191.webp\" style=\"max-width:min(100%,608px)\" alt=\"Premium USD 0.03\"><p>Pete Associates has invested nearly $150 million in Yen denominated equity securities of Japanese firms. Tim believes that Japan’s economy is not gaining growth momentum despite its government&#x27;s best efforts. Pete Associates’ internal research suggests that Japanese equities are somewhat overvalued and unlikely to increase further next year. Tim plans to write covered calls on Japanese equities. He decides to compute call prices based on binomial models and the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0192.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0193.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity of call option 2 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0194.webp\" style=\"max-width:min(100%,608px)\" alt=\"Nodes for the binomial pricing 2 model\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0195.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0196.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Nikkei 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0197.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0198.webp\" style=\"max-width:min(100%,608px)\" alt=\"Price increment in one period = Price decrement in one period = 10% 9.09%\"><p>Tim discusses his plan with Ira Block, a senior equity analyst with Pete Associates. Block indicates that the pricing accuracy of the binomial option pricing model can be improved. She suggests that Tim consider the Black-Scholes option pricing model for valuing call options on the Nikkei.<\/p><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage price for a 3-month maturity futures contract on Stoxx is closest to<\/p><\/div>", "subj": "derivatives"}, {"n": 35, "q": "Which of the following will improve the pricing precision of the binomial option pricing model?", "opts": ["Applying the model for small maturity options", "Reducing the magnitude of increment and decrement of asset prices", "Dividing the option’s life into a greater number of time periods in a binomial tree"], "ans": "C", "expl": "It involves dividing the option's life into a greater number of time periods in a binomial tree, which enhances the pricing precision of the binomial option pricing model. The binomial model is a discrete-time model that approximates the continuous-time stochastic process of stock price movements. By increasing the number of time periods (or steps) in the model, the approximation to the continuous process becomes more accurate. This is because the model can capture more detailed fluctuations and variations in the asset's price over its life. As the number of steps increases, the binomial model's results converge towards those of the Black-Scholes model, which is a continuous-time model. Therefore, increasing the number of time periods allows the model to more closely mimic the actual path that an asset's price might take, leading to more precise option pricing. A is incorrect. Applying the model for small maturity options does not inherently improve the pricing precision of the binomial option pricing model. While using the model for options with shorter maturities might reduce the absolute pricing error in some cases, it does not address the fundamental discretization error of the model. The key to improving precision lies in how finely the time to maturity is divided, not just the length of the maturity itself. Shorter maturities with fewer divisions can still lead to significant pricing errors if the asset price experiences significant volatility or if the model parameters are not adequately calibrated. B is incorrect. Reducing the magnitude of increment and decrement of asset prices in the binomial model does not directly lead to improved pricing precision. This modification might affect the volatility assumption in the model, but it does not address the core issue of time discretization. The precision improvement in binomial models primarily comes from increasing the number of intervals or steps in the model, which allows for a finer simulation of the continuous price path of the underlying asset. Simply adjusting the size of price changes without increasing the number of steps does not ensure a more accurate model output. ", "explhtml": "<p>It involves dividing the option&#x27;s life into a greater number of time periods in a binomial tree, which enhances the pricing precision of the binomial option pricing model. The binomial model is a discrete-time model that approximates the continuous-time stochastic process of stock price movements. By increasing the number of time periods (or steps) in the model, the approximation to the continuous process becomes more accurate. This is because the model can capture more detailed fluctuations and variations in the asset&#x27;s price over its life. As the number of steps increases, the binomial model&#x27;s results converge towards those of the Black-Scholes model, which is a continuous-time model. Therefore, increasing the number of time periods allows the model to more closely mimic the actual path that an asset&#x27;s price might take, leading to more precise option pricing.<\/p><p><b>A is incorrect<\/b>. Applying the model for small maturity options does not inherently improve the pricing precision of the binomial option pricing model. While using the model for options with shorter maturities might reduce the absolute pricing error in some cases, it does not address the fundamental discretization error of the model. The key to improving precision lies in how finely the time to maturity is divided, not just the length of the maturity itself. Shorter maturities with fewer divisions can still lead to significant pricing errors if the asset price experiences significant volatility or if the model parameters are not adequately calibrated.<\/p><p><b>B is incorrect<\/b>. Reducing the magnitude of increment and decrement of asset prices in the binomial model does not directly lead to improved pricing precision. This modification might affect the volatility assumption in the model, but it does not address the core issue of time discretization. The precision improvement in binomial models primarily comes from increasing the number of intervals or steps in the model, which allows for a finer simulation of the continuous price path of the underlying asset. Simply adjusting the size of price changes without increasing the number of steps does not ensure a more accurate model output. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (a): Describe and interpret the binomial option valuation model and its component terms<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Tim Laman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Laman, CFA, is a portfolio manager with Pete Associates, a US-based hedge fund. The firm has significant equity and fixed income European and Japanese securities investments. The hedge fund is always open to exploiting any arbitrage opportunity in international equity, fixed income, currency, or derivative markets.<\/p><p>Tim&#x27;s portfolio manages has nearly $150 million invested in European equities and an equal amount invested in Yen denominated securities of Japanese business entities.<\/p><p>Due to recent macroeconomic developments in the European Union, Tim is worried about Pete Associates’ European equities portfolio value. To protect the portfolio value, Tim makes the following decisions:<\/p><p>Sell 3-month maturity index futures on Stoxx, a widely followed European equity index<\/p><p>Sell 3-month maturity futures on the Euro<\/p><p>Buy 3-month maturity put option on the Euro<\/p><p>Tim has the following data available to support his decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0181.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0182.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Stoxx 3,230\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0183.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on Stoxx 0.75% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0184.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on EUR 1.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0185.webp\" style=\"max-width:min(100%,608px)\" alt=\"USD EUR exchange rate USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0186.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on USD 2.50% ssumptions about the probabilities of up and down moves or the discount factor used. The precise calculation using the correct parameters and formulae as shown leads to a value closer to 1,150, not 1,200. This discrepancy highlights the importance of accurate parameter selection and mathematical precision in financial modeling. C is incorrect. Option C estimates the call option price at 1,238, which is significantly higher than the calculated value of 1,150.21. This overestimation could result from an incorrect calculation of the risk-neutral probabilities or the misapplication of the binomial model formulae. It is crucial to apply the correct computational steps and to use accurate market data and theoretical models to avoid such overestimations. The binomial model, when applied correctly, provides a clear framework for estimating option prices based on possible future stock price movements and their associated probabilities. ", "explhtml": "<p>It estimates the price of a 2-year maturity call option on the Nikkei using a two-period binomial option pricing model. To determine this, we first calculate the risk-neutral probability of an up-move (p) using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0203.webp\" style=\"max-width:min(100%,139px)\" alt=\"(1 + RF) −D p = U −D\"><p>where U is the up-move factor, D is the down-move factor, and R<sub>F<\/sub> is the risk-free rate. Given U = 1.10 (or a 10% increase), D = 0.9091 (or a 9.09% decrease), and R<sub>F<\/sub> = 0.01 (or 1%), we find<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0204.webp\" style=\"max-width:min(100%,224px)\" alt=\"1.01 −0.9091 p = 1.10 −0.9091 = 0.52855.\"><p>Next, we calculate the projected Nikkei spot prices at each node: S<sub>U<\/sub> = 22, 000, S<sub>D<\/sub> = 18, 182,  S<sub>UU<\/sub> = 24, 200, S<sub>U D<\/sub> = 20, 000, and S<sub>DD<\/sub> = 16, 529. The call option payoffs at the end of year 2 are  V<sub>U U<\/sub> = 4, 200, V<sub>U D<\/sub> = 0, and V<sub>DD<\/sub> = 0. The call option price at time 0 is then calculated as the expected present value of these payoffs, discounted at the risk-free rate, resulting in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0205.webp\" style=\"max-width:min(100%,265px)\" alt=\"0.528552 × 4, 200 V0 = = 1,150.21. 1.012\"><p>This calculation shows that the price of the call option is closest to 1,150, validating option A as the correct choice.<\/p><p><b>B is incorrect<\/b>. Option B suggests that the price of the call option is 1,200, which does not align with the calculations based on the binomial option pricing model. The error in this option likely arises from incorrect assumptions about the probabilities of up and down moves or the discount factor used. The precise calculation using the correct parameters and formulae as shown leads to a value closer to 1,150, not 1,200. This discrepancy highlights the importance of accurate parameter selection and mathematical precision in financial modeling.<\/p><p><b>C is incorrect<\/b>. Option C estimates the call option price at 1,238, which is significantly higher than the calculated value of 1,150.21. This overestimation could result from an incorrect calculation of the risk-neutral probabilities or the misapplication of the binomial model formulae. It is crucial to apply the correct computational steps and to use accurate market data and theoretical models to avoid such overestimations. The binomial model, when applied correctly, provides a clear framework for estimating option prices based on possible future stock price movements and their associated probabilities. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(b): Calculate the no-arbitrage values of European and American options using a two-period binomial model<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Tim Laman<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Laman, CFA, is a portfolio manager with Pete Associates, a US-based hedge fund. The firm has significant equity and fixed income European and Japanese securities investments. The hedge fund is always open to exploiting any arbitrage opportunity in international equity, fixed income, currency, or derivative markets.<\/p><p>Tim&#x27;s portfolio manages has nearly $150 million invested in European equities and an equal amount invested in Yen denominated securities of Japanese business entities.<\/p><p>Due to recent macroeconomic developments in the European Union, Tim is worried about Pete Associates’ European equities portfolio value. To protect the portfolio value, Tim makes the following decisions:<\/p><p>Sell 3-month maturity index futures on Stoxx, a widely followed European equity index<\/p><p>Sell 3-month maturity futures on the Euro<\/p><p>Buy 3-month maturity put option on the Euro<\/p><p>Tim has the following data available to support his decision:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0181.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0182.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Stoxx 3,230\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0183.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on Stoxx 0.75% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0184.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on EUR 1.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0185.webp\" style=\"max-width:min(100%,608px)\" alt=\"USD EUR exchange rate USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0186.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate on USD 2.50% continuously compounded\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0187.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 months futures on Euro USD 1.10 per EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0188.webp\" style=\"max-width:min(100%,608px)\" alt=\"Call option on EUR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0189.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 3 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0190.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike price Euro 1.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0191.webp\" style=\"max-width:min(100%,608px)\" alt=\"Premium USD 0.03\"><p>Pete Associates has invested nearly $150 million in Yen denominated equity securities of Japanese firms. Tim believes that Japan’s economy is not gaining growth momentum despite its government&#x27;s best efforts. Pete Associates’ internal research suggests that Japanese equities are somewhat overvalued and unlikely to increase further next year. Tim plans to write covered calls on Japanese equities. He decides to compute call prices based on binomial models and the following data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0192.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0193.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity of call option 2 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0194.webp\" style=\"max-width:min(100%,608px)\" alt=\"Nodes for the binomial pricing 2 model\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0195.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk-free interest rate 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0196.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot Nikkei 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0197.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 20,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0198.webp\" style=\"max-width:min(100%,608px)\" alt=\"Price increment in one period = Price decrement in one period = 10% 9.09%\"><p>Tim discusses his plan with Ira Block, a senior equity analyst with Pete Associates. Block indicates that the pricing accuracy of the binomial option pricing model can be improved. She suggests that Tim consider the Black-Scholes option pricing model for valuing call options on the Nikkei.<\/p><\/div><\/details><div class=\"qtext\"><p>The price of a 2-year maturity call option on the Nikkei according to a two-period binomial option pricing model is closest to<\/p><\/div>", "subj": "derivatives"}, {"n": 37, "q": "Reardon’s comment about option risk measures is most likely:", "opts": ["Correct.", "Incorrect with respect to rho.", "Incorrect with respect to vega."], "ans": "B", "expl": "Reardon's comment about the option risk measures, specifically regarding rho and vega, requires a detailed understanding of how these Greeks affect option pricing. Vega measures the sensitivity of an option's price to changes in the volatility of the underlying asset. It is always positive for both call and put options because an increase in volatility generally increases the potential range of movement for the underlying asset's price by the expiration date, thereby increasing the probability that the option will end up in-the-money. This makes the option more valuable, regardless of whether it is a call or a put. The key error in Reardon's statement lies in her claim about rho. Rho measures the sensitivity of an option's price to changes in the risk-free interest rate. For call options, rho is positive, indicating that an increase in interest rates generally increases the value of the call option. This is because higher interest rates decrease the present value of the exercise price paid at expiration. However, for put options, rho is negative. An increase in interest rates makes it less attractive to hold the option as the present value of the exercise price received at expiration is reduced. A is incorrect. Reardon's statement might seem correct at first glance because she correctly identifies that vega is positive for both types of options. However, her statement is partially incorrect because it does not account for the behavior of rho for put options. Simply stating that the comment is correct overlooks the complexity introduced by the incorrect statement about rho, which is a critical aspect of understanding option pricing dynamics. C is incorrect. This choice suggests that Reardon's comment is incorrect specifically regarding vega. However, this is not accurate because Reardon's statement that vega is positive for both Option A and Option B is correct. Vega being positive is a fundamental characteristic of all options, as it reflects the increased value with higher volatility. Dismissing her entire statement based on an incorrect understanding of vega would be misleading and incorrect. ", "explhtml": "<p>Reardon&#x27;s comment about the option risk measures, specifically regarding rho and vega, requires a detailed understanding of how these Greeks affect option pricing. Vega measures the sensitivity of an option&#x27;s price to changes in the volatility of the underlying asset. It is always positive for both call and put options because an increase in volatility generally increases the potential range of movement for the underlying asset&#x27;s price by the expiration date, thereby increasing the probability that the option will end up in-the-money. This makes the option more valuable, regardless of whether it is a call or a put.<\/p><p>The key error in Reardon&#x27;s statement lies in her claim about rho. Rho measures the sensitivity of an option&#x27;s price to changes in the risk-free interest rate. For call options, rho is positive, indicating that an increase in interest rates generally increases the value of the call option. This is because higher interest rates decrease the present value of the exercise price paid at expiration. However, for put options, rho is negative. An increase in interest rates makes it less attractive to hold the option as the present value of the exercise price received at expiration is reduced.<\/p><p><b>A is incorrect<\/b>. Reardon&#x27;s statement might seem correct at first glance because she correctly identifies that vega is positive for both types of options. However, her statement is partially incorrect because it does not account for the behavior of rho for put options. Simply stating that the comment is correct overlooks the complexity introduced by the incorrect statement about rho, which is a critical aspect of understanding option pricing dynamics.<\/p><p><b>C is incorrect<\/b>. This choice suggests that Reardon&#x27;s comment is incorrect specifically regarding vega. However, this is not accurate because Reardon&#x27;s statement that vega is positive for both Option A and Option B is correct. Vega being positive is a fundamental characteristic of all options, as it reflects the increased value with higher volatility. Dismissing her entire statement based on an incorrect understanding of vega would be misleading and incorrect. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (k): Interpret each of the option Greeks<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Damien Lafferty<\/summary><div class=\"vig-body\"><p>In Melbourne, Australia, Damien Lafferty is a derivatives trader with Stockton &amp; Sullivan Brokerage. Lafferty will sell put and call options for clients seeking to manage portfolio risk before offsetting these naked short positions with appropriate hedges.<\/p><p>Recently, Lafferty sold 10,000 call options and an additional 10,000 put options based on the stock of Orillia Minerals, which trades on the Australian Stock Exchange under the ticker symbol OMN and does not pay a dividend. The current share price of OMN stock is AUD 100.00. Having established these positions, Lafferty&#x27;s objective is to reduce the resulting level of exposure to by creating a delta-neutral position. He has decided to borrow OMN shares and sell them shortly to accomplish this objective. In addition to the data shown in Exhibit 1, Lafferty learns that Option A has a gamma of 0.031.<\/p><p><b>Exhibit 1: Options on OMN stock sold by Lafferty (AUD per share prices)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0206.webp\" style=\"max-width:min(100%,598px)\" alt=\"Option Type Exercise price Time to Expiry Delta Price\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0207.webp\" style=\"max-width:min(100%,598px)\" alt=\"A Call 105.3 90 days 0.4 3.294\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0208.webp\" style=\"max-width:min(100%,598px)\" alt=\"B Put 105.3 90 days -0.6 7.304\"><p>Note: Both Option A and Option B are European-style options<\/p><p>Lafferty&#x27;s colleague, Sophia Reardon, who joined the firm last month after graduating from business school, asks him about factors influencing option prices. Reardon claims that the time value of options decays at a linear rate over time. Lafferty disagrees, adding &quot;The rate of time value decay decelerates as an option approaches maturity.<\/p><p>The conversation between the two colleagues then turns to the option volatility measures known as the Greeks. Noting Lafferty&#x27;s two option contracts recently sold, Reardon offers the following comment: &quot;For Option A and Option B, vega and rho will be positive.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Reardon’s comment about option risk measures is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 38, "q": "Given his objective, the number of OMN shares that Lafferty must sell short is closest to:", "opts": ["2000", "4000", "6000"], "ans": "A", "expl": "Lafferty's strategy involves creating a delta-neutral position to manage the risk associated with the options he has sold. To achieve this, he needs to offset the net delta of the options positions by short selling OMN shares. The delta of an option represents the rate of change of the option's price relative to a one-unit change in the price of the underlying asset. For the call options (Option A), each has a delta of 0.4, and since Lafferty sold 10,000 of these, the total delta contribution from the call options is . For the put options (Option B), each has a delta of -0.6, and with 10,000 sold, the total delta contribution is . The net delta of these positions is . To neutralize this, Lafferty must short sell 2,000 shares of OMN, as each share has a delta of 1.0. By short selling 2,000 shares, he adds a delta of -2,000, which balances the net delta to zero, achieving a delta-neutral position. B is incorrect. Option B suggests that Lafferty should short sell 4,000 shares, which would not correctly neutralize the net delta of the options positions. As calculated, the net delta from the options is 2,000, meaning only 2,000 shares need to be short sold to achieve delta neutrality. Short selling 4,000 shares would result in an overall delta of , which would not balance the position but instead create an opposite imbalance, leading to additional exposure rather than hedging the existing positions. C is incorrect. Option C, suggesting that 6,000 shares should be short sold, is even further from achieving the desired delta-neutral position. If Lafferty were to short sell 6,000 shares, the total delta would be . This action would significantly over-hedge the position, creating a large negative delta. Such a move would not only fail to neutralize the position but would also expose Lafferty to potential losses should the price of OMN increase, as he would have a substantial short position in the underlying shares that is not required by the net delta of the options sold. ", "explhtml": "<p>Lafferty&#x27;s strategy involves creating a delta-neutral position to manage the risk associated with the options he has sold. To achieve this, he needs to offset the net delta of the options positions by short selling OMN shares. The delta of an option represents the rate of change of the option&#x27;s price relative to a one-unit change in the price of the underlying asset. For the call options (Option A), each has a delta of 0.4, and since Lafferty sold 10,000 of these, the total delta contribution from the call options is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0209.webp\" style=\"max-width:min(100%,202px)\" alt=\"−10, 000 × 0.4 = −4, 000\"><p>. For the put options (Option B), each has a delta of -0.6, and with 10,000 sold, the total delta contribution is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0210.webp\" style=\"max-width:min(100%,202px)\" alt=\"−10, 000 × −0.6 = 6, 000\"><p>. The net delta of these positions is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0211.webp\" style=\"max-width:min(100%,202px)\" alt=\"−4, 000 + 6, 000 = 2, 000\"><p>. To neutralize this, Lafferty must short sell 2,000 shares of OMN, as each share has a delta of 1.0. By short selling 2,000 shares, he adds a delta of -2,000, which balances the net delta to zero, achieving a delta-neutral position.<\/p><p><b>B is incorrect<\/b>. Option B suggests that Lafferty should short sell 4,000 shares, which would not correctly neutralize the net delta of the options positions. As calculated, the net delta from the options is 2,000, meaning only 2,000 shares need to be short sold to achieve delta neutrality. Short selling 4,000 shares would result in an overall delta of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0212.webp\" style=\"max-width:min(100%,214px)\" alt=\"−4,000 + 2,000 = −2, 000\"><p>, which would not balance the position but instead create an opposite imbalance, leading to additional exposure rather than hedging the existing positions.<\/p><p><b>C is incorrect<\/b>. Option C, suggesting that 6,000 shares should be short sold, is even further from achieving the desired delta-neutral position. If Lafferty were to short sell 6,000 shares, the total delta would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0213.webp\" style=\"max-width:min(100%,214px)\" alt=\"−6,000 + 2,000 = −4, 000\"><p>. This action would significantly over-hedge the position, creating a large negative delta. Such a move would not only fail to neutralize the position but would also expose Lafferty to potential losses should the price of OMN increase, as he would have a substantial short position in the underlying shares that is not required by the net delta of the options sold. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(l): Describe how a delta hedge is executed<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Damien Lafferty<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In Melbourne, Australia, Damien Lafferty is a derivatives trader with Stockton &amp; Sullivan Brokerage. Lafferty will sell put and call options for clients seeking to manage portfolio risk before offsetting these naked short positions with appropriate hedges.<\/p><p>Recently, Lafferty sold 10,000 call options and an additional 10,000 put options based on the stock of Orillia Minerals, which trades on the Australian Stock Exchange under the ticker symbol OMN and does not pay a dividend. The current share price of OMN stock is AUD 100.00. Having established these positions, Lafferty&#x27;s objective is to reduce the resulting level of exposure to by creating a delta-neutral position. He has decided to borrow OMN shares and sell them shortly to accomplish this objective. In addition to the data shown in Exhibit 1, Lafferty learns that Option A has a gamma of 0.031.<\/p><p><b>Exhibit 1: Options on OMN stock sold by Lafferty (AUD per share prices)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0206.webp\" style=\"max-width:min(100%,598px)\" alt=\"Option Type Exercise price Time to Expiry Delta Price\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0207.webp\" style=\"max-width:min(100%,598px)\" alt=\"A Call 105.3 90 days 0.4 3.294\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0208.webp\" style=\"max-width:min(100%,598px)\" alt=\"B Put 105.3 90 days -0.6 7.304\"><p>Note: Both Option A and Option B are European-style options<\/p><p>Lafferty&#x27;s colleague, Sophia Reardon, who joined the firm last month after graduating from business school, asks him about factors influencing option prices. Reardon claims that the time value of options decays at a linear rate over time. Lafferty disagrees, adding &quot;The rate of time value decay decelerates as an option approaches maturity.<\/p><p>The conversation between the two colleagues then turns to the option volatility measures known as the Greeks. Noting Lafferty&#x27;s two option contracts recently sold, Reardon offers the following comment: &quot;For Option A and Option B, vega and rho will be positive.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Given his objective, the number of OMN shares that Lafferty must sell short is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 39, "q": "Which of the following is the most accurate assessment of the comments made by Reardon and Lafferty regarding time decay?", "opts": ["Reardon and Lafferty are both incorrect.", "Reardon is correct and Lafferty is incorrect.", "Lafferty is correct and Reardon is incorrect."], "ans": "A", "expl": "Both Reardon and Lafferty have made incorrect statements regarding the rate at which an option's time value declines. Reardon's statement that the time value of options decays at a linear rate over time is incorrect because the time value decay of an option is not linear but instead follows an exponential decay pattern, particularly as the option approaches its expiration. This decay is generally modeled by the theta component of the Greeks, which measures the rate at which an option's price decreases over time due to the passage of time alone. B is incorrect. Reardon's statement that the time value of options decays at a linear rate is incorrect because the decay rate accelerates as the expiration date approaches. This acceleration is due to the diminishing time left for the option to end in-the-money, which reduces the probability of profitability and thus the time value more rapidly as the expiration nears. Lafferty's disagreement with Reardon's linear decay theory is correct in principle, but his claim that the decay rate decelerates is also incorrect, as the decay actually accelerates. C is incorrect. While Lafferty correctly identifies that Reardon's linear decay theory is incorrect, his own statement that the decay rate decelerates is also incorrect. The correct behavior of time value decay is an acceleration as the option nears its expiration. This misunderstanding between the two colleagues highlights a common misconception about the nature of time value decay in options trading. It is crucial for traders and financial professionals to understand that the time value decay curve is convex, accelerating as the option approaches expiry. ", "explhtml": "<p>Both Reardon and Lafferty have made incorrect statements regarding the rate at which an option&#x27;s time value declines. Reardon&#x27;s statement that the time value of options decays at a linear rate over time is incorrect because the time value decay of an option is not linear but instead follows an exponential decay pattern, particularly as the option approaches its expiration. This decay is generally modeled by the theta component of the Greeks, which measures the rate at which an option&#x27;s price decreases over time due to the passage of time alone.<\/p><p><b>B is incorrect<\/b>. Reardon&#x27;s statement that the time value of options decays at a linear rate is incorrect because the decay rate accelerates as the expiration date approaches. This acceleration is due to the diminishing time left for the option to end in-the-money, which reduces the probability of profitability and thus the time value more rapidly as the expiration nears. Lafferty&#x27;s disagreement with Reardon&#x27;s linear decay theory is correct in principle, but his claim that the decay rate decelerates is also incorrect, as the decay actually accelerates.<\/p><p><b>C is incorrect<\/b>. While Lafferty correctly identifies that Reardon&#x27;s linear decay theory is incorrect, his own statement that the decay rate decelerates is also incorrect. The correct behavior of time value decay is an acceleration as the option nears its expiration. This misunderstanding between the two colleagues highlights a common misconception about the nature of time value decay in options trading. It is crucial for traders and financial professionals to understand that the time value decay curve is convex, accelerating as the option approaches expiry. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (k): Interpret each of the option Greeks<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Damien Lafferty<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In Melbourne, Australia, Damien Lafferty is a derivatives trader with Stockton &amp; Sullivan Brokerage. Lafferty will sell put and call options for clients seeking to manage portfolio risk before offsetting these naked short positions with appropriate hedges.<\/p><p>Recently, Lafferty sold 10,000 call options and an additional 10,000 put options based on the stock of Orillia Minerals, which trades on the Australian Stock Exchange under the ticker symbol OMN and does not pay a dividend. The current share price of OMN stock is AUD 100.00. Having established these positions, Lafferty&#x27;s objective is to reduce the resulting level of exposure to by creating a delta-neutral position. He has decided to borrow OMN shares and sell them shortly to accomplish this objective. In addition to the data shown in Exhibit 1, Lafferty learns that Option A has a gamma of 0.031.<\/p><p><b>Exhibit 1: Options on OMN stock sold by Lafferty (AUD per share prices)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0206.webp\" style=\"max-width:min(100%,598px)\" alt=\"Option Type Exercise price Time to Expiry Delta Price\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0207.webp\" style=\"max-width:min(100%,598px)\" alt=\"A Call 105.3 90 days 0.4 3.294\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0208.webp\" style=\"max-width:min(100%,598px)\" alt=\"B Put 105.3 90 days -0.6 7.304\"><p>Note: Both Option A and Option B are European-style options<\/p><p>Lafferty&#x27;s colleague, Sophia Reardon, who joined the firm last month after graduating from business school, asks him about factors influencing option prices. Reardon claims that the time value of options decays at a linear rate over time. Lafferty disagrees, adding &quot;The rate of time value decay decelerates as an option approaches maturity.<\/p><p>The conversation between the two colleagues then turns to the option volatility measures known as the Greeks. Noting Lafferty&#x27;s two option contracts recently sold, Reardon offers the following comment: &quot;For Option A and Option B, vega and rho will be positive.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is the most accurate assessment of the comments made by Reardon and Lafferty regarding time decay?<\/p><\/div>", "subj": "derivatives"}, {"n": 40, "q": "As a result of Lafferty selling OMN shares short, the total level of non-linearity risk to which his positions are exposed will most likely:", "opts": ["Increase.", "Decrease.", "Be unaffected."], "ans": "C", "expl": "Gamma measures the rate of change of delta with respect to changes in the underlying asset's price. Delta itself measures the sensitivity of the option's price to changes in the price of the underlying asset. When Damien Lafferty decides to sell shares of OMN short, he is engaging in a transaction involving the underlying asset directly, not the options. The gamma of an option is solely dependent on the characteristics of the option itself (such as its strike price, the underlying asset's volatility, and time to expiration) and not on the positions taken in the underlying asset. Since selling the shares short does not alter these characteristics of the options, the gamma, and hence the non-linearity risk of the options, remains unchanged. Therefore, Lafferty's action of short selling the shares does not affect the gamma of the options he has written, and thus the non-linearity risk exposure of his positions remains unaffected. A is incorrect. The statement that the total level of non-linearity risk will increase is incorrect because non-linearity risk in options trading is measured by gamma. Gamma quantifies the curvature of the relationship between the option's price and the price of the underlying asset, indicating how delta will change as the underlying price changes. Since the short sale of the underlying OMN shares does not impact the factors that determine gamma (such as the option's strike price, time to expiration, or the underlying asset's volatility), it does not increase the gamma of the options. Therefore, the non-linearity risk, which is a function of gamma, does not increase due to the short sale of the underlying shares. B is incorrect. Similarly, the claim that the total level of non-linearity risk will decrease is also incorrect. As previously explained, gamma is a measure of an option's sensitivity to movements in the price of the underlying asset and is unaffected by positions in the underlying asset itself. Selling the underlying shares short is a separate activity that does not influence the option's gamma or the factors that determine it. Since the gamma remains constant, the non-linearity risk associated with the options does not decrease. The short sale of shares does not provide any hedge or modification to the gamma of the existing options positions, leaving the level of non-linearity risk unchanged. ", "explhtml": "<p>Gamma measures the rate of change of delta with respect to changes in the underlying asset&#x27;s price. Delta itself measures the sensitivity of the option&#x27;s price to changes in the price of the underlying asset. When Damien Lafferty decides to sell shares of OMN short, he is engaging in a transaction involving the underlying asset directly, not the options. The gamma of an option is solely dependent on the characteristics of the option itself (such as its strike price, the underlying asset&#x27;s volatility, and time to expiration) and not on the positions taken in the underlying asset. Since selling the shares short does not alter these characteristics of the options, the gamma, and hence the non-linearity risk of the options, remains unchanged. Therefore, Lafferty&#x27;s action of short selling the shares does not affect the gamma of the options he has written, and thus the non-linearity risk exposure of his positions remains unaffected.<\/p><p><b>A is incorrect.<\/b> The statement that the total level of non-linearity risk will increase is incorrect because non-linearity risk in options trading is measured by gamma. Gamma quantifies the curvature of the relationship between the option&#x27;s price and the price of the underlying asset, indicating how delta will change as the underlying price changes. Since the short sale of the underlying OMN shares does not impact the factors that determine gamma (such as the option&#x27;s strike price, time to expiration, or the underlying asset&#x27;s volatility), it does not increase the gamma of the options. Therefore, the non-linearity risk, which is a function of gamma, does not increase due to the short sale of the underlying shares.<\/p><p><b>B is incorrect.<\/b> Similarly, the claim that the total level of non-linearity risk will decrease is also incorrect. As previously explained, gamma is a measure of an option&#x27;s sensitivity to movements in the price of the underlying asset and is unaffected by positions in the underlying asset itself. Selling the underlying shares short is a separate activity that does not influence the option&#x27;s gamma or the factors that determine it. Since the gamma remains constant, the non-linearity risk associated with the options does not decrease. The short sale of shares does not provide any hedge or modification to the gamma of the existing options positions, leaving the level of non-linearity risk unchanged. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (k): Interpret each of the option Greeks<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Damien Lafferty<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In Melbourne, Australia, Damien Lafferty is a derivatives trader with Stockton &amp; Sullivan Brokerage. Lafferty will sell put and call options for clients seeking to manage portfolio risk before offsetting these naked short positions with appropriate hedges.<\/p><p>Recently, Lafferty sold 10,000 call options and an additional 10,000 put options based on the stock of Orillia Minerals, which trades on the Australian Stock Exchange under the ticker symbol OMN and does not pay a dividend. The current share price of OMN stock is AUD 100.00. Having established these positions, Lafferty&#x27;s objective is to reduce the resulting level of exposure to by creating a delta-neutral position. He has decided to borrow OMN shares and sell them shortly to accomplish this objective. In addition to the data shown in Exhibit 1, Lafferty learns that Option A has a gamma of 0.031.<\/p><p><b>Exhibit 1: Options on OMN stock sold by Lafferty (AUD per share prices)<\/b><\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0206.webp\" style=\"max-width:min(100%,598px)\" alt=\"Option Type Exercise price Time to Expiry Delta Price\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0207.webp\" style=\"max-width:min(100%,598px)\" alt=\"A Call 105.3 90 days 0.4 3.294\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0208.webp\" style=\"max-width:min(100%,598px)\" alt=\"B Put 105.3 90 days -0.6 7.304\"><p>Note: Both Option A and Option B are European-style options<\/p><p>Lafferty&#x27;s colleague, Sophia Reardon, who joined the firm last month after graduating from business school, asks him about factors influencing option prices. Reardon claims that the time value of options decays at a linear rate over time. Lafferty disagrees, adding &quot;The rate of time value decay decelerates as an option approaches maturity.<\/p><p>The conversation between the two colleagues then turns to the option volatility measures known as the Greeks. Noting Lafferty&#x27;s two option contracts recently sold, Reardon offers the following comment: &quot;For Option A and Option B, vega and rho will be positive.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>As a result of Lafferty selling OMN shares short, the total level of non-linearity risk to which his positions are exposed will most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 41, "q": "The no-arbitrage price at which Garner can buy a one month futures contract on the S&P 500 is closest to:", "opts": ["1682.70.", "1,683.60.", "1685.00."], "ans": "B", "expl": "The no-arbitrage price of a futures contract on the S&P 500 can be calculated using the formula for the future value of the spot price, adjusted for the risk-free rate and the dividend yield. The formula is given by where S0 is the current spot price of the S&P 500, r is the annual risk-free rate, y is the annual dividend yield, and t is t te bonds in equal proportions. Garner is the designated portfolio manager for this mutual fund. He believes that the issue shall be able to attract $200 million in managed assets, and the fund shall be available for investment by the public in a month.<\/p><p>Garner forecasts that the central bank is likely to reduce policy interest rates. Asset prices have already started rising. Garner decides to assume a derivative position in the equity and fixed income markets in preparation for investing in mutual fund assets.<\/p><p>He collects the following data for the equity and fixed income markets. All rates are effective annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0214.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot – S&amp;P 500 1,680\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0215.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk free rate 3.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0216.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on S&amp;P 500 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0217.webp\" style=\"max-width:min(100%,608px)\" alt=\"One month futures on S&amp;P 500 1,682.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0218.webp\" style=\"max-width:min(100%,608px)\" alt=\"Options\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0219.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 1,700\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0220.webp\" style=\"max-width:min(100%,608px)\" alt=\"Put Premium 58.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0221.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 1 month\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0222.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity Period US Treasury Interest Rate\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0223.webp\" style=\"max-width:min(100%,608px)\" alt=\"1 – month 2.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0224.webp\" style=\"max-width:min(100%,608px)\" alt=\"2 – months 2.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0225.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 – months 2.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0226.webp\" style=\"max-width:min(100%,608px)\" alt=\"4 – months 3.50%\"><p>Garner is considering taking the following alternative positions:<\/p><p>Long position in futures contract on S&amp;P 500<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0227.webp\" style=\"max-width:min(100%,212px)\" alt=\"Short position in FRA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0228.webp\" style=\"max-width:min(100%,215px)\" alt=\"Long call on S&amp;P 500 Short put on S&amp;P 500\"><p>The Caribbean Asset Management investment committee asks Garner to present his investment plans. One of the committee members suggests Treasury bond futures contracts and equity swaps.<\/p><\/div><\/details><div class=\"qtext\"><p>The no-arbitrage price at which Garner can buy a one month futures contract on the S&amp;P 500 is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 42, "q": "The interest rate that Garner would get on a 1x2 FRA based on US Treasury rates is closest to:", "opts": ["2.00%.", "2.30%.", "2.60%."], "ans": "C", "expl": "The interest rate for a 1x2 Forward Rate Agreement (FRA) can be calculated using the formula for the forward rate between two periods. The formula is given by: where r1 and r2 are the interest rates for the 1-month and 2-month periods respectively, and T1 and T2 are the time periods in months. Plugging in the values from the table: Substituting these into the formula, we get: This calculation shows that the FRA rate for the period from 1 month to 2 months is approximately 2.60%, which corresponds to option C. A is incorrect. It suggests an interest rate of 2.00%, which is the 1-month US Treasury rate. However, the FRA rate is not simply the rate at the beginning of the period but a forward rate that reflects the expected rate from 1 month to 2 months in the future. The calculation of the FRA rate takes into account both the 1-month and 2-month rates and their respective time periods, leading to a rate that is higher than just the initial 1-month rate. B is incorrect. It suggests an interest rate of 2.30%, which is the 2-month US Treasury rate. This option might seem plausible as it is one of the rates used in the calculation of the FRA. However, the FRA rate is a forward rate that effectively 'bridges' the 1-month and 2-month rates, factoring in the compounding effect over these periods. The correct FRA rate is a calculated value that reflects the expected rate from the end of the first month to the end of the second month, which is slightly higher than the simple 2-month rate, as shown in the detailed calculation. ", "explhtml": "<p>The interest rate for a 1x2 Forward Rate Agreement (FRA) can be calculated using the formula for the forward rate between two periods. The formula is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0231.webp\" style=\"max-width:min(100%,326px)\" alt=\"⎡ (1 + r2 × T2 12 ) ⎤ 12 FRA(0,1,2) = ⎢ ⎣ (1 + r1 × T1 12 ) −1 ⎥ ⎦ × (T2 −T1)\"><p>where r<sub>1<\/sub> and r<sub>2<\/sub> are the interest rates for the 1-month and 2-month periods respectively, and T<sub>1<\/sub> and T<sub>2<\/sub> are the time periods in months. Plugging in the values from the table:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0232.webp\" style=\"max-width:min(100%,470px)\" alt=\"r1 = 2.00% or 0.02, r2 = 2.30% or 0.023, T1 = 1, T2 = 2\"><p>Substituting these into the formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0233.webp\" style=\"max-width:min(100%,463px)\" alt=\"⎡ (1 + 0.023 × 12 2 ) ⎤ 12 FRA(0,1,2) = ⎣ (1 + 0.02 × 12 1 ) −1 ⎦ × 1 = 0.025953 ≈2.60%\"><p>This calculation shows that the FRA rate for the period from 1 month to 2 months is approximately 2.60%, which corresponds to option C.<\/p><p><b>A is incorrect<\/b>. It suggests an interest rate of 2.00%, which is the 1-month US Treasury rate. However, the FRA rate is not simply the rate at the beginning of the period but a forward rate that reflects the expected rate from 1 month to 2 months in the future. The calculation of the FRA rate takes into account both the 1-month and 2-month rates and their respective time periods, leading to a rate that is higher than just the initial 1-month rate.<\/p><p><b>B is incorrect<\/b>. It suggests an interest rate of 2.30%, which is the 2-month US Treasury rate. This option might seem plausible as it is one of the rates used in the calculation of the FRA. However, the FRA rate is a forward rate that effectively &#x27;bridges&#x27; the 1-month and 2-month rates, factoring in the compounding effect over these periods. The correct FRA rate is a calculated value that reflects the expected rate from the end of the first month to the end of the second month, which is slightly higher than the simple 2-month rate, as shown in the detailed calculation. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Joel Garner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joel Garner is a portfolio manager with Caribbean Asset Management Company. The firm is planning to introduce a mutual fund for retail investors. The mutual fund will consist of large cap equities and high quality corporate bonds in equal proportions. Garner is the designated portfolio manager for this mutual fund. He believes that the issue shall be able to attract $200 million in managed assets, and the fund shall be available for investment by the public in a month.<\/p><p>Garner forecasts that the central bank is likely to reduce policy interest rates. Asset prices have already started rising. Garner decides to assume a derivative position in the equity and fixed income markets in preparation for investing in mutual fund assets.<\/p><p>He collects the following data for the equity and fixed income markets. All rates are effective annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0214.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot – S&amp;P 500 1,680\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0215.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk free rate 3.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0216.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on S&amp;P 500 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0217.webp\" style=\"max-width:min(100%,608px)\" alt=\"One month futures on S&amp;P 500 1,682.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0218.webp\" style=\"max-width:min(100%,608px)\" alt=\"Options\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0219.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 1,700\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0220.webp\" style=\"max-width:min(100%,608px)\" alt=\"Put Premium 58.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0221.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 1 month\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0222.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity Period US Treasury Interest Rate\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0223.webp\" style=\"max-width:min(100%,608px)\" alt=\"1 – month 2.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0224.webp\" style=\"max-width:min(100%,608px)\" alt=\"2 – months 2.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0225.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 – months 2.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0226.webp\" style=\"max-width:min(100%,608px)\" alt=\"4 – months 3.50%\"><p>Garner is considering taking the following alternative positions:<\/p><p>Long position in futures contract on S&amp;P 500<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0227.webp\" style=\"max-width:min(100%,212px)\" alt=\"Short position in FRA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0228.webp\" style=\"max-width:min(100%,215px)\" alt=\"Long call on S&amp;P 500 Short put on S&amp;P 500\"><p>The Caribbean Asset Management investment committee asks Garner to present his investment plans. One of the committee members suggests Treasury bond futures contracts and equity swaps.<\/p><\/div><\/details><div class=\"qtext\"><p>The interest rate that Garner would get on a 1x2 FRA based on US Treasury rates is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 43, "q": "In anticipation of falling interest rates, the most appropriate position for the mutual fund is:", "opts": ["Long corporate bond futures contracts.", "Short corporate bond futures contracts.", "No position in corporate bond futures contracts."], "ans": "A", "expl": "Joel Garner, as the portfolio manager, is preparing for a scenario where the central bank is likely to reduce policy interest rates. In such a situation, the value of fixed income securities, which are sensitive to interest rate changes, typically increases as interest rates fall. This is because the existing bonds with higher interest rates become more valuable compared to new bonds issued at the now lower rates. Since the mutual fund will consist of 50% fixed income securities, strategically positioning in corporate bond futures can capitalize on this anticipated increase in bond prices. By taking a long position in corporate bond futures contracts, the fund would essentially be buying future bond contracts at current prices, which are expected to rise as the actual interest rates drop. This position aligns with the forecast of falling interest rates and aims to enhance the fund's performance through gains in the bond component of the portfolio. B is incorrect. A short position in corporate bond futures contracts would involve selling bond futures with the expectation that bond prices will decrease, which would be beneficial if interest rates were expected to rise. However, in the context provided, where interest rates are anticipated to fall, taking a short position would be contrary to the expected market movement. If Garner were to short corporate bond futures, the fund could face potential losses when the prices of bonds increase as the interest rates drop. This strategy would not only misalign with the economic forecast but also potentially harm the fund's performance by betting against the prevailing market trend. C is incorrect. Opting for no position in corporate bond futures contracts would mean foregoing a strategic opportunity to benefit from the anticipated movements in the interest rates. While this conservative approach avoids the risks associated with active trading positions, it also misses out on the potential gains from a well-anticipated market movement. Given that the mutual fund consists of a significant portion of fixed income securities, actively managing the portfolio to align with interest rate expectations is crucial to capitalize on market conditions and enhance overall returns. Therefore, not taking a position could result in underperformance, especially if the market moves as predicted with falling interest rates. ", "explhtml": "<p>Joel Garner, as the portfolio manager, is preparing for a scenario where the central bank is likely to reduce policy interest rates. In such a situation, the value of fixed income securities, which are sensitive to interest rate changes, typically increases as interest rates fall. This is because the existing bonds with higher interest rates become more valuable compared to new bonds issued at the now lower rates. Since the mutual fund will consist of 50% fixed income securities, strategically positioning in corporate bond futures can capitalize on this anticipated increase in bond prices. By taking a long position in corporate bond futures contracts, the fund would essentially be buying future bond contracts at current prices, which are expected to rise as the actual interest rates drop. This position aligns with the forecast of falling interest rates and aims to enhance the fund&#x27;s performance through gains in the bond component of the portfolio.<\/p><p><b>B is incorrect<\/b>. A short position in corporate bond futures contracts would involve selling bond futures with the expectation that bond prices will decrease, which would be beneficial if interest rates were expected to rise. However, in the context provided, where interest rates are anticipated to fall, taking a short position would be contrary to the expected market movement. If Garner were to short corporate bond futures, the fund could face potential losses when the prices of bonds increase as the interest rates drop. This strategy would not only misalign with the economic forecast but also potentially harm the fund&#x27;s performance by betting against the prevailing market trend.<\/p><p><b>C is incorrect<\/b>. Opting for no position in corporate bond futures contracts would mean foregoing a strategic opportunity to benefit from the anticipated movements in the interest rates. While this conservative approach avoids the risks associated with active trading positions, it also misses out on the potential gains from a well-anticipated market movement. Given that the mutual fund consists of a significant portion of fixed income securities, actively managing the portfolio to align with interest rate expectations is crucial to capitalize on market conditions and enhance overall returns. Therefore, not taking a position could result in underperformance, especially if the market moves as predicted with falling interest rates. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Joel Garner<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joel Garner is a portfolio manager with Caribbean Asset Management Company. The firm is planning to introduce a mutual fund for retail investors. The mutual fund will consist of large cap equities and high quality corporate bonds in equal proportions. Garner is the designated portfolio manager for this mutual fund. He believes that the issue shall be able to attract $200 million in managed assets, and the fund shall be available for investment by the public in a month.<\/p><p>Garner forecasts that the central bank is likely to reduce policy interest rates. Asset prices have already started rising. Garner decides to assume a derivative position in the equity and fixed income markets in preparation for investing in mutual fund assets.<\/p><p>He collects the following data for the equity and fixed income markets. All rates are effective annually.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0214.webp\" style=\"max-width:min(100%,608px)\" alt=\"Spot – S&amp;P 500 1,680\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0215.webp\" style=\"max-width:min(100%,608px)\" alt=\"Risk free rate 3.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0216.webp\" style=\"max-width:min(100%,608px)\" alt=\"Dividend Yield on S&amp;P 500 1.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0217.webp\" style=\"max-width:min(100%,608px)\" alt=\"One month futures on S&amp;P 500 1,682.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0218.webp\" style=\"max-width:min(100%,608px)\" alt=\"Options\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0219.webp\" style=\"max-width:min(100%,608px)\" alt=\"Strike Price 1,700\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0220.webp\" style=\"max-width:min(100%,608px)\" alt=\"Put Premium 58.70\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0221.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity 1 month\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0222.webp\" style=\"max-width:min(100%,608px)\" alt=\"Maturity Period US Treasury Interest Rate\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0223.webp\" style=\"max-width:min(100%,608px)\" alt=\"1 – month 2.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0224.webp\" style=\"max-width:min(100%,608px)\" alt=\"2 – months 2.30%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0225.webp\" style=\"max-width:min(100%,608px)\" alt=\"3 – months 2.90%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0226.webp\" style=\"max-width:min(100%,608px)\" alt=\"4 – months 3.50%\"><p>Garner is considering taking the following alternative positions:<\/p><p>Long position in futures contract on S&amp;P 500<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0227.webp\" style=\"max-width:min(100%,212px)\" alt=\"Short position in FRA\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0228.webp\" style=\"max-width:min(100%,215px)\" alt=\"Long call on S&amp;P 500 Short put on S&amp;P 500\"><p>The Caribbean Asset Management investment committee asks Garner to present his investment plans. One of the committee members suggests Treasury bond futures contracts and equity swaps.<\/p><\/div><\/details><div class=\"qtext\"><p>In anticipation of falling interest rates, the most appropriate position for the mutual fund is:<\/p><\/div>", "subj": "derivatives"}, {"n": 44, "q": "Assuming that the market has correctly priced the put option on the S&P
