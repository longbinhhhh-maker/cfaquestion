<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Derivatives</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">

</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}

  .vig[open]>summary .vig-hint{display:none}

  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

ggests a misunderstanding or miscalculation of the payment amounts or the discount factors used in the present value calculations.<\/p><p><b>C is incorrect<\/b>. The value of $380,000 significantly exceeds the correct swap value of $31,267. This error could stem from incorrect assumptions about the payment amounts, the discount rates, or both. It is essential to accurately apply the LIBOR rates and the timing of payments to determine the correct present values and thus the correct swap value. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (d): Describe how fixed-income forwards and futures are priced, and calculate and interpret their no-arbitrage value<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Andrex<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrex is a U.S-based financial institution and a regular participant in the foreign exchange market because of its investments. Over the years, Andrex mainly offsets its exposures to the market through an assortment of swap arrangements. William Parks, a risk analyst at Andrex, is currently calculating the net exposure faced by the company after adjusting for swaps. Exhibit 1 displays the current LIBOR information Parks needs for his calculations. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0008.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0009.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected 90- 180-day LIBOR 270-day LIBOR 360-day LIBOR day LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0010.webp\" style=\"max-width:min(100%,608px)\" alt=\"5.0% 5.2% 5.4% 5.5%\"><p>Andrex&#x27;s recent swap arrangements are listed below:<\/p><p>Andrex entered a fixed rate semi-annual equity swap with a dealer from the Chicago<\/p><p>Exchange. The equity payments are to %,226px)\" alt=\"Exhibit 3 (Current Term Structure)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0015.webp\" style=\"max-width:min(100%,464px)\" alt=\"90-days 270-days\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0016.webp\" style=\"max-width:min(100%,464px)\" alt=\"Swiss 4.8% 5.4%\"><p>Andrex anticipates utilizing a floating rate line of credit in ninety days to purchase a<\/p><p>twenty-five million dollar portfolio. The management is concerned about the expected<\/p><p>increase in LIBOR due to the current adverse economic conditions.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data provided in the vignette and Exhibit 1, the current value of the swap entered into with the Bank of America to the fixed rate payer is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 3, "q": "To get protection against any increase in the expected London Interbank Offered Rate (LIBOR) yield curve for investing in the twenty-five million dollar portfolio, Andrex should:", "opts": ["Buy a receiver swaption.", "Buy a payer swaption.", "Write a receiver swaption."], "ans": "B", "expl": "To protect against an increase in the expected LIBOR yield curve for a significant investment, Andrex should opt for a payer swaption. A payer swaption grants the holder the right, but not the obligation, to enter into an interest rate swap agreement as the fixed-rate payer and the floating-rate receiver. This financial instrument is particularly useful when anticipating a rise in interest rates, which would increase borrowing costs. By securing the right to pay a fixed rate while receiving a potentially higher floating rate tied to LIBOR, Andrex can effectively hedge against the risk of rising interest rates. This strategy ensures that if LIBOR rates increase, the company can still benefit from paying a previously agreed lower fixed rate, thus maintaining cost efficiency in their financial operations. A is incorrect. Buying a receiver swaption would not meet Andrex's needs as it involves obtaining the right to become the fixed-rate receiver and the floating-rate payer. In the context of expecting rising interest rates, this would be counterproductive. If LIBOR rates increase, Andrex would be disadvantaged by receiving a lower fixed interest rate while having to pay a higher floating rate. This would lead to increased costs rather than providing a hedge against rising rates. Therefore, a receiver swaption would exacerbate the financial risk rather than mitigate it in the face of anticipated higher LIBOR rates. C is incorrect. Writing a receiver swaption means that Andrex would sell this option, granting someone else the right to enter into a swap where they would receive fixed and pay floating rates. If LIBOR rates rise as Andrex fears, the receiver swaption would expire worthless because the holder would not exercise the right to receive a fixed rate that is lower than the prevailing floating rate. In this scenario, Andrex would simply keep the premium received from writing the swaption. However, this action provides no protection against rising interest rates for Andrex's own upcoming loan. The act of writing a swaption does not create a hedge; it generates premium income at the cost of taking on risk. ", "explhtml": "<p>To protect against an increase in the expected LIBOR yield curve for a significant investment, Andrex should opt for a payer swaption. A payer swaption grants the holder the right, but not the obligation, to enter into an interest rate swap agreement as the fixed-rate payer and the floating-rate receiver. This financial instrument is particularly useful when anticipating a rise in interest rates, which would increase borrowing costs. By securing the right to pay a fixed rate while receiving a potentially higher floating rate tied to LIBOR, Andrex can effectively hedge against the risk of rising interest rates. This strategy ensures that if LIBOR rates increase, the company can still benefit from paying a previously agreed lower fixed rate, thus maintaining cost efficiency in their financial operations.<\/p><p><b>A is incorrect<\/b>. Buying a receiver swaption would not meet Andrex&#x27;s needs as it involves obtaining the right to become the fixed-rate receiver and the floating-rate payer. In the context of expecting rising interest rates, this would be counterproductive. If LIBOR rates increase, Andrex would be disadvantaged by receiving a lower fixed interest rate while having to pay a higher floating rate. This would lead to increased costs rather than providing a hedge against rising rates. Therefore, a receiver swaption would exacerbate the financial risk rather than mitigate it in the face of anticipated higher LIBOR rates.<\/p><p><b>C is incorrect<\/b>. Writing a receiver swaption means that Andrex would sell this option, granting someone else the right to enter into a swap where they would receive fixed and pay floating rates. If LIBOR rates rise as Andrex fears, the receiver swaption would expire worthless because the holder would not exercise the right to receive a fixed rate that is lower than the prevailing floating rate. In this scenario, Andrex would simply keep the premium received from writing the swaption. However, this action provides no protection against rising interest rates for Andrex&#x27;s own upcoming loan. The act of writing a swaption does not create a hedge; it generates premium income at the cost of taking on risk. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (e): Describe how interest rate swaps are priced, and calculate and interpret their no- arbitrage value;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Andrex<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrex is a U.S-based financial institution and a regular participant in the foreign exchange market because of its investments. Over the years, Andrex mainly offsets its exposures to the market through an assortment of swap arrangements. William Parks, a risk analyst at Andrex, is currently calculating the net exposure faced by the company after adjusting for swaps. Exhibit 1 displays the current LIBOR information Parks needs for his calculations. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0008.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0009.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected 90- 180-day LIBOR 270-day LIBOR 360-day LIBOR day LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0010.webp\" style=\"max-width:min(100%,608px)\" alt=\"5.0% 5.2% 5.4% 5.5%\"><p>Andrex&#x27;s recent swap arrangements are listed below:<\/p><p>Andrex entered a fixed rate semi-annual equity swap with a dealer from the Chicago<\/p><p>Exchange. The equity payments are to be the total return on a ten million dollar<\/p><p>portfolio. The dividend yield on the portfolio is expected to be approximately 1.2%.<\/p><p>Fercen, a German-based firm, and Andrex engaged in a four-year plain-vanilla annual<\/p><p>pay currency swap. Andrex is the fixed rate payer in Euros and receives floating<\/p><p>payments in dollars. The fixed-rate agreed upon at initiation and the end of the swap<\/p><p>was 5%. At the beginning of the swap, $2 million was exchanged at an exchange rate of<\/p><p>€2 per $1. At the end of the swap period, the exchange rate was €1.75 per $1. Actual<\/p><p>LIBOR rates since the swap initiation are displayed in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0011.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0012.webp\" style=\"max-width:min(100%,608px)\" alt=\"1080-day Actual 360-day LIBOR 720-day LIBOR LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0013.webp\" style=\"max-width:min(100%,608px)\" alt=\"5.5% 6.0% 7.0%\"><p>Andrex initiated a twenty million dollar one-year semi-annual-pay LIBOR-based interest<\/p><p>rate swap ninety days ago when the LIBOR was 4.8%. This swap was made with the<\/p><p>Bank of America to hedge against interest rate exposure arising from Andrex’s<\/p><p>investments in corporate bonds. The fixed rate mutually agreed on the swap was 5%.<\/p><p>Andrex entered a fixed-for-fixed one-year one million semi-annual currency swap with<\/p><p>Bonvitz, a Swiss firm, ninety days ago. Fixed payments on the swap will be made in<\/p><p>Swiss Francs (CHF) and U.S. dollars at 4.8% and 5.2%, respectively. The swap<\/p><p>originated when the exchange rate was $0.34. The current spot rate is $0.35. The<\/p><p>exchange rate ninety days ago for the dollar ($) was $0.83. Exhibit 3 displays the<\/p><p>relevant term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0014.webp\" style=\"max-width:min(100%,226px)\" alt=\"Exhibit 3 (Current Term Structure)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0015.webp\" style=\"max-width:min(100%,464px)\" alt=\"90-days 270-days\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0016.webp\" style=\"max-width:min(100%,464px)\" alt=\"Swiss 4.8% 5.4%\"><p>Andrex anticipates utilizing a floating rate line of credit in ninety days to purchase a<\/p><p>twenty-five million dollar portfolio. The management is concerned about the expected<\/p><p>increase in LIBOR due to the current adverse economic conditions.<\/p><\/div><\/details><div class=\"qtext\"><p>To get protection against any increase in the expected London Interbank Offered Rate (LIBOR) yield curve for investing in the twenty-five million dollar portfolio, Andrex should:<\/p><\/div>", "subj": "derivatives"}, {"n": 4, "q": "The value of the swap entered with Bonvitz to Andrex, assuming the latter is the dollar payer, is closest to:", "opts": ["($25,000)", "$25,744", "$28,000"], "ans": "B", "expl": "The correct answer is option B, which states that the value of the swap entered with Bonvitz to Andrex, assuming Andrex is the dollar payer, is closest to $25,770. To determine this, we need to calculate the present value (PV) of fixed payments in both Swiss Francs (CHF) and U.S. Dollars (USD), and then convert the CHF payments into USD using the current exchange rate. The calculation for the PV of fixed CHF payments is as follows: Using the current exchange rate of $0.35 per CHF, the dollar value of CHF payments is calculated as: The notional amount in CHF is calculated by converting the USD notional amount using the initial exchange rate: Thus, the total dollar value of CHF payments is: Similarly, the PV of fixed USD payments is calculated as: The total value of USD payments is: Finally, the value of the swap to the dollar payer (Andrex) is the difference between the USD value of CHF payments and the USD payments: A is incorrect. It suggests a negative value for the swap, which implies a loss to Andrex. However, the calculations show a positive value, indicating a gain. The incorrect assumption of a loss likely stems from a misunderstanding of the exchange rates or the calculation of the present values of the payments in different currencies. C is incorrect. It overestimates the value of the swap. This could be due to incorrect calculations or assumptions in the conversion rates or the present value formulas. The detailed calculations provided clearly show that the correct value is closer to $25,744, not $28,000. ", "explhtml": "<p>The correct answer is option B, which states that the value of the swap entered with Bonvitz to Andrex, assuming Andrex is the dollar payer, is closest to $25,770. To determine this, we need to calculate the present value (PV) of fixed payments in both Swiss Francs (CHF) and U.S. Dollars (USD), and then convert the CHF payments into USD using the current exchange rate. The calculation for the PV of fixed CHF payments is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0029.webp\" style=\"max-width:min(100%,730px)\" alt=\"0.048 ( 180 360 ) 1 + 0.048( 180 360 ) PV of fixed payments (CHF) = + = 0.02372 + 0.98414 = 1.00786 1 + 0.048( 360 90 ) 1 + 0.054( 270 360 )\"><p>Using the current exchange rate of $0.35 per CHF, the dollar value of CHF payments is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0030.webp\" style=\"max-width:min(100%,469px)\" alt=\"Dollar value of CHF payments = 1.00786 × 0.35 = $0.35275\"><p>The notional amount in CHF is calculated by converting the USD notional amount using the initial exchange rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0031.webp\" style=\"max-width:min(100%,427px)\" alt=\"1, 000,000 Notional amount (CHF) = = 2, 941,176 CHF 0.34\"><p>Thus, the total dollar value of CHF payments is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0032.webp\" style=\"max-width:min(100%,296px)\" alt=\"$0.35275 × 2, 941, 176 = $1, 037,500\"><p>Similarly, the PV of fixed USD payments is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0033.webp\" style=\"max-width:min(100%,568px)\" alt=\"0.052( 180 360 ) 1 + 0.052( 180 360 ) PV of fixed payments (USD) = + = 1.011229 1 + 0.05 ( 360 90 ) 1 + 0.054( 270 360 )\"><p>The total value of USD payments is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0034.webp\" style=\"max-width:min(100%,296px)\" alt=\"1.011229 × 1, 000, 000 = $1, 011,229\"><p>Finally, the value of the swap to the dollar payer (Andrex) is the difference between the USD value of CHF payments and the USD payments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0035.webp\" style=\"max-width:min(100%,298px)\" alt=\"$1, 037, 500 −$1,011,229 = $25, 744\"><p><b>A is incorrect<\/b>. It suggests a negative value for the swap, which implies a loss to Andrex. However, the calculations show a positive value, indicating a gain. The incorrect assumption of a loss likely stems from a misunderstanding of the exchange rates or the calculation of the present values of the payments in different currencies.<\/p><p><b>C is incorrect<\/b>. It overestimates the value of the swap. This could be due to incorrect calculations or assumptions in the conversion rates or the present value formulas. The detailed calculations provided clearly show that the correct value is closer to $25,744, not $28,000. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (f): Describe how currency swaps are priced, and calculate and interpret their no- arbitrage value<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Andrex<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrex is a U.S-based financial institution and a regular participant in the foreign exchange market because of its investments. Over the years, Andrex mainly offsets its exposures to the market through an assortment of swap arrangements. William Parks, a risk analyst at Andrex, is currently calculating the net exposure faced by the company after adjusting for swaps. Exhibit 1 displays the current LIBOR information Parks needs for his calculations. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0008.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 1\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0009.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected 90- 180-day LIBOR 270-day LIBOR 360-day LIBOR day LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0010.webp\" style=\"max-width:min(100%,608px)\" alt=\"5.0% 5.2% 5.4% 5.5%\"><p>Andrex&#x27;s recent swap arrangements are listed below:<\/p><p>Andrex entered a fixed rate semi-annual equity swap with a dealer from the Chicago<\/p><p>Exchange. The equity payments are to be the total return on a ten million dollar<\/p><p>portfolio. The dividend yield on the portfolio is expected to be approximately 1.2%.<\/p><p>Fercen, a German-based firm, and Andrex engaged in a four-year plain-vanilla annual<\/p><p>pay currency swap. Andrex is the fixed rate payer in Euros and receives floating<\/p><p>payments in dollars. The fixed-rate agreed upon at initiation and the end of the swap<\/p><p>was 5%. At the beginning of the swap, $2 million was exchanged at an exchange rate of<\/p><p>€2 per $1. At the end of the swap period, the exchange rate was €1.75 per $1. Actual<\/p><p>LIBOR rates since the swap initiation are displayed in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0011.webp\" style=\"max-width:min(100%,88px)\" alt=\"Exhibit 2\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0012.webp\" style=\"max-width:min(100%,608px)\" alt=\"1080-day Actual 360-day LIBOR 720-day LIBOR LIBOR\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0013.webp\" style=\"max-width:min(100%,608px)\" alt=\"5.5% 6.0% 7.0%\"><p>Andrex initiated a twenty million dollar one-year semi-annual-pay LIBOR-based interest<\/p><p>rate swap ninety days ago when the LIBOR was 4.8%. This swap was made with the<\/p><p>Bank of America to hedge against interest rate exposure arising from Andrex’s<\/p><p>investments in corporate bonds. The fixed rate mutually agreed on the swap was 5%.<\/p><p>Andrex entered a fixed-for-fixed one-year one million semi-annual currency swap with<\/p><p>Bonvitz, a Swiss firm, ninety days ago. Fixed payments on the swap will be made in<\/p><p>Swiss Francs (CHF) and U.S. dollars at 4.8% and 5.2%, respectively. The swap<\/p><p>originated when the exchange rate was $0.34. The current spot rate is $0.35. The<\/p><p>exchange rate ninety days ago for the dollar ($) was $0.83. Exhibit 3 displays the<\/p><p>relevant term structure.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0014.webp\" style=\"max-width:min(100%,226px)\" alt=\"Exhibit 3 (Current Term Structure)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0015.webp\" style=\"max-width:min(100%,464px)\" alt=\"90-days 270-days\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0016.webp\" style=\"max-width:min(100%,464px)\" alt=\"Swiss 4.8% 5.4%\"><p>Andrex anticipates utilizing a floating rate line of credit in ninety days to purchase a<\/p><p>twenty-five million dollar portfolio. The management is concerned about the expected<\/p><p>increase in LIBOR due to the current adverse economic conditions.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of the swap entered with Bonvitz to Andrex, assuming the latter is the dollar payer, is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 5, "q": "With respect to derivative instrument construction techniques discussed in the seminar, the speaker is accurate with respect to:", "opts": ["Technique 1 only.", "Technique 2 only.", "Both techniques."], "ans": "B", "expl": "The speaker's accuracy regarding Technique 2 is confirmed as it correctly describes how to replicate a pay-fixed, receive-equity swap. This replication involves issuing a fixed-rate bond and using the proceeds to purchase an equity index portfolio. This strategy effectively mirrors the cash flows of a typical pay-fixed, receive-equity swap. In such swaps, the party paying the fixed rate typically faces exposure similar to that of a bond issuer, who pays fixed interest rates. Conversely, by purchasing an equity index portfolio, the party receives variable returns akin to those from equity investments, thus replicating the equity side of the swap. This technique is a standard financial engineering strategy used to mimic the desired risk and return profiles of different financial instruments through a combination of simpler, more accessible securities. A is incorrect. The speaker's explanation of Technique 1 contains inaccuracies regarding the application of put-call parity for American options. While the technique described (involving buying a put, selling a call, and buying the stock) does indeed create a synthetic position similar to owning a bond, the statement that this can be applied equally to American and European options is incorrect. American options, unlike European options, can be exercised at any time before expiration, which introduces early exercise opportunities especially when dividends are involved or there are significant movements in interest rates. This possibility complicates the straightforward application of put-call parity as it involves more variables, such as the timing of potential early exercise and its impact on the pricing and valuation of the options and the underlying stock. C is incorrect. Claiming that both techniques are accurately described is incorrect primarily because of the issues with Technique 1 as previously discussed. While Technique 2 is accurately depicted and can be applied as stated, Technique 1's application to American options is not as straightforward as suggested. The complexities arising from the potential for early exercise and its effects on the pricing dynamics of the options mean that the put-call parity does not hold in the same way as it does for European options, where the exercise is strictly at expiration. Therefore, stating that both techniques are accurately described overlooks these critical nuances associated with American options. ", "explhtml": "<p>The speaker&#x27;s accuracy regarding Technique 2 is confirmed as it correctly describes how to replicate a pay-fixed, receive-equity swap. This replication involves issuing a fixed-rate bond and using the proceeds to purchase an equity index portfolio. This strategy effectively mirrors the cash flows of a typical pay-fixed, receive-equity swap. In such swaps, the party paying the fixed rate typically faces exposure similar to that of a bond issuer, who pays fixed interest rates. Conversely, by purchasing an equity index portfolio, the party receives variable returns akin to those from equity investments, thus replicating the equity side of the swap. This technique is a standard financial engineering strategy used to mimic the desired risk and return profiles of different financial instruments through a combination of simpler, more accessible securities.<\/p><p><b>A is incorrect<\/b>. The speaker&#x27;s explanation of Technique 1 contains inaccuracies regarding the application of put-call parity for American options. While the technique described (involving buying a put, selling a call, and buying the stock) does indeed create a synthetic position similar to owning a bond, the statement that this can be applied equally to American and European options is incorrect. American options, unlike European options, can be exercised at any time before expiration, which introduces early exercise opportunities especially when dividends are involved or there are significant movements in interest rates. This possibility complicates the straightforward application of put-call parity as it involves more variables, such as the timing of potential early exercise and its impact on the pricing and valuation of the options and the underlying stock.<\/p><p><b>C is incorrect<\/b>. Claiming that both techniques are accurately described is incorrect primarily because of the issues with Technique 1 as previously discussed. While Technique 2 is accurately depicted and can be applied as stated, Technique 1&#x27;s application to American options is not as straightforward as suggested. The complexities arising from the potential for early exercise and its effects on the pricing dynamics of the options mean that the put-call parity does not hold in the same way as it does for European options, where the exercise is strictly at expiration. Therefore, stating that both techniques are accurately described overlooks these critical nuances associated with American options. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (g): Describe how equity swaps are priced, and calculate and interpret their no- arbitrage value<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Janice Stewart<\/summary><div class=\"vig-body\"><p>Janice Stewart, CFA, works as a Wallace Associates (WA) hedge fund manager. WA is based in Los Angeles, California. She recently attended a seminar where part of the discussion was about derivatives and how a position can be replicated using a combination of two other instruments. Stewart found two techniques particularly interesting:<\/p><p>Technique 1:   Using the put-call parity, a synthetic long bond position can be replicated by buying a put option, short selling a call option, and buying the underlying stock. This technique is readily applicable to both European and American options.<\/p><p>Technique 2:   A pay-fixed, receive-equity swap position can be replicated by issuing a fixed rate bond and purchasing an equity index portfolio.<\/p><p>Returning from the seminar, Stewart decides to evaluate arbitrage opportunities using the put-call parity. Stewart uses European put and call options for her analysis with an exercise price of $65.00. Both options will expire in 150 days. The underlying stock is currently priced at $68.60 and will make no cash payments over the life of the options. The put and call options are currently selling for $5.15 and $9.66. The risk-free rate is 2.50%.<\/p><p>Next, Stewart evaluates the stock of Beta Corporation (BC), a manufacturer of high-tech laboratory equipment. Stewart’s clients hold one million shares of BC’s stock. Beta Corporation has publicized its plan to launch a new piece of equipment, BetaX. Customary to industry norms, new lab equipment launched into the market is subject to a testing phase by equipment users. BC will commence commercial production of BetaX if users approve it.<\/p><p>Marin Greene is another hedge fund manager at WA. He expects BetaX not to enter the commercial production believing that the products will be rejected by equipment users in eight months’ time when launched for testing. Greene has collected current and expected data on BC (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0036.webp\" style=\"max-width:min(100%,245px)\" alt=\"Exhibit 1 BC Relevant Financial Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0037.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current share price $55.25\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0038.webp\" style=\"max-width:min(100%,608px)\" alt=\"Projected share price in eight months $43.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0039.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected annual volatility of returns 19%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0040.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current annual risk-free rate 2.50%\"><p>Greene believes that BC’s share price will decline following the rejection. Based on his projection, he recommends the following to Stewart: “To protect your clients from future losses resulting from a projected decline in BC’s share price, I believe you should strongly consider purchasing eight-month European put options immediately.”  Greene has summarized prices and other relevant data about four alternative eight-month European puts and calls currently available on BC’s shares (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0041.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 2 Market Data for Eight-month European Options on BC Shares\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0042.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option J K L M\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0043.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option type Put Put Call Call\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0044.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise price $54.00 $55.25 $55.25 $60.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0045.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d1) 0.6293 0.5714 0.5714 0.6368\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0046.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d2) 0.5714 0.5120 0.5120 ?\"><p>After analyzing Greene’s recommendation, Stewart discusses it with the fellow manager. She asks him the implications of the change in his input estimates on call and put prices. Greene responds with the following sentiments:<\/p><p>Implication 1: “Corporate shares being the underlying asset, I would not be too worried or enthusiastic about the impact of a change in risk-free rate on call or put option prices.”<\/p><p>Implication 2: “If I extend the expiration dates from eight to ten months, option L should decrease in value, but option M should increase.”<\/p><p>Greene also shares how he has derived BC’s 19% expected annual volatility with Stewart:<\/p><p>“I have estimated the 19% volatility using BC’s monthly stock price data from the past ten years. This stock price data was used as a starting point to obtain the variance estimate of continuously compounded BC monthly stock returns. It was then converted into an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to derivative instrument construction techniques discussed in the seminar, the speaker is accurate with respect to:<\/p><\/div>", "subj": "derivatives"}, {"n": 6, "q": "Using the information in Exhibits 1 and 2 along with the Black-Scholes-Merton model,the put option with the lowest price is:", "opts": ["Option J", "Option K", "Neither of the two."], "ans": "A", "expl": "The correct answer is Option A, which is Option J. To determine the put option with the lowest price using the Black-Scholes-Merton model, we need to calculate the prices of both Option J and Option K. The formula for the price of a European put option in the Black-Scholes-Merton framework is given by: Where: X is the exercise price of the option, e−rcT represents the discount factor with rc being the continuously compounded risk- free rate and T the time to expiration, N (d1) and N(d2) are values from the cumulative normal distribution function, S0 is the current stock price. For Option J: Poption J = $54.00 × e−0.02469×12 × [1 − 0.5714] − $55.25 × [1 − 0.6293] = $2.29 For Option K: Poption K = $55.25 × e−0.02469×12 × [1 − 0.5120] − $55.25 × [1 − 0.5714] = $2.84 B is incorrect. Option K, priced at \\$2.84, is higher than Option J, which is priced at \\$2.29. The calculation shows that the price of Option K is higher due to a slightly higher exercise price and a lower value of 1 − N (d2) compared to Option J. This results in a smaller discount on the exercise price and a smaller reduction from the stock price component, leading to an overall higher put option price. C is incorrect. The statement \"Neither of the two\" would imply that both options have the same price or that there is another option with a lower price. However, from the calculations provided, it is clear that Option J has a lower price than Option K. Therefore, stating that neither option has the lowest price is incorrect as Option J is definitively cheaper than Option K. ", "explhtml": "<p>The correct answer is Option A, which is Option J. To determine the put option with the lowest price using the Black-Scholes-Merton model, we need to calculate the prices of both Option J and Option K. The formula for the price of a European put option in the Black-Scholes-Merton framework is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0047.webp\" style=\"max-width:min(100%,298px)\" alt=\"P = Xe−rcT[1 −N(d2)] −S0[1 −N(d1)]\"><p>Where:<\/p><p>X is the exercise price of the option,<\/p><p>e<sup>−r<\/sup><sup>c<\/sup><sup>T<\/sup> represents the discount factor with r<sub>c<\/sub> being the continuously compounded risk-<\/p><p>free rate and T the time to expiration,<\/p><p>N (d<sub>1<\/sub>) and N(d<sub>2<\/sub>) are values from the cumulative normal distribution function,<\/p><p>S<sub>0<\/sub> is the current stock price.<\/p><p>For Option J:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0048.webp\" style=\"max-width:min(100%,601px)\" alt=\"8\"><p>P<sub>option J<\/sub> = $54.00 × e<sup>−0.02469×<\/sup><sup>12<\/sup> × [1 − 0.5714] − $55.25 × [1 − 0.6293] = $2.29<\/p><p>For Option K:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0049.webp\" style=\"max-width:min(100%,603px)\" alt=\"8\"><p>P<sub>option K<\/sub> = $55.25 × e<sup>−0.02469×<\/sup><sup>12<\/sup> × [1 − 0.5120] − $55.25 × [1 − 0.5714] = $2.84<\/p><p><b>B is incorrect<\/b>. Option K, priced at \\$2.84, is higher than Option J, which is priced at \\$2.29. The calculation shows that the price of Option K is higher due to a slightly higher exercise price and a lower value of 1 − N (d<sub>2<\/sub>) compared to Option J. This results in a smaller discount on the exercise price and a smaller reduction from the stock price component, leading to an overall higher put option price.<\/p><p><b>C is incorrect<\/b>. The statement &quot;Neither of the two&quot; would imply that both options have the same price or that there is another option with a lower price. However, from the calculations provided, it is clear that Option J has a lower price than Option K. Therefore, stating that neither option has the lowest price is incorrect as Option J is definitively cheaper than Option K. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (g): Interpret the components of the Black–Scholes–Merton model as applied to call options in terms of a leveraged position in the underlying;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Janice Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Stewart, CFA, works as a Wallace Associates (WA) hedge fund manager. WA is based in Los Angeles, California. She recently attended a seminar where part of the discussion was about derivatives and how a position can be replicated using a combination of two other instruments. Stewart found two techniques particularly interesting:<\/p><p>Technique 1:   Using the put-call parity, a synthetic long bond position can be replicated by buying a put option, short selling a call option, and buying the underlying stock. This technique is readily applicable to both European and American options.<\/p><p>Technique 2:   A pay-fixed, receive-equity swap position can be replicated by issuing a fixed rate bond and purchasing an equity index portfolio.<\/p><p>Returning from the seminar, Stewart decides to evaluate arbitrage opportunities using the put-call parity. Stewart uses European put and call options for her analysis with an exercise price of $65.00. Both options will expire in 150 days. The underlying stock is currently priced at $68.60 and will make no cash payments over the life of the options. The put and call options are currently selling for $5.15 and $9.66. The risk-free rate is 2.50%.<\/p><p>Next, Stewart evaluates the stock of Beta Corporation (BC), a manufacturer of high-tech laboratory equipment. Stewart’s clients hold one million shares of BC’s stock. Beta Corporation has publicized its plan to launch a new piece of equipment, BetaX. Customary to industry norms, new lab equipment launched into the market is subject to a testing phase by equipment users. BC will commence commercial production of BetaX if users approve it.<\/p><p>Marin Greene is another hedge fund manager at WA. He expects BetaX not to enter the commercial production believing that the products will be rejected by equipment users in eight months’ time when launched for testing. Greene has collected current and expected data on BC (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0036.webp\" style=\"max-width:min(100%,245px)\" alt=\"Exhibit 1 BC Relevant Financial Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0037.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current share price $55.25\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0038.webp\" style=\"max-width:min(100%,608px)\" alt=\"Projected share price in eight months $43.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0039.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected annual volatility of returns 19%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0040.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current annual risk-free rate 2.50%\"><p>Greene believes that BC’s share price will decline following the rejection. Based on his projection, he recommends the following to Stewart: “To protect your clients from future losses resulting from a projected decline in BC’s share price, I believe you should strongly consider purchasing eight-month European put options immediately.”  Greene has summarized prices and other relevant data about four alternative eight-month European puts and calls currently available on BC’s shares (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0041.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 2 Market Data for Eight-month European Options on BC Shares\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0042.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option J K L M\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0043.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option type Put Put Call Call\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0044.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise price $54.00 $55.25 $55.25 $60.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0045.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d1) 0.6293 0.5714 0.5714 0.6368\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0046.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d2) 0.5714 0.5120 0.5120 ?\"><p>After analyzing Greene’s recommendation, Stewart discusses it with the fellow manager. She asks him the implications of the change in his input estimates on call and put prices. Greene responds with the following sentiments:<\/p><p>Implication 1: “Corporate shares being the underlying asset, I would not be too worried or enthusiastic about the impact of a change in risk-free rate on call or put option prices.”<\/p><p>Implication 2: “If I extend the expiration dates from eight to ten months, option L should decrease in value, but option M should increase.”<\/p><p>Greene also shares how he has derived BC’s 19% expected annual volatility with Stewart:<\/p><p>“I have estimated the 19% volatility using BC’s monthly stock price data from the past ten years. This stock price data was used as a starting point to obtain the variance estimate of continuously compounded BC monthly stock returns. It was then converted into an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibits 1 and 2 along with the Black-Scholes-Merton model,the put option with the lowest price is:<\/p><\/div>", "subj": "derivatives"}, {"n": 7, "q": "Has Greene correctly identified the implications of changes in input estimates on option prices?", "opts": ["Yes, with respect to both implications.", "Yes, with respect to implication 1 only.", "No."], "ans": "B", "expl": "Greene's assessment of the implications of changes in input estimates on option prices is partially correct. Specifically, his first implication regarding the impact of a change in the risk-free rate on the prices of call and put options is accurate. European options, such as those being discussed, are generally less sensitive to changes in the risk-free rate compared to American options. This is because the risk-free rate influences the discount rate applied to the expected payoffs from the options, which are fixed at the European options' expiration. Since the options cannot be exercised before their maturity, short-term fluctuations in the risk-free rate have a muted effect on their pricing. Therefore, a change in the risk-free rate would not significantly alter the prices of the European options on BC’s shares. B is incorrect. While Greene's first implication is correct, his second implication is not. He suggests that extending the expiration dates from eight to ten months would decrease the value of call option L but increase the value of call option M. This is incorrect because, generally, the value of call options increases with the length of time to expiration. This is due to the time value of money; the longer the duration until expiration, the greater the chance that the underlying asset's price will rise above the exercise price, leading to a profitable exercise of the option. Therefore, extending the expiration should increase the value of both call options L and M, contrary to what Greene suggests. C is incorrect. Although Greene's second implication is incorrect, his first implication about the impact of the risk-free rate on option prices is correct. Therefore, it is not accurate to state that both implications are incorrect. The correct assessment is that Greene has accurately identified the implications of changes in the risk-free rate but not the implications of extending the expiration dates of the options. ", "explhtml": "<p>Greene&#x27;s assessment of the implications of changes in input estimates on option prices is partially correct. Specifically, his first implication regarding the impact of a change in the risk-free rate on the prices of call and put options is accurate. European options, such as those being discussed, are generally less sensitive to changes in the risk-free rate compared to American options. This is because the risk-free rate influences the discount rate applied to the expected payoffs from the options, which are fixed at the European options&#x27; expiration. Since the options cannot be exercised before their maturity, short-term fluctuations in the risk-free rate have a muted effect on their pricing. Therefore, a change in the risk-free rate would not significantly alter the prices of the European options on BC’s shares.<\/p><p><b>B is incorrect<\/b>. While Greene&#x27;s first implication is correct, his second implication is not. He suggests that extending the expiration dates from eight to ten months would decrease the value of call option L but increase the value of call option M. This is incorrect because, generally, the value of call options increases with the length of time to expiration. This is due to the time value of money; the longer the duration until expiration, the greater the chance that the underlying asset&#x27;s price will rise above the exercise price, leading to a profitable exercise of the option. Therefore, extending the expiration should increase the value of both call options L and M, contrary to what Greene suggests.<\/p><p><b>C is incorrect<\/b>. Although Greene&#x27;s second implication is incorrect, his first implication about the impact of the risk-free rate on option prices is correct. Therefore, it is not accurate to state that both implications are incorrect. The correct assessment is that Greene has accurately identified the implications of changes in the risk-free rate but not the implications of extending the expiration dates of the options. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2 (g): Interpret the components of the Black–Scholes–Merton model as applied to call options in terms of a leveraged position in the underlying;<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Janice Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Stewart, CFA, works as a Wallace Associates (WA) hedge fund manager. WA is based in Los Angeles, California. She recently attended a seminar where part of the discussion was about derivatives and how a position can be replicated using a combination of two other instruments. Stewart found two techniques particularly interesting:<\/p><p>Technique 1:   Using the put-call parity, a synthetic long bond position can be replicated by buying a put option, short selling a call option, and buying the underlying stock. This technique is readily applicable to both European and American options.<\/p><p>Technique 2:   A pay-fixed, receive-equity swap position can be replicated by issuing a fixed rate bond and purchasing an equity index portfolio.<\/p><p>Returning from the seminar, Stewart decides to evaluate arbitrage opportunities using the put-call parity. Stewart uses European put and call options for her analysis with an exercise price of $65.00. Both options will expire in 150 days. The underlying stock is currently priced at $68.60 and will make no cash payments over the life of the options. The put and call options are currently selling for $5.15 and $9.66. The risk-free rate is 2.50%.<\/p><p>Next, Stewart evaluates the stock of Beta Corporation (BC), a manufacturer of high-tech laboratory equipment. Stewart’s clients hold one million shares of BC’s stock. Beta Corporation has publicized its plan to launch a new piece of equipment, BetaX. Customary to industry norms, new lab equipment launched into the market is subject to a testing phase by equipment users. BC will commence commercial production of BetaX if users approve it.<\/p><p>Marin Greene is another hedge fund manager at WA. He expects BetaX not to enter the commercial production believing that the products will be rejected by equipment users in eight months’ time when launched for testing. Greene has collected current and expected data on BC (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0036.webp\" style=\"max-width:min(100%,245px)\" alt=\"Exhibit 1 BC Relevant Financial Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0037.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current share price $55.25\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0038.webp\" style=\"max-width:min(100%,608px)\" alt=\"Projected share price in eight months $43.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0039.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected annual volatility of returns 19%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0040.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current annual risk-free rate 2.50%\"><p>Greene believes that BC’s share price will decline following the rejection. Based on his projection, he recommends the following to Stewart: “To protect your clients from future losses resulting from a projected decline in BC’s share price, I believe you should strongly consider purchasing eight-month European put options immediately.”  Greene has summarized prices and other relevant data about four alternative eight-month European puts and calls currently available on BC’s shares (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0041.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 2 Market Data for Eight-month European Options on BC Shares\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0042.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option J K L M\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0043.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option type Put Put Call Call\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0044.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise price $54.00 $55.25 $55.25 $60.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0045.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d1) 0.6293 0.5714 0.5714 0.6368\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0046.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d2) 0.5714 0.5120 0.5120 ?\"><p>After analyzing Greene’s recommendation, Stewart discusses it with the fellow manager. She asks him the implications of the change in his input estimates on call and put prices. Greene responds with the following sentiments:<\/p><p>Implication 1: “Corporate shares being the underlying asset, I would not be too worried or enthusiastic about the impact of a change in risk-free rate on call or put option prices.”<\/p><p>Implication 2: “If I extend the expiration dates from eight to ten months, option L should decrease in value, but option M should increase.”<\/p><p>Greene also shares how he has derived BC’s 19% expected annual volatility with Stewart:<\/p><p>“I have estimated the 19% volatility using BC’s monthly stock price data from the past ten years. This stock price data was used as a starting point to obtain the variance estimate of continuously compounded BC monthly stock returns. It was then converted into an annual standard deviation.”<\/p><\/div><\/details><div class=\"qtext\"><p>Has Greene correctly identified the implications of changes in input estimates on option prices?<\/p><\/div>", "subj": "derivatives"}, {"n": 8, "q": "The volatility estimation technique used by Greene:", "opts": ["Estimates volatility as the standard deviation of a stock’s discrete annualized return over a recent historical period .", "Is not a valid volatility estimation technique.", "Can be used to derive future volatility estimates."], "ans": "C", "expl": "Greene's approach to estimating volatility involves using historical stock price data, which he then processes to derive a measure of volatility. Specifically, he uses monthly stock price data from the past ten years. From this data, he calculates the continuously compounded returns, which are then used to compute the variance of these returns. To annualize the variance, he multiplies it by 12 (since there are 12 months in a year), and then takes the square root to obtain the annual standard deviation, which represents the volatility. This method is a standard procedure in finance for estimating historical volatility, which can then be used as a basis for forecasting future volatility under the assumption that past patterns will provide insights into future trends. A is incorrect. The option suggests that volatility is estimated as the standard deviation of a stock’s discrete annualized return over a recent historical period. However, Greene's method does not directly calculate the standard deviation of annualized returns but instead uses monthly returns that are continuously compounded. This continuous compounding is a key aspect as it reflects the reinvestment of returns at each instant, which is different from calculating discrete returns. Therefore, this description does not accurately represent Greene's methodology. B is incorrect. This option claims that Greene's volatility estimation technique is not valid, which is incorrect. The method used by Greene is a well-recognized approach in financial analysis known as historical volatility calculation. By using historical price data and converting these into continuously compounded returns to calculate variance and subsequently standard deviation, Greene is employing a legitimate and widely accepted method for estimating the volatility of a stock. This technique is particularly useful for financial modeling and risk assessment in investment scenarios. ", "explhtml": "<p>Greene&#x27;s approach to estimating volatility involves using historical stock price data, which he then processes to derive a measure of volatility. Specifically, he uses monthly stock price data from the past ten years. From this data, he calculates the continuously compounded returns, which are then used to compute the variance of these returns. To annualize the variance, he multiplies it by 12 (since there are 12 months in a year), and then takes the square root to obtain the annual standard deviation, which represents the volatility. This method is a standard procedure in finance for estimating historical volatility, which can then be used as a basis for forecasting future volatility under the assumption that past patterns will provide insights into future trends.<\/p><p><b>A is incorrect<\/b>. The option suggests that volatility is estimated as the standard deviation of a stock’s discrete annualized return over a recent historical period. However, Greene&#x27;s method does not directly calculate the standard deviation of annualized returns but instead uses monthly returns that are continuously compounded. This continuous compounding is a key aspect as it reflects the reinvestment of returns at each instant, which is different from calculating discrete returns. Therefore, this description does not accurately represent Greene&#x27;s methodology.<\/p><p><b>B is incorrect<\/b>. This option claims that Greene&#x27;s volatility estimation technique is not valid, which is incorrect. The method used by Greene is a well-recognized approach in financial analysis known as historical volatility calculation. By using historical price data and converting these into continuously compounded returns to calculate variance and subsequently standard deviation, Greene is employing a legitimate and widely accepted method for estimating the volatility of a stock. This technique is particularly useful for financial modeling and risk assessment in investment scenarios. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(n): Define implied volatility and explain how it is used in options trading.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Janice Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Janice Stewart, CFA, works as a Wallace Associates (WA) hedge fund manager. WA is based in Los Angeles, California. She recently attended a seminar where part of the discussion was about derivatives and how a position can be replicated using a combination of two other instruments. Stewart found two techniques particularly interesting:<\/p><p>Technique 1:   Using the put-call parity, a synthetic long bond position can be replicated by buying a put option, short selling a call option, and buying the underlying stock. This technique is readily applicable to both European and American options.<\/p><p>Technique 2:   A pay-fixed, receive-equity swap position can be replicated by issuing a fixed rate bond and purchasing an equity index portfolio.<\/p><p>Returning from the seminar, Stewart decides to evaluate arbitrage opportunities using the put-call parity. Stewart uses European put and call options for her analysis with an exercise price of $65.00. Both options will expire in 150 days. The underlying stock is currently priced at $68.60 and will make no cash payments over the life of the options. The put and call options are currently selling for $5.15 and $9.66. The risk-free rate is 2.50%.<\/p><p>Next, Stewart evaluates the stock of Beta Corporation (BC), a manufacturer of high-tech laboratory equipment. Stewart’s clients hold one million shares of BC’s stock. Beta Corporation has publicized its plan to launch a new piece of equipment, BetaX. Customary to industry norms, new lab equipment launched into the market is subject to a testing phase by equipment users. BC will commence commercial production of BetaX if users approve it.<\/p><p>Marin Greene is another hedge fund manager at WA. He expects BetaX not to enter the commercial production believing that the products will be rejected by equipment users in eight months’ time when launched for testing. Greene has collected current and expected data on BC (Exhibit 1).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0036.webp\" style=\"max-width:min(100%,245px)\" alt=\"Exhibit 1 BC Relevant Financial Data\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0037.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current share price $55.25\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0038.webp\" style=\"max-width:min(100%,608px)\" alt=\"Projected share price in eight months $43.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0039.webp\" style=\"max-width:min(100%,608px)\" alt=\"Expected annual volatility of returns 19%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0040.webp\" style=\"max-width:min(100%,608px)\" alt=\"Current annual risk-free rate 2.50%\"><p>Greene believes that BC’s share price will decline following the rejection. Based on his projection, he recommends the following to Stewart: “To protect your clients from future losses resulting from a projected decline in BC’s share price, I believe you should strongly consider purchasing eight-month European put options immediately.”  Greene has summarized prices and other relevant data about four alternative eight-month European puts and calls currently available on BC’s shares (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0041.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit 2 Market Data for Eight-month European Options on BC Shares\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0042.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option J K L M\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0043.webp\" style=\"max-width:min(100%,608px)\" alt=\"Option type Put Put Call Call\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0044.webp\" style=\"max-width:min(100%,608px)\" alt=\"Exercise price $54.00 $55.25 $55.25 $60.00\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0045.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d1) 0.6293 0.5714 0.5714 0.6368\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0046.webp\" style=\"max-width:min(100%,608px)\" alt=\"N(d2) 0.5714 0.5120 0.5120 ?\"><p>After analyzing Greene’s recommendation, Stewart discusses it with the fellow manager. She asks him the implications of the change in his input estimates on call and put prices. Greene responds with t
