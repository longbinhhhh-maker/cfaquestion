"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0105.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 9.31\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0106.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 9.42\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0107.webp\" style=\"max-width:min(100%,284px)\" alt=\"720 9.75\"><p>Additionally, the CEO asks the executive how swap contracts can be constructed using derivative instruments. The executive replies by sharing two facts:<\/p><p>Fact 1: “Swap contracts may be constructed using forwards and futures. In the case of the former, a series of forward contracts each priced at the same rate as the swap rate may be used to construct a swap. Futures contracts may only be used to construct swaps when future interest rates are certain (making them equivalent to forward contracts).”<\/p><p>Fact 2: “A swap can be constructed from options each with expirations corresponding to the swap payment dates. For instance, a pay fixed swap can be replicated by buying a call option and selling a put option.”<\/p><p>Alpha Corp., a local construction firm, won a bid for a construction project in Spain. The firm had to borrow some $25 million (converted into U.S. $) to finance the project. However, high quoted borrowing rates from Spanish banks (in the foreign country) discouraged the firm from seeking financing within Spain. To resolve the firm’s financing concerns, Terisemo Associates had identified a Spanish construction firm, Beta Build, in the same situation as Alpha Corp. Beta Build’s project involved the construction of an art gallery in the United States. A senior manager at Terisemo Associates arranged a meeting between executives of the two construction firms and recommended both parties engage in a currency swap. The recommended swap was a two-year contract covering both parties’ loan period with semi-annual payments. Beta Build was to pay a fixed rate of 3.45%, and Alpha Corp. a floating rate. The term structure - applicable to both construction firms 180 days into the swap - is illustrated below (exhibit 2). The exchange rate at swap initiation was $0.85 per €1. The current exchange rate is $0.90 per €1. The LIBOR at contract initiation was 4.00%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0108.webp\" style=\"max-width:min(100%,296px)\" alt=\"Exhibit 2 Spanish and U.S. Term Structures\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0109.webp\" style=\"max-width:min(100%,400px)\" alt=\"Days Euribor (%) LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0110.webp\" style=\"max-width:min(100%,400px)\" alt=\"180 3.00% 5.00%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0111.webp\" style=\"max-width:min(100%,400px)\" alt=\"360 3.12% 5.45%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0112.webp\" style=\"max-width:min(100%,400px)\" alt=\"540 3.25% 5.60%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0113.webp\" style=\"max-width:min(100%,400px)\" alt=\"720 3.35% 6.30%\"><p>Terisemo Associates is conducting a workshop for its employees to educate them further on the mechanics of swaps. The workshop will feature a discussion by Dustin Hughes, a senior analyst who has been following the derivatives market for many years. During the workshop Hughes introduces the concept of swaptions. He states, “The added benefit of a swaption is investor flexibility. An investor may have several motives for entering into a swaption.”<\/p><p>To carry his discussion further, Hughes attempts to demonstrate the mechanics of swaptions by walking the firm’s employees through a series of illustrations. The exhibit below (exhibit 3) contains term structure information discussed as part of his illustrations. The information pertains to a two-year European receiver swaption on a one-year swap with quarterly payments.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0114.webp\" style=\"max-width:min(100%,89px)\" alt=\"Exhibit 3\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0115.webp\" style=\"max-width:min(100%,487px)\" alt=\"Term Structure of Interest Rates at Swaption Expiration\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0116.webp\" style=\"max-width:min(100%,360px)\" alt=\"Maturity (Days) Rate (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0117.webp\" style=\"max-width:min(100%,360px)\" alt=\"90 4.55\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0118.webp\" style=\"max-width:min(100%,360px)\" alt=\"180 4.88\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0119.webp\" style=\"max-width:min(100%,360px)\" alt=\"270 4.90\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0120.webp\" style=\"max-width:min(100%,360px)\" alt=\"360 5.00\"><p>Hughes discusses the issue of credit risk often associated with currency, equity, and interest rate swaps with firm employees. He cites re-pricing as a potential solution to the credit risk problem. Using the interest rate swap contract utilized by Furnace Works Ltd. for illustration purposes, Hughes explains how a swap contract can be re-priced. The term structure of the swap 90 days after entering Furnace Works Ltd. is illustrated in the exhibit below (exhibit 4).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0121.webp\" style=\"max-width:min(100%,294px)\" alt=\"Exhibit 4 Term Structure of Interest Rates.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0122.webp\" style=\"max-width:min(100%,284px)\" alt=\"Days LIBOR (%)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0123.webp\" style=\"max-width:min(100%,284px)\" alt=\"90 10.05\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0124.webp\" style=\"max-width:min(100%,284px)\" alt=\"180 10.10\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0125.webp\" style=\"max-width:min(100%,284px)\" alt=\"270 10.45\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0126.webp\" style=\"max-width:min(100%,284px)\" alt=\"360 10.49\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0127.webp\" style=\"max-width:min(100%,284px)\" alt=\"450 10.53\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0128.webp\" style=\"max-width:min(100%,284px)\" alt=\"540 10.58\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0129.webp\" style=\"max-width:min(100%,284px)\" alt=\"630 10.60\"><\/div><\/details><div class=\"qtext\"><p>Using the information in exhibit 4, the new annual fixed rate after re-pricing the swap purchased by Furnace Works Ltd. is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 25, "q": "Using the information in Exhibit 1, the no-arbitrage forward price is closest to:", "opts": ["$3,411.00", "$3,590.00", "$3,600.00"], "ans": "A", "expl": "The no-arbitrage forward price of an equity forward contract can be calculated using the formula: where S0 is the current spot price of the index, r is the continuously compounded risk-free rate, δ is the continuously compounded dividend yield, and T is the time to maturity of the contract in years. Plugging in the values from Exhibit 1: - S0 = 3250 - r = 0.04931 (4.931%) - δ = 0.017 (1.7%) - T = 1.5 years The calculation becomes: Using the exponential function, we find: Thus, This calculation shows that the no-arbitrage forward price should be approximately \\$3,411, which aligns with option A. B is incorrect. Option B suggests a forward price of \\$3,590. This value does not align with the calculated no-arbitrage forward price using the formula provided. If we substitute the values into the formula, the result is approximately \\$3,411, not \\$3,590. The discrepancy suggests either a miscalculation or incorrect assumptions about the inputs such as the risk-free rate, dividend yield, or the maturity period. It is crucial to use precise and accurate inputs in financial formulas to avoid significant errors in pricing and valuation. C is incorrect. Option C suggests a forward price of \\$3,600. This value is also incorrect based on the no-arbitrage pricing formula used. The calculated value of approximately \\$3,411 clearly deviates from \\$3,600, indicating that option C overestimates the forward price. This overestimation could lead to incorrect financial decisions and potential losses in a real-world scenario. It is essential for analysts to rely on accurate calculations and understand the implications of each input in the formula to ensure correct pricing and avoid arbitrage opportunities.", "explhtml": "<p>The no-arbitrage forward price of an equity forward contract can be calculated using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0153.webp\" style=\"max-width:min(100%,168px)\" alt=\"F(0, T) = S0 × e(r−δ)T\"><p>where S<sub>0<\/sub> is the current spot price of the index, r is the continuously compounded risk-free rate, δ is the continuously compounded dividend yield, and T is the time to maturity of the contract in years. Plugging in the values from Exhibit 1: - S<sub>0<\/sub> = 3250 - r = 0.04931 (4.931%) - δ = 0.017 (1.7%) - T = 1.5 years The calculation becomes:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0154.webp\" style=\"max-width:min(100%,406px)\" alt=\"F(0, T) = 3250 × e(0.04931−0.017)×1.5 = 3250 × e0.048465\"><p>Using the exponential function, we find:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0155.webp\" style=\"max-width:min(100%,145px)\" alt=\"e0.048465 ≈1.0497\"><p>Thus,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0156.webp\" style=\"max-width:min(100%,254px)\" alt=\"F(0,T) = 3250 × 1.0497 ≈3411\"><p>This calculation shows that the no-arbitrage forward price should be approximately \\$3,411, which aligns with option A.<\/p><p><b>B is incorrect<\/b>. Option B suggests a forward price of \\$3,590. This value does not align with the calculated no-arbitrage forward price using the formula provided. If we substitute the values into the formula, the result is approximately \\$3,411, not \\$3,590. The discrepancy suggests either a miscalculation or incorrect assumptions about the inputs such as the risk-free rate, dividend yield, or the maturity period. It is crucial to use precise and accurate inputs in financial formulas to avoid significant errors in pricing and valuation.<\/p><p><b>C is incorrect<\/b>. Option C suggests a forward price of \\$3,600. This value is also incorrect based on the no-arbitrage pricing formula used. The calculated value of approximately \\$3,411 clearly deviates from \\$3,600, indicating that option C overestimates the forward price. This overestimation could lead to incorrect financial decisions and potential losses in a real-world scenario. It is essential for analysts to rely on accurate calculations and understand the implications of each input in the formula to ensure correct pricing and avoid arbitrage opportunities.<\/p><p class=\"los\">Study Session 13, Learning Module 33: Pricing and Valuation of Forward Commitments, LOS 33 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed- income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Tim Marshall<\/summary><div class=\"vig-body\"><p>Tim Marshall, CFA, is a derivatives analyst at the State Fund, a government equity fund. Marshall is evaluating a forward position the fund has taken to hedge its $50 million exposure to the global MSCI. Marshal summarizes the particulars of the equity forward contract below (Exhibit 1): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0140.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Equity Forward Contract\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0141.webp\" style=\"max-width:min(100%,467px)\" alt=\"Maturity 1.5 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0142.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current value of index (S0) 3,250\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0143.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded dividend yield 1.700%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0144.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded risk-free rate 4.931%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0145.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current forward price 3,600\"><p>Marshall observes that the equity forward contract is overpriced providing the opportunity to earn arbitrage profits. He attempts to determine the most suitable profit-making strategy for investors who do not currently own the index stocks.<\/p><p>Two months after initiation, Marshall observes that the value of the index has increased to 3,700. He attempts to analyze how the change influences the value of equity forward.<\/p><p>Marshall would like to study how forward contracts are priced in greater detail and proceeds to prepare a presentation for his subordinates. He intends to include the following analysis as part of the presentation:<\/p><p>Analysis 1: The pricing of a forward contract is done because the transaction is risk-free.<\/p><p>Analysis 2: The sale of a forward contract on an asset position is equivalent to investing an amount equal to the the spot price is invested in a risk-free bond that pays F(0,T) at time T.<\/p><p>As part of his analysis, Marshall evaluates a long forward position undertaken by the fund on shares of ABC Inc.’s stock. The forward contract has a +$100 value at the initiation. Marshall aims to determine how the forward price of the contract has been derived.<\/p><p>In addition to domestic equities, the index fund includes an allocation to international equities, such as Canadian and UK stocks. The fund’s currency allocation manager states that a need to hedge exposure to an anticipated decline of the Canadian dollar (C$). She proposes a 6-month currency forward. The exhibit below summarizes key information concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0146.webp\" style=\"max-width:min(100%,404px)\" alt=\"Exhibit 2: Currency Forward Contract Position\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0147.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract value C$10,000,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0148.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract maturity 6 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0149.webp\" style=\"max-width:min(100%,550px)\" alt=\"Canadian interest rate 1.979%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0150.webp\" style=\"max-width:min(100%,550px)\" alt=\"U.S. interest rate 1.574%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0151.webp\" style=\"max-width:min(100%,550px)\" alt=\"Current spot rate (CAD per 1 USD) 1.410\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0152.webp\" style=\"max-width:min(100%,550px)\" alt=\"Expected spot rate (in six months) 1.305\"><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, the no-arbitrage forward price is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 26, "q": "Which of the following combinations of transactions, undertaken today, will allow the investor to earn arbitrage profits on the equity index fund?", "opts": ["Buy equity index stocks and sell a forward contract on the index.", "Borrow funds to buy the equity index stocks and sell a forward contract on the index.", "Short the equity index stocks, invest the proceeds, and buy a forward contract on the index"], "ans": "B", "expl": "The correct answer is option B because it aligns with the fundamental principles of arbitrage, particularly in a scenario where the forward contract is overpriced. In this case, the investor can exploit the overpricing by borrowing funds at the risk-free rate to purchase the index stocks at the current spot price, then simultaneously selling a forward contract on the same index. By doing so, the investor locks in a guaranteed future price that is higher than the expected future spot price derived from the no-arbitrage condition. This strategy ensures a risk-free profit as the cost of borrowing is less than the overpriced forward contract's return, effectively capitalizing on the price discrepancy between the forward contract price and the expected future spot price based on the risk-free rate and dividend yield. A is incorrect. Option A suggests buying equity index stocks and selling a forward contract on the index. While selling the overpriced forward contract is a correct move, using one's own funds to buy the stocks contradicts the first rule of arbitrage which states that arbitrageurs should not use their own money but should instead use borrowed funds. This approach would involve using personal capital, thereby exposing the investor to additional financial risk and deviating from the ideal arbitrage strategy which aims to minimize risk and avoid the use of personal funds. C is incorrect. Option C involves short selling the equity index stocks, investing the proceeds, and buying a forward contract on the index. This strategy is flawed in the context of an overpriced forward contract. Buying an overpriced forward contract would result in a loss when the contract matures, as the settlement price would likely be lower than the forward price paid. Additionally, this strategy does not take advantage of the opportunity to sell the overpriced forward, missing out on locking in a higher sell price which could be exploited for arbitrage profit. Furthermore, this approach involves taking on unnecessary market exposure by both short selling and purchasing the forward contract, which increases the complexity and risk, deviating from the second arbitrage rule of avoiding price risk.", "explhtml": "<p>The correct answer is option B because it aligns with the fundamental principles of arbitrage, particularly in a scenario where the forward contract is overpriced. In this case, the investor can exploit the overpricing by borrowing funds at the risk-free rate to purchase the index stocks at the current spot price, then simultaneously selling a forward contract on the same index. By doing so, the investor locks in a guaranteed future price that is higher than the expected future spot price derived from the no-arbitrage condition. This strategy ensures a risk-free profit as the cost of borrowing is less than the overpriced forward contract&#x27;s return, effectively capitalizing on the price discrepancy between the forward contract price and the expected future spot price based on the risk-free rate and dividend yield.<\/p><p><b>A is incorrect<\/b>. Option A suggests buying equity index stocks and selling a forward contract on the index. While selling the overpriced forward contract is a correct move, using one&#x27;s own funds to buy the stocks contradicts the first rule of arbitrage which states that arbitrageurs should not use their own money but should instead use borrowed funds. This approach would involve using personal capital, thereby exposing the investor to additional financial risk and deviating from the ideal arbitrage strategy which aims to minimize risk and avoid the use of personal funds.<\/p><p><b>C is incorrect<\/b>. Option C involves short selling the equity index stocks, investing the proceeds, and buying a forward contract on the index. This strategy is flawed in the context of an overpriced forward contract. Buying an overpriced forward contract would result in a loss when the contract matures, as the settlement price would likely be lower than the forward price paid. Additionally, this strategy does not take advantage of the opportunity to sell the overpriced forward, missing out on locking in a higher sell price which could be exploited for arbitrage profit. Furthermore, this approach involves taking on unnecessary market exposure by both short selling and purchasing the forward contract, which increases the complexity and risk, deviating from the second arbitrage rule of avoiding price risk.<\/p><p class=\"los\">Study Session 13, Learning Module 33: Pricing and Valuation of Forward Commitments, LOS 33 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed- income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Tim Marshall<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Marshall, CFA, is a derivatives analyst at the State Fund, a government equity fund. Marshall is evaluating a forward position the fund has taken to hedge its $50 million exposure to the global MSCI. Marshal summarizes the particulars of the equity forward contract below (Exhibit 1): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0140.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Equity Forward Contract\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0141.webp\" style=\"max-width:min(100%,467px)\" alt=\"Maturity 1.5 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0142.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current value of index (S0) 3,250\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0143.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded dividend yield 1.700%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0144.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded risk-free rate 4.931%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0145.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current forward price 3,600\"><p>Marshall observes that the equity forward contract is overpriced providing the opportunity to earn arbitrage profits. He attempts to determine the most suitable profit-making strategy for investors who do not currently own the index stocks.<\/p><p>Two months after initiation, Marshall observes that the value of the index has increased to 3,700. He attempts to analyze how the change influences the value of equity forward.<\/p><p>Marshall would like to study how forward contracts are priced in greater detail and proceeds to prepare a presentation for his subordinates. He intends to include the following analysis as part of the presentation:<\/p><p>Analysis 1: The pricing of a forward contract is done because the transaction is risk-free.<\/p><p>Analysis 2: The sale of a forward contract on an asset position is equivalent to investing an amount equal to the the spot price is invested in a risk-free bond that pays F(0,T) at time T.<\/p><p>As part of his analysis, Marshall evaluates a long forward position undertaken by the fund on shares of ABC Inc.’s stock. The forward contract has a +$100 value at the initiation. Marshall aims to determine how the forward price of the contract has been derived.<\/p><p>In addition to domestic equities, the index fund includes an allocation to international equities, such as Canadian and UK stocks. The fund’s currency allocation manager states that a need to hedge exposure to an anticipated decline of the Canadian dollar (C$). She proposes a 6-month currency forward. The exhibit below summarizes key information concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0146.webp\" style=\"max-width:min(100%,404px)\" alt=\"Exhibit 2: Currency Forward Contract Position\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0147.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract value C$10,000,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0148.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract maturity 6 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0149.webp\" style=\"max-width:min(100%,550px)\" alt=\"Canadian interest rate 1.979%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0150.webp\" style=\"max-width:min(100%,550px)\" alt=\"U.S. interest rate 1.574%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0151.webp\" style=\"max-width:min(100%,550px)\" alt=\"Current spot rate (CAD per 1 USD) 1.410\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0152.webp\" style=\"max-width:min(100%,550px)\" alt=\"Expected spot rate (in six months) 1.305\"><\/div><\/details><div class=\"qtext\"><p>Which of the following combinations of transactions, undertaken today, will allow the investor to earn arbitrage profits on the equity index fund?<\/p><\/div>", "subj": "derivatives"}, {"n": 27, "q": "Using the data in Exhibit 1 and assuming the current forward price is the no-arbitrage price, the value of the contract two months after initiation is closest to:", "opts": ["–227.56.", "100.00.", "246.15."], "ans": "C", "expl": "The correct answer is option C, which states that the value of the forward contract two months after initiation is approximately 246.15. To understand why this is the correct answer, we need to calculate the value of the forward contract using the formula for the value of a forward contract at time t, given by: Where: St is the current value of the index, which is 3,700. δc is the continuously compounded dividend yield, which is 1.7% or 0.017. T − t is the remaining time to maturity, calculated as 1.5 years - 2 months (or 1/6 year), which equals 1.333 years. F(0, T ) is the initial forward price, which is 3,600. rc is the continuously compounded risk-free rate, which is 4.931% or 0.04931. Plugging these values into the formula, we get: This value is very close to 246.15, confirming that option C is correct. A is incorrect. It suggests that the value of the forward contract is approximately -227.56. This is incorrect because it implies a negative value, which does not align with the calculations based on the given data and the formula for the value of a forward contract. The negative value would suggest that the forward price agreed upon initially (3,600) is significantly lower than the adjusted present value of the index, which contradicts the calculation where the present value of the index (3,618.6) is higher than the discounted forward price (3,373.2). B is incorrect. It suggests that the value of the forward contract remains at 100.00, which was its value at initiation. This is incorrect because the value of a forward contract changes over time as the spot price of the underlying asset and the interest rates change. The calculation clearly shows that the value has increased from the initial 100.00 to approximately 245.4, reflecting changes in the market conditions and the index price. ", "explhtml": "<p>The correct answer is option C, which states that the value of the forward contract two months after initiation is approximately 246.15. To understand why this is the correct answer, we need to calculate the value of the forward contract using the formula for the value of a forward contract at time t, given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0157.webp\" style=\"max-width:min(100%,296px)\" alt=\"Vt(0, T) = Ste−δc(T−t) −F(0, T)e−rc(T −t)\"><p>Where:<\/p><p>S<sub>t<\/sub> is the current value of the index, which is 3,700.<\/p><p>δ<sub>c<\/sub> is the continuously compounded dividend yield, which is 1.7% or 0.017.<\/p><p>T − t is the remaining time to maturity, calculated as 1.5 years - 2 months (or 1/6 year),<\/p><p>which equals 1.333 years.<\/p><p>F(0, T ) is the initial forward price, which is 3,600.<\/p><p>r<sub>c<\/sub> is the continuously compounded risk-free rate, which is 4.931% or 0.04931.<\/p><p>Plugging these values into the formula, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0158.webp\" style=\"max-width:min(100%,521px)\" alt=\"Vt(0, T) = 3700 × e−0.017×1.333 −3600 × e−0.04931×1.333 Vt(0, T) ≈3700 × 0.978 −3600 × 0.937 ≈3618.6 −3373.2 ≈245.4\"><p>This value is very close to 246.15, confirming that option C is correct.<\/p><p><b>A is incorrect<\/b>. It suggests that the value of the forward contract is approximately -227.56. This is incorrect because it implies a negative value, which does not align with the calculations based on the given data and the formula for the value of a forward contract. The negative value would suggest that the forward price agreed upon initially (3,600) is significantly lower than the adjusted present value of the index, which contradicts the calculation where the present value of the index (3,618.6) is higher than the discounted forward price (3,373.2).<\/p><p><b>B is incorrect<\/b>. It suggests that the value of the forward contract remains at 100.00, which was its value at initiation. This is incorrect because the value of a forward contract changes over time as the spot price of the underlying asset and the interest rates change. The calculation clearly shows that the value has increased from the initial 100.00 to approximately 245.4, reflecting changes in the market conditions and the index price. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Tim Marshall<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Marshall, CFA, is a derivatives analyst at the State Fund, a government equity fund. Marshall is evaluating a forward position the fund has taken to hedge its $50 million exposure to the global MSCI. Marshal summarizes the particulars of the equity forward contract below (Exhibit 1): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0140.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Equity Forward Contract\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0141.webp\" style=\"max-width:min(100%,467px)\" alt=\"Maturity 1.5 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0142.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current value of index (S0) 3,250\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0143.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded dividend yield 1.700%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0144.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded risk-free rate 4.931%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0145.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current forward price 3,600\"><p>Marshall observes that the equity forward contract is overpriced providing the opportunity to earn arbitrage profits. He attempts to determine the most suitable profit-making strategy for investors who do not currently own the index stocks.<\/p><p>Two months after initiation, Marshall observes that the value of the index has increased to 3,700. He attempts to analyze how the change influences the value of equity forward.<\/p><p>Marshall would like to study how forward contracts are priced in greater detail and proceeds to prepare a presentation for his subordinates. He intends to include the following analysis as part of the presentation:<\/p><p>Analysis 1: The pricing of a forward contract is done because the transaction is risk-free.<\/p><p>Analysis 2: The sale of a forward contract on an asset position is equivalent to investing an amount equal to the the spot price is invested in a risk-free bond that pays F(0,T) at time T.<\/p><p>As part of his analysis, Marshall evaluates a long forward position undertaken by the fund on shares of ABC Inc.’s stock. The forward contract has a +$100 value at the initiation. Marshall aims to determine how the forward price of the contract has been derived.<\/p><p>In addition to domestic equities, the index fund includes an allocation to international equities, such as Canadian and UK stocks. The fund’s currency allocation manager states that a need to hedge exposure to an anticipated decline of the Canadian dollar (C$). She proposes a 6-month currency forward. The exhibit below summarizes key information concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0146.webp\" style=\"max-width:min(100%,404px)\" alt=\"Exhibit 2: Currency Forward Contract Position\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0147.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract value C$10,000,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0148.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract maturity 6 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0149.webp\" style=\"max-width:min(100%,550px)\" alt=\"Canadian interest rate 1.979%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0150.webp\" style=\"max-width:min(100%,550px)\" alt=\"U.S. interest rate 1.574%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0151.webp\" style=\"max-width:min(100%,550px)\" alt=\"Current spot rate (CAD per 1 USD) 1.410\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0152.webp\" style=\"max-width:min(100%,550px)\" alt=\"Expected spot rate (in six months) 1.305\"><\/div><\/details><div class=\"qtext\"><p>Using the data in Exhibit 1 and assuming the current forward price is the no-arbitrage price, the value of the contract two months after initiation is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 28, "q": "With respect to the analysis, Marshall is most accurate regarding:", "opts": ["Both analyses.", "Analysis 1 only.", "Analysis 2 only."], "ans": "B", "expl": "Marshall's accuracy in Analysis 1 stems from the fundamental principles of forward contract pricing. The pricing of a forward contract is indeed based on the assumption that the transaction is risk-free. This is achieved by compounding the current spot price of the asset, denoted as S0, at the risk-free rate over the term of the contract. Mathematically, the forward price F(0,T ) can be calculated using the formula F(0, T ) = S0e(r−q)T , where r is the continuously compounded risk-free rate, q is the continuously compounded dividend yield, and T is the time to maturity. This formula shows that the forward price is the future value of the spot price compounded at the effective rate (r − q) over the period T . The risk-free nature of this pricing reflects the absence of arbitrage opportunities, meaning that no excess profit can be made without exposure to risk. This aligns with Marshall's statement in Analysis 1, confirming its accuracy. Analysis 2 is incorrect. While Marshall's statement in Analysis 2 captures a conceptual truth about the economic equivalence of certain transactions, it simplifies the mechanics of forward contracts. The sale of a forward contract on an asset is not exactly equivalent to investing the spot price in a risk-free bond that matures at F(0,T ) at time T . Instead, entering into a forward contract involves agreeing to buy or sell an asset at a predetermined future date and price, without any exchange of assets or cash flows until settlement. The comparison to a risk-free bond investment is metaphorical, illustrating that the forward price must be set such that it does not allow arbitrage opportunities. However, the actual mechanics involve no initial investment like that described for a bond. Therefore, while the analogy helps in understanding the no-arbitrage condition, it does not accurately describe the transactional structure of a forward contract. ", "explhtml": "<p>Marshall&#x27;s accuracy in Analysis 1 stems from the fundamental principles of forward contract pricing. The pricing of a forward contract is indeed based on the assumption that the transaction is risk-free. This is achieved by compounding the current spot price of the asset, denoted as S<sub>0<\/sub>, at the risk-free rate over the term of the contract. Mathematically, the forward price F(0,T ) can be calculated using the formula F(0, T ) = S<sub>0<\/sub>e<sup>(r−q)T<\/sup> , where r is the continuously compounded risk-free rate, q is the continuously compounded dividend yield, and T is the time to maturity. This formula shows that the forward price is the future value of the spot price compounded at the effective rate (r − q) over the period T . The risk-free nature of this pricing reflects the absence of arbitrage opportunities, meaning that no excess profit can be made without exposure to risk. This aligns with Marshall&#x27;s statement in Analysis 1, confirming its accuracy.<\/p><p><b>Analysis 2 is incorrect<\/b>. While Marshall&#x27;s statement in Analysis 2 captures a conceptual truth about the economic equivalence of certain transactions, it simplifies the mechanics of forward contracts. The sale of a forward contract on an asset is not exactly equivalent to investing the spot price in a risk-free bond that matures at F(0,T ) at time T . Instead, entering into a forward contract involves agreeing to buy or sell an asset at a predetermined future date and price, without any exchange of assets or cash flows until settlement. The comparison to a risk-free bond investment is metaphorical, illustrating that the forward price must be set such that it does not allow arbitrage opportunities. However, the actual mechanics involve no initial investment like that described for a bond. Therefore, while the analogy helps in understanding the no-arbitrage condition, it does not accurately describe the transactional structure of a forward contract. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (b): Calculate and interpret the no-arbitrage value of equity, interest rate, fixed-income, and currency forward and futures contracts<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Tim Marshall<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tim Marshall, CFA, is a derivatives analyst at the State Fund, a government equity fund. Marshall is evaluating a forward position the fund has taken to hedge its $50 million exposure to the global MSCI. Marshal summarizes the particulars of the equity forward contract below (Exhibit 1): <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0140.webp\" style=\"max-width:min(100%,307px)\" alt=\"Exhibit 1: Equity Forward Contract\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0141.webp\" style=\"max-width:min(100%,467px)\" alt=\"Maturity 1.5 years\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0142.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current value of index (S0) 3,250\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0143.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded dividend yield 1.700%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0144.webp\" style=\"max-width:min(100%,467px)\" alt=\"Continuously compounded risk-free rate 4.931%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0145.webp\" style=\"max-width:min(100%,467px)\" alt=\"Current forward price 3,600\"><p>Marshall observes that the equity forward contract is overpriced providing the opportunity to earn arbitrage profits. He attempts to determine the most suitable profit-making strategy for investors who do not currently own the index stocks.<\/p><p>Two months after initiation, Marshall observes that the value of the index has increased to 3,700. He attempts to analyze how the change influences the value of equity forward.<\/p><p>Marshall would like to study how forward contracts are priced in greater detail and proceeds to prepare a presentation for his subordinates. He intends to include the following analysis as part of the presentation:<\/p><p>Analysis 1: The pricing of a forward contract is done because the transaction is risk-free.<\/p><p>Analysis 2: The sale of a forward contract on an asset position is equivalent to investing an amount equal to the the spot price is invested in a risk-free bond that pays F(0,T) at time T.<\/p><p>As part of his analysis, Marshall evaluates a long forward position undertaken by the fund on shares of ABC Inc.’s stock. The forward contract has a +$100 value at the initiation. Marshall aims to determine how the forward price of the contract has been derived.<\/p><p>In addition to domestic equities, the index fund includes an allocation to international equities, such as Canadian and UK stocks. The fund’s currency allocation manager states that a need to hedge exposure to an anticipated decline of the Canadian dollar (C$). She proposes a 6-month currency forward. The exhibit below summarizes key information concerning the forward contract, exchange and risk-free rates (Exhibit 2).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0146.webp\" style=\"max-width:min(100%,404px)\" alt=\"Exhibit 2: Currency Forward Contract Position\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0147.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract value C$10,000,000\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0148.webp\" style=\"max-width:min(100%,550px)\" alt=\"Contract maturity 6 months\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0149.webp\" style=\"max-width:min(100%,550px)\" alt=\"Canadian interest rate 1.979%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0150.webp\" style=\"max-width:min(100%,550px)\" alt=\"U.S. interest rate 1.574%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0151.webp\" style=\"max-width:min(100%,550px)\" alt=\"Current spot rate (CAD per 1 USD) 1.410\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0152.webp\" style=\"max-width:min(100%,550px)\" alt=\"Expected spot rate (in six months) 1.305\"><\/div><\/details><div class=\"qtext\"><p>With respect to the analysis, Marshall is most accurate regarding:<\/p><\/div>", "subj": "derivatives"}, {"n": 29, "q": "From Grant's perspective, the value of his pay-fixed, receive-equity swap position at initiation is most likely:", "opts": ["Zero.", "Positive.", "Negative."], "ans": "A", "expl": "The correct answer is option A, which states that the value of Grant's pay-fixed, receive-equity swap position at initiation is zero. In financial derivatives like swaps, the initial market value is typically set to zero. This is because the terms of the swap are structured to ensure that neither party has an immediate advantage or disadvantage at the start of the contract. The fixed payments that Grant agrees to pay are calculated based on the prevailing Johannesburg Interbank Agreed Rate (JIBAR), which is designed to reflect the current interest rate environment. Simultaneously, the equity portion of the swap, which Grant receives, is based on the Johannesburg Stock Index (JSI). The value of this part is also set to reflect the current market conditions. Therefore, the initial values of both legs of the swap are equal and opposite, which results in a net value of zero for the swap at the time of initiation. B is incorrect. It suggests that the value of the swap is positive at initiation. This is incorrect because swaps are financial instruments designed to have a neutral value at the start. A positive value would imply an immediate financial gain to the holder, which contradicts the fundamental principle of swap agreements. The fixed rate payments and the equity returns are calculated to be equivalent based on current market rates and indices, ensuring no initial profit or loss. Therefore, suggesting a positive value indicates a misunderstanding of how the initial valuation of swap contracts is determined. C is incorrect. It suggests that the value of the swap is negative at initiation. This is also incorrect for reasons similar to those explaining why option B is incorrect. A negative value at the start of the swap would imply an immediate loss to the holder, which is not how swap contracts are structured. The terms of the swap are specifically set so that the present value of expected future cash flows from both sides of the swap (fixed payments and equity returns) are equal at the time of contract initiation, leading to a net value of zero. Claiming a negative value would imply an error in the structuring or valuation of the swap terms, which is not the case here. ", "explhtml": "<p>The correct answer is option A, which states that the value of Grant&#x27;s pay-fixed, receive-equity swap position at initiation is zero. In financial derivatives like swaps, the initial market value is typically set to zero. This is because the terms of the swap are structured to ensure that neither party has an immediate advantage or disadvantage at the start of the contract. The fixed payments that Grant agrees to pay are calculated based on the prevailing Johannesburg Interbank Agreed Rate (JIBAR), which is designed to reflect the current interest rate environment. Simultaneously, the equity portion of the swap, which Grant receives, is based on the Johannesburg Stock Index (JSI). The value of this part is also set to reflect the current market conditions. Therefore, the initial values of both legs of the swap are equal and opposite, which results in a net value of zero for the swap at the time of initiation.<\/p><p><b>B is incorrect<\/b>. It suggests that the value of the swap is positive at initiation. This is incorrect because swaps are financial instruments designed to have a neutral value at the start. A positive value would imply an immediate financial gain to the holder, which contradicts the fundamental principle of swap agreements. The fixed rate payments and the equity returns are calculated to be equivalent based on current market rates and indices, ensuring no initial profit or loss. Therefore, suggesting a positive value indicates a misunderstanding of how the initial valuation of swap contracts is determined.<\/p><p><b>C is incorrect<\/b>. It suggests that the value of the swap is negative at initiation. This is also incorrect for reasons similar to those explaining why option B is incorrect. A negative value at the start of the swap would imply an immediate loss to the holder, which is not how swap contracts are structured. The terms of the swap are specifically set so that the present value of expected future cash flows from both sides of the swap (fixed payments and equity returns) are equal at the time of contract initiation, leading to a net value of zero. Claiming a negative value would imply an error in the structuring or valuation of the swap terms, which is not the case here. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (c): Describe and compare how interest rate, currency, and equity swaps are priced and valued<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Andrew Grant<\/summary><div class=\"vig-body\"><p>Andrew Grant, a portfolio manager with Table Mountain Asset Management in Cape Town, South Africa, manages a balanced fund that holds fixed and floating rate bonds and equities.<\/p><p>Grant has just entered into a one-year, advanced set, settled in arrears swap contract to pay a fixed rate based on the Johannesburg Interbank Agreed Rate (JIBAR) and receive returns based on the Johannesburg Stock Index (JSI). The notional principal of this contract will be SAR 100 million and cash flows will be exchanged quarterly. A 30/360 day count convention is assumed. The swap contract price was determined based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0159.webp\" style=\"max-width:min(100%,309px)\" alt=\"Exhibit 1: Market data at initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0160.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0161.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 5.0% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0162.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.4% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0163.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.7% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0164.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,658\"><p>At the time of initiation, Grant had considered and rejected the opportunity to enter a swap contract that was identical to the one he entered except that he would have paid a floating rate based on JIBAR rather than a fixed rate.<\/p><p>90 days after initiation, the first quarterly payments are made. The relevant market data at that time is shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0165.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit 2: Market data 90 days after initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0166.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.3% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0167.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 4.8% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0168.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.2% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0169.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0170.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,745\"><p>Grant also contemplates taking an options position to manage his exposure to declining interest rates for the floating rate portfolio and take advantage of rising equity markets. Grant is evaluating options positions – either buying calls or selling puts on the JSI with three months to maturity. Options positions need to be considered given the premium payment and future return potential.<\/p><p>During a quarterly meeting of the investment committee of Table Mountain AMC, Grant presents his plan for assuming an options position. One of the committee members, who has already noted Grant’s view that interest rates will decline, asks the following questions.<\/p><p>Question 1: Would increasing interest rates influence call and put prices?<\/p><p>Question 2: How would declining interest rates impact call and put prices?<\/p><\/div><\/details><div class=\"qtext\"><p>From Grant&#x27;s perspective, the value of his pay-fixed, receive-equity swap position at initiation is most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 30, "q": "The annualized fixed swap rate for a swap to pay a fixed rate and receive a floating rate based on JIBAR is closest to:", "opts": ["4.30%.", "5.57%.", "6.85%."], "ans": "B", "expl": "The correct answer is option B, which states that the annualized fixed swap rate for a swap to pay a fixed rate and receive a floating rate based on JIBAR is closest to 5.57%. To determine this, we calculate the quarterly fixed swap rate using the formula: Where P V0,ti(1) is the present value factor for each period. The present value factors for the different periods are calculated as follows: Using these values, the quarterly fixed swap rate is calculated as: To find the annualized rate, we multiply the quarterly rate by 4 (since there are four quarters in a year): This calculation shows that the annualized fixed swap rate is approximately 5.57%, which corresponds to option B. A is incorrect. It suggests that the annualized fixed swap rate is 4.30%, which is significantly lower than the calculated rate of approximately 5.57%. This discrepancy arises because the calculation based on the present value factors of the different JIBAR rates over the respective periods leads to a higher rate. The lower rate suggested in option A does not align with the calculated present value factors and their sum, which are critical in determining the correct swap rate. C is incorrect. It proposes an annualized fixed swap rate of 6.85%, which is too high compared to the calculated rate of approximately 5.57%. This overestimation could result from incorrectly assuming higher interest rates or miscalculating the present value factors. The correct calculation, based on the actual JIBAR rates provided and their respective periods, yields a lower rate, confirming that option C overstates the fixed swap rate. ", "explhtml": "<p>The correct answer is option B, which states that the annualized fixed swap rate for a swap to pay a fixed rate and receive a floating rate based on JIBAR is closest to 5.57%. To determine this, we calculate the quarterly fixed swap rate using the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0171.webp\" style=\"max-width:min(100%,326px)\" alt=\"1 −PV0,tn(1) Quarterly fixed swap rate = ∑n i=1 PV0,ti(1)\"><p>Where P V<sub>0,t<\/sub><sub>i<\/sub>(1) is the present value factor for each period. The present value factors for the different periods are calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0172.webp\" style=\"max-width:min(100%,303px)\" alt=\"1 PV90 days = = 0.9889 1 + 0.045 × (39600) 1 PV180 days = = 0.9756 1 + 0.05 × (138600) 1 PV270 days = = 0.9611 1 + 0.054 × ( 237600) 1 PV360 days = = 0.9461 1 + 0.057 × ( 336600)\"><p>Using these values, the quarterly fixed swap rate is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0173.webp\" style=\"max-width:min(100%,540px)\" alt=\"1 −0.9461 Quarterly fixed swap rate = 0.9889 + 0.9756 + 0.9611 + 0.9461 = 0.01393\"><p>To find the annualized rate, we multiply the quarterly rate by 4 (since there are four quarters in a year):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0174.webp\" style=\"max-width:min(100%,454px)\" alt=\"Annualized fixed rate = 0.01393 × 4 = 0.05572 or 5.572%\"><p>This calculation shows that the annualized fixed swap rate is approximately 5.57%, which corresponds to option B.<\/p><p><b>A is incorrect<\/b>. It suggests that the annualized fixed swap rate is 4.30%, which is significantly lower than the calculated rate of approximately 5.57%. This discrepancy arises because the calculation based on the present value factors of the different JIBAR rates over the respective periods leads to a higher rate. The lower rate suggested in option A does not align with the calculated present value factors and their sum, which are critical in determining the correct swap rate.<\/p><p><b>C is incorrect<\/b>. It proposes an annualized fixed swap rate of 6.85%, which is too high compared to the calculated rate of approximately 5.57%. This overestimation could result from incorrectly assuming higher interest rates or miscalculating the present value factors. The correct calculation, based on the actual JIBAR rates provided and their respective periods, yields a lower rate, confirming that option C overstates the fixed swap rate. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (d): Calculate and interpret the no-arbitrage value of interest rate, currency, and equity swaps<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Andrew Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Grant, a portfolio manager with Table Mountain Asset Management in Cape Town, South Africa, manages a balanced fund that holds fixed and floating rate bonds and equities.<\/p><p>Grant has just entered into a one-year, advanced set, settled in arrears swap contract to pay a fixed rate based on the Johannesburg Interbank Agreed Rate (JIBAR) and receive returns based on the Johannesburg Stock Index (JSI). The notional principal of this contract will be SAR 100 million and cash flows will be exchanged quarterly. A 30/360 day count convention is assumed. The swap contract price was determined based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0159.webp\" style=\"max-width:min(100%,309px)\" alt=\"Exhibit 1: Market data at initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0160.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0161.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 5.0% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0162.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.4% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0163.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.7% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0164.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,658\"><p>At the time of initiation, Grant had considered and rejected the opportunity to enter a swap contract that was identical to the one he entered except that he would have paid a floating rate based on JIBAR rather than a fixed rate.<\/p><p>90 days after initiation, the first quarterly payments are made. The relevant market data at that time is shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0165.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit 2: Market data 90 days after initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0166.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.3% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0167.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 4.8% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0168.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.2% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0169.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0170.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,745\"><p>Grant also contemplates taking an options position to manage his exposure to declining interest rates for the floating rate portfolio and take advantage of rising equity markets. Grant is evaluating options positions – either buying calls or selling puts on the JSI with three months to maturity. Options positions need to be considered given the premium payment and future return potential.<\/p><p>During a quarterly meeting of the investment committee of Table Mountain AMC, Grant presents his plan for assuming an options position. One of the committee members, who has already noted Grant’s view that interest rates will decline, asks the following questions.<\/p><p>Question 1: Would increasing interest rates influence call and put prices?<\/p><p>Question 2: How would declining interest rates impact call and put prices?<\/p><\/div><\/details><div class=\"qtext\"><p>The annualized fixed swap rate for a swap to pay a fixed rate and receive a floating rate based on JIBAR is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 31, "q": "From Grant's perspective, the value of the pay-fixed receive-equity swap 90 days after initiation is closest to:", "opts": ["SAR 329,400", "SAR 2,050,000", "SAR 2,378,000"], "ans": "B", "expl": "The correct answer is option B, SAR 2,050,000. To understand why this is the correct answer, we need to analyze the value of the swap from Grant's perspective 90 days after initiation. Grant entered a pay-fixed, receive-equity swap based on the Johannesburg Stock Index (JSI). The fixed rate payments were calculated at the initiation of the swap using the prevailing Johannesburg Interbank Agreed Rate (JIBAR) rates. The calculation of the quarterly fixed swap rate is as follows: Quarterly fixed swap rate = Where the present value (PV) factors are calculated using the respective JIBAR rates at initiation: Substituting these values into the formula gives: Grant's quarterly payments are therefore: The present value of these future cash flows, recalculated using the spot rates observed 90 days after initiation, and the value of the receive-equity leg based on the JSI value increase, leads to the calculation of the swap's value: Value of the swap = (1.023783−1.003252) × SAR 100,000, 000 = SAR 2, 053,140 This value is closest to SAR 2,050,000, which is option B. A is incorrect. It suggests a value of SAR 329,400, which significantly underestimates the value of the swap. This calculation does not align with the derived swap value, which is based on the present value of future cash flows and the increase in the JSI. The detailed calculations above show that the swap's value is much higher, reflecting both the fixed payments and the equity returns. C is incorrect. It suggests a value of SAR 2,378,000, which overestimates the value of the swap. This option likely miscalculates either the fixed payment obligations or the JSI's performance impact. The detailed calculations provide a swap value closer to SAR 2,050,000, which corresponds to option B. ", "explhtml": "<p>The correct answer is option B, SAR 2,050,000. To understand why this is the correct answer, we need to analyze the value of the swap from Grant&#x27;s perspective 90 days after initiation. Grant entered a pay-fixed, receive-equity swap based on the Johannesburg Stock Index (JSI). The fixed rate payments were calculated at the initiation of the swap using the prevailing Johannesburg Interbank Agreed Rate (JIBAR) rates. The calculation of the quarterly fixed swap rate is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0175.webp\" style=\"max-width:min(100%,758px)\" alt=\"1 −PV factor for 360-day i\"><p>Quarterly fixed swap rate =<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0176.webp\" style=\"max-width:min(100%,758px)\" alt=\"PV factor for 90-day interest rate + PV factor for 180-day interest rate\"><p>Where the present value (PV) factors are calculated using the respective JIBAR rates at initiation:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0177.webp\" style=\"max-width:min(100%,469px)\" alt=\"1 PV factor for 90-day interest rate = 1 + 0.045× 360 90 = 0.9889 1 PV factor for 180-day interest rate = = 0.9756 1 + 0.05 × 180 1 360\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0178.webp\" style=\"max-width:min(100%,474px)\" alt=\"1 360 PV factor for 270-day interest rate = = 0.9611 1 + 0.054 × 237600 1 PV factor for 360-day interest rate = 1 + 0.057 × 1 = 0.9461\"><p>Substituting these values into the formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0179.webp\" style=\"max-width:min(100%,540px)\" alt=\"1 −0.9461 Quarterly fixed swap rate = 0.9889 + 0.9756 + 0.9611 + 0.9461 = 0.01393\"><p>Grant&#x27;s quarterly payments are therefore:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0180.webp\" style=\"max-width:min(100%,545px)\" alt=\"Quarterly payments = 0.01393 × SAR 100, 000, 000 = SAR 1, 393, 000\"><p>The present value of these future cash flows, recalculated using the spot rates observed 90 days after initiation, and the value of the receive-equity leg based on the JSI value increase, leads to the calculation of the swap&#x27;s value:<\/p><p>Value of the swap = (1.023783−1.003252) × SAR 100,000, 000 = SAR 2, 053,140<\/p><p>This value is closest to SAR 2,050,000, which is option B.<\/p><p><b>A is incorrect<\/b>. It suggests a value of SAR 329,400, which significantly underestimates the value of the swap. This calculation does not align with the derived swap value, which is based on the present value of future cash flows and the increase in the JSI. The detailed calculations above show that the swap&#x27;s value is much higher, reflecting both the fixed payments and the equity returns.<\/p><p><b>C is incorrect<\/b>. It suggests a value of SAR 2,378,000, which overestimates the value of the swap. This option likely miscalculates either the fixed payment obligations or the JSI&#x27;s performance impact. The detailed calculations provide a swap value closer to SAR 2,050,000, which corresponds to option B. <\/p><p class=\"los\">Derivatives, Learning Module 1: Pricing and Valuation of Forward Commitments, LOS 1 (d): Calculate and interpret the no-arbitrage value of interest rate, currency, and equity swaps<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Andrew Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Grant, a portfolio manager with Table Mountain Asset Management in Cape Town, South Africa, manages a balanced fund that holds fixed and floating rate bonds and equities.<\/p><p>Grant has just entered into a one-year, advanced set, settled in arrears swap contract to pay a fixed rate based on the Johannesburg Interbank Agreed Rate (JIBAR) and receive returns based on the Johannesburg Stock Index (JSI). The notional principal of this contract will be SAR 100 million and cash flows will be exchanged quarterly. A 30/360 day count convention is assumed. The swap contract price was determined based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0159.webp\" style=\"max-width:min(100%,309px)\" alt=\"Exhibit 1: Market data at initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0160.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0161.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 5.0% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0162.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.4% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0163.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.7% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0164.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,658\"><p>At the time of initiation, Grant had considered and rejected the opportunity to enter a swap contract that was identical to the one he entered except that he would have paid a floating rate based on JIBAR rather than a fixed rate.<\/p><p>90 days after initiation, the first quarterly payments are made. The relevant market data at that time is shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0165.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit 2: Market data 90 days after initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0166.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.3% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0167.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 4.8% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0168.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.2% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0169.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0170.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,745\"><p>Grant also contemplates taking an options position to manage his exposure to declining interest rates for the floating rate portfolio and take advantage of rising equity markets. Grant is evaluating options positions – either buying calls or selling puts on the JSI with three months to maturity. Options positions need to be considered given the premium payment and future return potential.<\/p><p>During a quarterly meeting of the investment committee of Table Mountain AMC, Grant presents his plan for assuming an options position. One of the committee members, who has already noted Grant’s view that interest rates will decline, asks the following questions.<\/p><p>Question 1: Would increasing interest rates influence call and put prices?<\/p><p>Question 2: How would declining interest rates impact call and put prices?<\/p><\/div><\/details><div class=\"qtext\"><p>From Grant&#x27;s perspective, the value of the pay-fixed receive-equity swap 90 days after initiation is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 32, "q": "What are the most appropriate answers Grant can give for the two questions posed by the investment committee member?", "opts": ["Call prices will fall and put prices will increase if interest rates increase.", "Call prices will rise and put prices will fall if interest rates increase.", "Call and put prices are not affected by movements in interest rates."], "ans": "B", "expl": "Interest rates have a significant impact on the pricing of options, particularly call and put options. When interest rates increase, the cost of carrying or holding an asset funded by borrowed money becomes higher. This scenario makes call options more appealing because they offer the right to buy the asset at a predetermined price without the need to invest the full amount required to own the asset outright. Instead, the investor can use the capital that would have been used to purchase the asset to earn interest, thus increasing the attractiveness of call options, which in turn drives up their prices. Conversely, higher interest rates make put options less attractive. Holding a put option implies a bearish outlook, where the holder expects the asset price to decline. If an investor owns the asset, they could sell it and use the proceeds to earn high interest, rather than holding onto an asset that might depreciate in value. Therefore, as interest rates rise, the opportunity cost of holding the asset as opposed to selling it increases, making put options less desirable and cheaper. A is incorrect. This option suggests that call prices will fall and put prices will increase if interest rates increase, which contradicts the established financial theory. Higher interest rates increase the cost of holding assets, making call options more attractive because they require less capital investment compared to directly purchasing the asset. This increased attractiveness should logically lead to higher, not lower, call prices. Similarly, higher interest rates should decrease the attractiveness of put options, as it becomes more lucrative to sell the asset and invest the proceeds at the higher rate, thus leading to lower, not higher, put prices. C is incorrect. This option states that call and put prices are not affected by movements in interest rates, which is incorrect. The pricing of options is sensitive to changes in interest rates through the mechanisms of cost of carry and the time value of money. Ignoring the impact of interest rates on option pricing overlooks fundamental aspects of financial theory and the practical realities observed in financial markets. ", "explhtml": "<p>Interest rates have a significant impact on the pricing of options, particularly call and put options. When interest rates increase, the cost of carrying or holding an asset funded by borrowed money becomes higher. This scenario makes call options more appealing because they offer the right to buy the asset at a predetermined price without the need to invest the full amount required to own the asset outright. Instead, the investor can use the capital that would have been used to purchase the asset to earn interest, thus increasing the attractiveness of call options, which in turn drives up their prices.<\/p><p>Conversely, higher interest rates make put options less attractive. Holding a put option implies a bearish outlook, where the holder expects the asset price to decline. If an investor owns the asset, they could sell it and use the proceeds to earn high interest, rather than holding onto an asset that might depreciate in value. Therefore, as interest rates rise, the opportunity cost of holding the asset as opposed to selling it increases, making put options less desirable and cheaper.<\/p><p><b>A is incorrect<\/b>. This option suggests that call prices will fall and put prices will increase if interest rates increase, which contradicts the established financial theory. Higher interest rates increase the cost of holding assets, making call options more attractive because they require less capital investment compared to directly purchasing the asset. This increased attractiveness should logically lead to higher, not lower, call prices. Similarly, higher interest rates should decrease the attractiveness of put options, as it becomes more lucrative to sell the asset and invest the proceeds at the higher rate, thus leading to lower, not higher, put prices.<\/p><p><b>C is incorrect<\/b>. This option states that call and put prices are not affected by movements in interest rates, which is incorrect. The pricing of options is sensitive to changes in interest rates through the mechanisms of cost of carry and the time value of money. Ignoring the impact of interest rates on option pricing overlooks fundamental aspects of financial theory and the practical realities observed in financial markets. <\/p><p class=\"los\">Derivatives, Learning Module 2: Valuation of Contingent Claims, LOS 2(c): Identify an arbitrage opportunity involving options and describe the related arbitrage<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Andrew Grant<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Andrew Grant, a portfolio manager with Table Mountain Asset Management in Cape Town, South Africa, manages a balanced fund that holds fixed and floating rate bonds and equities.<\/p><p>Grant has just entered into a one-year, advanced set, settled in arrears swap contract to pay a fixed rate based on the Johannesburg Interbank Agreed Rate (JIBAR) and receive returns based on the Johannesburg Stock Index (JSI). The notional principal of this contract will be SAR 100 million and cash flows will be exchanged quarterly. A 30/360 day count convention is assumed. The swap contract price was determined based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0159.webp\" style=\"max-width:min(100%,309px)\" alt=\"Exhibit 1: Market data at initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0160.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0161.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 5.0% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0162.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.4% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0163.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.7% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0164.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,658\"><p>At the time of initiation, Grant had considered and rejected the opportunity to enter a swap contract that was identical to the one he entered except that he would have paid a floating rate based on JIBAR rather than a fixed rate.<\/p><p>90 days after initiation, the first quarterly payments are made. The relevant market data at that time is shown below in Exhibit 2. <\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0165.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit 2: Market data 90 days after initiation\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0166.webp\" style=\"max-width:min(100%,390px)\" alt=\"90-day JIBAR 4.3% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0167.webp\" style=\"max-width:min(100%,390px)\" alt=\"180-day JIBAR 4.8% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0168.webp\" style=\"max-width:min(100%,390px)\" alt=\"270-day JIBAR 5.2% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0169.webp\" style=\"max-width:min(100%,390px)\" alt=\"360-day JIBAR 5.5% p.a.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0170.webp\" style=\"max-width:min(100%,390px)\" alt=\"JSI value 3,745\"><p>Grant also contemplates taking an options position to manage his exposure to declining interest rates for the floating rate portfolio and take advantage of rising equity markets. Grant is evaluating options positions – either buying calls or selling puts on the JSI with three months to maturity. Options positions need to be considered given the premium payment and future return potential.<\/p><p>During a quarterly meeting of the investment committee of Table Mountain AMC, Grant presents his plan for assuming an options position. One of the committee members, who has already noted Grant’s view that interest rates will decline, asks the following questions.<\/p><p>Question 1: Would increasing interest rates influence call and put prices?<\/p><p>Question 2: How would declining interest rates impact call and put prices?<\/p><\/div><\/details><div class=\"qtext\"><p>What are the most appropriate answers Grant can give for the two questions posed by the investment committee member?<\/p><\/div>", "subj": "derivatives"}, {"n": 33, "q": "Using the data provided in Exhibit 1, the no-arbitrage price of a 3-month futures contract on the Euro (EUR/USD) and the nature of any arbitrage opportunity is closest to?", "opts": ["The no-arbitrage price is USD 1.0993 per EUR; therefore, the observed price is overvalued, suggesting a potential arbitrage opportunity to sell the futures contract.", "The no-arbitrage price is USD 1.1028 per EUR; therefore, the observed price is undervalued, suggesting a potential arbitrage opportunity to buy the futures contract.", "The no-arbitrage price is USD 1.10 per EUR; therefore, the observed price is fair and no arbitrage opportunity exists."], "ans": "B", "expl": "The no-arbitrage price for a currency futures contract, under the assumption of continuous compounding, is given by the following formula from the carry arbitrage model: Since the observed market price (1.10) is lower than the no-arbitrage price (1.1028), the futures contract is undervalued. This presents an arbitrage opportunity to buy the cheap asset (the futures contract) and sell the expensive asset (the synthetic forward created by borrowing and lending). The specific arbitrage strategy would be: This set of transactions locks in a risk-free profit with no initial investment, aligning with the principles of the carry arbitrage model. A is incorrect. It states the futures is overvalued and suggests selling it. This is the opposite of the correct arbitrage strategy. An arbitrageur would want to buy an undervalued asset, not sell it. C is incorrect. It claims the market is in equilibrium. Our calculation proves it is not. The difference of 0.0028 USD per EUR is a significant arbitrage opportunity that would be quickly exploited by market participants. ", "explhtml": "<p>The no-arbitrage price for a currency futures contract, under the assumption of continuous compounding, is given by the following formula from the carry arbitrage model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap07/f0199.webp\" style=\"max-width:min(100%,331px)\" alt=\"F0 = S0 × e(rDc−rDf)×T F0 = 1.10 × e(0.025−0.015)×0.25 F0 = 1.10 × e0.0025 F0 = 1.10 × 1.002503 = 1.10275 = 1.1028\"><p>Since the observed market price (1.10) is lower than the no-arbitrage price (1.1028), the futures contract is undervalued. This presents an arbitrage opportunity to buy the cheap asset (the futures contract) and sell the expensive asset (the synthetic forward created by borrowing and lending). The specific arbitrage strategy would be:<\/p><img class=\"pi
