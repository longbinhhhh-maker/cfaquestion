<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "A member would most likely violate the Standard regarding duties to clients by:", "opts": ["adding a risky derivative security to the portfolio of a client with moderate risk tolerance.", "executing a client order for a security the member believes is greatly overvalued.", "recommending purchase of securities without a reasonable inquiry into the investment experience of the client."], "ans": "C", "expl": "Standard III(A) Loyalty, Prudence, and Care requires members acting as advisors to make a\nreasonable inquiry into the client's investment experience, risk and return objectives, and\nfinancial constraints before making investment recommendations. Investment decisions\nmust be made based on a total portfolio approach, rather than the quality of an individual\ninvestment in isolation. Some members are not acting as investment advisors and may\nonly have a duty to provide best execution of client orders."}, {"n": 2, "q": "Which of the following statements regarding allocating trades is CORRECT? It is permissible\nunder the Standards to allocate trades:", "opts": ["based upon any method the firm deems suitable so long as the allocation procedure has been disclosed to all clients.", "on a pro-rata basis over all suitable accounts.", "based upon compensation arrangements."], "ans": "B", "expl": "It is permissible to allocate trades on a pro-rata basis over all suitable accounts. It is not\npermissible to base allocations upon compensation arrangements. Any method is not\nnecessarily suitable, and disclosure does not absolve the member from ensuring that the\nallocation is necessarily fair.\n(Module 91.4, LOS 91: III(B))"}, {"n": 3, "q": "Regarding (1) not voting all client proxies, and (2) using a directed brokerage arrangement, a\nmember would violate the Standards by:", "opts": ["engaging in neither of these practices.", "not voting all proxies for client stocks.", "using a directed brokerage arrangement."], "ans": "A", "expl": "Proxies have economic value to the client. To comply with Standard III(A) Loyalty,\nPrudence, and Care, the analyst is obligated to vote proxies in an informed and\nresponsible manner. A cost benefit analysis may show that voting all proxies may not\nbenefit the client, so voting proxies may not be necessary in all instances. Directed\nbrokerage occurs when the client requests that a portion of the client's brokerage be used\nto purchase services that directly benefit the client. Although this may prevent best\nexecution, it does not violate the Standards as it was directed by the client, not the\nbrokerage firm."}, {"n": 4, "q": "Bertha Mader, CFA, received proxy material related to a hostile takeover attempt of Danube\nIndustries by Balnet Company. She holds shares of Danube in most of her client accounts.\nMader has a high opinion of Danube's management because they have run the company\nsuccessfully and have always responded directly and honestly to her inquiries. She is not\nacquainted with Balnet's management team but knows they have a reputation for improving\nthe bottom line at the companies they acquire, partly because they tend to replace upper\nmanagement at their targets and assume their functions. Balnet's offer is 60% higher than\nthe price of Danube shares before the announcement. Danube's management has contacted\nMader and requested that she vote the shares she controls against the takeover because the\nmanagement is concerned for their jobs and for the welfare of the company. To comply with\nthe Code and Standards, Mader should:", "opts": ["delegate her proxy vote to another member of her firm due to the conflict of interest created when she was contacted by management.", "vote for the takeover if it is in the best interest of Danube's shareholders, regardless of the consequences to current management.", "vote for the takeover if she can get assurance that Danube's management team will remain in place."], "ans": "B", "expl": "Standard III(A), Loyalty, Prudence, and Care, requires that members act for the benefit of\ntheir clients. Mader's duty is to her clients, who are shareholders of Danube. She has no\nduty to Danube's management, nor to the company itself, and must vote the shares\naccordingly.\n(Module 91.4, LOS 91: III(A))"}, {"n": 5, "q": "An investment advisor goes straight from a research seminar to a meeting with a\nprospective new client with whom she has never been in contact. The advisor is very excited\nabout the information she just received in the seminar and begins showing the prospect the\nnew ideas her firm is coming up with. This is most likely a violation of:", "opts": ["both of these.", "Standard III(B), Fair Dealing.", "Standard III(C), Suitability."], "ans": "A", "expl": "It is a violation of Standard III(B) because the advisor should act first on behalf of existing\nclients whose needs and characteristics she already knows. It is a violation of Standard\nIII(C) because she has never met the prospect and does not know if the new ideas are\nappropriate for the prospect. Thus, \"both of these\" is the best response."}, {"n": 6, "q": "Concerning Standard III(B), Fair Dealing, which of the following actions is NOT a valid\nprocedure for compliance with the Standard?", "opts": ["Communicate investment recommendations simultaneously within the firm and to customers, where possible.", "Communicate investment recommendations to all customers including those accounts for which the securities are not eligible for purchase.", "Limit the number of people that are involved and are privy to the fact that an investment recommendation is going to be disseminated."], "ans": "B", "expl": "To ensure compliance with the Standard, members should seek to communicate\ninvestment recommendations to all clients who have indicated an interest and also those\nfor whom the securities are suitable. There is no need to communicate recommendations\nto clients for whom the securities are deemed unsuitable.\n(Module 91.4, LOS 91: III(B))"}, {"n": 7, "q": "In securing the shares for all accounts under her management, Linda Kammel of Northwest\nFutures purchased three blocks of shares at three different prices. She then allocated these\nshares by placing shares from the first block in accounts with surnames beginning with A-G.\nThe second was allocated over accounts H-P, and the third over Q-Z. This action is:", "opts": ["consistent with her responsibilities under the Code and Standards.", "not permissible under the Code and Standards.", "permissible only if the clients are informed of the allocation procedure."], "ans": "B", "expl": "Standard III(B) requires a member to deal fairly with all clients when taking investment\nactions. Since she knew at the outset that she was going to place shares in all accounts,\nregardless of the first letter of the surname, all accounts must participate on a pro-rata\nbasis in each block in order to conform to the Standard. Her actions constitute a violation\nof the Standard concerning fair dealing."}, {"n": 8, "q": "With regard to disseminating investment recommendations, the recommended procedures\nfor compliance with the Standard concerning fair dealing least likely state that members and\ncandidates should:", "opts": ["maximize the number of people who know an investment recommendation is going to be disseminated.", "maintain a list of clients and their holdings, to facilitate notifying them of changes in investment recommendations.", "shorten the time frame between the decision to make an investment recommendation and its dissemination."], "ans": "A", "expl": "Recommended procedures for compliance with Standard III(B) Fair Dealing include limiting\nthe number of people who know an investment recommendation is going to be\ndisseminated"}, {"n": 9, "q": "An analyst with his own money management firm trades on behalf of several large pension\nfunds. The analyst now performs all trades through a particular brokerage firm because the\nbrokerage provides his firm with a no-interest line of credit if paid within 60 days. The line of\ncredit is available to all brokerage clients. The brokerage provides the analyst with personal\naccount privileges that he would not otherwise be eligible for. The brokerage also provides\nthe analyst with free research reports on many companies. Which of these benefits are\nviolations of Standard III(A), Loyalty, Prudence, and Care?", "opts": ["Neither of these.", "The personal account privileges.", "The research reports."], "ans": "B", "expl": "The personal account privileges are clearly a violation. The no-interest line of credit could\nbe a violation if the analyst does not factor in the benefits when determining the fees of\nthe clients, but it is not a per se violation. Research reports are least likely to be a\nviolation.\n(Module 91.4, LOS 91: III(A))"}, {"n": 10, "q": "Alan Cramer, CFA, practices in a country that does not regulate the investment of company\nretirement plans. He was retained by Bingham Companies to manage their corporate\npension plan. Bingham's management has approached Cramer and requested that Cramer\ninvest the entire plan in Bingham stock.\nCramer may:", "opts": ["invest a portion of the retirement plan in Bingham Company stock if the investment is prudent and if he keeps the overall portfolio properly diversified.", "invest all of the retirement plan assets in Bingham Company stock according to management's request only if Cramer can document that the investment is more prudent than any other investment opportunity he finds.", "not invest any of Bingham Company's retirement plan in its own stock regardless of the stock's prospects and in spite of management's request."], "ans": "A", "expl": "Standard III(A), Loyalty, Prudence, and Care, requires members to comply with their\nfiduciary duty. Retirement plan managers owe their duty to the plan participants, not to\nthe management of the company sponsoring the plan. The fiduciary duty includes the\nobligation to diversify the plan's investments, regardless of the quality of the sponsoring\ncompany's stock. Investing in the company's stock is not prohibited."}, {"n": 11, "q": "While trading on behalf of a pension account, an analyst receives special research reports\nfrom the brokerage firm with whom she is doing the trades. Such an activity is:", "opts": ["a violation of both Standard III(A), Loyalty, Prudence, and Care, and the Code of Ethics.", "a violation of only The Code of Ethics.", "not in itself a violation of Standard III(A), Loyalty, Prudence, and Care, nor the Code of Ethics."], "ans": "C", "expl": "An analyst can receive research from a brokerage firm with whom she is trading on behalf\nof a client. The analyst should inform the client of the arrangement. The analyst is more\nlikely to violate Standard III(A) by obtaining non-research services or, worse yet, personal\nbenefits from the brokerage firm.\n(Module 91.4, LOS 91: III(A))"}, {"n": 12, "q": "According to the Standard concerning loyalty, prudence, and care, brokerage is an asset of\nthe:", "opts": ["brokerage firm conducting the trades.", "managing firm.", "client."], "ans": "C", "expl": "Brokerage is an asset of the client."}, {"n": 13, "q": "Rey Sanchez, CFA, covers the specialty chemical industry for Rock Advisory Associates. Until\ntoday he has had a buy recommendation on ChemStar, and many of the firm's customers\nhave purchased shares based upon his recommendation. The firm's client accounts are\ndivided into two fundamental categories: trading and buy-and-hold accounts. The firm holds\ndiscretionary trading authority over the trading accounts, but not the buy-and-hold\naccounts. Sanchez has recently come to believe that the fundamentals are changing for the\nworse at ChemStar, and is preparing a sell recommendation. He calls a meeting of the firm's\nportfolio managers with accounts holding ChemStar and tells them of the pending release of\nthe sell recommendation. On this basis, the portfolio managers sell all positions in the\ndiscretionary accounts but not in the buy-and-hold accounts. Sanchez completes and mails\nthe report to all clients two days later, and, shortly thereafter, many of the buy-and-hold\naccounts sell their ChemStar positions. With regard to these actions, Sanchez is:", "opts": ["in violation of the Standard on Fair Dealing; the portfolio managers are in violation of the Standard on Fair Dealing.", "in violation of the Standard on Fair Dealing; the portfolio managers are not in violation of the Standard on Fair Dealing.", "not in violation of the Standard on Fair Dealing; the portfolio managers are in violation of the Standard on Fair Dealing."], "ans": "A", "expl": "Sanchez is in violation of the Standard III(B), Fair Dealing, since he has disseminated his\nrecommendation preferentially to the portfolio managers in advance of making the report\navailable to all clients who hold shares of ChemStar. The portfolio managers are in\nviolation of the Standard since they are effectively giving preferential treatment to the\ntrading accounts over the buy-and-hold accounts in the placement of orders based upon\nthe change in recommendation.\n(Module 91.4, LOS 91: III(B))"}, {"n": 14, "q": "Calvin Moore, CFA, has been transferred from the brokerage house of the Browning\nCompany to the portfolio management department. In portfolio management, Moore learns\nthat clients are grouped into three divisions according to portfolio value, divided as follows:\nGroup 1 up to $10,000\nGroup 2 from $10,001 to $100,000\nGroup 3 more than $100,000\nWhen recommendations are announced or trades are initiated, a particular sequence is\nfollowed in communicating to these groups. At the next monthly meeting, Moore suggests\nthat the sequencing practice is a breach of CFA Institute Standards. One of Moore's co-\nworkers replies that the grouping approach helps the company in applying the Standard\nregarding portfolio recommendations. He further suggests that because Browning's overall\nperformance is more strongly affected by actions taken on the high value portfolios, that\nthese portfolios should take priority over the small value portfolios. What should Moore\ndo? Moore should:", "opts": ["disassociate himself from the problem and seek legal advice.", "prepare a written report to the CEO describing the problem.", "do nothing since there is no breach with the Standards."], "ans": "A", "expl": "Taking a special approach in disseminating information in relation to initiating trades is a\nbreach of Standard III(B), Fair Dealing. Given the fact that Moore works in the department\nand has already unsuccessfully tried to prevent the practice from continuing, he needs to\ndisassociate himself and seek legal advice.\n(Module 91.4, LOS 91: III(B))"}, {"n": 15, "q": "A money management firm has the following policy concerning new recommendations:\nWhen a new recommendation is made, each portfolio manager estimates the likely\ntransaction size for each of their clients. Clients are notified of the new recommendation in\nthe order of their estimated transaction size—largest first. All clients have signed a form\nwhere they acknowledge and consent to this allocation procedure. With respect to Standard\nIII(B), Fair Dealing, this is:", "opts": ["a violation of the standard.", "not a violation because the clients have signed the consent form.", "not a violation because the clients are aware of the policy."], "ans": "A", "expl": "Such a policy is a violation of the Standard and client acknowledgement and/or consent\ndoes not change that fact."}, {"n": 16, "q": "An independent analyst has only one client. One of the client's largest holdings is a\nbrokerage firm. Because of the large holding by his client, the brokerage firm recently began\nallowing the analyst to tap into the firm's computer network to use the firm's research\nfacilities. This is allowable as long as the analyst:", "opts": ["discloses the relationship to the client.", "does both of the actions listed here.", "uses the resources to help manage the client's account."], "ans": "B", "expl": "According to Standard III(A), Loyalty, Prudence, and Care, the analyst must put the client\nfirst and inform the client of any possible conflicts of interest. The analyst must channel\nany benefits derived from his service to the client, back to the client, and inform the client\nof the benefits."}, {"n": 17, "q": "Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto.\nCalaveccio places a trade with Quantco Brokerage. While Calaveccio's part of the transaction\nwas conveyed correctly to Quantco, there was a trading error made in Calaveccio's account\ndue to a slip up within Quantco. Calaveccio realizes that the error has taken place, and\ninforms his contact at Quantco. Calaveccio allows Quantco to cover the error, with no cost to\nTrustCo. This is:", "opts": ["a violation of Calaveccio's duty to his employer.", "a violation of Calaveccio's fiduciary duties.", "permissible under CFA Institute Standards."], "ans": "C", "expl": "The issue is similar to an allocation of soft dollars. Clearly, if the broker absorbs the loss,\nthey expect to make up the difference in some way. However, since the error was on the\npart of Quantco Brokerage, Calaveccio is under no obligation to cover the cost of the\ntrading error. Moreover, no reasonable observer expects that there exists any implied\nfuture allocation of trades to Quantco in return for correcting their own mistake. There is\nno violation of Standard III(A), Loyalty, Prudence, and Care."}, {"n": 18, "q": "Bjorn Sandvik, CFA, completes a research report with a buy recommendation for Acorn\nProperties. In the early afternoon, Sandvik e-mails this recommendation to his clients who\nhad responded to his request that they provide Sandvik with their e-mail addresses. Later\nthat afternoon, the printed recommendation is forwarded to the postal service for normal\ndelivery to all customers, who receive the mailing 1 to 3 days later. Sandvik has:", "opts": ["not violated the Code and Standards because he acted fairly in disseminating research information to his clients.", "violated the Code and Standards by sending the e-mail recommendation in advance of the printed report.", "violated the Code and Standards by sending the e-mail recommendation to only some of his clients."], "ans": "A", "expl": "Standard III(B) Fair Dealing requires that members deal fairly with all clients in\ndisseminating investment recommendations. It does not require uniform or equal\ntreatment. Sandvik's approach in sending e-mail correspondence to those of his clients\nwho had given him their e-mail addresses, having made the request to all of his clients,\nand sending regular mail correspondence the same day, is fair to all of his clients.\n(Module 91.4, LOS 91: III(B))"}, {"n": 19, "q": "Ed Staples, CFA, manages a pension fund sponsored by Hill Corporation. The Code and\nStandards most likely require Staples to:", "opts": ["base investment decisions on each beneficiary’s return requirements and risk tolerance.", "act solely in the interest of the ultimate beneficiaries.", "support the sponsor's management during proxy fights."], "ans": "B", "expl": "Standard III(A) Loyalty, Prudence, and Care requires members and candidates who\nmanage investment funds to act in the interest of the beneficiaries. However, the Standard\nstates that fund managers' investment decisions are not required to be based on the\ninvestment needs of each fund investor, but rather should benefit the investors as a\nwhole. In voting proxies, the beneficiaries' interest must prevail over management's\ninterest."}, {"n": 20, "q": "Tony Calaveccio, CFA, is the manager of the TrustCo Small Cap Venture Fund in Toronto. He\nplaces trades for the fund with River City Brokerage. River City provides Calaveccio with soft\ndollars to purchase research. River City also deals in municipal bonds, some of which\nCalaveccio holds in his personal portfolio. He periodically uses the soft dollars to request\nresearch reports on various small cap stocks and also on the status of the municipal bond\nmarket and issues that he holds. These actions are:", "opts": ["in violation of his fiduciary duties regarding both the small cap research and the municipal bond research.", "not in violation of the Code and Standards.", "in violation of his fiduciary duties regarding the municipal bond research but not so regarding the research on the small cap issues."], "ans": "C", "expl": "The issue at hand is the member's fiduciary responsibilities in handling \"soft dollars\" which\nare technically the property of the client. Standard III(A), Loyalty, Prudence, and Care,\ndelineates the member's fiduciary responsibilities with regard to soft dollars. Since\nmunicipal bond research is clearly not relevant to the Small Cap Fund holders, he is clearly\nusing the soft dollars to obtain research for his personal benefit and is in violation of the\nStandard."}, {"n": 21, "q": "In accordance with Standard III (A) Loyalty, Prudence and Care, which of the following\nstatements is NOT a required or recommended action?", "opts": ["Vote all proxies on behalf of clients in a responsible manner.", "Submit to clients, at least quarterly, itemized statements detailing all of the period’s transactions.", "Utilize client brokerage to the sole benefit of the client."], "ans": "A", "expl": "Because of the time and expense involved in voting a proxy, Members and Candidates are\nnot required to vote every proxy. A cost benefit analysis can be performed to determine if\nit is necessary to vote a proxy. Standard III(A) requires that client brokerage be used to\nbenefit the client. Quarterly statements to clients are recommended."}, {"n": 22, "q": "Which of the following most accurately states a limitation that the Fair Dealing standard\nimposes?", "opts": ["Referral fees may be disclosed after proceeding with an agreement for service.", "Clients should not be discriminated against when disseminating investment recommendations.", "Before trading on her own portfolio, a CFA charterholder must wait for employer and client deals to be executed."], "ans": "B", "expl": "Standard III(B) Fair Dealing states that the dissemination of information and\nrecommendations to clients must be handled fairly. The other choices are related to\nStandard VI(B) Priority of Transactions and Standard VI(C) Referral Fees.\n(Module 91.4, LOS 91: III(B))"}, {"n": 23, "q": "Which of the following is least likely required of fiduciaries who are responsible for pension\nplans?", "opts": ["Supporting the sponsor's management during proxy fights.", "Acting solely in the interest of plan participants.", "Judging investments in the context of the total portfolio."], "ans": "A", "expl": "Under Standard III(A) Loyalty, Prudence, and Care, fiduciaries must evaluate\nmanagement's proposals during proxy fights to see if they are in the best interest of the\nplan participants. If management's ideas are justifiable and reasonably ensure plan\nparticipants' betterment, then fiduciaries can support them. If management is only trying\nto further its own objectives, especially at the cost of plan participants, then fiduciaries\nmust vote against management in proxy fights.\n(Module 91.4, LOS 91: III(A))"}];
const CFG = {"title": "Guidance for Standards III(A) and III(B)", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.4 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|\(?required\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect)\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect)\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;

  function afterGrade(){

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");

<style id="qcheck-css">
  .qcheck-wrap{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .qcheck-btn{background:var(--panel2);border:1px solid var(--accent);color:var(--accent2);
    font-weight:600;padding:8px 14px;border-radius:10px}
  .qcheck-btn:hover{border-color:var(--accent2)}
  .qcheck-btn.done{opacity:.55;cursor:default;border-color:var(--line);color:var(--muted);
    background:transparent}
  .qcheck-btn.done:hover{transform:none;border-color:var(--line)}
  .qcheck-msg{font-size:13.5px;font-weight:700}
  .qcheck-msg.ok{color:var(--ok)}
  .qcheck-msg.bad{color:var(--bad)}
  .qcheck-msg.warn{color:var(--pin)}
  .card.qc-locked .opt{pointer-events:none}
  body.qc-graded .qcheck-wrap{display:none}
</style>
<script id="qcheck-js">
/* Kiểm tra đáp án từng câu (chỉ áp dụng cho các đề Ethics theo Reading). */
(function(){
  function idx(card){ return (card.id && card.id.indexOf("q-")===0) ? +card.id.slice(2) : -1; }
  function addBtn(card){
    if(!card.classList || !card.classList.contains("card")) return;
    if(card.querySelector(".qcheck-wrap")) return;
    var i = idx(card); if(i<0) return;
    if(typeof CFG!=="undefined" && CFG && CFG.hasAnswers===false) return; // không có đáp án -> bỏ qua
    var wrap=document.createElement("div"); wrap.className="qcheck-wrap";
    var btn=document.createElement("button"); btn.type="button"; btn.className="qcheck-btn";
    btn.textContent="Kiểm tra đáp án";
    var msg=document.createElement("span"); msg.className="qcheck-msg";
    btn.onclick=function(){ checkOne(i, card, btn, msg); };
    wrap.appendChild(btn); wrap.appendChild(msg);
    var expl=card.querySelector(".expl");
    if(expl) card.insertBefore(wrap, expl); else card.appendChild(wrap);
  }
  function checkOne(i, card, btn, msg){
    if(typeof graded!=="undefined" && graded) return;      // đã nộp cả bài
    if(btn.classList.contains("done")) return;             // đã kiểm tra câu này
    var pick = (typeof answers!=="undefined") ? answers[i] : undefined;
    if(pick===undefined){
      msg.textContent="Hãy chọn một đáp án để kiểm tra."; msg.className="qcheck-msg warn";
      return;
    }
    var ans = (typeof DATA!=="undefined" && DATA[i]) ? DATA[i].ans : null;
    if(ans){
      var cb=document.getElementById("opt-"+i+"-"+ans);
      if(cb) cb.classList.add("correct");
      if(pick===ans){
        msg.textContent="Chính xác ✓"; msg.className="qcheck-msg ok";
      }else{
        var wb=document.getElementById("opt-"+i+"-"+pick);
        if(wb) wb.classList.add("wrong");
        msg.textContent="Chưa đúng — đáp án đúng là "+ans; msg.className="qcheck-msg bad";
      }
    }
    var e=document.getElementById("expl-"+i); if(e) e.classList.add("show");
    card.classList.add("qc-locked");
    btn.classList.add("done"); btn.textContent="Đã kiểm tra";
  }
  function scan(){
    if(document.body.classList.contains("qc-graded")) return;
    var cards=document.querySelectorAll("#quiz .card");
    for(var k=0;k<cards.length;k++) addBtn(cards[k]);
  }
  // Sau khi NỘP CẢ BÀI: ẩn nút kiểm tra từng câu (bài đã được chấm toàn bộ).
  if(typeof grade==="function"){
    var _g=grade;
    grade=function(a){ _g(a); document.body.classList.add("qc-graded"); };
  }
  // LÀM LẠI: bỏ trạng thái đã-chấm để nút kiểm tra từng câu hiện lại.
  if(typeof restart==="function"){
    var _r=restart;
    restart=function(){ document.body.classList.remove("qc-graded"); _r(); };
  }
  var quiz=document.getElementById("quiz");
  if(quiz){
    scan();
    new MutationObserver(function(){ scan(); }).observe(quiz,{childList:true});
  }
})();
</script>
<!--qcheck-end-->

<script id="baii-calc-js">
(function(){
  var loaded=false;

    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }

    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
