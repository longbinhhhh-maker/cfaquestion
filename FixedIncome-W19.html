<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

rest rates. The pass-through rate (ie, coupon rate that pass-through\ninvestors receive) equals the weighted average coupon (WAC) less servicing and administrative fees. The WAC is the weighted average of the\nmortgage rates for the pooled mortgages, with the weights being each mortgage balance as a percentage of the total balances. In this scenario,\nthe WAC is 4.75% and the fees are 0.25%, so the pass-through rate is 4.50%.\n(Choice A) 4.48% results from taking the simple average, not the weighted average, of the coupons.\n(Choice C) 4.75% results from not subtracting the servicing fee from the WAC.\nThings to remember:\nThe pass-through rate (ie, coupon rate that investors receive on mortgage pass-through securities) equals the weighted average coupon (WAC)\nless servicing and administrative fees.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAEYCAIAAABDctDHAAAk/UlEQVR42u2d23WrPBOGx//6GsAl4BKgBCjBlGBKMCWYEkwJpgS7hFBCKCGUkP/iXXuWNviU7MSH5HkushICWNZoNJrRSJq9v78bAAAA3Jb/UQUAAAAYYAAAAAwwAAAAYIABAAAwwAAAAIABBgAAwAADAAAABhgAAAADDAAAABhgAAAADDAAAAAGGAAAADDAAAAAGGAAAADAAAMAADwb/330gdlsRq0BAABMeX9//4A9/dDdAAAAYISgAQAAMMAAAACAAQYAAMAAAwAAAAYYAAAAAwwAAIABBgAAAAwwAAAABhgAAAAwwAAAABhgAAAAwAADAABggAEAAAADDAAAgAEGAADAAAN8E1VVzc5SFMUwDMMwPGDJq6qaz+cfemoYBn2vuq6RPjwO8/n8YstcLBaLxUL3fF8DHr38c4r25TRN0zSN90v68/s+7j9aJNyGKIrM7O3tbXS96zozK4qiLEsz2+12D1XszWbjPz/0Zd/f3xE6PKwmHg6H9Xp9VBlvMA6uqupwOJjZtAx3H3B7qT6q9XjAAAAAzwEeMNyZJEnMbLVaEa0FuAHL5dLM2rbt+97M4jj2f7Vta2ZZlvnvvwqfBVOQwJgDBgAAMJKwAG5MXdeeEDGfz+fz+chRrqoqTdM0TYuiCFO6iqI4HA76lz/etm04rm/bNs/zPM9HGWGaBzqaG6I3eH6Kp7SkaRq+fJqE5eUsyzL8rDzP+76XL+If4VkwKrbKMJvNuq7TLB2A/cMccBRFSZKM1MGb93K5lJc8VcawZc5ms7Islbrhj3uzP6Udasx1Xasx64awVUt5QwXJ8zycltaHht3Clcliuu1o+VUYV/ObZYQRgoY7I7Vsmmak87KCh 8ZUE3w3Z7/dVZVpb9xIIa61UZY/IN3+Qy7cktHl/8LNfmNnvfuFzy57SI9/9D79tZt/8wZX8Q7747DPf/v3YAtN15V1X//tXvxRe+dq/+LzM4YpM8uHNJ8vs4nZ/AYL6/b6qUs2mXq/LvuvrOR5yxH0z3KFrWUtTCkmSeBP17qzmvcx9K89zGYNLwUyOjo6Uh9PTUw8Y8gTF6HQ61Zf62pSK8eTkZNmyz2g0ch8SC6zgrVZLn5xlGfu2AQAM2zYAAAAAAKxgZztnztkt/bbdx3qFXVm2LhmKFt5Zir+7edA0f3B1OOc74H6uKzLj37XwnoUpyC4oz9dqqON7xH151x7M6RtDS1/h19/Bo/JuPvmVmX3ws/+xbI+mIgN+8dlnHtRv+wni+y6qLco7o3564m0mbN7LcqsedHp6WjoBwDu4QtTv7++/TpxHAABA2wa7c9xrbS48OTnxHaLyltHC9OaHwAMAAACA4UkCAAAAAGDYtmE7yGNkPB7L3yaKotse6QcAAAAAaNsAAAAAAIYnCQAAAAAAoG0DAAAAAKBtAwAAAACgbQMAAAAAANo2AAAAAADaNgAAAAAA2jYAAAAAAKBtAwAAAACgbQMAAAAAoG0DAAAAAADaNgAAAAAA2jYAAAAAANo2AAAAAADcgv8fnk0UepwodC0AAAAASUVORK5CYII="]}, {"n": 3, "q": "The risk to the cash flows investors receive from agency pass-through mortgage-backed securities is most likely related to:", "opts": ["prepayment risk.", "reinvestment risk.", "borrower defaults."], "ans": "A", "expl": "Prepayment risk of mortgage-backed securities\nCauses Consequences Effects on investment value\nDeclining interest Shorter average life of mortgage- Higher cash flows in early years that must be\nContraction risk\nrates backed securities reinvested at lower interest rates\nDefers more of cash flows to later years,\nLonger average life of mortgage-\nExtension risk Rising interest rates reducing their present value and price of\nbacked securities\nsecurity\nAgency pass-throughs are a type of mortgage-backed security (MBS): Investors receive a share of the interest and principal from a pool of\nmortgage loans. Since most mortgages give borrowers the right to prepay their loans, actual periodic cash flows from an MBS may vary as\nthe effective maturity (ie, average life) of the MBS varies. Prepayment risk refers to the uncertainty of MBS cash flows and maturity.\nThere are two components of prepayment risk:\nContraction risk: Declining interest rates encourage borrowers to refinance their loans, resulting in early repayment (ie, prepayment) of the\noriginal mortgages. This accelerated return of principal forces reinvestment of higher-than-anticipated cash flows at lower interest rates.\nExtension risk: Rising interest rates cause fewer refinancings and prepayments, so a larger portion of MBS cash flows is deferred further\ninto the future. The deferral of cash flows, along with the higher rates at which they are discounted, results in a decline in MBS values.\n(Choice B) Reinvestment risk relates to the uncertainty of the interest rate at which cash flows are reinvested, not the uncertainty of the cash\nflows received from holding an MBS. Changes in prepayment rates result in changes in the amount of reinvestment risk MBS holders are\nexposed to, so there is a connection between prepayment risk and reinvestment risk. However, they are defined as distinct types of risk.\n(Choice C) An agency MBS has either a government guarantee or an agency guarantee, so borrower defaults do not affect the cash flow\nuncertainty of these securities.\nThings to remember:\nAn agency pass-through mortgage-backed security (MBS) is an investment in pools of mortgage loans. Borrowers usually have the right to\nprepay such loans, which creates uncertainty as to the effective maturity of the MBS. This uncertainty is referred to as prepayment risk.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null, "explfigs": null}, {"n": 4, "q": "A portfolio of government securities is constructed to match the cash flow stream of the interest and principal payments of a commercial mortgage and to effectively retire that mortgage. This process is best described as a:", "opts": ["defeasance.", "sinking fund.", "securitization."], "ans": "A", "expl": "Defeasance\nPurpose A form of call protection for investors in commercial mortgage-backed securities (CMBS)\nOccurrence When a borrower prepays a mortgage loan that is held in a CMBS\nThe borrower must provide funds to construct a portfolio of government securities to match the original loan's cash flow\nDescription\nstream\nFunction To protect the CMBS investor from prepayment risk\nUnlike residential mortgage-backed securities (RMBS), commercial mortgage-backed securities (CMBS) use call protections to mitigate\nprepayment risk. Due to this call protection, CMBS trade more like corporate bonds than RMBS.\nDefeasance is a form of call protection for CMBS bondholders. To prepay a commercial mortgage loan in the underlying CMBS, a borrower\nmust provide funds for constructing a portfolio of government securities to match the cash flow stream of the original interest and principal\npayments. This process effectively retires the loan—which has been defeased by the economically equivalent government securities portfolio—\nand the CMBS investor is made whole.\n(Choice B) A sinking fund arrangement details a schedule for gradually retiring a portion of a bond's principal over time.\n(Choice C) Securitization is the process of bundling cash-generating loans that serve as collateral for bonds.\nThings to remember:\nDefeasance is a form of call protection for commercial mortgage-backed securities (CMBS) bondholders. To prepay a commercial mortgage loan\nin the underlying CMBS, a borrower must provide funds for constructing a portfolio of government securities to match the cash flow stream of the\noriginal interest and principal payments. This process effectively retires the loan, and the CMBS investor is made whole.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAGGCAIAAAD9/8NsAAB5G0lEQVR42u29T24bSba3fWRb5SoVqp0uX/QFDBiigJqbWoHIuwGRKxC5AokrkDiuAaUViBrUWNS7gCa1AlFv4+3bwB0oPa3uuqYbaKGqXLa+we/zQTiSmUz9tf48z0CQqGRkZGTEiRPnnDgxd3Z2ZgAAAAAAAHeNRzQBAAAAAACwmAEAAAAAAGAxAwAAAAAAwGIGAAAAAABYzAAAAAAAALCYAQAAAAAAuBBPLvNl0jrDXWFubo5GYGgDIJSQSABwzyQknhkAAAAAALAH4ZkJDSQYSwCbqN1HwydDGwChdHuEEhIJAPFYdEF5GeFX6pePHz/ql7OzMwQN3OY fDofhV3Tl3t7eysqKStjY2NC/+v2+/mVmvV6vWq3q83a7bWabm5uVSqVMdTudjqqhEsLK1+t1M/vLX/7CSwWAgi2Phk/GivwzhjcGAIBZ8u7MklPOmdGapNPpbG5umtnq6qo+19omTdNWq2Vmo9Eo+uJkMtHX9ZWDgwNfzGgZowsODg60FJlMJlrk7O7ulqyuF55t6MPDQxQUACgppoH2AQCAezALEGYGAAAAAAB3kimemW63a2a7u7uKAZMXZTQa9Xo9M+t0OvLMFKBQNMV9CblxFJbW7Xbl8xmPxx60ppuORiN9ogu8kGq1miRJ9kaDwUD+Ii8H4yIAgOGlAQCAB7uYUTBYmqZaxmgNow/NrNFoZAPM8pY0unIymTQaDV9yNJtNlXZ4eKhbdLtdxbYNh8Nms+lrm83NTZWwubmp7/qtPRbu6OjIPu3JAQAAAACAhwNhZgAAAAAAYPfEMyOSJHFvjJmlaWqf/DZTI76yVKtV+U/evHmj/Gb2ucdmPB4rNdnOzo7Hla2vr1vgmQnj1kIODg7MrNVqqTIbGxudTofXCQAAAADwoBczypLsixbtWplMJso55ptnkiTRCsezKutPX+q8fv1aS47xeLy/v+/lr66u6nMvKgxjC1dQBTx79kzLpHN9CwAAAAAAjDAzAAAAAAAAu1WeGXlLms1mmFgsTVMlN/MzYTY2NuS0abVacoxoF747YWq1mqLF7FNKtOjzJEnk1VlfX/dPogCzPJRRoF6vK4BNrh4AAAAAAHjQixnFiQ2Hw8FgYJ8Oo1xcXFRiZY8i29zc1ELi8PBQHyqxmEedVSoVJXFeXFy0z8PYos8bjYZKODw81FLKN8lsbW2F311bW1P5+jkcDnUcp38OAAAAAABGmBkAAAAAAMCtZe7s7IxWAAAAAAAAwzMDAAAAAADAYgYAAAAAAIDFDAAAAAAAsJgBAAAAAABgMQMAAAAAAMBiBgAAAAAAWMwAAAAAAACwmAEAAAAAALhK/j9HTSy1rANX7AAAAABJRU5ErkJggg=="]}, {"n": 5, "q": "For a commercial mortgage loan, a high debt service coverage ratio coupled with a low loan-to-value ratio is most likely indicative of:", "opts": ["low credit risk.", "high balloon risk.", "low prepayment risk."], "ans": "A", "expl": "Ratios for assessing credit risk\nLoan-to-value (LTV) = Loan amount / Property value\nDebt service coverage (DSC) = Net operating income / Annual principal and interest\nCommercial mortgage–backed securities (CMBS) consist of bundled commercial mortgage loans. Each loan is secured by income-generating\ncommercial property that the lender may sell if the borrower defaults. Lenders should appropriately gauge each borrower's level of credit risk with\nmetrics such as the loan-to-value (LTV) ratio and the debt service coverage (DSC) ratio.\nThe LTV is the ratio of the loan amount to the property value. Low LTVs suggest that the borrower has a lower chance of defaulting due to high\nequity (ie, property value − loan amount). Furthermore, higher property value (denominator) relative to the loan amount (numerator) suggests that\neven if the borrower defaults, the lender can adequately recoup the loan with the proceeds from selling the property.\nThe DSC ratio is the ratio of net operating income (NOI) to annual principal and interest owed, where NOI equals annual rental income less cash\noperating expense and depreciation reserve. High DSC ratios indicate that the borrower can better service its annual debt obligations, lowering\ncredit risk. Therefore, a low LTV in conjunction with a high DSC confirms low credit risk.\n(Choice B) Balloon risk is primarily driven by the features of the mortgage, not the financial performance of the borrower; therefore, it is not\nindicative of credit risk. Balloon risk stems from underlying mortgages that require a disproportionally large principal repayment at maturity.\n(Choice C) Prepayment risk is primarily driven by the level of interest rates, not the financial performance of the borrower; therefore, it is not\nindicative of credit risk.\nThings to remember:\nThe loan-to-value (LTV) ratio is the ratio of the loan amount to the property value. The debt service coverage (DSC) ratio is the ratio of net\noperating income (NOI) to annual principal and interest owed, where NOI equals annual rental income less cash operating expense and\ndepreciation reserve. A low LTV in conjunction with a high DSC suggests low credit risk.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null, "explfigs": null}, {"n": 6, "q": "For commercial mortgage–backed securities, which of the following mechanisms is least likely to provide call protection at the loan level?", "opts": ["Prepayment lockout", "Sequential-pay tranches", "Yield maintenance charge"], "ans": "B", "expl": "CMBS call protection mechanisms at the loan level\nPrepayment\nDisallows prepayments within a specified timeframe\nlockout\nPrepayment Predetermined percentage fee charged on outstanding\npenalty points balance if borrower wishes to refinance\nYield maintenance Fee to compensate lenders based on the difference between\ncharge new, lower borrowing rates and existing borrowing rates\nBorrower provides funds to the servicer to construct a portfolio\nDefeasance of government securities that replicates monthly mortgage\npayments\nCMBS = commercial mortgage–backed security.\nA commercial mortgage–backed security (CMBS) is created from pooled mortgages on commercial properties (eg, office buildings, warehouses).\nCMBS investors receive cash flows from the underlying commercial mortgage payments. Excess principal prepayments can arise as borrowers\nrefinance existing loans when interest rates fall, which forces investors to reinvest the proceeds at a lower rate. A CMBS can limit prepayment risk\nfor investors by providing call protection at the individual loan level and at the structural level.\nAt the individual loan level, mechanisms such as prepayment lockout and yield maintenance charges discourage borrowers from making excess\nprepayments (Choices A and C). Yield maintenance charges compensate lenders and are based on the difference between new, lower\nborrowing rates and existing borrowing rates.\nAt the structural level, certain mechanisms can redistribute aggregate prepayment risk from one class of investor to another. For example,\nsequential-pay tranches shift prepayment risk away from investors in one tranche by first distributing excess principal prepayments to other\ntranches.\nThings to remember:\nCommercial mortgage–backed securities (CMBS) provide investors with call protection at the structural level and at the individual loan level. The\nfour call protection mechanisms at the individual loan level are prepayment lockout, prepayment penalty points, yield maintenance charges, and\ndefeasance.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null, "explfigs": null}, {"n": 7, "q": "A homeowner borrowed $850,000 in a 30-year fully amortizing recourse mortgage loan to purchase a house that secures the loan. The borrower defaults on the loan at the end of Year 3, when the loan has been amortized by $25,000. Interest rates have increased so that the present value of the loan is $800,000. If the lender forecloses on the loan and receives $750,000 from the sale of the house, the amount that the lender can recover from the borrower is closest to:", "opts": ["$50,000", "$75,000", "$100,000"], "ans": "B", "expl": "A mortgage is a loan for which specific real property is used as security. If the borrower defaults, the lender can foreclose on the collateral, which\nmeans that the lender can seize the property and sell it to repay the loan. A recourse loan means that the lender can seize other assets from\nthe borrower if the proceeds are insufficient to fully repay the loan. In a nonrecourse loan, the collateral is the lender's only source of repayment.\nIn this question, the outstanding loan amount is $825,000 ($850,000 − 25,000) when the borrower defaults. The sale of the collateral results in\nproceeds of $750,000, so $75,000 remains unpaid on the loan balance. The question stipulates that this is a recourse loan, so the lender can\nassert a claim for $75,000 against the borrower's additional assets.\n(Choice A) $50,000 is the difference between the proceeds from the sale of the collateral and the present value of the loan. Shortfalls from\nforeclosures are based on the amortized loan balance, not the present value of the loan.\n(Choice C) $100,000 results from incorrectly calculating the outstanding balance as $850,000; this fails to account for the $25,000 amortization.\nThings to remember:\nA mortgage is a loan secured by specific real property. If the borrower defaults, the lender can sell the collateral and use the proceeds to satisfy\nthe loan. A recourse loan allows the lender to assert a claim for any shortfall against the borrower's other assets. A nonrecourse loan allows the\nlender to sell only the collateral to satisfy the loan.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCAAAAIBCAIAAAAXrlmbAAC0BUlEQVR42u29T2xbR5bvf+xOu7un20/X7wXzyyATicpygthXy9fTgshlPB6I3HXgACRX47EXFDfjjjcUN057NiQXNjKbkARiuHekMEZ6qSu4O2+pKwXptxtdGfN+P3QGL758bmBmetzt3+I7Oq9c9w8vKUqW5e9nESjXl/Xn1Km6VafOqTrz/PlzIYQQQgghhJBZcJYiIIQQQgghhHCBQQghhBBCCOECgxBCCCGEEMIFBiGEEEIIIYRwgUEIIYQQQgjhAoMQQgghhBDCBQYhhBBCCCGECwxCCCGEEEII4QKDEEIIIYQQwgUGIYQQQgghhAsMQgghhBBCCOECgxBCCCGEEMIFBiGEEEIIIYQLDEIIIYQQQggXGIQQQgghhBDCBQYhhBBCCCGECwxCCCGEEEIIFxiEEEIIIYQQwgUGIYQQQgghhAsMQgghhBBCCBcYhBBCCCGEEC4wCCGEEEIIIYQLDEIIIYQQQggXGIQQQgghhBAuMAghhBBCCCGECwxCCCGEEEIIFxiEEEIIIYQQLjAIIYQQQgghXGAQQgghhBBCCBcYhBBCCCGEEC4wCCGEEEIIIVxgEEIIIYQQQsgLvEEREELG0uv1+v1+9Hmr1XJdd7o3j44wDIMgEJFjy/GVpl6vi4jv+/jfzc3N16TinueJSD6fP9JcCoUC/oA2tlqtIyp5vV5/DRuREMIFBiHkVSUIAsxpohMdaxK/sbER+2YYhsezEMJMq1arcYGREcxKY1vttK4rsKZyHOcYFhgzFCyWzfV6fTgcisjz58+tdnx9GpEQInSRIoQQQgghhAh3MAghJJ2tra21tTU5GnutTG4nrlarbBQi2XyWjnrvAjQaDfyRy+UOmRTUO6mLlcvllZUVti8hRLiDQQghhBBCCBHuYBBCXlsQ2ADHfQ0qlQMHcY21MF+T5Ghs8x38BJ7xks0lHZlOaorWH7qumzG7MAy1nPjJ2AAPM5fp6uU4ziHDSA6TlFrKx4rXsqlnb46UFpwiTTRQGIbYKzj8joGWYdIW9DxPy7C+vp4lsgL/1WJPUfhKpZIxiiMIgow67Pu+GT2Vvb8QQl53nhNCyDjUzUNE1tbWTLeovb29vb2958+fd7vdbreb9Nrm5qam9uTJkydPniTNhyqVCl6wymBOMa28JNVBpdFoaKbFYrFYLEZfMBO38rUqojiO4zjOYDCw3o/NBRnl8/mUjLa3t60XMNHM5XLRXNLZ3t52XdeaPiYlZWU6GAxQNaum29vb1g+73a71ZlTsGVuwUqlomkg2Y5rPnz8fDAYos/U+6qXFTjlYCW+a2h5br6hmWmmura1ZYt/b20vKZXt7Gy0eW6RcLocX9P2x3/F01YJKRHOB9KIihbYkySraPQkhxIQuUoQQQgghhBChixQh5OWAQNJ2uy2GG0mlUtna2hLDn2Rubk4SfI0QZWt5RumTXq+HP7a3tyX16gaZPEAW53vKgQuK4zjNZjPF+2V9fV1rCgux+krBdaRarVqbFdVqNZqLiDSbzaRckFShUFB3FOTl+z58WkqlEozlYz2F8H5KUtVqFQJPcsIplUqmqVudZEqlktrjrZB69SBSnyJItVgsJjnhWC24sLCQPU1TZ4bDYalUkhdd1/ATTTBFkaLNrRlBREhTNRMyTNoM6fV61nHMKZ5OKLZ6RuXzedNjMAgCdJO9vb1DeiVpUqZKaC4QuKqE6p  entire loan balance.", "The lender receives only the proceeds from the sale of the property."], "ans": "C", "expl": "Residential mortgage default remedies\nBorrower is responsible for the entire mortgage balance\nRecourse loan Lender has a claim on borrower's other assets to satisfy any shortfall\nCommon in European countries\nLender receives only the proceeds from the sale of the property\nNonrecourse loan Borrowers often turn to strategic default on underwater mortgages\nCommon in the United States\nA residential mortgage is a loan with residential property used as collateral. If the borrower defaults, the lender can foreclose, which is a legal\nprocess by which the lender can take possession of the property and sell it to obtain payment for the loan. Recourse and nonrecourse refer to the\nlegal options available to a lender in the event that the borrower does not pay the scheduled interest and principal payments.\nIn a nonrecourse loan, the lender can claim only the proceeds from the sale of the property. In a recourse loan, the lender can seize other\nassets from the borrower if the proceeds from selling the property are insufficient to fully repay the loan (Choice B).\n(Choice A) Foreclosure is a remedy for the lender in the event of a default under either loan type.\nThings to remember:\nRecourse and nonrecourse refer to the legal options available to a lender in the event that the borrower does not pay the scheduled interest and\nprincipal payments. In a recourse loan, the lender can seize other assets from the borrower if the proceeds from selling the property are\ninsufficient to fully repay the loan. In a nonrecourse loan, the lender's only remedy is the proceeds from the sale of the property.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null, "explfigs": null}, {"n": 9, "q": "An issuer creates a sequential-pay collateralized mortgage obligation that consists of Tranches A, B, C, and D. The face value of each tranche is paid in order of seniority, with Tranche A the most senior and Tranche D the least senior. The collateral consists of 30-year residential mortgages. An investor in Tranche D most likely assumes a greater exposure to:", "opts": ["balloon risk.", "extension risk.", "contraction risk."], "ans": "B", "expl": "A collateralized mortgage obligation (CMO) is a type of mortgage-backed security (MBS). A CMO has multiple issues, or tranches, of bonds\nthat are backed by the mortgages. The cash from mortgage payments pays bonds' interest and principal. Each tranche has different rules\nregarding both the timing and amount of principal that it receives from the collateral's cash flows.\nIn a sequential-pay residential CMO, all tranches receive interest payments but only the most senior tranche (Tranche A in this example)\nreceives principal (including any prepayments) until its face value has been paid. The next senior tranche (Tranche B) then receives principal,\nand so on, until all tranches have been paid. Junior tranches (eg, Tranche D) must wait until the tranches senior to them (eg, Tranches A, B, and\nC) are completely paid. This increases the extension risk (ie, the risk that the maturity will be longer than expected) to junior tranches.\n(Choice A) Balloon risk is a type of default risk that applies to CMOs that are backed by commercial mortgages. Many commercial mortgages\nrequire a large principal payment at maturity (ie, the \"balloon\"). CMO investors are exposed to the risk that the borrower will be unable to make\nthe balloon payment.\n(Choice C) Contraction risk is the possibility that the bond will mature more quickly than anticipated due to higher-than-expected prepayments.\nThis risk is more associated with senior tranches of a sequential pay CMO.\nThings to remember:\nA sequential-pay CMO issues multiple tranches of bonds. Principal payments from the collateral are allocated only to the most senior tranche until\nits face value has been paid. Investors in the junior tranches assume the most extension risk, while the senior tranches assume the most\ncontraction risk.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAKwCAIAAAAeND1BAACvj0lEQVR42u39TWxjWbbfiS5FREZEuqJSJ25lZT4/o0sMwDaQmb4I6vXzxG1D5OCNfAFR09cDkcPricSZe9CgiJ4YyAHFie+Q5MBvKmrg4YMouJGTqn6icP36ThrQ0UVdFDJRhWCk8zozIyNTPfg7Vu/ch+eQ+v76/QYBBnV4zj57r7X3XnutvfbCycmJAQAAAAAA3DYeUAUAAAAAAIAxAwAAAAAAgDEDAAAAAACAMQMAAAAAABgzAAAAAAAAGDMAAAAAAAAYMwAAAAAAgDEDAAAAAACAMQMAAAAAAIAxAwAAAAAAgDEDAAAAAAAYMwAAAAAAABgzAAAAAAAAGDMAAAAAAIAxAwAAAAAAgDEDAAAAAACAMQMAAAAAABgzAAAAAAAAGDMAAAAAAAAYMwAAAAAAABgzAAAAAACAMQMAAAAAAIAxAwAAAAAAgDEDAAAAAAAYMwAAAAAAABgzAAAAAAAAGDMAAAAAAIAxAwAAAAAAgDEDAAAAAACAMQMAAAAAAIAxAwAAAAAAGDMAAAAAAAAYMwAAAAAAAPPxiCq4M4xGIzPb3d0dj8f6JkkSM1tZWTGzer2u/8JMJpOJ15VqdX9/X/9dX18vlUpnu22/3zez4+Nj/bfValHV56Tf70+tz9FoFDaZmZ251SLBcLW6UZUwVa4uUHQvkHa7rQ9LS0vql+58HwKXIRVpmprZYDDQfzXMVSqVGyhmoTAUF/umyXC32zWzly9f1mq1qReo89nf31ff6O+S1+uGPXZIdjSc/0qvWNWq+r2wMKurq+Vy+QwvCLeJE7gTzOyskyQ5ODg4ODigrqayt7e3t7dXKpVKpdLe3p5/v7W1tbW15dUY/um0VCqVcNCizs9PXn1GTXaeVgtl4/y3uqRKmFoPFyi6F0g4z6hUKndMII+OjvReW1tbqOelSoWU0X8oab9RYjZVGIqLfTMnFb1eL/rTzs7Ozs7OTHN9c3OzoMcOOTo6iq7MW3nJljPq6KZSq9VqtdqrV69evXoVPUUPOjo6ypYBbhGEmQEAAAAAgBFmBnZdQSb6Vx4YLagkSaJ4s+FwaGaTyaRarWoFgviHiO3t7WazOfVPilLw9SSqDtm4LSC6V4k62+XlZQviW+C68PqfGl90jcIgNfRvpKQ3DcXC+aQiCsEaDodra2vhN/V6Xf6NNE39V+o89b4zY6pHo5E7gvR0/WtzRCdGbhkvzGQy0eQnTVOfBZlZ6BnTq21vb+tWvV4P3cGYgethd3fXfu6ujWYtjUZDHZM0eTgc3tU49TPz+vXrvD+prqgxZOPWgeja1W4woBJuDuGE9UYJg4yr6y3e/FuYVNqpMwp9rxcJLcaNjQ0z08rpZDLZ3t7Wl1MXU0qlkoyWw8PDyBQMr5lq26RpGpoxUwsjI6rRaMiY0Xaafr/vvaL2LG1vb8sG0/U3YW8hGNnMAAAAAADA8MyA3bYVwTRNI8d6tNiQXXUYjUbK6aHVC3u3trGxsTF1WXcymWjlxr09tVpN/ln3PusOnU7H3sXCef4WfemF1DKMR/Ksr69HD9WSSbfb9QUbuYY3Njai a 4% annual interest rate for the first 10 years. After that, the interest rate becomes variable until maturity. This type of mortgage is most likely a:", "opts": ["hybrid mortgage.", "variable mortgage.", "convertible mortgage."], "ans": "A", "expl": "A mortgage is a loan that is collateralized by specific real property, such as a house. Payment of interest and principal on mortgages can be\nstructured in different ways. A hybrid mortgage begins as a fixed-rate mortgage for a specified period (eg, 10 years). At the end of the period,\nthe mortgage automatically changes to a variable rate mortgage for the remainder of its life.\n(Choice B) A variable mortgage has a variable interest rate from inception until it matures.\n(Choice C) A convertible mortgage is similar to a hybrid mortgage, except that the borrower decides whether the mortgage becomes a variable\nrate at the end of the initial fixed-rate period.\nThings to remember:\nA hybrid mortgage begins as a fixed-rate mortgage for a specified period. At the end of the period, it automatically changes to a variable mortgage\nfor the remainder of its life. A convertible mortgage is similar to a hybrid mortgage, except that the borrower decides whether the mortgage\nchanges to a variable rate at the end of the initial fixed-rate period.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCAAAAIBCAIAAAAXrlmbAAC0BUlEQVR42u29TWwbV5rv/ciddndPt6/K9wbzZpCJRWU5QezS8va0IHIZjwcidx04AMnVeOwFxc244w3FjdOeDcmFjcwmJIEY7h0pjJFeqgR35y5VcpC+u1HJmPu+6AxuXLweYGa63a138R899/jUB4sUJcvy/7cIlHLxfDzno855Ps6Z29/fF0IIIYQQQgiZBWcoAkIIIYQQQgg3GIQQQgghhBBuMAghhBBCCCHcYBBCCCGEEEIINxiEEEIIIYQQbjAIIYQQQggh3GAQQgghhBBCuMEghBBCCCGEEG4wCCGEEEIIIdxgEEIIIYQQQrjBIIQQQgghhBBuMAghhBBCCCHcYBBCCCGEEEK4wSCEEEIIIYRwg0EIIYQQQggh3GAQQgghhBBCuMEghBBCCCGEcINBCCGEEEIIIdxgEEIIIYQQQrjBIIQQQgghhHCDQQghhBBCCOEGgxBCCCGEEEK4wSCEEEIIIYRwg0EIIYQQQgjhBoMQQgghhBBCuMEgh s from prepayment risk and therefore is not a credit\nenhancement.\n(Choice C) The loan-to-value (LTV) ratio is a loan-level credit risk evaluation tool. Limits to the LTV ratio may reduce the credit risk of the\nunderlying loans that form the collateral for the CMBS, but they do not impact the credit losses allocated to CMBS tranches as a credit\nenhancement would.\nThings to remember:\nCMBS uses subordination as a form of credit enhancement to allocate credit losses to the lowest rated tranche with remaining principal value.\nThe more junior (ie, more subordinated) the tranche, the greater the exposure to credit risk. The more senior the tranche, the greater the\nprotection from credit losses and the lower the tranche's credit risk.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcAAAAKcCAIAAADw4/01AAA/7klEQVR42u3db2xj933n+69IkfprD2ccw8LsDIbasWEkwEacNt0J1sCKTIEE3U0t0XlSJF2LChBkUaCW5Fu091Ep5lmDbCi5QLCBgZLKxtk8iUXZ3QY20Ii6gBebWzeivHCnA9srTuNrjGF7dBRP7JFGou6Dj/XD8aGo///n/cJAoM4cnnN4KH75/f7+nNO0trZmAICdC3EKAIAACgAEUAAggAIAARQAQAAFAAIoABBAAYAACgAEUAAAARQACKAAQAAFAAIoABBAAQAEUAAggAIAARQACKAAAAIoABBAAYAACgAEUAAggAIACKAAQAAFAAIoABBAAYAACgDYmWZOwYlTqVTMzPM8M4vFYolEgnMi1WrV/TSzeDzufgIEUCsWi4ODg+7XfD4/PDzsX2FwcLBYLPqX5PN5M/Ovlk6nzaxUKunX+fn5XX/MyuWyi2X9/f0H+tq1l1QqpQDqaL+Tk5M7PexUKqVfs9msmY2OjurXpqYmPUgmk9PT0zs6SJ1VnWFZWFhQoG/0FLe7zSWTyaGhoQ3Ps3Y6MjLiQqdfPB7X38BBv0F6j8bGxvwn89h+0+ikBT4+oIQHADLQBmmI/9e5ubkNc6vN13EZ3K5LPCWDIyMjynaVwR10gjMyMrLhwff29h6fN2hiYqK+aNiXTKdcLuvNVa7tznapVPInvBtmW1qhUChkMpkDeuGBLPjYZqA6sPHxcbX8kIHeWwE0Ho+rGFQI84dLLakv4gIFb7VadevsuvVQ2wy0FRxOA58zOzu7eWl8+DzPcw0jgZC6nQ+q3g6V2/Vfirlczv9F4gKoWx6LxfRcFyUD7QkjIyMHF0DHx8c3/PM7btzpAiU8AJCB7ryKV3JRrVZdZ3SgeFeFW61WXZ+1kjV/QhoofpU+lEolbdPlRNqjy/XcNp0bN24oUapvE9BxuvWVN9Vnvv68WCvoKeVy2bVauKMKZNaBFUqlkn9T8XhcKxxCZ7Q/JddrrFQqOk793Dzl1xkOtNK4JVNTU9pIIMtz5yGRSAQSTJ3tTCajA/M8T38k9btolO/r7fP/PQT+GAIdifVNSclk0j9qwu29W nate it.\nThings to remember:\nMortgage pass-through securities offer one class of shares to all investors. In contrast, collateralized mortgage obligations offer multiple tranches\n(ie, classes) and distribute risk according to investor preferences.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAKwCAIAAAAeND1BAACvj0lEQVR42u39TWxjWbbfCy5FREZGuqJSJ25lZbbbeCUGYBuoTF8E1a898bMhctAjX0DUtD0QObyeSJz5DR4o4k0M5IDixHdIauCeihp42BAFP+Sk6rUoXPe7kwfE0UVdFLJQhTiRzuvMjIxM9eDvWL1zH55D6vvr9xsEGNThOfvsvdbee+219toLJycnBgAAAAAAcNt4QBUAAAAAAADGDAAAAAAAAMYMAAAAAAAAxgwAAAAAAGDMAAAAAAAAYMwAAAAAAABgzAAAAAAAAMYMAAAAAAAAxgwAAAAAAADGDAAAAAAAAMYMAAAAAABgzAAAAAAAAGDMAAAAAAAAYMwAAAAAAADGDAAAAAAAAMYMAAAAAAAAxgwAAAAAAGDMAAAAAAAAYMwAAAAAAABgzAAAAAAAAGDMAAAAAAAAxgwAAAAAAADGDAAAAAAAAMYMAAAAAABgzAAAAAAAAGDMAAAAAAAAYMwAAAAAAADGDAAAAAAAAMYMAAAAAAAAxgwAAAAAAADGDAAAAAAAYMwAAAAAAABcA4+ogjvDeDw2s729vclkom+SJDGzlZUVM2s2m/ovzCTLMq8r1erBwYH+u76+XqlUznbb4XBoZsfHx/pvp9Ohqs/JcDicWp/j8ThsMjM7c6tFguFqdaMqYapcXaDoXiDdblcflpaW1C/d+T4ELkMq0jQ1s52dHf1Xw1ytVruBYhYKQ3mxb5oM9/t9M3vx4kWj0Zh6gTqfg4MD9Y3+LkW9bthjh+RHw/mv9IpVrarfCwuzurparVbP8IJwmziBO8HMzjpJksPDw8PDQ+pqKvv7+/v7+5VKpVKp7O/v+/dbW1tbW1tejeGfTkutVgsHLer8/BTVZ9Rk52m1UDbOf6tLqoSp9XCBonuBhPOMWq12xwTy5cuXeq+trS3U81KlQsroP5S03ygxmyoM5cW+mZOKwWAQ/Wl3d3d3d3emub65uVnSY4e8fPkyurJo5SVfzqijm0qj0Wg0Gq9evXr16lX0FD3o5cuX+TLALYIwMwAAAAAAMMLMwK4ryET/ygOjBZUkSRRvNhqNzCzLsnq9rhUI4h8itre32+321D8pSsHXk6g6ZOO2gOheJepsl5eXLYhvgevC639qfNE1CoPU0L+Rkt40FAvnk4ooBGs0Gq2trYXfNJtN+TfSNPVfqfPU+86MqR6Px+4I0tP1r80RnRi5ZbwwWZZp8pOmqc+CzCz0jOnVtre3davBYIDuGAkAAAAAAAAADM8MzMne3p79NPY0WoJttVpmNhwOtSwxGo3u6qbbM/P69euiP6muqDFk49aB6NrV7pamEm4O4er7jRIGeYqut3g2dz4GlXbqjELf60VC99fGxoaZKQwky7Lt7W19OdUzXKlU5IE5Ojqyn/q1wmtsmqMmTdPQJzO1MPIItVoteWaUG2A4HHqvqAQM29vbc mark (200 PSA), the underlying mortgage collateral must have had much higher mortgage rates than the current market\nenvironment, as many homeowners were incentivized to refinance their mortgages at lower rates.\n(Choice A) A 2% prepayment assumption would imply a 33 PSA (ie, 33% of 6%).\nThings to remember:\nThe standard Public Securities Association model (100 PSA) begins with the assumption that borrowers prepay their mortgages at a rate that\nincreases by 0.2% per month for the first 30 months, at which time the rate reaches 6% (ie, 0.2% × 30). Then, prepayments stabilize at a constant\n6% rate until the bond is retired. A mortgage-backed security with a value of 50 PSA assumes prepayments occur at half that rate, and a 200 PSA\nassumes twice the rate of prepayments.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAs8AAAG2CAIAAAAP1fx0AAA+jElEQVR42u3d4VXq2tPH8fFZ//c3VnCwgosVGCoQKgAqQCoAKgArECogVkCsgJwKyK3AnAru8+K3nLVvQhARFfH7eXGWchBCgGQys/fsi3///dcAAAA+zP+xCwAAANEGAAAg2gAAACDaAAAARBsAAIBoAwAAgGgDAAAQbQAAAKINAAAAog0AAEC0AQAAQLQBAACINgAAANEGAAAA0QYAACDaAAAARBsAAABEGwAAgGgDAAAQbQAAABBtAAAAog0AAACiDQAAQLQBAACINgAAAIg2AAAA0QYAACDaAAAAINoAAAAn538H/2We53me77hDFEXNZvNYG6rn8mdsNptRFO3zh2ma+vboD/VrlmVFUejnOI4/dC8XRaHNyLIs3Jg4jo+4i06EXuNb921RFL5zGo2G/3s6Sp/A4368T5neyvDd+bi3pu7bCuCdp2l9m/Y8b37IQ/17qNFo9OqDR1EURdHDw8O/7zYajcJnXK1We/6h/0kcx3Ec++3hWfDfD/Pw8PDw8LDjXdFWPT8//3su9Ip27Fu9ldPpNLxxtVr5n+gOp/a6er1er9fzjWw0Gv/+DKvVqvTuvP8xl8vlcrns9Xp7fluBj/b8/Pz8/Nzr9fSBP48XVTppvud1vf+hqKQAAAA70UrK/jnYfr+vi/t2u/2jdm6apv1+P7zFC0BeblDquNVqrdfrs8/p6ZXqh31yYydVTZjP56WXkyTJD/xUv1+r1dLH/qMrmMCekiTRsbooim63yw453WhDiVY/dijImM/nw+FQt0wmk1M7LofJ4Q+yWCzqdlHpsJtl2dmcuup2bGncg1UqSmEi/QQPRtUbHx8ff0K0oQ/tEd8dH5xh2wq7HJRhXzHazIeawZiTAgAAjEqKBePJ7+7udHGfZZkPaNelrSelddkUXvGPx2MLBuKF4/JK9CCeP7i9vdWT7rmR8/ncr7PDJw0vZ3Xxmue5XpGeYscmbb2at2AQb0lYTahG1vrz+/v7cEbA7e2tNqBu5GmWZb7bd//J n, such as a conventional residential mortgage, the lender can foreclose (ie, take possession of the\ncollateral and sell it to obtain payment for the loan). Strategic default occurs when a borrower has sufficient resources to pay the mortgage\nbut chooses to default.\nAn underwater mortgage happens when the value of the property is less than the remaining loan balance of the mortgage. Strategic defaults\noccur most often in underwater mortgages with nonrecourse loans, as the lender has claim only to the proceeds from the sale of the property. In\ncontrast, with a recourse loan, the lender can seize other assets from the borrower if the proceeds from selling the property are insufficient to fully\nrepay the loan, a practice that discourages strategic defaults.\nFor RMBS bondholders, strategic defaults pose two main risks, potential loss of principal and extension risk, since the anticipated maturity of the\nRMBS increases due to slower prepayments. This is in contrast to contraction risk, which occurs when prepayments accelerate and reduce the\nexpected maturity of the RMBS (Choice A).\n(Choice B) Interest rate risk refers to the change in the value of a bond that results from interest rate volatility.\nThings to remember:\nStrategic default is a type of residential mortgage default that occurs when a borrower has sufficient resources to pay the mortgage but chooses to\ndefault. An underwater mortgage happens when the value of the property is less than the remaining loan balance of the mortgage. Strategic\ndefaults occur most often in underwater mortgages with nonrecourse loans.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null, "explfigs": null}, {"n": 18, "q": "When interest rates are rising, investors in residential mortgage–backed securities are most likely to be exposed to higher-than-expected:", "opts": ["default risk.", "extension risk.", "contraction risk."], "ans": "B", "expl": "Asset-backed securities (ABS) are bonds that are created by bundling cash-generating loans, such as mortgages. Fixed-rate residential\nmortgages are often structured as amortizing loans, for which each scheduled payment includes both interest and principal. In theory, residential\nmortgage–backed securities' (RMBS) maturity coincides with the average maturity of the underlying mortgages; however, the maturity is impacted\nby prepayments made by the borrowers.\nPrepayments are often related to changes in interest rates. When rates fall, borrowers are more likely to prepay since they can refinance the\nloans at a lower rate. This type of prepayment risk is known as contraction risk since it reduces (ie, contracts) the maturity of the RMBS\n(Choice C). However, when interest rates rise, borrowers are less likely to prepay since their existing mortgage rate is now cheaper by\ncomparison. Fewer prepayments increases the anticipated maturity of the RMBS, which is known as extension risk.\n(Choice A) Default risk refers to the possibility that borrowers default on the underlying loans. Prepayments are not a default.\nThings to remember:\nPrepayment risk in connection with residential mortgage–backed securities (RMBS) is the possibility that borrowers will prepay the underlying\nloans' principal, which reduces (ie, contracts) the maturity of the RMBS. Borrowers reduce prepayments when interest rates rise, resulting in\nextension risk (ie, increasing the anticipated maturity of the RMBS). Declining interest rates can cause an increase in prepayments, resulting in\ncontraction risk.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzUAAAFxCAIAAADF2BHoAACaY0lEQVR42u39XXBb15XmDy9QVr6cEKAyMzXjiklQmYu3OrEIKlfzj0UA9EVXHFsElJv2lwgyF0ncHROkZ5I4/VokpEqcTI9EUOnYzlsVAVTspOciJCjHyfyrJiIoOz1XEUE5XekrEaD6osvjiAA9H53YIt6LJ1zZ3gfn4AAkJUp+fpVyoMNz9tlf55y1n7X32oF6vS6EEEIIIWTP0MEqIIQQQgihfUYIIYQQ n to change the\nloan from one type of interest rate to another, not how the loan is amortized.\nThings to remember:\nA convertible mortgage begins as either a fixed- or variable-rate mortgage for a predetermined period. It gives the borrower the option to change\nthe loan to a variable-rate loan (if initially a fixed-rate loan) or a fixed-rate loan (if initially a variable-rate loan).\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCAAAAIBCAIAAAAXrlmbAAC0BUlEQVR42u29T2xbR5bvf+xOu7un20/X7wXzyyATicpygthXy9fTgshlPB6I3HXgACRX47EXFDfjjjcUN057NiQXNjKbkARiuHekMEZ6qSu4O2+pKwXptxtdGfN+P3QGL758bmBmetzt3+I7Oq9c9w8vKUqW5e9nESjXl/Xn1Km6VafOqTrz/PlzIYQQQgghhJBZcJYiIIQQQgghhHCBQQghhBBCCOECgxBCCCGEEMIFBiGEEEIIIYRwgUEIIYQQQgjhAoMQQgghhBDCBQYhhBBCCCGECwxCCCGEEEII4QKDEEIIIYQQwgUGIYQQQgghhAsMQgghhBBCCOECgxBCCCGEEMIFBiGEEEIIIYQLDEIIIYQQQggXGIQQQgghhBDCBQYhhBBCCCGECwxCCCGEEEIIFxiEEEIIIYQQwgUGIYQQQgghhAsMQgghhBBCCBcYhBBCCCGEEC4wCCGEEEIIIYQLDEIIIYQQQggXGIQQQgghhBAuMAghhBBCCCGECwxCCCGEEEIIFxiEEEIIIYQQLjAIIYQQQgghXGAQQgghhBBCCBcYhBBCCCGEEC4wCCGEEEIIIVxgEEIIIYQQQsgLvEEREELG0uv1+v1+9Hmr1XJdd7o3j44wDIMgEJFjy/GVpl6vi4jv+/jfzc3N16TinueJSD6fP9JcCoUC/oA2tlqtIyp5vV5/DRuREMIFBiHkVSUIAsxpohMdaxK/sbER+2YYhsezEMJMq1arcYGREcxKY1vttK4rsKZyHOcYFhgzFCyWzfV6fTgcisjz58+tdnx9GpEQInSRIoQQQgghhAh3MAghJJ2tra21tTU5GnutTG4nrlarbBQi2XyWjnrvAjQaDfyRy+UOmRTUO6mLlcvllZUVti8hRLiDQQghhBBCCBHuYBBCXlsQ2ADHfQ0qlQMHcY21MF+T5Ghs8x38BJ7xks0lHZlOaorWH7qumzG7MAy1nPjJ2AAPM5fp6uU4ziHDSA6TlFrKx4rXsqlnb46UFpwiTTRQGIbYKzj8joGWYdIW9DxPy7C+vp4lsgL/1WJPUfhKpZIxiiMIgow67Pu+GT2Vvb8QQl53nhNCyDjUzUNE1tbWTLeovb29vb2958+fd7vdbreb9Nrm5qam9uTJkydPniTNhyqVCl6wymBOMa28JNVBpdFoaKbFYrFYLEZfMBO38rUqojiO4zjOYDCw3o/NBRnl8/mUjLa3t60XMNHM5XLRXNLZ3t52XdeaPiYlZWU6GAxQNaum29vb1g+73a71ZlTsGVuwUqlomkg2Y5rPnz8fDAYos/U+6qXFTjlYCW+a2h5br6hmWmmura1ZYt/b20vKZXt7Gy0eW6RcLocX9P2x3/F01YJKRHOB9KIihbYkySraPQkhxIQuUoQQQgghhBChixQh5OWAQNJ2uy2GG0mlUtna2hLDn2R const CFG = {"title": "Wiley · Mortgage-Backed Security (MBS) Instrument and Market Features", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 19 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}
    .qnote{flex-basis:auto;width:100%;align-self:auto}
    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
