<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 6 — Economic Growth · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<style id="subject-breakdown-css">

</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<script>
const DATA = [{"n": 1, "q": "Mark Tortal uses the Cobb-Douglas production function to analyze potential growth in emerging economies. His simple model takes the classic form Y = TKαL⁽¹⁻α⁾. Using Tortal's model, which of the following statements is most likely correct?", "opts": ["developing markets typically display a lower α than developed markets", "Alpha (α) represents the share of output allocated to capital and a smaller α indicates a lower benefit of capital deepening", "The production function exhibits decreasing returns to scale"], "ans": "B", "expl": "Alpha (α) represents the share of output allocated to capital and tends to be higher in developing economies. A lower α implies lower benefits of increasing capital per worker (capital deepening). The model overall displays constant returns to scale.", "explhtml": "<p>Alpha (α) represents the share of output allocated to capital and tends to be higher in developing economies. A lower α implies lower benefits of increasing capital per worker (capital deepening).<\/p><p>The model overall displays constant returns to scale.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.d<\/div><div class=\"qtext\"><p>Mark Tortal uses the Cobb-Douglas production function to analyze potential growth in emerging economies. His simple model takes the classic form Y = TK<sup>α<\/sup>L<sup>(1-<\/sup><sup>α<\/sup><sup>)<\/sup>.<\/p><p>Using Tortal&#x27;s model, which of the following statements is most likely correct?<\/p><\/div>", "subj": "economics"}, {"n": 2, "q": "Mary Gorton makes the following two statements regarding investment and economic growth. 'Investment in human capital increases hours worked and will likely boost Statement 1 economic growth.' 'Investment in public infrastructure projects can assist economic growth by Statement 2 giving additional benefits to private investment.' Which of Gorton's statements is most likely correct?", "opts": ["Statement 1 only", "Statement 2 only", "Both statements are correct"], "ans": "B", "expl": "Investment in human capital improves knowledge and skills, increasing productivity not hours worked. Public infrastructure projects (e.g. construction of transport networks) will increase the effectiveness of private investment (e.g. distribution centers).", "explhtml": "<p>Investment in human capital improves knowledge and skills, increasing productivity not hours worked. Public infrastructure projects (e.g. construction of transport networks) will increase the effectiveness of private investment (e.g. distribution centers).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.h<\/div><div class=\"qtext\"><p>Mary Gorton makes the following two statements regarding investment and economic growth.<\/p><p>&#x27;Investment in human capital increases hours worked and will likely boost<\/p><p>Statement 1<\/p><p>economic growth.&#x27;<\/p><p>&#x27;Investment in public infrastructure projects can assist economic growth by<\/p><p>Statement 2<\/p><p>giving additional benefits to private investment.&#x27;<\/p><p>Which of Gorton&#x27;s statements is most likely correct?<\/p><\/div>", "subj": "economics"}, {"n": 3, "q": "Which of the following statements regarding endogenous growth theory is least likely correct?", "opts": ["Endogenous growth theory suggests that private firm spending levels on R&D is often sub-optimal", "Endogenous growth theory suggests that economies may not reach a steady state growth but instead permanently increase growth", "Social returns benefit society as a whole and encourage private firms to invest more aggressively in R&D which in turn fuels growth"], "ans": "C", "expl": "Private firms often fail to consider external social benefits and hence will not invest in the optimal level of R&D for the economy as a whole.", "explhtml": "<p>Private firms often fail to consider external social benefits and hence will not invest in the optimal level of R&amp;D for the economy as a whole.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.k<\/div><div class=\"qtext\"><p>Which of the following statements regarding endogenous growth theory is least likely correct?<\/p><\/div>", "subj": "economics"}, {"n": 4, "q": "Countries can increase labor productivity by:", "opts": ["increase in average hours worked.", "increase in labor force participation rate.", "improvement in technology."], "ans": "C", "expl": "Labor productivity can be enhanced by capital deepening and/or improvement in technology. Increase in labor force participation and average hours worked will increase the size of labor force but not labor productivity.", "explhtml": "<p>Labor productivity can be enhanced by capital deepening and/or improvement in technology. Increase in labor force participation and average hours worked will increase the size of labor force but not labor productivity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.g<\/div><div class=\"qtext\"><p>Countries can increase labor productivity by:<\/p><\/div>", "subj": "economics"}, {"n": 5, "q": "Relative to the growth rate in potential GDP, the rate of appreciation in the aggregate stock market:", "opts": ["can be higher in the long run but is the same in the short-term.", "is the same in the short and long run.", "can be lower in the short-term but is equal in the long run."], "ans": "C", "expl": "In the short-term, appreciation in the aggregate stock market can be lower (or higher) than the growth rate in potential GDP. However, in the long-run, aggregate stock market appreciation should be equal to growth rate in potential GDP.", "explhtml": "<p>In the short-term, appreciation in the aggregate stock market can be lower (or higher) than the growth rate in potential GDP. However, in the long-run, aggregate stock market appreciation should be equal to growth rate in potential GDP.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.b<\/div><div class=\"qtext\"><p>Relative to the growth rate in potential GDP, the rate of appreciation in the aggregate stock market:<\/p><\/div>", "subj": "economics"}, {"n": 6, "q": "An increase in growth rate of potential GDP in developed countries is most likely to be driven by:", "opts": ["both capital deepening and technological progress.", "technological progress.", "capital deepening."], "ans": "B", "expl": "Improvement in potential GDP growth in developed countries is largely driven by technological progress. Developing countries have the potential to grow through both capital deepening and technological progress.", "explhtml": "<p>Improvement in potential GDP growth in developed countries is largely driven by technological progress. Developing countries have the potential to grow through both capital deepening and technological progress.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.h<\/div><div class=\"qtext\"><p>An increase in growth rate of potential GDP in developed countries is most likely to be driven by:<\/p><\/div>", "subj": "economics"}, {"n": 7, "q": "Hannah Burton is a fixed income analyst and has questioned her supervisor as to why she needs to spend so much time forecasting potential GDP and its growth rate. Her supervisor replies: \"Positive growth in potential GDP leads to an expectation of rising income, leading in turn to higher current savings. Positive growth in potential GDP therefore implies higher real asset returns and higher real interest rates. Hannah's supervisor is least accurate regarding:", "opts": ["higher real interest rates", "higher real asset returns", "higher current savings"], "ans": "C", "expl": "Positive growth in potential GDP leads to an expectation of rising incomes leading to higher current consumption, not higher savings. To encourage savings, investments must offer higher real asset returns and higher real interest rates.", "explhtml": "<p>Positive growth in potential GDP leads to an expectation of rising incomes leading to higher current consumption, not higher savings. To encourage savings, investments must offer higher real asset returns and higher real interest rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.c<\/div><div class=\"qtext\"><p>Hannah Burton is a fixed income analyst and has questioned her supervisor as to why she needs to spend so much time forecasting potential GDP and its growth rate. Her supervisor replies:<\/p><p>&quot;Positive growth in potential GDP leads to an expectation of rising income, leading in turn to higher current savings. Positive growth in potential GDP therefore implies higher real asset returns and higher real interest rates.<\/p><p>Hannah&#x27;s supervisor is least accurate regarding:<\/p><\/div>", "subj": "economics"}, {"n": 8, "q": "Which of the following would least likely occur due to an increase in growth rate of potential GDP?", "opts": ["Credit spreads on fixed income investments widen.", "Fiscal policy would be expansionary.", "Monetary policy would be expansionary."], "ans": "A", "expl": "An increase in growth rate of potential GDP (keeping actual growth rate unchanged) would most likely allow the government to pursue expansionary monetary/fiscal policies. An increase in growth rate of potential GDP reduces expected credit risk for all fixed income securities and hence narrows the credit spreads. Note: The question does not provide any information about actual growth rate, hence we have to assume it to be constant for a least likely type question.", "explhtml": "<p>An increase in growth rate of potential GDP (keeping actual growth rate unchanged) would most likely allow the government to pursue expansionary monetary/fiscal policies. An increase in growth rate of potential GDP reduces expected credit risk for all fixed income securities and hence narrows the credit spreads.<\/p><p>Note: The question does not provide any information about actual growth rate, hence we have to assume it to be constant for a least likely type question.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.c<\/div><div class=\"qtext\"><p>Which of the following would least likely occur due to an increase in growth rate of potential GDP?<\/p><\/div>", "subj": "economics"}, {"n": 9, "q": "Which of the following concepts is uniquely associated with the neoclassical theory of economic growth?", "opts": ["In steady state GDP growth rate is equal to growth rate in total factor productivity divided by labor's share of total factor cost.", "diminishing marginal product of capital.", "In steady state, the rental price of capital is equal to additional output resulting from use of an additional unit of capital."], "ans": "C", "expl": "Neoclassical theory contends diminishing marginal productivity of capital but constant marginal product of capital. In steady state, marginal product of capital (MPK) is equal to the rental price of capital. MPK is the additional output resulting from an additional unit of capital.", "explhtml": "<p>Neoclassical theory contends diminishing marginal productivity of capital but constant marginal product of capital. In steady state, marginal product of capital (MPK) is equal to the rental price of capital. MPK is the additional output resulting from an additional unit of capital.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>Which of the following concepts is uniquely associated with the neoclassical theory of economic growth?<\/p><\/div>", "subj": "economics"}, {"n": 10, "q": "Ruritania and Utopia are two emerging market economies for which Jon Gordon, CFA, calculated a potential GDP growth rate of 4.3% (for both). In calculating the identical growth rates, Gordon used the Cobb-Douglas production function and the following data:  Labor Growth Rate Capital Growth Rate Growth in TFP* Ruritania 2.2% 3.1% 1.8% Utopia 1.7% 3.1% 1.8% *Total Factor Productivity Which of the following statements is most accurate regarding Gordon's assumptions in calculating growth rates?", "opts": ["Gordon has assumed that the elasticity of output with respect to capital is higher in Ruritania than Utopia", "Gordon has assumed that the elasticity of output with respect to labor is lower in Utopia than Ruritania", "Gordon has assumed that the elasticity of output with respect to TFP is higher in Utopia than Ruritania"], "ans": "B", "expl": "Using the Cobb-Douglas production function, the growth rate in potential GDP can be calculated as: Growth rate in Potential GDP = growth rate in TFP + α(growth rate capital) + (1-α)(growth rate labor) Where α = elasticity of output with respect to capital And (1-α) = elasticity of output with respect to labor The only data given that is different for the two countries is the assumed labor growth rate. In order to calculate the same GDP growth rate, Gordon must assume a higher α and hence a lower (1-α). For Ruritania: 4.3% = 1.8% + 3.1%(α) + 2.2%(1-­α) Solving algebraically for α for Ruritania: α = 0.33 and (1­-α) = 0.67 For Utopia: 4.3% = 1.8% + 3.1%(α) + 1.7%(1­-α) Solving algebraically for α for Utopia: α = 0.57 and (1­-α) = 0.43 Thus Gordon has assumed that the elasticity of output with respect to labor (1-­α) is lower in Utopia (0.43) than Ruritania (0.67)", "explhtml": "<p>Using the Cobb-Douglas production function, the growth rate in potential GDP can be calculated as: Growth rate in Potential GDP = growth rate in TFP + α(growth rate capital) + (1-α)(growth rate labor) Where α = elasticity of output with respect to capital<\/p><p>And (1-α) = elasticity of output with respect to labor<\/p><p>The only data given that is different for the two countries is the assumed labor growth rate. In order to calculate the same GDP growth rate, Gordon must assume a higher α and hence a lower (1-α).<\/p><p>For Ruritania: 4.3% = 1.8% + 3.1%(α) + 2.2%(1-­α)<\/p><p>Solving algebraically for α for Ruritania: α = 0.33 and (1­-α) = 0.67<\/p><p>For Utopia: 4.3% = 1.8% + 3.1%(α) + 1.7%(1­-α)<\/p><p>Solving algebraically for α for Utopia: α = 0.57 and (1­-α) = 0.43<\/p><p>Thus Gordon has assumed that the elasticity of output with respect to labor (1-­α) is lower in Utopia (0.43) than Ruritania (0.67)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.e<\/div><div class=\"qtext\"><p>Ruritania and Utopia are two emerging market economies for which Jon Gordon, CFA, calculated a potential GDP growth rate of 4.3% (for both).<\/p><p>In calculating the identical growth rates, Gordon used the Cobb-Douglas production function and the following data:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Labor Growth Rate<\/td><td>Capital Growth Rate<\/td><td>Growth in TFP*<\/td><\/tr><tr><td>Ruritania<\/td><td>2.2%<\/td><td>3.1%<\/td><td>1.8%<\/td><\/tr><tr><td>Utopia<\/td><td>1.7%<\/td><td>3.1%<\/td><td>1.8%<\/td><\/tr><\/table><\/div><p>*Total Factor Productivity<\/p><p>Which of the following statements is most accurate regarding Gordon&#x27;s assumptions in calculating growth rates?<\/p><\/div>", "subj": "economics"}, {"n": 11, "q": "Bob Forster makes the following statements regarding economic growth theories and trade barriers Removing trade barriers and allowing the free flow of capital often leads to Statement 1 countries specializing in industries where they have comparative advantage Developing economies that have not reached the point of significant Statement 2  diminishing returns to capital can attract investment, leading to development of their economy and an eventual slowing of growth Which of Forster's comments are most likely correct?", "opts": ["Statement 1 only", "Statement 2 only", "Both statements are correct"], "ans": "C", "expl": "Both statements are correct. Countries are able to focus on comparative advantage when free trade is allowed. Developing economies will see a slowing of growth, and increased investment leads to a convergence to the steady state growth rate of developed economies.", "explhtml": "<p>Both statements are correct. Countries are able to focus on comparative advantage when free trade is allowed. Developing economies will see a slowing of growth, and increased investment leads to a convergence to the steady state growth rate of developed economies.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.l<\/div><div class=\"qtext\"><p>Bob Forster makes the following statements regarding economic growth theories and trade barriers<\/p><p>Removing trade barriers and allowing the free flow of capital often leads to<\/p><p>Statement 1<\/p><p>countries specializing in industries where they have comparative advantage<\/p><p>Developing economies that have not reached the point of significant Statement 2 &nbsp; diminishing returns to capital can attract investment, leading to development<\/p><p>of their economy and an eventual slowing of growth<\/p><p>Which of Forster&#x27;s comments are most likely correct?<\/p><\/div>", "subj": "economics"}, {"n": 12, "q": "Government incentives that encourage private investment in technology and knowledge are most strongly supported by the:", "opts": ["classical growth model.", "endogenous growth model.", "neoclassical growth model."], "ans": "B", "expl": "The endogenous growth model hypothesizes that expenditures on R&D and knowledge capital generate benefits to the economy as a whole, beyond the private benefit to the investing company. Under the endogenous growth model, the resulting increase in growth is likely to be enduring.", "explhtml": "<p>The endogenous growth model hypothesizes that expenditures on R&amp;D and knowledge capital generate benefits to the economy as a whole, beyond the private benefit to the investing company. Under the endogenous growth model, the resulting increase in growth is likely to be enduring.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.k<\/div><div class=\"qtext\"><p>Government incentives that encourage private investment in technology and knowledge are most strongly supported by the:<\/p><\/div>", "subj": "economics"}, {"n": 13, "q": "Which of the following statements regarding the long-run rate of stock market appreciation and the sustainable growth rate of the economy is most likely correct?", "opts": ["Long-term growth in the aggregate stock market valuation is most closely correlated to long term growth in P/E ratios", "Long-term growth in the aggregate stock market valuation is most closely correlated to long term growth in GDP", "Long-term growth in the aggregate stock market valuation is most closely correlated to long term growth in earnings relative to GDP"], "ans": "B", "expl": "In the long run both the E/GDP and P/E ratios will have zero growth. Stock market appreciation is therefore most closely related to growth in GDP.", "explhtml": "<p>In the long run both the E/GDP and P/E ratios will have zero growth. Stock market appreciation is therefore most closely related to growth in GDP.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.b<\/div><div class=\"qtext\"><p>Which of the following statements regarding the long-run rate of stock market appreciation and the sustainable growth rate of the economy is most likely correct?<\/p><\/div>", "subj": "economics"}, {"n": 14, "q": "Which of the following is least likely to affect the rate of appreciation of the aggregate stock market?", "opts": ["Reinvestment of dividends", "Growth rate in potential GDP", "Growth in Price earnings multiples"], "ans": "A", "expl": "The appreciation of aggregate stock market depends on GDP growth rate, growth of share of capital in GDP and growth in P/E multiples. In the long run, stock market appreciation depends only on GDP growth rate as the other two factors cannot increase (or decrease) in perpetuity.", "explhtml": "<p>The appreciation of aggregate stock market depends on GDP growth rate, growth of share of capital in GDP and growth in P/E multiples. In the long run, stock market appreciation depends only on GDP growth rate as the other two factors cannot increase (or decrease) in perpetuity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.b<\/div><div class=\"qtext\"><p>Which of the following is least likely to affect the rate of appreciation of the aggregate stock market?<\/p><\/div>", "subj": "economics"}, {"n": 15, "q": "A country with relatively poor endowment of natural resources is most likely to:", "opts": ["suffer from ‘Dutch disease’.", "devote a disproportionate amount of its economic energy to pursuing the limited natural resources that the country has.", "enjoy the technological progress of a country with a vigorous manufacturing sector."], "ans": "C", "expl": "Countries with poor endowments of natural resources may enjoy relatively high levels of GDP growth rate as long as they have access to natural resources. Dutch disease refers to situation where a country with large endowments of natural resources finds its currency appreciating driven by foreign demand for those resources. This increase in currency value may render other domestic industries uncompetitive globally, and the country may not participate in the TFP progress seen in countries with strong manufacturing sectors. Countries with abundant natural resources may devote disproportionate amount of its economic energy in pursuing those resource industries at the expense of other industries.", "explhtml": "<p>Countries with poor endowments of natural resources may enjoy relatively high levels of GDP growth rate as long as they have access to natural resources. Dutch disease refers to situation where a country with large endowments of natural resources finds its currency appreciating driven by foreign demand for those resources. This increase in currency value may render other domestic industries uncompetitive globally, and the country may not participate in the TFP progress seen in countries with strong manufacturing sectors. Countries with abundant natural resources may devote disproportionate amount of its economic energy in pursuing those resource industries at the expense of other industries.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.f<\/div><div class=\"qtext\"><p>A country with relatively poor endowment of natural resources is most likely to:<\/p><\/div>", "subj": "economics"}, {"n": 16, "q": "Which country is most likely to rely on improving technology rather than capital deepening for increase in potential GDP growth?", "opts": ["Surico.", "Wisterbon.", "Pratia."], "ans": "A", "expl": "Surico is a developed country and has the lowest share of output allocated to capital of 27.5%. Surico will gain less from capital deepening. The growth rate in potential GDP for Surico is 2.1% + (0.275) × (3.4%) + (0.725) × (0.6%) = 3.4%. About 61% of potential GDP growth is based on the total factor of production (TFP), the highest of the three.", "explhtml": "<p>Surico is a developed country and has the lowest share of output allocated to capital of 27.5%. Surico will gain less from capital deepening. The growth rate in potential GDP for Surico is 2.1% + (0.275) × (3.4%) + (0.725) × (0.6%) = 3.4%. About 61% of potential GDP growth is based on the total factor of production (TFP), the highest of the three.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<\/summary><div class=\"vig-body\"><p>Wisterbon, Pratia and Surico are neighboring nations. The three countries share borders and frequently trade with each other.<\/p><p>Pratia<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v001.webp\" style=\"max-width:min(100%,373px)\" alt=\"• A developing nation with an abundant oil reserves • Primary economic activity is oil industry\"><p>Wisterbon<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v002.webp\" style=\"max-width:min(100%,630px)\" alt=\"• A developing nation focusing on labor intensive industries because it lacks many natural resources\"><p>Surico<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v003.webp\" style=\"max-width:min(100%,413px)\" alt=\"• A developed nation • Largest trading partner for both the other two countries\"><p>The following economic and demographic statistics are available for the three countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v004.webp\" style=\"max-width:min(100%,667px)\" alt=\"Wisterbon Surico Pratia $3,000.00 $100.00 $100.0 GDP (in $ billions) 10 years ago $4,209.00 $164.00 $156.0 GDP (in $ billions) Current Long-term growth rate in technology 1.2% 1.5% 2.1% (est.) 4.40% 3.4% 4.9% Long-term growth rate of capital Sovereign credit rating A+ AAA A 12.5% 10.0% 5.0% Savings rate (average is 10.0%) Population (in millions) 50.4 10.2 10.0 2.8% 0.6% 2.5% Labor Growth Rate Cost of capital relative to total factor 27.5% 35.0% 30.0% cost 4.9% 3.4% 4.4% Capital Growth Rate 1.5% 1.2% 2.1% TFP Growth Rate The three countries have sent their top finance ministers and economists \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v005.webp\" style=\"max-width:min(100%,666px)\" alt=\"cannot grow any faster. We are concerned that we are not investing enough in infrastructure and Economist #3: education to increase the growth rate.\"><p>Some common initiatives for economic growth were listed from the TEGF:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v006.webp\" style=\"max-width:min(100%,313px)\" alt=\"1. Fund a technology research center 2. Lower trade barriers 3. Provide financial incentives for innovation 4. Coordinate energy policies 5. Invest in education\"><p>Each country decided to adopt four of the five initiatives. Pratia did not like lowering trade barriers. Surico did not like coordinating energy policies. Wisterbon did not like providing financial incentives for innovation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.d<\/div><div class=\"qtext\"><p>Which country is most likely to rely on improving technology rather than capital deepening for increase in potential GDP growth?<\/p><\/div>", "subj": "economics"}, {"n": 17, "q": "Which economist is mostly applying neoclassical theory when stating her concerns?", "opts": ["Economist #3.", "Economist #2.", "Economist #1."], "ans": "B", "expl": "The neoclassical growth theory is based on when the output to capital ratio is constant, both the labor to capital ratio and output per capita grow at the same equilibrium rate. Economist #1's concern is supported by the classical growth theory and Economist #3's concern is supported by the endogenous growth theory.", "explhtml": "<p>The neoclassical growth theory is based on when the output to capital ratio is constant, both the labor to capital ratio and output per capita grow at the same equilibrium rate. Economist #1&#x27;s concern is supported by the classical growth theory and Economist #3&#x27;s concern is supported by the endogenous growth theory.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wisterbon, Pratia and Surico are neighboring nations. The three countries share borders and frequently trade with each other.<\/p><p>Pratia<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v001.webp\" style=\"max-width:min(100%,373px)\" alt=\"• A developing nation with an abundant oil reserves • Primary economic activity is oil industry\"><p>Wisterbon<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v002.webp\" style=\"max-width:min(100%,630px)\" alt=\"• A developing nation focusing on labor intensive industries because it lacks many natural resources\"><p>Surico<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v003.webp\" style=\"max-width:min(100%,413px)\" alt=\"• A developed nation • Largest trading partner for both the other two countries\"><p>The following economic and demographic statistics are available for the three countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v004.webp\" style=\"max-width:min(100%,667px)\" alt=\"Wisterbon Surico Pratia $3,00  "A", "expl": "When private investments in R&D are sub-optimal, financial incentives may restore the level of investment to optimal levels. Under the endogenous growth theory, the growth rate in standard of living can be achieved via technological growth as well as capital deepening. Convergence of standard of living would only be an incentive for developing countries.", "explhtml": "<p>When private investments in R&amp;D are sub-optimal, financial incentives may restore the level of investment to optimal levels. Under the endogenous growth theory, the growth rate in standard of living can be achieved via technological growth as well as capital deepening. Convergence of standard of living would only be an incentive for developing countries.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wisterbon, Pratia and Surico are neighboring nations. The three countries share borders and frequently trade with each other.<\/p><p>Pratia<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v001.webp\" style=\"max-width:min(100%,373px)\" alt=\"• A developing nation with an abundant oil reserves • Primary economic activity is oil industry\"><p>Wisterbon<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v002.webp\" style=\"max-width:min(100%,630px)\" alt=\"• A developing nation focusing on labor intensive industries because it lacks many natural resources\"><p>Surico<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v003.webp\" style=\"max-width:min(100%,413px)\" alt=\"• A developed nation • Largest trading partner for both the other two countries\"><p>The following economic and demographic statistics are available for the three countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v004.webp\" style=\"max-width:min(100%,667px)\" alt=\"Wisterbon Surico Pratia $3,000.00 $100.00 $100.0 GDP (in $ billions) 10 years ago $4,209.00 $164.00 $156.0 GDP (in $ billions) Current Long-term growth rate in technology 1.2% 1.5% 2.1% (est.) 4.40% 3.4% 4.9% Long-term growth rate of capital Sovereign credit rating A+ AAA A 12.5% 10.0% 5.0% Savings rate (average is 10.0%) Population (in millions) 50.4 10.2 10.0 2.8% 0.6% 2.5% Labor Growth Rate Cost of capital relative to total factor 27.5% 35.0% 30.0% cost 4.9% 3.4% 4.4% Capital Growth Rate 1.5% 1.2% 2.1% TFP Growth Rate The three countries have sent their top finance ministers and economists \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v005.webp\" style=\"max-width:min(100%,666px)\" alt=\"cannot grow any faster. We are concerned that we are not investing enough in infrastructure and Economist #3: education to increase the growth rate.\"><p>Some common initiatives for economic growth were listed from the TEGF:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v006.webp\" style=\"max-width:min(100%,313px)\" alt=\"1. Fund a technology research center 2. Lower trade barriers 3. Provide financial incentives for innovation 4. Coordinate energy policies 5. Invest in education\"><p>Each country decided to adopt four of the five initiatives. Pratia did not like lowering trade barriers. Surico did not like coordinating energy policies. Wisterbon did not like providing financial incentives for innovation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.d<\/div><div class=\"qtext\"><p>The three countries&#x27; willingness to provide financial incentives for innovation is because:<\/p><\/div>", "subj": "economics"}, {"n": 19, "q": "For Surico, the education investment that may increase the growth rate of potential GDP is the one that would increase:", "opts": ["application of technology to increase TFP and productivity of labor.", "non-ICT capital to increase capital deepening.", "research and development to increase TFP."], "ans": "C", "expl": "Surico is a developed country. It is not likely to benefit much from capital deepening and application of technology. Innovations and research and development can increase the total factor productivity which is more likely to increase the impact of growth in potential GDP.", "explhtml": "<p>Surico is a developed country. It is not likely to benefit much from capital deepening and application of technology. Innovations and research and development can increase the total factor productivity which is more likely to increase the impact of growth in potential GDP.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 16–19<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Wisterbon, Pratia and Surico are neighboring nations. The three countries share borders and frequently trade with each other.<\/p><p>Pratia<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v001.webp\" style=\"max-width:min(100%,373px)\" alt=\"• A developing nation with an abundant oil reserves • Primary economic activity is oil industry\"><p>Wisterbon<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v002.webp\" style=\"max-width:min(100%,630px)\" alt=\"• A developing nation focusing on labor intensive industries because it lacks many natural resources\"><p>Surico<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v003.webp\" style=\"max-width:min(100%,413px)\" alt=\"• A developed nation • Largest trading partner for both the other two countries\"><p>The following economic and demographic statistics are available for the three countries.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v004.webp\" style=\"max-width:min(100%,667px)\" alt=\"Wisterbon Surico Pratia $3,000.00 $100.00 $100.0 GDP (in $ billions) 10 years ago $4,209.00 $164.00 $156.0 GDP (in $ billions) Current Long-term growth rate in technology 1.2% 1.5% 2.1% (est.) 4.40% 3.4% 4.9% Long-term growth rate of capital Sovereign credit rating A+ AAA A 12.5% 10.0% 5.0% Savings rate (average is 10.0%) Population (in millions) 50.4 10.2 10.0 2.8% 0.6% 2.5% Labor Growth Rate Cost of capital relative to total factor 27.5% 35.0% 30.0% cost 4.9% 3.4% 4.4% Capital Growth Rate 1.5% 1.2% 2.1% TFP Growth Rate The three countries have sent their top finance ministers and economists \"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v005.webp\" style=\"max-width:min(100%,666px)\" alt=\"cannot grow any faster. We are concerned that we are not investing enough in infrastructure and Economist #3: education to increase the growth rate.\"><p>Some common initiatives for economic growth were listed from the TEGF:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v006.webp\" style=\"max-width:min(100%,313px)\" alt=\"1. Fund a technology research center 2. Lower trade barriers 3. Provide financial incentives for innovation 4. Coordinate energy policies 5. Invest in education\"><p>Each country decided to adopt four of the five initiatives. Pratia did not like lowering trade barriers. Surico did not like coordinating energy policies. Wisterbon did not like providing financial incentives for innovation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.d<\/div><div class=\"qtext\"><p>For Surico, the education investment that may increase the growth rate of potential GDP is the one that would increase:<\/p><\/div>", "subj": "economics"}, {"n": 20, "q": "As compared to Cragistan's long-term growth rate of labor, West Lundia's higher long-term growth rate of labor is most likely caused by the difference in the two countries':", "opts": ["fertility rates.", "labor force participation rates.", "immigration policies."], "ans": "B", "expl": "West Lundia has a slightly lower fertility rate and a less friendly immigration policy both leading to a lower expected population growth rate of 1.4% while Cragistan's population is expected to grow at 1.7%. West Lundia's growth rate of labor is caused by a higher labor force participation rate and an increase in the number of hours per worker.", "explhtml": "<p>West Lundia has a slightly lower fertility rate and a less friendly immigration policy both leading to a lower expected population growth rate of 1.4% while Cragistan&#x27;s population is expected to grow at 1.7%. West Lundia&#x27;s growth rate of labor is caused by a higher labor force participation rate and an increase in the number of hours per worker.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 20–23<\/summary><div class=\"vig-body\"><p>West Lundia and Cragistan are neighboring emerging market nations. These two countries share a border and frequently trade with each other. Cragistan has abundant oil reserves and precious metals, both of which West Lundia lacks. Kurtenstein is a developed market nation that borders both West Lundia and Cragistan and is the largest trading partner for both the other two countries. Kurtenstein is a major buyer of Cragistan's unrefined petroleum and West Lundia's cheaper labor. All three countries are politically stable and have formed a regional monetary union, known as WICKA (West Lundia, Cragistan, Kurtenstein Alliance - pronounced 'wicka\"). Their currency, the WiCKA Rand or WCK, is a free floating currency.<\/p><p>Exhibit 1 shows selected economic and demographic statistics are for the three countries and for the year 20X1.<\/p><p>Exhibit 1: Selected economic and demographic statistic for 20X1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Cragistan Kurtenstein West Lundia 25.18 5.63 5.52 Population (in millions) 71.20% 64.50% 64.50% Labor force participation (in %)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v008.webp\" style=\"max-width:min(100%,667px)\" alt=\"$1,500.0 $50.0 $50.0 GDP (in $ billions) 35.00% 20.00% 40.00% Share of capital in total GDP Average Hrs. per worker in labor 1898.0 1690.0 1690.0 force per yr AAA Sovereign credit rating A A+ 12.5% 10.0% 5.0% Savings rate (average is 10,0%) $7.50 $250.00 $15.00 Imports (in $ billions) $20.00 $8.00 $200.00 Exports (in $ billions) Analysts&#x27; projected 10 year estimates are provided in Exhibit 2. Cragistan&#x27;s projected population growth is based on a slightly higher fertility rate but also a less restrictive immigration policy. Cragistan West Lundia Kurtenstein 10 Year estimates 6.51 25.9\"><p>The forecasted growth rate in potential GDP for Cragistan and Kurtenstein are 4.4% and 3.0% respectively. The estimated long-term actual GDP growth rate for West Lundia is lower than its estimated potential GDP growth rate.<\/p><p>Monetary Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v009.webp\" style=\"max-width:min(100%,448px)\" alt=\"• All three countries have relatively independent central banks. • All three target inflation as a primary goal.\"><p>Fiscal Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v010.webp\" style=\"max-width:min(100%,572px)\" alt=\"• West Lundia has a slight surplus and actively seeks to affect aggregate demand. • Cragistan has a moderate surplus and may seek to affect aggregate demand. • Kurtenstein has a slight deficit and does not actively affect aggregate demand.\"><p>International Trade:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v011.webp\" style=\"max-width:min(100%,234px)\" alt=\"• West Lundia is a net exporter. • Cragistan is a net exporter. • Kurtenstein is a net importer.\"><p>Financial Markets:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v012.webp\" style=\"max-width:min(100%,617px)\" alt=\"• Kurtenstein has well established high volume liquid equity and fixed income markets. • Cragistan and West Lundia both have moderately liquid equity markets. • Cragistan has a credit market with more volume and smaller credit spreads than West Lundia.\"><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.a<\/div><div class=\"qtext\"><p>As compared to Cragistan&#x27;s long-term growth rate of labor, West Lundia&#x27;s higher long-term growth rate of labor is most likely caused by the difference in the two countries&#x27;:<\/p><\/div>", "subj": "economics"}, {"n": 21, "q": "Cragistan's potential GDP growth rate exceeds that of Kurtenstein's. Which difference in factors could help justify Cragistan's higher sustainable growth rate?", "opts": ["The savings rate between the two countries.", "The established financial sector intermediation.", "The free trade and unrestricted capital flows."], "ans": "A", "expl": "One precondition for growth is adequate savings and investment. A country with a higher savings rate is likely to have a higher potential growth since a country with a higher savings rate is less likely to need foreign investments for growth. Because both Cragistan and Kurtenstein are both part of the monetary union with a floating currency, there is no difference in free trade and restrictions on capital flows. Cragistan has a less established financial sector, but the difference in itself may not be a potential benefit or a potential issue.", "explhtml": "<p>One precondition for growth is adequate savings and investment. A country with a higher savings rate is likely to have a higher potential growth since a country with a higher savings rate is less likely to need foreign investments for growth. Because both Cragistan and Kurtenstein are both part of the monetary union with a floating currency, there is no difference in free trade and restrictions on capital flows. Cragistan has a less established financial sector, but the difference in itself may not be a potential benefit or a potential issue.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 20–23<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>West Lundia and Cragistan are neighboring emerging market nations. These two countries share a border and frequently trade with each other. Cragistan has abundant oil reserves and precious metals, both of which West Lundia lacks. Kurtenstein is a developed market nation that borders both West Lundia and Cragistan and is the largest trading partner for both the other two countries. Kurtenstein is a major buyer of Cragistan's unrefined petroleum and West Lundia's cheaper labor. All three countries are politically stable and have formed a regional monetary union, known as WICKA (West Lundia, Cragistan, Kurtenstein Alliance - pronounced 'wicka\"). Their currency, the WiCKA Rand or WCK, is a free floating currency.<\/p><p>Exhibit 1 shows selected economic and demographic statistics are for the three countries and for the year 20X1.<\/p><p>Exhibit 1: Selected economic and demographic statistic for 20X1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Cragistan Kurtenstein West Lundia 25.18 5.63 5.52 Population (in millions) 71.20% 64.50% 64.50% Labor force participation (in %)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v008.webp\" style=\"max-width:min(100%,667px)\" alt=\"$1,500.0 $50.0 $50.0 GDP (in $ billions) 35.00% 20.00% 40.00% Share of capital in total GDP Average Hrs. per worker in labor 1898.0 1690.0 1690.0 force per yr AAA Sovereign credit rating A A+ 12.5% 10.0% 5.0% Savings rate (average is 10,0%) $7.50 $250.00 $15.00 Imports (in $ billions) $20.00 $8.00 $200.00 Exports (in $ billions) Analysts&#x27; projected 10 year estimates are provided in Exhibit 2. Cragistan&#x27;s projected population growth is based on a slightly higher fertility rate but also a less restrictive immigration policy. Cragistan West Lundia Kurtenstein 10 Year estimates 6.51 25.9\"><p>The forecasted growth rate in potential GDP for Cragistan and Kurtenstein are 4.4% and 3.0% respectively. The estimated long-term actual GDP growth rate for West Lundia is lower than its estimated potential GDP growth rate.<\/p><p>Monetary Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v009.webp\" style=\"max-width:min(100%,448px)\" alt=\"• All three countries have relatively independent central banks. • All three target inflation as a primary goal.\"><p>Fiscal Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v010.webp\" style=\"max-width:min(100%,572px)\" alt=\"• West Lundia has a slight surplus and actively seeks to affect aggregate demand. • Cragistan has a moderate surplus and may seek to affect aggregate demand. • Kurtenstein has a slight deficit and does not actively affect aggregate demand.\"><p>International Trade:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v011.webp\" style=\"max-width:min(100%,234px)\" alt=\"• West Lundia is a net exporter. • Cragistan is a net exporter. • Kurtenstein is a net importer.\"><p>Financial Markets:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v012.webp\" style=\"max-width:min(100%,617px)\" alt=\"• Kurtenstein has well established high volume liquid equity and fixed income markets. • Cragistan and West Lundia both have moderately liquid equity markets. • Cragistan has a credit market with more volume and smaller credit spreads than West Lundia.\"><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.a<\/div><div class=\"qtext\"><p>Cragistan&#x27;s potential GDP growth rate exceeds that of Kurtenstein&#x27;s. Which difference in factors could help justify Cragistan&#x27;s higher sustainable growth rate?<\/p><\/div>", "subj": "economics"}, {"n": 22, "q": "The evidence that supports the club convergence hypothesis includes, Cragistan's and West Lundia's:", "opts": ["savings rates, and population growth rates are stabilizing and becoming similar to Kurtenstein’s rates.", "institutions are becoming standardized according to regional monetary union guidelines.", "long-term growth rates are converging toward Kurtenstein’s long-term growth rates."], "ans": "B", "expl": "Under club convergence, countries can 'join' the club by making appropriate institutional changes. Both West Lundia's and Cragistan's adherence to regional monetary union standards show their willingness to join the developed nations' club. Emerging nations' long-term growth converging toward a developed country's long-term growth rates is part of the absolute convergence hypothesis. The conditional convergence hypothesis states that convergence in living standards will only occur for countries with the same savings rates, population growth rates, and production functions.", "explhtml": "<p>Under club convergence, countries can &#x27;join&#x27; the club by making appropriate institutional changes. Both West Lundia&#x27;s and Cragistan&#x27;s adherence to regional monetary union standards show their willingness to join the developed nations&#x27; club. Emerging nations&#x27; long-term growth converging toward a developed country&#x27;s long-term growth rates is part of the absolute convergence hypothesis. The conditional convergence hypothesis states that convergence in living standards will only occur for countries with the same savings rates, population growth rates, and production functions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 20–23<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>West Lundia and Cragistan are neighboring emerging market nations. These two countries share a border and frequently trade with each other. Cragistan has abundant oil reserves and precious metals, both of which West Lundia lacks. Kurtenstein is a developed market nation that borders both West Lundia and Cragistan and is the largest trading partner for both the other two countries. Kurtenstein is a major buyer of Cragistan's unrefined petroleum and West Lundia's cheaper labor. All three countries are politically stable and have formed a regional monetary union, known as WICKA (West Lundia, Cragistan, Kurtenstein Alliance - pronounced 'wicka\"). Their currency, the WiCKA Rand or WCK, is a free floating currency.<\/p><p>Exhibit 1 shows selected economic and demographic statistics are for the three countries and for the year 20X1.<\/p><p>Exhibit 1: Selected economic and demographic statistic for 20X1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Cragistan Kurtenstein West Lundia 25.18 5.63 5.52 Population (in millions) 71.20% 64.50% 64.50% Labor force participation (in %)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v008.webp\" style=\"max-width:min(100%,667px)\" alt=\"$1,500.0 $50.0 $50.0 GDP (in $ billions) 35.00% 20.00% 40.00% Share of capital in total GDP Average Hrs. per worker in labor 1898.0 1690.0 1690.0 force per yr AAA Sovereign credit rating A A+ 12.5% 10.0% 5.0% Savings rate (average is 10,0%) $7.50 $250.00 $15.00 Imports (in $ billions) $20.00 $8.00 $200.00 Exports (in $ billions) Analysts&#x27; projected 10 year estimates are provided in Exhibit 2. Cragistan&#x27;s projected population growth is based on a slightly higher fertility rate but also a less restrictive immigration policy. Cragistan West Lundia Kurtenstein 10 Year estimates 6.51 25.9\"><p>The forecasted growth rate in potential GDP for Cragistan and Kurtenstein are 4.4% and 3.0% respectively. The estimated long-term actual GDP growth rate for West Lundia is lower than its estimated potential GDP growth rate.<\/p><p>Monetary Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v009.webp\" style=\"max-width:min(100%,448px)\" alt=\"• All three countries have relatively independent central banks. • All three target inflation as a primary goal.\"><p>Fiscal Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v010.webp\" style=\"max-width:min(100%,572px)\" alt=\"• West Lundia has a slight surplus and actively seeks to affect aggregate demand. • Cragistan has a moderate surplus and may seek to affect
