0–23<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>West Lundia and Cragistan are neighboring emerging market nations. These two countries share a border and frequently trade with each other. Cragistan has abundant oil reserves and precious metals, both of which West Lundia lacks. Kurtenstein is a developed market nation that borders both West Lundia and Cragistan and is the largest trading partner for both the other two countries. Kurtenstein is a major buyer of Cragistan's unrefined petroleum and West Lundia's cheaper labor. All three countries are politically stable and have formed a regional monetary union, known as WICKA (West Lundia, Cragistan, Kurtenstein Alliance - pronounced 'wicka\"). Their currency, the WiCKA Rand or WCK, is a free floating currency.<\/p><p>Exhibit 1 shows selected economic and demographic statistics are for the three countries and for the year 20X1.<\/p><p>Exhibit 1: Selected economic and demographic statistic for 20X1<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v007.webp\" style=\"max-width:min(100%,667px)\" alt=\"Cragistan Kurtenstein West Lundia 25.18 5.63 5.52 Population (in millions) 71.20% 64.50% 64.50% Labor force participation (in %)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v008.webp\" style=\"max-width:min(100%,667px)\" alt=\"$1,500.0 $50.0 $50.0 GDP (in $ billions) 35.00% 20.00% 40.00% Share of capital in total GDP Average Hrs. per worker in labor 1898.0 1690.0 1690.0 force per yr AAA Sovereign credit rating A A+ 12.5% 10.0% 5.0% Savings rate (average is 10,0%) $7.50 $250.00 $15.00 Imports (in $ billions) $20.00 $8.00 $200.00 Exports (in $ billions) Analysts&#x27; projected 10 year estimates are provided in Exhibit 2. Cragistan&#x27;s projected population growth is based on a slightly higher fertility rate but also a less restrictive immigration policy. Cragistan West Lundia Kurtenstein 10 Year estimates 6.51 25.9\"><p>The forecasted growth rate in potential GDP for Cragistan and Kurtenstein are 4.4% and 3.0% respectively. The estimated long-term actual GDP growth rate for West Lundia is lower than its estimated potential GDP growth rate.<\/p><p>Monetary Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v009.webp\" style=\"max-width:min(100%,448px)\" alt=\"• All three countries have relatively independent central banks. • All three target inflation as a primary goal.\"><p>Fiscal Policy:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v010.webp\" style=\"max-width:min(100%,572px)\" alt=\"• West Lundia has a slight surplus and actively seeks to affect aggregate demand. • Cragistan has a moderate surplus and may seek to affect aggregate demand. • Kurtenstein has a slight deficit and does not actively affect aggregate demand.\"><p>International Trade:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v011.webp\" style=\"max-width:min(100%,234px)\" alt=\"• West Lundia is a net exporter. • Cragistan is a net exporter. • Kurtenstein is a net importer.\"><p>Financial Markets:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r6/v012.webp\" style=\"max-width:min(100%,617px)\" alt=\"• Kurtenstein has well established high volume liquid equity and fixed income markets. • Cragistan and West Lundia both have moderately liquid equity markets. • Cragistan has a credit market with more volume and smaller credit spreads than West Lundia.\"><\/div><\/details><div class=\"pp-topic\">Module 6.1, LOS 6.a<\/div><div class=\"qtext\"><p>If in Kurtenstein the growth in earnings relative to GDP is 0.50% and the growth of price-to-earnings is 0.8%, then the long-term aggregate equity growth rate is:<\/p><\/div>", "subj": "economics"}, {"n": 24, "q": "Yasmani Sandoval has gathered the following information on the economy of Sangarnio and that of Gurtania, two developed economies with strong trade links with each other. Country TFP Growth Rate Labor Force Growth\nRate Labor cost as a % of\ntotal factor cost Sangarnio 1.8% 1.1% 0.55 Gurtania 1.9% 1.0% 0.60 Which of the following conclusions is Sandoval most likely to draw?", "opts": ["According to classical growth theory, Sangarnio’s sustainable growth rate is higher than that for Gurtania", "Sangarnio has the lowest sustainable growth rate according to neoclassical growth theory", "Gurtania has a sustainable growth rate of over 4% according to neoclassical growth theory"], "ans": "C", "expl": "Classical growth theory contends that growth is not sustainable, hence both economies should have a sustainable growth rate of zero. Neoclassical growth theory calculates the sustainable growth rate as [θ/(1-α)]+ Growth Labor Sangarnio: 1.8/0.55 + 1.1 = 4.38% Gurtania: 1.9/0.60 + 1.0 = 4.17% Sangarnio has a higher sustainable growth rate than Gurtania, but Gurtania does have a growth rate over 4%.", "explhtml": "<p>Classical growth theory contends that growth is not sustainable, hence both economies should have a sustainable growth rate of zero. Neoclassical growth theory calculates the sustainable growth rate as [θ/(1-α)]+ Growth Labor<\/p><p>Sangarnio: 1.8/0.55 + 1.1 = 4.38%<\/p><p>Gurtania: 1.9/0.60 + 1.0 = 4.17%<\/p><p>Sangarnio has a higher sustainable growth rate than Gurtania, but Gurtania does have a growth rate over 4%.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>Yasmani Sandoval has gathered the following information on the economy of Sangarnio and that of Gurtania, two developed economies with strong trade links with each other.<\/p><div class=\"tbl\"><table><tr><td>Country<\/td><td>TFP Growth Rate<\/td><td>Labor Force Growth<br>Rate<\/td><td>Labor cost as a % of<br>total factor cost<\/td><\/tr><tr><td>Sangarnio<\/td><td>1.8%<\/td><td>1.1%<\/td><td>0.55<\/td><\/tr><tr><td>Gurtania<\/td><td>1.9%<\/td><td>1.0%<\/td><td>0.60<\/td><\/tr><\/table><\/div><p>Which of the following conclusions is Sandoval most likely to draw?<\/p><\/div>", "subj": "economics"}, {"n": 25, "q": "Which of the following concepts is uniquely associated with the endogenous growth theory of economic growth?", "opts": ["No diminishing returns to knowledge capital.", "Increased spending on health care and population growth.", "Real gross domestic product (GDP) growth based on investment in new capital and technological change."], "ans": "A", "expl": "Knowledge capital is a special type of public good because it is not subject to the law of diminishing returns. This is a key element of endogenous growth theory. The implication is that, unlike the classical or neoclassical growth theories, economic growth is not limited.", "explhtml": "<p>Knowledge capital is a special type of public good because it is not subject to the law of diminishing returns. This is a key element of endogenous growth theory. The implication is that, unlike the classical or neoclassical growth theories, economic growth is not limited.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>Which of the following concepts is uniquely associated with the endogenous growth theory of economic growth?<\/p><\/div>", "subj": "economics"}, {"n": 26, "q": "While having lunch with a group of friends, Francine Lenser, CFA, was overheard saying the following: \"The recent boom in technological advances should keep the economy growing. Whenever the economy slows, someone will come along with a bold new idea that kick-starts it.\" Lenser's statement most accurately reflects the:", "opts": ["exogenous growth theory.", "endogenous growth theory.", "neoclassical growth theory."], "ans": "B", "expl": "Lenser's statement is a decent layman's description of the endogenous growth theory. This theory argues that economic growth can continue indefinitely as long as technological advances are made.", "explhtml": "<p>Lenser&#x27;s statement is a decent layman&#x27;s description of the endogenous growth theory. This theory argues that economic growth can continue indefinitely as long as technological advances are made.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>While having lunch with a group of friends, Francine Lenser, CFA, was overheard saying the following: &quot;The recent boom in technological advances should keep the economy growing. Whenever the economy slows, someone will come along with a bold new idea that kick-starts it.&quot;<\/p><p>Lenser&#x27;s statement most accurately reflects the:<\/p><\/div>", "subj": "economics"}, {"n": 27, "q": "Which of the following situations is least likely to constrain growth in an economy?", "opts": ["A lack of access to natural resources", "Limited ownership of natural resources", "Strong domestic currency appreciation due to demand for domestically owned natural resources"], "ans": "B", "expl": "A lack of access to natural resources could well restrain growth. Currency appreciation will lead to high export prices and uncompetitive domestic industries in the global market. A lack of ownership of natural resources need not hinder growth as long as the economy has access via trade.", "explhtml": "<p>A lack of access to natural resources could well restrain growth. Currency appreciation will lead to high export prices and uncompetitive domestic industries in the global market. A lack of ownership of natural resources need not hinder growth as long as the economy has access via trade.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.f<\/div><div class=\"qtext\"><p>Which of the following situations is least likely to constrain growth in an economy?<\/p><\/div>", "subj": "economics"}, {"n": 28, "q": "Tamay Farthani, CFA, is studying the economic growth rate in several developing and developed countries. She believes there is strong evidence that well developed financial markets enhance growth prospects by channeling investment to projects with the highest risk-adjusted returns and by encouraging the use of leverage. Farthani is correct regarding developed financial markets impact on growth regarding:", "opts": ["only the use of leverage", "only channeling investment to projects with the highest risk-adjusted returns", "both channeling investment to projects with the highest risk-adjusted returns and the use of leverage"], "ans": "B", "expl": "Well-developed financial markets encourage investment and hence growth by channeling investments to those projects with the highest risk-adjusted return. An increase in leverage resulting from the development of capital markets may lead to higher risk but not growth.", "explhtml": "<p>Well-developed financial markets encourage investment and hence growth by channeling investments to those projects with the highest risk-adjusted return. An increase in leverage resulting from the development of capital markets may lead to higher risk but not growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.1, LOS 6.a<\/div><div class=\"qtext\"><p>Tamay Farthani, CFA, is studying the economic growth rate in several developing and developed countries. She believes there is strong evidence that well developed financial markets enhance growth prospects by channeling investment to projects with the highest risk-adjusted returns and by encouraging the use of leverage.<\/p><p>Farthani is correct regarding developed financial markets impact on growth regarding:<\/p><\/div>", "subj": "economics"}, {"n": 29, "q": "Which of the following factors is most likely to contribute to a failure of the conditional convergence hypothesis?", "opts": ["Political stability.", "Low rates of savings.", "Regulatory policies that encourage investment."], "ans": "B", "expl": "Conditional convergence means that convergence is conditional on the countries having the same saving rate, population growth rate, and production function. Low rates of savings is one factor that can cause a developing country to fail to converge.", "explhtml": "<p>Conditional convergence means that convergence is conditional on the countries having the same saving rate, population growth rate, and production function. Low rates of savings is one factor that can cause a developing country to fail to converge.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.j<\/div><div class=\"qtext\"><p>Which of the following factors is most likely to contribute to a failure of the conditional convergence hypothesis?<\/p><\/div>", "subj": "economics"}, {"n": 30, "q": "The endogenous growth theory contends that economic growth is a function of which of the following two economic variables?", "opts": ["The subsistence real wage and real interest rates.", "Real interest rates and technological change.", "The creation of knowledge capital and real interest rates."], "ans": "C", "expl": "The endogenous growth theory holds that productivity growth is a function of society's ability to discover new products and methods (i.e., the creation of knowledge capital), and real interest rates.", "explhtml": "<p>The endogenous growth theory holds that productivity growth is a function of society&#x27;s ability to discover new products and methods (i.e., the creation of knowledge capital), and real interest rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>The endogenous growth theory contends that economic growth is a function of which of the following two economic variables?<\/p><\/div>", "subj": "economics"}, {"n": 31, "q": "Which of the following statements regarding convergence hypotheses is least accurate?", "opts": ["The conditional convergence hypothesis contends that convergence of living standards requires countries to have the same population growth rates.", "The club convergence hypothesis contends that poorer countries with similar institutional features to those of richer countries will grow rapidly to catch up with their peers.", "The neoclassical theory contends that countries will eventually have the same growth rates and per capita income."], "ans": "C", "expl": "The neoclassical model assumes that all countries have access to the same technology and contends that growth rates but not per capita income will converge.", "explhtml": "<p>The neoclassical model assumes that all countries have access to the same technology and contends that growth rates but not per capita income will converge.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.j<\/div><div class=\"qtext\"><p>Which of the following statements regarding convergence hypotheses is least accurate?<\/p><\/div>", "subj": "economics"}, {"n": 32, "q": "Which of the following concepts is uniquely associated with the classical theory of economic growth?", "opts": ["Target rate of return.", "Subsistence real wage.", "Real GDP growth."], "ans": "B", "expl": "Classical growth theory contends that there is a subsistence real wage, defined as the minimum real wage necessary to support life. Whenever real wages are greater than the subsistence real wage, the population will increase, leading to diminishing returns to labor, and eventually, decreased labor productivity. The key to classical growth theory is the population explosion that occurs whenever real GDP per labor hour increases above the subsistence level, which will eventually eliminate any gains from increased labor productivity.", "explhtml": "<p>Classical growth theory contends that there is a subsistence real wage, defined as the minimum real wage necessary to support life. Whenever real wages are greater than the subsistence real wage, the population will increase, leading to diminishing returns to labor, and eventually, decreased labor productivity. The key to classical growth theory is the population explosion that occurs whenever real GDP per labor hour increases above the subsistence level, which will eventually eliminate any gains from increased labor productivity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.i<\/div><div class=\"qtext\"><p>Which of the following concepts is uniquely associated with the classical theory of economic growth?<\/p><\/div>", "subj": "economics"}, {"n": 33, "q": "Which of the following investments is least likely to be described as a foreign direct investment or FDI? When a foreign company invests in the domestic economy by:", "opts": ["purchasing equity securities.", "buying property and equipment.", "building a manufacturing plant."], "ans": "A", "expl": "Foreign direct investing refers to a foreign company investing directly in a domestic economy by building or buying property, plant, and equipment. A foreign company purchasing equity or fixed income securities issued by a domestic company is best described as indirect investing.", "explhtml": "<p>Foreign direct investing refers to a foreign company investing directly in a domestic economy by building or buying property, plant, and equipment. A foreign company purchasing equity or fixed income securities issued by a domestic company is best described as indirect investing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.3, LOS 6.l<\/div><div class=\"qtext\"><p>Which of the following investments is least likely to be described as a foreign direct investment or FDI? When a foreign company invests in the domestic economy by:<\/p><\/div>", "subj": "economics"}, {"n": 34, "q": "Hemali is an emerging market economy where labor's share of GDP is 60%. The long-term trend of labor growth is 2%. Capital investment has been growing at 1.5% and is expected to continue at that rate in the future. Hemali has increased the budgetary allocation for primary and secondary education. Accordingly, economists estimate that labor productivity will increase by 2% per year. The potential GDP growth rate for Hemali is closest to:", "opts": ["3.80%", "5.50%", "4%"], "ans": "C", "expl": "Using the growth accounting equation: growth rate in potential GDP = long-term growth rate of labor force + long-term growth rate in labor productivity = 2% + 2% = 4%", "explhtml": "<p>Using the growth accounting equation:<\/p><p>growth rate in potential GDP = long-term growth rate of labor force + long-term growth rate in labor productivity = 2% + 2% = 4%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.e<\/div><div class=\"qtext\"><p>Hemali is an emerging market economy where labor&#x27;s share of GDP is 60%. The long-term trend of labor growth is 2%. Capital investment has been growing at 1.5% and is expected to continue at that rate in the future. Hemali has increased the budgetary allocation for primary and secondary education. Accordingly, economists estimate that labor productivity will increase by 2% per year.<\/p><p>The potential GDP growth rate for Hemali is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 35, "q": "Shefali is an emerging market economy where labor cost accounts for 35% of total factor cost. The long-term trend of labor growth is 2%. Capital investment has been growing at 1.5% but is expected to grow at 3% in the future. Shefalian economy is expected to experience annual growth of 2.5% in total factor productivity. The potential GDP growth rate for Shefali is closest to:", "opts": ["5.15%", "4.85%", "7.5%"], "ans": "A", "expl": "Using the growth accounting equation: growth rate in potential GDP = long-term growth rate of technology + α(long-term growth rate of capital) + (1 − alpha) (long-term growth rate of labor) = 2.5% + (0.65)(3%) + (0.35)(2%) = 5.15%", "explhtml": "<p>Using the growth accounting equation: growth rate in potential GDP = long-term growth rate of technology + α(long-term growth rate of capital) + (1 − alpha) (long-term growth rate of labor)<\/p><p>= 2.5% + (0.65)(3%) + (0.35)(2%) = 5.15%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.e<\/div><div class=\"qtext\"><p>Shefali is an emerging market economy where labor cost accounts for 35% of total factor cost. The long-term trend of labor growth is 2%. Capital investment has been growing at 1.5% but is expected to grow at 3% in the future. Shefalian economy is expected to experience annual growth of 2.5% in total factor productivity. The potential GDP growth rate for Shefali is closest to:<\/p><\/div>", "subj": "economics"}, {"n": 36, "q": "Jon Barnton is studying the potential rate of economic growth in Barini, a large developed economy in Western Europe. He makes the following statement: 'Barini has seen a slowdown in GDP growth over the past decade, the likely causes being a slowdown in population growth, the wealth effect and increasing immigration.' Which of the factors stated by Barnton is least likely to explain the slowdown?", "opts": ["Wealth effect", "Immigration", "Population growth"], "ans": "B", "expl": "A slowdown in population growth is likely to constrain growth. The wealth effect reduces total hours worked as individuals opt to take more leisure time. Immigration may offset the slowdown in population growth.", "explhtml": "<p>A slowdown in population growth is likely to constrain growth. The wealth effect reduces total hours worked as individuals opt to take more leisure time. Immigration may offset the slowdown in population growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 6.2, LOS 6.g<\/div><div class=\"qtext\"><p>Jon Barnton is studying the potential rate of economic growth in Barini, a large developed economy in Western Europe. He makes the following statement:<\/p><p>&#x27;Barini has seen a slowdown in GDP growth over the past decade, the likely causes being a slowdown in population growth, the wealth effect and increasing immigration.&#x27;<\/p><p>Which of the factors stated by Barnton is least likely to explain the slowdown?<\/p><\/div>", "subj": "economics"}];

    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}

    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};

      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/fixed-income|fixed income|bond\b|bonds\b|debt rating|corporate debt|credit rating|credit spread|creditworthiness|yield curve|yield spread|spot rate|forward rate|yield-to-maturity|yield to maturity|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|\bcds\b|repo market|central bank funds|covenant|accrued interest|priority of claims|default risk|extension risk/.test(prompt)) return "fixed";
  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
