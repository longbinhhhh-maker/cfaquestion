<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .stem .qtable{width:100%;border-collapse:collapse;margin:12px 0 2px;font-size:14.5px;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stem .qtable th,.stem .qtable td{border:1px solid var(--line);padding:8px 11px;
    text-align:left;vertical-align:top}
  .stem .qtable thead th{background:var(--panel2);font-weight:700;color:var(--accent2)}
  .stem .qtable tbody td:first-child{font-weight:600}
  .stem .qtable td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .stem .qtable tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  @media (max-width:520px){.stem .qtable{font-size:13px}.stem .qtable th,.stem .qtable td{padding:6px 8px}}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
  /* two-column question table */
  .q-cols-header{display:flex;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .q-cols-header span{flex:1;text-align:center;padding:9px 14px;font-weight:700;
    color:var(--accent2);font-size:13.5px;background:var(--panel2)}
  .q-cols-header span+span{border-left:1px solid var(--line)}
  .opt[data-cols="2"]{display:flex;align-items:stretch;padding:0;overflow:hidden;gap:0}
  .opt[data-cols="2"] .lead{display:flex;align-items:center;padding:10px 12px;
    border-right:1px solid var(--line);white-space:nowrap}
  .opt[data-cols="2"] .opt-col{flex:1;padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.4}
  .opt[data-cols="2"] .opt-col+.opt-col{border-left:1px solid var(--line)}
  html[data-theme="light"] .q-cols-header{border-color:var(--line)}
  html[data-theme="light"] .q-cols-header span{background:var(--panel2)}
  html[data-theme="light"] .opt[data-cols="2"] .lead,
  html[data-theme="light"] .opt[data-cols="2"] .opt-col{border-color:var(--line)}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>

<script>
const DATA = [{"n":1,"q":"Given the following information, what is the required rate of return on Bin Co?\ninflation premium = 3%\nreal risk-free rate = 2%\nBin Co. beta = 1.3\nmarket risk premium = 4%","opts":["16.7%.","10.2%.","7.6%."],"ans":"B","expl":"Sử dụng mô hình định giá tài sản vốn (CAPM) để tìm tỷ suất lợi nhuận yêu cầu.\nlãi suất phi rủi ro gần đúng là 5% (lãi suất phi rủi ro thực 2% + phí lạm phát 3%).\nk = 5% + 1,3(4%) = 10,2%.\n(Mô-đun 84.2, LOS 84.g)"},{"n":2,"q":"Which of the following is an assumption of capital market theory? All investors:","opts":["have multiple-period time horizons.","see the same risk/return distribution for a given stock.","select portfolios that lie above the efficient frontier to optimize the risk-return relationship."],"ans":"B","expl":"Tất cả các nhà đầu tư chọn danh mục đầu tư nằm dọc theo biên giới hiệu quả, dựa trên các chức năng\nhữu ích của họ. Tất cả các nhà đầu tư đều có cùng khoảng thời gian trong một khoảng thời gian và có\nkỳ vọng về rủi ro/lợi nhuận như nhau.\n(Mô-đun 84.2, LOS 84.f)"},{"n":3,"q":"If the risk-free rate of return is 3.5%, the expected market return is 9.5%, and the beta of a\nstock is 1.3, what is the required return on the stock according to the capital asset pricing\nmodel?","opts":["11.3%.","12.4%.","7.8%."],"ans":"A","expl":"Công thức cho lợi nhuận yêu cầu là: ER = R + (E – R) × Beta\nstockfRMfstock\nhoặc 0,035 + 1,3 × (0,095 - 0,035) = 0,113 hoặc 11,3%.\n(Mô-đun 84.2, LOS 84.g)"},{"n":4,"q":"The slope of the characteristic line is used to estimate:","opts":["risk aversion.","a risk premium.","beta."],"ans":"C","expl":"Beta cho một chứng khoán riêng lẻ có thể được ước tính bằng độ dốc của đường đặc tính của nó,\nhồi quy bình phương nhỏ nhất của lợi nhuận vượt mức của chứng khoán đó so với mức vượt quá của thị trường\ntrả về.\n(Mô-đun 84.1, LOS 84.e)"},{"n":5,"q":"Level I CFA candidate Adeline Bass is a member of an investment club. At the next meeting,\nshe is to recommend whether or not the club should purchase the stocks of CS Industries\nand MG Consolidated. The risk-free rate is at 6% and the expected return on the market is\n15%. Prior to the meeting, Bass gathers the following information on the two stocks:\nCS IndustriesMG Consolidated\nCurrent Market Value$25$50\nExpected Market Value in One Year$30$55\nExpected Dividend$1$1\nBeta1.20.80\nBass should recommend that the club:","opts":["purchase both stocks.","purchase CS only.","purchase MG only."],"ans":"B","expl":"Trong ngữ cảnh của SML, một chứng khoán được định giá thấp nếu lợi tức yêu cầu nhỏ hơn lợi tức\nthời gian nắm giữ (hoặc dự kiến), được định giá quá cao nếu lợi tức yêu cầu lớn hơn lợi tức\nthời gian nắm giữ (hoặc dự kiến) và được định giá chính xác nếu lợi tức yêu cầu bằng\nlợi nhuận thời gian nắm giữ (hoặc dự kiến).\nỞ đây, lợi tức thời gian nắm giữ (hoặc dự kiến) được tính như sau: (giá kết thúc – đầu\ngiá + mọi dòng tiền / cổ tức) / giá khởi điểm. Lợi nhuận yêu cầu sử dụng\nphương trình của SML: lãi suất phi rủi ro + Beta × (lãi suất thị trường dự kiến ​​− lãi suất phi rủi ro).\nĐối với các ngành CS: ER = (30 – 25 + 1) / 25 = 24%, RR = 6 + 1,2 × (15 – 6) = 16,8%. Cổ phiếu\nđược định giá thấp - mua hàng.\nĐối với MG Hợp nhất: ER = (55 – 50 + 1) / 50 = 12%, RR = 6 + 0,80 × (15 – 6) = 13,2%.\nCổ phiếu được định giá quá cao - không mua.\n(Module 84.2, LOS 84.h)","qhtml":"<p>Level I CFA candidate Adeline Bass is a member of an investment club. At the next meeting, she is to recommend whether or not the club should purchase the stocks of CS Industries and MG Consolidated. The risk-free rate is at 6% and the expected return on the market is 15%. Prior to the meeting, Bass gathers the following information on the two stocks:</p><table class=\"qtable\"><thead><tr><th></th><th>CS Industries</th><th>MG Consolidated</th></tr></thead><tbody><tr><td>Current Market Value</td><td>$25</td><td>$50</td></tr><tr><td>Expected Market Value in One Year</td><td>$30</td><td>$55</td></tr><tr><td>Expected Dividend</td><td>$1</td><td>$1</td></tr><tr><td>Beta</td><td>1.2</td><td>0.80</td></tr></tbody></table><p>Bass should recommend that the club:</p>"},{"n":6,"q":"The stock of Mia Shoes is currently trading at $15 per share, and the stock of Video Systems\nis currently trading at $18 per share. An analyst expects the prices of both stocks to increase\nby $2 over the next year and neither company pays dividends. Mia Shoes has a beta of 0.9\nand Video Systems has a beta of (-0.3). If the expected market return is 15% and the risk-free\nrate is 8%, which trading strategy does the CAPM indicate for these two stocks?","opts":["Buy | Buy","Buy | Sell","Sell | Buy"],"ans":"C","expl":"Tiền lãi yêu cầu của Mia Shoes là 0,08 + 0,9 × (0,15-0,08) = 14,3%. Lợi nhuận dự báo là\n$2/$15 = 13,3%. Cổ phiếu được định giá quá cao và nhà đầu tư nên bán nó. Lợi nhuận bắt buộc\ncho Hệ thống video là 0,08 - 0,3 × (0,15-0,08) = 5,9%. Lợi nhuận dự báo là $2/$18 = 11,1%.\nCổ phiếu bị định giá thấp và nhà đầu tư nên mua nó.\n(Module 84.2, LOS 84.h)","cols":["Mia Shoes","Video Systems"]},{"n":7,"q":"Which of the following statements about portfolio management is most accurate?","opts":["As an investor diversifies away the unsystematic portion of risk, the correlation between his portfolio return and that of the market approaches negative one.","Combining the capital market line (CML) (risk-free rate and efficient frontier) with an investor's indifference curve map separates out the decision to invest from the decision of what to invest in.","The security market line (SML) measures systematic and unsystematic risk versus expected return; the CML measures total risk."],"ans":"B","expl":"Kết hợp CML (lãi suất phi rủi ro và biên giới hiệu quả) với sự thờ ơ của nhà đầu tư\nbản đồ đường cong tách biệt quyết định đầu tư với đầu tư vào cái gì và được gọi là\nđịnh lý tách. Do đó, quá trình lựa chọn đầu tư được đơn giản hóa từ việc chọn cổ phiếu\nđể xây dựng danh mục đầu tư hiệu quả thông qua đa dạng hóa.\nCác tuyên bố khác là sai. Khi một nhà đầu tư đa dạng hóa phần không có hệ thống của\nrủi ro, mối tương quan giữa lợi nhuận danh mục đầu tư của anh ta và cách tiếp cận thị trường\ntích cực một. (Hãy nhớ rằng danh mục thị trường không có rủi ro phi hệ thống). SML\nđo lường rủi ro hệ thống hoặc rủi ro beta.\n(Mô-đun 84.1, LOS 84.c)"},{"n":8,"q":"Over a sample period, an investor gathers the following data about three mutual funds.\nMutual FundPortfolio ReturnPortfolio Standard DeviationPortfolio Beta\nP13%18%1.2\nQ15%20%1.4\nR18%24%1.8\nThe risk-free rate is 5%. Based solely on the Sharpe measure, an investor would prefer:","opts":["Fund R.","Fund Q.","Fund P."],"ans":"A","expl":"Thước đo Sharpe cho một danh mục đầu tư được tính bằng (lợi nhuận trung bình của danh mục đầu tư − trung bình\nlợi nhuận trên tài sản không rủi ro)/độ lệch chuẩn danh mục đầu tư. Các thước đo Sharpe cho\nba quỹ tương hỗ là:\nquỹ tương hỗ P = (13 − 5) / 18 = 0,44\nquỹ tương hỗ Q = (15 − 5) / 20 = 0,50\nquỹ tương hỗ R = (18 − 5) / 24 = 0,54\nGiả sử rằng các nhà đầu tư thích lợi nhuận và không thích rủi ro, họ nên thích các danh mục đầu tư có\ntỷ lệ Sharpe lớn hơn những danh mục có tỷ lệ nhỏ hơn. Vì vậy, nhà đầu tư nên ưu tiên\nquỹ R.\n(Module 84.2, LOS 84.i)","qhtml":"<p>Over a sample period, an investor gathers the following data about three mutual funds.</p><table class=\"qtable\"><thead><tr><th>Mutual Fund</th><th>Portfolio Return</th><th>Portfolio Standard Deviation</th><th>Portfolio Beta</th></tr></thead><tbody><tr><td>P</td><td>13%</td><td>18%</td><td>1.2</td></tr><tr><td>Q</td><td>15%</td><td>20%</td><td>1.4</td></tr><tr><td>R</td><td>18%</td><td>24%</td><td>1.8</td></tr></tbody></table><p>The risk-free rate is 5%. Based solely on the Sharpe measure, an investor would prefer:</p>"},{"n":9,"q":"A model that estimates expected excess return on a security based on the ratio of the firm's\nbook value to its market value is best described as a:","opts":["market model.","multifactor model.","single-factor model."],"ans":"C","expl":"Một mô hình ước tính lợi nhuận vượt trội dự kiến của một cổ phiếu chỉ dựa trên tỷ lệ giá trị sổ sách trên thị trường\nlà mô hình một yếu tố. Mô hình thị trường là mô hình một yếu tố ước tính\nlợi nhuận vượt mức dự kiến ​​dựa trên mức độ nhạy cảm của chứng khoán đối với lợi nhuận vượt mức dự kiến ​​của\ndanh mục đầu tư thị trường. Mô hình đa yếu tố sẽ ước tính lợi nhuận vượt trội dự kiến dựa trên\nnhiều hơn một yếu tố.\n(Mô-đun 84.1, LOS 84.d)"},{"n":10,"q":"Based on Capital Market Theory, an investor should choose the:","opts":["market portfolio on the Capital Market Line.","portfolio that maximizes his utility on the Capital Market Line.","portfolio with the highest return on the Capital Market Line."],"ans":"B","expl":"Với Đường thị trường vốn, nhà đầu tư chọn danh mục đầu tư tối đa hóa tiện ích của mình.\nDanh mục đầu tư đó có thể chính xác là danh mục đầu tư thị trường hoặc có thể là sự kết hợp nào đó của\ntài sản phi rủi ro và danh mục thị trường.\n(Mô-đun 84.1, LOS 84.b)"},{"n":11,"q":"Which of the following statements about the security market line (SML) is least accurate?","opts":["Securities plotting above the SML are undervalued.","The independent variable in the SML equation is the standard deviation of the market portfolio.","The SML measures risk using the standardized covariance of the stock with the market."],"ans":"B","expl":"SML sử dụng một trong hai hiệp phương sai giữa tài sản và thị trường hoặc beta là\nthước đo rủi ro. Beta là hiệp phương sai của một cổ phiếu với thị trường chia cho phương sai\ncủa thị trường. Chứng khoán có biểu đồ trên SML bị định giá thấp và chứng khoán có biểu đồ\ndưới SML được định giá quá cao.\n(Module 84.2, LOS 84.h)"},{"n":12,"q":"What is the expected rate of return on a stock that has a beta of 1.4 if the market risk\npremium is 9% and the risk-free rate is 4%?","opts":["13.0%.","11.0%.","16.6%."],"ans":"C","expl":"Sử dụng phương trình đường thị trường chứng khoán (SML):\n4% + 1,4(9%) = 16,6%.\n(Module 84.2, LOS 84.g)"},{"n":13,"q":"A plot of the expected returns and standard deviations of each possible portfolio that\ncombines a risky asset and a risk-free asset will be:","opts":["a curve that approaches an upper limit.","a straight line.","convex to the origin."],"ans":"B","expl":"Danh mục đầu tư có thể có của tài sản rủi ro và tài sản phi rủi ro có mối quan hệ tuyến tính\ngiữa lợi nhuận kỳ vọng và tiêu chuẩn độ lệch.\n(Mô-đun 84.1, LOS 84.a)"},{"n":14,"q":"Which of the following is the risk that disappears in the portfolio construction process?","opts":["Unsystematic risk.","Interest rate risk.","Systematic risk."],"ans":"A","expl":"Rủi ro phi hệ thống (rủi ro có thể đa dạng hóa) là rủi ro được loại bỏ khi nhà đầu tư xây dựng\nmột danh mục đầu tư được đa dạng hóa tốt.\n(Mô-đun 84.1, LOS 84.c)"},{"n":15,"q":"What is the required rate of return for a stock with a beta of 1.2, when the risk-free rate is\n6% and the market risk premium is 12%?","opts":["13.2%.","15.4%.","20.4%."],"ans":"C","expl":"RR = R + (R - R) × Beta trong đó RR= lợi nhuận yêu cầu, R = lợi nhuận và R = rủi ro-\nStockfMarketfStock,f\nlãi suất miễn phí.\nỞ đây, RR = 6 + (12) × 1,2 = 6 + 14,4 = 20,4%. Chúng tôi nhận được phần bù rủi ro thị trường\nStock\nE(R) – R, chứ không phải lợi nhuận kỳ vọng trên thị trường.\nmktf\n(Module 84.2, LOS 84.g)"},{"n":16,"q":"Portfolios on the capital market line:","opts":["each contain different risky assets.","include some positive allocation to the risk-free asset.","are perfectly positively correlated with each other."],"ans":"C","expl":"Việc đưa ra một tài sản phi rủi ro sẽ thay đổi đường biên hiệu quả Markowitz thành một đường thẳng\n. Đường biên giới hiệu quả thẳng này được gọi là đường thị trường vốn (CML). Vì đường\nlà đường thẳng nên phép toán ngụ ý rằng lợi nhuận của hai danh mục đầu tư bất kỳ trên đường này sẽ\ntương quan hoàn hảo với nhau. Lưu ý: Khi ρ = ​​1 thì phương trình của\na,b\nrủi ro thay đổi thành s = Ws + Ws, là một đường thẳng. Các tài sản rủi ro cho mỗi danh mục\nportAABB\ntrên CML đều giống nhau, danh mục tiếp tuyến (hoặc thị trường) của các tài sản rủi ro.\nCML bao gồm các danh mục cho vay với sự phân bổ dương cho tài sản không rủi ro, danh mục\nkhông phân bổ cho tài sản không rủi ro và danh mục đi vay với\nphân bổ âm cho tài sản không rủi ro.\n(Module 84.1, LOS 84.b)"},{"n":17,"q":"Which of the following is the most accurate description of the market portfolio in Capital\nMarket Theory? The market portfolio consists of all:","opts":["equity securities in existence.","risky and risk-free assets in existence.","risky assets in existence."],"ans":"C","expl":"Về lý thuyết, danh mục thị trường chứa tất cả các tài sản rủi ro đang tồn tại. Nó không chứa\nbất kỳ tài sản không rủi ro nào.\n(Mô-đun 84.1, LOS 84.b)"},{"n":18,"q":"Portfolios that plot on the security market line in equilibrium:","opts":["have only systematic (beta) risk.","may be concentrated in only a few stocks.","must be well diversified."],"ans":"B","expl":"Theo đến mô hình định giá tài sản vốn, ở trạng thái cân bằng tất cả chứng khoán và danh mục đầu tư\nbiểu đồ trên SML. Một chứng khoán hoặc danh mục đầu tư không được định giá ở mức cân bằng nếu nó nằm trên SML\n(tức là bị định giá thấp) hoặc dưới SML (tức là được định giá quá cao).\n(Module 84.2, LOS 84.f)"},{"n":19,"q":"Which of the following is an assumption of the Capital Asset Pricing Model (CAPM)?","opts":["There are no margin transactions or short sales.","Investors with shorter time horizons exhibit greater risk aversion.","No investor is large enough to influence market prices."],"ans":"C","expl":"CAPM giả định tất cả các nhà đầu tư đều là người chấp nhận giá và không một nhà đầu tư nào có thể tác động đến giá\n. CAPM cũng giả định thị trường không có trở ngại trong giao dịch và tất cả\ncác nhà đầu tư đều không thích rủi ro và có cùng khoảng thời gian một kỳ.\n(Module 84.2, LOS 84.f)"},{"n":20,"q":"Which is NOT an assumption of capital market theory?","opts":["There is no inflation.","There are no taxes or transaction costs.","Investments are not divisible."],"ans":"C","expl":"Lý thuyết thị trường vốn giả định rằng tất cả các khoản đầu tư đều có thể phân chia vô hạn. Các\ncác tuyên bố khác là những giả định cơ bản của lý thuyết thị trường vốn.\n(Mô-đun 84.2, LOS 84.f)"},{"n":21,"q":"In the market model, beta measures the sensitivity of an asset's rate of return to the\nmarket's:","opts":["rate of return.","risk-adjusted return.","excess return."],"ans":"A","expl":"Mô hình thị trường được thể hiện dưới dạng: R = α + βR + ε. Trong mô hình này, beta (β) đo lường\niiiimii\nđộ nhạy của tỷ suất lợi nhuận trên một tài sản (R) với tỷ suất lợi nhuận thị trường (R).\nim\n(Mô-đun 84.1, LOS 84.d)"},{"n":22,"q":"If a stock's beta is equal to 1.2, its standard deviation of returns is 28%, and the standard\ndeviation of the returns on the market portfolio is 14%, the covariance of the stock's returns\nwith the returns on the market portfolio is closest to:","opts":["0.168.","0.024.","0.600."],"ans":"B","expl":"Từ thực tế beta = Cov / Var, chúng ta có Cov = beta × var.\nii,mktmkti,mktimkt\n2\nCov = 1,2 × 0,14 = 0,02352.\ni,mkt\n(Mô-đun 84.1, LOS 84.e)"},{"n":23,"q":"An analyst estimated the following for three possible investments.\nSecurityCurrent PriceForecast Price in One YearAnnual DividendBeta\nAlpha Inc.25.0031.002.001.6\nLambda Inc.10.0010.8000.5\nOmega Inc.105.00110.001.001.2\nGiven an expected return on the market of 12% and a risk-free rate of 4%, which of the three\nsecurities is correctly priced based on the analyst's estimates?","opts":["Lambda.","Omega.","Alpha."],"ans":"A","expl":"Trong bối cảnh SML, một chứng khoán được định giá thấp nếu lợi nhuận yêu cầu của nó thấp hơn lợi nhuận ước tính trong thời gian nắm giữ của nó, được định giá quá cao nếu lợi nhuận yêu cầu của nó lớn hơn\nlợi nhuận ước tính của thời gian nắm giữ và được định giá chính xác nếu lợi nhuận yêu cầu của nó bằng\nlợi nhuận ước tính của thời gian nắm giữ.\nỞ đây, lợi nhuận ước tính của thời gian nắm giữ được tính như sau: (giá cuối – giá đầu +\ndòng tiền) / giá đầu. Lợi nhuận yêu cầu dựa trên CAPM là: lãi suất phi rủi ro +\nBeta × (lãi suất thị trường dự kiến ​​− lãi suất phi rủi ro).\nĐối với Alpha: ER = (31 – 25 + 2) / 25 = 32%, RR = 4 + 1,6 × (12 – 4) = 16,8%. Cổ phiếu\nđược định giá quá thấp.\nĐối với Omega: ER = (110 – 105 + 1) / 105 = 5,7%, RR = 4 + 1,2 × (12 – 4) = 13,6%. Cổ phiếu\nđược định giá quá cao.\nĐối với Lambda, ER = (10,8 – 10) / 10 = 8%, RR = 4 + 0,5 × (12 – 4) = 8%. Cổ phiếu được định giá chính xác\n.\n(Mô-đun 84.2, LOS 84.h)","qhtml":"<p>An analyst estimated the following for three possible investments.</p><table class=\"qtable\"><thead><tr><th>Security</th><th>Current Price</th><th>Forecast Price in One Year</th><th>Annual Dividend</th><th>Beta</th></tr></thead><tbody><tr><td>Alpha Inc.</td><td>$25.00</td><td>$31.00</td><td>$2.00</td><td>1.6</td></tr><tr><td>Lambda Inc.</td><td>$10.00</td><td>$10.80</td><td>$0</td><td>0.5</td></tr><tr><td>Omega Inc.</td><td>$105.00</td><td>$110.00</td><td>$1.00</td><td>1.2</td></tr></tbody></table><p>Given an expected return on the market of 12% and a risk-free rate of 4%, which of the three securities is correctly priced based on the analyst's estimates?</p>"},{"n":24,"q":"The risk-free rate is 5% and the expected market return is 15%. A portfolio manager is\nestimating a return of 20% on a stock with a beta of 1.5. Based on the SML and the analyst's\nestimate, this stock is:","opts":["overvalued.","undervalued.","properly valued."],"ans":"C","expl":"Dựa trên CAPM, danh mục đầu tư sẽ kiếm được: E(R) = 0,05 + 1,5(0,15 − 0,05) = 0,20 hoặc 20%.\nTrên cơ sở điều chỉnh rủi ro, danh mục đầu tư này nằm trên SML và do đó được định giá hợp lý.\n(Mô-đun 84.2, LOS 84.h)"},{"n":25,"q":"When comparing portfolios that plot on the security market line (SML) to those that plot on\nthe capital market line (CML), a financial analyst would most accurately state that portfolios\nthat lie on the SML:","opts":["are not necessarily priced at their equilibrium values, while portfolios on the CML are priced at their equilibrium values.","are not necessarily well diversified, while portfolios on the CML are well diversified.","have only systematic risk, while portfolios on the CML have both systematic and unsystematic risk."],"ans":"B","expl":"Mặc dù thước đo rủi ro trên sơ đồ đường thị trường vốn là rủi ro tổng thể, tất cả các danh mục đầu tư\nnằm trên CML đều được đa dạng hóa tốt và chỉ có rủi ro hệ thống. Điều này là do\ndanh mục đầu tư trên CML đều được xây dựng từ tài sản không rủi ro và danh mục đầu tư thị trường (được đa dạng hóa tốt)\n. Bất kỳ danh mục đầu tư nào, bao gồm cả chứng khoán đơn lẻ, sẽ vẽ đồ thị dọc theo trạng thái cân bằng SML trong\n. Rủi ro phi hệ thống của họ có thể đáng kể, nhưng nó không được đo lường trên biểu đồ SML\n vì rủi ro phi hệ thống không liên quan đến lợi nhuận kỳ vọng. Cả CML và\nSML đều phản ánh các mối quan hệ được duy trì khi giá ở trạng thái cân bằng.\n(Mô-đun 84.2, LOS 84.f)"},{"n":26,"q":"In extending the 3-factor model of Fama and French, the additional factor suggested by\nCarhart that is often used is:","opts":["market-to-book value.","price momentum.","GDP growth."],"ans":"B","expl":"Ngoài ba yếu tố của mô hình Fama và Pháp, giá trị thị trường trên sổ sách, quy mô công ty,\nvà lợi nhuận vượt mức trên thị trường, Carhart đã thêm yếu tố động lượng dựa trên\nhiệu suất giá tương đối.\n(Mô-đun 84.1, LOS 84.d)"},{"n":27,"q":"The following information is available for the stock of Park Street Holdings:\nThe price today (P) equals $45.00.\n0\nThe expected price in one year (P) is $55.00.\n1\nThe stock's beta is 2.31.\nThe firm typically pays no dividend.\nThe 3-month Treasury bill is yielding 4.25%.\nThe historical average S&P 500 return is 12.5%.\nPark Street Holdings stock is:","opts":["undervalued by 1.1%.","overvalued by 1.1%.","undervalued by 3.7%."],"ans":"B","expl":"Để xác định xem một cổ phiếu có được định giá quá cao hay không bị định giá thấp, chúng ta cần so sánh\nlợi nhuận kỳ vọng (hoặc lợi nhuận kỳ hạn nắm giữ) và lợi nhuận yêu cầu (từ Tài sản vốn\nMô hình định giá hoặc CAPM).\nBước 1: Tính toán lợi nhuận kỳ vọng (Lợi nhuận kỳ hạn nắm giữ):\nCông thức tính lợi nhuận kỳ hạn nắm giữ (một năm) là:\nHPR = (D + S – S) / S, trong đó D = cổ tức và S = giá cổ phiếu.\n1100\nỞ đây, HPR = (0 + 55 – 45) / 45 = 22,2%\nBước 2: Tính lợi nhuận bắt buộc:\nCông thức tính lợi nhuận yêu cầu là từ CAPM:\nRR = R + (ER – R) × Beta\nfMf\nRR = 4,25% + (12,5 – 4,25%) × 2,31 = 23,3%.\nBước 3: Xác định mức định giá trên/dưới:\nLợi nhuận yêu cầu lớn hơn lợi nhuận dự kiến, do đó chứng khoán\nđược định giá quá cao.\nSố tiền = 23,3% – 22,2% = 1,1%.\n(Mô-đun 84.2, LOS 84.h)","qhtml":"<p>The following information is available for the stock of Park Street Holdings:</p><ul><li>The price today (P<sub>0</sub>) equals $45.00.</li><li>The expected price in one year (P<sub>1</sub>) is $55.00.</li><li>The stock's beta is 2.31.</li><li>The firm typically pays no dividend.</li><li>The 3-month Treasury bill is yielding 4.25%.</li><li>The historical average S&amp;P 500 return is 12.5%.</li></ul><p>Park Street Holdings stock is:</p>"},{"n":28,"q":"One of the assumptions underlying the capital asset pricing model is that:","opts":["there are no transactions costs or taxes.","only whole shares or whole bonds are available.","each investor has a unique time horizon."],"ans":"A","expl":"CAPM giả định thị trường không có ma sát, tức là không có thuế hoặc chi phí giao dịch. Trong số\ncác giả định khác của CAPM là tất cả các nhà đầu tư đều có cùng một khoảng thời gian\nvà tất cả các khoản đầu tư đều có thể phân chia vô hạn.\n(Module 84.2, LOS 84.f)"},{"n":29,"q":"Beta is a measure of:","opts":["total risk.","systematic risk.","company-specific risk."],"ans":"B","expl":"Beta là thước đo rủi ro hệ thống.\n(Mô-đun 84.1, LOS 84.e)"},{"n":30,"q":"The expected rate of return is 1.5 times the 16% expected rate of return from the market.\nWhat is the beta if the risk free rate is 8%?","opts":["2.","3.","4."],"ans":"A","expl":"24 = 8 + β (16 – 8)\n24 = 8 + 8β\n16 = 8β\n16 / 8 = β\nβ = 2\n(Mô-đun 84.1, LOS 84.e)"},{"n":31,"q":"Which of the following statements regarding the Capital Asset Pricing Model is least\naccurate?","opts":["It is useful for determining an appropriate discount rate.","It is when the security market line (SML) and capital market line (CML) converge.","Its accuracy depends upon the accuracy of the beta estimates."],"ans":"B","expl":"CML biểu thị lợi nhuận kỳ vọng so với rủi ro độ lệch chuẩn. SML biểu thị lợi nhuận\nlợi nhuận kỳ vọng so với rủi ro beta. Do đó, chúng là những đường được vẽ trong các không gian hai chiều\nkhác nhau và sẽ không hội tụ.\n(Module 84.2, LOS 84.f)"},{"n":32,"q":"Which of the following terms refer to the same type of risk?","opts":["Undiversifiable risk and unsystematic risk.","Total risk and the variance of returns.","Systematic risk and firm-specific risk."],"ans":"B","expl":"Phương sai là thước đo tổng rủi ro.\n(Mô-đun 84.1, LOS 84.c)"},{"n":33,"q":"A stock's abnormal rate of return is defined as the:","opts":["rate of return during abnormal price movements.","expected risk-adjusted rate of return minus the market rate of return.","actual rate of return less the expected risk-adjusted rate of return."],"ans":"C","expl":"Lợi nhuận bất thường = Lợi nhuận thực tế – lợi nhuận kỳ vọng được điều chỉnh theo rủi ro\n(Mô-đun 84.2, LOS 84.h)"},{"n":34,"q":"Charlie Smith holds two portfolios, Portfolio X and Portfolio Y. They are both liquid, well-\ndiversified portfolios with approximately equal market values. He expects Portfolio X to\nreturn 13% and Portfolio Y to return 14% over the upcoming year. Because of an unexpected\nneed for cash, Smith is forced to sell at least one of the portfolios. He uses the security\nmarket line to determine whether his portfolios are undervalued or overvalued. Portfolio X's\nbeta is 0.9 and Portfolio Y's beta is 1.1. The expected return on the market is 12% and the\nrisk-free rate is 5%. Smith should sell:","opts":["both portfolios X and Y because they are both overvalued.","portfolio Y only.","either portfolio X or Y because they are both properly valued."],"ans":"B","expl":"Lợi nhuận yêu cầu của Danh mục đầu tư X là 0,05 + 0,9 × (0,12-0,05) = 11,3%. Dự kiến ​​nó sẽ trả về\n13%. Danh mục đầu tư có lợi nhuận vượt mức dự kiến ​​là 1,7%\nLợi nhuận yêu cầu của danh mục đầu tư Y là 0,05 + 1,1 × (0,12-0,05) = 12,7%. Dự kiến ​​nó sẽ trả về\n14%. Danh mục đầu tư có lợi nhuận vượt trội dự kiến ​​là 1,3%.\nVì cả hai danh mục đầu tư đều bị định giá thấp, nhà đầu tư nên bán danh mục đầu tư mang lại ít hơn\nlợi nhuận vượt quá. Bán Danh mục Y vì lợi nhuận vượt trội của nó thấp hơn Danh mục X.\n(Module 84.2, LOS 84.h)"},{"n":35,"q":"Which type of risk is positively related to expected excess returns according to the CAPM?","opts":["Unique.","Diversifiable.","Systematic."],"ans":"C","expl":"CAPM kết luận rằng lợi nhuận kỳ vọng là hàm số dương (tuyến tính) của rủi ro hệ thống\n.\n(Học phần 84.1, LOS 84.c)"},{"n":36,"q":"Beta is least accurately described as:","opts":["the covariance of a security’s returns with the market return, divided by the variance of market returns.","a standardized measure of the total risk of a security.","a measure of the sensitivity of a security’s return to the market return."],"ans":"B","expl":"2\nBeta là thước đo tiêu chuẩn hóa về rủi ro hệ thống của một chứng khoán. β = Cov / σ.\nr,mktmkt\nBeta được nhân với phần bù rủi ro thị trường trong CAPM: E(R) = RFR + β[E(R) – RFR].\nimkt\n(Module 84.1, LOS 84.e)"},{"n":37,"q":"An analyst has developed the following data for two companies, PNS Manufacturing (PNS)\nand InCharge Travel (InCharge). PNS has an expected return of 15% and a standard deviation\nof 18%. InCharge has an expected return of 11% and a standard deviation of 17%. PNS's\ncorrelation with the market is 75%, while InCharge's correlation with the market is 85%. If\nthe market standard deviation is 22%, which of the following are the betas for PNS and\nInCharge?","opts":["0.61 | 0.66","0.66 | 0.61","0.92 | 1.10"],"ans":"A","expl":"Beta = (s/s) × r\niiMI, M\nBetaPNS = (0,18/0,22) × 0,75 = 0,6136\nBetaInCharge = (0,17/0,22) × 0,85 = 0,6568\n(Mô-đun 84.1, LOS 84.e)","qhtml":"<p>An analyst has developed the following data for two companies, PNS Manufacturing (PNS) and InCharge Travel (InCharge). PNS has an expected return of 15% and a standard deviation of 18%. InCharge has an expected return of 11% and a standard deviation of 17%. PNS's correlation with the market is 75%, while InCharge's correlation with the market is 85%. If the market standard deviation is 22%, which of the following are the betas for PNS and InCharge?</p>","cols":["Beta of PNS","Beta of InCharge"]},{"n":38,"q":"James Franklin, CFA, has high risk tolerance and seeks high returns. Based on capital market\ntheory, Franklin would most appropriately hold:","opts":["a high-beta portfolio of risky assets financed in part by borrowing at the risk-free rate.","a high risk biotech stock, as it will have high expected returns in equilibrium.","the market portfolio as his only risky asset."],"ans":"C","expl":"Theo lý thuyết thị trường vốn, tất cả các nhà đầu tư sẽ chọn kết hợp giữa danh mục đầu tư thị trường\nvà vay hoặc cho vay với lãi suất không rủi ro; tức là một danh mục đầu tư trên CML.\n(Mô-đun 84.1, LOS 84.a)"},{"n":39,"q":"An analyst determines that three stocks have the following characteristics:\nStockBetaEstimated Return\nX1.010%\nY1.616%\nZ2.016%\nIf the risk-free rate is 4% and the expected return on the market is 10%, which of the\nfollowing statements is most accurate?","opts":["Stock X is undervalued.","Stock Y is overvalued.","Stock Z is properly valued."],"ans":"C","expl":"Khi sử dụng CAPM, lãi suất yêu cầu là lợi nhuận cho mỗi cổ phiếu là:\nE(R) = 4% + 1,0(10% − 4%) = 10,0%.\nX\n10,0% − 10,0% = 0,0%, được định giá hợp lý.\nE(R) = 4% + 1,6(10% − 4%) = 13,6%.\nY\n16,0% − 13,6% = 2,4% bị định giá thấp.\nE(R) = 4% + 2,0(10% − 4%) = 16,0%.\nZ\n16,0% − 16,0% = 0,0%, được định giá hợp lý.\n(Mô-đun 84.2, LOS 84.h)","qhtml":"<p>An analyst determines that three stocks have the following characteristics:</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Beta</th><th>Estimated Return</th></tr></thead><tbody><tr><td>X</td><td>1.0</td><td>10%</td></tr><tr><td>Y</td><td>1.6</td><td>16%</td></tr><tr><td>Z</td><td>2.0</td><td>16%</td></tr></tbody></table><p>If the risk-free rate is 4% and the expected return on the market is 10%, which of the following statements is most accurate?</p>"},{"n":40,"q":"Which of the following is least likely an assumption underlying the capital asset pricing\nmodel?","opts":["Investors are rational.","Tax rates are constant over the investment horizon.","All investors have the same expectations of return and risk for each security."],"ans":"B","expl":"Cả thuế và chi phí giao dịch đều được giả định bằng 0 trong lấy CAPM.\n(Mô-đun 84.2, LOS 84.f)"},{"n":41,"q":"Given a beta of 1.25 and a risk-free rate of 6%, what is the expected rate of return assuming\na 12% market return?","opts":["13.5%.","10%.","31%."],"ans":"A","expl":"k = Rf + β(R – Rf)\niiM\nk = 6% + 1,25(12% – 6%)\n= 13,5%\n(Mô-đun 84.2, LOS 84.g)"},{"n":42,"q":"If the standard deviation of the market's returns is 5.8%, the standard deviation of a stock's\nreturns is 8.2%, and the covariance of the market's returns with the stock's returns is 0.003,\nwhat is the beta of the stock?","opts":["0.05.","0.89.","1.07."],"ans":"B","expl":"2\nCông thức cho phiên bản beta là: (Cov)/(Var) hoặc (0,003)/(0,058) = 0,89.\nstock,marketmarket\n(Mô-đun 84.1, LOS 84.e)"},{"n":43,"q":"Consider a stock selling for $23 that is expected to increase in price to $27 by the end of the\nyear and pay a $0.50 dividend. If the risk-free rate is 4%, the expected return on the market\nis 8.5%, and the stock's beta is 1.9, what is the current valuation of the stock? The stock:","opts":["is correctly valued.","is overvalued.","is undervalued."],"ans":"C","expl":"Lợi tức yêu cầu dựa trên rủi ro hệ thống được tính toán như: ER = R + (ER – R) ×\nstockfMf\nBeta hoặc 0,04 + (0,085 – 0,04) × 1,9 = 0,1255 hoặc 12,6%. Lợi nhuận kỳ vọng là\nstock\nđược tính như sau: (P – P + D) / P hoặc ($27 – $23 + $0,50) / $23 = 0,1957 hoặc 19,6%. Cổ phiếu\n1010\nnằm trên đường thị trường chứng khoán ER > RR nên bị định giá thấp.\n(Module 84.2, LOS 84.h)"},{"n":44,"q":"The expected rate of return is 2.5 times the 12% expected rate of return from the market.\nWhat is the beta if the risk-free rate is 6%?","opts":["3.","5.","4."],"ans":"C","expl":"30 = 6 + β (12 - 6)\n24 = 6β\nβ = 4\n(Mô-đun 84.1, LOS 84.e)"},{"n":45,"q":"Which of the following statements about the security market line (SML) and capital market\nline (CML) is most accurate?","opts":["The SML involves the concept of a risk-free asset, but the CML does not.","The SML uses beta, but the CML uses standard deviation as the risk measure.","Both the SML and CML can be used to explain a stock’s expected return."],"ans":"B","expl":"SML và CML đều giao nhau với trục tung ở mức không có rủi ro. SML mô tả\nsự đánh đổi rủi ro/lợi nhuận cho từng chứng khoán hoặc danh mục đầu tư riêng lẻ, trong khi CML mô tả\nsự đánh đổi rủi ro/lợi nhuận của các kết hợp khác nhau của danh mục thị trường và một\ntài sản không rủi ro.\n(Module 84.2, LOS 84.f)"},{"n":46,"q":"Given the following data, what is the correlation coefficient between the two stocks and the\nBeta of stock A?\nstandard deviation of returns of Stock A is 10.04%\nstandard deviation of returns of Stock B is 2.05%\nstandard deviation of the market is 3.01%\ncovariance between the two stocks is 0.00109\ncovariance between the market and stock A is 0.002","opts":["0.5296 | 0.06","0.5296 | 2.20","0.6556 | 2.20"],"ans":"B","expl":"hệ số tương quan = 0,00109 / (0,0205)(0,1004) = 0,5296.\nbeta của kho hàng A = hiệp phương sai giữa chứng khoán và thị trường / phương sai của thị trường\n2\nBeta = 0,002 / 0,0301 = 2,2\n(Mô-đun 84.1, LOS 84.e)","qhtml":"<p>Given the following data, what is the correlation coefficient between the two stocks and the Beta of stock A?</p><table class=\"qtable\"><thead><tr><th>Item</th><th>Value</th></tr></thead><tbody><tr><td>Standard deviation of returns of Stock A</td><td>10.04%</td></tr><tr><td>Standard deviation of returns of Stock B</td><td>2.05%</td></tr><tr><td>Standard deviation of the market</td><td>3.01%</td></tr><tr><td>Covariance between the two stocks</td><td>0.00109</td></tr><tr><td>Covariance between the market and stock A</td><td>0.002</td></tr></tbody></table>","cols":["Correlation Coefficient","Beta (Stock A)"]},{"n":47,"q":"When the market is in equilibrium, all:","opts":["assets plot on the CML.","assets plot on the SML.","investors hold the market portfolio."],"ans":"B","expl":"Khi thị trường ở trạng thái cân bằng, lợi nhuận kỳ vọng bằng lợi nhuận yêu cầu. Vì\ncó nghĩa là tất cả nội dung đều được định giá chính xác nên tất cả nội dung đều được biểu thị trên SML.\nTheo định nghĩa, tất cả cổ phiếu và danh mục đầu tư không phải danh mục thị trường đều nằm dưới CML.\n(Chỉ danh mục đầu tư thị trường là hiệu quả.)\n(Mô-đun 84.2, LOS 84.f)"},{"n":48,"q":"An analyst collected the following data for three possible investments. Alpha Corporation\nhas a beta of 1.6, Omega Company has a beta of 1.2, and Lambda, Inc. has a beta of 0.5.\nThe expected return on the market is –3% and the risk-free rate is 4%. Assuming that capital\nmarkets are in equilibrium, which stock has the highest expected return?","opts":["Omega.","Alpha.","Lambda."],"ans":"C","expl":"Sự sụt giảm dự kiến trên toàn thị trường cho thấy cổ phiếu có beta\n(Lambda) thấp nhất và do đó, mức độ nhạy cảm ít nhất với thị trường sẽ có mức cao nhất\ntỷ suất lợi nhuận dự kiến.\nRR = R + (R – R) × Beta, trong đó RR = lợi nhuận yêu cầu, R\nStockfMarketfStockf = lãi suất phi rủi ro và\nR = tỷ suất lợi nhuận thị trường\nThị trường\nAlpha: 4% + 1,6(–3% – 4%) = –7,2%\nOmega: 4% + 1,2(–3% – 4%) = –4,4%\nLambda: 4% + 0,5(–3% – 4%) = +0,5%\n(Mô-đun 84.2, LOS 84.h)"},{"n":49,"q":"According to the capital asset pricing model (CAPM):","opts":["all investors who take on risk will hold the same risky-asset portfolio.","a stock with high risk, measured as standard deviation of returns, will have high expected returns in equilibrium.","an investor who is risk averse should hold at least some of the risk-free asset in his portfolio."],"ans":"A","expl":"Một trong những giả định của CAPM là tất cả các nhà đầu tư nắm giữ tài sản rủi ro sẽ nắm giữ\ncùng một danh mục tài sản rủi ro (danh mục đầu tư thị trường). Tránh rủi ro có nghĩa là nhà đầu tư\nsẽ chỉ chấp nhận rủi ro nhiều hơn nếu được bù đắp bằng lợi nhuận kỳ vọng cao hơn. Trong lý thuyết thị trường vốn\n, tất cả các nhà đầu tư đều thể hiện ác cảm rủi ro, ngay cả nhà đầu tư bán khống tài sản phi rủi ro.\nTrong CAPM, rủi ro của một cổ phiếu được đo bằng hệ số beta chứ không phải độ lệch chuẩn của lợi nhuận.\n(Module 84.2, LOS 84.f)"},{"n":50,"q":"In the context of the CML, the market portfolio includes:","opts":["12-18 stocks needed to provide maximum diversification.","all existing risky assets.","the risk-free asset."],"ans":"B","expl":"Danh mục đầu tư thị trường phải chứa tất cả các cổ phiếu, trái phiếu và tài sản rủi ro đang tồn tại.\nBởi vì danh mục đầu tư này có tất cả các tài sản rủi ro trong đó nên nó đại diện cho tài sản cuối cùng hoặc hoàn toàn\ndanh mục đầu tư đa dạng.\n(Mô-đun 84.1, LOS 84.b)"},{"n":51,"q":"What is the risk measure associated with the CML?","opts":["Beta.","Market risk.","Standard deviation."],"ans":"C","expl":"Trong bối cảnh CML, thước đo rủi ro (trục x) là tổng rủi ro hoặc độ lệch chuẩn.\nBeta (rủi ro hệ thống) được dùng để đo lường rủi ro cho đường thị trường chứng khoán (SML).\n(Mô-đun 84.1, LOS 84.b)"},{"n":52,"q":"When a risk-free asset is combined with a portfolio of risky assets, which of the following is\nleast accurate?","opts":["The variance of the resulting portfolio is a weighted average of the returns variances of the risk-free asset and of the portfolio of risky assets.","The expected return for the newly created portfolio is the weighted average of the return on the risk-free asset and the expected return on the risky asset portfolio.","The standard deviation of the return for the newly created portfolio is the standard deviation of the returns of the risky asset portfolio multiplied by its portfolio weight."],"ans":"A","expl":"Tuyên bố này không đúng; độ lệch chuẩn của lợi nhuận cho danh mục đầu tư kết quả\nlà trung bình có trọng số của độ lệch chuẩn lợi nhuận của tài sản phi rủi ro (không) và\nđộ lệch chuẩn lợi nhuận của danh mục tài sản rủi ro.\n(Mô-đun 84.1, LOS 84.a)"},{"n":53,"q":"Which of the following is the vertical axis intercept for the Capital Market Line (CML)?","opts":["Expected return on the market.","Risk-free rate.","Expected return on the portfolio."],"ans":"B","expl":"CML bắt nguồn từ trục tung từ điểm lãi suất phi rủi ro.\n(Mô-đun 84.1, LOS 84.b)"},{"n":54,"q":"A portfolio's excess return per unit of systematic risk is known as its:","opts":["Jensen’s alpha.","Sharpe ratio.","Treynor measure."],"ans":"C","expl":"Thước đo Treynor là lợi nhuận vượt mức so với beta. Tỷ lệ Sharpe đo lường lợi nhuận\nvượt quá so với độ lệch chuẩn. Hệ số alpha của Jensen đo lường lợi nhuận vượt trội của danh mục đầu tư\nso với lợi nhuận của danh mục đầu tư trên SML có cùng hệ số beta.\n(Mô-đun 84.2, LOS 84.i)"},{"n":55,"q":"In Fama and French's multifactor model, the expected return on a stock is explained by:","opts":["excess return on the market portfolio, book-to-market ratio, and price momentum.","firm size, book-to-market ratio, and excess return on the market portfolio.","firm size, book-to-market ratio, and price momentum."],"ans":"B","expl":"Trong mô hình Fama và French, ba yếu tố giải thích lợi nhuận cổ phiếu riêng lẻ là\nquy mô công ty, tỷ lệ giá trị sổ sách trên giá trị thị trường của công ty và lợi nhuận vượt trội trên thị trường\ndanh mục đầu tư. Mô hình Carhart bổ sung đà tăng giá như một yếu tố thứ tư.\n(Mô-đun 84.1, LOS 84.d)"},{"n":56,"q":"Which of the following statements about systematic and unsystematic risk is most accurate?","opts":["As an investor increases the number of stocks in a portfolio, the systematic risk will remain constant.","The unsystematic risk for a specific firm is similar to the unsystematic risk for other firms.","Total risk equals market risk plus firm-specific risk."],"ans":"C","expl":"Tổng rủi ro bằng hệ thống (thị trường) cộng rủi ro phi hệ thống (cụ thể của công ty).\nRủi ro phi hệ thống đối với một công ty cụ thể không giống với rủi ro phi hệ thống đối với các công ty\nkhác trong cùng ngành. Rủi ro phi hệ thống là rủi ro đặc thù của công ty hoặc rủi ro duy nhất.\nRủi ro hệ thống của danh mục đầu tư có thể được thay đổi bằng cách thêm các cổ phiếu có hệ số beta cao hoặc hệ số beta thấp.\n(Mô-đun 84.1, LOS 84.c)"},{"n":57,"q":"A higher Sharpe ratio indicates:","opts":["a higher excess return per unit of risk.","a lower risk per unit of return.","lower volatility of returns."],"ans":"A","expl":"Tỷ lệ Sharpe là lợi nhuận vượt quá (lợi nhuận – R) trên mỗi đơn vị rủi ro (được định nghĩa là\nf\nđộ lệch lợi nhuận tiêu chuẩn).\n(Mô-đun 84.2, LOS 84.i)"},{"n":58,"q":"Bruce Johansen, CFA, is fully invested in the market portfolio. Johansen desires to increase\nthe expected return from his portfolio. According to capital market theory, Johansen can\nmeet his return objective by:","opts":["borrowing at the risk-free rate to invest in the risky market portfolio.","allocating a higher proportion of the portfolio to higher risk assets.","owning the risky market portfolio and lending at the risk-free rate."],"ans":"A","expl":"Đầu tư dựa trên lợi nhuận trên thị trường sẽ làm tăng cả rủi ro và lợi nhuận kỳ vọng của danh mục đầu tư.\nChiến lược này sẽ có hiệu quả về phương sai trung bình. Các chiến lược khác như chuyển một phần\ntrong tổng vốn sang tài sản có rủi ro cao hơn sẽ đạt được mục tiêu lợi nhuận cao hơn nhưng sẽ khiến\ndanh mục đầu tư ở dưới CML và do đó sẽ không phải là chiến lược tối ưu.\n(Module 84.1, LOS 84.b)"},{"n":59,"q":"The slope of the capital market line (CML) is a measure of the level of:","opts":["excess return per unit of risk.","expected return over the level of inflation.","risk over the level of excess return."],"ans":"A","expl":"Độ dốc của CML biểu thị lợi nhuận vượt mức (lợi nhuận kỳ vọng trừ lãi suất phi rủi ro)\ntrên mỗi đơn vị rủi ro.\n(Học phần 84.1, LOS 84.b)"},{"n":60,"q":"In equilibrium, investors should only expect to be compensated for bearing systematic risk\nbecause:","opts":["individual securities in equilibrium only have systematic risk.","nonsystematic risk can be eliminated by diversification.","systematic risk is specific to the securities the investor selects."],"ans":"B","expl":"Ở trạng thái cân bằng, nhà đầu tư không nên kỳ vọng kiếm thêm lợi nhuận khi chịu\nrủi ro phi hệ thống vì rủi ro này có thể được loại bỏ bằng cách đa dạng hóa. Chứng khoán\nriêng lẻ có cả rủi ro hệ thống và rủi ro phi hệ thống. Rủi ro hệ thống là rủi ro thị trường;\nrủi ro phi hệ thống dành riêng cho từng chứng khoán.\n(Mô-đun 84.1, LOS 84.c)"},{"n":61,"q":"A portfolio to the right of the market portfolio on the capital market line (CML) is created by:","opts":["fully diversifying.","holding both the risk-free asset and the market portfolio.","holding more than 100% of the risky asset."],"ans":"C","expl":"Các danh mục đầu tư nằm bên phải danh mục đầu tư thị trường trên đường thị trường vốn được tạo ra\nbằng cách vay vốn để sở hữu hơn 100% danh mục đầu tư thị trường (M).\nTuyên bố \"nắm giữ cả tài sản phi rủi ro và danh mục đầu tư thị trường\" đề cập đến\ndanh mục đầu tư nằm ở bên trái danh mục đầu tư thị trường. Các danh mục đầu tư nằm ở bên trái điểm M\nđược tạo ra bằng cách cho vay vốn (hoặc mua tài sản phi rủi ro). Những nhà đầu tư này sở hữu ít hơn\n100% cả danh mục đầu tư thị trường và tài sản không rủi ro. Danh mục đầu tư tại điểm R\nf\n(giao điểm của CML và trục y) được tạo bằng cách nắm giữ 100% tài sản không rủi ro.\nTuyên bố \"đa dạng hóa hoàn toàn\" không chính xác vì danh mục đầu tư thị trường hoàn toàn\nđa dạng hóa.\n(Học phần 84.1, LOS 84.b)"},{"n":62,"q":"The market portfolio in Capital Market Theory is determined by:","opts":["the intersection of the efficient frontier and the investor's highest utility curve.","a line tangent to the efficient frontier, drawn from any point on the expected return axis.","a line tangent to the efficient frontier, drawn from the risk-free rate of return."],"ans":"C","expl":"Đường Thị trường Vốn là một đường thẳng được vẽ từ tỷ suất lợi nhuận phi rủi ro (trên trục Y\n) thông qua danh mục thị trường. Danh mục đầu tư thị trường được xác định khi đường thẳng\ntiếp xúc chính xác với đường biên hiệu quả.\n(Mô-đun 84.1, LOS 84.b)"},{"n":63,"q":"An analyst has estimated the following:\nCorrelation of Bahr Industries returns with market returns = 0.8\nVariance of the market returns = 0.0441\nVariance of Bahr returns = 0.0225\nThe beta of Bahr Industries stock is closest to:","opts":["0.67.","0.57.","0.77."],"ans":"B","expl":"√√\n0,8×0,0225×0,0441=0,0252\nHiệp phương sai của Bahr và thị trường =\nBahr beta = 0,0252/0,0441= 0,57\n(Mô-đun 84.1, LOS 84.e)"},{"n":64,"q":"Which of the following is least likely considered a source of systematic risk for bonds?","opts":["Default risk.","Purchasing power risk.","Market risk."],"ans":"A","expl":"Rủi ro vỡ nợ dựa trên rủi ro cụ thể của công ty hoặc rủi ro phi hệ thống.\n(Mô-đun 84.1, LOS 84.c)"},{"n":65,"q":"For an investor to move further up the Capital Market Line than the market portfolio, the\ninvestor must:","opts":["reduce the portfolio's risk below that of the market.","diversify the portfolio even more.","borrow and invest in the market portfolio."],"ans":"C","expl":"Các danh mục đầu tư nằm bên phải danh mục thị trường trên đường thị trường vốn (\"lên\"\nđường thị trường vốn) được tạo bằng cách vay vốn để sở hữu hơn 100% thị trường\ndanh mục đầu tư (M).\nTuyên bố \"đa dạng hóa danh mục đầu tư hơn nữa\" là không chính xác vì danh mục đầu tư\nthị trường đã được đa dạng hóa hoàn toàn.\n(Module 84.1, LOS 84.b)"},{"n":66,"q":"In equilibrium, an inefficient portfolio will plot:","opts":["below the CML and on the SML.","on the CML and below the SML.","below the CML and below the SML."],"ans":"A","expl":"Một danh mục đầu tư kém hiệu quả sẽ nằm dưới CML. Ở trạng thái cân bằng, tất cả danh mục đầu tư sẽ vẽ trên\nSML.\n(Mô-đun 84.2, LOS 84.f)"},{"n":67,"q":"Mason Snow, CFA, is considering two stocks: Bahre (with an expected return of 10% and a\nbeta of 1.4) and Cubb (with an expected return of 15% and a beta of 2.0). Snow uses a risk-\nfree of 7% and estimates that the market risk premium is 4%. Based on capital market\ntheory, Snow should conclude that:","opts":["neither security is underpriced.","only Bahre is underpriced.","only Cubb is underpriced."],"ans":"A","expl":"Trong Trong bối cảnh SML, một chứng khoán được định giá thấp nếu lợi nhuận yêu cầu nhỏ hơn lợi tức\nthời gian nắm giữ (hoặc dự kiến), được định giá quá cao nếu lợi tức yêu cầu lớn hơn\nlợi nhuận thời gian nắm giữ (hoặc dự kiến) và được định giá chính xác nếu lợi nhuận yêu cầu bằng\nlợi nhuận thời gian nắm giữ (hoặc dự kiến).\nBahre: Lợi nhuận kỳ vọng = 10% < CAPM Lợi nhuận bắt buộc R = 0,07 + (1,4)(0,11-0,07) = 12,6%\nvà được định giá quá cao.\nĐối với Cubb: Lợi nhuận kỳ vọng = 15% = CAPM Lợi nhuận yêu cầu = 0,07 + (2,0)(0,11-0,07) = 15%.\n(Module 84.2, LOS 84.h)"},{"n":68,"q":"Portfolios that represent combinations of the risk-free asset and the market portfolio are\nplotted on the:","opts":["capital asset pricing line.","utility curve.","capital market line."],"ans":"C","expl":"Việc đưa vào tài sản phi rủi ro sẽ thay đổi đường biên hiệu quả Markowitz thành một đường thẳng\n. Đường biên giới hiệu quả thẳng này được gọi là đường thị trường vốn (CML). Các nhà đầu tư tại\nđiểm Rf có 100% số tiền đầu tư vào tài sản phi rủi ro. Các nhà đầu tư tại điểm M có\n100% vốn đầu tư vào danh mục thị trường M. Giữa Rf và M, các nhà đầu tư nắm giữ cả\ntài sản phi rủi ro và danh mục đầu tư M. Ở bên phải M, các nhà đầu tư nắm giữ hơn 100%\ndanh mục đầu tư M. Tất cả các nhà đầu tư phải làm để có được sự kết hợp rủi ro và lợi nhuận phù hợp với họ\nchỉ đơn giản là thay đổi tỷ lệ đầu tư của họ trong danh mục đầu tư rủi ro M và tài sản không có rủi ro\n.\nĐường cong hữu dụng phản ánh sở thích cá nhân.\n(Mô-đun 84.1, LOS 84.b)"},{"n":69,"q":"According to capital market theory, which of the following represents the risky portfolio that\nshould be held by all investors who desire to hold risky assets?","opts":["The point of tangency between the capital market line (CML) and the efficient frontier.","Any point on the efficient frontier and to the right of the point of tangency between the CML and the efficient frontier.","Any point on the efficient frontier and to the left of the point of tangency between the CML and the efficient frontier."],"ans":"A","expl":"Lý thuyết thị trường vốn cho thấy rằng tất cả các nhà đầu tư nên đầu tư vào cùng một danh mục đầu tư\ntài sản rủi ro và danh mục đầu tư này nằm ở điểm tiếp tuyến của CML và\nbiên giới hiệu quả của tài sản rủi ro. Bất kỳ điểm nào bên dưới CML đều là dưới mức tối ưu và các điểm trên\nCML đều không khả thi.\n(Mô-đun 84.1, LOS 84.b)"},{"n":70,"q":"An active manager will most likely short a security with an expected Jensen's alpha that is:","opts":["negative.","positive.","zero."],"ans":"A","expl":"Giá trị alpha Jensen dự kiến của chứng khoán là chênh lệch giữa ước tính\ncủa người quản lý đang hoạt động về lợi nhuận kỳ vọng của chứng khoán và lợi tức kỳ vọng CAPM. Chứng khoán\ndự kiến ​​có alpha âm sẽ hiển thị bên dưới SML (tức là chứng khoán được định giá quá cao\nvà nên được bán hoặc bán khống).\n(Mô-đun 84.2, LOS 84.i)"},{"n":71,"q":"A stock that plots below the Security Market Line most likely:","opts":["is overvalued.","has a beta less than one.","is below the efficient frontier."],"ans":"A","expl":"Vì phương trình của SML là mô hình định giá tài sản vốn nên bạn có thể xác định xem một\ncổ phiếu được định giá quá cao hay quá thấp về mặt đồ thị hoặc toán học. Câu trả lời của bạn sẽ luôn\ngiống nhau.\nVề mặt đồ thị: Nếu bạn vẽ biểu đồ lợi nhuận kỳ vọng của một cổ phiếu trên SML và nó nằm dưới đường này, thì điều đó\ncho thấy rằng cổ phiếu đó hiện đang được định giá quá cao, khiến lợi tức kỳ vọng của nó quá thấp. Nếu\nđồ thị nằm phía trên đường kẻ, điều đó cho thấy cổ phiếu đang được định giá thấp. Nếu đồ thị rơi vào\nSML, điều đó cho thấy cổ phiếu được định giá hợp lý.\nVề mặt toán học: Trong ngữ cảnh của SML, một chứng khoán được định giá thấp nếu lợi nhuận yêu cầu\nthấp hơn lợi nhuận thời gian nắm giữ (hoặc dự kiến), được định giá quá cao nếu lợi nhuận yêu cầu\nlớn hơn lợi tức thời gian nắm giữ (hoặc dự kiến) và được định giá chính xác nếu lợi nhuận yêu cầu\nreturn bằng với lợi nhuận trong thời gian nắm giữ (hoặc dự kiến).\n(Mô-đun 84.2, LOS 84.h)"},{"n":72,"q":"In the context of the capital market line (CML), which of the following statements is\nCORRECT?","opts":["Firm-specific risk can be reduced through diversification.","Market risk can be reduced through diversification.","The two classes of risk are market risk and systematic risk."],"ans":"A","expl":"Các câu lệnh khác là sai. Rủi ro thị trường không thể giảm thiểu thông qua đa dạng hóa;\nrủi ro thị trường = rủi ro hệ thống. Hai loại rủi ro là rủi ro phi hệ thống và rủi ro\ncó hệ thống.\n(Mô-đun 84.1, LOS 84.c)"},{"n":73,"q":"A stock has a beta of 1.55 and an expected return of 17.3%. If the risk-free rate is 8%, the\nexpected market risk premium is:","opts":["12.0%.","14.0%.","6.0%."],"ans":"C","expl":"17,3 = 8 + 1,55(MRP)\n9,3 = 1,55(MRP)\nMRP = 9,3 / 1,55 = 6\n(Mô-đun 84.2, LOS 84.g)"},{"n":74,"q":"The correlation of returns on the risk-free asset with returns on a portfolio of risky assets is:","opts":["negative.","positive.","zero."],"ans":"C","expl":"Tài sản phi rủi ro không có mối tương quan về lợi nhuận với bất kỳ danh mục tài sản rủi ro nào.\n(Mô-đun 84.1, LOS 84.a)"},{"n":75,"q":"An analyst wants to determine whether Dover Holdings is overvalued or undervalued, and\nby how much (expressed as percentage return). The analyst gathers the following\ninformation on the stock:\nMarket standard deviation = 0.70\nCovariance of Dover with the market = 0.85\nDover's current stock price (P) = $35.00\n0\nThe expected price in one year (P) is $39.00\n1\nExpected annual dividend = $1.50\n3-month Treasury bill yield = 4.50%.\nHistorical average S&P 500 return = 12.0%.\nDover Holdings stock is:","opts":["undervalued by approximately 2.1%.","overvalued by approximately 1.8%.","undervalued by approximately 1.8%."],"ans":"B","expl":"Để xác định xem một cổ phiếu được định giá quá cao hay bị định giá thấp, chúng ta cần so sánh\nlợi nhuận dự kiến (hoặc lợi nhuận trong thời gian nắm giữ) và lợi nhuận yêu cầu (từ Tài sản vốn\nMô hình định giá hoặc CAPM).\nBước 1: Tính lợi tức kỳ vọng (Lợi nhuận kỳ giữ)\nCông thức tính lợi nhuận trong thời gian nắm giữ (một năm) là:\nHPR = (D + S – S) / S, trong đó D = cổ tức và S = giá cổ phiếu.\n1100\nỞ đây, HPR = (1,50 + 39 – 35) / 35 = 15,71%\nBước 2: Tính lợi nhuận yêu cầu\nCông thức tính lợi nhuận yêu cầu lấy từ CAPM:\nRR = R + (ER – R) × Beta\nfMf\nTại đây, chúng tôi được cung cấp thông tin mình cần ngoại trừ Beta. Hãy nhớ rằng Beta có thể được\n2\nđược tính bằng: Beta = [cov] / [σ].\nstockS,MM\n2\nỞ đây chúng ta có tử số và mẫu số, vì vậy phép tính là: 0,85 / 0,70 =\n1,73. RR = 4,50% + (12,0 – 4,50%) × 1,73 = 17,48%.\nBước 3: Xác định mức định giá trên/dưới mức định giá\nLợi nhuận yêu cầu lớn hơn lợi nhuận dự kiến, do đó chứng khoán được định giá quá cao.\nSố tiền = 17,48% – 15,71% = 1,77%.\n(Mô-đun 84.2, LOS 84.h)","qhtml":"<p>An analyst wants to determine whether Dover Holdings is overvalued or undervalued, and by how much (expressed as percentage return). The analyst gathers the following information on the stock:</p><ul><li>Market standard deviation = 0.70</li><li>Covariance of Dover with the market = 0.85</li><li>Dover's current stock price (P<sub>0</sub>) = $35.00</li><li>The expected price in one year (P<sub>1</sub>) is $39.00</li><li>Expected annual dividend = $1.50</li><li>3-month Treasury bill yield = 4.50%.</li><li>Historical average S&amp;P 500 return = 12.0%.</li></ul><p>Dover Holdings stock is:</p>"},{"n":76,"q":"Consider the following graph of the Security Market Line (SML). The letters X, Y, and Z\nrepresent risky asset portfolios and an analyst's forecast for their returns over the next\nperiod. The SML crosses the y-axis at 0.07.\nA graph depicting the Security Market Line (SML),\nshowing expected return (ER) versus beta, with three assets (X, Y, and Z) plotted. Asset Y lies\non the SML, while X is above and Z is on the line, indicating potential overvaluation or\nundervaluation relative to the Capital Asset Pricing Model.\nThe expected market return is 13.0%.\nUsing the graph above and the information provided, the analyst most likely believes that:","opts":["Portfolio X's required return is greater than its forecast return.","Portfolio Y is undervalued.","the expected return for Portfolio Z is 14.8%."],"ans":"C","expl":"Danh mục đầu tư Z có beta là 1,3 và lợi tức yêu cầu của nó có thể được tính như sau 7,0% + 1,3 ×\n(13,0% − 7,0%) = 14,8%. Vì nó vẽ đồ thị trên SML nên lợi nhuận (dự báo) dự kiến ​​và\nlợi nhuận yêu cầu đều bằng nhau.\nSML vẽ đồ thị beta (rủi ro hệ thống) so với lợi nhuận cân bằng (bắt buộc) dự kiến. Nhà phân tích\ntin rằng Danh mục đầu tư Y được định giá quá cao – bất kỳ danh mục đầu tư nào nằm dưới SML đều có lợi nhuận dự báo\nthấp hơn lợi nhuận yêu cầu của nó và được định giá quá cao trên thị trường. Vì\nDanh mục X nằm phía trên SML nên nó bị định giá thấp và tuyên bố sẽ có nội dung:\n\"Lợi nhuận yêu cầu của Danh mục X nhỏ hơn lợi nhuận dự báo của nó.\"\n(Mô-đun 84.2, LOS 84.h)"},{"n":77,"q":"Which of the following statements about risk is NOT correct?","opts":["The market portfolio has only systematic risk.","Total risk = systematic risk - unsystematic risk.","Unsystematic risk is diversifiable risk."],"ans":"B","expl":"Rủi ro tổng cộng = rủi ro hệ thống + rủi ro phi hệ thống\n(Mô-đun 84.1, LOS 84.c)"},{"n":78,"q":"An equally weighted portfolio of a risky asset and a risk-free asset will exhibit:","opts":["half the returns standard deviation of the risky asset.","less than half the returns standard deviation of the risky asset.","more than half the returns standard deviation of the risky asset."],"ans":"A","expl":"Một tài sản phi rủi ro có độ lệch chuẩn của lợi nhuận bằng 0 và mối tương quan giữa\nlợi nhuận với bất kỳ tài sản rủi ro nào cũng bằng 0. Kết quả là, độ lệch chuẩn của\nlợi nhuận của danh mục đầu tư gồm tài sản rủi ro và tài sản không rủi ro bằng với trọng số của\ntài sản rủi ro nhân với độ lệch chuẩn lợi nhuận của nó. Đối với một danh mục đầu tư\ncó trọng số bằng nhau, trọng số của tài sản rủi ro là 0,5 và độ lệch chuẩn danh mục đầu tư là 0,5 ×\nđộ lệch chuẩn của lợi nhuận của tài sản rủi ro.\n(Mô-đun 84.1, LOS 84.a)"},{"n":79,"q":"The market model of the expected return on a risky security is best described as a(n):","opts":["arbitrage-based model.","two-factor model.","single-factor model."],"ans":"C","expl":"Mô hình thị trường là mô hình một yếu tố. Yếu tố duy nhất là lợi nhuận vượt mức dự kiến\ntrên danh mục thị trường hoặc [E(R) – RFR].\nm\n(Mô-đun 84.1, LOS 84.d)"},{"n":80,"q":"A portfolio manager is constructing a new equity portfolio consisting of a large number of\nrandomly chosen domestic stocks. As the number of stocks in the portfolio increases, what\nhappens to the expected levels of systematic and unsystematic risk?","opts":["Remains the same | Decreases","Decreases | Increases","Increases | Remains the same"],"ans":"A","expl":"Khi các chứng khoán được chọn ngẫu nhiên được thêm vào danh mục đầu tư, rủi ro có thể đa dạng hóa (không có hệ thống)\nsẽ giảm và mức rủi ro không thể đa dạng hóa (có hệ thống) dự kiến vẫn là\ntương tự.\n(Mô-đun 84.1, LOS 84.c)","cols":["Systematic risk","Unsystematic risk"]},{"n":81,"q":"The expected rate of return is twice the 12% expected rate of return from the market. What\nis the beta if the risk-free rate is 6%?","opts":["2.","3.","4."],"ans":"B","expl":"24 = 6 + β (12 – 6)\n18 = 6β\nβ = 3\n(Mô-đun 84.1, LOS 84.e)"},{"n":82,"q":"Which of the following statements regarding the Sharpe ratio is most accurate? The Sharpe\nratio measures:","opts":["excess return per unit of risk.","peakedness of a return distribution.","total return per unit of risk."],"ans":"A","expl":"Tỷ lệ Sharpe đo lường lợi nhuận vượt mức trên mỗi đơn vị rủi ro. Hãy nhớ rằng tử số\ncủa tỷ lệ Sharpe là (lợi nhuận danh mục đầu tư – lãi suất phi rủi ro), do đó tầm quan trọng của lợi nhuận\nvượt quá. Lưu ý rằng mức phân bổ lợi nhuận đạt đỉnh được đo bằng độ nhọn.\n(Mô-đun 84.2, LOS 84.i)"},{"n":83,"q":"An investor believes Stock M will rise from a current price of $20 per share to a price of $26\nper share over the next year. The company is not expected to pay a dividend. The following\ninformation pertains:\nR = 8%\nF\nER = 16%\nM\nBeta = 1.7\nShould the investor purchase the stock?","opts":["No, because it is overvalued.","No, because it is undervalued.","Yes, because it is undervalued."],"ans":"C","expl":"Trong bối cảnh của SML, một chứng khoán được định giá thấp nếu lợi tức yêu cầu nhỏ hơn lợi tức\nthời gian nắm giữ (hoặc dự kiến), được định giá quá cao nếu lợi tức yêu cầu lớn hơn\nlợi tức thời gian nắm giữ (hoặc dự kiến) và được định giá chính xác nếu lợi tức yêu cầu bằng\nlợi nhuận thời gian nắm giữ (hoặc dự kiến).\nỞ đây, lợi tức thời gian nắm giữ (hoặc dự kiến) được tính như sau: (giá kết thúc – giá đầu\n + bất kỳ dòng tiền/cổ tức nào) / giá bắt đầu. Lợi nhuận yêu cầu sử dụng phương trình\ncủa SML: lãi suất phi rủi ro + Beta × (lãi suất thị trường dự kiến ​​− lãi suất phi rủi ro).\nER = (26 – 20) / 20 = 0,30 hoặc 30%, RR = 8 + (16 – 8) × 1,7 = 21,6%. Cổ phiếu được định giá thấp\ndo đó hãy mua.\n(Mô-đun 84.2, LOS 84.h)","qhtml":"<p>An investor believes Stock M will rise from a current price of $20 per share to a price of $26 per share over the next year. The company is not expected to pay a dividend. The following information pertains:</p><ul><li>R<sub>F</sub> = 8%</li><li>ER<sub>M</sub> = 16%</li><li>Beta = 1.7</li></ul><p>Should the investor purchase the stock?</p>"},{"n":84,"q":"Which of the following measures produces the same portfolio rankings as the Sharpe ratio\nbut is stated in percentage terms?","opts":["Jensen’s alpha.","M-squared.","Treynor measure."],"ans":"B","expl":"M-squared đo lường lợi nhuận vượt trội của danh mục đầu tư có đòn bẩy so với thị trường\ndanh mục đầu tư và tạo ra thứ hạng danh mục đầu tư giống như tỷ lệ Sharpe.\n(Mô-đun 84.2, LOS 84.i)"},{"n":85,"q":"All portfolios that lie on the capital market line:","opts":["have some unsystematic risk unless only the risk-free asset is held.","contain the same mix of risky assets unless only the risk-free asset is held.","contain at least some positive allocation to the risk-free asset."],"ans":"B","expl":"Tất cả danh mục đầu tư trên CML đều bao gồm cùng một danh mục đầu tư tiếp tuyến gồm các tài sản rủi ro, ngoại trừ\nintercept (tất cả đều được đầu tư vào tài sản không có rủi ro). Danh mục đầu tư tiếp tuyến không chứa tài sản phi rủi ro\nvà \"danh mục đầu tư đi vay\" có thể được xây dựng với sự phân bổ âm cho\ntài sản phi rủi ro. Danh mục đầu tư trên CML hiệu quả (đa dạng hóa tốt) và không có\nrủi ro phi hệ thống.\n(Mô-đun 84.1, LOS 84.c)"},{"n":86,"q":"A portfolio of options had a return of 22% with a standard deviation of 20%. If the risk-free\nrate is 7.5%, what is the Sharpe ratio for the portfolio?","opts":["0.725.","0.568.","0.147."],"ans":"A","expl":"Tỷ lệ sắc nét = (22% – 7,50%) / 20%
