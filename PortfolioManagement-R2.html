<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Given the following information, what is the required rate of return on Bin Co?\ninflation premium = 3%\nreal risk-free rate = 2%\nBin Co. beta = 1.3\nmarket risk premium = 4%", "opts": ["16.7%.", "10.2%.", "7.6%."], "ans": "B", "expl": "Use the capital asset pricing model (CAPM) to find the required rate of return. The\napproximate risk-free rate of interest is 5% (2% real risk-free rate + 3% inflation premium).\nk = 5% + 1.3(4%) = 10.2%.\n(Module 84.2, LOS 84.g)"}, {"n": 2, "q": "Which of the following is an assumption of capital market theory? All investors:", "opts": ["have multiple-period time horizons.", "see the same risk/return distribution for a given stock.", "select portfolios that lie above the efficient frontier to optimize the risk-return relationship."], "ans": "B", "expl": "All investors select portfolios that lie along the efficient frontier, based on their utility\nfunctions. All investors have the same one-period time horizon, and have the same\nrisk/return expectations.\n(Module 84.2, LOS 84.f)"}, {"n": 3, "q": "If the risk-free rate of return is 3.5%, the expected market return is 9.5%, and the beta of a\nstock is 1.3, what is the required return on the stock according to the capital asset pricing\nmodel?", "opts": ["11.3%.", "12.4%.", "7.8%."], "ans": "A", "expl": "The formula for the required return is: ER = R + (E – R) × Beta\nstockfRMfstock\nor 0.035 + 1.3 × (0.095 - 0.035) = 0.113, or 11.3%.\n(Module 84.2, LOS 84.g)"}, {"n": 4, "q": "The slope of the characteristic line is used to estimate:", "opts": ["risk aversion.", "a risk premium.", "beta."], "ans": "C", "expl": "Beta for an individual security can be estimated by the slope of its characteristic line, a\nleast-squares regression of the security's excess returns against the market's excess\nreturns.\n(Module 84.1, LOS 84.e)"}, {"n": 5, "q": "Level I CFA candidate Adeline Bass is a member of an investment club. At the next meeting,\nshe is to recommend whether or not the club should purchase the stocks of CS Industries\nand MG Consolidated. The risk-free rate is at 6% and the expected return on the market is\n15%. Prior to the meeting, Bass gathers the following information on the two stocks:\nCS IndustriesMG Consolidated\nCurrent Market Value$25$50\nExpected Market Value in One Year$30$55\nExpected Dividend$1$1\nBeta1.20.80\nBass should recommend that the club:", "opts": ["purchase both stocks.", "purchase CS only.", "purchase MG only."], "ans": "B", "expl": "In the context of the SML, a security is underpriced if the required return is less than the\nholding period (or expected) return, is overpriced if the required return is greater than the\nholding period (or expected) return, and is correctly priced if the required return equals\nthe holding period (or expected) return.\nHere, the holding period (or expected) return is calculated as: (ending price – beginning\nprice + any cash flows / dividends) / beginning price. The required return uses the\nequation of the SML: risk free rate + Beta × (expected market rate − risk-free rate).\nFor CS Industries: ER = (30 – 25 + 1) / 25 = 24%, RR = 6 + 1.2 × (15 – 6) = 16.8%. Stock\nis underpriced - purchase.\nFor MG Consolidated: ER = (55 – 50 + 1) / 50 = 12%, RR = 6 + 0.80 × (15 – 6) = 13.2%.\nStock is overpriced - do not purchase.\n(Module 84.2, LOS 84.h)"}, {"n": 6, "q": "The stock of Mia Shoes is currently trading at $15 per share, and the stock of Video Systems\nis currently trading at $18 per share. An analyst expects the prices of both stocks to increase\nby $2 over the next year and neither company pays dividends. Mia Shoes has a beta of 0.9\nand Video Systems has a beta of (-0.3). If the expected market return is 15% and the risk-free\nrate is 8%, which trading strategy does the CAPM indicate for these two stocks?", "opts": ["Mia Shoes: Buy  |  Video Systems: Buy", "Mia Shoes: Buy  |  Video Systems: Sell", "Mia Shoes: Sell  |  Video Systems: Buy"], "ans": "C", "expl": "The required return for Mia Shoes is 0.08 + 0.9 × (0.15-0.08) = 14.3%. The forecast return is\n$2/$15 = 13.3%. The stock is overvalued and the investor should sell it. The required return\nfor Video Systems is 0.08 - 0.3 × (0.15-0.08) = 5.9%. The forecast return is $2/$18 = 11.1%.\nThe stock is undervalued and the investor should buy it.\n(Module 84.2, LOS 84.h)"}, {"n": 7, "q": "Which of the following statements about portfolio management is most accurate?", "opts": ["As an investor diversifies away the unsystematic portion of risk, the correlation between his portfolio return and that of the market approaches negative one.", "Combining the capital market line (CML) (risk-free rate and efficient frontier) with an investor's indifference curve map separates out the decision to invest from the decision of what to invest in.", "The security market line (SML) measures systematic and unsystematic risk versus expected return; the CML measures total risk."], "ans": "B", "expl": "Combining the CML (risk-free rate and efficient frontier) with an investor's indifference\ncurve map separates out the decision to invest from what to invest in and is called the\nseparation theorem. The investment selection process is thus simplified from stock picking\nto efficient portfolio construction through diversification.\nThe other statements are false. As an investor diversifies away the unsystematic portion of\nrisk, the correlation between his portfolio return and that of the market approaches\npositive one. (Remember that the market portfolio has no unsystematic risk). The SML\nmeasures systematic risk, or beta risk.\n(Module 84.1, LOS 84.c)"}, {"n": 8, "q": "Over a sample period, an investor gathers the following data about three mutual funds.\nMutual FundPortfolio ReturnPortfolio Standard DeviationPortfolio Beta\nP13%18%1.2\nQ15%20%1.4\nR18%24%1.8\nThe risk-free rate is 5%. Based solely on the Sharpe measure, an investor would prefer:", "opts": ["Fund R.", "Fund Q.", "Fund P."], "ans": "A", "expl": "The Sharpe measure for a portfolio is calculated as the (mean portfolio return − mean\nreturn on the risk-free asset)/portfolio standard deviation. The Sharpe measures for the\nthree mutual funds are:\nmutual fund P = (13 − 5) / 18 = 0.44\nmutual fund Q = (15 − 5) / 20 = 0.50\nmutual fund R = (18 − 5) / 24 = 0.54\nAssuming that investors prefer return and dislike risk, they should prefer portfolios with\nlarge Sharpe ratios to those with smaller ratios. Thus, the investor should prefer mutual\nfund R.\n(Module 84.2, LOS 84.i)"}, {"n": 9, "q": "A model that estimates expected excess return on a security based on the ratio of the firm's\nbook value to its market value is best described as a:", "opts": ["market model.", "multifactor model.", "single-factor model."], "ans": "C", "expl": "A model that estimates a stock's expected excess return based only on the book-to-market\nratio is a single-factor model. The market model is a single-factor model that estimates\nexpected excess return based on a security's sensitivity to the expected excess return of\nthe market portfolio. A multifactor model would estimate expected excess return based on\nmore than one factor.\n(Module 84.1, LOS 84.d)"}, {"n": 10, "q": "Based on Capital Market Theory, an investor should choose the:", "opts": ["market portfolio on the Capital Market Line.", "portfolio that maximizes his utility on the Capital Market Line.", "portfolio with the highest return on the Capital Market Line."], "ans": "B", "expl": "Given the Capital Market Line, the investor chooses the portfolio that maximizes his utility.\nThat portfolio may be exactly the market portfolio or it may be some combination of the\nrisk-free asset and the market portfolio.\n(Module 84.1, LOS 84.b)"}, {"n": 11, "q": "Which of the following statements about the security market line (SML) is least accurate?", "opts": ["Securities plotting above the SML are undervalued.", "The independent variable in the SML equation is the standard deviation of the market portfolio.", "The SML measures risk using the standardized covariance of the stock with the market."], "ans": "B", "expl": "The SML uses either the covariance between assets and the market or beta as the\nmeasure of risk. Beta is the covariance of a stock with the market divided by the variance\nof the market. Securities that plot above the SML are undervalued and securities that plot\nbelow the SML are overvalued.\n(Module 84.2, LOS 84.h)"}, {"n": 12, "q": "What is the expected rate of return on a stock that has a beta of 1.4 if the market risk\npremium is 9% and the risk-free rate is 4%?", "opts": ["13.0%.", "11.0%.", "16.6%."], "ans": "C", "expl": "Using the security market line (SML) equation:\n4% + 1.4(9%) = 16.6%.\n(Module 84.2, LOS 84.g)"}, {"n": 13, "q": "A plot of the expected returns and standard deviations of each possible portfolio that\ncombines a risky asset and a risk-free asset will be:", "opts": ["a curve that approaches an upper limit.", "a straight line.", "convex to the origin."], "ans": "B", "expl": "The possible portfolios of a risky asset and a risk-free asset have a linear relationship\nbetween expected return and standard deviation.\n(Module 84.1, LOS 84.a)"}, {"n": 14, "q": "Which of the following is the risk that disappears in the portfolio construction process?", "opts": ["Unsystematic risk.", "Interest rate risk.", "Systematic risk."], "ans": "A", "expl": "Unsystematic risk (diversifiable risk) is the risk that is eliminated when the investor builds\na well-diversified portfolio.\n(Module 84.1, LOS 84.c)"}, {"n": 15, "q": "What is the required rate of return for a stock with a beta of 1.2, when the risk-free rate is\n6% and the market risk premium is 12%?", "opts": ["13.2%.", "15.4%.", "20.4%."], "ans": "C", "expl": "RR = R + (R - R) × Beta where RR= required return, R = return, and R = risk-\nStockfMarketfStock,f\nfree rate.\nHere, RR = 6 + (12) × 1.2 = 6 + 14.4 = 20.4%. We are given the market risk premium\nStock\nE(R) – R, not the expected return on the market.\nmktf\n(Module 84.2, LOS 84.g)"}, {"n": 16, "q": "Portfolios on the capital market line:", "opts": ["each contain different risky assets.", "include some positive allocation to the risk-free asset.", "are perfectly positively correlated with each other."], "ans": "C", "expl": "The introduction of a risk-free asset changes the Markowitz efficient frontier into a straight\nline. This straight efficient frontier line is called the capital market line (CML). Since the line\nis straight, the math implies that the returns on any two portfolios on this line will be\nperfectly, positively correlated with each other. Note: When ρ = 1, then the equation for\na,b\nrisk changes to s = Ws + Ws, which is a straight line. The risky assets for each\nportAABB\nportfolio on the CML are the same, the tangency (or market) portfolio of risky assets. The\nCML includes lending portfolios with positive allocations to the risk-free asset, the market\nportfolio with no allocation to the risk-free asset, and borrowing portfolios with negative\nallocations to the risk-free asset.\n(Module 84.1, LOS 84.b)"}, {"n": 17, "q": "Which of the following is the most accurate description of the market portfolio in Capital\nMarket Theory? The market portfolio consists of all:", "opts": ["equity securities in existence.", "risky and risk-free assets in existence.", "risky assets in existence."], "ans": "C", "expl": "The market portfolio, in theory, contains all risky assets in existence. It does not contain\nany risk-free assets.\n(Module 84.1, LOS 84.b)"}, {"n": 18, "q": "Portfolios that plot on the security market line in equilibrium:", "opts": ["have only systematic (beta) risk.", "may be concentrated in only a few stocks.", "must be well diversified."], "ans": "B", "expl": "According to the capital asset pricing model, in equilibrium all securities and portfolios\nplot on the SML. A security or portfolio is not priced in equilibrium if it plots above the SML\n(i.e., is undervalued) or below the SML (i.e., is overvalued).\n(Module 84.2, LOS 84.f)"}, {"n": 19, "q": "Which of the following is an assumption of the Capital Asset Pricing Model (CAPM)?", "opts": ["There are no margin transactions or short sales.", "Investors with shorter time horizons exhibit greater risk aversion.", "No investor is large enough to influence market prices."], "ans": "C", "expl": "The CAPM assumes all investors are price takers and no single investor can influence\nprices. The CAPM also assumes markets are free of impediments to trading and that all\ninvestors are risk averse and have the same one-period time horizon.\n(Module 84.2, LOS 84.f)"}, {"n": 20, "q": "Which is NOT an assumption of capital market theory?", "opts": ["There is no inflation.", "There are no taxes or transaction costs.", "Investments are not divisible."], "ans": "C", "expl": "Capital market theory assumes that all investments are infinitely divisible. The other\nstatements are basic assumptions of capital market theory.\n(Module 84.2, LOS 84.f)"}, {"n": 21, "q": "In the market model, beta measures the sensitivity of an asset's rate of return to the\nmarket's:", "opts": ["rate of return.", "risk-adjusted return.", "excess return."], "ans": "A", "expl": "The market model is expressed as: R = α + βR + ε. In this model, beta (β) measures the\niiimii\nsensitivity of the rate of return on an asset (R) to the market rate of return (R).\nim\n(Module 84.1, LOS 84.d)"}, {"n": 22, "q": "If a stock's beta is equal to 1.2, its standard deviation of returns is 28%, and the standard\ndeviation of the returns on the market portfolio is 14%, the covariance of the stock's returns\nwith the returns on the market portfolio is closest to:", "opts": ["0.168.", "0.024.", "0.600."], "ans": "B", "expl": "From the fact that beta = Cov / Var, we have Cov = beta × var.\nii,mktmkti,mktimkt\n2\nCov = 1.2 × 0.14 = 0.02352.\ni,mkt\n(Module 84.1, LOS 84.e)"}, {"n": 23, "q": "An analyst estimated the following for three possible investments.\nSecurityCurrent PriceForecast Price in One YearAnnual DividendBeta\nAlpha Inc.25.0031.002.001.6\nLambda Inc.10.0010.8000.5\nOmega Inc.105.00110.001.001.2\nGiven an expected return on the market of 12% and a risk-free rate of 4%, which of the three\nsecurities is correctly priced based on the analyst's estimates?", "opts": ["Lambda.", "Omega.", "Alpha."], "ans": "A", "expl": "In the context of the SML, a security is underpriced if its required return is less than its\nestimated holding period return, is overpriced if its required return is greater than its\nestimated holding period return, and is correctly priced if its required return is equal to its\nestimated holding period return.\nHere, estimated holding period return is calculated as: (ending price – beginning price +\ncash flows) / beginning price. The required return based on the CAPM is: risk free rate +\nBeta × (expected market rate − risk free rate).\nFor Alpha: ER = (31 – 25 + 2) / 25 = 32%, RR = 4 + 1.6 × (12 – 4) = 16.8%. Stock is\nunderpriced.\nFor Omega: ER = (110 – 105 + 1) / 105 = 5.7%, RR = 4 + 1.2 × (12 – 4) = 13.6%. Stock is\noverpriced.\nFor Lambda, ER = (10.8 – 10) / 10 = 8%, RR = 4 + 0.5 × (12 – 4) = 8%. Stock is correctly\npriced.\n(Module 84.2, LOS 84.h)"}, {"n": 24, "q": "The risk-free rate is 5% and the expected market return is 15%. A portfolio manager is\nestimating a return of 20% on a stock with a beta of 1.5. Based on the SML and the analyst's\nestimate, this stock is:", "opts": ["overvalued.", "undervalued.", "properly valued."], "ans": "C", "expl": "Based on the CAPM, the portfolio should earn: E(R) = 0.05 + 1.5(0.15 − 0.05) = 0.20 or 20%.\nOn a risk-adjusted basis, this portfolio lies on the SML and is, thus, properly valued.\n(Module 84.2, LOS 84.h)"}, {"n": 25, "q": "When comparing portfolios that plot on the security market line (SML) to those that plot on\nthe capital market line (CML), a financial analyst would most accurately state that portfolios\nthat lie on the SML:", "opts": ["are not necessarily priced at their equilibrium values, while portfolios on the CML are priced at their equilibrium values.", "are not necessarily well diversified, while portfolios on the CML are well diversified.", "have only systematic risk, while portfolios on the CML have both systematic and unsystematic risk."], "ans": "B", "expl": "Although the risk measure on the capital market line diagram is total risk, all portfolios\nthat lie on the CML are well diversified and have only systematic risk. This is because\nportfolios on the CML are all constructed from the risk-free asset and the (well-diversified)\nmarket portfolio. Any portfolio, including single securities, will plot along the SML in\nequilibrium. Their unsystematic risk can be significant, but it is not measured on the SML\ndiagram because unsystematic risk is not related to expected return. Both the CML and\nthe SML reflect relations that hold when prices are in equilibrium.\n(Module 84.2, LOS 84.f)"}, {"n": 26, "q": "In extending the 3-factor model of Fama and French, the additional factor suggested by\nCarhart that is often used is:", "opts": ["market-to-book value.", "price momentum.", "GDP growth."], "ans": "B", "expl": "In addition to the three factors of the Fama and French model, market-to-book, firm size,\nand excess returns on the market, Carhart added a momentum factor based on prior\nrelative price performance.\n(Module 84.1, LOS 84.d)"}, {"n": 27, "q": "The following information is available for the stock of Park Street Holdings:\nThe price today (P) equals $45.00.\n0\nThe expected price in one year (P) is $55.00.\n1\nThe stock's beta is 2.31.\nThe firm typically pays no dividend.\nThe 3-month Treasury bill is yielding 4.25%.\nThe historical average S&P 500 return is 12.5%.\nPark Street Holdings stock is:", "opts": ["undervalued by 1.1%.", "overvalued by 1.1%.", "undervalued by 3.7%."], "ans": "B", "expl": "To determine whether a stock is overvalued or undervalued, we need to compare the\nexpected return (or holding period return) and the required return (from Capital Asset\nPricing Model, or CAPM).\nStep 1: Calculate Expected Return (Holding period return):\nThe formula for the (one-year) holding period return is:\nHPR = (D + S – S) / S, where D = dividend and S = stock price.\n1100\nHere, HPR = (0 + 55 – 45) / 45 = 22.2%\nStep 2: Calculate Required Return:\nThe formula for the required return is from the CAPM:\nRR = R + (ER – R) × Beta\nfMf\nRR = 4.25% + (12.5 – 4.25%) × 2.31 = 23.3%.\nStep 3: Determine over/under valuation:\nThe required return is greater than the expected return, so the security is\novervalued.\nThe amount = 23.3% – 22.2% = 1.1%.\n(Module 84.2, LOS 84.h)"}, {"n": 28, "q": "One of the assumptions underlying the capital asset pricing model is that:", "opts": ["there are no transactions costs or taxes.", "only whole shares or whole bonds are available.", "each investor has a unique time horizon."], "ans": "A", "expl": "The CAPM assumes frictionless markets, i.e., no taxes or transactions costs. Among the\nother assumptions of the CAPM are that all investors have the same one-period time\nhorizon and that all investments are infinitely divisible.\n(Module 84.2, LOS 84.f)"}, {"n": 29, "q": "Beta is a measure of:", "opts": ["total risk.", "systematic risk.", "company-specific risk."], "ans": "B", "expl": "Beta is a measure of systematic risk.\n(Module 84.1, LOS 84.e)"}, {"n": 30, "q": "The expected rate of return is 1.5 times the 16% expected rate of return from the market.\nWhat is the beta if the risk free rate is 8%?", "opts": ["2.", "3.", "4."], "ans": "A", "expl": "24 = 8 + β (16 – 8)\n24 = 8 + 8β\n16 = 8β\n16 / 8 = β\nβ = 2\n(Module 84.1, LOS 84.e)"}, {"n": 31, "q": "Which of the following statements regarding the Capital Asset Pricing Model is least\naccurate?", "opts": ["It is useful for determining an appropriate discount rate.", "It is when the security market line (SML) and capital market line (CML) converge.", "Its accuracy depends upon the accuracy of the beta estimates."], "ans": "B", "expl": "The CML plots expected return versus standard deviation risk. The SML plots expected\nreturn versus beta risk. Therefore, they are lines that are plotted in different two-\ndimensional spaces and will not converge.\n(Module 84.2, LOS 84.f)"}, {"n": 32, "q": "Which of the following terms refer to the same type of risk?", "opts": ["Undiversifiable risk and unsystematic risk.", "Total risk and the variance of returns.", "Systematic risk and firm-specific risk."], "ans": "B", "expl": "Variance is a measure of total risk.\n(Module 84.1, LOS 84.c)"}, {"n": 33, "q": "A stock's abnormal rate of return is defined as the:", "opts": ["rate of return during abnormal price movements.", "expected risk-adjusted rate of return minus the market rate of return.", "actual rate of return less the expected risk-adjusted rate of return."], "ans": "C", "expl": "Abnormal return = Actual return – expected risk-adjusted return\n(Module 84.2, LOS 84.h)"}, {"n": 34, "q": "Charlie Smith holds two portfolios, Portfolio X and Portfolio Y. They are both liquid, well-\ndiversified portfolios with approximately equal market values. He expects Portfolio X to\nreturn 13% and Portfolio Y to return 14% over the upcoming year. Because of an unexpected\nneed for cash, Smith is forced to sell at least one of the portfolios. He uses the security\nmarket line to determine whether his portfolios are undervalued or overvalued. Portfolio X's\nbeta is 0.9 and Portfolio Y's beta is 1.1. The expected return on the market is 12% and the\nrisk-free rate is 5%. Smith should sell:", "opts": ["both portfolios X and Y because they are both overvalued.", "portfolio Y only.", "either portfolio X or Y because they are both properly valued."], "ans": "B", "expl": "Portfolio X's required return is 0.05 + 0.9 × (0.12-0.05) = 11.3%. It is expected to return\n13%. The portfolio has an expected excess return of 1.7%\nPortfolio Y's required return is 0.05 + 1.1 × (0.12-0.05) = 12.7%. It is expected to return\n14%. The portfolio has an expected excess return of 1.3%.\nSince both portfolios are undervalued, the investor should sell the portfolio that offers less\nexcess return. Sell Portfolio Y because its excess return is less than that of Portfolio X.\n(Module 84.2, LOS 84.h)"}, {"n": 35, "q": "Which type of risk is positively related to expected excess returns according to the CAPM?", "opts": ["Unique.", "Diversifiable.", "Systematic."], "ans": "C", "expl": "The CAPM concludes that expected returns are a positive (linear) function of systematic\nrisk.\n(Module 84.1, LOS 84.c)"}, {"n": 36, "q": "Beta is least accurately described as:", "opts": ["the covariance of a security’s returns with the market return, divided by the variance of market returns.", "a standardized measure of the total risk of a security.", "a measure of the sensitivity of a security’s return to the market return."], "ans": "B", "expl": "2\nBeta is a standardized measure of the systematic risk of a security. β = Cov / σ.\nr,mktmkt\nBeta is multiplied by the market risk premium in the CAPM: E(R) = RFR + β[E(R) – RFR].\nimkt\n(Module 84.1, LOS 84.e)"}, {"n": 37, "q": "An analyst has developed the following data for two companies, PNS Manufacturing (PNS)\nand InCharge Travel (InCharge). PNS has an expected return of 15% and a standard deviation\nof 18%. InCharge has an expected return of 11% and a standard deviation of 17%. PNS's\ncorrelation with the market is 75%, while InCharge's correlation with the market is 85%. If\nthe market standard deviation is 22%, which of the following are the betas for PNS and\nInCharge?\nBeta of PNSBeta of InCharge", "opts": ["0.610.66", "0.660.61", "0.921.10"], "ans": "A", "expl": "Beta = (s/s) × r\niiMI, M\nBetaPNS = (0.18/0.22) × 0.75 = 0.6136\nBetaInCharge = (0.17/0.22) × 0.85 = 0.6568\n(Module 84.1, LOS 84.e)"}, {"n": 38, "q": "James Franklin, CFA, has high risk tolerance and seeks high returns. Based on capital market\ntheory, Franklin would most appropriately hold:", "opts": ["a high-beta portfolio of risky assets financed in part by borrowing at the risk-free rate.", "a high risk biotech stock, as it will have high expected returns in equilibrium.", "the market portfolio as his only risky asset."], "ans": "C", "expl": "According to capital market theory, all investors will choose a combination of the market\nportfolio and borrowing or lending at the risk-free rate; that is, a portfolio on the CML.\n(Module 84.1, LOS 84.a)"}, {"n": 39, "q": "An analyst determines that three stocks have the following characteristics:\nStockBetaEstimated Return\nX1.010%\nY1.616%\nZ2.016%\nIf the risk-free rate is 4% and the expected return on the market is 10%, which of the\nfollowing statements is most accurate?", "opts": ["Stock X is undervalued.", "Stock Y is overvalued.", "Stock Z is properly valued."], "ans": "C", "expl": "Using the CAPM, the required rate of return for each stock is:\nE(R) = 4% + 1.0(10% − 4%) = 10.0%.\nX\n10.0% − 10.0% = 0.0%, properly valued.\nE(R) = 4% + 1.6(10% − 4%) = 13.6%.\nY\n16.0% − 13.6% = 2.4% undervalued.\nE(R) = 4% + 2.0(10% − 4%) = 16.0%.\nZ\n16.0% − 16.0% = 0.0%, properly valued.\n(Module 84.2, LOS 84.h)"}, {"n": 40, "q": "Which of the following is least likely an assumption underlying the capital asset pricing\nmodel?", "opts": ["Investors are rational.", "Tax rates are constant over the investment horizon.", "All investors have the same expectations of return and risk for each security."], "ans": "B", "expl": "Both taxes and transactions costs are assumed to be zero in deriving the CAPM.\n(Module 84.2, LOS 84.f)"}, {"n": 41, "q": "Given a beta of 1.25 and a risk-free rate of 6%, what is the expected rate of return assuming\na 12% market return?", "opts": ["13.5%.", "10%.", "31%."], "ans": "A", "expl": "k = Rf + β(R – Rf)\niiM\nk = 6% + 1.25(12% – 6%)\n= 13.5%\n(Module 84.2, LOS 84.g)"}, {"n": 42, "q": "If the standard deviation of the market's returns is 5.8%, the standard deviation of a stock's\nreturns is 8.2%, and the covariance of the market's returns with the stock's returns is 0.003,\nwhat is the beta of the stock?", "opts": ["0.05.", "0.89.", "1.07."], "ans": "B", "expl": "2\nThe formula for beta is: (Cov)/(Var), or (0.003)/(0.058) = 0.89.\nstock,marketmarket\n(Module 84.1, LOS 84.e)"}, {"n": 43, "q": "Consider a stock selling for $23 that is expected to increase in price to $27 by the end of the\nyear and pay a $0.50 dividend. If the risk-free rate is 4%, the expected return on the market\nis 8.5%, and the stock's beta is 1.9, what is the current valuation of the stock? The stock:", "opts": ["is correctly valued.", "is overvalued.", "is undervalued."], "ans": "C", "expl": "The required return based on systematic risk is computed as: ER = R + (ER – R) ×\nstockfMf\nBeta, or 0.04 + (0.085 – 0.04) × 1.9 = 0.1255, or 12.6%. The expected return is\nstock\ncomputed as: (P – P + D) / P, or ($27 – $23 + $0.50) / $23 = 0.1957, or 19.6%. The stock\n1010\nis above the security market line ER > RR, so it is undervalued.\n(Module 84.2, LOS 84.h)"}, {"n": 44, "q": "The expected rate of return is 2.5 times the 12% expected rate of return from the market.\nWhat is the beta if the risk-free rate is 6%?", "opts": ["3.", "5.", "4."], "ans": "C", "expl": "30 = 6 + β (12 - 6)\n24 = 6β\nβ = 4\n(Module 84.1, LOS 84.e)"}, {"n": 45, "q": "Which of the following statements about the security market line (SML) and capital market\nline (CML) is most accurate?", "opts": ["The SML involves the concept of a risk-free asset, but the CML does not.", "The SML uses beta, but the CML uses standard deviation as the risk measure.", "Both the SML and CML can be used to explain a stock’s expected return."], "ans": "B", "expl": "The SML and CML both intersect the vertical axis at the risk-free rate. The SML describes\nthe risk/return tradeoff for individual securities or portfolios, whereas the CML describes\nthe risk/return tradeoff of various combinations of the market portfolio and a riskless\nasset.\n(Module 84.2, LOS 84.f)"}, {"n": 46, "q": "Given the following data, what is the correlation coefficient between the two stocks and the\nBeta of stock A?\nstandard deviation of returns of Stock A is 10.04%\nstandard deviation of returns of Stock B is 2.05%\nstandard deviation of the market is 3.01%\ncovariance between the two stocks is 0.00109\ncovariance between the market and stock A is 0.002\nCorrelation CoefficientBeta (stock A)", "opts": ["0.52960.06", "0.52962.20", "0.65562.20"], "ans": "B", "expl": "correlation coefficient = 0.00109 / (0.0205)(0.1004) = 0.5296.\nbeta of stock A = covariance between stock and the market / variance of the market\n2\nBeta = 0.002 / 0.0301 = 2.2\n(Module 84.1, LOS 84.e)"}, {"n": 47, "q": "When the market is in equilibrium, all:", "opts": ["assets plot on the CML.", "assets plot on the SML.", "investors hold the market portfolio."], "ans": "B", "expl": "When the market is in equilibrium, expected returns equal required returns. Since this\nmeans that all assets are correctly priced, all assets plot on the SML.\nBy definition, all stocks and portfolios other than the market portfolio fall below the CML.\n(Only the market portfolio is efficient.)\n(Module 84.2, LOS 84.f)"}, {"n": 48, "q": "An analyst collected the following data for three possible investments. Alpha Corporation\nhas a beta of 1.6, Omega Company has a beta of 1.2, and Lambda, Inc. has a beta of 0.5.\nThe expected return on the market is –3% and the risk-free rate is 4%. Assuming that capital\nmarkets are in equilibrium, which stock has the highest expected return?", "opts": ["Omega.", "Alpha.", "Lambda."], "ans": "C", "expl": "An expected decline in the overall market suggests the stock with the lowest beta\n(Lambda) and, therefore, the least sensitivity to the market should have the highest\nexpected rate of return.\nRR = R + (R – R) × Beta, where RR = required return, R\nStockfMarketfStockf = risk-free rate, and\nR = market rate of return\nMarket\nAlpha: 4% + 1.6(–3% – 4%) = –7.2%\nOmega: 4% + 1.2(–3% – 4%) = –4.4%\nLambda: 4% + 0.5(–3% – 4%) = +0.5%\n(Module 84.2, LOS 84.h)"}, {"n": 49, "q": "According to the capital asset pricing model (CAPM):", "opts": ["all investors who take on risk will hold the same risky-asset portfolio.", "a stock with high risk, measured as standard deviation of returns, will have high expected returns in equilibrium.", "an investor who is risk averse should hold at least some of the risk-free asset in his portfolio."], "ans": "A", "expl": "One of the assumptions of the CAPM is that all investors who hold risky assets will hold\nthe same portfolio of risky assets (the market portfolio). Risk aversion means an investor\nwill accept more risk only if compensated with a higher expected return. In capital market\ntheory, all investors exhibit risk aversion, even an investor who is short the risk-free asset.\nIn the CAPM, a stock's risk is measured as its beta, not its standard deviation of returns.\n(Module 84.2, LOS 84.f)"}, {"n": 50, "q": "In the context of the CML, the market portfolio includes:", "opts": ["12-18 stocks needed to provide maximum diversification.", "all existing risky assets.", "the risk-free asset."], "ans": "B", "expl": "The market portfolio has to contain all the stocks, bonds, and risky assets in existence.\nBecause this portfolio has all risky assets in it, it represents the ultimate or completely\ndiversified portfolio.\n(Module 84.1, LOS 84.b)"}, {"n": 51, "q": "What is the risk measure associated with the CML?", "opts": ["Beta.", "Market risk.", "Standard deviation."], "ans": "C", "expl": "In the context of the CML, the measure of risk (x-axis) is total risk, or standard deviation.\nBeta (systematic risk) is used to measure risk for the security market line (SML).\n(Module 84.1, LOS 84.b)"}, {"n": 52, "q": "When a risk-free asset is combined with a portfolio of risky assets, which of the following is\nleast accurate?", "opts": ["The variance of the resulting portfolio is a weighted average of the returns variances of the risk-free asset and of the portfolio of risky assets.", "The expected return for the newly created portfolio is the weighted average of the return on the risk-free asset and the expected return on the risky asset portfolio.", "The standard deviation of the return for the newly created portfolio is the standard deviation of the returns of the risky asset portfolio multiplied by its portfolio weight."], "ans": "A", "expl": "This statement is not correct; the standard deviation of returns for the resulting portfolio\nis a weighted average of the returns standard deviation of the risk-free asset (zero) and\nthe returns standard deviation of the risky-asset portfolio.\n(Module 84.1, LOS 84.a)"}, {"n": 53, "q": "Which of the following is the vertical axis intercept for the Capital Market Line (CML)?", "opts": ["Expected return on the market.", "Risk-free rate.", "Expected return on the portfolio."], "ans": "B", "expl": "The CML originates on the vertical axis from the point of the risk-free rate.\n(Module 84.1, LOS 84.b)"}, {"n": 54, "q": "A portfolio's excess return per unit of systematic risk is known as its:", "opts": ["Jensen’s alpha.", "Sharpe ratio.", "Treynor measure."], "ans": "C", "expl": "The Treynor measure is excess return relative to beta. The Sharpe ratio measures excess\nreturn relative to standard deviation. Jensen's alpha measures a portfolio's excess return\nrelative to return of a portfolio on the SML that has the same beta.\n(Module 84.2, LOS 84.i)"}, {"n": 55, "q": "In Fama and French's multifactor model, the expected return on a stock is explained by:", "opts": ["excess return on the market portfolio, book-to-market ratio, and price momentum.", "firm size, book-to-market ratio, and excess return on the market portfolio.", "firm size, book-to-market ratio, and price momentum."], "ans": "B", "expl": "In the Fama and French model, the three factors that explain individual stock returns are\nfirm size, the firm's book value-to-market value ratio, and the excess return on the market\nportfolio. The Carhart model added price momentum as a fourth factor.\n(Module 84.1, LOS 84.d)"}, {"n": 56, "q": "Which of the following statements about systematic and unsystematic risk is most accurate?", "opts": ["As an investor increases the number of stocks in a portfolio, the systematic risk will remain constant.", "The unsystematic risk for a specific firm is similar to the unsystematic risk for other firms.", "Total risk equals market risk plus firm-specific risk."], "ans": "C", "expl": "Total risk equals systematic (market) plus unsystematic (firm-specific) risk.\nThe unsystematic risk for a specific firm is not similar to the unsystematic risk for other\nfirms in the same industry. Unsystematic risk is firm-specific or unique risk.\nSystematic risk of a portfolio can be changed by adding high-beta or low-beta stocks.\n(Module 84.1, LOS 84.c)"}, {"n": 57, "q": "A higher Sharpe ratio indicates:", "opts": ["a higher excess return per unit of risk.", "a lower risk per unit of return.", "lower volatility of returns."], "ans": "A", "expl": "The Sharpe ratio is excess return (return – R) per unit of risk (defined as the standard\nf\ndeviation of returns).\n(Module 84.2, LOS 84.i)"}, {"n": 58, "q": "Bruce Johansen, CFA, is fully invested in the market portfolio. Johansen desires to increase\nthe expected return from his portfolio. According to capital market theory, Johansen can\nmeet his return objective by:", "opts": ["borrowing at the risk-free rate to invest in the risky market portfolio.", "allocating a higher proportion of the portfolio to higher risk assets.", "owning the risky market portfolio and lending at the risk-free rate."], "ans": "A", "expl": "Investing on margin in the market portfolio will increase both risk and expected returns.\nThis strategy would be mean-variance efficient. Other strategies such as shifting a portion\nof total funds to higher risk assets would achieve the higher return goal but would leave\nthe portfolio below the CML and thus would not be an optimal strategy.\n(Module 84.1, LOS 84.b)"}, {"n": 59, "q": "The slope of the capital market line (CML) is a measure of the level of:", "opts": ["excess return per unit of risk.", "expected return over the level of inflation.", "risk over the level of excess return."], "ans": "A", "expl": "The slope of the CML indicates the excess return (expected return less the risk-free rate)\nper unit of risk.\n(Module 84.1, LOS 84.b)"}, {"n": 60, "q": "In equilibrium, investors should only expect to be compensated for bearing systematic risk\nbecause:", "opts": ["individual securities in equilibrium only have systematic risk.", "nonsystematic risk can be eliminated by diversification.", "systematic risk is specific to the securities the investor selects."], "ans": "B", "expl": "In equilibrium, investors should not expect to earn additional return for bearing\nnonsystematic risk because this risk can be eliminated by diversification. Individual\nsecurities have both systematic and nonsystematic risk. Systematic risk is market risk;\nnonsystematic risk is specific to individual securities.\n(Module 84.1, LOS 84.c)"}, {"n": 61, "q": "A portfolio to the right of the market portfolio on the capital market line (CML) is created by:", "opts": ["fully diversifying.", "holding both the risk-free asset and the market portfolio.", "holding more than 100% of the risky asset."], "ans": "C", "expl": "Portfolios that lie to the right of the market portfolio on the capital market line are created\nby borrowing funds to own more than 100% of the market portfolio (M).\nThe statement, \"holding both the risk-free asset and the market portfolio\" refers to\nportfolios that lie to the left of the market portfolio. Portfolios that lie to the left of point M\nare created by lending funds (or buying the risk free-asset). These investors own less than\n100% of both the market portfolio and the risk-free asset. The portfolio at point R\nf\n(intersection of the CML and the y-axis) is created by holding 100% of the risk-free asset.\nThe statement, \"fully diversifying\" is incorrect because the market portfolio is fully\ndiversified.\n(Module 84.1, LOS 84.b)"}, {"n": 62, "q": "The market portfolio in Capital Market Theory is determined by:", "opts": ["the intersection of the efficient frontier and the investor's highest utility curve.", "a line tangent to the efficient frontier, drawn from any point on the expected return axis.", "a line tangent to the efficient frontier, drawn from the risk-free rate of return."], "ans": "C", "expl": "The Capital Market Line is a straight line drawn from the risk-free rate of return (on the Y\naxis) through the market portfolio. The market portfolio is determined as where that\nstraight line is exactly tangent to the efficient frontier.\n(Module 84.1, LOS 84.b)"}, {"n": 63, "q": "An analyst has estimated the following:\nCorrelation of Bahr Industries returns with market returns = 0.8\nVariance of the market returns = 0.0441\nVariance of Bahr returns = 0.0225\nThe beta of Bahr Industries stock is closest to:", "opts": ["0.67.", "0.57.", "0.77."], "ans": "B", "expl": "√√\n0.8×0.0225×0.0441=0.0252\nCovariance of Bahr and the market =\nBahr beta = 0.0252/0.0441= 0.57\n(Module 84.1, LOS 84.e)"}, {"n": 64, "q": "Which of the following is least likely considered a source of systematic risk for bonds?", "opts": ["Default risk.", "Purchasing power risk.", "Market risk."], "ans": "A", "expl": "Default risk is based on company-specific or unsystematic risk.\n(Module 84.1, LOS 84.c)"}, {"n": 65, "q": "For an investor to move further up the Capital Market Line than the market portfolio, the\ninvestor must:", "opts": ["reduce the portfolio's risk below that of the market.", "diversify the portfolio even more.", "borrow and invest in the market portfolio."], "ans": "C", "expl": "Portfolios that lie to the right of the market portfolio on the capital market line (\"up\" the\ncapital market line) are created by borrowing funds to own more than 100% of the market\nportfolio (M).\nThe statement, \"diversify the portfolio even more\" is incorrect because the market\nportfolio is fully diversified.\n(Module 84.1, LOS 84.b)"}, {"n": 66, "q": "In equilibrium, an inefficient portfolio will plot:", "opts": ["below the CML and on the SML.", "on the CML and below the SML.", "below the CML and below the SML."], "ans": "A", "expl": "An inefficient portfolio will plot below the CML. In equilibrium, all portfolios will plot on the\nSML.\n(Module 84.2, LOS 84.f)"}, {"n": 67, "q": "Mason Snow, CFA, is considering two stocks: Bahre (with an expected return of 10% and a\nbeta of 1.4) and Cubb (with an expected return of 15% and a beta of 2.0). Snow uses a risk-\nfree of 7% and estimates that the market risk premium is 4%. Based on capital market\ntheory, Snow should conclude that:", "opts": ["neither security is underpriced.", "only Bahre is underpriced.", "only Cubb is underpriced."], "ans": "A", "expl": "In the context of the SML, a security is underpriced if the required return is less than the\nholding period (or expected) return, is overpriced if the required return is greater the\nholding period (or expected) return, and is correctly priced if the required return equals\nthe holding period (or expected) return.\nBahre: Expected return = 10% < CAPM Required return R = 0.07 + (1.4)(0.11-0.07) = 12.6%\nand is overpriced.\nFor Cubb: Expected return = 15% = CAPM Required return = 0.07 + (2.0)(0.11-0.07) = 15%.\n(Module 84.2, LOS 84.h)"}, {"n": 68, "q": "Portfolios that represent combinations of the risk-free asset and the market portfolio are\nplotted on the:", "opts": ["capital asset pricing line.", "utility curve.", "capital market line."], "ans": "C", "expl": "The introduction of a risk-free asset changes the Markowitz efficient frontier into a straight\nline. This straight efficient frontier line is called the capital market line (CML). Investors at\npoint Rf have 100% of their funds invested in the risk-free asset. Investors at point M have\n100% of their funds invested in market portfolio M. Between Rf and M, investors hold both\nthe risk-free asset and portfolio M. To the right of M, investors hold more than 100% of\nportfolio M. All investors have to do to get the risk and return combination that suits them\nis to simply vary the proportion of their investment in the risky portfolio M and the risk-\nfree asset.\nUtility curves reflect individual preferences.\n(Module 84.1, LOS 84.b)"}, {"n": 69, "q": "According to capital market theory, which of the following represents the risky portfolio that\nshould be held by all investors who desire to hold risky assets?", "opts": ["The point of tangency between the capital market line (CML) and the efficient frontier.", "Any point on the efficient frontier and to the right of the point of tangency between the CML and the efficient frontier.", "Any point on the efficient frontier and to the left of the point of tangency between the CML and the efficient frontier."], "ans": "A", "expl": "Capital market theory suggests that all investors should invest in the same portfolio of\nrisky assets, and this portfolio is located at the point of tangency of the CML and the\nefficient frontier of risky assets. Any point below the CML is suboptimal, and points above\nthe CML are not feasible.\n(Module 84.1, LOS 84.b)"}, {"n": 70, "q": "An active manager will most likely short a security with an expected Jensen's alpha that is:", "opts": ["negative.", "positive.", "zero."], "ans": "A", "expl": "A security's expected Jensen's alpha is the difference between an active manager's\nestimate of a security's expected return and the CAPM expected return. A security that is\nexpected to have a negative alpha will plot below the SML (i.e., the security is overvalued\nand should be sold or sold short).\n(Module 84.2, LOS 84.i)"}, {"n": 71, "q": "A stock that plots below the Security Market Line most likely:", "opts": ["is overvalued.", "has a beta less than one.", "is below the efficient frontier."], "ans": "A", "expl": "Since the equation of the SML is the capital asset pricing model, you can determine if a\nstock is over- or underpriced graphically or mathematically.  Your answers will always be\nthe same.\nGraphically: If you plot a stock's expected return on the SML and it falls below the line, it\nindicates that the stock is currently overpriced, causing its expected return to be too low. If\nthe plot is above the line, it indicates that the stock is underpriced. If the plot falls on the\nSML, it indicates the stock is properly priced.\nMathematically: In the context of the SML, a security is underpriced if the required return\nis less than the holding period (or expected) return, is overpriced if the required return is\ngreater the holding period (or expected) return, and is correctly priced if the required\nreturn equals the holding period (or expected) return.\n(Module 84.2, LOS 84.h)"}, {"n": 72, "q": "In the context of the capital market line (CML), which of the following statements is\nCORRECT?", "opts": ["Firm-specific risk can be reduced through diversification.", "Market risk can be reduced through diversification.", "The two classes of risk are market risk and systematic risk."], "ans": "A", "expl": "The other statements are false. Market risk cannot be reduced through diversification;\nmarket risk = systematic risk. The two classes of risk are unsystematic risk and systematic\nrisk.\n(Module 84.1, LOS 84.c)"}, {"n": 73, "q": "A stock has a beta of 1.55 and an expected return of 17.3%. If the risk-free rate is 8%, the\nexpected market risk premium is:", "opts": ["12.0%.", "14.0%.", "6.0%."], "ans": "C", "expl": "17.3 = 8 + 1.55(MRP)\n9.3 = 1.55(MRP)\nMRP = 9.3 / 1.55 = 6\n(Module 84.2, LOS 84.g)"}, {"n": 74, "q": "The correlation of returns on the risk-free asset with returns on a portfolio of risky assets is:", "opts": ["negative.", "positive.", "zero."], "ans": "C", "expl": "The risk-free asset has zero correlation of returns with any portfolio of risky assets.\n(Module 84.1, LOS 84.a)"}, {"n": 75, "q": "An analyst wants to determine whether Dover Holdings is overvalued or undervalued, and\nby how much (expressed as percentage return). The analyst gathers the following\ninformation on the stock:\nMarket standard deviation = 0.70\nCovariance of Dover with the market = 0.85\nDover's current stock price (P) = $35.00\n0\nThe expected price in one year (P) is $39.00\n1\nExpected annual dividend = $1.50\n3-month Treasury bill yield = 4.50%.\nHistorical average S&P 500 return = 12.0%.\nDover Holdings stock is:", "opts": ["undervalued by approximately 2.1%.", "overvalued by approximately 1.8%.", "undervalued by approximately 1.8%."], "ans": "B", "expl": "To determine whether a stock is overvalued or undervalued, we need to compare the\nexpected return (or holding period return) and the required return (from Capital Asset\nPricing Model, or CAPM).\nStep 1: Calculate Expected Return (Holding period return)\nThe formula for the (one-year) holding period return is:\nHPR = (D + S – S) / S, where D = dividend and S = stock price.\n1100\nHere, HPR = (1.50 + 39 – 35) / 35 = 15.71%\nStep 2: Calculate Required Return\nThe formula for the required return is from the CAPM:\nRR = R + (ER – R) × Beta\nfMf\nHere, we are given the information we need except for Beta. Remember that Beta can be\n2\ncalculated with: Beta = [cov] / [σ].\nstockS,MM\n2\nHere we are given the numerator and the denominator, so the calculation is: 0.85 / 0.70 =\n1.73. RR = 4.50% + (12.0 – 4.50%) × 1.73 = 17.48%.\nStep 3: Determine over/under valuation\nThe required return is greater than the expected return, so the security is overvalued.\nThe amount = 17.48% – 15.71% = 1.77%.\n(Module 84.2, LOS 84.h)"}, {"n": 76, "q": "Consider the following graph of the Security Market Line (SML). The letters X, Y, and Z\nrepresent risky asset portfolios and an analyst's forecast for their returns over the next\nperiod. The SML crosses the y-axis at 0.07.\nA graph depicting the Security Market Line (SML),\nshowing expected return (ER) versus beta, with three assets (X, Y, and Z) plotted. Asset Y lies\non the SML, while X is above and Z is on the line, indicating potential overvaluation or\nundervaluation relative to the Capital Asset Pricing Model.\nThe expected market return is 13.0%.\nUsing the graph above and the information provided, the analyst most likely believes that:", "opts": ["Portfolio X's required return is greater than its forecast return.", "Portfolio Y is undervalued.", "the expected return for Portfolio Z is 14.8%."], "ans": "C", "expl": "Portfolio Z has a beta of 1.3 and its required return can be calculated as 7.0% + 1.3 ×\n(13.0% − 7.0%) = 14.8%. Because it plots on the SML, its expected (forecast) return and\nrequired return are equal.\nThe SML plots beta (systematic risk) versus expected equilibrium (required) return. The\nanalyst believes that Portfolio Y is overvalued – any portfolio located below the SML has a\nforecast return less than its required return and is overpriced in the market. Since\nPortfolio X plots above the SML, it is undervalued and the statement should read,\n\"Portfolio X's required return is less than its forecast return.\"\n(Module 84.2, LOS 84.h)"}, {"n": 77, "q": "Which of the following statements about risk is NOT correct?", "opts": ["The market portfolio has only systematic risk.", "Total risk = systematic risk - unsystematic risk.", "Unsystematic risk is diversifiable risk."], "ans": "B", "expl": "Total risk = systematic risk + unsystematic risk\n(Module 84.1, LOS 84.c)"}, {"n": 78, "q": "An equally weighted portfolio of a risky asset and a risk-free asset will exhibit:", "opts": ["half the returns standard deviation of the risky asset.", "less than half the returns standard deviation of the risky asset.", "more than half the returns standard deviation of the risky asset."], "ans": "A", "expl": "A risk free asset has a standard deviation of returns equal to zero and a correlation of\nreturns with any risky asset also equal to zero. As a result, the standard deviation of\nreturns of a portfolio of a risky asset and a risk-free asset is equal to the weight of the\nrisky asset multiplied by its standard deviation of returns. For an equally weighted\nportfolio, the weight of the risky asset is 0.5 and the portfolio standard deviation is 0.5 ×\nthe standard deviation of returns of the risky asset.\n(Module 84.1, LOS 84.a)"}, {"n": 79, "q": "The market model of the expected return on a risky security is best described as a(n):", "opts": ["arbitrage-based model.", "two-factor model.", "single-factor model."], "ans": "C", "expl": "The market model is a single-factor model. The single factor is the expected excess return\non the market portfolio, or [E(R) – RFR].\nm\n(Module 84.1, LOS 84.d)"}, {"n": 80, "q": "A portfolio manager is constructing a new equity portfolio consisting of a large number of\nrandomly chosen domestic stocks. As the number of stocks in the portfolio increases, what\nhappens to the expected levels of systematic and unsystematic risk?", "opts": ["Systematic risk: Remains the same  |  Unsystematic risk: Decreases", "Systematic risk: Decreases  |  Unsystematic risk: Increases", "Systematic risk: Increases  |  Unsystematic risk: Remains the same"], "ans": "A", "expl": "As randomly selected securities are added to a portfolio, the diversifiable (unsystematic)\nrisk decreases, and the expected level of nondiversifiable (systematic) risk remains the\nsame.\n(Module 84.1, LOS 84.c)"}, {"n": 81, "q": "The expected rate of return is twice the 12% expected rate of return from the market. What\nis the beta if the risk-free rate is 6%?", "opts": ["2.", "3.", "4."], "ans": "B", "expl": "24 = 6 + β (12 – 6)\n18 = 6β\nβ = 3\n(Module 84.1, LOS 84.e)"}, {"n": 82, "q": "Which of the following statements regarding the Sharpe ratio is most accurate? The Sharpe\nratio measures:", "opts": ["excess return per unit of risk.", "peakedness of a return distribution.", "total return per unit of risk."], "ans": "A", "expl": "The Sharpe ratio measures excess return per unit of risk. Remember that the numerator\nof the Sharpe ratio is (portfolio return – risk free rate), hence the importance of excess\nreturn. Note that peakedness of a return distribution is measured by kurtosis.\n(Module 84.2, LOS 84.i)"}, {"n": 83, "q": "An investor believes Stock M will rise from a current price of $20 per share to a price of $26\nper share over the next year. The company is not expected to pay a dividend. The following\ninformation pertains:\nR = 8%\nF\nER = 16%\nM\nBeta = 1.7\nShould the investor purchase the stock?", "opts": ["No, because it is overvalued.", "No, because it is undervalued.", "Yes, because it is undervalued."], "ans": "C", "expl": "In the context of the SML, a security is underpriced if the required return is less than the\nholding period (or expected) return, is overpriced if the required return is greater the\nholding period (or expected) return, and is correctly priced if the required return equals\nthe holding period (or expected) return.\nHere, the holding period (or expected) return is calculated as: (ending price – beginning\nprice + any cash flows/dividends) / beginning price. The required return uses the equation\nof the SML: risk free rate + Beta × (expected market rate − risk free rate).\nER = (26 – 20) / 20 = 0.30 or 30%, RR = 8 + (16 – 8) × 1.7 = 21.6%. The stock is underpriced\ntherefore purchase.\n(Module 84.2, LOS 84.h)"}, {"n": 84, "q": "Which of the following measures produces the same portfolio rankings as the Sharpe ratio\nbut is stated in percentage terms?", "opts": ["Jensen’s alpha.", "M-squared.", "Treynor measure."], "ans": "B", "expl": "M-squared measures the excess return of a leveraged portfolio relative to the market\nportfolio and produces the same portfolio rankings as Sharpe ratio.\n(Module 84.2, LOS 84.i)"}, {"n": 85, "q": "All portfolios that lie on the capital market line:", "opts": ["have some unsystematic risk unless only the risk-free asset is held.", "contain the same mix of risky assets unless only the risk-free asset is held.", "contain at least some positive allocation to the risk-free asset."], "ans": "B", "expl": "All portfolios on the CML include the same tangency portfolio of risky assets, except the\nintercept (all invested in risk-free asset). The tangency portfolio contains none of the risk-\nfree asset and \"borrowing portfolios\" can be constructed with a negative allocation to the\nrisk-free asset. Portfolios on the CML are efficient (well-diversified) and have no\nunsystematic risk.\n(Module 84.1, LOS 84.c)"}, {"n": 86, "q": "A portfolio of options had a return of 22% with a standard deviation of 20%. If the risk-free\nrate is 7.5%, what is the Sharpe ratio for the portfolio?", "opts": ["0.725.", "0.568.", "0.147."], "ans": "A", "expl": "Sharpe ratio = (22% – 7.50%) / 20% = 0.725.\n(Module 84.2, LOS 84.i)"}, {"n": 87, "q": "The expected market premium is 8%, with the risk-free rate at 7%. What is the expected rate\nof return on a stock with a beta of 1.3?", "opts": ["10.4%.", "16.3%.", "17.4%."], "ans": "C", "expl": "RR = R + (R – R) × Beta, where RR = required return, R = return, and R =\nStockfMarketfStockf\nrisk-free rate, and (R – R) = market premium\nMarketf\nHere, RR = 7 + (8 × 1.3) = 7 + 10.4 = 17.4%.\nStock\n(Module 84.2, LOS 84.g)"}, {"n": 88, "q": "Which of the following is NOT an assumption of capital market theory?", "opts": ["Investors can lend at the risk-free rate, but borrow at a higher rate.", "The capital markets are in equilibrium.", "All assets are infinitely divisible."], "ans": "A", "expl": "Capital market theory assumes that investors can borrow or lend at the risk-free rate. The\nother statements are basic assumptions of capital market theory.\n(Module 84.2, LOS 84.f)"}, {"n": 89, "q": "The beta of Stock A is 1.3. If the expected return of the market is 12%, and the risk-free rate\nof return is 6%, what is the expected return of Stock A?", "opts": ["14.2%.", "15.6%.", "13.8%."], "ans": "C", "expl": "RR = R + (R - R) × Beta where RR= required return, R = return, and R = risk-\nStockfMarketfStock,f\nfree rate\nHere, RR = 6 + (12 - 6) × 1.3  = 6 + 7.8 = 13.8%.\nStock\n(Module 84.2, LOS 84.g)"}, {"n": 90, "q": "The beta of stock D is -0.5. If the expected return of Stock D is 8%, and the risk-free rate of\nreturn is 5%, what is the expected return of the market?", "opts": ["+3.0%.", "-1.0%.", "+3.5%."], "ans": "B", "expl": "RR = R + (R – R) × Beta, where RR = required return, R = return,\nStockfMarketfStock\nand R = risk-free rate\nf\nA bit of algebraic manipulation results in:\nR = [RR – R + (Beta × R)] / Beta = [8 – 5 + (-0.5 × 5)] / -0.5 = 0.5\nMarketStockfStockfStock\n/ -0.5 = -1%\n(Module 84.2, LOS 84.g)"}, {"n": 91, "q": "For a security with a beta of 1.10 when the risk-free rate is 5%, and the expected market risk\npremium is 5%, what is the expected rate of return on the security according to the CAPM?", "opts": ["10.5%.", "15.5%.", "5.5%."], "ans": "A", "expl": "The market risk premium is the difference between the market rate of return and the risk-\nfree rate [i.e., the quantity (R – Rf)].\nM\nk = Rf + β(R – Rf)\niiM\nk = 5% + 1.10(5%) = 10.5%\n(Module 84.2, LOS 84.g)"}];
const CFG = {"title": "Portfolio Risk and Return Part II", "subtitle": "CFA · Portfolio Management · Reading 84 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + (location.pathname.split("/").pop() || CFG.title || "quiz");
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  answers[i] = L;
  const card = $("q-"+i);
  card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
  $("opt-"+i+"-"+L).classList.add("sel");
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
