<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

CC"]}, {"n": 2, "q": "Which of the following best describes a characteristic of the early expansion phase of the business cycle?", "opts": ["Inflation accelerates, leading economic growth", "Capital spending by businesses expands rapidly", "Consumers accelerate spending on housing and durable goods"], "ans": "C", "expl": "The phases of the business cycle are expansion, peak, contraction (ie, recession), and trough. The length of a business cycle, or any specific\nphase, is not predictable. However, each phase is associated with certain characteristics regarding GDP growth and inflation.\nExpansions are divided into early (ie, initial recovery) and late phases. The early expansion phase occurs after the economy has been in a trough,\nwhich is considered a turning point in the cycle, when economic activities begin to expand. Characteristics of the early expansion phase\ninclude the following:\nBusinesses begin to replenish inventories.\nConsumers start spending more, particularly on housing and durable goods, as incomes stabilize.\nGDP moves from negative to moderately positive.\nCentral banks generally keep interest rates low to support the expanding economy.\nUnemployment levels decline but remain high. Layoffs slow, but employers are reluctant to hire new staff without evidence of sustained\neconomic growth.\n(Choice A) Inflation tends to lag other variables, exhibiting slow growth or even deflation. Inflation catches up to economic growth during the later\nexpansion phase.\n(Choice B) Early in the expansion, businesses are not yet willing or able to commit to large capital spending plans (eg, new manufacturing\nfacilities, expanding production capabilities). It is during the peak phase that business capital spending expands rapidly since confidence in the\nbusiness cycle is high.\nThings to remember:\nThe early expansion phase occurs after the economy has been in a trough, when economic activities begin to expand. GDP growth moves from\nnegative to moderately posi he management of financial market stability. This focus is influenced by their\nrecognition that credit cycle peaks are often associated with subsequent banking crises.\n(Choice B) Since the credit cycle is usually longer than the business cycle, credit tends to be an economic headwind early in the expansion\nphase of the business cycle. It is not uncommon for credit to still be contracting (tight, not loose) during this first stage of an economic recovery.\n(Choice C) A peaking credit cycle would intensify (not moderate) the economic downturn associated with a contraction of the business cycle.\nTypically, credit contraction and the associated reduction in asset values is well underway by the time the business cycle begins its downturn.\nThings to remember:\nLoose credit conditions, which often occur at the peak of a credit cycle, contribute to bubbles in financial assets such as stocks and real estate.\nDescribe the business cycle and its phases", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABC0AAAKHCAIAAAAquSXuAACJEklEQVR42u39fXRU95Xv+X8AgQTCVMHEYBwjSjF+JJjCwT1JDI3UzMQd4wRh9+1pQ7eRpm+WDd3rB3Jy84N5iKSsuRcm7VhoTTfYk74t4TvgnjsBhANOO2uISm2c3HVNjABjGyxHhXBbRqShSiCQQFjzx5a+Oa5SSaXnKun9Wl6sUrkeTp1z6tTZZ+/v/k7o7OwUAAAAAIygiawCAAAAAMQhAAAAAIhDAAAAAIA4BAAAAABxCAAAAAAQhwAAAAAgDgEAAAAA4hAAAAAAxCEAAAAAiEMAAAAAgDgEAAAAAHEIAAAAABCHAAAAACAOAQAAAADiEAAAAADEIQAAAACIQwAAAACAOAQAAAAAcQgAAAAAEIcAAAAAIA4BAAAAAOIQAAAAAMQhAAAAAIhDAAAAAIA4BAAAAABxCAAAAAAQhwAAAAAgDgEAAAAA4hAAAAAAxCEAAAAAQBwCAAAAgDgEAAAAAHEIgPFnQtK8zyotLXX3h0KhUCg05tdPfn5+6rxUmq6BFJGfn9/jjh0KhdydpaWlpaWlMU+MRCI93p9en9378TkAAhhJGawCAAD6pbq6WlJxcXE4HLY4nHUCACIfAgAAAEDkQwCko2AwKKm8vDyZBxcWFubl5XmfOFbV1NTYDb/fz04y5r8CbnMHAgHv/6qoqJBkyRAAgMiHAAAAABD5EADpy673uyzHAEQiEUl1dXXyXFEOBAJWW19XV2f3FBQU9JhbiEQi9kh31TkQCNjyxFycluRGxttLWU6mrq7OXsHv9xcUFPT4RBMOh+0VwuGwvUJBQUGiB/f+eaurq70LbOuwvy+lvkYmuLXqNlN8GsrbLcDv9w9gndgjI5GIrfbB7Ay2TkKhkN3oZSXHbEp7QFVVlbozb25vsZdyC9n77hS/gQKBQGFhYX8/iC2evVT8MiezipJcFd710GOOM iness cycles.", "amplify the duration and magnitude of business cycles."], "ans": "B", "expl": "Business cycles measure changes in economic activity. Financial cycles measure changes in financing and credit conditions (eg, pricing,\navailability, risk attitudes). Credit cycles are a subset of financial cycles and describe changes in availability and pricing (ie, interest\nrates/yields) of private sector credit, which has direct implications for the business cycle. Credit cycles tend to be procyclical, not\ncountercyclical, to business cycles since credit availability expands during economic expansions and contracts sharply during economic\ndownturns.\n(Choice A) The credit cycle tends to peak prior to the onset of a recession and is often a precursor to the peak of the economic cycle. As the\nbusiness cycle slows/contracts, lending institutions often severely restrict credit availability while increasing the cost of credit.\n(Choice C) Credit cycles tend to amplify the duration and magnitude of the business cycle: when the economy is expanding (contracting),\ncreditors are more (less) willing to lend, so the supply of credit increases (decreases) and its price decreases (increases), accelerating the trend of\nthe business cycle.\nThings to remember:\nCredit cycles are a subset of financial cycles and describe the change in availability and pricing of private sector credit, which has direct\nimplications for the business cycle. Credit cycles are procyclical since credit availability expands during economic expansions and contracts\nsharply during economic downturns.\nDescribe credit cycles", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABC0AAAKHCAIAAAAquSXuAACJEklEQVR42u39fXRU95Xv+X8AgQTCVMHEYBwjSjF+JJjCwT1JDI3UzMQd4wRh9+1pQ7eRpm+WDd3rB3Jy84N5iKSsuRcm7VhoTTfYk74t4TvgnjsBhANOO2uISm2c3HVNjABjGyxHhXBbRqShSiCQQFjzx5a+Oa5SSaXnKun9Wl6sUrkeTp1z6tTZZ+/v/k7o7OwUAAAAAIygiawCAAAAAMQhAAAAAIhDAAAAAIA4BAAAAABxCAAAAAAQhwAAAAAgDgEAAAAA4hAAAAAAxCEAAAAAiEM ZWWknE+Fw2E4R+ltMIs+YDYt2lixZ4s62vU1gy8vLbakikYj9L3cGY+fWa9as8Z7TyNOyyXU4dYs9hA1A7eSpoKBg5syZ3nM1W8hEY1Tix6u408FIJGL3bN682RvduXO4/Px8W0XBYNDeq8eaK31+UIetnJjt5c5Z/X6/vWlMOOd9om2gvLw8b2etZLbg2P6yxPfLKigocJ/aojVb7RMmTLB14krXAoFAzDaN2beTV15ebvu52w/dXmR7e6JvUI/LkGgB7JHFxcX2Ln6/P2a2RPtzx44dMeV5MYvnfWLM2nPfWXt8/FsAEHVZAAAAANCLCZ2dnawFAEAvbBC8JZeYqAEDY4Vnbn5SAKAuCwDQMxvHcvDgQTuDHHBlHeAmTU9mWBQAUZcFAAAAACIfAgAYMTaM3ufzjbeuVhiOfcnGlFPXB0DkQwAAAACIceoAAAAARD4EAAAAAIhDAAAAABCHAAAAAABxCAAAAADiEAAAAAAgDgEAAAAw2v4/2YPSvdVHyTkAAAAASUVORK5CYII="]}, {"n": 5, "q": "If an economy is in the early expansion phase of the business cycle, this most likely indicates that:", "opts": ["both inventory-to-sales ratios and labor utilization are increasing.", "both inventory-to-sales ratios and labor utilization are decreasing.", "inventory-to-sales ratios are decreasing, and labor utilization is increasing."], "ans": "C", "expl": "Business cycle impact on inventory-to-sales ratios and labor utilization\nInventory-to-sales ratio Labor utilization\nDecreases Increases\nEarly expansion\nProduction ramp-up lags sales growth Existing labor force used to meet demand; additional hiring postponed\nIncreases Decreases\nContraction\nProduction cuts lag sales decline Minimum employment level to maintain operations\nEconomies experience business cycle phases of expansion, peak, and contraction (ie, recession). Expansions are divided into early (ie, recovery)\nand late phases. Both the inventory-to-sales ratio and labor utilization rates are sensitive to stages of the business cycle, and changes in these\nareas often lag an economy's move from one phase to another.\nThe inventory-to-sales ratio measures the inventory available for sale relative to the level of sales. In the early phase of an expansion, as\nconsumer spending and sales begin to increase, companies may hold off on increasing production out of concern that the expansion is not yet\nunderway. This lag means that the rate of increase in sales typically outpaces the rate of increase in inventory, and the inventory-to-sales\nratio declines. During or soon after a peak, the inventory-to-sales ratio tends to increase as production cutbacks lag the slowdown in sales\n(Choice A).\nLabor utilization refers to how companies manage workforce productivity through hiring and firing practices. Companies tend to retain a certain\nworkforce strength during a downturn, even if not fully utilized. In the early expansion phase of the business cycle, companies meet increased\nproduct demand primarily by more fully utilizing the existing workforce and tend to postpone new hiring until later in the recovery (Choice B).\nThings to remember:\nIn the early expansion phase of the business cycle, the inventory-to-sales ratio tends to decline as production fails to keep pace with increased\nsales demand. Labor utilization increases as companies more fully utilize workers who were retained during the downturn.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": null}, {"n": 6, "q": "An economic diffusion index is most appropriately used to identify:", "opts": ["trend change.", "rate of change.", "magnitude of change."], "ans": "A", "expl": "A diffusion index measures the dispersion of change among its components by calculating the proportion of components that are increasing\nor decreasing in a period. Diffusion indexes are often used in economics to identify trends (ie, consecutive changes in the same direction) and\npotential turning points for metrics such as new orders, pricing, and employment. An index is usually based at 50 or zero, at which point activity is\ndeemed to be roughly unchanged from the prior period, with higher (or lower) values indicating increasing (or decreasing) levels of activity.\nFor example, one widely followed diffusion index is a monthly purchasing manager index (PMI). To create this index, national surveys are\nconducted in many countries to ask manufacturing and service purchasing managers about the current state of business in their organizations.\nThe new orders component of these surveys is considered a leading indicator; a reading above (or below) 50 indicates more firms are reporting\nimprovement (or deterioration) in orders compared to the previous month.\n(Choices B and C) Diffusion indexes capture trends (ie, direction of change), not the magnitude (ie, size) or rate (ie, speed) of change.\nThings to remember:\nA diffusion index measures the dispersion of change among components by calculating the proportion of components that are increasing or\ndecreasing in a period. Diffusion indexes capture trends, not magnitude or rates of change.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxwAAAJwCAIAAACMJPDKAABczUlEQVR42u3dX3Db95nv9w9jpdSaiQB511KcWZHQObbXE4ci3Ma92EgVeOK2p5FORSZXkdsheS7aY0+nEq9W7g3Jm7X3CtS5kM7VEpoeKTNtsyTnSNntjDOkjpTsdOWUoGBtvbI3BKmcOKI3EiCHjpjQYS8e4auffj8ABPEf4Ps1Hg8EggD4/f0APHie7/f5dmxubgoAAACV+QJDAAAAQFAFAABAUAUAAEBQBQAAAIIqAAAAgioAAACCKgAAAIIqAAAAEFQBAAAQVAEAABBUAQAAEFQBAACAoAoAAICgCgAAgKAKAACAoAoAAAAEVQAAAARVAAAABFUAAAAEVQAAACCoAgAAIKgCAAAgqAIAACCoAgAAAEEVAAAAQRUAAABBFQAAAAiqAAAACKoAAACaxS6GAK1lfn6++A1isVihH6XTafd/SdFoNBwOe2+QTCYlzc7O2j97enrs3iKRiP3WzMxMNpuVFAqF7LGi0Wh9/vB0Ou195pJ8T76xkslkJpPZ8hDshKFA8DVVt3MDaKyOzc1NRgGtdMp2dGx5m+HhYUnxeNz3WTsxMSFpfHzc/jk3N+fe4hOJhKSRkRHfXU1NTdknd39/v/ezwT2Q3aAOJiYmvM+82T6f+vv7Xbxb63eVJh8K+E4M73chPnEgyn8AAAAQ5T/sNJZ2SiaTlsYopTY0Ojrq/efp06ftF626NDEx4XJUAwMDylWd+vr6GG0AgCj/oaXLf7FYzGImPTl7Y2JiYmZmRp46YCkVOm9VMXjP9axtQZT/RPkPEOU/AAAAUf4DWpuV5Kanpw8ePCgpnU5bHdDNWLevy1evXrXbDw0N2YULFy7oycVlNqW9p6dneXn remain high because employers tend to halt layoffs but are slow to hire additional staff.\n(Choice A) During the peak phase, the GDP growth rate decelerates, possibly as a result of the shock to the economy or restrictive policies put in\nplace during expansion. Inflation tends to accelerate, which is a lagged reaction to the rising wages and input prices during the late expansion\nphase.\n(Choice B) Contraction is defined by negative GDP growth (ie, declining economic output) and is usually accompanied by a falling rate of\ninflation, which typically lags the decline in GDP.\nThings to remember:\nThe phases of the business cycle are expansion, peak, and contraction (ie, recession). Expansion is divided into the early and late phases. The\nearly phase of expansion occurs after the end of contraction. GDP moves from negative to positive, although it is moderate in growth. Inflation\ntends to be moderate in growth and may continue to fall.\nDescribe the business cycle and its phases", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+0AAALXCAIAAAB3szY7AACrCUlEQVR42uz9eXhc13nn+/5IAiQGiiiClCgOIIvyQFmyxKKUk44k0yh027Ed20Ehjuz2UdwELFud29cKAE954jytQqmP3SeeAMQ+93qSAFw3W207MQBPkiM7KEqmlKRjoShqjGSxSDoaKNEokAIBEiB4/3iNla1dAwoghirg+/mDD1Dc2LVrrb3XXvXud6214sKFCwIAAABQVFZSBAAAAAD9eAAAAAD04wEAAADQjwcAAADoxwMAAACgHw8AAACAfjwAAABAPx4AAAAA/XgAAAAA9OMBAAAA+vEAAAAA6McDAAAAoB8PAAAA0I8HAAAAQD8eAAAAAP14AAAAAPTjAQAAAPrxAAAAAOjHAwAAAKAfDwAAANCPBwAAAEA/HgAAAAD9eAAAAIB+PAAAAAD68QAAAADoxwMAAAD04wEAAADQjwcAAABAPx4AAAAA/XgAAACgCJVQBJhX3d3dkpLJZO7NQqFQOByWFAgEFv4g7fDsUCWFw2E7GCyWeDzu/pXU2NgoKRgMFuAp3dbWRn0VggW7il2NB4NBOzOXg1QqtTDt83wUb/rBe9/FtTCAiMcDAAAAWAArLly4QClg/tTV1ckTWM3BgiUDAwOhUEiLEf21Q5UUjUYJsi4uK/9YLGa/DgwMSCqQhyS+U5omVIX0DGcBruIVK1ZoKuRvZ6aWehg+FoslEgl3Jc5vp2TuijeVSlkbkn7w3ndZmM8FiLwaLAHpXTF7Gp5MJu2G0dDQcOTIkQU+KvsK4Y6tQPI3AGBx7dy50zrEC/Yt2r3RxQd0du7cabeV9IOfw3cBRF4NAAAAABGPR8HK9viyrq7OHosnk0n7YSGTKCwkw6NVAFBaXk0h3CPm9uBp7SHi8QAAAABEPB7LWW1trRs46J0dLJFItLa22s/ egarding\nGDP growth and inflation across cycles.\nPeaks occur after expansions have been ongoing for some time. There is often a lack of available labor and capital to fuel further growth. Most\nwho want to work have already found employment; capacity utilization is likely quite high. The lack of resources to expand production results in a\ndeceleration of growth. At the same time, tight labor markets and lack of excess capacity result in wages and prices being bid up, leading to an\nacceleration of inflation.\n(Choice B) A contraction is defined by negative GDP growth (ie, declining economic output). This is usually accompanied by falling rates of\ninflation, although the inflation decline typically lags the decline in GDP.\n(Choice C) The late expansion phase is characterized by an acceleration of both growth and inflation above the moderate rates typical for each in\nthe early expansion phase.\nThings to remember:\nThe phases of the business cycle are expansion, peak, contraction (ie, recession), and trough. Peaks are usually characterized by a lack of\navailable labor and capital resulting in a deceleration of growth. Tight labor markets and lack of excess capacity often result in wages and prices\nbeing bid up, leading to an acceleration of inflation.\nDescribe the business cycle and its phases", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+0AAALXCAIAAAB3szY7AACrCUlEQVR42uz9eXhc13nn+/5IAiQGiiiClCgOIIvyQFmyxKKUk44k0yh027Ed20Ehjuz2UdwELFud29cKAE954jytQqmP3SeeAMQ+93qSAFw3W207MQBPkiM7KEqmlKRjoShqjGSxSDoaKNEokAIBEiB4/3iNla1dAwoghirg+/mDD1Dc2LVrrb3XXvXud6214sKFCwIAAABQVFZSBAAAAAD9eAAAAAD04wEAAADQjwcAAADoxwMAAACgHw8AAACAfjwAAABAPx4AAAAA/XgAAAAA9OMBAAAA+vEAAAAA6McDAAAAoB8PAAAA0I8HAAAAQD8eAAAAAP14AAAAAPTjAQAAAPrxAAAAAOjHAwAAAKAfDwAAANCPBwAAAEA/HgAAAAD9eAAAAIB+PAAAAAD68QAAAADoxwMAAAD04wEAAADQjwcAAABAPx4AAAAA/XgAAACgCJVQBJhX3d3dkpLJZO7NQqFQOByWFAgEFv4g7fDsUCWFw2E7GCyWeDzu/pXU2NgoKRgMFuAp3dbWRn0VggW7il2NB4NBOzOXg1QqtTDt83wUb/rBe9/FtTCAiMcDA  Unemployment Record low Unit labor costs Modestly rising Industrial production growth Steadily higher Residential building permits Steady decline New orders for manufacturing Steady decline Long-term bond yields Declined 1% Short-term bond yields Stable This mix of economic indicators most likely forecasts near-term future economic:", "opts": ["stability.", "acceleration.", "deceleration."], "ans": "C", "expl": "Certain economic and financial measures have historically exhibited consistent patterns indicating the stage of the business cycle. These\neconomic indicators are characterized as leading, coincident, or lagging indicators.\nLeading indicators provide the most value to investment practitioners since they signal changes in real GDP several months to a year in\nadvance. Coincident indicators move largely in tandem with the economy, and lagging indicators trail changes in the economy by several months\nor quarters. How specific indicators are classified will vary from country to country, but leading indicators that are consistent across most\neconomies include:\nInterest rate spread\nResidential building permits/construction\nStock market performance\nNew manufacturing/machinery orders\nBusiness confidence/expectations\nIn this scenario, all three leading indicators are indicating a period of economic deceleration or slowing growth in the coming quarters.\nResidential building permits and new orders for manufacturing have been in steady decline. The interest rate spread is the difference\nbetween short-term rates and long-term rates. A narrowing of the spread, as is the case here (ie, the yield curve flattened by 1%), implies\neconomic deceleration.\nThings to remember:\nLeading indicators provide the most value to investment practitioners since they signal changes in real GDP several months to a year in advance.\nResidential building permits, new orders for manufacturing, and interest rate spread are all leading indicators.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators\n10.After a prolonged recession, a developed economy has experienced several quarters of rapid GDP growth and strong increases in average\nhourly earnings. The most likely impacts on housing sector activity and an existing trade deficit are that:\n\nA. both increase.\nB. both decrease.\nC. housing sector activity increases and the trade deficit decreases.\nExplanation\nRapid GDP growth after a prolonged recession implies an economy in the early expansion phase of the business cycle. The housing and external\ntrade sectors are sensitive to business cycle changes.\nHousing sector activity, such as existing home sales and new construction, is sensitive to affordability (ie, housing prices versus income). In the\nearly expansion phase, home prices are relatively low, a carryover from the preceding contraction. Low home prices, in addition to rising\nincomes due to the expansion, drive demand. Consumers reinforce the effect by buying in anticipation of housing appreciation fueled by a\nstrengthening economy.\nTrade deficits occur when imports exceed exports. Imports are directly related to domestic income (ie, GDP). As incomes rise, demand\nincreases, which consequently increases the purchasing of domestic products and foreign goods (ie, increased imports). Domestic exports are a\nfunction of income in foreign countries; therefore, the state of the domestic business cycle has no direct impact on a country's exports. The\nresult is an increase in the trade deficit.\nThings to remember:\nBoth housing sector activity and trade deficits are likely to increase during the early expansion phase. Housing sector activity improves due to\nimproved affordability (ie, relatively low prices and rising incomes) and anticipated housing appreciation. The trade deficit worsens since rising\ndomestic income leads to increased imports.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7gAAAIDCAIAAAChISUOAACJiElEQVR42u39X2xd15XniS/aZNxkEvJa/E1TraHES7WtBhRYpFB+kLuLRTIPNXHitMSeh7LbRot86HHaapTERsFOlAFIAhOl5Ich2UCqkpkHkYD1i+uhocu286frIaSKVZYeVNClDKurJbR4abMKZFXTvmQSshMq5jx8zZWtc+4//pP45/OBYVDnnrPPPnuvvc86a6+1dtnKyooBAAAAAMCDPEYTAAAAAACgKAMAAAAAoCgDAAAAAKAoAwAAAACgKAMAAAAAoCgDAAAAAKAoAwAAAABsB8o3cjE5mAEAAABgp1BWVra1inKoHKMoAwAAAMBu1ZtxvQAAAAAAyKVJl24V9jP1x6effqo/VlZWMC0DAAAAwLa1HMt4XFZW9thjj1lgSy5sVMaiDAAAAABg6/RRdsux/v+b3/zGzH7zm9/oj08//fTTTz81XJYBAAAAwLadF/Jjjz0mQ/Ljjz/++OOP649S7MrlpWjJ7msh/fjXv/61mf3617/WH8vLy64xE+QHAAAAANskSs/144qKCjP73Oc+97nPfU5/6LhOyKcr43oBAAAAAGBrsyhHovdkNv7Vr361uLhoZmVlj33+C190VR0AAAAAYFsh9fWTjz/+H//jf5hZVVXV5z//eVdun3jiCQ/y05GIXbkk1wvdQ44Wi4uLT/yjSjOTBRsA9hp/PztjZv+4bj9NAaXLDAIDzI3wSJAv8v/vf/lfKquqzCwzee/+/fuWKxsGrhcAAAAAALZpWS8+/fTT0KJcVvYYtmQAAAAA2EHI4+ILX/hiNps1s/LycjOrqKjQH4899phsz1aiRXklQJnglOZChmsAAAAAgJ3Fgf/1f11YWFhYWPjlL3/5y1/+8te//rW03FDvxfUCAAAAAMA26nqxsrKiBMnLy8vkuAAAAACAHUpFRYWyt/3qV7+Sclt417w1KMphkCAAAAAAwI7DVWQpt4UVZczDAAAAAAC2Houya9lsTA0AAAAAtvO3INH/49F7hkUZAAAAAMA2xaIMAAAAALALWJOjRPlaywUAAAAA2NGKconKLa4XAAAAAAAoygAAAAAAKMoAAAAAACjKAAAAAABG1gsAAIDtyPj4uJl99fmvmNmPf/LTlpaWTSn2q89/paXl98zsW+fPf/fCBTMbH/+LH//kp1v0CDU1NWZ27NgxOvRRCU8Bzp//9rfOn9+VLbDVso2iDAAAsMt5+ZWXzexrL7ywReV/9fmvbB81ZW9y8eKbZvZMng+VhoZDyLbhegEAAAAAYFiUAQAA9gIffjhlZlNTH5rZsWPH5OQQ59atW/Pz82YWd944dKjBzA7FrIo6/9atW/pnPq8PL7mmpqZ054oSC/cHzGbncd5YN7Ill+638+GHU5KoAj4z8uvwX/MJnp9ZoKjShSE8M5R2v0Wk/AKy7bdbU8sYFmUAAAAAAMOiDAAAYDswSEsRWufPf/vChe+EP33/Bz8ws5dffsVWTYMvvfiiBea6uEkvZ8DT5ctvvfH667ZqwzOzQw0NP/zh2ypBpb300otm9uHUlF+lwn/8k5/K1PfFL3zeVt2Uw6CxnIWb2Q9/+LZXT5ccami4/NZbXv4P3377hRe+jgBsHW+88bqZ/cn3vhcebGlp+eHbf2ZmNTU13vXe7+rri2++GQreV5//ivp0fHw8IiESMzcGlyIMEqTX  (ie, housing prices versus income). In the\nearly expansion phase, home prices are relatively low, a carryover from the preceding contraction. Low home prices, in addition to rising\nincomes due to the expansion, drive demand. Consumers reinforce the effect by buying in anticipation of housing appreciation fueled by a\nstrengthening economy.\nTrade deficits occur when imports exceed exports. Imports are directly related to domestic income (ie, GDP). As incomes rise, demand\nincreases, which consequently increases the purchasing of domestic products and foreign goods (ie, increased imports). Domestic exports are a\nfunction of income in foreign countries; therefore, the state of the domestic business cycle has no direct impact on a country's exports. The\nresult is an increase in the trade deficit.\nThings to remember:\nBoth housing sector activity and trade deficits are likely to increase during the early expansion phase. Housing sector activity improves due to\nimproved affordability (ie, relatively low prices and rising incomes) and anticipated housing appreciation. The trade deficit worsens since rising\ndomestic income leads to increased imports.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2sAAAFBCAIAAABmf6C+AABip0lEQVR42u29TXAb15X3fWhL8Xg0b6HlmTeJ35kiIHs1TpkCl8kYJriLM1QRWI1UUhXAlfyYUwViI06YBYiFmZE3IKsij70i6KLKStX7vgRLfJLsCJqeZCmQrvjZmQ1WkkqysBozjyqRLYvP4m+eXN1GNxrgh/jx/y1cdKv7fpx7+/bBOfec27ezsyOEEEIIIYRE5hmKgBBCCCGEUIMkhBBCCCHUIAkhhBBCCDVIQgghhBBCDZIQQgghhFCDJIQQQgghhBokIYQQQgihBkkIIYQQQqhBEkIIIYQQapCEEEIIIYQaJCGEEEIIoQZJCCGEEEIINUhCCCGEEEINkhBCCCGEUIMkhBBCCCHUIAkhhBBCCDVIQgghhBBCqEESQgghhBBqkIQQQgghhBokIYQQQgihBkkIIYQQQqhBEkIIIYQQapCEEEIIIYRQgySEEEIIIdQgCSGEEEIINUhCCCGEEEINkhBCCCGEUIMkhBBCCCHUIAkhhBBCCOmCM90+4Lqu67rh9yQSCf t rate spread\nReal personal income\nIndustrial production indexes\nCoincident Within a few months before or after\nNonagricultural payroll\nManufacturing and trade sales\nAverage duration of unemployment\nInventory-sales ratio\nLagging Several months to a quarter behind\nBank prime lending rate\nChange in unit labor costs\nVarious statistics drawn from the real economy and the financial markets have historically exhibited stable patterns of change relative to turns in\nthe business cycle. These economic indicators are characterized as leading, coincident, or lagging indicators.\nLeading indicators signal economic change several months to a year in advance of a change in real GDP growth rates. Coincident indicators\nmove largely in tandem with the economy. Lagging indicators trail changes in the economy by several months or quarters.\nThe spread between short-term (eg, three-month government security) and long-term (eg, ten-year government bond) interest rates as well as\ninitial claims for unemployment insurance are leading indicators. A narrowing of the spread of long-term over short-term rates and increases\nin new applications for unemployment compensation usually foreshadow a weakening economy. Changes in the opposite direction forecast\neconomic strengthening.\nIn this case, both indicators are exhibiting negative signals. Before the specified changes occurred, the indicators had been consistent with a\nweakening economy, and both have become even more negative. Initial unemployment claims have increased more rapidly. The spread between\nshort-term and long-term rates must have previously narrowed since it has recently inverted. Both indicators signify an economy going from bad\nto worse.\nBased on the information about the indicators, the most appropriate forecast is for further slowing of growth, if not an outright contraction of\neconomic activity (ie, a recession).\nThings to remember:\nChanges in leading indicators precede changes in the direction of the economy. The spread between short- and long-term rates and new\napplications for unemployment insurance are leading indicators. A narrower spread or an increase in unemployment applications usually precedes\neconomic weakening.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": null}, {"n": 12, "q": "As an economy moves from an expansion to a contraction phase of the business cycle, which of the following indicators is most likely the last to signal a turn in the business cycle?", "opts": ["Average duration of unemployment", "Average weekly hours in manufacturing", "Building permits for new private housing units"], "ans": "A", "expl": "Economic indicators\nType Turning point relative to economy Examples\nInitial unemployment claims\nStock market indexes\nLeading Several months to a year ahead\nConsumer expectations\nShort/long-term interest rate spread\nReal personal income\nIndustrial production indexes\nCoincident Within a few months before or after\nNonagricultural payroll\nManufacturing and trade sales\nAverage duration of unemployment\nInventory-sales ratio\nLagging Several months to a quarter behind\nBank prime lending rate\nChange in unit labor costs\nEconomic indicators help provide insight on the overall state of the economy and are classified as either leading, coincident, or lagging indicators.\nLagging indicators tend to reflect economic conditions of the previous few months or quarters. Given previous worsening of the leading and\ncoincident indicators, a worsening of the lagging indicators confirms a business cycle has peaked and is in a contractionary phase.\nAverage duration of unemployment is a lagging indicator since businesses hesitate to lay off workers due to the high costs of training and low\nproductivity of new employees. Therefore, businesses typically wait several months to confirm the recession has truly started before laying off\nworkers. Likewise, when the economy first appears to be coming out of a recession, businesses defer hiring until a recovery is confirmed by\nseveral months or quarters of rising GDP.\n(Choice B) Average weekly hours in manufacturing usually decline before a contraction begins since businesses initially reduce overtime rather\nthan laying off workers when the economy slows. Likewise, companies increase overtime before rehiring workers when a recovery begins.\nAverage weekly hours is a leading indicator.\n(Choice C) Most governments require building permits prior to construction. Since developers plan construction projects long in advance,\nbuilding permits is a leading indicator.\nThings to remember:\nLagging indicators tend to reflect economic conditions of the previous few months or quarters and are interpreted as confirming signals previously\ngiven by leading and coincident indicators. Average duration of unemployment is a lagging indicator since businesses are slow to fire (hire)\nemployees until seeing confirmation of a contraction (expansion).\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null, "explfigs": null}];

let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
