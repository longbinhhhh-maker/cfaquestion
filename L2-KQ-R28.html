y/gain when rates increase/decrease above the fixed contract rate; the short position in an FRA has a liability/gain when rates increase/decrease above the contract rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>The floating-rate payer in a simple interest-rate swap has a position that is equivalent to:<\/p><\/div>", "subj": "derivatives"}, {"n": 21, "q": "A company has chosen to use a 6 x 9 FRA expiring in 6 months to mitigate the risk of paying a floating coupon on the bond issue. The current term structure for MRR is as follows: Term Interest Rate 180 days 5.65% 270 days 5.95% What is the price of this forward rate agreement (FRA)?", "opts": ["6.37%", "3.19%", "$6.37"], "ans": "A", "expl": "The price of an FRA is the fixed rate. To determine the FRA's fixed rate, the following formula should be used: ⎛  ⎞ | 1+rYP  360 | (  ) | ⎝  ⎠ | FRA price =  −1 Y−X 1+rXP ⎡  ⎤ | 1+.0595(  ) 270 ⎢⎢⎢  ⎥⎥⎥ 360 360 (  ) = 0.0637 | =  −1 90 ⎣  ⎦ | 1+.0565(  ) −−−−−− 180 −−−−−− 360 The FRA's fixed rate would be quoted as 6.37%. The price of an FRA is given as a rate percentage, never as a dollar amount.", "explhtml": "<p>The price of an FRA is the fixed rate. To determine the FRA&#x27;s fixed rate, the following formula should be used:<\/p><div class=\"tbl\"><table><tr><td>⎛<\/td><td>⎞<\/td><\/tr><tr><td>1+rYP<\/td><td>360<\/td><\/tr><tr><td>(<\/td><td>)<\/td><\/tr><tr><td>⎝<\/td><td>⎠<\/td><\/tr><tr><td>FRA price =<\/td><td>−1<\/td><\/tr><\/table><\/div><p>Y−X<\/p><p>1+rXP<\/p><div class=\"tbl\"><table><tr><td>⎡<\/td><td>⎤<\/td><\/tr><tr><td>1+.0595(<\/td><td>)<\/td><\/tr><\/table><\/div><p>270 ⎢⎢⎢ &nbsp; ⎥⎥⎥<\/p><p>360<\/p><p>360<\/p><div class=\"tbl\"><table><tr><td>(<\/td><td>) = 0.0637<\/td><\/tr><tr><td>=<\/td><td>−1<\/td><\/tr><\/table><\/div><p>90<\/p><div class=\"tbl\"><table><tr><td>⎣<\/td><td>⎦<\/td><\/tr><tr><td>1+.0565(<\/td><td>)<\/td><\/tr><\/table><\/div><p>−−−−−−<\/p><p>180<\/p><p>−−−−−−<\/p><p>360<\/p><p>The FRA&#x27;s fixed rate would be quoted as 6.37%.<\/p><p>The price of an FRA is given as a rate percentage, never as a dollar amount.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>A company has chosen to use a 6 x 9 FRA expiring in 6 months to mitigate the risk of paying a floating coupon on the bond issue. The current term structure for MRR is as follows:<\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Interest Rate<\/td><\/tr><tr><td>180 days<\/td><td>5.65%<\/td><\/tr><tr><td>270 days<\/td><td>5.95%<\/td><\/tr><\/table><\/div><p>What is the price of this forward rate agreement (FRA)?<\/p><\/div>", "subj": "derivatives"}, {"n": 22, "q": "The price of a forward contract:", "opts": ["depends on forward interest rates.", "is determined at contract initiation.", "changes over the term of the contract."], "ans": "B", "expl": "The price of a forward contract is established at the initiation of the contract and is expressed in different terms, depending on the underlying assets. It is the price that makes the contract value zero, and depends on current interest rates through the cost-of-carry calculation.", "explhtml": "<p>The price of a forward contract is established at the initiation of the contract and is expressed in different terms, depending on the underlying assets. It is the price that makes the contract value zero, and depends on current interest rates through the cost-of-carry calculation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The price of a forward contract:<\/p><\/div>", "subj": "derivatives"}, {"n": 23, "q": "In an equity return swap for MRR, if the return on the underlying equity portfolio is negative for a payment period, the equity return payer will:", "opts": ["make a net payment greater than the loss of value on the equity portfolio.", "receive a net payment greater than the loss of value on the equity portfolio.", "receive a net payment less than the loss of value on the equity portfolio."], "ans": "B", "expl": "The equity return payer will receive the periodic interest payment and \"pay\" the negative return on the portfolio, resulting in a net payment to the equity return payer that is greater than the loss on the equity portfolio.", "explhtml": "<p>The equity return payer will receive the periodic interest payment and &quot;pay&quot; the negative return on the portfolio, resulting in a net payment to the equity return payer that is greater than the loss on the equity portfolio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>In an equity return swap for MRR, if the return on the underlying equity portfolio is negative for a payment period, the equity return payer will:<\/p><\/div>", "subj": "derivatives"}, {"n": 24, "q": "Which of the following best describes the price of a forward contract? The forward price is:", "opts": ["always expressed in dollars.", "always equal to the market price at contract termination.", "the price that makes the values of the long and short positions zero at contract initiation."], "ans": "C", "expl": "The forward price is the contract price of the underlying asset under the terms of the forward contract, and is the price that makes the values of the long and short positions zero at contract initiation. It is not the amount it costs to purchase the forward contract. The forward price is expressed in terms of the underlying asset, and may be a dollar value, exchange rate, or interest rate. The value of a forward contract comes from the difference between the forward contract price and the market price for the underlying asset. These values are likely to be different at contract termination, which will result in a profit for either the long or the short position.", "explhtml": "<p>The forward price is the contract price of the underlying asset under the terms of the forward contract, and is the price that makes the values of the long and short positions zero at contract initiation. It is not the amount it costs to purchase the forward contract. The forward price is expressed in terms of the underlying asset, and may be a dollar value, exchange rate, or interest rate. The value of a forward contract comes from the difference between the forward contract price and the market price for the underlying asset. These values are likely to be different at contract termination, which will result in a profit for either the long or the short position.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>Which of the following best describes the price of a forward contract? The forward price is:<\/p><\/div>", "subj": "derivatives"}, {"n": 25, "q": "Which of the following comments relating to Brodeur's use of a forward rate agreement is least accurate?", "opts": ["A short FRA can be used to lock into a fixed rate of borrowing commencing in two months’ time and expiring in five months’ time.", "The use of a FRA to hedge interest rate risk would lock Brodeur into paying a fixed rate plus 40 basis points for her borrowing.", "The use of a FRA to hedge interest rate risk on her future loan will mean that she no longer benefits if interest rates fall."], "ans": "A", "expl": "A long FRA will create the obligation to pay fixed and receive floating from months 2 to month 5. The floating payments will offset her bank loan leaving her with a pay fixed obligation, where the fixed rate is determined today. The floating receipt on the FRA and the floating payment on the loan she will need to take out will offset leaving a net payment of 40 basis points. Overall, she will now pay the fixed rate on the swap plus the 40 basis points on the loan. The use of a long FRA will lock Elodie into paying fixed interest rate on the FRA (the FRAs forward price) plus the basis points on her loan above MRR. Elodie will no longer benefit from interest rate declines but will be protected from interest rises.", "explhtml": "<p>A long FRA will create the obligation to pay fixed and receive floating from months 2 to month 5. The floating payments will offset her bank loan leaving her with a pay fixed obligation, where the fixed rate is determined today.<\/p><p>The floating receipt on the FRA and the floating payment on the loan she will need to take out will offset leaving a net payment of 40 basis points. Overall, she will now pay the fixed rate on the swap plus the 40 basis points on the loan.<\/p><p>The use of a long FRA will lock Elodie into paying fixed interest rate on the FRA (the FRAs forward price) plus the basis points on her loan above MRR. Elodie will no longer benefit from interest rate declines but will be protected from interest rises.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 25–28). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following comments relating to Brodeur&#x27;s use of a forward rate agreement is least accurate?<\/p><\/div>", "subj": "derivatives"}, {"n": 26, "q": "Using the data in Exhibit 1, which of the following is closest to the forward price of the FRA?", "opts": ["2.4%.", "2.8%.", "3.0%."], "ans": "C", "expl": "Step 1: Identify the correct MRR rates. We will require the MRR rate until FRA expiry (day 60) and also the MRR rate at the end of the borrowing/lending period (day 150). The 90-day MRR rate is a distractor. Elodie will borrow for 90 days but not from current date (T0). Elodie requires a 90-day loan commencing in 60 days' time. Step 2: Unannualize the quoted rates. 60 MRR60 day = 2% ×   = 0.3333% 360 150 MRR150 day = 2.6% ×   = 1.0833% 360 Step 3: Compute the annualized forward price (fixed rate) starting in 60 days and lasting for 90 days. Forward rate = ((1 + long rate) / (1 + short rate) – 1)(360 / 90) = 2.99%", "explhtml": "<p>Step 1: Identify the correct MRR rates.<\/p><p>We will require the MRR rate until FRA expiry (day 60) and also the MRR rate at the end of the borrowing/lending period (day 150).<\/p><p>The 90-day MRR rate is a distractor. Elodie will borrow for 90 days but not from current date (T0). Elodie requires a 90-day loan commencing in 60 days&#x27; time.<\/p><p>Step 2: Unannualize the quoted rates.<\/p><p>60 MRR60 day = 2% ×  &nbsp; = 0.3333%<\/p><p>360<\/p><p>150 MRR150 day = 2.6% ×  &nbsp; = 1.0833%<\/p><p>360<\/p><p>Step 3: Compute the annualized forward price (fixed rate) starting in 60 days and lasting for 90 days.<\/p><p>Forward rate = ((1 + long rate) / (1 + short rate) – 1)(360 / 90) = 2.99%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>Using the data in Exhibit 1, which of the following is closest to the forward price of the FRA?<\/p><\/div>", "subj": "derivatives"}, {"n": 27, "q": "For this question only, assume that the forward price of the FRA was 2.9%. Which of the following is the closest to the value accrued on the FRA from Brodeur's perspective one month after initiation of the contract?", "opts": ["+€2,300.", "+€2,200.", "–€2,265."], "ans": "A", "expl": "The value of a FRA before expiry can be calculated by comparing the fixed rate on the original FRA to the fixed rate on a new FRA covering the same borrowing and lending period. Step 1: Identify the correct MRR rates. After 1 month has passed there is now 1 month until the original FRAs expiry and 4 months to the end of the borrowing and lending period. So we will require 30 day and 120 day MRR (i.e., (1 × 4) FRA price) Step 2: Unannualize rates. 30 MRR30 day = 1.8% ×   = 0.15% 360 120 MRR120 day = 2.8% ×   = 0.9333% 360 Step 3: Compute the fixed rate (forward price) on a new FRA with the same expiry as the original FRA. Forward rate = ((1 + long rate) / (1 + short rate) – 1)(360 / 90) = 3.1286% Step 4: Compute the gain/(loss) on FRA at the end of the borrowing/lending period. Gain to long = (new fixed rate – original fixed rate)(days / 360)(notional) = (0.0313 – 0.029)(90 / 360)(4m) = 2,300 Step 5: Discount the gain/(loss) from the end of borrowing and lending to the valuation date (120 days). €2,300 = €2, 278 1.009333", "explhtml": "<p>The value of a FRA before expiry can be calculated by comparing the fixed rate on the original FRA to the fixed rate on a new FRA covering the same borrowing and lending period.<\/p><p>Step 1: Identify the correct MRR rates.<\/p><p>After 1 month has passed there is now 1 month until the original FRAs expiry and 4 months to the end of the borrowing and lending period. So we will require 30 day and 120 day MRR (i.e., (1 × 4) FRA price)<\/p><p>Step 2: Unannualize rates.<\/p><p>30 MRR30 day = 1.8% ×  &nbsp; = 0.15%<\/p><p>360 120 MRR120 day = 2.8% ×  &nbsp; = 0.9333%<\/p><p>360<\/p><p>Step 3: Compute the fixed rate (forward price) on a new FRA with the same expiry as the original FRA.<\/p><p>Forward rate = ((1 + long rate) / (1 + short rate) – 1)(360 / 90) = 3.1286%<\/p><p>Step 4: Compute the gain/(loss) on FRA at the end of the borrowing/lending period.<\/p><p>Gain to long = (new fixed rate – original fixed rate)(days / 360)(notional)<\/p><p>= (0.0313 – 0.029)(90 / 360)(4m) = 2,300<\/p><p>Step 5: Discount the gain/(loss) from the end of borrowing and lending to the valuation date (120 days).<\/p><p>€2,300<\/p><p>= €2, 278<\/p><p>1.009333<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>For this question only, assume that the forward price of the FRA was 2.9%. Which of the following is the closest to the value accrued on the FRA from Brodeur&#x27;s perspective one month after initiation of the contract?<\/p><\/div>", "subj": "derivatives"}, {"n": 28, "q": "Assuming the forward price of the FRA was 2.9%, which of the following is closest to the value of the FRA at expiration?", "opts": ["€4,958.", "€5,000.", "€19,831."], "ans": "A", "expl": "Step 1: Compute gain/(loss) at end of borrowing and lending period. 90 (floating rate −fixed rate) (  ) (notional principal) 360 90 (0.034 −0.029) (  ) (€4m) = €5, 000 360 Step 2: Discount the gain/(loss) back to FRA expiry (90 days). 90 MRR90 day = 3.4% ×   = 0.85 % 360 €5,000 = €4, 958 1.0085", "explhtml": "<p>Step 1: Compute gain/(loss) at end of borrowing and lending period.<\/p><p>90 (floating rate −fixed rate) ( &nbsp; ) (notional principal)<\/p><p>360<\/p><p>90 (0.034 −0.029) ( &nbsp; ) (€4m) = €5, 000<\/p><p>360<\/p><p>Step 2: Discount the gain/(loss) back to FRA expiry (90 days).<\/p><p>90 MRR90 day = 3.4% ×  &nbsp; = 0.85 %<\/p><p>360<\/p><p>€5,000<\/p><p>= €4, 958<\/p><p>1.0085<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>Assuming the forward price of the FRA was 2.9%, which of the following is closest to the value of the FRA at expiration?<\/p><\/div>", "subj": "derivatives"}, {"n": 29, "q": "To initiate an arbitrage trade if the futures contract is underpriced, the trader should:", "opts": ["borrow at the risk-free rate, short the asset, and sell the futures.", "short the asset, invest at the risk-free rate, and buy the futures.", "borrow at the risk-free rate, buy the asset, and sell the futures."], "ans": "B", "expl": "If the futures price is too low relative to the no-arbitrage price, buy futures, short the asset, and invest the proceeds at the risk-free rate until contract expiration. Take delivery of the asset at the futures price, pay for it with the loan proceeds and keep the profit. For Treasury bill (T-bills), shorting the asset is equivalent to borrowing at the T-bill rate.", "explhtml": "<p>If the futures price is too low relative to the no-arbitrage price, buy futures, short the asset, and invest the proceeds at the risk-free rate until contract expiration. Take delivery of the asset at the futures price, pay for it with the loan proceeds and keep the profit. For Treasury bill (T-bills), shorting the asset is equivalent to borrowing at the T-bill rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>To initiate an arbitrage trade if the futures contract is underpriced, the trader should:<\/p><\/div>", "subj": "derivatives"}, {"n": 30, "q": "A U.S. firm (U.S.) and a foreign firm (F) engage in a 3-year, annual pay currency swap; The USD fixed rate at initiation was 5% while FC fixed rate was 4%. At the beginning of the swap, $2 million was paid by the U.S. firm and the exchange rate was 2 FC units per $1. At the end of the swap period the exchange rate was 1.75 FC units per $1. At the end of year 1, firm:", "opts": ["F pays firm U.S. $200,000.", "U.S. pays firm F 160,000 FC units.", "U.S. pays firm F $200,000."], "ans": "B", "expl": "Firm U.S. pays fixed 4% on FC = 0.04 × $2,000,000 × 2 FC units per $1 = 160,000 FC units.", "explhtml": "<p>Firm U.S. pays fixed 4% on FC = 0.04 × $2,000,000 × 2 FC units per $1 = 160,000 FC units.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>A U.S. firm (U.S.) and a foreign firm (F) engage in a 3-year, annual pay currency swap; The USD fixed rate at initiation was 5% while FC fixed rate was 4%. At the beginning of the swap, $2 million was paid by the U.S. firm and the exchange rate was 2 FC units per $1. At the end of the swap period the exchange rate was 1.75 FC units per $1.<\/p><p>At the end of year 1, firm:<\/p><\/div>", "subj": "derivatives"}, {"n": 31, "q": "For a 1-year quarterly-pay swap, an equivalent position with short puts and long calls would involve:", "opts": ["put-call combinations expiring on each of the four settlement dates.", "three put-call combinations on the last three settlement dates of the swap.", "three put-call combinations expiring on the first three settlement dates of the swap."], "ans": "C", "expl": "Interest rate options pay one period after exercise. Options expiring on settlements at t = 1,2,3, will mimic the uncertain swap payments at t = 2,3,4.", "explhtml": "<p>Interest rate options pay one period after exercise. Options expiring on settlements at t = 1,2,3, will mimic the uncertain swap payments at t = 2,3,4.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>For a 1-year quarterly-pay swap, an equivalent position with short puts and long calls would involve:<\/p><\/div>", "subj": "derivatives"}, {"n": 32, "q": "Champion and Silvers each gave a reason for why the futures price of the S&P 500 index might be less than the spot price. With respect to their statements, it is most accurate to conclude that:", "opts": ["neither statement is valid.", "Champion's statement is invalid while Silver's statement is valid.", "both statements are valid."], "ans": "C", "expl": "The equation for the price of a futures contract on an equity index is FP = S₀ × e(R − σ) × T, where σ is the dividend yield and R is the risk-free rate. If R < σ, then FP < S₀ and Champion is correct. Silvers could be correct in that backwardation is defined as FP < S₀, with the relationship being caused by the risk aversion of hedgers of long asset positions. Their risk aversion makes them willing to take short contracts at lower prices than otherwise might be the case.", "explhtml": "<p>The equation for the price of a futures contract on an equity index is FP = S<sub>0<\/sub> × e<sup>(R − <\/sup><sup>σ<\/sup><sup>) × T<\/sup>, where σ is the dividend yield and R is the risk-free rate. If R &lt; σ, then FP &lt; S<sub>0<\/sub> and Champion is correct. Silvers could be correct in that backwardation is defined as FP &lt; S<sub>0<\/sub>, with the relationship being caused by the risk aversion of hedgers of long asset positions. Their risk aversion makes them willing to take short contracts at lower prices than otherwise might be the case.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–35<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 32–35). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Champion and Silvers each gave a reason for why the futures price of the S&amp;P 500 index might be less than the spot price. With respect to their statements, it is most accurate to conclude that:<\/p><\/div>", "subj": "derivatives"}, {"n": 33, "q": "For a futures contract on an asset with no storage costs, convenience yield, or other expected cash flows over the term of the contract, there should be a:", "opts": ["positive correlation between the futures price and both interest rates and the spot price.", "positive correlation between the futures price and interest rates and a negative correlation between the futures price and the spot price.", "negative correlation between the futures price and interest rates and a positive correlation between the futures price and the spot price."], "ans": "A", "expl": "The equation for the no-arbitrage price of a futures contract with no storage costs, convenience yield, or other expected cash flows over the term of the contract is FP = S₀ × (1 + R)T, so the futures price is positively correlated with both the interest rate and the spot price.", "explhtml": "<p>The equation for the no-arbitrage price of a futures contract with no storage costs, convenience yield, or other expected cash flows over the term of the contract is FP = S<sub>0<\/sub> × (1 + R)<sup>T<\/sup>, so the futures price is positively correlated with both the interest rate and the spot price.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–35<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>For a futures contract on an asset with no storage costs, convenience yield, or other expected cash flows over the term of the contract, there should be a:<\/p><\/div>", "subj": "derivatives"}, {"n": 34, "q": "Oil futures prices might be higher than the spot price because:", "opts": ["there are more costs than benefits to holding the asset.", "of reverse contango.", "there are more benefits than costs to holding the asset."], "ans": "A", "expl": "In calculating the futures price, we would subtract the benefits of holding the asset, e.g., the present value of dividends and coupons, and add the costs of holding the asset. Oil does not pay a dividend, and there would be costs for holding oil. Contango describes the situation where the futures price exceeds the spot price, and there is not such thing as reverse contango.", "explhtml": "<p>In calculating the futures price, we would subtract the benefits of holding the asset, e.g., the present value of dividends and coupons, and add the costs of holding the asset. Oil does not pay a dividend, and there would be costs for holding oil. Contango describes the situation where the futures price exceeds the spot price, and there is not such thing as reverse contango.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–35<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>Oil futures prices might be higher than the spot price because:<\/p><\/div>", "subj": "derivatives"}, {"n": 35, "q": "The no-arbitrage futures price of the Euro-bond contract is closest to:", "opts": ["€110.61.", "€102.85.", "€94.83."], "ans": "C", "expl": "There will be 2 seminauunual coupon payments during the life of the futures contract: one in 6 months (t=0.5, T-t = 0.7) and one in one year (t=1, T-t = 0.2). Full price = €104.10 (since the bund just paid coupon, AI₀ = 0) Step 1: compute the FV of 2 coupons: FVC = (1.25 × (1.01)0.7) + (1.25 × (1.01)0.2) = 2.51 Step 2: Compute Quoted Future price: QFP = [bund price × (1 + Rf)T − AIT - FVC] /CF = (104.10 × (1.01)1.2 − 0.42 – 2.51)/1.08 = €94.83", "explhtml": "<p>There will be 2 seminauunual coupon payments during the life of the futures contract: one in 6 months (t=0.5, T-t = 0.7) and one in one year (t=1, T-t = 0.2). Full price = €104.10 (since the bund just paid coupon, AI<sub>0<\/sub> = 0)<\/p><p>Step 1: compute the FV of 2 coupons: FVC = (1.25 × (1.01)<sup>0.7<\/sup>) + (1.25 × (1.01)<sup>0.2<\/sup>) = 2.51<\/p><p>Step 2: Compute Quoted Future price: QFP = [bund price × (1 + R<sub>f<\/sub>)<sup>T<\/sup> − AI<sub>T<\/sub> - FVC] /CF<\/p><p>= (104.10 × (1.01)<sup>1.2<\/sup> − 0.42 – 2.51)/1.08 = €94.83<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 32–35<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>The no-arbitrage futures price of the Euro-bond contract is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 36, "q": "Which of Williams' statements regarding FRAs is most likely correct?", "opts": ["Only Statement 2 is correct.", "Only Statement 1 is correct.", "Neither statement is correct."], "ans": "C", "expl": "An FRA involves no initial cash flow as it is a commitment. The FRA will pay off at the date of expiry (the start of the notional borrowing period).", "explhtml": "<p>An FRA involves no initial cash flow as it is a commitment. The FRA will pay off at the date of expiry (the start of the notional borrowing period).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 36–39<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 36–39). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of Williams&#x27; statements regarding FRAs is most likely correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 37, "q": "Using the price and predicted MRR rates in Exhibit 1, which of the following is closest to the predicted value of the FRA at the year end?", "opts": ["–-$85,000", "–$62,000", "–$100,000"], "ans": "B", "expl": "The year end is 30 days away. At that point the required FRA would be a 1X4 (90 days borrowing in 30 days' time). To value the FRA, first price this FRA to compare to the current FRA price. 30 day MRR at year end 3.9% × 30/360 = 0.325% 120 day MRR at year end 4.5% × 120/360 = 1.5% FRA price = 1.015/1.00325 – 1 = 0.01171 Quoted annually = 0.01171 × 360/90 = 0.046848 = 4.685% Value = (3.8% – 4.685%) × $28.5 million × 90/360 = –$63,056 Discounted to year end = –$63,056/1.015 = –$62,124", "explhtml": "<p>The year end is 30 days away. At that point the required FRA would be a 1X4 (90 days borrowing in 30 days&#x27; time).<\/p><p>To value the FRA, first price this FRA to compare to the current FRA price.<\/p><p>30 day MRR at year end 3.9% × 30/360 = 0.325%<\/p><p>120 day MRR at year end 4.5% × 120/360 = 1.5%<\/p><p>FRA price = 1.015/1.00325 – 1 = 0.01171<\/p><p>Quoted annually = 0.01171 × 360/90 = 0.046848 = 4.685%<\/p><p>Value = (3.8% – 4.685%) × $28.5 million × 90/360 = –$63,056<\/p><p>Discounted to year end = –$63,056/1.015 = –$62,124<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 36–39<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Using the price and predicted MRR rates in Exhibit 1, which of the following is closest to the predicted value of the FRA at the year end?<\/p><\/div>", "subj": "derivatives"}, {"n": 38, "q": "Using the details shown in Exhibit 2, under the terms of the currency swap at the first settlement date Sam Smith would most likely:", "opts": ["pay EUR 150,000.", "pay USD 130,000.", "pay EUR 126,050."], "ans": "C", "expl": "Sam Smith is using the currency swap to obtain EUR funding. It will therefore receive EUR (and pay USD) at the outset of the swap and pay EUR interest (and receive USD) at each settlement date. The USD notional principal is 40,000,000. At a spot rate of 1.19 that equates to EUR 33,613,445 The interest payment is therefore 33,613,445 × 1.5% × 90/360 = 126,050", "explhtml": "<p>Sam Smith is using the currency swap to obtain EUR funding. It will therefore receive EUR (and pay USD) at the outset of the swap and pay EUR interest (and receive USD) at each settlement date.<\/p><p>The USD notional principal is 40,000,000. At a spot rate of 1.19 that equates to EUR 33,613,445<\/p><p>The interest payment is therefore 33,613,445 × 1.5% × 90/360 = 126,050<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 36–39<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Using the details shown in Exhibit 2, under the terms of the currency swap at the first settlement date Sam Smith would most likely:<\/p><\/div>", "subj": "derivatives"}, {"n": 39, "q": "Which of the following statements regarding cash flows at the final settlement date for the currency swap outlined in Exhibit 2is most likely correct?", "opts": ["Without knowing the spot rates on the final settlement date, it is impossible to state the cash flows that occur.", "Sam Smith will pay USD 40,000,000 and receive the final USD interest payment.", "Sam Smith Inc. will receive USD 40,000,000 plus the USD interest payment."], "ans": "C", "expl": "Smith initially borrowed EUR and swapped USD. Throughout the swap, at each settlement date Smith will pay EUR interest and receive USD. At the final settlement date, Smith will receive the final USD interest payment and receive the USD principal back.", "explhtml": "<p>Smith initially borrowed EUR and swapped USD. Throughout the swap, at each settlement date Smith will pay EUR interest and receive USD.<\/p><p>At the final settlement date, Smith will receive the final USD interest payment and receive the USD principal back.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 36–39<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Which of the following statements regarding cash flows at the final settlement date for the currency swap outlined in Exhibit 2is most likely correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 40, "q": "Calculate the price of a 200-day forward contract on an 8%, semi-annual, U.S. Treasury bond with a spot price of $1,310. Next coupon payment will be made in 150 days. The annual risk-free rate is 5%.", "opts": ["$1,270.79.", "$1,333.50.", "$1,305.22."], "ans": "C", "expl": "Coupon = (1,000 × 0.08) / 2 = $40.00 Present value of coupon payment = $40.00 / 1.05150/365 = $39.21 Forward price on the fixed income security = ($1,310 - $39.21) × (1.05)200/365 = $1,305.22", "explhtml": "<p>Coupon = (1,000 × 0.08) / 2 = $40.00<\/p><p>Present value of coupon payment = $40.00 / 1.05<sup>150/365<\/sup> = $39.21<\/p><p>Forward price on the fixed income security = ($1,310 - $39.21) × (1.05)<sup>200/365<\/sup> = $1,305.22<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>Calculate the price of a 200-day forward contract on an 8%, semi-annual, U.S. Treasury bond with a spot price of $1,310. Next coupon payment will be made in 150 days. The annual risk-free rate is 5%.<\/p><\/div>", "subj": "derivatives"}, {"n": 41, "q": "In which type of swap contract is notional principal most likely to be exchanged at initiation?", "opts": ["Interest rate swap.", "Currency swap.", "Equity swap."], "ans": "B", "expl": "Notional principal is typically exchanged at initiation of a currency swap, but not in an interest rate swap or equity swap.", "explhtml": "<p>Notional principal is typically exchanged at initiation of a currency swap, but not in an interest rate swap or equity swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>In which type of swap contract is notional principal most likely to be exchanged at initiation?<\/p><\/div>", "subj": "derivatives"}, {"n": 42, "q": "The price of an interest rate swap is the:", "opts": ["cost to purchase a swap.", "fixed rate of interest.", "market value of the swap."], "ans": "B", "expl": "The price of an interest rate swap is quoted as the rate on the fixed-rate payments. The floating rate is a known reference rate but does not need to be quoted.", "explhtml": "<p>The price of an interest rate swap is quoted as the rate on the fixed-rate payments. The floating rate is a known reference rate but does not need to be quoted.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>The price of an interest rate swap is the:<\/p><\/div>", "subj": "derivatives"}, {"n": 43, "q": "What is the value of a 6.00% 1x4 (30 days x 120 days) forward rate agreement (FRA) with a principal amount of $2,000,000, 10 days after initiation if the MRR curve at that time reflects the following: 110-day MRR = 6.15% and 20-day MRR = 6.05%?", "opts": ["$767.40.", "$700.00.", "$745.76."], "ans": "C", "expl": "The current 90-day forward rate at the settlement date, 20 days from now is: ([1+ (0.0615 x 110/360)]/[1+ (0.0605 x 20/360)] – 1) x 360/90 = 0.061517 The interest difference on a $2 million, 90-day loan made 20 days from now at the above rate compared to the FRA rate of 6.0% is: [(0.061517 x 90/360) – (0.060 x 90/360)] x 2,000,000 = $758.50 Discount this amount at the current 110-day rate: 758.50/[1+ (0.0615 x 110/360)] = $745.76", "explhtml": "<p>The current 90-day forward rate at the settlement date, 20 days from now is:<\/p><p>([1+ (0.0615 x 110/360)]/[1+ (0.0605 x 20/360)] – 1) x 360/90 = 0.061517<\/p><p>The interest difference on a $2 million, 90-day loan made 20 days from now at the above rate compared to the FRA rate of 6.0% is:<\/p><p>[(0.061517 x 90/360) – (0.060 x 90/360)] x 2,000,000 = $758.50<\/p><p>Discount this amount at the current 110-day rate:<\/p><p>758.50/[1+ (0.0615 x 110/360)] = $745.76<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.5, LOS 28.c<\/div><div class=\"qtext\"><p>What is the value of a 6.00% 1x4 (30 days x 120 days) forward rate agreement (FRA) with a principal amount of $2,000,000, 10 days after initiation if the MRR curve at that time reflects the following:<\/p><p>110-day MRR = 6.15% and<\/p><p>20-day MRR = 6.05%?<\/p><\/div>", "subj": "derivatives"}, {"n": 44, "q": "The fixed-rate payer in an interest-rate swap has a position equivalent to a series of:", "opts": ["short interest-rate puts and long interest-rate calls.", "long interest-rate puts and calls.", "long interest-puts and short interest-rate calls."], "ans": "A", "expl": "The fixed-rate payer has profits when short rates rise and losses when short rates fall, equivalent to writing puts and buying calls.", "explhtml": "<p>The fixed-rate payer has profits when short rates rise and losses when short rates fall, equivalent to writing puts and buying calls.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>The fixed-rate payer in an interest-rate swap has a position equivalent to a series of:<\/p><\/div>", "subj": "derivatives"}, {"n": 45, "q": "At expiration, the value of a forward contract is:", "opts": ["always greater than or equal to zero.", "the difference between the contract price and the market value of the underlying asset.", "equal to the market price of the underlying asset."], "ans": "B", "expl": "In a forward contract, the long is obligated to buy, and the short is obligated to sell, the underlying asset at the contract price. The difference between the contract price and the market price of the asset is what gives the contract value. The contract has a positive value at expiration to the long/short only if the contract price is below/above the market price.", "explhtml": "<p>In a forward contract, the long is obligated to buy, and the short is obligated to sell, the underlying asset at the contract price. The difference between the contract price and the market price of the asset is what gives the contract value. The contract has a positive value at expiration to the long/short only if the contract price is below/above the market price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>At expiration, the value of a forward contract is:<\/p><\/div>", "subj": "derivatives"}, {"n": 46, "q": "The price and value of a plain vanilla interest-rate swap are:", "opts": ["never equal.", "only equal at the inception of a swap contract.", "equal in equilibrium."], "ans": "A", "expl": "The price of a swap is the fixed rate specified in the swap and is the same for the payer and the receiver. The value is the dollar value of the contract to the fixed-rate payer and is the opposite of the value to the floating-rate payer.", "explhtml": "<p>The price of a swap is the fixed rate specified in the swap and is the same for the payer and the receiver. The value is the dollar value of the contract to the fixed-rate payer and is the opposite of the value to the floating-rate payer.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>The price and value of a plain vanilla interest-rate swap are:<\/p><\/div>", "subj": "derivatives"}, {"n": 47, "q": "At contract initiation, the value of a forward contract:", "opts": ["is typically zero regardless of the price of the underlying asset.", "depends on the market price of the underlying asset.", "is set to 100 by convention."], "ans": "A", "expl": "Due to the no-arbitrage principle, the price of a forward contract is calculated to make the value of the contract zero at contract initiation. Neither the long nor the short typically makes any payment to enter into the forward agreement. A special case is an off-market forward where, for whatever reason, the contract price is not set equal to the no-arbitrage price, and the long or short position makes a payment to the opposite counterparty to offset the difference.", "explhtml": "<p>Due to the no-arbitrage principle, the price of a forward contract is calculated to make the value of the contract zero at contract initiation. Neither the long nor the short typically makes any payment to enter into the forward agreement. A special case is an off-market forward where, for whatever reason, the contract price is not set equal to the no-arbitrage price, and the long or short position makes a payment to the opposite counterparty to offset the difference.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>At contract initiation, the value of a forward contract:<\/p><\/div>", "subj": "derivatives"}, {"n": 48, "q": "During the life of a forward contract, the value of the contract is best described as:", "opts": ["the present value of the expected future price of the underlying asset.", "the difference between the future value of the spot price and the expected future price of the underlying asset.", "the difference between the spot price and the present value of the forward price of the underlying asset."], "ans": "C", "expl": "The value of a forward contract on an asset with no cash flows during its term is equal to spot − (forward price) / (1 + Rf)t), the difference between the spot price and the present value of the forward price of the underlying asset.", "explhtml": "<p>The value of a forward contract on an asset with no cash flows during its term is equal to spot − (forward price) / (1 + R<sub>f<\/sub>)<sup>t<\/sup>), the difference between the spot price and the present value of the forward price of the underlying asset.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>During the life of a forward contract, the value of the contract is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 49, "q": "If the one year spot rate is 5%, the two-year spot rate is 5.5%, and the three year spot rate is 6%, the fixed rate on a 3-year annual pay swap is closest to:", "opts": ["1.99%.", "5.65%.", "4.50%."], "ans": "B", "expl": "1 1− 1 + 0.06(3) The fixed rate on the swap is:  1  1  1 |  +    +  | 1.05  1 + 0.055(2)  1 + 0.06(3) 1−0.8475 0.9524 + 0.9009 + 0.8475 = 0.1525 / 2.7008 = 0.0565", "explhtml": "<p>1<\/p><p>1−<\/p><p>1 + 0.06(3)<\/p><p>The fixed rate on the swap is: <\/p><div class=\"tbl\"><table><tr><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td> + <\/td><td> + <\/td><\/tr><tr><td>1.05<\/td><td>1 + 0.055(2)<\/td><td>1 + 0.06(3)<\/td><\/tr><\/table><\/div><p>1−0.8475<\/p><p>0.9524 + 0.9009 + 0.8475<\/p><p>= 0.1525 / 2.7008 = 0.0565<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>If the one year spot rate is 5%, the two-year spot rate is 5.5%, and the three year spot rate is 6%, the fixed rate on a 3-year annual pay swap is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 50, "q": "Which statement most accurately describes a 2 x 3 forward rate agreement?", "opts": ["Two-month underlying interest rate on a contract settled in three months.", "Underlying loan of two month maturity under a contract that expires in three months.", "Contract expires in two months on an underlying loan settled in three months."], "ans": "C", "expl": "A 2 x 3 forward rate agreement is a contract that expires in two months and the underlying loan is settled in three months. The underlying rate is a 30-day (1-month) rate on a 30-day (1-month) loan in 60 days (2 months).", "explhtml": "<p>A 2 x 3 forward rate agreement is a contract that expires in two months and the underlying loan is settled in three months. The underlying rate is a 30-day (1-month) rate on a 30-day (1-month) loan in 60 days (2 months).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 50–53). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which statement most accurately describes a 2 x 3 forward rate agreement?<\/p><\/div>", "subj": "derivatives"}, {"n": 51, "q": "Which forward rate agreement would most effectively hedge Vetements Verdun's exposure to LIBOR?", "opts": ["2 x 3.", "3 x 2.", "2 x 5."], "ans": "C", "expl": "Vetements Verdun needs to be hedged against 90-day LIBOR rates that will prevail 60 days from now. Such a hedge would require a two-month contract on three-month rates, to be settled in five months: a 2 x 5.", "explhtml": "<p>Vetements Verdun needs to be hedged against 90-day LIBOR rates that will prevail 60 days from now. Such a hedge would require a two-month contract on three-month rates, to be settled in five months: a 2 x 5.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>Which forward rate agreement would most effectively hedge Vetements Verdun&#x27;s exposure to LIBOR?<\/p><\/div>", "subj": "derivatives"}, {"n": 52, "q": "Which value is closest to the price of the most effective hedge for Vetements Verdun?", "opts": ["3.3%.", "3.6%.", "3.0%."], "ans": "B", "expl": "The actual, unannualized rate on the 60-day loan is: R60 = 0.028 × 60/360 = 0.00467 The actual, unannualized rate on the 150-day loan is: R150 = 0.033 × 150/360 = 0.01375 So the rate on a 90-day loan to be made 60 days from now is: FR (60,90) = ((1 + R150)/(1 + R60)) − 1 FR (60,90) = (1.01375/1.00467) − 1 FR (60,90) = 1.00904 − 1 FR (60,90) = 0.904% We annualize this rate using the formula: 0.904% × (360/90) = 3.62%", "explhtml": "<p>The actual, unannualized rate on the 60-day loan is:<\/p><p>R60 = 0.028 × 60/360 = 0.00467<\/p><p>The actual, unannualized rate on the 150-day loan is:<\/p><p>R150 = 0.033 × 150/360 = 0.01375<\/p><p>So the rate on a 90-day loan to be made 60 days from now is:<\/p><p>FR (60,90) = ((1 + R150)/(1 + R60)) − 1<\/p><p>FR (60,90) = (1.01375/1.00467) − 1<\/p><p>FR (60,90) = 1.00904 − 1<\/p><p>FR (60,90) = 0.904%<\/p><p>We annualize this rate using the formula:<\/p><p>0.904% × (360/90) = 3.62%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>Which value is closest to the price of the most effective hedge for Vetements Verdun?<\/p><\/div>", "subj": "derivatives"}, {"n": 53, "q": "What must the 90-day LIBOR rate have been at the expiration of the contract?", "opts": ["4.0%.", "3.6%.", "3.4%."], "ans": "A", "expl": "Since Vetements Verdun is long the FRA, the market rate of interest at settlement must be higher than the price of the contract and the 23,750 has a positive value. The interest savings at the end of the loan term will be: Interest savings = ( (market rate × (90/360)) − (0.0362 × (90/360)) ) × 25,000,000 23,750 = ((market rate × 90/360) − 0.00905) × 25,000,000 0.000950 = market rate × 90/360 − 0.00905 0.0100 = market rate × 0.25 0.0400 = market rate The market rate must have been 4.0%.", "explhtml": "<p>Since Vetements Verdun is long the FRA, the market rate of interest at settlement must be higher than the price of the contract and the 23,750 has a positive value. The interest savings at the end of the loan term will be:<\/p><p>Interest savings = ( (market rate × (90/360)) − (0.0362 × (90/360)) ) × 25,000,000<\/p><p>23,750 = ((market rate × 90/360) − 0.00905) × 25,000,000<\/p><p>0.000950 = market rate × 90/360 − 0.00905<\/p><p>0.0100 = market rate × 0.25<\/p><p>0.0400 = market rate<\/p><p>The market rate must have been 4.0%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>What must the 90-day LIBOR rate have been at the expiration of the contract?<\/p><\/div>", "subj": "derivatives"}, {"n": 54, "q": "Consider a one-year currency swap with semiannual payments. The payments are in U.S. dollars and euros. The current exchange rate of the euro is $1.30 and interest rates are  180 days 360 days USD MRR 5.6% 6.0% EUR MRR 4.8% 5.4% What is the fixed rate in euros?", "opts": ["5.245%.", "5.318%.", "2.659%."], "ans": "B", "expl": "The present values of 1 euro received in 180 days and 1 euro received in 360 days are: 1/(1 + 0.048 × (180/360)) = 0.9766 and 1/1.054 = 0.9488 The fixed rate in euros is (1 - 0.9488) / (0.9766 + 0.9488) = 0.026592 × (360/180) = 5.318%. The notional principal is 100,000/1.30 = 76,923 euros.", "explhtml": "<p>The present values of 1 euro received in 180 days and 1 euro received in 360 days are:<\/p><p>1/(1 + 0.048 × (180/360)) = 0.9766 and 1/1.054 = 0.9488<\/p><p>The fixed rate in euros is (1 - 0.9488) / (0.9766 + 0.9488) = 0.026592 × (360/180) = 5.318%. The notional principal is 100,000/1.30 = 76,923 euros.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Consider a one-year currency swap with semiannual payments. The payments are in U.S. dollars and euros. The current exchange rate of the euro is $1.30 and interest rates are<\/p><div class=\"tbl\"><table><tr><td><\/td><td>180 days<\/td><td>360 days<\/td><\/tr><tr><td>USD MRR<\/td><td>5.6%<\/td><td>6.0%<\/td><\/tr><tr><td>EUR MRR<\/td><td>4.8%<\/td><td>5.4%<\/td><\/tr><\/table><\/div><p>What is the fixed rate in euros?<\/p><\/div>", "subj": "derivatives"}, {"n": 55, "q": "Consider a fixed-for-fixed 1-year $100,000 semiannual currency swap with rates of 5.0% in USD and 4.8% in CHF, originated when the exchange rate is $0.34. After the first settlement, the exchange rate is $0.35 and the term structure is:  90 days 180 days MRR 5.2% 5.6% Swiss 4.8% 5.4% What is the value of the swap to the USD payer?", "opts": ["$2,937.", "-$2,719.", "$2,814."], "ans": "A", "expl": "CHF periodic coupon (per 1 CHF) = 0.048/2 = 0.024 DF for 180 day CHF = 1 / (1 + 0.054 × (180/360)) = 1/1.027 = 0.9737 PV of CHF cash flows (per 1 CHF) = 0.9737 × 1.024 = 0.9971 At the current exchange rate the value is 0.9971 × 0.35 = USD 0.3490 The notional amount is 100,000/0.34 = 294,118 CHF so the dollar value of the CHF payments is 0.3490 × 294,118 = $102,647. USD periodic coupon (per 1 USD) = 0.05/2 = 0.025 DF for 180 day USD = 1 / (1 + 0.056 × (180/360)) = 1/1.028 = 0.9728 PV of USD cash flows (per 1 USD) = 0.9728 × 1.025 = 0.9971 Value (for notional = $100,000) = 0.9971 × 100,000 = $99,710. The value of the swap to the dollar payer is 102,647 - $99,710 = $2,937.", "explhtml": "<p>CHF periodic coupon (per 1 CHF) = 0.048/2 = 0.024<\/p><p>DF for 180 day CHF = 1 / (1 + 0.054 × (180/360)) = 1/1.027 = 0.9737<\/p><p>PV of CHF cash flows (per 1 CHF) = 0.9737 × 1.024 = 0.9971<\/p><p>At the current exchange rate the value is 0.9971 × 0.35 = USD 0.3490<\/p><p>The notional amount is 100,000/0.34 = 294,118 CHF so the dollar value of the CHF payments is 0.3490 × 294,118 = $102,647.<\/p><p>USD periodic coupon (per 1 USD) = 0.05/2 = 0.025<\/p><p>DF for 180 day USD = 1 / (1 + 0.056 × (180/360)) = 1/1.028 = 0.9728<\/p><p>PV of USD cash flows (per 1 USD) = 0.9728 × 1.025 = 0.9971<\/p><p>Value (for notional = $100,000) = 0.9971 × 100,000 = $99,710.<\/p><p>The value of the swap to the dollar payer is 102,647 - $99,710 = $2,937.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Consider a fixed-for-fixed 1-year $100,000 semiannual currency swap with rates of 5.0% in USD and 4.8% in CHF, originated when the exchange rate is $0.34. After the first settlement, the exchange rate is $0.35 and the term structure is:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>90 days<\/td><td>180 days<\/td><\/tr><tr><td>MRR<\/td><td>5.2%<\/td><td>5.6%<\/td><\/tr><tr><td>Swiss<\/td><td>4.8%<\/td><td>5.4%<\/td><\/tr><\/table><\/div><p>What is the value of the swap to the USD payer?<\/p><\/div>", "subj": "derivatives"}, {"n": 56, "q": "A plain vanilla interest-rate swap to the fixed-rate payer is equivalent to issuing a fixed-rate bond and:", "opts": ["selling a series of interest rate puts.", "selling a series of interest rate calls.", "buying a floating-rate bond."], "ans": "C", "expl": "Paying fixed and receiving floating in a swap is equivalent to issuing a fixed-rate bond and investing the proceeds in a floating rate bond.", "explhtml": "<p>Paying fixed and receiving floating in a swap is equivalent to issuing a fixed-rate bond and investing the proceeds in a floating rate bond.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>A plain vanilla interest-rate swap to the fixed-rate payer is equivalent to issuing a fixed-rate bond and:<\/p><\/div>", "subj": "derivatives"}, {"n": 57, "q": "Consider a fixed-rate semiannual-pay equity swap where the equity payments are the total return on a $1 million portfolio and the following information: 180-day MRR is 5.2% 360-day MRR is 5.5% Dividend yield on the portfolio = 1.2% What is the fixed rate on the swap?", "opts": ["5.4234%.", "5.4197%.", "5.1387%."], "ans": "A", "expl": "(1−  ) 1 1.055  = 0.027117 × 2 = 5.4234% (  ) | 1  1  +  180  360 | 1 + 0.052(  )  1 + 0.055(  ) | 360  360", "explhtml": "<p>(1− &nbsp; )<\/p><p>1 1.055<\/p><p> = 0.027117 × 2 = 5.4234%<\/p><div class=\"tbl\"><table><tr><td>(<\/td><td>)<\/td><\/tr><tr><td>1<\/td><td>1<\/td><\/tr><\/table><\/div><p> + <\/p><div class=\"tbl\"><table><tr><td>180<\/td><td>360<\/td><\/tr><tr><td>1 + 0.052(<\/td><td>)<\/td><td>1 + 0.055(<\/td><td>)<\/td><\/tr><tr><td>360<\/td><td>360<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>Consider a fixed-rate semiannual-pay equity swap where the equity payments are the total return on a $1 million portfolio and the following information:<\/p><p>180-day MRR is 5.2% 360-day MRR is 5.5% Dividend yield on the portfolio = 1.2%<\/p><p>What is the fixed rate on the swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 58, "q": "At the inception of a market-rate plain vanilla swap, the value of the swap to the fixed-rate payer is:", "opts": ["positive.", "zero.", "either positive or negative."], "ans": "B", "expl": "A market-rate swap is priced so that the value to either side is zero at the inception of the swap.", "explhtml": "<p>A market-rate swap is priced so that the value to either side is zero at the inception of the swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>At the inception of a market-rate plain vanilla swap, the value of the swap to the fixed-rate payer is:<\/p><\/div>", "subj": "derivatives"}, {"n": 59, "q": "The current USD/CAD exchange rate is 0.7. In a $1 million currency swap, the party that is entering the swap to hedge existing exposure to C$-denominated fixed-rate liability will:", "opts": ["receive floating in C$.", "pay C$1,428,571 at the beginning of the swap.", "pay floating in C$."], "ans": "B", "expl": "The party that is entering the swap to hedge existing exposure to C$-denominated fixed-rate liability will want to receive-fixed C$. They will pay 1,000,000/0.7 = C$1,428,571 (principal) at swap inception (in exchange for USD 1 million) and get the same amount (C$1,428,571) back at termination (in exchange for paying back the USD 1 million).", "explhtml": "<p>The party that is entering the swap to hedge existing exposure to C$-denominated fixed-rate liability will want to receive-fixed C$. They will pay 1,000,000/0.7 = C$1,428,571 (principal) at swap inception (in exchange for USD 1 million) and get the same amount (C$1,428,571) back at termination (in exchange for paying back the USD 1 million).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>The current USD/CAD exchange rate is 0.7. In a $1 million currency swap, the party that is entering the swap to hedge existing exposure to C$-denominated fixed-rate liability will:<\/p><\/div>", "subj": "derivatives"}, {"n": 60, "q": "A $10 million 2-year semi-annual-pay MRR-based interest-rate swap was initiated 180 days ago when swap fixed rate was 3.8%. The fixed rate on the swap is now 3.4% and the term structure is as follows: Days MRR Discount Factor 180 3.00% 0.98522 360 3.20% 0.96899 540 3.40% 0.95148 720 4.00% 0.92593 Value of the swap to the payer is closest to:", "opts": ["-$29,229.", "-$58,114.", "-$45,633."], "ans": "B", "expl": "Sum of the discount factors for the three settlement dates remaining (180,360 and 540 days away) = 0.98522 + 0.96899 + 0.95148 = 2.9057 Value to payer = 2.9057 x [(0.034 – 0.038)/2] x $ 10 million = -$58,114", "explhtml": "<p>Sum of the discount factors for the three settlement dates remaining (180,360 and 540 days away) = 0.98522 + 0.96899 + 0.95148 = 2.9057<\/p><p>Value to payer = 2.9057 x [(0.034 – 0.038)/2] x $ 10 million = -$58,114<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>A $10 million 2-year semi-annual-pay MRR-based interest-rate swap was initiated 180 days ago when swap fixed rate was 3.8%. The fixed rate on the swap is now 3.4% and the term structure is as follows:<\/p><div class=\"tbl\"><table><tr><td>Days<\/td><td>MRR<\/td><td>Discount Factor<\/td><\/tr><tr><td>180<\/td><td>3.00%<\/td><td>0.98522<\/td><\/tr><tr><td>360<\/td><td>3.20%<\/td><td>0.96899<\/td><\/tr><tr><td>540<\/td><td>3.40%<\/td><td>0.95148<\/td><\/tr><tr><td>720<\/td><td>4.00%<\/td><td>0.92593<\/td><\/tr><\/table><\/div><p>Value of the swap to the payer is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 61, "q": "Which of the following is equivalent to a plain vanilla receive-fixed interest rate swap?", "opts": ["A short position in a bond coupled with the issuance of a floating rate note.", "A long position in a bond coupled with the issuance of a floating rate note.", "A short position in a bond coupled with a long position in a floating rate note."], "ans": "B", "expl": "A long position in a fixed rate bond receives fixed coupons. The short floating rate note requires floating-rate payments. Together, these are the same cash flow as a receive-fixed swap.", "explhtml": "<p>A long position in a fixed rate bond receives fixed coupons. The short floating rate note requires floating-rate payments. Together, these are the same cash flow as a receive-fixed swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>Which of the following is equivalent to a plain vanilla receive-fixed interest rate swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 62, "q": "90 days ago the exchange rate was USD 0.83 per CDN and the term structure was:  180 days 360 days USD MRR 5.2% 5.6% CDN MRR 4.8% 5.4%. A 1 year, semi-annual settlement, fixed for fixed swap was initiated with 5.30% fixed for CDN and 5.52% fixed for USD on a principal of USD 1 million. Current exchange rate is USD 0.84 per CDN and the yield curve is:  90 days 270 days USD MRR 5.2% 5.6% Disc Factor 0.98717 0.95969 CDN MRR 4.8% 5.4% Disc factor 0.98814 0.96108 What is the value of the swap to the USD interest payer?", "opts": ["-$3,472.", "$10,126.", "$11,500."], "ans": "C", "expl": "CDN principal = 1,000,000/0.83 = CDN 1,204,819. CDN payments = (0.053/2) x 1,204,819 = CDN 31,928. USD payment = 1,000,000 x (0.0552/2) = USD 27,600 Value of CDN payments = 31,928 x 0.98814 + (1,204,819 + 31,928) x 0.96108 = CDN 1220162 Value in USD = 1220162 x 0.84 = USD 1,024,936. Value of USD payments = 27,600 x 0.98717 + 1,027,600 x 0.95969 = USD 1,013,423 Value to USD interest payer = $1,024,936 – $1,013,423 = $11,513", "explhtml": "<p>CDN principal = 1,000,000/0.83 = CDN 1,204,819. CDN payments = (0.053/2) x 1,204,819 = CDN 31,928.<\/p><p>USD payment = 1,000,000 x (0.0552/2) = USD 27,600<\/p><p>Value of CDN payments = 31,928 x 0.98814 + (1,204,819 + 31,928) x 0.96108 = CDN 1220162<\/p><p>Value in USD = 1220162 x 0.84 = USD 1,024,936.<\/p><p>Value of USD payments = 27,600 x 0.98717 + 1,027,600 x 0.95969 = USD 1,013,423<\/p><p>Value to USD interest payer = $1,024,936 – $1,013,423 = $11,513<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>90 days ago the exchange rate was USD 0.83 per CDN and the term structure was:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>180 days<\/td><td>360 days<\/td><\/tr><tr><td>USD MRR<\/td><td>5.2%<\/td><td>5.6%<\/td><\/tr><tr><td>CDN MRR<\/td><td>4.8%<\/td><td>5.4%.<\/td><\/tr><\/table><\/div><p>A 1 year, semi-annual settlement, fixed for fixed swap was initiated with 5.30% fixed for CDN and 5.52% fixed for USD on a principal of USD 1 million.<\/p><p>Current exchange rate is USD 0.84 per CDN and the yield curve is:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>90 days<\/td><td>270 days<\/td><\/tr><tr><td>USD MRR<\/td><td>5.2%<\/td><td>5.6%<\/td><\/tr><tr><td>Disc Factor<\/td><td>0.98717<\/td><td>0.95969<\/td><\/tr><tr><td>CDN MRR<\/td><td>4.8%<\/td><td>5.4%<\/td><\/tr><tr><td>Disc factor<\/td><td>0.98814<\/td><td>0.96108<\/td><\/tr><\/table><\/div><p>What is the value of the swap to the USD interest payer?<\/p><\/div>", "subj": "derivatives"}, {"n": 63, "q": "The fixed-rate receiver in a plain vanilla interest rate swap has a position equivalent to a series of:", "opts": ["long interest-rate puts.", "long interest-rate puts and short interest-rate calls.", "short interest-puts and long interest-rate calls."], "ans": "B", "expl": "The fixed-rate receiver has profits when short rates fall and losses when short rates rise, equivalent to buying puts and writing calls.", "explhtml": "<p>The fixed-rate receiver has profits when short rates fall and losses when short rates rise, equivalent to buying puts and writing calls.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 29.6, LOS 29.j<\/div><div class=\"qtext\"><p>The fixed-rate receiver in a plain vanilla interest rate swap has a position equivalent to a series of:<\/p><\/div>", "subj": "derivatives"}, {"n": 64, "q": "The price of a 3 × 5 forward rate agreement (FRA) is the:", "opts": ["3-month implied forward rate 5 months from today.", "2-month implied forward rate 3 months from today.", "2-month implied forward rate 5 months from today."], "ans": "B", "expl": "The notation for FRAs is unique. There are two numbers associated with an FRA: the number of months until the contract expires and the number of months until the underlying loan is settled. The difference between these two is the maturity of the underlying loan. For example, a 3 × 5 FRA is a contract that expires in three months (90 days), and the underlying loan is settled in five months (150 days). The price of the 3 × 5 FRA is calculated by annualizing the implied forward rate. The implied forward rate is calculated from the 3-month rate and the 5-month rate.", "explhtml": "<p>The notation for FRAs is unique. There are two numbers associated with an FRA: the number of months until the contract expires and the number of months until the underlying loan is settled. The difference between these two is the maturity of the underlying loan. For example, a 3 × 5 FRA is a contract that expires in three months (90 days), and the underlying loan is settled in five months (150 days). The price of the 3 × 5 FRA is calculated by annualizing the implied forward rate. The implied forward rate is calculated from the 3-month rate and the 5-month rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>The price of a 3 × 5 forward rate agreement (FRA) is the:<\/p><\/div>", "subj": "derivatives"}, {"n": 65, "q": "The value of the S&P 500 Index is 1,260. The continuously compounded risk-free rate is 5.4% and the continuous dividend yield is 3.5%. Calculate the no-arbitrage price of a 160-day forward contract on the index.", "opts": ["$1,270.54.", "$1,310.13.", "$562.91."], "ans": "A", "expl": "FP = 1,260 × e(0.054 − 0.035) × (160 / 365) = 1,270.54", "explhtml": "<p>FP = 1,260 × e(0.054 − 0.035) × (160 / 365) = 1,270.54<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.2, LOS 28.a<\/div><div class=\"qtext\"><p>The value of the S&amp;P 500 Index is 1,260. The continuously compounded risk-free rate is 5.4% and the continuous dividend yield is 3.5%. Calculate the no-arbitrage price of a 160-day forward contract on the index.<\/p><\/div>", "subj": "derivatives"}, {"n": 66, "q": "The no-arbitrage price of a futures contract with a spot rate of 990, a time to maturity of 2 years, and a risk-free-rate of 5% is closest to:", "opts": ["1040", "1091", "792"], "ans": "B", "expl": "The no-arbitrage price of a futures contract is based on the spot rate, the time to maturity, and the risk-free-rate. FP T\n= S × (1 + R )\n0 f  2\n= 990(1.05)  = 1091", "explhtml": "<p>The no-arbitrage price of a futures contract is based on the spot rate, the time to maturity, and the risk-free-rate.<\/p><div class=\"tbl\"><table><tr><td>FP<\/td><td>T<br>= S × (1 + R )<br>0 f<\/td><\/tr><tr><td><\/td><td>2<br>= 990(1.05)<\/td><\/tr><tr><td><\/td><td>= 1091<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The no-arbitrage price of a futures contract with a spot rate of 990, a time to maturity of 2 years, and a risk-free-rate of 5% is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 67, "q": "Calculate the price (expressed as an annualized rate) of a 1x4 forward rate agreement (FRA) if the current 30-day rate is 5% and the 120-day rate is 7%.", "opts": ["7.47%.", "7.63%.", "6.86%."], "ans": "B", "expl": "A 1x4 FRA is a 90-day loan, 30 days from today. The actual rate on the 30-day loan is: R30 = 0.05 x 30/360 = 0.004167 The actual rate on the 120-day loan is: R120 = 0.07 x 120/360 = 0.02333 FR (30,90) = [(1+ R120)/(1+ R30)] – 1 = (1.023333/1.004167) – 1 = 0.0190871 The annualized 90-day rate = 0.0190871 x 360/90 = .07634 = 7.63%", "explhtml": "<p>A 1x4 FRA is a 90-day loan, 30 days from today.<\/p><p>The actual rate on the 30-day loan is: R30 = 0.05 x 30/360 = 0.004167<\/p><p>The actual rate on the 120-day loan is: R120 = 0.07 x 120/360 = 0.02333<\/p><p>FR (30,90) = [(1+ R120)/(1+ R30)] – 1 = (1.023333/1.004167) – 1 = 0.0190871<\/p><p>The annualized 90-day rate = 0.0190871 x 360/90 = .07634 = 7.63%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>Calculate the price (expressed as an annualized rate) of a 1x4 forward rate agreement (FRA) if the current 30-day rate is 5% and the 120-day rate is 7%.<\/p><\/div>", "subj": "derivatives"}, {"n": 68, "q": "The theoretical price of a forward contract:", "opts": ["is always greater than the current price of the underlying asset.", "is the no-arbitrage price.", "equals the long’s expectation of the future price of the underlying asset."], "ans": "B", "expl": "The theoretical price of a forward contract is the future price of the underlying asset imposed by the no-arbitrage conditions. It can be less than the current price of the asset if the cost-of-carry is negative. Accrued interest is paid by the long at delivery under a bond forward, but is not included in the price quote, which is usually in terms of yield to maturity at the settlement date.", "explhtml": "<p>The theoretical price of a forward contract is the future price of the underlying asset imposed by the no-arbitrage conditions. It can be less than the current price of the asset if the cost-of-carry is negative. Accrued interest is paid by the long at delivery under a bond forward, but is not included in the price quote, which is usually in terms of yield to maturity at the settlement date.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The theoretical price of a forward contract:<\/p><\/div>", "subj": "derivatives"}, {"n": 69, "q": "A stock is currently priced at $110 and will pay a $2 dividend in 85 days and is expected to pay a $2.20 dividend in 176 days. The no arbitrage price of a six-month (182-day) forward contract when the effective annual interest rate is 8% is closest to:", "opts": ["$110.20.", "$110.06.", "$110.00."], "ans": "B", "expl": "In the formulation below, the present value of the dividends is subtracted from the spot price, and then the future value of this amount at the expiration date is calculated. (110 – 2/1.0885/365 – 2.20/1.08176/365) 1.08182/365 = $110.06 Alternatively, the future value of the dividends could be subtracted from the future value of the stock price based on the risk-free rate over the contract term.", "explhtml": "<p>In the formulation below, the present value of the dividends is subtracted from the spot price, and then the future value of this amount at the expiration date is calculated.<\/p><p>(110 – 2/1.08<sup>85/365<\/sup> – 2.20/1.08<sup>176/365<\/sup>) 1.08<sup>182/365<\/sup> = $110.06<\/p><p>Alternatively, the future value of the dividends could be subtracted from the future value of the stock price based on the risk-free rate over the contract term.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.2, LOS 28.a<\/div><div class=\"qtext\"><p>A stock is currently priced at $110 and will pay a $2 dividend in 85 days and is expected to pay a $2.20 dividend in 176 days. The no arbitrage price of a six-month (182-day) forward contract when the effective annual interest rate is 8% is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 70, "q": "Calculate the no-arbitrage forward price for a 90-day forward on a stock that is currently priced at $50.00 and is expected to pay a dividend of $0.50 in 30 days and a $0.60 in 75 days. The annual risk free rate is 5% and the yield curve is flat.", "opts": ["$50.31.", "$49.49.", "$48.51."], "ans": "B", "expl": "The present value of expected dividends is: $0.50 / (1.0530 / 365) + $0.60 / (1.0575 / 365) = $1.092 Future price = ($50.00 − 1.092) × 1.0590 / 365 = $49.49", "explhtml": "<p>The present value of expected dividends is: $0.50 / (1.05<sup>30 / 365<\/sup>) + $0.60 / (1.05<sup>75 / 365<\/sup>) = $1.092<\/p><p>Future price = ($50.00 − 1.092) × 1.05<sup>90 / 365<\/sup> = $49.49<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.2, LOS 28.a<\/div><div class=\"qtext\"><p>Calculate the no-arbitrage forward price for a 90-day forward on a stock that is currently priced at $50.00 and is expected to pay a dividend of $0.50 in 30 days and a $0.60 in 75 days. The annual risk free rate is 5% and the yield curve is flat.<\/p><\/div>", "subj": "derivatives"}, {"n": 71, "q": "30 days ago, J. Klein took a short position in a $10 million (3X6) forward rate agreement (FRA) based on MRR and priced at 5%. The current MRR curve is: 30-day = 4.8% 60-day = 5.0% 90-day = 5.1% 120-day = 5.2% 150-day = 5.4% The current value of the FRA, to the short, is closest to:", "opts": ["−$15,495.", "−$15,280.", "−$15,154."], "ans": "C", "expl": "FRAs are entered in to hedge against interest rate risk. A person would buy a FRA anticipating an increase in interest rates. If interest rates increase more than the rate agreed upon in the FRA (5% in this case) then the long position is owed a payment from the short position. Step 1: Find the forward 90-day MRR 60-days from now. [(1 + 0.054(150 / 360)) / (1 + 0.05(60 / 360)) − 1](360 / 90) = 0.056198. Since projected interest rates at the end of the FRA have increased to approximately 5.6%, which is above the contracted rate of 5%, the short position currently owes the long position. Step 2: Find the interest differential between a loan at the projected forward rate and a loan at the forward contract rate. (0.056198 − 0.05) × (90 / 360) = 0.0015495 × 10,000,000 = $15,495 Step 3: Find the present value of this amount 'payable' 90 days after contract expiration (or 60 + 90 = 150 days from now) and note once again that the short (who must 'deliver' the loan at the forward contract rate) loses because the forward 90-day MRR of 5.6198% is greater than the contract rate of 5%. [15,495 / (1 + 0.054(150 / 360))] = $15,154.03 This is the negative value to the short.", "explhtml": "<p>FRAs are entered in to hedge against interest rate risk. A person would buy a FRA anticipating an increase in interest rates. If interest rates increase more than the rate agreed upon in the FRA (5% in this case) then the long position is owed a payment from the short position.<\/p><p>Step 1: Find the forward 90-day MRR 60-days from now.<\/p><p>[(1 + 0.054(150 / 360)) / (1 + 0.05(60 / 360)) − 1](360 / 90) = 0.056198. Since projected interest rates at the end of the FRA have increased to approximately 5.6%, which is above the contracted rate of 5%, the short position currently owes the long position.<\/p><p>Step 2: Find the interest differential between a loan at the projected forward rate and a loan at the forward contract rate.<\/p><p>(0.056198 − 0.05) × (90 / 360) = 0.0015495 × 10,000,000 = $15,495<\/p><p>Step 3: Find the present value of this amount &#x27;payable&#x27; 90 days after contract expiration (or 60 + 90 = 150 days from now) and note once again that the short (who must &#x27;deliver&#x27; the loan at the forward contract rate) loses because the forward 90-day MRR of 5.6198% is greater than the contract rate of 5%.<\/p><p>[15,495 / (1 + 0.054(150 / 360))] = $15,154.03<\/p><p>This is the negative value to the short.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.4, LOS 28.c<\/div><div class=\"qtext\"><p>30 days ago, J. Klein took a short position in a $10 million (3X6) forward rate agreement (FRA) based on MRR and priced at 5%. The current MRR curve is:<\/p><p>30-day = 4.8% 60-day = 5.0% 90-day = 5.1% 120-day = 5.2% 150-day = 5.4%<\/p><p>The current value of the FRA, to the short, is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 72, "q": "The price of a forward contract:", "opts": ["is equal to the value of the contract in equilibrium.", "must be equal to the market price at contract termination.", "is the settlement price for the underlying asset."], "ans": "C", "expl": "The price of a forward contract is the price of the underlying asset that the long will pay to the short at settlement (for a deliverable contract). The value of a forward contract comes from the difference between the forward contract price and the market price for the underlying asset. This difference between price and value is a key concept to understand. A forward contract has only one price, which applies to both the long and to the short.", "explhtml": "<p>The price of a forward contract is the price of the underlying asset that the long will pay to the short at settlement (for a deliverable contract). The value of a forward contract comes from the difference between the forward contract price and the market price for the underlying asset. This difference between price and value is a key concept to understand. A forward contract has only one price, which applies to both the long and to the short.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The price of a forward contract:<\/p><\/div>", "subj": "derivatives"}, {"n": 73, "q": "Which of the following is equivalent to a pay-floating USD receive-fixed EUR currency swap position?", "opts": ["A short position in a EUR bond coupled with the issuance of a USD-denominated floating rate note.", "A short position in a EUR bond coupled with a long position in a USD-denominated floating rate note.", "A long position in a EUR bond coupled with the issuance of a USD-denominated floating rate note."], "ans": "C", "expl": "A long position in a fixed rate EUR bond will receive fixed coupons denominated in EUR. The short floating rate note requires USD denominated floating-rate payments. Combined, these are the same cash flow as a pay-floating USD receive-fixed EUR currency swap.", "explhtml": "<p>A long position in a fixed rate EUR bond will receive fixed coupons denominated in EUR. The short floating rate note requires USD denominated floating-rate payments. Combined, these are the same cash flow as a pay-floating USD receive-fixed EUR currency swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>Which of the following is equivalent to a pay-floating USD receive-fixed EUR currency swap position?<\/p><\/div>", "subj": "derivatives"}, {"n": 74, "q": "Consider a fixed-rate semiannual-pay equity swap where the equity payments are the total return on a $1 million portfolio and the following information: 180-day MRR is 4.2% 360-day MRR is 4.5% Div. yield on the portfolio = 1.2% What is the fixed rate on the swap?", "opts": ["4.3232%.", "4.5143%.", "4.4477%."], "ans": "C", "expl": "( 1 −  ) 1 1.045 = 0.022239 × 2 = 4.4477 % (  ) | 1  1 + 180  360 | 1 + 0.042 (  )  1 + 0.045 (  ) | 360  360", "explhtml": "<p>( 1 − &nbsp; )<\/p><p>1 1.045<\/p><p>= 0.022239 × 2 = 4.4477 %<\/p><div class=\"tbl\"><table><tr><td>(<\/td><td>)<\/td><\/tr><tr><td>1<\/td><td>1<\/td><\/tr><\/table><\/div><p>+<\/p><div class=\"tbl\"><table><tr><td>180<\/td><td>360<\/td><\/tr><tr><td>1 + 0.042 (<\/td><td>)<\/td><td>1 + 0.045 (<\/td><td>)<\/td><\/tr><tr><td>360<\/td><td>360<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>Consider a fixed-rate semiannual-pay equity swap where the equity payments are the total return on a $1 million portfolio and the following information:<\/p><p>180-day MRR is 4.2% 360-day MRR is 4.5% Div. yield on the portfolio = 1.2%<\/p><p>What is the fixed rate on the swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 75, "q": "Writing a series of interest-rate puts and buying a series of interest-rate calls, all at the same exercise rate, is equivalent to:", "opts": ["being the floating-rate payer in an interest rate swap.", "a short position in a series of forward rate agreements.", "being the fixed-rate payer in an interest rate swap."], "ans": "C", "expl": "A short position in interest rate puts will have a negative payoff when rates are below the exercise rate; the calls will have positive payoffs when rates exceed the exercise rate. This mirrors the payoffs of the fixed-rate payer who will receive positive net payments when settlement rates are above the fixed
