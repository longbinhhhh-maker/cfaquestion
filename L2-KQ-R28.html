<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 28 — Pricing and Valuation of Forward Commitments · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">

  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,

    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);

  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

const DATA = [{"n": 1, "q": "Calculate the value to the long party of a 2x4 forward rate agreement (FRA) initiated 30 days ago at 7.50% with a notional of $5,000,000 and given the following current MRRs: 30-day rate is 5%. 60-day rate is 5.5%. 90-day rate is 7%.", "opts": ["23,095", "3,917", "3,849"], "ans": "C", "expl": "30-days after the inception of the FRA: New forward rate = {[1 + (0.07 x 90/360)] / [1 + (0.05 x 30/360) - 1] x (360/60) = 7.97% Long is in the money as the new forward rate > 7.50%. Value(Long) = [(0.0797 – 0.075) x (60/360) x 5,000,000] / [1 + (0.07 x 90/360)] = 3,849", "explhtml": "<p>30-days after the inception of the FRA:<\/p><p>New forward rate = {[1 + (0.07 x 90/360)] / [1 + (0.05 x 30/360) - 1] x (360/60) = 7.97%<\/p><p>Long is in the money as the new forward rate &gt; 7.50%.<\/p><p>Value(Long) = [(0.0797 – 0.075) x (60/360) x 5,000,000] / [1 + (0.07 x 90/360)] = 3,849<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.5, LOS 28.c<\/div><div class=\"qtext\"><p>Calculate the value to the long party of a 2x4 forward rate agreement (FRA) initiated 30 days ago at 7.50% with a notional of $5,000,000 and given the following current MRRs:<\/p><p>30-day rate is 5%. 60-day rate is 5.5%. 90-day rate is 7%.<\/p><\/div>", "subj": "derivatives"}, {"n": 2, "q": "An index is currently 876, the risk-free rate (Rf) is 7%, and the dividend yield on the index portfolio is 1.8%. Assuming that these are continuously compounded yields, the price of an 18-month index future is closest to:", "opts": ["947.1.", "945.2.", "943.0."], "ans": "A", "expl": "FP = 876 e(0.07-0.018)1.5 = 947.1.", "explhtml": "<p>FP = 876 e(0.07-0.018)1.5 = 947.1.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.2, LOS 28.a<\/div><div class=\"qtext\"><p>An index is currently 876, the risk-free rate (R<sub>f<\/sub>) is 7%, and the dividend yield on the index portfolio is 1.8%. Assuming that these are continuously compounded yields, the price of an 18-month index future is closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 3, "q": "The fixed-rate on a semiannual 2-year interest rate swap is closest to the:", "opts": ["current 180-day T-bill rate.", "coupon rate on a 2-year par bond with the same credit risk as the reference rate.", "coupon rate on a 2-year par bond with the same credit risk as the fixed-rate payer."], "ans": "B", "expl": "The fixed-rate on a swap is calculated using the yield curve for the floating rate reference. Therefore, the fixed rate reflects the credit spread of that rate over the riskless rate of return.", "explhtml": "<p>The fixed-rate on a swap is calculated using the yield curve for the floating rate reference. Therefore, the fixed rate reflects the credit spread of that rate over the riskless rate of return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>The fixed-rate on a semiannual 2-year interest rate swap is closest to the:<\/p><\/div>", "subj": "derivatives"}, {"n": 4, "q": "Has the bank correctly calculated the fixed rates on the currency swap?", "opts": ["Both fixed rates are incorrectly calculated.", "One of the two fixed rates is incorrectly calculated.", "Both fixed rates are correctly calculated."], "ans": "A", "expl": "Fixed rate for the USD: 1−0.9901 = 0.00498 = 0.498% 0.9965+0.9901 360 0.498% ×  = 0.997% In annual terms, the fixed rate for the USD =  180 Fixed rate for the euro: 1−0.9804 = 0.00993 = 0.993% 0.9926+0.9804 360 0.993% ×  = 1.987% In annual terms, the fixed rate for the euro =  180 The fixed rates quoted by the bank are both incorrectly calculated.", "explhtml": "<p>Fixed rate for the USD:<\/p><p>1−0.9901<\/p><p>= 0.00498 = 0.498%<\/p><p>0.9965+0.9901<\/p><p>360 0.498% × &nbsp; = 0.997%<\/p><p>In annual terms, the fixed rate for the USD = <\/p><p>180<\/p><p>Fixed rate for the euro:<\/p><p>1−0.9804<\/p><p>= 0.00993 = 0.993%<\/p><p>0.9926+0.9804<\/p><p>360 0.993% × &nbsp; = 1.987%<\/p><p>In annual terms, the fixed rate for the euro = <\/p><p>180<\/p><p>The fixed rates quoted by the bank are both incorrectly calculated.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–7<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"kq-note\">Câu thuộc item set (câu 4–7). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Has the bank correctly calculated the fixed rates on the currency swap?<\/p><\/div>", "subj": "derivatives"}, {"n": 5, "q": "If OTS decides on a fixed for fixed currency swap, what is the market value of the swap to OTS three months after swap initiation?", "opts": ["The value of the euro payments is €97.68m and converting the euro value to USD using €1: USD1.55, the swap has a positive to OTS.", "The value of the euro payments is €100.27m and converting the euro value to USD using €1: USD1.48, the swap has a positive to OTS.", "The value of the euro payments is €101.8m and converting the euro value to USD using €1: USD1.43, the swap has a positive to OTS."], "ans": "B", "expl": "To mitigate currency risk, OTS would be the party paying the fixed rate on USD and receiving the fixed rate on euro. The notional principal is €100m to USD143 million. Note this is using the $/€ of 1.43 at swap initiation. We show the computation of the value of USD payments also even though it is not required for the question. The value of the USD fixed payments is equivalent to the value of a USD143m fixed rate bond that pays a coupon in 90 days' time and a coupon plus face value in 270 days' time. The coupon rate would be 0.85% as provided in the vignette. The coupons on the bond = 0.0085 × (180 / 360) × $143m = $607,750. Maturity $ MRR Discount Factor CF DCF 90  0.85%  0.9979  $607,750  606,474 270  1.20%  0.9911  $143,607,750  142,329,641 $142,936,115 PV $ Fixed The value of the Euro fixed payments is equivalent to the value of a €100m fixed rate bond that pays a coupon in 90 days' time and a coupon plus face value in 270 days' time. The coupon rate would be 1.75% as computed in the solution to question 1. The coupons on the bond = 0.0175 × (180 / 360) × €100m = €875,000 Maturity $ MRR Discount Factor CF DCF 90  1.30%  0.9968  €875,000  872,200 270  2.30%  0.9830  €100,875,000  99,160,125 €100,032,325 PV € Fixed OTS is based in the U.S. but has borrowed in €'s. OTS would therefore take the position of receiving €'s and paying $'s in the currency swap. Convert the € fixed coupon bond into $'s at the date of the valuation using the exchange rate $/€ = 1.48 €100,032,325 × 1.48 = $148,047,841 The value to the party paying $'s and receiving €'s = $148,047,841 – $142,936,115 = $5,111,726 Note that no actual computations were required to answer this question if you spotted that answer B was the only solution to use the correct exchange rate.", "explhtml": "<p>To mitigate currency risk, OTS would be the party paying the fixed rate on USD and receiving the fixed rate on euro. The notional principal is €100m to USD143 million. Note this is using the $/€ of 1.43 at swap initiation.<\/p><p>We show the computation of the value of USD payments also even though it is not required for the question. The value of the USD fixed payments is equivalent to the value of a USD143m fixed rate bond that pays a coupon in 90 days&#x27; time and a coupon plus face value in 270 days&#x27; time. The coupon rate would be 0.85% as provided in the vignette.<\/p><p>The coupons on the bond = 0.0085 × (180 / 360) × $143m = $607,750.<\/p><div class=\"tbl\"><table><tr><td>Maturity<\/td><td>$ MRR<\/td><td>Discount Factor<\/td><td>CF<\/td><td>DCF<\/td><\/tr><\/table><\/div><p>90 &nbsp; 0.85% &nbsp; 0.9979 &nbsp; $607,750 &nbsp; 606,474 270 &nbsp; 1.20% &nbsp; 0.9911 &nbsp; $143,607,750 &nbsp; 142,329,641<\/p><p>$142,936,115<\/p><p>PV $ Fixed<\/p><p>The value of the Euro fixed payments is equivalent to the value of a €100m fixed rate bond that pays a coupon in 90 days&#x27; time and a coupon plus face value in 270 days&#x27; time. The coupon rate would be 1.75% as computed in the solution to question 1.<\/p><p>The coupons on the bond = 0.0175 × (180 / 360) × €100m = €875,000<\/p><div class=\"tbl\"><table><tr><td>Maturity<\/td><td>$ MRR<\/td><td>Discount Factor<\/td><td>CF<\/td><td>DCF<\/td><\/tr><\/table><\/div><p>90 &nbsp; 1.30% &nbsp; 0.9968 &nbsp; €875,000 &nbsp; 872,200 270 &nbsp; 2.30% &nbsp; 0.9830 &nbsp; €100,875,000 &nbsp; 99,160,125<\/p><p>€100,032,325<\/p><p>PV € Fixed<\/p><p>OTS is based in the U.S. but has borrowed in €&#x27;s. OTS would therefore take the position of receiving €&#x27;s and paying $&#x27;s in the currency swap.<\/p><p>Convert the € fixed coupon bond into $&#x27;s at the date of the valuation using the exchange rate $/€ = 1.48<\/p><p>€100,032,325 × 1.48 = $148,047,841<\/p><p>The value to the party paying $&#x27;s and receiving €&#x27;s = $148,047,841 – $142,936,115 = $5,111,726 Note that no actual computations were required to answer this question if you spotted that answer B was the only solution to use the correct exchange rate.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–7<\/div> <div class=\"pp-topic\">Module 28.7, LOS 28.f<\/div><div class=\"qtext\"><p>If OTS decides on a fixed for fixed currency swap, what is the market value of the swap to OTS three months after swap initiation?<\/p><\/div>", "subj": "derivatives"}, {"n": 6, "q": "Using the information in Exhibit 2, what is the market value of the equity swap to OTS three months after swap initiation?", "opts": ["+USD80.35 million.", "+USD85.33 million.", "+USD88.76 million."], "ans": "A", "expl": "OTS is paying the equity return and the value is: (1000 / 1190) × USD500m = USD420.17 million The value of fixed payments is equivalent to the value of a one-year fixed coupon bond with 0.5% semi-annual coupon. The value of bond is the present value of the two coupon payments and the par value: [(0.005 × 0.9979) + (1.005 × 0.9911)] × 500m = USD 500.52 million. Value to OTS: USD500.52m – USD420.17m = USD80.35 million", "explhtml": "<p>OTS is paying the equity return and the value is:<\/p><p>(1000 / 1190) × USD500m = USD420.17 million<\/p><p>The value of fixed payments is equivalent to the value of a one-year fixed coupon bond with 0.5% semi-annual coupon. The value of bond is the present value of the two coupon payments and the par value:<\/p><p>[(0.005 × 0.9979) + (1.005 × 0.9911)] × 500m = USD 500.52 million.<\/p><p>Value to OTS: USD500.52m – USD420.17m = USD80.35 million<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–7<\/div> <div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>Using the information in Exhibit 2, what is the market value of the equity swap to OTS three months after swap initiation?<\/p><\/div>", "subj": "derivatives"}, {"n": 7, "q": "How many of Smith's comments are correct?", "opts": ["Neither comment is correct.", "One comment is correct.", "Both comments are correct."], "ans": "B", "expl": "When the index declines, the fixed rate payer would pay the negative return in addition to the fixed rate and, hence, will suffer a loss greater than the fixed rate. There is no way of knowing the first payment on an equity swap because we do not know the value of the equity index on the payment date. The floating rate for the first settlement also known at time 0 (known as advance set, paid in arrears).", "explhtml": "<p>When the index declines, the fixed rate payer would pay the negative return in addition to the fixed rate and, hence, will suffer a loss greater than the fixed rate. There is no way of knowing the first payment on an equity swap because we do not know the value of the equity index on the payment date. The floating rate for the first settlement also known at time 0 (known as advance set, paid in arrears).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 4–7<\/div> <div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>How many of Smith&#x27;s comments are correct?<\/p><\/div>", "subj": "derivatives"}, {"n": 8, "q": "How will the price of the one-year stock index future perform over the next 12 months?", "opts": ["The futures price will converge to the future spot index price, with the basis reducing to zero.", "The value will move approximately in line with the spot index price, with a fairly constant basis.", "The futures price will move approximately in line with the spot index price, though its actual level at the end of the year will depend more on supply and demand than on the spot price."], "ans": "A", "expl": "The futures price will converge to the spot price over the lifetime of the contract, with the basis (difference between future and spot) reducing over this period to zero as an expiring futures contract is the same as a spot transaction. At expiration the futures and spot price will converge to prevent an arbitrage opportunity. Answer B is wrong, as it implies the future price will move in a straight line.", "explhtml": "<p>The futures price will converge to the spot price over the lifetime of the contract, with the basis (difference between future and spot) reducing over this period to zero as an expiring futures contract is the same as a spot transaction. At expiration the futures and spot price will converge to prevent an arbitrage opportunity. Answer B is wrong, as it implies the future price will move in a straight line.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 8–11). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>How will the price of the one-year stock index future perform over the next 12 months?<\/p><\/div>", "subj": "derivatives"}, {"n": 9, "q": "Comment 1 is best described as:", "opts": ["correct.", "incorrect as the value of the futures contract should be negative after marking to market.", "incorrect as the value of the futures contract should be zero after marking to market."], "ans": "C", "expl": "The value of a futures contract will reset to zero after marking-to-market.", "explhtml": "<p>The value of a futures contract will reset to zero after marking-to-market.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>Comment 1 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 10, "q": "Comment 2 is best described as:", "opts": ["correct.", "incorrect as the full price should be the clean price less the current accrued interest.", "incorrect as the accrued interest at expiration should be deducted from the future value of full bond price in arriving at the quoted futures price."], "ans": "C", "expl": "The quoted (clean) price of the futures contract is the future value of the full price of the cheapest to deliver bond less accrued interest (since last coupon) and the future value any coupon payment received during the life of the contract and then adjusted for the appropriate conversion factor. QFP = {(full price) × (1 + Rf)T – AIT – FVC)(1 / CF)", "explhtml": "<p>The quoted (clean) price of the futures contract is the future value of the full price of the cheapest to deliver bond less accrued interest (since last coupon) and the future value any coupon payment received during the life of the contract and then adjusted for the appropriate conversion factor.<\/p><p>QFP = {(full price) × (1 + R<sub>f<\/sub>)<sup>T<\/sup> – AI<sub>T<\/sub> – FVC)(1 / CF)<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>Comment 2 is best described as:<\/p><\/div>", "subj": "derivatives"}, {"n": 11, "q": "Using Exhibit 1, the quoted price of the Treasury bond futures contract should be closest to:", "opts": ["$941.", "$975.", "$1,100."], "ans": "A", "expl": "An investor of the Treasury bond will receive one semi-annual coupon in 0.5 years from now (or 0.2 years before maturity). At expiration of the futures contract, the CTD bond will have 0.2 years of accrued interest. FV of coupon (FVC) = $25 × 1.03(0.7 – 0.5) = $25.15 AIT = 0.2 / 0.5 × $25 = $10 QFP = {(full price) × (1 + Rf)T – AIT – FVC)(1 / CF) = [$1030(1.03)0.7 – 10 – 25.15](1 / 1.08) = $941.10", "explhtml": "<p>An investor of the Treasury bond will receive one semi-annual coupon in 0.5 years from now (or 0.2 years before maturity). At expiration of the futures contract, the CTD bond will have 0.2 years of accrued interest.<\/p><p>FV of coupon (FVC) = $25 × 1.03<sup>(0.7 – 0.5)<\/sup> = $25.15<\/p><p>AI<sub>T<\/sub> = 0.2 / 0.5 × $25 = $10<\/p><p>QFP = {(full price) × (1 + R<sub>f<\/sub>)<sup>T<\/sup> – AI<sub>T<\/sub> – FVC)(1 / CF)<\/p><p>= [$1030(1.03)<sup>0.7<\/sup> – 10 – 25.15](1 / 1.08)<\/p><p>= $941.10<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 8–11<\/div> <div class=\"pp-topic\">Module 28.3, LOS 28.d<\/div><div class=\"qtext\"><p>Using Exhibit 1, the quoted price of the Treasury bond futures contract should be closest to:<\/p><\/div>", "subj": "derivatives"}, {"n": 12, "q": "The value of a futures contract between the times when the account is marked-to-market is:", "opts": ["never less than the value of a forward contract entered into on the same date.", "the same as the contract price.", "equal to the difference between the price of a newly issued contract and the settle price at the most recent mark-to-market period."], "ans": "C", "expl": "Between the mark-to-market account adjustments, the contract value is calculated just like that of a forward contract; it is the difference between the price at the last mark-to-market and the current futures price, (i.e. the futures price on a newly issued contract). The mark-to-market of a futures contract is the payment or receipt of funds necessary to adjust for the gains or losses on the position. This adjusts the contract price to the 'no-arbitrage' price currently prevailing in the market.", "explhtml": "<p>Between the mark-to-market account adjustments, the contract value is calculated just like that of a forward contract; it is the difference between the price at the last mark-to-market and the current futures price, (i.e. the futures price on a newly issued contract). The mark-to-market of a futures contract is the payment or receipt of funds necessary to adjust for the gains or losses on the position. This adjusts the contract price to the &#x27;no-arbitrage&#x27; price currently prevailing in the market.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The value of a futures contract between the times when the account is marked-to-market is:<\/p><\/div>", "subj": "derivatives"}, {"n": 13, "q": "An index is currently 965 and the continuously compounded dividend yield on the index is 2.3%. What is the no-arbitrage price on a one-year index forward contract if the continuously compounded risk-free rate is 5%.", "opts": ["991.1.", "991.4.", "987.2."], "ans": "B", "expl": "The futures price FP = S₀e⁻δT (eRT) = S₀e(R-δ)T = 965e(.05-.023) = 991.4", "explhtml": "<p>The futures price FP = S<sub>0<\/sub>e<sup>-<\/sup><sup>δ<\/sup><sup>T<\/sup> (e<sup>RT<\/sup>)<\/p><p>= S<sub>0<\/sub>e<sup>(R-<\/sup><sup>δ<\/sup><sup>)T<\/sup><\/p><p>= 965e(.05-.023)<\/p><p>= 991.4<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.2, LOS 28.a<\/div><div class=\"qtext\"><p>An index is currently 965 and the continuously compounded dividend yield on the index is 2.3%. What is the no-arbitrage price on a one-year index forward contract if the continuously compounded risk-free rate is 5%.<\/p><\/div>", "subj": "derivatives"}, {"n": 14, "q": "The contract price of a forward contract is:", "opts": ["the price that makes the contract a zero-value investment at initiation.", "always the present value of the expected future spot price.", "determined at the settlement date."], "ans": "A", "expl": "The contract price can be an interest rate, discount, yield to maturity, or exchange rate. The forward price is the future value of the spot price adjusted for any periodic payments expected from the asset. An example of when the forward price may be less than the spot price is in the case of an equity index contract where the dividend yield is greater than the risk-free rate.", "explhtml": "<p>The contract price can be an interest rate, discount, yield to maturity, or exchange rate. The forward price is the future value of the spot price adjusted for any periodic payments expected from the asset. An example of when the forward price may be less than the spot price is in the case of an equity index contract where the dividend yield is greater than the risk-free rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>The contract price of a forward contract is:<\/p><\/div>", "subj": "derivatives"}, {"n": 15, "q": "What is the difference between spot and futures prices? Spot prices are always:", "opts": ["equal to the futures price at futures expiration.", "lower than futures prices.", "delivered to meet the futures obligation at expiration."], "ans": "A", "expl": "The difference between the spot and the futures price must be zero at expiration to avoid arbitrage.", "explhtml": "<p>The difference between the spot and the futures price must be zero at expiration to avoid arbitrage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>What is the difference between spot and futures prices? Spot prices are always:<\/p><\/div>", "subj": "derivatives"}, {"n": 16, "q": "Which of the following is equivalent to a pay-fixed swap with a tenor of two years with semi-annual swap payments and a fixed rate of 6% (exchanged for MRR)? The notional principal is $100,000,000.", "opts": ["A strip of two forward rate agreements, which obligates the party to pay a fixed rate of 6% and receive six-month MRR on a notional principal of $100,000,000.", "A forward rate agreement, which obligates the party to pay a fixed rate of 6% and receive six-month MRR on a notional principal of $100,000,000.", "A strip of three forward rate agreements, which obligates the party to pay a fixed rate of 6% and receive six-month MRR on a notional principal of $100,000,000."], "ans": "C", "expl": "In an interest rate swap, the first payment is known with certainty and will be made at month 6. The determination dates for the floating rate will be at months 6, 12, and 18 and the corresponding payment dates will be at months 12, 18, and 24. These correspond to the three forward rate agreements.", "explhtml": "<p>In an interest rate swap, the first payment is known with certainty and will be made at month 6. The determination dates for the floating rate will be at months 6, 12, and 18 and the corresponding payment dates will be at months 12, 18, and 24. These correspond to the three forward rate agreements.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.6, LOS 28.e<\/div><div class=\"qtext\"><p>Which of the following is equivalent to a pay-fixed swap with a tenor of two years with semi-annual swap payments and a fixed rate of 6% (exchanged for MRR)? The notional principal is $100,000,000.<\/p><\/div>", "subj": "derivatives"}, {"n": 17, "q": "An equity portfolio manager who has a positive long-term outlook for equities, but expects equity prices to decline over the next three months, would most appropriately enter into:", "opts": ["a short straddle with an equity index as the underlying.", "an equity swap as the equity return receiver.", "an equity swap as the equity return payer."], "ans": "C", "expl": "By entering an equity swap as the equity return payer, the manager can protect the portfolio value from a short-term decline in equity prices while keeping ownership of the equities for the longer term. A short straddle costs the investor when the price of the underlying moves up or down.", "explhtml": "<p>By entering an equity swap as the equity return payer, the manager can protect the portfolio value from a short-term decline in equity prices while keeping ownership of the equities for the longer term. A short straddle costs the investor when the price of the underlying moves up or down.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.8, LOS 28.g<\/div><div class=\"qtext\"><p>An equity portfolio manager who has a positive long-term outlook for equities, but expects equity prices to decline over the next three months, would most appropriately enter into:<\/p><\/div>", "subj": "derivatives"}, {"n": 18, "q": "Over the life of a swap, the price of the swap:", "opts": ["fluctuates with changes in the yield curve.", "does not change.", "is approximately equal to the market value of the swap."], "ans": "B", "expl": "The price of a swap, quoted as the fixed rate in the swap, is determined at contract initiation and remains fixed for the life of the swap.", "explhtml": "<p>The price of a swap, quoted as the fixed rate in the swap, is determined at contract initiation and remains fixed for the life of the swap.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 28.1, LOS 28.b<\/div><div class=\"qtext\"><p>Over the life of a swap, the price of the swap:<\/p><\/div>", "subj": "derivatives"}, {"n": 19, "q": "Consider a 1-year semiannual equity swap based on an index at 985 and a fixed rate of 4.4%. 90 days after the initiation of the swap, the index is at 982 and MRR is 4.6% for 90 days and 4.8% for 270 days. The value of the swap to the equity payer, based on a $2 million notional value is closest to:", "opts": ["$22,314", "−$22,564", "$22,564"], "ans": "C", "expl": "0.044  0.044 | 982  1 | 2  2 | =  −  −  − 985 1+(0.046×  )  1+(0.048×  )  1+(0.048×  ) | 90  270  270 | 360  360  360 | 982  0.022  0.022  1 | =  −  −  − | 985  1.0115  1.036  1.036 = 0.99695
