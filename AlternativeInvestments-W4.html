<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

not yet been built. Since a greenfield investment has no financial or operating\nhistory, there is risk that the completed asset may face lower demand or have a lower value than expected. Other risks include difficulty obtaining\nfinancing and higher construction or operating costs.\nExplain features and characteristics of infrastructure", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Which of the following types of alternative investments most likely provides investors the greatest income stability?", "opts": ["Direct investment in farmland", "Direct investment in timberland", "Equity real estate investment trusts"], "ans": "C", "expl": "Equity real estate investments\nCategory Sources of return Comments\nRental income\nConsidered commercial property when not owner-\nResidential property Property\noccupied\nappreciation\nRental income\nDirect investments Commercial real estate Property Types: offices, retail, industrial, warehouses, hotels\nappreciation\nCrop income\nGood inflation hedges due to both land and crop\nFarmland and timberland Property\nvalues\nappreciation\nRental income\nPooled Equity real estate investment\nProperty Stable income on portfolio of commercial properties\ninvestments trusts\nappreciation\nEquity investment in real estate takes the form of direct investment in individual properties or pooled investment in real estate investment trusts\n(REITs).\nThe net rental income of equity REITs is mostly derived from commercial leases (eg, office buildings, retail malls) and multifamily residences (eg,\napartment complexes). Rental income from these properties is relatively predictable and provides more stable income than other types of real\nestate equity investments.\n(Choices A and B) Direct ownership of natural resources (eg, farmland, timberland) provides investors with a stream of current income and\npotential property appreciation. Current income is derived from sales of harvestable commodities. However, commodity prices and harvests can\nbe relatively volatile, resulting in less predictable income streams.\nThings to remember:\nEquity investment in real estate takes the form of direct investment in individual properties or pooled investment in real estate investment trusts\n(REITs). These investments usually have an income component. Pooled investments in REITs offer more stable rental income streams than\nnatural resources (eg, farmland, timberland) since income from crops is susceptible to volatility in commodity prices and harvests.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 3, "q": "An investor is seeking an alternative investment that offers historically low correlation with global equities, relatively low volatility, and current income. Which of the following most appropriately meets these requirements?", "opts": ["Farmland", "Managed futures", "Publicly listed real estate investment trust"], "ans": "A", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nThe three sources of return on farmland are harvest quantities, commodity prices, and land prices. Farmland provides a consistent income\nstream as the crops are harvested, and is considered an inflation hedge since it offers investors exposure to commodity and land prices.\nRelative to global equities, attributes that make farmland a desirable investment include low correlations, low annualized volatility, and\ncomparable rates of return.\n(Choice B) Managed futures provide diversification benefits to a typical portfolio, but the returns tend to be volatile.\n(Choice C) Publicly listed real estate investment trusts have high correlations to global equities and exhibit high volatility.\nThings to remember:\nRelative to global equities, attributes that make farmland a desirable investment include low correlations, low annualized volatility, and comparable\nrates of return. Farmland also provides a consistent income stream as the crops are harvested and is considered an inflation hedge since it offers\ninvestors exposure to commodity and land prices.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 4, "q": "In a floating-rate mortgage on a commercial real estate property, the lender's risk compared to the borrower's risk is best described as:", "opts": ["spread risk.", "interest rate risk.", "the loan-to-value ratio."], "ans": "C", "expl": "The loan-to-value ratio is one of the most common risk assessment tools used by mortgage lenders. This ratio divides a loan's current value by\nthe current appraised property value and reflects the size of the lender's investment relative to the borrower's investment.\nSince the property is generally the only collateral for the loan, the loan-to-value ratio is especially important in the loan risk assessment process\nand ultimately determines the amount of risk (ie, potential for capital losses) assumed by the lender. A common initial loan-to-value ratio in\ncommercial real estate is 65%–80%, meaning that the borrower has equity in the property of 35%–20%. The greater the ratio, the greater the\nlender's risk.\n(Choice A) Spread risk refers to the impact on a bond's price from changes in credit spreads, which are not directly relevant here.\n(Choice B) In this case, the loan is a floating-rate mortgage, which neutralizes interest rate risk for the lender.\nThings to remember:\nThe loan-to-value ratio divides a loan's current value by the current appraised property value. Since the property is usually the only collateral for\nthe loan, the loan-to-value ratio is especially important in the loan risk assessment process and ultimately determines the amount of risk assumed\nby the lender.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfgAAABYCAIAAACWIXJyAAAQVElEQVR42u2d3XXiyhKFa+4676MMRkRgHAEoAiACiwhAEQARABGAI7CIADkCdCIwjoB2BHMf9vK+fVsgfozHY3t/D7M8smhVd+NSdVV19Y/fv3+bEEKIr8t/NARCCCFFL4QQQopeCCGEFL0QQggpeiGEEFL0QgghpOiFEEJI0QshhBS9EEIIKXohhBBS9EIIIaTohRBCSNELIYSQohdCCCFFL4QQUvRCCCG+JP9oCIS4CmVZmlme5/hvs9k0s263+1X765xDr9vt9hee1qIoMJVRFMmiF0II8ZfyQ0cJCvF2w7bX6xVFYWY0b/HfZrO5Xq8/nT1YluX9/b2ZTafTGlPXzJIk+do65MePH5jBT71wkUUvhBAmH70Q4iBJkuCHp6cnM4vj2HfZJ0nS6/XMDFbhZyHPc8gvpOiF+O5QIa7Xa6p484Kxo9EIPpDtdosbyrKEGye4378Od9B2uzWzKIqWyyVcB2hzu93iTl6nVyEICKdpGjyFDiXcWRQFbkDQOIoiPPT5+RkyFEVxrssCLUC2QLzgHsjpnEN3ut0upWWkFy2gte12ezTEjZadc7iz+lu0zN8Gr7Rms1nTOO6sTh+vV+e0fjpMrhshhBCmYKwQH0u/34e9ttvt7GRXT6vVMrPxeHzoOuzufr/vG6fOOYRG+/2+b5Y65zabDa7TxqdFvFgsYEsytIgbYPnGcUwb38w2mw2kmkwmFOyQiqgGY/F0iN1sNmH5FkWBp0MSWLhwZzFtkTY1OkKp4BZjd2gjD4fDQ1Fi3HB7ext40kCj0RgMBmjh9vbWXyVwxIbDoXlRaD8YC3mq08fr/sVTpkOuGyE+AVQT79Q49CP1AtTfdrsN9AUUSp7nUJS+XwIqFc4Tar0oiqAHfX0NTURV9fj4eFZoYbvdQsVDRUJdok2o1FarBYGzLAuUKfTg7e0tOhK8AjudDlvDr+bz+SFFj743m82gKQ4dPDPL5RLDu9ls/JfBbDbLsqw+3egop0zHH/bhyHUjhBCmYKwQ4sPYu8wPLsL6posA1qsfHoR/iXbx3d0dP+tHSukhsYvi0ngWn0ITG9KuViv8sF6v/V0F2+22PsPH7yyk9T1Le7m7u5vP575Fj5A4471pmsLQpmWNQXt+fn77lJ0yHcEoSdEL8fdCb/JRD8y7LtXxiKIomOBh+3Z1kffYveWcO9THX79+UUjcCQ8G9Xu9PBdIm6YpPDB5nuPdgJFhnICqP0kSf3CuMk3nTofJdSOEEEIWvRAfRqvVYor3XmOQoUg/pvpO1OSi2B+sBlHl5eXFvyFJEljZkDaOYwwdt569nSiK6C/ypWKO/Hg8xsRNp1M8HSIVRXEtMT58OmTRCyGELHohhJ3kC0ZgsN/vPzw8+A5lGJL9fp/bPvmpIOLHkB0StC+g0+mY2WQyGY1GgQxcT7x3Wa5ut4uhCIq7OedgO49GIzjlnXOQh3Jym+7FI2D74rFm1uv1MLzV8DWuBNcRwq2nOn3oMoU/ZTr+cIm0fy4oa8fNGp+6QLN9huLm3CzzBYaaPfpiXx7o9yRJ8DcMhf7z50/E+qpKrdPpIE5or4HK1Wr1 iSadstVBhwAAAABJRU5ErkJggg=="]}, {"n": 5, "q": "An investor seeking to benefit from the appreciation of commercial real estate would most appropriately buy:", "opts": ["equity real estate investment trusts.", "mortgage real estate investment trusts.", "commercial mortgage-backed securities."], "ans": "A", "expl": "Pooled real estate investments\nSources of return Description\nLoan (mortgage) income\nResidential MBS Pools of single-family residential mortgage loans\nSecured by property\nLoan (mortgage) income\nCommercial MBS Pools of commercial/multi-family residential mortgages\nSecured by property\nRental income\nEquity REITs Stable income on portfolio of commercial properties\nProperty appreciation\nLoan (mortgage) income\nMortgage REITs Portfolio of residential and/or commercial MBS\nSecured by property\nMBS = mortgage-backed securities; REITs = real estate investment trusts.\nPublicly traded, pooled real estate investments are usually structured as real estate investment trusts (REITs) or mortgage-backed securities\n(MBS). There are two types of REITS: equity REITs and mortgage REITs.\nEquity REITs purchase (ie, own the equity in) commercial real estate.\nMBS and mortgage REITs invest in real estate–related debt.\nThe benefits of property appreciation accrue primarily to the property owners. Of the choices, only equity REITs own commercial real estate and\nrealize the full benefit of property appreciation.\n(Choice B) Mortgage REITs hold portfolios of MBS. As holders of interests in pools of debt instruments, mortgage REITs are owed a share of the\nprincipal and interest of the loan pools; however, they do not participate in property appreciation.\n(Choice C) Commercial MBS (CMBS) are interests in single pools of commercial mortgages. CMBS holders have a claim on the interest and\nprincipal of the pooled mortgages, but they do not share in property value gains.\nThings to remember:\nPublicly traded, pooled real estate investments are mostly structured as real estate investment trusts (REITs) or mortgage-backed securities.\nEquity REITs are the only type of pooled real estate investment that participates directly in the appreciation of commercial properties.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 6, "q": "An alternative investment that provides diversification benefits and an inflation hedge while also generating consistent income is best described as an investment in:", "opts": ["farmland.", "managed futures.", "a greenfield infrastructure project."], "ans": "A", "expl": "Farmland and timberland investments\nFarmland Timberland Common to both\nHarvest quantities\nSources of returns Commodity prices Lumber prices\nLand price changes\nPossibly ESG Inflation hedge\nESG-friendly\nInvestment Regular income Low correlation with traditional\nLong new growth cycle\nattributes Harvest inflexibility; at least annual assets\nHarvest flexibility\nharvest cycle Can hedge with futures\nDirect purchase, but for largest\nInvestment vehicles Publicly traded REITs investors only\nPrivate investment funds\nESG = environmental, social, and governance REIT = Real estate investment trust\nReal estate is a varied asset class that includes many forms (eg, residential, commercial, land) and investment structures (eg, direct, indirect,\nsecuritized). For example, investments in farmland provide significant diversification benefits to traditional debt and equity portfolios.\nThere are three principal components of return for farmland: harvest quantities, commodity prices, and land prices. Farmland can be divided into\nrow crops (eg, corn, wheat) that may be harvested more than once per year and permanent crops (eg, orchards, vineyards). As the crops are\nharvested, they provide a consistent income stream. Farmland also represents an inflation hedge since it offers investors exposure to\ncommodity and land prices.\n(Choice B) Managed futures provide diversification benefits and possible income to typical portfolio, but they are not considered an inflation\nhedge.\n(Choice C) Greenfield infrastructure projects require a significant cash outlay and often take many years to produce revenue, so they are\ninappropriate for consistent income.\nThings to remember:\nFarmland provides diversification benefits and a consistent income stream as crops are harvested; it also represents an inflation hedge since\ninvestors gain exposure to commodity and land prices. The three principal components of return for farmland are harvest quantities, commodity\nprices, and land prices.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 7, "q": "Compared with a direct investment in real estate, investing in real estate investment trusts (REITs) most likely offers a distinct advantage regarding:", "opts": ["taxes.", "degree of control.", "stability of income."], "ans": "C", "expl": "Real estate investing categories\nSingle-family residences Commercial real estate Farm and timber\nDirect equity ownership – Yes Yes\nDirect debt investment – Yes –\nCMBS\nPooled investment vehicles Joint ventures\nRMBS Joint ventures\n(debt and equity) Real estate funds\nReal estate funds\nREITs Yes, mortgage REITs Yes, wide variety of subsectors Yes, timber REITs\nRMBS = residential mortgage-backed securities; CMBS = commercial mortgage-backed securities;\nREIT = real estate investment trust.\nInvestors can own real estate\ndirectly through purchasing and managing property, or\nindirectly through purchasing shares in a publicly traded REIT.\nReal estate investment trusts (REITs) are publicly traded companies that invest in a portfolio of commercial or residential properties, typically\nrelying on leverage to finance and hold larger portfolios that can enhance returns. In REITs, shares are publicly traded and the investment\nportfolio is diversified, providing two key advantages over direct investment: liquidity and income stability.\n(Choice A) Tax advantages are not unique to REITs. Both kinds of investments offer tax advantages to investors: direct investments often offer\nreal estate-specific deductions and deferrals, while REITs avoid corporate taxes if they distribute most of the rental income (ie, at least 90%) to\nshareholders.\n(Choice B) Degree of control is an advantage unique to direct investment. Direct investment offers control over decisions such as buying, selling,\nsources of funding, number of tenants, and whether to undertake capital projects. A REIT, however, makes management decisions for its portfolio\nof properties without investor feedback or approval.\nThings to remember:\nReal estate investing offers several advantages to investors. Some advantages are shared across different forms of real estate investments. For\ninstance, direct investment and real estate investment trusts (REITs) both provide tax advantages. Other advantages are unique to the type of\nreal estate investment. For example, a key advantage of direct investment is degree of control, while REITs offer liquidity and income stability.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 8, "q": "An infrastructure investor primarily concerned with market liquidity would most appropriately invest in:", "opts": ["the expansion of an income-generating toll road.", "an exchange-traded fund consisting of utility companies.", "a hedge fund investing in various types of infrastructure companies."], "ans": "B", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nInfrastructure investments provide access to returns from assets (eg, roads, airports) that provide essential services intended for public use.\nIndirect infrastructure investments are more liquid than direct investments (eg, building or purchasing a hospital). Whether publicly traded (eg,\ninfrastructure exchange-traded funds (ETFs)) or unlisted (eg, hedge funds), indirect investments require smaller capital outlays and are easier\nto exit since they can typically be sold back to the fund or traded on an exchange.\nPublicly traded indirect investments are more liquid than unlisted indirect investments, which have a smaller pool of potential investors and may\nhave redemption restrictions. For investors primarily concerned with market liquidity, a publicly traded indirect investment (eg, ETF consisting of\nutility companies) is preferable to an unlisted infrastructure hedge fund (Choice C).\n(Choice A) Direct infrastructure investments (eg, expansion of an income-generating toll road) have low market liquidity driven by the need for a\nlarge amount of capital, the time required to exit an investment, and the limited number of potential buyers. These factors can make it difficult to\nrealize an asset's full market value in a sale, especially for an investor seeking a quick exit; therefore, a direct infrastructure investment is a less\nappropriate choice for an investor primarily concerned with market liquidity.\nThings to remember:\nDue to smaller capital outlays and ease of exit, indirect infrastructure investments are more liquid than direct investments. Publicly traded indirect\ninvestments (eg, exchange-traded funds) are more liquid than unlisted indirect investments (eg, hedge funds).\nExplain features and characteristics of infrastructure", "qhtml": null, "explfigs": null}, {"n": 9, "q": "A portfolio manager is considering adding an infrastructure investment to a pension portfolio to increase the fund's long-term expected return. Which of the following is the most appropriate investment to add to the portfolio?", "opts": ["Direct brownfield investment in a power plant", "Direct greenfield investment in a toll road project", "Publicly listed master limited partnership in existing energy pipeline assets"], "ans": "B", "expl": "Greenfield vs. brownfield infrastructure characteristics\nGreenfield Brownfield\nInfrastructure that has yet to be built Expansion or improvement of existing infrastructure\nNo operating or financial history May already be generating regular cash flow or dividends\nUsually higher risk, higher return potential Usually lower risk, lower return potential\nThe terms brownfield and greenfield refer to the development stage of infrastructure investments. Greenfield projects build new infrastructure\n(eg, new toll road). Brownfield projects expand or improve existing infrastructure (eg, adding capacity at a power plant).\nGreenfield infrastructure projects have no financial or operating history. Greenfield projects are among the riskiest investments to undertake due\nto long lead times (often 5–10 years) and the potential for delays or cost overruns in land acquisition, permits, engineering, and final construction.\nDue to the high risks associated with greenfield projects, investors require very high returns for these types of investments. A pension fund with a\nvery long investment horizon can absorb the risks while reaping the potentially greater expected returns that can be generated over the long life\nof these assets.\n(Choice A) Relative to greenfield projects, brownfield assets have lower risks due to stable cash flow generation and known operating and\nfinancial histories. These projects tend to be more income producing and/or dividend oriented, but the expected returns are lower.\n(Choice C) A publicly listed master limited partnership (MLP) in existing energy pipeline assets is an example of a brownfield asset, with lower\nreturn expectations than a greenfield project. MLPs primarily emphasize income generation.\nThings to remember:\nGreenfield projects build new infrastructure, while brownfield projects expand or improve existing infrastructure. Since they often have long lead\ntimes and no performance history, greenfield assets carry considerable risk and therefore must offer much higher long-term expected returns than\nbrownfield assets.\nExplain features and characteristics of infrastructure", "qhtml": null, "explfigs": null}, {"n": 10, "q": "An investor who does not seek current income from an investment in infrastructure should most appropriately:", "opts": ["directly invest in a greenfield hospital project.", "own shares in an unlisted mutual fund that invests in existing toll roads.", "invest in an exchange-traded fund that consists of brownfield public utilities."], "ans": "A", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nA greenfield infrastructure project is one that has not yet been built; a brownfield project already exists. Infrastructure projects typically require\na long construction period, so they tend not to produce current income at the project's inception. This type of investment is appropriate for an\ninvestor who does not seek current income.\nDirect investment refers to an ownership interest in the project itself. An indirect investment consists of an investment in an entity such as a\nmutual fund or an exchange-traded fund that in turn invests in infrastructure assets.\n(Choices B and C) Investments in completed (ie, brownfield) projects can produce immediate current income, and utilities and toll roads typically\nproduce significant amounts of current income.\nThings to remember:\nGreenfield infrastructure assets must be built, and a greenfield investor often realizes no current income during an asset's construction.\nBrownfield investments, especially those that benefit from regular revenue streams such as utilities and toll roads, are more appropriate for an\ninvestor seeking current income.\nExplain features and characteristics of infrastructure", "qhtml": null, "explfigs": null}, {"n": 11, "q": "An analyst is using a real estate valuation index to estimate the value of an investment property and wishes to avoid sample selection bias. The analyst's least appropriate choice is to use a(n):", "opts": ["REIT index.", "appraisal index.", "repeat sales index."], "ans": "C", "expl": "Real estate return indexes are categorized as appraisal, repeat sales, or real estate investment trust (REIT) indexes. Repeat sales indexes are\nconstructed using the average price change of the same property as a result of a sale or refinancing. This transaction-based approach\nprovides a timely and accurate valuation for a broad range of properties (eg, residential single-family homes).\nA repeat sales index does have limitations, including sample selection bias. The selection process is nonrandom since it uses properties with\nprior sales. Thus, the index may have a bias toward properties that turn over at a higher rate but are not necessarily representative of the broader\ngeographic scope of the index. Selection bias could also occur if sales in a specific area are infrequent, making the results less reliable.\n(Choice A) REIT indexes are based on the underlying prices of publicly traded REITs. Although useful for the valuation of the real estate asset\nclass, valuation of publicly traded REITs may not align with the specific circumstances (eg, geography, quality, property type) for valuing a\nparticular investment property.\n(Choice B) Appraisal indexes rely on appraised property values, which are typically based on comparable properties or cash flow estimates.\nLimitations of the appraisal index include the subjectivity of the appraisal process and the reliance on appraisals to calculate returns, all of which\nmay result in understated return volatility.\nThings to remember:\nSample selection bias is a limitation of repeat sales indexes. Since the selection process is nonrandom, a repeat sales index may have a bias\ntoward certain properties that are not necessarily representative of the broader geographic scope of the index. Selection bias could also occur if\nsales in a specific area are infrequent, making the results less reliable.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAIDCAIAAACCalyaAACgvUlEQVR42u39TXAk6Xnfiz7g9GisaCs6u33inNO2gih0r44UYheW9jljVO1EBRVdtTpkSBGoWpEWbwRQG45NLwq1MG1qU6gFfcUVqiZmQrwR914UQgzZOxQ8vNYSiWGYZ9dIzMpSOLoT17dDHqpJ3MVfeOLtN+sLnw10/36LCUx21vudme/zPl8LJycnBgAAAAAAcNv4CkMAAAAAAAAIMwAAAAAAAAgzAAAAAAAACDMAAAAAAIAwAwAAAAAAgDADAAAAAACAMAMAAAAAAAgzAAAAAAAACDMAAAAAAAAIMwAAAAAAAAgzAAAAAACAMAMAAAAAAIAwAwAAAAAAgDADAAAAAAAIMwAAAAAAAAgzAAAAAAAACDMAAAAAAIAwAwAAAAAAgDADAAAAAACAMAMAAAAAAIAwAwAAAAAACDMAAAAAAAAIMwAAAAAAAAgzAAAAAACAMAMAAAAAAIAwAwAAAAAAgDADAAAAAAAIMwAAAAAAAAgzAAAAAAAACDMAAAAAAAABdxgCABiNRnt7e9PvefLkiZlVKpUkSd5II/v9/tHRkf5ut9s3bQzzPL/Ekcnz3Mze1FBfnE6noz8WFxfNrNFovNmpCQczy7LBYOD/urKyUqlUbs7QZVlmZt7CK23eddYFAGBoZgAAAAAAAJyFk5MTRgHgHafT6WxsbMxzZ5Ik3W7X3sRZe7VaHY1G+vtGvbg2Nzc1hi9evLDL0CF0Op00Tc1sd3f3tn5aFhb0h07630h cnJwwCgAAAAAAcOtAMwMAAAAAAAgzAAAAAAAACDMAAAAAAAAIMwAAAAAAgDADAAAAAACAMAMAAAAAAIAwAwAAAAAACDMAAAAAAAAIMwAAAAAAAJfO/x9GIWiEkFbh1gAAAABJRU5ErkJggg=="]}, {"n": 12, "q": "The type of infrastructure investment most likely to have the highest concentration risk is a(n):", "opts": ["direct investment in a greenfield project.", "unlisted mutual fund that invests in multiple global brownfield projects.", "exchange-traded fund (ETF) made up of publicly traded infrastructure companies."], "ans": "A", "expl": "Classification of infrastructure investments\nCategory Characteristics\nTransportation assets (eg, bridges, airports)\nEconomic\nUtility assets (eh, water, waste treatment, power generation)\nTypes of assets\nSocial Public welfare assets (eg, hospitals, schools)\nBrownfield Improving existing infrastructure\nStage of development\nGreenfield Building new infrastructure\nDirect ownership of a project\nDirect Highest upside potential\nHighest concentration and liquidity risks\nInvestment vehicle\nShares of publicly traded infrastructure companies\nIndirect Investment can be made through exchange-traded funds, mutual funds\nBetter liquidity and more diversification than direct investment\nInfrastructure refers to public-use assets such as schools, hospitals, and roads. Investing in infrastructure is a form of alternative investing.\nGreenfield projects represent new assets that will be built; brownfield assets are those that already exist. Most infrastructure investing is\nthrough indirect vehicles such as mutual funds and exchange-traded funds (ETFs), but direct investment is available for some types of projects.\nDirect investors are responsible for building the greenfield asset; they own all its upside potential as well as its risks. Infrastructure projects are\nextremely capital-intensive, and each project's capital requirements often make it unfeasible for an investor to directly invest in multiple projects.\nThis limited ability to diversify causes concentration risk.\n(Choice B) Unlisted mutual funds make passive investments in infrastructure assets that are not publicly traded, such as hospitals or schools.\nThese funds diversify among several different investments, so concentration risk is usually not present.\n(Choice C) Infrastructure ETFs consist of shares of publicly traded infrastructure companies. The diversification across many companies means\nthat no single company comprises a significant percentage of the fund. This reduces the possibility of concentration risk.\nThings to remember:\nInvestors can choose between direct and indirect investments in infrastructure projects. Direct investing captures all the project's upside potential\nbut exposes the investor to the most risk, including concentration risk. Indirect investing can provide more diversification and reduce the investor's\nrisk.\nExplain features and characteristics of infrastructure", "qhtml": null, "explfigs": null}, {"n": 13, "q": "A private equity real estate fund that primarily redevelops and repurposes shopping malls in secondary and tertiary markets is most likely structured as a(n):", "opts": ["core-plus strategy fund.", "finite-life closed-end fund.", "infinite-life open-end fund."], "ans": "B", "expl": "Indirect real estate:\nPrivate equity fund characteristics\nInfinite life, open end Finite life, closed end\nBeta exposure, income oriented Higher-risk property types and markets, but higher return profile\nBuy-and-hold strategy Sell properties once redeveloped, focus on capital appreciation, then\nContribute and redeem throughout the fund's life close the fund\nCore strategy: high quality, best markets, and stable return Value-add strategy: modest upgrades and redevelopment or\nprofile repositioning of property\nCore-plus strategy: incorporates an allocation to lower-tier Opportunistic strategy: higher-risk projects, major redevelopments,\nmarkets and higher-risk properties significant vacancies, and speculation\nIndirect real restate investing takes many forms, including various public and private pooled investment vehicles, such as real estate-focused\nprivate equity funds. Real estate private equity funds are generally structured as either finite-life closed-end (FLCE) funds or infinite-life open-\nend (ILOE) funds.\nFLCE funds typically earn returns through the development or redevelopment of higher-risk properties (eg, nursing homes, hotels) in noncore\nmarkets. Once redeveloped, the properties are sold to lock in returns and the fund is then wound down. After their initial investment, investors\nare unable to contribute or redeem until the fund is wound down. FLCE funds are positioned as:\nValue-add funds, which include modest property upgrades and redevelopment or repositioning of a property.\nOpportunistic funds, which are the most aggressive and include projects with much higher risk. Examples include major redevelopments,\nvacant properties, and outright speculative construction.\nA fund that primarily redevelops and repurposes shopping malls (ie, high risk) in secondary and tertiary markets (ie, noncore) is most likely\nstructured as an opportunistic finite-life closed-end fund.\nILOE funds have no predetermined end date and investors can contribute and redeem throughout the life of the fund. ILOE funds include core\nfunds, which focus exclusively on buying and holding the best properties in the best markets (ie, low risk, income focus) and provide general asset\nclass exposure (ie, beta). Core-plus funds also invest primarily in core properties but add a modest allocation to riskier markets and property\ntypes (Choices A and C).\nThings to remember:\nFinite-life closed-end funds generally invest in higher-risk property types in noncore markets. Once redeveloped, the properties are sold to lock in\nreturns and the fund is then wound down. Opportunistic finite-life closed-end fund strategies are more aggressive than value-add strategies.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": null}, {"n": 14, "q": "Which of the following is most likely a limitation of using appraisal indexes to measure returns to real estate?", "opts": ["Infrequent trading", "Understated volatility", "Sample selection bias"], "ans": "B", "expl": "Returns to real estate can be measured using various indexes, which are broadly categorized as appraisal, repeat sales (ie, transactional), or real\nestate investment trust (REIT) indexes. Appraisal index returns rely on appraised property values, which are typically based on comparable\nproperties or cash flow estimates.\nAlthough appraisals are expert estimates of value, both the selection of comparable properties and adjustments made to those properties are\nsubjective. Also, appraisals are often updated less frequently than needed to reflect current market conditions. These limitations tend to result\nin understated return volatility.\n(Choice A) The appraisal index is not based on trading shares, so it is unaffected by trading frequency. Trading infrequency is a potential\nlimitation of REIT indexes since reliability is directly related to the frequency of trading.\n(Choice C) An appraisal index is based on appraisals of actual assets in the index, so sample selection is irrelevant. Sample selection bias is a\nlimitation of repeat sales indexes, which are based on the change in value for sales of the same property during a given period.\nThings to remember:\nReal estate return indexes are categorized as appraisal, repeat sales, or real estate investment trust indexes. Limitations of the appraisal index\ninclude the subjectivity of the appraisal process and the potential reliance on infrequent appraisals to calculate returns, all of which may result in\nunderstated return volatility.\nExplain features and characteristics of real estate", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEQAAAIDCAIAAACCalyaAACgvUlEQVR42u39TXAk6Xnfiz7g9GisaCs6u33inNO2gih0r44UYheW9jljVO1EBRVdtTpkSBGoWp const CFG = {"title": "Wiley · Real Estate and Infrastructure", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Alternative Investments · 14 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
