<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Of the following, the most likely source of principal-agent conflict between managers and shareholders is managers' having:", "opts": ["remuneration tied to stock-based compensation.", "different levels of risk tolerance than shareholders.", "more limited access to information about the business."], "ans": "B", "expl": "Shareholders' primary goal is maximizing the value of their shares in the company, while managers may focus on maximizing job security\nand total compensation, including salary, bonuses, and stock-based compensation. Differing priorities (eg, different levels of risk tolerance)\ncan cause principal-agent conflict between shareholders and managers.\nTo protect their jobs, a company's managers may be more risk-averse than its shareholders. Shareholders can diversify risk across investments,\nallowing higher risk tolerance, whereas managers may lose their jobs when risky projects fail. In other cases, managers, expecting to increase\ntheir standing or compensation, may accept risky projects when shareholders prefer stability.\n(Choice A) When management compensation includes stock-based compensation, the managers' interests are more closely aligned with the\nshareholders', which reduces the risk of conflict.\n(Choice C) A company's managers are more involved in its day-to-day operations and, as a result, are likely to have more, not less, information\nthan shareholders. Information asymmetry can lead managers to make decisions that may not be in the shareholders' best interest, leading to\nprincipal-agent conflict.\nThings to remember:\nDiffering priorities can cause principal-agent conflict between a company's shareholders and managers. One source of conflict is the managers'\nhaving different levels of risk tolerance than shareholders.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 2, "q": "Which component of stakeholder management does a corporation least likely control?", "opts": ["Legal infrastructure", "Contractual infrastructure", "Organizational infrastructure"], "ans": "A", "expl": "Effective stakeholder management provides a framework for limiting conflicts of interest among different stakeholder groups by proactively\nidentifying and balancing their needs. This framework follows a set of legal, contractual, organizational, and governmental infrastructure that\ndefines the rights and responsibilities of each stakeholder.\nLegal infrastructure is established and controlled by law and not by the corporation. It refers to rights as well as legal remedies that address\nbreaches of those rights.\nGovernmental infrastructure, like legal infrastructure, is outside the control of the corporation. It refers to the rules and regulations established by\nthe government.\n(Choice B) Contractual terms arranged by a corporation and its stakeholders (eg, customers) shape contractual infrastructure, which establishes\nthe rights of all parties in a contractual agreement.\n(Choice C) The corporation's internal systems, practices, and procedures for managing stakeholder relationships shape organizational\ninfrastructure.\nThings to remember:\nLegal infrastructure is established by law and not by the corporation.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 3, "q": "An effective corporate governance system most likely:", "opts": ["helps protect creditor rights.", "creates incentive for management to take fewer risks.", "impedes a company's ability to respond quickly to market events."], "ans": "A", "expl": "Benefits of strong corporate governance\nIncreased operational efficiency and improved\ninternal controls\nIncreased creditworthiness (eg, lower default\nprobability, lower cost of debt)\nEarlier identification of potential conflicts\nImproved operating and financial results\nBetter alignment of manager decisions and\ncompany value maximization\nReduced legal costs and reputational damage\nAn effective corporate governance system prevents one stakeholder group from benefitting at the expense of others by establishing strong\nstakeholder management guidelines and operational controls. These features lead to better relationships with investors and creditors, fewer\nconflicts of interest, more efficient operations, and improved financial results.\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency. The better the\ncontrols and reporting, the more confidence creditors have in the business, reducing borrowing costs and increasing access to funds.\n(Choice B) Strong corporate governance better aligns manager decisions to maximize shareholder wealth; it does not necessarily make\nmanagement more or less risk averse. Proper controls and well-designed compensation plans may encourage potentially risk-averse managers\nto take on risky projects that maximize shareholder wealth. Likewise, effective governance and controls can prevent undue risk-taking that\nemphasizes short-term gains without enhancing long-term shareholder value.\n(Choice C) Effective corporate governance systems typically improve a company's decision-making process, thereby improving, not impeding,\nthe company's ability to quickly respond to market factors.\nThings to remember:\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency, thereby reducing\nborrowing costs and increasing access to funds. In addition, strong corporate governance increases efficiency, improves financial results, and\nbetter aligns manager decisions and company value creation.\nDescribe potential risks of poor corporate governance and stakeholder management and benefits of effective corporate governance and\nstakeholder management", "qhtml": null}, {"n": 4, "q": "Which of the following factors is most appropriately a concern for potential shareholders?", "opts": ["An activist shareholder with a significant position", "Executive remuneration that includes time-vested shares", "Governance codes implemented on a \"comply or explain\" basis"], "ans": "A", "expl": "Key factors related to corporate governance and stakeholder\nmanagement\nCompany ownership and voting structure\nShareholder representation on board of directors\nRemuneration and incentives for management\nSignificant activist investors\nStrength of shareholder rights\nManagement of long-term risks\nGovernance codes and disclosure of deviation from codes\nSignificant investors with activist tendencies can heavily influence many corporate functions by pressuring management through tactics such\nas initiating proxy battles, proposing shareholder resolutions, and raising awareness of potentially contentious issues.\nThe primary motivation for activism is usually to increase shareholder value in the manner the activist believes is best. This may concern potential\nshareholders since the presence of an activist can influence a company's strategic direction and cause significant changes to shareholder\ncomposition.\n(Choice B) An executive remuneration plan that includes time-vested shares encourages executives to take a long-term view of company\nperformance. This view better aligns with shareholders' interests than cash or other short-term incentives.\n(Choice C) Governance codes implemented on a \"comply or explain\" basis are voluntary but require any deviation from the codes to be disclosed\npublicly, which promotes transparency of information and is an advantage for shareholders.\nThings to remember:\nShareholder engagement describes a company's interaction with its shareholders. An activist investor with a significant position in the company's\nstock can substantially change shareholder composition and influence company strategy. The presence of such an investor may be a concern for\npotential investors.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 5, "q": "An argument supporting a dual-class structure of common equity is most likely that compared to single-class structures, dual-class structures better:", "opts": ["align voting power with economic ownership.", "promote stability and long-term strategic investments.", "remove conflicts of interest between noncontrolling shareholders and management."], "ans": "B", "expl": "A common share structure for public companies is the single-class structure, wherein each share grants the holder one vote so that every\nshareholder has proportional voting power based on the number of shares held (eg, a shareholder owning 5% of the company controls 5% of\nthe votes). Other companies have dual-class structures, with multiple share classes that allow different numbers of votes per share (eg, Class A\nhas one vote per share, while Class B has five votes per share).\nProponents of dual-class structures argue that they provide more stability since founders and insiders can better retain control when faced with\nactivism or a takeover attempt. In addition, shareholders and their chosen managers are insulated when voting power is controlled, so the\ncompany can focus on long-term strategic investments instead of short-term financial results. Once created, dual-class structures are difficult to\ndismantle.\n(Choice A) Dual-class structures separate voting power from economic ownership since owners of the class with more votes (usually founders or\ninsiders) have voting power disproportionate to their share ownership.\n(Choice C) Critics of dual-class structures argue that they can create conflicts of interest between company executives and noncontrolling\nshareholders, who lack the voting power to enforce their preferences when the executives—chosen by insiders—have different goals.\nThings to remember:\nDual-class share structures separate voting power from economic ownership since owners of the class with more votes have voting power\ndisproportionate to their number of shares. Proponents of dual-class structures argue that they provide more stability and allow companies to\nfocus on long-term strategic investments.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 6, "q": "Which of the following topics is most likely to be voted on during a company's annual general meeting?", "opts": ["Approving the external auditor", "Accepting a merger or acquisition", "Amending the rights of a class of shares"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated\nsolely to the board of directors. Typical (and often recurring) agenda items for an AGM include the following:\nAn overview of the company's financial statements and performance\nApproval of audited financial statements (if applicable)\nElection and discharge of directors\nRemuneration of directors and executives\nAppointment of external auditors\nThe opportunity for shareholders to voice concerns or opinion\nAn extraordinary general meeting (EGM) is called by a company to address irregular and timely matters, often related to a corporate transaction or\nmaterial corporate change that requires shareholder approval. Items may include mergers and acquisitions or amendments to the rights of a class\nof shares. If the timing is appropriate, special items may be voted on during an AGM; this is less likely, however, if the items are not of a pressing\nnature or occur infrequently (Choices B and C).\nThings to remember:\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated solely\nto the board of directors. Approval of the external auditor is a typical AGM agenda item.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 7, "q": "At a shareholders' annual general meeting (AGM), which of the following most likely requires a supermajority vote?", "opts": ["Merger or takeover transaction", "Approval of financial statements", "Election of directors and auditors"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nA company holds an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that the board of directors does not\nhave the authority to make alone. The AGM is mandatory, is usually composed of routine items, and often has a similar agenda each year.\nTypical agenda items for an AGM include approval of audited financial statements, the election of directors, and the opportunity for shareholders to\nvoice concerns or opinions.\nAn extraordinary general meeting (EGM) is called to address items that need more immediate attention, often related to a corporate transaction\nthat requires shareholder approval. Special items are not necessarily reserved for an EGM; if the timing is appropriate, the AGM may also include\nspecial one-time items for shareholder consideration, such as a merger or acquisition.\nOrdinary agenda items require only a simple majority to pass, whereas more significant matters that would materially affect the organization\nusually require a supermajority vote (eg, 66%, 75%). Examples of items requiring a supermajority vote include changes or amendments to the\ncorporate charter or by-laws, mergers, and a takeover of the business.\n(Choices B and C) The approval of financial statements and the election of directors and auditors are routine matters, requiring only a simple\nmajority to pass.\nThings to remember:\nOrdinary agenda items require only a simple majority to pass, while more significant matters that would materially affect the organization usually\nrequire a supermajority vote. Examples of items requiring a supermajority vote include mergers, changes or amendments to the corporate charter\nor by-laws, , and a takeover of the business.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 8, "q": "Which of the following is most likely a responsibility of a board of director's remuneration committee?", "opts": ["Proposing the compensation for the external auditors", "Evaluating the performance of the company's managers", "Setting the criteria for what constitutes an independent director"], "ans": "B", "expl": "A company's board of directors (ie, board) is composed of individuals who are elected by and represent the company's shareholders to ensure\nmanagement acts in the best interest of shareholders. A board has several roles and is usually broken into committees that focus on different\nfunctions.\nThe remuneration committee is primarily responsible for performance evaluation and compensation policies related to the company's\nmanagers. This often includes:\nproposing remuneration for managers,\nhandling managers' contracts,\nsetting performance criteria and evaluating management performance,\nestablishing human resources policies related to remuneration, and\noverseeing the implementation of the company's benefit plans.\n(Choice A) The audit committee is typically responsible for matters pertaining to the external auditors, including proposing their remuneration.\n(Choice C) The nomination committee is typically responsible for setting the criteria for what constitutes an independent director.\nThings to remember:\nThe board of directors is elected by and represents the interests of shareholders and is usually broken into committees that focus on specific\nfunctions. The remuneration committee is responsible for performance evaluation and compensation policies related to the company's managers,\nwhich includes setting performance criteria and evaluating management performance.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 9, "q": "The founder of Company P, who owns 51% of the company, chooses to buy materials from Firm S, which is owned by a family relative. Firm S charges 25% above current market price for its products, which are of ordinary quality. In this scenario, conflicts of interest are most likely to arise between Company P's:", "opts": ["customers and suppliers.", "creditors and board of directors.", "controlling shareholder and minority shareholders."], "ans": "C", "expl": "In companies where a single shareholder or group of shareholders holds a controlling stake, conflicts may arise between the controlling and\nminority shareholders. The opinions and decisions of controlling shareholders often outweigh the concerns of minority shareholders since\nminority shareholders have little or no influence in corporate decision making.\nIn this example, the founder and majority owner (at 51% ownership) of Company P places his/her interest above that of minority shareholders in a\nrelated-party transaction. The transaction may benefit the founder and the relative but diminishes profitability of Company P, thus creating a\nconflict of interest between the controlling shareholder and minority shareholders.\n(Choice A) Conflicts between customers and suppliers typically result from a company offering lenient credit terms to its customers, which may\nimpact the company's own ability to pay its suppliers on time.\n(Choice B) Both creditors and the board of directors want the company's profits to be healthy. Since the related-party transaction benefits the\ncontrolling shareholder to the detriment of the company's profits, the creditors and the board are aligned in interest, not conflicted.\nThings to remember:\nThe decisions made by a controlling shareholder may create a conflict of interest with the minority shareholders.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 10, "q": "With regard to remuneration policies, which of the following practices is least likely to align executive compensation with shareholder interests?", "opts": ["Implementing clawback provisions", "Giving shareholders \"say on pay\" rights", "Granting stock options rather than performance shares"], "ans": "C", "expl": "Executive compensation structure\nFixed component Base salary\nVariable component Profit sharing, stock options, stocks\nTypically, executive compensation includes a variable component tied to company or stock performance. Since shareholders seek to maximize\nstock value in the long run, proper remuneration policies ensure that executives focus on long-term company gains rather than short-term\nprofits. One way of doing so is to grant executives performance shares instead of stock options.\nPerformance shares are typically awarded when long-term company performance objectives (eg, targeted earnings per share) are met. In\ncontrast, employee stock options (ESO) can be exercised immediately to the holder's benefit anytime the company's stock price rises above the\noption's strike price. For this reason, ESO can lead management to overly focus on short-term performance.\nOther alignment mechanisms include clawback provisions and shareholder \"say on pay\" rights. Clawbacks allow companies to retract prior\ncompensation if executives miss certain corporate objectives (Choice A). \"Say on pay\" rights allow shareholders to vote on remuneration matters\n(Choice B).\nThings to remember:\nProper executive remuneration policies can align the interests of executives with stakeholder objectives and company performance. Ways to\nensure alignment include granting performance shares, imposing clawback provisions, and giving shareholders \"say on pay.\"\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 11, "q": "Which of the following is a function of a company's board of directors?", "opts": ["Execute company strategy", "Prepare company financial statements", "Review merger and acquisition proposals"], "ans": "C", "expl": "The board of directors (the board) is composed of individuals elected by shareholders primarily to represent shareholder interests. The board\nmonitors the managers (eg, executives) of the company on behalf of its shareholders, effectively serving as the central link between the two.\nBoard members serve on different functional committees (eg, investment committee) that oversee different areas of the company.\nThe major functions of the board include:\nEstablishing the company's strategic direction\nMonitoring execution of strategy by management\nSelecting, appointing, and terminating senior managers\nReviewing corporate and management performance\nEnsuring effectiveness of audit and control systems\nEnsuring adoption of corporate governance principles (ie,\ncomplying with laws and ethical standards)\nAppropriating enterprise risk management systems\nReviewing proposals for corporate transactions or changes\n(eg, M&A, divestitures)\n(Choice A) Managers execute a company's strategy after the board establishes it.\n(Choice B) The board does not directly prepare company financials; instead, the board oversees the company's audit and control systems to\nensure financial integrity.\nThings to remember:\nThe board of directors is elected by shareholders primarily to represent shareholders' interests. The board sets company strategy and oversees\nits implementation and execution, monitors management performance, ensures audit controls, ensures adoption of governance, appropriates\nenterprise risk management, and reviews major corporate transactions (eg, M&A, divestitures).\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 12, "q": "Which function is least likely a responsibility of the audit committee?", "opts": ["Recommending an external auditor", "Providing oversight of the application of accounting policies", "Monitoring company-wide compliance with all relevant laws and regulations"], "ans": "C", "expl": "Audit committee responsibilities\nOversee audit and control systems\nMonitor financial reporting process and ensure financial accuracy\nOversee application of accounting policies\nEnsure integrity of financial statements\nSupervise internal audit function\nRecommend external auditor\nPresent annual audit report to board\nBoard members serve on functional committees, which oversee different areas of a company. These committees include but are not limited to\ngovernance, risk, and investment committees. The governance committee, not the audit committee, is responsible for maintaining compliance\nwith laws and regulations.\nThe audit committee is one of the most common committees on corporate boards. In addition to its primary function of overseeing a\ncompany's reporting process, the audit committee is charged with mitigating the risk of fraud or misstatements in both accounting and financial\ninformation. The committee maintains independence from company management and establishes policies and procedures to ensure financial\nintegrity.\n(Choices A and B) The audit committee's responsibilities include oversight of both the audit process (eg, recommending an external auditor) and\nthe application of accounting policies.\nThings to remember:\nThe audit committee maintains independence from management as it oversees a company's audit and control systems and establishes policies\nand procedures to ensure financial integrity (eg, mitigating the risk of fraud or misstatements). The governance committee, not the audit\ncommittee, is responsible for monitoring company-wide compliance with laws and regulations.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 13, "q": "Stakeholder theory asserts that the primary responsibility of corporate governance is to:", "opts": ["maximize shareholder returns.", "prioritize the needs of employees.", "balance the competing needs of all interested parties."], "ans": "C", "expl": "Corporate governance overview\nCorporate The framework of managing priorities between a company's management and board, relative to its shareholders\ngovernance and other stakeholders\nShareholder theory Prioritizes maximizing returns to equity shareholders\nConsiders shareholders' needs, but takes a more balanced approach toward managing the diverging interests\nStakeholder theory\nthat arise between all interested parties\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders (ie,\nowners) and other stakeholders. There is not one universally accepted approach to corporate governance, but the two most widely practiced\napproaches are:\nShareholder theory, in which the priority is maximizing shareholder returns above all else (Choice A).\nStakeholder theory, which takes a more balanced approach in managing the conflicting interests of shareholders and all other\nstakeholders without unduly favoring one group over another (Choice B).\nThe practice of corporate governance is often influenced by long-standing cultural, legal, and political factors specific to a country or geographic\nregion. Corporate governance approaches are best seen as placed along a continuum, with shareholder theory at one end and stakeholder\ntheory at the other.\nWhile there is not a single unifying set of global rules and regulations for what constitutes the proper model of corporate governance, the trend has\nbeen toward a convergence of ideas for a consensus framework regarding what is considered best practice.\nThings to remember:\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders and\nstakeholders. Shareholder theory places the needs of equity owners above all else, while stakeholder theory takes a more balanced approach\ntoward the concerns of all stakeholders.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 14, "q": "Which of the following is most accurate with regard to a dual-class share structure?", "opts": ["Shareholders have voting power equal to their percentage of ownership.", "It may grant founders superior voting control even if their ownership level falls below 50%.", "It typically grants outside shareholders greater voting power than insiders and family members."], "ans": "B", "expl": "Normally, public companies have a share structure that grants each shareholder proportional voting power based on the number of shares\nheld. For example, a shareholder who owns 50% of the company controls 50% of the votes. One exception to the general rule is a dual-class\nstructure, where different share classes allow different numbers of votes per share (eg, Class A at one vote per share vs. Class B at two votes per\nshare).\nA dual-class structure may create disproportional voting power relative to share ownership. Insiders (eg, founders) commonly hold Class B\nshares, which grant them dominant voting control on important issues (eg, board elections or strategic decisions) even if their share ownership\nfalls below 50%.\n(Choice A) Shareholders have voting power equal to their percentage of share ownership only if all shares grant the same number of votes.\nDifferent share classes allow for different votes per share in a dual-class structure.\n(Choice C) Class B shares are granted mainly to insiders and family members and not to outside shareholders; therefore, greater voting power is\ntypically held by insiders and family members.\nThings to remember:\nDual-class share structure creates disproportional voting power since different share classes carry unequal voting rights.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 15, "q": "Which of the following is least likely a role of the governance committee?", "opts": ["Develop the company's code of ethics", "Ensure compliance with applicable laws and regulations", "Establish nomination and identification processes for director positions"], "ans": "C", "expl": "Board members serve on functional committees, which oversee different areas of the company. The governance committee safeguards the\ncompany by implementing best practices in the company's policy and procedures. The main functions of the governance committee are:\nReview and update policies for regulatory changes and developments\nEnsure compliance with applicable laws and regulations\nRecommend remedial actions for breaches of laws\nDevelop and supervise the implementation of:\nCorporate governance code\nCharter of the board and its committees\nCompany's code of ethics and conflicts of interest policy\nOversee annual evaluation of the board\nThe nomination committee, not the governance committee, focuses on identifying candidates for board of director positions and establishing the\nprocess behind nominating these candidates.\n(Choices A and B) Developing a code of ethics and ensuring compliance with laws and regulations are both functions of the governance\ncommittee.\nThings to remember:\nThe governance committee ensures that the company adopts good corporate governance practices and procedures. The nomination committee\nestablishes nomination and identification processes for director positions.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}];
const CFG = {"title": "Wiley · Corporate Governance - Conflicts Mechanisms Risks and Benefits", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Corporate Issuers · 15 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
