<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

const DATA = [{"n": 1, "q": "Of the following, the most likely source of principal-agent conflict between managers and shareholders is managers' having:", "opts": ["remuneration tied to stock-based compensation.", "different levels of risk tolerance than shareholders.", "more limited access to information about the business."], "ans": "B", "expl": "Shareholders' primary goal is maximizing the value of their shares in the company, while managers may focus on maximizing job security\nand total compensation, including salary, bonuses, and stock-based compensation. Differing priorities (eg, different levels of risk tolerance)\ncan cause principal-agent conflict between shareholders and managers.\nTo protect their jobs, a company's managers may be more risk-averse than its shareholders. Shareholders can diversify risk across investments,\nallowing higher risk tolerance, whereas managers may lose their jobs when risky projects fail. In other cases, managers, expecting to increase\ntheir standing or compensation, may accept risky projects when shareholders prefer stability.\n(Choice A) When management compensation includes stock-based compensation, the managers' interests are more closely aligned with the\nshareholders', which reduces the risk of conflict.\n(Choice C) A company's managers are more involved in its day-to-day operations and, as a result, are likely to have more, not less, information\nthan shareholders. Information asymmetry can lead managers to make decisions that may not be in the shareholders' best interest, leading to\nprincipal-agent conflict.\nThings to remember:\nDiffering priorities can cause principal-agent conflict between a company's shareholders and managers. One source of conflict is the managers'\nhaving different levels of risk tolerance than shareholders.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAkEAAAGVCAIAAA Jlculz2z0ZgtDa4ys5WVlU6n43nV/v7+6uqqsijdQhhFkba+vr5uZp1OxzsTR/XuaRPValWpm132bLbbbQ4/AAAw+gEBAADs6c63rrpUFEUaLR7HsSpAXgeanA9LV4egdyMWi0V18NnlzYDb29vadKZIpn9OUirTMm/evBlVbwMAALjzvEp9cMqiWq2Wpu70RGpjY0OvKPXxkUyDPn/+vLy8HL6iGwm73a4mHfV+wCiK9Pvm5maYscVxnJmaQW+c5D5ELbO/v28/jrgCAAAw+gEBAADsadWrNCRcE0f5FFNxHKtWVKlUVNDyopH61zY3N/XGKIo0ZrzX62mYuQVTWGkN+sUGSlmaa8r7B1dXV9U/uL6+rn49LTB0qiobGCav5VV4KxaL3A8IAACMehUAAMCjNemzh3u93tbWlpmlaaoCVb1ez4xY9yc0q0xllwOkWq3WYF3KgoqXj6+yy8FPKpJtb297MUzTInQ6nXC+dV9tqVTKPE4n80qSJD7fut67tbU1+RN4AAAAbi2vAgAAgNEPCAAAQF4FAABAXgUAAEBeBQAAAPIqAACAB/P/AEN7EFdFQBWjAAAAAElFTkSuQmCC"]}, {"n": 3, "q": "An effective corporate governance system most likely:", "opts": ["helps protect creditor rights.", "creates incentive for management to take fewer risks.", "impedes a company's ability to respond quickly to market events."], "ans": "A", "expl": "Benefits of strong corporate governance\nIncreased operational efficiency and improved\ninternal controls\nIncreased creditworthiness (eg, lower default\nprobability, lower cost of debt)\nEarlier identification of potential conflicts\nImproved operating and financial results\nBetter alignment of manager decisions and\ncompany value maximization\nReduced legal costs and reputational damage\nAn effective corporate governance system prevents one stakeholder group from benefitting at the expense of others by establishing strong\nstakeholder management guidelines and operational controls. These features lead to better relationships with investors and creditors, fewer\nconflicts of interest, more efficient operations, and improved financial results.\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency. The better the\ncontrols and reporting, the more confidence creditors have in the business, reducing borrowing costs and increasing access to funds.\n(Choice B) Strong corporate governance better aligns manager decisions to maximize shareholder wealth; it does not necessarily make\nmanagement more or less risk averse. Proper controls and well-designed compensation plans may encourage potentially risk-averse managers\nto take on risky projects that maximize shareholder wealth. Likewise, effective governance and controls can prevent undue risk-taking that\nemphasizes short-term gains without enhancing long-term shareholder value.\n(Choice C) Effective corporate governance systems typically improve a company's decision-making process, thereby improving, not impeding,\nthe company's ability to quickly respond to market factors.\nThings to remember:\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency, thereby reducing\nborrowing costs and increasing access to funds. In addition, strong corporate governance increases efficiency, improves financial results, and\nbetter aligns manager decisions and company value creation.\nDescribe potential risks of poor corporate governance and stakeholder management and benefits of effective corporate governance and\nstakeholder management", "qhtml": null, "explfigs": null}, {"n": 4, "q": "Which of the following factors is most appropriately a concern for potential shareholders?", "opts": ["An activist shareholder with a significant position", "Executive remuneration that includes time-vested shares", "Governance codes implemented on a \"comply or explain\" basis"], "ans": "A", "expl": "Key factors related to corporate governance and stakeholder\nmanagement\nCompany ownership and voting structure\nShareholder representation on board of directors\nRemuneration and incentives for management\nSignificant activist investors\nStrength of shareholder rights\nManagement of long-term risks\nGovernance codes and disclosure of deviation from codes\nSignificant investors with activist tendencies can heavily influence many corporate functions by pressuring management through tactics such\nas initiating proxy battles, proposing shareholder resolutions, and raising awareness of potentially contentious issues.\nThe primary motivation for activism is usually to increase shareholder value in the manner the activist believes is best. This may concern potential\nshareholders since the presence of an activist can influence a company's strategic direction and cause significant changes to shareholder\ncomposition.\n(Choice B) An executive remuneration plan that includes time-vested shares encourages executives to take a long-term view of company\nperformance. This view better aligns with shareholders' interests than cash or other short-term incentives.\n(Choice C) Governance codes implemented on a \"comply or explain\" basis are voluntary but require any deviation from the codes to be disclosed\npublicly, which promotes transparency of information and is an advantage for shareholders.\nThings to remember:\nShareholder engagement describes a company's interaction with its shareholders. An activist investor with a significant position in the company's\nstock can substantially change shareholder composition and influence company strategy. The presence of such an investor may be a concern for\npotential investors.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 5, "q": "An argument supporting a dual-class structure of common equity is most likely that compared to single-class structures, dual-class structures better:", "opts": ["align voting power with economic ownership.", "promote stability and long-term strategic investments.", "remove conflicts of interest between noncontrolling shareholders and management."], "ans": "B", "expl": "A common share structure for public companies is the single-class structure, wherein each share grants the holder one vote so that every\nshareholder has proportional voting power based on the number of shares held (eg, a shareholder owning 5% of the company controls 5% of\nthe votes). Other companies have dual-class structures, with multiple share classes that allow different numbers of votes per share (eg, Class A\nhas one vote per share, while Class B has five votes per share).\nProponents of dual-class structures argue that they provide more stability since founders and insiders can better retain control when faced with\nactivism or a takeover attempt. In addition, shareholders and their chosen managers are insulated when voting power is controlled, so the\ncompany can focus on long-term strategic investments instead of short-term financial results. Once created, dual-class structures are difficult to\ndismantle.\n(Choice A) Dual-class structures separate voting power from economic ownership since owners of the class with more votes (usually founders or\ninsiders) have voting power disproportionate to their share ownership.\n(Choice C) Critics of dual-class structures argue that they can create conflicts of interest between company executives and noncontrolling\nshareholders, who lack the voting power to enforce their preferences when the executives—chosen by insiders—have different goals.\nThings to remember:\nDual-class share structures separate voting power from economic ownership since owners of the class with more votes have voting power\ndisproportionate to their number of shares. Proponents of dual-class structures argue that they provide more stability and allow companies to\nfocus on long-term strategic investments.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA9oAAANPCAIAAACq3jDgAADGrElEQVR42uz9fXxc5X3n/78FxikYo7HNpjGNrXG835jGrhkl0BsR1zNrKDYxWHK7MY7pQzNJDISUjkRdSGhhNKYlgXqR1AAFu6ARiwNuv7FGCQnuAqtRHdTtQquxwdmQb/vzyO6m3TywPYLYNMSg3x8ffO3hzI1GsmTr5vX8g4cYnznnOtc5c53rfM7nuk7V0NCQAAAAAJwN51AFAAAAAN1xAAAAgO44AAAAALrjAAAAAN1xAAAAAHTHAQAAALrjAAAAAOiOAwAAAHTHAQAAANAdBwAAAOiOAwAAAKA7DgAAANAdBwAA erial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated\nsolely to the board of directors. Typical (and often recurring) agenda items for an AGM include the following:\nAn overview of the company's financial statements and performance\nApproval of audited financial statements (if applicable)\nElection and discharge of directors\nRemuneration of directors and executives\nAppointment of external auditors\nThe opportunity for shareholders to voice concerns or opinion\nAn extraordinary general meeting (EGM) is called by a company to address irregular and timely matters, often related to a corporate transaction or\nmaterial corporate change that requires shareholder approval. Items may include mergers and acquisitions or amendments to the rights of a class\nof shares. If the timing is appropriate, special items may be voted on during an AGM; this is less likely, however, if the items are not of a pressing\nnature or occur infrequently (Choices B and C).\nThings to remember:\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated solely\nto the board of directors. Approval of the external auditor is a typical AGM agenda item.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 7, "q": "At a shareholders' annual general meeting (AGM), which of the following most likely requires a supermajority vote?", "opts": ["Merger or takeover transaction", "Approval of financial statements", "Election of directors and auditors"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nA company holds an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that the board of directors does not\nhave the authority to make alone. The AGM is mandatory, is usually composed of routine items, and often has a similar agenda each year.\nTypical agenda items for an AGM include approval of audited financial statements, the election of directors, and the opportunity for shareholders to\nvoice concerns or opinions.\nAn extraordinary general meeting (EGM) is called to address items that need more immediate attention, often related to a corporate transaction\nthat requires shareholder approval. Special items are not necessarily reserved for an EGM; if the timing is appropriate, the AGM may also include\nspecial one-time items for shareholder consideration, such as a merger or acquisition.\nOrdinary agenda items require only a simple majority to pass, whereas more significant matters that would materially affect the organization\nusually require a supermajority vote (eg, 66%, 75%). Examples of items requiring a supermajority vote include changes or amendments to the\ncorporate charter or by-laws, mergers, and a takeover of the business.\n(Choices B and C) The approval of financial statements and the election of directors and auditors are routine matters, requiring only a simple\nmajority to pass.\nThings to remember:\nOrdinary agenda items require only a simple majority to pass, while more significant matters that would materially affect the organization usually\nrequire a supermajority vote. Examples of items requiring a supermajority vote include mergers, changes or amendments to the corporate charter\nor by-laws, , and a takeover of the business.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 8, "q": "Which of the following is most likely a responsibility of a board of director's remuneration committee?", "opts": ["Proposing the compensation for the external auditors", "Evaluating the performance of the company's managers", "Setting the criteria for what constitutes an independent director"], "ans": "B", "expl": "A company's board of directors (ie, board) is composed of individuals who are elected by and represent the company's shareholders to ensure\nmanagement acts in the best interest of shareholders. A board has several roles and is usually broken into committees that focus on different\nfunctions.\nThe remuneration committee is primarily responsible for performance evaluation and compensation policies related to the company's\nmanagers. This often includes:\nproposing remuneration for managers,\nhandling managers' contracts,\nsetting performance criteria and evaluating management performance,\nestablishing human resources policies related to remuneration, and\noverseeing the implementation of the company's benefit plans.\n(Choice A) The audit committee is typically responsible for matters pertaining to the external auditors, including proposing their remuneration.\n(Choice C) The nomination committee is typically responsible for setting the criteria for what constitutes an independent director.\nThings to remember:\nThe board of directors is elected by and represents the interests of shareholders and is usually broken into committees that focus on specific\nfunctions. The remuneration committee is responsible for performance evaluation and compensation policies related to the company's managers,\nwhich includes setting performance criteria and evaluating management performance.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlEAAAIOCAIAAAAXxs+rAABqiklEQVR42u29T3Qb15XnfwGRlGzJAqhEno7k . For this reason, ESO can lead management to overly focus on short-term performance.\nOther alignment mechanisms include clawback provisions and shareholder \"say on pay\" rights. Clawbacks allow companies to retract prior\ncompensation if executives miss certain corporate objectives (Choice A). \"Say on pay\" rights allow shareholders to vote on remuneration matters\n(Choice B).\nThings to remember:\nProper executive remuneration policies can align the interests of executives with stakeholder objectives and company performance. Ways to\nensure alignment include granting performance shares, imposing clawback provisions, and giving shareholders \"say on pay.\"\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 11, "q": "Which of the following is a function of a company's board of directors?", "opts": ["Execute company strategy", "Prepare company financial statements", "Review merger and acquisition proposals"], "ans": "C", "expl": "The board of directors (the board) is composed of individuals elected by shareholders primarily to represent shareholder interests. The board\nmonitors the managers (eg, executives) of the company on behalf of its shareholders, effectively serving as the central link between the two.\nBoard members serve on different functional committees (eg, investment committee) that oversee different areas of the company.\nThe major functions of the board include:\nEstablishing the company's strategic direction\nMonitoring execution of strategy by management\nSelecting, appointing, and terminating senior managers\nReviewing corporate and management performance\nEnsuring effectiveness of audit and control systems\nEnsuring adoption of corporate governance principles (ie,\ncomplying with laws and ethical standards)\nAppropriating enterprise risk management systems\nReviewing proposals for corporate transactions or changes\n(eg, M&A, divestitures)\n(Choice A) Managers execute a company's strategy after the board establishes it.\n(Choice B) The board does not directly prepare company financials; instead, the board oversees the company's audit and control systems to\nensure financial integrity.\nThings to remember:\nThe board of directors is elected by shareholders primarily to represent shareholders' interests. The board sets company strategy and oversees\nits implementation and execution, monitors management performance, ensures audit controls, ensures adoption of governance, appropriates\nenterprise risk management, and reviews major corporate transactions (eg, M&A, divestitures).\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlEAAAIOCAIAAAAXxs+rAABqiklEQVR42u29T3Qb15XnfwGRlGzJAqhEno7kiKDHdmJnjgh6umcxc1oE3XE2c2KSzunlWKBmHZOU1yOS7tm2RKrPeNciqNlOm5TOGS86EwFUn15k4oiAElttyRZBtWUfW44IyNY//gF+i+/o/l5eoQoFECTx5/tZ8IBAoepVoerdd7/vvnsDxWJRCCGEkBYgyEtACCGENo8QQgihzSOEEEJo8wghhBDaPEIIIYQ2jxBCCKHNI4QQQmjzCCGEENo8QgghhDaPEEIIbR4hhBBCm0cIIYQ0EW28BC1LsVgMBAIl3+fFIU1zkweDQf83P2l6AuzgSKFQEJFA4P/dDMViUV9YVhDdBO8ZUr89WiBg3sy7du0y3zdfEKG2SQghhAi1TSLNKGmqhyci6+vr+LdQKKytrYnIxsaGfoW+HakfN87tbtQbOxgMwsPbtWtXW1sb3jFFTnp7tHmkhXoNdBmBQECNHGze6uqqiDx+/PjRo0d4f319XTegqknqX9LEv+3t7e3t7Xixe/duvOjo6CipdhKhtkkIIYTQzyPNMyje2NiA3wb37uHDh3v27BGRgwcPOkPd1DXk1SPSCGFZ33zzjYh88803+/btE5Gnn34aH9Hbo80j0oJTenih1k5EOjs7MfNR0sKxayANRDAYfPbZZ0Vk3759//Iv/yIioVAI9zDGc4FAQM0eobZJCCGE0M8j0iSr8cQIWoGkqU4evToizSJmPP300+FwWERyuRwcO8S27Nq1SwV83u20eUSaezJPAzUfP34sIvv37+dlIU05aS0iP/zhD0Xks88+QwAnpvfa29thAmnwhNomIYQQQj+PSHNoPpB91tbWEL2ymcn8ponnrPRErO2Zv7FugZi5srLyzDPPiEgoFBKR3bt361p1XiL6eYQQQgj9PCLNE8aysbGBNCub8Yo0F1RZL6fOPcJKG2aduJndxvtM9Sv0FLfTg3/06BGyCyGvXqFQ0ETqvOy0eaQleoGNjQ08/5u3EGbHXbK7Nzv6Hexi3MxM1a0q+S3vXTkT/Fdh/JgioNLf6PHjx2YWWWbRE2qbhBBCCP080mzpV/SFrtWredp7pyPo9Ga231Nxc0+raIZP58z5fsmLY8mkPiVl4p+NjQ0zo7pqm3SaafNIkxs8q  not limited to\ngovernance, risk, and investment committees. The governance committee, not the audit committee, is responsible for maintaining compliance\nwith laws and regulations.\nThe audit committee is one of the most common committees on corporate boards. In addition to its primary function of overseeing a\ncompany's reporting process, the audit committee is charged with mitigating the risk of fraud or misstatements in both accounting and financial\ninformation. The committee maintains independence from company management and establishes policies and procedures to ensure financial\nintegrity.\n(Choices A and B) The audit committee's responsibilities include oversight of both the audit process (eg, recommending an external auditor) and\nthe application of accounting policies.\nThings to remember:\nThe audit committee maintains independence from management as it oversees a company's audit and control systems and establishes policies\nand procedures to ensure financial integrity (eg, mitigating the risk of fraud or misstatements). The governance committee, not the audit\ncommittee, is responsible for monitoring company-wide compliance with laws and regulations.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 13, "q": "Stakeholder theory asserts that the primary responsibility of corporate governance is to:", "opts": ["maximize shareholder returns.", "prioritize the needs of employees.", "balance the competing needs of all interested parties."], "ans": "C", "expl": "Corporate governance overview\nCorporate The framework of managing priorities between a company's management and board, relative to its shareholders\ngovernance and other stakeholders\nShareholder theory Prioritizes maximizing returns to equity shareholders\nConsiders shareholders' needs, but takes a more balanced approach toward managing the diverging interests\nStakeholder theory\nthat arise between all interested parties\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders (ie,\nowners) and other stakeholders. There is not one universally accepted approach to corporate governance, but the two most widely practiced\napproaches are:\nShareholder theory, in which the priority is maximizing shareholder returns above all else (Choice A).\nStakeholder theory, which takes a more balanced approach in managing the conflicting interests of shareholders and all other\nstakeholders without unduly favoring one group over another (Choice B).\nThe practice of corporate governance is often influenced by long-standing cultural, legal, and political factors specific to a country or geographic\nregion. Corporate governance approaches are best seen as placed along a continuum, with shareholder theory at one end and stakeholder\ntheory at the other.\nWhile there is not a single unifying set of global rules and regulations for what constitutes the proper model of corporate governance, the trend has\nbeen toward a convergence of ideas for a consensus framework regarding what is considered best practice.\nThings to remember:\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders and\nstakeholders. Shareholder theory places the needs of equity owners above all else, while stakeholder theory takes a more balanced approach\ntoward the concerns of all stakeholders.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null, "explfigs": null}, {"n": 14, "q": "Which of the following is most accurate with regard to a dual-class share structure?", "opts": ["Shareholders have voting power equal to their percentage of ownership.", "It may grant founders superior voting control even if their ownership level falls below 50%.", "It typically grants outside shareholders greater voting power than insiders and family members."], "ans": "B", "expl": "Normally, public companies have a share structure that grants each shareholder proportional voting power based on the number of shares\nheld. For example, a shareholder who owns 50% of the company controls 50% of the votes. One exception to the general rule is a dual-class\nstructure, where different share classes allow different numbers of votes per share (eg, Class A at one vote per share vs. Class B at two votes per\nshare).\nA dual-class structure may create disproportional voting power relative to share ownership. Insiders (eg, founders) commonly hold Class B\nshares, which grant them dominant voting control on important issues (eg, board elections or strategic decisions) even if their share ownership\nfalls below 50%.\n(Choice A) Shareholders have voting power equal to their percentage of share ownership only if all shares grant the same number of votes.\nDifferent share classes allow for different votes per share in a dual-class structure.\n(Choice C) Class B shares are granted mainly to insiders and family members and not to outside shareholders; therefore, greater voting power is\ntypically held by insiders and family members.\nThings to remember:\nDual-class share structure creates disproportional voting power since different share classes carry unequal voting rights.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA9oAAANPCAIAAACq3jDgAADGmElEQVR42uz9f3xc5Xnn/78VjFNijMY2m8Y0tsbxfuI0ds0ogf4QcT2zhmITgyW3G+OYPjSTxEBI6UhUhYQWRmNaEqgXSQ1QsEs0ZnHA7SeWlJDgLrAa1UHdLrQaG5wN+bRfj+xu2s0D2yOInQYM+v5xoXsPZ35oJEu2pHk9/+AhxjPnxz1n7nOd61z3faqGh4cFAAAA4Fx4H00AAAAAEI4DAAAAhOMAAAAACMcBAAAAwnEAAAAAhOMAAAAA4TgAAAAAwnEAAACAcBwAAAAA4TgAAABAOA4AAACAcBwAAAAgHAcAAABAOA4AAAAQjgMAAAAgHAcAAAAIxwEAAADCcQAAAACE4wAAAADhOAAAAADCcQAAAIBwHAAAAADhOAAAAEA4DgAAAIBwHAAAACAcBwAAAEA4DgAAABCOAw function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
