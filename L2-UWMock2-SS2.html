<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

l checks on the reports&#x27; sources and accuracy. Anouilh uses the reports herself in conjunction with the internal reports generated by Navigator. Since the reports are used regularly in the research process, she does not disclose the Insight agreement to clients.<\/p><p>Later that day, Anouilh meets with a client, Nicolas Chastain, to discuss Navigator&#x27;s performance and various funds. Chastain has a long time horizon and does not plan to withdraw funds for several years. Anouilh presents Navigator&#x27;s marketing materials, which include the performance of each fund and strategy. She suggests Chastain review the performance of the HTBFD Fund. Chastain notes that the HTBFD Fund is the only fund without a benchmark listed. Anouilh explains that the HTBFD Fund&#x27;s strategy is unique, so there are no compatible benchmarks.<\/p><p>funds and asks Anouilh about putting money into small caps. Anouilh responds that &quot;Navigator can invest in small-cap strategies but only does so upon a client&#x27;s request.&quot; She does not mention that Navigator uses external managers to execute client-requested small-cap strategies.<\/p><p>Chastain then asks about two other investment funds: the Emerging Market Bond (EMB) Fund and the Macro Fund. Anouilh explains that the EMB Fund tends to be volatile but usually outperforms its benchmark. Since Chastain does not plan to withdraw any money for years, Anouilh does not discuss the EMB Fund&#x27;s strategic use of derivatives, which gives it limited liquidity.<\/p><p>Anouilh explains that the Macro Fund forecasts returns using a complex statistical model, the details of which are available upon request. She adds that the model has been backtested and the firm believes, based on the model, that emerging markets will outperform over the next year.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements in the marketing pamphlet, if distributed, would cause Anouilh to violate the Standards?<\/p><\/div><details cl mited liquidity.<\/p><p>Anouilh explains that the Macro Fund forecasts returns using a complex statistical model, the details of which are available upon request. She adds that the model has been backtested and the firm believes, based on the model, that emerging markets will outperform over the next year.<\/p><\/div><\/details><div class=\"qtext\"><p>When discussing the HTBFD Fund and small-cap strategies with her client, Chastain, does Anouilh violate the Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q003.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":4,"q":"With regard to discussing Navigator's other funds, Anouilh violates the Standards with respect to:","opts":["only the EMB Fund's strategy.","only the Macro Fund's strategy.","both the EMB Fund's strategy and Macro Fund's strategy."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a004.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a004.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marie Anouilh, CFA, is a fund manager at Navigator Investment Management, managing the firm&#x27;s High Tech, Biotech, and Fintech Disruptors (HTBFD) Fund. She is planning to meet with a potential client later that day and prepares by reviewing one of the firm&#x27;s marketing pamphlets. The pamphlet states:<\/p><p><b>Statement 1:<\/b> Our firm employs only CFA charterholders to manage our funds since they have enhanced their financial skills through a well-rounded education in many asset classes and portfolio management.<\/p><p><b>Statement 2:<\/b> Our funds have outperformed their benchmarks over plains that the EMB Fund tends to be volatile but usually outperforms its benchmark. Since Chastain does not plan to withdraw any money for years, Anouilh does not discuss the EMB Fund&#x27;s strategic use of derivatives, which gives it limited liquidity.<\/p><p>Anouilh explains that the Macro Fund forecasts returns using a complex statistical model, the details of which are available upon request. She adds that the model has been backtested and the firm believes, based on the model, that emerging markets will outperform over the next year.<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to discussing Navigator&#x27;s other funds, Anouilh violates the Standards with respect to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q004.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":5,"q":"Based on Exhibit 1 and the information provided, with quarterly rebalancing, the fund's information ratio is closest to:","opts":["0.36","0.73","1.46"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a005.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a005.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Sylvia Merced is the performance attribution analyst at Sound Financial, a mutual fund firm, where she works with Dan Chang, portfolio manager of the Sound Equity Fund. Chang and Merced are discussing the outlook for the economy and the markets, as well as the implications for the fund.<\/p><p>Chang predicts the economy will weaken, with a deep recession beginning before the end of the year. He tells Merced that the equity markets will price in a recession well ahead of time, as he believes equities are overvalued and susceptible to a decline. Based on his predictions, Chang plans to implement changes to mitigate the negative impact to the fund&#x27;s return.<\/p><p>The Sound Equity Fund consists of 25 equally weighted, large-cap stocks that are rebalanced at the end of each year. After reviewing last year&#x27;s relative performance, Chang hypothesizes that more frequent rebalancing would have improved the fund&#x27;s information ratio, and he asks Merced to examine how quarterly rebalancing would have changed this metric. Merced gathers the information shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex001.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>With respect to the information in Exhibit 1:<\/p><p>Chang revises each stock&#x27;s expected return at rebalancing.<\/p><p>Chang assumes his active returns are uncorrelated over time.<\/p><p>TC and IC remain the same irrespective of rebalancing scheme.<\/p><p>Chang also discusses with Merced what investors, in general, might expect to happen to market valuation measures if there is a recession, as he forecasts. They create a macroeconomic factor model to help them forecast the fund&#x27;s return for the full year. Merced fund&#x27;s prior returns, she derives a macroeconomic model with the following factors:<\/p><p>Unemployment rate (FUNEM)<\/p><p>Consumer spending growth (FCONS)<\/p><p>GDP growth (FGDP)<\/p><p>In the model, Merced uses a sampling of consensus predictions from Wall Street strategists as the baseline values (ie, predicted values) for the chosen factors. Merced notes that the consensus view is more optimistic than her own expectations for the new year. Based on her discussions with Chang, her model predictions (ie, actual values) represent what she believes will happen by the end of the current year. The model&#x27;s estimated intercept is +4.50% and the error term is +0.63%; the predictions and factor sensitivities are shown in Exhibit 2:<\/p><img class=\"pimg\" 63%; the predictions and factor sensitivities are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex002.webp\" style=\"max-width:min(100%,498px)\" alt=\"Exhibit\"><p>To reduce some of the negative impact of an adverse market environment, Chang decides to allocate 25% of the Sound Equity Fund to one equity ETF. Merced screens the ETF universe and arrives at three choices for Chang&#x27;s consideration:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex003.webp\" style=\"max-width:min(100%,671px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, and given Chang&#x27;s economic and market outlook, the most appropriate ETF to mitigate market risk within the Sound Equity Fund is the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q008.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":9,"q":"Which of Sommer's comments is (are) most likely correct?","opts":["Only Comment 1","Only Comment 2","Both Comment 1 and Comment 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a009.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a009.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Alternative Investments<\/summary><div class=\"vig-body\"><p>The Horizon Global Real Estate Fund is a Luxembourg-based institutional fund that invests in publicly listed real estate securities (eg, REITS) across the world, as well as direct real estate properties within the European Union (EU).<\/p><p>Mia Vogel, a lead analyst, is conducting due diligence on De Luxe, an existing mixed-use (eg, housing/shopping) development that the fund plans to purchase for its EU direct real estate allocation. During her due diligence review, she finds one item of concern: improvement allowances that were given to several major tenants for leased space upgrades may have been excessive. Horizon&#x27;s portfolio manager, Florian Sommer, comments on Vogel&#x27;s concern:<\/p><p><b>Comment 1:<\/b> A cash allowance for tenant improvements is not expensed by the landlord but instead capitalized and amortized over the lease term.<\/p><p><b>Comment 2:<\/b> An examination of the most recent unaudited financial statements will help determine whether these incentives are in line with local real estate conditions.<\/p><p>Vogel then shifts to the financing of Horizon&#x27;s purchase of De Luxe. She wants to know the maximum loan Horizon can expect under current market conditions. Vogel estimates De Luxe&#x27;s net operating income (NOI) at €12.6 million. Based on this estimate and a purchase price of €152 million, Norstad Commercial Bank offers the following:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex004.webp\" style=\"max-width:min(100%,601px)\" alt=\"Exhibit\"><p>In addition to the De Luxe assignment, Sommer asks Vogel to calculate the net asset value per share (NAVPS) of a prospective holding, Nexbit Realty Trust, a US data center REIT. Sommer believes Nexbit&#x27;s stock price is trading at a premium to its net asset value.<\/p><p>streams, and after reviewing its financials, she estimates a next-12-month NOI growth rate of 2.50% and a 5.80% capitalization rate (cap rate). Nexbit has 255 million shares outstanding.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex005.webp\" style=\"max-width:min(100%,378px)\" alt=\"Exhibit\"><p>The next day, Vogel meets with her colleague Emil Kaiser to review a draft of a new marketing brochure Kaiser created for Horizon. Vogel asks for clarity on a couple of statements Kaiser included in the brochure concerning the advantages of public and private real estate investing:<\/p><p><b>Statement 1:<\/b> Listed public real estate tracks real estate fundamentals over the long term.<\/p><p><b>Statement 2:<\/b> Private real estate investors have the ability to pursue merchant development, which is restricted for public REITs.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sommer&#x27;s comments is (are) most likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":10,"q":"Based on Exhibit 1 and the information provided, the maximum loan (in € millions) Norstad will extend for the purchase of De Luxe is closest to:","opts":["101","112","114"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Horizon Global Real Estate Fund is a Luxembourg-based institutional fund that invests in publicly listed real estate securities (eg, REITS) across the world, as well as direct real estate properties within the European Union (EU).<\/p><p>Mia Vogel, a lead analyst, is conducting due diligence on De Luxe, an existing mixed-use (eg, housing/shopping) development that the fund plans to purchase for its EU direct real estate allocation. During her due diligence review, she finds one item of concern: improvement allowances that were given to several major tenants for leased space upgrades may have been excessive. Horizon&#x27;s portfolio manager, Florian Sommer, comments on Vogel&#x27;s concern:<\/p><p><b>Comment 1:<\/b> A cash allowance for tenant improvements is not expensed by the landlord but instead capitalized and amortized over the ulate the net asset value per share (NAVPS) of a prospective holding, Nexbit Realty Trust, a US data center REIT. Sommer believes Nexbit&#x27;s stock price is trading at a premium to its net asset value.<\/p><p>streams, and after reviewing its financials, she estimates a next-12-month NOI growth rate of 2.50% and a 5.80% capitalization rate (cap rate). Nexbit has 255 million shares outstanding.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex005.webp\" style=\"max-width:min(100%,378px)\" alt=\"Exhibit\"><p>The next day, Vogel meets with her colleague Emil Kaiser to review a draft of a new marketing brochure Kaiser created for Horizon. Vogel asks for clarity on a couple of statements Kaiser included in the brochure concerning the advantages of public and private real estate investing:<\/p><p><b>Statement 1:<\/b> Listed public real estate tracks real estate fundamentals over the long term.<\/p><p><b>Statement 2:<\/b> Private real estate investors have the ability to pursue merchant development, which is restricted for public REITs.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Kaiser&#x27;s statements is (are) most likely correct:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":13,"q":"Based on Exhibit 1, which statement best describes the bonds' relative effective durations? The effective duration of:","opts":["Bond 1 is less than Bond 3.","Bond 2 is greater than Bond 1.","Bond 2 is about the same as Bond 3."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<\/summary><div class=\"vig-body\"><p>Yiannis Costa is a fixed-income analyst at a buy-side firm. Maria Andino is a summer intern assigned to Costa&#x27;s team. Before giving Andino a project, Costa wants to assess her conceptual knowledge of effective duration. Costa provides Andino with Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex006.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>To gauge her knowledge of effective convexity and various forms of duration, Costa then presents Andino with an interest rate scenario:<\/p><p>A 100 basis points (bps) parallel downward shift of the government par curve<\/p><p>No change in Acme Industries bond&#x27;s credit spread<\/p><p>Interest rate volatility is unchanged<\/p><p>Lastly, Costa tests Andino&#x27;s knowledge of convertible bonds and provides her with Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which statement best describes the bonds&#x27; relative effective durations? The effective duration of:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":14,"q":"Based on Exhibit 1 and as a result Costa's interest rate scenario, which of the following best describes the change in Bond 2's effective convexity? Bond 2's effective convexity is currently:","opts":["positive, and will increase.","negative, and will decrease.","negative, but will increase and become positive."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yiannis Costa is a fixed-income analyst at a buy-side firm. Maria Andino is a summer intern assigned to Costa&#x27;s team. Before giving Andino a project, Costa wants to assess her conceptual knowledge of effective duration. Costa provides Andino with Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex006.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>To gauge her knowledge of effective convexity and various forms of duration, Costa then presents Andino with an interest rate scenario:<\/p><p>A 100 basis points (bps) parallel downward shift of the government par curve<\/p><p>No change in Acme Industries bond&#x27;s credit spread<\/p><p>Interest rate volatility is unchanged<\/p><p>Lastly, Costa tests Andino&#x27;s knowledge of convertible bonds and provides her with Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and as a result Costa&#x27;s interest rate scenario, which of the following best describes the change in Bond 2&#x27;s effective convexity? Bond 2&#x27;s effective convexity is currently:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":15,"q":"Based on Costa's interest rate scenario and Exhibit 1, the most appropriate duration measure to evaluate Bond 2's interest rate sensitivity is:","opts":["key rate duration.","effective duration.","one-sided duration."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yiannis Costa is a fixed-income analyst at a buy-side firm. Maria Andino is a summer intern assigned to Costa&#x27;s team. Before giving Andino a project, Costa wants to assess her conceptual knowledge of effective duration. Costa provides Andino with Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex006.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>To gauge her knowledge of effective convexity and various forms of duration, Costa then presents Andino with an interest rate scenario:<\/p><p>A 100 basis points (bps) parallel downward shift of the government par curve<\/p><p>No change in Acme Industries bond&#x27;s credit spread<\/p><p>Interest rate volatility is unchanged<\/p><p>Lastly, Costa tests Andino&#x27;s knowledge of convertible bonds and provides her with Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Costa&#x27;s interest rate scenario and Exhibit 1, the most appropriate duration measure to evaluate Bond 2&#x27;s interest rate sensitivity is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":16,"q":"Based on Exhibit 2, which of the following best describes the current risk/return characteristic of the General Industries convertible bond?","opts":["Bond-like","Equity-like","Hybrid instrument"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Yiannis Costa is a fixed-income analyst at a buy-side firm. Maria Andino is a summer intern assigned to Costa&#x27;s team. Before giving Andino a project, Costa wants to assess her conceptual knowledge of effective duration. Costa provides Andino with Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex006.webp\" style=\"max-width:min(100%,636px)\" alt=\"Exhibit\"><p>To gauge her knowledge of effective convexity and various forms of duration, Costa then presents Andino with an interest rate scenario:<\/p><p>A 100 basis points (bps) parallel downward shift of the government par curve<\/p><p>No change in Acme Industries bond&#x27;s credit spread<\/p><p>Interest rate volatility is unchanged<\/p><p>Lastly, Costa tests Andino&#x27;s knowledge of convertible bonds and provides her with Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex007.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, which of the following best describes the current risk/return characteristic of the General Industries convertible bond?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":17,"q":"Obermann's autoregressive model of monthly retail data will most likely result in the:","opts":["value of x; being undefined.","estimate of b, being biased.","model forecasting accurately."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Stefanie Jager, a senior analyst covering the retail sector, wants to integrate quantitative forecasts into her analysis. She asks Hans Obermann, a newly hired associate, to run several time series regressions. First, Jager asks Obermann to forecast retail sales for a number of developed countries that have been growing steadily over the past decade. Obermann creates a 1-period autoregressive model on the monthly retail sales data, not adjusted for seasonality, using the equation xt = b0 + b1xt − 1 + εt for each country.<\/p><p>Jager covers several companies that do business in the United States and wants to forecast the USD/EUR exchange rate. Obermann uses an autoregressive model on the weekly historical exchange rate with a 1-period lag to forecast USD/EUR. Reviewing the data, Jager indicates that the model may have a unit root and asks Obermann to test for this. Jager adds that if the model indeed has a unit root and therefore is a random walk and non-covariance stationary, it can still be used for autoregressions, claiming that:<\/p><p><b>Claim 1:<\/b> Converting the time series using first-differencing will create a covariance-stationary time series.<\/p><p><b>Claim 2:<\/b> The newly converted time series will provide meaningful forecasts for currency exchange rates.<\/p><p>Jager then asks Obermann to run a regression on two related time series. After analysis, Obermann finds that both time series have unit roots. Jager asks whether the two time series are cointegrated. Obermann runs an (Engle–Granger) Dickey–Fuller test on the two time series and fails to reject the null hypothesis that the error term has a unit root.<\/p><\/div><\/details><div class=\"qtext\"><p>Obermann&#x27;s autoregressive model of monthly retail data will most likely result in the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":18,"q":"Which of the following is most appropriate to test the model for a unit root?","opts":["t-test with Ho: b1 = 1","Dickey-Fuller test with Ho: (b, - 1) = 0","Durbin--Watson test with Ho: DW statistic = 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stefanie Jager, a senior analyst covering the retail sector, wants to integrate quantitative forecasts into her analysis. She asks Hans Obermann, a newly hired associate, to run several time series regressions. First, Jager asks Obermann to forecast retail sales for a number of developed countries that have been growing steadily over the past decade. Obermann creates a 1-period autoregressive model on the monthly retail sales data, not adjusted for seasonality, using the equation xt = b0 + b1xt − 1 + εt for each country.<\/p><p>Jager covers several companies that do business in the United States and wants to forecast the USD/EUR exchange rate. Obermann uses an autoregressive model on the weekly historical exchange rate with a 1-period lag to forecast USD/EUR. Reviewing the data, Jager indicates that the model may have a unit root and asks Obermann to test for this. Jager adds that if the model indeed has a unit root and therefore is a random walk and non-covariance stationary, it can still be used for autoregressions, claiming that:<\/p><p><b>Claim 1:<\/b> Converting the time series using first-differencing will create a covariance-stationary time series.<\/p><p><b>Claim 2:<\/b> The newly converted time series will provide meaningful forecasts for currency exchange rates.<\/p><p>Jager then asks Obermann to run a regression on two related time series. After analysis, Obermann finds that both time series have unit roots. Jager asks whether the two time series are cointegrated. Obermann runs an (Engle–Granger) Dickey–Fuller test on the two time series and fails to reject the null hypothesis that the error term has a unit root.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is most appropriate to test the model for a unit root?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":19,"q":"Which of Jager's claims about random walks is (are) correct?","opts":["Only Claim 1","Only Claim 2","Both Claim 1 and Claim 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stefanie Jager, a senior analyst covering the retail sector, wants to integrate quantitative forecasts into her analysis. She asks Hans Obermann, a newly hired associate, to run several time series regressions. First, Jager asks Obermann to forecast retail sales for a number of developed countries that have been growing steadily over the past decade. Obermann creates a 1-period autoregressive model on the monthly retail sales data, not adjusted for seasonality, using the equation xt = b0 + b1xt − 1 + εt for each country.<\/p><p>Jager covers several companies that do business in the United States and wants to forecast the USD/EUR exchange rate. Obermann uses an autoregressive model on the weekly historical exchange rate with a 1-period lag to forecast USD/EUR. Reviewing the data, Jager indicates that the model may have a unit root and asks Obermann to test for this. Jager adds that if the model indeed has a unit root and therefore is a random walk and non-covariance stationary, it can still be used for autoregressions, claiming that:<\/p><p><b>Claim 1:<\/b> Converting the time series using first-differencing will create a covariance-stationary time series.<\/p><p><b>Claim 2:<\/b> The newly converted time series will provide meaningful forecasts for currency exchange rates.<\/p><p>Jager then asks Obermann to run a regression on two related time series. After analysis, Obermann finds that both time series have unit roots. Jager asks whether the two time series are cointegrated. Obermann runs an (Engle–Granger) Dickey–Fuller test on the two time series and fails to reject the null hypothesis that the error term has a unit root.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Jager&#x27;s claims about random walks is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":20,"q":"The result of the (Engle-Granger) Dickey-Fuller test most likely indicates that the error term in the regression is:","opts":["covariance stationary, and the two time series are cointegrated.","covariance stationary, and the two time series are not cointegrated.","not covariance stationary, and the two time series are not cointegrated."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stefanie Jager, a senior analyst covering the retail sector, wants to integrate quantitative forecasts into her analysis. She asks Hans Obermann, a newly hired associate, to run several time series regressions. First, Jager asks Obermann to forecast retail sales for a number of developed countries that have been growing steadily over the past decade. Obermann creates a 1-period autoregressive model on the monthly retail sales data, not adjusted for seasonality, using the equation xt = b0 + b1xt − 1 + εt for each country.<\/p><p>Jager covers several companies that do business in the United States and wants to forecast the USD/EUR exchange rate. Obermann uses an autoregressive model on the weekly historical exchange rate with a 1-period lag to forecast USD/EUR. Reviewing the data, Jager indicates that the model may have a unit root and asks Obermann to test for this. Jager adds that if the model indeed has a unit root and therefore is a random walk and non-covariance stationary, it can still be used for autoregressions, claiming that:<\/p><p><b>Claim 1:<\/b> Converting the time series using first-differencing will create a covariance-stationary time series.<\/p><p><b>Claim 2:<\/b> The newly converted time series will provide meaningful forecasts for currency exchange rates.<\/p><p>Jager then asks Obermann to run a regression on two related time series. After analysis, Obermann finds that both time series have unit roots. Jager asks whether the two time series are cointegrated. Obermann runs an (Engle–Granger) Dickey–Fuller test on the two time series and fails to reject the null hypothesis that the error term has a unit root.<\/p><\/div><\/details><div class=\"qtext\"><p>The result of the (Engle-Granger) Dickey-Fuller test most likely indicates that the error term in the regression is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":21,"q":"Based on the information gathered by Walsh and applying the mean reversion principle, Durian's ROE will most likely decrease to the industry average:","opts":["more slowly than its competitor's ROE.","at the same pace as its competitor's ROE.","faster than its competitor's ROE."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Melvin Walsh is a junior equity analyst at a sell-side firm. Rose Kelly, Walsh&#x27;s supervisor, asks him to analyze Durian Shops, a chain of apparel stores that complies with IFRS. She wants to understand whether the company will be able to sustain its profitability going forward. Walsh gathers the following information about Durian:<\/p><p>In the last three years, average ROE was 23%, which is above industry average.<\/p><p>Durian&#x27;s operating cash flow (OCF) accounted for 55% of its net income during the period.<\/p><p>Durian&#x27;s main competitor reported a similar ROE in the same period, but OCF was 75% of net income.<\/p><p>Kelly asks Walsh to analyze Marang Clothing, a traditional apparel manufacturer that reports under US GAAP. Kelly suspects that net income may have been affected by unusual charges in the last three years. She believes it is important to normalize Marang&#x27;s earnings before forecasting the company&#x27;s results. She asks Walsh to analyze how the earnings normalization would affect financial statements and margins. Walsh gathers the following financial information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex008.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Kelly turns her attention to Longan Footwear, another apparel manufacturer that reports under US GAAP. Longan has announced its financial results for 20X6: Although earnings were in line with Kelly&#x27;s expectations, OCF was greater than anticipated. She asks Walsh to look for signs of potential cash flow manipulation that could explain the divergence. Walsh investigates Longan&#x27;s financial statements and makes the following statements: 45 to 60 in 20X6.<\/p><p><b>Statement 2:<\/b> Dividends received were reported in OCF, while dividends paid were reported as financing activities.<\/p><p><b>Statement 3:<\/b> In 20X6, inventory levels decreased 25% over the year, although revenues were relatively stable.<\/p><p>Walsh tells Kelly that, according to Longan&#x27;s notes to the financial statements, the company implemented a change in the depreciation method of some assets in 20X6. Since most of the equipment used in the manufacturing process remained in use longer than expected, management decided to use the straight-line method instead of an accelerated method. This resulted in a prospective change that reduced depreciation expenses in Longan&#x27;s 20X6 financial statements, with no restatement of previous periods. Walsh explains to Kelly that the change in method seems to be a reasonable and appropriate decision. Kelly asks Walsh how this change impacted Longan&#x27;s 20X6 financial ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information gathered by Walsh and applying the mean reversion principle, Durian&#x27;s ROE will most likely decrease to the industry average:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":22,"q":"Based on Exhibit 1 and using normalized earnings, Marang's pretax profit margin in 20X5 is closest to:","opts":["13.5%","15.0%","15.5%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Melvin Walsh is a junior equity analyst at a sell-side firm. Rose Kelly, Walsh&#x27;s supervisor, asks him to analyze Durian Shops, a chain of apparel stores that complies with IFRS. She wants to understand whether the company will be able to sustain its profitability going forward. Walsh gathers the following information about Durian:<\/p><p>In the last three years, average ROE was 23%, which is above industry average.<\/p><p>Durian&#x27;s operating cash flow (OCF) accounted for 55% of its net income during the period.<\/p><p>Durian&#x27;s main competitor reported a similar ROE in the same period, but OCF was 75% of net income.<\/p><p>Kelly asks Walsh to analyze Marang Clothing, a traditional apparel manufacturer that reports under US GAAP. Kelly suspects that net income may have been affected by unusual charges in the last three years. She believes it is important to normalize Marang&#x27;s earnings before forecasting the company&#x27;s results. She asks Walsh to ana nts: 45 to 60 in 20X6.<\/p><p><b>Statement 2:<\/b> Dividends received were reported in OCF, while dividends paid were reported as financing activities.<\/p><p><b>Statement 3:<\/b> In 20X6, inventory levels decreased 25% over the year, although revenues were relatively stable.<\/p><p>Walsh tells Kelly that, according to Longan&#x27;s notes to the financial statements, the company implemented a change in the depreciation method of some assets in 20X6. Since most of the equipment used in the manufacturing process remained in use longer than expected, management decided to use the straight-line method instead of an accelerated method. This resulted in a prospective change that reduced depreciation expenses in Longan&#x27;s 20X6 financial statements, with no restatement of previous periods. Walsh explains to Kelly that the change in method seems to be a reasonable and appropriate decision. Kelly asks Walsh how this change impacted Longan&#x27;s 20X6 financial ratios.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, the change in depreciation method will most likely increase Longan&#x27;s:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":25,"q":"Which of Parsons's statements is correct?","opts":["Only Statement 1","Only Statement 2","Only Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Pacotter Investments is a US-based asset manager. It currently sponsors a number of ETFs that mimic domestic and international equity indexes. One of the funds, the Enhanced Opportunities ETF, is a leveraged fund that offers 1.5 times the exposure to the FTSE 100 Index. The fund is actively managed and uses exchange-traded futures to magnify its exposure to the underlying index. A Pacotter representative, Bryan Parsons, makes the following statements to prospective investors concerning potential risks of investing in the Enhanced Opportunities ETF:<\/p><p><b>Statement 1:<\/b> Since the fund uses exchange-traded futures, investors can be exposed to counterparty risk.<\/p><p><b>Statement 2:<\/b> If the FTSE 100 Index has a 10% gain over the next year, it is unlikely that the fund&#x27;s return (before fees) will equal 15%.<\/p><p><b>Statement 3:<\/b> The fund lends its securities, which means that investors are exposed to the risk that the fund will experience a &quot;soft&quot; closure.<\/p><p>Before launching the Enhanced Opportunities fund, Pacotter performed various backtests to determine how the fund would have performed in different economic conditions. These test periods ranged from 10 to 30 years. All of the studies included only point-in-time data. Pacotter retested the data many times, changing the assumptions about the variables in each test to obtain an optimal outcome. All backtests were conducted using in-sample data.<\/p><p>Pacotter also offers funds that implement different investment strategies and is considering a new fund that will invest only in emerging market equities. Pacotter is evaluating whether it will utilize a long-only or long-short strategy. Parsons has backtested both strategies using economic data over the past 15 years. This time horizon includes periods of both high and low volatility as well as high and low growth. The Treynor ratios for each strategy are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex009.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Pacotter also conducted Monte Carlo simulations on each strategy. The distributions from the simulations are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex010.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Parsons draws the following conclusions from Exhibit 2:<\/p><p><b>Conclusion 1:<\/b> Strategy 2 will lose at most 5%.<\/p><p><b>Conclusion 2:<\/b> When Strategy 1&#x27;s losses are more than 4%, the average expected loss is 9%.<\/p><p><b>Conclusion 3:<\/b> Over a specified time period, Strategy 1 will have more losses than Strategy 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Parsons&#x27;s statements is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":26,"q":"Which of the following biases most likely exists in Pacotter's backtesting of the Enhanced Opportunities ETF?","opts":["Only survivorship bias","Only data-snooping bias","Both survivorship and data-snooping biases"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pacotter Investments is a US-based asset manager. It currently sponsors a number of ETFs that mimic domestic and international equity indexes. One of the funds, the Enhanced Opportunities ETF, is a leveraged fund that offers 1.5 times the exposure to the FTSE 100 Index. The fund is actively managed and uses exchange-traded futures to magnify its exposure to the underlying index. A Pacotter representative, Bryan Parsons, makes the following statements to prospective investors concerning potential risks of investing in the Enhanced Opportunities ETF:<\/p><p><b>Statement 1:<\/b> Since the fund uses exchange-traded futures, investors can be exposed to counterparty risk.<\/p><p><b>Statement 2:<\/b> If the FTSE 100 Index has a 10% gain over the next year, it is unlikely that the fund&#x27;s return (before fees) will equal 15%.<\/p><p><b>Statement 3:<\/b> The fund lends its securities, which means that investors are exposed to the risk that the fund will experience a &quot;soft&quot; closure.<\/p><p>Before launching the Enhanced Opportunities fund, Pacotter performed various backtests to determine how the fund would have performed in different economic conditions. These test periods ranged from 10 to 30 years. All of the studies included only point-in-time data. Pacotter retested the data many times, changing the assumptions about the variables in each test to obtain an optimal outcome. All backtests were conducted using in-sample data.<\/p><p>Pacotter also offers funds that implement different investment strategies and is considering a new fund that will invest only in emerging market equities. Pacotter is evaluating whether it will utilize a long-only or long-short strategy. Parsons has backtested both strategies using economic data over the past 15 years. This time horizon includes periods of both high and low volatility as well as high and low growth. The Treynor ratios for each strategy are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex009.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Pacotter also conducted Monte Carlo simulations on each strategy. The distributions from the simulations are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex010.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Parsons draws the following conclusions from Exhibit 2:<\/p><p><b>Conclusion 1:<\/b> Strategy 2 will lose at most 5%.<\/p><p><b>Conclusion 2:<\/b> When Strategy 1&#x27;s losses are more than 4%, the average expected loss is 9%.<\/p><p><b>Conclusion 3:<\/b> Over a specified time period, Strategy 1 will have more losses than Strategy 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following biases most likely exists in Pacotter&#x27;s backtesting of the Enhanced Opportunities ETF?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q026.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":27,"q":"Based only on Exhibit 1, which of the following is Parsons's most appropriate conclusion?","opts":["Strategy 1 outperforms Strategy 2 in a high-volatility, low-growth regime.","Strategy 2 outperforms Strategy 1 in a low-volatility, low-growth regime.","Strategy 2 outperforms Strategy 1 in a high-volatility, high-growth regime."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a027.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a027.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pacotter Investments is a US-based asset manager. It currently sponsors a number of ETFs that mimic domestic and international equity indexes. One of the funds, the Enhanced Opportunities ETF, is a leveraged fund that offers 1.5 times the exposure to the FTSE 100 Index. The fund is actively managed and uses exchange-traded futures to magnify its exposure to the underlying index. A Pacotter representative, Bryan Parsons, makes the following statements to prospective investors concerning potential risks of investing in the Enhanced Opportunities ETF:<\/p><p><b>Statement 1:<\/b> Since the fund uses exchange-traded futures, investors can be exposed to counterparty risk.<\/p><p><b>Statement 2:<\/b> If the FTSE 100 Index has a 10% gain over the next year, it is unlikely that the fund&#x27;s return (before fees) will equal 15%.<\/p><p><b>Statement 3:<\/b> The fund lends its securities, which means that investors are exposed to the risk that the fund will experience a &quot;soft&quot; closure.<\/p><p>Before launching the Enhanced Opportunities fund, Pacotter performed various backtests to determine how the fund would have performed in different economic conditions. These test periods ranged from 10 to 30 years. All of the studies included only point-in-time data. Pacotter retested the data many times, changing the assumptions about the variables in each test to obtain an optimal outcome. All backtests were conducted using in-sample data.<\/p><p>Pacotter also offers funds that implement different investment strategies and is considering a new fund that will invest only in emerging market equities. Pacotter is evaluating whether it will utilize a long-only or long-short strategy. Parsons has backtested both strategies using economic data over the past 15 years. This time horizon includes periods of both high and low volatility as well as high and low growth. The Treynor ratios for each strategy are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex009.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Pacotter also conducted Monte Carlo simulations on each strategy. The distributions from the simulations are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex010.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Parsons draws the following conclusions from Exhibit 2:<\/p><p><b>Conclusion 1:<\/b> Strategy 2 will lose at most 5%.<\/p><p><b>Conclusion 2:<\/b> When Strategy 1&#x27;s losses are more than 4%, the average expected loss is 9%.<\/p><p><b>Conclusion 3:<\/b> Over a specified time period, Strategy 1 will have more losses than Strategy 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Based only on Exhibit 1, which of the following is Parsons&#x27;s most appropriate conclusion?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q027.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":28,"q":"Based only on the information provided in Exhibit 2, which of Parsons's conclusions is appropriate?","opts":["Conclusion 1","Conclusion 2","Conclusion 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a028.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a028.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pacotter Investments is a US-based asset manager. It currently sponsors a number of ETFs that mimic domestic and international equity indexes. One of the funds, the Enhanced Opportunities ETF, is a leveraged fund that offers 1.5 times the exposure to the FTSE 100 Index. The fund is actively managed and uses exchange-traded futures to magnify its exposure to the underlying index. A Pacotter representative, Bryan Parsons, makes the following statements to prospective investors concerning potential risks of investing in the Enhanced Opportunities ETF:<\/p><p><b>Statement 1:<\/b> Since the fund uses exchange-traded futures, investors can be exposed to counterparty risk.<\/p><p><b>Statement 2:<\/b> If the FTSE 100 Index has a 10% gain over the next year, it is unlikely that the fund&#x27;s return (before fees) will equal 15%.<\/p><p><b>Statement 3:<\/b> The fund lends its securities, which means that investors are exposed to the risk that the fund will experience a &quot;soft&quot; closure.<\/p><p>Before launching the Enhanced Opportunities fund, Pacotter performed various backtests to determine how the fund would have performed in different economic conditions. These test periods ranged from 10 to 30 years. All of the studies included only point-in-time data. Pacotter retested the data many times, changing the assumptions about the variables in each test to obtain an optimal outcome. All backtests were conducted using in-sample data.<\/p><p>Pacotter also offers funds that implement different investment strategies and is considering a new fund that will invest only in emerging market equities. Pacotter is evaluating whether it will utilize a long-only or long-short strategy. Parsons has backtested both strategies using economic data over the past 15 years. This time horizon includes periods of both high and low volatility as well as high and low growth. The Treynor ratios for each strategy are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex009.webp\" style=\"max-width:min(100%,372px)\" alt=\"Exhibit\"><p>Pacotter also conducted Monte Carlo simulations on each strategy. The distributions from the simulations are shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex010.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Parsons draws the following conclusions from Exhibit 2:<\/p><p><b>Conclusion 1:<\/b> Strategy 2 will lose at most 5%.<\/p><p><b>Conclusion 2:<\/b> When Strategy 1&#x27;s losses are more than 4%, the average expected loss is 9%.<\/p><p><b>Conclusion 3:<\/b> Over a specified time period, Strategy 1 will have more losses than Strategy 2.<\/p><\/div><\/details><div class=\"qtext\"><p>Based only on the information provided in Exhibit 2, which of Parsons&#x27;s conclusions is appropriate?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n" orig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"corporate"},{"n":33,"q":"Based on Exhibits 1 and 2 and the information provided, the credit spread for Bond A is closest to:","opts":["1.50%","1.52%","1.55%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm2-ss2/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Fixed Income<\/summary><div class=\"vig-body\"><p>Petra Goldsmith is a fixed-income portfolio manager for a large bank. Harrison Jenkins, a credit analyst who is working with Goldsmith, is evaluating the investment prospects for a group of corporate bonds. He gathers selected data on the group, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex012.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Goldsmith asks Jenkins to calculate the credit spread for Bond A, assuming that the bond is currently trading at fair value. Exhibit 2 contains selected data for the government par bonds Jenkins is using in the analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex013.webp\" style=\"max-width:min(100%,469px)\" alt=\"Exhibit\"><p>Goldsmith and Jenkins then discuss the investment outlook for Bond B. Goldsmith believes there will be a change in Bond B&#x27;s credit rating and asks Jenkins to estimate the one-year expected return on Bond B, should a credit rating change occur. The bond&#x27;s current YTM is 4.85%. Exhibit 3 contains the credit transition matrix Jenkins will use for evaluating Bond B:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex014.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Goldsmith and Jenkins next decide to evaluate the credit default swap (CDS) market. Goldsmith believes that a slight strengthening of economic growth will result in a relative improvement in credit quality in the high-yield sector, where credit spreads are a bit wider than their historic relative to investment-grade sector spreads, which are currently trading (above Treasuries) well below their historic average. However, Goldsmith and Jenkins agree that the intermediate- to long-term outlook for corporate spreads to Treasuries is uncertain. Goldsmith decides to execute a long-short CDS index trade to profit from the expected relative improvement in the high-yield sector.<\/p><p>Jenkins tells Goldsmith there is a discrepancy in the pricing of credit risk for Bond C in the fixed-income market and CDS market. Exhibit 4 contains selected data on Bond C and single-name CDS on the bond&#x27;s issuer.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm2-ss2/ex015.webp\" style=\"max-width:min(100%,362px)\" alt=\"Exhibit\"><p>Jenkins makes the following statements regarding the structure of a basis trade to profit from differences in the pricing of Bond C&#x27;s credit risk in the two markets:<\/p><p><b>Statement 1:<\/b> Profiting from the relative mispricing of credit requires buying Bond C and buying a single-name CDS on Bond C&#x27;s issuer.<\/p><p><b>Statement 2:<\/b> Since Bond C is the cheapest-to-deliver bond on the CDS, the bond and CDS are duration matched, which means the position is hedged against a general rise or fall in interest rates not related to credit spread changes.<\/p><p>Assume all bonds and CDS pay annual coupons and all interest rates are expressed on an annual compound basis.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2 and the information provided, the credit spread for Bond A is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm2-ss2/q033.webp\" alt=\"Câu hỏi
