to entry in its industry are low.<\/p><p>After listening to Nangombe, Amutenya concludes that Swakop&#x27;s current level of returns may not be sustainable and decides to reduce long-term growth rate forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Based only on Exhibit 2, Swakop&#x27;s estimated sustainable growth rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":12,"q":"Which of the following conclusions most likely justifies a reduction in Swakop's forecasted long- term growth rates?","opts":["Observation 1","Observation 2","Observation 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ciara Amutenya is the head of research at Brandberg Asset Management. She is currently reviewing the valuation and growth outlook of two stocks in the firm&#x27;s portfolio: Kunene Semiconductors and Swakop Oil. She directs Linus Nangombe, a junior analyst at Brandberg, to analyze both companies.<\/p><p>Amutenya asks Nangombe to calculate Kunene&#x27;s justified trailing P/E based on the Gordon growth model and to determine whether the stock is currently overvalued, fairly valued, or undervalued. Nangombe gathers information from Kunene, summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex002.webp\" style=\"max-width:min(100%,421px)\" alt=\"Exhibit\"><p>Nangombe explains that the expected dividend growth rate reflects Kunene&#x27;s performance in the previous five years. Amutenya knows that Kunene&#x27;s competitors are making substantial investments in innovative technologies and expects these technologies to be market-ready in the medium term. Therefore, she believes that Kunene will not be able to maintain a dividend growth rate of 8.0% over time. She asks Nangombe to estimate the value of Kunene&#x27;s stock using the H-model and assuming that the dividend growth rate:<\/p><p>is initially 8.0%,<\/p><p>declines linearly during a 10-year period, and<\/p><p>stabilizes at a perpetual growth rate of 5.0%.<\/p><p>Amutenya then turns her attention to Swakop Oil, one of the major operators of retail gas stations in the region. She asks Nangombe to estimate the company&#x27;s sustainable growth rate. Nangombe decides to use DuPont analysis and summarizes the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex003.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Amutenya is concerned about Swakop&#x27;s ability to maintain its current level of returns. Nangombe explains that he conducted an industry and competitive analysis for Swakop and the oil distribution industry. He lists the following observations:<\/p><p>Observation 1:Swakop changed its gasoline suppliers several times due to intense competition among the suppliers to offer the best prices and terms.<\/p><p>Observation 2:Swakop is the lowest-cost producer; its products are similar to competitors&#x27; and are priced slightly below average market price.<\/p><p>Observation 3:Swakop has achieved above-average returns in the previous five years, and the barriers to entry in its industry are low.<\/p><p>After listening to Nangombe, Amutenya concludes that Swakop&#x27;s current level of returns may not be sustainable and decides to reduce long-term growth rate forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following conclusions most likely justifies a reduction in Swakop&#x27;s forecasted long- term growth rates?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":13,"q":"Regarding the gold futures contract, which return component was the greatest contributor to total return?","opts":["Roll return","Price return","Collateral return"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Antti Laine is a portfolio manager for a large pension fund and is responsible for the day-to-day management of the fund&#x27;s alternative investments. The fund has exposure to commodities through numerous futures positions.<\/p><p>Six months ago, the fund took a fully collateralized position in a gold futures contract at $1,750/ounce. Since then, the collateral has earned a 1.50% annualized rate. Because the contract was nearing expiration, Laine rolled the entire position into the current 6-month gold futures contract. At the time of the roll, the near-term contract was $1,770/ounce and the farther-term contract was $1,785/ounce.<\/p><p>Laine turns his attention to Alpha Fund, a private equity fund with a 20X0 vintage. Alpha Fund has a 2% management fee on paid-in capital and carried interest of 20% when NAV after distributions is greater than the committed capital of $200 million. Laine notes that all the capital calls occur at the beginning of the year, while all other cash flows and fees occur at year-end. Information on Alpha Fund is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex004.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Laine is comparing Alpha Fund&#x27;s performance to other funds of the same vintage, including Beta Fund, which has a net IRR of 6.80%, and Gamma Fund, which has a net IRR of 11.80%.<\/p><p>Laine intends to increase the pension fund&#x27;s exposure to real estate. He is considering both REITs and direct real estate investment. When evaluating Tower Block, an apartment REIT, Laine identifies raw land on the company&#x27;s remains undeveloped; given the market&#x27;s growth, the land value has appreciated significantly since it was purchased.<\/p><p>Laine then reviews a direct investment in a real estate property, Casa Grande Apartments. Laine intends to hold the investment for 3 years and wants to compare the property&#x27;s estimated value using the direct capitalization method versus the discounted cash flow (DCF) method. Laine collects information on the property, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex005.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit\"><p>Laine expects Casa Grande&#x27;s net operating income to grow at a constant 2% rate into perpetuity.<\/p><\/div><\/details><div class=\"qtext\"><p>Regarding the gold futures contract, which return component was the greatest contributor to total return?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":14,"q":"Based on Exhibit 1 and the fee information provided, on a net IRR basis, Alpha Fund outperformed:","opts":["Beta Fund but not Gamma Fund.","both Beta Fund and Gamma Fund.","neither Beta Fund nor Gamma Fund."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antti Laine is a portfolio manager for a large pension fund and is responsible for the day-to-day management of the fund&#x27;s alternative investments. The fund has exposure to commodities through numerous futures positions.<\/p><p>Six months ago, the fund took a fully collateralized position in a gold futures contract at $1,750/ounce. Since then, the collateral has earned a 1.50% annualized rate. Because the contract was nearing expiration, Laine rolled the entire position into the current 6-month gold futures contract. At the time of the roll, the near-term contract was $1,770/ounce and the farther-term contract was $1,785/ounce.<\/p><p>Laine turns his attention to Alpha Fund, a private equity fund with a 20X0 vintage. Alpha Fund has a 2% management fee on paid-in capital and carried interest of 20% when NAV after distributions is greater than the committed capital of $200 million. Laine notes that all the capital calls occur at the beginning of the year, while all other cash flows and fees occur at year-end. Information on Alpha Fund is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex004.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Laine is comparing Alpha Fund&#x27;s performance to other funds of the same vintage, including Beta Fund, which has a net IRR of 6.80%, and Gamma Fund, which has a net IRR of 11.80%.<\/p><p>Laine intends to increase the pension fund&#x27;s exposure to real estate. He is considering both REITs and direct real estate investment. When evaluating Tower Block, an apartment REIT, Laine identifies raw land on the company&#x27;s remains undeveloped; given the market&#x27;s growth, the land value has appreciated significantly since it was purchased.<\/p><p>Laine then reviews a direct investment in a real estate property, Casa Grande Apartments. Laine intends to hold the investment for 3 years and wants to compare the property&#x27;s estimated value using the direct capitalization method versus the discounted cash flow (DCF) method. Laine collects information on the property, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex005.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit\"><p>Laine expects Casa Grande&#x27;s net operating income to grow at a constant 2% rate into perpetuity.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the fee information provided, on a net IRR basis, Alpha Fund outperformed:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q014.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":15,"q":"When valuing Tower Block, given its land held for future development, it is least appropriate that Laine:","opts":["increase its price-to-FFO ratio when comparing it to peers without land.","increase its net asset value to account for the higher land market values.","add the land value to the terminal value when discounting the cash flows."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a015.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a015.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antti Laine is a portfolio manager for a large pension fund and is responsible for the day-to-day management of the fund&#x27;s alternative investments. The fund has exposure to commodities through numerous futures positions.<\/p><p>Six months ago, the fund took a fully collateralized position in a gold futures contract at $1,750/ounce. Since then, the collateral has earned a 1.50% annualized rate. Because the contract was nearing expiration, Laine rolled the entire position into the current 6-month gold futures contract. At the time of the roll, the near-term contract was $1,770/ounce and the farther-term contract was $1,785/ounce.<\/p><p>Laine turns his attention to Alpha Fund, a private equity fund with a 20X0 vintage. Alpha Fund has a 2% management fee on paid-in capital and carried interest of 20% when NAV after distributions is greater than the committed capital of $200 million. Laine notes that all the capital calls occur at the beginning of the year, while all other cash flows and fees occur at year-end. Information on Alpha Fund is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex004.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Laine is comparing Alpha Fund&#x27;s performance to other funds of the same vintage, including Beta Fund, which has a net IRR of 6.80%, and Gamma Fund, which has a net IRR of 11.80%.<\/p><p>Laine intends to increase the pension fund&#x27;s exposure to real estate. He is considering both REITs and direct real estate investment. When evaluating Tower Block, an apartment REIT, Laine identifies raw land on the company&#x27;s remains undeveloped; given the market&#x27;s growth, the land value has appreciated significantly since it was purchased.<\/p><p>Laine then reviews a direct investment in a real estate property, Casa Grande Apartments. Laine intends to hold the investment for 3 years and wants to compare the property&#x27;s estimated value using the direct capitalization method versus the discounted cash flow (DCF) method. Laine collects information on the property, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex005.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit\"><p>Laine expects Casa Grande&#x27;s net operating income to grow at a constant 2% rate into perpetuity.<\/p><\/div><\/details><div class=\"qtext\"><p>When valuing Tower Block, given its land held for future development, it is least appropriate that Laine:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q015.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":16,"q":"Based on Exhibit 2, the direct capitalization method for Casa Grande results in a valuation (in €) that is approximately:","opts":["380,000 less than the DCF method.","1,900,000 greater than the DCF method.","7,000,000 greater than the DCF method."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a016.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a016.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Antti Laine is a portfolio manager for a large pension fund and is responsible for the day-to-day management of the fund&#x27;s alternative investments. The fund has exposure to commodities through numerous futures positions.<\/p><p>Six months ago, the fund took a fully collateralized position in a gold futures contract at $1,750/ounce. Since then, the collateral has earned a 1.50% annualized rate. Because the contract was nearing expiration, Laine rolled the entire position into the current 6-month gold futures contract. At the time of the roll, the near-term contract was $1,770/ounce and the farther-term contract was $1,785/ounce.<\/p><p>Laine turns his attention to Alpha Fund, a private equity fund with a 20X0 vintage. Alpha Fund has a 2% management fee on paid-in capital and carried interest of 20% when NAV after distributions is greater than the committed capital of $200 million. Laine notes that all the capital calls occur at the beginning of the year, while all other cash flows and fees occur at year-end. Information on Alpha Fund is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex004.webp\" style=\"max-width:min(100%,600px)\" alt=\"Exhibit\"><p>Laine is comparing Alpha Fund&#x27;s performance to other funds of the same vintage, including Beta Fund, which has a net IRR of 6.80%, and Gamma Fund, which has a net IRR of 11.80%.<\/p><p>Laine intends to increase the pension fund&#x27;s exposure to real estate. He is considering both REITs and direct real estate investment. When evaluating Tower Block, an apartment REIT, Laine identifies raw land on the company&#x27;s remains undeveloped; given the market&#x27;s growth, the land value has appreciated significantly since it was purchased.<\/p><p>Laine then reviews a direct investment in a real estate property, Casa Grande Apartments. Laine intends to hold the investment for 3 years and wants to compare the property&#x27;s estimated value using the direct capitalization method versus the discounted cash flow (DCF) method. Laine collects information on the property, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex005.webp\" style=\"max-width:min(100%,349px)\" alt=\"Exhibit\"><p>Laine expects Casa Grande&#x27;s net operating income to grow at a constant 2% rate into perpetuity.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the direct capitalization method for Casa Grande results in a valuation (in €) that is approximately:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q016.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"alternatives"},{"n":17,"q":"Based on Exhibit 1, which of Lopez's comments) is(are) correct?","opts":["Comment 1 only","Comment 2 only","Both Comment 1 and Comment 2"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a017.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a017.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Robert Lopez is a newly hired risk analyst at MultiStrat Capital, a multi-strategy hedge fund. Paola Reyes is a senior risk analyst at MultiStrat and Lopez&#x27;s supervisor. Reyes explains to Lopez that the firm has two hedge fund strategies, both consisting of numerous independent sub-portfolios. Each sub-portfolio has a different investment strategy, portfolio manager, and risk budget. Due to the varied nature of the investment strategies, the correlations among strategies are relatively low.<\/p><p>Reyes explains that the firm&#x27;s risk management and risk budgeting process is based on parametric value at risk (VaR) at the fund level and marginal value at risk (MVaR) at the sub-portfolio level. Reyes states that the VaR for the Alpha Fund is $100 million and provides Lopez with information on the sub-portfolios, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex006.webp\" style=\"max-width:min(100%,375px)\" alt=\"Exhibit\"><p>Lopez makes the following comments:<\/p><p><b>Comment 1:<\/b> Since the portfolios are not highly correlated, the firm is underutilizing the fund&#x27;s full risk appetite.<\/p><p><b>Comment 2:<\/b> MVaR is useful as a pre-trade evaluation tool on the potential impact of a trade on total VaR.<\/p><p>Reyes explains that as part of the firm&#x27;s risk management process, the risk team conducts scenario risk analysis for the fund and on a sub-portfolio basis each month. The team begins the analysis by identifying each portfolio&#x27;s five most significant exposures and then assesses the potential for unforeseen vulnerabilities. The analysis stresses correlations and co-movement of assets.<\/p><p>Reyes then provides Lopez with VaR input assumptions for the Sigma Fund and asks that he calculate VaR using the parametric approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex007.webp\" style=\"max-width:min(100%,382px)\" alt=\"Exhibit\"><p>MultiStrat&#x27;s business model calls for it to identify new investment talent that complements existing strategies and then provide capital, along with integrated technology solutions, back office, and risk management services, to implement those strategies.<\/p><p>The risk group at MultiStrat is one of the first to evaluate new investment strategies presented by outside managers. Most new strategies are quantitative factor strategies that have been backtested but without real-world implementation.<\/p><p>A recent manager submission included the following information and attributes:<\/p><p>Historical investment simulation<\/p><p>Investment universe defined as benchmark securities<\/p><p>5, 10, and 15 years of historical data analyzed<\/p><p>Rolling windows approach analysis<\/p><p>Point-in-time data<\/p><p>Up to 10 factor portfolios<\/p><p>After backtesting dozens of strategies based on this information, the outside manager presented MultiStrat with a strategy for consideration. Based on 5 years of historical data, a monthly rebalance, and 7 equally weighted factors, the strategy produced a Sharpe ratio of 2.5 with realized volatility of 3%. This strategy also had the highest t-statistic of 2.7 and lowest p-value of 1.4% of any strategy tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which of Lopez&#x27;s comments) is(are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q017.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":18,"q":"Reyes' description of the firm's scenario risk analysis process best describes a:","opts":["multi-factor stress test using a historical scenario.","multi-factor reverse stress test using a hypothetical scenario.","single-factor reverse stress test using a hypothetical scenario."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a018.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a018.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Lopez is a newly hired risk analyst at MultiStrat Capital, a multi-strategy hedge fund. Paola Reyes is a senior risk analyst at MultiStrat and Lopez&#x27;s supervisor. Reyes explains to Lopez that the firm has two hedge fund strategies, both consisting of numerous independent sub-portfolios. Each sub-portfolio has a different investment strategy, portfolio manager, and risk budget. Due to the varied nature of the investment strategies, the correlations among strategies are relatively low.<\/p><p>Reyes explains that the firm&#x27;s risk management and risk budgeting process is based on parametric value at risk (VaR) at the fund level and marginal value at risk (MVaR) at the sub-portfolio level. Reyes states that the VaR for the Alpha Fund is $100 million and provides Lopez with information on the sub-portfolios, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex006.webp\" style=\"max-width:min(100%,375px)\" alt=\"Exhibit\"><p>Lopez makes the following comments:<\/p><p><b>Comment 1:<\/b> Since the portfolios are not highly correlated, the firm is underutilizing the fund&#x27;s full risk appetite.<\/p><p><b>Comment 2:<\/b> MVaR is useful as a pre-trade evaluation tool on the potential impact of a trade on total VaR.<\/p><p>Reyes explains that as part of the firm&#x27;s risk management process, the risk team conducts scenario risk analysis for the fund and on a sub-portfolio basis each month. The team begins the analysis by identifying each portfolio&#x27;s five most significant exposures and then assesses the potential for unforeseen vulnerabilities. The analysis stresses correlations and co-movement of assets.<\/p><p>Reyes then provides Lopez with VaR input assumptions for the Sigma Fund and asks that he calculate VaR using the parametric approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex007.webp\" style=\"max-width:min(100%,382px)\" alt=\"Exhibit\"><p>MultiStrat&#x27;s business model calls for it to identify new investment talent that complements existing strategies and then provide capital, along with integrated technology solutions, back office, and risk management services, to implement those strategies.<\/p><p>The risk group at MultiStrat is one of the first to evaluate new investment strategies presented by outside managers. Most new strategies are quantitative factor strategies that have been backtested but without real-world implementation.<\/p><p>A recent manager submission included the following information and attributes:<\/p><p>Historical investment simulation<\/p><p>Investment universe defined as benchmark securities<\/p><p>5, 10, and 15 years of historical data analyzed<\/p><p>Rolling windows approach analysis<\/p><p>Point-in-time data<\/p><p>Up to 10 factor portfolios<\/p><p>After backtesting dozens of strategies based on this information, the outside manager presented MultiStrat with a strategy for consideration. Based on 5 years of historical data, a monthly rebalance, and 7 equally weighted factors, the strategy produced a Sharpe ratio of 2.5 with realized volatility of 3%. This strategy also had the highest t-statistic of 2.7 and lowest p-value of 1.4% of any strategy tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Reyes&#x27; description of the firm&#x27;s scenario risk analysis process best describes a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q018.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":19,"q":"Using Exhibit 2, the portfolio's annual 1% parametric VaR ($ millions) is closest to:","opts":["27.8","94.6","164.5"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a019.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a019.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Lopez is a newly hired risk analyst at MultiStrat Capital, a multi-strategy hedge fund. Paola Reyes is a senior risk analyst at MultiStrat and Lopez&#x27;s supervisor. Reyes explains to Lopez that the firm has two hedge fund strategies, both consisting of numerous independent sub-portfolios. Each sub-portfolio has a different investment strategy, portfolio manager, and risk budget. Due to the varied nature of the investment strategies, the correlations among strategies are relatively low.<\/p><p>Reyes explains that the firm&#x27;s risk management and risk budgeting process is based on parametric value at risk (VaR) at the fund level and marginal value at risk (MVaR) at the sub-portfolio level. Reyes states that the VaR for the Alpha Fund is $100 million and provides Lopez with information on the sub-portfolios, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex006.webp\" style=\"max-width:min(100%,375px)\" alt=\"Exhibit\"><p>Lopez makes the following comments:<\/p><p><b>Comment 1:<\/b> Since the portfolios are not highly correlated, the firm is underutilizing the fund&#x27;s full risk appetite.<\/p><p><b>Comment 2:<\/b> MVaR is useful as a pre-trade evaluation tool on the potential impact of a trade on total VaR.<\/p><p>Reyes explains that as part of the firm&#x27;s risk management process, the risk team conducts scenario risk analysis for the fund and on a sub-portfolio basis each month. The team begins the analysis by identifying each portfolio&#x27;s five most significant exposures and then assesses the potential for unforeseen vulnerabilities. The analysis stresses correlations and co-movement of assets.<\/p><p>Reyes then provides Lopez with VaR input assumptions for the Sigma Fund and asks that he calculate VaR using the parametric approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex007.webp\" style=\"max-width:min(100%,382px)\" alt=\"Exhibit\"><p>MultiStrat&#x27;s business model calls for it to identify new investment talent that complements existing strategies and then provide capital, along with integrated technology solutions, back office, and risk management services, to implement those strategies.<\/p><p>The risk group at MultiStrat is one of the first to evaluate new investment strategies presented by outside managers. Most new strategies are quantitative factor strategies that have been backtested but without real-world implementation.<\/p><p>A recent manager submission included the following information and attributes:<\/p><p>Historical investment simulation<\/p><p>Investment universe defined as benchmark securities<\/p><p>5, 10, and 15 years of historical data analyzed<\/p><p>Rolling windows approach analysis<\/p><p>Point-in-time data<\/p><p>Up to 10 factor portfolios<\/p><p>After backtesting dozens of strategies based on this information, the outside manager presented MultiStrat with a strategy for consideration. Based on 5 years of historical data, a monthly rebalance, and 7 equally weighted factors, the strategy produced a Sharpe ratio of 2.5 with realized volatility of 3%. This strategy also had the highest t-statistic of 2.7 and lowest p-value of 1.4% of any strategy tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 2, the portfolio&#x27;s annual 1% parametric VaR ($ millions) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":20,"q":"Which of the following types of selection bias is most likely embedded in the proposed strategy that the risk team is evaluating?","opts":["Data snooping","Cross-validation","Survivorship bias"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Robert Lopez is a newly hired risk analyst at MultiStrat Capital, a multi-strategy hedge fund. Paola Reyes is a senior risk analyst at MultiStrat and Lopez&#x27;s supervisor. Reyes explains to Lopez that the firm has two hedge fund strategies, both consisting of numerous independent sub-portfolios. Each sub-portfolio has a different investment strategy, portfolio manager, and risk budget. Due to the varied nature of the investment strategies, the correlations among strategies are relatively low.<\/p><p>Reyes explains that the firm&#x27;s risk management and risk budgeting process is based on parametric value at risk (VaR) at the fund level and marginal value at risk (MVaR) at the sub-portfolio level. Reyes states that the VaR for the Alpha Fund is $100 million and provides Lopez with information on the sub-portfolios, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex006.webp\" style=\"max-width:min(100%,375px)\" alt=\"Exhibit\"><p>Lopez makes the following comments:<\/p><p><b>Comment 1:<\/b> Since the portfolios are not highly correlated, the firm is underutilizing the fund&#x27;s full risk appetite.<\/p><p><b>Comment 2:<\/b> MVaR is useful as a pre-trade evaluation tool on the potential impact of a trade on total VaR.<\/p><p>Reyes explains that as part of the firm&#x27;s risk management process, the risk team conducts scenario risk analysis for the fund and on a sub-portfolio basis each month. The team begins the analysis by identifying each portfolio&#x27;s five most significant exposures and then assesses the potential for unforeseen vulnerabilities. The analysis stresses correlations and co-movement of assets.<\/p><p>Reyes then provides Lopez with VaR input assumptions for the Sigma Fund and asks that he calculate VaR using the parametric approach.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex007.webp\" style=\"max-width:min(100%,382px)\" alt=\"Exhibit\"><p>MultiStrat&#x27;s business model calls for it to identify new investment talent that complements existing strategies and then provide capital, along with integrated technology solutions, back office, and risk management services, to implement those strategies.<\/p><p>The risk group at MultiStrat is one of the first to evaluate new investment strategies presented by outside managers. Most new strategies are quantitative factor strategies that have been backtested but without real-world implementation.<\/p><p>A recent manager submission included the following information and attributes:<\/p><p>Historical investment simulation<\/p><p>Investment universe defined as benchmark securities<\/p><p>5, 10, and 15 years of historical data analyzed<\/p><p>Rolling windows approach analysis<\/p><p>Point-in-time data<\/p><p>Up to 10 factor portfolios<\/p><p>After backtesting dozens of strategies based on this information, the outside manager presented MultiStrat with a strategy for consideration. Based on 5 years of historical data, a monthly rebalance, and 7 equally weighted factors, the strategy produced a Sharpe ratio of 2.5 with realized volatility of 3%. This strategy also had the highest t-statistic of 2.7 and lowest p-value of 1.4% of any strategy tested.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following types of selection bias is most likely embedded in the proposed strategy that the risk team is evaluating?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q020.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"portfolio"},{"n":21,"q":"Which of the following changes to the yield curve is most consistent with Novak's forecasts? A(n):","opts":["increase in the level.","increase in the curvature.","decrease in the term spread."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a021.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a021.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<\/summary><div class=\"vig-body\"><p>Luca Girardi is a fixed income portfolio manager at Bled Capital. Girardi works closely with Eva Novak, Bled&#x27;s chief economist. The domestic economy has been in a sustained expansion for the past few years. Recently, inflation has accelerated well above the central bank&#x27;s inflation target.<\/p><p>Novak&#x27;s base case economic forecast is for the economic expansion to continue in the coming year and for inflation to continue rising over the next few quarters. Novak forecasts that the central bank will respond to these developments by aggressively raising its policy rate over the next six months, resulting in a mild recession in the following year.<\/p><p>The current government bond yield curve is the steepest it has been in years, as the yield on the 10-year bond is currently 300 basis points above the yield on the 2-year bond. Girardi compares the government bond yield curve with the interest rate swap curve to get a relative measure of the credit and liquidity risks reflected in the corporate bond market, as shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex008.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Girardi is evaluating the relative attractiveness of a BBB-rated industrial bond. The bond matures in 5 years and is continuously callable beginning in 2 years. Girardi will determine the bond&#x27;s attractiveness relative to similar bonds based on its option-adjusted spread (OAS).<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following changes to the yield curve is most consistent with Novak&#x27;s forecasts? A(n):<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q021.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":22,"q":"Based on Exhibit 1, the 10-year swap spread is closest to:","opts":["-0.10%","+0.30%","+1.85%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a022.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a022.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Luca Girardi is a fixed income portfolio manager at Bled Capital. Girardi works closely with Eva Novak, Bled&#x27;s chief economist. The domestic economy has been in a sustained expansion for the past few years. Recently, inflation has accelerated well above the central bank&#x27;s inflation target.<\/p><p>Novak&#x27;s base case economic forecast is for the economic expansion to continue in the coming year and for inflation to continue rising over the next few quarters. Novak forecasts that the central bank will respond to these developments by aggressively raising its policy rate over the next six months, resulting in a mild recession in the following year.<\/p><p>The current government bond yield curve is the steepest it has been in years, as the yield on the 10-year bond is currently 300 basis points above the yield on the 2-year bond. Girardi compares the government bond yield curve with the interest rate swap curve to get a relative measure of the credit and liquidity risks reflected in the corporate bond market, as shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex008.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Girardi is evaluating the relative attractiveness of a BBB-rated industrial bond. The bond matures in 5 years and is continuously callable beginning in 2 years. Girardi will determine the bond&#x27;s attractiveness relative to similar bonds based on its option-adjusted spread (OAS).<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the 10-year swap spread is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q022.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":23,"q":"Based on the information provided and relative to the long-run average credit spread, the current term structure of credit spreads for the BBB-rated industrial corporate bond is most likely:","opts":["wide.","narrow.","close to average."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a023.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a023.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Luca Girardi is a fixed income portfolio manager at Bled Capital. Girardi works closely with Eva Novak, Bled&#x27;s chief economist. The domestic economy has been in a sustained expansion for the past few years. Recently, inflation has accelerated well above the central bank&#x27;s inflation target.<\/p><p>Novak&#x27;s base case economic forecast is for the economic expansion to continue in the coming year and for inflation to continue rising over the next few quarters. Novak forecasts that the central bank will respond to these developments by aggressively raising its policy rate over the next six months, resulting in a mild recession in the following year.<\/p><p>The current government bond yield curve is the steepest it has been in years, as the yield on the 10-year bond is currently 300 basis points above the yield on the 2-year bond. Girardi compares the government bond yield curve with the interest rate swap curve to get a relative measure of the credit and liquidity risks reflected in the corporate bond market, as shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex008.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Girardi is evaluating the relative attractiveness of a BBB-rated industrial bond. The bond matures in 5 years and is continuously callable beginning in 2 years. Girardi will determine the bond&#x27;s attractiveness relative to similar bonds based on its option-adjusted spread (OAS).<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the information provided and relative to the long-run average credit spread, the current term structure of credit spreads for the BBB-rated industrial corporate bond is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q023.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":24,"q":"Using a binomial interest rate tree, if the BBB-rated industrial bond's price is given, the bond's option-adjusted spread (OAS) is most appropriately found through trial and error by:","opts":["subtracting a constant spread from the Z-spread.","adding a node-dependent spread to each forward rate.","adding a constant spread to the one-year forward rates."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a024.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a024.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Luca Girardi is a fixed income portfolio manager at Bled Capital. Girardi works closely with Eva Novak, Bled&#x27;s chief economist. The domestic economy has been in a sustained expansion for the past few years. Recently, inflation has accelerated well above the central bank&#x27;s inflation target.<\/p><p>Novak&#x27;s base case economic forecast is for the economic expansion to continue in the coming year and for inflation to continue rising over the next few quarters. Novak forecasts that the central bank will respond to these developments by aggressively raising its policy rate over the next six months, resulting in a mild recession in the following year.<\/p><p>The current government bond yield curve is the steepest it has been in years, as the yield on the 10-year bond is currently 300 basis points above the yield on the 2-year bond. Girardi compares the government bond yield curve with the interest rate swap curve to get a relative measure of the credit and liquidity risks reflected in the corporate bond market, as shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex008.webp\" style=\"max-width:min(100%,462px)\" alt=\"Exhibit\"><p>Girardi is evaluating the relative attractiveness of a BBB-rated industrial bond. The bond matures in 5 years and is continuously callable beginning in 2 years. Girardi will determine the bond&#x27;s attractiveness relative to similar bonds based on its option-adjusted spread (OAS).<\/p><\/div><\/details><div class=\"qtext\"><p>Using a binomial interest rate tree, if the BBB-rated industrial bond&#x27;s price is given, the bond&#x27;s option-adjusted spread (OAS) is most appropriately found through trial and error by:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q024.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":25,"q":"Which of Misko's conclusions most likely suggests that Colossus Robotics has manipulated its earnings?","opts":["Conclusion 1","Conclusion 2","Conclusion 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a025.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a025.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Arianna Varela is the head of research at an asset management firm. She directs Theron Misko, a senior analyst who covers the technology industry, to analyze Colossus Robotics and Acheron Semiconductors. Varela is particularly interested in evaluating the quality of both companies&#x27; financial reports and earnings.<\/p><p>Misko explains that Colossus Robotics has been operating in the industrial robotics segment for over two decades, but the company recently started manufacturing drones for consumer and commercial uses. Investors see great growth potential in this market and have been valuing drone manufacturers at higher multiples; as a result, Colossus&#x27;s stock price has increased substantially. Misko reached the following conclusions after analyzing the company&#x27;s financial reports:<\/p><p><b>Conclusion 1:<\/b> Colossus&#x27;s receivables turnover increased significantly in recent quarters.<\/p><p><b>Conclusion 2:<\/b> Colossus&#x27;s drone segment had excellent performance in the last two years, but the industrial robotics segment performed significantly worse than competitors.<\/p><p><b>Conclusion 3:<\/b> Colossus has a Beneish&#x27;s M-score of −2.70, which is below the industry average.<\/p><p>Varela asks Misko to compare Colossus with its competitors. Misko explains that Colossus adopted financial reporting choices that overstate its assets, affecting the comparability of the firm&#x27;s financial statements.<\/p><p>Varela then asks Misko about Acheron Semiconductors. After analyzing the company&#x27;s financial statements, he believes that Acheron has good reporting quality, but there are warning signs suggesting that the company has low-quality earnings. The analysis is summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex009.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>more restrictions on capitalizing installation and assembly costs relative to capital projects. Currently, Acheron treats such costs as capital expenditures and records them as part of PPE. This change would decrease the portion of costs that Acheron can capitalize and, consequently, increase the portion that is expensed. Varela does not expect any other factor to impact the firm&#x27;s financial statements.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Misko&#x27;s conclusions most likely suggests that Colossus Robotics has manipulated its earnings?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q025.webp\" alt=\"Câu hỏi gốc\"><\/details> ốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q028.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fsa"},{"n":29,"q":"Which two of the motivations for divestments mentioned by Tzortzi are correct?","opts":["Motivation 1 and Motivation 2","Motivation 1 and Motivation 3","Motivation 2 and Motivation 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a029.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a029.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Corporate Issuers<\/summary><div class=\"vig-body\"><p>Paula Kostas is a junior analyst at InvestUp, a multi-strategy asset management company. Kostas is analyzing a conglomerate planning to divest one of its businesses. She asks her supervisor, Vasso Tzortzi, about underlying motivations that drive divestment actions and Tzortzi lists the following:<\/p><p><b>Motivation 1:<\/b> Raising cash to reduce financial leverage<\/p><p><b>Motivation 2:<\/b> Selling undervalued businesses to reduce conglomerate discount<\/p><p><b>Motivation 3:<\/b> Complying with court decisions in antitrust cases<\/p><p>InvestUp is considering a significant investment in Chattergram, which has large cash reserves from its online sales of social media applications. Although Chattergram has never paid dividends, its shareholders have recently urged the company&#x27;s management to begin doing so. However, management does not believe dividends are warranted since it has identified several projects that would require large cash outlays.<\/p><p>One area that InvestUp considers is a company&#x27;s corporate governance. Kostas is asked for information concerning Chattergram&#x27;s ownership structure. She provides the following:<\/p><p>30% of Chattergram&#x27;s common stock is owned by the founder&#x27;s family.<\/p> gy asset management company. Kostas is analyzing a conglomerate planning to divest one of its businesses. She asks her supervisor, Vasso Tzortzi, about underlying motivations that drive divestment actions and Tzortzi lists the following:<\/p><p><b>Motivation 1:<\/b> Raising cash to reduce financial leverage<\/p><p><b>Motivation 2:<\/b> Selling undervalued businesses to reduce conglomerate discount<\/p><p><b>Motivation 3:<\/b> Complying with court decisions in antitrust cases<\/p><p>InvestUp is considering a significant investment in Chattergram, which has large cash reserves from its online sales of social media applications. Although Chattergram has never paid dividends, its shareholders have recently urged the company&#x27;s management to begin doing so. However, management does not believe dividends are warranted since it has identified several projects that would require large cash outlays.<\/p><p>One area that InvestUp considers is a company&#x27;s corporate governance. Kostas is asked for information concerning Chattergram&#x27;s ownership structure. She provides the following:<\/p><p>30% of Chattergram&#x27;s common stock is owned by the founder&#x27;s family.<\/p><p>No other shareholder owns more than 1% of the stock.<\/p><p>None of the family members participate in Chattergram&#x27;s management, nor do they serve on the board of directors.<\/p><p>There is a dual class share structure:<\/p><p>Family members own Class A shares, with 1.6 votes per share.<\/p><p>Nonfamily members own Class B shares, with 1 vote per share.<\/p><p>Kostas turns her attention to Balaskas Group, a large software developer that recently restructured its mix of debt and equity through a dividend recapitalization. Balaskas is a mature company with stable revenues and cash flows. Kostas analyzes the company&#x27;s financial statements to understand the effects of this restructuring action.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, Balaskas Group&#x27;s dividend recapitalization most likely results in an increase in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"corporate"},{"n":33,"q":"Based on Exhibit 1 and Frueh's assumptions and using a two-stage FCFF model, the company's equity value per share (in €) is closest to:","opts":["13.70","14.37","16.87"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Angelika Frueh is a senior analyst at Forschung Global Asset Research. She is estimating the intrinsic value of Wohnung GmbH, using a two-stage free cash flow valuation model. Frueh uses Wohnung&#x27;s cash flow statement for the most recently ended fiscal year, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex010.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>She also makes the following assumptions when valuing Wohnung:<\/p><p>WACC is 12%.<\/p><p>FCFF will grow at 10% annually for the next 5 years and then grow indefinitely at 4% annually.<\/p><p>Market value of debt is €100 million.<\/p><p>There are 40 million common shares outstanding.<\/p><p>Frueh then meets with Laura Schriner, an intern, to review the model. Schriner, who has little experience in valuing companies using free cash flow, points out that Frueh has not factored future corporate actions into this model and asks how share buybacks, dividend payments, and debt issuance affect free cash flows.<\/p><p><b>Statement 1:<\/b> Share repurchases will affect FCFE but not FCFF since FCFE represents cash flows after accounting for share buybacks.<\/p><p><b>Statement 2:<\/b> Changes in the target debt ratio will impact FCFE. For example, borrowing additional debt this year will increase FCFE.<\/p><p><b>Statement 3:<\/b> Paying dividends will decrease FCFE since FCFE is calculated net of dividend distributions.<\/p><p>One month later, Frueh begins to cover Spielspas GmbH, which is currently privately held, and meets with Spielspas&#x27;s founder and CEO, Dieter Kuster. During the meeting, Kuster reveals near-term plans to take the company public and asks Frueh to estimate the company&#x27;s intrinsic value. When Frueh states that she will do so by discounting FCFE, Kuster asks why it is better to use FCFE instead of net income or EBITDA. She notes three differences between them:<\/p><p><b>Difference 1:<\/b> Unlike EBITDA, free cash flow is net of depreciation and amortization.<\/p><p><b>Difference 2:<\/b> Unlike net income, free cash flow is net of dividends paid to shareholders.<\/p><p><b>Difference 3:<\/b> Unlike net income and EBITDA, free cash flow deducts investments in fixed capital.<\/p><p>Three years later, Spielspas is trading on Euronext for €48 per share with an estimated EPS of €2. To assess whether Spielspas is fairly valued, Frueh gathers three similar competitors&#x27; forward P/E ratios to compare with Spielspas&#x27;s P/E.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex011.webp\" style=\"max-width:min(100%,398px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Frueh&#x27;s assumptions and using a two-stage FCFF model, the company&#x27;s equity value per share (in €) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q033.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":34,"q":"Which of Frueh's statements is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a034.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a034.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Angelika Frueh is a senior analyst at Forschung Global Asset Research. She is estimating the intrinsic value of Wohnung GmbH, using a two-stage free cash flow valuation model. Frueh uses Wohnung&#x27;s cash flow statement for the most recently ended fiscal year, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex010.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>She also makes the following assumptions when valuing Wohnung:<\/p><p>WACC is 12%.<\/p><p>FCFF will grow at 10% annually for the next 5 years and then grow indefinitely at 4% annually.<\/p><p>Market value of debt is €100 million.<\/p><p>There are 40 million common shares outstanding.<\/p><p>Frueh then meets with Laura Schriner, an intern, to review the model. Schriner, who has little experience in valuing companies using free cash flow, points out that Frueh has not factored future corporate actions into this model and asks how share buybacks, dividend payments, and debt issuance affect free cash flows.<\/p><p><b>Statement 1:<\/b> Share repurchases will affect FCFE but not FCFF since FCFE represents cash flows after accounting for share buybacks.<\/p><p><b>Statement 2:<\/b> Changes in the target debt ratio will impact FCFE. For example, borrowing additional debt this year will increase FCFE.<\/p><p><b>Statement 3:<\/b> Paying dividends will decrease FCFE since FCFE is calculated net of dividend distributions.<\/p><p>One month later, Frueh begins to cover Spielspas GmbH, which is currently privately held, and meets with Spielspas&#x27;s founder and CE eciation and amortization.<\/p><p><b>Difference 2:<\/b> Unlike net income, free cash flow is net of dividends paid to shareholders.<\/p><p><b>Difference 3:<\/b> Unlike net income and EBITDA, free cash flow deducts investments in fixed capital.<\/p><p>Three years later, Spielspas is trading on Euronext for €48 per share with an estimated EPS of €2. To assess whether Spielspas is fairly valued, Frueh gathers three similar competitors&#x27; forward P/E ratios to compare with Spielspas&#x27;s P/E.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex011.webp\" style=\"max-width:min(100%,398px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>In response to Kuster&#x27;s inquiry, which of the following is an advantage of using free cash flow in the valuation of Spielspas instead of using net income or EBITDA?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":36,"q":"Based on only Exhibit 2, which of the following is correct? Frueh is using a(n):","opts":["relative valuation model, which indicates that Spielspas is overvalued.","absolute valuation model, which indicates that Spielspas is overvalued.","absolute valuation model, which indicates that Spielspas is undervalued."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Angelika Frueh is a senior analyst at Forschung Global Asset Research. She is estimating the intrinsic value of Wohnung GmbH, using a two-stage free cash flow valuation model. Frueh uses Wohnung&#x27;s cash flow statement for the most recently ended fiscal year, shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex010.webp\" style=\"max-width:min(100%,433px)\" alt=\"Exhibit\"><p>She also makes the following assumptions when valuing Wohnung:<\/p><p>WACC is 12%.<\/p><p>FCFF will grow at 10% annually for the next 5 years and then grow indefinitely at 4% annually.<\/p><p>Market value of debt is €100 million.<\/p><p>There are 40 million common shares outstanding.<\/p><p>Frueh then meets with Laura Schriner, an intern, to review the model. Schriner, who has little experience in valuing companies using free cash flow, points out that Frueh has not factored future corporate actions into this model and asks how share buybacks, dividend payments, and debt issuance affect free cash flows.<\/p><p><b>Statement 1:<\/b> Share repurchases will affect FCFE but not FCFF since FCFE represents cash flows after accounting for share buybacks.<\/p><p><b>Statement 2:<\/b> Changes in the target debt ratio will impact FCFE. For example, borrowing additional debt this year will increase FCFE.<\/p><p><b>Statement 3:<\/b> Paying dividends will decrease FCFE since FCFE is calculated net of dividend distributions.<\/p><p>One month later, Frueh begins to cover Spielspas GmbH, which is currently privately held, and meets with Spielspas&#x27;s founder and CEO, Dieter Kuster. During the meeting, Kuster reveals near-term plans to take the company public and asks Frueh to estimate the company&#x27;s intrinsic value. When Frueh states that she will do so by discounting FCFE, Kuster asks why it is better to use FCFE instead of net income or EBITDA. She notes three differences between them:<\/p><p><b>Difference 1:<\/b> Unlike EBITDA, free cash flow is net of depreciation and amortization.<\/p><p><b>Difference 2:<\/b> Unlike net income, free cash flow is net of dividends paid to shareholders.<\/p><p><b>Difference 3:<\/b> Unlike net income and EBITDA, free cash flow deducts investments in fixed capital.<\/p><p>Three years later, Spielspas is trading on Euronext for €48 per share with an estimated EPS of €2. To assess whether Spielspas is fairly valued, Frueh gathers three similar competitors&#x27; forward P/E ratios to compare with Spielspas&#x27;s P/E.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex011.webp\" style=\"max-width:min(100%,398px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on only Exhibit 2, which of the following is correct? Frueh is using a(n):<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":37,"q":"To comply with Standard V(A) Diligence and Reasonable Basis regarding the use of third-party research, Harrison:","opts":["can use Pumice's research without further due diligence.","must conduct his own due diligence of Pumice's research process.","cannot rely on Pumice's research and must create his own economic forecasts."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Harold Harrison, a CFA Level I Candidate, works as an investment analyst at Igneous Wealth. Igneous provides financial and estate planning to high-net-worth and retail investors. Igneous&#x27;s investment process relies on numerous third-party research providers. All third-party research must be vetted and approved by Igneous&#x27;s investment committee.<\/p><p>Pumice Research publishes weekly macroeconomic analyses and forecasts and is one of the firm&#x27;s approved research providers. Harrison often disagrees with Pumice&#x27;s conclusions regarding the expected impact on financial markets but still finds its work interesting and thought-provoking.<\/p><p>Annually, Igneous forecasts asset class returns for the next five years and uses this information in constructing client portfolios. Harrison is responsible for these forecasts and uses many of Pumice&#x27;s economic estimates to create them.<\/p><p>Harrison&#x27;s entire personal investment portfolio is invested in Igneous&#x27;s most aggressive model portfolio, which consists primarily of individual stocks. Harrison&#x27;s account is at the same brokerage firm as clients&#x27; accounts. The firm&#x27;s trading desk executes all model portfolio changes, including Harrison’s.<\/p><p>Harrison&#x27;s CFA Level I exam date is quickly approaching. He has been working unusually long hours and is also studying for a mandatory financial regulatory exam scheduled just a week after the CFA exam. During the CFA exam, he notifies the proctor that he needs to use the washroom. As he is walking through the testing center, he glances at one of the screens of another CFA Level I test taker. Harrison recognizes the question and sees the other Candidate select a different answer than he did. All of this goes unnoticed by the proctor. Once Harrison resumes the exam, he returns to that specific question, realizes he did not read the question carefully, and confidently selects a different answer. Harrison&#x27;s new answer choice is not the same answer that the other Candidate selected. Harrison completes the remainder of the exam without incident. Exhausted by work and by studying for the CFA exam, Harrison is not confident in his ability to pass the regulatory exam, which contains many country-specific questions on rules, regulations, and taxes. Harrison&#x27;s coworker Natalie Grimes, who is also a CFA Level I Candidate, is taking the same regulatory exam the day before Harrison is.<\/p><p>The morning that Harrison is scheduled to take the exam, Grimes and Harrison are discussing Grimes&#x27;s exam experience in general, but nothing specific regarding the test or question content. Grimes notices that Harrison has a small piece of paper with what appear to be exam-related notes. Harrison takes these notes into the exam room and uses them during the exam to answer questions. After the test, Harrison confides to Grimes that he would not have passed the exam without using his notes. Grimes reassures Harrison that his secret is safe and that she will not mention this to anyone.<\/p><\/div><\/details><div class=\"qtext\"><p>To comply with Standard V(A) Diligence and Reasonable Basis regarding the use of third-party research, Harrison:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":38,"q":"To comply with Standard VI(A) - Disclosure of Conflicts, do Harrison's personal investments need to be disclosed to his employer?","opts":["Yes.","No, since all of Harrison's investable assets are invested in the firm's model portfolio.","No, since Harrison uses the same brokerage firm as clients and trades are done by the firm."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Harold Harrison, a CFA Level I Candidate, works as an investment analyst at Igneous Wealth. Igneous provides financial and estate planning to high-net-worth and retail investors. Igneous&#x27;s investment proce ty to pass the regulatory exam, which contains many country-specific questions on rules, regulations, and taxes. Harrison&#x27;s coworker Natalie Grimes, who is also a CFA Level I Candidate, is taking the same regulatory exam the day before Harrison is.<\/p><p>The morning that Harrison is scheduled to take the exam, Grimes and Harrison are discussing Grimes&#x27;s exam experience in general, but nothing specific regarding the test or question content. Grimes notices that Harrison has a small piece of paper with what appear to be exam-related notes. Harrison takes these notes into the exam room and uses them during the exam to answer questions. After the test, Harrison confides to Grimes that he would not have passed the exam without using his notes. Grimes reassures Harrison that his secret is safe and that she will not mention this to anyone.<\/p><\/div><\/details><div class=\"qtext\"><p>To comply with Standard VI(A) - Disclosure of Conflicts, do Harrison&#x27;s personal investments need to be disclosed to his employer?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":39,"q":"While taking the CFA Level I exam, did Harrison violate Standard VII(A) regarding conduct as a participant in CFA Institute programs?","opts":["Yes.","No, as he did not intentionally look at another participant's exam.","No, as he did not use another Candidate's information to arrive at the correct answer."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a039.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a039.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/spa
