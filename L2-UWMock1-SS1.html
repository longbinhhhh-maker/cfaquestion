<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

ing, she asks the center&#x27;s director whether the revenue from the center will be sufficient to service the bonds. The director responds that while bookings have been slower than projected, there is no risk of bond obligations not being paid as scheduled.<\/p><p>Later that day, Bowen telephones Siggurdson from the airport and says, &quot;I don&#x27;t have anything specific, but I&#x27;m not feeling comfortable about the municipality&#x27;s revenue forecasts.&quot; Siggurdson replies that he has no information on the matter but will check around. Siggurdson then speaks to sources at one of the ratings agencies. One source tells him that some bookings may have been canceled, but the agency has not been able to assess whether that will negatively affect the bonds. Siggurdson verifies approximately 15 cancellations using public information, including concert performers&#x27; publicly available websites.<\/p><p>quickly prepares a report advising that the cancellations may leave the municipality unable to pay interest on the bonds when due. He concludes that investors should hold the bonds until he can learn more, but several clients immediately sell their holdings of the municipality&#x27;s bonds. The following day, the ratings agency downgrades the convention center bond issue to junk bond status, causing the price to fall significantly.<\/p><p>One of Bowen&#x27;s advisory clients is a wealthy individual. Bowen has prepared an investment policy statement (IPS) and reviews it with the client annually. The client&#x27;s objectives and constraints, as identified in the IPS, indicate that below-investment-grade bonds are not suitable for this client&#x27;s portfolio. However, yields have been very low for several years, and the client has spoken to Bowen about the need for the portfolio to generate higher returns from its bond holdings.<\/p><p>The client has researched the recently downgraded municipal bonds and is attracted by their high yields. Bowen believes that the bonds&#x27; riskiness makes them unsuitable, but she has had difficulty with this client in the past and Bowen worries that she will lose his business if she voices her concerns, so she remains silent. The client places an order for a significant amount of the convention center bonds, which Bowen instructs Conservative Capital&#x27;s trading desk to execute.<\/p><p>Without informing Conservative Capital, Siggurdson has accepted an offer to work full time as an employee for one of the firm&#x27;s competitors. Siggurdson was previously an employee of Conservative Capital, but several years ago he and the firm mutually agreed to change his status to an independent contractor. As an independent contractor, Siggurdson:<\/p><p>works far fewer hours than analysts who are full-time employees;<\/p><p>is free to accept assignments from Conservative Capital&#x27;s competitors, although he has not done so; and firm&#x27;s office, working at any empty desk when he is there.<\/p><p>Siggurdson has posted his new position on his personal social media account, which is visible to some of Conservative Capital&#x27;s clients. He has also obtained information about these clients from sources unrelated to Conservative Capital.<\/p><\/div><\/details><div class=\"qtext\"><p>By accepting the municipality&#x27;s payment of her expenses, does Bowen violate the Code and Standards?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q001.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"ethics"},{"n":2,"q":"th respect to Siggurdson's report, did either Siggurdson or Bowen violate Standard I|(A) Material Nonpublic Information?","opts":["Only Bowen violated the Standard.","Only Siggurdson violated the Standard.","Neither Siggurdson nor Bowen violated the Standard."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a002.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời gi ons may leave the municipality unable to pay interest on the bonds when due. He concludes that investors should hold the bonds until he can learn more, but several clients immediately sell their holdings of the municipality&#x27;s bonds. The following day, the ratings agency downgrades the convention center bond issue to junk bond status, causing the price to fall significantly.<\/p><p>One of Bowen&#x27;s advisory clients is a wealthy individual. Bowen has prepared an investment policy statement (IPS) and reviews it with the client annually. The client&#x27;s objectives and constraints, as identified in the IPS, indicate that below-investment-grade bonds are not suitable for this client&#x27;s portfolio. However, yields have been very low for several years, and the client has spoken to Bowen about the need for the portfolio to generate higher returns from its bond holdings.<\/p><p>The client has researched the recently downgraded municipal bonds and is attracted by their high yields. Bowen believes that the bonds&#x27; riskiness makes them unsuitable, but she has had difficulty with this client in the past and Bowen worries that she will lose his business if she voices her concerns, so she remains silent. The client places an order for a significant amount of the convention center bonds, which Bowen instructs Conservative Capital&#x27;s trading desk to execute.<\/p><p>Without informing Conservative Capital, Siggurdson has accepted an offer to work full time as an employee for one of the firm&#x27;s competitors. Siggurdson was previously an employee of Conservative Capital, but several years ago he and the firm mutually agreed to change his status to an independent contractor. As an independent contractor, Siggurdson:<\/p><p>works far fewer hours than analysts who are full-time employees;<\/p><p>is free to accept assignments from Conservative Capital&#x27;s competitors, although he has not done so; and firm&#x27;s office, working at any empty desk when he is there.<\ g.<\/p><p>Sauer has built a deep neural network (DNN) to analyze bonds to estimate when there might be changes to an issuer&#x27;s credit rating. After going through several iterations of the model and changing the hyperparameters, Sauer settles on a model with:<\/p><p>8 fundamental features<\/p><p>11 industry dummy variables<\/p><p>3 hidden layers with 80 nodes each<\/p><p>An output of the estimated credit rating over the next quarter<\/p><p>Albrecht suggests introducing a term to shrink the number of nodes with nonzero weighting in the DNN to reduce overfitting risk.<\/p><p>Then, Albrecht asks Sauer for an update on the ML algorithm developed at the beginning of the year to predict market sentiment based on social media posts. Sauer explains that:<\/p><p>the data set was split into training, cross-validation (CV), and test data sets,<\/p><p>a logistic regression model was used to classify texts and predict sentiments,<\/p><p>positive sentiments were classified as 1 and negative sentiments as 0, and<\/p><p>the model was tested based on different threshold p-values.<\/p><p>Sauer tells Albrecht that she compared the model performance on the training and CV data sets using three different threshold p-values. The analysis included receiver operating characteristic (ROC) plots and the area under the curve (AUC) for each ROC curve. The conclusions of the analysis are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex001.webp\" style=\"max-width:min(100%,355px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which of Sauer&#x27;s statements about clustering is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q005.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":6,"q":"Which of the following would least likely be considered a hyperparameter in Sauer's DNN?","opts":["Learning rate","Minimum population at a node","Connectivity and each ROC curve. The conclusions of the analysis are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex001.webp\" style=\"max-width:min(100%,355px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which supervised model would be most appropriate for Albrecht&#x27;s suggestion to reduce overfitting in the DNN?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":8,"q":"Based on Exhibit 1, the best fitting model is the one based on which threshold p-value?","opts":["0.63","0.69","0.75"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Luca Albrecht and Katrin Sauer are quantitative analysts at a hedge fund specializing in credit strategies. They are developing machine learning (ML) models to predict the credit ratings for new bond issues and/or changes in ratings for any bond.<\/p><p>Albrecht plans to use an unsupervised clustering model to predict credit ratings and is deciding between k-means clustering and hierarchical clustering models. Sauer helps Albrecht review the data being analyzed and states:<\/p><p><b>Statement 1:<\/b> Since you know the number of clusters you plan to use beforehand, this bypasses a limitation of k-means clustering.<\/p><p><b>Statement 2:<\/b> Since you are looking at the global structure of the data and identifying large clusters, agglomerative clustering would be better suited than divisive clustering.<\/p><p>Sauer has built a deep neural network (DNN) to analyze bonds to estimate when there might be changes to an issuer&#x27;s credit rating. After going through several iterations of the model and changing the hyperparameters, Sauer settles on a model with:<\/p><p>8 fundamental features<\/p><p>11 industry dummy variables<\/p><p>3 hidden layers with 80 nodes each<\/p><p>An output of the estimated credit rating over the next quarter<\/p><p>Albrecht suggests introducing a term to shrink the number of nodes with nonzero weighting in the DNN to reduce overfitting risk.<\/p><p>Then, Albrecht asks Sauer for an update on the ML algorithm developed at the beginning of the year to predict market sentiment based on social media posts. Sauer explains that:<\/p><p>the data set was split into training, cross-validation (CV), and test data sets,<\/p><p>a logistic regression model was used to classify texts and predict sentiments,<\/p><p>positive sentiments were classified as 1 and negative sentiments as 0, and<\/p><p>the model was tested based on different threshold p-values.<\/p><p>Sauer tells Albrecht that she compared the model performance on the training and CV data sets using three different threshold p-values. The analysis included receiver operating characteristic (ROC) plots and the area under the curve (AUC) for each ROC curve. The conclusions of the analysis are presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex001.webp\" style=\"max-width:min(100%,355px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the best fitting model is the one based on which threshold p-value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q008.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"quant"},{"n":9,"q":"Based on Exhibit 1 and the justified trailing P/E, Kunene's stock is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a009.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a009.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Ciara Amutenya is the head of research at Brandberg Asset Management. She is currently reviewing the valuation and growth outlook of two stocks in the firm&#x27;s portfolio: Kunene Semiconductors and Swakop Oil. She directs Linus Nangombe, a junior analyst at Brandberg, to analyze both companies.<\/p><p>Amutenya asks Nangombe to calculate Kunene&#x27;s justified trailing P/E based on the Gordon growth model and to determine whether the stock is currently overvalued, fairly valued, or undervalued. Nangombe gathers information from Kunene, summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex002.webp\" style=\"max-width:min(100%,421px)\" alt=\"Exhibit\"><p>Nangombe explains that the expected dividend growth rate reflects Kunene&#x27;s performance in the previous five years. Amutenya knows that Kunene&#x27;s competitors are making substantial investments in innovative technologies and expects these technologies to be market-ready in the medium term. Therefore, she believes that Kunene will not be able to maintain a dividend growth rate of 8.0% over time. She asks Nangombe to estimate the value of Kunene&#x27;s stock using the H-model and assuming that the dividend growth rate:<\/p><p>is initially 8.0%,<\/p><p>declines linearly during a 10-year period, and<\/p><p>stabilizes at a perpetual growth rate of 5.0%.<\/p><p>Amutenya then turns her attention to Swakop Oil, one of the major operators of retail gas stations in the region. She asks Nangombe to estimate the company&#x27;s sustainable growth rate. Nangombe decides to use DuPont analysis and summarizes the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex003.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Amutenya is concerned about Swakop&#x27;s ability to maintain its current level of returns. Nangombe explains that he conducted an industry and competitive analysis for Swakop and the oil distribution industry. He lists the following observations:<\/p><p>Observation 1:Swakop changed its gasoline suppliers several times due to intense competition among the suppliers to offer the best prices and terms.<\/p><p>Observation 2:Swakop is the lowest-cost producer; its products are similar to competitors&#x27; and are priced slightly below average market price.<\/p><p>Observation 3:Swakop has achieved above-average returns in the previous five years, and the barriers to entry in its industry are low.<\/p><p>After listening to Nangombe, Amutenya concludes that Swakop&#x27;s current level of returns may not be sustainable and decides to reduce long-term growth rate forecasts.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and the justified trailing P/E, Kunene&#x27;s stock is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uwm1-ss1/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"equity"},{"n":10,"q":"Based on Exhibit 1 and the H-model assumptions, the estimated value (ZAR) of Kunene's stock is closest to:","opts":["175.95","183.60","206.55"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uwm1-ss1/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ciara Amutenya is the head of research at Brandberg Asset Management. She is currently reviewing the valuation and growth outlook of two stocks in the firm&#x27;s portfolio: Kunene Semiconductors and Swakop Oil. She directs Linus Nangombe, a junior analyst at Brandberg, to analyze both companies.<\/p><p>Amutenya asks Nangombe to calculate Kunene&#x27;s justified trailing P/E based on the Gordon growth model and to determine whether the stock is currently overvalued, fairly valued, or undervalued. Nangombe gathers information from Kunene, summarized in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex002.webp\" style=\"max-width:min(100%,421px)\" alt=\"Exhibit\"><p>Nangombe explains that the expected dividend growth rate reflects Kunene&#x27;s performance in the previous five years. Amutenya knows that Kunene&#x27;s competitors are making substantial investments in innovative technologies and expects these technologies to be market-ready in the medium term. Therefore, she believes that Kunene will not be able to maintain a dividend growth rate of 8.0% over time. She asks Nangombe to estimate the value of Kunene&#x27;s stock using the H-model and assuming that the dividend growth rate:<\/p><p>is initially 8.0%,<\/p><p>declines linearly during a 10-year period, and<\/p><p>stabilizes at a perpetual growth rate of 5.0%.<\/p><p>Amutenya then turns her attention to Swakop Oil, one of the major operators of retail gas stations in the region. She asks Nangombe to estimate the company&#x27;s sustainable growth rate. Nangombe decides to use DuPont analysis and summarizes the information in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uwm1-ss1/ex003.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit\"><p>Amutenya is concerned about Swakop&#x27;s ability to maintain its current level of returns. Nangombe explains that he conducted an industry and competitive analysis for Swakop and the oil distribution industry. He lists the following observations:<\/p><p>Observ
