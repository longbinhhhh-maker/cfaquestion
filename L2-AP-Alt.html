pricing structure of natural gas futures.<\/p><p><b>C is incorrect<\/b>. The hedging pressure hypothesis posits that the balance of hedging activities between producers and consumers shapes the futures price curve. While this theory could explain variations in futures prices, it does not specifically address the characteristics of natural gas as highlighted in Smith&#x27;s research. The hypothesis would be more applicable if there were significant discrepancies in producers&#x27; and consumers&#x27; hedging needs that could lead to contango or backwardation. However, the minimal storage requirement and real-time consumption of natural gas reduce the impact of hedging pressures on the futures curve, making this hypothesis less relevant to the observed data in Exhibit 1. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodity Derivatives, LOS 1 (f) Compare theories of commodity futures returns.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Stella Dean<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stella Dean is a Darwin Commodities (DC) portfolio manager, an Irish commodity-based hedge<\/p><p>fund. DC’s strategy allocates exposure among ten commodities using a fixed weighing scheme,<\/p><p>with its benchmark being the Thomson Reuters/Core Commodity CRB Index (TR/CC CRB). Mike<\/p><p>Smith, a junior analyst, helps Dean manage the precious metals and energy sectors. The two<\/p><p>meet to discuss the factors that affect the value of the commodities they manage. Smith makes<\/p><p>the following statements:<\/p><p><b>Statement 1:<\/b> Transport costs are negatively related to futures prices.<\/p><p><b>Statement 2:<\/b> Unlike bonds and stocks, most commodities generate future cash flows.<\/p><p><b>Statement 3:<\/b> Commodities are primarily invested via derivatives.<\/p><p>Dean and Smith then discuss new investment opportunities in the energy sector. They review the<\/p><p>natural gas futures data presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0027.webp\" style=\"max-width:min(100%,342px)\" alt=\"Spot price Longer-Term Near-Term Futures Price Futures Price $3.36 $2.34 $2.43\"><p>Smith researched the energy sector and came to the following conclusions:<\/p><p>1. Energy, unlike softs, requires minimal storage and is consumed in realtime. 2. The producers have been less concerned about price than the consumers.<\/p><p>After the energy sector discussion, Dean reviews DC’s performance of a long position in the gold<\/p><p>futures contract. He notes that the portfolio earned a 7% roll return after the contract was rolled<\/p><p>forward and a 6% price return on the gold futures position last year. The long position was held<\/p><p>with a collateral equal to 100% of the position at a risk-free rate of 2%.<\/p><p>Smith asks Dean, “How will the state of the futures market affect the roll return?”<\/p><p>Dean responds with the following statements:<\/p><p><b>Statement 4:<\/b> When a futures market is in contango, the roll returns will be negative.<\/p><p><b>Statement 5:<\/b> When a futures market is in backwardation, the roll return will be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0028.webp\" style=\"max-width:min(100%,77px)\" alt=\"positive.\"><p>Due to a decrease in drilling activity in Russia and the North Sea, Dean believes the price of<\/p><p>natural gas will increase. The expected price volatility of natural gas has been higher than the<\/p><p>actual price volatility, and the trend is expected to persist. Dean also expects the S&amp;P GSCI<\/p><p>Natural Gas Index to increase.<\/p><p>Smith mentions that there are several ways that they can use swaps to take advantage of Dean’s<\/p><p>expectations about natural gas. Such positions are 1) a short position in excess return swap<\/p><p>based on the current level of the S&amp;P GSCI Natural Gas Index, 2) a long volatility swap on<\/p><p>natural gas, and 3) a basis swap long on natural gas.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Smith’s research on the energy sector and information from Exhibit 1, the futures price curve shape for natural gas is most consistent with the following:<\/p><\/div>", "subj": "alternatives"}, {"n": 20, "q": "Which of Dean’s statements regarding roll returns is correct :", "opts": ["Statement 4.", "Statement 5.", "Both statements 4 and 5."], "ans": "C", "expl": "Dean's statements regarding roll returns are both accurate and reflect fundamental concepts in futures trading. Statement 4 asserts that when a futures market is in contango, the roll returns will be negative. This occurs because in a contango market, the futures prices are higher than the spot prices, and as the futures contract approaches maturity, its price converges to the lower spot price. This convergence results in a loss for the holder of the contract if they roll over their position to a new contract with a higher price. Conversely, Statement 5 posits that when a futures market is in backwardation, the roll return will be positive. In backwardation, the futures prices are lower than the spot prices. As the contract nears expiration, its price increases to meet the higher spot price, yielding a profit for the holder when they roll their position forward to a cheaper contract. These dynamics are crucial for understanding the profitability of futures positions over time. A is incorrect. While Statement 4 on its own is correct, marking option A as the complete answer overlooks the accuracy of Statement 5. Both statements are integral to understanding the different scenarios in futures markets that affect roll returns. Focusing solely on contango and ignoring the implications of backwardation provides an incomplete picture of the market dynamics and their impact on roll returns. B is incorrect. Similarly, selecting only Statement 5 as the correct answer does not acknowledge the truth of Statement 4. Both contango and backwardation are common market conditions that must be understood together to fully grasp how roll returns can be influenced. Ignoring the effects of contango limits understanding of potential losses that can occur when futures prices are higher than spot prices at the time of contract rollover. ", "explhtml": "<p>Dean&#x27;s statements regarding roll returns are both accurate and reflect fundamental concepts in futures trading. Statement 4 asserts that when a futures market is in contango, the roll returns will be negative. This occurs because in a contango market, the futures prices are higher than the spot prices, and as the futures contract approaches maturity, its price converges to the lower spot price. This convergence results in a loss for the holder of the contract if they roll over their position to a new contract with a higher price. Conversely, Statement 5 posits that when a futures market is in backwardation, the roll return will be positive. In backwardation, the futures prices are lower than the spot prices. As the contract nears expiration, its price increases to meet the higher spot price, yielding a profit for the holder when they roll their position forward to a cheaper contract. These dynamics are crucial for understanding the profitability of futures positions over time.<\/p><p><b>A is incorrect<\/b>. While Statement 4 on its own is correct, marking option A as the complete answer overlooks the accuracy of Statement 5. Both statements are integral to understanding the different scenarios in futures markets that affect roll returns. Focusing solely on contango and ignoring the implications of backwardation provides an incomplete picture of the market dynamics and their impact on roll returns.<\/p><p><b>B is incorrect<\/b>. Similarly, selecting only Statement 5 as the correct answer does not acknowledge the truth of Statement 4. Both contango and backwardation are common market conditions that must be understood together to fully grasp how roll returns can be influenced. Ignoring the effects of contango limits understanding of potential losses that can occur when futures prices are higher than spot prices at the time of contract rollover. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodity Derivatives, LOS 1 (e) Analyze the relationship between spot prices and futures prices in markets in contango and markets in backwardation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Stella Dean<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stella Dean is a Darwin Commodities (DC) portfolio manager, an Irish commodity-based hedge<\/p><p>fund. DC’s strategy allocates exposure among ten commodities using a fixed weighing scheme,<\/p><p>with its benchmark being the Thomson Reuters/Core Commodity CRB Index (TR/CC CRB). Mike<\/p><p>Smith, a junior analyst, helps Dean manage the precious metals and energy sectors. The two<\/p><p>meet to discuss the factors that affect the value of the commodities they manage. Smith makes<\/p><p>the following statements:<\/p><p><b>Statement 1:<\/b> Transport costs are negatively related to futures prices.<\/p><p><b>Statement 2:<\/b> Unlike bonds and stocks, most commodities generate future cash flows.<\/p><p><b>Statement 3:<\/b> Commodities are primarily invested via derivatives.<\/p><p>Dean and Smith then discuss new investment opportunities in the energy sector. They review the<\/p><p>natural gas futures data presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0027.webp\" style=\"max-width:min(100%,342px)\" alt=\"Spot price Longer-Term Near-Term Futures Price Futures Price $3.36 $2.34 $2.43\"><p>Smith researched the energy sector and came to the following conclusions:<\/p><p>1. Energy, unlike softs, requires minimal storage and is consumed in realtime. 2. The producers have been less concerned about price than the consumers.<\/p><p>After the energy sector discussion, Dean reviews DC’s performance of a long position in the gold<\/p><p>futures contract. He notes that the portfolio earned a 7% roll return after the contract was rolled<\/p><p>forward and a 6% price return on the gold futures position last year. The long position was held<\/p><p>with a collateral equal to 100% of the position at a risk-free rate of 2%.<\/p><p>Smith asks Dean, “How will the state of the futures market affect the roll return?”<\/p><p>Dean responds with the following statements:<\/p><p><b>Statement 4:<\/b> When a futures market is in contango, the roll returns will be negative.<\/p><p><b>Statement 5:<\/b> When a futures market is in backwardation, the roll return will be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0028.webp\" style=\"max-width:min(100%,77px)\" alt=\"positive.\"><p>Due to a decrease in drilling activity in Russia and the North Sea, Dean believes the price of<\/p><p>natural gas will increase. The expected price volatility of natural gas has been higher than the<\/p><p>actual price volatility, and the trend is expected to persist. Dean also expects the S&amp;P GSCI<\/p><p>Natural Gas Index to increase.<\/p><p>Smith mentions that there are several ways that they can use swaps to take advantage of Dean’s<\/p><p>expectations about natural gas. Such positions are 1) a short position in excess return swap<\/p><p>based on the current level of the S&amp;P GSCI Natural Gas Index, 2) a long volatility swap on<\/p><p>natural gas, and 3) a basis swap long on natural gas.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Dean’s statements regarding roll returns is correct :<\/p><\/div>", "subj": "alternatives"}, {"n": 21, "q": "Given the current market environment, VCM's equity-related strategy has identified a long/short opportunity with an expected return difference of 8%. If the position sizes of the long and short sides are $50 million and $30 million respectively, the expected relative return (in dollars) from this long/short strategy is closest?", "opts": ["$1.6 million", "$4 million", "$14 million"], "ans": "A", "expl": "The expected relative return from VCM's long/short equity-related strategy can be calculated by first determining the individual returns from the long and short positions and then finding the difference between these two values. The long position, valued at $50 million, is expected to yield an 8% return, which translates to: Similarly, the short position, valued at $30 million, also aims for an 8% return, resulting in a monetary gain (which in the case of a short position, benefits from a decline in value) of: The relative return, or the net gain from this long/short strategy, is the difference between the return from the long position and the return from the short position: This calculation shows that the expected relative return from this strategy is $1.6 million, making option A the correct answer. B is incorrect. It suggests a relative return of $4 million, which incorrectly assumes that the return from the long position is not offset by the return from the short position. In a long/short strategy, the relative return is the net difference between the gains of the long position and the gains (or losses avoided) of the short position. As calculated, the correct net relative return is $1.6 million, not $4 million. This option fails to account for the impact of the short position's performance on the overall strategy's return. C is incorrect. It proposes a relative return of $14 million, which is significantly higher than the calculated value. This option might result from a misunderstanding of how returns in a long/short strategy are computed. It appears to incorrectly aggregate or confuse the total potential market exposure ($80 million from both positions) with the actual net return calculation. The correct approach, as shown, involves calculating the returns from each position separately and then subtracting them, yielding the correct relative return of $1.6 million. ", "explhtml": "<p>The expected relative return from VCM&#x27;s long/short equity-related strategy can be calculated by first determining the individual returns from the long and short positions and then finding the difference between these two values. The long position, valued at $50 million, is expected to yield an 8% return, which translates to:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0031.webp\" style=\"max-width:min(100%,461px)\" alt=\"Return from Long Position = $50 million × 8% = $4 million\"><p>Similarly, the short position, valued at $30 million, also aims for an 8% return, resulting in a monetary gain (which in the case of a short position, benefits from a decline in value) of:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0032.webp\" style=\"max-width:min(100%,479px)\" alt=\"Return from Short Position = $30 million × 8% = $2.4 million\"><p>The relative return, or the net gain from this long/short strategy, is the difference between the return from the long position and the return from the short position:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0033.webp\" style=\"max-width:min(100%,451px)\" alt=\"Relative Return = $4 million −$2.4 million = $1.6 million\"><p>This calculation shows that the expected relative return from this strategy is $1.6 million, making option A the correct answer.<\/p><p><b>B is incorrect<\/b>. It suggests a relative return of $4 million, which incorrectly assumes that the return from the long position is not offset by the return from the short position. In a long/short strategy, the relative return is the net difference between the gains of the long position and the gains (or losses avoided) of the short position. As calculated, the correct net relative return is $1.6 million, not $4 million. This option fails to account for the impact of the short position&#x27;s performance on the overall strategy&#x27;s return.<\/p><p><b>C is incorrect<\/b>. It proposes a relative return of $14 million, which is significantly higher than the calculated value. This option might result from a misunderstanding of how returns in a long/short strategy are computed. It appears to incorrectly aggregate or confuse the total potential market exposure ($80 million from both positions) with the actual net return calculation. The correct approach, as shown, involves calculating the returns from each position separately and then subtracting them, yielding the correct relative return of $1.6 million. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Valiant Capital Management (VCM)<\/summary><div class=\"vig-body\"><p>Valiant Capital Management (VCM) is a hedge fund with assets under management (AUM) of $3<\/p><p>billion. VCM offers its clients diversified investment strategies, aiming to achieve superior<\/p><p>returns with managed risk exposure. The fund is known for its flexible mandates, aggressively<\/p><p>pursuing opportunities across various asset classes, and utilizing leverage to amplify returns.<\/p><p>VCM&#x27;s strategic focus spans equity-related, event-driven, relative value, and opportunistic<\/p><p>investments. Each strategy is designed to perform under different market conditions while<\/p><p>contributing to the overall portfolio&#x27;s risk-return profile.<\/p><p>Equity-Related Strategy:<\/p><p>Long/short positions in domestic and international equities, sometimes leveraging<\/p><p>quantitative approaches to identify short-term valuation discrepancies.<\/p><p>Event-Driven Strategy:<\/p><p>Focus on corporate events like mergers, acquisitions, restructurings, and other<\/p><p>company-specific catalysts that can create pricing inefficiencies.<\/p><p>Relative Value Strategy:<\/p><p>Capitalizes on divergences between related securities or markets through pairs<\/p><p>trading, arbitrage, and exploiting interest rate differentials.<\/p><p>Opportunistic Strategy:<\/p><p>Invests in various niche markets, distressed assets, and other opportunities outside<\/p><p>traditional investments, offering explosive return potential with higher risk.<\/p><p>VCM&#x27;s use of leverage varies depending on the strategy and market opportunities. The fund also<\/p><p>remains mindful of the illiquidity premium and uses its flexibility to navigate through periods of<\/p><p>market stress.<\/p><p><b>Investment Scenario<\/b><\/p><p>Given the current market environment, with increased volatility and uncertainty, VCM assesses its position and strategizes to take advantage of the situation. The fund is considering<\/p><p>restructuring its portfolio by rebalancing among its existing strategies to optimize the risk-return<\/p><p>profile. VCM&#x27;s asset allocation currently includes Equity-related (30%), Event-driven (25%),<\/p><p>Relative Value (20%), and Opportunistic strategies (25%). An equal weighting (50% each)<\/p><p>between the equity-related and relative value strategies and that the relative value strategy has<\/p><p>the same volatility as the equity-related strategy (14%). An equal weighting (50% each) between<\/p><p>the equity-related and relative value strategies and that the relative value strategy has the same<\/p><p>volatility as the equity-related strategy (14%).<\/p><\/div><\/details><div class=\"qtext\"><p>Given the current market environment, VCM&#x27;s equity-related strategy has identified a long/short opportunity with an expected return difference of 8%. If the position sizes of the long and short sides are $50 million and $30 million respectively, the expected relative return (in dollars) from this long/short strategy is closest?<\/p><\/div>", "subj": "alternatives"}, {"n": 22, "q": "VCM's relative value strategy has a targeted unlevered return of 10% on capital employed. If the strategy uses leverage to triple the size of the capital employed and maintains the same level of return on a larger asset base, what would be the levered return on the original capital employed?", "opts": ["10%", "30%", "20%"], "ans": "B", "expl": "The calculation of levered return involves multiplying the unlevered return by the leverage factor. In the case of VCM's relative value strategy, the unlevered return is 10%. When leverage is applied to triple the size of the capital employed, the leverage factor is 3. Therefore, the levered return on the original capital employed can be calculated as follows: This calculation shows that by using leverage to increase the capital employed, the return on the original capital also increases proportionally. This is a fundamental principle in finance where leverage amplifies returns relative to the amount of capital originally invested, assuming the rate of return remains constant on the total capital. A is incorrect. It suggests that the levered return remains at 10%, which is the same as the unlevered return. This is incorrect because leveraging involves using borrowed funds to increase the potential return on investment. The essence of leveraging in investment strategies is to amplify the returns on the original capital employed. By tripling the capital through leverage, the return should also triple, assuming the return rate on the total capital does not change. Therefore, maintaining a 10% return despite tripling the capital employed contradicts the fundamental effect of leverage. C is incorrect. It proposes a 20% return, which implies a doubling of the original return rather than tripling. This option does not accurately reflect the leverage factor of 3 that is applied in the scenario. The calculation of levered return must directly correspond to the leverage factor used. In this case, a leverage factor of 3 means the returns are tripled, not doubled. The incorrect leverage factor leads to an understated return, failing to properly account for the leverage strategy employed by VCM. ", "explhtml": "<p>The calculation of levered return involves multiplying the unlevered return by the leverage factor. In the case of VCM&#x27;s relative value strategy, the unlevered return is 10%. When leverage is applied to triple the size of the capital employed, the leverage factor is 3. Therefore, the levered return on the original capital employed can be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0034.webp\" style=\"max-width:min(100%,550px)\" alt=\"10% (Unlevered Return) × 3 (Leverage Factor) = 30% (Levered Return)\"><p>This calculation shows that by using leverage to increase the capital employed, the return on the original capital also increases proportionally. This is a fundamental principle in finance where leverage amplifies returns relative to the amount of capital originally invested, assuming the rate of return remains constant on the total capital.<\/p><p><b>A is incorrect<\/b>. It suggests that the levered return remains at 10%, which is the same as the unlevered return. This is incorrect because leveraging involves using borrowed funds to increase the potential return on investment. The essence of leveraging in investment strategies is to amplify the returns on the original capital employed. By tripling the capital through leverage, the return should also triple, assuming the return rate on the total capital does not change. Therefore, maintaining a 10% return despite tripling the capital employed contradicts the fundamental effect of leverage.<\/p><p><b>C is incorrect<\/b>. It proposes a 20% return, which implies a doubling of the original return rather than tripling. This option does not accurately reflect the leverage factor of 3 that is applied in the scenario. The calculation of levered return must directly correspond to the leverage factor used. In this case, a leverage factor of 3 means the returns are tripled, not doubled. The incorrect leverage factor leads to an understated return, failing to properly account for the leverage strategy employed by VCM. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (d) Discuss investment characteristics, strategy implementation, and role in a portfolio of relative value hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Valiant Capital Management (VCM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Valiant Capital Management (VCM) is a hedge fund with assets under management (AUM) of $3<\/p><p>billion. VCM offers its clients diversified investment strategies, aiming to achieve superior<\/p><p>returns with managed risk exposure. The fund is known for its flexible mandates, aggressively<\/p><p>pursuing opportunities across various asset classes, and utilizing leverage to amplify returns.<\/p><p>VCM&#x27;s strategic focus spans equity-related, event-driven, relative value, and opportunistic<\/p><p>investments. Each strategy is designed to perform under different market conditions while<\/p><p>contributing to the overall portfolio&#x27;s risk-return profile.<\/p><p>Equity-Related Strategy:<\/p><p>Long/short positions in domestic and international equities, sometimes leveraging<\/p><p>quantitative approaches to identify short-term valuation discrepancies.<\/p><p>Event-Driven Strategy:<\/p><p>Focus on corporate events like mergers, acquisitions, restructurings, and other<\/p><p>company-specific catalysts that can create pricing inefficiencies.<\/p><p>Relative Value Strategy:<\/p><p>Capitalizes on divergences between related securities or markets through pairs<\/p><p>trading, arbitrage, and exploiting interest rate differentials.<\/p><p>Opportunistic Strategy:<\/p><p>Invests in various niche markets, distressed assets, and other opportunities outside<\/p><p>traditional investments, offering explosive return potential with higher risk.<\/p><p>VCM&#x27;s use of leverage varies depending on the strategy and market opportunities. The fund also<\/p><p>remains mindful of the illiquidity premium and uses its flexibility to navigate through periods of<\/p><p>market stress.<\/p><p><b>Investment Scenario<\/b><\/p><p>Given the current market environment, with increased volatility and uncertainty, VCM assesses its position and strategizes to take advantage of the situation. The fund is considering<\/p><p>restructuring its portfolio by rebalancing among its existing strategies to optimize the risk-return<\/p><p>profile. VCM&#x27;s asset allocation currently includes Equity-related (30%), Event-driven (25%),<\/p><p>Relative Value (20%), and Opportunistic strategies (25%). An equal weighting (50% each)<\/p><p>between the equity-related and relative value strategies and that the relative value strategy has<\/p><p>the same volatility as the equity-related strategy (14%). An equal weighting (50% each) between<\/p><p>the equity-related and relative value strategies and that the relative value strategy has the same<\/p><p>volatility as the equity-related strategy (14%).<\/p><\/div><\/details><div class=\"qtext\"><p>VCM&#x27;s relative value strategy has a targeted unlevered return of 10% on capital employed. If the strategy uses leverage to triple the size of the capital employed and maintains the same level of return on a larger asset base, what would be the levered return on the original capital employed?<\/p><\/div>", "subj": "alternatives"}, {"n": 23, "q": "VCM's relative value strategy realized an annual return of 14%, whereas the opportunistic strategy yielded an annual return of 22%. If the portfolio overall achieved a return of 16%, and assuming no other strategies contributed to the portfolio during that period, what proportion of the portfolio's total return is attributable to the opportunistic strategy?", "opts": ["25%", "50%", "75%"], "ans": "A", "expl": "The calculation of the proportion of the total return attributable to the opportunistic strategy involves understanding the contribution of each strategy to the overall portfolio return. Given that the relative value strategy yielded a 14% return and the opportunistic strategy yielded a 22% return, while the overall portfolio return was 16%, we can determine the proportion of the total return attributable to the opportunistic strategy using the following formula: This calculation shows that 25% of the total return of the portfolio is attributable to the opportunistic strategy. This is because the difference between the portfolio return and the relative value return is proportionally attributed to the difference between the returns of the opportunistic and relative value strategies. B is incorrect. It suggests that 50% of the total return is attributable to the opportunistic strategy. This is incorrect as the mathematical calculation clearly shows a different result. By substituting the values into the formula, we find that the proportion is actually 25%, not 50%. The error in option B likely arises from a misunderstanding of how the returns of individual strategies contribute proportionally to the overall portfolio return. It is crucial to apply the correct formula and accurately use the given returns to determine the correct proportion. C is incorrect. It suggests that 75% of the total return is attributable to the opportunistic strategy. This is incorrect and significantly overestimates the contribution of the opportunistic strategy. The calculation using the correct formula shows that the contribution is only 25%. The incorrect assumption in option C could stem from an overestimation of the impact of the higher return rate of the opportunistic strategy without considering the mathematical relationship and proportionality between the different strategy returns and the overall portfolio return. ", "explhtml": "<p>The calculation of the proportion of the total return attributable to the opportunistic strategy involves understanding the contribution of each strategy to the overall portfolio return. Given that the relative value strategy yielded a 14% return and the opportunistic strategy yielded a 22% return, while the overall portfolio return was 16%, we can determine the proportion of the total return attributable to the opportunistic strategy using the following formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0035.webp\" style=\"max-width:min(100%,370px)\" alt=\"portfolio return −relative value return x = opportunistic return −relative value return 0.16 −0.14 x = 0.22 −0.14 = 0.25 (or 25%)\"><p>This calculation shows that 25% of the total return of the portfolio is attributable to the opportunistic strategy. This is because the difference between the portfolio return and the relative value return is proportionally attributed to the difference between the returns of the opportunistic and relative value strategies.<\/p><p><b>B is incorrect<\/b>. It suggests that 50% of the total return is attributable to the opportunistic strategy. This is incorrect as the mathematical calculation clearly shows a different result. By substituting the values into the formula, we find that the proportion is actually 25%, not 50%. The error in option B likely arises from a misunderstanding of how the returns of individual strategies contribute proportionally to the overall portfolio return. It is crucial to apply the correct formula and accurately use the given returns to determine the correct proportion.<\/p><p><b>C is incorrect<\/b>. It suggests that 75% of the total return is attributable to the opportunistic strategy. This is incorrect and significantly overestimates the contribution of the opportunistic strategy. The calculation using the correct formula shows that the contribution is only 25%. The incorrect assumption in option C could stem from an overestimation of the impact of the higher return rate of the opportunistic strategy without considering the mathematical relationship and proportionality between the different strategy returns and the overall portfolio return. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Valiant Capital Management (VCM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Valiant Capital Management (VCM) is a hedge fund with assets under management (AUM) of $3<\/p><p>billion. VCM offers its clients diversified investment strategies, aiming to achieve superior<\/p><p>returns with managed risk exposure. The fund is known for its flexible mandates, aggressively<\/p><p>pursuing opportunities across various asset classes, and utilizing leverage to amplify returns.<\/p><p>VCM&#x27;s strategic focus spans equity-related, event-driven, relative value, and opportunistic<\/p><p>investments. Each strategy is designed to perform under different market conditions while<\/p><p>contributing to the overall portfolio&#x27;s risk-return profile.<\/p><p>Equity-Related Strategy:<\/p><p>Long/short positions in domestic and international equities, sometimes leveraging<\/p><p>quantitative approaches to identify short-term valuation discrepancies.<\/p><p>Event-Driven Strategy:<\/p><p>Focus on corporate events like mergers, acquisitions, restructurings, and other<\/p><p>company-specific catalysts that can create pricing inefficiencies.<\/p><p>Relative Value Strategy:<\/p><p>Capitalizes on divergences between related securities or markets through pairs<\/p><p>trading, arbitrage, and exploiting interest rate differentials.<\/p><p>Opportunistic Strategy:<\/p><p>Invests in various niche markets, distressed assets, and other opportunities outside<\/p><p>traditional investments, offering explosive return potential with higher risk.<\/p><p>VCM&#x27;s use of leverage varies depending on the strategy and market opportunities. The fund also<\/p><p>remains mindful of the illiquidity premium and uses its flexibility to navigate through periods of<\/p><p>market stress.<\/p><p><b>Investment Scenario<\/b><\/p><p>Given the current market environment, with increased volatility and uncertainty, VCM assesses its position and strategizes to take advantage of the situation. The fund is considering<\/p><p>restructuring its portfolio by rebalancing among its existing strategies to optimize the risk-return<\/p><p>profile. VCM&#x27;s asset allocation currently includes Equity-related (30%), Event-driven (25%),<\/p><p>Relative Value (20%), and Opportunistic strategies (25%). An equal weighting (50% each)<\/p><p>between the equity-related and relative value strategies and that the relative value strategy has<\/p><p>the same volatility as the equity-related strategy (14%). An equal weighting (50% each) between<\/p><p>the equity-related and relative value strategies and that the relative value strategy has the same<\/p><p>volatility as the equity-related strategy (14%).<\/p><\/div><\/details><div class=\"qtext\"><p>VCM&#x27;s relative value strategy realized an annual return of 14%, whereas the opportunistic strategy yielded an annual return of 22%. If the portfolio overall achieved a return of 16%, and assuming no other strategies contributed to the portfolio during that period, what proportion of the portfolio&#x27;s total return is attributable to the opportunistic strategy?<\/p><\/div>", "subj": "alternatives"}, {"n": 24, "q": "VCM's opportunistic strategy expects to capitalize on a unique market opportunity that could provide a return of 20% over the next year. Assuming VCM allocates 25% of its portfolio to this strategy, and the rest of the portfolio is expected to return 8% annually, what is the expected overall portfolio return due to this single opportunity?", "opts": ["8%", "11%", "25%"], "ans": "B", "expl": "The correct answer is option B, which calculates the expected overall portfolio return by considering the weighted contributions of different strategies within the portfolio. Specifically, the opportunistic strategy, which constitutes 25% of the portfolio, is expected to yield a 20% return. The remaining 75% of the portfolio, encompassing the other strategies, is anticipated to return 8%. The calculation for the overall expected return is thus a weighted average: This calculation shows that the opportunistic strategy contributes 5% to the overall return (25% of 20%), while the rest of the portfolio contributes 6% (75% of 8%). Adding these together gives an overall expected return of 11% for the entire portfolio. A is incorrect. It suggests that the overall portfolio return would be 8%, which incorrectly assumes that all components of the portfolio, including the opportunistic strategy, would yield only an 8% return. This overlooks the higher expected return of 20% from the opportunistic strategy, which significantly influences the portfolio's overall performance due to its 25% allocation. Ignoring this higher return underestimates the total portfolio return, failing to account for the strategic impact of the opportunistic investments. C is incorrect. It indicates a 25% return, which would only be correct if the entire portfolio were allocated to the opportunistic strategy yielding 20%, or if the opportunistic strategy itself yielded a 25% return, neither of which is the case. This option incorrectly interprets the 25% portfolio allocation to the opportunistic strategy as the return percentage, confusing the proportion of the investment with its performance outcome. It fails to consider the blended effect of the different strategies' returns weighted by their respective allocations in the portfolio. ", "explhtml": "<p>The correct answer is option B, which calculates the expected overall portfolio return by considering the weighted contributions of different strategies within the portfolio. Specifically, the opportunistic strategy, which constitutes 25% of the portfolio, is expected to yield a 20% return. The remaining 75% of the portfolio, encompassing the other strategies, is anticipated to return 8%. The calculation for the overall expected return is thus a weighted average:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0036.webp\" style=\"max-width:min(100%,337px)\" alt=\"0.25 × 20% + 0.75 × 8% = 5% + 6% = 11%\"><p>This calculation shows that the opportunistic strategy contributes 5% to the overall return (25% of 20%), while the rest of the portfolio contributes 6% (75% of 8%). Adding these together gives an overall expected return of 11% for the entire portfolio.<\/p><p><b>A is incorrect<\/b>. It suggests that the overall portfolio return would be 8%, which incorrectly assumes that all components of the portfolio, including the opportunistic strategy, would yield only an 8% return. This overlooks the higher expected return of 20% from the opportunistic strategy, which significantly influences the portfolio&#x27;s overall performance due to its 25% allocation. Ignoring this higher return underestimates the total portfolio return, failing to account for the strategic impact of the opportunistic investments.<\/p><p><b>C is incorrect<\/b>. It indicates a 25% return, which would only be correct if the entire portfolio were allocated to the opportunistic strategy yielding 20%, or if the opportunistic strategy itself yielded a 25% return, neither of which is the case. This option incorrectly interprets the 25% portfolio allocation to the opportunistic strategy as the return percentage, confusing the proportion of the investment with its performance outcome. It fails to consider the blended effect of the different strategies&#x27; returns weighted by their respective allocations in the portfolio. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 21–24 · Valiant Capital Management (VCM)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Valiant Capital Management (VCM) is a hedge fund with assets under management (AUM) of $3<\/p><p>billion. VCM offers its clients diversified investment strategies, aiming to achieve superior<\/p><p>returns with managed risk exposure. The fund is known for its flexible mandates, aggressively<\/p><p>pursuing opportunities across various asset classes, and utilizing leverage to amplify returns.<\/p><p>VCM&#x27;s strategic focus spans equity-related, event-driven, relative value, and opportunistic<\/p><p>investments. Each strategy is designed to perform under different market conditions while<\/p><p>contributing to the overall portfolio&#x27;s risk-return profile.<\/p><p>Equity-Related Strategy:<\/p><p>Long/short positions in domestic and international equities, sometimes leveraging<\/p><p>quantitative approaches to identify short-term valuation discrepancies.<\/p><p>Event-Driven Strategy:<\/p><p>Focus on corporate events like mergers, acquisitions, restructurings, and other<\/p><p>company-specific catalysts that can create pricing inefficiencies.<\/p><p>Relative Value Strategy:<\/p><p>Capitalizes on divergences between related securities or markets through pairs<\/p><p>trading, arbitrage, and exploiting interest rate differentials.<\/p><p>Opportunistic Strategy:<\/p><p>Invests in various niche markets, distressed assets, and other opportunities outside<\/p><p>traditional investments, offering explosive return potential with higher risk.<\/p><p>VCM&#x27;s use of leverage varies depending on the strategy and market opportunities. The fund also<\/p><p>remains mindful of the illiquidity premium and uses its flexibility to navigate through periods of<\/p><p>market stress.<\/p><p><b>Investment Scenario<\/b><\/p><p>Given the current market environment, with increased volatility and uncertainty, VCM assesses its position and strategizes to take advantage of the situation. The fund is considering<\/p><p>restructuring its portfolio by rebalancing among its existing strategies to optimize the risk-return<\/p><p>profile. VCM&#x27;s asset allocation currently includes Equity-related (30%), Event-driven (25%),<\/p><p>Relative Value (20%), and Opportunistic strategies (25%). An equal weighting (50% each)<\/p><p>between the equity-related and relative value strategies and that the relative value strategy has<\/p><p>the same volatility as the equity-related strategy (14%). An equal weighting (50% each) between<\/p><p>the equity-related and relative value strategies and that the relative value strategy has the same<\/p><p>volatility as the equity-related strategy (14%).<\/p><\/div><\/details><div class=\"qtext\"><p>VCM&#x27;s opportunistic strategy expects to capitalize on a unique market opportunity that could provide a return of 20% over the next year. Assuming VCM allocates 25% of its portfolio to this strategy, and the rest of the portfolio is expected to return 8% annually, what is the expected overall portfolio return due to this single opportunity?<\/p><\/div>", "subj": "alternatives"}, {"n": 25, "q": "If the merger arbitrage strategy is expected to return 10% on the $100 million invested, and there is a 1% chance of deal failure resulting in a complete loss of the investment, what is the expected value of the fund's position at the end of the quarter?", "opts": ["$100 million", "$109 million", "$8.9 million"], "ans": "B", "expl": "The expected value of the merger arbitrage strategy can be calculated by considering both the probability of success and the probability of failure. The strategy has a 99% chance of success, yielding a 10% return on the $100 million investment, which equals $10 million. Conversely, there is a 1% chance of failure, where the entire $100 million investment is lost. The expected value (EV) of the strategy is calculated as follows: Adding this expected value gain to the initial investment: When rounded, this total expected value is approximately $109 million, making option B the correct answer. A is incorrect. It suggests that the expected value of the fund's position remains at $100 million, ignoring both the potential gain from the strategy's success and the potential total loss from its failure. The calculation of expected value must account for both outcomes weighted by their probabilities, which increases from the initial investment, not merely its retention. C is incorrect. It incorrectly identifies the expected value gain alone as the total expected value at the end of the quarter. The $8.9 million represents only the net gain after considering the probabilities of success and failure. The total expected value should also include the initial investment, resulting in a correct total of approximately $109 million, not just the $8.9 million gain. ", "explhtml": "<p>The expected value of the merger arbitrage strategy can be calculated by considering both the probability of success and the probability of failure. The strategy has a 99% chance of success, yielding a 10% return on the $100 million investment, which equals $10 million. Conversely, there is a 1% chance of failure, where the entire $100 million investment is lost. The expected value (EV) of the strategy is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0037.webp\" style=\"max-width:min(100%,517px)\" alt=\"Expected value (EV) = (0.99 × $10 million) −(0.01 × $100 million) Expected value (EV) = $9.9 million −$1 million = $8.9 million\"><p>Adding this expected value gain to the initial investment:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0038.webp\" style=\"max-width:min(100%,434px)\" alt=\"Total EV = $100 million + $8.9 million = $108.9 million\"><p>When rounded, this total expected value is approximately $109 million, making option B the correct answer.<\/p><p><b>A is incorrect<\/b>. It suggests that the expected value of the fund&#x27;s position remains at $100 million, ignoring both the potential gain from the strategy&#x27;s success and the potential total loss from its failure. The calculation of expected value must account for both outcomes weighted by their probabilities, which increases from the initial investment, not merely its retention.<\/p><p><b>C is incorrect<\/b>. It incorrectly identifies the expected value gain alone as the total expected value at the end of the quarter. The $8.9 million represents only the net gain after considering the probabilities of success and failure. The total expected value should also include the initial investment, resulting in a correct total of approximately $109 million, not just the $8.9 million gain. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (i) evaluate the impact of an allocation to a hedge fund strategy in a traditional investment portfolio.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Archon Capital Management<\/summary><div class=\"vig-body\"><p>Archon Capital Management is a well-established hedge fund operational for over two decades.<\/p><p>The fund has been recognized for its sophisticated investment strategies across various asset<\/p><p>classes and methodologies. With $5 billion in assets under management (AUM) and several<\/p><p>funds, Archon&#x27;s investment committee is reviewing strategies from the previous quarter for<\/p><p>evaluation and potential rebalancing.<\/p><p>Highlighted strategies include:<\/p><p>1. <b>Equity Long/Short Strategy<\/b>: Aiming to exploit market inefficiencies, with notional<\/p><p>values of $500 million (long) and $300 million (short), utilizing 2:1 leverage on longs and an annual borrowing cost of 2% for shorts.<\/p><p>2. <b>Merger Arbitrage Strategy<\/b>: An event-driven strategy focusing on price discrepancies<\/p><p>in mergers, with $100 million allocated and a 10% expected average return.<\/p><p>3. <b>Global Macro Strategy<\/b>: Trading on macroeconomic indicators across asset classes,<\/p><p>with $200 million allocated.<\/p><p>4. <b>Relative Value Strategy<\/b>: Arbitrage opportunities within fixed income, with $150 million<\/p><p>dedicated.<\/p><p>5. <b>Volatility Arbitrage Strategy<\/b>: Benefiting from volatility discrepancies using<\/p><p>instruments like options and VIX futures, with $100 million invested.<\/p><p>The committee requires performance, risk, and optimization analytics to inform their decisions.<\/p><\/div><\/details><div class=\"qtext\"><p>If the merger arbitrage strategy is expected to return 10% on the $100 million invested, and there is a 1% chance of deal failure resulting in a complete loss of the investment, what is the expected value of the fund&#x27;s position at the end of the quarter?<\/p><\/div>", "subj": "alternatives"}, {"n": 26, "q": "Assuming the Global Macro Strategy yielded a 15% return and the fund uses a performance fee structure where it charges 20% on profits, what is the total fee charged by the fund on the returns of this strategy?", "opts": ["$6 million", "$30 million", "$40 million"], "ans": "A", "expl": "The correct answer is option A, which calculates the performance fee based on the returns from the Global Macro Strategy. Initially, we determine the total return from this strategy by applying the 15% return rate to the $200 million allocated to this strategy. This calculation is as follows: Next, the performance fee charged by the fund is 20% of the profits generated from this strategy. Therefore, the calculation for the performance fee is: This calculation shows that the fund charges a total fee of $6 million on the returns from the Global Macro Strategy, confirming that option A is correct. B is incorrect. Option B suggests a fee of $30 million, which would imply that the fund is charging a 100% performance fee on the total returns, which is not consistent with the fee structure described. The fund charges only 20% on the profits, not 100%. Therefore, a $30 million fee would be excessively high and incorrect based on the given fee structure. This misunderstanding might arise if one incorrectly assumes the fee is based on the total capital allocated to the strategy ($200 million) rather than on the returns generated ($30 million). C is incorrect. Option C suggests a fee of $40 million, which exceeds even the total returns generated by the strategy. This option is not feasible as it implies a scenario where the fund not only takes all the returns as fees but also requires additional funds beyond the returns. Such a situation is illogical and impractical under the given 20% performance fee structure. This option might be considered if there was a misunderstanding about the base amount (total AUM or incorrect return calculation) used to calculate the fee.", "explhtml": "<p>The correct answer is option A, which calculates the performance fee based on the returns from the Global Macro Strategy. Initially, we determine the total return from this strategy by applying the 15% return rate to the $200 million allocated to this strategy. This calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0039.webp\" style=\"max-width:min(100%,541px)\" alt=\"Return on Global Macro Strategy = 15% × $200 million = $30 million\"><p>Next, the performance fee charged by the fund is 20% of the profits generated from this strategy. Therefore, the calculation for the performance fee is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0040.webp\" style=\"max-width:min(100%,395px)\" alt=\"Performance fee = 20% × $30 million = $6 million\"><p>This calculation shows that the fund charges a total fee of $6 million on the returns from the Global Macro Strategy, confirming that option A is correct.<\/p><p><b>B is incorrect<\/b>. Option B suggests a fee of $30 million, which would imply that the fund is charging a 100% performance fee on the total returns, which is not consistent with the fee structure described. The fund charges only 20% on the profits, not 100%. Therefore, a $30 million fee would be excessively high and incorrect based on the given fee structure. This misunderstanding might arise if one incorrectly assumes the fee is based on the total capital allocated to the strategy ($200 million) rather than on the returns generated ($30 million).<\/p><p><b>C is incorrect<\/b>. Option C suggests a fee of $40 million, which exceeds even the total returns generated by the strategy. This option is not feasible as it implies a scenario where the fund not only takes all the returns as fees but also requires additional funds beyond the returns. Such a situation is illogical and impractical under the given 20% performance fee structure. This option might be considered if there was a misunderstanding about the base amount (total AUM or incorrect return calculation) used to calculate the fee.<\/p><p class=\"los\">CFA Level II, Learning Module 4: Hedge Fund Strategies, LOS (i) evaluate the impact of an allocation to a hedge fund strategy in a traditional investment portfolio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Archon Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Archon Capital Management is a well-established hedge fund operational for over two decades.<\/p><p>The fund has been recognized for its sophisticated investment strategies across various asset<\/p><p>classes and methodologies. With $5 billion in assets under management (AUM) and several<\/p><p>funds, Archon&#x27;s investment committee is reviewing strategies from the previous quarter for<\/p><p>evaluation and potential rebalancing.<\/p><p>Highlighted strategies include:<\/p><p>1. <b>Equity Long/Short Strategy<\/b>: Aiming to exploit market inefficiencies, with notional<\/p><p>values of $500 million (long) and $300 million (short), utilizing 2:1 leverage on longs and an annual borrowing cost of 2% for shorts.<\/p><p>2. <b>Merger Arbitrage Strategy<\/b>: An event-driven strategy focusing on price discrepancies<\/p><p>in mergers, with $100 million allocated and a 10% expected average return.<\/p><p>3. <b>Global Macro Strategy<\/b>: Trading on macroeconomic indicators across asset classes,<\/p><p>with $200 million allocated.<\/p><p>4. <b>Relative Value Strategy<\/b>: Arbitrage opportunities within fixed income, with $150 million<\/p><p>dedicated.<\/p><p>5. <b>Volatility Arbitrage Strategy<\/b>: Benefiting from volatility discrepancies using<\/p><p>instruments like options and VIX futures, with $100 million invested.<\/p><p>The committee requires performance, risk, and optimization analytics to inform their decisions.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming the Global Macro Strategy yielded a 15% return and the fund uses a performance fee structure where it charges 20% on profits, what is the total fee charged by the fund on the returns of this strategy?<\/p><\/div>", "subj": "alternatives"}, {"n": 27, "q": "If the Relative Value Strategy identifies a mispricing between two bonds that allows for a 2% arbitrage gain on the $150 million allocated, assuming there are no other costs associated, what would be the absolute gain from this strategy?", "opts": ["$2 million", "$3 million", "$5 million"], "ans": "B", "expl": "The correct answer is option B, which states that the absolute gain from the Relative Value Strategy is $3 million. This conclusion is derived from calculating the gain based on the arbitrage opportunity identified. The strategy's premise is to exploit a 2% mispricing between two bonds, with a total capital allocation of $150 million. The calculation for the absolute gain is straightforward: multiply the percentage gain (2%) by the total capital allocated ($150 million). Mathematically, this is represented as: This calculation confirms that a 2% gain on $150 million results in an absolute gain of $3 million, validating that option B is correct. A is incorrect. It suggests that the absolute gain from the Relative Value Strategy would be $2 million. This is incorrect as it does not align with the given parameters of the strategy. The strategy identifies a 2% arbitrage opportunity on a $150 million investment. Using the formula for calculating absolute gain: Clearly, a 2% gain on $150 million is $3 million, not $2 million. Therefore, option A underestimates the gain by $1 million and is incorrect. C is incorrect. It estimates the absolute gain as $5 million, which significantly overstates the expected outcome based on the strategy's parameters. The calculation for the correct gain is: This calculation shows that a 2% gain on $150 million results in $3 million, not $5 million. Option C incorrectly adds an additional $2 million to the correct calculation, making it an invalid choice.", "explhtml": "<p>The correct answer is option B, which states that the absolute gain from the Relative Value Strategy is $3 million. This conclusion is derived from calculating the gain based on the arbitrage opportunity identified. The strategy&#x27;s premise is to exploit a 2% mispricing between two bonds, with a total capital allocation of $150 million. The calculation for the absolute gain is straightforward: multiply the percentage gain (2%) by the total capital allocated ($150 million). Mathematically, this is represented as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0041.webp\" style=\"max-width:min(100%,488px)\" alt=\"Absolute gain = Arbitrage gain percentage × Capital allocated Absolute gain = 2% × $150 million Absolute gain = $3 million\"><p>This calculation confirms that a 2% gain on $150 million results in an absolute gain of $3 million, validating that option B is correct.<\/p><p><b>A is incorrect<\/b>. It suggests that the absolute gain from the Relative Value Strategy would be $2 million. This is incorrect as it does not align with the given parameters of the strategy. The strategy identifies a 2% arbitrage opportunity on a $150 million investment. Using the formula for calculating absolute gain:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0042.webp\" style=\"max-width:min(100%,488px)\" alt=\"Absolute gain = Arbitrage gain percentage × Capital allocated Absolute gain = 2% × $150 million Absolute gain = $3 million\"><p>Clearly, a 2% gain on $150 million is $3 million, not $2 million. Therefore, option A underestimates the gain by $1 million and is incorrect.<\/p><p><b>C is incorrect<\/b>. It estimates the absolute gain as $5 million, which significantly overstates the expected outcome based on the strategy&#x27;s parameters. The calculation for the correct gain is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0043.webp\" style=\"max-width:min(100%,488px)\" alt=\"Absolute gain = Arbitrage gain percentage × Capital allocated\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0044.webp\" style=\"max-width:min(100%,278px)\" alt=\"Absolute gain = 2% × $150 million Absolute gain = $3 million\"><p>This calculation shows that a 2% gain on $150 million results in $3 million, not $5 million. Option C incorrectly adds an additional $2 million to the correct calculation, making it an invalid choice.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (d) Discuss investment characteristics, strategy implementation, and role in a portfolio of relative value hedge fund strategies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Archon Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Archon Capital Management is a well-established hedge fund operational for over two decades.<\/p><p>The fund has been recognized for its sophisticated investment strategies across various asset<\/p><p>classes and methodologies. With $5 billion in assets under management (AUM) and several<\/p><p>funds, Archon&#x27;s investment committee is reviewing strategies from the previous quarter for<\/p><p>evaluation and potential rebalancing.<\/p><p>Highlighted strategies include:<\/p><p>1. <b>Equity Long/Short Strategy<\/b>: Aiming to exploit market inefficiencies, with notional<\/p><p>values of $500 million (long) and $300 million (short), utilizing 2:1 leverage on longs and an annual borrowing cost of 2% for shorts.<\/p><p>2. <b>Merger Arbitrage Strategy<\/b>: An event-driven strategy focusing on price discrepancies<\/p><p>in mergers, with $100 million allocated and a 10% expected average return.<\/p><p>3. <b>Global Macro Strategy<\/b>: Trading on macroeconomic indicators across asset classes,<\/p><p>with $200 million allocated.<\/p><p>4. <b>Relative Value Strategy<\/b>: Arbitrage opportunities within fixed income, with $150 million<\/p><p>dedicated.<\/p><p>5. <b>Volatility Arbitrage Strategy<\/b>: Benefiting from volatility discrepancies using<\/p><p>instruments like options and VIX futures, with $100 million invested.<\/p><p>The committee requires performance, risk, and optimization analytics to inform their decisions.<\/p><\/div><\/details><div class=\"qtext\"><p>If the Relative Value Strategy identifies a mispricing between two bonds that allows for a 2% arbitrage gain on the $150 million allocated, assuming there are no other costs associated, what would be the absolute gain from this strategy?<\/p><\/div>", "subj": "alternatives"}, {"n": 28, "q": "The Volatility Arbitrage Strategy is structured with a delta-neutral portfolio of options. If the total delta of the long options is 1500 and the short options is -1600, what additional adjustments are needed to maintain delta neutrality?", "opts": ["Purchase options with a total delta of 100", "Purchase options with a total delta of -100", "No further adjustments are required"], "ans": "A", "expl": "The Volatility Arbitrage Strategy at Archon Capital Management involves maintaining a delta-neutral portfolio, which means the total delta of the portfolio should be zero to hedge against small price movements in the underlying asset. In this scenario, the total delta of the long options is 1500, and the total delta of the short options is -1600. Calculating the combined delta of these positions: Total delta = Delta of long options + Delta of short options = 1500 + (−1600) = −100 This calculation shows that the portfolio currently has a net delta of -100, indicating it is not delta-neutral and is slightly biased towards a decrease in the value of the underlying asset. To correct this and achieve delta neutrality, the portfolio needs an additional positive delta of 100. Therefore, purchasing options with a total delta of 100 will balance the portfolio, bringing the total delta back to zero. B is incorrect. Purchasing options with a total delta of -100 would further unbalance the portfolio. Instead of neutralizing the existing negative delta, it would increase the negative delta to -200. This action moves the portfolio further away from delta neutrality, increasing its sensitivity to downward movements in the underlying asset prices, which contradicts the strategy's objective of maintaining a neutral stance against small price movements. C is incorrect. The statement that no further adjustments are required is incorrect because the current total delta of the portfolio is -100, not zero. Maintaining the status quo means the portfolio remains biased and exposed to directional risk, which is contrary to the principles of a delta-neutral strategy. The goal of delta neutrality is to ensure the portfolio's value remains relatively stable regardless of small fluctuations in the market. Without adjusting the delta to zero, the strategy's fundamental objective is not met, potentially leading to unintended losses or reduced effectiveness of the strategy. ", "explhtml": "<p>The Volatility Arbitrage Strategy at Archon Capital Management involves maintaining a delta-neutral portfolio, which means the total delta of the portfolio should be zero to hedge against small price movements in the underlying asset. In this scenario, the total delta of the long options is 1500, and the total delta of the short options is -1600. Calculating the combined delta of these positions:<\/p><p>Total delta = Delta of long options + Delta of short options = 1500 + (−1600) = −100<\/p><p>This calculation shows that the portfolio currently has a net delta of -100, indicating it is not delta-neutral and is slightly biased towards a decrease in the value of the underlying asset. To correct this and achieve delta neutrality, the portfolio needs an additional positive delta of 100. Therefore, purchasing options with a total delta of 100 will balance the portfolio, bringing the total delta back to zero.<\/p><p><b>B is incorrect<\/b>. Purchasing options with a total delta of -100 would further unbalance the portfolio. Instead of neutralizing the existing negative delta, it would increase the negative delta to -200. This action moves the portfolio further away from delta neutrality, increasing its sensitivity to downward movements in the underlying asset prices, which contradicts the strategy&#x27;s objective of maintaining a neutral stance against small price movements.<\/p><p><b>C is incorrect<\/b>. The statement that no further adjustments are required is incorrect because the current total delta of the portfolio is -100, not zero. Maintaining the status quo means the portfolio remains biased and exposed to directional risk, which is contrary to the principles of a delta-neutral strategy. The goal of delta neutrality is to ensure the portfolio&#x27;s value remains relatively stable regardless of small fluctuations in the market. Without adjusting the delta to zero, the strategy&#x27;s fundamental objective is not met, potentially leading to unintended losses or reduced effectiveness of the strategy. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 25–28 · Archon Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Archon Capital Management is a well-established hedge fund operational for over two decades.<\/p><p>The fund has been recognized for its sophisticated investment strategies across various asset<\/p><p>classes and methodologies. With $5 billion in assets under management (AUM) and several<\/p><p>funds, Archon&#x27;s investment committee is reviewing strategies from the previous quarter for<\/p><p>evaluation and potential rebalancing.<\/p><p>Highlighted strategies include:<\/p><p>1. <b>Equity Long/Short Strategy<\/b>: Aiming to exploit market inefficiencies, with notional<\/p><p>values of $500 million (long) and $300 million (short), utilizing 2:1 leverage on longs and an annual borrowing cost of 2% for shorts.<\/p><p>2. <b>Merger Arbitrage Strategy<\/b>: An event-driven strategy focusing on price discrepancies<\/p><p>in mergers, with $100 million allocated and a 10% expected average return.<\/p><p>3. <b>Global Macro Strategy<\/b>: Trading on macroeconomic indicators across asset classes,<\/p><p>with $200 million allocated.<\/p><p>4. <b>Relative Value Strategy<\/b>: Arbitrage opportunities within fixed income, with $150 million<\/p><p>dedicated.<\/p><p>5. <b>Volatility Arbitrage Strategy<\/b>: Benefiting from volatility discrepancies using<\/p><p>instruments like options and VIX futures, with $100 million invested.<\/p><p>The committee requires performance, risk, and optimization analytics to inform their decisions.<\/p><\/div><\/details><div class=\"qtext\"><p>The Volatility Arbitrage Strategy is structured with a delta-neutral portfolio of options. If the total delta of the long options is 1500 and the short options is -1600, what additional adjustments are needed to maintain delta neutrality?<\/p><\/div>", "subj": "alternatives"}, {"n": 29, "q": "What is the notional exposure of the Convertible Arbitrage Strategy with respect to the underlying stock, assuming no market movement has taken place?", "opts": ["$7.5 million", "$120 million", "$12 million"], "ans": "A", "expl": "The notional exposure of the Convertible Arbitrage Strategy with respect to the underlying stock can be calculated by considering the total amount allocated to this strategy and the conversion rate from debt to equity. The allocation to the Convertible Arbitrage Strategy is $300 million, and the conversion rate is 40:1. This means that for every $40 of convertible bonds, they can be converted into $1 worth of stock. To find the notional exposure to the stock, we divide the total allocation by the conversion rate: B and C are incorrect. Option C suggests a notional exposure of $12 million, which is also incorrect but closer to the actual value than option B. This option might result from a calculation error or a slight misunderstanding of how the conversion rate affects the notional exposure. It's essential to apply the conversion rate precisely as defined (40:1) to avoid such discrepancies. The correct calculation method, dividing the total allocation of $300 million by the conversion rate of 40, confirms that the notional exposure is indeed $7.5 million, not $12 million.", "explhtml": "<p>The notional exposure of the Convertible Arbitrage Strategy with respect to the underlying stock can be calculated by considering the total amount allocated to this strategy and the conversion rate from debt to equity. The allocation to the Convertible Arbitrage Strategy is $300 million, and the conversion rate is 40:1. This means that for every $40 of convertible bonds, they can be converted into $1 worth of stock. To find the notional exposure to the stock, we divide the total allocation by the conversion rate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0045.webp\" style=\"max-width:min(100%,342px)\" alt=\"Conversion rate = 40 : 1 Allocation = $300 million Allocation Notional stock exposure = Conversion rate $300 million Notional stock exposure = 40 Notional stock exposure = $7.5 million\"><p><b>B and C are incorrect<\/b>. Option C suggests a notional exposure of $12 million, which is also incorrect but closer to the actual value than option B. This option might result from a calculation error or a slight misunderstanding of how the conversion rate affects the notional exposure. It&#x27;s essential to apply the conversion rate precisely as defined (40:1) to avoid such discrepancies. The correct calculation method, dividing the total allocation of $300 million by the conversion rate of 40, confirms that the notional exposure is indeed $7.5 million, not $12 million.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Orion Hedge Fund<\/summary><div class=\"vig-body\"><p>Orion Hedge Fund, a boutique investment firm with $2 billion in AUM, is known for its agile and<\/p><p>alternative investment strategies. In a rapidly shifting financial landscape, Orion&#x27;s management<\/p><p>team is assessing the performance and risk profiles of several strategies from the last six months<\/p><p>to ensure continued investor satisfaction and superior financial returns. Four of the key<\/p><p>strategies currently under scrutiny are:<\/p><p>1. <b>Convertible Arbitrage Strategy<\/b>: Orion&#x27;s initiative to profit from pricing inefficiencies<\/p><p>between a company&#x27;s convertible bonds and its stock. Currently, $300 million is allocated to this strategy, and the typical debt-to-equity conversion rate is 40:1.<\/p><p>2. <b>Distressed Securities Strategy<\/b>: This strategy involves investing in the debt and equity<\/p><p>of companies under financial distress or going through bankruptcy. Orion has committed $250 million to distressed assets with an anticipated return of 18% due to potential restructuring or recovery.<\/p><p>3. <b>Managed Futures Strategy<\/b>: An approach leveraging futures contracts on indices,<\/p><p>commodities, and rates with $350 million of AUM assigned to it. The expectation is to capture trends and momentum in these markets.<\/p><p>4. <b>Short Selling Strategy<\/b>: A speculative technique capitalizing on the anticipated decline<\/p><p>in stock prices. The strategy&#x27;s capital allocation is $100 million, and the short interest rate charged by the brokerage is 3% per annum.<\/p><p>Orion&#x27;s portfolio managers and analytics team are tasked with quantifying the performance<\/p><p>metrics as well as any potential risk mitigation strategies that could be applied moving forward.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the notional exposure of the Convertible Arbitrage Strategy with respect to the underlying stock, assuming no market movement has taken place?<\/p><\/div>", "subj": "alternatives"}, {"n": 30, "q": "If the Distressed Securities Strategy yields a higher than anticipated return at 22%, what is the additional return in dollar value over the initially expected return?", "opts": ["$8 million", "$10 million", "$12 million"], "ans": "B", "expl": "Which calculates the additional return in dollar value when the Distressed Securities Strategy yields a higher than anticipated return. Initially, the expected return rate was 18%, but the actual return achieved was 22%. The allocation to this strategy was $250 million. To find the additional return, we subtract the anticipated return rate from the actual return rate, which gives us an additional return rate of 4% (22% - 18%). Applying this additional return rate to the allocated amount, the calculation is as follows: This calculation shows that the additional return, due to the higher performance, amounts to $10 million over the initially expected return. A is incorrect. Option A suggests an additional return of $8 million, which does not align with the calculations based on the given data. Using the formula for additional return, which is the difference in percentage points between the actual and anticipated return rates multiplied by the capital allocation, the correct additional return should be calculated as follows: This calculation erroneously assumes a 2% increase rather than the correct 4%, leading to a result of $5 million, which is incorrect and does not match the $8 million suggested by option A. C is incorrect. Option C suggests an additional return of $12 million. This figure is also incorrect based on the actual calculations. If we were to assume a 6% increase in return rate instead of the correct 4%, the calculation would be: This hypothetical scenario would result in a $15 million additional return, which is still not aligned with the $12 million proposed by option C. The correct calculation based on a 4% increase yields a $10 million additional return, confirming that option C's suggestion of $12 million is incorrect.", "explhtml": "<p>Which calculates the additional return in dollar value when the Distressed Securities Strategy yields a higher than anticipated return. Initially, the expected return rate was 18%, but the actual return achieved was 22%. The allocation to this strategy was $250 million. To find the additional return, we subtract the anticipated return rate from the actual return rate, which gives us an additional return rate of 4% (22% - 18%). Applying this additional return rate to the allocated amount, the calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0046.webp\" style=\"max-width:min(100%,314px)\" alt=\"Additional return = 4% × $250 million = 0.04 × $250 million = $10 million\"><p>This calculation shows that the additional return, due to the higher performance, amounts to $10 million over the initially expected return.<\/p><p><b>A is incorrect<\/b>. Option A suggests an additional return of $8 million, which does not align with the calculations based on the given data. Using the formula for additional return, which is the difference in percentage points between the actual and anticipated return rates multiplied by the capital allocation, the correct additional return should be calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0047.webp\" style=\"max-width:min(100%,385px)\" alt=\"Incorrect additional return = 2% × $250 million = 0.02 × $250 million = $5 million\"><p>This calculation erroneously assumes a 2% increase rather than the correct 4%, leading to a result of $5 million, which is incorrect and does not match the $8 million suggested by option A.<\/p><p><b>C is incorrect<\/b>. Option C suggests an additional return of $12 million. This figure is also incorrect based on the actual calculations. If we were to assume a 6% increase in return rate instead of the correct 4%, the calculation would be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0048.webp\" style=\"max-width:min(100%,385px)\" alt=\"Incorrect additional return = 6% × $250 million = 0.06 × $250 million = $15 million\"><p>This hypothetical scenario would result in a $15 million additional return, which is still not aligned with the $12 million proposed by option C. The correct calculation based on a 4% increase yields a $10 million additional return, confirming that option C&#x27;s suggestion of $12 million is incorrect.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (f) Discuss investment characteristics, strategy implementation, and role in a portfolio of specialist hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Orion Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Hedge Fund, a boutique investment firm with $2 billion in AUM, is known for its agile and<\/p><p>alternative investment strategies. In a rapidly shifting financial landscape, Orion&#x27;s management<\/p><p>team is assessing the performance and risk profiles of several strategies from the last six months<\/p><p>to ensure continued investor satisfaction and superior financial returns. Four of the key<\/p><p>strategies currently under scrutiny are:<\/p><p>1. <b>Convertible Arbitrage Strategy<\/b>: Orion&#x27;s initiative to profit from pricing inefficiencies<\/p><p>between a company&#x27;s convertible bonds and its stock. Currently, $300 million is allocated to this strategy, and the typical debt-to-equity conversion rate is 40:1.<\/p><p>2. <b>Distressed Securities Strategy<\/b>: This strategy involves investing in the debt and equity<\/p><p>of companies under financial distress or going through bankruptcy. Orion has committed $250 million to distressed assets with an anticipated return of 18% due to potential restructuring or recovery.<\/p><p>3. <b>Managed Futures Strategy<\/b>: An approach leveraging futures contracts on indices,<\/p><p>commodities, and rates with $350 million of AUM assigned to it. The expectation is to capture trends and momentum in these markets.<\/p><p>4. <b>Short Selling Strategy<\/b>: A speculative technique cap
