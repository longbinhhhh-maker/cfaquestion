<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnalystPrep — Alternative Investments</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">

</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}

  .vig[open]>summary::before{transform:rotate(90deg)}

  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
  .expl-html .los{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
  .expl-html b{color:var(--txt)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

}

<script>
const DATA = [{"n": 1, "q": "Lewis has recommended an investment in publicly traded real estate securities because they:", "opts": ["Are liquid.", "Are inexpensive to maintain.", "Have low price and return volatility."], "ans": "A", "expl": "Publicly traded real estate securities, such as REITs, offer significant liquidity advantages over direct real estate investments. This liquidity stems from the ability to buy and sell shares on the stock exchange rapidly and with relatively low transaction costs. Unlike direct real estate investments, which involve lengthy sales processes and high transaction costs, REIT shares can be traded much like stocks. This feature is particularly beneficial for investors like Sanchez who value the ability to quickly adjust their investment positions without incurring substantial costs or delays. The liquidity of REITs is a critical factor in providing retirees with the flexibility to manage their investment portfolios according to changing financial needs or market conditions. B is incorrect. While REITs provide several benefits, they are not necessarily inexpensive to maintain. The management of REITs involves various expenses, including property management fees, administrative costs, and regulatory compliance costs. These expenses can be substantial and affect the overall returns from the investment. Additionally, REITs must distribute at least 90% of their taxable income to shareholders as dividends, which can further strain their cash reserves. Therefore, the claim that REITs are inexpensive to maintain does not hold when considering the operational and regulatory costs associated with managing these types of investments. C is incorrect. REITs, being traded on stock exchanges, are subject to market fluctuations and investor sentiment, which can lead to significant price volatility. This characteristic contrasts with the relatively stable appraised values of direct real estate investments, which are less influenced by daily market movements. For investors seeking low volatility, the price and return fluctuations associated with REITs might be a deterrent. Therefore, suggesting that REITs have low price and return volatility does not accurately reflect the nature of these securities, which can experience rapid and substantial changes in value due to external market factors. ", "explhtml": "<p>Publicly traded real estate securities, such as REITs, offer significant liquidity advantages over direct real estate investments. This liquidity stems from the ability to buy and sell shares on the stock exchange rapidly and with relatively low transaction costs. Unlike direct real estate investments, which involve lengthy sales processes and high transaction costs, REIT shares can be traded much like stocks. This feature is particularly beneficial for investors like Sanchez who value the ability to quickly adjust their investment positions without incurring substantial costs or delays. The liquidity of REITs is a critical factor in providing retirees with the flexibility to manage their investment portfolios according to changing financial needs or market conditions.<\/p><p><b>B is incorrect.<\/b> While REITs provide several benefits, they are not necessarily inexpensive to maintain. The management of REITs involves various expenses, including property management fees, administrative costs, and regulatory compliance costs. These expenses can be substantial and affect the overall returns from the investment. Additionally, REITs must distribute at least 90% of their taxable income to shareholders as dividends, which can further strain their cash reserves. Therefore, the claim that REITs are inexpensive to maintain does not hold when considering the operational and regulatory costs associated with managing these types of investments.<\/p><p><b>C is incorrect.<\/b> REITs, being traded on stock exchanges, are subject to market fluctuations and investor sentiment, which can lead to significant price volatility. This characteristic contrasts with the relatively stable appraised values of direct real estate investments, which are less influenced by daily market movements. For investors seeking low volatility, the price and return fluctuations associated with REITs might be a deterrent. Therefore, suggesting that REITs have low price and return volatility does not accurately reflect the nature of these securities, which can experience rapid and substantial changes in value due to external market factors. <\/p><p class=\"los\">Alternative Investment, Learning Module 2: Overview of Types of Real Estate Investment, LOS 2 (a): Compare the characteristics, classifications, principal risks, and basic forms of public and private real estate investments.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Aero Solutions<\/summary><div class=\"vig-body\"><p>Aero Solutions is an investment advisory firm situated in the US. Martha Lewis is an investment advisor serving the firm. Lewis has called a meeting with Raul Sanchez, a firm client, to discuss the latter’s expressed interest in real estate investment securities.<\/p><p>Sanchez instructs Lewis that the chosen investment should suit his financial circumstances and constraints during the meeting. He is retired, desires stability in income, heavily depends on his portfolio to finance his retirement living expenses, and dislikes price volatility. Lewis recommends the purchase of equity real estate investment trust (REIT) securities stating they offer numerous benefits over both real estate operating companies (REOCs) and direct investment in real estate.<\/p><p>Lewis carries the meeting forward by proposing an investment in the securities of a REIT which owns and operates warehouse facilities. Before discussing details of the investment, Lewis tells Sanchez that several variables influence the value of the investment and need to be considered.<\/p><p>Lewis proceeds to value the property using the relative value (price multiple) approach. He collects relevant information for the valuation (Exhibit) for the current year (2015) for the subject warehouse and average industry.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0006.webp\" style=\"max-width:min(100%,528px)\" alt=\"Exhibit: Cash Flow Information for Valuation (2015) Average Warehouse Industry Net operating income earned in 2015 $175,000 $180,000 Total cash rent paid during the year $35,000 $25,000 Straight-line rent $40,000 $45,000 Interest expenses $2,250 $1,890 General and administrative expenses $4,250 $4,7\"><p>Lewis concludes the meeting by addressing why multiples such as the Price/Funds from operations (P/FFO) and Price/Adjusted funds from operations (P/AFFO) may not be the perfect basis for valuation. He provides the following reasons to Sanchez to justify his stance:<\/p><p>Reason 1: Due to their lack of transparency in performance reporting, FFO and AFFO estimates are not readily available in the market<\/p><p>Reason 2: Applying the multiples to AFFO and/or FFO may not fully capture the intrinsic value of assets held by a REIT or REOC.<\/p><p>Reason 3: The constant introduction of new revenue recognition rules, and the accounting treatment of one-time gains have made these multiples difficult to compute and compare.<\/p><\/div><\/details><div class=\"qtext\"><p>Lewis has recommended an investment in publicly traded real estate securities because they:<\/p><\/div>", "subj": "alternatives"}, {"n": 2, "q": "Based on the data presented in the Exhibit and the P/AFFO multiple, the warehouse property most likely appears to be relatively:", "opts": ["Overvalued.", "Fairly valued.", "Undervalued."], "ans": "C", "expl": "To determine whether the warehouse property is overvalued, fairly valued, or undervalued, we need to calculate and compare the Price/Adjusted Funds from Operations (P/AFFO) multiple for both the warehouse and the average industry. The P/AFFO multiple o calculate and compare the Price/Adjusted Funds from Operations (P/AFFO) multiple for both the warehouse and the average industry. The P/AFFO multiple is calculated by dividing the market price per share by the Adjusted Funds from Operations (AFFO) per share. AFFO is derived by adjusting the Net Operating Income (NOI) for general and administrative expenses, interest expenses, non-cash rent, and maintenance-type capital expenditures.<\/p><p>The formula for AFFO is:<\/p><p>AFFO = NOI −General and Administrative Expenses −Interest Expenses −Non-Cash Rent −Main<\/p><p>Where Non-Cash Rent is calculated as the difference between Straight-Line Rent and Cash Rent.<\/p><p>For the warehouse:<\/p><p>AFFO (Warehouse) = $175, 000 −$4,250 −$2, 250 −($40, 000 −$35,000) −$1, 080 = $162, 420<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0007.webp\" style=\"max-width:min(100%,318px)\" alt=\"$47.56 P/AFFO (Warehouse) = $162,420 = $15.23 52,000\"><p>For the average industry:<\/p><p>AFFO (Average Industry) = $180, 000 −$4, 780 −$1, 890 −($45, 000 −$25, 000) −$2,010 = $151<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0008.webp\" style=\"max-width:min(100%,365px)\" alt=\"$52.09 P/AFFO (Average Industry) = $151,320 = $17.21 50,000\"><p>Comparing these values, the warehouse has a lower P/AFFO multiple of \\$15.23 compared to the industry average of \\$17.21, indicating that the warehouse is relatively undervalued. This lower multiple suggests that the warehouse offers more earnings relative to its price, making it an attractive investment compared to the industry average.<\/p><p><b>A is incorrect<\/b>. The option suggesting that the warehouse property is overvalued is incorrect because the P/AFFO multiple for the warehouse is lower than that of the average industry. A lower P/AFFO multiple indicates that the property is priced lower relative to its adjusted funds from operations compared to the industry, which typically suggests undervaluation rather than overvaluation.<\/p><p><b>B is incorrect<\/b>. The statement that the warehouse property is fairly valued does not hold when the P/AFFO multiple of the warehouse is compared with the industry average. The warehouse&#x27;s P/AFFO multiple being significantly lower than that of the industry average clearly points to it being undervalued, not fairly valued. This discrepancy in multiples highlights a valuation gap that favors considering the property as undervalued. <\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (d): Calculate the value of a REIT share using net asset value, price-to-FFO and price-to-AFFO, and discounted cash flow approaches<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Aero Solutions<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aero Solutions is an investment advisory firm situated in the US. Martha Lewis is an investment advisor serving the firm. Lewis has called a meeting with Raul Sanchez, a firm client, to discuss the latter’s expressed interest in real estate investment securities.<\/p><p>Sanchez instructs Lewis that the chosen investment should suit his financial circumstances and constraints during the meeting. He is retired, desires stability in income, heavily depends on his portfolio to finance his retirement living expenses, and dislikes price volatility. Lewis recommends the purchase of equity real estate investment trust (REIT) securities stating they offer numerous benefits over both real estate operating companies (REOCs) and direct investment in real estate.<\/p><p>Lewis carries the meeting forward by proposing an investment in the securities of a REIT which owns and operates warehouse facilities. Before discussing details of the investment, Lewis tells Sanchez that several variables influence the value of the investment and need to be considered.<\/p><p>Lewis proceeds to value the property using the relative value (price multiple) approach. He collects relevant information for the valuation (Exhibit) for the current year (2015) for the subject warehouse and average industry.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0006.webp\" style=\"max-width:min(100%,528px)\" alt=\"Exhibit: Cash Flow Information for Valuation (2015) Average Warehouse Industry Net operating income earned in 2015 $175,000 $180,000 Total cash rent paid during the year $35,000 $25,000 Straight-line rent $40,000 $45,000 Interest expenses $2,250 $1,890 General and administrative expenses $4,250 $4,7\"><p>Lewis concludes the meeting by addressing why multiples such as the Price/Funds from operations (P/FFO) and Price/Adjusted funds from operations (P/AFFO) may not be the perfect basis for valuation. He provides the following reasons to Sanchez to justify his stance:<\/p><p>Reason 1: Due to their lack of transparency in performance reporting, FFO and AFFO estimates are not readily available in the market<\/p><p>Reason 2: Applying the multiples to AFFO and/or FFO may not fully capture the intrinsic value of assets held by a REIT or REOC.<\/p><p>Reason 3: The constant introduction of new revenue recognition rules, and the accounting treatment of one-time gains have made these multiples difficult to compute and compare.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the data presented in the Exhibit and the P/AFFO multiple, the warehouse property most likely appears to be relatively:<\/p><\/div>", "subj": "alternatives"}, {"n": 3, "q": "Using the data in the Exhibit and assuming that the REIT does not hold debt, the property’s net asset value per share (NAVPS) is closest to:", "opts": ["$43.75.", "$42.07.", "$45.00."], "ans": "B", "expl": "To determine the net asset value per share (NAVPS) for the REIT, we start by calculating the net asset value (NAV) using the formula Given the net operating income (NOI) for the warehouse is $175,000 and the market capitalization rate is 8%, the NAV calculation is as follows: Next, we calculate the NAVPS by dividing the NAV by the number of shares outstanding for the warehouse, which is 52,000 shares. Thus, This calculation confirms that option B is correct as it matches the computed NAVPS of $42.07. A is incorrect. The error in option A arises from using the incorrect number of shares outstanding. The calculation mistakenly uses the average industry's shares outstanding of 50,000 instead of the specific warehouse's 52,000. The incorrect calculation is This results in a higher NAVPS due to dividing the NAV by a smaller number of shares, which does not reflect the actual share count of the warehouse in question. C is incorrect. It incorrectly uses the average industry's NOI instead of the specific warehouse's NOI. The calculation assumes an NOI of $180,000 and the same market cap rate of 8%, leading to a NAV of Then, dividing this NAV by the average industry's shares outstanding of 50,000 results in This calculation does not accurately represent the warehouse's financials as it uses the industry averages rather than the specific data for the warehouse. ", "explhtml": "<p>To determine the net asset value per share (NAVPS) for the REIT, we start by calculating the net asset value (NAV) using the formula<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0009.webp\" style=\"max-width:min(100%,195px)\" alt=\"NAV = NOI . Market cap rate\"><p>Given the net operating income (NOI) for the warehouse is $175,000 and the market capitalization rate is 8%, the NAV calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0010.webp\" style=\"max-width:min(100%,255px)\" alt=\"$175, 000 NAV = = $2,187, 500. 0.08\"><p>Next, we calculate the NAVPS by dividing the NAV by the number of shares outstanding for the warehouse, which is 52,000 shares. Thus,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0011.webp\" style=\"max-width:min(100%,253px)\" alt=\"$2,187,500 NAV PS = = $42.07. 52, 000\"><p>This calculation confirms that option B is correct as it matches the computed NAVPS of $42.07.<\/p><p><b>A is incorrect<\/b>. The error in option A arises from using the incorrect number of shares outstanding. The calculation mistakenly uses the average industry&#x27;s shares outstanding of 50,000 instead of the specific warehouse&#x27;s 52,000. The incorrect calculation is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0012.webp\" style=\"max-width:min(100%,253px)\" alt=\"$2,187,500 NAV PS = = $43.75. 50, 000\"><p>This results in a higher NAVPS due to dividing the NAV by a smaller number of shares, which does not reflect the actual share count of the warehouse in question.<\/p><p><b>C is incorrect<\/b>. It incorrectly uses the average industry&#x27;s NOI instead of the specific warehouse&#x27;s NOI. The calculation assumes an NOI of $180,000 and the same market cap rate of 8%, leading to a NAV of<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0013.webp\" style=\"max-width:min(100%,255px)\" alt=\"$180, 000 NAV = = $2,250, 000. 0.08\"><p>Then, dividing this NAV by the average industry&#x27;s shares outstanding of 50,000 results in<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0014.webp\" style=\"max-width:min(100%,253px)\" alt=\"$2,250,000 NAV PS = = $45.00. 50, 000\"><p>This calculation does not accurately represent the warehouse&#x27;s financials as it uses the industry averages rather than the specific data for the warehouse. <\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify the use of net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Aero Solutions<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aero Solutions is an investment advisory firm situated in the US. Martha Lewis is an investment advisor serving the firm. Lewis has called a meeting with Raul Sanchez, a firm client, to discuss the latter’s expressed interest in real estate investment securities.<\/p><p>Sanchez instructs Lewis that the chosen investment should suit his financial circumstances and constraints during the meeting. He is retired, desires stability in income, heavily depends on his portfolio to finance his retirement living expenses, and dislikes price volatility. Lewis recommends the purchase of equity real estate investment trust (REIT) securities stating they offer numerous benefits over both real estate operating companies (REOCs) and direct investment in real estate.<\/p><p>Lewis carries the meeting forward by proposing an investment in the securities of a REIT which owns and operates warehouse facilities. Before discussing details of the investment, Lewis tells Sanchez that several variables influence the value of the investment and need to be considered.<\/p><p>Lewis proceeds to value the property using the relative value (price multiple) approach. He collects relevant information for the valuation (Exhibit) for the current year (2015) for the subject warehouse and average industry.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0006.webp\" style=\"max-width:min(100%,528px)\" alt=\"Exhibit: Cash Flow Information for Valuation (2015) Average Warehouse Industry Net operating income earned in 2015 $175,000 $180,000 Total cash rent paid during the year $35,000 $25,000 Straight-line rent $40,000 $45,000 Interest expenses $2,250 $1,890 General and administrative expenses $4,250 $4,7\"><p>Lewis concludes the meeting by addressing why multiples such as the Price/Funds from operations (P/FFO) and Price/Adjusted funds from operations (P/AFFO) may not be the perfect basis for valuation. He provides the following reasons to Sanchez to justify his stance:<\/p><p>Reason 1: Due to their lack of transparency in performance reporting, FFO and AFFO estimates are not readily available in the market<\/p><p>Reason 2: Applying the multiples to AFFO and/or FFO may not fully capture the intrinsic value of assets held by a REIT or REOC.<\/p><p>Reason 3: The constant introduction of new revenue recognition rules, and the accounting treatment of one-time gains have made these multiples difficult to compute and compare.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data in the Exhibit and assuming that the REIT does not hold debt, the property’s net asset value per share (NAVPS) is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 4, "q": "Concerning why P/FFO and P/AFFO may not be the perfect multiples for valuation, Lewis is least accurate regarding:", "opts": ["Reason 1.", "Reason 2.", "Reason 3."], "ans": "A", "expl": "Lewis's statement in Reason 1 is not accurate because Funds from Operations (FFO) and Adjusted Funds from Operations (AFFO) estimates are generally available and transparent in the market. These metrics are standard in the real estate investment trust (REIT) industry and are commonly reported in financial statements and disclosures of REITs. Market data providers and financial analysts routinely track and report these figures, making them accessible to investors and advisors like Lewis. The availability of FFO and AFFO allows for a more accurate assessment of a REIT's operating performance by excluding the effects of depreciation and certain non-recurring items, which can provide a clearer picture of the operational cash flow available to shareholders. B is incorrect. Lewis's statement in Reason 2 is accurate because using multiples like Price/Funds from Operations (P/FFO) and Price/Adjusted Funds from Operations (P/AFFO) may not fully reflect the intrinsic value of the assets held by a REIT or a Real Estate Operating Company (REOC). These multiples primarily focus on the cash flow generated and can overlook the value of physical assets such as land and buildings that may not currently produce income but have potential future value. This can lead to undervaluation of properties that have significant capital appreciation potential or are strategically located, which are not captured merely through cash flow metrics. C is incorrect. Lewis's explanation in Reason 3 is also accurate. The application of P/FFO and P/AFFO multiples can be complicated by the frequent changes in accounting standards and the irregular occurrence of one-time gains or losses. These factors can distort the earnings reported by REITs, making it challenging to achieve a consistent and comparable valuation across different periods and different entities. The introduction of new revenue recognition rules and the treatment of one-time items can significantly affect the financial statements, thereby impacting the reliability of these multiples for valuation purposes. ", "explhtml": "<p>Lewis&#x27;s statement in Reason 1 is not accurate because Funds from Operations (FFO) and Adjusted Funds from Operations (AFFO) estimates are generally available and transparent in the market. These metrics are standard in the real estate investment trust (REIT) industry and are commonly reported in financial statements and disclosures of REITs. Market data providers and financial analysts routinely track and report these figures, making them accessible to investors and advisors like Lewis. The availability of FFO and AFFO allows for a more accurate assessment of a REIT&#x27;s operating performance by excluding the effects of depreciation and certain non-recurring items, which can provide a clearer picture of the operational cash flow available to shareholders.<\/p><p><b>B is incorrect<\/b>. Lewis&#x27;s statement in Reason 2 is accurate because using multiples like Price/Funds from Operations (P/FFO) and Price/Adjusted Funds from Operations (P/AFFO) may not fully reflect the intrinsic value of the assets held by a REIT or a Real Estate Operating Company (REOC). These multiples primarily focus on the cash flow generated and can overlook the value of physical assets such as land and buildings that may not currently produce income but have potential future value. This can lead to undervaluation of properties that have significant capital appreciation potential or are strategically located, which are not captured merely through cash flow metrics.<\/p><p><b>C is incorrect<\/b>. Lewis&#x27;s explanation in Reason 3 is also accurate. The application of P/FFO and P/AFFO multiples can be complicated by the frequent changes in accounting standards and the irregular occurrence of one-time gains or losses. These factors can distort the earnings reported by REITs, making it challenging to achieve a consistent and comparable valuation across different periods and different entities. The introduction of new revenue recognition rules and the treatment of one-time items can significantly affect the financial statements, thereby impacting the reliability of these multiples for valuation purposes. <\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (d): Calculate the value of a REIT share using net asset value, price-to-FFO and price-to-AFFO, and discounted cash flow approaches<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 1 · Câu 1–4 · Aero Solutions<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Aero Solutions is an investment advisory firm situated in the US. Martha Lewis is an investment advisor serving the firm. Lewis has called a meeting with Raul Sanchez, a firm client, to discuss the latter’s expressed interest in real estate investment securities.<\/p><p>Sanchez instructs Lewis that the chosen investment should suit his financial circumstances and constraints during the meeting. He is retired, desires stability in income, heavily depends on his portfolio to finance his retirement living expenses, and dislikes price volatility. Lewis recommends the purchase of equity real estate investment trust (REIT) securities stating they offer numerous benefits over both real estate operating companies (REOCs) and direct investment in real estate.<\/p><p>Lewis carries the meeting forward by proposing an investment in the securities of a REIT which owns and operates warehouse facilities. Before discussing details of the investment, Lewis tells Sanchez that several variables influence the value of the investment and need to be considered.<\/p><p>Lewis proceeds to value the property using the relative value (price multiple) approach. He collects relevant information for the valuation (Exhibit) for the current year (2015) for the subject warehouse and average industry.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0006.webp\" style=\"max-width:min(100%,528px)\" alt=\"Exhibit: Cash Flow Information for Valuation (2015) Average Warehouse Industry Net operating income earned in 2015 $175,000 $180,000 Total cash rent paid during the year $35,000 $25,000 Straight-line rent $40,000 $45,000 Interest expenses $2,250 $1,890 General and administrative expenses $4,250 $4,7\"><p>Lewis concludes the meeting by addressing why multiples such as the Price/Funds from operations (P/FFO) and Price/Adjusted funds from operations (P/AFFO) may not be the perfect basis for valuation. He provides the following reasons to Sanchez to justify his stance:<\/p><p>Reason 1: Due to their lack of transparency in performance reporting, FFO and AFFO estimates are not readily available in the market<\/p><p>Reason 2: Applying the multiples to AFFO and/or FFO may not fully capture the intrinsic value of assets held by a REIT or REOC.<\/p><p>Reason 3: The constant introduction of new revenue recognition rules, and the accounting treatment of one-time gains have made these multiples difficult to compute and compare.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning why P/FFO and P/AFFO may not be the perfect multiples for valuation, Lewis is least accurate regarding:<\/p><\/div>", "subj": "alternatives"}, {"n": 5, "q": "To meet the foundation’s stated requirements, Penn should invest in a:", "opts": ["REIT.", "REOC.", "Direct real estate investment."], "ans": "B", "expl": "Penn should consider investing in a Real Estate Operating Company (REOC) to meet the foundation's requirements for diversification and flexibility in investment and capital structure. REOCs offer significant advantages in terms of operational freedom and financial structuring. Unlike REITs, which are subject to strict regulatory requirements that limit the types of properties they can invest in and mandate a high percentage of income to be distributed as dividends, REOCs have fewer restrictions. This allows them to reinvest profits into further development or other business opportunities, which can lead to higher long-term growth potential. Additionally, REOCs are not required to distribute a majority of their income as dividends, providing them with more flexibility to use their capital to leverage opportunities and enhance returns. This aligns well with Penn's objective to select an investment that can accommodate a variety of leverage structures to potentially enhance returns. A is incorrect. Investing in a REIT may not fully meet the foundation's objectives, particularly in terms of investment flexibility and leveraging options. REITs are required by law to distribute at least 90% of their taxable income to shareholders as dividends, which significantly limits the amount of retained earnings available for reinvestment or debt servicing. This distribution requirement can constrain a REIT's ability to fund new projects or expand through reinvestment, potentially limiting growth compared to a REOC. Furthermore, REITs face restrictions on the types of properties they can invest in, which can limit diversification opportunities compared to REOCs that have no such restrictions. C is incorrect. Direct real estate investment is typically less diversified and more capital intensive, which does not align with Penn's requirement for an investment that accommodates various leverage structures and maximizes diversification. Direct investments in real estate involve purchasing property directly, which requires significant capital outlays upfront and ongoing management. Such investments are also exposed to market-specific risks, which can be more difficult to mitigate without the pooling of assets and diversification that REITs and REOCs offer. Additionally, the illiquid nature of direct real estate investments could pose a challenge in terms of flexibility and the ability to quickly adjust the portfolio in response to changes in the foundation's strategy or market conditions. ", "explhtml": "<p>Penn should consider investing in a Real Estate Operating Company (REOC) to meet the foundation&#x27;s requirements for diversification and flexibility in investment and capital structure. REOCs offer significant advantages in terms of operational freedom and financial structuring. Unlike REITs, which are subject to strict regulatory requirements that limit the types of properties they can invest in and mandate a high percentage of income to be distributed as dividends, REOCs have fewer restrictions. This allows them to reinvest profits into further development or other business opportunities, which can lead to higher long-term growth potential. Additionally, REOCs are not required to distribute a majority of their income as dividends, providing them with more flexibility to use their capital to leverage opportunities and enhance returns. This aligns well with Penn&#x27;s objective to select an investment that can accommodate a variety of leverage structures to potentially enhance returns.<\/p><p><b>A is incorrect.<\/b> Investing in a REIT may not fully meet the foundation&#x27;s objectives, particularly in terms of investment flexibility and leveraging options. REITs are required by law to distribute at least 90% of their taxable income to shareholders as dividends, which significantly limits the amount of retained earnings available for reinvestment or debt servicing. This distribution requirement can constrain a REIT&#x27;s ability to fund new projects or expand through reinvestment, potentially limiting growth compared to a REOC. Furthermore, REITs face restrictions on the types of properties they can invest in, which can limit diversification opportunities compared to REOCs that have no such restrictions.<\/p><p><b>C is incorrect.<\/b> Direct real estate investment is typically less diversified and more capital intensive, which does not align with Penn&#x27;s requirement for an investment that accommodates various leverage structures and maximizes diversification. Direct investments in real estate involve purchasing property directly, which requires significant capital outlays upfront and ongoing management. Such investments are also exposed to market-specific risks, which can be more difficult to mitigate without the pooling of assets and diversification that REITs and REOCs offer. Additionally, the illiquid nature of direct real estate investments could pose a challenge in terms of flexibility and the ability to quickly adjust the portfolio in response to changes in the foundation&#x27;s strategy or market conditions. <\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Douglas Penn<\/summary><div class=\"vig-body\"><p>The Excel Foundation is an institution providing study scholarships to individuals with exemplary academic backgrounds. Douglas Penn is the foundation’s chief investment advisor seeking to expand the policy portfolio to include a real estate allocation. Penn has identified the potential investment opportunities:<\/p><p>Real Estate Investment Trusts (REITs) - Equity<\/p><p>Real Estate Operating Companies (REOCs)<\/p><p>Direct real estate investment<\/p><p>Penn’s objective is to achieve the maximum possible diversification and select an investment that is not subject to investment restrictions. In addition, the chosen investment should be capable of accommodating a variety of leverage structures enhance returns.<\/p><p>Penn would also like to include a real estate allocation in his personal investment portfolio. However, he has limited funds on hand and is concerned that he may not be able to afford the investment.<\/p><p>Next, Penn evaluates how an investment in a REIT may differ from that in a REOC in terms of market valuations, access to equity capital, and taxation. He intends to share the results of his findings with Jane Harris, his colleague and Excel’s fixed-income advisor.<\/p><p>Penn decides to select a hotel REIT for investment. The REIT owns the hotel properties but leases all its properties to taxable REIT subsidiaries which operate them and pass rental income back to the parent REIT. Data relevant for valuing the REIT investment using the net asset value (NAV) approach is summarized in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0015.webp\" style=\"max-width:min(100%,302px)\" alt=\"Exhibit: Net Asset Value Approach\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0016.webp\" style=\"max-width:min(100%,575px)\" alt=\"Estimated next 12 months cash net operating income (NOI) $325,280 Assumed cap rate 10% Cash and cash equivalents $50,088 Land held for future development $30,100 Prepaid assets including goodwill $19,200 Intangible assets $10,068 Total debt $1,560,500 Other liabilities $150,780 Goodwill $45,000 Defe\"><\/div><\/details><div class=\"qtext\"><p>To meet the foundation’s stated requirements, Penn should invest in a:<\/p><\/div>", "subj": "alternatives"}, {"n": 6, "q": "For his personal investment portfolio, Penn’s will least likely select a:", "opts": ["REIT investment.", "REOC investment.", "Direct investment in real estate investment."], "ans": "C", "expl": "Douglas Penn, with limited funds available for investment, would find a direct real estate investment less suitable for his personal portfolio. Direct investments in real estate require substantial capital outlays, not only for the initial purchase but also for ongoing maintenance and management. Such investments are highly illiquid, meaning they cannot be quickly sold or converted into cash without a significant loss in value. This lack of liquidity poses a substantial risk for someone with limited funds, as it restricts the ability to respond to financial needs or opportunities that may arise. Additionally, direct real estate investments demand a high level of expertise in property management, further complicating the investment for individuals without this specialized knowledge. A is incorrect. A REIT investment would be more appropriate for Penn's personal portfolio compared to a direct real estate investment. REITs offer greater liquidity as they are traded on major stock exchanges, allowing investors to buy and sell shares easily, similar to stocks. This liquidity is crucial for investors with limited funds, as it provides flexibility in managing their investments according to their cash flow needs. Furthermore, REITs allow investors to gain exposure to real estate markets without the need for large upfront capital investments or deep property management expertise, as the REIT manages the properties. The fractional ownership through shares also means that investors can invest smaller amounts, making it accessible for those with limited resources. B is incorrect. Similar to REITs, Real Estate Operating Companies (REOCs) also offer a viable investment option for Penn's personal portfolio. REOCs provide liquidity and do not require large capital investments, as they are publicly traded entities. Investors can buy and sell shares of REOCs on the open market, providing flexibility and ease of entry or exit, which is beneficial for someone with limited funds. Additionally, REOCs often have a broader operational scope and may engage in development activities, offering potential for higher returns. The ability to invest in REOCs without managing the properties directly or committing large amounts of capital makes them suitable for Penn's situation.", "explhtml": "<p>Douglas Penn, with limited funds available for investment, would find a direct real estate investment less suitable for his personal portfolio. Direct investments in real estate require substantial capital outlays, not only for the initial purchase but also for ongoing maintenance and management. Such investments are highly illiquid, meaning they cannot be quickly sold or converted into cash without a significant loss in value. This lack of liquidity poses a substantial risk for someone with limited funds, as it restricts the ability to respond to financial needs or opportunities that may arise. Additionally, direct real estate investments demand a high level of expertise in property management, further complicating the investment for individuals without this specialized knowledge.<\/p><p><b>A is incorrect.<\/b> A REIT investment would be more appropriate for Penn&#x27;s personal portfolio compared to a direct real estate investment. REITs offer greater liquidity as they are traded on major stock exchanges, allowing investors to buy and sell shares easily, similar to stocks. This liquidity is crucial for investors with limited funds, as it provides flexibility in managing their investments according to their cash flow needs. Furthermore, REITs allow investors to gain exposure to real estate markets without the need for large upfront capital investments or deep property management expertise, as the REIT manages the properties. The fractional ownership through shares also means that investors can invest smaller amounts, making it accessible for those with limited resources.<\/p><p><b>B is incorrect.<\/b> Similar to REITs, Real Estate Operating Companies (REOCs) also offer a viable investment option for Penn&#x27;s personal portfolio. REOCs provide liquidity and do not require large capital investments, as they are publicly traded entities. Investors can buy and sell shares of REOCs on the open market, providing flexibility and ease of entry or exit, which is beneficial for someone with limited funds. Additionally, REOCs often have a broader operational scope and may engage in development activities, offering potential for higher returns. The ability to invest in REOCs without managing the properties directly or committing large amounts of capital makes them suitable for Penn&#x27;s situation.<\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Douglas Penn<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Excel Foundation is an institution providing study scholarships to individuals with exemplary academic backgrounds. Douglas Penn is the foundation’s chief investment advisor seeking to expand the policy portfolio to include a real estate allocation. Penn has identified the potential investment opportunities:<\/p><p>Real Estate Investment Trusts (REITs) - Equity<\/p><p>Real Estate Operating Companies (REOCs)<\/p><p>Direct real estate investment<\/p><p>Penn’s objective is to achieve the maximum possible diversification and select an investment that is not subject to investment restrictions. In addition, the chosen investment should be capable of accommodating a variety of leverage structures enhance returns.<\/p><p>Penn would also like to include a real estate allocation in his personal investment portfolio. However, he has limited funds on hand and is concerned that he may not be able to afford the investment.<\/p><p>Next, Penn evaluates how an investment in a REIT may differ from that in a REOC in terms of market valuations, access to equity capital, and taxation. He intends to share the results of his findings with Jane Harris, his colleague and Excel’s fixed-income advisor.<\/p><p>Penn decides to select a hotel REIT for investment. The REIT owns the hotel properties but leases all its properties to taxable REIT subsidiaries which operate them and pass rental income back to the parent REIT. Data relevant for valuing the REIT investment using the net asset value (NAV) approach is summarized in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0015.webp\" style=\"max-width:min(100%,302px)\" alt=\"Exhibit: Net Asset Value Approach\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0016.webp\" style=\"max-width:min(100%,575px)\" alt=\"Estimated next 12 months cash net operating income (NOI) $325,280 Assumed cap rate 10% Cash and cash equivalents $50,088 Land held for future development $30,100 Prepaid assets including goodwill $19,200 Intangible assets $10,068 Total debt $1,560,500 Other liabilities $150,780 Goodwill $45,000 Defe\"><\/div><\/details><div class=\"qtext\"><p>For his personal investment portfolio, Penn’s will least likely select a:<\/p><\/div>", "subj": "alternatives"}, {"n": 7, "q": "Penn is most likely to conclude that relative to REITs, REOCs:", "opts": ["Have higher market valuations.", "Experience less access to equity capital.", "Exempt investors from the taxation of their dividend income."], "ans": "B", "expl": "Option B is correct because Real Estate Operating Companies (REOCs) generally experience less access to equity capital compared to Real Estate Investment Trusts (REITs). REITs are favored in many equity markets due to their tax advantages and high-income distributions, which are mandated by the regulatory frameworks governing them. These frameworks often require REITs to distribute a significant portion of their taxable income as dividends, making them attractive to income-focused investors. Additionally, the transparency and regulatory oversight associated with REITs can make them more appealing to investors, thereby enhancing their ability to raise capital through equity markets. In contrast, REOCs, which do not have the same distribution requirements and may not offer the same tax advantages, often find it more challenging to attract equity capital. This difference in access to capital can significantly impact the operational and growth capabilities of REOCs relative to REITs. A is incorrect. The statement that REOCs have higher market valuations compared to REITs is incorrect because REOCs typically have lower market valuations. This is primarily due to their less favorable tax treatment and the lack of mandatory high-income distributions, which are characteristic of REITs. REITs are generally required to distribute at least 90% of their taxable income to shareholders, which can lead to higher yields and, consequently, higher market valuations. Additionally, the regulatory environment for REITs often enhances investor confidence, contributing to their higher valuations in the market compared to REOCs. C is incorrect. It is incorrect to state that REOCs exempt investors from the taxation of their dividend income. Unlike REITs, which often benefit from special tax considerations that can reduce or eliminate the taxation of dividends at the corporate level, REOCs are taxed as regular corporations. This means that dividends distributed by REOCs are subject to double taxation: once at the corporate level and again at the individual level when dividends are received by shareholders. This taxation structure can make REOCs less attractive to investors seeking tax-efficient income, thereby impacting their overall market appeal and valuation. ", "explhtml": "<p>Option B is correct because Real Estate Operating Companies (REOCs) generally experience less access to equity capital compared to Real Estate Investment Trusts (REITs). REITs are favored in many equity markets due to their tax advantages and high-income distributions, which are mandated by the regulatory frameworks governing them. These frameworks often require REITs to distribute a significant portion of their taxable income as dividends, making them attractive to income-focused investors. Additionally, the transparency and regulatory oversight associated with REITs can make them more appealing to investors, thereby enhancing their ability to raise capital through equity markets. In contrast, REOCs, which do not have the same distribution requirements and may not offer the same tax advantages, often find it more challenging to attract equity capital. This difference in access to capital can significantly impact the operational and growth capabilities of REOCs relative to REITs.<\/p><p><b>A is incorrect<\/b>. The statement that REOCs have higher market valuations compared to REITs is incorrect because REOCs typically have lower market valuations. This is primarily due to their less favorable tax treatment and the lack of mandatory high-income distributions, which are characteristic of REITs. REITs are generally required to distribute at least 90% of their taxable income to shareholders, which can lead to higher yields and, consequently, higher market valuations. Additionally, the regulatory environment for REITs often enhances investor confidence, contributing to their higher valuations in the market compared to REOCs.<\/p><p><b>C is incorrect<\/b>. It is incorrect to state that REOCs exempt investors from the taxation of their dividend income. Unlike REITs, which often benefit from special tax considerations that can reduce or eliminate the taxation of dividends at the corporate level, REOCs are taxed as regular corporations. This means that dividends distributed by REOCs are subject to double taxation: once at the corporate level and again at the individual level when dividends are received by shareholders. This taxation structure can make REOCs less attractive to investors seeking tax-efficient income, thereby impacting their overall market appeal and valuation. <\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Douglas Penn<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Excel Foundation is an institution providing study scholarships to individuals with exemplary academic backgrounds. Douglas Penn is the foundation’s chief investment advisor seeking to expand the policy portfolio to include a real estate allocation. Penn has identified the potential investment opportunities:<\/p><p>Real Estate Investment Trusts (REITs) - Equity<\/p><p>Real Estate Operating Companies (REOCs)<\/p><p>Direct real estate investment<\/p><p>Penn’s objective is to achieve the maximum possible diversification and select an investment that is not subject to investment restrictions. In addition, the chosen investment should be capable of accommodating a variety of leverage structures enhance returns.<\/p><p>Penn would also like to include a real estate allocation in his personal investment portfolio. However, he has limited funds on hand and is concerned that he may not be able to afford the investment.<\/p><p>Next, Penn evaluates how an investment in a REIT may differ from that in a REOC in terms of market valuations, access to equity capital, and taxation. He intends to share the results of his findings with Jane Harris, his colleague and Excel’s fixed-income advisor.<\/p><p>Penn decides to select a hotel REIT for investment. The REIT owns the hotel properties but leases all its properties to taxable REIT subsidiaries which operate them and pass rental income back to the parent REIT. Data relevant for valuing the REIT investment using the net asset value (NAV) approach is summarized in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0015.webp\" style=\"max-width:min(100%,302px)\" alt=\"Exhibit: Net Asset Value Approach\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0016.webp\" style=\"max-width:min(100%,575px)\" alt=\"Estimated next 12 months cash net operating income (NOI) $325,280 Assumed cap rate 10% Cash and cash equivalents $50,088 Land held for future development $30,100 Prepaid assets including goodwill $19,200 Intangible assets $10,068 Total debt $1,560,500 Other liabilities $150,780 Goodwill $45,000 Defe\"><\/div><\/details><div class=\"qtext\"><p>Penn is most likely to conclude that relative to REITs, REOCs:<\/p><\/div>", "subj": "alternatives"}, {"n": 8, "q": "Which of the following factors will Penn least likely need to consider when conducting due diligence of the hotel REIT investment?", "opts": ["The hotel REIT tends to use a high degree of financial leverage.", "Short-term leases can be positive or negative, depending on economic conditions.", "Senior management’s background, skills and length of time with the parent REIT needs to be examined."], "ans": "C", "expl": "Given that the management of the underlying properties is delegated to taxable REIT subsidiaries, the senior management's background, skills, and tenure at the parent REIT are less critical to the investment's day-to-day operations and success. The subsidiaries are responsible for the operational management of the hotel properties, which includes handling the complexities of property management and tenant relationships. Therefore, the effectiveness and qualifications of the management at the subsidiary level are more pertinent to the REIT's performance. The parent REIT's senior management's role is more about strategic oversight and financial structuring rather than direct operational management, making this factor less relevant for due diligence compared to other operational aspects. A is incorrect. The financial structure and leverage of a hotel REIT are crucial factors to consider during due diligence. Hotels, as a part of the hospitality sector, are highly sensitive to economic cycles. During downturns, reduced demand can significantly impact revenue, making high leverage risky as it could strain the REIT's ability to service debt. Conversely, in a booming economy, leverage can enhance returns but still poses a risk if market conditions change unexpectedly. Therefore, understanding the extent and terms of leverage used by the hotel REIT is essential to assessing its financial health and risk profile. B is incorrect. The nature of hotel operations involves short-term leases, which can fluctuate widely based on economic conditions. In a strong economy, short-term leases allow hotel operators to raise rates, potentially increasing revenue frequently. However, in a weak economic environment, these same short-term leases can lead to rapid declines in occupancy and daily rates, adversely affecting the REIT's financial performance. Thus, the impact of economic conditions on short-term leases is a critical factor that must be evaluated during the due diligence process.", "explhtml": "<p>Given that the management of the underlying properties is delegated to taxable REIT subsidiaries, the senior management&#x27;s background, skills, and tenure at the parent REIT are less critical to the investment&#x27;s day-to-day operations and success. The subsidiaries are responsible for the operational management of the hotel properties, which includes handling the complexities of property management and tenant relationships. Therefore, the effectiveness and qualifications of the management at the subsidiary level are more pertinent to the REIT&#x27;s performance. The parent REIT&#x27;s senior management&#x27;s role is more about strategic oversight and financial structuring rather than direct operational management, making this factor less relevant for due diligence compared to other operational aspects.<\/p><p><b>A is incorrect<\/b>. The financial structure and leverage of a hotel REIT are crucial factors to consider during due diligence. Hotels, as a part of the hospitality sector, are highly sensitive to economic cycles. During downturns, reduced demand can significantly impact revenue, making high leverage risky as it could strain the REIT&#x27;s ability to service debt. Conversely, in a booming economy, leverage can enhance returns but still poses a risk if market conditions change unexpectedly. Therefore, understanding the extent and terms of leverage used by the hotel REIT is essential to assessing its financial health and risk profile.<\/p><p><b>B is incorrect<\/b>. The nature of hotel operations involves short-term leases, which can fluctuate widely based on economic conditions. In a strong economy, short-term leases allow hotel operators to raise rates, potentially increasing revenue frequently. However, in a weak economic environment, these same short-term leases can lead to rapid declines in occupancy and daily rates, adversely affecting the REIT&#x27;s financial performance. Thus, the impact of economic conditions on short-term leases is a critical factor that must be evaluated during the due diligence process.<\/p><p class=\"los\">Alternative Investment, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 5–8 · Douglas Penn<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>The Excel Foundation is an institution providing study scholarships to individuals with exemplary academic backgrounds. Douglas Penn is the foundation’s chief investment advisor seeking to expand the policy portfolio to include a real estate allocation. Penn has identified the potential investment opportunities:<\/p><p>Real Estate Investment Trusts (REITs) - Equity<\/p><p>Real Estate Operating Companies (REOCs)<\/p><p>Direct real estate investment<\/p><p>Penn’s objective is to achieve the maximum possible diversification and select an investment that is not subject to investment restrictions. In addition, the chosen investment should be capable of accommodating a variety of leverage structures enhance returns.<\/p><p>Penn would also like to include a real estate allocation in his personal investment portfolio. However, he has limited funds on hand and is concerned that he may not be able to afford the investment.<\/p><p>Next, Penn evaluates how an investment in a REIT may differ from that in a REOC in terms of market valuations, access to equity capital, and taxation. He intends to share the results of his findings with Jane Harris, his colleague and Excel’s fixed-income advisor.<\/p><p>Penn decides to select a hotel REIT for investment. The REIT owns the hotel properties but leases all its properties to taxable REIT subsidiaries which operate them and pass rental income back to the parent REIT. Data relevant for valuing the REIT investment using the net asset value (NAV) approach is summarized in the exhibit below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0015.webp\" style=\"max-width:min(100%,302px)\" alt=\"Exhibit: Net Asset Value Approach\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0016.webp\" style=\"max-width:min(100%,575px)\" alt=\"Estimated next 12 months cash net operating income (NOI) $325,280 Assumed cap rate 10% Cash and cash equivalents $50,088 Land held for future development $30,100 Prepaid assets including goodwill $19,200 Intangible assets $10,068 Total debt $1,560,500 Other liabilities $150,780 Goodwill $45,000 Defe\"><\/div><\/details><div class=\"qtext\"><p>Which of the following factors will Penn least likely need to consider when conducting due diligence of the hotel REIT investment?<\/p><\/div>", "subj": "alternatives"}, {"n": 9, "q": "Using the dividend discount model, the value of the office REIT is closest to:", "opts": ["$108.10.", "$134.77.", "$873.20."], "ans": "B", "expl": "The valuation of the office REIT using the two-stage dividend discount model involves calculating the present value of expected future dividends and adding them up to determine the total value of the REIT. The required rate of return is calculated using the Capital Asset Pricing Model (CAPM), which is given by the formula: For Smith Klein's office REIT, the risk-free rate is 2.20%, the beta is 0.65, and the historical equity risk premium is 6.85%. Plugging these values into the CAPM formula gives: The present value of dividends for the years 2015, 2016, and 2017 are calculated by discounting the dividends at the required rate of return: The perpetual dividend starting in 2017 is calculated using the Gordon Growth Model, which assumes dividends grow at a constant rate indefinitely: The present value of this perpetual dividend as of today is: Adding up all these present values gives the current value of the office REIT share: Current value of office REIT share = $0.797186 + $0.967553+ $2.062352 + $130.941 = $134.77 B is the correct answer because the calculated value of the office REIT share using the two-stage dividend discount model matches option B, which is $134.77. A is incorrect. It suggests a value of \\$108.10, which does not align with the calculated value using the dividend discount model. The incorrect value might result from an error in the discounting process or incorrect assumptions about the growth rate or required rate of return. A thorough review of the calcula
