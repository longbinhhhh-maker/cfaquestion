tions and assumptions is necessary to understand why this value is incorrect, but it is clear that it does not match the detailed calculations provided. C is incorrect. It suggests a significantly higher value of $873.20, which is far beyond the calculated value of $134.77. This discrepancy could be due to a gross overestimation of the perpetual growth rate or a misunderstanding of the CAPM inputs. The value is unrealistic given the data provided and the standard methods used in dividend discount models, indicating a fundamental error in the application of the valuation model. ", "explhtml": "<p>The valuation of the office REIT using the two-stage dividend discount model involves calculating the present value of expected future dividends and adding them up to determine the total value of the REIT. The required rate of return is calculated using the Capital Asset Pricing Model (CAPM), which is given by the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0019.webp\" style=\"max-width:min(100%,562px)\" alt=\"Required rate of return = Risk-free rate + (Beta × Market risk premium)\"><p>For Smith Klein&#x27;s office REIT, the risk-free rate is 2.20%, the beta is 0.65, and the historical equity risk premium is 6.85%. Plugging these values into the CAPM formula gives:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0020.webp\" style=\"max-width:min(100%,467px)\" alt=\"Required rate of return = 2.20% + 0.65 × 6.85% = 6.6525%\"><p>The present value of dividends for the years 2015, 2016, and 2017 are calculated by discounting the dividends at the required rate of return:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0021.webp\" style=\"max-width:min(100%,404px)\" alt=\"$0.85 PV of Dividend (2015) = = $0.797186 (1 + 0.066525) $1.10 PV of Dividend (2016) = = $0.967553 (1.066525)2 $2.50 PV of Dividend (2017) = = $2.062352 (1.066525)3\"><p>The perpetual dividend starting in 2017 is calculated using the Gordon Growth Model, which assumes dividends grow at a constant rate indefinitely:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0022.webp\" style=\"max-width:min(100%,143px)\" alt=\"$2 50 (1 0 05)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0023.webp\" style=\"max-width:min(100%,490px)\" alt=\"$2.50 × (1 + 0.05) PV of perpetual dividend in 2017 = 0.066525 −0.05 = $158.85\"><p>The present value of this perpetual dividend as of today is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0024.webp\" style=\"max-width:min(100%,442px)\" alt=\"$158.85 PV of perpetual dividend today = = $130.941 (1.066525)3\"><p>Adding up all these present values gives the current value of the office REIT share:<\/p><p>Current value of office REIT share = $0.797186 + $0.967553+ $2.062352 + $130.941 = $134.77<\/p><p><b>B is the correct answer<\/b> because the calculated value of the office REIT share using the two-stage dividend discount model matches option B, which is $134.77.<\/p><p><b>A is incorrect.<\/b> It suggests a value of \\$108.10, which does not align with the calculated value using the dividend discount model. The incorrect value might result from an error in the discounting process or incorrect assumptions about the growth rate or required rate of return. A thorough review of the calculations and assumptions is necessary to understand why this value is incorrect, but it is clear that it does not match the detailed calculations provided.<\/p><p><b>C is incorrect.<\/b> It suggests a significantly higher value of $873.20, which is far beyond the calculated value of $134.77. This discrepancy could be due to a gross overestimation of the perpetual growth rate or a misunderstanding of the CAPM inputs. The value is unrealistic given the data provided and the standard methods used in dividend discount models, indicating a fundamental error in the application of the valuation model. <\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (d): Calculate the value of a REIT share using net asset value, price-to-FFO and price-to-AFFO, and discounted cash flow approaches<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Smith Klein (SK)<\/summary><div class=\"vig-body\"><p>Smith Klein (SK) is a real estate management firm operating in the US. SK offers a real investment trust (REIT) fund that invests in and manages office property complexes. SK is currently undertaking an asset repositioning strategy concerning the underlying properties. Under this strategy, the REIT will shift its investments to office complexes in prime locations and dispose of most of its properties situated in older, less popular localities.<\/p><p>Claudia Martinez is a real estate advisor serving SK. She is analyzing the firm’s strategy and determines that the cap rate at which the current properties are being sold is higher than the yields at which proceeds will be reinvested. She attempts to determine the impact of the strategy on near-term cash flow growth pressure.<\/p><p>Martinez is valuing the office REIT using the two-stage dividend discount model. She collects data relevant to the valuation in the exhibit below. After 2017, the dividends are expected to grow into infinity at the long-term growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0017.webp\" style=\"max-width:min(100%,573px)\" alt=\"Exhibit: Data Relevant for Two-Stage Dividend Discount Model 2015 2016 2017 Dividend payout rate 70% SK’s Historical beta 0.65 Risk-free rate 2.20%\"><p>Historical equity risk premium 6.85%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0018.webp\" style=\"max-width:min(100%,542px)\" alt=\"Dividends per share $0.85 $1.10 $2.50 Long-term growth rate 5.00%\"><p>After performing the valuation, Martinez makes the following observations concerning the impact of the repositioning strategy:<\/p><p>Observation 1: Future rental income streams will be higher in prime locations thereby increasing future profitability and the long-term dividend growth rate and the cap rate applied to valuation.<\/p><p>Observation 2: The value of vacant land acquired for future development will be higher by 30% in these localities.<\/p><p>Jules Lewis is Martinez’s colleague. Upon reviewing Martinez’s analysis, Lewis asks the analyst what his observations imply for the REITs’ net asset value per share (NAVPS).<\/p><p>Martinez proceeds to explore the factors affecting the economic value for the office REIT. The advisor concludes that several factors influence property values, including national GDP growth, retail sales growth, and the supply and demand for new space.<\/p><p>Martinez concludes his property valuation by stating that the dividend discount model is highly relevant for the office REIT given the nature of the investment.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the dividend discount model, the value of the office REIT is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 10, "q": "Concerning observation 1, which of the following factors will most likely cause the intrinsic value per share of the office REIT to increase based on the dividend discount model? Higher:", "opts": ["Cap rates only.", "Growth rates only.", "Growth and cap rates."], "ans": "B", "expl": "In the context of the dividend discount model (DDM), the intrinsic value of a share is primarily influenced by the expected future dividends and their growth rate. The DDM calculates the present value of the expected future dividends, discounting them back to their present value. A higher growth rate in dividends leads to higher expected future dividends, which, when discounted to the present value, results in a higher intrinsic value per share. In the case of the office REIT managed by Smith Klein, the repositioning strategy to prime locations is expected to enhance future profitability and, consequently, the dividends. This increase in dividends is directly linked to the growth rate of these dividends. Since the dividends are expected to grow at a higher rate in more profitable prime locations, the intrinsic value per share of the REIT will increase, making option B the correct answer. A is incorrect. The cap rate, typically used in the valuation of real estate properties, inversely affects property values; a higher cap rate implies a lower property value and vice versa. However, in the context of the dividend discount model used for valuing REITs, the cap rate does not directly influence the calculation of the intrinsic value per share. The DDM focuses on the expected dividends and their growth, not on the cap rates applied to the properties themselves. Therefore, a higher cap rate alone would not lead to an increase in the intrinsic value per share of the REIT, as it does not affect the future dividends or their growth directly. C is incorrect. While it might seem intuitive that both higher growth and cap rates could influence the intrinsic value, in the dividend discount model, the cap rate does not play a direct role in determining the intrinsic value per share. The model is sensitive to the growth rates of dividends, as these determine the future cash flows expected from the investment. The cap rate's primary influence is on the valuation of the underlying real estate assets rather than on the dividend projections and their growth. Thus, the combination of growth and cap rates does not lead to the most likely increase in intrinsic value per share in the context of the DDM. ", "explhtml": "<p>In the context of the dividend discount model (DDM), the intrinsic value of a share is primarily influenced by the expected future dividends and their growth rate. The DDM calculates the present value of the expected future dividends, discounting them back to their present value. A higher growth rate in dividends leads to higher expected future dividends, which, when discounted to the present value, results in a higher intrinsic value per share. In the case of the office REIT managed by Smith Klein, the repositioning strategy to prime locations is expected to enhance future profitability and, consequently, the dividends. This increase in dividends is directly linked to the growth rate of these dividends. Since the dividends are expected to grow at a higher rate in more profitable prime locations, the intrinsic value per share of the REIT will increase, making option B the correct answer.<\/p><p><b>A is incorrect<\/b>. The cap rate, typically used in the valuation of real estate properties, inversely affects property values; a higher cap rate implies a lower property value and vice versa. However, in the context of the dividend discount model used for valuing REITs, the cap rate does not directly influence the calculation of the intrinsic value per share. The DDM focuses on the expected dividends and their growth, not on the cap rates applied to the properties themselves. Therefore, a higher cap rate alone would not lead to an increase in the intrinsic value per share of the REIT, as it does not affect the future dividends or their growth directly.<\/p><p><b>C is incorrect<\/b>. While it might seem intuitive that both higher growth and cap rates could influence the intrinsic value, in the dividend discount model, the cap rate does not play a direct role in determining the intrinsic value per share. The model is sensitive to the growth rates of dividends, as these determine the future cash flows expected from the investment. The cap rate&#x27;s primary influence is on the valuation of the underlying real estate assets rather than on the dividend projections and their growth. Thus, the combination of growth and cap rates does not lead to the most likely increase in intrinsic value per share in the context of the DDM. <\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify the use of net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Smith Klein (SK)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Smith Klein (SK) is a real estate management firm operating in the US. SK offers a real investment trust (REIT) fund that invests in and manages office property complexes. SK is currently undertaking an asset repositioning strategy concerning the underlying properties. Under this strategy, the REIT will shift its investments to office complexes in prime locations and dispose of most of its properties situated in older, less popular localities.<\/p><p>Claudia Martinez is a real estate advisor serving SK. She is analyzing the firm’s strategy and determines that the cap rate at which the current properties are being sold is higher than the yields at which proceeds will be reinvested. She attempts to determine the impact of the strategy on near-term cash flow growth pressure.<\/p><p>Martinez is valuing the office REIT using the two-stage dividend discount model. She collects data relevant to the valuation in the exhibit below. After 2017, the dividends are expected to grow into infinity at the long-term growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0017.webp\" style=\"max-width:min(100%,573px)\" alt=\"Exhibit: Data Relevant for Two-Stage Dividend Discount Model 2015 2016 2017 Dividend payout rate 70% SK’s Historical beta 0.65 Risk-free rate 2.20%\"><p>Historical equity risk premium 6.85%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0018.webp\" style=\"max-width:min(100%,542px)\" alt=\"Dividends per share $0.85 $1.10 $2.50 Long-term growth rate 5.00%\"><p>After performing the valuation, Martinez makes the following observations concerning the impact of the repositioning strategy:<\/p><p>Observation 1: Future rental income streams will be higher in prime locations thereby increasing future profitability and the long-term dividend growth rate and the cap rate applied to valuation.<\/p><p>Observation 2: The value of vacant land acquired for future development will be higher by 30% in these localities.<\/p><p>Jules Lewis is Martinez’s colleague. Upon reviewing Martinez’s analysis, Lewis asks the analyst what his observations imply for the REITs’ net asset value per share (NAVPS).<\/p><p>Martinez proceeds to explore the factors affecting the economic value for the office REIT. The advisor concludes that several factors influence property values, including national GDP growth, retail sales growth, and the supply and demand for new space.<\/p><p>Martinez concludes his property valuation by stating that the dividend discount model is highly relevant for the office REIT given the nature of the investment.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning observation 1, which of the following factors will most likely cause the intrinsic value per share of the office REIT to increase based on the dividend discount model? Higher:<\/p><\/div>", "subj": "alternatives"}, {"n": 11, "q": "Which of the following statements most accurately outlines the impact of observations 1 and 2 on NAVPS? Observation:", "opts": ["1 has no impact; NAVPS does not consider expected real estate NOI.", "1 has an indeterminate impact while Observation 2 will serve to increase NAVPS.", "2 has no impact; NAVPS does not incorporate land value because it is difficult to value due to low liquidity."], "ans": "B", "expl": "Observation 1's impact on NAVPS is indeterminate because it involves two conflicting effects. On one hand, higher future rental income streams from prime locations will increase the Net Operating Income (NOI), which is a direct component of NAVPS. This suggests a positive impact on NAVPS. However, the increase in cap rate, which is inversely related to property values, could decrease the NAVPS. Since cap rates are used to determine the value of properties by dividing the NOI by the cap rate, a higher cap rate results in a lower property valuation, thus potentially reducing NAVPS. The overall effect of Observation 1 on NAVPS is therefore unclear as it depends on which effect dominates - the increase in NOI or the increase in the cap rate. A is incorrect. The statement that Observation 1 has no impact is incorrect because NAVPS does consider expected real estate NOI, which is influenced by rental income streams. NAVPS calculations incorporate NOI to estimate the value of operating real estate, which is a critical component in determining the NAVPS. Therefore, any change in expected rental income, as suggested in Observation 1, would indeed impact NAVPS, contrary to what Option A suggests. C is incorrect. The statement that Observation 2 has no impact due to the difficulty in valuing land due to low liquidity is incorrect. NAVPS calculations include the value of land, and when the market value is not easily ascertainable, the book value is used instead. Therefore, an increase in the value of land, as stated in Observation 2, would directly contribute to an increase in the NAVPS. This inclusion is crucial as it reflects the total asset base of the REIT, influencing the overall valuation metrics used by investors and analysts. Observation 2 will unequivocally increase NAVPS because it directly enhances the asset base of the REIT. The 30% increase in the value of vacant land acquired for future development, as noted in Observation 2, will be added to the estimated value of operating real estate, thereby increasing the net asset value. Since NAVPS is a per-share measure of net asset value, any increase in the components of net asset value, such as land, will proportionally increase NAVPS. This direct relationship underscores the importance of land valuation in the overall assessment of REITs' financial health and investor appeal. ", "explhtml": "<p>Observation 1&#x27;s impact on NAVPS is indeterminate because it involves two conflicting effects. On one hand, higher future rental income streams from prime locations will increase the Net Operating Income (NOI), which is a direct component of NAVPS. This suggests a positive impact on NAVPS. However, the increase in cap rate, which is inversely related to property values, could decrease the NAVPS. Since cap rates are used to determine the value of properties by dividing the NOI by the cap rate, a higher cap rate results in a lower property valuation, thus potentially reducing NAVPS. The overall effect of Observation 1 on NAVPS is therefore unclear as it depends on which effect dominates - the increase in NOI or the increase in the cap rate.<\/p><p><b>A is incorrect<\/b>. The statement that Observation 1 has no impact is incorrect because NAVPS does consider expected real estate NOI, which is influenced by rental income streams. NAVPS calculations incorporate NOI to estimate the value of operating real estate, which is a critical component in determining the NAVPS. Therefore, any change in expected rental income, as suggested in Observation 1, would indeed impact NAVPS, contrary to what Option A suggests.<\/p><p><b>C is incorrect<\/b>. The statement that Observation 2 has no impact due to the difficulty in valuing land due to low liquidity is incorrect. NAVPS calculations include the value of land, and when the market value is not easily ascertainable, the book value is used instead. Therefore, an increase in the value of land, as stated in Observation 2, would directly contribute to an increase in the NAVPS. This inclusion is crucial as it reflects the total asset base of the REIT, influencing the overall valuation metrics used by investors and analysts.<\/p><p>Observation 2 will unequivocally increase NAVPS because it directly enhances the asset base of the REIT. The 30% increase in the value of vacant land acquired for future development, as noted in Observation 2, will be added to the estimated value of operating real estate, thereby increasing the net asset value. Since NAVPS is a per-share measure of net asset value, any increase in the components of net asset value, such as land, will proportionally increase NAVPS. This direct relationship underscores the importance of land valuation in the overall assessment of REITs&#x27; financial health and investor appeal. <\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify the use of net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Smith Klein (SK)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Smith Klein (SK) is a real estate management firm operating in the US. SK offers a real investment trust (REIT) fund that invests in and manages office property complexes. SK is currently undertaking an asset repositioning strategy concerning the underlying properties. Under this strategy, the REIT will shift its investments to office complexes in prime locations and dispose of most of its properties situated in older, less popular localities.<\/p><p>Claudia Martinez is a real estate advisor serving SK. She is analyzing the firm’s strategy and determines that the cap rate at which the current properties are being sold is higher than the yields at which proceeds will be reinvested. She attempts to determine the impact of the strategy on near-term cash flow growth pressure.<\/p><p>Martinez is valuing the office REIT using the two-stage dividend discount model. She collects data relevant to the valuation in the exhibit below. After 2017, the dividends are expected to grow into infinity at the long-term growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0017.webp\" style=\"max-width:min(100%,573px)\" alt=\"Exhibit: Data Relevant for Two-Stage Dividend Discount Model 2015 2016 2017 Dividend payout rate 70% SK’s Historical beta 0.65 Risk-free rate 2.20%\"><p>Historical equity risk premium 6.85%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0018.webp\" style=\"max-width:min(100%,542px)\" alt=\"Dividends per share $0.85 $1.10 $2.50 Long-term growth rate 5.00%\"><p>After performing the valuation, Martinez makes the following observations concerning the impact of the repositioning strategy:<\/p><p>Observation 1: Future rental income streams will be higher in prime locations thereby increasing future profitability and the long-term dividend growth rate and the cap rate applied to valuation.<\/p><p>Observation 2: The value of vacant land acquired for future development will be higher by 30% in these localities.<\/p><p>Jules Lewis is Martinez’s colleague. Upon reviewing Martinez’s analysis, Lewis asks the analyst what his observations imply for the REITs’ net asset value per share (NAVPS).<\/p><p>Martinez proceeds to explore the factors affecting the economic value for the office REIT. The advisor concludes that several factors influence property values, including national GDP growth, retail sales growth, and the supply and demand for new space.<\/p><p>Martinez concludes his property valuation by stating that the dividend discount model is highly relevant for the office REIT given the nature of the investment.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements most accurately outlines the impact of observations 1 and 2 on NAVPS? Observation:<\/p><\/div>", "subj": "alternatives"}, {"n": 12, "q": "Concerning the factors outlined by Martinez, which of the following most likely strongly influences the value of an office REIT?", "opts": ["Retail sales growth", "Population growth", "National GDP growth"], "ans": "C", "expl": "National GDP growth is a critical determinant in the valuation of an office REIT. The relationship between GDP growth and office REIT values stems from the fact that a growing economy typically leads to increased business activities, thereby elevating the demand for office spaces. Companies expand their operations and workforce in a robust economic environment, which in turn increases their need for larger or more strategically located office spaces. This heightened demand pushes up rental income, which is a direct contributor to the REIT's revenue. Furthermore, a strong GDP growth signals a healthy economic environment, which can enhance investor confidence and attract more investments into real estate properties, including office REITs. Thus, the overall economic growth measured by GDP is a more significant factor in influencing the value of office REITs compared to other factors like retail sales growth or population growth. A is incorrect. While retail sales growth can indicate economic vitality and potentially influence certain types of real estate investments, such as retail malls or shopping centers, its impact on office REITs is generally indirect and less significant. Office REITs primarily derive their value from rental incomes paid by businesses that occupy these spaces. The direct correlation between retail sales and the demand for office space is tenuous, as higher retail sales do not necessarily require more office space. Therefore, retail sales growth is not the most influential factor in determining the value of an office REIT. B is incorrect. Population growth can affect various types of real estate properties, particularly residential housing and retail spaces, as more people may lead to higher demand for housing and consumer goods. However, the impact of population growth on office REITs is less direct. While an increasing population can contribute to a larger workforce, it does not directly correlate with an immediate increase in demand for office space. Businesses may not expand their office space solely based on population increases; instead, their decisions are more influenced by economic conditions and business growth prospects, which are more closely tied to GDP growth. Hence, population growth is not the most significant factor affecting the value of office REITs. ", "explhtml": "<p>National GDP growth is a critical determinant in the valuation of an office REIT. The relationship between GDP growth and office REIT values stems from the fact that a growing economy typically leads to increased business activities, thereby elevating the demand for office spaces. Companies expand their operations and workforce in a robust economic environment, which in turn increases their need for larger or more strategically located office spaces. This heightened demand pushes up rental income, which is a direct contributor to the REIT&#x27;s revenue. Furthermore, a strong GDP growth signals a healthy economic environment, which can enhance investor confidence and attract more investments into real estate properties, including office REITs. Thus, the overall economic growth measured by GDP is a more significant factor in influencing the value of office REITs compared to other factors like retail sales growth or population growth.<\/p><p><b>A is incorrect.<\/b> While retail sales growth can indicate economic vitality and potentially influence certain types of real estate investments, such as retail malls or shopping centers, its impact on office REITs is generally indirect and less significant. Office REITs primarily derive their value from rental incomes paid by businesses that occupy these spaces. The direct correlation between retail sales and the demand for office space is tenuous, as higher retail sales do not necessarily require more office space. Therefore, retail sales growth is not the most influential factor in determining the value of an office REIT.<\/p><p><b>B is incorrect.<\/b> Population growth can affect various types of real estate properties, particularly residential housing and retail spaces, as more people may lead to higher demand for housing and consumer goods. However, the impact of population growth on office REITs is less direct. While an increasing population can contribute to a larger workforce, it does not directly correlate with an immediate increase in demand for office space. Businesses may not expand their office space solely based on population increases; instead, their decisions are more influenced by economic conditions and business growth prospects, which are more closely tied to GDP growth. Hence, population growth is not the most significant factor affecting the value of office REITs. <\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 9–12 · Smith Klein (SK)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Smith Klein (SK) is a real estate management firm operating in the US. SK offers a real investment trust (REIT) fund that invests in and manages office property complexes. SK is currently undertaking an asset repositioning strategy concerning the underlying properties. Under this strategy, the REIT will shift its investments to office complexes in prime locations and dispose of most of its properties situated in older, less popular localities.<\/p><p>Claudia Martinez is a real estate advisor serving SK. She is analyzing the firm’s strategy and determines that the cap rate at which the current properties are being sold is higher than the yields at which proceeds will be reinvested. She attempts to determine the impact of the strategy on near-term cash flow growth pressure.<\/p><p>Martinez is valuing the office REIT using the two-stage dividend discount model. She collects data relevant to the valuation in the exhibit below. After 2017, the dividends are expected to grow into infinity at the long-term growth rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0017.webp\" style=\"max-width:min(100%,573px)\" alt=\"Exhibit: Data Relevant for Two-Stage Dividend Discount Model 2015 2016 2017 Dividend payout rate 70% SK’s Historical beta 0.65 Risk-free rate 2.20%\"><p>Historical equity risk premium 6.85%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0018.webp\" style=\"max-width:min(100%,542px)\" alt=\"Dividends per share $0.85 $1.10 $2.50 Long-term growth rate 5.00%\"><p>After performing the valuation, Martinez makes the following observations concerning the impact of the repositioning strategy:<\/p><p>Observation 1: Future rental income streams will be higher in prime locations thereby increasing future profitability and the long-term dividend growth rate and the cap rate applied to valuation.<\/p><p>Observation 2: The value of vacant land acquired for future development will be higher by 30% in these localities.<\/p><p>Jules Lewis is Martinez’s colleague. Upon reviewing Martinez’s analysis, Lewis asks the analyst what his observations imply for the REITs’ net asset value per share (NAVPS).<\/p><p>Martinez proceeds to explore the factors affecting the economic value for the office REIT. The advisor concludes that several factors influence property values, including national GDP growth, retail sales growth, and the supply and demand for new space.<\/p><p>Martinez concludes his property valuation by stating that the dividend discount model is highly relevant for the office REIT given the nature of the investment.<\/p><\/div><\/details><div class=\"qtext\"><p>Concerning the factors outlined by Martinez, which of the following most likely strongly influences the value of an office REIT?<\/p><\/div>", "subj": "alternatives"}, {"n": 13, "q": "Which of the following comments made by Roger Kakou is most likely correct:", "opts": ["Comment 1.", "Comment 2.", "Both comments 1 and 2."], "ans": "A", "expl": "Economic growth significantly influences the demand and supply dynamics of crude oil. During periods of economic expansion, industries and consumers increase energy consumption, driving up demand for crude oil. Conversely, in economic downturns, demand for crude oil typically decreases as industrial output and transportation needs reduce. Additionally, crude oil markets are also impacted by geopolitical tensions in oil-rich regions, technological advancements in energy extraction and consumption, and global business cycles that affect commodity trading on a broader scale. These factors collectively underscore the validity of Comment 1, which states that crude oil demand and supply are primarily affected by economic growth. B is incorrect. Comment 2 suggests that the demand for natural gas decreases in colder weather, which is factually incorrect. In reality, the demand for natural gas tends to increase during colder months due to higher heating requirements in residential and commercial settings. Natural gas is a primary source for heating systems in many regions, and colder weather leads to increased consumption to maintain warmth. This seasonal pattern is well-documented and is a critical aspect of energy market analysis, making Comment 2 an inaccurate representation of natural gas demand dynamics. C is incorrect. Since Comment 2 is incorrect, the statement that both comments are correct (option C) is also incorrect. While Comment 1 accurately describes the influence of economic growth on crude oil markets, the error in Comment 2 regarding natural gas demand in colder weather leads to the conclusion that both comments cannot be correct simultaneously. Understanding the distinct factors influencing each energy market is crucial for accurate market analysis and investment decision-making, particularly in commodity-dependent sectors like energy. ", "explhtml": "<p>Economic growth significantly influences the demand and supply dynamics of crude oil. During periods of economic expansion, industries and consumers increase energy consumption, driving up demand for crude oil. Conversely, in economic downturns, demand for crude oil typically decreases as industrial output and transportation needs reduce. Additionally, crude oil markets are also impacted by geopolitical tensions in oil-rich regions, technological advancements in energy extraction and consumption, and global business cycles that affect commodity trading on a broader scale. These factors collectively underscore the validity of Comment 1, which states that crude oil demand and supply are primarily affected by economic growth.<\/p><p><b>B is incorrect<\/b>. Comment 2 suggests that the demand for natural gas decreases in colder weather, which is factually incorrect. In reality, the demand for natural gas tends to increase during colder months due to higher heating requirements in residential and commercial settings. Natural gas is a primary source for heating systems in many regions, and colder weather leads to increased consumption to maintain warmth. This seasonal pattern is well-documented and is a critical aspect of energy market analysis, making Comment 2 an inaccurate representation of natural gas demand dynamics.<\/p><p><b>C is incorrect<\/b>. Since Comment 2 is incorrect, the statement that both comments are correct (option C) is also incorrect. While Comment 1 accurately describes the influence of economic growth on crude oil markets, the error in Comment 2 regarding natural gas demand in colder weather leads to the conclusion that both comments cannot be correct simultaneously. Understanding the distinct factors influencing each energy market is crucial for accurate market analysis and investment decision-making, particularly in commodity-dependent sectors like energy. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (a) Compare characteristics of commodity sectors.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Laurent Boutilier<\/summary><div class=\"vig-body\"><p>Laurent Boutilier is a financial analyst for The Allegro group, a defined benefit plan. Recently,<\/p><p>there has been a lot of volatility in the crude oil and natural gas market. Laurent shares the<\/p><p>information with his colleagues, and Roger Kakou, his supervisor, comments.<\/p><p>Comment 1: “Crude oil demand and supply are mainly affected by economic growth.”<\/p><p>Comment 2: “In colder weather, the demand for natural gas decreases.”<\/p><p>Boutilier meets Jane Butler, a market strategist with Medallion Bank, to discuss future<\/p><p>investment opportunities for their pension plan. Butler suggests the Genghis commodity fund<\/p><p>(Genghis fund), which attempts to produce trading profits by capitalizing on futures and spot<\/p><p>commodity price mispricing. The Genghis fund&#x27;s current asset allocation is presented in the<\/p><p>Exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0025.webp\" style=\"max-width:min(100%,337px)\" alt=\"Exhibit 1: Genghis Fund’s Asset Allocation Commodity Sector Allocation (%) Precious metals 34 Grain 11 Softs 22 Energy 33\"><p>Butler mentions that the Genghis Fund has diversification benefits because of the fund’s low<\/p><p>correlation with bonds and stocks. This prompts Laurent to ask Butler, “What factors affect the<\/p><p>valuation of commodities but do not affect bond and stock valuation?”<\/p><p>Butler shares the following futures contract data for three markets The Genghis Fund invests in.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit 2: Selected Commodity Futures Information Month Wheat Price Platinum Price Crude Oil Price ($/Pound) ($/t.oz) ($/barrel) January 761.25 1, 021.1 78.87 March 786.00 955.5 77.05 June 792.10 1, 003.1 75.67\"><p>Medallion Bank recently released a report on the wheat market. Butler shares some key report<\/p><p>highlights with Laurent: “The wheat market had an unusually high harvest. However, the wheat futures trade is balanced between consumers and producers. This condition is expected to<\/p><p>persist in the future.”<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following comments made by Roger Kakou is most likely correct:<\/p><\/div>", "subj": "alternatives"}, {"n": 14, "q": "Which futures market in Exhibit 2 is most likely in backwardation?", "opts": ["Platinum.", "Wheat.", "Crude oil."], "ans": "C", "expl": "The futures market for a commodity is considered to be in backwardation when the price of a longer-term futures contract is lower than the price of a near-term futures contract. This typically indicates that the market expects the future spot price to be lower than the current spot price. In Exhibit 2, the prices for crude oil futures are $78.87 in January, $77.05 in March, and $75.67 in June. This descending price pattern from January to June clearly shows that the longer-term futures prices are lower than the shorter-term futures prices, which is a characteristic of backwardation. The decreasing trend suggests that traders might be expecting lower future prices for crude oil, possibly due to anticipated changes in supply, demand, or broader economic factors. A is incorrect. The futures prices for platinum are $1,021.1 in January, $955.5 in March, and $1,003.1 in June. Although there is a drop from January to March, the price in June rises again above the March level, suggesting that prices do not consistently decrease. This inconsistency in the price trend does not support the definition of backwardation, which expects a continuous decline in futures prices over time. Therefore, the platinum market does not exhibit a clear backwardation trend as seen in the crude oil market. B is incorrect. The futures prices for wheat are $761.25 in January, $786.00 in March, and $792.10 in June. This pattern shows a rising price trend from January through June. An increasing price trend indicates contango, not backwardation. Contango occurs when future prices are expected to be higher than current prices, which is the opposite of backwardation. Hence, the wheat market is not in backwardation according to the data provided in Exhibit 2. ", "explhtml": "<p>The futures market for a commodity is considered to be in backwardation when the price of a longer-term futures contract is lower than the price of a near-term futures contract. This typically indicates that the market expects the future spot price to be lower than the current spot price. In Exhibit 2, the prices for crude oil futures are $78.87 in January, $77.05 in March, and $75.67 in June. This descending price pattern from January to June clearly shows that the longer-term futures prices are lower than the shorter-term futures prices, which is a characteristic of backwardation. The decreasing trend suggests that traders might be expecting lower future prices for crude oil, possibly due to anticipated changes in supply, demand, or broader economic factors.<\/p><p><b>A is incorrect<\/b>. The futures prices for platinum are $1,021.1 in January, $955.5 in March, and $1,003.1 in June. Although there is a drop from January to March, the price in June rises again above the March level, suggesting that prices do not consistently decrease. This inconsistency in the price trend does not support the definition of backwardation, which expects a continuous decline in futures prices over time. Therefore, the platinum market does not exhibit a clear backwardation trend as seen in the crude oil market.<\/p><p><b>B is incorrect<\/b>. The futures prices for wheat are $761.25 in January, $786.00 in March, and $792.10 in June. This pattern shows a rising price trend from January through June. An increasing price trend indicates contango, not backwardation. Contango occurs when future prices are expected to be higher than current prices, which is the opposite of backwardation. Hence, the wheat market is not in backwardation according to the data provided in Exhibit 2. <\/p><p class=\"los\">Alternative Investment, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (e) Analyze the relationship between spot prices and futures prices in markets in contango and markets in backwardation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Laurent Boutilier<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Laurent Boutilier is a financial analyst for The Allegro group, a defined benefit plan. Recently,<\/p><p>there has been a lot of volatility in the crude oil and natural gas market. Laurent shares the<\/p><p>information with his colleagues, and Roger Kakou, his supervisor, comments.<\/p><p>Comment 1: “Crude oil demand and supply are mainly affected by economic growth.”<\/p><p>Comment 2: “In colder weather, the demand for natural gas decreases.”<\/p><p>Boutilier meets Jane Butler, a market strategist with Medallion Bank, to discuss future<\/p><p>investment opportunities for their pension plan. Butler suggests the Genghis commodity fund<\/p><p>(Genghis fund), which attempts to produce trading profits by capitalizing on futures and spot<\/p><p>commodity price mispricing. The Genghis fund&#x27;s current asset allocation is presented in the<\/p><p>Exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0025.webp\" style=\"max-width:min(100%,337px)\" alt=\"Exhibit 1: Genghis Fund’s Asset Allocation Commodity Sector Allocation (%) Precious metals 34 Grain 11 Softs 22 Energy 33\"><p>Butler mentions that the Genghis Fund has diversification benefits because of the fund’s low<\/p><p>correlation with bonds and stocks. This prompts Laurent to ask Butler, “What factors affect the<\/p><p>valuation of commodities but do not affect bond and stock valuation?”<\/p><p>Butler shares the following futures contract data for three markets The Genghis Fund invests in.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit 2: Selected Commodity Futures Information Month Wheat Price Platinum Price Crude Oil Price ($/Pound) ($/t.oz) ($/barrel) January 761.25 1, 021.1 78.87 March 786.00 955.5 77.05 June 792.10 1, 003.1 75.67\"><p>Medallion Bank recently released a report on the wheat market. Butler shares some key report<\/p><p>highlights with Laurent: “The wheat market had an unusually high harvest. However, the wheat futures trade is balanced between consumers and producers. This condition is expected to<\/p><p>persist in the future.”<\/p><\/div><\/details><div class=\"qtext\"><p>Which futures market in Exhibit 2 is most likely in backwardation?<\/p><\/div>", "subj": "alternatives"}, {"n": 15, "q": "Which response will be the most appropriate regarding Boutilier’s question on valuation factors:", "opts": ["Expected future cash flows.", "Transportation costs.", "Company profits."], "ans": "B", "expl": "Transportation costs significantly influence the valuation of commodities because they directly affect the final cost and availability of these goods in different markets. Commodities, unlike stocks and bonds, are physical goods that must be transported from the point of production to the point of consumption. The cost of moving these goods, which can fluctuate due to factors such as fuel prices, geopolitical events, and infrastructure efficiency, directly impacts the price at which these commodities are traded. Additionally, transportation costs can vary significantly between different commodities and markets, adding a layer of complexity to commodity pricing that is not present in the valuation of financial securities like stocks and bonds. This unique aspect of commodity valuation highlights why transportation costs are a critical factor that must be considered. A is incorrect. Expected future cash flows are a fundamental concept in valuing financial assets such as stocks and bonds, where the value is derived from the anticipated future income or payouts these assets will generate. However, commodities are physical assets whose prices are influenced more by immediate supply and demand conditions, cost of production, and transportation rather than projected future earnings. While future expectations about supply and demand can impact commodity prices, these do not equate to the cash flows expected from financial securities. Therefore, expected future cash flows are not the most appropriate factor for assessing the valuation of commodities in the context of Boutilier's question. C is incorrect. Company profits pertain to the financial performance of entities involved in the production, processing, or distribution of commodities and other goods. While the profitability of these companies can influence their stock prices and investment appeal, it does not directly affect the valuation of the commodities themselves. Commodity prices are determined by broader market forces such as supply, demand, and external costs like transportation, rather than the financial performance of individual companies. This distinction is crucial in understanding why company profits, although important for stock valuations, do not serve as a primary factor in commodity valuation in the same way. ", "explhtml": "<p>Transportation costs significantly influence the valuation of commodities because they directly affect the final cost and availability of these goods in different markets. Commodities, unlike stocks and bonds, are physical goods that must be transported from the point of production to the point of consumption. The cost of moving these goods, which can fluctuate due to factors such as fuel prices, geopolitical events, and infrastructure efficiency, directly impacts the price at which these commodities are traded. Additionally, transportation costs can vary significantly between different commodities and markets, adding a layer of complexity to commodity pricing that is not present in the valuation of financial securities like stocks and bonds. This unique aspect of commodity valuation highlights why transportation costs are a critical factor that must be considered.<\/p><p><b>A is incorrect<\/b>. Expected future cash flows are a fundamental concept in valuing financial assets such as stocks and bonds, where the value is derived from the anticipated future income or payouts these assets will generate. However, commodities are physical assets whose prices are influenced more by immediate supply and demand conditions, cost of production, and transportation rather than projected future earnings. While future expectations about supply and demand can impact commodity prices, these do not equate to the cash flows expected from financial securities. Therefore, expected future cash flows are not the most appropriate factor for assessing the valuation of commodities in the context of Boutilier&#x27;s question.<\/p><p><b>C is incorrect<\/b>. Company profits pertain to the financial performance of entities involved in the production, processing, or distribution of commodities and other goods. While the profitability of these companies can influence their stock prices and investment appeal, it does not directly affect the valuation of the commodities themselves. Commodity prices are determined by broader market forces such as supply, demand, and external costs like transportation, rather than the financial performance of individual companies. This distinction is crucial in understanding why company profits, although important for stock valuations, do not serve as a primary factor in commodity valuation in the same way. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (c) Contrast the valuation of commodities with the valuation of equities and bonds.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Laurent Boutilier<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Laurent Boutilier is a financial analyst for The Allegro group, a defined benefit plan. Recently,<\/p><p>there has been a lot of volatility in the crude oil and natural gas market. Laurent shares the<\/p><p>information with his colleagues, and Roger Kakou, his supervisor, comments.<\/p><p>Comment 1: “Crude oil demand and supply are mainly affected by economic growth.”<\/p><p>Comment 2: “In colder weather, the demand for natural gas decreases.”<\/p><p>Boutilier meets Jane Butler, a market strategist with Medallion Bank, to discuss future<\/p><p>investment opportunities for their pension plan. Butler suggests the Genghis commodity fund<\/p><p>(Genghis fund), which attempts to produce trading profits by capitalizing on futures and spot<\/p><p>commodity price mispricing. The Genghis fund&#x27;s current asset allocation is presented in the<\/p><p>Exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0025.webp\" style=\"max-width:min(100%,337px)\" alt=\"Exhibit 1: Genghis Fund’s Asset Allocation Commodity Sector Allocation (%) Precious metals 34 Grain 11 Softs 22 Energy 33\"><p>Butler mentions that the Genghis Fund has diversification benefits because of the fund’s low<\/p><p>correlation with bonds and stocks. This prompts Laurent to ask Butler, “What factors affect the<\/p><p>valuation of commodities but do not affect bond and stock valuation?”<\/p><p>Butler shares the following futures contract data for three markets The Genghis Fund invests in.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit 2: Selected Commodity Futures Information Month Wheat Price Platinum Price Crude Oil Price ($/Pound) ($/t.oz) ($/barrel) January 761.25 1, 021.1 78.87 March 786.00 955.5 77.05 June 792.10 1, 003.1 75.67\"><p>Medallion Bank recently released a report on the wheat market. Butler shares some key report<\/p><p>highlights with Laurent: “The wheat market had an unusually high harvest. However, the wheat futures trade is balanced between consumers and producers. This condition is expected to<\/p><p>persist in the future.”<\/p><\/div><\/details><div class=\"qtext\"><p>Which response will be the most appropriate regarding Boutilier’s question on valuation factors:<\/p><\/div>", "subj": "alternatives"}, {"n": 16, "q": "From the conclusion of Medallion Bank’s wheat market report, the wheat futures curve shape is likely to be consistent with the:", "opts": ["Hedging pressure hypothesis.", "Theory of storage.", "Insurance theory."], "ans": "B", "expl": "The Theory of Storage explains the relationship between inventory levels of a commodity and the structure of its futures price curve. In the context of the wheat market, as reported by Medallion Bank, there was an unusually high harvest, indicating a potential increase in inventory levels. When inventories are high, the cost of carrying these inventories (including storage costs) becomes a significant factor in pricing futures contracts. The theory posits that futures prices will be higher than spot prices to compensate for these storage costs. This contango situation (where futures prices are higher than spot prices) is typical when there is an abundance of the commodity, as the costs and risks associated with storage need to be covered by someone, typically the futures buyer. This scenario aligns with the Theory of Storage, making it applicable to the current situation in the wheat market where a balanced trade between consumers and producers is expected to persist, indicating stable but elevated future prices due to high inventory levels. A is incorrect. The Hedging Pressure Hypothesis suggests that the futures prices are influenced by the hedging activities of producers and consumers. Producers hedge by selling futures to lock in prices for their commodities, while consumers buy futures to secure a supply at a predictable price. This theory primarily focuses on the balance of hedging pressure between buyers and sellers rather than the impact of storage costs on price structure. In the scenario described by Medallion Bank, there is no specific emphasis on hedging activities distinctly influencing the market dynamics, rather the report highlights a balanced trade environment and high inventory, which aligns less with hedging pressures and more with storage considerations. C is incorrect. The Insurance Theory revolves around the concept that producers use futures markets as a form of price insurance, locking in prices to stabilize revenue against price fluctuations. This theory would suggest that futures prices should be lower than the spot prices to compensate the speculators who assume the price risk. However, the situation described in the wheat market report does not focus on this aspect of futures trading. Instead, it discusses a balanced and stable trading environment with high inventory levels, which does not inherently involve using futures as insurance against price drops but rather managing the costs associated with surplus inventory. ", "explhtml": "<p>The Theory of Storage explains the relationship between inventory levels of a commodity and the structure of its futures price curve. In the context of the wheat market, as reported by Medallion Bank, there was an unusually high harvest, indicating a potential increase in inventory levels. When inventories are high, the cost of carrying these inventories (including storage costs) becomes a significant factor in pricing futures contracts. The theory posits that futures prices will be higher than spot prices to compensate for these storage costs. This contango situation (where futures prices are higher than spot prices) is typical when there is an abundance of the commodity, as the costs and risks associated with storage need to be covered by someone, typically the futures buyer. This scenario aligns with the Theory of Storage, making it applicable to the current situation in the wheat market where a balanced trade between consumers and producers is expected to persist, indicating stable but elevated future prices due to high inventory levels.<\/p><p><b>A is incorrect.<\/b> The Hedging Pressure Hypothesis suggests that the futures prices are influenced by the hedging activities of producers and consumers. Producers hedge by selling futures to lock in prices for their commodities, while consumers buy futures to secure a supply at a predictable price. This theory primarily focuses on the balance of hedging pressure between buyers and sellers rather than the impact of storage costs on price structure. In the scenario described by Medallion Bank, there is no specific emphasis on hedging activities distinctly influencing the market dynamics, rather the report highlights a balanced trade environment and high inventory, which aligns less with hedging pressures and more with storage considerations.<\/p><p><b>C is incorrect.<\/b> The Insurance Theory revolves around the concept that producers use futures markets as a form of price insurance, locking in prices to stabilize revenue against price fluctuations. This theory would suggest that futures prices should be lower than the spot prices to compensate the speculators who assume the price risk. However, the situation described in the wheat market report does not focus on this aspect of futures trading. Instead, it discusses a balanced and stable trading environment with high inventory levels, which does not inherently involve using futures as insurance against price drops but rather managing the costs associated with surplus inventory. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1(f) Compare theories of commodity futures returns.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 13–16 · Laurent Boutilier<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Laurent Boutilier is a financial analyst for The Allegro group, a defined benefit plan. Recently,<\/p><p>there has been a lot of volatility in the crude oil and natural gas market. Laurent shares the<\/p><p>information with his colleagues, and Roger Kakou, his supervisor, comments.<\/p><p>Comment 1: “Crude oil demand and supply are mainly affected by economic growth.”<\/p><p>Comment 2: “In colder weather, the demand for natural gas decreases.”<\/p><p>Boutilier meets Jane Butler, a market strategist with Medallion Bank, to discuss future<\/p><p>investment opportunities for their pension plan. Butler suggests the Genghis commodity fund<\/p><p>(Genghis fund), which attempts to produce trading profits by capitalizing on futures and spot<\/p><p>commodity price mispricing. The Genghis fund&#x27;s current asset allocation is presented in the<\/p><p>Exhibit below.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0025.webp\" style=\"max-width:min(100%,337px)\" alt=\"Exhibit 1: Genghis Fund’s Asset Allocation Commodity Sector Allocation (%) Precious metals 34 Grain 11 Softs 22 Energy 33\"><p>Butler mentions that the Genghis Fund has diversification benefits because of the fund’s low<\/p><p>correlation with bonds and stocks. This prompts Laurent to ask Butler, “What factors affect the<\/p><p>valuation of commodities but do not affect bond and stock valuation?”<\/p><p>Butler shares the following futures contract data for three markets The Genghis Fund invests in.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0026.webp\" style=\"max-width:min(100%,458px)\" alt=\"Exhibit 2: Selected Commodity Futures Information Month Wheat Price Platinum Price Crude Oil Price ($/Pound) ($/t.oz) ($/barrel) January 761.25 1, 021.1 78.87 March 786.00 955.5 77.05 June 792.10 1, 003.1 75.67\"><p>Medallion Bank recently released a report on the wheat market. Butler shares some key report<\/p><p>highlights with Laurent: “The wheat market had an unusually high harvest. However, the wheat futures trade is balanced between consumers and producers. This condition is expected to<\/p><p>persist in the future.”<\/p><\/div><\/details><div class=\"qtext\"><p>From the conclusion of Medallion Bank’s wheat market report, the wheat futures curve shape is likely to be consistent with the:<\/p><\/div>", "subj": "alternatives"}, {"n": 17, "q": "From Exhibit 1, Smith is most likely to conclude that:", "opts": ["The natural gas futures are in contango.", "The calendar spread for natural gas is $ 0.09.", "The basis for the near-term natural gas futures contract is $0.09 per therm."], "ans": "B", "expl": "The correct answer is option B because the calendar spread is calculated by subtracting the longer-term futures price from the near-term futures price. In Exhibit 1, the near-term futures price for natural gas is listed as \\$2.43, and the longer-term futures price is \\$2.34. Therefore, the calendar spread is calculated as follows: This calculation directly supports the statement in option B, indicating that the calendar spread for natural gas is \\$0.09. This spread represents the price difference between two futures contracts with different delivery dates, which is a critical factor in futures trading strategies and risk management. A is incorrect. The statement that the natural gas futures are in contango is not supported by the data presented. Contango in the futures market is a condition where the futures prices are higher than the spot prices, typically indicating expectations of rising prices over time. However, according to Exhibit 1, the spot price of natural gas is \\$3.36, which is higher than both the near-term (\\$2.43) and longer-term (\\$2.34) futures prices. This scenario actually indicates a market in backwardation, where the spot prices are higher than the futures prices, suggesting immediate demand is stronger than future expectations. C is incorrect. The basis for the near-term natural gas futures contract is incorrectly calculated in the option. The basis is defined as the difference between the spot price and the futures price. According to Exhibit 1, the spot price is \\$3.36 and the near-term futures price is $2.43. Therefore, the correct calculation of the basis should be: This calculation shows that the basis is actually $0.93 per therm, not $0.09 as stated in option C. Understanding the basis is crucial for commodity traders as it affects hedging and arbitrage opportunities. ", "explhtml": "<p>The correct answer is option B because the calendar spread is calculated by subtracting the longer-term futures price from the near-term futures price. In Exhibit 1, the near-term futures price for natural gas is listed as \\$2.43, and the longer-term futures price is \\$2.34. Therefore, the calendar spread is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0029.webp\" style=\"max-width:min(100%,185px)\" alt=\"$2.43 −$2.34 = $0.09.\"><p>This calculation directly supports the statement in option B, indicating that the calendar spread for natural gas is \\$0.09. This spread represents the price difference between two futures contracts with different delivery dates, which is a critical factor in futures trading strategies and risk management.<\/p><p><b>A is incorrect.<\/b> The statement that the natural gas futures are in contango is not supported by the data presented. Contango in the futures market is a condition where the futures prices are higher than the spot prices, typically indicating expectations of rising prices over time. However, according to Exhibit 1, the spot price of natural gas is \\$3.36, which is higher than both the near-term (\\$2.43) and longer-term (\\$2.34) futures prices. This scenario actually indicates a market in backwardation, where the spot prices are higher than the futures prices, suggesting immediate demand is stronger than future expectations.<\/p><p><b>C is incorrect.<\/b> The basis for the near-term natural gas futures contract is incorrectly calculated in the option. The basis is defined as the difference between the spot price and the futures price. According to Exhibit 1, the spot price is \\$3.36 and the near-term futures price is $2.43. Therefore, the correct calculation of the basis should be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0030.webp\" style=\"max-width:min(100%,185px)\" alt=\"$3.36 −$2.43 = $0.93.\"><p>This calculation shows that the basis is actually $0.93 per therm, not $0.09 as stated in option C. Understanding the basis is crucial for commodity traders as it affects hedging and arbitrage opportunities. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodity Derivatives, LOS 1 (e) Analyze the relationship between spot prices and futures prices in markets in contango and markets in backwardation.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Stella Dean<\/summary><div class=\"vig-body\"><p>Stella Dean is a Darwin Commodities (DC) portfolio manager, an Irish commodity-based hedge<\/p><p>fund. DC’s strategy allocates exposure among ten commodities using a fixed weighing scheme,<\/p><p>with its benchmark being the Thomson Reuters/Core Commodity CRB Index (TR/CC CRB). Mike<\/p><p>Smith, a junior analyst, helps Dean manage the precious metals and energy sectors. The two<\/p><p>meet to discuss the factors that affect the value of the commodities they manage. Smith makes<\/p><p>the following statements:<\/p><p><b>Statement 1:<\/b> Transport costs are negatively related to futures prices.<\/p><p><b>Statement 2:<\/b> Unlike bonds and stocks, most commodities generate future cash flows.<\/p><p><b>Statement 3:<\/b> Commodities are primarily invested via derivatives.<\/p><p>Dean and Smith then discuss new investment opportunities in the energy sector. They review the<\/p><p>natural gas futures data presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0027.webp\" style=\"max-width:min(100%,342px)\" alt=\"Spot price Longer-Term Near-Term Futures Price Futures Price $3.36 $2.34 $2.43\"><p>Smith researched the energy sector and came to the following conclusions:<\/p><p>1. Energy, unlike softs, requires minimal storage and is consumed in realtime. 2. The producers have been less concerned about price than the consumers.<\/p><p>After the energy sector discussion, Dean reviews DC’s performance of a long position in the gold<\/p><p>futures contract. He notes that the portfolio earned a 7% roll return after the contract was rolled<\/p><p>forward and a 6% price return on the gold futures position last year. The long position was held<\/p><p>with a collateral equal to 100% of the position at a risk-free rate of 2%.<\/p><p>Smith asks Dean, “How will the state of the futures market affect the roll return?”<\/p><p>Dean responds with the following statements:<\/p><p><b>Statement 4:<\/b> When a futures market is in contango, the roll returns will be negative.<\/p><p><b>Statement 5:<\/b> When a futures market is in backwardation, the roll return will be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0028.webp\" style=\"max-width:min(100%,77px)\" alt=\"positive.\"><p>Due to a decrease in drilling activity in Russia and the North Sea, Dean believes the price of<\/p><p>natural gas will increase. The expected price volatility of natural gas has been higher than the<\/p><p>actual price volatility, and the trend is expected to persist. Dean also expects the S&amp;P GSCI<\/p><p>Natural Gas Index to increase.<\/p><p>Smith mentions that there are several ways that they can use swaps to take advantage of Dean’s<\/p><p>expectations about natural gas. Such positions are 1) a short position in excess return swap<\/p><p>based on the current level of the S&amp;P GSCI Natural Gas Index, 2) a long volatility swap on<\/p><p>natural gas, and 3) a basis swap long on natural gas.<\/p><\/div><\/details><div class=\"qtext\"><p>From Exhibit 1, Smith is most likely to conclude that:<\/p><\/div>", "subj": "alternatives"}, {"n": 18, "q": "Which of Dean’s statements regarding transportation and valuation of commodities is accurate:", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "C", "expl": "Statement 3, which asserts that commodities are primarily invested via derivatives, is accurate. Derivatives such as futures, options, and swaps are the predominant instruments used for investing in commodities. This is because they allow investors to hedge against price volatility without the need to physically hold the commodities. Derivatives also provide leverage, which can enhance returns but also increase risk. In the context of Darwin Commodities, the use of derivatives is evident in their management of commodity exposures and strategies for capturing market movements and roll returns. This approach is typical in commodity markets where direct investment in physical assets can be cumbersome and tied with logistical challenges. A is incorrect. Transport costs are generally positively related to futures prices, contrary to what Statement 1 suggests. When transport costs increase, it becomes more expensive to move commodities from producers to consumers, which can lead to higher prices in the futures markets as market participants anticipate higher costs in the future. Additionally, higher transport costs can restrict supply in regions far from production sites, leading to higher prices due to supply constraints. Therefore, the statement that transport costs are negatively related to futures prices is incorrect as it overlooks these fundamental economic relationships. B is incorrect. Statement 2 is incorrect because it claims that most commodities generate future cash flows similar to bonds and stocks, which is not accurate. Unlike financial assets like bonds and stocks, which typically offer dividends or interest payments, commodities do not inherently generate cash flows. The returns from commodities are generally realized through capital gains - buying low and selling high - rather than through ongoing income. Commodities can yield indirect returns, such as through lease payments or rights usage in some cases, but these are not the norm and do not constitute direct cash flows generated by the commodities themselves. ", "explhtml": "<p>Statement 3, which asserts that commodities are primarily invested via derivatives, is accurate. Derivatives such as futures, options, and swaps are the predominant instruments used for investing in commodities. This is because they allow investors to hedge against price volatility without the need to physically hold the commodities. Derivatives also provide leverage, which can enhance returns but also increase risk. In the context of Darwin Commodities, the use of derivatives is evident in their management of commodity exposures and strategies for capturing market movements and roll returns. This approach is typical in commodity markets where direct investment in physical assets can be cumbersome and tied with logistical challenges.<\/p><p><b>A is incorrect<\/b>. Transport costs are generally positively related to futures prices, contrary to what Statement 1 suggests. When transport costs increase, it becomes more expensive to move commodities from producers to consumers, which can lead to higher prices in the futures markets as market participants anticipate higher costs in the future. Additionally, higher transport costs can restrict supply in regions far from production sites, leading to higher prices due to supply constraints. Therefore, the statement that transport costs are negatively related to futures prices is incorrect as it overlooks these fundamental economic relationships.<\/p><p><b>B is incorrect<\/b>. Statement 2 is incorrect because it claims that most commodities generate future cash flows similar to bonds and stocks, which is not accurate. Unlike financial assets like bonds and stocks, which typically offer dividends or interest payments, commodities do not inherently generate cash flows. The returns from commodities are generally realized through capital gains - buying low and selling high - rather than through ongoing income. Commodities can yield indirect returns, such as through lease payments or rights usage in some cases, but these are not the norm and do not constitute direct cash flows generated by the commodities themselves. <\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodity Derivatives, LOS 1 (a) Compare characteristics of commodity sectors.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 17–20 · Stella Dean<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stella Dean is a Darwin Commodities (DC) portfolio manager, an Irish commodity-based hedge<\/p><p>fund. DC’s strategy allocates exposure among ten commodities using a fixed weighing scheme,<\/p><p>with its benchmark being the Thomson Reuters/Core Commodity CRB Index (TR/CC CRB). Mike<\/p><p>Smith, a junior analyst, helps Dean manage the precious metals and energy sectors. The two<\/p><p>meet to discuss the factors that affect the value of the commodities they manage. Smith makes<\/p><p>the following statements:<\/p><p><b>Statement 1:<\/b> Transport costs are negatively related to futures prices.<\/p><p><b>Statement 2:<\/b> Unlike bonds and stocks, most commodities generate future cash flows.<\/p><p><b>Statement 3:<\/b> Commodities are primarily invested via derivatives.<\/p><p>Dean and Smith then discuss new investment opportunities in the energy sector. They review the<\/p><p>natural gas futures data presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0027.webp\" style=\"max-width:min(100%,342px)\" alt=\"Spot price Longer-Term Near-Term Futures Price Futures Price $3.36 $2.34 $2.43\"><p>Smith researched the energy sector and came to the following conclusions:<\/p><p>1. Energy, unlike softs, requires minimal storage and is consumed in realtime. 2. The producers have been less concerned about price than the consumers.<\/p><p>After the energy sector discussion, Dean reviews DC’s performance of a long position in the gold<\/p><p>futures contract. He notes that the portfolio earned a 7% roll return after the contract was rolled<\/p><p>forward and a 6% price return on the gold futures position last year. The long position was held<\/p><p>with a collateral equal to 100% of the position at a risk-free rate of 2%.<\/p><p>Smith asks Dean, “How will the state of the futures market affect the roll return?”<\/p><p>Dean responds with the following statements:<\/p><p><b>Statement 4:<\/b> When a futures market is in contango, the roll returns will be negative.<\/p><p><b>Statement 5:<\/b> When a futures market is in backwardation, the roll return will be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0028.webp\" style=\"max-width:min(100%,77px)\" alt=\"positive.\"><p>Due to a decrease in drilling activity in Russia and the North Sea, Dean believes the price of<\/p><p>natural gas will increase. The expected price volatility of natural gas has been higher than the<\/p><p>actual price volatility, and the trend is expected to persist. Dean also expects the S&amp;P GSCI<\/p><p>Natural Gas Index to increase.<\/p><p>Smith mentions that there are several ways that they can use swaps to take advantage of Dean’s<\/p><p>expectations about natural gas. Such positions are 1) a short position in excess return swap<\/p><p>based on the current level of the S&amp;P GSCI Natural Gas Index, 2) a long volatility swap on<\/p><p>natural gas, and 3) a basis swap long on natural gas.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Dean’s statements regarding transportation and valuation of commodities is accurate:<\/p><\/div>", "subj": "alternatives"}, {"n": 19, "q": "Based on Smith’s research on the energy sector and information from Exhibit 1, the futures price curve shape for natural gas is most consistent with the following:", "opts": ["Theory of storage.", "Insurance theory.", "Hedging pressure hypothesis."], "ans": "A", "expl": "The correct answer is option A, which aligns with the theory of storage. The theory of storage explains that the futures price curve for a commodity like natural gas, which is consumed in real-time and requires minimal storage, will typically exhibit a pattern of backwardation. This is evident from Exhibit 1, where the longer-term futures price ($2.34) is lower than the near-term futures price ($2.43), indicating a downward sloping curve. This pattern suggests that the costs associated with storing natural gas are avoided due to its immediate consumption, leading to lower future prices as the delivery date extends. This is consistent with Smith's research, which highlights that energy commodities like natural gas are consumed in real-time and thus, do not incur significant storage costs. B is incorrect. The insurance theory, which posits that futures prices reflect a premium for insurance against price volatility, does not adequately explain the observed futures price curve for natural gas. In the case of natural gas, the immediate consumption and minimal storage negate the need for such an insurance premium. Furthermore, the insurance theory would typically lead to a contango market, where future prices are higher than spot prices, contrary to what is observed in Exhibit 1. Therefore, the insurance theory does not align with the current pricing structure of natural gas futures. C is incorrect. The hedging pressure hypothesis posits that the balance of hedging activities between producers and consumers shapes the futures price curve. While this theory could explain variations in futures prices, it does not specifically address the characteristics of natural gas as highlighted in Smith's research. The hypothesis would be more applicable if there were significant discrepancies in producers' and consumers' hedging needs that could lead to contango or backwardation. However, the minimal storage requirement and real-time consumption of natural gas reduce the impact of hedging pressures on the futures curve, making this hypothesis less relevant to the observed data in Exhibit 1. ", "explhtml": "<p>The correct answer is option A, which aligns with the theory of storage. The theory of storage explains that the futures price curve for a commodity like natural gas, which is consumed in real-time and requires minimal storage, will typically exhibit a pattern of backwardation. This is evident from Exhibit 1, where the longer-term futures price ($2.34) is lower than the near-term futures price ($2.43), indicating a downward sloping curve. This pattern suggests that the costs associated with storing natural gas are avoided due to its immediate consumption, leading to lower future prices as the delivery date extends. This is consistent with Smith&#x27;s research, which highlights that energy commodities like natural gas are consumed in real-time and thus, do not incur significant storage costs.<\/p><p><b>B is incorrect<\/b>. The insurance theory, which posits that futures prices reflect a premium for insurance against price volatility, does not adequately explain the observed futures price curve for natural gas. In the case of natural gas, the immediate consumption and minimal storage negate the need for such an insurance premium. Furthermore, the insurance theory would typically lead to a contango market, where future prices are higher than spot prices, contrary to what is observed in Exhibit 1. Therefore, the insurance theory does not align with the current
