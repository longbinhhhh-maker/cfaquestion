ing high-risk, high-reward<\/p><p>opportunities within the volatile tech sector. With a blend of quantitative and fundamental<\/p><p>analysis, Elara has set her sights on two companies that present unique investment<\/p><p>considerations:<\/p><p>Orion Technologies (ORT), a established tech giant struggling with a stagnating market<\/p><p>share and increasing regulatory scrutiny.<\/p><p>Andromeda Innovations (ANDI), a rising start-up specializing in artificial intelligence,<\/p><p>gaining momentum with recent product breakthroughs.<\/p><p>Elara believes a carefully designed investment approach pairing short positions in ORT with long<\/p><p>positions in ANDI could exploit market inefficiencies. This case study explores Elara&#x27;s evaluation<\/p><p>of these companies and tests her execution of complex financial strategies like short-selling,<\/p><p>leverage, and derivatives.<\/p><p>Elara Cross is assessing the prospects of Orion Technologies (ORT) and Andromeda Innovations<\/p><p>(ANDI). ORT is expected to experience a price drop due to litigation issues, while ANDI is facing<\/p><p>dilution from a convertible debt offering but has strong growth prospects.<\/p><\/div><\/details><div class=\"qtext\"><p>With ORT&#x27;s beta of 1.2 and holding 50,000 shares, if Elara wants to hedge the short position using S&amp;P 500 index futures (multiplier of $250 and index beta of 1), how many contracts should she short given the ORT stock price is $200 and the index is at 4,000?<\/p><\/div>", "subj": "alternatives"}, {"n": 43, "q": "With convertible bonds of ANDI exchangeable for 20 shares and an expected increase in ANDI's share price from $50 to $75, if the convertible bonds are valued at $950 with a face value of $1,000, what profit per bond can Elara expect?", "opts": ["No arbitrage opportunity.", "$600 profit per bond.", "$550 profit per bond."], "ans": "C", "expl": "as the profit from convertible bond arbitrage should be calculated based on the most advantageous outcome for the investor. In this case, the convertible bond for Andromeda Innovations (ANDI) can be converted into 20 shares, and with the expected share price rising to $75, the conversion value is $1,500. Since the bond is purchased at $950, the profit from conversion is $1,500 - $950 = $550. This approach is rational because the conversion value ($1,500) exceeds the face value ($1,000), making conversion the optimal strategy. The investor cannot simultaneously benefit from both conversion and face value redemption, as these are mutually exclusive. max[(Conversion Ratio × Expected Share Price − Bond Price), (Face Value − Bond Price)] The bond is currently priced at $950, Therefore, the profit calculation is: Since $550 > $50, the profit per bond is $ 500, making Option C correct. A is incorrect. The option stating \"No arbitrage opportunity\" is incorrect because the calculation clearly shows a significant arbitrage opportunity. The disparity between the conversion value of the bond ($1500) and its current market price ($950) provides a clear chance to make a profit. Additionally, the difference between the bond's face value and its market price further enhances the arbitrage opportunity, making this option invalid. B is incorrect. It double-counts the profit by adding both the conversion gain ($550) and the face value gain ($50), resulting in $600. This is flawed because once the bond is converted, the investor forfeits the right to redeem it for face value, so the gain from redemption cannot be realized alongside conversion.. ", "explhtml": "<p>as the profit from convertible bond arbitrage should be calculated based on the most advantageous outcome for the investor. In this case, the convertible bond for Andromeda Innovations (ANDI) can be converted into 20 shares, and with the expected share price rising to $75, the conversion value is $1,500. Since the bond is purchased at $950, the profit from conversion is $1,500 - $950 = $550. This approach is rational because the conversion value ($1,500) exceeds the face value ($1,000), making conversion the optimal strategy. The investor cannot simultaneously benefit from both conversion and face value redemption, as these are mutually exclusive.<\/p><p>max[(Conversion Ratio × Expected Share Price − Bond Price), (Face Value − Bond Price)]<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0068.webp\" style=\"max-width:min(100%,282px)\" alt=\"Conversion Value = 20 × 75 = 1500\"><p>The bond is currently priced at $950, Therefore, the profit calculation is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0069.webp\" style=\"max-width:min(100%,352px)\" alt=\"Profit per Bond = 1500 −950 = 550 Profit from redemption = 1, 000 −950 = $50\"><p>Since $550 &gt; $50, the profit per bond is $ 500, making Option C correct.<\/p><p><b>A is incorrect<\/b>. The option stating &quot;No arbitrage opportunity&quot; is incorrect because the calculation clearly shows a significant arbitrage opportunity. The disparity between the conversion value of the bond ($1500) and its current market price ($950) provides a clear chance to make a profit. Additionally, the difference between the bond&#x27;s face value and its market price further enhances the arbitrage opportunity, making this option invalid.<\/p><p><b>B is incorrect<\/b>. It double-counts the profit by adding both the conversion gain ($550) and the face value gain ($50), resulting in $600. This is flawed because once the bond is converted, the investor forfeits the right to redeem it for face value, so the gain from redemption cannot be realized alongside conversion.. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Proteus Tech Ventures (PTV)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Proteus Tech Ventures (PTV) is a mid-sized technology-focused hedge fund managed by Elara<\/p><p>Cross. The fund has gained a reputation for identifying and leveraging high-risk, high-reward<\/p><p>opportunities within the volatile tech sector. With a blend of quantitative and fundamental<\/p><p>analysis, Elara has set her sights on two companies that present unique investment<\/p><p>considerations:<\/p><p>Orion Technologies (ORT), a established tech giant struggling with a stagnating market<\/p><p>share and increasing regulatory scrutiny.<\/p><p>Andromeda Innovations (ANDI), a rising start-up specializing in artificial intelligence,<\/p><p>gaining momentum with recent product breakthroughs.<\/p><p>Elara believes a carefully designed investment approach pairing short positions in ORT with long<\/p><p>positions in ANDI could exploit market inefficiencies. This case study explores Elara&#x27;s evaluation<\/p><p>of these companies and tests her execution of complex financial strategies like short-selling,<\/p><p>leverage, and derivatives.<\/p><p>Elara Cross is assessing the prospects of Orion Technologies (ORT) and Andromeda Innovations<\/p><p>(ANDI). ORT is expected to experience a price drop due to litigation issues, while ANDI is facing<\/p><p>dilution from a convertible debt offering but has strong growth prospects.<\/p><\/div><\/details><div class=\"qtext\"><p>With convertible bonds of ANDI exchangeable for 20 shares and an expected increase in ANDI&#x27;s share price from $50 to $75, if the convertible bonds are valued at $950 with a face value of $1,000, what profit per bond can Elara expect?<\/p><\/div>", "subj": "alternatives"}, {"n": 44, "q": "How many straddles can Proteus Tech Ventures purchase if allocating $1,000,000 to a straddle strategy using NASDAQ index options at a premium of $250 for both call and put options?", "opts": ["2,000 straddles.", "4,000 straddles.", "8,000 straddles."], "ans": "A", "expl": "A straddle in options trading involves the simultaneous purchase of a call and a put option with the same strike price and expiration date. In this scenario, the premium for each option (call and put) is $250, making the total cost for one straddle $500 ($250 for the call + $250 for the put). To determine how many straddles Proteus Tech Ventures can purchase with a $1,000,000 allocation, we divide the total funds by the cost per straddle: This calculation shows that with $1,000,000, Proteus Tech Ventures can purchase 2,000 straddles. This strategy allows the fund to potentially benefit from significant movements in the NASDAQ index, regardless of the direction, while the total investment remains within the allocated budget. B is incorrect. The option suggesting that 4,000 straddles can be purchased misunderstands the calculation of the total cost per straddle. If each straddle costs $500, then with $1,000,000, only 2,000 straddles can be bought. The calculation for 4,000 straddles would imply that each straddle costs $250, which is incorrect as this is only the cost of one type of option (call or put), not the combined cost of both. C is incorrect. The suggestion that 8,000 straddles can be purchased is a significant miscalculation. This would imply that each straddle costs $125, which is far below the actual combined cost of $500 per straddle. Such a calculation disregards the correct summing of the individual premiums for the call and put options, leading to an unrealistic and impractical number of straddles that could be purchased with the given budget. ", "explhtml": "<p>A straddle in options trading involves the simultaneous purchase of a call and a put option with the same strike price and expiration date. In this scenario, the premium for each option (call and put) is $250, making the total cost for one straddle $500 ($250 for the call + $250 for the put). To determine how many straddles Proteus Tech Ventures can purchase with a $1,000,000 allocation, we divide the total funds by the cost per straddle:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0070.webp\" style=\"max-width:min(100%,454px)\" alt=\"Total Allocation 1000000 Number of Straddles = = = 2000 Cost per Straddle 500\"><p>This calculation shows that with $1,000,000, Proteus Tech Ventures can purchase 2,000 straddles. This strategy allows the fund to potentially benefit from significant movements in the NASDAQ index, regardless of the direction, while the total investment remains within the allocated budget.<\/p><p><b>B is incorrect<\/b>. The option suggesting that 4,000 straddles can be purchased misunderstands the calculation of the total cost per straddle. If each straddle costs $500, then with $1,000,000, only 2,000 straddles can be bought. The calculation for 4,000 straddles would imply that each straddle costs $250, which is incorrect as this is only the cost of one type of option (call or put), not the combined cost of both.<\/p><p><b>C is incorrect<\/b>. The suggestion that 8,000 straddles can be purchased is a significant miscalculation. This would imply that each straddle costs $125, which is far below the actual combined cost of $500 per straddle. Such a calculation disregards the correct summing of the individual premiums for the call and put options, leading to an unrealistic and impractical number of straddles that could be purchased with the given budget. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Proteus Tech Ventures (PTV)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Proteus Tech Ventures (PTV) is a mid-sized technology-focused hedge fund managed by Elara<\/p><p>Cross. The fund has gained a reputation for identifying and leveraging high-risk, high-reward<\/p><p>opportunities within the volatile tech sector. With a blend of quantitative and fundamental<\/p><p>analysis, Elara has set her sights on two companies that present unique investment<\/p><p>considerations:<\/p><p>Orion Technologies (ORT), a established tech giant struggling with a stagnating market<\/p><p>share and increasing regulatory scrutiny.<\/p><p>Andromeda Innovations (ANDI), a rising start-up specializing in artificial intelligence,<\/p><p>gaining momentum with recent product breakthroughs.<\/p><p>Elara believes a carefully designed investment approach pairing short positions in ORT with long<\/p><p>positions in ANDI could exploit market inefficiencies. This case study explores Elara&#x27;s evaluation<\/p><p>of these companies and tests her execution of complex financial strategies like short-selling,<\/p><p>leverage, and derivatives.<\/p><p>Elara Cross is assessing the prospects of Orion Technologies (ORT) and Andromeda Innovations<\/p><p>(ANDI). ORT is expected to experience a price drop due to litigation issues, while ANDI is facing<\/p><p>dilution from a convertible debt offering but has strong growth prospects.<\/p><\/div><\/details><div class=\"qtext\"><p>How many straddles can Proteus Tech Ventures purchase if allocating $1,000,000 to a straddle strategy using NASDAQ index options at a premium of $250 for both call and put options?<\/p><\/div>", "subj": "alternatives"}, {"n": 45, "q": "The expected return of the fund-of-funds portfolio is closest to.", "opts": ["9.80%", "10.20%", "9.60%"], "ans": "B", "expl": "The expected return of a fund-of-funds portfolio is calculated by taking the weighted average of the returns of the individual funds included in the portfolio. In this scenario, the fund-of-funds manager has allocated 40% to Fund A, 30% to Fund B, and 30% to Fund C, with respective returns of 12%, 8%, and 10%. The formula to calculate the expected return is: values, we get: Thus, the correct answer is Option B, which states that the expected return is 10.2%. A is incorrect. The calculation for Option A, which suggests a return of 9.8%, does not align with the weighted average of the returns from the funds. Using the weights and returns provided, the correct calculation leads to a result of 10.2%, not 9.8%. This discrepancy indicates a miscalculation or misapplication of the weights or returns of the individual funds in the portfolio. C is incorrect. Similarly, Option C, which suggests a return of 9.6%, also results from incorrect calculations. As demonstrated, the proper application of the weights to the respective returns of the funds yields a total expected return of 10.2%. Any deviation from this figure suggests an error in either the weights used or the returns of the individual funds, or both. ", "explhtml": "<p>The expected return of a fund-of-funds portfolio is calculated by taking the weighted average of the returns of the individual funds included in the portfolio. In this scenario, the fund-of-funds manager has allocated 40% to Fund A, 30% to Fund B, and 30% to Fund C, with respective returns of 12%, 8%, and 10%. The formula to calculate the expected return is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0071.webp\" style=\"max-width:min(100%,757px)\" alt=\"Expected return = (wA × rA) + (wB × rB) + (wC × rC) Where  wA = 0.40 ,  rA = 0.12 ,  wB = 0.30 ,  rB = 0.08 ,  wC = 0.30 , and  rC = 0.10 . Plugging in these\"><p>values, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0072.webp\" style=\"max-width:min(100%,490px)\" alt=\"Expected return = (0.40 × 0.12) + (0.30 × 0.08) + (0.30 × 0.10) = 0.048 + 0.024 + 0.030 = 0.102 or 10.2%\"><p>Thus, the correct answer is <b>Option B<\/b>, which states that the expected return is 10.2%.<\/p><p><b>A is incorrect<\/b>. The calculation for Option A, which suggests a return of 9.8%, does not align with the weighted average of the returns from the funds. Using the weights and returns provided, the correct calculation leads to a result of 10.2%, not 9.8%. This discrepancy indicates a miscalculation or misapplication of the weights or returns of the individual funds in the portfolio.<\/p><p><b>C is incorrect<\/b>. Similarly, Option C, which suggests a return of 9.6%, also results from incorrect calculations. As demonstrated, the proper application of the weights to the respective returns of the funds yields a total expected return of 10.2%. Any deviation from this figure suggests an error in either the weights used or the returns of the individual funds, or both. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Sam Reynolds<\/summary><div class=\"vig-body\"><p>As the hedge fund industry has evolved, a broad range of strategies has been developed to cater<\/p><p>to the different risk and return profiles sought by investors. Hedge funds are often classified<\/p><p>based on the instruments they invest in, their trading philosophies, and the types of risks they<\/p><p>assume. Some prominent classifications of hedge fund strategies include equity hedge, event-<\/p><p>driven, fund-of-funds, macro, relative value, risk parity, and blockchain strategies, among others.<\/p><p>Sam Reynolds, a portfolio manager at a wealth management firm, is analyzing various hedge<\/p><p>fund strategies to diversify the firm’s investment portfolios. He&#x27;s considering the implications of<\/p><p>these strategies on the risk-return spectrum and their potential liquidity constraints. Specifically,<\/p><p>Sam is evaluating six main categories of hedge fund strategies: equity, event-driven, relative<\/p><p>value, opportunistic, specialist, and multi-manager, alongside specific sub-categories such as<\/p><p>long/short equity, merger arbitrage, fixed income arbitrage, global macro, volatility strategies,<\/p><p>and fund-of-funds.<\/p><p>The case continues, examining how these strategies are employed by hedge funds, their<\/p><p>similarities and differences across different hedge fund data vendors, and how they might be<\/p><p>used in constructing a well-diversified investment portfolio. Let&#x27;s walk through some of the<\/p><p>numerical and theoretical aspects that Sam needs to consider in his analysis of hedge fund<\/p><p>strategies.<\/p><p>A fund-of-funds manager is evaluating three hedge funds for inclusion in the portfolio: Fund A<\/p><p>with a return of 12%, Fund B with a return of 8%, and Fund C with a return of 10%. The<\/p><p>manager decides to invest 40% in Fund A, 30% in Fund B, and 30% in Fund C.<\/p><\/div><\/details><div class=\"qtext\"><p>The expected return of the fund-of-funds portfolio is closest to.<\/p><\/div>", "subj": "alternatives"}, {"n": 46, "q": "Sam notes that the liquidity constraints of hedge funds, such as initial lock-up periods, can affect their ability to execute strategies effectively. Which of the following is a most likely reason that hedge funds with these constraints often report superior performance?", "opts": ["Hedge funds with liquidity constraints can take on higher levels of risk without immediate redemption pressures.", "These constraints enable hedge funds to charge lower management fees, leading to higher net returns.", "The reporting of performance is often more timely and accurate due to longer periods between valuations."], "ans": "A", "expl": "Hedge funds with liquidity constraints such as lock-up periods, gates, and exit windows provide managers the ability to engage in long-term strategies without the immediate pressure of redemptions. This setup allows them to invest in less liquid assets that potentially offer higher returns but require a longer time to realize these gains. The absence of frequent redemption pressures means that these funds can avoid the costs and negative market impacts that might arise from the need to liquidate positions quickly to meet redemption requests. This strategic advantage supports the pursuit of higher-risk investments, which can lead to superior performance outcomes compared to funds that must maintain higher levels of liquidity to meet short-term withdrawals. B is incorrect. Liquidity constraints such as lock-up periods do not inherently lead to lower management fees. In fact, hedge funds with these constraints often charge high fees to compensate for the additional risk and effort involved in managing less liquid and longer-term investments. The rationale behind higher fees in such funds is linked to the specialized skills required to manage and execute long-term, complex strategies and the limited liquidity offered to investors. Therefore, suggesting that liquidity constraints enable hedge funds to charge lower fees is inaccurate as it overlooks the complexities and risks associated with managing such funds. C is incorrect. While it is true that longer periods between valuations might allow for more deliberate and potentially accurate reporting, this factor alone does not directly contribute to superior performance. The primary advantage of liquidity constraints in hedge funds is the ability to hold onto investments that may appreciate significantly over time without the need to sell prematurely. The timing of performance reporting, although important for transparency and investor relations, does not itself enhance the performance of the investments. Thus, attributing superior performance to the timing of reporting misrepresents the actual mechanisms through which performance gains are achieved in hedge funds with liquidity constraints. ", "explhtml": "<p>Hedge funds with liquidity constraints such as lock-up periods, gates, and exit windows provide managers the ability to engage in long-term strategies without the immediate pressure of redemptions. This setup allows them to invest in less liquid assets that potentially offer higher returns but require a longer time to realize these gains. The absence of frequent redemption pressures means that these funds can avoid the costs and negative market impacts that might arise from the need to liquidate positions quickly to meet redemption requests. This strategic advantage supports the pursuit of higher-risk investments, which can lead to superior performance outcomes compared to funds that must maintain higher levels of liquidity to meet short-term withdrawals.<\/p><p><b>B is incorrect<\/b>. Liquidity constraints such as lock-up periods do not inherently lead to lower management fees. In fact, hedge funds with these constraints often charge high fees to compensate for the additional risk and effort involved in managing less liquid and longer-term investments. The rationale behind higher fees in such funds is linked to the specialized skills required to manage and execute long-term, complex strategies and the limited liquidity offered to investors. Therefore, suggesting that liquidity constraints enable hedge funds to charge lower fees is inaccurate as it overlooks the complexities and risks associated with managing such funds.<\/p><p><b>C is incorrect<\/b>. While it is true that longer periods between valuations might allow for more deliberate and potentially accurate reporting, this factor alone does not directly contribute to superior performance. The primary advantage of liquidity constraints in hedge funds is the ability to hold onto investments that may appreciate significantly over time without the need to sell prematurely. The timing of performance reporting, although important for transparency and investor relations, does not itself enhance the performance of the investments. Thus, attributing superior performance to the timing of reporting misrepresents the actual mechanisms through which performance gains are achieved in hedge funds with liquidity constraints. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Sam Reynolds<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>As the hedge fund industry has evolved, a broad range of strategies has been developed to cater<\/p><p>to the different risk and return profiles sought by investors. Hedge funds are often classified<\/p><p>based on the instruments they invest in, their trading philosophies, and the types of risks they<\/p><p>assume. Some prominent classifications of hedge fund strategies include equity hedge, event-<\/p><p>driven, fund-of-funds, macro, relative value, risk parity, and blockchain strategies, among others.<\/p><p>Sam Reynolds, a portfolio manager at a wealth management firm, is analyzing various hedge<\/p><p>fund strategies to diversify the firm’s investment portfolios. He&#x27;s considering the implications of<\/p><p>these strategies on the risk-return spectrum and their potential liquidity constraints. Specifically,<\/p><p>Sam is evaluating six main categories of hedge fund strategies: equity, event-driven, relative<\/p><p>value, opportunistic, specialist, and multi-manager, alongside specific sub-categories such as<\/p><p>long/short equity, merger arbitrage, fixed income arbitrage, global macro, volatility strategies,<\/p><p>and fund-of-funds.<\/p><p>The case continues, examining how these strategies are employed by hedge funds, their<\/p><p>similarities and differences across different hedge fund data vendors, and how they might be<\/p><p>used in constructing a well-diversified investment portfolio. Let&#x27;s walk through some of the<\/p><p>numerical and theoretical aspects that Sam needs to consider in his analysis of hedge fund<\/p><p>strategies.<\/p><p>A fund-of-funds manager is evaluating three hedge funds for inclusion in the portfolio: Fund A<\/p><p>with a return of 12%, Fund B with a return of 8%, and Fund C with a return of 10%. The<\/p><p>manager decides to invest 40% in Fund A, 30% in Fund B, and 30% in Fund C.<\/p><\/div><\/details><div class=\"qtext\"><p>Sam notes that the liquidity constraints of hedge funds, such as initial lock-up periods, can affect their ability to execute strategies effectively. Which of the following is a most likely reason that hedge funds with these constraints often report superior performance?<\/p><\/div>", "subj": "alternatives"}, {"n": 47, "q": "When comparing the fee structures of hedge funds, Sam observes the traditional \"2 and 20\" fee model, where a 2% management fee and a 20% performance fee are common. Why might a hedge fund manager prefer this fee structure?", "opts": ["It ensures a stable income from management fees regardless of the fund's performance.", "Higher management fees discourage frequent trading and market timing among investors.", "The performance fee aligns the interests of the manager with those of the investors by rewarding successful strategies."], "ans": "C", "expl": "The \"2 and 20\" fee structure is particularly favored by hedge fund managers because it effectively balances a guaranteed income with a performance-based incentive. The 2% management fee ensures that managers receive a steady income to cover operational costs, such as salaries and office expenses, irrespective of the fund's performance. This fee provides a financial foundation that allows managers to operate the fund without the immediate pressure of generating positive returns. However, the more significant aspect of this fee structure is the 20% performance fee, which ties a substantial portion of the manager's compensation to the success of the fund. This alignment of interests encourages managers to strive for higher returns, as their financial success is directly linked to their ability to generate profits for the fund. Consequently, this structure motivates hedge fund managers to adopt strategies that maximize returns while managing risks effectively, benefiting both the managers and the investors. A is incorrect. While it is true that the 2% management fee provides a stable income, suggesting that this is the primary reason a manager would prefer the \"2 and 20\" structure is misleading. The management fee's primary role is to ensure the operational viability of the fund by covering basic expenses. Managers are more likely to be motivated by the potential for high earnings through the performance fee, which not only compensates them beyond the basic operational level but also aligns their financial interests with those of the investors, promoting a focus on high performance. B is incorrect. The statement that higher management fees discourage frequent trading and market timing among investors does not align with the primary purpose of these fees. Management fees are generally used to handle the day-to-day expenses of managing a fund and are not structured to influence trading behaviors or investment strategies. The performance fee component of the \"2 and 20\" structure is more influential in shaping the manager's trading and investment decisions, as it directly affects their compensation based on the fund's success. Therefore, the role of management fees is fundamentally operational rather than strategic in influencing trading frequency or style. ", "explhtml": "<p>The &quot;2 and 20&quot; fee structure is particularly favored by hedge fund managers because it effectively balances a guaranteed income with a performance-based incentive. The 2% management fee ensures that managers receive a steady income to cover operational costs, such as salaries and office expenses, irrespective of the fund&#x27;s performance. This fee provides a financial foundation that allows managers to operate the fund without the immediate pressure of generating positive returns. However, the more significant aspect of this fee structure is the 20% performance fee, which ties a substantial portion of the manager&#x27;s compensation to the success of the fund. This alignment of interests encourages managers to strive for higher returns, as their financial success is directly linked to their ability to generate profits for the fund. Consequently, this structure motivates hedge fund managers to adopt strategies that maximize returns while managing risks effectively, benefiting both the managers and the investors.<\/p><p><b>A is incorrect.<\/b> While it is true that the 2% management fee provides a stable income, suggesting that this is the primary reason a manager would prefer the &quot;2 and 20&quot; structure is misleading. The management fee&#x27;s primary role is to ensure the operational viability of the fund by covering basic expenses. Managers are more likely to be motivated by the potential for high earnings through the performance fee, which not only compensates them beyond the basic operational level but also aligns their financial interests with those of the investors, promoting a focus on high performance.<\/p><p><b>B is incorrect.<\/b> The statement that higher management fees discourage frequent trading and market timing among investors does not align with the primary purpose of these fees. Management fees are generally used to handle the day-to-day expenses of managing a fund and are not structured to influence trading behaviors or investment strategies. The performance fee component of the &quot;2 and 20&quot; structure is more influential in shaping the manager&#x27;s trading and investment decisions, as it directly affects their compensation based on the fund&#x27;s success. Therefore, the role of management fees is fundamentally operational rather than strategic in influencing trading frequency or style. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Sam Reynolds<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>As the hedge fund industry has evolved, a broad range of strategies has been developed to cater<\/p><p>to the different risk and return profiles sought by investors. Hedge funds are often classified<\/p><p>based on the instruments they invest in, their trading philosophies, and the types of risks they<\/p><p>assume. Some prominent classifications of hedge fund strategies include equity hedge, event-<\/p><p>driven, fund-of-funds, macro, relative value, risk parity, and blockchain strategies, among others.<\/p><p>Sam Reynolds, a portfolio manager at a wealth management firm, is analyzing various hedge<\/p><p>fund strategies to diversify the firm’s investment portfolios. He&#x27;s considering the implications of<\/p><p>these strategies on the risk-return spectrum and their potential liquidity constraints. Specifically,<\/p><p>Sam is evaluating six main categories of hedge fund strategies: equity, event-driven, relative<\/p><p>value, opportunistic, specialist, and multi-manager, alongside specific sub-categories such as<\/p><p>long/short equity, merger arbitrage, fixed income arbitrage, global macro, volatility strategies,<\/p><p>and fund-of-funds.<\/p><p>The case continues, examining how these strategies are employed by hedge funds, their<\/p><p>similarities and differences across different hedge fund data vendors, and how they might be<\/p><p>used in constructing a well-diversified investment portfolio. Let&#x27;s walk through some of the<\/p><p>numerical and theoretical aspects that Sam needs to consider in his analysis of hedge fund<\/p><p>strategies.<\/p><p>A fund-of-funds manager is evaluating three hedge funds for inclusion in the portfolio: Fund A<\/p><p>with a return of 12%, Fund B with a return of 8%, and Fund C with a return of 10%. The<\/p><p>manager decides to invest 40% in Fund A, 30% in Fund B, and 30% in Fund C.<\/p><\/div><\/details><div class=\"qtext\"><p>When comparing the fee structures of hedge funds, Sam observes the traditional &quot;2 and 20&quot; fee model, where a 2% management fee and a 20% performance fee are common. Why might a hedge fund manager prefer this fee structure?<\/p><\/div>", "subj": "alternatives"}, {"n": 48, "q": "Sam is evaluating the impact of leverage on hedge fund strategies. In particular, he's interested in understanding how leverage can amplify returns and risks. What is a primary consideration for the use of leverage in hedge fund strategies?", "opts": ["Leverage allows funds to mitigate market risk by diversifying across more positions.", "Leverage magnifies the potential for both gains and losses, affecting a fund's volatility and risk of large drawdowns.", "Hedge funds use leverage primarily to comply with regulatory requirements and maintain market neutrality."], "ans": "B", "expl": "Leverage in hedge fund strategies is a critical tool that allows funds to increase their investment exposure beyond the initial capital. By borrowing additional funds, hedge funds can potentially enhance their returns on successful investments. However, this also means that any losses incurred are magnified, which can significantly impact the fund's volatility and increase the risk of substantial drawdowns. The use of leverage introduces additional layers of risk management complexity, as funds must carefully balance the potential for higher returns against the increased risk of large losses. This balancing act is crucial in maintaining the fund's overall health and sustainability, especially during volatile market conditions. Therefore, understanding and managing the implications of leverage is paramount in hedge fund operations. A is incorrect. The statement that leverage allows funds to mitigate market risk by diversifying across more positions is misleading. While leverage does enable hedge funds to increase their market exposure, which could include diversification, it primarily increases the financial risk. The additional capital obtained through leverage can indeed be used to take on more positions, but this does not inherently mitigate market risks. Instead, it can exacerbate them if the market moves adversely relative to the leveraged positions. Therefore, leverage should be viewed more as a tool for potential return enhancement rather than risk mitigation. C is incorrect. The statement that hedge funds use leverage primarily to comply with regulatory requirements and maintain market neutrality is incorrect. While regulatory frameworks do influence how hedge funds can employ leverage, these regulations are generally designed to limit excessive risk-taking rather than encourage the use of leverage. Moreover, maintaining market neutrality is a strategy employed by some hedge funds, particularly those focusing on arbitrage strategies, but it is not the primary reason for using leverage. Hedge funds primarily use leverage to increase the potential returns on their investments, which inherently involves taking on greater risks. ", "explhtml": "<p>Leverage in hedge fund strategies is a critical tool that allows funds to increase their investment exposure beyond the initial capital. By borrowing additional funds, hedge funds can potentially enhance their returns on successful investments. However, this also means that any losses incurred are magnified, which can significantly impact the fund&#x27;s volatility and increase the risk of substantial drawdowns. The use of leverage introduces additional layers of risk management complexity, as funds must carefully balance the potential for higher returns against the increased risk of large losses. This balancing act is crucial in maintaining the fund&#x27;s overall health and sustainability, especially during volatile market conditions. Therefore, understanding and managing the implications of leverage is paramount in hedge fund operations.<\/p><p><b>A is incorrect.<\/b> The statement that leverage allows funds to mitigate market risk by diversifying across more positions is misleading. While leverage does enable hedge funds to increase their market exposure, which could include diversification, it primarily increases the financial risk. The additional capital obtained through leverage can indeed be used to take on more positions, but this does not inherently mitigate market risks. Instead, it can exacerbate them if the market moves adversely relative to the leveraged positions. Therefore, leverage should be viewed more as a tool for potential return enhancement rather than risk mitigation.<\/p><p><b>C is incorrect.<\/b> The statement that hedge funds use leverage primarily to comply with regulatory requirements and maintain market neutrality is incorrect. While regulatory frameworks do influence how hedge funds can employ leverage, these regulations are generally designed to limit excessive risk-taking rather than encourage the use of leverage. Moreover, maintaining market neutrality is a strategy employed by some hedge funds, particularly those focusing on arbitrage strategies, but it is not the primary reason for using leverage. Hedge funds primarily use leverage to increase the potential returns on their investments, which inherently involves taking on greater risks. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 12 · Câu 45–48 · Sam Reynolds<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>As the hedge fund industry has evolved, a broad range of strategies has been developed to cater<\/p><p>to the different risk and return profiles sought by investors. Hedge funds are often classified<\/p><p>based on the instruments they invest in, their trading philosophies, and the types of risks they<\/p><p>assume. Some prominent classifications of hedge fund strategies include equity hedge, event-<\/p><p>driven, fund-of-funds, macro, relative value, risk parity, and blockchain strategies, among others.<\/p><p>Sam Reynolds, a portfolio manager at a wealth management firm, is analyzing various hedge<\/p><p>fund strategies to diversify the firm’s investment portfolios. He&#x27;s considering the implications of<\/p><p>these strategies on the risk-return spectrum and their potential liquidity constraints. Specifically,<\/p><p>Sam is evaluating six main categories of hedge fund strategies: equity, event-driven, relative<\/p><p>value, opportunistic, specialist, and multi-manager, alongside specific sub-categories such as<\/p><p>long/short equity, merger arbitrage, fixed income arbitrage, global macro, volatility strategies,<\/p><p>and fund-of-funds.<\/p><p>The case continues, examining how these strategies are employed by hedge funds, their<\/p><p>similarities and differences across different hedge fund data vendors, and how they might be<\/p><p>used in constructing a well-diversified investment portfolio. Let&#x27;s walk through some of the<\/p><p>numerical and theoretical aspects that Sam needs to consider in his analysis of hedge fund<\/p><p>strategies.<\/p><p>A fund-of-funds manager is evaluating three hedge funds for inclusion in the portfolio: Fund A<\/p><p>with a return of 12%, Fund B with a return of 8%, and Fund C with a return of 10%. The<\/p><p>manager decides to invest 40% in Fund A, 30% in Fund B, and 30% in Fund C.<\/p><\/div><\/details><div class=\"qtext\"><p>Sam is evaluating the impact of leverage on hedge fund strategies. In particular, he&#x27;s interested in understanding how leverage can amplify returns and risks. What is a primary consideration for the use of leverage in hedge fund strategies?<\/p><\/div>", "subj": "alternatives"}, {"n": 49, "q": "AlphaSeeker's expected return using the Capital Asset Pricing Model (CAPM) is closest to .", "opts": ["7%", "11%", "9%"], "ans": "C", "expl": "The Capital Asset Pricing Model (CAPM) is a fundamental financial model used to determine a theoretically appropriate required rate of return of an asset, to make decisions about adding assets to a well-diversified portfolio. The formula for CAPM is given by: Where E(Ri) is the expected return of the investment, Rf is the risk-free rate, β is the beta of the investment, E(RM ) is the expected market return, and α is the alpha of the investment. Plugging in the values for AlphaSeeker, we have Rf = 4%, β = 0.5, E(RM) = 8%, and α = 3%. The calculation proceeds as follows: E(Ri) = 4% + 0.5 × (8% −4%) + 3% = 4% + 0.5 × 4% + 3% = 4% + 2% + 3% = 9% This calculation shows that the expected return, using the CAPM, for AlphaSeeker is 9%, which corresponds to option C. A is incorrect. It suggests an expected return of 7%, which does not align with the CAPM calculation. The error in this option arises from underestimating the impact of AlphaSeeker's alpha. If we only consider the risk-free rate and the product of beta and the market risk premium, the calculation would be 4% + 0.5 × 4% = 6%, which still does not account for the alpha of 3%. Adding the alpha is essential to reflect the additional expected return due to the fund's specific performance relative to the market. B is incorrect. It indicates an expected return of 11%, which is not supported by the CAPM formula. This error occurs from an incorrect summation or misinterpretation of the alpha's impact. If one mistakenly added the full market return instead of the market risk premium adjusted by beta, the calculation might incorrectly appear as 4% + 8% + 3% = 15%, which is still not 11%, indicating a fundamental misunderstanding of the CAPM components. The correct approach, as shown, leads to a 9% expected return, not 11%. ", "explhtml": "<p>The Capital Asset Pricing Model (CAPM) is a fundamental financial model used to determine a theoretically appropriate required rate of return of an asset, to make decisions about adding assets to a well-diversified portfolio. The formula for CAPM is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0073.webp\" style=\"max-width:min(100%,259px)\" alt=\"E(Ri) = Rf + β × (E(RM) −Rf) + α\"><p>Where E(R<sub>i<\/sub>) is the expected return of the investment, R<sub>f<\/sub> is the risk-free rate, β is the beta of the investment, E(R<sub>M<\/sub> ) is the expected market return, and α is the alpha of the investment. Plugging in the values for AlphaSeeker, we have R<sub>f<\/sub> = 4%, β = 0.5, E(R<sub>M<\/sub>) = 8%, and α = 3%. The calculation proceeds as follows:<\/p><p>E(R<sup>i<\/sup>) = 4% + 0.5 × (8% −4%) + 3% = 4% + 0.5 × 4% + 3% = 4% + 2% + 3% = 9%<\/p><p>This calculation shows that the expected return, using the CAPM, for AlphaSeeker is 9%, which corresponds to option C.<\/p><p><b>A is incorrect<\/b>. It suggests an expected return of 7%, which does not align with the CAPM calculation. The error in this option arises from underestimating the impact of AlphaSeeker&#x27;s alpha. If we only consider the risk-free rate and the product of beta and the market risk premium, the calculation would be 4% + 0.5 × 4% = 6%, which still does not account for the alpha of 3%. Adding the alpha is essential to reflect the additional expected return due to the fund&#x27;s specific performance relative to the market.<\/p><p><b>B is incorrect<\/b>. It indicates an expected return of 11%, which is not supported by the CAPM formula. This error occurs from an incorrect summation or misinterpretation of the alpha&#x27;s impact. If one mistakenly added the full market return instead of the market risk premium adjusted by beta, the calculation might incorrectly appear as 4% + 8% + 3% = 15%, which is still not 11%, indicating a fundamental misunderstanding of the CAPM components. The correct approach, as shown, leads to a 9% expected return, not 11%. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Diversa Capital Management<\/summary><div class=\"vig-body\"><p>Diversa Capital Management, a multi-billion dollar investment firm, has recently been exploring the addition of specialized hedge fund strategies to diversify their clients&#x27; portfolios and improve risk-adjusted returns. The chief investment officer (CIO), Elena Rodriguez, is tasked with exploring various hedge fund offerings and presenting a comprehensive analysis to the investment committee. Elena&#x27;s analysis involves an in-depth look into the performance metrics, strategy profiles, risk management techniques, and potential synergies these strategies could offer when combined with the existing portfolio mix.<\/p><p>The hedge fund marketplace offers a myriad of strategies, extending across different assets, risk<\/p><p>profiles, and market environments. Elena&#x27;s focus for the evaluation includes a selection of hedge<\/p><p>fund strategies that can potentially add value during different market cycles and conditions. She<\/p><p>considers six primary categories: equity, event-driven, relative value, opportunistic, specialist,<\/p><p>and multi-manager.<\/p><p>During this exploration, Diversa Capital also needs to forecast the performance of a theoretical<\/p><p>long/short equity fund named AlphaSeeker, examine the risk-return trade-off in a distressed debt<\/p><p>hedge fund called Recovery Capital, and evaluate the capital allocation for a fund-of-funds named<\/p><p>Synergy Multi-Manager. AlphaSeeker, a long/short equity fund, has an alpha of 3%, a beta of 0.5<\/p><p>relative to the market index, and the market index is expected to return 8% over the next year.<\/p><p>The risk free rate at the time is 4%.<\/p><p>Elena&#x27;s analysis isn&#x27;t limited to quantitative aspects. For instance, she considers the qualitative<\/p><p>factors such as the experience of the fund managers, the soundness of their investment<\/p><p>processes, the robustness of their risk management systems, and their historical performance<\/p><p>during different market phases. One of the key considerations is how these factors contribute to<\/p><p>the overall stability and growth potential of the hedge funds under consideration.<\/p><\/div><\/details><div class=\"qtext\"><p>AlphaSeeker&#x27;s expected return using the Capital Asset Pricing Model (CAPM) is closest to .<\/p><\/div>", "subj": "alternatives"}, {"n": 50, "q": "Recovery Capital focuses on investing in distressed debt and expects an average recovery rate of 40% on its bond investments during bankruptcy. If the fund purchases a distressed bond at 60% of its face value, what is the expected profit or loss percentage if the bankruptcy recovery scenario materializes?", "opts": ["-33%", "20%", "-20%"], "ans": "A", "expl": "When Recovery Capital purchases a distressed bond at 60% of its face value, the fund is essentially investing 60 cents on the dollar. If the bankruptcy recovery scenario materializes and the fund is able to recover 40% of the face value, this means they recover 40 cents on the dollar. To find the profit or loss percentage, we calculate the difference between the recovery rate and the purchase price relative to the purchase price. The formula for this calculation is: This calculation shows a loss of approximately -33.33%, which rounds to -33%. This loss occurs because the recovery rate is less than the purchase price, indicating that the fund recovers less money than it initially paid for the bond. B is incorrect. It suggests a profit of 20%, which is incorrect because the recovery rate is less than the purchase price. If the recovery rate were higher than the purchase price, then a profit would be realized. However, in this scenario, the fund only recovers 40% of the face value on a bond purchased at 60% of its face value. This results in a loss, not a profit. The incorrect assumption of a profit arises from misunderstanding the relationship between the recovery rate and the purchase price. C is incorrect. Although option C also indicates a loss, the specified percentage of -20% does not accurately reflect the magnitude of the loss calculated. The correct loss percentage, as derived from the formula, is -33.33%. The error in option C likely stems from an incorrect calculation or rounding of the difference between the recovery rate and the purchase price, relative to the purchase price. ", "explhtml": "<p>When Recovery Capital purchases a distressed bond at 60% of its face value, the fund is essentially investing 60 cents on the dollar. If the bankruptcy recovery scenario materializes and the fund is able to recover 40% of the face value, this means they recover 40 cents on the dollar. To find the profit or loss percentage, we calculate the difference between the recovery rate and the purchase price relative to the purchase price. The formula for this calculation is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0074.webp\" style=\"max-width:min(100%,734px)\" alt=\"Recovery Rate −Purchase Price 40% −60% Profit/Loss percentage = ( ) × 100 = ( ) × 100 = −33.33% Purchase Price 60%\"><p>This calculation shows a loss of approximately -33.33%, which rounds to -33%. This loss occurs because the recovery rate is less than the purchase price, indicating that the fund recovers less money than it initially paid for the bond.<\/p><p><b>B is incorrect<\/b>. It suggests a profit of 20%, which is incorrect because the recovery rate is less than the purchase price. If the recovery rate were higher than the purchase price, then a profit would be realized. However, in this scenario, the fund only recovers 40% of the face value on a bond purchased at 60% of its face value. This results in a loss, not a profit. The incorrect assumption of a profit arises from misunderstanding the relationship between the recovery rate and the purchase price.<\/p><p><b>C is incorrect<\/b>. Although option C also indicates a loss, the specified percentage of -20% does not accurately reflect the magnitude of the loss calculated. The correct loss percentage, as derived from the formula, is -33.33%. The error in option C likely stems from an incorrect calculation or rounding of the difference between the recovery rate and the purchase price, relative to the purchase price. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (c) Discuss investment characteristics, strategy implementation, and role in a portfolio of event- driven hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Diversa Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Diversa Capital Management, a multi-billion dollar investment firm, has recently been exploring the addition of specialized hedge fund strategies to diversify their clients&#x27; portfolios and improve risk-adjusted returns. The chief investment officer (CIO), Elena Rodriguez, is tasked with exploring various hedge fund offerings and presenting a comprehensive analysis to the investment committee. Elena&#x27;s analysis involves an in-depth look into the performance metrics, strategy profiles, risk management techniques, and potential synergies these strategies could offer when combined with the existing portfolio mix.<\/p><p>The hedge fund marketplace offers a myriad of strategies, extending across different assets, risk<\/p><p>profiles, and market environments. Elena&#x27;s focus for the evaluation includes a selection of hedge<\/p><p>fund strategies that can potentially add value during different market cycles and conditions. She<\/p><p>considers six primary categories: equity, event-driven, relative value, opportunistic, specialist,<\/p><p>and multi-manager.<\/p><p>During this exploration, Diversa Capital also needs to forecast the performance of a theoretical<\/p><p>long/short equity fund named AlphaSeeker, examine the risk-return trade-off in a distressed debt<\/p><p>hedge fund called Recovery Capital, and evaluate the capital allocation for a fund-of-funds named<\/p><p>Synergy Multi-Manager. AlphaSeeker, a long/short equity fund, has an alpha of 3%, a beta of 0.5<\/p><p>relative to the market index, and the market index is expected to return 8% over the next year.<\/p><p>The risk free rate at the time is 4%.<\/p><p>Elena&#x27;s analysis isn&#x27;t limited to quantitative aspects. For instance, she considers the qualitative<\/p><p>factors such as the experience of the fund managers, the soundness of their investment<\/p><p>processes, the robustness of their risk management systems, and their historical performance<\/p><p>during different market phases. One of the key considerations is how these factors contribute to<\/p><p>the overall stability and growth potential of the hedge funds under consideration.<\/p><\/div><\/details><div class=\"qtext\"><p>Recovery Capital focuses on investing in distressed debt and expects an average recovery rate of 40% on its bond investments during bankruptcy. If the fund purchases a distressed bond at 60% of its face value, what is the expected profit or loss percentage if the bankruptcy recovery scenario materializes?<\/p><\/div>", "subj": "alternatives"}, {"n": 51, "q": "Elena is analyzing the risk management practices of a potential hedge fund investment. The fund has an average Value at Risk (VaR) of $5 million with a 95% confidence level, and a Conditional Value at Risk (CVaR) of $8 million. Calculate the expected excess loss beyond the VaR threshold, given that the VaR threshold is exceeded.", "opts": ["$3 million", "$11 million", "$8 million"], "ans": "A", "expl": "Value at Risk (VaR) and Conditional Value at Risk (CVaR) are critical metrics used in financial risk management. VaR at a 95% confidence level indicates that there is a 5% chance that the loss will exceed $5 million. CVaR, on the other hand, is the average of all possible losses that exceed the VaR threshold, in this case, $8 million. The expected loss given that the loss exceeds the VaR threshold can be calculated by subtracting VaR from CVaR. This calculation is straightforward: This result shows that if losses exceed the VaR of $5 million, the average expected loss will be $3 million more, totaling to $8 million as indicated by the CVaR. B is incorrect. The option of $11 million suggests adding the VaR and CVaR, which is a misunderstanding of how these metrics work. VaR and CVaR are not additive in this context; rather, CVaR is an extension of VaR. CVaR provides an average of losses that exceed the VaR threshold, not a cumulative total of VaR and these exceeding losses. Therefore, interpreting these values as additive leads to an incorrect understanding and application of these risk metrics. C is incorrect. Choosing $8 million as the expected loss given that the loss exceeds the VaR threshold misunderstands the definition of CVaR. CVaR itself is $8 million, which represents the average expected loss beyond the VaR, not the total expected loss in such scenarios. The calculation required here is to find the additional loss expected beyond the VaR, which is the difference between CVaR and VaR, not the CVaR alone. This option incorrectly assumes that the entire CVaR value is the additional loss rather than the average loss exceeding the VaR. ", "explhtml": "<p>Value at Risk (VaR) and Conditional Value at Risk (CVaR) are critical metrics used in financial risk management. VaR at a 95% confidence level indicates that there is a 5% chance that the loss will exceed $5 million. CVaR, on the other hand, is the average of all possible losses that exceed the VaR threshold, in this case, $8 million. The expected loss given that the loss exceeds the VaR threshold can be calculated by subtracting VaR from CVaR. This calculation is straightforward:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0075.webp\" style=\"max-width:min(100%,526px)\" alt=\"Expected Loss = CVaR −VaR = $8 million −$5 million = $3 million.\"><p>This result shows that if losses exceed the VaR of $5 million, the average expected loss will be $3 million more, totaling to $8 million as indicated by the CVaR.<\/p><p><b>B is incorrect<\/b>. The option of $11 million suggests adding the VaR and CVaR, which is a misunderstanding of how these metrics work. VaR and CVaR are not additive in this context; rather, CVaR is an extension of VaR. CVaR provides an average of losses that exceed the VaR threshold, not a cumulative total of VaR and these exceeding losses. Therefore, interpreting these values as additive leads to an incorrect understanding and application of these risk metrics.<\/p><p><b>C is incorrect<\/b>. Choosing $8 million as the expected loss given that the loss exceeds the VaR threshold misunderstands the definition of CVaR. CVaR itself is $8 million, which represents the average expected loss beyond the VaR, not the total expected loss in such scenarios. The calculation required here is to find the additional loss expected beyond the VaR, which is the difference between CVaR and VaR, not the CVaR alone. This option incorrectly assumes that the entire CVaR value is the additional loss rather than the average loss exceeding the VaR. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (c) Discuss investment characteristics, strategy implementation, and role in a portfolio of event- driven hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Diversa Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Diversa Capital Management, a multi-billion dollar investment firm, has recently been exploring the addition of specialized hedge fund strategies to diversify their clients&#x27; portfolios and improve risk-adjusted returns. The chief investment officer (CIO), Elena Rodriguez, is tasked with exploring various hedge fund offerings and presenting a comprehensive analysis to the investment committee. Elena&#x27;s analysis involves an in-depth look into the performance metrics, strategy profiles, risk management techniques, and potential synergies these strategies could offer when combined with the existing portfolio mix.<\/p><p>The hedge fund marketplace offers a myriad of strategies, extending across different assets, risk<\/p><p>profiles, and market environments. Elena&#x27;s focus for the evaluation includes a selection of hedge<\/p><p>fund strategies that can potentially add value during different market cycles and conditions. She<\/p><p>considers six primary categories: equity, event-driven, relative value, opportunistic, specialist,<\/p><p>and multi-manager.<\/p><p>During this exploration, Diversa Capital also needs to forecast the performance of a theoretical<\/p><p>long/short equity fund named AlphaSeeker, examine the risk-return trade-off in a distressed debt<\/p><p>hedge fund called Recovery Capital, and evaluate the capital allocation for a fund-of-funds named<\/p><p>Synergy Multi-Manager. AlphaSeeker, a long/short equity fund, has an alpha of 3%, a beta of 0.5<\/p><p>relative to the market index, and the market index is expected to return 8% over the next year.<\/p><p>The risk free rate at the time is 4%.<\/p><p>Elena&#x27;s analysis isn&#x27;t limited to quantitative aspects. For instance, she considers the qualitative<\/p><p>factors such as the experience of the fund managers, the soundness of their investment<\/p><p>processes, the robustness of their risk management systems, and their historical performance<\/p><p>during different market phases. One of the key considerations is how these factors contribute to<\/p><p>the overall stability and growth potential of the hedge funds under consideration.<\/p><\/div><\/details><div class=\"qtext\"><p>Elena is analyzing the risk management practices of a potential hedge fund investment. The fund has an average Value at Risk (VaR) of $5 million with a 95% confidence level, and a Conditional Value at Risk (CVaR) of $8 million. Calculate the expected excess loss beyond the VaR threshold, given that the VaR threshold is exceeded.<\/p><\/div>", "subj": "alternatives"}, {"n": 52, "q": "Elena is aware that manager expertise is critical in hedge fund performance. When evaluating hedge fund managers, what expertise-related quality should be a key focus area?", "opts": ["Length of tenure at previous investment firms.", "Track record during different market cycles.", "Educational background and number of certifications."], "ans": "B", "expl": "Evaluating hedge fund managers based on their track record during different market cycles is crucial because it provides a comprehensive view of their ability to adapt and perform under varying economic conditions. A manager's track record reflects their practical experience and expertise in navigating complex market environments, which is essential for managing the inherent risks and capitalizing on opportunities that arise in different phases of the market cycle. This ability to maintain consistent performance is indicative of their strategic acumen, risk management proficiency, and operational effectiveness. It also reassures investors of the manager's capability to handle their investments prudently, especially during turbulent times, which is critical for long-term investment success. A is incorrect. While the length of tenure at previous investment firms might suggest stability and experience, it does not directly correlate with a manager's ability to effectively manage a hedge fund through various market cycles. Tenure may indicate longevity but not necessarily success or adaptability. The financial markets are dynamic, and past long-term employment does not guarantee that a manager can navigate future market changes effectively. Therefore, tenure should be considered alongside other more performance-oriented metrics. C is incorrect. Educational background and the number of certifications can indicate a foundational level of knowledge and a commitment to professional development, but these factors alone do not provide a complete picture of a manager's ability to perform in real-world market conditions. Certifications and education often focus on theoretical knowledge, which, while important, does not equate directly to the practical skills needed for managing a hedge fund through diverse and challenging market cycles. Practical experience and a proven track record are more reliable indicators of a manager's potential to achieve consistent returns. ", "explhtml": "<p>Evaluating hedge fund managers based on their track record during different market cycles is crucial because it provides a comprehensive view of their ability to adapt and perform under varying economic conditions. A manager&#x27;s track record reflects their practical experience and expertise in navigating complex market environments, which is essential for managing the inherent risks and capitalizing on opportunities that arise in different phases of the market cycle. This ability to maintain consistent performance is indicative of their strategic acumen, risk management proficiency, and operational effectiveness. It also reassures investors of the manager&#x27;s capability to handle their investments prudently, especially during turbulent times, which is critical for long-term investment success.<\/p><p><b>A is incorrect<\/b>. While the length of tenure at previous investment firms might suggest stability and experience, it does not directly correlate with a manager&#x27;s ability to effectively manage a hedge fund through various market cycles. Tenure may indicate longevity but not necessarily success or adaptability. The financial markets are dynamic, and past long-term employment does not guarantee that a manager can navigate future market changes effectively. Therefore, tenure should be considered alongside other more performance-oriented metrics.<\/p><p><b>C is incorrect<\/b>. Educational background and the number of certifications can indicate a foundational level of knowledge and a commitment to professional development, but these factors alone do not provide a complete picture of a manager&#x27;s ability to perform in real-world market conditions. Certifications and education often focus on theoretical knowledge, which, while important, does not equate directly to the practical skills needed for managing a hedge fund through diverse and challenging market cycles. Practical experience and a proven track record are more reliable indicators of a manager&#x27;s potential to achieve consistent returns. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 49–52 · Diversa Capital Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Diversa Capital Management, a multi-billion dollar investment firm, has recently been exploring the addition of specialized hedge fund strategies to diversify their clients&#x27; portfolios and improve risk-adjusted returns. The chief investment officer (CIO), Elena Rodriguez, is tasked with exploring various hedge fund offerings and presenting a comprehensive analysis to the investment committee. Elena&#x27;s analysis involves an in-depth look into the performance metrics, strategy profiles, risk management techniques, and potential synergies these strategies could offer when combined with the existing portfolio mix.<\/p><p>The hedge fund marketplace offers a myriad of strategies, extending across different assets, risk<\/p><p>profiles, and market environments. Elena&#x27;s focus for the evaluation includes a selection of hedge<\/p><p>fund strategies that can potentially add value during different market cycles and conditions. She<\/p><p>considers six primary categories: equity, event-driven, relative value, opportunistic, specialist,<\/p><p>and multi-manager.<\/p><p>During this exploration, Diversa Capital also needs to forecast the performance of a theoretical<\/p><p>long/short equity fund named AlphaSeeker, examine the risk-return trade-off in a distressed debt<\/p><p>hedge fund called Recovery Capital, and evaluate the capital allocation for a fund-of-funds named<\/p><p>Synergy Multi-Manager. AlphaSeeker, a long/short equity fund, has an alpha of 3%, a beta of 0.5<\/p><p>relative to the market index, and the market index is expected to return 8% over the next year.<\/p><p>The risk free rate at the time is 4%.<\/p><p>Elena&#x27;s analysis isn&#x27;t limited to quantitative aspects. For instance, she considers the qualitative<\/p><p>factors such as the experience of the fund managers, the soundness of their investment<\/p><p>processes, the robustness of their risk management systems, and their historical performance<\/p><p>during different market phases. One of the key considerations is how these factors contribute to<\/p><p>the overall stability and growth potential of the hedge funds under consideration.<\/p><\/div><\/details><div class=\"qtext\"><p>Elena is aware that manager expertise is critical in hedge fund performance. When evaluating hedge fund managers, what expertise-related quality should be a key focus area?<\/p><\/div>", "subj": "alternatives"}, {"n": 53, "q": "A global macro hedge fund has the following exposures: 30% to commodity prices, 50% to interest rates, and 20% to currency exchange rates. If the respective expected returns for these exposures are 8%, 5%, and 2% and their respective standard deviations are 10%, 3%, and 6%, assuming zero correlation between these factors, calculate the expected return and the portfolio standard deviation.", "opts": ["Expected Return: 5.3%, Portfolio Standard Deviation: 3.56%", "Expected Return: 5.0%, Portfolio Standard Deviation: 4.7%", "Expected Return: 4.5%, Portfolio Standard Deviation: 5.9%"], "ans": "A", "expl": "The correct answer is option A because it accurately calculates both the expected return and the portfolio standard deviation for a global macro hedge fund with specific exposures and zero correlation between them. The expected return is computed as the weighted average of the returns from each exposure. Mathematically, this is represented as: Expected Return = (0.30 × 8%) + (0.50 × 5%) + (0.20 × 2%) = 2.4% + 2.5% + 0.4% = 5.3% This calculation correctly applies the weights to the respective returns of the exposures to commodities, interest rates, and currency exchange rates. The portfolio standard deviation, assuming zero correlation between these exposures, is calculated using the formula for the standard deviation of a portfolio with independent components: Portfolio Standard Deviation = √(0.302 × 10%2) + (0.502 × 3%2) + (0.202 × 6%2) = √0.09% + 0.022 This formula correctly incorporates the square of the weights and the square of the standard deviations of each exposure, summing them up and then taking the square root to find the total portfolio standard deviation. B is incorrect. It underestimates the expected return and overestimates the portfolio standard deviation. The expected return for option B is 5.0%, which does not accurately reflect the weighted contributions of the individual exposures based on their returns. The portfolio standard deviation is given as 4.7%, which suggests an incorrect calculation that might have assumed some level of correlation between the exposures, contrary to the problem's assumption of zero correlation. This error leads to a higher calculated risk than what is mathematically correct under the given conditions. C is incorrect. It further underestimates the expected return and overestimates the portfolio standard deviation. An expected return of 4.5% indicates a significant miscalculation of the weighted returns, as the weights are not applied correctly to the individual exposures' returns. Additionally, a portfolio standard deviation of 5.9% is excessively high, indicating a flawed calculation —possibly assuming negative correlations that increase the portfolio's perceived risk —contrary to the information provided on zero correlation between the exposures. ", "explhtml": "<p>The correct answer is option A because it accurately calculates both the expected return and the portfolio standard deviation for a global macro hedge fund with specific exposures and zero correlation between them. The expected return is computed as the weighted average of the returns from each exposure. Mathematically, this is represented as:<\/p><p>Expected Return = (0.30 × 8%) + (0.50 × 5%) + (0.20 × 2%) = 2.4% + 2.5% + 0.4% = 5.3%<\/p><p>This calculation correctly applies the weights to the respective returns of the exposures to commodities, interest rates, and currency exchange rates. The portfolio standard deviation, assuming zero correlation between these exposures, is calculated using the formula for the standard deviation of a portfolio with independent components:<\/p><p>Portfolio Standard Deviation = √(0.30<sup>2<\/sup> × 10%<sup>2<\/sup>) + (0.50<sup>2<\/sup> × 3%<sup>2<\/sup>) + (0.20<sup>2<\/sup> × 6%<sup>2<\/sup>) = √0.09% + 0.022<\/p><p>This formula correctly incorporates the square of the weights and the square of the standard deviations of each exposure, summing them up and then taking the square root to find the total portfolio standard deviation.<\/p><p><b>B is incorrect.<\/b> It underestimates the expected return and overestimates the portfolio standard deviation. The expected return for option B is 5.0%, which does not accurately reflect the weighted contributions of the individual exposures based on their returns. The portfolio standard deviation is given as 4.7%, which suggests an incorrect calculation that might have assumed some level of correlation between the exposures, contrary to the problem&#x27;s assumption of zero correlation. This error leads to a higher calculated risk than what is mathematically correct under the given conditions.<\/p><p><b>C is incorrect.<\/b> It further underestimates the expected return and overestimates the portfolio standard deviation. An expected return of 4.5% indicates a significant miscalculation of the weighted returns, as the weights are not applied correctly to the individual exposures&#x27; returns. Additionally, a portfolio standard deviation of 5.9% is excessively high, indicating a flawed calculation —possibly assuming negative correlations that increase the portfolio&#x27;s perceived risk —contrary to the information provided on zero correlation between the exposures. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Quantum Capital<\/summary><div class=\"vig-body\"><p>Quantum Capital, an investment firm known for its data-driven and quantitative approach, is considering diversifying its investment strategies by incorporating several hedge funds into its portfolio offerings. The firm&#x27;s lead analyst, Dr. Ian Malcolm, has been assigned the task of evaluating a variety of hedge fund strategies with an emphasis on quantitative analysis to determine potential investment prospects.<\/p><p>Among the hedge fund strategies being considered are global macro funds, market-neutral<\/p><p>funds, event-driven funds, and emerging markets funds. Dr. Malcolm plans to assess these<\/p><p>strategies through a series of performance metrics such as expected returns, risk profiles,<\/p><p>portfolio weights, and diversification benefits.<\/p><p>Additionally, the evaluation will include scenario analysis for different market conditions,<\/p><p>leveraging historical data and advanced statistical models. Quantum Capital understands that<\/p><p>successful investment in hedge funds requires both rigorous mathematical analysis and a deep<\/p><p>understanding of the market dynamics that drive these alternative investments.<\/p><p>Quantum Capital is interested in assessing the diversification benefits of adding a new hedge<\/p><p>fund to its portfolio. The current portfolio has an expected return of 10% and a standard<\/p><p>deviation of 12%. The new hedge fund has an expected return of 15%, a standard deviation of<\/p><p>18%, and a correlation with the current portfolio of 0.5.<\/p><\/div><\/details><div class=\"qtext\"><p>A global macro hedge fund has the following exposures: 30% to commodity prices, 50% to interest rates, and 20% to currency exchange rates. If the respective expected returns for these exposures are 8%, 5%, and 2% and their respective standard deviations are 10%, 3%, and 6%, assuming zero correlation between these factors, calculate the expected return and the portfolio standard deviation.<\/p><\/div>", "subj": "alternatives"}, {"n": 54, "q": "Suppose event-driven fund QuantumEvent targets an excess return of 7% over the risk-free rate of 2% with a standard deviation of 12%. Using the capital asset pricing model, what is the fund's required beta if the expected market return is 10%?", "opts": ["0.83", "0.875", "0.42"], "ans": "B", "expl": "Using the Capital Asset Pricing Model (CAPM), we can determine the required beta (β) for the QuantumEvent fund. The CAPM formula is expressed as: Where Ri is the expected return of the investment, Rf is the risk-free rate, Rm is the expected market return, and α is the alpha, or the excess return over the market. For QuantumEvent, the excess return over the risk-free rate is given as 7%, and the risk-free rate itself is 2%. Therefore, the total expected return Ri is 7% + 2% = 9%. Substituting the values into the CAPM formula and solving for β, we get: B is the correct answer because it accurately calculates the required beta using the CAPM formula with the given values, resulting in a beta of 0.875, which is necessary to achieve the targeted excess return of 7% over the risk-free rate. A is incorrect. It suggests a beta of 0.83, which does not align with the correct calculation using the CAPM formula. If we substitute 0.83 into the formula, the resulting expected return would be Ri = 2% + 0.83 × (10% − 2%) = 8.64%, which is less than the required 9\\% (7% excess return plus the 2% risk-free rate). This discrepancy indicates that a beta of 0.83 would not be sufficient to meet the fund's return objectives, hence making this option incorrect. C is incorrect. It proposes a beta of 0.42. Using this value in the CAPM formula yields an expected return of Ri = 2% + 0.42 × (10% − 2%) = 5.36%, which is significantly lower than the required 9\\%. This underestimation of the required beta results in a substantial shortfall in achieving the desired excess return. Therefore, a beta of 0.42 is not adequate for meeting the fund's performance targets, rendering this option incorrect. ", "explhtml": "<p>Using the Capital Asset Pricing Model (CAPM), we can determine the required beta (β) for the QuantumEvent fund. The CAPM formula is expressed as:<\/p><img class=\"pimg
