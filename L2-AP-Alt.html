an equity strategy involving two companies, Zora and Mythos. Zora is a<\/p><p>pharmaceutical company based in Europe. It has recently come under heavy scrutiny due to one<\/p><p>of its products having adverse side effects. Multiple lawsuits have been filed, and from last year&#x27;s<\/p><p>audit report, it is clear that they will have to settle for € 18 million, which is 10% of their<\/p><p>revenue. On the other hand, Mythos is a chip manufacturer based in Greece that has high<\/p><p>growth potential after its flagship product has dominated the European chip market. Based on the previous valuation conducted by Abruzzi, Mythos is currently trading at a discount compared<\/p><p>to Zora. Feng decides to take a long position in Mythos and a short position in Zora with equal<\/p><p>beta-weighted exposure.<\/p><p>Finally, Feng and Abruzzi consider a hedge fund that specializes in private equity. Feng tells<\/p><p>Abruzzi about three characteristics that hedge fund managers look for when investing in private<\/p><p>equity:<\/p><p>Characteristic 1: The target company consistently pays high dividends, providing immediate cash<\/p><p>returns throughout the holding period.<\/p><p>Characteristic 2: The company’s management team has a significant equity stake and a proven<\/p><p>track record of driving value creation through operational improvements and EBITDA growth.<\/p><p>Characteristic 3: The firm seeks out companies whose shares already trade at a premium<\/p><p>multiple relative to their peers, assuming that strong market valuation guarantees superior<\/p><p>returns.<\/p><\/div><\/details><div class=\"qtext\"><p>Assume that the MBO is successful, the arbitrage profit from the trade Feng initiated is closest to?<\/p><\/div>", "subj": "alternatives"}, {"n": 83, "q": "Which equity hedge fund strategy most accurately characterizes Feng’s Zora and Mythos positions?", "opts": ["Equity market neutral", "Event-driven.", "Long/short equity."], "ans": "A", "expl": "Feng’s strategy of taking a long position in Mythos and a short position in Zora with equal beta-weighted exposure is the hallmark of an equity market-neutral approach. The portfolio's net market risk is essentially zero by matching the market sensitivity (beta) of the long and short legs. This means Feng is seeking to profit purely from the relative performance of Mythos versus Zora rather than from the overall direction of equity markets. B is incorrect. Event-driven strategies focus on corporate transactions or restructurings M&A, spin-offs, distressed exchanges, etc. where returns come from resolving a specific “event.” Here, Mythos and Zora aren’t undergoing any corporate event; Feng’s positions are based on valuation and risk differences, not on pending deals or corporate actions. C is incorrect. While Feng is long one stock and short another, long/short equity is broader and doesn’t imply market neutrality. A long/short equity strategy may still carry net market exposure (beta), betting on overall market rises or falls. Feng’s use of beta-matching distinguishes her approach as market-neutral, not merely long/short.", "explhtml": "<p>Feng’s strategy of taking a long position in Mythos and a short position in Zora with equal beta-weighted exposure is the hallmark of an equity market-neutral approach. The portfolio&#x27;s net market risk is essentially zero by matching the market sensitivity (beta) of the long and short legs. This means Feng is seeking to profit purely from the relative performance of Mythos versus Zora rather than from the overall direction of equity markets.<\/p><p><b>B is incorrect.<\/b> Event-driven strategies focus on corporate transactions or restructurings M&amp;A, spin-offs, distressed exchanges, etc. where returns come from resolving a specific “event.” Here, Mythos and Zora aren’t undergoing any corporate event; Feng’s positions are based on valuation and risk differences, not on pending deals or corporate actions.<\/p><p><b>C is incorrect.<\/b> While Feng is long one stock and short another, long/short equity is broader and doesn’t imply market neutrality. A long/short equity strategy may still carry net market exposure (beta), betting on overall market rises or falls. Feng’s use of beta-matching distinguishes her approach as market-neutral, not merely long/short.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darius Feng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darius Feng is the Fund manager for the Metaxas University Endowment Fund (Metaxas Fund)<\/p><p>based in Greece. The fund manager recently added hedge funds to diversify Metaxas Fund’s<\/p><p>portfolio. Feng meets Susan Abruzzi, an analyst at the firm, to discuss the different hedge fund<\/p><p>strategies they could use for the Metaxas Fund. Abruzzi made the following statements:<\/p><p>Statement 1: Managers construct offsetting long and short positions in related equities based on<\/p><p>valuation discrepancies, aiming to eliminate net market exposure and profit from relative price<\/p><p>movements.<\/p><p>Statement 2: These strategies are entirely insulated from equity market beta risk since returns<\/p><p>are driven solely by the outcomes of corporate events (mergers, restructurings, distressed<\/p><p>turnarounds) and are not sensitive to broader market movements.<\/p><p>Statement 3: Managers take directional views across asset classes—equities, rates, currencies,<\/p><p>and commodities—based on macroeconomic forecasts, making these strategies inherently<\/p><p>exposed to market directionality risk.<\/p><p>Feng requests that Abruzzi research an event-driven strategy involving a potential management<\/p><p>buyout (MBO) of Technica, Inc., backed by Zeus Company as a financial sponsor. Aqua will fund<\/p><p>the MBO as part of the transaction by offering Taurus shareholders the equivalent of one Zeus<\/p><p>share for every three shares of Technica they own. Before the announcement, Zeus traded at €25<\/p><p>per share, declining to €20 as investors absorbed the funding implications.Technica’s shares rose<\/p><p>from €25 to €30 as the market priced in the premium from the MBO deal. Anticipating the deal’s<\/p><p>successful closure, Feng initiates an arbitrage trade: she purchases 12,560 shares of Technica at<\/p><p>€30 and shorts 6,500 shares of Zeus at €25.<\/p><p>Feng also mentions an equity strategy involving two companies, Zora and Mythos. Zora is a<\/p><p>pharmaceutical company based in Europe. It has recently come under heavy scrutiny due to one<\/p><p>of its products having adverse side effects. Multiple lawsuits have been filed, and from last year&#x27;s<\/p><p>audit report, it is clear that they will have to settle for € 18 million, which is 10% of their<\/p><p>revenue. On the other hand, Mythos is a chip manufacturer based in Greece that has high<\/p><p>growth potential after its flagship product has dominated the European chip market. Based on the previous valuation conducted by Abruzzi, Mythos is currently trading at a discount compared<\/p><p>to Zora. Feng decides to take a long position in Mythos and a short position in Zora with equal<\/p><p>beta-weighted exposure.<\/p><p>Finally, Feng and Abruzzi consider a hedge fund that specializes in private equity. Feng tells<\/p><p>Abruzzi about three characteristics that hedge fund managers look for when investing in private<\/p><p>equity:<\/p><p>Characteristic 1: The target company consistently pays high dividends, providing immediate cash<\/p><p>returns throughout the holding period.<\/p><p>Characteristic 2: The company’s management team has a significant equity stake and a proven<\/p><p>track record of driving value creation through operational improvements and EBITDA growth.<\/p><p>Characteristic 3: The firm seeks out companies whose shares already trade at a premium<\/p><p>multiple relative to their peers, assuming that strong market valuation guarantees superior<\/p><p>returns.<\/p><\/div><\/details><div class=\"qtext\"><p>Which equity hedge fund strategy most accurately characterizes Feng’s Zora and Mythos positions?<\/p><\/div>", "subj": "alternatives"}, {"n": 84, "q": "Which of the three characteristics of private equity noted by Abruzzi is most accurate?", "opts": ["Characteristic 1.", "Characteristic 2.", "Characteristic 3."], "ans": "B", "expl": "Private equity investors prioritize alignment of incentives and the ability to create value through active management. A management team that owns a significant equity stake is highly motivated to drive performance, and a proven track record of boosting EBITDA via operational improvements is exactly what PE sponsors look for when underwriting deals. This focus on hands-on value creation, in contrast to passive income, lies at the heart of successful private equity investing. A is incorrect. Private equity–owned companies rarely distribute large dividends during the holding period. Instead, PE sponsors typically reinvest cash flows into the business to fund growth initiatives, pay down deal‐related debt, or accelerate operational improvements. A steady “dividend check” is far less critical than unlocking enterprise value through strategic and operational changes. C is incorrect. Businesses at premium multiples run counter to private equity’s objective of acquiring assets at a discount to intrinsic value. PE firms seek companies with undervalued balance sheets or under-optimized operations, where they can generate outsized returns by paying lower entry multiples and driving value before exit. Acquiring at a premium leaves little upside for investors.", "explhtml": "<p>Private equity investors prioritize alignment of incentives and the ability to create value through active management. A management team that owns a significant equity stake is highly motivated to drive performance, and a proven track record of boosting EBITDA via operational improvements is exactly what PE sponsors look for when underwriting deals. This focus on hands-on value creation, in contrast to passive income, lies at the heart of successful private equity investing.<\/p><p><b>A is incorrect.<\/b> Private equity–owned companies rarely distribute large dividends during the holding period. Instead, PE sponsors typically reinvest cash flows into the business to fund growth initiatives, pay down deal‐related debt, or accelerate operational improvements. A steady “dividend check” is far less critical than unlocking enterprise value through strategic and operational changes.<\/p><p><b>C is incorrect.<\/b> Businesses at premium multiples run counter to private equity’s objective of acquiring assets at a discount to intrinsic value. PE firms seek companies with undervalued balance sheets or under-optimized operations, where they can generate outsized returns by paying lower entry multiples and driving value before exit. Acquiring at a premium leaves little upside for investors.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darius Feng<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darius Feng is the Fund manager for the Metaxas University Endowment Fund (Metaxas Fund)<\/p><p>based in Greece. The fund manager recently added hedge funds to diversify Metaxas Fund’s<\/p><p>portfolio. Feng meets Susan Abruzzi, an analyst at the firm, to discuss the different hedge fund<\/p><p>strategies they could use for the Metaxas Fund. Abruzzi made the following statements:<\/p><p>Statement 1: Managers construct offsetting long and short positions in related equities based on<\/p><p>valuation discrepancies, aiming to eliminate net market exposure and profit from relative price<\/p><p>movements.<\/p><p>Statement 2: These strategies are entirely insulated from equity market beta risk since returns<\/p><p>are driven solely by the outcomes of corporate events (mergers, restructurings, distressed<\/p><p>turnarounds) and are not sensitive to broader market movements.<\/p><p>Statement 3: Managers take directional views across asset classes—equities, rates, currencies,<\/p><p>and commodities—based on macroeconomic forecasts, making these strategies inherently<\/p><p>exposed to market directionality risk.<\/p><p>Feng requests that Abruzzi research an event-driven strategy involving a potential management<\/p><p>buyout (MBO) of Technica, Inc., backed by Zeus Company as a financial sponsor. Aqua will fund<\/p><p>the MBO as part of the transaction by offering Taurus shareholders the equivalent of one Zeus<\/p><p>share for every three shares of Technica they own. Before the announcement, Zeus traded at €25<\/p><p>per share, declining to €20 as investors absorbed the funding implications.Technica’s shares rose<\/p><p>from €25 to €30 as the market priced in the premium from the MBO deal. Anticipating the deal’s<\/p><p>successful closure, Feng initiates an arbitrage trade: she purchases 12,560 shares of Technica at<\/p><p>€30 and shorts 6,500 shares of Zeus at €25.<\/p><p>Feng also mentions an equity strategy involving two companies, Zora and Mythos. Zora is a<\/p><p>pharmaceutical company based in Europe. It has recently come under heavy scrutiny due to one<\/p><p>of its products having adverse side effects. Multiple lawsuits have been filed, and from last year&#x27;s<\/p><p>audit report, it is clear that they will have to settle for € 18 million, which is 10% of their<\/p><p>revenue. On the other hand, Mythos is a chip manufacturer based in Greece that has high<\/p><p>growth potential after its flagship product has dominated the European chip market. Based on the previous valuation conducted by Abruzzi, Mythos is currently trading at a discount compared<\/p><p>to Zora. Feng decides to take a long position in Mythos and a short position in Zora with equal<\/p><p>beta-weighted exposure.<\/p><p>Finally, Feng and Abruzzi consider a hedge fund that specializes in private equity. Feng tells<\/p><p>Abruzzi about three characteristics that hedge fund managers look for when investing in private<\/p><p>equity:<\/p><p>Characteristic 1: The target company consistently pays high dividends, providing immediate cash<\/p><p>returns throughout the holding period.<\/p><p>Characteristic 2: The company’s management team has a significant equity stake and a proven<\/p><p>track record of driving value creation through operational improvements and EBITDA growth.<\/p><p>Characteristic 3: The firm seeks out companies whose shares already trade at a premium<\/p><p>multiple relative to their peers, assuming that strong market valuation guarantees superior<\/p><p>returns.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the three characteristics of private equity noted by Abruzzi is most accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 85, "q": "What is AlphaGen's new gross exposure after the recent adjustments?", "opts": ["1.3.", "1.25.", "0.95."], "ans": "B", "expl": "Before the adjustment, AlphaGen’s gross exposure was calculated as the sum of all long and short positions 80% + 30% = 110%. After the adjustments, the long positions increased by 5% (from 80% to 85%) and the short positions increased by 10% (from 30% to 40%). The new gross exposure is the sum of the adjusted long and short positions 85% + 40% = 125%. A is incorrect. This would occur if shorts also increased by 15%. 85% + 45% = 130% C is incorrect. This would occur if 10% shorts were added rather than subtracted.  85% + 10% = 95%", "explhtml": "<p>Before the adjustment, AlphaGen’s gross exposure was calculated as the sum of all long and short positions 80% + 30% = 110%. After the adjustments, the long positions increased by 5% (from 80% to 85%) and the short positions increased by 10% (from 30% to 40%). The new gross exposure is the sum of the adjusted long and short positions 85% + 40% = 125%.<\/p><p><b>A is incorrect.<\/b> This would occur if shorts also increased by 15%. 85% + 45% = 130%<\/p><p><b>C is incorrect.<\/b> This would occur if 10% shorts were added rather than subtracted.  85% + 10% = 95%<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AlphaGen Capital<\/summary><div class=\"vig-body\"><p>AlphaGen Capital is a hedge fund specializing in a variety of strategies with a significant focus<\/p><p>on long/short equity. The fund prides itself on astute stock selection and a deep fundamental<\/p><p>analysis approach. Founded by a group of experienced portfolio managers, who bring their<\/p><p>sector-specific expertise, particularly in technology, finance, and healthcare, AlphaGen seeks to<\/p><p>generate consistent alpha for its investors by maintaining a flexible portfolio of both long and<\/p><p>short positions, while using leverage and beta tilts wisely to enhance returns and manage risk.<\/p><p><b>Investment Scenario<\/b><\/p><p>You are given the task of analyzing AlphaGen&#x27;s recent portfolio moves and strategy adjustments.<\/p><p>The current economic climate has been marked by market volatility, with sectors such as<\/p><p>technology and healthcare experiencing rapid changes due to innovation and regulatory<\/p><p>shifts.AlphaGen has historically maintained an average of 50% net long exposure, composed of<\/p><p>80% long positions and 30% short positions as a percentage of the portfolio&#x27;s capital. Given<\/p><p>recent market movements, certain adjustments were made:<\/p><p>AlphaGen increased its total long exposure by 5 percentage points by adding to its<\/p><p>holdings of undervalued healthcare stocks.<\/p><p>It increased its total short exposure by 10 percentage points by adding short positions<\/p><p>in overvalued tech stocks.<\/p><p>The fund applied a beta tilt, reducing net long exposure to 40%<\/p><\/div><\/details><div class=\"qtext\"><p>What is AlphaGen&#x27;s new gross exposure after the recent adjustments?<\/p><\/div>", "subj": "alternatives"}, {"n": 86, "q": "What would AlphaGen's total portfolio value be if it started with $100 million and applied 2x leverage to its new gross exposure?", "opts": ["$ 250 million.", "$ 145 million.", "$ 200 million."], "ans": "A", "expl": "With 2x leverage on the new gross exposure of 125%, the fund would control 2 × 125% = 250% of its original portfolio value. With a starting value of $100 million, the total value of the portfolio under management with leverage is B and C are incorrect. This corresponds to applying 2× leverage only to the original capital (100 million × 2 = $200 million) without considering that gross exposure itself was already elevated to 125%. It ignores the additional 25% gross position beyond the base capital.", "explhtml": "<p>With 2x leverage on the new gross exposure of 125%, the fund would control 2 × 125% = 250% of its original portfolio value. With a starting value of $100 million, the total value of the portfolio under management with leverage is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0115.webp\" style=\"max-width:min(100%,268px)\" alt=\"2.5 × $100 million = $250 million\"><p><b>B and C are incorrect.<\/b> This corresponds to applying 2× leverage only to the original capital (100 million × 2 = $200 million) without considering that gross exposure itself was already elevated to 125%. It ignores the additional 25% gross position beyond the base capital.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AlphaGen Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AlphaGen Capital is a hedge fund specializing in a variety of strategies with a significant focus<\/p><p>on long/short equity. The fund prides itself on astute stock selection and a deep fundamental<\/p><p>analysis approach. Founded by a group of experienced portfolio managers, who bring their<\/p><p>sector-specific expertise, particularly in technology, finance, and healthcare, AlphaGen seeks to<\/p><p>generate consistent alpha for its investors by maintaining a flexible portfolio of both long and<\/p><p>short positions, while using leverage and beta tilts wisely to enhance returns and manage risk.<\/p><p><b>Investment Scenario<\/b><\/p><p>You are given the task of analyzing AlphaGen&#x27;s recent portfolio moves and strategy adjustments.<\/p><p>The current economic climate has been marked by market volatility, with sectors such as<\/p><p>technology and healthcare experiencing rapid changes due to innovation and regulatory<\/p><p>shifts.AlphaGen has historically maintained an average of 50% net long exposure, composed of<\/p><p>80% long positions and 30% short positions as a percentage of the portfolio&#x27;s capital. Given<\/p><p>recent market movements, certain adjustments were made:<\/p><p>AlphaGen increased its total long exposure by 5 percentage points by adding to its<\/p><p>holdings of undervalued healthcare stocks.<\/p><p>It increased its total short exposure by 10 percentage points by adding short positions<\/p><p>in overvalued tech stocks.<\/p><p>The fund applied a beta tilt, reducing net long exposure to 40%<\/p><\/div><\/details><div class=\"qtext\"><p>What would AlphaGen&#x27;s total portfolio value be if it started with $100 million and applied 2x leverage to its new gross exposure?<\/p><\/div>", "subj": "alternatives"}, {"n": 87, "q": "The expected return of the fund if the anticipated return for long positions is 12% and for short positions is 6%, considering the changed exposures and no leverage is closest to.", "opts": ["0.069.", "0.132.", "0.126."], "ans": "C", "expl": "Using a weighted average return for the fund's positions, the expected return would be a sum of the returns from long and short positions: A is incorrect. This result comes from treating the short-position return as a loss rather than a gain. B is incorrect. This arises if you ignore the distinction between net and gross exposures and instead apply the sum of exposures (1.25) to an average return.", "explhtml": "<p>Using a weighted average return for the fund&#x27;s positions, the expected return would be a sum of the returns from long and short positions:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0116.webp\" style=\"max-width:min(100%,486px)\" alt=\"(0.85 × 0.12) + (0.40 × 0.06) = 0.102 + 0.024 = 0.126 = 12.6%\"><p><b>A is incorrect.<\/b> This result comes from treating the short-position return as a loss rather than a gain.<\/p><p><b>B is incorrect.<\/b> This arises if you ignore the distinction between net and gross exposures and instead apply the sum of exposures (1.25) to an average return.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AlphaGen Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AlphaGen Capital is a hedge fund specializing in a variety of strategies with a significant focus<\/p><p>on long/short equity. The fund prides itself on astute stock selection and a deep fundamental<\/p><p>analysis approach. Founded by a group of experienced portfolio managers, who bring their<\/p><p>sector-specific expertise, particularly in technology, finance, and healthcare, AlphaGen seeks to<\/p><p>generate consistent alpha for its investors by maintaining a flexible portfolio of both long and<\/p><p>short positions, while using leverage and beta tilts wisely to enhance returns and manage risk.<\/p><p><b>Investment Scenario<\/b><\/p><p>You are given the task of analyzing AlphaGen&#x27;s recent portfolio moves and strategy adjustments.<\/p><p>The current economic climate has been marked by market volatility, with sectors such as<\/p><p>technology and healthcare experiencing rapid changes due to innovation and regulatory<\/p><p>shifts.AlphaGen has historically maintained an average of 50% net long exposure, composed of<\/p><p>80% long positions and 30% short positions as a percentage of the portfolio&#x27;s capital. Given<\/p><p>recent market movements, certain adjustments were made:<\/p><p>AlphaGen increased its total long exposure by 5 percentage points by adding to its<\/p><p>holdings of undervalued healthcare stocks.<\/p><p>It increased its total short exposure by 10 percentage points by adding short positions<\/p><p>in overvalued tech stocks.<\/p><p>The fund applied a beta tilt, reducing net long exposure to 40%<\/p><\/div><\/details><div class=\"qtext\"><p>The expected return of the fund if the anticipated return for long positions is 12% and for short positions is 6%, considering the changed exposures and no leverage is closest to.<\/p><\/div>", "subj": "alternatives"}, {"n": 88, "q": "Suppose the market declines by 10%. Using AlphaGen’s initial net exposure (50%) and final net exposure after all adjustments (40%), the portfolio value will be closest to", "opts": ["$95 million and $96 million.", "$95 million and $94 million.", "$92 million and $98 million."], "ans": "A", "expl": "Before beta tilt, with 50% net long exposure, a 10% market downturn would reduce the portfolio by 50% of the downturn: $100 million −($100 million × 0.50 × 0.10) = $100 million −$5 million = $95 million After beta tilt, the fund reduced the net long exposure to 40%, so the impact would be lower: $100 million −($100 million × 0.40 × 0.10) = $100 million −$4 million = $96 million B is incorrect. It incorrectly assumes losses increase after reducing net exposure. A lower net long exposure (40% vs. 50%) reduces downside impact. The second value should be higher than $95M (i.e., $96M), not lower ($94M). C is incorrect. $92M implies a loss of $8M, which would require 80% net long exposure ( $100M × 80% × 10% = $8M). But initial exposure is 50%, not 80%. $98M implies a loss of $2M, requiring 20% net long exposure. However, the final exposure is 40% (not 20%), and the portfolio remains net long (losses should occur, not gains).", "explhtml": "<p>Before beta tilt, with 50% net long exposure, a 10% market downturn would reduce the portfolio by 50% of the downturn:<\/p><p>$100 million −($100 million × 0.50 × 0.10) = $100 million −$5 million = $95 million<\/p><p>After beta tilt, the fund reduced the net long exposure to 40%, so the impact would be lower:<\/p><p>$100 million −($100 million × 0.40 × 0.10) = $100 million −$4 million = $96 million<\/p><p><b>B is incorrect.<\/b> It incorrectly assumes losses increase after reducing net exposure. A lower net long exposure (40% vs. 50%) reduces downside impact. The second value should be higher than $95M (i.e., $96M), not lower ($94M).<\/p><p><b>C is incorrect.<\/b> $92M implies a loss of $8M, which would require 80% net long exposure ( $100M × 80% × 10% = $8M). But initial exposure is 50%, not 80%. $98M implies a loss of $2M, requiring 20% net long exposure. However, the final exposure is 40% (not 20%), and the portfolio remains net long (losses should occur, not gains).<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 85–88 · AlphaGen Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>AlphaGen Capital is a hedge fund specializing in a variety of strategies with a significant focus<\/p><p>on long/short equity. The fund prides itself on astute stock selection and a deep fundamental<\/p><p>analysis approach. Founded by a group of experienced portfolio managers, who bring their<\/p><p>sector-specific expertise, particularly in technology, finance, and healthcare, AlphaGen seeks to<\/p><p>generate consistent alpha for its investors by maintaining a flexible portfolio of both long and<\/p><p>short positions, while using leverage and beta tilts wisely to enhance returns and manage risk.<\/p><p><b>Investment Scenario<\/b><\/p><p>You are given the task of analyzing AlphaGen&#x27;s recent portfolio moves and strategy adjustments.<\/p><p>The current economic climate has been marked by market volatility, with sectors such as<\/p><p>technology and healthcare experiencing rapid changes due to innovation and regulatory<\/p><p>shifts.AlphaGen has historically maintained an average of 50% net long exposure, composed of<\/p><p>80% long positions and 30% short positions as a percentage of the portfolio&#x27;s capital. Given<\/p><p>recent market movements, certain adjustments were made:<\/p><p>AlphaGen increased its total long exposure by 5 percentage points by adding to its<\/p><p>holdings of undervalued healthcare stocks.<\/p><p>It increased its total short exposure by 10 percentage points by adding short positions<\/p><p>in overvalued tech stocks.<\/p><p>The fund applied a beta tilt, reducing net long exposure to 40%<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose the market declines by 10%. Using AlphaGen’s initial net exposure (50%) and final net exposure after all adjustments (40%), the portfolio value will be closest to<\/p><\/div>", "subj": "alternatives"}];

let graded  = false;
let filter  = "all";

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;

                      toggleNav(); };

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="qnotes-panel-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);

<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
