italizing on the anticipated decline<\/p><p>in stock prices. The strategy&#x27;s capital allocation is $100 million, and the short interest rate charged by the brokerage is 3% per annum.<\/p><p>Orion&#x27;s portfolio managers and analytics team are tasked with quantifying the performance<\/p><p>metrics as well as any potential risk mitigation strategies that could be applied moving forward.<\/p><\/div><\/details><div class=\"qtext\"><p>If the Distressed Securities Strategy yields a higher than anticipated return at 22%, what is the additional return in dollar value over the initially expected return?<\/p><\/div>", "subj": "alternatives"}, {"n": 31, "q": "What is the total fee earned by Orion Hedge Fund from the Managed Futures Strategy if the fund charges a 2% management fee and a 20% performance fee on the profits, assuming the strategy profits were $42 million for the period?", "opts": ["$15.4 million", "$8.4 million", "$12.4 million"], "ans": "A", "expl": "To determine the total fee earned by Orion Hedge Fund from the Managed Futures Strategy, we need to calculate both the management fee and the performance fee separately and then sum them up. The management fee is straightforward to calculate. It is 2% of the total assets under management (AUM) allocated to this strategy, which is $350 million. Therefore, the management fee is: The performance fee is calculated based on the profits generated by the strategy. Given that the profits were $42 million and the performance fee rate is 20%, the performance fee calculation is as follows: Adding both fees together gives the total fee earned from the Managed Futures Strategy: Total fee = Management fee + Performance fee = $7 million + $8.4 million = $15.4 million B is incorrect. The option B suggests a total fee of $8.4 million, which only accounts for the performance fee and completely disregards the management fee. As calculated above, the management fee alone contributes an additional $7 million to the total fee, making the total significantly higher than what is suggested in option B. C is incorrect. Option C proposes a total fee of $12.4 million. This figure appears to be a miscalculation as it neither matches the sum of the correctly calculated management and performance fees nor aligns with any logical combination of the fees involved. The correct total fee, as derived from the sum of the $7 million management fee and the $8.4 million performance fee, is $15.4 million, which is clearly outlined in option A.", "explhtml": "<p>To determine the total fee earned by Orion Hedge Fund from the Managed Futures Strategy, we need to calculate both the management fee and the performance fee separately and then sum them up. The management fee is straightforward to calculate. It is 2% of the total assets under management (AUM) allocated to this strategy, which is $350 million. Therefore, the management fee is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0049.webp\" style=\"max-width:min(100%,397px)\" alt=\"Management fee = 2% × $350 million = $7 million\"><p>The performance fee is calculated based on the profits generated by the strategy. Given that the profits were $42 million and the performance fee rate is 20%, the performance fee calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0050.webp\" style=\"max-width:min(100%,409px)\" alt=\"Performance fee = 20% × $42 million = $8.4 million\"><p>Adding both fees together gives the total fee earned from the Managed Futures Strategy:<\/p><p>Total fee = Management fee + Performance fee = $7 million + $8.4 million = $15.4 million<\/p><p><b>B is incorrect<\/b>. The option B suggests a total fee of $8.4 million, which only accounts for the performance fee and completely disregards the management fee. As calculated above, the management fee alone contributes an additional $7 million to the total fee, making the total significantly higher than what is suggested in option B.<\/p><p><b>C is incorrect<\/b>. Option C proposes a total fee of $12.4 million. This figure appears to be a miscalculation as it neither matches the sum of the correctly calculated management and performance fees nor aligns with any logical combination of the fees involved. The correct total fee, as derived from the sum of the $7 million management fee and the $8.4 million performance fee, is $15.4 million, which is clearly outlined in option A.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (f) Discuss investment characteristics, strategy implementation, and role in a portfolio of specialist hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Orion Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Hedge Fund, a boutique investment firm with $2 billion in AUM, is known for its agile and<\/p><p>alternative investment strategies. In a rapidly shifting financial landscape, Orion&#x27;s management<\/p><p>team is assessing the performance and risk profiles of several strategies from the last six months<\/p><p>to ensure continued investor satisfaction and superior financial returns. Four of the key<\/p><p>strategies currently under scrutiny are:<\/p><p>1. <b>Convertible Arbitrage Strategy<\/b>: Orion&#x27;s initiative to profit from pricing inefficiencies<\/p><p>between a company&#x27;s convertible bonds and its stock. Currently, $300 million is allocated to this strategy, and the typical debt-to-equity conversion rate is 40:1.<\/p><p>2. <b>Distressed Securities Strategy<\/b>: This strategy involves investing in the debt and equity<\/p><p>of companies under financial distress or going through bankruptcy. Orion has committed $250 million to distressed assets with an anticipated return of 18% due to potential restructuring or recovery.<\/p><p>3. <b>Managed Futures Strategy<\/b>: An approach leveraging futures contracts on indices,<\/p><p>commodities, and rates with $350 million of AUM assigned to it. The expectation is to capture trends and momentum in these markets.<\/p><p>4. <b>Short Selling Strategy<\/b>: A speculative technique capitalizing on the anticipated decline<\/p><p>in stock prices. The strategy&#x27;s capital allocation is $100 million, and the short interest rate charged by the brokerage is 3% per annum.<\/p><p>Orion&#x27;s portfolio managers and analytics team are tasked with quantifying the performance<\/p><p>metrics as well as any potential risk mitigation strategies that could be applied moving forward.<\/p><\/div><\/details><div class=\"qtext\"><p>What is the total fee earned by Orion Hedge Fund from the Managed Futures Strategy if the fund charges a 2% management fee and a 20% performance fee on the profits, assuming the strategy profits were $42 million for the period?<\/p><\/div>", "subj": "alternatives"}, {"n": 32, "q": "Assuming the Short Selling Strategy experienced a market rally and led to a loss of 10% on the capital allocated, what would be the total loss including the borrowing cost at the end of the year?", "opts": ["$13 million", "$10 million", "$11 million"], "ans": "A", "expl": "To calculate the total loss including the borrowing cost for Orion Hedge Fund's Short Selling Strategy, we start by understanding the initial conditions. The strategy had an allocated capital of $100 million. During a market rally, the strategy experienced a 10% loss on this capital. Additionally, there is a borrowing cost of 3% per annum charged on the total allocated capital. First, we calculate the direct loss from the market rally: Loss from market rally = Loss rate × Allocation = 0.10 × $100 million = $10 million This represents the immediate loss due to the decline in the value of the stocks that were short sold. Next, we calculate the annual borrowing cost: Borrowing cost = Borrowing cost rate × Allocation = 0.03 × $100 million = $3 million This cost is the interest paid on the borrowed funds used to finance the short sales. Adding these two amounts gives the total loss for the year: Thus, the total financial impact on the hedge fund from this strategy, considering both the loss from the market rally and the borrowing costs, is $13 million. B is incorrect. The option suggesting a total loss of $10 million only accounts for the loss from the market rally and completely disregards the additional borrowing cost. As calculated, the borrowing cost adds another $3 million to the loss, making the total $13 million. Ignoring the borrowing cost underestimates the financial impact on the hedge fund and does not provide a complete picture of the losses incurred from the strategy. C is incorrect. The option suggesting a total loss of $11 million is incorrect because it neither correctly calculates the loss from the market rally nor accounts for the full borrowing cost. The actual loss from the market rally is $10 million, and the borrowing cost is $3 million, totaling $13 million. Any figure that deviates from this calculation either omits some costs or miscalculates the existing figures, leading to an inaccurate assessment of the financial outcome of the strategy.", "explhtml": "<p>To calculate the total loss including the borrowing cost for Orion Hedge Fund&#x27;s Short Selling Strategy, we start by understanding the initial conditions. The strategy had an allocated capital of $100 million. During a market rally, the strategy experienced a 10% loss on this capital. Additionally, there is a borrowing cost of 3% per annum charged on the total allocated capital.<\/p><p>First, we calculate the direct loss from the market rally:<\/p><p>Loss from market rally = Loss rate × Allocation = 0.10 × $100 million = $10 million<\/p><p>This represents the immediate loss due to the decline in the value of the stocks that were short sold.<\/p><p>Next, we calculate the annual borrowing cost:<\/p><p>Borrowing cost = Borrowing cost rate × Allocation = 0.03 × $100 million = $3 million<\/p><p>This cost is the interest paid on the borrowed funds used to finance the short sales.<\/p><p>Adding these two amounts gives the total loss for the year:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0051.webp\" style=\"max-width:min(100%,722px)\" alt=\"Total loss = Loss from market rally + Borrowing cost = $10 million + $3 million = $13 million\"><p>Thus, the total financial impact on the hedge fund from this strategy, considering both the loss from the market rally and the borrowing costs, is $13 million.<\/p><p><b>B is incorrect<\/b>. The option suggesting a total loss of $10 million only accounts for the loss from the market rally and completely disregards the additional borrowing cost. As calculated, the borrowing cost adds another $3 million to the loss, making the total $13 million. Ignoring the borrowing cost underestimates the financial impact on the hedge fund and does not provide a complete picture of the losses incurred from the strategy.<\/p><p><b>C is incorrect<\/b>. The option suggesting a total loss of $11 million is incorrect because it neither correctly calculates the loss from the market rally nor accounts for the full borrowing cost. The actual loss from the market rally is $10 million, and the borrowing cost is $3 million, totaling $13 million. Any figure that deviates from this calculation either omits some costs or miscalculates the existing figures, leading to an inaccurate assessment of the financial outcome of the strategy.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 29–32 · Orion Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Orion Hedge Fund, a boutique investment firm with $2 billion in AUM, is known for its agile and<\/p><p>alternative investment strategies. In a rapidly shifting financial landscape, Orion&#x27;s management<\/p><p>team is assessing the performance and risk profiles of several strategies from the last six months<\/p><p>to ensure continued investor satisfaction and superior financial returns. Four of the key<\/p><p>strategies currently under scrutiny are:<\/p><p>1. <b>Convertible Arbitrage Strategy<\/b>: Orion&#x27;s initiative to profit from pricing inefficiencies<\/p><p>between a company&#x27;s convertible bonds and its stock. Currently, $300 million is allocated to this strategy, and the typical debt-to-equity conversion rate is 40:1.<\/p><p>2. <b>Distressed Securities Strategy<\/b>: This strategy involves investing in the debt and equity<\/p><p>of companies under financial distress or going through bankruptcy. Orion has committed $250 million to distressed assets with an anticipated return of 18% due to potential restructuring or recovery.<\/p><p>3. <b>Managed Futures Strategy<\/b>: An approach leveraging futures contracts on indices,<\/p><p>commodities, and rates with $350 million of AUM assigned to it. The expectation is to capture trends and momentum in these markets.<\/p><p>4. <b>Short Selling Strategy<\/b>: A speculative technique capitalizing on the anticipated decline<\/p><p>in stock prices. The strategy&#x27;s capital allocation is $100 million, and the short interest rate charged by the brokerage is 3% per annum.<\/p><p>Orion&#x27;s portfolio managers and analytics team are tasked with quantifying the performance<\/p><p>metrics as well as any potential risk mitigation strategies that could be applied moving forward.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming the Short Selling Strategy experienced a market rally and led to a loss of 10% on the capital allocated, what would be the total loss including the borrowing cost at the end of the year?<\/p><\/div>", "subj": "alternatives"}, {"n": 33, "q": "How much total annual profit does Pegasus expect to generate from the Market Making Strategy given the trade statistics?", "opts": ["$0.8 million", "$3.2 million", "$4.8 million"], "ans": "A", "expl": "To determine the total annual profit expected from the Market Making Strategy, we start by calculating the annual number of trades. The fund makes 200 trades per day, and assuming 250 trading days in a year, the annual number of trades is calculated as follows: Next, we calculate the profit per trade. Given the profit spread of 0.02% per trade and average trade of $80,000 to this strategy, the profit per trade is: Therefore, the total annual profit from the Market Making Strategy is: A is the correct answer. The calculations above clearly show that the expected total annual profit from the Market Making Strategy is \\$800,000. This is derived by multiplying the profit per trade by the number of trades per year, considering the profit spread and the capital allocated to this strategy. B is incorrect. It suggests a total annual profit of \\$3.2 million, which significantly overestimates the expected profit. The miscalculation in this option likely arises from an incorrect interpretation of the profit spread or an error in the multiplication of the profit per trade by the number of trades. As demonstrated, the correct calculation leads to a profit of \\$800,000, not \\$3.2 million. C is incorrect. Which suggests a total annual profit of \\$4.8 million, is also incorrect due to similar reasons as option B. It appears to further exaggerate the profit by misapplying the profit spread or the number of trades. The correct calculations, as shown, confirm that the profit should be \\$800,000, thereby invalidating the figure presented in option C. ", "explhtml": "<p>To determine the total annual profit expected from the Market Making Strategy, we start by calculating the annual number of trades. The fund makes 200 trades per day, and assuming 250 trading days in a year, the annual number of trades is calculated as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0052.webp\" style=\"max-width:min(100%,377px)\" alt=\"Annual number of trades = 200 × 250 = 50, 000\"><p>Next, we calculate the profit per trade. Given the profit spread of 0.02% per trade and average trade of $80,000 to this strategy, the profit per trade is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0053.webp\" style=\"max-width:min(100%,337px)\" alt=\"Profit per trade = 0.0002 × $80, 000 = $16\"><p>Therefore, the total annual profit from the Market Making Strategy is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0054.webp\" style=\"max-width:min(100%,722px)\" alt=\"Total annual profit = Profit per trade × Annual number of trades = $16 × 50,000 = $800, 000\"><p><b>A is the correct answer<\/b>. The calculations above clearly show that the expected total annual profit from the Market Making Strategy is \\$800,000. This is derived by multiplying the profit per trade by the number of trades per year, considering the profit spread and the capital allocated to this strategy.<\/p><p><b>B is incorrect<\/b>. It suggests a total annual profit of \\$3.2 million, which significantly overestimates the expected profit. The miscalculation in this option likely arises from an incorrect interpretation of the profit spread or an error in the multiplication of the profit per trade by the number of trades. As demonstrated, the correct calculation leads to a profit of \\$800,000, not \\$3.2 million.<\/p><p><b>C is incorrect<\/b>. Which suggests a total annual profit of \\$4.8 million, is also incorrect due to similar reasons as option B. It appears to further exaggerate the profit by misapplying the profit spread or the number of trades. The correct calculations, as shown, confirm that the profit should be \\$800,000, thereby invalidating the figure presented in option C. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4(g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Pegasus Quantitative Hedge Fund<\/summary><div class=\"vig-body\"><p>Pegasus Quantitative Hedge Fund is renowned for its utilization of advanced statistical models<\/p><p>and algorithmic trading systems. With $3 billion in AUM, Pegasus employs a range of<\/p><p>quantitative strategies to generate returns while managing risk in an efficient and systematic<\/p><p>manner. The fund is currently reviewing four specific quantitative strategies to recalibrate its<\/p><p>portfolio for the upcoming fiscal year. The fund uses a risk-free rate of 3% for performance<\/p><p>assessment:<\/p><p>1. <b>Statistical Arbitrage Strategy<\/b>: This strategy involves exploiting statistical mispricings<\/p><p>in the market by holding a diversified portfolio of long and short positions. Pegasus has allocated $500 million to this strategy, with an expected Sharpe ratio of 1.5 and a standard deviation of 6.67% based on historical data.<\/p><p>2. <b>Market Making Strategy<\/b>: A liquidity-providing strategy where the fund acts as an<\/p><p>intermediary in securities trading. The fund has dedicated $400 million to this strategy, anticipating a profit spread of 0.02% per trade with an average of 200 trades per day over the year. The average trade size is $ 80,000.<\/p><p>3. <b>Algorithmic Trading Strategy<\/b>: Employing advanced algorithms to execute high-<\/p><p>frequency trades based on predefined criteria. With an investment of $600 million in this strategy, Pegasus anticipates a turnover rate of 5 times the capital on a monthly basis.<\/p><p>4. <b>Quantitative Macro Strategy<\/b>: A systematic strategy that takes positions in global<\/p><p>markets based on economic indicators and models. The strategy has $300 million allocated towards it, targeting an annual return of 12%.<\/p><p>The quantitative research team at Pegasus is tasked with examining the prospective returns, risk<\/p><p>parameters, and execution feasibility, considering historical performance and projected market<\/p><p>trends.<\/p><\/div><\/details><div class=\"qtext\"><p>How much total annual profit does Pegasus expect to generate from the Market Making Strategy given the trade statistics?<\/p><\/div>", "subj": "alternatives"}, {"n": 34, "q": "Using the Quantitative Macro Strategy, what is the minimum expected return necessary for the strategy to outperform the Statistical Arbitrage Strategy if both have equal volatility and the latter has an expected return of 11%?", "opts": ["11.01%", "11.50%", "12%"], "ans": "A", "expl": "When comparing two investment strategies with equal volatility, the strategy that offers a higher expected return is considered to outperform the other. In this scenario, the Statistical Arbitrage Strategy has an expected return of 11%. To outperform this strategy, the Quantitative Macro Strategy must achieve a return greater than 11%. The smallest increment above 11% that is listed among the options is 11.01%. Therefore, an expected return of 11.01% for the Quantitative Macro Strategy would indeed be the minimum necessary to surpass the performance of the Statistical Arbitrage Strategy. This is because any return greater than 11% would make the Quantitative Macro Strategy more attractive to investors looking for higher returns for the same level of risk. B is incorrect. The option of 11.5% might seem like a safe choice to ensure the Quantitative Macro Strategy outperforms the Statistical Arbitrage Strategy. However, the question specifically asks for the minimum expected return necessary to achieve this outperformance. While 11.5% is indeed higher than 11%, it is not the minimum required return. The minimum increment that ensures outperformance, given the options provided, is 11.01%. Choosing 11.5% would disregard the precision needed in financial decision-making where achieving outperformance with the smallest necessary increase in return can be crucial for optimizing portfolio performance. C is incorrect. The option of 12% significantly exceeds the necessary minimum return to outperform the Statistical Arbitrage Strategy. While a 12% return would undoubtedly ensure that the Quantitative Macro Strategy outperforms the Statistical Arbitrage Strategy, it is not the minimum return required. The question seeks the smallest increase in expected return above 11% that would result in outperformance. Therefore, selecting 12% overshoots the requirement and does not accurately answer the question regarding the minimum necessary return. ", "explhtml": "<p>When comparing two investment strategies with equal volatility, the strategy that offers a higher expected return is considered to outperform the other. In this scenario, the Statistical Arbitrage Strategy has an expected return of 11%. To outperform this strategy, the Quantitative Macro Strategy must achieve a return greater than 11%. The smallest increment above 11% that is listed among the options is 11.01%. Therefore, an expected return of 11.01% for the Quantitative Macro Strategy would indeed be the minimum necessary to surpass the performance of the Statistical Arbitrage Strategy. This is because any return greater than 11% would make the Quantitative Macro Strategy more attractive to investors looking for higher returns for the same level of risk.<\/p><p><b>B is incorrect<\/b>. The option of 11.5% might seem like a safe choice to ensure the Quantitative Macro Strategy outperforms the Statistical Arbitrage Strategy. However, the question specifically asks for the minimum expected return necessary to achieve this outperformance. While 11.5% is indeed higher than 11%, it is not the minimum required return. The minimum increment that ensures outperformance, given the options provided, is 11.01%. Choosing 11.5% would disregard the precision needed in financial decision-making where achieving outperformance with the smallest necessary increase in return can be crucial for optimizing portfolio performance.<\/p><p><b>C is incorrect<\/b>. The option of 12% significantly exceeds the necessary minimum return to outperform the Statistical Arbitrage Strategy. While a 12% return would undoubtedly ensure that the Quantitative Macro Strategy outperforms the Statistical Arbitrage Strategy, it is not the minimum return required. The question seeks the smallest increase in expected return above 11% that would result in outperformance. Therefore, selecting 12% overshoots the requirement and does not accurately answer the question regarding the minimum necessary return. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Pegasus Quantitative Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pegasus Quantitative Hedge Fund is renowned for its utilization of advanced statistical models<\/p><p>and algorithmic trading systems. With $3 billion in AUM, Pegasus employs a range of<\/p><p>quantitative strategies to generate returns while managing risk in an efficient and systematic<\/p><p>manner. The fund is currently reviewing four specific quantitative strategies to recalibrate its<\/p><p>portfolio for the upcoming fiscal year. The fund uses a risk-free rate of 3% for performance<\/p><p>assessment:<\/p><p>1. <b>Statistical Arbitrage Strategy<\/b>: This strategy involves exploiting statistical mispricings<\/p><p>in the market by holding a diversified portfolio of long and short positions. Pegasus has allocated $500 million to this strategy, with an expected Sharpe ratio of 1.5 and a standard deviation of 6.67% based on historical data.<\/p><p>2. <b>Market Making Strategy<\/b>: A liquidity-providing strategy where the fund acts as an<\/p><p>intermediary in securities trading. The fund has dedicated $400 million to this strategy, anticipating a profit spread of 0.02% per trade with an average of 200 trades per day over the year. The average trade size is $ 80,000.<\/p><p>3. <b>Algorithmic Trading Strategy<\/b>: Employing advanced algorithms to execute high-<\/p><p>frequency trades based on predefined criteria. With an investment of $600 million in this strategy, Pegasus anticipates a turnover rate of 5 times the capital on a monthly basis.<\/p><p>4. <b>Quantitative Macro Strategy<\/b>: A systematic strategy that takes positions in global<\/p><p>markets based on economic indicators and models. The strategy has $300 million allocated towards it, targeting an annual return of 12%.<\/p><p>The quantitative research team at Pegasus is tasked with examining the prospective returns, risk<\/p><p>parameters, and execution feasibility, considering historical performance and projected market<\/p><p>trends.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the Quantitative Macro Strategy, what is the minimum expected return necessary for the strategy to outperform the Statistical Arbitrage Strategy if both have equal volatility and the latter has an expected return of 11%?<\/p><\/div>", "subj": "alternatives"}, {"n": 35, "q": "Assuming there is an industry-wide downturn, and the Statistical Arbitrage Strategy’s Sharpe ratio declines to 0.9 with the risk level remaining constant, what would be the revised expected return?", "opts": ["9.30%", "9.00%", "6.30%"], "ans": "B", "expl": "The correct answer is option B, which states that the revised expected return is 9.0%. To understand why this is the correct answer, we need to consider the formula for the Sharpe ratio, which is defined as the difference between the return of the investment and the risk-free rate, divided by the standard deviation of the investment's excess return. Given the new Sharpe ratio (S') of 0.9, the unchanged risk-free rate of 3%, and the standard deviation of 6.67%, we can set up the equation as follows: Multiplying both sides by 6.67% and adding 3% to isolate the revised expected return, we get: This calculation confirms that the revised expected return, given the new Sharpe ratio and the unchanged risk parameters, is indeed 9.0%. A is incorrect. It suggests that the revised expected return is 9.3%. This answer can be disproven by recalculating the expected return using the Sharpe ratio formula. If we substitute 9.3% as the expected return in the formula, the calculation would not satisfy the Sharpe ratio of 0.9 with the given standard deviation and risk-free rate. The correct calculation aligns with a return of 9.0%, not 9.3%, as shown in the detailed calculation above. C is incorrect. It proposes a revised expected return of 6.3%. This is significantly lower than what is calculated using the Sharpe ratio formula. Using 6.3% in the formula would yield a Sharpe ratio well below 0.9, given a standard deviation of 6.67% and a risk-free rate of 3%. The correct application of the formula, as demonstrated, leads to a revised expected return of 9.0%, thereby invalidating the 6.3% return proposed by option C. ", "explhtml": "<p>The correct answer is option B, which states that the revised expected return is 9.0%. To understand why this is the correct answer, we need to consider the formula for the Sharpe ratio, which is defined as the difference between the return of the investment and the risk-free rate, divided by the standard deviation of the investment&#x27;s excess return. Given the new Sharpe ratio (S&#x27;) of 0.9, the unchanged risk-free rate of 3%, and the standard deviation of 6.67%, we can set up the equation as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0055.webp\" style=\"max-width:min(100%,355px)\" alt=\"S ′ = Revised expected return −Risk-free rate σ Revised expected return −3% 0.9 = 6.67%\"><p>Multiplying both sides by 6.67% and adding 3% to isolate the revised expected return, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0056.webp\" style=\"max-width:min(100%,354px)\" alt=\"0.9 × 6.67% + 3% = Revised expected return 6% + 3% = Revised expected return Revised expected return = 9.0%\"><p>This calculation confirms that the revised expected return, given the new Sharpe ratio and the unchanged risk parameters, is indeed 9.0%.<\/p><p><b>A is incorrect<\/b>. It suggests that the revised expected return is 9.3%. This answer can be disproven by recalculating the expected return using the Sharpe ratio formula. If we substitute 9.3% as the expected return in the formula, the calculation would not satisfy the Sharpe ratio of 0.9 with the given standard deviation and risk-free rate. The correct calculation aligns with a return of 9.0%, not 9.3%, as shown in the detailed calculation above.<\/p><p><b>C is incorrect<\/b>. It proposes a revised expected return of 6.3%. This is significantly lower than what is calculated using the Sharpe ratio formula. Using 6.3% in the formula would yield a Sharpe ratio well below 0.9, given a standard deviation of 6.67% and a risk-free rate of 3%. The correct application of the formula, as demonstrated, leads to a revised expected return of 9.0%, thereby invalidating the 6.3% return proposed by option C. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Pegasus Quantitative Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pegasus Quantitative Hedge Fund is renowned for its utilization of advanced statistical models<\/p><p>and algorithmic trading systems. With $3 billion in AUM, Pegasus employs a range of<\/p><p>quantitative strategies to generate returns while managing risk in an efficient and systematic<\/p><p>manner. The fund is currently reviewing four specific quantitative strategies to recalibrate its<\/p><p>portfolio for the upcoming fiscal year. The fund uses a risk-free rate of 3% for performance<\/p><p>assessment:<\/p><p>1. <b>Statistical Arbitrage Strategy<\/b>: This strategy involves exploiting statistical mispricings<\/p><p>in the market by holding a diversified portfolio of long and short positions. Pegasus has allocated $500 million to this strategy, with an expected Sharpe ratio of 1.5 and a standard deviation of 6.67% based on historical data.<\/p><p>2. <b>Market Making Strategy<\/b>: A liquidity-providing strategy where the fund acts as an<\/p><p>intermediary in securities trading. The fund has dedicated $400 million to this strategy, anticipating a profit spread of 0.02% per trade with an average of 200 trades per day over the year. The average trade size is $ 80,000.<\/p><p>3. <b>Algorithmic Trading Strategy<\/b>: Employing advanced algorithms to execute high-<\/p><p>frequency trades based on predefined criteria. With an investment of $600 million in this strategy, Pegasus anticipates a turnover rate of 5 times the capital on a monthly basis.<\/p><p>4. <b>Quantitative Macro Strategy<\/b>: A systematic strategy that takes positions in global<\/p><p>markets based on economic indicators and models. The strategy has $300 million allocated towards it, targeting an annual return of 12%.<\/p><p>The quantitative research team at Pegasus is tasked with examining the prospective returns, risk<\/p><p>parameters, and execution feasibility, considering historical performance and projected market<\/p><p>trends.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming there is an industry-wide downturn, and the Statistical Arbitrage Strategy’s Sharpe ratio declines to 0.9 with the risk level remaining constant, what would be the revised expected return?<\/p><\/div>", "subj": "alternatives"}, {"n": 36, "q": "If the annual return for the Quantitative Macro Strategy is actually 14%, how much additional profit in dollars does this generate over the target return on the allocated capital?", "opts": ["$6 million", "$10 million", "$8 million"], "ans": "A", "expl": "The correct answer is option A, which calculates the additional profit generated by the Quantitative Macro Strategy when its annual return exceeds the target by 2%. The strategy was initially targeting an annual return of 12%, but it actually achieved 14%. The difference in return rates is 14% - 12% = 2%. To find the additional profit in dollars, we multiply this additional return rate by the capital allocated to the strategy, which is $300 million. The calculation is as follows: This shows that the additional profit, due to the higher than expected return rate, amounts to $6 million. B is incorrect. It suggests an additional profit of $10 million, which does not align with the calculations based on the given data. The error in this option arises from possibly misinterpreting the percentage increase or the base amount of capital. As calculated, a 2% increase on a $300 million investment results in an additional profit of $6 million, not $10 million. This discrepancy indicates a fundamental misunderstanding or miscalculation of the percentage increase applied to the allocated capital. C is incorrect. It proposes that the additional profit is $8 million. Similar to option B, this answer results from incorrect calculations or assumptions about the return rate or the capital involved. The correct calculation, as detailed, clearly shows that a 2% increase on $300 million yields $6 million. Any deviation from this calculation, such as arriving at $8 million, suggests an error in applying the 2% increase correctly or a misinterpretation of the capital amount involved in the strategy. ", "explhtml": "<p>The correct answer is option A, which calculates the additional profit generated by the Quantitative Macro Strategy when its annual return exceeds the target by 2%. The strategy was initially targeting an annual return of 12%, but it actually achieved 14%. The difference in return rates is 14% - 12% = 2%. To find the additional profit in dollars, we multiply this additional return rate by the capital allocated to the strategy, which is $300 million. The calculation is as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0057.webp\" style=\"max-width:min(100%,563px)\" alt=\"Additional profit = 2% × $300 million = 0.02 × $300 million = $6 million\"><p>This shows that the additional profit, due to the higher than expected return rate, amounts to $6 million.<\/p><p><b>B is incorrect<\/b>. It suggests an additional profit of $10 million, which does not align with the calculations based on the given data. The error in this option arises from possibly misinterpreting the percentage increase or the base amount of capital. As calculated, a 2% increase on a $300 million investment results in an additional profit of $6 million, not $10 million. This discrepancy indicates a fundamental misunderstanding or miscalculation of the percentage increase applied to the allocated capital.<\/p><p><b>C is incorrect<\/b>. It proposes that the additional profit is $8 million. Similar to option B, this answer results from incorrect calculations or assumptions about the return rate or the capital involved. The correct calculation, as detailed, clearly shows that a 2% increase on $300 million yields $6 million. Any deviation from this calculation, such as arriving at $8 million, suggests an error in applying the 2% increase correctly or a misinterpretation of the capital amount involved in the strategy. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (g) Discuss investment characteristics, strategy implementation, and role in a portfolio of multi- manager hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 33–36 · Pegasus Quantitative Hedge Fund<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pegasus Quantitative Hedge Fund is renowned for its utilization of advanced statistical models<\/p><p>and algorithmic trading systems. With $3 billion in AUM, Pegasus employs a range of<\/p><p>quantitative strategies to generate returns while managing risk in an efficient and systematic<\/p><p>manner. The fund is currently reviewing four specific quantitative strategies to recalibrate its<\/p><p>portfolio for the upcoming fiscal year. The fund uses a risk-free rate of 3% for performance<\/p><p>assessment:<\/p><p>1. <b>Statistical Arbitrage Strategy<\/b>: This strategy involves exploiting statistical mispricings<\/p><p>in the market by holding a diversified portfolio of long and short positions. Pegasus has allocated $500 million to this strategy, with an expected Sharpe ratio of 1.5 and a standard deviation of 6.67% based on historical data.<\/p><p>2. <b>Market Making Strategy<\/b>: A liquidity-providing strategy where the fund acts as an<\/p><p>intermediary in securities trading. The fund has dedicated $400 million to this strategy, anticipating a profit spread of 0.02% per trade with an average of 200 trades per day over the year. The average trade size is $ 80,000.<\/p><p>3. <b>Algorithmic Trading Strategy<\/b>: Employing advanced algorithms to execute high-<\/p><p>frequency trades based on predefined criteria. With an investment of $600 million in this strategy, Pegasus anticipates a turnover rate of 5 times the capital on a monthly basis.<\/p><p>4. <b>Quantitative Macro Strategy<\/b>: A systematic strategy that takes positions in global<\/p><p>markets based on economic indicators and models. The strategy has $300 million allocated towards it, targeting an annual return of 12%.<\/p><p>The quantitative research team at Pegasus is tasked with examining the prospective returns, risk<\/p><p>parameters, and execution feasibility, considering historical performance and projected market<\/p><p>trends.<\/p><\/div><\/details><div class=\"qtext\"><p>If the annual return for the Quantitative Macro Strategy is actually 14%, how much additional profit in dollars does this generate over the target return on the allocated capital?<\/p><\/div>", "subj": "alternatives"}, {"n": 37, "q": "To effectively execute a short-biased strategy on EPI and an EMN strategy involving DBS, Stone is considering using leverage. If Atlas Capital has $50 million in equity, how much notional exposure to EPI and DBS is required to achieve a hypothetical leverage ratio of 4?", "opts": ["$100 million.", "$150 million.", "$200 million."], "ans": "C", "expl": "To determine the notional exposure required for Atlas Capital to achieve a leverage ratio of 4, we start by understanding the concept of leverage ratio in financial terms. A leverage ratio of 4 implies that for every dollar of equity, the fund can control $4 in total investments. Given that Atlas Capital has $50 million in equity, the calculation for the total notional exposure would be This calculation shows that with a leverage ratio of 4, Atlas Capital can manage $200 million in investments. This amount of notional exposure allows the fund to amplify its investment capacity and potentially increase returns on both the short positions in EPI and the equity market-neutral strategy involving DBS. A is incorrect. It suggests a notional exposure of $100 million, which would correspond to a leverage ratio of 2 ( ). This is incorrect because it does not meet the specified leverage ratio of 4, thus underutilizing the potential investment capacity of Atlas Capital's equity. A leverage ratio of 2 would imply less aggressive investment strategies and lower potential returns compared to a leverage ratio of 4. B is incorrect. It proposes a notional exposure of $150 million, which corresponds to a leverage ratio of 3 ( ). This is also incorrect as it does not align with the intended leverage ratio of 4. While closer to the correct answer than option A, it still falls short of fully leveraging the equity to maximize investment potential and achieve the strategic objectives of Atlas Capital in both shorting EPI and investing in DBS. ", "explhtml": "<p>To determine the notional exposure required for Atlas Capital to achieve a leverage ratio of 4, we start by understanding the concept of leverage ratio in financial terms. A leverage ratio of 4 implies that for every dollar of equity, the fund can control $4 in total investments. Given that Atlas Capital has $50 million in equity, the calculation for the total notional exposure would be<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0058.webp\" style=\"max-width:min(100%,229px)\" alt=\"50 million × 4 = 200 million.\"><p>This calculation shows that with a leverage ratio of 4, Atlas Capital can manage $200 million in investments. This amount of notional exposure allows the fund to amplify its investment capacity and potentially increase returns on both the short positions in EPI and the equity market-neutral strategy involving DBS.<\/p><p><b>A is incorrect<\/b>. It suggests a notional exposure of $100 million, which would correspond to a leverage ratio of 2 (<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0059.webp\" style=\"max-width:min(100%,223px)\" alt=\"50 million × 2 = 100 million\"><p>). This is incorrect because it does not meet the specified leverage ratio of 4, thus underutilizing the potential investment capacity of Atlas Capital&#x27;s equity. A leverage ratio of 2 would imply less aggressive investment strategies and lower potential returns compared to a leverage ratio of 4.<\/p><p><b>B is incorrect<\/b>. It proposes a notional exposure of $150 million, which corresponds to a leverage ratio of 3 (<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0060.webp\" style=\"max-width:min(100%,223px)\" alt=\"50 million × 3 = 150 million\"><p>). This is also incorrect as it does not align with the intended leverage ratio of 4. While closer to the correct answer than option A, it still falls short of fully leveraging the equity to maximize investment potential and achieve the strategic objectives of Atlas Capital in both shorting EPI and investing in DBS. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Epione Pharmaceuticals and Demeter BioSciences<\/summary><div class=\"vig-body\"><p>In a fast-paced and ever-evolving pharmaceutical market, hedge fund managers like Kit Stone<\/p><p>are tasked with identifying potential high-reward investments through complex strategies such<\/p><p>as short-biased and equity market-neutral (EMN) funds. Stone&#x27;s fund—Atlas Capital—specializes<\/p><p>in these sophisticated investment plays, scouring the financial landscape for opportunities to<\/p><p>capitalize on overvaluations and undervalued gems.<\/p><p>Epione Pharmaceuticals (EPI), a large-cap pharma company, has recently come under scrutiny of<\/p><p>Stone&#x27;s team due to irregularities in its financial reports and concerns over the efficacy of its<\/p><p>blockbuster drug, Panacea. The company&#x27;s stock price has been volatile, and some analysts<\/p><p>predict a downturn due to impending patent cliffs and competition from generics.<\/p><p>Simultaneously, demographics and innovation within the biotech sector have favorably<\/p><p>positioned Demeter BioSciences (DBS), a small-cap firm focused on precision medicine with a<\/p><p>promising drug pipeline. Its stock, however, remains undervalued as the market has not yet fully<\/p><p>recognized its growth potential.<\/p><p>Both EPI and DBS play crucial roles in the case study, as Stone examines the financial viability of<\/p><p>adding EPI to the short side of his portfolio while considering DBS for a potential long play. The<\/p><p>interplay between these companies&#x27; divergent paths offers a rich tableau for the application of<\/p><p>hedge fund strategies.<\/p><p>Stone&#x27;s analysts made the following statement based on his report:<\/p><p>Statement 1: EPI&#x27;s current P/E ratio is 35 and P/B ratio is 4, significantly higher than the<\/p><p>industry averages of 15 and 2, respectively. EPI&#x27;s trailing twelve-month EPS growth is 2%, well<\/p><p>below the industry average of 20%.<\/p><p>Statement 2: DBS, on the other hand, shows a P/E ratio of 10 and P/B ratio of 1.5 with an EPS<\/p><p>growth of 25%.<\/p><p>Statement 3: DBS has a convertible bond issuing that could be a potential candidate for<\/p><p>arbitrage. The bonds are convertible into 50 shares of DBS at any time, and currently, DBS&#x27;s<\/p><p>share price is $40, while the bond is priced at $1,900 with a face value of $2,000.<\/p><\/div><\/details><div class=\"qtext\"><p>To effectively execute a short-biased strategy on EPI and an EMN strategy involving DBS, Stone is considering using leverage. If Atlas Capital has $50 million in equity, how much notional exposure to EPI and DBS is required to achieve a hypothetical leverage ratio of 4?<\/p><\/div>", "subj": "alternatives"}, {"n": 38, "q": "Considering the information about DBS, what might be an attractive strategy for Atlas Capital regarding its stock?", "opts": ["Short-selling DBS stock due to its underperformance in EPS growth.", "Taking a long position in DBS because its P/E and P/B ratios suggest it is undervalued, coupled with a strong EPS growth.", "Avoiding investment in DBS due to high valuation metrics."], "ans": "B", "expl": "Taking a long position in DBS is a strategic move for Atlas Capital, primarily due to the company's favorable valuation metrics and strong earnings growth. DBS's Price-to-Earnings (P/E) ratio stands at 10, significantly lower than the industry average, which suggests that the stock is undervalued relative to its earnings. Additionally, the Price-to-Book (P/B) ratio of 1.5 further supports the undervaluation argument, as it is below the typical industry benchmark. Most compelling is DBS's Earnings Per Share (EPS) growth rate of 25%, which is substantially higher than the industry average. This robust growth rate indicates a strong potential for future profitability and financial health, making DBS an attractive candidate for a long position in Atlas Capital's investment portfolio. A is incorrect. The suggestion to short-sell DBS stock due to underperformance in EPS growth is unfounded as the financial data indicates otherwise. DBS has demonstrated a strong EPS growth of 25%, which is well above the industry average. This level of performance typically signals a healthy, expanding company, not one that is underperforming. Short-selling is generally considered when a company shows signs of financial decline or overvaluation, neither of which applies to DBS based on the provided metrics. Therefore, short-selling DBS would not align with the observed financial indicators and market performance. C is incorrect. Avoiding investment in DBS due to high valuation metrics contradicts the actual financial data presented. The P/E ratio of 10 and P/B ratio of 1.5 are both below industry averages, which typically indicate undervaluation rather than overvaluation. These metrics suggest that the market has not fully recognized the value of DBS, potentially due to its smaller size or niche focus within the biotech sector. By avoiding investment, Atlas Capital would miss the opportunity to capitalize on the growth potential of DBS before the market corrects its undervaluation. Thus, the strategy of avoiding investment based on incorrect assumptions of high valuation would not be prudent. ", "explhtml": "<p>Taking a long position in DBS is a strategic move for Atlas Capital, primarily due to the company&#x27;s favorable valuation metrics and strong earnings growth. DBS&#x27;s Price-to-Earnings (P/E) ratio stands at 10, significantly lower than the industry average, which suggests that the stock is undervalued relative to its earnings. Additionally, the Price-to-Book (P/B) ratio of 1.5 further supports the undervaluation argument, as it is below the typical industry benchmark. Most compelling is DBS&#x27;s Earnings Per Share (EPS) growth rate of 25%, which is substantially higher than the industry average. This robust growth rate indicates a strong potential for future profitability and financial health, making DBS an attractive candidate for a long position in Atlas Capital&#x27;s investment portfolio.<\/p><p><b>A is incorrect<\/b>. The suggestion to short-sell DBS stock due to underperformance in EPS growth is unfounded as the financial data indicates otherwise. DBS has demonstrated a strong EPS growth of 25%, which is well above the industry average. This level of performance typically signals a healthy, expanding company, not one that is underperforming. Short-selling is generally considered when a company shows signs of financial decline or overvaluation, neither of which applies to DBS based on the provided metrics. Therefore, short-selling DBS would not align with the observed financial indicators and market performance.<\/p><p><b>C is incorrect<\/b>. Avoiding investment in DBS due to high valuation metrics contradicts the actual financial data presented. The P/E ratio of 10 and P/B ratio of 1.5 are both below industry averages, which typically indicate undervaluation rather than overvaluation. These metrics suggest that the market has not fully recognized the value of DBS, potentially due to its smaller size or niche focus within the biotech sector. By avoiding investment, Atlas Capital would miss the opportunity to capitalize on the growth potential of DBS before the market corrects its undervaluation. Thus, the strategy of avoiding investment based on incorrect assumptions of high valuation would not be prudent. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Epione Pharmaceuticals and Demeter BioSciences<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In a fast-paced and ever-evolving pharmaceutical market, hedge fund managers like Kit Stone<\/p><p>are tasked with identifying potential high-reward investments through complex strategies such<\/p><p>as short-biased and equity market-neutral (EMN) funds. Stone&#x27;s fund—Atlas Capital—specializes<\/p><p>in these sophisticated investment plays, scouring the financial landscape for opportunities to<\/p><p>capitalize on overvaluations and undervalued gems.<\/p><p>Epione Pharmaceuticals (EPI), a large-cap pharma company, has recently come under scrutiny of<\/p><p>Stone&#x27;s team due to irregularities in its financial reports and concerns over the efficacy of its<\/p><p>blockbuster drug, Panacea. The company&#x27;s stock price has been volatile, and some analysts<\/p><p>predict a downturn due to impending patent cliffs and competition from generics.<\/p><p>Simultaneously, demographics and innovation within the biotech sector have favorably<\/p><p>positioned Demeter BioSciences (DBS), a small-cap firm focused on precision medicine with a<\/p><p>promising drug pipeline. Its stock, however, remains undervalued as the market has not yet fully<\/p><p>recognized its growth potential.<\/p><p>Both EPI and DBS play crucial roles in the case study, as Stone examines the financial viability of<\/p><p>adding EPI to the short side of his portfolio while considering DBS for a potential long play. The<\/p><p>interplay between these companies&#x27; divergent paths offers a rich tableau for the application of<\/p><p>hedge fund strategies.<\/p><p>Stone&#x27;s analysts made the following statement based on his report:<\/p><p>Statement 1: EPI&#x27;s current P/E ratio is 35 and P/B ratio is 4, significantly higher than the<\/p><p>industry averages of 15 and 2, respectively. EPI&#x27;s trailing twelve-month EPS growth is 2%, well<\/p><p>below the industry average of 20%.<\/p><p>Statement 2: DBS, on the other hand, shows a P/E ratio of 10 and P/B ratio of 1.5 with an EPS<\/p><p>growth of 25%.<\/p><p>Statement 3: DBS has a convertible bond issuing that could be a potential candidate for<\/p><p>arbitrage. The bonds are convertible into 50 shares of DBS at any time, and currently, DBS&#x27;s<\/p><p>share price is $40, while the bond is priced at $1,900 with a face value of $2,000.<\/p><\/div><\/details><div class=\"qtext\"><p>Considering the information about DBS, what might be an attractive strategy for Atlas Capital regarding its stock?<\/p><\/div>", "subj": "alternatives"}, {"n": 39, "q": "For EMN strategies, maintaining a zero beta is crucial to neutralize market risk. If DBS's beta is 1.3 and similar equities in the portfolio have an average beta of -1.3 with a combined equity value of $20 million, what is the value of the DBS position needed to attain market neutrality?", "opts": ["$10 million.", "$20 million.", "$30 million."], "ans": "B", "expl": "To achieve a zero beta in an equity market-neutral strategy, the sum of the products of the betas and their corresponding investment values across all positions in the portfolio must equal zero. In this scenario, the other equities in the portfolio have a combined beta of -1.3 and a total investment value of $20 million. To counterbalance this, we need an investment in DBS, which has a positive beta of 1.3, such that the product of DBS's beta and its investment value equals the negative of the sum of the products of the other equities. Mathematically, this is represented as: Thus, an investment of $20 million in DBS is required to achieve market neutrality. This calculation ensures that the positive beta of DBS perfectly offsets the negative beta of the other equities, maintaining a zero overall beta for the portfolio. A is incorrect. Investing only $10 million in DBS would result in an insufficient offset to balance the negative beta from the other equities. The calculation would be: This amount does not match the required $26,000,000 to neutralize the negative beta effect of the other equities in the portfolio. Therefore, a $10 million investment would leave the portfolio with a net negative beta, not achieving the desired market neutrality. C is incorrect. An investment of $30 million in DBS would exceed the necessary amount to balance the negative beta from the other equities. The calculation for this scenario would be: This results in a total that surpasses the required $26,000,000, leading to a positive net beta for the portfolio. Consequently, the portfolio would not be market-neutral but rather biased towards positive market movements, which contradicts the objective of an equity market-neutral strategy.", "explhtml": "<p>To achieve a zero beta in an equity market-neutral strategy, the sum of the products of the betas and their corresponding investment values across all positions in the portfolio must equal zero. In this scenario, the other equities in the portfolio have a combined beta of -1.3 and a total investment value of $20 million. To counterbalance this, we need an investment in DBS, which has a positive beta of 1.3, such that the product of DBS&#x27;s beta and its investment value equals the negative of the sum of the products of the other equities. Mathematically, this is represented as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0061.webp\" style=\"max-width:min(100%,281px)\" alt=\"1.3 × VDBS = −(−1.3 × 20, 000, 000) 1.3 × VDBS = 26, 000, 000 26, 000,000 VDBS = 1.3 = 20, 000,000\"><p>Thus, an investment of $20 million in DBS is required to achieve market neutrality. This calculation ensures that the positive beta of DBS perfectly offsets the negative beta of the other equities, maintaining a zero overall beta for the portfolio.<\/p><p><b>A is incorrect<\/b>. Investing only $10 million in DBS would result in an insufficient offset to balance the negative beta from the other equities. The calculation would be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0062.webp\" style=\"max-width:min(100%,258px)\" alt=\"1.3 × 10,000, 000 = 13, 000, 000\"><p>This amount does not match the required $26,000,000 to neutralize the negative beta effect of the other equities in the portfolio. Therefore, a $10 million investment would leave the portfolio with a net negative beta, not achieving the desired market neutrality.<\/p><p><b>C is incorrect<\/b>. An investment of $30 million in DBS would exceed the necessary amount to balance the negative beta from the other equities. The calculation for this scenario would be:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0063.webp\" style=\"max-width:min(100%,258px)\" alt=\"1.3 × 30,000, 000 = 39, 000, 000\"><p>This results in a total that surpasses the required $26,000,000, leading to a positive net beta for the portfolio. Consequently, the portfolio would not be market-neutral but rather biased towards positive market movements, which contradicts the objective of an equity market-neutral strategy.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Epione Pharmaceuticals and De 2: DBS, on the other hand, shows a P/E ratio of 10 and P/B ratio of 1.5 with an EPS<\/p><p>growth of 25%.<\/p><p>Statement 3: DBS has a convertible bond issuing that could be a potential candidate for<\/p><p>arbitrage. The bonds are convertible into 50 shares of DBS at any time, and currently, DBS&#x27;s<\/p><p>share price is $40, while the bond is priced at $1,900 with a face value of $2,000.<\/p><\/div><\/details><div class=\"qtext\"><p>For EMN strategies, maintaining a zero beta is crucial to neutralize market risk. If DBS&#x27;s beta is 1.3 and similar equities in the portfolio have an average beta of -1.3 with a combined equity value of $20 million, what is the value of the DBS position needed to attain market neutrality?<\/p><\/div>", "subj": "alternatives"}, {"n": 40, "q": "Based on Statement 3 and assuming no change in share price or interest rates, the arbitrage opportunity is closest to.", "opts": ["No arbitrage opportunity exists.", "$100 arbitrage profit per bond.", "$200 arbitrage profit per bond."], "ans": "B", "expl": "The arbitrage opportunity in this scenario is calculated by considering both the conversion value of the bond into shares and the bond's face value. The bond can be converted into 50 shares of DBS, with each share priced at $40. Therefore, the total value of the shares upon conversion is The bond itself is currently priced at $1900, which is $100 less than the face value of $2000. Thus, if an investor purchases the bond for $1900 and immediately converts it into shares, they can sell the shares for $2000, realizing a profit of $100 from the conversion. Additionally, since the bond is purchased for $100 less than its face value, if held to maturity, the investor would gain another $100. Therefore, the total arbitrage profit from both the conversion and the face value difference is A is incorrect. The statement that no arbitrage opportunity exists overlooks the financial mechanics of the bond's conversion feature and its pricing below face value. By converting the bond into shares valued at $2000 while purchasing the bond for $1900, an immediate profit is realized. Additionally, the discount at which the bond is purchased ($100 below face value) provides further financial gain if held to maturity, clearly establishing the presence of an arbitrage opportunity. C is incorrect. While it is correct that there is a profit to be made from the conversion of the bond to shares, this option underestimates the total arbitrage profit by not accounting for the additional profit from the bond's purchase price being below its face value. ", "explhtml": "<p>The arbitrage opportunity in this scenario is calculated by considering both the conversion value of the bond into shares and the bond&#x27;s face value. The bond can be converted into 50 shares of DBS, with each share priced at $40. Therefore, the total value of the shares upon conversion is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0064.webp\" style=\"max-width:min(100%,285px)\" alt=\"50 shares × $40 per share = $2000.\"><p>The bond itself is currently priced at $1900, which is $100 less than the face value of $2000. Thus, if an investor purchases the bond for $1900 and immediately converts it into shares, they can sell the shares for $2000, realizing a profit of $100 from the conversion. Additionally, since the bond is purchased for $100 less than its face value, if held to maturity, the investor would gain another $100. Therefore, the total arbitrage profit from both the conversion and the face value difference is<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0065.webp\" style=\"max-width:min(100%,205px)\" alt=\"$2, 000 −$1, 900 = $100.\"><p><b>A is incorrect<\/b>. The statement that no arbitrage opportunity exists overlooks the financial mechanics of the bond&#x27;s conversion feature and its pricing below face value. By converting the bond into shares valued at $2000 while purchasing the bond for $1900, an immediate profit is realized. Additionally, the discount at which the bond is purchased ($100 below face value) provides further financial gain if held to maturity, clearly establishing the presence of an arbitrage opportunity.<\/p><p><b>C is incorrect<\/b>. While it is correct that there is a profit to be made from the conversion of the bond to shares, this option underestimates the total arbitrage profit by not accounting for the additional profit from the bond&#x27;s purchase price being below its face value. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 10 · Câu 37–40 · Epione Pharmaceuticals and Demeter BioSciences<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>In a fast-paced and ever-evolving pharmaceutical market, hedge fund managers like Kit Stone<\/p><p>are tasked with identifying potential high-reward investments through complex strategies such<\/p><p>as short-biased and equity market-neutral (EMN) funds. Stone&#x27;s fund—Atlas Capital—specializes<\/p><p>in these sophisticated investment plays, scouring the financial landscape for opportunities to<\/p><p>capitalize on overvaluations and undervalued gems.<\/p><p>Epione Pharmaceuticals (EPI), a large-cap pharma company, has recently come under scrutiny of<\/p><p>Stone&#x27;s team due to irregularities in its financial reports and concerns over the efficacy of its<\/p><p>blockbuster drug, Panacea. The company&#x27;s stock price has been volatile, and some analysts<\/p><p>predict a downturn due to impending patent cliffs and competition from generics.<\/p><p>Simultaneously, demographics and innovation within the biotech sector have favorably<\/p><p>positioned Demeter BioSciences (DBS), a small-cap firm focused on precision medicine with a<\/p><p>promising drug pipeline. Its stock, however, remains undervalued as the market has not yet fully<\/p><p>recognized its growth potential.<\/p><p>Both EPI and DBS play crucial roles in the case study, as Stone examines the financial viability of<\/p><p>adding EPI to the short side of his portfolio while considering DBS for a potential long play. The<\/p><p>interplay between these companies&#x27; divergent paths offers a rich tableau for the application of<\/p><p>hedge fund strategies.<\/p><p>Stone&#x27;s analysts made the following statement based on his report:<\/p><p>Statement 1: EPI&#x27;s current P/E ratio is 35 and P/B ratio is 4, significantly higher than the<\/p><p>industry averages of 15 and 2, respectively. EPI&#x27;s trailing twelve-month EPS growth is 2%, well<\/p><p>below the industry average of 20%.<\/p><p>Statement 2: DBS, on the other hand, shows a P/E ratio of 10 and P/B ratio of 1.5 with an EPS<\/p><p>growth of 25%.<\/p><p>Statement 3: DBS has a convertible bond issuing that could be a potential candidate for<\/p><p>arbitrage. The bonds are convertible into 50 shares of DBS at any time, and currently, DBS&#x27;s<\/p><p>share price is $40, while the bond is priced at $1,900 with a face value of $2,000.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Statement 3 and assuming no change in share price or interest rates, the arbitrage opportunity is closest to.<\/p><\/div>", "subj": "alternatives"}, {"n": 41, "q": "Which strategy should Elara adopt for Proteus Tech Ventures to capitalize on the anticipated stock price changes?", "opts": ["Short ORT stock and go long on ANDI stock directly.", "Short sell ORT stock and purchase convertible bonds of ANDI.", "Use index options to hedge against sector-wide volatility and maintain current portfolio positions."], "ans": "A", "expl": "Elara Cross's strategy to short ORT stock and go long on ANDI stock directly is based on a detailed analysis of the current market conditions and the specific situations of the two companies involved. By shorting ORT, Elara aims to profit from the expected decline in its stock price, which is anticipated due to ongoing litigation issues that could negatively impact the company's financial performance and market perception. This strategy is proactive and leverages the negative news to generate returns. On the other hand, going long on ANDI stock allows Elara to capitalize on the company's strong growth prospects. Despite the potential dilution from a convertible debt offering, ANDI's recent breakthroughs in artificial intelligence present significant upside potential. This dual approach of shorting ORT and going long on ANDI is designed to maximize returns by exploiting the specific anticipated movements in each company's stock price, rather than a general market trend. B is incorrect. Opting to purchase convertible bonds of ANDI instead of going long on its stock directly involves a different risk-return profile. Convertible bonds, while offering the potential for conversion into equity, primarily serve as a fixed-income investment until conversion. This means that if ANDI's stock price appreciates significantly, the bondholder only benefits if they choose to convert the bonds into stock, which might not be an immediate action. Furthermore, the interest payments and the principal protection aspect of bonds make them less responsive to quick stock price increases compared to direct equity investments. Therefore, this strategy does not align well with capitalizing directly on ANDI's anticipated rapid stock price appreciation, as it introduces a delay and potential dilution in capturing equity gains. C is incorrect. Using index options to hedge against sector-wide volatility represents a defensive strategy aimed at reducing potential losses from unforeseen market movements across the tech sector. While this might protect the portfolio from downside risk, it does not actively exploit the specific opportunities presented by ORT and ANDI. Hedging, in this context, could limit the fund's ability to fully capitalize on the expected decline in ORT's stock price and the potential rapid growth in ANDI's stock. This strategy would be more appropriate in a scenario where the market's direction is highly uncertain or if the fund's primary goal was to preserve capital rather than achieve aggressive growth through strategic positions in selected stocks. ", "explhtml": "<p>Elara Cross&#x27;s strategy to short ORT stock and go long on ANDI stock directly is based on a detailed analysis of the current market conditions and the specific situations of the two companies involved. By shorting ORT, Elara aims to profit from the expected decline in its stock price, which is anticipated due to ongoing litigation issues that could negatively impact the company&#x27;s financial performance and market perception. This strategy is proactive and leverages the negative news to generate returns. On the other hand, going long on ANDI stock allows Elara to capitalize on the company&#x27;s strong growth prospects. Despite the potential dilution from a convertible debt offering, ANDI&#x27;s recent breakthroughs in artificial intelligence present significant upside potential. This dual approach of shorting ORT and going long on ANDI is designed to maximize returns by exploiting the specific anticipated movements in each company&#x27;s stock price, rather than a general market trend.<\/p><p><b>B is incorrect<\/b>. Opting to purchase convertible bonds of ANDI instead of going long on its stock directly involves a different risk-return profile. Convertible bonds, while offering the potential for conversion into equity, primarily serve as a fixed-income investment until conversion. This means that if ANDI&#x27;s stock price appreciates significantly, the bondholder only benefits if they choose to convert the bonds into stock, which might not be an immediate action. Furthermore, the interest payments and the principal protection aspect of bonds make them less responsive to quick stock price increases compared to direct equity investments. Therefore, this strategy does not align well with capitalizing directly on ANDI&#x27;s anticipated rapid stock price appreciation, as it introduces a delay and potential dilution in capturing equity gains.<\/p><p><b>C is incorrect<\/b>. Using index options to hedge against sector-wide volatility represents a defensive strategy aimed at reducing potential losses from unforeseen market movements across the tech sector. While this might protect the portfolio from downside risk, it does not actively exploit the specific opportunities presented by ORT and ANDI. Hedging, in this context, could limit the fund&#x27;s ability to fully capitalize on the expected decline in ORT&#x27;s stock price and the potential rapid growth in ANDI&#x27;s stock. This strategy would be more appropriate in a scenario where the market&#x27;s direction is highly uncertain or if the fund&#x27;s primary goal was to preserve capital rather than achieve aggressive growth through strategic positions in selected stocks. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Proteus Tech Ventures (PTV)<\/summary><div class=\"vig-body\"><p>Proteus Tech Ventures (PTV) is a mid-sized technology-focused hedge fund managed by Elara<\/p><p>Cross. The fund has gained a reputation for identifying and leveraging high-risk, high-reward<\/p><p>opportunities within the volatile tech sector. With a blend of quantitative and fundamental<\/p><p>analysis, Elara has set her sights on two companies that present unique investment<\/p><p>considerations:<\/p><p>Orion Technologies (ORT), a established tech giant struggling with a stagnating market<\/p><p>share and increasing regulatory scrutiny.<\/p><p>Andromeda Innovations (ANDI), a rising start-up specializing in artificial intelligence,<\/p><p>gaining momentum with recent product breakthroughs.<\/p><p>Elara believes a carefully designed investment approach pairing short positions in ORT with long<\/p><p>positions in ANDI could exploit market inefficiencies. This case study explores Elara&#x27;s evaluation<\/p><p>of these companies and tests her execution of complex financial strategies like short-selling,<\/p><p>leverage, and derivatives.<\/p><p>Elara Cross is assessing the prospects of Orion Technologies (ORT) and Andromeda Innovations<\/p><p>(ANDI). ORT is expected to experience a price drop due to litigation issues, while ANDI is facing<\/p><p>dilution from a convertible debt offering but has strong growth prospects.<\/p><\/div><\/details><div class=\"qtext\"><p>Which strategy should Elara adopt for Proteus Tech Ventures to capitalize on the anticipated stock price changes?<\/p><\/div>", "subj": "alternatives"}, {"n": 42, "q": "With ORT's beta of 1.2 and holding 50,000 shares, if Elara wants to hedge the short position using S&P 500 index futures (multiplier of $250 and index beta of 1), how many contracts should she short given the ORT stock price is $200 and the index is at 4,000?", "opts": ["60 contracts.", "30 contracts.", "12 contracts."], "ans": "C", "expl": "Elara Cross's strategy to hedge the short position in Orion Technologies (ORT) using S&P 500 index futures requires a precise calculation to determine the number of contracts needed. The calculation involves adjusting the total market exposure of the ORT position to the beta of ORT relative to the market, represented by the S&P 500 index. The formula to calculate the number of futures contracts to short is: Substituting the given values: This calculation shows that Elara should short 12 S&P 500 index futures contracts to effectively hedge the exposure of her short position in ORT, considering the relative volatility (beta) of ORT compared to the market. A is incorrect. It suggests shorting 60 contracts, which significantly exceeds the required hedge ratio calculated. Shorting 60 contracts would lead to over-hedging, potentially reducing the effectiveness of the hedge and possibly leading to unintended financial consequences. The correct number of contracts, as calculated, should align with the beta-adjusted market value of the ORT position, which is only 12 contracts. Over-hedging can distort the intended investment strategy and expose the portfolio to additional, unnecessary risks. B is incorrect. Option B, which suggests shorting 30 contracts, also does not align with the calculated requirement of 12 contracts. While 30 contracts is closer to the correct number than 60, it still represents an over-hedging scenario. Over-hedging can lead to increased costs and potential underperformance relative to the market. It is crucial that the number of contracts shorted closely matches the calculated figure to maintain the balance of the hedge and ensure that the investment strategy is executed as planned. ", "explhtml": "<p>Elara Cross&#x27;s strategy to hedge the short position in Orion Technologies (ORT) using S&amp;P 500 index futures requires a precise calculation to determine the number of contracts needed. The calculation involves adjusting the total market exposure of the ORT position to the beta of ORT relative to the market, represented by the S&amp;P 500 index. The formula to calculate the number of futures contracts to short is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0066.webp\" style=\"max-width:min(100%,681px)\" alt=\"Beta of ORT × Number of Shares of ORT × Price per Share of ORT Contracts to Short = Index Level × Multiplier of the Index Futures\"><p>Substituting the given values:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0067.webp\" style=\"max-width:min(100%,421px)\" alt=\"1.2 × 50, 000 × 200 Contracts to Short = = 12 contracts 4, 000 × 250\"><p>This calculation shows that Elara should short 12 S&amp;P 500 index futures contracts to effectively hedge the exposure of her short position in ORT, considering the relative volatility (beta) of ORT compared to the market.<\/p><p><b>A is incorrect<\/b>. It suggests shorting 60 contracts, which significantly exceeds the required hedge ratio calculated. Shorting 60 contracts would lead to over-hedging, potentially reducing the effectiveness of the hedge and possibly leading to unintended financial consequences. The correct number of contracts, as calculated, should align with the beta-adjusted market value of the ORT position, which is only 12 contracts. Over-hedging can distort the intended investment strategy and expose the portfolio to additional, unnecessary risks.<\/p><p><b>B is incorrect<\/b>. Option B, which suggests shorting 30 contracts, also does not align with the calculated requirement of 12 contracts. While 30 contracts is closer to the correct number than 60, it still represents an over-hedging scenario. Over-hedging can lead to increased costs and potential underperformance relative to the market. It is crucial that the number of contracts shorted closely matches the calculated figure to maintain the balance of the hedge and ensure that the investment strategy is executed as planned. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 41–44 · Proteus Tech Ventures (PTV)<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Proteus Tech Ventures (PTV) is a mid-sized technology-focused hedge fund managed by Elara<\/p><p>Cross. The fund has gained a reputation for identifying and leverag
