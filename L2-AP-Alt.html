th:min(100%,413px)\" alt=\"NAV ($5,676,890) NAVPS = = = $47.31 (Share Outstanding) 120,000\"><p><b>C is incorrect.<\/b><\/p><p>It does not subtract the other liabilities in the NAV calculation.<\/p><p>NAV = $7,713,750 + $62, 340 + $36, 310 + $22, 890 −$898, 200 = $6,937, 180<\/p><p>Finally, dividing the NAV by the number of shares outstanding yields the NAVPS:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0100.webp\" style=\"max-width:min(100%,389px)\" alt=\"NAV $6, 937, 180 NAVPS = = = $57.81 Share Outstanding 120,000\"><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Darlene Brown<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Brown, CFA, is the Senior Portfolio Manager at Douglas &amp; Page Investments. Brown is<\/p><p>looking to add real estate to the company’s portfolio, and she has narrowed it down to three<\/p><p>investments: Direct real estate investment, real estate investment trust (REIT), and a real estate<\/p><p>operating company (REOC). Brown aims to achieve the highest level of diversification possible<\/p><p>while selecting an investment free from restrictions. Moreover, he seeks an option supporting<\/p><p>various leverage structures to enhance returns.<\/p><p>Additionally, Brown wants to incorporate real estate into his personal investment portfolio.<\/p><p>However, his limited financial resources raise concerns about whether he can afford such an<\/p><p>investment.<\/p><p>Finally, Brown analyzes the distinctions between investing in a REIT and a REOC, focusing on<\/p><p>market valuations, equity capital access, and tax implications. He plans to present his findings to<\/p><p>John Clark, a colleague and Excel&#x27;s fixed-income advisor.<\/p><p>Brown opts to invest in a warehouse REIT. This REIT owns the warehouse properties but leases<\/p><p>them out entirely to taxable REIT subsidiaries. These subsidiaries manage the operations and<\/p><p>return the rental income to the parent REIT. Exhibit 1 outlines key data for evaluating the REIT<\/p><p>investment using the net asset value (NAV) method.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0095.webp\" style=\"max-width:min(100%,376px)\" alt=\"Exhibit 1: NAV Approach Shares outstanding 120,000 NOI (Next 12 Months) $925,650 Prepaid assets, including goodwill $22,890 Cash and cash equivalents $62,340 Deferred tax assets $36,780 Goodwill $56,000 Land held for future development $36,310 Intangible assets $12,640 Other liabilities $180,000 Tot\"><p>Clark asks Brown, “Why would a REIT trade at a discount to its NAV?” To which Brown responds<\/p><p>with the following reasons:<\/p><p>Reason 1: A lack of investor confidence<\/p><p>Reason 2: REIT-specific issues such as high occupancy rates or increased rental income.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on the data in Exhibit 1, the net asset value per share (NAVPS) of the warehouse REIT is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 68, "q": "With respect to the reasons provided for why the REIT is trading at a discount to its NAV, Brown is least accurate regarding:", "opts": ["Reason 1.", "Reason 2.", "Both Reason 1 and 2."], "ans": "B", "expl": "Reason 2 is inaccurate because high occupancy rates and increased rental income are typically positive factors for a REIT, not reasons for it to trade at a discount to its NAV. These factors generally indicate strong property performance and consistent cash flow, which should contribute to higher investor confidence and potentially lead to the REIT trading at a premium to its NAV. A is incorrect. Reason 2 is inaccurate because high occupancy rates and increased rental income are typically positive factors for a REIT, not reasons for it to trade at a discount to its NAV. These factors generally indicate strong property performance and consistent cash flow, which should contribute to higher investor confidence and potentially lead to the REIT trading at a premium to its NAV. C is incorrect. This is incorrect because while Reason 2 is flawed, Reason 1 is accurate. The correct explanation isolates Reason 2 as the primary issue, making \"both\" inappropriate.", "explhtml": "<p>Reason 2 is inaccurate because high occupancy rates and increased rental income are typically positive factors for a REIT, not reasons for it to trade at a discount to its NAV. These factors generally indicate strong property performance and consistent cash flow, which should contribute to higher investor confidence and potentially lead to the REIT trading at a premium to its NAV.<\/p><p><b>A is incorrect.<\/b> Reason 2 is inaccurate because high occupancy rates and increased rental income are typically positive factors for a REIT, not reasons for it to trade at a discount to its NAV. These factors generally indicate strong property performance and consistent cash flow, which should contribute to higher investor confidence and potentially lead to the REIT trading at a premium to its NAV.<\/p><p><b>C is incorrect.<\/b> This is incorrect because while Reason 2 is flawed, Reason 1 is accurate. The correct explanation isolates Reason 2 as the primary issue, making &quot;both&quot; inappropriate.<\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify the use of net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Darlene Brown<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Brown, CFA, is the Senior Portfolio Manager at Douglas &amp; Page Investments. Brown is<\/p><p>looking to add real estate to the company’s portfolio, and she has narrowed it down to three<\/p><p>investments: Direct real estate investment, real estate investment trust (REIT), and a real estate<\/p><p>operating company (REOC). Brown aims to achieve the highest level of diversification possible<\/p><p>while selecting an investment free from restrictions. Moreover, he seeks an option supporting<\/p><p>various leverage structures to enhance returns.<\/p><p>Additionally, Brown wants to incorporate real estate into his personal investment portfolio.<\/p><p>However, his limited financial resources raise concerns about whether he can afford such an<\/p><p>investment.<\/p><p>Finally, Brown analyzes the distinctions between investing in a REIT and a REOC, focusing on<\/p><p>market valuations, equity capital access, and tax implications. He plans to present his findings to<\/p><p>John Clark, a colleague and Excel&#x27;s fixed-income advisor.<\/p><p>Brown opts to invest in a warehouse REIT. This REIT owns the warehouse properties but leases<\/p><p>them out entirely to taxable REIT subsidiaries. These subsidiaries manage the operations and<\/p><p>return the rental income to the parent REIT. Exhibit 1 outlines key data for evaluating the REIT<\/p><p>investment using the net asset value (NAV) method.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0095.webp\" style=\"max-width:min(100%,376px)\" alt=\"Exhibit 1: NAV Approach Shares outstanding 120,000 NOI (Next 12 Months) $925,650 Prepaid assets, including goodwill $22,890 Cash and cash equivalents $62,340 Deferred tax assets $36,780 Goodwill $56,000 Land held for future development $36,310 Intangible assets $12,640 Other liabilities $180,000 Tot\"><p>Clark asks Brown, “Why would a REIT trade at a discount to its NAV?” To which Brown responds<\/p><p>with the following reasons:<\/p><p>Reason 1: A lack of investor confidence<\/p><p>Reason 2: REIT-specific issues such as high occupancy rates or increased rental income.<\/p><\/div><\/details><div class=\"qtext\"><p>With respect to the reasons provided for why the REIT is trading at a discount to its NAV, Brown is least accurate regarding:<\/p><\/div>", "subj": "alternatives"}, {"n": 69, "q": "The Symbian Fund is most likely to be characterized as:", "opts": ["An arbitrageur.", "An informed investor.", "A liquidity provider"], "ans": "A", "expl": "The Symbian Fund is characterized as an arbitrageur because it capitalizes on mispricing between futures and spot commodity prices. Arbitrageurs typically buy and sell commodities in different markets or forms to exploit price discrepancies for profit. The Symbian Fund's strategy, as described, involves trading based on the perceived misalignments in commodity prices, which is a hallmark of arbitrage activities. This approach does not necessarily include forecasting future price movements based on market fundamentals but instead seeks to benefit from existing price differences between related financial instruments. The fund's diversified asset allocation across various commodity sectors, including energy, grains, and precious metals, provides multiple opportunities to engage in such arbitrage strategies, further affirming its role as an arbitrageur. B is incorrect. An informed investor typically bases investment decisions on extensive research and analysis to predict future market movements and gain an advantage over other market participants. This category includes hedgers, who aim to reduce risk, and speculators, who take on risk hoping to profit from anticipated price movements. As described, the Symbian Fund's strategy does not primarily rely on forecasting or speculative insights into future price trends but rather on exploiting current price differences between commodities and their derivatives. Therefore, categorizing the fund as an informed investor does not align with its primary operational focus on arbitrage. C is incorrect. Liquidity providers are entities or individuals facilitating trading by providing market liquidity, making it easier for other participants to buy or sell without causing significant price changes. This role often involves acting as an intermediary or market maker who buys and sells from their inventory to maintain market order flow. The Symbian Fund, however, engages in trading that capitalizes on price discrepancies rather than providing liquidity to the market. Its activities are centered around arbitrage rather than supporting continuous trading by balancing other market participants' buying and selling interests.", "explhtml": "<p>The Symbian Fund is characterized as an arbitrageur because it capitalizes on mispricing between futures and spot commodity prices. Arbitrageurs typically buy and sell commodities in different markets or forms to exploit price discrepancies for profit. The Symbian Fund&#x27;s strategy, as described, involves trading based on the perceived misalignments in commodity prices, which is a hallmark of arbitrage activities. This approach does not necessarily include forecasting future price movements based on market fundamentals but instead seeks to benefit from existing price differences between related financial instruments. The fund&#x27;s diversified asset allocation across various commodity sectors, including energy, grains, and precious metals, provides multiple opportunities to engage in such arbitrage strategies, further affirming its role as an arbitrageur.<\/p><p><b>B is incorrect.<\/b> An informed investor typically bases investment decisions on extensive research and analysis to predict future market movements and gain an advantage over other market participants. This category includes hedgers, who aim to reduce risk, and speculators, who take on risk hoping to profit from anticipated price movements. As described, the Symbian Fund&#x27;s strategy does not primarily rely on forecasting or speculative insights into future price trends but rather on exploiting current price differences between commodities and their derivatives. Therefore, categorizing the fund as an informed investor does not align with its primary operational focus on arbitrage.<\/p><p><b>C is incorrect.<\/b> Liquidity providers are entities or individuals facilitating trading by providing market liquidity, making it easier for other participants to buy or sell without causing significant price changes. This role often involves acting as an intermediary or market maker who buys and sells from their inventory to maintain market order flow. The Symbian Fund, however, engages in trading that capitalizes on price discrepancies rather than providing liquidity to the market. Its activities are centered around arbitrage rather than supporting continuous trading by balancing other market participants&#x27; buying and selling interests.<\/p><p class=\"los\">CFA Level II, Learning Module 39: Introduction to Commodities and Commodities Derivatives, LOS 39 (d): Describe types of participants in commodity futures markets.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Samuel Heinrich<\/summary><div class=\"vig-body\"><p>Samuel Heinrich, a financial analyst at Luton Investment, a defined benefit plan, has closely<\/p><p>monitored the heightened volatility in the industrial and precious metal markets. After sharing<\/p><p>his observations with colleagues, his supervisor, Henry Preston, offers his thoughts:<\/p><p>Comment 1: &quot;The demand and supply of iron ore are primarily influenced by environmental<\/p><p>regulations, trade tariffs, and taxation policies that shape market dynamics.&quot;<\/p><p>Comment 2: &quot;If alternative materials—such as recycled steel or scrap metal—become more<\/p><p>widely used, demand for newly mined iron ore could rise.&quot;<\/p><p>Heinrich meets with Mary Fikile, a market strategist at NeoBank, seeking investment<\/p><p>opportunities for their pension plan. Fikile introduces the Symbian Commodity Fund (Symbian<\/p><p>Fund), which aims to generate trading profits by exploiting price discrepancies between futures<\/p><p>and spot commodities. The fund&#x27;s current asset allocation is outlined in the accompanying<\/p><p>exhibit.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0101.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 1: Symbian Fund’s Asset Allocation Commodity Sector Allocation (%) Energy 27 Precious metals 43 Softs 17 Grain 13\"><p>Fikile highlights the Symbian Fund&#x27;s diversification benefits, emphasizing its low correlation<\/p><p>with bonds and stocks. This leads Heinrich to inquire, &quot;What factors influence commodity<\/p><p>valuations but have no impact on bond and stock pricing?&quot; In response, Fikile presents futures<\/p><p>contract data for three markets in which the Symbian Fund invests.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0102.webp\" style=\"max-width:min(100%,451px)\" alt=\"Exhibit 2: Selected Commodity Futures Information  Month Wheat Price  Crude Oil Price  Titanium  ($/Pound) ($/barrel) ($/t.oz) March 670.25 64.76 5, 580 June 687.35 62.87 5, 350 September 693.10 65.11 4, 850\"><\/div><\/details><div class=\"qtext\"><p>The Symbian Fund is most likely to be characterized as:<\/p><\/div>", "subj": "alternatives"}, {"n": 70, "q": "A factor that would most likely affect the demand or supply of the four sectors of the Symbian fund is:", "opts": ["Government action.", "Weather.", "Storage costs."], "ans": "A", "expl": "Government action is a significant factor that can influence all sectors of the Symbian Fund, including precious metals, grain, softs, and energy. Government policies, such as tariffs, subsidies, and regulations, can directly affect these commodities' production costs, market access, and overall supply and demand dynamics. For instance, a new regulation on mining could increase operational costs for precious metals, while subsidies for biofuels could increase demand for certain grains. Additionally, energy sector policies related to environmental regulations or geopolitical tensions can drastically alter oil and gas prices. Thus, government action has a broad and impactful reach across various commodity markets, making it a critical consideration in commodity fund management. B is incorrect. Weather is a crucial factor that predominantly impacts commodities directly dependent on agricultural outputs or natural conditions, such as grain and softs. For example, unexpected weather changes can lead to crop failures or bumper crops, directly affecting prices and availability in these sectors. However, the influence of weather on precious metals and energy is relatively indirect and less significant compared to direct government interventions or market-wide economic factors. Therefore, while weather is essential, its impact is not as uniformly influential across all sectors of the Symbian Fund as government action. C is incorrect. Storage costs primarily affect commodities that require significant physical storage facilities, such as grains and softs, where the cost of keeping goods in warehouses can influence market prices and trading strategies. In contrast, commodities like precious metals, which typically have higher value density, incur relatively lower storage costs as a proportion of their total value. Energy commodities, particularly oil and gas, are also affected by storage costs, but these costs are just one of many factors influencing their prices, including geopolitical issues and extraction costs. Thus, storage costs, while relevant, do not have a uniformly significant impact across all sectors of the Symbian Fund compared to government actions.", "explhtml": "<p>Government action is a significant factor that can influence all sectors of the Symbian Fund, including precious metals, grain, softs, and energy. Government policies, such as tariffs, subsidies, and regulations, can directly affect these commodities&#x27; production costs, market access, and overall supply and demand dynamics. For instance, a new regulation on mining could increase operational costs for precious metals, while subsidies for biofuels could increase demand for certain grains. Additionally, energy sector policies related to environmental regulations or geopolitical tensions can drastically alter oil and gas prices. Thus, government action has a broad and impactful reach across various commodity markets, making it a critical consideration in commodity fund management.<\/p><p><b>B is incorrect.<\/b> Weather is a crucial factor that predominantly impacts commodities directly dependent on agricultural outputs or natural conditions, such as grain and softs. For example, unexpected weather changes can lead to crop failures or bumper crops, directly affecting prices and availability in these sectors. However, the influence of weather on precious metals and energy is relatively indirect and less significant compared to direct government interventions or market-wide economic factors. Therefore, while weather is essential, its impact is not as uniformly influential across all sectors of the Symbian Fund as government action.<\/p><p><b>C is incorrect.<\/b> Storage costs primarily affect commodities that require significant physical storage facilities, such as grains and softs, where the cost of keeping goods in warehouses can influence market prices and trading strategies. In contrast, commodities like precious metals, which typically have higher value density, incur relatively lower storage costs as a proportion of their total value. Energy commodities, particularly oil and gas, are also affected by storage costs, but these costs are just one of many factors influencing their prices, including geopolitical issues and extraction costs. Thus, storage costs, while relevant, do not have a uniformly significant impact across all sectors of the Symbian Fund compared to government actions.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (a) Compare characteristics of commodity sectors.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Samuel Heinrich<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Heinrich, a financial analyst at Luton Investment, a defined benefit plan, has closely<\/p><p>monitored the heightened volatility in the industrial and precious metal markets. After sharing<\/p><p>his observations with colleagues, his supervisor, Henry Preston, offers his thoughts:<\/p><p>Comment 1: &quot;The demand and supply of iron ore are primarily influenced by environmental<\/p><p>regulations, trade tariffs, and taxation policies that shape market dynamics.&quot;<\/p><p>Comment 2: &quot;If alternative materials—such as recycled steel or scrap metal—become more<\/p><p>widely used, demand for newly mined iron ore could rise.&quot;<\/p><p>Heinrich meets with Mary Fikile, a market strategist at NeoBank, seeking investment<\/p><p>opportunities for their pension plan. Fikile introduces the Symbian Commodity Fund (Symbian<\/p><p>Fund), which aims to generate trading profits by exploiting price discrepancies between futures<\/p><p>and spot commodities. The fund&#x27;s current asset allocation is outlined in the accompanying<\/p><p>exhibit.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0101.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 1: Symbian Fund’s Asset Allocation Commodity Sector Allocation (%) Energy 27 Precious metals 43 Softs 17 Grain 13\"><p>Fikile highlights the Symbian Fund&#x27;s diversification benefits, emphasizing its low correlation<\/p><p>with bonds and stocks. This leads Heinrich to inquire, &quot;What factors influence commodity<\/p><p>valuations but have no impact on bond and stock pricing?&quot; In response, Fikile presents futures<\/p><p>contract data for three markets in which the Symbian Fund invests.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0102.webp\" style=\"max-width:min(100%,451px)\" alt=\"Exhibit 2: Selected Commodity Futures Information  Month Wheat Price  Crude Oil Price  Titanium  ($/Pound) ($/barrel) ($/t.oz) March 670.25 64.76 5, 580 June 687.35 62.87 5, 350 September 693.10 65.11 4, 850\"><\/div><\/details><div class=\"qtext\"><p>A factor that would most likely affect the demand or supply of the four sectors of the Symbian fund is:<\/p><\/div>", "subj": "alternatives"}, {"n": 71, "q": "Which of the following comments made by Henry Preston is most likely correct:", "opts": ["Neither Comment 1 nor Comment 2.", "Comment 1.", "Comments 2."], "ans": "B", "expl": "Regulations on environmental impact, governments worldwide impose ecological policies that affect iron ore production and usage. Stricter environmental laws may limit mining activities, which could affect supply and potentially lead to increased prices. Import/export tariffs. Trade tariffs can heavily influence demand and supply. For example, higher tariffs on iron ore imports could discourage purchases from certain countries, while lower tariffs could boost international trade. Taxation policies. Government-imposed taxes on mining companies affect production costs and profitability, influencing supply levels and overall market behavior. A is incorrect. This option suggests neither comment is correct, implying that both statements are inaccurate. However, Comment 1 is valid, so this option can be eliminated. C is incorrect. Comment 2 claims that if alternative materials (such as recycled steel or scrap metal) gain traction, demand for newly mined iron ore may increase. This is incorrect because Recycled steel and scrap metal serve as substitutes for freshly mined iron ore. When recycling increases, industries rely less on new iron ore, leading to a decrease in demand for newly mined iron ore, not an increase. The presence of alternative materials generally reduces reliance on raw iron ore, rather than encouraging more mining.", "explhtml": "<p>Regulations on environmental impact, governments worldwide impose ecological policies that affect iron ore production and usage. Stricter environmental laws may limit mining activities, which could affect supply and potentially lead to increased prices.<\/p><p>Import/export tariffs. Trade tariffs can heavily influence demand and supply. For example, higher tariffs on iron ore imports could discourage purchases from certain countries, while lower tariffs could boost international trade.<\/p><p>Taxation policies. Government-imposed taxes on mining companies affect production costs and profitability, influencing supply levels and overall market behavior.<\/p><p><b>A is incorrect.<\/b> This option suggests neither comment is correct, implying that both statements are inaccurate. However, Comment 1 is valid, so this option can be eliminated.<\/p><p><b>C is incorrect.<\/b><\/p><p>Comment 2 claims that if alternative materials (such as recycled steel or scrap metal) gain traction, demand for newly mined iron ore may increase. This is incorrect because Recycled steel and scrap metal serve as substitutes for freshly mined iron ore. When recycling increases, industries rely less on new iron ore, leading to a decrease in demand for newly mined iron ore, not an increase. The presence of alternative materials generally reduces reliance on raw iron ore, rather than encouraging more mining.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (a) compare characteristics of commodity sectors.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Samuel Heinrich<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Heinrich, a financial analyst at Luton Investment, a defined benefit plan, has closely<\/p><p>monitored the heightened volatility in the industrial and precious metal markets. After sharing<\/p><p>his observations with colleagues, his supervisor, Henry Preston, offers his thoughts:<\/p><p>Comment 1: &quot;The demand and supply of iron ore are primarily influenced by environmental<\/p><p>regulations, trade tariffs, and taxation policies that shape market dynamics.&quot;<\/p><p>Comment 2: &quot;If alternative materials—such as recycled steel or scrap metal—become more<\/p><p>widely used, demand for newly mined iron ore could rise.&quot;<\/p><p>Heinrich meets with Mary Fikile, a market strategist at NeoBank, seeking investment<\/p><p>opportunities for their pension plan. Fikile introduces the Symbian Commodity Fund (Symbian<\/p><p>Fund), which aims to generate trading profits by exploiting price discrepancies between futures<\/p><p>and spot commodities. The fund&#x27;s current asset allocation is outlined in the accompanying<\/p><p>exhibit.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0101.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 1: Symbian Fund’s Asset Allocation Commodity Sector Allocation (%) Energy 27 Precious metals 43 Softs 17 Grain 13\"><p>Fikile highlights the Symbian Fund&#x27;s diversification benefits, emphasizing its low correlation<\/p><p>with bonds and stocks. This leads Heinrich to inquire, &quot;What factors influence commodity<\/p><p>valuations but have no impact on bond and stock pricing?&quot; In response, Fikile presents futures<\/p><p>contract data for three markets in which the Symbian Fund invests.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0102.webp\" style=\"max-width:min(100%,451px)\" alt=\"Exhibit 2: Selected Commodity Futures Information  Month Wheat Price  Crude Oil Price  Titanium  ($/Pound) ($/barrel) ($/t.oz) March 670.25 64.76 5, 580 June 687.35 62.87 5, 350 September 693.10 65.11 4, 850\"><\/div><\/details><div class=\"qtext\"><p>Which of the following comments made by Henry Preston is most likely correct:<\/p><\/div>", "subj": "alternatives"}, {"n": 72, "q": "Based on Exhibit 2, which futures market is most likely in backwardation?", "opts": ["Wheat", "Crude Oil", "Titanium"], "ans": "C", "expl": "Backwardation occurs in a futures market when future prices are lower than current prices, meaning that the commodity is priced higher in the spot market than in the futures market. This typically signals strong demand for immediate delivery or potential supply shortages. From Exhibit 2, Titanium shows: June price: $5,350 (lower than March) September price: $4,850 (lower than June and March) A is incorrect. Since wheat futures prices increase over time, the market is in contango, where future prices are higher than current prices. B is incorrect. Crude oil futures do not exhibit a consistent downward trend. Since the price first decreases (from March to June) but then increases (from June to September), this is not a clear backwardation scenario.", "explhtml": "<p>Backwardation occurs in a futures market when future prices are lower than current prices, meaning that the commodity is priced higher in the spot market than in the futures market. This typically signals strong demand for immediate delivery or potential supply shortages.<\/p><p>From Exhibit 2, Titanium shows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0103.webp\" style=\"max-width:min(100%,203px)\" alt=\"March price: $5,580\"><p>June price: $5,350 (lower than March)<\/p><p>September price: $4,850 (lower than June and March)<\/p><p><b>A is incorrect.<\/b> Since wheat futures prices increase over time, the market is in contango, where future prices are higher than current prices.<\/p><p><b>B is incorrect.<\/b> Crude oil futures do not exhibit a consistent downward trend. Since the price first decreases (from March to June) but then increases (from June to September), this is not a clear backwardation scenario.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (e) Analyze the relationship between spot prices and futures prices in contango markets and backwardation markets.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 18 · Câu 69–72 · Samuel Heinrich<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Samuel Heinrich, a financial analyst at Luton Investment, a defined benefit plan, has closely<\/p><p>monitored the heightened volatility in the industrial and precious metal markets. After sharing<\/p><p>his observations with colleagues, his supervisor, Henry Preston, offers his thoughts:<\/p><p>Comment 1: &quot;The demand and supply of iron ore are primarily influenced by environmental<\/p><p>regulations, trade tariffs, and taxation policies that shape market dynamics.&quot;<\/p><p>Comment 2: &quot;If alternative materials—such as recycled steel or scrap metal—become more<\/p><p>widely used, demand for newly mined iron ore could rise.&quot;<\/p><p>Heinrich meets with Mary Fikile, a market strategist at NeoBank, seeking investment<\/p><p>opportunities for their pension plan. Fikile introduces the Symbian Commodity Fund (Symbian<\/p><p>Fund), which aims to generate trading profits by exploiting price discrepancies between futures<\/p><p>and spot commodities. The fund&#x27;s current asset allocation is outlined in the accompanying<\/p><p>exhibit.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0101.webp\" style=\"max-width:min(100%,341px)\" alt=\"Exhibit 1: Symbian Fund’s Asset Allocation Commodity Sector Allocation (%) Energy 27 Precious metals 43 Softs 17 Grain 13\"><p>Fikile highlights the Symbian Fund&#x27;s diversification benefits, emphasizing its low correlation<\/p><p>with bonds and stocks. This leads Heinrich to inquire, &quot;What factors influence commodity<\/p><p>valuations but have no impact on bond and stock pricing?&quot; In response, Fikile presents futures<\/p><p>contract data for three markets in which the Symbian Fund invests.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0102.webp\" style=\"max-width:min(100%,451px)\" alt=\"Exhibit 2: Selected Commodity Futures Information  Month Wheat Price  Crude Oil Price  Titanium  ($/Pound) ($/barrel) ($/t.oz) March 670.25 64.76 5, 580 June 687.35 62.87 5, 350 September 693.10 65.11 4, 850\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, which futures market is most likely in backwardation?<\/p><\/div>", "subj": "alternatives"}, {"n": 73, "q": "Which of Fring’s conclusions regarding commodity markets is least accurate?", "opts": ["Conclusion 1.", "Conclusion 2.", "Conclusion 3."], "ans": "C", "expl": "Technological advances such as horizontal drilling, hydraulic fracturing, subsea production systems, and climate‐controlled extraction platforms have reduced oil output’s sensitivity to weather extremes. Modern upstream operations are engineered to maintain consistent production regardless of heat, cold, or precipitation, making this conclusion the least accurate of the three. A and B are incorrect. Both conclusions 1 and 2 are correct. Both livestock and energy markets have become increasingly globalized.", "explhtml": "<p>Technological advances such as horizontal drilling, hydraulic fracturing, subsea production systems, and climate‐controlled extraction platforms have reduced oil output’s sensitivity to weather extremes. Modern upstream operations are engineered to maintain consistent production regardless of heat, cold, or precipitation, making this conclusion the least accurate of the three.<\/p><p><b>A and B are incorrect.<\/b> Both conclusions 1 and 2 are correct. Both livestock and energy markets have become increasingly globalized.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (a) Compare characteristics of commodity sectors.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Xavier Fring<\/summary><div class=\"vig-body\"><p>Xavier Fring, a fund manager at Amber Capital—a U.S. private equity firm that owns natural gas<\/p><p>facilities and several farms—is responsible for mitigating the company’s exposure to commodity<\/p><p>price swings. Under Amber’s policy, speculation is prohibited, and managers must lock in futures<\/p><p>prices to safeguard sales revenue. Fring consults with Jennifer Motley, the firm&#x27;s junior analyst,<\/p><p>to assess the factors influencing the farm’s two key commodities, grain and livestock. Oil<\/p><p>production generates 50% of Amber’s revenue, while livestock accounts for 35% of its costs.<\/p><p>From their review, Fring and Motley arrive at the following conclusions.<\/p><p>Conclusion 1: Just as the livestock sector has become more global, driven by rising consumer<\/p><p>wealth in emerging economies and a wave of cross-border M&amp;A, the oil industry is also<\/p><p>experiencing unprecedented international integration.<\/p><p>Conclusion 2: By holding crude oil and frozen meat stocks, Amber can stabilize its 50% oil-<\/p><p>derived revenue and the 35% of costs tied to livestock production against short-term price<\/p><p>spikes.<\/p><p>Conclusion 3: Advances in drilling technology and climate-controlled extraction platforms have<\/p><p>made oil output far more sensitive to fluctuations in heat and precipitation.<\/p><p>Fring makes the following observations:<\/p><p>1. Downstream consumers of crude oil and natural gas, such as refiners and power utilities,<\/p><p>are more inclined to hedge price risk in the forward market than upstream producers.<\/p><p>2. The per-barrel storage costs for crude oil are modest compared to the barrels’<\/p><p>convenience yield; similarly, refrigerated storage for processed beef is lower than the convenience yield derived from holding live cattle inventories.<\/p><p>Motley then gathers futures and spot price data on crude oil, natural gas, and cattle contracts,<\/p><p>which are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0104.webp\" style=\"max-width:min(100%,492px)\" alt=\"Exhibit 1: Crude Oil, Beef, and Natural Gas Price Data. Market Crude Oil Price Beef Price Natural Gas Price (USD/barrel) (USD/pound) (USD/bushel) Futures 67.68 86.10 3.2 Spot 65.66 86.17 3.7\"><p>Fring reports monthly to the company’s executive committee on the performance of the energy<\/p><p>futures position. The report includes details of the collateral, roll, and price returns. A committee<\/p><p>member, Sarah Wesley, is concerned about the number of positions with negative roll returns. In<\/p><p>a memo to Fring, Wesley wants to know how negative roll returns occur.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Fring’s conclusions regarding commodity markets is least accurate?<\/p><\/div>", "subj": "alternatives"}, {"n": 74, "q": "Based on data from Exhibit 1, which commodity is in a state of Contango:", "opts": ["Crude oil.", "Beef.", "Natural gas."], "ans": "A", "expl": "A market is in contango when the futures price is higher than the spot price. This typically reflects expectations of rising prices or the inclusion of storage and carrying costs in the futures price. Since $67.68 > $65.66 B and C are incorrect. Both natural oil and beef are in backwardation.", "explhtml": "<p>A market is in contango when the futures price is higher than the spot price. This typically reflects expectations of rising prices or the inclusion of storage and carrying costs in the futures price. Since $67.68 &gt; $65.66<\/p><p><b>B and C are incorrect.<\/b> Both natural oil and beef are in backwardation.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (e) Analyze the relationship between spot prices and futures prices in markets in contango and markets in backwardation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Xavier Fring<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xavier Fring, a fund manager at Amber Capital—a U.S. private equity firm that owns natural gas<\/p><p>facilities and several farms—is responsible for mitigating the company’s exposure to commodity<\/p><p>price swings. Under Amber’s policy, speculation is prohibited, and managers must lock in futures<\/p><p>prices to safeguard sales revenue. Fring consults with Jennifer Motley, the firm&#x27;s junior analyst,<\/p><p>to assess the factors influencing the farm’s two key commodities, grain and livestock. Oil<\/p><p>production generates 50% of Amber’s revenue, while livestock accounts for 35% of its costs.<\/p><p>From their review, Fring and Motley arrive at the following conclusions.<\/p><p>Conclusion 1: Just as the livestock sector has become more global, driven by rising consumer<\/p><p>wealth in emerging economies and a wave of cross-border M&amp;A, the oil industry is also<\/p><p>experiencing unprecedented international integration.<\/p><p>Conclusion 2: By holding crude oil and frozen meat stocks, Amber can stabilize its 50% oil-<\/p><p>derived revenue and the 35% of costs tied to livestock production against short-term price<\/p><p>spikes.<\/p><p>Conclusion 3: Advances in drilling technology and climate-controlled extraction platforms have<\/p><p>made oil output far more sensitive to fluctuations in heat and precipitation.<\/p><p>Fring makes the following observations:<\/p><p>1. Downstream consumers of crude oil and natural gas, such as refiners and power utilities,<\/p><p>are more inclined to hedge price risk in the forward market than upstream producers.<\/p><p>2. The per-barrel storage costs for crude oil are modest compared to the barrels’<\/p><p>convenience yield; similarly, refrigerated storage for processed beef is lower than the convenience yield derived from holding live cattle inventories.<\/p><p>Motley then gathers futures and spot price data on crude oil, natural gas, and cattle contracts,<\/p><p>which are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0104.webp\" style=\"max-width:min(100%,492px)\" alt=\"Exhibit 1: Crude Oil, Beef, and Natural Gas Price Data. Market Crude Oil Price Beef Price Natural Gas Price (USD/barrel) (USD/pound) (USD/bushel) Futures 67.68 86.10 3.2 Spot 65.66 86.17 3.7\"><p>Fring reports monthly to the company’s executive committee on the performance of the energy<\/p><p>futures position. The report includes details of the collateral, roll, and price returns. A committee<\/p><p>member, Sarah Wesley, is concerned about the number of positions with negative roll returns. In<\/p><p>a memo to Fring, Wesley wants to know how negative roll returns occur.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on data from Exhibit 1, which commodity is in a state of Contango:<\/p><\/div>", "subj": "alternatives"}, {"n": 75, "q": "Based on Fring’s observations and data from Exhibit 1, the futures prices of crude oil are most consistent with the:", "opts": ["Hedging pressure theory.", "Insurance theory.", "Theory of storage."], "ans": "A", "expl": "The spot price of crude oil is lower than the futures price, which is consistent with the hedging pressure theory. Producers and consumers seek protection from commodity price volatility through hedge pressure. They enter price hedges to stabilize their cash flow and projected profits. B is incorrect. In this theory, producers use commodity futures markets as insurance by locking prices and ensuring a predictable revenue stream. C is incorrect. The theory of storage suggests that when direct future costs are lower than convenience costs, the spot price will be higher than the futures price.", "explhtml": "<p>The spot price of crude oil is lower than the futures price, which is consistent with the hedging pressure theory. Producers and consumers seek protection from commodity price volatility through hedge pressure. They enter price hedges to stabilize their cash flow and projected profits.<\/p><p><b>B is incorrect.<\/b> In this theory, producers use commodity futures markets as insurance by locking prices and ensuring a predictable revenue stream.<\/p><p><b>C is incorrect.<\/b> The theory of storage suggests that when direct future costs are lower than convenience costs, the spot price will be higher than the futures price.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives, LOS 1 (f) Compare theories of commodity futures returns.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Xavier Fring<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xavier Fring, a fund manager at Amber Capital—a U.S. private equity firm that owns natural gas<\/p><p>facilities and several farms—is responsible for mitigating the company’s exposure to commodity<\/p><p>price swings. Under Amber’s policy, speculation is prohibited, and managers must lock in futures<\/p><p>prices to safeguard sales revenue. Fring consults with Jennifer Motley, the firm&#x27;s junior analyst,<\/p><p>to assess the factors influencing the farm’s two key commodities, grain and livestock. Oil<\/p><p>production generates 50% of Amber’s revenue, while livestock accounts for 35% of its costs.<\/p><p>From their review, Fring and Motley arrive at the following conclusions.<\/p><p>Conclusion 1: Just as the livestock sector has become more global, driven by rising consumer<\/p><p>wealth in emerging economies and a wave of cross-border M&amp;A, the oil industry is also<\/p><p>experiencing unprecedented international integration.<\/p><p>Conclusion 2: By holding crude oil and frozen meat stocks, Amber can stabilize its 50% oil-<\/p><p>derived revenue and the 35% of costs tied to livestock production against short-term price<\/p><p>spikes.<\/p><p>Conclusion 3: Advances in drilling technology and climate-controlled extraction platforms have<\/p><p>made oil output far more sensitive to fluctuations in heat and precipitation.<\/p><p>Fring makes the following observations:<\/p><p>1. Downstream consumers of crude oil and natural gas, such as refiners and power utilities,<\/p><p>are more inclined to hedge price risk in the forward market than upstream producers.<\/p><p>2. The per-barrel storage costs for crude oil are modest compared to the barrels’<\/p><p>convenience yield; similarly, refrigerated storage for processed beef is lower than the convenience yield derived from holding live cattle inventories.<\/p><p>Motley then gathers futures and spot price data on crude oil, natural gas, and cattle contracts,<\/p><p>which are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0104.webp\" style=\"max-width:min(100%,492px)\" alt=\"Exhibit 1: Crude Oil, Beef, and Natural Gas Price Data. Market Crude Oil Price Beef Price Natural Gas Price (USD/barrel) (USD/pound) (USD/bushel) Futures 67.68 86.10 3.2 Spot 65.66 86.17 3.7\"><p>Fring reports monthly to the company’s executive committee on the performance of the energy<\/p><p>futures position. The report includes details of the collateral, roll, and price returns. A committee<\/p><p>member, Sarah Wesley, is concerned about the number of positions with negative roll returns. In<\/p><p>a memo to Fring, Wesley wants to know how negative roll returns occur.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Fring’s observations and data from Exhibit 1, the futures prices of crude oil are most consistent with the:<\/p><\/div>", "subj": "alternatives"}, {"n": 76, "q": "Fring’s most appropriate response to Sarah Wesley’s question is:", "opts": ["They occur when markets are in contango.", "Negative roll returns occur when producers withhold the supply of commodities.", "They occur when markets are in backwardation."], "ans": "A", "expl": "A negative roll return results from a market being in contango, which is the opposite of backwardation. A market in contango occurs when an asset's future price is higher than its expected future spot price, so the investor loses money when rolling contracts. B is incorrect. Producers withholding supply will yield a positive roll return for energy commodities (except for natural gas). C is incorrect. The roll return is usually positive, not negative, in markets in backwardation.", "explhtml": "<p>A negative roll return results from a market being in contango, which is the opposite of backwardation. A market in contango occurs when an asset&#x27;s future price is higher than its expected future spot price, so the investor loses money when rolling contracts.<\/p><p><b>B is incorrect.<\/b> Producers withholding supply will yield a positive roll return for energy commodities (except for natural gas).<\/p><p><b>C is incorrect.<\/b> The roll return is usually positive, not negative, in markets in backwardation.<\/p><p class=\"los\">Alternative Investments, Learning Module 1: Introduction to Commodities and Commodities Derivatives LOS 1 (h) Contrast roll return in markets in contango and markets in backwardation.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 73–76 · Xavier Fring<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Xavier Fring, a fund manager at Amber Capital—a U.S. private equity firm that owns natural gas<\/p><p>facilities and several farms—is responsible for mitigating the company’s exposure to commodity<\/p><p>price swings. Under Amber’s policy, speculation is prohibited, and managers must lock in futures<\/p><p>prices to safeguard sales revenue. Fring consults with Jennifer Motley, the firm&#x27;s junior analyst,<\/p><p>to assess the factors influencing the farm’s two key commodities, grain and livestock. Oil<\/p><p>production generates 50% of Amber’s revenue, while livestock accounts for 35% of its costs.<\/p><p>From their review, Fring and Motley arrive at the following conclusions.<\/p><p>Conclusion 1: Just as the livestock sector has become more global, driven by rising consumer<\/p><p>wealth in emerging economies and a wave of cross-border M&amp;A, the oil industry is also<\/p><p>experiencing unprecedented international integration.<\/p><p>Conclusion 2: By holding crude oil and frozen meat stocks, Amber can stabilize its 50% oil-<\/p><p>derived revenue and the 35% of costs tied to livestock production against short-term price<\/p><p>spikes.<\/p><p>Conclusion 3: Advances in drilling technology and climate-controlled extraction platforms have<\/p><p>made oil output far more sensitive to fluctuations in heat and precipitation.<\/p><p>Fring makes the following observations:<\/p><p>1. Downstream consumers of crude oil and natural gas, such as refiners and power utilities,<\/p><p>are more inclined to hedge price risk in the forward market than upstream producers.<\/p><p>2. The per-barrel storage costs for crude oil are modest compared to the barrels’<\/p><p>convenience yield; similarly, refrigerated storage for processed beef is lower than the convenience yield derived from holding live cattle inventories.<\/p><p>Motley then gathers futures and spot price data on crude oil, natural gas, and cattle contracts,<\/p><p>which are presented in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0104.webp\" style=\"max-width:min(100%,492px)\" alt=\"Exhibit 1: Crude Oil, Beef, and Natural Gas Price Data. Market Crude Oil Price Beef Price Natural Gas Price (USD/barrel) (USD/pound) (USD/bushel) Futures 67.68 86.10 3.2 Spot 65.66 86.17 3.7\"><p>Fring reports monthly to the company’s executive committee on the performance of the energy<\/p><p>futures position. The report includes details of the collateral, roll, and price returns. A committee<\/p><p>member, Sarah Wesley, is concerned about the number of positions with negative roll returns. In<\/p><p>a memo to Fring, Wesley wants to know how negative roll returns occur.<\/p><\/div><\/details><div class=\"qtext\"><p>Fring’s most appropriate response to Sarah Wesley’s question is:<\/p><\/div>", "subj": "alternatives"}, {"n": 77, "q": "Which manager’s strategy is most exposed to left-tail risk, and what is the theoretical annualized return before fees if that manager earns a 5% spread per deal, uses 2× leverage, and completes two deal cycles per year?", "opts": ["Manager A; 5%", "Manager B; 20%", "Manager D; 13%"], "ans": "B", "expl": "Merger Arbitrage strategies inherently involve left-tail risk, which occurs when a deal fails, leading to sharp reversals in expected spreads. Failed deals often result in significant losses, as prices can dramatically fall to levels below initial expectations. Manager B, specializing in Merger Arbitrage, is directly exposed to this risk due to the unpredictable nature of mergers and acquisitions, including regulatory rejections or stakeholder disagreements. A is incorrect. Manager A’s strategy primarily involves taking long and short equities positions. While this approach may involve risks like market volatility, it is not specifically characterized by left-tail risk. Left-tail risk refers to the significant downside exposure during rare and severe market events. Long/Short Equity strategies are not as sensitive to such extreme risks as Merger Arbitrage, which is directly impacted by failed deal outcomes. Additionally, the 5% return stated in this option does not align with the merger arbitrage calculation formula, which considers deal spreads, leverage, and deal cycles per year. C is incorrect. Manager D invests in distressed or post-bankruptcy securities, which inherently involve credit and recovery risks. While these securities can carry significant risk, they are not predominantly exposed to left-tail risk like Merger Arbitrage. Distressed securities’ risk is more related to credit conditions and issuer-specific factors, rather than rare market events causing drastic losses in a short timeframe. The return of 13% in this option does not match the merger arbitrage return formula, which clearly yields 20% for Manager B based on the provided data.", "explhtml": "<p>Merger Arbitrage strategies inherently involve <b>left-tail risk<\/b>, which occurs when a deal fails, leading to sharp reversals in expected spreads. Failed deals often result in significant losses, as prices can dramatically fall to levels below initial expectations. Manager B, specializing in Merger Arbitrage, is directly exposed to this risk due to the unpredictable nature of mergers and acquisitions, including regulatory rejections or stakeholder disagreements.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0106.webp\" style=\"max-width:min(100%,447px)\" alt=\"Annualized return = Spread × Leverage × Deals per Year Annualized return = 5% × 2 × 2 = 0.2 = 20%\"><p><b>A is incorrect.<\/b> Manager A’s strategy primarily involves taking long and short equities positions. While this approach may involve risks like market volatility, it is not specifically characterized by left-tail risk. Left-tail risk refers to the significant downside exposure during rare and severe market events. Long/Short Equity strategies are not as sensitive to such extreme risks as Merger Arbitrage, which is directly impacted by failed deal outcomes.<\/p><p>Additionally, the 5% return stated in this option does not align with the merger arbitrage calculation formula, which considers deal spreads, leverage, and deal cycles per year.<\/p><p><b>C is incorrect.<\/b> Manager D invests in distressed or post-bankruptcy securities, which inherently involve credit and recovery risks. While these securities can carry significant risk, they are not predominantly exposed to left-tail risk like Merger Arbitrage. Distressed securities’ risk is more related to credit conditions and issuer-specific factors, rather than rare market events causing drastic losses in a short timeframe.<\/p><p>The return of 13% in this option does not match the merger arbitrage return formula, which clearly yields 20% for Manager B based on the provided data.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · James Norwitz<\/summary><div class=\"vig-body\"><p>James Norwitz, CFA, is a senior portfolio manager at Brendan Associates, an investment advisory<\/p><p>firm managing high-net-worth and institutional client portfolios. James has recently been<\/p><p>assigned the task of evaluating and recommending hedge fund strategies to incorporate into the<\/p><p>firm’s flagship diversified fund. Brendan Associates is exploring hedge fund allocations to<\/p><p>enhance risk-adjusted returns and improve diversification.<\/p><p>James has shortlisted four hedge fund managers, each specializing in a different strategy:<\/p><p><b>Manager A:<\/b> Long/Short Equity with 60% gross long and 30% gross short positions.<\/p><p><b>Manager B:<\/b> Merger Arbitrage with average leverage of 4x and expected annual deal<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0105.webp\" style=\"max-width:min(100%,125px)\" alt=\"spreads of 5%.\"><p><b>Manager C:<\/b> Equity Market Neutral using a pairs trading approach, targeting an<\/p><p>annualized alpha of 3% and using 250% leverage.<\/p><p><b>Manager D:<\/b> Distressed Securities, focusing on post-bankruptcy credit with a recovery<\/p><p>estimate of 65% versus market pricing at 48%.<\/p><p>James must evaluate which managers offer true alpha after fees, the potential diversification<\/p><p>benefits, and risks during market downturns.<\/p><\/div><\/details><div class=\"qtext\"><p>Which manager’s strategy is most exposed to left-tail risk, and what is the theoretical annualized return before fees if that manager earns a 5% spread per deal, uses 2× leverage, and completes two deal cycles per year?<\/p><\/div>", "subj": "alternatives"}, {"n": 78, "q": "James is reviewing Manager C’s equity market-neutral portfolio. Suppose the long position is $5M, the short position is $5M, and the annual gross alpha from security selection is 3% with portfolio leverage 2.5x. What is the expected yearly portfolio return before fees?", "opts": ["3.0%", "7.5%", "2.5%"], "ans": "B", "expl": "Equity market-neutral strategies rely on amplifying small alpha returns by employing leverage. In this case, Manager C achieves an unlevered annual alpha of 3% through security selection. Using 2.5× leverage, the portfolio return is calculated as: A is incorrect. It assumes no leverage applied to the gross alpha. While the unlevered alpha from security selection is indeed 3%, the portfolio return calculation explicitly includes the leverage factor. Therefore, the portfolio return is amplified to 7.5%, not 3.0%. C is incorrect. It mistakenly uses an incorrect calculation method, possibly dividing rather than multiplying alpha by leverage, or misinterpreting the gross alpha as 2.5% instead of the stated 3%. The expected annual return, based on the given leverage of 2.5×, is 7.5%, making this choice invalid.", "explhtml": "<p>Equity market-neutral strategies rely on amplifying small alpha returns by employing leverage. In this case, Manager C achieves an unlevered annual alpha of 3% through security selection. Using 2.5× leverage, the portfolio return is calculated as:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0107.webp\" style=\"max-width:min(100%,446px)\" alt=\"Portfolio Return = Alpha × Leverage = 0.03 × 2.5 = 7.5%\"><p><b>A is incorrect.<\/b> It assumes no leverage applied to the gross alpha. While the unlevered alpha from security selection is indeed 3%, the portfolio return calculation explicitly includes the leverage factor. Therefore, the portfolio return is amplified to 7.5%, not 3.0%.<\/p><p><b>C is incorrect.<\/b> It mistakenly uses an incorrect calculation method, possibly dividing rather than multiplying alpha by leverage, or misinterpreting the gross alpha as 2.5% instead of the stated 3%. The expected annual return, based on the given leverage of 2.5×, is 7.5%, making this choice invalid.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · James Norwitz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Norwitz, CFA, is a senior portfolio manager at Brendan Associates, an investment advisory<\/p><p>firm managing high-net-worth and institutional client portfolios. James has recently been<\/p><p>assigned the task of evaluating and recommending hedge fund strategies to incorporate into the<\/p><p>firm’s flagship diversified fund. Brendan Associates is exploring hedge fund allocations to<\/p><p>enhance risk-adjusted returns and improve diversification.<\/p><p>James has shortlisted four hedge fund managers, each specializing in a different strategy:<\/p><p><b>Manager A:<\/b> Long/Short Equity with 60% gross long and 30% gross short positions.<\/p><p><b>Manager B:<\/b> Merger Arbitrage with average leverage of 4x and expected annual deal<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0105.webp\" style=\"max-width:min(100%,125px)\" alt=\"spreads of 5%.\"><p><b>Manager C:<\/b> Equity Market Neutral using a pairs trading approach, targeting an<\/p><p>annualized alpha of 3% and using 250% leverage.<\/p><p><b>Manager D:<\/b> Distressed Securities, focusing on post-bankruptcy credit with a recovery<\/p><p>estimate of 65% versus market pricing at 48%.<\/p><p>James must evaluate which managers offer true alpha after fees, the potential diversification<\/p><p>benefits, and risks during market downturns.<\/p><\/div><\/details><div class=\"qtext\"><p>James is reviewing Manager C’s equity market-neutral portfolio. Suppose the long position is $5M, the short position is $5M, and the annual gross alpha from security selection is 3% with portfolio leverage 2.5x. What is the expected yearly portfolio return before fees?<\/p><\/div>", "subj": "alternatives"}, {"n": 79, "q": "Manager D is considering buying bonds from a distressed issuer trading at 48% of par. If the expected recovery value is 65% in 2 years, what is the expected annualized return (IRR approximation)?", "opts": ["16.37%", "10.92%", "8.02%"], "ans": "A", "expl": "To calculate the annualized return (IRR approximation) for Manager D’s distressed bond investment, the formula is: B is incorrect. This answer results from incorrect application of the IRR formula or an error in the calculation process. Using the proper formula and values clearly yields 16.37%, not 10.92%. This choice underestimates the return and fails to account for the compounding effect over the 2-year period. C is incorrect. This option significantly underestimates the return, possibly due to neglecting the full ratio of FV to PV or misinterpreting the time period component. The correct calculation demonstrates that the return is much higher, at 16.37%. Choosing 8.02% ignores the growth implied by the recovery value relative to the purchase price.", "explhtml": "<p>To calculate the annualized return (IRR approximation) for Manager D’s distressed bond investment, the formula is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0108.webp\" style=\"max-width:min(100%,460px)\" alt=\"FV 1/n 65 1/2 Return = = ( ) = 1.1637 −1 = 0.1637 = 16.37% PV 48\"><p><b>B is incorrect.<\/b> This answer results from incorrect application of the IRR formula or an error in the calculation process. Using the proper formula and values clearly yields 16.37%, not 10.92%. This choice underestimates the return and fails to account for the compounding effect over the 2-year period.<\/p><p><b>C is incorrect.<\/b> This option significantly underestimates the return, possibly due to neglecting the full ratio of FV to PV or misinterpreting the time period component. The correct calculation demonstrates that the return is much higher, at 16.37%. Choosing 8.02% ignores the growth implied by the recovery value relative to the purchase price.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · James Norwitz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Norwitz, CFA, is a senior portfolio manager at Brendan Associates, an investment advisory<\/p><p>firm managing high-net-worth and institutional client portfolios. James has recently been<\/p><p>assigned the task of evaluating and recommending hedge fund strategies to incorporate into the<\/p><p>firm’s flagship diversified fund. Brendan Associates is exploring hedge fund allocations to<\/p><p>enhance risk-adjusted returns and improve diversification.<\/p><p>James has shortlisted four hedge fund managers, each specializing in a different strategy:<\/p><p><b>Manager A:<\/b> Long/Short Equity with 60% gross long and 30% gross short positions.<\/p><p><b>Manager B:<\/b> Merger Arbitrage with average leverage of 4x and expected annual deal<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0105.webp\" style=\"max-width:min(100%,125px)\" alt=\"spreads of 5%.\"><p><b>Manager C:<\/b> Equity Market Neutral using a pairs trading approach, targeting an<\/p><p>annualized alpha of 3% and using 250% leverage.<\/p><p><b>Manager D:<\/b> Distressed Securities, focusing on post-bankruptcy credit with a recovery<\/p><p>estimate of 65% versus market pricing at 48%.<\/p><p>James must evaluate which managers offer true alpha after fees, the potential diversification<\/p><p>benefits, and risks during market downturns.<\/p><\/div><\/details><div class=\"qtext\"><p>Manager D is considering buying bonds from a distressed issuer trading at 48% of par. If the expected recovery value is 65% in 2 years, what is the expected annualized return (IRR approximation)?<\/p><\/div>", "subj": "alternatives"}, {"n": 80, "q": "Manager A holds a gross long exposure of 60% and a short exposure of 30%. Assuming returns of +8% on the long side and -6% on the short side, what is the net return of the strategy?", "opts": ["6.6%", "5.4%", "3.0%"], "ans": "A", "expl": "To calculate the net return of Manager A’s strategy, we combine the contributions from the long and short positions based on their respective exposures and returns. The formula is: Net Return = (0.60 × 0.08) + (0.30 × 0.06) = 0.048 + 0.018 = 0.066 = 6.6% B is incorrect. This answer underestimates the net return, possibly due to incorrect calculations or omission of the short position’s contribution. The formula clearly includes both the long and short positions, and the actual net return is 6.6%, not 5.4%. C is incorrect. This option significantly underestimates the net return, likely assuming only a partial contribution from the long side or disregarding the weighted impact of both exposures. A net return of 3.0% is inconsistent with the calculated contributions from both the long and short positions.", "explhtml": "<p>To calculate the net return of Manager A’s strategy, we combine the contributions from the long and short positions based on their respective exposures and returns. The formula is:<\/p><p>Net Return = (0.60 × 0.08) + (0.30 × 0.06) = 0.048 + 0.018 = 0.066 = 6.6%<\/p><p><b>B is incorrect.<\/b> This answer underestimates the net return, possibly due to incorrect calculations or omission of the short position’s contribution. The formula clearly includes both the long and short positions, and the actual net return is 6.6%, not 5.4%.<\/p><p><b>C is incorrect.<\/b> This option significantly underestimates the net return, likely assuming only a partial contribution from the long side or disregarding the weighted impact of both exposures. A net return of 3.0% is inconsistent with the calculated contributions from both the long and short positions.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 77–80 · James Norwitz<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Norwitz, CFA, is a senior portfolio manager at Brendan Associates, an investment advisory<\/p><p>firm managing high-net-worth and institutional client portfolios. James has recently been<\/p><p>assigned the task of evaluating and recommending hedge fund strategies to incorporate into the<\/p><p>firm’s flagship diversified fund. Brendan Associates is exploring hedge fund allocations to<\/p><p>enhance risk-adjusted returns and improve diversification.<\/p><p>James has shortlisted four hedge fund managers, each specializing in a different strategy:<\/p><p><b>Manager A:<\/b> Long/Short Equity with 60% gross long and 30% gross short positions.<\/p><p><b>Manager B:<\/b> Merger Arbitrage with average leverage of 4x and expected annual deal<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0105.webp\" style=\"max-width:min(100%,125px)\" alt=\"spreads of 5%.\"><p><b>Manager C:<\/b> Equity Market Neutral using a pairs trading approach, targeting an<\/p><p>annualized alpha of 3% and using 250% leverage.<\/p><p><b>Manager D:<\/b> Distressed Securities, focusing on post-bankruptcy credit with a recovery<\/p><p>estimate of 65% versus market pricing at 48%.<\/p><p>James must evaluate which managers offer true alpha after fees, the potential diversification<\/p><p>benefits, and risks during market downturns.<\/p><\/div><\/details><div class=\"qtext\"><p>Manager A holds a gross long exposure of 60% and a short exposure of 30%. Assuming returns of +8% on the long side and -6% on the short side, what is the net return of the strategy?<\/p><\/div>", "subj": "alternatives"}, {"n": 81, "q": "Which of the statements regarding hedge fund strategies is incorrect?", "opts": ["Statement 1.", "Statement 2.", "Statement 3."], "ans": "B", "expl": "While specific corporate actions primarily drive event-driven returns, they still exhibit some sensitivity to overall equity market movements (market beta), especially if a deal is large or delayed by market-wide volatility. This describes a market-neutral or equity long/short strategy, particularly equity market-neutral. These strategies aim to neutralize market beta by balancing long and short positions, profiting from relative mispricings rather than overall market direction. So this statement is accurate. A is incorrect. Equity market-neutral managers seek to eliminate broad market risk by taking equal (or beta-adjusted) long and short positions in pairs or groups of stocks within the same sector or region. Their performance hinges on capturing relative value discrepancies i.e., identifying when one stock is undervalued versus another—rather than on the overall market’s direction. By structuring the portfolio so that its aggregate beta to market indices is effectively zero, any gains or losses are driven by the convergence or divergence in valuation between the paired positions, confirming the use of a relative-value methodology. C is incorrect. Opportunistic (often called global macro) strategies involve taking directional positions across asset classes—equity indexes, interest rates, currencies, and commodities based on the manager’s forecasts of economic and policy shifts. Because these positions purposely bet on where markets or asset prices are headed (e.g., “long U.S. Treasuries” if rates will fall, or “short emerging-market equities” if growth slows), they are inherently exposed to market directionality risk. A misjudgment about the macro environment or policy reaction can lead to losses, underscoring that these strategies are not market-neutral but depend on correct directional calls.", "explhtml": "<p>While specific corporate actions primarily drive event-driven returns, they still exhibit some sensitivity to overall equity market movements (market beta), especially if a deal is large or delayed by market-wide volatility. This describes a market-neutral or equity long/short strategy, particularly equity market-neutral. These strategies aim to neutralize market beta by balancing long and short positions, profiting from relative mispricings rather than overall market direction. So this statement is accurate.<\/p><p><b>A is incorrect.<\/b> Equity market-neutral managers seek to eliminate broad market risk by taking equal (or beta-adjusted) long and short positions in pairs or groups of stocks within the same sector or region. Their performance hinges on capturing relative value discrepancies i.e., identifying when one stock is undervalued versus another—rather than on the overall market’s direction. By structuring the portfolio so that its aggregate beta to market indices is effectively zero, any gains or losses are driven by the convergence or divergence in valuation between the paired positions, confirming the use of a relative-value methodology.<\/p><p><b>C is incorrect.<\/b> Opportunistic (often called global macro) strategies involve taking directional positions across asset classes—equity indexes, interest rates, currencies, and commodities based on the manager’s forecasts of economic and policy shifts. Because these positions purposely bet on where markets or asset prices are headed (e.g., “long U.S. Treasuries” if rates will fall, or “short emerging-market equities” if growth slows), they are inherently exposed to market directionality risk. A misjudgment about the macro environment or policy reaction can lead to losses, underscoring that these strategies are not market-neutral but depend on correct directional calls.<\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darius Feng<\/summary><div class=\"vig-body\"><p>Darius Feng is the Fund manager for the Metaxas University Endowment Fund (Metaxas Fund)<\/p><p>based in Greece. The fund manager recently added hedge funds to diversify Metaxas Fund’s<\/p><p>portfolio. Feng meets Susan Abruzzi, an analyst at the firm, to discuss the different hedge fund<\/p><p>strategies they could use for the Metaxas Fund. Abruzzi made the following statements:<\/p><p>Statement 1: Managers construct offsetting long and short positions in related equities based on<\/p><p>valuation discrepancies, aiming to eliminate net market exposure and profit from relative price<\/p><p>movements.<\/p><p>Statement 2: These strategies are entirely insulated from equity market beta risk since returns<\/p><p>are driven solely by the outcomes of corporate events (mergers, restructurings, distressed<\/p><p>turnarounds) and are not sensitive to broader market movements.<\/p><p>Statement 3: Managers take directional views across asset classes—equities, rates, currencies,<\/p><p>and commodities—based on macroeconomic forecasts, making these strategies inherently<\/p><p>exposed to market directionality risk.<\/p><p>Feng requests that Abruzzi research an event-driven strategy involving a potential management<\/p><p>buyout (MBO) of Technica, Inc., backed by Zeus Company as a financial sponsor. Aqua will fund<\/p><p>the MBO as part of the transaction by offering Taurus shareholders the equivalent of one Zeus<\/p><p>share for every three shares of Technica they own. Before the announcement, Zeus traded at €25<\/p><p>per share, declining to €20 as investors absorbed the funding implications.Technica’s shares rose<\/p><p>from €25 to €30 as the market priced in the premium from the MBO deal. Anticipating the deal’s<\/p><p>successful closure, Feng initiates an arbitrage trade: she purchases 12,560 shares of Technica at<\/p><p>€30 and shorts 6,500 shares of Zeus at €25.<\/p><p>Feng also mentions an equity strategy involving two companies, Zora and Mythos. Zora is a<\/p><p>pharmaceutical company based in Europe. It has recently come under heavy scrutiny due to one<\/p><p>of its products having adverse side effects. Multiple lawsuits have been filed, and from last year&#x27;s<\/p><p>audit report, it is clear that they will have to settle for € 18 million, which is 10% of their<\/p><p>revenue. On the other hand, Mythos is a chip manufacturer based in Greece that has high<\/p><p>growth potential after its flagship product has dominated the European chip market. Based on the previous valuation conducted by Abruzzi, Mythos is currently trading at a discount compared<\/p><p>to Zora. Feng decides to take a long position in Mythos and a short position in Zora with equal<\/p><p>beta-weighted exposure.<\/p><p>Finally, Feng and Abruzzi consider a hedge fund that specializes in private equity. Feng tells<\/p><p>Abruzzi about three characteristics that hedge fund managers look for when investing in private<\/p><p>equity:<\/p><p>Characteristic 1: The target company consistently pays high dividends, providing immediate cash<\/p><p>returns throughout the holding period.<\/p><p>Characteristic 2: The company’s management team has a significant equity stake and a proven<\/p><p>track record of driving value creation through operational improvements and EBITDA growth.<\/p><p>Characteristic 3: The firm seeks out companies whose shares already trade at a premium<\/p><p>multiple relative to their peers, assuming that strong market valuation guarantees superior<\/p><p>returns.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the statements regarding hedge fund strategies is incorrect?<\/p><\/div>", "subj": "alternatives"}, {"n": 82, "q": "Assume that the MBO is successful, the arbitrage profit from the trade Feng initiated is closest to?", "opts": ["€ 260,567", "-€ 78,760", "€ 214,500"], "ans": "A", "expl": "We begin by first calculating the initial cash flows (at trade initiation): Long Technica: Buy 12,560 shares @ € 30. Short Zeus: Sell 6,500 shares @ € 25. Then we calculate the cash flows at deal completion (successful MBO): The long position of 12,560 Technica shares converts into Zeus shares at a 3:1 ratio. These 4,186.67 Zeus shares are used to cover (close) a portion of the 6,500-share short position. The remaining short position must be covered by buying Zeus shares in the market. The post- 6, 500 −4, 186.67 = 2,313.33 shares. = (-€ 214,300) + (-€ 46,266.67) = -€ 260,566.67= € 260,567$$ B is incorrect. It does not account for all inflows and outflows from both the long and short positions through the life of the trade. C is incorrect. It incorrectly deducts the short position from the long position.", "explhtml": "<p>We begin by first calculating the initial cash flows (at trade initiation):<\/p><p>Long Technica: Buy 12,560 shares @ € 30.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0109.webp\" style=\"max-width:min(100%,331px)\" alt=\"Cash Outflow = 12, 560 × €30 = €376, 800\"><p>Short Zeus: Sell 6,500 shares @ € 25.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0110.webp\" style=\"max-width:min(100%,465px)\" alt=\"Cash Inflow = 6, 500 × €25 = €162, 500 Net Initial Cash Flow = €162, 500 −€376, 800 = −€214, 300\"><p>Then we calculate the cash flows at deal completion (successful MBO):<\/p><p>The long position of 12,560 Technica shares converts into Zeus shares at a 3:1 ratio.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0111.webp\" style=\"max-width:min(100%,391px)\" alt=\"12, 560 Zeus shares received = = 4, 186.67 shares 3\"><p>These 4,186.67 Zeus shares are used to cover (close) a portion of the 6,500-share short position. The remaining short position must be covered by buying Zeus shares in the market. The post-<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0112.webp\" style=\"max-width:min(100%,751px)\" alt=\"announcement/prevailing  price  is  €20.  Remaining  short  shares: \"><p>6, 500 −4, 186.67 = 2,313.33 shares.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0113.webp\" style=\"max-width:min(100%,436px)\" alt=\"Cash Outflow to Cover = 2,313.33 × €20 = €46,266.67 Total Net Cash Flow = (Initial Net) + (Closing Outflow)\"><p>= (-€ 214,300) + (-€ 46,266.67) = -€ 260,566.67= € 260,567$$<\/p><p><b>B is incorrect.<\/b> It does not account for all inflows and outflows from both the long and short positions through the life of the trade.<\/p><p><b>C is incorrect.<\/b> It incorrectly deducts the short position from the long position.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0114.webp\" style=\"max-width:min(100%,269px)\" alt=\"€376, 800 −€162, 500 = €214, 500\"><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 81–84 · Darius Feng
