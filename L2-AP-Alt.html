\" loading=\"lazy\" src=\"l2img/ap08/f0076.webp\" style=\"max-width:min(100%,193px)\" alt=\"Ri = Rf + β(Rm −Rf) + α\"><p>Where R<sub>i<\/sub> is the expected return of the investment, R<sub>f<\/sub> is the risk-free rate, R<sub>m<\/sub> is the expected market return, and α is the alpha, or the excess return over the market. For QuantumEvent, the excess return over the risk-free rate is given as 7%, and the risk-free rate itself is 2%. Therefore, the total expected return R<sub>i<\/sub> is 7% + 2% = 9%.<\/p><p>Substituting the values into the CAPM formula and solving for β, we get:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0077.webp\" style=\"max-width:min(100%,310px)\" alt=\"Ri −Rf 9% −2% 7% β = = = = 0.875 Rm −Rf 10% −2% 8%\"><p><b>B is the correct answer<\/b> because it accurately calculates the required beta using the CAPM formula with the given values, resulting in a beta of 0.875, which is necessary to achieve the targeted excess return of 7% over the risk-free rate.<\/p><p><b>A is incorrect<\/b>. It suggests a beta of 0.83, which does not align with the correct calculation using the CAPM formula. If we substitute 0.83 into the formula, the resulting expected return would be R<sub>i<\/sub> = 2% + 0.83 × (10% − 2%) = 8.64%, which is less than the required 9\\% (7% excess return plus the 2% risk-free rate). This discrepancy indicates that a beta of 0.83 would not be sufficient to meet the fund&#x27;s return objectives, hence making this option incorrect.<\/p><p><b>C is incorrect<\/b>. It proposes a beta of 0.42. Using this value in the CAPM formula yields an expected return of R<sub>i<\/sub> = 2% + 0.42 × (10% − 2%) = 5.36%, which is significantly lower than the required 9\\%. This underestimation of the required beta results in a substantial shortfall in achieving the desired excess return. Therefore, a beta of 0.42 is not adequate for meeting the fund&#x27;s performance targets, rendering this option incorrect. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Quantum Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quantum Capital, an investment firm known for its data-driven and quantitative approach, is considering diversifying its investment strategies by incorporating several hedge funds into its portfolio offerings. The firm&#x27;s lead analyst, Dr. Ian Malcolm, has been assigned the task of evaluating a variety of hedge fund strategies with an emphasis on quantitative analysis to determine potential investment prospects.<\/p><p>Among the hedge fund strategies being considered are global macro funds, market-neutral<\/p><p>funds, event-driven funds, and emerging markets funds. Dr. Malcolm plans to assess these<\/p><p>strategies through a series of performance metrics such as expected returns, risk profiles,<\/p><p>portfolio weights, and diversification benefits.<\/p><p>Additionally, the evaluation will include scenario analysis for different market conditions,<\/p><p>leveraging historical data and advanced statistical models. Quantum Capital understands that<\/p><p>successful investment in hedge funds requires both rigorous mathematical analysis and a deep<\/p><p>understanding of the market dynamics that drive these alternative investments.<\/p><p>Quantum Capital is interested in assessing the diversification benefits of adding a new hedge<\/p><p>fund to its portfolio. The current portfolio has an expected return of 10% and a standard<\/p><p>deviation of 12%. The new hedge fund has an expected return of 15%, a standard deviation of<\/p><p>18%, and a correlation with the current portfolio of 0.5.<\/p><\/div><\/details><div class=\"qtext\"><p>Suppose event-driven fund QuantumEvent targets an excess return of 7% over the risk-free rate of 2% with a standard deviation of 12%. Using the capital asset pricing model, what is the fund&#x27;s required beta if the expected market return is 10%?<\/p><\/div>", "subj": "alternatives"}, {"n": 55, "q": "The Quantum Emerging fund has investments in four different emerging markets with following expected returns and portfolio weights: Market 1: 15% return with 40% weight, Market 2: 8% return with 20% weight, Market 3: 12% return with 25% weight, Market 4: 10% return with 15% weight. Calculate the portfolio's expected return.", "opts": ["11.90%", "12.20%", "12.10%"], "ans": "C", "expl": "The correct calculation of the portfolio's expected return involves using the weighted average formula, where each market's expected return is multiplied by its respective weight in the portfolio. The formula for the expected return of the portfolio is given by: Expected Return = (WeightMarket1 × ReturnMarket1) + (WeightMarket2 × ReturnMarket2) + (WeightMark Substituting the given values: Expected Return = (0.40 × 15%) + (0.20 × 8%) + (0.25 × 12%) + (0.15 × 10%) Expected Return = (0.40 × 0.15) + (0.20 × 0.08) + (0.25 × 0.12) + (0.15 × 0.10) Thus, option C, which states that the expected return is 12.1%, is correct as it accurately reflects the calculation based on the provided weights and returns of the individual markets. A is incorrect. It suggests an expected return of 11.9%, which does not align with the correct weighted-average return calculation. The error in this option likely stems from incorrect weighting or miscalculation of individual market returns. It is essential to apply the correct weights and accurately multiply these by the respective returns to achieve the precise overall expected return. B is incorrect. It indicates an expected return of 12.2%, which is also a result of incorrect calculations. This discrepancy could be due to rounding errors or incorrect application of the weights to the respective market returns. Ensuring precise calculations and adherence to the weighted-average formula is crucial to avoid such inaccuracies. ", "explhtml": "<p>The correct calculation of the portfolio&#x27;s expected return involves using the weighted average formula, where each market&#x27;s expected return is multiplied by its respective weight in the portfolio. The formula for the expected return of the portfolio is given by:<\/p><p>Expected Return = (Weight<sub>Market1<\/sub> × Return<sub>Market1<\/sub>) + (Weight<sub>Market2<\/sub> × Return<sub>Market2<\/sub>) + (Weight<sub>Mark<\/sub><\/p><p>Substituting the given values:<\/p><p>Expected Return = (0.40 × 15%) + (0.20 × 8%) + (0.25 × 12%) + (0.15 × 10%)<\/p><p>Expected Return = (0.40 × 0.15) + (0.20 × 0.08) + (0.25 × 0.12) + (0.15 × 0.10)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0078.webp\" style=\"max-width:min(100%,509px)\" alt=\"Expected Return = 0.06 + 0.016 + 0.03 + 0.015 = 0.121 or 12.1%\"><p>Thus, option C, which states that the expected return is 12.1%, is correct as it accurately reflects the calculation based on the provided weights and returns of the individual markets.<\/p><p><b>A is incorrect<\/b>. It suggests an expected return of 11.9%, which does not align with the correct weighted-average return calculation. The error in this option likely stems from incorrect weighting or miscalculation of individual market returns. It is essential to apply the correct weights and accurately multiply these by the respective returns to achieve the precise overall expected return.<\/p><p><b>B is incorrect<\/b>. It indicates an expected return of 12.2%, which is also a result of incorrect calculations. This discrepancy could be due to rounding errors or incorrect application of the weights to the respective market returns. Ensuring precise calculations and adherence to the weighted-average formula is crucial to avoid such inaccuracies. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (e) Discuss investment characteristics, strategy implementation, and role in a portfolio of opportunistic hedge fund strategies<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Quantum Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quantum Capital, an investment firm known for its data-driven and quantitative approach, is considering diversifying its investment strategies by incorporating several hedge funds into its portfolio offerings. The firm&#x27;s lead analyst, Dr. Ian Malcolm, has been assigned the task of evaluating a variety of hedge fund strategies with an emphasis on quantitative analysis to determine potential investment prospects.<\/p><p>Among the hedge fund strategies being considered are global macro funds, market-neutral<\/p><p>funds, event-driven funds, and emerging markets funds. Dr. Malcolm plans to assess these<\/p><p>strategies through a series of performance metrics such as expected returns, risk profiles,<\/p><p>portfolio weights, and diversification benefits.<\/p><p>Additionally, the evaluation will include scenario analysis for different market conditions,<\/p><p>leveraging historical data and advanced statistical models. Quantum Capital understands that<\/p><p>successful investment in hedge funds requires both rigorous mathematical analysis and a deep<\/p><p>understanding of the market dynamics that drive these alternative investments.<\/p><p>Quantum Capital is interested in assessing the diversification benefits of adding a new hedge<\/p><p>fund to its portfolio. The current portfolio has an expected return of 10% and a standard<\/p><p>deviation of 12%. The new hedge fund has an expected return of 15%, a standard deviation of<\/p><p>18%, and a correlation with the current portfolio of 0.5.<\/p><\/div><\/details><div class=\"qtext\"><p>The Quantum Emerging fund has investments in four different emerging markets with following expected returns and portfolio weights: Market 1: 15% return with 40% weight, Market 2: 8% return with 20% weight, Market 3: 12% return with 25% weight, Market 4: 10% return with 15% weight. Calculate the portfolio&#x27;s expected return.<\/p><\/div>", "subj": "alternatives"}, {"n": 56, "q": "Dr. Malcolm is using Monte Carlo simulation to forecast the potential outcomes of an algorithmic trading fund over a 1-year period. The fund has a monthly standard deviation of 2% and aims for an annualized return of 14%. What is the range of expected returns between the 5th and 95th percentile according to a normal distribution?", "opts": ["-4% to 32%", "2% to 26%", "8% to 20%"], "ans": "B", "expl": "To determine the range of expected returns between the 5th and 95th percentile for the algorithmic trading fund, we first need to annualize the monthly standard deviation. The formula for annualizing a monthly standard deviation is: Next, we apply the z-scores for the 5th and 95th percentiles to the annualized return. The z-scores for these percentiles are approximately -1.645 and 1.645 respectively. Using these z-scores, we calculate the returns at these percentiles: Thus, the range of expected returns between the 5th and 95th percentile is approximately from 2% to 26%, which aligns with option B. A is incorrect. The range of -4% to 32% is excessively broad and does not align with the calculated values based on the given standard deviation and expected return. This option suggests a higher level of volatility and a lower minimum return than what the fund's parameters indicate. The calculation using the z-scores and the annualized standard deviation does not support such a wide range, indicating a misunderstanding of the fund's volatility or a miscalculation in applying the z-scores. C is incorrect. The range of 8% to 20% is too narrow and does not capture the true extent of potential variability in the fund's returns. This option underestimates the impact of the fund's volatility by not extending the range wide enough to include the 5th and 95th percentiles as calculated with the z-scores. It fails to account for the full effect of the standard deviation on the distribution of returns, leading to an overly conservative estimate of the range. ", "explhtml": "<p>To determine the range of expected returns between the 5th and 95th percentile for the algorithmic trading fund, we first need to annualize the monthly standard deviation. The formula for annualizing a monthly standard deviation is:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0079.webp\" style=\"max-width:min(100%,360px)\" alt=\"Annualized Std Dev = Monthly Std Dev × √12 Annualized Std Dev = 2% × √12 ≈6.93%\"><p>Next, we apply the z-scores for the 5th and 95th percentiles to the annualized return. The z-scores for these percentiles are approximately -1.645 and 1.645 respectively. Using these z-scores, we calculate the returns at these percentiles:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0080.webp\" style=\"max-width:min(100%,322px)\" alt=\"R5% = 14% + (−1.645 × 6.93%) ≈2.61% R95% = 14% + (1.645× 6.93%) ≈25.39%\"><p>Thus, the range of expected returns between the 5th and 95th percentile is approximately from 2% to 26%, which aligns with option B.<\/p><p><b>A is incorrect<\/b>. The range of -4% to 32% is excessively broad and does not align with the calculated values based on the given standard deviation and expected return. This option suggests a higher level of volatility and a lower minimum return than what the fund&#x27;s parameters indicate. The calculation using the z-scores and the annualized standard deviation does not support such a wide range, indicating a misunderstanding of the fund&#x27;s volatility or a miscalculation in applying the z-scores.<\/p><p><b>C is incorrect<\/b>. The range of 8% to 20% is too narrow and does not capture the true extent of potential variability in the fund&#x27;s returns. This option underestimates the impact of the fund&#x27;s volatility by not extending the range wide enough to include the 5th and 95th percentiles as calculated with the z-scores. It fails to account for the full effect of the standard deviation on the distribution of returns, leading to an overly conservative estimate of the range. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (h) Describe how factor models may be used to understand hedge fund risk exposures<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 14 · Câu 53–56 · Quantum Capital<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Quantum Capital, an investment firm known for its data-driven and quantitative approach, is considering diversifying its investment strategies by incorporating several hedge funds into its portfolio offerings. The firm&#x27;s lead analyst, Dr. Ian Malcolm, has been assigned the task of evaluating a variety of hedge fund strategies with an emphasis on quantitative analysis to determine potential investment prospects.<\/p><p>Among the hedge fund strategies being considered are global macro funds, market-neutral<\/p><p>funds, event-driven funds, and emerging markets funds. Dr. Malcolm plans to assess these<\/p><p>strategies through a series of performance metrics such as expected returns, risk profiles,<\/p><p>portfolio weights, and diversification benefits.<\/p><p>Additionally, the evaluation will include scenario analysis for different market conditions,<\/p><p>leveraging historical data and advanced statistical models. Quantum Capital understands that<\/p><p>successful investment in hedge funds requires both rigorous mathematical analysis and a deep<\/p><p>understanding of the market dynamics that drive these alternative investments.<\/p><p>Quantum Capital is interested in assessing the diversification benefits of adding a new hedge<\/p><p>fund to its portfolio. The current portfolio has an expected return of 10% and a standard<\/p><p>deviation of 12%. The new hedge fund has an expected return of 15%, a standard deviation of<\/p><p>18%, and a correlation with the current portfolio of 0.5.<\/p><\/div><\/details><div class=\"qtext\"><p>Dr. Malcolm is using Monte Carlo simulation to forecast the potential outcomes of an algorithmic trading fund over a 1-year period. The fund has a monthly standard deviation of 2% and aims for an annualized return of 14%. What is the range of expected returns between the 5th and 95th percentile according to a normal distribution?<\/p><\/div>", "subj": "alternatives"}, {"n": 57, "q": "Calculate the expected return for a portfolio consisting of 50% QuantEdge Fund and 50% EventHorizon Fund, assuming their returns are uncorrelated.", "opts": ["14%", "12%", "10%"], "ans": "A", "expl": "The expected return for a portfolio is calculated by taking the weighted average of the expected returns of the individual investments in the portfolio, weighted by their respective allocations. In this case, the portfolio consists of 50% QuantEdge Fund and 50% EventHorizon Fund. The QuantEdge Fund has an expected return of 16%, and the EventHorizon Fund has an expected return of 12%. Therefore, the expected return for the portfolio can be calculated using the formula: Expected Return = (0.16 × 0.5) + (0.12 × 0.5) = 0.08 + 0.06 = 0.14 or 14% This calculation shows that the expected return of the portfolio, when combining these two funds in equal proportions and assuming their returns are uncorrelated, is 14%. This aligns with the principles of portfolio theory, which states that the expected return of a portfolio is the sum of the weighted averages of the expected returns of the individual assets. B is incorrect. It suggests that the expected return of the portfolio is 12%. This calculation error likely arises from an incorrect assumption about the weights or returns of the funds. If one were to mistakenly average the returns without weighting them according to the portfolio allocation, they might arrive at this figure. However, the correct method is to use the weighted average based on the actual investment proportions in the portfolio, which clearly leads to a 14% expected return, not 12%. C is incorrect.It indicates an expected return of 10%, which significantly underestimates the combined performance of the QuantEdge and EventHorizon funds. This result could only be plausible if the weights or expected returns of the funds were substantially lower than those given. Since each fund contributes more than 10% individually to the expected return when properly weighted (16% and 12% respectively), a combined expected return of 10% is mathematically impossible under the given scenario and allocations. This misunderstanding might stem from ignoring the actual expected returns and the equal weighting of the funds in the portfolio calculation. ", "explhtml": "<p>The expected return for a portfolio is calculated by taking the weighted average of the expected returns of the individual investments in the portfolio, weighted by their respective allocations. In this case, the portfolio consists of 50% QuantEdge Fund and 50% EventHorizon Fund. The QuantEdge Fund has an expected return of 16%, and the EventHorizon Fund has an expected return of 12%. Therefore, the expected return for the portfolio can be calculated using the formula:<\/p><p>Expected Return = (0.16 × 0.5) + (0.12 × 0.5) = 0.08 + 0.06 = 0.14 or 14%<\/p><p>This calculation shows that the expected return of the portfolio, when combining these two funds in equal proportions and assuming their returns are uncorrelated, is 14%. This aligns with the principles of portfolio theory, which states that the expected return of a portfolio is the sum of the weighted averages of the expected returns of the individual assets.<\/p><p><b>B is incorrect<\/b>. It suggests that the expected return of the portfolio is 12%. This calculation error likely arises from an incorrect assumption about the weights or returns of the funds. If one were to mistakenly average the returns without weighting them according to the portfolio allocation, they might arrive at this figure. However, the correct method is to use the weighted average based on the actual investment proportions in the portfolio, which clearly leads to a 14% expected return, not 12%.<\/p><p><b>C is incorrect<\/b>.It indicates an expected return of 10%, which significantly underestimates the combined performance of the QuantEdge and EventHorizon funds. This result could only be plausible if the weights or expected returns of the funds were substantially lower than those given. Since each fund contributes more than 10% individually to the expected return when properly weighted (16% and 12% respectively), a combined expected return of 10% is mathematically impossible under the given scenario and allocations. This misunderstanding might stem from ignoring the actual expected returns and the equal weighting of the funds in the portfolio calculation. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Peregrine Financial Group<\/summary><div class=\"vig-body\"><p>Peregrine Financial Group is a mid-sized investment firm with a focus on implementing and managing alternative investment strategies. Helena Pierce, the firm&#x27;s director of research, is tasked with evaluating the addition of new hedge fund strategies to their investment offerings.<\/p><p>Helena&#x27;s attention has been drawn to quantitative, event-driven, and emerging market strategies<\/p><p>due to their potential to offer uncorrelated returns. As part of her assessment, Helena considers<\/p><p>the historical performance, risk metrics, and strategy-specific nuances to enrich the firm&#x27;s<\/p><p>strategic decision-making process.<\/p><p>Peregrine Financials’ clientele ranges from high-net-worth individuals to institutional investors,<\/p><p>all seeking unique opportunities to diversify their investment portfolios. The firm currently offers<\/p><p>strategies centered around convertible arbitrage, fixed income, and global macro trends, and<\/p><p>aims to expand its lineup with carefully selected hedge fund products.<\/p><p>Helena begins her analysis by gathering data on several new investment opportunities. The<\/p><p>flagship fund under consideration is the QuantEdge Fund, which applies sophisticated<\/p><p>algorithmic trading techniques to equity markets. The fund has an expected return of 16% and a<\/p><p>standard deviation of 20%. Simultaneously, Helena evaluates the EventHorizon Fund, which<\/p><p>specializes in merger arbitrage with an expected return of 12% and a standard deviation of 8%.<\/p><p>Helena also assesses the FrontierMarkets Fund, an emerging markets equity fund with an<\/p><p>expected return of 20% and a standard deviation of 30%.<\/p><p>Helena notes that the firm&#x27;s current portfolio has an expected return of 10% with a standard<\/p><p>deviation of 12%. She examines the potential effects on the portfolio&#x27;s returns and risks if any<\/p><p>combination of the new funds is chosen based on various hypothetical scenarios of correlations<\/p><p>and weights.<\/p><p>Finally, Peregrine Financial places importance on analyzing the factor sensitivities of their<\/p><p>investments. Helena looks into factors such as market beta, size, value, and momentum to<\/p><p>understand how they could influence fund behavior under different market conditions. Armed<\/p><p>with the performance metrics and correlation estimates, Helena is ready to delve into the<\/p><p>suitability and strategic fit of these funds for her firm&#x27;s clients.<\/p><\/div><\/details><div class=\"qtext\"><p>Calculate the expected return for a portfolio consisting of 50% QuantEdge Fund and 50% EventHorizon Fund, assuming their returns are uncorrelated.<\/p><\/div>", "subj": "alternatives"}, {"n": 58, "q": "What risk-return profile does the QuantEdge Fund offer compared to the firm's current portfolio?", "opts": ["Same expected return and higher standard deviation", "Higher expected return and higher standard deviation", "Lower expected return and lower standard deviation"], "ans": "B", "expl": "The QuantEdge Fund, which Helena is considering for Peregrine Financial Group, offers a distinct risk-return profile when compared to the firm's current portfolio. Specifically, the QuantEdge Fund has an expected return of 16% and a standard deviation of 20%. In contrast, the firm's existing portfolio has an expected return of 10% and a standard deviation of 12%. This comparison clearly shows that the QuantEdge Fund not only promises a higher return but also comes with a higher level of risk. The higher expected return of 16% compared to 10% is significant because it suggests the potential for greater profitability, which might be appealing to investors seeking higher returns. However, this comes at the cost of increased risk, as indicated by a standard deviation of 20% compared to 12%, which implies greater volatility and, consequently, a higher uncertainty in achieving those returns. A is incorrect. The option stating that the QuantEdge Fund has the same expected return and a higher standard deviation is incorrect because the expected returns are not the same. The QuantEdge Fund has an expected return of 16%, which is notably higher than the current portfolio's return of 10%. This discrepancy in the expected returns clearly invalidates option A, as it misrepresents the return comparison between the two investment choices. C is incorrect. This option suggests that the QuantEdge Fund has a lower expected return and a lower standard deviation compared to the current portfolio. This is directly contradicted by the data provided. The QuantEdge Fund actually has a higher expected return (16% versus 10%) and a higher standard deviation (20% versus 12%). Therefore, both components of this option are factually incorrect, making it an unsuitable choice. The increase in both expected return and standard deviation indicates a shift towards a riskier investment strategy that aims for higher rewards, which is the opposite of what option C describes. ", "explhtml": "<p>The QuantEdge Fund, which Helena is considering for Peregrine Financial Group, offers a distinct risk-return profile when compared to the firm&#x27;s current portfolio. Specifically, the QuantEdge Fund has an expected return of 16% and a standard deviation of 20%. In contrast, the firm&#x27;s existing portfolio has an expected return of 10% and a standard deviation of 12%. This comparison clearly shows that the QuantEdge Fund not only promises a higher return but also comes with a higher level of risk. The higher expected return of 16% compared to 10% is significant because it suggests the potential for greater profitability, which might be appealing to investors seeking higher returns. However, this comes at the cost of increased risk, as indicated by a standard deviation of 20% compared to 12%, which implies greater volatility and, consequently, a higher uncertainty in achieving those returns.<\/p><p><b>A is incorrect<\/b>. The option stating that the QuantEdge Fund has the same expected return and a higher standard deviation is incorrect because the expected returns are not the same. The QuantEdge Fund has an expected return of 16%, which is notably higher than the current portfolio&#x27;s return of 10%. This discrepancy in the expected returns clearly invalidates option A, as it misrepresents the return comparison between the two investment choices.<\/p><p><b>C is incorrect<\/b>. This option suggests that the QuantEdge Fund has a lower expected return and a lower standard deviation compared to the current portfolio. This is directly contradicted by the data provided. The QuantEdge Fund actually has a higher expected return (16% versus 10%) and a higher standard deviation (20% versus 12%). Therefore, both components of this option are factually incorrect, making it an unsuitable choice. The increase in both expected return and standard deviation indicates a shift towards a riskier investment strategy that aims for higher rewards, which is the opposite of what option C describes. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (h) Describe how factor models may be used to understand hedge fund risk exposures<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Peregrine Financial Group<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peregrine Financial Group is a mid-sized investment firm with a focus on implementing and managing alternative investment strategies. Helena Pierce, the firm&#x27;s director of research, is tasked with evaluating the addition of new hedge fund strategies to their investment offerings.<\/p><p>Helena&#x27;s attention has been drawn to quantitative, event-driven, and emerging market strategies<\/p><p>due to their potential to offer uncorrelated returns. As part of her assessment, Helena considers<\/p><p>the historical performance, risk metrics, and strategy-specific nuances to enrich the firm&#x27;s<\/p><p>strategic decision-making process.<\/p><p>Peregrine Financials’ clientele ranges from high-net-worth individuals to institutional investors,<\/p><p>all seeking unique opportunities to diversify their investment portfolios. The firm currently offers<\/p><p>strategies centered around convertible arbitrage, fixed income, and global macro trends, and<\/p><p>aims to expand its lineup with carefully selected hedge fund products.<\/p><p>Helena begins her analysis by gathering data on several new investment opportunities. The<\/p><p>flagship fund under consideration is the QuantEdge Fund, which applies sophisticated<\/p><p>algorithmic trading techniques to equity markets. The fund has an expected return of 16% and a<\/p><p>standard deviation of 20%. Simultaneously, Helena evaluates the EventHorizon Fund, which<\/p><p>specializes in merger arbitrage with an expected return of 12% and a standard deviation of 8%.<\/p><p>Helena also assesses the FrontierMarkets Fund, an emerging markets equity fund with an<\/p><p>expected return of 20% and a standard deviation of 30%.<\/p><p>Helena notes that the firm&#x27;s current portfolio has an expected return of 10% with a standard<\/p><p>deviation of 12%. She examines the potential effects on the portfolio&#x27;s returns and risks if any<\/p><p>combination of the new funds is chosen based on various hypothetical scenarios of correlations<\/p><p>and weights.<\/p><p>Finally, Peregrine Financial places importance on analyzing the factor sensitivities of their<\/p><p>investments. Helena looks into factors such as market beta, size, value, and momentum to<\/p><p>understand how they could influence fund behavior under different market conditions. Armed<\/p><p>with the performance metrics and correlation estimates, Helena is ready to delve into the<\/p><p>suitability and strategic fit of these funds for her firm&#x27;s clients.<\/p><\/div><\/details><div class=\"qtext\"><p>What risk-return profile does the QuantEdge Fund offer compared to the firm&#x27;s current portfolio?<\/p><\/div>", "subj": "alternatives"}, {"n": 59, "q": "Helena hypothesizes a scenario where the QuantEdge Fund has a beta of 1.2 relative to the market. The market is anticipated to return 8% while the risk-free rate stands at 2%. Calculate the expected return of the QuantEdge Fund based on the Capital Asset Pricing Model (CAPM).", "opts": ["10.00%", "9.20%", "8.00%"], "ans": "B", "expl": "The expected return of the QuantEdge Fund, calculated using the Capital Asset Pricing Model (CAPM), is determined by the formula: where E(Ri) is the expected return of the investment, Rf is the risk-free rate, βi is the beta of the investment, and E(Rm ) is the expected return of the market. Plugging in the values provided:  Rf = 2%, βi = 1.2, and E(Rm) = 8%, we get: E(Ri) = 0.02 + 1.2 × (0.08 −0.02) = 0.02 + 1.2 × 0.06 = 0.02 + 0.072 = 0.092 or 9.2\\%. This calculation shows that the expected return of the QuantEdge Fund, considering its market sensitivity (beta) and the current market conditions, is 9.2\\%. A is incorrect. The option suggesting a 10.0% return would imply a different set of conditions than those given. For the return to be 10.0%, either the beta of the fund would need to be higher than 1.2, or the expected market return would need to be significantly higher than 8%. Specifically, solving for β when the expected return is 10% using the CAPM formula: This beta of approximately 1.33 is higher than the given beta of 1.2, confirming that a 10.0% return is not feasible under the current conditions. C is incorrect. The option suggesting an 8.0% return does not correctly apply the CAPM formula. If the fund's beta is accurately factored into the calculation, the influence of the market's performance above the risk-free rate must be considered. An 8.0% return would imply that the fund's performance is exactly equal to the risk-free rate, disregarding the additional return expected from taking on more risk than the market (as indicated by a beta greater than 1). This misunderstanding of the CAPM's application results in an underestimate of the fund's expected performance. ", "explhtml": "<p>The expected return of the QuantEdge Fund, calculated using the Capital Asset Pricing Model (CAPM), is determined by the formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0081.webp\" style=\"max-width:min(100%,214px)\" alt=\"E(Ri) = Rf + βi(E(Rm) −Rf)\"><p>where E(R<sub>i<\/sub>) is the expected return of the investment, R<sub>f<\/sub> is the risk-free rate, β<sub>i<\/sub> is the beta of the investment, and E(R<sub>m<\/sub> ) is the expected return of the market. Plugging in the values provided:  R<sub>f<\/sub> = 2%, β<sub>i<\/sub> = 1.2, and E(R<sub>m<\/sub>) = 8%, we get:<\/p><p>E(R<sup>i<\/sup>) = 0.02 + 1.2 × (0.08 −0.02) = 0.02 + 1.2 × 0.06 = 0.02 + 0.072 = 0.092<\/p><p>or 9.2\\%. This calculation shows that the expected return of the QuantEdge Fund, considering its market sensitivity (beta) and the current market conditions, is 9.2\\%.<\/p><p><b>A is incorrect<\/b>. The option suggesting a 10.0% return would imply a different set of conditions than those given. For the return to be 10.0%, either the beta of the fund would need to be higher than 1.2, or the expected market return would need to be significantly higher than 8%. Specifically, solving for β when the expected return is 10% using the CAPM formula:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0082.webp\" style=\"max-width:min(100%,247px)\" alt=\"0.10 = 0.02 + β × (0.08 −0.02) 0.10 = 0.02 + β × 0.06 0.08 = β × 0.06 0.08 β = ≈1.33 0.06\"><p>This beta of approximately 1.33 is higher than the given beta of 1.2, confirming that a 10.0% return is not feasible under the current conditions.<\/p><p><b>C is incorrect<\/b>. The option suggesting an 8.0% return does not correctly apply the CAPM formula. If the fund&#x27;s beta is accurately factored into the calculation, the influence of the market&#x27;s performance above the risk-free rate must be considered. An 8.0% return would imply that the fund&#x27;s performance is exactly equal to the risk-free rate, disregarding the additional return expected from taking on more risk than the market (as indicated by a beta greater than 1). This misunderstanding of the CAPM&#x27;s application results in an underestimate of the fund&#x27;s expected performance. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Peregrine Financial Group<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peregrine Financial Group is a mid-sized investment firm with a focus on implementing and managing alternative investment strategies. Helena Pierce, the firm&#x27;s director of research, is tasked with evaluating the addition of new hedge fund strategies to their investment offerings.<\/p><p>Helena&#x27;s attention has been drawn to quantitative, event-driven, and emerging market strategies<\/p><p>due to their potential to offer uncorrelated returns. As part of her assessment, Helena considers<\/p><p>the historical performance, risk metrics, and strategy-specific nuances to enrich the firm&#x27;s<\/p><p>strategic decision-making process.<\/p><p>Peregrine Financials’ clientele ranges from high-net-worth individuals to institutional investors,<\/p><p>all seeking unique opportunities to diversify their investment portfolios. The firm currently offers<\/p><p>strategies centered around convertible arbitrage, fixed income, and global macro trends, and<\/p><p>aims to expand its lineup with carefully selected hedge fund products.<\/p><p>Helena begins her analysis by gathering data on several new investment opportunities. The<\/p><p>flagship fund under consideration is the QuantEdge Fund, which applies sophisticated<\/p><p>algorithmic trading techniques to equity markets. The fund has an expected return of 16% and a<\/p><p>standard deviation of 20%. Simultaneously, Helena evaluates the EventHorizon Fund, which<\/p><p>specializes in merger arbitrage with an expected return of 12% and a standard deviation of 8%.<\/p><p>Helena also assesses the FrontierMarkets Fund, an emerging markets equity fund with an<\/p><p>expected return of 20% and a standard deviation of 30%.<\/p><p>Helena notes that the firm&#x27;s current portfolio has an expected return of 10% with a standard<\/p><p>deviation of 12%. She examines the potential effects on the portfolio&#x27;s returns and risks if any<\/p><p>combination of the new funds is chosen based on various hypothetical scenarios of correlations<\/p><p>and weights.<\/p><p>Finally, Peregrine Financial places importance on analyzing the factor sensitivities of their<\/p><p>investments. Helena looks into factors such as market beta, size, value, and momentum to<\/p><p>understand how they could influence fund behavior under different market conditions. Armed<\/p><p>with the performance metrics and correlation estimates, Helena is ready to delve into the<\/p><p>suitability and strategic fit of these funds for her firm&#x27;s clients.<\/p><\/div><\/details><div class=\"qtext\"><p>Helena hypothesizes a scenario where the QuantEdge Fund has a beta of 1.2 relative to the market. The market is anticipated to return 8% while the risk-free rate stands at 2%. Calculate the expected return of the QuantEdge Fund based on the Capital Asset Pricing Model (CAPM).<\/p><\/div>", "subj": "alternatives"}, {"n": 60, "q": "How does the Event Horizon Fund's risk compare to that of the firm's current portfolio?", "opts": ["It has lower expected risk as indicated by a lower standard deviation", "It has higher risk due to a higher standard deviation", "It has higher risk despite a lower standard deviation due to the nature of event-driven strategies"], "ans": "A", "expl": "The EventHorizon Fund, which specializes in merger arbitrage, has a reported standard deviation of 8%. Standard deviation is a widely used measure of risk, particularly in finance, as it reflects the average amount returns deviate from the mean return. In comparison, the current portfolio of Peregrine Financial Group has a standard deviation of 12%. A lower standard deviation indicates that the returns of the EventHorizon Fund are less volatile compared to the firm's current portfolio. This lower volatility suggests that the EventHorizon Fund poses less risk in terms of the variability of returns. Therefore, the EventHorizon Fund has a lower expected risk relative to the firm's current portfolio, making option A the correct answer. B is incorrect. The statement that the EventHorizon Fund has higher risk due to a higher standard deviation is factually incorrect. As stated, the EventHorizon Fund has a standard deviation of 8%, which is lower than the 12% standard deviation of the firm's current portfolio. Risk, as measured by standard deviation, is directly proportional to the value of the standard deviation; hence, a lower standard deviation of the EventHorizon Fund clearly indicates a lower risk compared to the current portfolio. C is incorrect. Although event-driven strategies, such as those employed by the EventHorizon Fund, can be perceived as higher risk due to their reliance on and sensitivity to specific corporate events, this perception does not align with the statistical measure of risk provided by the standard deviation in this instance. The standard deviation, a quantitative measure, shows that the EventHorizon Fund has a lower risk (8%) compared to the current portfolio's 12%. This numerical evidence must take precedence in evaluating risk over qualitative assumptions about the nature of the strategy. Thus, despite any perceived inherent risks of event-driven strategies, the actual measured risk via standard deviation is lower for the EventHorizon Fund. ", "explhtml": "<p>The EventHorizon Fund, which specializes in merger arbitrage, has a reported standard deviation of 8%. Standard deviation is a widely used measure of risk, particularly in finance, as it reflects the average amount returns deviate from the mean return. In comparison, the current portfolio of Peregrine Financial Group has a standard deviation of 12%. A lower standard deviation indicates that the returns of the EventHorizon Fund are less volatile compared to the firm&#x27;s current portfolio. This lower volatility suggests that the EventHorizon Fund poses less risk in terms of the variability of returns. Therefore, the EventHorizon Fund has a lower expected risk relative to the firm&#x27;s current portfolio, making option A the correct answer.<\/p><p><b>B is incorrect<\/b>. The statement that the EventHorizon Fund has higher risk due to a higher standard deviation is factually incorrect. As stated, the EventHorizon Fund has a standard deviation of 8%, which is lower than the 12% standard deviation of the firm&#x27;s current portfolio. Risk, as measured by standard deviation, is directly proportional to the value of the standard deviation; hence, a lower standard deviation of the EventHorizon Fund clearly indicates a lower risk compared to the current portfolio.<\/p><p><b>C is incorrect<\/b>. Although event-driven strategies, such as those employed by the EventHorizon Fund, can be perceived as higher risk due to their reliance on and sensitivity to specific corporate events, this perception does not align with the statistical measure of risk provided by the standard deviation in this instance. The standard deviation, a quantitative measure, shows that the EventHorizon Fund has a lower risk (8%) compared to the current portfolio&#x27;s 12%. This numerical evidence must take precedence in evaluating risk over qualitative assumptions about the nature of the strategy. Thus, despite any perceived inherent risks of event-driven strategies, the actual measured risk via standard deviation is lower for the EventHorizon Fund. <\/p><p class=\"los\">Alternative Investments, Learning Module 4: Hedge Fund Strategies, LOS 4 (b) Discuss investment characteristics, strategy implementation, and role in a portfolio of equity- related hedge fund strategies.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 57–60 · Peregrine Financial Group<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Peregrine Financial Group is a mid-sized investment firm with a focus on implementing and managing alternative investment strategies. Helena Pierce, the firm&#x27;s director of research, is tasked with evaluating the addition of new hedge fund strategies to their investment offerings.<\/p><p>Helena&#x27;s attention has been drawn to quantitative, event-driven, and emerging market strategies<\/p><p>due to their potential to offer uncorrelated returns. As part of her assessment, Helena considers<\/p><p>the historical performance, risk metrics, and strategy-specific nuances to enrich the firm&#x27;s<\/p><p>strategic decision-making process.<\/p><p>Peregrine Financials’ clientele ranges from high-net-worth individuals to institutional investors,<\/p><p>all seeking unique opportunities to diversify their investment portfolios. The firm currently offers<\/p><p>strategies centered around convertible arbitrage, fixed income, and global macro trends, and<\/p><p>aims to expand its lineup with carefully selected hedge fund products.<\/p><p>Helena begins her analysis by gathering data on several new investment opportunities. The<\/p><p>flagship fund under consideration is the QuantEdge Fund, which applies sophisticated<\/p><p>algorithmic trading techniques to equity markets. The fund has an expected return of 16% and a<\/p><p>standard deviation of 20%. Simultaneously, Helena evaluates the EventHorizon Fund, which<\/p><p>specializes in merger arbitrage with an expected return of 12% and a standard deviation of 8%.<\/p><p>Helena also assesses the FrontierMarkets Fund, an emerging markets equity fund with an<\/p><p>expected return of 20% and a standard deviation of 30%.<\/p><p>Helena notes that the firm&#x27;s current portfolio has an expected return of 10% with a standard<\/p><p>deviation of 12%. She examines the potential effects on the portfolio&#x27;s returns and risks if any<\/p><p>combination of the new funds is chosen based on various hypothetical scenarios of correlations<\/p><p>and weights.<\/p><p>Finally, Peregrine Financial places importance on analyzing the factor sensitivities of their<\/p><p>investments. Helena looks into factors such as market beta, size, value, and momentum to<\/p><p>understand how they could influence fund behavior under different market conditions. Armed<\/p><p>with the performance metrics and correlation estimates, Helena is ready to delve into the<\/p><p>suitability and strategic fit of these funds for her firm&#x27;s clients.<\/p><\/div><\/details><div class=\"qtext\"><p>How does the Event Horizon Fund&#x27;s risk compare to that of the firm&#x27;s current portfolio?<\/p><\/div>", "subj": "alternatives"}, {"n": 61, "q": "Based on Exhibit 1 and assuming that the REIT has no debt, the apartment’s NAVPS is closest to:", "opts": ["$50.0", "$47.5", "$45.0"], "ans": "A", "expl": "We calculate the net asset value (NAV) using the following formula. The next step involves calculating the NAVPS by dividing the NAV by the total number of outstanding shares for the Apartments, which amounts to 90,000 shares. Therefore, B is incorrect. It calculates the NAVPS for the industry average instead of the apartments. The next step involves calculating the NAVPS by dividing the NAV by the total number of outstanding shares for the Apartments, which amounts to 100,000 shares. Therefore, C is incorrect. It uses the wrong number of outstanding shares.", "explhtml": "<p>We calculate the net asset value (NAV) using the following formula.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0084.webp\" style=\"max-width:min(100%,246px)\" alt=\"NOI NAV = (Market Cap Rate) $270,000 NAV = = $4, 500, 000 0.06\"><p>The next step involves calculating the NAVPS by dividing the NAV by the total number of outstanding shares for the Apartments, which amounts to 90,000 shares. Therefore,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0085.webp\" style=\"max-width:min(100%,217px)\" alt=\"$4, 500, 000 NAVPS = = $50 90,000\"><p><b>B is incorrect.<\/b> It calculates the NAVPS for the industry average instead of the apartments.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0086.webp\" style=\"max-width:min(100%,246px)\" alt=\"NOI NAV = (Market Cap Rate) $285,000 NAV = = $4, 750, 000 0.06\"><p>The next step involves calculating the NAVPS by dividing the NAV by the total number of outstanding shares for the Apartments, which amounts to 100,000 shares. Therefore,<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0087.webp\" style=\"max-width:min(100%,232px)\" alt=\"$4, 750, 000 NAVPS = = $47.5 100, 000\"><p><b>C is incorrect.<\/b> It uses the wrong number of outstanding shares.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0088.webp\" style=\"max-width:min(100%,265px)\" alt=\"NAV = NOI (Market Cap Rate) $270,000 NAV = = $4, 500, 000 0.06 $4, 500, 000 NAVPS = = $45 100, 000\"><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (b): Justify net asset value per share (NAVPS) in REIT valuation and estimate NAVPS based on forecasted cash net operating income.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Martin Stewart<\/summary><div class=\"vig-body\"><p>Martin Stewart, CFA, is an investment advisor at Cross Asset Managers, a U.S.-based investment<\/p><p>firm. Stewart is meeting with one of the firm&#x27;s clients, Alexis Riggs, regarding a potential real<\/p><p>estate investment. Riggs instructs Stewart to select an investment based on the constraints and<\/p><p>financial goals shared during the meeting. Riggs is 59 and looking to retire in the next two years.<\/p><p>He wants his portfolio to cover his living expenses during his retirement, and he values stability.<\/p><p>Stewart suggests investing in equity real estate investment trust (REIT) securities, highlighting<\/p><p>their advantages compared to real estate operating companies (REOCs) and direct real estate<\/p><p>investments. Stewart advances the meeting by suggesting an investment in the securities of a<\/p><p>REIT that owns and manages warehouse facilities. Before delving into the investment details,<\/p><p>Stewart informs Riggs that several factors affect the investment&#x27;s value and should be<\/p><p>considered.<\/p><p>Stewart begins valuing the property using the relative value approach based on price multiples.<\/p><p>He gathers the necessary data for the valuation presented in Exhibit 1 for the subject warehouse<\/p><p>and the industry average for the current year, 2025.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0083.webp\" style=\"max-width:min(100%,658px)\" alt=\"Exhibit 1: Cash Flow Information for Valuation Average Industry Apartment Net operating income earned in 2025 $285,000 $270,000 Total cash rent per annum $46,050 $52,350 Straight-line rent $55,200 $50,250 General &amp; admin expenses $5,200 $4,900 Interest expenses $2,300 $2,670 Capital expenditure (mai\"><p>Riggs asks Stewart, “ Why is it better to use the P/FFO multiple instead of P/AFFO?”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and assuming that the REIT has no debt, the apartment’s NAVPS is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 62, "q": "What is the most likely response to Riggs's question?", "opts": ["Standardization.", "Focus on actual cash flows.", "Useful in dividend analysis."], "ans": "A", "expl": "FFO (Funds From Operations) is a widely accepted and standardized metric endorsed by organizations like NAREIT (National Association of Real Estate Investment Trusts). This standardization ensures consistency in calculating and reporting FFO across different REITs, making it easier for investors to compare and analyze REITs using the P/FFO multiple. In contrast, AFFO (Adjusted Funds From Operations) lacks a universally agreed-upon definition, leading to calculation variations that make the P/AFFO multiple less consistent and harder to compare across REITs. B is incorrect. While AFFO offers a more refined view of cash flow, incorporating capital expenditures and other recurring costs, the question asks why P/FFO is preferred. The preference focuses on FFO's standardization, not its ability to reflect true cash flows. AFFO would be better for true cash flow analysis, but that's not the reason P/FFO is widely used. C is incorrect. AFFO is more closely aligned with dividends because it accounts for cash flows that are available for distribution. However, the P/FFO multiple is preferred because FFO is standardized and comparable. Dividend analysis is valuable, but not the main driver for selecting P/FFO over P/AFFO.", "explhtml": "<p>FFO (Funds From Operations) is a widely accepted and standardized metric endorsed by organizations like NAREIT (National Association of Real Estate Investment Trusts). This standardization ensures consistency in calculating and reporting FFO across different REITs, making it easier for investors to compare and analyze REITs using the P/FFO multiple. In contrast, AFFO (Adjusted Funds From Operations) lacks a universally agreed-upon definition, leading to calculation variations that make the P/AFFO multiple less consistent and harder to compare across REITs.<\/p><p><b>B is incorrect.<\/b> While AFFO offers a more refined view of cash flow, incorporating capital expenditures and other recurring costs, the question asks why P/FFO is preferred. The preference focuses on FFO&#x27;s standardization, not its ability to reflect true cash flows. AFFO would be better for true cash flow analysis, but that&#x27;s not the reason P/FFO is widely used.<\/p><p><b>C is incorrect.<\/b> AFFO is more closely aligned with dividends because it accounts for cash flows that are available for distribution. However, the P/FFO multiple is preferred because FFO is standardized and comparable. Dividend analysis is valuable, but not the main driver for selecting P/FFO over P/AFFO.<\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (d): Calculate the value of a REIT share using net asset value, price-to-FFO and price-to-AFFO, and discounted cash flow approaches.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Martin Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martin Stewart, CFA, is an investment advisor at Cross Asset Managers, a U.S.-based investment<\/p><p>firm. Stewart is meeting with one of the firm&#x27;s clients, Alexis Riggs, regarding a potential real<\/p><p>estate investment. Riggs instructs Stewart to select an investment based on the constraints and<\/p><p>financial goals shared during the meeting. Riggs is 59 and looking to retire in the next two years.<\/p><p>He wants his portfolio to cover his living expenses during his retirement, and he values stability.<\/p><p>Stewart suggests investing in equity real estate investment trust (REIT) securities, highlighting<\/p><p>their advantages compared to real estate operating companies (REOCs) and direct real estate<\/p><p>investments. Stewart advances the meeting by suggesting an investment in the securities of a<\/p><p>REIT that owns and manages warehouse facilities. Before delving into the investment details,<\/p><p>Stewart informs Riggs that several factors affect the investment&#x27;s value and should be<\/p><p>considered.<\/p><p>Stewart begins valuing the property using the relative value approach based on price multiples.<\/p><p>He gathers the necessary data for the valuation presented in Exhibit 1 for the subject warehouse<\/p><p>and the industry average for the current year, 2025.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0083.webp\" style=\"max-width:min(100%,658px)\" alt=\"Exhibit 1: Cash Flow Information for Valuation Average Industry Apartment Net operating income earned in 2025 $285,000 $270,000 Total cash rent per annum $46,050 $52,350 Straight-line rent $55,200 $50,250 General &amp; admin expenses $5,200 $4,900 Interest expenses $2,300 $2,670 Capital expenditure (mai\"><p>Riggs asks Stewart, “ Why is it better to use the P/FFO multiple instead of P/AFFO?”<\/p><\/div><\/details><div class=\"qtext\"><p>What is the most likely response to Riggs&#x27;s question?<\/p><\/div>", "subj": "alternatives"}, {"n": 63, "q": "Based on Exhibit 1, the apartment’s P/FFO is closest to:", "opts": ["4.84x", "4.85x", "4.35x"], "ans": "C", "expl": "The number of outstanding shares is 90,000. A is incorrect. It uses 100,000 outstanding shares instead of 90,000. The number of outstanding shares is 100,000. C is incorrect. It incorrectly uses the industry average share price of $30.5 instead of the apartment share price of $27.4. The number of outstanding shares is 90,000.", "explhtml": "<img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0089.webp\" style=\"max-width:min(100%,529px)\" alt=\"FFO = AFFO + Non Cash rent + Capital Expenditure (Maintenance) FFO = $560, 000 + $5, 200 + $1, 120 = $566, 320\"><p>The number of outstanding shares is 90,000.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0090.webp\" style=\"max-width:min(100%,273px)\" alt=\"$566, 320 FFO per share = = $6.29 90, 000 $27.4 P/FFO = $6.29 = 4.36x\"><p><b>A is incorrect.<\/b> It uses 100,000 outstanding shares instead of 90,000.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0091.webp\" style=\"max-width:min(100%,529px)\" alt=\"FFO = AFFO + Non Cash rent + Capital Expenditure (Maintenance) FFO = $560, 000 + $5, 200 + $1, 120 = $566, 320\"><p>The number of outstanding shares is 100,000.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0092.webp\" style=\"max-width:min(100%,273px)\" alt=\"$566, 320 FFO per share = = $5.66 100, 000 $27.4 P/FFO = $5.66 = 4.84x\"><p><b>C is incorrect.<\/b> It incorrectly uses the industry average share price of $30.5 instead of the apartment share price of $27.4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0093.webp\" style=\"max-width:min(100%,529px)\" alt=\"FFO = AFFO + Non Cash rent + Capital Expenditure (Maintenance) FFO = $560, 000 + $5, 200 + $1, 120 = $566, 320\"><p>The number of outstanding shares is 90,000.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0094.webp\" style=\"max-width:min(100%,273px)\" alt=\"$566, 320 FFO per share = = $6.29 90, 000 $30.5 P/FFO = $6.29 = 4.85x\"><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (d): Calculate the value of a REIT share using net asset value, price-to-FFO and price-to-AFFO, and discounted cash flow approaches.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Martin Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martin Stewart, CFA, is an investment advisor at Cross Asset Managers, a U.S.-based investment<\/p><p>firm. Stewart is meeting with one of the firm&#x27;s clients, Alexis Riggs, regarding a potential real<\/p><p>estate investment. Riggs instructs Stewart to select an investment based on the constraints and<\/p><p>financial goals shared during the meeting. Riggs is 59 and looking to retire in the next two years.<\/p><p>He wants his portfolio to cover his living expenses during his retirement, and he values stability.<\/p><p>Stewart suggests investing in equity real estate investment trust (REIT) securities, highlighting<\/p><p>their advantages compared to real estate operating companies (REOCs) and direct real estate<\/p><p>investments. Stewart advances the meeting by suggesting an investment in the securities of a<\/p><p>REIT that owns and manages warehouse facilities. Before delving into the investment details,<\/p><p>Stewart informs Riggs that several factors affect the investment&#x27;s value and should be<\/p><p>considered.<\/p><p>Stewart begins valuing the property using the relative value approach based on price multiples.<\/p><p>He gathers the necessary data for the valuation presented in Exhibit 1 for the subject warehouse<\/p><p>and the industry average for the current year, 2025.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0083.webp\" style=\"max-width:min(100%,658px)\" alt=\"Exhibit 1: Cash Flow Information for Valuation Average Industry Apartment Net operating income earned in 2025 $285,000 $270,000 Total cash rent per annum $46,050 $52,350 Straight-line rent $55,200 $50,250 General &amp; admin expenses $5,200 $4,900 Interest expenses $2,300 $2,670 Capital expenditure (mai\"><p>Riggs asks Stewart, “ Why is it better to use the P/FFO multiple instead of P/AFFO?”<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the apartment’s P/FFO is closest to:<\/p><\/div>", "subj": "alternatives"}, {"n": 64, "q": "The most likely reason why Stewart recommended an investment in publicly traded real estate securities is:", "opts": ["They can be used as collateral.", "They are highly liquid.", "They have low return and price volatility."], "ans": "B", "expl": "Publicly traded REIT securities are known for their high liquidity because they trade on stock exchanges like other equities. This feature aligns with Riggs's financial goals and constraints. As someone who will soon be retiring, Riggs needs investments that provide flexibility and the ability to convert to cash quickly to meet living expenses. Liquidity ensures that Riggs can access his funds without significant delay or price impact, making this the most suitable choice. A is incorrect. While it is true that REIT securities can be used as collateral for loans, this feature does not directly address Riggs's immediate need for stability and liquidity to fund retirement expenses. The question's context focuses on financial goals that prioritize income and access to funds, not the ability to secure loans. C is incorrect. Although stability is important to Riggs, publicly traded REITs do not necessarily exhibit low return and price volatility. As equity-like investments, they are subject to market fluctuations. Highlighting low volatility would be misleading, and this option doesn't align with Stewart's likely reasoning in recommending the investment to Riggs.", "explhtml": "<p>Publicly traded REIT securities are known for their high liquidity because they trade on stock exchanges like other equities. This feature aligns with Riggs&#x27;s financial goals and constraints. As someone who will soon be retiring, Riggs needs investments that provide flexibility and the ability to convert to cash quickly to meet living expenses. Liquidity ensures that Riggs can access his funds without significant delay or price impact, making this the most suitable choice.<\/p><p><b>A is incorrect.<\/b> While it is true that REIT securities can be used as collateral for loans, this feature does not directly address Riggs&#x27;s immediate need for stability and liquidity to fund retirement expenses. The question&#x27;s context focuses on financial goals that prioritize income and access to funds, not the ability to secure loans.<\/p><p><b>C is incorrect.<\/b> Although stability is important to Riggs, publicly traded REITs do not necessarily exhibit low return and price volatility. As equity-like investments, they are subject to market fluctuations. Highlighting low volatility would be misleading, and this option doesn&#x27;t align with Stewart&#x27;s likely reasoning in recommending the investment to Riggs.<\/p><p class=\"los\">Alternative Investments, Learning Module 2: Overview of Types of Real Estate Investment, LOS 2 (a): Compare the characteristics, classifications, principal risks, and basic forms of public and private real estate investments.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 16 · Câu 61–64 · Martin Stewart<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Martin Stewart, CFA, is an investment advisor at Cross Asset Managers, a U.S.-based investment<\/p><p>firm. Stewart is meeting with one of the firm&#x27;s clients, Alexis Riggs, regarding a potential real<\/p><p>estate investment. Riggs instructs Stewart to select an investment based on the constraints and<\/p><p>financial goals shared during the meeting. Riggs is 59 and looking to retire in the next two years.<\/p><p>He wants his portfolio to cover his living expenses during his retirement, and he values stability.<\/p><p>Stewart suggests investing in equity real estate investment trust (REIT) securities, highlighting<\/p><p>their advantages compared to real estate operating companies (REOCs) and direct real estate<\/p><p>investments. Stewart advances the meeting by suggesting an investment in the securities of a<\/p><p>REIT that owns and manages warehouse facilities. Before delving into the investment details,<\/p><p>Stewart informs Riggs that several factors affect the investment&#x27;s value and should be<\/p><p>considered.<\/p><p>Stewart begins valuing the property using the relative value approach based on price multiples.<\/p><p>He gathers the necessary data for the valuation presented in Exhibit 1 for the subject warehouse<\/p><p>and the industry average for the current year, 2025.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0083.webp\" style=\"max-width:min(100%,658px)\" alt=\"Exhibit 1: Cash Flow Information for Valuation Average Industry Apartment Net operating income earned in 2025 $285,000 $270,000 Total cash rent per annum $46,050 $52,350 Straight-line rent $55,200 $50,250 General &amp; admin expenses $5,200 $4,900 Interest expenses $2,300 $2,670 Capital expenditure (mai\"><p>Riggs asks Stewart, “ Why is it better to use the P/FFO multiple instead of P/AFFO?”<\/p><\/div><\/details><div class=\"qtext\"><p>The most likely reason why Stewart recommended an investment in publicly traded real estate securities is:<\/p><\/div>", "subj": "alternatives"}, {"n": 65, "q": "To meet his requirement, Brown is least likely to invest in:", "opts": ["Direct real estate investment.", "REOC.", "REIT."], "ans": "A", "expl": "Investing directly in real estate often means acquiring a single property, which limits diversification. This directly conflicts with Brown's aim to achieve the highest possible level of diversification. Direct property purchases typically require a substantial initial investment, which could strain Brown's limited financial resources, especially for his personal portfolio. B is incorrect. A REOC (Real Estate Operating Company) better aligns with Brown's needs. REOCs typically own and manage a portfolio of diverse real estate assets, contributing to a higher level of diversification than direct property investments. Unlike REITs, REOCs are not bound by income distribution requirements, allowing them to reinvest earnings or structure leverage more creatively to enhance returns. C is incorrect. A REIT (Real Estate Investment Trust) is also suitable for Brown because REITs typically invest in multiple properties, offering considerable diversification. Investing in REITs often requires much smaller initial capital than direct real estate investments, addressing Brown’s concern about limited funds. REITs can accommodate various leverage structures, enabling potential for enhanced returns.", "explhtml": "<p>Investing directly in real estate often means acquiring a single property, which limits diversification. This directly conflicts with Brown&#x27;s aim to achieve the highest possible level of diversification. Direct property purchases typically require a substantial initial investment, which could strain Brown&#x27;s limited financial resources, especially for his personal portfolio.<\/p><p><b>B is incorrect.<\/b> A REOC (Real Estate Operating Company) better aligns with Brown&#x27;s needs. REOCs typically own and manage a portfolio of diverse real estate assets, contributing to a higher level of diversification than direct property investments. Unlike REITs, REOCs are not bound by income distribution requirements, allowing them to reinvest earnings or structure leverage more creatively to enhance returns.<\/p><p><b>C is incorrect. <\/b>A REIT (Real Estate Investment Trust) is also suitable for Brown because REITs typically invest in multiple properties, offering considerable diversification. Investing in REITs often requires much smaller initial capital than direct real estate investments, addressing Brown’s concern about limited funds. REITs can accommodate various leverage structures, enabling potential for enhanced returns.<\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Darlene Brown<\/summary><div class=\"vig-body\"><p>Darlene Brown, CFA, is the Senior Portfolio Manager at Douglas &amp; Page Investments. Brown is<\/p><p>looking to add real estate to the company’s portfolio, and she has narrowed it down to three<\/p><p>investments: Direct real estate investment, real estate investment trust (REIT), and a real estate<\/p><p>operating company (REOC). Brown aims to achieve the highest level of diversification possible<\/p><p>while selecting an investment free from restrictions. Moreover, he seeks an option supporting<\/p><p>various leverage structures to enhance returns.<\/p><p>Additionally, Brown wants to incorporate real estate into his personal investment portfolio.<\/p><p>However, his limited financial resources raise concerns about whether he can afford such an<\/p><p>investment.<\/p><p>Finally, Brown analyzes the distinctions between investing in a REIT and a REOC, focusing on<\/p><p>market valuations, equity capital access, and tax implications. He plans to present his findings to<\/p><p>John Clark, a colleague and Excel&#x27;s fixed-income advisor.<\/p><p>Brown opts to invest in a warehouse REIT. This REIT owns the warehouse properties but leases<\/p><p>them out entirely to taxable REIT subsidiaries. These subsidiaries manage the operations and<\/p><p>return the rental income to the parent REIT. Exhibit 1 outlines key data for evaluating the REIT<\/p><p>investment using the net asset value (NAV) method.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0095.webp\" style=\"max-width:min(100%,376px)\" alt=\"Exhibit 1: NAV Approach Shares outstanding 120,000 NOI (Next 12 Months) $925,650 Prepaid assets, including goodwill $22,890 Cash and cash equivalents $62,340 Deferred tax assets $36,780 Goodwill $56,000 Land held for future development $36,310 Intangible assets $12,640 Other liabilities $180,000 Tot\"><p>Clark asks Brown, “Why would a REIT trade at a discount to its NAV?” To which Brown responds<\/p><p>with the following reasons:<\/p><p>Reason 1: A lack of investor confidence<\/p><p>Reason 2: REIT-specific issues such as high occupancy rates or increased rental income.<\/p><\/div><\/details><div class=\"qtext\"><p>To meet his requirement, Brown is least likely to invest in:<\/p><\/div>", "subj": "alternatives"}, {"n": 66, "q": "Which of the following aspects is Brown most likely required to evaluate while performing due diligence on the warehouse REIT investment?", "opts": ["The location of the warehouses and good infrastructure are in the location.", "Warehouse’s senior management experience and skills.", "Short-term leases can be positive or negative, depending on economic conditions."], "ans": "A", "expl": "When conducting due diligence for a warehouse REIT investment, assessing the location of the warehouses and the quality of infrastructure is crucial because a prime location with strong infrastructure can ensure smooth operations, better accessibility, and higher demand for leasing. Warehouses in desirable locations tend to have higher valuations and attract tenants, contributing to stable rental income. Warehouses in regions with good transportation networks and proximity to major commercial areas are more appealing to tenants. B is incorrect. While management expertise is relevant in evaluating REOCs, REITs primarily focus on property performance and leasing income rather than operational decision-making at the subsidiary level. The warehouse's management is not a direct priority in this context. C is incorrect. Lease structures may be analyzed during due diligence, but this is more relevant for broader market conditions rather than specifically evaluating the REIT itself. Lease terms influence income stability but are secondary to factors like location and infrastructure.", "explhtml": "<p>When conducting due diligence for a warehouse REIT investment, assessing the location of the warehouses and the quality of infrastructure is crucial because a prime location with strong infrastructure can ensure smooth operations, better accessibility, and higher demand for leasing. Warehouses in desirable locations tend to have higher valuations and attract tenants, contributing to stable rental income. Warehouses in regions with good transportation networks and proximity to major commercial areas are more appealing to tenants.<\/p><p><b>B is incorrect.<\/b> While management expertise is relevant in evaluating REOCs, REITs primarily focus on property performance and leasing income rather than operational decision-making at the subsidiary level. The warehouse&#x27;s management is not a direct priority in this context.<\/p><p><b>C is incorrect.<\/b> Lease structures may be analyzed during due diligence, but this is more relevant for broader market conditions rather than specifically evaluating the REIT itself. Lease terms influence income stability but are secondary to factors like location and infrastructure.<\/p><p class=\"los\">Alternative Investments, Learning Module 3: Investments in Real Estate Through Publicly Traded Securities, LOS 3 (a) Discuss types of publicly traded real estate securities.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 17 · Câu 65–68 · Darlene Brown<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darlene Brown, CFA, is the Senior Portfolio Manager at Douglas &amp; Page Investments. Brown is<\/p><p>looking to add real estate to the company’s portfolio, and she has narrowed it down to three<\/p><p>investments: Direct real estate investment, real estate investment trust (REIT), and a real estate<\/p><p>operating company (REOC). Brown aims to achieve the highest level of diversification possible<\/p><p>while selecting an investment free from restrictions. Moreover, he seeks an option supporting<\/p><p>various leverage structures to enhance returns.<\/p><p>Additionally, Brown wants to incorporate real estate into his personal investment portfolio.<\/p><p>However, his limited financial resources raise concerns about whether he can afford such an<\/p><p>investment.<\/p><p>Finally, Brown analyzes the distinctions between investing in a REIT and a REOC, focusing on<\/p><p>market valuations, equity capital access, and tax implications. He plans to present his findings to<\/p><p>John Clark, a colleague and Excel&#x27;s fixed-income advisor.<\/p><p>Brown opts to invest in a warehouse REIT. This REIT owns the warehouse properties but leases<\/p><p>them out entirely to taxable REIT subsidiaries. These subsidiaries manage the operations and<\/p><p>return the rental income to the parent REIT. Exhibit 1 outlines key data for evaluating the REIT<\/p><p>investment using the net asset value (NAV) method.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0095.webp\" style=\"max-width:min(100%,376px)\" alt=\"Exhibit 1: NAV Approach Shares outstanding 120,000 NOI (Next 12 Months) $925,650 Prepaid assets, including goodwill $22,890 Cash and cash equivalents $62,340 Deferred tax assets $36,780 Goodwill $56,000 Land held for future development $36,310 Intangible assets $12,640 Other liabilities $180,000 Tot\"><p>Clark asks Brown, “Why would a REIT trade at a discount to its NAV?” To which Brown responds<\/p><p>with the following reasons:<\/p><p>Reason 1: A lack of investor confidence<\/p><p>Reason 2: REIT-specific issues such as high occupancy rates or increased rental income.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following aspects is Brown most likely required to evaluate while performing due diligence on the warehouse REIT investment?<\/p><\/div>", "subj": "alternatives"}, {"n": 67, "q": "Based on the data in Exhibit 1, the net asset value per share (NAVPS) of the warehouse REIT is closest to:", "opts": ["$ 47.31", "$ 57.81", "$ 55.55"], "ans": "C", "expl": "The net asset value per share (NAVPS) of the warehouse REIT is calculated by first determining the total net asset value (NAV) and then dividing it by the number of shares outstanding. The NAV is calculated by adding the value of all assets and subtracting the liabilities. The estimated value of the operating real estate is derived by dividing the estimated next 12 months cash net operating income (NOI) by the assumed capitalization rate (cap rate). The formula for the estimated value of operating real estate is given by: Adding the other assets (cash and cash equivalents, land held for future development, and prepaid assets) and subtracting the total debt and other liabilities gives the NAV: Finally, dividing the NAV by the number of shares outstanding yields the NAVPS: A is incorrect. It does not subtract the total debt in the NAV calculation. NAV = $7,713,750 + $62, 340 + $36, 310 + $22, 890 −$180, 000 = $5,676, 890 Finally, dividing the NAV by the number of shares outstanding yields the NAVPS: C is incorrect. It does not subtract the other liabilities in the NAV calculation. NAV = $7,713,750 + $62, 340 + $36, 310 + $22, 890 −$898, 200 = $6,937, 180 Finally, dividing the NAV by the number of shares outstanding yields the NAVPS:", "explhtml": "<p>The net asset value per share (NAVPS) of the warehouse REIT is calculated by first determining the total net asset value (NAV) and then dividing it by the number of shares outstanding. The NAV is calculated by adding the value of all assets and subtracting the liabilities. The estimated value of the operating real estate is derived by dividing the estimated next 12 months cash net operating income (NOI) by the assumed capitalization rate (cap rate). The formula for the estimated value of operating real estate is given by:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0096.webp\" style=\"max-width:min(100%,618px)\" alt=\"NOI $925, 650 Estimated value of operating real estate = = = $7,713,750 (Cap Rate) (12%)\"><p>Adding the other assets (cash and cash equivalents, land held for future development, and prepaid assets) and subtracting the total debt and other liabilities gives the NAV:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0097.webp\" style=\"max-width:min(100%,708px)\" alt=\"NAV = $7,713, 750 + $62, 340 + $36, 310 + $22, 890 −$989, 200 −$180, 000 = $6,666,090\"><p>Finally, dividing the NAV by the number of shares outstanding yields the NAVPS:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0098.webp\" style=\"max-width:min(100%,402px)\" alt=\"NAV ($6, 666, 090) NAVPS = = = $55.55 Share Outstanding 120, 000\"><p><b>A is incorrect.<\/b> It does not subtract the total debt in the NAV calculation.<\/p><p>NAV = $7,713,750 + $62, 340 + $36, 310 + $22, 890 −$180, 000 = $5,676, 890<\/p><p>Finally, dividing the NAV by the number of shares outstanding yields the NAVPS:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/ap08/f0099.webp\" style=\"max-wid
