tures per year of $2.5 million. Increase in working capital per year of $1.0 million. Principal repayments on debt per year of $1.5 million. The value per share of Symphony Publishing is approximately:", "opts": ["$11.21.", "$112.10.", "$14.10."], "ans": "A", "expl": "Step 1: Calculate each year's FCFE and discount at the required return. FCFE = net income + depreciation − capital expenditures − increase in working capital − principal repayments + new debt issues Year 1: 10.0 + 3.0 − 2.5 − 1.0 − 1.5 = 8.0, PV = 7.08 = 8.0 / (1.13)¹, or FV = −8.0, I = 13, PMT = 0, N = 1, Compute PV Year 2: 10.0 × 1.10 + 3.0 − 2.5 − 1.0 − 1.5 = 9.0, PV = 7.05 = 9.0 / (1.13)², or FV = −9.0, I = 13, PMT = 0, N = 2, Compute PV Year 3: 10.0 × (1.10)² + 3.0 − 2.5 − 1.0 − 1.5 = 10.10 PV = 7.00 = 10.10 / (1.13)³, or FV = −10.10, I = 13, PMT = 0, N = 3, Compute PV Step 2: Calculate Present Value of final cash flow times FCFE multiple. Value at end of year 3 = FCFE3 × multiple = 10.10 × 13 = 131.30 PV = 91.00 = 131.30 / (1.13)³ , or using calculator, N = 3, FV = −131.30, I = 13, PMT = 0, Compute PV Step 3: Calculate per share value. Add up PV of FCFE and end value and divide by number of shares outstanding = (7.08 + 7.05 + 7.00 + 91.0) / 10.0 = 11.21", "explhtml": "<p>Step 1: Calculate each year&#x27;s FCFE and discount at the required return.<\/p><p>FCFE = net income + depreciation − capital expenditures − increase in working capital − principal repayments + new debt issues Year 1: 10.0 + 3.0 − 2.5 − 1.0 − 1.5 = 8.0, PV = 7.08 = 8.0 / (1.13)<sup>1<\/sup>, or FV = −8.0, I = 13, PMT = 0, N = 1, Compute PV Year 2: 10.0 × 1.10 + 3.0 − 2.5 − 1.0 − 1.5 = 9.0, PV = 7.05 = 9.0 / (1.13)<sup>2<\/sup>, or FV = −9.0, I = 13, PMT = 0, N = 2, Compute PV Year 3: 10.0 × (1.10)<sup>2<\/sup> + 3.0 − 2.5 − 1.0 − 1.5 = 10.10 PV = 7.00 = 10.10 / (1.13)<sup>3<\/sup>, or FV = −10.10, I = 13, PMT = 0, N = 3, Compute PV<\/p><p>Step 2: Calculate Present Value of final cash flow times FCFE multiple.<\/p><p>Value at end of year 3 = FCFE3 × multiple = 10.10 × 13 = 131.30 PV = 91.00 = 131.30 / (1.13)<sup>3<\/sup> , or using calculator, N = 3, FV = −131.30, I = 13, PMT = 0, Compute PV<\/p><p>Step 3: Calculate per share value.<\/p><p>Add up PV of FCFE and end value and divide by number of shares outstanding = (7.08 + 7.05 + 7.00 + 91.0) / 10.0 = 11.21<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Using the information below, value the stock of Symphony Publishing, Inc. using the free cash flow from equity (FCFE) valuation method.<\/p><p>Required return of 13.0%. Value at the end of year 3 of 13 times FCFE<sub>3<\/sub>. Shares outstanding: 10.0 million. Net income in year 1 of $10.0 million, projected to grow at 10% for the next two years. Depreciation per year of $3.0 million. Capital Expenditures per year of $2.5 million. Increase in working capital per year of $1.0 million. Principal repayments on debt per year of $1.5 million.<\/p><p>The value per share of Symphony Publishing is approximately:<\/p><\/div>", "subj": "equity"}, {"n": 62, "q": "Assuming a constant debt-to-asset ratio, the base year FCFE is closest to:", "opts": ["€3.00.", "€3.80.", "€4.85."], "ans": "B", "expl": "Base-year FCFE = EPS − (capital expenditures − depreciation) × (1 − debt ratio) − increase in working capital × (1 − debt ratio) = €4.50 − (€3.00 − €2.75)(1 − 0.30) − €0.75(1 − 0.30) = €3.80.", "explhtml": "<p>Base-year FCFE = EPS − (capital expenditures − depreciation) × (1 − debt ratio) − increase in working capital × (1 − debt ratio) = €4.50 − (€3.00 − €2.75)(1 − 0.30) − €0.75(1 − 0.30) = €3.80.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 62–65<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"kq-note\">Câu thuộc item set (câu 62–65). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Assuming a constant debt-to-asset ratio, the base year FCFE is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 63, "q": "Using the stable-growth FCFE model as suggested by Analyst #1, the value of Hiller stock is closest to:", "opts": ["€51.58.", "€54.29.", "€57.00."], "ans": "C", "expl": "Value per share = (€3.80 × 1.05) / (0.12 − 0.05) = €57.00.", "explhtml": "<p>Value per share = (€3.80 × 1.05) / (0.12 − 0.05) = €57.00.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 62–65<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>Using the stable-growth FCFE model as suggested by Analyst #1, the value of Hiller stock is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 64, "q": "Based on Analyst #2's estimates, the sum of the terminal value plus the FCFE for year 6 is closest to:", "opts": ["€75.80.", "€60.70.", "€82.40."], "ans": "C", "expl": "Estimates for the future FCFE based on supplied growth rates are: Terminal value year 6 = 6.818/(12.0% − 3.0%) = €75.76 The nominal cash flow for year 6 is €75.76 + €6.62 = €82.38, which is the terminal cash flow plus the FCFE value for the year.", "explhtml": "<p>Estimates for the future FCFE based on supplied growth rates are:<\/p><img class=\"pimg\" src=\"l2img/kq/r19-aecc54bb0a.png\" style=\"max-width:min(100%,607px)\" loading=\"lazy\" alt=\"\"><p>Terminal value year 6 = 6.818/(12.0% − 3.0%) = €75.76 The nominal cash flow for year 6 is €75.76 + €6.62 = €82.38, which is the terminal cash flow plus the FCFE value for the year.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 62–65<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>Based on Analyst #2&#x27;s estimates, the sum of the terminal value plus the FCFE for year 6 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 65, "q": "Based on Analyst #2's estimates, the value of Hiller stock is closest to:", "opts": ["€60.70.", "€59.70.", "€57.00."], "ans": "A", "expl": "Terminal value year 6 = 6.818/(12.0% − 3.0%) = €75.76 For the calculator find NPV: CF0 = 0, CF1 = €4.33, CF2 = €4.87, CF3 = €5.48, CF4 = €5.89, CF5 = €6.34, CF6 = €82.38, I/Y = 12. The result is €60.73.", "explhtml": "<img class=\"pimg\" src=\"l2img/kq/r19-f35176ddda.png\" style=\"max-width:min(100%,608px)\" loading=\"lazy\" alt=\"\"><p>Terminal value year 6 = 6.818/(12.0% − 3.0%) = €75.76 For the calculator find NPV: CF0 = 0, CF1 = €4.33, CF2 = €4.87, CF3 = €5.48, CF4 = €5.89, CF5 = €6.34, CF6 = €82.38, I/Y = 12. The result is €60.73.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 62–65<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>Based on Analyst #2&#x27;s estimates, the value of Hiller stock is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 66, "q": "Using the information available in Exhibit 1, Operating Cash Flow (CFO) for Fishy Discs is closest to?", "opts": ["£73,000.", "£75,000.", "£85,000."], "ans": "C", "expl": "CFO = NI + NCC – WCINV Non-Cash Charges + Depreciation  14,000 – Gain on asset disposal (20,000) + Δ Deferred tax liability  10,000 | Net impact  4,000 Working Capital Investment 20x9  20x8 | CA – cash and investments  30,000  32,000 | CL – debt instruments and dividends payable  44,000  40,000 | Working capital  (14,000) (8,000) | ∆ in working capital  –£6,000 Note that the change in the deferred tax liability (DTL) is only included, as it is not expected to reverse. A DTL that is expected to reverse in the near term would be ignored. Whilst the DTL represents a boost to operating cash flows when it is created, it will reduce cash flows when it reverses. These two cash flow effects off set and as a result, it is best to ignore the DTL when estimating free cash flow if it is expected to reverse in the short run. CF0 = 75,000 + 4,000 + 6,000 = £85,000", "explhtml": "<p>CFO = NI + NCC – WC<sub>INV<\/sub><\/p><p>Non-Cash Charges + Depreciation &nbsp; 14,000<\/p><p>– Gain on asset disposal (20,000)<\/p><div class=\"tbl\"><table><tr><td>+ Δ Deferred tax liability<\/td><td>10,000<\/td><\/tr><tr><td>Net impact<\/td><td>4,000<\/td><\/tr><\/table><\/div><p>Working Capital Investment<\/p><div class=\"tbl\"><table><tr><td>20x9<\/td><td>20x8<\/td><\/tr><tr><td>CA – cash and investments<\/td><td>30,000<\/td><td>32,000<\/td><\/tr><tr><td>CL – debt instruments and dividends payable<\/td><td>44,000<\/td><td>40,000<\/td><\/tr><tr><td>Working capital<\/td><td>(14,000) (8,000)<\/td><\/tr><tr><td>∆ in working capital<\/td><td>–£6,000<\/td><\/tr><\/table><\/div><p>Note that the change in the deferred tax liability (DTL) is only included, as it is not expected to reverse. A DTL that is expected to reverse in the near term would be ignored. Whilst the DTL represents a boost to operating cash flows when it is created, it will reduce cash flows when it reverses. These two cash flow effects off set and as a result, it is best to ignore the DTL when estimating free cash flow if it is expected to reverse in the short run. CF0 = 75,000 + 4,000 + 6,000 = £85,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 66–71). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Using the information available in Exhibit 1, Operating Cash Flow (CFO) for Fishy Discs is closest to?<\/p><\/div>", "subj": "equity"}, {"n": 67, "q": "Using the information available in Exhibit 1, capital expenditure for Fishy Discs is closest to?", "opts": ["£20,000.", "£30,000.", "£50,000."], "ans": "A", "expl": "FCINV = change in carrying value + depⁿ expense – gain on disposal FCINV = 26,000 + 14,000 – 20,000 = 20,000 Alternatively Compute additions to PP&E as a residual figure: FCINV computation PP&E 20x8  202,000  Proceeds (plug)  30,000 | Depreciation  (14,000) Carrying value  (10,000) | Disposal  (10,000) Gain/(loss)  20,000 | Additions (plug)  50,000 | PP&E 20X9  228,000 FCINV = £50,000 – £30,000 = £20,000 Note that additions and proceeds have been computed as residual (balancing) figures.", "explhtml": "<p>FC<sub>INV<\/sub> = change in carrying value + dep<sup>n<\/sup> expense – gain on disposal<\/p><p>FC<sub>INV<\/sub> = 26,000 + 14,000 – 20,000 = 20,000<\/p><p>Alternatively Compute additions to PP&amp;E as a residual figure:<\/p><p>FC<sub>INV<\/sub> computation<\/p><div class=\"tbl\"><table><tr><td>PP&amp;E 20x8<\/td><td>202,000<\/td><td>Proceeds (plug)<\/td><td>30,000<\/td><\/tr><tr><td>Depreciation<\/td><td>(14,000) Carrying value<\/td><td>(10,000)<\/td><\/tr><tr><td>Disposal<\/td><td>(10,000) Gain/(loss)<\/td><td>20,000<\/td><\/tr><tr><td>Additions (plug)<\/td><td>50,000<\/td><\/tr><tr><td>PP&amp;E 20X9<\/td><td>228,000<\/td><\/tr><\/table><\/div><p>FCINV = £50,000 – £30,000 = £20,000<\/p><p>Note that additions and proceeds have been computed as residual (balancing) figures.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Using the information available in Exhibit 1, capital expenditure for Fishy Discs is closest to?<\/p><\/div>", "subj": "equity"}, {"n": 68, "q": "Assuming a CFO figure of £75,000 and capital expenditure of £20,000, Fishy Discs free cash flow to the firm for 20x9 is closest to?", "opts": ["£55,600.", "£65,000.", "£75,600."], "ans": "A", "expl": "FCFF = CFO + interest (1 – T) – FCINV FCFF = £75,000 + £1,000 (1 – 0.4) – £20,000 = £55,600", "explhtml": "<p>FCFF = CFO + interest (1 – T) – FC<sub>INV<\/sub><\/p><p>FCFF = £75,000 + £1,000 (1 – 0.4) – £20,000 = £55,600<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Assuming a CFO figure of £75,000 and capital expenditure of £20,000, Fishy Discs free cash flow to the firm for 20x9 is closest to?<\/p><\/div>", "subj": "equity"}, {"n": 69, "q": "Using only the corporate finance firm's data in Exhibit 2 and their growth assumptions, the value of Fishy Discs Ltd.'s equity is closest to?", "opts": ["£2,033,000.", "£3,075,000.", "£3,105,000."], "ans": "B", "expl": "Using the 3 stage DCF model: CF1 = £84,000 CF2 = £94,080 CF3 = £105,370 CF4 = £118,014 + £708,084 + £3,068,364 I = 8 CPT →NPV = £3,104,628 Firm value = £3,104,628 Equity value = firm value – debt value £3,074,628 = £3,104,628 – £30,000", "explhtml": "<p>Using the 3 stage DCF model:<\/p><img class=\"pimg\" src=\"l2img/kq/r19-2af634b738.png\" style=\"max-width:min(100%,555px)\" loading=\"lazy\" alt=\"\"><p>CF1 = £84,000 CF2 = £94,080 CF3 = £105,370 CF4 = £118,014 + £708,084 + £3,068,364 I = 8 CPT →NPV = £3,104,628<\/p><p>Firm value = £3,104,628 Equity value = firm value – debt value £3,074,628 = £3,104,628 – £30,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Using only the corporate finance firm&#x27;s data in Exhibit 2 and their growth assumptions, the value of Fishy Discs Ltd.&#x27;s equity is closest to?<\/p><\/div>", "subj": "equity"}, {"n": 70, "q": "How many on of Tony's concerns are valid?", "opts": ["Both.", "Neither.", "Only concern 2."], "ans": "A", "expl": "Concern 1: He is correct that declines in inventory give one off boosts to cash flow from operations and hence free cash flow. In addition, it is unlikely that Fishy Discs inventory will decline in future periods given we are expecting growth of 12% in the near term. Concern 2: The corporate finance firm are using a three-stage model with declining growth after four years. The model takes six years for growth to decline to sustainable levels. Given that Fishy Discs will lose its exclusivity agreement with the U.S. producer in four years, it is likely that the decline in growth will be far more rapid. Once barriers to entry are removed growth will decline from 12% to 4% far more rapidly than is being modelled. For companies that sustain economic profit due barriers to entry such as patents, copyrights and other agreements using a two stage model may model the decline in growth due to an influx in competition more accurately.", "explhtml": "<p>Concern 1: He is correct that declines in inventory give one off boosts to cash flow from operations and hence free cash flow. In addition, it is unlikely that Fishy Discs inventory will decline in future periods given we are expecting growth of 12% in the near term. Concern 2: The corporate finance firm are using a three-stage model with declining growth after four years. The model takes six years for growth to decline to sustainable levels. Given that Fishy Discs will lose its exclusivity agreement with the U.S. producer in four years, it is likely that the decline in growth will be far more rapid. Once barriers to entry are removed growth will decline from 12% to 4% far more rapidly than is being modelled. For companies that sustain economic profit due barriers to entry such as patents, copyrights and other agreements using a two stage model may model the decline in growth due to an influx in competition more accurately.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>How many on of Tony&#x27;s concerns are valid?<\/p><\/div>", "subj": "equity"}, {"n": 71, "q": "How many of the FCFF definitions, in Exhibit 3, that Tony is studying are accurate?", "opts": ["Both.", "Neither.", "Only FCFF from EBIT."], "ans": "C", "expl": "FCFF = EBITDA(1 – T) + (D × T) – FCINV – WCINV Note that the formulae given in the question is incorrect as it adds back depreciation rather than the tax shield on depreciation. It should be noted that other NCC might need to be adjusted for in practice.", "explhtml": "<p>FCFF = EBITDA(1 – T) + (D × T) – FC<sub>INV<\/sub> – WC<sub>INV<\/sub><\/p><p>Note that the formulae given in the question is incorrect as it adds back depreciation rather than the tax shield on depreciation. It should be noted that other NCC might need to be adjusted for in practice.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 66–71<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.h<\/div><div class=\"qtext\"><p>How many of the FCFF definitions, in Exhibit 3, that Tony is studying are accurate?<\/p><\/div>", "subj": "equity"}, {"n": 72, "q": "SOX Inc. expects high growth in the next 4 years before slowing to a stable future growth of 3%. The firm is assumed to pay no dividends in the near future and has the following forecasted free cash flow to equity (FCFE) information on a per share basis in the high-growth period:  Year 1 Year 2 Year 3 Year 4 FCFE $3.05 $4.10 $5.24 $6.71 High-growth period assumptions: SOX Inc.'s target debt ratio is 40% and a beta of 1.3. The long-term Treasury Bond Rate is 4.0%, and the expected equity risk premium is 6%. Stable-growth period assumptions: SOX Inc.'s target debt ratio is 40% and a beta of 1.0. The long-term Treasury Bond Rate is 4.0% and the expected equity risk premium is 6%. Capital expenditures are assumed to equal depreciation. In year 5, earnings are $8.10 per share while the change in working capital is $2.00 per share. Earnings and working capital are expected to grow by 3% a year in the future. In year 5, what is the free cash flow to equity (FCFE) for SOX Inc.?", "opts": ["$6.10.", "$7.30.", "$6.90."], "ans": "C", "expl": "In year 5, FCFE = Earnings per share − (Capital Expenditures − Depreciation) (1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 8.10 − 0(1 − 0.4) − 2.00(1 − 0.4) = 6.90.", "explhtml": "<p>In year 5, FCFE = Earnings per share − (Capital Expenditures − Depreciation) (1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 8.10 − 0(1 − 0.4) − 2.00(1 − 0.4) = 6.90.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>SOX Inc. expects high growth in the next 4 years before slowing to a stable future growth of 3%. The firm is assumed to pay no dividends in the near future and has the following forecasted free cash flow to equity (FCFE) information on a per share basis in the high-growth period:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><\/tr><tr><td>FCFE<\/td><td>$3.05<\/td><td>$4.10<\/td><td>$5.24<\/td><td>$6.71<\/td><\/tr><\/table><\/div><p>High-growth period assumptions:<\/p><p>SOX Inc.&#x27;s target debt ratio is 40% and a beta of 1.3. The long-term Treasury Bond Rate is 4.0%, and the expected equity risk premium is 6%.<\/p><p>Stable-growth period assumptions:<\/p><p>SOX Inc.&#x27;s target debt ratio is 40% and a beta of 1.0. The long-term Treasury Bond Rate is 4.0% and the expected equity risk premium is 6%. Capital expenditures are assumed to equal depreciation. In year 5, earnings are $8.10 per share while the change in working capital is $2.00 per share. Earnings and working capital are expected to grow by 3% a year in the future.<\/p><p>In year 5, what is the free cash flow to equity (FCFE) for SOX Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 73, "q": "Regarding statements 1 and 2, are Ballmer's interpretations of free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) CORRECT?", "opts": ["No, only one interpretation is correct.", "Yes, both interpretations are correct.", "No, neither interpretation is correct."], "ans": "C", "expl": "Free cash flow to the firm (FCFF) is the cash flows that are free to investors after cash operating expenses (including taxes but excluding interest expense), working capital investments, and fixed capital investments have been made. Free cash flow to equity (FCFE) is FCFF less interest payments to bondholders and net borrowing from bondholders.", "explhtml": "<p>Free cash flow to the firm (FCFF) is the cash flows that are free to investors after cash operating expenses (including taxes but excluding interest expense), working capital investments, and fixed capital investments have been made. Free cash flow to equity (FCFE) is FCFF less interest payments to bondholders and net borrowing from bondholders.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 73–76<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 73–76). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Regarding statements 1 and 2, are Ballmer&#x27;s interpretations of free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) CORRECT?<\/p><\/div>", "subj": "equity"}, {"n": 74, "q": "Which of the following statements regarding forecasting FCFE using the components of free cash flow method and net borrowing is most accurate?", "opts": ["Net income already accounts for interest expense; therefore, net borrowing is not needed.", "Investment in fixed capital and net borrowing are assumed to offset each other.", "The target debt-to-asset ratio accounts for the financing of new investment in fixed capital and working capital."], "ans": "C", "expl": "When forecasting FCFE, it is common to assume that a firm will maintain a target debt-to-asset ratio for new investments in fixed capital and working capital. Based on this assumption, the formula for forecasting FCFE is: FCFE = NI − [(1 − DR) × (FCInv − Dep)] − [(1 − DR) × WCInv] By multiplying the fixed capital and working capital investments by one minus the target debt-to-asset ratio, you are left with the investment amount less the amount financed by debt, which is the net borrowing amount. Therefore, this formula accounts for net borrowing through the target debt-to-asset ratio.", "explhtml": "<p>When forecasting FCFE, it is common to assume that a firm will maintain a target debt-to-asset ratio for new investments in fixed capital and working capital. Based on this assumption, the formula for forecasting FCFE is:<\/p><p>FCFE = NI − [(1 − DR) × (FCInv − Dep)] − [(1 − DR) × WCInv]<\/p><p>By multiplying the fixed capital and working capital investments by one minus the target debt-to-asset ratio, you are left with the investment amount less the amount financed by debt, which is the net borrowing amount. Therefore, this formula accounts for net borrowing through the target debt-to-asset ratio.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 73–76<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Which of the following statements regarding forecasting FCFE using the components of free cash flow method and net borrowing is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 75, "q": "Should dividend-based and free cash flow from equity (FCFE) based valuations result in different equity values for a firm?", "opts": ["Yes, dividend-based valuations would be higher for firms with large, consistent dividends.", "No, both models should result in the same value.", "Yes, the free cash flow from equity valuation would be higher if there were a premium associated with control of the firm."], "ans": "C", "expl": "The ownership perspectives of dividend-based and FCFE based valuations are different. Dividend-based valuations take the perspective of minority shareholders, while FCFE based valuations take the perspective of an acquirer who will assume a controlling position in the firm. If investors were willing to pay a premium for a controlling position in the firm, then the equity value computed under the FCFE approach would be higher.", "explhtml": "<p>The ownership perspectives of dividend-based and FCFE based valuations are different. Dividend-based valuations take the perspective of minority shareholders, while FCFE based valuations take the perspective of an acquirer who will assume a controlling position in the firm. If investors were willing to pay a premium for a controlling position in the firm, then the equity value computed under the FCFE approach would be higher.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 73–76<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Should dividend-based and free cash flow from equity (FCFE) based valuations result in different equity values for a firm?<\/p><\/div>", "subj": "equity"}, {"n": 76, "q": "Which of the following statements regarding the effect a decrease in leverage has on a firm's free cash flow from equity (FCFE) is most accurate?", "opts": ["Current year FCFE decreases, but future FCFE will be increased.", "FCFE is unaffected by changes in leverage.", "Current year FCFE increases, but future FCFE will be reduced."], "ans": "A", "expl": "Changes in leverage do have a small effect on FCFE. A decrease in leverage will cause the current year FCFE to decrease through the repayment of debt. Future FCFE will be increased because interest expense will be lower.", "explhtml": "<p>Changes in leverage do have a small effect on FCFE. A decrease in leverage will cause the current year FCFE to decrease through the repayment of debt. Future FCFE will be increased because interest expense will be lower.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 73–76<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Which of the following statements regarding the effect a decrease in leverage has on a firm&#x27;s free cash flow from equity (FCFE) is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 77, "q": "On a per share basis for a firm: Sales are $10.00. Earnings per share (EPS) is $4.00. Depreciation is $3.00. After-tax interest is $2.40. Investment in working capital is $1.50. Investment in fixed capital is $2.00. What is the firm's expected free cash flow to the firm (FCFF) per share?", "opts": ["$7.50.", "$5.90.", "$2.90."], "ans": "B", "expl": "FCFF = EPS + net non-cash charges + after-tax interest − FCInv − WCInv FCFF= $4.00 + 3.00 +$2.40 − $2.00 −1.50 = $5.90", "explhtml": "<p>FCFF = EPS + net non-cash charges + after-tax interest − FCInv − WCInv FCFF= $4.00 + 3.00 +$2.40 − $2.00 −1.50 = $5.90<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>On a per share basis for a firm:<\/p><p>Sales are $10.00. Earnings per share (EPS) is $4.00. Depreciation is $3.00. After-tax interest is $2.40. Investment in working capital is $1.50. Investment in fixed capital is $2.00.<\/p><p>What is the firm&#x27;s expected free cash flow to the firm (FCFF) per share?<\/p><\/div>", "subj": "equity"}, {"n": 78, "q": "The stable-growth free cash flow to the firm (FCFF) model is most useful in valuing firms that:", "opts": ["are growing at a rate significantly lower than that of the overall economy.", "have capital expenditures that are significantly higher than depreciation.", "have capital expenditures that are not significantly higher than depreciation."], "ans": "C", "expl": "The stable-growth FCFF model is useful for valuing firms that are expected to have growth rates close to that of the overall economy. Since the rate of growth approximates that for the overall economy, these firms should have capital expenditures that are not significantly different than depreciation.", "explhtml": "<p>The stable-growth FCFF model is useful for valuing firms that are expected to have growth rates close to that of the overall economy. Since the rate of growth approximates that for the overall economy, these firms should have capital expenditures that are not significantly different than depreciation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The stable-growth free cash flow to the firm (FCFF) model is most useful in valuing firms that:<\/p><\/div>", "subj": "equity"}, {"n": 79, "q": "Which of the following is least likely to change as the firm changes leverage?", "opts": ["Free cash flows to firm (FCFF).", "Free cash flows to equity (FCFE).", "Weighted average cost of capital (WACC)."], "ans": "A", "expl": "The FCFFs are normally unaffected by the changes in leverage, as these are the cash flows before the debt payments.", "explhtml": "<p>The FCFFs are normally unaffected by the changes in leverage, as these are the cash flows before the debt payments.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Which of the following is least likely to change as the firm changes leverage?<\/p><\/div>", "subj": "equity"}, {"n": 80, "q": "Assuming that the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by net income if:", "opts": ["non-cash charges and interest charges are equal.", "non-cash charges and interest charges are zero.", "earnings before interest and taxes (EBIT) equals depreciation."], "ans": "B", "expl": "The answer is shown by the relationship between FCFF and net income: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv. Further: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv, which assumes that depreciation is the only non-cash charge.", "explhtml": "<p>The answer is shown by the relationship between FCFF and net income: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv. Further: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv, which assumes that depreciation is the only non-cash charge.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.h<\/div><div class=\"qtext\"><p>Assuming that the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by net income if:<\/p><\/div>", "subj": "equity"}, {"n": 81, "q": "Which of the following free cash flow to the firm (FCFF) models is most suited to analyze firms that are growing at a faster rate than the overall economy?", "opts": ["No growth FCFF model.", "High growth FCFF model.", "Two-stage FCFF model."], "ans": "C", "expl": "The two-stage FCFF model is most suited for analyzing firms growing at a rate faster than the overall economy. The two-stage model assumes a high rate of growth for an initial period, followed by an immediate jump to a constant, stable growth rate.", "explhtml": "<p>The two-stage FCFF model is most suited for analyzing firms growing at a rate faster than the overall economy. The two-stage model assumes a high rate of growth for an initial period, followed by an immediate jump to a constant, stable growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following free cash flow to the firm (FCFF) models is most suited to analyze firms that are growing at a faster rate than the overall economy?<\/p><\/div>", "subj": "equity"}, {"n": 82, "q": "Which of the following statements is least accurate? A firm's free cash flows to equity (FCFE) is the cash available to stockholders after funding:", "opts": ["capital expenditure requirements.", "dividend payments.", "debt principal repayments."], "ans": "B", "expl": "A firm's FCFE is the cash available to stockholders after funding capital expenditures and debt principal repayments.", "explhtml": "<p>A firm&#x27;s FCFE is the cash available to stockholders after funding capital expenditures and debt principal repayments.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Which of the following statements is least accurate? A firm&#x27;s free cash flows to equity (FCFE) is the cash available to stockholders after funding:<\/p><\/div>", "subj": "equity"}, {"n": 83, "q": "The stable-growth free cash flow to equity (FCFE) model is best suited for which of the following types of companies? Companies:", "opts": ["with significant barriers to entry.", "with patents that will not expire for 20 or more years.", "growing at a rate similar or less than the nominal growth rate of the economy."], "ans": "C", "expl": "Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the Stable Growth FCFE Model. The three-stage FCFE model is most suited to analyzing firms currently experiencing high growth that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level. The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry.", "explhtml": "<p>Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the Stable Growth FCFE Model. The three-stage FCFE model is most suited to analyzing firms currently experiencing high growth that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level. The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The stable-growth free cash flow to equity (FCFE) model is best suited for which of the following types of companies? Companies:<\/p><\/div>", "subj": "equity"}, {"n": 84, "q": "The following information pertains to the Harrisburg Tire Company (HTC) in 2000. Earnings (net income) = $600M. Dividends = $120M. Interest expense = $400M. Tax rate = 40%. Depreciation = $500M. Capital spending = $800M. Total assets = $10B (book value and market value). Debt = $4B (book value and market value). Equity = $6B (book value and market value). The firm's working capital needs are negligible, and they plan to continue to operate at their current capital structure. The free cash flow to the firm is:", "opts": ["$540M.", "$420M.", "$300M."], "ans": "A", "expl": "The free cash flow to the firm is: FCFF = Net income + (Interest expense)(1 − T) − Capital expenditures + Depreciation 600M + 400M(1 − 0.40) − 800M + 500M = 540M", "explhtml": "<p>The free cash flow to the firm is:<\/p><p>FCFF = Net income + (Interest expense)(1 − T) − Capital expenditures + Depreciation 600M + 400M(1 − 0.40) − 800M + 500M = 540M<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>The following information pertains to the Harrisburg Tire Company (HTC) in 2000.<\/p><p>Earnings (net income) = $600M. Dividends = $120M. Interest expense = $400M. Tax rate = 40%. Depreciation = $500M. Capital spending = $800M. Total assets = $10B (book value and market value). Debt = $4B (book value and market value). Equity = $6B (book value and market value).<\/p><p>The firm&#x27;s working capital needs are negligible, and they plan to continue to operate at their current capital structure.<\/p><p>The free cash flow to the firm is:<\/p><\/div>", "subj": "equity"}, {"n": 85, "q": "A firm's free cash flow to the firm (FCFF) in the most recent year is $80M and is expected to grow at 3% per year forever. If the firm has $100M in debt financing and its weighted average cost of capital is 10%. The value of the firm's equity using the single-stage FCFF model is:", "opts": ["$1,177M.", "$1,043M.", "$1,077M."], "ans": "C", "expl": "The value of the firm's equity is equal to the value of the firm minus the value of the debt. Firm value = $80M × 1.03 / (0.10 − 0.03) = $1,177M, so equity value is $1,177M − $100M = $1,077M.", "explhtml": "<p>The value of the firm&#x27;s equity is equal to the value of the firm minus the value of the debt. Firm value = $80M × 1.03 / (0.10 − 0.03) = $1,177M, so equity value is $1,177M − $100M = $1,077M.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>A firm&#x27;s free cash flow to the firm (FCFF) in the most recent year is $80M and is expected to grow at 3% per year forever. If the firm has $100M in debt financing and its weighted average cost of capital is 10%. The value of the firm&#x27;s equity using the single-stage FCFF model is:<\/p><\/div>", "subj": "equity"}, {"n": 86, "q": "An increase in financial leverage will cause free cash flow to equity (FCFE) to:", "opts": ["increase in the year the borrowing occurred.", "decrease or increase, depending on its circumstances.", "decrease in the year the borrowing occurred."], "ans": "A", "expl": "An increase in financial leverage will increase net borrowing and, hence, increase FCFE in the year the borrowing occurred because: FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.", "explhtml": "<p>An increase in financial leverage will increase net borrowing and, hence, increase FCFE in the year the borrowing occurred because: FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>An increase in financial leverage will cause free cash flow to equity (FCFE) to:<\/p><\/div>", "subj": "equity"}, {"n": 87, "q": "Free cash flow to equity valuation uses which discount rate?", "opts": ["Weighted average cost of capital.", "After-tax cost of debt.", "Cost of equity."], "ans": "C", "expl": "Free cash flow to equity valuation uses the opportunity cost relevant to stockholders, which is the cost of equity.", "explhtml": "<p>Free cash flow to equity valuation uses the opportunity cost relevant to stockholders, which is the cost of equity.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Free cash flow to equity valuation uses which discount rate?<\/p><\/div>", "subj": "equity"}, {"n": 88, "q": "Free cash flow to the firm valuation uses which discount rate?", "opts": ["Weighted average cost of capital.", "After-tax cost of debt.", "Cost of equity."], "ans": "A", "expl": "Free cash flow to the firm valuation uses the opportunity cost relevant to the overall firm, which is the weighted average cost of capital.", "explhtml": "<p>Free cash flow to the firm valuation uses the opportunity cost relevant to the overall firm, which is the weighted average cost of capital.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Free cash flow to the firm valuation uses which discount rate?<\/p><\/div>", "subj": "equity"}, {"n": 89, "q": "A firm has: Free cash flow to the firm = $4.0 million. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%. Value of the firm = $50.00 per share. What will happen to the value of the firm if the weighted average cost of capital increases to 12%?", "opts": ["The value will increase.", "The value will decrease.", "The value will remain the same."], "ans": "B", "expl": "Everything else being constant, an increase in the relevant required rate of return should decrease the value of the firm.", "explhtml": "<p>Everything else being constant, an increase in the relevant required rate of return should decrease the value of the firm.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>A firm has:<\/p><p>Free cash flow to the firm = $4.0 million. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%. Value of the firm = $50.00 per share.<\/p><p>What will happen to the value of the firm if the weighted average cost of capital increases to 12%?<\/p><\/div>", "subj": "equity"}, {"n": 90, "q": "The ownership perspective implicit in the dividend valuation approach is of:", "opts": ["a preferred stockholder.", "control.", "a common stockholder."], "ans": "C", "expl": "Dividends are most relevant to the stockholders who receive them and who have little control over their amount.", "explhtml": "<p>Dividends are most relevant to the stockholders who receive them and who have little control over their amount.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>The ownership perspective implicit in the dividend valuation approach is of:<\/p><\/div>", "subj": "equity"}, {"n": 91, "q": "The difference between free cash flow to equity (FCFE) and free cash flow to the firm (FCFF) is:", "opts": ["before-tax interest and net borrowing.", "earnings before interest and taxes (EBIT) less taxes.", "after-tax interest and net borrowing."], "ans": "C", "expl": "FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.", "explhtml": "<p>FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>The difference between free cash flow to equity (FCFE) and free cash flow to the firm (FCFF) is:<\/p><\/div>", "subj": "equity"}, {"n": 92, "q": "Which of the following is one of the differences between FCFE and FCFF? FCFF does not deduct:", "opts": ["operating expenses.", "working capital investment.", "interest payments to bondholders."], "ans": "C", "expl": "FCFF includes the cash available to all of the firm's investors, including bondholders. Therefore, interest payments to bondholders are not removed from revenues to derive FCFF. FCFE is FCFF minus interest payments to bondholders plus net borrowings from bondholders.", "explhtml": "<p>FCFF includes the cash available to all of the firm&#x27;s investors, including bondholders. Therefore, interest payments to bondholders are not removed from revenues to derive FCFF. FCFE is FCFF minus interest payments to bondholders plus net borrowings from bondholders.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 92–95<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"kq-note\">Câu thuộc item set (câu 92–95). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following is one of the differences between FCFE and FCFF? FCFF does not deduct:<\/p><\/div>", "subj": "equity"}, {"n": 93, "q": "Which of the following is the least likely reason for Carson's decision to use FCFE in valuing Overhaul rather than FCFF?", "opts": ["Overhaul’s capital structure is stable.", "FCFE is an easier and more straightforward calculation than FCFF.", "Overhaul’s debt ratio is significantly higher than the industry average."], "ans": "C", "expl": "The difference between FCFF and FCFE is related to capital structure and resulting interest expense. When the company's capital structure is relatively stable, FCFE is easier and more straightforward to use. FCFF is generally the best choice when FCFE is negative or the firm is highly leveraged. The fact that Overhaul's debt ratio is significantly higher than the industry average would argue against the use of FCFE. Hence, this is the least likely reason to favor FCFE.", "explhtml": "<p>The difference between FCFF and FCFE is related to capital structure and resulting interest expense. When the company&#x27;s capital structure is relatively stable, FCFE is easier and more straightforward to use. FCFF is generally the best choice when FCFE is negative or the firm is highly leveraged. The fact that Overhaul&#x27;s debt ratio is significantly higher than the industry average would argue against the use of FCFE. Hence, this is the least likely reason to favor FCFE.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 92–95<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>Which of the following is the least likely reason for Carson&#x27;s decision to use FCFE in valuing Overhaul rather than FCFF?<\/p><\/div>", "subj": "equity"}, {"n": 94, "q": "What is the expected growth rate in FCFF that Carson must have used to generate his valuation of $1.08 billion?", "opts": ["5%.", "7%.", "12%."], "ans": "B", "expl": "Since Firm Value = FCFF₁ / (WACC − g), we first need to determine FCFF₁, which is FCFF in 2006: FCFF = NI + NCC + [Int × (1 − tax rate)] – FCInv − WCInv = 16.9 + 80 + [34 × (1 − 0.35)] − (480 − 400) − [(55 − 70) − (50 − 50)] = 16.9 + 80 + 22.1 − 80 − (−15) = 54 Firm Value = FCFF₁ / (WACC − g) 1080 = 54 / (0.12 − x) [(1080)(0.12)] − 1080x = 54 129.6 − 1080x = 54 75.6 = 1080x 0.07 = x The expected growth rate in FCFF that Carson must have used is 7%.", "explhtml": "<p>Since Firm Value = FCFF<sub>1<\/sub> / (WACC − g), we first need to determine FCFF<sub>1<\/sub>, which is FCFF in 2006: FCFF = NI + NCC + [Int × (1 − tax rate)] – FCInv − WCInv<\/p><p>= 16.9 + 80 + [34 × (1 − 0.35)] − (480 − 400) − [(55 − 70) − (50 − 50)] = 16.9 + 80 + 22.1 − 80 − (−15) = 54 Firm Value = FCFF<sub>1<\/sub> / (WACC − g)<\/p><p>1080 = 54 / (0.12 − x) [(1080)(0.12)] − 1080x = 54 129.6 − 1080x = 54 75.6 = 1080x 0.07 = x<\/p><p>The expected growth rate in FCFF that Carson must have used is 7%.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 92–95<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>What is the expected growth rate in FCFF that Carson must have used to generate his valuation of $1.08 billion?<\/p><\/div>", "subj": "equity"}, {"n": 95, "q": "If Carson had estimated FCFE under the assumption that Overhaul Trucking maintains a target debt-to-asset ratio of 36 percent for new investments in fixed and working capital, what would be his forecast of 2006 FCFE?", "opts": ["$26.5 million.", "$9.6 million.", "$16.9 million."], "ans": "A", "expl": "FCFE = NI – [(1 − DR) × (FCInv − Dep)] − [(1 − DR) × WCInv] Where: DR = target debt to asset ratio FCFE = 16.9 − [(1 − 0.36) × (480 − 400 − 80)] − [(1 − 0.36) × ((55 − 70) − (50 − 50))] = 16.9 − (0.64 × 0) − (0.64 × (−15)) = 16.9 + 0 + 9.6 = 26.5", "explhtml": "<p>FCFE = NI – [(1 − DR) × (FCInv − Dep)] − [(1 − DR) × WCInv]<\/p><p>Where: DR = target debt to asset ratio<\/p><p>FCFE = 16.9 − [(1 − 0.36) × (480 − 400 − 80)] − [(1 − 0.36) × ((55 − 70) − (50 − 50))] = 16.9 − (0.64 × 0) − (0.64 × (−15)) = 16.9 + 0 + 9.6 = 26.5<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 92–95<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>If Carson had estimated FCFE under the assumption that Overhaul Trucking maintains a target debt-to-asset ratio of 36 percent for new investments in fixed and working capital, what would be his forecast of 2006 FCFE?<\/p><\/div>", "subj": "equity"}, {"n": 96, "q": "In using FCFE models, the assumption of growth should be:", "opts": ["independent from the assumptions of other variables.", "only consistent with the assumptions of capital spending and depreciation.", "consistent with assumptions of other variables."], "ans": "C", "expl": "The assumption of growth should be consistent with assumptions about other variables. Net capital expenditures (capital expenditures minus depreciation) and beta (risk) used to calculate required rate of return should be consistent with assumed growth rate.", "explhtml": "<p>The assumption of growth should be consistent with assumptions about other variables. Net capital expenditures (capital expenditures minus depreciation) and beta (risk) used to calculate required rate of return should be consistent with assumed growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>In using FCFE models, the assumption of growth should be:<\/p><\/div>", "subj": "equity"}, {"n": 97, "q": "A firm currently has sales per share of $10.00, and expects sales to grow by 25% next year. The net profit margin is expected to be 15%. Fixed capital investment net of depreciation is projected to be 65% of the sales increase, and working capital requirements are 15% of the projected sales increase. Debt will finance 45% of the investments in net capital and working capital. The company has an 11% required rate of return on equity. What is the firm's expected free cash flow to equity (FCFE) per share next year under these assumptions?", "opts": ["$0.77.", "$0.38.", "$1.88."], "ans": "A", "expl": "FCFE = net profit – NetFCInv – WCInv + DebtFin = $1.88 – $1.63 – 0.38 + 0.90 = 0.77", "explhtml": "<p>FCFE = net profit – NetFCInv – WCInv + DebtFin = $1.88 – $1.63 – 0.38 + 0.90 = 0.77<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>A firm currently has sales per share of $10.00, and expects sales to grow by 25% next year. The net profit margin is expected to be 15%. Fixed capital investment net of depreciation is projected to be 65% of the sales increase, and working capital requirements are 15% of the projected sales increase. Debt will finance 45% of the investments in net capital and working capital. The company has an 11% required rate of return on equity. What is the firm&#x27;s expected free cash flow to equity (FCFE) per share next year under these assumptions?<\/p><\/div>", "subj": "equity"}, {"n": 98, "q": "BOX, Inc., earned $4.55 per share last year. The firm had capital expenditures of $1.75 per share and depreciation expense of $1.05. BOX, Inc., has a target debt ratio of 0.25.  High-Growth Period Transitional Period Stable-Growth Period Duration 2 Years 5 Years  Earnings growth rate 45% Will decline 8% per\nyear to5% in the\nstable-growth period 5% Growth in capital\nexpenditures 30% Increases by 8% per\nyear Same $ amount as\nDepreciation Growth in depreciation 30% Increases by 13% per\nyear Same $ amount as\nCapital Expenditures Change in working capital Given Below Given Below $2.25 per share in Year\n8 Shareholder required\nreturn 25% 15% 10%  Yr 0 Yr 1 Yr 2 Yr 3 Yr 4 Yr 5 Yr 6 Yr 7 Earnings per share (EPS) 4.55 6.60 9.57 13.11 16.91 20.46 23.12 24.27 Capital expenditures 1.75 2.28 2.96 3.19 3.45 3.73 4.02 4.35 Depreciation 1.05 1.37 1.77 2.01 2.27 2.56 2.89 3.27 Change in working capital\n(WC) 0.90 1.10 1.40 1.60 1.80 2.00 2.20 2.10 Free cash flow to equity\n(FCFE)   7.63 11.01 14.67 18.08 20.62 21.89 What is the present value of BOX, Inc.?", "opts": ["$195.71.", "$212.91.", "$223.65."], "ans": "A", "expl": "Year 1 FCFE = Earnings per share − (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 6.60 − (2.28 − 1.37) (1 − 0.25) − (1.1)(1 − 0.25) = 5.09. Year 8 FCFE = Earnings per share − (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 24.27 × 1.05 − 0 − (2.25)(1 − 0.25) = 23.79. The Terminal Value (as of Year 7) = 23.79 / (0.10 − 0.05) = 475.80. The value of BOX, Inc., stock would be equal to: 5.09 / 1.25 + 7.63 / 1.25² + 11.01 / [(1.25)²(1.15)¹]+ 14.67 / [(1.25)²(1.15)²] + 18.08 / [(1.25)²(1.15)³] + 20.62 / [(1.25)²(1.15)⁴] + 21.89 / [(1.25)²(1.15)⁵] + 475.80 / [(1.25)²(1.15)⁵] = 4.07 + 4.88 + 6.13 + 7.10 + 7.61 + 7.55 + 6.97 + 151.40 = 195.71", "explhtml": "<p>Year 1 FCFE = Earnings per share − (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 6.60 − (2.28 − 1.37) (1 − 0.25) − (1.1)(1 − 0.25) = 5.09. Year 8 FCFE = Earnings per share − (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 24.27 × 1.05 − 0 − (2.25)(1 − 0.25) = 23.79. The Terminal Value (as of Year 7) = 23.79 / (0.10 − 0.05) = 475.80.<\/p><p>The value of BOX, Inc., stock would be equal to: 5.09 / 1.25 + 7.63 / 1.25<sup>2<\/sup> + 11.01 / [(1.25)<sup>2<\/sup>(1.15)<sup>1<\/sup>]+ 14.67 / [(1.25)<sup>2<\/sup>(1.15)<sup>2<\/sup>] + 18.08 / [(1.25)<sup>2<\/sup>(1.15)<sup>3<\/sup>] + 20.62 / [(1.25)<sup>2<\/sup>(1.15)<sup>4<\/sup>] + 21.89 / [(1.25)<sup>2<\/sup>(1.15)<sup>5<\/sup>] + 475.80 / [(1.25)<sup>2<\/sup>(1.15)<sup>5<\/sup>] =<\/p><p>4.07 + 4.88 + 6.13 + 7.10 + 7.61 + 7.55 + 6.97 + 151.40 = 195.71<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>BOX, Inc., earned $4.55 per share last year. The firm had capital expenditures of $1.75 per share and depreciation expense of $1.05. BOX, Inc., has a target debt ratio of 0.25.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>High-Growth Period<\/td><td>Transitional Period<\/td><td>Stable-Growth Period<\/td><\/tr><tr><td>Duration<\/td><td>2 Years<\/td><td>5 Years<\/td><td><\/td><\/tr><tr><td>Earnings growth rate<\/td><td>45%<\/td><td>Will decline 8% per<br>year to5% in the<br>stable-growth period<\/td><td>5%<\/td><\/tr><tr><td>Growth in capital<br>expenditures<\/td><td>30%<\/td><td>Increases by 8% per<br>year<\/td><td>Same $ amount as<br>Depreciation<\/td><\/tr><tr><td>Growth in depreciation<\/td><td>30%<\/td><td>Increases by 13% per<br>year<\/td><td>Same $ amount as<br>Capital Expenditures<\/td><\/tr><tr><td>Change in working capital<\/td><td>Given Below<\/td><td>Given Below<\/td><td>$2.25 per share in Year<br>8<\/td><\/tr><tr><td>Shareholder required<br>return<\/td><td>25%<\/td><td>15%<\/td><td>10%<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td><\/td><td>Yr 0<\/td><td>Yr 1<\/td><td>Yr 2<\/td><td>Yr 3<\/td><td>Yr 4<\/td><td>Yr 5<\/td><td>Yr 6<\/td><td>Yr 7<\/td><\/tr><tr><td>Earnings per share (EPS)<\/td><td>4.55<\/td><td>6.60<\/td><td>9.57<\/td><td>13.11<\/td><td>16.91<\/td><td>20.46<\/td><td>23.12<\/td><td>24.27<\/td><\/tr><tr><td>Capital expenditures<\/td><td>1.75<\/td><td>2.28<\/td><td>2.96<\/td><td>3.19<\/td><td>3.45<\/td><td>3.73<\/td><td>4.02<\/td><td>4.35<\/td><\/tr><tr><td>Depreciation<\/td><td>1.05<\/td><td>1.37<\/td><td>1.77<\/td><td>2.01<\/td><td>2.27<\/td><td>2.56<\/td><td>2.89<\/td><td>3.27<\/td><\/tr><tr><td>Change in working capital<br>(WC)<\/td><td>0.90<\/td><td>1.10<\/td><td>1.40<\/td><td>1.60<\/td><td>1.80<\/td><td>2.00<\/td><td>2.20<\/td><td>2.10<\/td><\/tr><tr><td>Free cash flow to equity<br>(FCFE)<\/td><td><\/td><td><\/td><td>7.63<\/td><td>11.01<\/td><td>14.67<\/td><td>18.08<\/td><td>20.62<\/td><td>21.89<\/td><\/tr><\/table><\/div><p>What is the present value of BOX, Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 99, "q": "The free cash flow to the firm (FCFF) for the current year is closest to:", "opts": ["$2.39 million.", "$2.31 million.", "$3.57 million."], "ans": "A", "expl": "The FCFF for the current year is [$6.00m × (1 − 0.40)] + $0.63m − $1.25m − $0.59m = $2.39m.", "explhtml": "<p>The FCFF for the current year is [$6.00m × (1 − 0.40)] + $0.63m − $1.25m − $0.59m = $2.39m.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 99–102<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 99–102). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The free cash flow to the firm (FCFF) for the current year is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 100, "q": "The estimated value of the firm is closest to:", "opts": ["$50 million.", "$47 million.", "$38 million."], "ans": "A", "expl": "The value of BIC using a stable-growth FCFF model is $49.95 million, calculated as: FCFF = [$6.00m × (1 − 0.40)] + $0.63m − $1.25m − $0.59m. = $2.39m WACC = (0.60 × 0.16) + [0.40 × 0.105 × (1 × 0.40)] = 12.12%. Estimated value = ($2.39m × 1.07) / (0.1212 − 0.07)= $49.95 million.", "explhtml": "<p>The value of BIC using a stable-growth FCFF model is $49.95 million, calculated as:<\/p><p>FCFF = [$6.00m × (1 − 0.40)] + $0.63m − $1.25m − $0.59m. = $2.39m WACC = (0.60 × 0.16) + [0.40 × 0.105 × (1 × 0.40)] = 12.12%. Estimated value = ($2.39m × 1.07) / (0.1212 − 0.07)= $49.95 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 99–102<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The estimated value of the firm is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 101, "q": "If the estimated value of the free cash to the firm (FCFF) for year 0 is $2.4 million, the value per share of BIC stock, based on the stable growth model, is closest to:", "opts": ["$39.", "$55.", "$61."], "ans": "C", "expl": "FCFE = FCFF – Interest expense × (1 − tax rate) + Net borrowing = $2.40 million – [$2.00 million × (1 − 0.40)] + $3.30 million − $2.85 million = $1.65 million. The value of equity is: [$1.65 million × (1+0.10) ] /(0.16 − 0.10) = $30.25 million. On a per share basis: $30.25 million/500,000 = $60.50", "explhtml": "<p>FCFE = FCFF – Interest expense × (1 − tax rate) + Net borrowing = $2.40 million – [$2.00 million × (1 − 0.40)] + $3.30 million − $2.85 million = $1.65 million. The value of equity is: [$1.65 million × (1+0.10) ] /(0.16 − 0.10) = $30.25 million. On a per share basis: $30.25 million/500,000 = $60.50<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 99–102<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>If the estimated value of the free cash to the firm (FCFF) for year 0 is $2.4 million, the value per share of BIC stock, based on the stable growth model, is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 102, "q": "The current market price of BIC is $62.50 per share, and the current year's FCFE is $1.75 million. Using a two-stage growth model to find the estimated the firm's value, the current market price BIC is most accurately described as:", "opts": ["overvalued.", "undervalued.", "fairly valued."], "ans": "A", "expl": "FCFE = FCFF − Interest expense × (1 − T) + New borrowing. Year 0 1 2 3 4 Growth rate  25.0% 25.0% 25.0% 6.0% FCFE in mil$ $1.750 $2.188 $2.734 $3.418 $3.623 The terminal value is $3,623/(0.16 – 0.06) = $36,230 million. The calculator inputs: CF0 = 0, CF1 = $2,188, CF2 = $2,734, CF3 = $3,418 + $36,230 = $39,648, I = 16, NPV = $29.319 million. Per share price is $29,319,000/500,000 = $58.64. The stock appears to be overvalued at the current market price of $62.50 per share, as our estimated value of $58.64 suggests that the market price is too high.", "explhtml": "<p>FCFE = FCFF − Interest expense × (1 − T) + New borrowing.<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><td>Growth rate<\/td><td><\/td><td>25.0%<\/td><td>25.0%<\/td><td>25.0%<\/td><td>6.0%<\/td><\/tr><tr><td>FCFE in mil$<\/td><td>$1.750<\/td><td>$2.188<\/td><td>$2.734<\/td><td>$3.418<\/td><td>$3.623<\/td><\/tr><\/table><\/div><p>The terminal value is $3,623/(0.16 – 0.06) = $36,230 million. The calculator inputs: CF0 = 0, CF1 = $2,188, CF2 = $2,734, CF3 = $3,418 + $36,230 = $39,648, I = 16, NPV = $29.319 million. Per share price is $29,319,000/500,000 = $58.64. The stock appears to be overvalued at the current market price of $62.50 per share, as our estimated value of $58.64 suggests that the market price is too high.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 99–102<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The current market price of BIC is $62.50 per share, and the current year&#x27;s FCFE is $1.75 million. Using a two-stage growth model to find the estimated the firm&#x27;s value, the current market price BIC is most accurately described as:<\/p><\/div>", "subj": "equity"}, {"n": 103, "q": "The terminal value in year 6 is closest to:", "opts": ["$16.86.", "$21.68.", "$25.29."], "ans": "A", "expl": "Estimates for the future FCFE based on supplied growth rates are: Year 1 2 3 4 5 6 7 Growth rate 10.5% 10.5% 10.5% 8.5% 6.5% 5.0% 3.0% FCFE/share $0.995 $1.099 $1.214 $1.318 $1.403 $1.473 $1.518 R$ = 1.518/(12.0% - 3.0%) = 16.861", "explhtml": "<p>Estimates for the future FCFE based on supplied growth rates are:<\/p><div class=\"tbl\"><table><tr><td>Year<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><td>7<\/td><\/tr><tr><td>Growth rate<\/td><td>10.5%<\/td><td>10.5%<\/td><td>10.5%<\/td><td>8.5%<\/td><td>6.5%<\/td><td>5.0%<\/td><td>3.0%<\/td><\/tr><tr><td>FCFE/share<\/td><td>$0.995<\/td><td>$1.099<\/td><td>$1.214<\/td><td>$1.318<\/td><td>$1.403<\/td><td>$1.473<\/td><td>$1.518<\/td><\/tr><\/table><\/div><p>R<sub>$<\/sub> = 1.518/(12.0% - 3.0%) = 16.861<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 103–106<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 103–106). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The terminal value in year 6 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 104, "q": "The per-share value Winters should assign to Goliath's equity is closest to:", "opts": ["$20.24.", "$13.55.", "$16.87."], "ans": "B", "expl": "We find the value of the equity/share by discounting all future FCFE/share by the required rate of return on equity. Using our calculator, enter CF₀ = 0; C01 = 0.995; C02 = 1.099; C03 = 1.214; C04 = 1.318; C05 = 1.403; C06 = 1.473 + 16.867 = 18.34; I = 12; Compute →NPV = 13.55.", "explhtml": "<p>We find the value of the equity/share by discounting all future FCFE/share by the required rate of return on equity.<\/p><img class=\"pimg\" src=\"l2img/kq/r19-458202d500.png\" style=\"max-width:min(100%,666px)\" loading=\"lazy\" alt=\"\"><p>Using our calculator, enter CF<sub>0<\/sub> = 0; C01 = 0.995; C02 = 1.099; C03 = 1.214; C04 = 1.318; C05 = 1.403; C06 = 1.473 + 16.867 = 18.34; I = 12; Compute →NPV = 13.55.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 103–106<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The per-share value Winters should assign to Goliath&#x27;s equity is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 105, "q": "The weighted average cost of capital (WACC) is closest to:", "opts": ["10.5%.", "10.9%.", "11.1%."], "ans": "A", "expl": "The debt-to-equity ratio of 25.0% means that the debt-to-total value is 25.0%/125.0% or 20.0%. The weight of debt is thus 20.0% and the weight of equity is 80.0%. The WACC = [0.20 × (0.075) × (1 – 0.40)] + (0.80 × 0.12) = 10.5%", "explhtml": "<p>The debt-to-equity ratio of 25.0% means that the debt-to-total value is 25.0%/125.0% or 20.0%. The weight of debt is thus 20.0% and the weight of equity is 80.0%.<\/p><p>The WACC = [0.20 × (0.075) × (1 – 0.40)] + (0.80 × 0.12) = 10.5%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 103–106<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The weighted average cost of capital (WACC) is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 106, "q": "The value of the firm, based on the constant growth model, is closest to:", "opts": ["$153 million.", "$140 million.", "$124 million."], "ans": "A", "expl": "The estimated FCFF for year 0 is $9.55 million and the WACC is 10.5% as calculated. If the growth rate for the firm is estimated as 4.0%, the value of the firm is: $9.55 million × (1.04)/(0.105 – 0.04) = $152,800,000.", "explhtml": "<p>The estimated FCFF for year 0 is $9.55 million and the WACC is 10.5% as calculated. If the growth rate for the firm is estimated as 4.0%, the value of the firm is:<\/p><p>$9.55 million × (1.04)/(0.105 – 0.04) = $152,800,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 103–106<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The value of the firm, based on the constant growth model, is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 107, "q": "Which of the following types of company is the E-Model, a three-stage free cash flow to equity (FCFE) Model, best suited for? Companies:", "opts": ["growing at a rate similar to or less than the nominal growth rate of the economy.", "in high growth industries that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level.", "with patents or firms in an industry with significant barriers to entry."], "ans": "B", "expl": "The three-stage FCFE model, or E-Model, is most suited to analyzing firms currently experiencing high growth that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level. The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry. Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the Stable Growth FCFE Model. A firm that pays out all of its earnings as dividends will have a growth rate of zero (remember g = RR × ROE) and would not be valued using the three-stage FCFE model.", "explhtml": "<p>The three-stage FCFE model, or E-Model, is most suited to analyzing firms currently experiencing high growth that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level. The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry. Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the Stable Growth FCFE Model. A firm that pays out all of its earnings as dividends will have a growth rate of zero (remember g = RR × ROE) and would not be valued using the three-stage FCFE model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following types of company is the E-Model, a three-stage free cash flow to equity (FCFE) Model, best suited for? Companies:<\/p><\/div>", "subj": "equity"}, {"n": 108, "q": "The repurchase of 20% of a firm's outstanding common shares will cause free cash flow to the firm (FCFF) to:", "opts": ["increase.", "remain the same.", "decrease."], "ans": "B", "expl": "Share repurchases are a use of free cash flows, not a source. FCFF is cash flow that is available to all capital suppliers. Notice the conspicuous absence of repurchases in the following: FCFF = CFO + Int (1 – tax rate) – FCInv.", "explhtml": "<p>Share repurchases are a use of free cash flows, not a source. FCFF is cash flow that is available to all capital suppliers. Notice the conspicuous absence of repurchases in the following: FCFF = CFO + Int (1 – tax rate) – FCInv.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>The repurchase of 20% of a firm&#x27;s outstanding common shares will cause free cash flow to the firm (FCFF) to:<\/p><\/div>", "subj": "equity"}, {"n": 109, "q": "Calculate the forecasted free cash flow to the firm (FCFF) for 2x12, using the data in Exhibits 1 and 2.", "opts": ["–89.5.", "–107.5.", "–131.5."], "ans": "A", "expl": "FCFF = EBIT × (1 – tax rate) + dep – FCINV– WCINV FCFF = 415 × (1 – 0.30) + 60 – 400 – 40 = –89.5 Alternatively: FCFF = [EBITDA × (1 – tax rate)] + (dep × tax rate) – FCINV – WCINV FCFF = [475 × (1 – 0.30)] + (60 × 0.30) – 400 – 40 = –89.5 Depreciation: Accumulated depreciation 31 December 2011 = $890 Accumulated depreciation 31 December 2012 = $950 With no asset sales during the period the depreciation charge for 2012 = $60 Fixed capital investment: This is equal to capital expenditures (because there are no asset sales), which is equal to the change in gross PP&E: FCINV = 2000 – 1600 = 400 Working capital investment: This is the change in the working capital accounts, excluding cash and short-term borrowings. Working capital = receivables + inventory – payables WCINV = (220 + 265 – 50) – (200 + 245 – 50) = 40", "explhtml": "<p>FCFF = EBIT × (1 – tax rate) + dep – FC<sub>INV<\/sub>– WC<sub>INV<\/sub><\/p><p>FCFF = 415 × (1 – 0.30) + 60 – 400 – 40 = –89.5 Alternatively: FCFF = [EBITDA × (1 – tax rate)] + (dep × tax rate) – FC<sub>INV<\/sub> – WC<sub>INV<\/sub><\/p><p>FCFF = [475 × (1 – 0.30)] + (60 × 0.30) – 400 – 40 = –89.5 Depreciation: Accumulated depreciation 31 December 2011 = $890 Accumulated depreciation 31 December 2012 = $950 With no asset sales during the period the depreciation charge for 2012 = $60 Fixed capital investment: This is equal to capital expenditures (because there are no asset sales), which is equal to the change in gross PP&amp;E: FC<sub>INV<\/sub> = 2000 – 1600 = 400<\/p><p>Working capital investment: This is the change in the working capital accounts, excluding cash and short-term borrowings. Working capital = receivables + inventory – payables WC<sub>INV<\/sub> = (220 + 265 – 50) – (200 + 245 – 50) = 40<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"kq-note\">Câu thuộc item set (câu 109–114). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Calculate the forecasted free cash flow to the firm (FCFF) for 2x12, using the data in Exhibits 1 and 2.<\/p><\/div>", "subj": "equity"}, {"n": 110, "q": "Calculate the forecasted free cash flow to equity (FCFE) for 2x12.", "opts": ["10.5.", "–9.5.", "–49.5."], "ans": "A", "expl": "FCFE = FCFF – Int (1 – tax rate) + net borrowing FCFE = –89.5 – 200(1 – 0.3) + 240 = 10.5 Net borrowing is the difference between the long-term and short-term debt accounts (the impact caused by amortization of premiums and discounts should be removed if debt is not issued at par): = (620 + 70) – (400 + 50) = 240 Alternatively: FCFE = NI + dep – FCINV – WCINV + net borrowing = [(415 – 200) × 0.7] + 60 – 400 – 40 + 240 = 10.5", "explhtml": "<p>FCFE = FCFF – Int (1 – tax rate) + net borrowing FCFE = –89.5 – 200(1 – 0.3) + 240 = 10.5 Net borrowing is the difference between the long-term and short-term debt accounts (the impact caused by amortization of premiums and discounts should be removed if debt is not issued at par): = (620 + 70) – (400 + 50) = 240 Alternatively: FCFE = NI + dep – FC<sub>INV<\/sub> – WC<sub>INV<\/sub> + net borrowing<\/p><p>= [(415 – 200) × 0.7] + 60 – 400 – 40 + 240 = 10.5<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Calculate the forecasted free cash flow to equity (FCFE) for 2x12.<\/p><\/div>", "subj": "equity"}, {"n": 111, "q": "Regarding the handbook's statements on free cash flow techniques: Statement 1  Statement 2", "opts": ["Correct Correct", "Incorrect Correct", "Correct Incorrect"], "ans": "B", "expl": "Dividends, share repurchases, and share issues have no effect on either FCFF or FCFE. FCFF and FCFE represent the total cash flow available before financing decisions. Share repurchases represent uses of those cash flows. If debt is repaid FCFE, will decrease in the current year because of reduced (negative) net borrowings and will increase in future years as interest expense is reduced.", "explhtml": "<p>Dividends, share repurchases, and share issues have no effect on either FCFF or FCFE. FCFF and FCFE represent the total cash flow available before financing decisions. Share repurchases represent uses of those cash flows. If debt is repaid FCFE, will decrease in the current year because of reduced (negative) net borrowings and will increase in future years as interest expense is reduced.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>Regarding the handbook&#x27;s statements on free cash flow techniques: Statement 1 &nbsp; Statement 2<\/p><\/div>", "subj": "equity"}, {"n": 112, "q": "Regarding the handbook's statements on free cash flow techniques: Statement 3  Statement 4", "opts": ["Correct Correct", "Incorrect Correct", "Correct Incorrect"], "ans": "C", "expl": "FCFF = [EBIT × (1 – tax rate)] + dep – FCINV – WCINV We assume that the only non-cash charge that appears above EBIT is depreciation. In general however the rule is to adjust for any non-cash charges that appear above EBIT. FCFF = [EBITDA × (1 – tax rate)] + (dep × tax rate) – FCINV – WCINV", "explhtml": "<p>FCFF = [EBIT × (1 – tax rate)] + dep – FC<sub>INV<\/sub> – WC<sub>INV<\/sub><\/p><p>We assume that the only non-cash charge that appears above EBIT is depreciation. In general however the rule is to adjust for any non-cash charges that appear above EBIT. FCFF = [EBITDA × (1 – tax rate)] + (dep × tax rate) – FC<sub>INV<\/sub> – WC<sub>INV<\/sub><\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Regarding the handbook&#x27;s statements on free cash flow techniques: Statement 3 &nbsp; Statement 4<\/p><\/div>", "subj": "equity"}, {"n": 113, "q": "The most appropriate model for valuing Fite Inc. is the:", "opts": ["free cash flow to equity model.", "free cash flow to the firm model.", "dividend discount H-model."], "ans": "B", "expl": "A dividend discount model is inappropriate, as dividends are not related to the earnings stream. In addition, as this is a takeover situation a free cash flow approach is more suitable as the acquirer has control and discretion over the distribution of the total free cash flow. With dividend discount models a minority, interest is assumed (i.e., no control over dividend policy). FCFF model is preferred to FCFE as FCFE is negative and volatile and leverage is high.", "explhtml": "<p>A dividend discount model is inappropriate, as dividends are not related to the earnings stream. In addition, as this is a takeover situation a free cash flow approach is more suitable as the acquirer has control and discretion over the distribution of the total free cash flow. With dividend discount models a minority, interest is assumed (i.e., no control over dividend policy). FCFF model is preferred to FCFE as FCFE is negative and volatile and leverage is high.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>The most appropriate model for valuing Fite Inc. is the:<\/p><\/div>", "subj": "equity
