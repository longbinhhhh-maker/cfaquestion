<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 19 — Free Cash Flow Valuation · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;

    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;

  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;

}

ectly at dividends.", "explhtml": "<p>Dividend policy can be changed by the buyer of a firm. Thus, the free cash flow perspective looks to the source of dividends in a position of control rather than directly at dividends.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>The ownership perspective implicit in the free cash flow to equity valuation approach is of:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Ignoring any costs related to financial distress, if a firm increases its financial leverage, the value of the firm should:", "opts": ["decrease because the required rate of return on debt is lower than that of equity.", "increase because the weighted average cost of capital will be lower due to interest tax shields.", "increase because the FCFF will increase."], "ans": "B", "expl": "When a firm adds leverage, its value may increase due to the tax shields on interest expense and the generally lower cost of debt. In theory, there is an optimal capital structure. If the amount of debt employed is greater than the optimal, the costs associated with risk of bankruptcy or financial distress begin to outweigh the advantage of interest tax shields.", "explhtml": "<p>When a firm adds leverage, its value may increase due to the tax shields on interest expense and the generally lower cost of debt. In theory, there is an optimal capital structure. If the amount of debt employed is greater than the optimal, the costs associated with risk of bankruptcy or financial distress begin to outweigh the advantage of interest tax shields.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Ignoring any costs related to financial distress, if a firm increases its financial leverage, the value of the firm should:<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "A firm currently has the following per share values: Cash flow from operations (CFO) is $49.50. Investment in fixed capital is $40.00. Net borrowing is $7.50. What is the current per share free cash flow to equity (FCFE)?", "opts": ["$17.00.", "$16.50.", "$97.00."], "ans": "A", "expl": "FCFE = CFO − FCInv + net borrowing = $49.50 − $40.00 + $7.50 = $17.00", "explhtml": "<p>FCFE = CFO − FCInv + net borrowing = $49.50 − $40.00 + $7.50 = $17.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>A firm currently has the following per share values:<\/p><p>Cash flow from operations (CFO) is $49.50. Investment in fixed capital is $40.00. Net borrowing is $7.50.<\/p><p>What is the current per share free cash flow to equity (FCFE)?<\/p><\/div>", "subj": "equity"}, {"n": 6, "q": "Using the three components of the DuPont system, and using opening balance sheet values, which of the following statements regarding 20x5 is correct?", "opts": ["Total asset turnover is 0.556, financial leverage is 2.07, and ROE is 11.5%.", "Total asset turnover is 1.798, financial leverage is 2.07, and ROE is 11.5%.", "Total asset turnover is 0.556, financial leverage is 0.483, and ROE is 11.5%."], "ans": "A", "expl": "ROE using the DuPont three component approach: ROE = profit margin × asset turnover × financial leverage profit sales  assets | =  ×  × | assets  equity sales 72.4  721.9  1299.2 | =  ×  × | 721.9  1299.2  628.7 = 0.100 × 0.556 × 2.066 = 0.1149 = 11.5% Note that it is typical to compute ROE based on opening equity for valuation contexts, whilst in FRA we typically use average values. The CFA Institute curriculum does note that some analyst compute ROE in a valuation context using average balance sheet values so care should be taken to follow the instructions in the question whether to use opening or average values.", "explhtml": "<p>ROE using the DuPont three component approach: ROE = profit margin × asset turnover × financial leverage<\/p><p>profit<\/p><div class=\"tbl\"><table><tr><td>sales<\/td><td>assets<\/td><\/tr><tr><td>=<\/td><td>×<\/td><td>×<\/td><\/tr><tr><td>assets<\/td><t 2,204m.", "$1,968m."], "ans": "C", "expl": "Using a two stage model: FCFF₁ = $46m WACC = (12.3% × 0.5) + (7 × (1 – 0.3) × 0.5) = 8.6% MVfirm = 42.36 + 43.68 + 45.05 + 1,836.69 MVfirm = 1967.78", "explhtml": "<p>Using a two stage model: FCFF<sub>1<\/sub> = $46m<\/p><p>WACC = (12.3% × 0.5) + (7 × (1 – 0.3) × 0.5) = 8.6%<\/p><img class=\"pimg\" src=\"l2img/kq/r19-39770aecb0.png\" style=\"max-width:min(100%,441px)\" loading=\"lazy\" alt=\"\"><p>MV<sub>firm<\/sub> = 42.36 + 43.68 + 45.05 + 1,836.69<\/p><p>MV<sub>firm<\/sub> = 1967.78<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–9<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>It has also been estimated that the Free Cash Flow to the firm will be $46m next year. It is expected to grow at 12% for the following two years before settling down to a long-term rate of growth of 6%. Which of the following is the most accurate estimate of the value of Busicomb Inc.&#x27;s business using a two stage FCFF model? Work to the nearest $m.<\/p><\/div>", "subj": "equity"}, {"n": 10, "q": "Which of the following formulas for calculating FCFF is least accurate?", "opts": ["FCFF = [EBIT × (1 − tax rate)] + Dep − FCInv − WCInv", "FCFF = [EBITDA × (1 − tax rate)] + (Dep × tax rate) − FCInv − WCInv", "FCFF = NI + NCC − FCInv − WCInv + net borrowing"], "ans": "C", "expl": "The formula shown for calculating FCFF from Net Income is incorrect; this formula will instead produce FCFE. A correct formula to calculate FCFF from Net Income is as follows: FCFF = NI + NCC + [Int × (1 − tax rate)] − FCInv – WCInv", "explhtml": "<p>The formula shown for calculating FCFF from Net Income is incorrect; this formula will instead produce FCFE. A correct formula to calculate FCFF from Net Income is as follows: FCFF = NI + NCC + [Int × (1 − tax rate)] − FCInv – WCInv<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.3, LOS 19.c<\/div><div class=\"qtext\"><p>Which of the following formulas for calculating FCFF is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "Regarding the statements by Johnson and Nguyen about FCF in 2006:", "opts": ["only Nguyen is incorrect.", "only Johnson is incorrect.", "both are incorrect."], "ans": "C", "expl": "To estimate FCF, we can construct the following table using the table given and the information about growth in net income: $(in millions) 2004 2005 2006 2007 2008 Net Income 10 15 20 25 30 Plus: Depreciation 5 6 5 6 5 Less: Capital Expenditures 7 8 9 10 12 Free Cash Flow 8 13 16 21 23 The estimated free cash flow for 2006 is $16 million. Johnson's statement is incorrect. Since none of Beachwood's debt is allocated to Country Point, all the financing is in the form of equity, so FCFF and FCFE are equal. Nguyen's statement is also incorrect.", "explhtml": "<p>To estimate FCF, we can construct the following table using the table given and the information about growth in net income:<\/p><div class=\"tbl\"><table><tr><td>$(in millions)<\/td><td>2004<\/td><td>2005<\/td><td>2006<\/td><td>2007<\/td><td>2008<\/td><\/tr><tr><td>Net Income<\/td><td>10<\/td><td>15<\/td><td>20<\/td><td>25<\/td><td>30<\/td><\/tr><tr><td>Plus: Depreciation<\/td><td>5<\/td><td>6<\/td><td>5<\/td><td>6<\/td><td>5<\/td><\/tr><tr><td>Less: Capital Expenditures<\/td><td>7<\/td><td>8<\/td><td>9<\/td><td>10<\/td><td>12<\/td><\/tr><tr><td>Free Cash Flow<\/td><td>8<\/td><td>13<\/td><td>16<\/td><td>21<\/td><td>23<\/td><\/tr><\/table><\/div><p>The estimated free cash flow for 2006 is $16 million. Johnson&#x27;s statement is incorrect. Since none of Beachwood&#x27;s debt is allocated to Country Point, all the financing is in the form of equity, so FCFF and FCFE are equal. Nguyen&#x27;s statement is also incorrect.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 11–14<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 11–14). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Regarding the statements by Johnson and Nguyen about FCF in 2006:<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "If FCInv equals Fixed Capital Investment and WCInv equals Working Capital Investment, which statement about FCF and its components is least accurate?", "opts": ["FCFE = (EBIT × (1 − tax rate)) + Depreciation − FCInv − WCInv.", "FCFF = (EBITDA × (1 − tax rate)) + (Depreciation × tax rate) − FCInv − WCInv.", "WCInv is the change in the working capital accounts, excluding cash and short-term borrowings."], "ans": "A", "expl": "The correct version of this equation is: FCFF = (EBIT × (1 − tax rate)) + Depreciation − FCInv − WCInv", "explhtml": "<p>The correct version of this equation is:<\/p><p>FCFF = (EBIT × (1 − tax rate)) + Depreciation − FCInv − WCInv<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 11–14<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>If FCInv equals Fixed Capital Investment and WCInv equals Working Capital Investment, which statement about FCF and its components is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "Given Nguyen's estimate of Country Point's terminal value in 2008, what is the growth assumption she must have used for free cash flow after 2008?", "opts": ["3%.", "7%.", "9%."], "ans": "B", "expl": "We know the terminal value in 2008 is $223.7 million. We can calculate the free cash flow in 2008 to be $23 million (= $30 million net income + $5 million depreciation − $12 million capital expenditures). (See the table in question 1). Thus, we can solve for the estimated growth rate: Terminal value = [CF@2008 × (growth rate + 1)] / (discount rate − growth rate) 223.7 million = ($23 million × (growth rate + 1)) / (0.18 − growth rate) 223.7 million × (0.18 − growth rate) = 23 million × (growth rate + 1) 40.266 − (223.7 × growth rate) = 23 million + (23 × growth rate) 17.266 = 246.7 × (growth rate) growth rate = 0.07 Nguyen's growth rate assumption is 7% per year", "explhtml": "<p>We know the terminal value in 2008 is $223.7 million. We can calculate the free cash flow in 2008 to be $23 million (= $30 million net income + $5 million depreciation − $12 million capital expenditures). (See the table in question 1). Thus, we can solve for the estimated growth rate:<\/p><p>Terminal value = [CF@2008 × (growth rate + 1)] / (discount rate − growth rate) 223.7 million = ($23 million × (growth rate + 1)) / (0.18 − growth rate) 223.7 million × (0.18 − growth rate) = 23 million × (growth rate + 1) 40.266 − (223.7 × growth rate) = 23 million + (23 × growth rate) 17.266 = 246.7 × (growth rate) growth rate = 0.07<\/p><p>Nguyen&#x27;s growth rate assumption is 7% per year<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 11–14<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Given Nguyen&#x27;s estimate of Country Point&#x27;s terminal value in 2008, what is the growth assumption she must have used for free cash flow after 2008?<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "The value of beta for Country Point is:", "opts": ["1.27.", "1.00.", "1.09."], "ans": "C", "expl": "The risk free rate is (8% − 2%) = 6%. We are told that the market risk premium is 11%, and we calculated the cost of equity (required return) to be (10 million / 55.6 million =) 18%. Since we know the risk-free rate, the market risk premium, and the discount rate, we can use the capital asset pricing model to solve for beta: Required rate of return = 0.18 = 0.06 + (b × 0.11) 0.18 − 0.06 = b × 0.11 0.12 = b × 0.11 b = 1.09", "explhtml": "<p>The risk free rate is (8% − 2%) = 6%. We are told that the market risk premium is 11%, and we calculated the cost of equity (required return) to be (10 million / 55.6 million =) 18%. Since we know the risk-free rate, the market risk premium, and the discount rate, we can use the capital asset pricing model to solve for beta:<\/p><p>Required rate of return = 0.18 = 0.06 + (b × 0.11) 0.18 − 0.06 = b × 0.11 0.12 = b × 0.11 b = 1.09<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 11–14<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The value of beta for Country Point is:<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "A firm has projected free cash flow to equity next year of $1.25 per share, $1.55 in two years, and a terminal value of $90.00 two years from now, as well. Given the firm's cost of equity of 12%, a weighted average cost of capital of 14%, and total outstanding debt of $30.00 per share, what is the current value of equity?", "opts": ["$41.54.", "$74.10.", "$71.74."], "ans": "B", "expl": "Value of equity = $1.25 / (1.12)¹ + $1.55 / (1.12)² + $90.00 / (1.12)² = $74.10", "explhtml": "<p>Value of equity = $1.25 / (1.12)<sup>1<\/sup> + $1.55 / (1.12)<sup>2<\/sup> + $90.00 / (1.12)<sup>2<\/sup> = $74.10<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>A firm has projected free cash flow to equity next year of $1.25 per share, $1.55 in two years, and a terminal value of $90.00 two years from now, as well. Given the firm&#x27;s cost of equity of 12%, a weighted average cost of capital of 14%, and total outstanding debt of $30.00 per share, what is the current value of equity?<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "A firm has: Free cash flow to equity = $4.0 million. Cost of equity = 12%. Long-term expected growth rate = 5%. Value of equity per share = $57.14 per share. What will happen to the value of the firm if free cash flow to equity decreases to $3.2 million?", "opts": ["There is insufficient information to tell.", "The value will increase.", "The value will decrease."], "ans": "C", "expl": "Everything else being constant, a decrease in free cash flow to equity should decrease the value of the firm.", "explhtml": "<p>Everything else being constant, a decrease in free cash flow to equity should decrease the value of the firm.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>A firm has:<\/p><p>Free cash flow to equity = $4.0 million. Cost of equity = 12%. Long-term expected growth rate = 5%. Value of equity per share = $57.14 per share.<\/p><p>What will happen to the value of the firm if free cash flow to equity decreases to $3.2 million?<\/p><\/div>", "subj": "equity"}, {"n": 17, "q": "A firm in stable growth phase should have:", "opts": ["a required rate of return close to the market rate of return and capital expenditures that are not too large relative to depreciation expense.", "a growth rate higher than that of the economy and a required rate of return that is greater than the market rate of return.", "capital expenditures that are less than the depreciation expense."], "ans": "A", "expl": "A firm that is in a stable growth phase should have growth rate close to that of the economy, and the cost of equity should approximate the required rate of return on the market. In addition, the capital expenditures should not be disproportionately large relative to the depreciation expense.", "explhtml": "<p>A firm that is in a stable growth phase should have growth rate close to that of the economy, and the cost of equity should approximate the required rate of return on the market. In addition, the capital expenditures should not be disproportionately large relative to the depreciation expense.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>A firm in stable growth phase should have:<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "In what ways are dividends different from free cashflow to equity (FCFE)?", "opts": ["There is no difference. Dividends must equal FCFE.", "Companies often use FCFE as a signal of positive future growth prospects while dividends are not used for signaling.", "Dividends are often viewed as \"sticky.\" Managers are reluctant to radically change the dividend payout policy while FCFE often has immense variability."], "ans": "C", "expl": "Dividends and the FCFE are often different and dividends are used as a signal to the market not FCFE. Dividends viewed as sticky is the true statement.", "explhtml": "<p>Dividends and the FCFE are often different and dividends are used as a signal to the market not FCFE. Dividends viewed as sticky is the true statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>In what ways are dividends different from free cashflow to equity (FCFE)?<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "A three-stage free cash flow to the firm (FCFF) is typically appropriate when:", "opts": ["the required rate of return is less than the growth rate in the last stage.", "growth is currently high and will move through a transitional stage to a steady-state growth rate.", "growth is currently low and will move through a transitional stage to a final stage wherein growth exceeds the required rate of return."], "ans": "B", "expl": "The three-stage model using either FCFE or FCFF typically assumes that growth is currently high and will move through a transitional stage to a steady-state growth rate. Multi-stage models assume that the required rate of return exceeds the growth rate in the last stage.", "explhtml": "<p>The three-stage model using either FCFE or FCFF typically assumes that growth is currently high and will move through a transitional stage to a steady-state growth rate. Multi-stage models assume that the required rate of return exceeds the growth rate in the last stage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>A three-stage free cash flow to the firm (FCFF) is typically appropriate when:<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "In the stable-growth FCFE model, an extremely low value can result from all of the following EXCEPT:", "opts": ["capital expenditures are too high relative to depreciation.", "the expected growth rate is too high for a stable firm.", "the required rate of return is too high for a stable firm."], "ans": "B", "expl": "If the expected growth rate is too high for a stable firm, the value obtained using the stable-growth FCFE model will be extremely high.", "explhtml": "<p>If the expected growth rate is too high for a stable firm, the value obtained using the stable-growth FCFE model will be extremely high.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>In the stable-growth FCFE model, an extremely low value can result from all of the following EXCEPT:<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "Which of the following formulas for calculating FCFE is least accurate?", "opts": ["FCFE = NI + NCC − FCInv − WCInv + net borrowing", "FCFE = CFO − FCInv + net borrowing", "FCFE = [EBIT × (1 − tax rate)] + Dep − FCInv − WCInv"], "ans": "C", "expl": "The formula shown for calculating FCFF from EBIT is incorrect; this formula will instead produce FCFF. The other two formulas are correct.", "explhtml": "<p>The formula shown for calculating FCFF from EBIT is incorrect; this formula will instead produce FCFF. The other two formulas are correct.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.3, LOS 19.c<\/div><div class=\"qtext\"><p>Which of the following formulas for calculating FCFE is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 22, "q": "Which of the following free cash flow to equity (FCFE) models is most suited to analyze firms in an industry with significant barriers to entry?", "opts": ["Stable Growth FCFE Model.", "Two-stage FCFE Model.", "FCFE Perpetuity Model."], "ans": "B", "expl": "The two-stage FCFE model is most suited for analyzing firms in high growth that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry.", "explhtml": "<p>The two-stage FCFE model is most suited for analyzing firms in high growth that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following free cash flow to equity (FCFE) models is most suited to analyze firms in an industry with significant barriers to entry?<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "Which of the following statements regarding the FCFF models is most accurate? The two-stage FCFF model is more useful than the stable-growth FCFF model when the firm is growing at a rate:", "opts": ["not significantly higher than that of the overall economy.", "significantly lower than that of the overall economy.", "significantly higher than that of the overall economy."], "ans": "C", "expl": "The two-stage FCFF model is more useful in valuing a firm that is growing at a rate significantly higher than the overall economy. Since this cannot persist indefinitely, growth will eventually slow to a stable growth rate consistent with that of the economy.", "explhtml": "<p>The two-stage FCFF model is more useful in valuing a firm that is growing at a rate significantly higher than the overall economy. Since this cannot persist indefinitely, growth will eventually slow to a stable growth rate consistent with that of the economy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following statements regarding the FCFF models is most accurate? The two-stage FCFF model is more useful than the stable-growth FCFF model when the firm is growing at a rate:<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "What is the most likely reason that you get an extremely low value from the three-stage FCFE model? Capital expenditures are significantly:", "opts": ["higher than depreciation during the high-growth phase.", "higher than depreciation in the stable-growth phase.", "less than depreciation during the high-growth phase."], "ans": "B", "expl": "If capital expenditures estimates are significantly higher than depreciation for the stable growth period, then the three-stage FCFE model might result in an extremely low value. One possible solution for the problem is to grow the capital expenditures more slowly than deprecation in the transition period to narrow the difference. Another is to assume that capital expenditures and depreciation will offset when growth normalizes.", "explhtml": "<p>If capital expenditures estimates are significantly higher than depreciation for the stable growth period, then the three-stage FCFE model might result in an extremely low value. One possible solution for the problem is to grow the capital expenditures more slowly than deprecation in the transition period to narrow the difference. Another is to assume that capital expenditures and depreciation will offset when growth normalizes.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>What is the most likely reason that you get an extremely low value from the three-stage FCFE model? Capital expenditures are significantly:<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "Which of the following statements regarding dividends and free cash flow to equity (FCFE) is least accurate?", "opts": ["FCFE can be negative but dividends cannot.", "FCFE discount models usually result in higher equity values than do dividend discount models (DDMs).", "Required returns are higher in FCFE discount models than they are in dividend discount models, since FCFE is more difficult to estimate."], "ans": "C", "expl": "Although FCFE may be more difficult to estimate than dividends, the required return is based on the risk faced by the shareholders, which would be the same under both models.", "explhtml": "<p>Although FCFE may be more difficult to estimate than dividends, the required return is based on the risk faced by the shareholders, which would be the same under both models.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Which of the following statements regarding dividends and free cash flow to equity (FCFE) is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Given the assumptions contained in Scenario 1, the value of the firm is most accurately estimated as:", "opts": ["$343 million.", "$333 million.", "$250 million."], "ans": "A", "expl": "Under the stable growth FCFF model, the value of the firm = FCFF₁ / (WACC − gₙ) = $30 million × (1.03) / (0.12 − 0.03) = $343.33 million.", "explhtml": "<p>Under the stable growth FCFF model, the value of the firm = FCFF<sub>1<\/sub> / (WACC − g<sub>n<\/sub>) = $30 million × (1.03) / (0.12 − 0.03) = $343.33 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 26–29<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 26–29). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Given the assumptions contained in Scenario 1, the value of the firm is most accurately estimated as:<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "In Scenario 2, the value of the firm is closest to:", "opts": ["$315 million.", "$346 million.", "$321 million."], "ans": "B", "expl": "The value of the firm is the present value of Year 1-3 plus the terminal value. The terminal value is: FCFF for year 4/(WACC – growth rate) = $40.62/(0.12 – 0.02) = $406.22 million in terms of year 3 dollars. The calculator inputs to solve NPV for the value of the firm is: CF0 = $0, CF1 = $18.90, CF2 = $23.64, CF3 = $29.09 + $406.22 = $435.31, I =12. NPV = $345.57 million.", "explhtml": "<p>The value of the firm is the present value of Year 1-3 plus the terminal value. The terminal value is: FCFF for year 4/(WACC – growth rate) = $40.62/(0.12 – 0.02) = $406.22 million in terms of year 3 dollars. The calculator inputs to solve NPV for the value of the firm is: CF0 = $0, CF1 = $18.90, CF2 = $23.64, CF3 = $29.09 + $406.22 = $435.31, I =12. NPV = $345.57 million.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 26–29<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>In Scenario 2, the value of the firm is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "The cost of equity for Schneider Inc. is closest to:", "opts": ["13.0%.", "5.8%.", "11.3%."], "ans": "A", "expl": "The weighted average cost of capital formula is WACC = wd × rd × (1 − t) + wₑ × rₑ. The weight of debt is 10.0% − the weight of equity must be 90.0%. 0.12 = 0.10 × 0.05 × (1 − 0.40) + 0.90 × rₑ 0.120 - 0.003 = 0.90 × rₑ 0.117/0.9 = rₑ rₑ = 13.0%", "explhtml": "<p>The weighted average cost of capital formula is WACC = w<sub>d<\/sub> × r<sub>d<\/sub> × (1 − t) + w<sub>e<\/sub> × r<sub>e<\/sub>. The weight of debt is 10.0% − the weight of equity must be 90.0%.<\/p><p>0.12 = 0.10 × 0.05 × (1 − 0.40) + 0.90 × r<sub>e<\/sub><\/p><p>0.120 - 0.003 = 0.90 × r<sub>e<\/sub><\/p><p>0.117/0.9 = r<sub>e<\/sub><\/p><p>r<sub>e<\/sub> = 13.0%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 26–29<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The cost of equity for Schneider Inc. is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "The market value of Schneider Inc.'s stock is:", "opts": ["$17.50 per share.", "$31.50 per share.", "$15.75 per share."], "ans": "C", "expl": "The estimated market value of debt is $35 million, which represents 10.0% of the value of the firm. The other 90.0% is the value of equity or $315 million. $315 million/20 million shares = $15.75 per share.", "explhtml": "<p>The estimated market value of debt is $35 million, which represents 10.0% of the value of the firm. The other 90.0% is the value of equity or $315 million. $315 million/20 million shares = $15.75 per share.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 26–29<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The market value of Schneider Inc.&#x27;s stock is:<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "Free cash flow to the firm (FCFF) adjusts earnings before interest and taxes (EBIT) by:", "opts": ["subtracting investments in fixed capital and working capital.", "deducting taxes, adding back depreciation, and deducting the investments in fixed capital and working capital.", "adding taxes, deducting depreciation, and adding back the investments in fixed capital and working capital."], "ans": "B", "expl": "As presented in the reading: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv.", "explhtml": "<p>As presented in the reading: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.2, LOS 19.c<\/div><div class=\"qtext\"><p>Free cash flow to the firm (FCFF) adjusts earnings before interest and taxes (EBIT) by:<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "Sudbury Industries expects FCFF in the coming year of 400 million Canadian dollars ($), and expects FCFF to grow forever at a rate of 3 percent. The company maintains an all-equity capital structure, and Sudbury's required rate of return on equity is 8 percent. Sudbury Industries has 100 million outstanding common shares. Sudbury's common shares are currently trading in the market for $80 per share. Using the Constant-Growth FCFF Valuation Model, Sudbury's stock is:", "opts": ["fairly valued.", "overvalued.", "undervalued."], "ans": "A", "expl": "Based on a free cash flow valuation model, Sudbury Industries shares appear to be fairly valued. Since Sudbury is an all-equity firm, WACC is the same as the required return on equity of 8%. The firm value of Sudbury Industries is the present value of FCFF discounted by using WACC. Since FCFF should grow at a constant 3 percent rate, the result is: Firm value = FCFF₁ / WACC−g = 400 million / 0.08−0.03 = 400 million / 0.05 = $8,000 million Since the firm has no debt, equity value is equal to the value of the firm. Dividing the $8,000 million equity value by the number of outstanding shares gives the estimated value per share: V₀ = $8,000 million / 100 million shares = $80.00 per share", "explhtml": "<p>Based on a free cash flow valuation model, Sudbury Industries shares appear to be fairly valued. Since Sudbury is an all-equity firm, WACC is the same as the required return on equity of 8%. The firm value of Sudbury Industries is the present value of FCFF discounted by using WACC. Since FCFF should grow at a constant 3 percent rate, the result is:<\/p><p>Firm value = FCFF<sub>1<\/sub> / WACC−g = 400 million / 0.08−0.03 = 400 million / 0.05 = $8,000 million<\/p><p>Since the firm has no debt, equity value is equal to the value of the firm. Dividing the $8,000 million equity value by the number of outstanding shares gives the estimated value per share:<\/p><p>V<sub>0<\/sub> = $8,000 million / 100 million shares = $80.00 per share<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.m<\/div><div class=\"qtext\"><p>Sudbury Industries expects FCFF in the coming year of 400 million Canadian dollars ($), and expects FCFF to grow forever at a rate of 3 percent. The company maintains an all-equity capital structure, and Sudbury&#x27;s required rate of return on equity is 8 percent.<\/p><p>Sudbury Industries has 100 million outstanding common shares. Sudbury&#x27;s common shares are currently trading in the market for $80 per share.<\/p><p>Using the Constant-Growth FCFF Valuation Model, Sudbury&#x27;s stock is:<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "When using the two-stage FCFE model, if increases in working capital appear too high the analyst should:", "opts": ["switch to a three-stage model.", "normalize them to be equal to zero.", "use changes that are based upon a working capital ratio that is closer to the industry average."], "ans": "C", "expl": "The best solution is to use changes that are based upon a working capital ratio that approximates the industry average. The problem will not be eliminated by switching to a three-stage FCFE model.", "explhtml": "<p>The best solution is to use changes that are based upon a working capital ratio that approximates the industry average. The problem will not be eliminated by switching to a three-stage FCFE model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>When using the two-stage FCFE model, if increases in working capital appear too high the analyst should:<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "If the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by:", "opts": ["earnings before interest and taxes (EBIT).", "after-tax EBIT plus non-cash charges.", "net income plus after-tax interest."], "ans": "B", "expl": "The answer is indicated by the definition of FCFF: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv, which assumes that depreciation is the only non-cash charge. Further: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv.", "explhtml": "<p>The answer is indicated by the definition of FCFF: FCFF = EBIT (1 – tax rate) + Dep – FCInv – WCInv, which assumes that depreciation is the only non-cash charge. Further: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.h<\/div><div class=\"qtext\"><p>If the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "The following table provides forecasts for next year on a per share basis for TOY Inc.: Item Forecast Earnings $5.00 Capital Expenditures $2.40 Depreciation $1.80 Change in Working Capital $1.70 TOY Inc.'s target debt ratio is 30% and has a required rate of return of 12%. Earnings, capital expenditures, depreciation, and working capital are all expected to grow by 5% a year in the future. Assume that capital expenditures and working capital are financed at the target debt ratio. What is the forecasted free cashflow to equity (FCFE) for TOY Inc.?", "opts": ["$2.70.", "$3.39.", "$4.31."], "ans": "B", "expl": "FCFE = Earnings per share − (Capital Expenditures − Depreciation) (1 − Debt Ratio) − Change in working capital (1 − Debt Ratio) = 5.00 − (2.40 − 1.80)(1 − 0.3) − (1.7)(1 − 0.3) = 3.39.", "explhtml": "<p>FCFE = Earnings per share − (Capital Expenditures − Depreciation) (1 − Debt Ratio) − Change in working capital (1 − Debt Ratio) = 5.00 − (2.40 − 1.80)(1 − 0.3) − (1.7)(1 − 0.3) = 3.39.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>The following table provides forecasts for next year on a per share basis for TOY Inc.:<\/p><div class=\"tbl\"><table><tr><td>Item<\/td><td>Forecast<\/td><\/tr><tr><td>Earnings<\/td><td>$5.00<\/td><\/tr><tr><td>Capital Expenditures<\/td><td>$2.40<\/td><\/tr><tr><td>Depreciation<\/td><td>$1.80<\/td><\/tr><tr><td>Change in Working Capital<\/td><td>$1.70<\/td><\/tr><\/table><\/div><p>TOY Inc.&#x27;s target debt ratio is 30% and has a required rate of return of 12%. Earnings, capital expenditures, depreciation, and working capital are all expected to grow by 5% a year in the future. Assume that capital expenditures and working capital are financed at the target debt ratio.<\/p><p>What is the forecasted free cashflow to equity (FCFE) for TOY Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "Optimal capital structure is the mix of debt and equity that will maximize the value of the firm and minimize:", "opts": ["agency costs of equity.", "the firm's cost of capital.", "the amount of taxable profit reported."], "ans": "B", "expl": "The optimal capital structure is the mix of debt and equity that will maximize the value of the firm and minimize weighted average cost of capital (i.e. the firm's cost of capital or \"WACC\").", "explhtml": "<p>The optimal capital structure is the mix of debt and equity that will maximize the value of the firm and minimize weighted average cost of capital (i.e. the firm&#x27;s cost of capital or &quot;WACC&quot;).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Optimal capital structure is the mix of debt and equity that will maximize the value of the firm and minimize:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "If the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by:", "opts": ["net income plus non-cash charges plus after-tax interest.", "net income plus after-tax interest.", "earnings before interest and taxes (EBIT)."], "ans": "A", "expl": "The answer is indicated by the definition of FCFF: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv. The relationship between net income and FCFF is indicated by: NI = EBIT (1 – tax rate) – Int (1 – tax rate).", "explhtml": "<p>The answer is indicated by the definition of FCFF: FCFF = NI + NCC + Int (1 – tax rate) – FCInv – WCInv. The relationship between net income and FCFF is indicated by: NI = EBIT (1 – tax rate) – Int (1 – tax rate).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.h<\/div><div class=\"qtext\"><p>If the investment in fixed capital and working capital offset each other, free cash flow to the firm (FCFF) may be proxied by:<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "A common approach to forecasting free cash flows is to:", "opts": ["project net income and expected capital expenditures.", "calculate historical free cash flow and apply an expected growth rate.", "project earnings before interest and taxes (EBIT) and expected capital expenditures."], "ans": "B", "expl": "Historical free cash flows are often used for forecasting.", "explhtml": "<p>Historical free cash flows are often used for forecasting.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>A common approach to forecasting free cash flows is to:<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "Dividends paid out to the shareholders:", "opts": ["may be higher than free cash flow to equity FCFE.", "are always equal to free cash flow to equity (FCFE).", "are always less than free cash flow to equity (FCFE)."], "ans": "A", "expl": "Dividends represent the cash that the firm chooses to pay to the shareholders and the amount of the dividend is subject to the discretion of the firm. Dividends can be equal to, lower or higher than FCFE. For example, sometimes firms may pay dividends in years when there is a net loss.", "explhtml": "<p>Dividends represent the cash that the firm chooses to pay to the shareholders and the amount of the dividend is subject to the discretion of the firm. Dividends can be equal to, lower or higher than FCFE. For example, sometimes firms may pay dividends in years when there is a net loss.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Dividends paid out to the shareholders:<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "Using the stable growth free cash flow to the firm (FCFF) model, what is the value of Quality Builders under the assumptions contained in the table below? Quality Builders\nFree Cash Flow to the Firm\nYear 0  EBIT $500 Depreciation $200 Capital Spending $300 Working Capital Additions $30 Tax Rate 40% Assumed Constant Growth Rate in Free Cash Flow 5% Weighted-average Cost of Capital 11%", "opts": ["$6,475.00.", "$2,975.00.", "$2,833.33."], "ans": "B", "expl": "The stable growth FCFF model assumes that FCFF grows at a constant rate forever. FCFF in Year 0 is equal to EBIT(1 − tax rate) + Depreciation − Capital Spending − Working Capital Additions = 500(1 − 0.4) + 200 − 300 − 30 = 170. The Firm Value = FCFF₁ / (r − gₙ) = 170(1.05) / (0.11 − 0.05) = $2,975.", "explhtml": "<p>The stable growth FCFF model assumes that FCFF grows at a constant rate forever. FCFF in Year 0 is equal to EBIT(1 − tax rate) + Depreciation − Capital Spending − Working Capital Additions = 500(1 − 0.4) + 200 − 300 − 30 = 170. The Firm Value = FCFF<sub>1<\/sub> / (r − g<sub>n<\/sub>) = 170(1.05) / (0.11 − 0.05) = $2,975.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Using the stable growth free cash flow to the firm (FCFF) model, what is the value of Quality Builders under the assumptions contained in the table below?<\/p><div class=\"tbl\"><table><tr><td colspan=2>Quality Builders<br>Free Cash Flow to the Firm<br>Year 0<\/td><\/tr><tr><td>EBIT<\/td><td>$500<\/td><\/tr><tr><td>Depreciation<\/td><td>$200<\/td><\/tr><tr><td>Capital Spending<\/td><td>$300<\/td><\/tr><tr><td>Working Capital Additions<\/td><td>$30<\/td><\/tr><tr><td>Tax Rate<\/td><td>40%<\/td><\/tr><tr><td>Assumed Constant Growth Rate in Free Cash Flow<\/td><td>5%<\/td><\/tr><tr><td>Weighted-average Cost of Capital<\/td><td>11%<\/td><\/tr><\/table><\/div><\/div>", "subj": "equity"}, {"n": 40, "q": "Which of the following statements about the three-stage FCFE model is most accurate?", "opts": ["There is a final phase when growth rate starts to decline.", "There is a transition period where the growth rate is stable.", "There is a transition period where the growth rate declines."], "ans": "C", "expl": "In the three-stage FCFE model, there is an initial phase of high growth, a transition period where the growth rate declines, and a steady-state period where growth is stable.", "explhtml": "<p>In the three-stage FCFE model, there is an initial phase of high growth, a transition period where the growth rate declines, and a steady-state period where growth is stable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following statements about the three-stage FCFE model is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Terminal value in multi-stage free cash flow valuation models is often calculated as the present value of:", "opts": ["free cash flow divided by the growth rate.", "a constant growth model's price as of the beginning of the last stage.", "a two-stage valuation model's price."], "ans": "B", "expl": "Terminal values are usually calculated as the present value of the price produced by a constant-growth model as of the beginning of the last stage.", "explhtml": "<p>Terminal values are usually calculated as the present value of the price produced by a constant-growth model as of the beginning of the last stage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.l<\/div><div class=\"qtext\"><p>Terminal value in multi-stage free cash flow valuation models is often calculated as the present value of:<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "An analyst has prepared the following scenarios for Schneider, Inc.: Scenario 1 Assumptions: Tax rate is 40%. Weighted average cost of capital (WACC) = 12%. Constant growth rate in free cash flow = 3%. Last year, free cash flow to the firm (FCFF) = $30. Target debt ratio = 10%. Scenario 2 Assumptions: Tax rate is 40%. Expenses before interest and taxes (EBIT), capital expenditures, and depreciation will grow at 15% for the next three years. After three years, the growth in EBIT will be 2%, and capital expenditure and depreciation will offset each other. WACC during high growth stage = 20%. WACC during stable growth stage = 12%. Target debt ratio = 10%. Scenario 2 FCFF Year 0\n(last year) Year 1 Year 2 Year 3 Year 4 EBIT $15.00 $17.25 $19.84 $22.81 $23.27 Capital Expenditures 6.00 6.90 7.94 9.13  Depreciation 4.00 4.60 5.29 6.08  Change in Working Capital 2.00 2.10 2.20 2.40 2.40 FCFF  5.95 7.06 8.25 11.56 Assuming that Schneider, Inc., slightly increases its financial leverage, what should happen to its firm value? The firm value should:", "opts": ["decline due to the increase in risk.", "increase due to the additional value of interest tax shields.", "not change because financial leverage has no relationship with firm value."], "ans": "B", "expl": "For small changes in leverage, the additional value added by the interest tax shields will more than offset the additional risk of bankruptcy / financial distress. Given the tax advantage of debt, the firm's WACC should decline, not increase with small changes in leverage.", "explhtml": "<p>For small changes in leverage, the additional value added by the interest tax shields will more than offset the additional risk of bankruptcy / financial distress. Given the tax advantage of debt, the firm&#x27;s WACC should decline, not increase with small changes in leverage.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>An analyst has prepared the following scenarios for Schneider, Inc.:<\/p><p>Scenario 1 Assumptions:<\/p><p>Tax rate is 40%. Weighted average cost of capital (WACC) = 12%. Constant growth rate in free cash flow = 3%. Last year, free cash flow to the firm (FCFF) = $30. Target debt ratio = 10%.<\/p><p>Scenario 2 Assumptions:<\/p><p>Tax rate is 40%. Expenses before interest and taxes (EBIT), capital expenditures, and depreciation will grow at 15% for the next three years. After three years, the growth in EBIT will be 2%, and capital expenditure and depreciation will offset each other. WACC during high growth stage = 20%. WACC during stable growth stage = 12%. Target debt ratio = 10%.<\/p><div class=\"tbl\"><table><tr><td>Scenario 2 FCFF<\/td><td>Year 0<br>(last year)<\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><\/tr><tr><td>EBIT<\/td><td>$15.00<\/td><td>$17.25<\/td><td>$19.84<\/td><td>$22.81<\/td><td>$23.27<\/td><\/tr><tr><td>Capital Expenditures<\/td><td>6.00<\/td><td>6.90<\/td><td>7.94<\/td><td>9.13<\/td><td><\/td><\/tr><tr><td>Depreciation<\/td><td>4.00<\/td><td>4.60<\/td><td>5.29<\/td><td>6.08<\/td><td><\/td><\/tr><tr><td>Change in Working Capital<\/td><td>2.00<\/td><td>2.10<\/td><td>2.20<\/td><td>2.40<\/td><td>2.40<\/td><\/tr><tr><td>FCFF<\/td><td><\/td><td>5.95<\/td><td>7.06<\/td><td>8.25<\/td><td>11.56<\/td><\/tr><\/table><\/div><p>Assuming that Schneider, Inc., slightly increases its financial leverage, what should happen to its firm value? The firm value should:<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "The firm's earnings growth rate is most accurately estimated as:", "opts": ["6.4%.", "8.0%.", "4.8%."], "ans": "B", "expl": "The firm's estimated earnings growth rate is the product of its retention ratio and ROE: g = RR × (ROE) = [(600 − 120) / 600] × (600 / 6000) = 0.08", "explhtml": "<p>The firm&#x27;s estimated earnings growth rate is the product of its retention ratio and ROE:<\/p><p>g = RR × (ROE) = [(600 − 120) / 600] × (600 / 6000) = 0.08<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"kq-note\">Câu thuộc item set (câu 43–46). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The firm&#x27;s earnings growth rate is most accurately estimated as:<\/p><\/div>", "subj": "equity"}, {"n": 44, "q": "The 2013 forecasted free cash flow to equity is:", "opts": ["$300M.", "$340M.", "$420M."], "ans": "C", "expl": "Since working capital needs are negligible, the free cash flow to equity is: FCFE = Net income − [1 − DR)] × [FCInv − Depreciation] − [(1 − DR) × WCInv] FCFE = 600M − [1 − 0.4] × (800M − 500M) = 420M where: DR = target debt to asset ratio", "explhtml": "<p>Since working capital needs are negligible, the free cash flow to equity is:<\/p><p>FCFE = Net income − [1 − DR)] × [FCInv − Depreciation] − [(1 − DR) × WCInv] FCFE = 600M − [1 − 0.4] × (800M − 500M) = 420M<\/p><p>where:<\/p><p>DR = target debt to asset ratio<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The 2013 forecasted free cash flow to equity is:<\/p><\/div>", "subj": "equity"}, {"n": 45, "q": "If the total market value of equity is $6.0 billion and the growth rate is 8.0%, the cost of equity based on the stable growth FCFE model is closest to:", "opts": ["7.0%.", "15.0%.", "14.0%."], "ans": "B", "expl": "Value of equity = FCFE₁/(Cost of equity – growth rate); so $6,000 = [$420/(Cost of equity − 0.08)] (Cost of equity − 0.08) × $6,000 = $420 Cost of equity − 0.08 = 0.07 Cost of equity = 0.15 = 15.0%", "explhtml": "<p>Value of equity = FCFE<sub>1<\/sub>/(Cost of equity – growth rate); so $6,000 = [$420/(Cost of equity − 0.08)]<\/p><p>(Cost of equity − 0.08) × $6,000 = $420 Cost of equity − 0.08 = 0.07 Cost of equity = 0.15 = 15.0%<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>If the total market value of equity is $6.0 billion and the growth rate is 8.0%, the cost of equity based on the stable growth FCFE model is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 46, "q": "The beta for HTC is 1.056, the risk-free rate is 5.0% and the market risk premium is 10.0%. The weighted average cost of capital for HTC is closest to:", "opts": ["13.34%.", "15.56%.", "11.74%."], "ans": "C", "expl": "Cost of equity = rf + (rₘ - rf) = 0.05 + 1.056(0.10) = 0.05 + 0.1056 = 0.1556 The best approximation for cost of debt is the interest expense divided by the market value of the debt. Cost of debt = Interest expense/market value of debt = $400 million/$4.0 billion = 0.10 WACC = wd × rd × (1 – t) + wₑ × rₑ = 0.40 × 0.10 × (1 – 0.40) + 0.60 × 0.1556 = 0.1174", "explhtml": "<p>Cost of equity = r<sub>f<\/sub> + (r<sub>m<\/sub> - r<sub>f<\/sub>) = 0.05 + 1.056(0.10) = 0.05 + 0.1056 = 0.1556<\/p><p>The best approximation for cost of debt is the interest expense divided by the market value of the debt. Cost of debt = Interest expense/market value of debt = $400 million/$4.0 billion = 0.10 WACC = w<sub>d<\/sub> × r<sub>d<\/sub> × (1 – t) + w<sub>e<\/sub> × r<sub>e<\/sub> = 0.40 × 0.10 × (1 – 0.40) + 0.60 × 0.1556 = 0.1174<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 43–46<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The beta for HTC is 1.056, the risk-free rate is 5.0% and the market risk premium is 10.0%. The weighted average cost of capital for HTC is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 47, "q": "In forecasting free cash flows it is most common to assume that:", "opts": ["the firm capital structure is static.", "historical levels of free cash flow will persist.", "the firm has no non-cash expenses."], "ans": "A", "expl": "A firm's target debt ratio is usually assumed to remain constant. Historical cash flows are generally projected forward with a growth rate.", "explhtml": "<p>A firm&#x27;s target debt ratio is usually assumed to remain constant. Historical cash flows are generally projected forward with a growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>In forecasting free cash flows it is most common to assume that:<\/p><\/div>", "subj": "equity"}, {"n": 48, "q": "Free cash flow (FCF) approaches are the best source of value when:", "opts": ["a firm is paying a dividend that is higher than the industry average.", "a firm has preferred stock.", "FCFs track profitability closely over the analyst's forecast horizon."], "ans": "C", "expl": "FCF approaches are best when those flows are a good indication of a firm's profitability over the analyst's forecast horizon.", "explhtml": "<p>FCF approaches are best when those flows are a good indication of a firm&#x27;s profitability over the analyst&#x27;s forecast horizon.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Free cash flow (FCF) approaches are the best source of value when:<\/p><\/div>", "subj": "equity"}, {"n": 49, "q": "The estimate of value from FCFE models will always be different than the value obtained using DDM, if:", "opts": ["FCFE is greater than dividends, and the excess is not invested in zero NPV projects.", "FCFE is higher than dividends.", "FCFE is higher than dividends, and the excess is invested in zero NPV projects."], "ans": "A", "expl": "The estimate of value from FCFE models will always be different from the value obtained using DDM, if the FCFE is greater than dividends, and the excess cash is not invested in zero NPV projects.", "explhtml": "<p>The estimate of value from FCFE models will always be different from the value obtained using DDM, if the FCFE is greater than dividends, and the excess cash is not invested in zero NPV projects.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.g<\/div><div class=\"qtext\"><p>The estimate of value from FCFE models will always be different than the value obtained using DDM, if:<\/p><\/div>", "subj": "equity"}, {"n": 50, "q": "BOX Inc. earned $4.55 per share last year. The firm had capital expenditures of $1.75 per share and depreciation expense of $1.05. BOX Inc. has a target debt ratio of 0.25.  High-Growth Period Transitional Period Stable-Growth Period Duration 2 Years 5 Years  Earnings growth rate 45% Will decline 8% per\nyear to 5% in the\nstable-growth period 5% Growth in Capital\nExpenditures 30% Increases by 8% per\nyear Same as Depreciation Growth in Depreciation 30% Increases by 13% per\nyear Same as Capital\nExpenditures Change in Working Capital Given Below Given Below $2.25 per share in Year\n8 Shareholder Required\nReturn 25% 15% 10%  Yr 0 Yr 1 Yr 2 Yr 3 Yr 4 Yr 5 Yr 6 Yr 7 EPS 4.55 6.60 9.57 13.11 16.91 20.46 23.12 24.27 Capital\nExpenditures 1.75 2.28 2.96 3.19 3.45 3.73 4.02 4.35 Depreciation 1.05 1.37 1.77 2.01 2.27 2.56 2.89 3.27 Change in WC 0.90 1.10 1.40 1.60 1.80 2.00 2.20 2.10 FCFE   7.63 11.01 14.67 18.08 20.62 21.89 In year 1, what is the free cashflow to equity (FCFE) for BOX Inc.?", "opts": ["$5.09.", "$3.35.", "$6.10."], "ans": "A", "expl": "Year 1 FCFE = Earnings per share − (Capital Expenditures – Depreciation) (1 − Debt Ratio) − Change in working capital (1 − Debt Ratio) Year 1 FCFE = 6.60 − (2.28 − 1.37)(1 − 0.25) – (1.1)(1 − 0.25) = 5.09", "explhtml": "<p>Year 1 FCFE = Earnings per share − (Capital Expenditures – Depreciation) (1 − Debt Ratio) − Change in working capital (1 − Debt Ratio) Year 1 FCFE = 6.60 − (2.28 − 1.37)(1 − 0.25) – (1.1)(1 − 0.25) = 5.09<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>BOX Inc. earned $4.55 per share last year. The firm had capital expenditures of $1.75 per share and depreciation expense of $1.05. BOX Inc. has a target debt ratio of 0.25.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>High-Growth Period<\/td><td>Transitional Period<\/td><td>Stable-Growth Period<\/td><\/tr><tr><td>Duration<\/td><td>2 Years<\/td><td>5 Years<\/td><td><\/td><\/tr><tr><td>Earnings growth rate<\/td><td>45%<\/td><td>Will decline 8% per<br>year to 5% in the<br>stable-growth period<\/td><td>5%<\/td><\/tr><tr><td>Growth in Capital<br>Expenditures<\/td><td>30%<\/td><td>Increases by 8% per<br>year<\/td><td>Same as Depreciation<\/td><\/tr><tr><td>Growth in Depreciation<\/td><td>30%<\/td><td>Increases by 13% per<br>year<\/td><td>Same as Capital<br>Expenditures<\/td><\/tr><tr><td>Change in Working Capital<\/td><td>Given Below<\/td><td>Given Below<\/td><td>$2.25 per share in Year<br>8<\/td><\/tr><tr><td>Shareholder Required<br>Return<\/td><td>25%<\/td><td>15%<\/td><td>10%<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><td><\/td><td>Yr 0<\/td><td>Yr 1<\/td><td>Yr 2<\/td><td>Yr 3<\/td><td>Yr 4<\/td><td>Yr 5<\/td><td>Yr 6<\/td><td>Yr 7<\/td><\/tr><tr><td>EPS<\/td><td>4.55<\/td><td>6.60<\/td><td>9.57<\/td><td>13.11<\/td><td>16.91<\/td><td>20.46<\/td><td>23.12<\/td><td>24.27<\/td><\/tr><tr><td>Capital<br>Expenditures<\/td><td>1.75<\/td><td>2.28<\/td><td>2.96<\/td><td>3.19<\/td><td>3.45<\/td><td>3.73<\/td><td>4.02<\/td><td>4.35<\/td><\/tr><tr><td>Depreciation<\/td><td>1.05<\/td><td>1.37<\/td><td>1.77<\/td><td>2.01<\/td><td>2.27<\/td><td>2.56<\/td><td>2.89<\/td><td>3.27<\/td><\/tr><tr><td>Change in WC<\/td><td>0.90<\/td><td>1.10<\/td><td>1.40<\/td><td>1.60<\/td><td>1.80<\/td><td>2.00<\/td><td>2.20<\/td><td>2.10<\/td><\/tr><tr><td>FCFE<\/td><td><\/td><td><\/td><td>7.63<\/td><td>11.01<\/td><td>14.67<\/td><td>18.08<\/td><td>20.62<\/td><td>21.89<\/td><\/tr><\/table><\/div><p>In year 1, what is the free cashflow to equity (FCFE) for BOX Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 51, "q": "Valuation with free cash flow to equity and free cash flow to the firm:", "opts": ["use different discount rates.", "both use the cost of equity.", "both use the after-tax cost of debt."], "ans": "A", "expl": "Free cash flow to the firm uses the weighted average cost of capital and free cash flow to equity uses the cost of equity. The key is to use a discount rate that reflects the opportunity cost of the indicated investor group.", "explhtml": "<p>Free cash flow to the firm uses the weighted average cost of capital and free cash flow to equity uses the cost of equity. The key is to use a discount rate that reflects the opportunity cost of the indicated investor group.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Valuation with free cash flow to equity and free cash flow to the firm:<\/p><\/div>", "subj": "equity"}, {"n": 52, "q": "Free cash flow approaches are the best source of value when:", "opts": ["return on assets is falling.", "dividends are not paid.", "a firm has significant minority interest."], "ans": "B", "expl": "Free cash flow approaches are best when dividends are not paid. Both remaining responses have nothing to do with the decision.", "explhtml": "<p>Free cash flow approaches are best when dividends are not paid. Both remaining responses have nothing to do with the decision.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Free cash flow approaches are the best source of value when:<\/p><\/div>", "subj": "equity"}, {"n": 53, "q": "Currently, a firm has no outstanding debt. If the firm would add a small amount of leverage to its balance sheet, what should be the impact on the firm's value? There would be:", "opts": ["a decrease in value due to higher interest expense.", "no change in firm value.", "an increase in value due to interest tax shields."], "ans": "C", "expl": "The amount of financial leverage used by a firm will affect its value. For small amounts of leverage, the additional bankruptcy risk will be low, and will be more than offset by the additional value of interest tax shields.", "explhtml": "<p>The amount of financial leverage used by a firm will affect its value. For small amounts of leverage, the additional bankruptcy risk will be low, and will be more than offset by the additional value of interest tax shields.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>Currently, a firm has no outstanding debt. If the firm would add a small amount of leverage to its balance sheet, what should be the impact on the firm&#x27;s value? There would be:<\/p><\/div>", "subj": "equity"}, {"n": 54, "q": "Industrial Light currently has: Expected free cash flow to the firm in one year = $4.0 million. Cost of equity = 12%. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%. What is the value of equity?", "opts": ["$50,000,000.", "$44,440,000.", "$80,000,000."], "ans": "A", "expl": "The overall value of the firm is $4,000,000 / (0.10 – 0.05) = $80,000,000. Thus, the value of equity is $80,000,000 – $30,000,000 = $50,000,000.", "explhtml": "<p>The overall value of the firm is $4,000,000 / (0.10 – 0.05) = $80,000,000. Thus, the value of equity is $80,000,000 – $30,000,000 = $50,000,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Industrial Light currently has:<\/p><p>Expected free cash flow to the firm in one year = $4.0 million. Cost of equity = 12%. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%.<\/p><p>What is the value of equity?<\/p><\/div>", "subj": "equity"}, {"n": 55, "q": "A biotech firm is currently experiencing high growth and pays no dividends. One of their product patents is scheduled to expire in 5 years. This firm would be a good candidate for which of the following valuation models?", "opts": ["Single-stage free cash flow to equity (FCFE).", "Two-stage free cash flow to equity (FCFE).", "Two-stage dividend discount model (DDM)."], "ans": "B", "expl": "The two-stage FCFE model is well suited to value a firm that is currently experiencing high growth and will likely see this growth drop to a lower, more stable rate in the future.", "explhtml": "<p>The two-stage FCFE model is well suited to value a firm that is currently experiencing high growth and will likely see this growth drop to a lower, more stable rate in the future.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>A biotech firm is currently experiencing high growth and pays no dividends. One of their product patents is scheduled to expire in 5 years. This firm would be a good candidate for which of the following valuation models?<\/p><\/div>", "subj": "equity"}, {"n": 56, "q": "In computing free cash flow, the most significant non-cash expense is usually:", "opts": ["deferred taxes.", "depreciation.", "capital expenditures."], "ans": "B", "expl": "Depreciation is usually the largest non-cash expense.", "explhtml": "<p>Depreciation is usually the largest non-cash expense.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.c<\/div><div class=\"qtext\"><p>In computing free cash flow, the most significant non-cash expense is usually:<\/p><\/div>", "subj": "equity"}, {"n": 57, "q": "Industrial Light currently has: Free cash flow to equity = $4.0 million. Cost of equity = 12%. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%. What is the value of equity?", "opts": ["$60,000,000.", "$27,142,857.", "$57,142,857."], "ans": "A", "expl": "The value of equity is [($4,000,000)(1.05) / (0.12 – 0.05)] = $60,000,000.", "explhtml": "<p>The value of equity is [($4,000,000)(1.05) / (0.12 – 0.05)] = $60,000,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Industrial Light currently has:<\/p><p>Free cash flow to equity = $4.0 million. Cost of equity = 12%. Weighted average cost of capital = 10%. Total debt = $30.0 million. Long-term expected growth rate = 5%.<\/p><p>What is the value of equity?<\/p><\/div>", "subj": "equity"}, {"n": 58, "q": "The primary difference between the three-stage DDM and the FCFE model is:", "opts": ["cost of equity.", "growth rate assumptions.", "the definition of cash flows."], "ans": "C", "expl": "The primary difference between the dividend discount models and the free cash flow from equity models lies in the definition of cash flows. The FCFE model uses residual cash flows after meeting all financial obligations and investment needs. The DDM uses a strict definition of cash flows to equity, that is, the expected dividends on the stock.", "explhtml": "<p>The primary difference between the dividend discount models and the free cash flow from equity models lies in the definition of cash flows. The FCFE model uses residual cash flows after meeting all financial obligations and investment needs. The DDM uses a strict definition of cash flows to equity, that is, the expected dividends on the stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.g<\/div><div class=\"qtext\"><p>The primary difference between the three-stage DDM and the FCFE model is:<\/p><\/div>", "subj": "equity"}, {"n": 59, "q": "In forecasting free cash flows it is common to assume that investment in working capital:", "opts": ["will be financed using the target debt ratio.", "is greater than fixed capital investment during a growth phase.", "will equal fixed capital investment."], "ans": "A", "expl": "It is usually assumed that the investment in working capital will be financed consistent with the target debt ratio.", "explhtml": "<p>It is usually assumed that the investment in working capital will be financed consistent with the target debt ratio.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.e<\/div><div class=\"qtext\"><p>In forecasting free cash flows it is common to assume that investment in working capital:<\/p><\/div>", "subj": "equity"}, {"n": 60, "q": "Mark Washington, CFA, uses a two-stage free cash flow to equity (FCFE) discount model to value Texas Van Lines. His analysis yields an extremely low value, which he believes is incorrect. Which of the following is least likely to be a cause of this suspect valuation estimate?", "opts": ["The forecast of working capital as a percentage of revenues in the stable growth period is not large enough to maintain the long-term sustainable growth rate.", "The cost of equity estimate in the stable growth period is too high for a stable firm.", "Earnings are temporarily depressed because of a one-time extraordinary accounting charge in the most recent fiscal year."], "ans": "A", "expl": "The larger the estimate of working capital as a percentage of revenues, the larger the investment in net working capital, and the lower the FCFE in the stable period. A low stable-period FCFE estimate will result in a low estimate of value today. The solution is to use a working capital ratio closer to the long-run industry average. If the cost of equity estimate in the stable growth period is too high, the terminal value will be too low. Because the terminal value typically makes up a large portion of the current value, this will cause the current value estimate to be too low. The solution is to use a cost of equity estimate based on a beta of one. If earnings are temporarily depressed, all the FCFE estimates will be low, and the current value estimate will be low. The solution is to use an estimate of long-run normalized earnings.", "explhtml": "<p>The larger the estimate of working capital as a percentage of revenues, the larger the investment in net working capital, and the lower the FCFE in the stable period. A low stable-period FCFE estimate will result in a low estimate of value today. The solution is to use a working capital ratio closer to the long-run industry average. If the cost of equity estimate in the stable growth period is too high, the terminal value will be too low. Because the terminal value typically makes up a large portion of the current value, this will cause the current value estimate to be too low. The solution is to use a cost of equity estimate based on a beta of one. If earnings are temporarily depressed, all the FCFE estimates will be low, and the current value estimate will be low. The solution is to use an estimate of long-run normalized earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>Mark Washington, CFA, uses a two-stage free cash flow to equity (FCFE) discount model to value Texas Van Lines. His analysis yields an extremely low value, which he believes is incorrect. Which of the following is least likely to be a cause of this suspect valuation estimate?<\/p><\/div>", "subj": "equity"}, {"n": 61, "q": "Using the information below, value the stock of Symphony Publishing, Inc. using the free cash flow from equity (FCFE) valuation method. Required return of 13.0%. Value at the end of year 3 of 13 times FCFE₃. Shares outstanding: 10.0 million. Net income in year 1 of $10.0 million, projected to grow at 10% for the next two years. Depreciation per year of $3.0 million. Capital Expendi
