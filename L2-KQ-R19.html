the firm = 9.915 + 10.924 + 12.034 + 12.767 + 12.656 + 11.666 + 309.135 = 379<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 109–114<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>Assuming Patrick is correct to use free cash flow to the firm to value Fite Inc.; the value of the firm is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 115, "q": "Which of the following is most useful in analyzing firms that have high leverage and high growth?", "opts": ["Stable-growth free cash flow to the firm (FCFF) model.", "Two-stage free cash flow to equity (FCFE) model.", "Two-stage free cash flow to the firm (FCFF) model."], "ans": "C", "expl": "Of the cash flow valuation models mentioned above, the two-stage FCFF model is most useful in analyzing the firms that have high leverage and high growth. The high growth will make the stable growth models inapplicable, while the high leverage makes the FCFF model more attractive.", "explhtml": "<p>Of the cash flow valuation models mentioned above, the two-stage FCFF model is most useful in analyzing the firms that have high leverage and high growth. The high growth will make the stable growth models inapplicable, while the high leverage makes the FCFF model more attractive.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following is most useful in analyzing firms that have high leverage and high growth?<\/p><\/div>", "subj": "equity"}, {"n": 116, "q": "The two-stage FCFE model is suitable for valuing firms that:", "opts": ["have moderate growth in the initial phase that declines gradually to a stable rate.", "have very high but declining growth rate in the initial stage.", "are in an industry with significant barriers to entry."], "ans": "C", "expl": "The two-stage FCFE model is suitable for valuing firms in industries with significant barriers to entry. Where these are present it is possible for the firm to maintain a high growth rate during an initial phase of low competition, and that the rate will drop sharply to a normalized rate when competition ultimately appears.", "explhtml": "<p>The two-stage FCFE model is suitable for valuing firms in industries with significant barriers to entry. Where these are present it is possible for the firm to maintain a high growth rate during an initial phase of low competition, and that the rate will drop sharply to a normalized rate when competition ultimately appears.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The two-stage FCFE model is suitable for valuing firms that:<\/p><\/div>", "subj": "equity"}, {"n": 117, "q": "In five years, a firm is expected to be operating in a stage of its life cycle wherein its expected growth rate is 5%, indefinitely; its required rate of return on equity is 11%; its weighted average cost of capital is 9%; and the free cash flow to equity in year 6 will be $5.25 per share. What is its projected terminal value at the end of year 5?", "opts": ["$51.93.", "$131.25.", "$87.50."], "ans": "C", "expl": "Terminal value = FCFE / (k − g) = $5.25 / (0.11 − 0.05) = $87.50", "explhtml": "<p>Terminal value = FCFE / (k − g) = $5.25 / (0.11 − 0.05) = $87.50<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.l<\/div><div class=\"qtext\"><p>In five years, a firm is expected to be operating in a stage of its life cycle wherein its expected growth rate is 5%, indefinitely; its required rate of return on equity is 11%; its weighted average cost of capital is 9%; and the free cash flow to equity in year 6 will be $5.25 per share. What is its projected terminal value at the end of year 5?<\/p><\/div>", "subj": "equity"}, {"n": 118, "q": "The repayment of a significant amount of outstanding debt will cause free cash flow to equity (FCFE) to:", "opts": ["remain the same.", "decrease.", "increase."], "ans": "B", "expl": "Debt repayment will decrease net borrowing and, hence, decrease FCFE because: FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.", "explhtml": "<p>Debt repayment will decrease net borrowing and, hence, decrease FCFE because: FCFE = FCFF – [interest expense] (1 – tax rate) + net borrowing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.f<\/div><div class=\"qtext\"><p>The repayment of a significant amount of outstanding debt will cause free cash flow to equity (FCFE) to:<\/p><\/div>", "subj": "equity"}, {"n": 119, "q": "Using the statement of cash flows, an analyst estimates the free cash flow to the firm as cash flow from operating activities minus cash flow from investing activities. Which of the following statements is correct?", "opts": ["Analyst should be adding after-tax interest also.", "Analyst should be adding cash flow from financing activities also.", "Analyst is correctly calculating FCFF."], "ans": "A", "expl": "FCFF = CFO – CFI + INT (1-T)", "explhtml": "<p>FCFF = CFO – CFI + INT (1-T)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.3, LOS 19.c<\/div><div class=\"qtext\"><p>Using the statement of cash flows, an analyst estimates the free cash flow to the firm as cash flow from operating activities minus cash flow from investing activities. Which of the following statements is correct?<\/p><\/div>", "subj": "equity"}, {"n": 120, "q": "The two-stage (stable growth) free cash flow to equity (FCFE) and free cash flow to the firm (FCFF) models typically assume:", "opts": ["a high level of free cash flow for n years and then a lower level of free cash flow thereafter.", "high growth in free cash flow for n years and then constant growth in free cash flow forever after.", "growth of free cash flow that declines to the required rate of return in the last stage."], "ans": "B", "expl": "The two-stage model using either FCFE or FCFF typically assumes a high growth of free cash flow for n years and then a constant growth in free cash flow forever after. Multi-stage models assume that the required rate of return exceeds the growth rate in the last stage. In a two-stage free cash flow models, the growth rate in the second stage represents the long-run sustainable growth rate, which is generally a low rate that is close to the GDP growth rate.", "explhtml": "<p>The two-stage model using either FCFE or FCFF typically assumes a high growth of free cash flow for n years and then a constant growth in free cash flow forever after. Multi-stage models assume that the required rate of return exceeds the growth rate in the last stage. In a two-stage free cash flow models, the growth rate in the second stage represents the long-run sustainable growth rate, which is generally a low rate that is close to the GDP growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The two-stage (stable growth) free cash flow to equity (FCFE) and free cash flow to the firm (FCFF) models typically assume:<\/p><\/div>", "subj": "equity"}, {"n": 121, "q": "In the two-stage FCFE model, the required rate of return for calculating terminal value should be:", "opts": ["equal to the average required rate of return for the industry.", "lower than the required rate of return used for the high-growth phase.", "higher than the required rate of return used for the high-growth phase."], "ans": "B", "expl": "In most cases, the required rate of return used to calculate the terminal value should be lower than the required rate of return used for initial high-growth phase. During the stable period the firm is less risky and the required rate of return is therefore lower.", "explhtml": "<p>In most cases, the required rate of return used to calculate the terminal value should be lower than the required rate of return used for initial high-growth phase. During the stable period the firm is less risky and the required rate of return is therefore lower.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.l<\/div><div class=\"qtext\"><p>In the two-stage FCFE model, the required rate of return for calculating terminal value should be:<\/p><\/div>", "subj": "equity"}, {"n": 122, "q": "An analyst is performing an equity valuation for a minority equity position in a dividend paying multinational. The appropriate model for this analysis is most likely:", "opts": ["The Dividend Discount approach.", "FCFE approach.", "FCFF approach."], "ans": "A", "expl": "The dividend discount model is most appropriate for valuing a minority equity position in a dividend-paying company. The free cash flow approach looks to the source of dividends from the perspective of an owner that has control rather than directly at dividends.", "explhtml": "<p>The dividend discount model is most appropriate for valuing a minority equity position in a dividend-paying company. The free cash flow approach looks to the source of dividends from the perspective of an owner that has control rather than directly at dividends.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>An analyst is performing an equity valuation for a minority equity position in a dividend paying multinational. The appropriate model for this analysis is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 123, "q": "Which of the following items is NOT subtracted from the net income to calculate free cash flow to equity (FCFE)?", "opts": ["increase in accounts receivable.", "Interest payments to bondholders.", "Increase in fixed assets."], "ans": "B", "expl": "Interest payments to bondholders are included in the income statement and are already subtracted to calculate net income.", "explhtml": "<p>Interest payments to bondholders are included in the income statement and are already subtracted to calculate net income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.c<\/div><div class=\"qtext\"><p>Which of the following items is NOT subtracted from the net income to calculate free cash flow to equity (FCFE)?<\/p><\/div>", "subj": "equity"}, {"n": 124, "q": "An analyst has prepared the following scenarios for Schneider, Inc.: Scenario 1 Assumptions Tax Rate is 40%. Weighted average cost of capital (WACC) = 12%. Constant growth rate in free cash flow = 3%. Last year, free cash flow to the firm (FCFF) = $30. Target debt ratio = 10%. Scenario 2 Assumptions Tax Rate is 40%. Earnings before interest and taxes (EBIT), capital expenditures, and depreciation will grow at 15% for the next three years. After three years, the growth in EBIT will be 2%, and capital expenditure and depreciation will offset each other. Weighted average cost of capital (WACC) during high growth stage = 20%. Weighted average cost of capital (WACC) during stable growth stage = 12%. Target debt ratio = 10%. Scenario 2 FCFF Year 0 (last\nyear) Year 1 Year 2 Year 3 Year 4 EBIT $15.00 $17.25 $19.84 $22.81 $23.27 Capital Expenditures 6.00 6.90 7.94 9.13  Depreciation 4.00 4.60 5.29 6.08  Change in Working Capital 2.00 2.10 2.20 2.40 2.40 FCFF  5.95 7.06 8.25 11.56 Given the assumptions contained in Scenario 2, what is the value of the firm?", "opts": ["$70.39.", "$81.54.", "$96.92."], "ans": "B", "expl": "Use the two-stage FCFF model to value the firm. The Terminal Value of the firm as of Year 3 = 11.56 / (0.12 - 0.02) = 115.60. The value = 5.95 / (1.20) + 7.06 / (1.20)² + (8.25 + 115.62) / (1.20)³ = 81.54.", "explhtml": "<p>Use the two-stage FCFF model to value the firm. The Terminal Value of the firm as of Year 3 = 11.56 / (0.12 - 0.02) = 115.60. The value = 5.95 / (1.20) + 7.06 / (1.20)<sup>2<\/sup> + (8.25 + 115.62) / (1.20)<sup>3<\/sup> = 81.54.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>An analyst has prepared the following scenarios for Schneider, Inc.:<\/p><p>Scenario 1 Assumptions<\/p><p>Tax Rate is 40%. Weighted average cost of capital (WACC) = 12%. Constant growth rate in free cash flow = 3%. Last year, free cash flow to the firm (FCFF) = $30. Target debt ratio = 10%.<\/p><p>Scenario 2 Assumptions<\/p><p>Tax Rate is 40%. Earnings before interest and taxes (EBIT), capital expenditures, and depreciation will grow at 15% for the next three years. After three years, the growth in EBIT will be 2%, and capital expenditure and depreciation will offset each other. Weighted average cost of capital (WACC) during high growth stage = 20%. Weighted average cost of capital (WACC) during stable growth stage = 12%. Target debt ratio = 10%.<\/p><div class=\"tbl\"><table><tr><td>Scenario 2 FCFF<\/td><td>Year 0 (last<br>year)<\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><\/tr><tr><td>EBIT<\/td><td>$15.00<\/td><td>$17.25<\/td><td>$19.84<\/td><td>$22.81<\/td><td>$23.27<\/td><\/tr><tr><td>Capital Expenditures<\/td><td>6.00<\/td><td>6.90<\/td><td>7.94<\/td><td>9.13<\/td><td><\/td><\/tr><tr><td>Depreciation<\/td><td>4.00<\/td><td>4.60<\/td><td>5.29<\/td><td>6.08<\/td><td><\/td><\/tr><tr><td>Change in Working Capital<\/td><td>2.00<\/td><td>2.10<\/td><td>2.20<\/td><td>2.40<\/td><td>2.40<\/td><\/tr><tr><td>FCFF<\/td><td><\/td><td>5.95<\/td><td>7.06<\/td><td>8.25<\/td><td>11.56<\/td><\/tr><\/table><\/div><p>Given the assumptions contained in Scenario 2, what is the value of the firm?<\/p><\/div>", "subj": "equity"}, {"n": 125, "q": "If a firm is valued using FCFF, the relevant discount rate is the:", "opts": ["before-tax weighted average cost of capital.", "after-tax weighted average cost of capital.", "before-tax cost of equity."], "ans": "B", "expl": "Since the FCFF is the cash available to all the investors, the after-tax weighted average cost of capital should be used as the discount rate in FCFF models.", "explhtml": "<p>Since the FCFF is the cash available to all the investors, the after-tax weighted average cost of capital should be used as the discount rate in FCFF models.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.a<\/div><div class=\"qtext\"><p>If a firm is valued using FCFF, the relevant discount rate is the:<\/p><\/div>", "subj": "equity"}, {"n": 126, "q": "The difference between the value estimate produced by the dividend discount model (DDM) and the one produced by the free cash flow to equity (FCFE) model can be accounted for by which of the following?", "opts": ["Different estimates of model risk.", "Different sales forecast.", "The value in controlling the firm's dividend policy."], "ans": "C", "expl": "The difference between the value estimate produced by the DDM and the one produced by the FCFE model can be interpreted as the value of controlling the firm's dividend policy.", "explhtml": "<p>The difference between the value estimate produced by the DDM and the one produced by the FCFE model can be interpreted as the value of controlling the firm&#x27;s dividend policy.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.g<\/div><div class=\"qtext\"><p>The difference between the value estimate produced by the dividend discount model (DDM) and the one produced by the free cash flow to equity (FCFE) model can be accounted for by which of the following?<\/p><\/div>", "subj": "equity"}, {"n": 127, "q": "A firm has: Free cash flow to equity = $4.0 million. Cost of equity = 12%. Long-term expected growth rate = 5%. Value of equity per share = $57.14 per share. What will happen to the value of equity if the cost of equity decreases to 10%?", "opts": ["The value will increase.", "There is insufficient information to tell.", "The value will decrease."], "ans": "A", "expl": "Everything else being constant, a decrease in the relevant required rate of return should increase the value of the equity per share.", "explhtml": "<p>Everything else being constant, a decrease in the relevant required rate of return should increase the value of the equity per share.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.i<\/div><div class=\"qtext\"><p>A firm has:<\/p><p>Free cash flow to equity = $4.0 million. Cost of equity = 12%. Long-term expected growth rate = 5%. Value of equity per share = $57.14 per share.<\/p><p>What will happen to the value of equity if the cost of equity decreases to 10%?<\/p><\/div>", "subj": "equity"}, {"n": 128, "q": "Terminal value in a multi-stage free cash flow to equity (FCFE) valuation model is often calculated as the present value of:", "opts": ["free cash flow divided by the growth rate.", "FCFE divided by the total of required rate on equity minus growth.", "a two-stage valuation model's price."], "ans": "B", "expl": "Terminal values are usually calculated as the present value of the price produced by a constant-growth model as of the beginning of the last stage, which is FCFE / (required rate on equity – growth).", "explhtml": "<p>Terminal values are usually calculated as the present value of the price produced by a constant-growth model as of the beginning of the last stage, which is FCFE / (required rate on equity – growth).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.l<\/div><div class=\"qtext\"><p>Terminal value in a multi-stage free cash flow to equity (FCFE) valuation model is often calculated as the present value of:<\/p><\/div>", "subj": "equity"}, {"n": 129, "q": "The three-stage FCFE model might result in an extremely high value if:", "opts": ["the growth rate in the stable-period is equal to that of GNP.", "the growth rate in the stable-period is too low.", "the growth rate in the stable-period is too high."], "ans": "C", "expl": "If the growth rate in the stable-period is too high or the high-growth and transition periods are too long, the three-stage FCFE model might result in an extremely high value.", "explhtml": "<p>If the growth rate in the stable-period is too high or the high-growth and transition periods are too long, the three-stage FCFE model might result in an extremely high value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The three-stage FCFE model might result in an extremely high value if:<\/p><\/div>", "subj": "equity"}, {"n": 130, "q": "The one-stage (stable growth) free cash flow models assume:", "opts": ["the required rate of return is less than the growth rate.", "the required rate of return exceeds the growth rate.", "a constant growth rate for n years and a high growth rate forever thereafter."], "ans": "B", "expl": "The one-stage model using either free cash flow to equity (FCFE) or free cash flow to the firm (FCFF) assumes that the required rate of return exceeds the growth rate. If this was not the case, the model would produce an unrealistic negative price.", "explhtml": "<p>The one-stage model using either free cash flow to equity (FCFE) or free cash flow to the firm (FCFF) assumes that the required rate of return exceeds the growth rate. If this was not the case, the model would produce an unrealistic negative price.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>The one-stage (stable growth) free cash flow models assume:<\/p><\/div>", "subj": "equity"}, {"n": 131, "q": "Which of the following types of companies is the two-stage free cash flow to equity (FCFE) model best suited for? Companies:", "opts": ["in high growth industries that will face increasing competitive pressures over time, leading to a gradual decline in growth to a stable level.", "with patents or firms in an industry with significant barriers to entry.", "growing at a rate similar to or less than the nominal growth rate of the economy."], "ans": "B", "expl": "The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry. Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the single-stage FCFE Model. Companies in high growth industries correspond to the three-Stage FCFE Model.", "explhtml": "<p>The two-stage model is best suited to analyzing firms in a high growth phase that will maintain that growth for a specific period, such as firms with patents or firms in an industry with significant barriers to entry. Companies growing at a rate similar to or less than the nominal growth rate of the economy are best suited for the single-stage FCFE Model. Companies in high growth industries correspond to the three-Stage FCFE Model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.j<\/div><div class=\"qtext\"><p>Which of the following types of companies is the two-stage free cash flow to equity (FCFE) model best suited for? Companies:<\/p><\/div>", "subj": "equity"}, {"n": 132, "q": "A control perspective is most consistent with which of the following valuation approaches?", "opts": ["Price to enterprise value.", "Free cash flow (FCF).", "Dividends."], "ans": "B", "expl": "Dividend policy can be changed by the buyer of a firm. Thus, the FCF perspective looks to the source of dividends in a position of control rather than directly at dividends. The price to enterprise value approach does not focus on cash flows.", "explhtml": "<p>Dividend policy can be changed by the buyer of a firm. Thus, the FCF perspective looks to the source of dividends in a position of control rather than directly at dividends. The price to enterprise value approach does not focus on cash flows.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.1, LOS 19.b<\/div><div class=\"qtext\"><p>A control perspective is most consistent with which of the following valuation approaches?<\/p><\/div>", "subj": "equity"}, {"n": 133, "q": "The following information is derived from the financial records of Brown Company for the year ended December 31, 2004: Sales $3,400,000 Cost of Goods Sold (COGS) (2,100,000) Depreciation (300,000) Interest Paid (200,000) Gain on Sale of Old Equipment 400,000 Income Taxes Paid (300,000) Net Income $900,000 Brown issued bonds on June 30, 2004 and received proceeds of $4,000,000. Old equipment with a book value of $2,000,000 was sold on August 15, 2004 for $2,400,000 cash. Brown purchased land for a new factory on September 30, 2004 for $3,000,000, issuing a $2,000,000 note and paying the balance in cash. Cash flow from operations less capital expenditures is:", "opts": ["$2,200,000.", "$200,000.", "$6,200,000."], "ans": "B", "expl": "Brown's cash flow from operations (CFO) was $800,000 = ($900,000 Net Income + $300,000 depreciation − $400,000 gain). Capital expenditure cash flows were −$3,000,000 for the factory and $2,400,000 cash received from sale of the old equipment for a net outflow of cash of $600,000. $200,000 = ($800,000 - $600,000).", "explhtml": "<p>Brown&#x27;s cash flow from operations (CFO) was $800,000 = ($900,000 Net Income + $300,000 depreciation − $400,000 gain). Capital expenditure cash flows were −$3,000,000 for the factory and $2,400,000 cash received from sale of the old equipment for a net outflow of cash of $600,000.<\/p><p>$200,000 = ($800,000 - $600,000).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.3, LOS 19.c<\/div><div class=\"qtext\"><p>The following information is derived from the financial records of Brown Company for the year ended December 31, 2004:<\/p><div class=\"tbl\"><table><tr><td>Sales<\/td><td>$3,400,000<\/td><\/tr><tr><td>Cost of Goods Sold (COGS)<\/td><td>(2,100,000)<\/td><\/tr><tr><td>Depreciation<\/td><td>(300,000)<\/td><\/tr><tr><td>Interest Paid<\/td><td>(200,000)<\/td><\/tr><tr><td>Gain on Sale of Old Equipment<\/td><td>400,000<\/td><\/tr><tr><td>Income Taxes Paid<\/td><td>(300,000)<\/td><\/tr><tr><td>Net Income<\/td><td>$900,000<\/td><\/tr><\/table><\/div><p>Brown issued bonds on June 30, 2004 and received proceeds of $4,000,000. Old equipment with a book value of $2,000,000 was sold on August 15, 2004 for $2,400,000 cash. Brown purchased land for a new factory on September 30, 2004 for $3,000,000, issuing a $2,000,000 note and paying the balance in cash.<\/p><p>Cash flow from operations less capital expenditures is:<\/p><\/div>", "subj": "equity"}, {"n": 134, "q": "SOX, Inc., expects high growth in the next 4 years before slowing to a stable future growth of 3%. The firm is assumed to pay no dividends in the near future and has the following forecasted free cash flow to equity (FCFE) information on a per share basis in the high-growth period:  Year 1 Year 2 Year 3 Year 4 FCFE $3.05 $4.10 $5.24 $6.71 High-growth period assumptions: SOX, Inc.'s, target debt ratio is 40% and a beta of 1.3. The long-term Treasury Bond Rate is 4.0%, and the expected equity risk premium is 6%. Stable-growth period assumptions: SOX, Inc.'s, target debt ratio is 40% and a beta of 1.0. The long-term Treasury Bond Rate is 4.0% and the expected equity risk premium is 6%. Capital expenditures are assumed to equal depreciation. In year 5, earnings are $8.10 per share while the change in working capital is $2.00 per share. Earnings and working capital are expected to grow by 3% a year in the future. What is the present value on a per share basis for SOX, Inc.?", "opts": ["$70.49.", "$64.24.", "$77.15."], "ans": "C", "expl": "The required rate of return in the high-growth period is (r) = 0.04 + 1.3(0.06) = 0.118. The required rate of return in the stable-growth period is (r) = 0.04 + 1.0(0.06) = 0.10. The Present Value (PV) of the FCFE in the high-growth period is (3.05 / 1.118) + (4.10 / 1.118²) + (5.24 / 1.118³) + (6.71 / 1.118⁴) = 14.06. The Terminal Price = Expected FCFEₙ ₊ ₁ / (r − gₙ) with FCFEₙ ₊ ₁ = FCFE in year 5 =Earnings per share − (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 8.10 − 0(1 − 0.4) − 2.00(1 − 0.4) = 6.90. The Terminal Price = 6.90 / (0.10 − 0.03) = 98.57. The PV of the Terminal Price = (98.57 / 1.118⁴) = 63.09. The value of a share today is the PV of the FCFE in the high-growth period plus the PV of the Terminal Price = 14.06 + 63.09 = 77.15.", "explhtml": "<p>The required rate of return in the high-growth period is (r) = 0.04 + 1.3(0.06) = 0.118. The required rate of return in the stable-growth period is (r) = 0.04 + 1.0(0.06) = 0.10.<\/p><p>The Present Value (PV) of the FCFE in the high-growth period is (3.05 / 1.118) + (4.10 / 1.118<sup>2<\/sup>) + (5.24 / 1.118<sup>3<\/sup>) + (6.71 / 1.118<sup>4<\/sup>) = 14.06.<\/p><p>The Terminal Price = Expected FCFE<sub>n + 1<\/sub> / (r − g<sub>n<\/sub>) with FCFE<sub>n + 1 <\/sub>= FCFE in year 5 =<sub>Earnings per share −<\/sub> (Capital Expenditures − Depreciation)(1 − Debt Ratio) − (Change in working capital)(1 − Debt Ratio) = 8.10 − 0(1 − 0.4) − 2.00(1 − 0.4) = 6.90. The Terminal Price = 6.90 / (0.10 − 0.03) = 98.57.<\/p><p>The PV of the Terminal Price = (98.57 / 1.118<sup>4<\/sup>) = 63.09.<\/p><p>The value of a share today is the PV of the FCFE in the high-growth period plus the PV of the Terminal Price = 14.06 + 63.09 = 77.15.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>SOX, Inc., expects high growth in the next 4 years before slowing to a stable future growth of 3%. The firm is assumed to pay no dividends in the near future and has the following forecasted free cash flow to equity (FCFE) information on a per share basis in the high-growth period:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><td>Year 4<\/td><\/tr><tr><td>FCFE<\/td><td>$3.05<\/td><td>$4.10<\/td><td>$5.24<\/td><td>$6.71<\/td><\/tr><\/table><\/div><p>High-growth period assumptions:<\/p><p>SOX, Inc.&#x27;s, target debt ratio is 40% and a beta of 1.3. The long-term Treasury Bond Rate is 4.0%, and the expected equity risk premium is 6%.<\/p><p>Stable-growth period assumptions:<\/p><p>SOX, Inc.&#x27;s, target debt ratio is 40% and a beta of 1.0. The long-term Treasury Bond Rate is 4.0% and the expected equity risk premium is 6%. Capital expenditures are assumed to equal depreciation. In year 5, earnings are $8.10 per share while the change in working capital is $2.00 per share. Earnings and working capital are expected to grow by 3% a year in the future.<\/p><p>What is the present value on a per share basis for SOX, Inc.?<\/p><\/div>", "subj": "equity"}, {"n": 135, "q": "The value of stock under the two-stage FCFE model will be equal to:", "opts": ["present value (PV) of FCFE during the extraordinary growth period plus the PV of terminal value.", "present value (PV) of FCFE during the extraordinary growth and transitional periods plus the PV of terminal value.", "present value (PV) of FCFE during the extraordinary growth period plus the terminal value."], "ans": "A", "expl": "The value of stock under the two-stage FCFE model will be equal to the present value of FCFE during the extraordinary growth period plus the present value of the terminal value at the end of this period.", "explhtml": "<p>The value of stock under the two-stage FCFE model will be equal to the present value of FCFE during the extraordinary growth period plus the present value of the terminal value at the end of this period.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>The value of stock under the two-stage FCFE model will be equal to:<\/p><\/div>", "subj": "equity"}, {"n": 136, "q": "In year 1, the forecasted free cash flow to equity (FCFE) for TOY, Inc. is closest to:", "opts": ["$3.56.", "$4.31.", "$4.53."], "ans": "A", "expl": "FCFE year 0 = Earnings per share − [(Capital Expenditures − Depreciation) × (1 − Debt Ratio)] − [(Change in working capital) × (1 − Debt Ratio)] = 5.00 − [(2.40 − 1.80) × (1 − 0.30)] − [(1.70) × (1 − 0.30)] = 3.39. FCFE for year 1 = FCFE year 0 × (1 + growth rate) = 3.39 × (1.05) = $3.56.", "explhtml": "<p>FCFE year 0 = Earnings per share − [(Capital Expenditures − Depreciation) × (1 − Debt Ratio)] − [(Change in working capital) × (1 − Debt Ratio)] = 5.00 − [(2.40 − 1.80) × (1 − 0.30)] − [(1.70) × (1 − 0.30)] = 3.39. FCFE for year 1 = FCFE year 0 × (1 + growth rate) = 3.39 × (1.05) = $3.56.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 136–139<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.m<\/div><div class=\"kq-note\">Câu thuộc item set (câu 136–139). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>In year 1, the forecasted free cash flow to equity (FCFE) for TOY, Inc. is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 137, "q": "The value of TOY, Inc.'s stock given the above assumptions, is closest to:", "opts": ["$50.86.", "$64.71.", "$61.57."], "ans": "A", "expl": "The value of the stock = FCFE₁ / (r − gₙ) = 3.56 / (0.12 − 0.05) = 50.86.", "explhtml": "<p>The value of the stock = FCFE<sub>1<\/sub> / (r − g<sub>n<\/sub>) = 3.56 / (0.12 − 0.05) = 50.86.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 136–139<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.m<\/div><div class=\"qtext\"><p>The value of TOY, Inc.&#x27;s stock given the above assumptions, is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 138, "q": "Comparing the current market value of TOY to our estimate of the stock's current market value, it is most likely that at the current market price of $56.00, TOY Inc. stock is:", "opts": ["overvalued.", "undervalued.", "fairly valued."], "ans": "A", "expl": "Our calculated value of the stock = FCFE₁ / (r − gₙ) = 3.56 / (0.12 − 0.05) = $50.86. The current market price is $56.00, because the market price is greater than the estimated price, the stock is overvalued in the market.", "explhtml": "<p>Our calculated value of the stock = FCFE<sub>1<\/sub> / (r − g<sub>n<\/sub>) = 3.56 / (0.12 − 0.05) = $50.86. The current market price is $56.00, because the market price is greater than the estimated price, the stock is overvalued in the market.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 136–139<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.m<\/div><div class=\"qtext\"><p>Comparing the current market value of TOY to our estimate of the stock&#x27;s current market value, it is most likely that at the current market price of $56.00, TOY Inc. stock is:<\/p><\/div>", "subj": "equity"}, {"n": 139, "q": "Senior management of TOY Inc. is considering selling the company to a rival firm that has offered $450 million. If the current market price represents the fair value of equity and TOY Inc. maintains its target capital structure, the bid represents a price that is:", "opts": ["less than the total value of the firm.", "about the same total value of the firm.", "greater than the total value of the firm."], "ans": "C", "expl": "The total value of a firm is the total market value of equity plus the total market value of debt. The total value of equity is $56.00 per share × 5,000,000 shares = $280 million. Equity represents 70.0% of the capital structure. The total value of the firm is thus $280 million/0.70 = $400 million. An offer of $450 million is a premium of $50 million – a price greater than the current value of the firm.", "explhtml": "<p>The total value of a firm is the total market value of equity plus the total market value of debt. The total value of equity is $56.00 per share × 5,000,000 shares = $280 million. Equity represents 70.0% of the capital structure. The total value of the firm is thus $280 million/0.70 = $400 million. An offer of $450 million is a premium of $50 million – a price greater than the current value of the firm.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 136–139<\/div> <div class=\"pp-topic\">Module 19.5, LOS 19.m<\/div><div class=\"qtext\"><p>Senior management of TOY Inc. is considering selling the company to a rival firm that has offered $450 million. If the current market price represents the fair value of equity and TOY Inc. maintains its target capital structure, the bid represents a price that is:<\/p><\/div>", "subj": "equity"}, {"n": 140, "q": "A firm's free cash flow to equity (FCFE) in the most recent year is $50M and is expected to grow at 5% per year forever. If its shareholders require a return of 12%, the value of the firm's equity using the single-stage FCFE model is:", "opts": ["$417M.", "$714M.", "$750M."], "ans": "C", "expl": "The value of the firm's equity is: $50M × 1.05 / (0.12 − 0.05) = $750M", "explhtml": "<p>The value of the firm&#x27;s equity is: $50M × 1.05 / (0.12 − 0.05) = $750M<\/p>", "qhtml": "<div class=\"pp-topic\">Module 19.5, LOS 19.k<\/div><div class=\"qtext\"><p>A firm&#x27;s free cash flow to equity (FCFE) in the most recent year is $50M and is expected to grow at 5% per year forever. If its shareholders require a return of 12%, the value of the firm&#x27;s equity using the single-stage FCFE model is:<\/p><\/div>", "subj": "equity"}];

    let tbase = prev.tbase;

      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/alternative investment|private capital|private equity|private debt|hedge fund|real estate|\breit\b|\breits\b|infrastructure|natural resources|commodit(?:y|ies)|digital assets?|cryptocurrenc|bitcoin|collectibles|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption regime|pooled investment product|timberland|farmland/.test(prompt)) return "alternatives";
  if(/fixed-income|fixed income|bond\b|bonds\b|debt rating|corporate debt|credit rating|credit spread|creditworthiness|yield curve|yield spread|spot rate|forward rate|yield-to-maturity|yield to maturity|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|\bcds\b|repo market|central bank funds|covenant|accrued interest|priority of claims|default risk|extension risk/.test(prompt)) return "fixed";
  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
