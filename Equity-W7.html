to estimate intrinsic value. Present value (ie, discounted cash flow [DCF]) equity\nvaluation models estimate value from the projected future cash flows accruing to the benefit of common shareholders. These models use\neither cash distributions (ie, dividends) or cash available to distribute (ie, free cash flow to equity). Intrinsic value estimates from these models are\nthe present value of the appropriate cash flow.\n(Choice A) Asset-based models value equities using the estimated fair market value of a company's assets and liabilities.\n(Choice B) Multiplier models determine valuation relative to the same price multiple (eg, P/E ratios) for comparable companies.\nThings to remember:\nEach class of equity valuation model uses different metrics to estimate intrinsic value. Present value model valuations are based on future cash\nflows accruing to the benefit of common shareholder. Asset-based model values are based on the difference between the estimated fair market\nvalues of assets versus liabilities. Multiplier model values are determined relative to the multiples of comparable companies.\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 32, "q": "When using present value models for valuing nondividend-paying stocks, which of the following should analysts most appropriately discount?", "opts": ["Operating cash flows", "Free cash flow to equity", "Earnings available to common shareholders"], "ans": "B", "expl": "Present value models, also called discounted cash flow (DCF) models, estimate equity values using projected cash flows accruing to the\nbenefit of stockholders. There are two categories of present value models, each using a different proxy for cash flows:\nDividend discount models (DDM) use projected dividend distributions.\nFree-cash-flow-to-equity (FCFE) models use the forecasts of cash available for distribution.\nIf a company does not pay a dividend, it is difficult to apply a DDM. However, a company's operating history provides a basis for projecting its\nability to generate free cash flow. Thus, FCFE models are more commonly used to value nondividend-paying stocks.\n(Choice A) Projected operating cash flows are usually a major component, but not the entirety, of free cash flow, and so are not as appropriate as\na proxy. Often referred to as cash flow from operations (CFO), these amounts require adjustments for debt retirement and issuance, changes in\nworking capital requirements, and investment in fixed assets when projecting FCFE.\n(Choice C) Earnings available to common shareholders are the earnings used in P/E multiplier models. Earnings are not used in present value\nmodels since earnings are not fully realized in cash but are based on accounting revenues and expenses.\nThings to remember:\nFree-cash-flow-to-equity (FCFE) models value companies on the basis of cash available to distribute to shareholders. FCFE is the most\nappropriate proxy for cash flows because operating cash flows capture only a portion of a company's cash flow, and earnings do not necessarily\nrepresent cash flow but only revenues and expenses.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 33, "q": "An analyst estimates a firm's enterprise value (EV) using an EV/EBITDA multiple and then correctly calculates the firm's implied equity value from its EV. If the equity value is higher than the EV, the most likely reason is that:", "opts": ["the EV/EBITDA multiple is low.", "the firm's stock is greatly undervalued.", "the firm has more cash than debt and preferred stock."], "ans": "C", "expl": "To estimate a firm's enterprise value (EV), analysts often multiply the firm's EBITDA by an EV/EBITDA ratio. Enterprise value measures the value\nof a firm's operations, which is supported by equity and nonequity sources of capital.\nEquity value measures the value to common shareholders.\nNonequity claims, or net debt, measure the value to other providers of capital, such as preferred shareholders and creditors.\nNote: Net debt is net of cash since cash can be used to pay down debt.\nTheoretically, equity value is what owners would receive from selling a business after settling net debt. In some cases (such as this scenario),\nequity value can exceed enterprise value due to negative net debt: The firm has more cash and marketable investments than its gross\nnonequity claims (eg, debt, preferred stock, noncontrolling interest).\n(Choice A) A low EV/EBITDA multiple has no impact on net debt. Therefore, a low EV/EBITDA multiple does not contribute to the difference\nbetween EV and equity value.\n(Choice B) A judgment about the firm's stock valuation compares its estimated intrinsic equity value to its market equity value, not to an estimated\nEV.\nThings to remember:\nThe EV/EBITDA ratio can be used to estimate the firm's enterprise value (EV). EV measures the value of a firm's core operations, which is\nsupported by equity and nonequity sources of capital. Equity value measures the value to businessowners (ie, common shareholders) whereas\nnonequity claims, or net debt, measure the value to other capital providers. Equity value can exceed EV when there is negative net debt.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 34, "q": "An analyst gathers the following information about a stock: Current market price €571.19 Current dividend €40.00 Dividend growth rate for Years 1–3 8% Dividend growth rate for Year 4 and beyond 2% Required rate of return 11% Using a two-stage dividend discount model, the analyst most appropriately concludes that the stock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "A two-stage dividend discount model (DDM) contains an initial finite period of high dividend growth (g ) for n years, followed by a period of low\nS\nsustainable growth (g ) into perpetuity. The stock's intrinsic value equals the present value of the 1st stage's dividends plus the present value\nL\nof the terminal value. The terminal value represents the value of the 2nd stage's discounted dividends at the end of the first stage (n). The\ndiscount rate is the required rate of return (r).\nSince the €531.19 intrinsic value is less than the market price of €571.19, the stock is overvalued.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 35, "q": "The free cash flow to equity model most likely focuses on a firm's capacity to:", "opts": ["service debt.", "pay dividends.", "make fixed capital investments."], "ans": "B", "expl": "Present value models base the equity value of a firm on its projected future cash flows. These models derive intrinsic value by discounting a firm's\nfuture cash flows (eg, free cash flow to equity, dividends).\nFree cash flow to equity (FCFE) represents the remaining cash available to shareholders after making investments in working capital, fixed\ncapital (ie, PPE), and servicing debt. Companies can use FCFE to pay dividends to shareholders or buy back shares; therefore, the value of\nshareholder's equity can be derived using FCFE. This valuation model emphasizes a firm's capacity (ie, ability) to pay dividends.\nAlternatively, the dividend discount model (DDM) is sometimes used to estimate the value of equity by using expected dividend payments as cash\nflow inputs. This may be used for companies that have a stable record for paying dividends.\n(Choice A) FCFE represents cash available only to equity investors, not to debtholders. Free cash flow to the firm (FCFF) is cash flow available\nto all capital (ie, debt and equity) providers. FCFE equals FCFF minus debt payments.\n(Choice C) FCFE is calculated from cash generated by business activities (ie, cash from operations) after accounting for investments in fixed\ncapital. Therefore, investments in fixed capital are not made from FCFE.\nThings to remember:\nFree cash flow to equity represents the remaining cash available to shareholders after making investments in working capital, fixed capital (ie,\nPPE), and servicing debt. Free cash flow to equity focuses on a firm's ability (ie, capacity) to pay dividends.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 36, "q": "An analyst gathers the following information about a company stock: Justified forward price-to-earnings (P/E) ratio using the Gordon growth model implies that the required rate of return is closest to:", "opts": ["5%", "7%", "9%"], "ans": "C", "expl": "Price to earnings (P/E) ratios are used mainly in three different forms: the trailing P/E ratio, the forward P/E (prospective or leading P/E) ratio, and\nthe justified forward P/E ratio. The trailing P/E ratio uses past earnings, whereas forward P/E is based on future earnings. If the forward earnings\nestimate is based on a model involving company fundamentals or cash flows, such as the Gordon growth model, the ratio is called the justified\nforward P/E ratio. Analysts use the justified forward P/E ratio to compare companies with similar characteristics and draw conclusions about asset\nprices.\nIn this scenario, the earnings retention ratio, the company-justified forward P/E ratio, and the long-term dividend growth rate are given. Calculate\nthe dividend payout ratio (p) as (1 − earnings retention ratio) = (1 − 0.40) = 0.60. Rearrange the formula for justified forward P/E, solving for r.\nThen plug in the values to calculate the required rate of return:\n(Choice A) 5% is the result of incorrectly deriving the formula for the required rate of return by setting the P/E ratio equal to the formula for a\nperpetuity using the dividend payout ratio as the payment: P /E = p ÷ r. Then r = p ÷ (P /E ) = 0.60 ÷ 12 = 5%.\n0 1 0 1\n(Choice B) 7% is the result of incorrectly using the earnings retention ratio instead of the dividend payout ratio: (0.40 ÷ 12) + 0.04 = 7.33%.\nThings to remember:\nJustified forward P/E ratio allows analysts to estimate future prices based on estimates of company fundamentals like earnings. The required rate\nof return can be calculated by rearranging the justified forward P/E formula. Required rate of return is calculated by dividing the dividend payout\nratio by the P/E ratio, then adding the long-term dividend growth rate to the quotient.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue\n37.An analyst gathers the following information about the stock of a company and its industry:\nThe company's justified forward price-to-earnings (P/E) ratio is the same as the industry average. The company's dividend payout ratio is closest\nto:\nA. 40%\nB. 60%\n C. 80%\nExplanation\nThe P/E ratio is used in three different forms: the trailing P/E ratio, the forward (leading or prospective) P/E ratio, and the justified forward P/E\nratio. The trailing P/E ratio uses past earnings, whereas the forward P/E ratio is based on future earnings. If the forward earnings estimate is\nbased on some model involving company fundamentals or cash flows, the ratio is referred to as the justified forward P/E ratio.\nIn this scenario, sufficient information is given to calculate the justified forward P/E ratio for the industry:\nRecall that the justified forward P/E ratio for the company is the same as the industry average. Rearrange the formula for the justified forward P/E\nratio and substitute values to calculate the dividend payout ratio for the company:\nThings to remember:\nIf the forward earnings estimate in the P/E ratio is based on a model involving company fundamentals or cash flows, the ratio is referred to as the\njustified forward P/E ratio. Justified forward P/E ratio is the dividend payout ratio divided by the difference between the required rate of return and\nthe long-term dividend growth rate.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue LOS\n38.A company has a forward price-to-earnings (P/E) of 5. In reviewing the company's financial data, an analyst estimates a justified forward P/E\nof 4. Based on the justified forward P/E, the stock is:\nA. undervalued.\nB. fairly valued.\n\nC. overvalued.\nExplanation\nThe price-to-earnings (P/E) ratio is the company's stock price as a multiple of its earnings per share.\nA forward P/E ratio is based on the observed market price and a forward earnings estimate.\nA justified forward P/E ratio is based on an intrinsic value for price and a forward earnings estimate.\nThe justified forward P/E ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If the justified\nforward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market (Choices A and B). In this scenario, the justified forward P/E ratio of 4 is less than the forward P/E ratio of 5,\nindicating that the stock is overvalued.\nThe difference in the two P/Es can be explained by assumptions for the required rate of return or the growth rate used to determine intrinsic value.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If\nthe justified forward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 37, "q": "An analyst gathers the following information about the stock of a company and its industry: The company's justified forward price-to-earnings (P/E) ratio is the same as the industry average. The company's dividend payout ratio is closest to:", "opts": ["40%", "60%", "80%"], "ans": "C", "expl": "The P/E ratio is used in three different forms: the trailing P/E ratio, the forward (leading or prospective) P/E ratio, and the justified forward P/E\nratio. The trailing P/E ratio uses past earnings, whereas the forward P/E ratio is based on future earnings. If the forward earnings estimate is\nbased on some model involving company fundamentals or cash flows, the ratio is referred to as the justified forward P/E ratio.\nIn this scenario, sufficient information is given to calculate the justified forward P/E ratio for the industry:\nRecall that the justified forward P/E ratio for the company is the same as the industry average. Rearrange the formula for the justified forward P/E\nratio and substitute values to calculate the dividend payout ratio for the company:\nThings to remember:\nIf the forward earnings estimate in the P/E ratio is based on a model involving company fundamentals or cash flows, the ratio is referred to as the\njustified forward P/E ratio. Justified forward P/E ratio is the dividend payout ratio divided by the difference between the required rate of return and\nthe long-term dividend growth rate.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue LOS\n38.A company has a forward price-to-earnings (P/E) of 5. In reviewing the company's financial data, an analyst estimates a justified forward P/E\nof 4. Based on the justified forward P/E, the stock is:\nA. undervalued.\nB. fairly valued.\n\nC. overvalued.\nExplanation\nThe price-to-earnings (P/E) ratio is the company's stock price as a multiple of its earnings per share.\nA forward P/E ratio is based on the observed market price and a forward earnings estimate.\nA justified forward P/E ratio is based on an intrinsic value for price and a forward earnings estimate.\nThe justified forward P/E ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If the justified\nforward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market (Choices A and B). In this scenario, the justified forward P/E ratio of 4 is less than the forward P/E ratio of 5,\nindicating that the stock is overvalued.\nThe difference in the two P/Es can be explained by assumptions for the required rate of return or the growth rate used to determine intrinsic value.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If\nthe justified forward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 38, "q": "A company has a forward price-to-earnings (P/E) of 5. In reviewing the company's financial data, an analyst estimates a justified forward P/E of 4. Based on the justified forward P/E, the stock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "The price-to-earnings (P/E) ratio is the company's stock price as a multiple of its earnings per share.\nA forward P/E ratio is based on the observed market price and a forward earnings estimate.\nA justified forward P/E ratio is based on an intrinsic value for price and a forward earnings estimate.\nThe justified forward P/E ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If the justified\nforward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market (Choices A and B). In this scenario, the justified forward P/E ratio of 4 is less than the forward P/E ratio of 5,\nindicating that the stock is overvalued.\nThe difference in the two P/Es can be explained by assumptions for the required rate of return or the growth rate used to determine intrinsic value.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio can be compared with other forms of the P/E ratio to determine whether a stock is mispriced. If\nthe justified forward P/E based on intrinsic value is less (greater) than the forward P/E based on market value, the stock is considered overvalued\n(undervalued) by the market.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 39, "q": "Which of the following least likely requires a future long-term growth rate for valuation purposes?", "opts": ["Justified P/E", "Dividend discount model", "Asset-based valuation model"], "ans": "C", "expl": "Analysts use valuation models to estimate the intrinsic value of a stock to determine whether it is valued fairly. Common forms of valuation models\ninclude multiplier, present value, and asset based.\nWith an asset-based valuation model, a firm's estimated equity value (ie, value to shareholders) is assumed to be equal to the current fair value\nof assets minus the fair value of liabilities. Analysts often start with the book values of line items on the balance sheet and make fair value\nadjustments to derive their market values. Since all inputs are based on current data, no long-term growth rate (g) is needed; g is used as an\ninput for forecasting future cash flows (eg, dividends, free cash flows).\n(Choice A) When a multiplier model is justified (ie, justified P/E), it typically is derived from a present value model (eg, discounted free cash flow,\ndividend discount model), that includes g as an input.\n(Choice B) Present value models (eg, dividend discount model) typically require g for forecasting a company's future financial results (eg,\ndividends, free cash flows). Once forecasts are made, they are discounted to the present at an appropriate discount rate (eg, WACC) to derive an\nintrinsic value.\nThings to remember:\nCommon forms of valuation models include multiplier, present value, and asset based. With an asset-based valuation model, a firm's estimated\nequity value (ie, value to shareholders) is assumed to be equal to the current fair value of assets minus the fair value of liabilities. Since all inputs\nare based on current data, no long-term growth rate is needed.\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 40, "q": "An advantage of using a present value model to value a publicly traded company's common stock is most likely that there are:", "opts": ["many appropriate comparable companies.", "readily available values for company assets.", "models to estimate the company's cost of equity capital."], "ans": "C", "expl": "Present value models estimate value from the projected future cash flows that benefit common shareholders. These models use either cash\ndividends or free cash flow to equity. The estimated intrinsic (ie, fundamental) value is the present value of the appropriate cash flow stream\ndiscounted by the company's cost of equity capital. The cost of equity capital can be estimated by calculating the required rate of return using\nother models (eg, CAPM).\n(Choice A) Multiplier models estimate value by comparing the chosen multiple (eg, P/E, EV / EBITDA) for the company being evaluated to a\ncomparable company or benchmark. Finding appropriate comparables is often difficult, but present value models do not use comparable\ncompanies to estimate intrinsic value.\n(Choice B) Asset-based valuation models require estimating the fair value of company assets and liabilities. Since many operating assets are\nunique to the company and trade infrequently, accurate asset values can be difficult to estimate. However, present value models do not use\ncompany asset values to estimate the intrinsic value.\nThings to remember:\nPresent value models estimate intrinsic value by discounting dividends or free cash to equity using the company's cost of equity capital. The cost\nof equity capital is calculated using other models (eg, CAPM). Present value models do not estimate intrinsic value from company asset values or\nrelative to comparable companies.\nExplain advantages and disadvantages of each category of valuation model", "qhtml": null}, {"n": 41, "q": "An analyst gathers the following information on a company that is expected to experience high dividend growth for 4 years followed by long- term, constant growth: Current market price of stock £66.10 Current dividend £2.00 Annual dividend growth rate, Years 1–4 10% Annual dividend growth rate, Years 5+ 3% Required rate of return 7% Using only this data for a two-stage dividend discount model, the analyst's most appropriate conclusion is that the stock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "A two-stage dividend discount model (DDM) contains an initial finite period of high dividend growth (g ) for n years, followed by a period of low\nS\nsustainable growth (g ) into perpetuity. The stock's intrinsic value equals:\nL\nthe present value of the first stage's dividends, plus\nthe present value of the terminal value.\nThe terminal value represents the value of the second stage's discounted dividends at the end of the first stage (n). The discount rate is the\nrequired rate of return (r).\nSince the stock's intrinsic value is equal to its current trading price of £66.10, the stock is fairly valued.\n(Choice A) The stock would be undervalued if the long-term growth rate were used instead of the required rate of return to discount all dividends\nand terminal value.\n(Choice C) The stock would be overvalued if the long-term growth period dividends at the end of Year 4 were discounted by 5 years instead of 4\nyears.\nThings to remember:\nDividend discount models assume that a stock's intrinsic value equals the present value of expected dividends. A two-stage dividend discount\nmodel includes an initial finite period of high dividend growth (g ) for n years, followed by a period of lower constant growth (g ) in perpetuity. The\nS L\nterminal value is calculated using the Gordon growth model.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 42, "q": "The Gordon growth model is most appropriate for a:", "opts": ["mature utility company with steadily increasing earnings.", "firm reinvesting earnings and not currently paying a dividend.", "company with earnings growth greater than the required rate of return."], "ans": "A", "expl": "The Gordon growth model (GGM) is the dividend discount model that assumes the company has steady growth in earnings and a constant\ndividend payout ratio, resulting in a constant dividend growth rate. The GGM is therefore appropriate for the valuation of stocks of companies\nin a mature growth stage.\nUnder GGM assumptions, the dividend growth rate must be less than the required rate of return. If the growth rate is greater than the required\nrate of return, another equity valuation model is more appropriate and the GGM should not be used. The GGM is suitable only if dividends are\nconsidered a good indicator of company growth prospects. Dividend growth is assumed to be constant and perpetual. The required rate of return\nmust be known and is assumed constant.\n(Choice B) The GGM uses dividends as inputs. If a firm is either not paying dividends or the dividends paid are not a good indicator of actual firm\ngrowth, the GGM cannot be used. For example, if the dividend payout ratio is changing year to year so that the dividend growth rate does not\naccurately reflect growth of earnings, then the GGM is not appropriate.\n(Choice C) The GGM assumes the growth rate is less than the required rate of return. If the growth rate is greater than the required rate of\nreturn, the GGM is not appropriate.\nThings to remember:\nCompanies suitable for valuation with the Gordon growth model are expected to have future steady growth in earnings and dividends. These\ncompanies tend to be in a mature growth stage and/or less sensitive to the business cycle than others.\nIdentify characteristics of companies for which the constant growth or a multistage dividend discount model is appropriate", "qhtml": null}, {"n": 43, "q": "An analyst gathers the following information about a company: All else being equal, the justified forward price-to-earnings (P/E) ratio implies that, relative to industry peers, the company's stock price is most likely:", "opts": ["more expensive.", "fairly priced.", "less expensive."], "ans": "C", "expl": "Analysts use the price-to-earnings (P/E) ratio to compare companies with similar characteristics—or to compare companies with their industries—\nand draw conclusions about stock prices. The P/E ratio is used mainly in three different forms: the trailing P/E ratio, the forward P/E (prospective\nor leading) ratio, and the justified forward P/E ratio. The trailing P/E ratio uses past earnings, whereas the forward P/E ratio is based on future\nearnings. If the forward earnings estimate is based on a predictive model involving company fundamentals or cash flows, the ratio is referred to as\nthe justified forward P/E ratio.\nTo calculate the justified forward P/E ratio of the company, substitute values into the formula:\nThe company's stock has a justified forward P/E ratio lower than the industry's justified forward P/E ratio of 21.4. Therefore, all else being\nequal, the company's stock price is relatively inexpensive compared with industry peers (Choices A and B).\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio formula can be derived from the Gordon growth model. The justified forward P/E ratio is equal to\nthe dividend payout ratio (p) divided by the difference between the required rate of return and the long-term dividend growth rate.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 44, "q": "An analyst gathers per-share information about a company's stock: According to the two-stage dividend discount model, the asset's intrinsic value is closest to:", "opts": ["Book value", "Net income", "Total revenue"], "ans": "C", "expl": "Multiplier models compare a value measure (eg, share price, enterprise value [EV]) in the numerator with a financial performance metric—\nsuch as earnings, sales (eg, total revenue), or EBITDA—in the denominator. EV is applicable only in a multiplier model, but it is important to\nunderstand which metric is appropriate for comparison.\nEV is a comprehensive means of assessing the current market value of a company and is the preferred measure to compare companies that have\nsignificantly different capital structures since it includes all forms of capital.\nSince EV (numerator) is not affected by capital structure, it should be compared to a metric that is also unaffected by capital structure. For this\nreason, EBITDA, operating income, or total revenue are appropriate to compare to EV, as all are calculated prior to payments to any\nstakeholder (ie, unaffected by the capital structure).\n(Choice A) Book value is difficult to compare across companies with widely varying capital structures. Book value is most appropriately\ncompared to price or market cap (eg, price/book).\n(Choice B) Net income is inappropriate to compare to EV since it is affected by interest expense and taxes and therefore is impacted by capital\nstructure.\nThings to remember:\nMultiplier models compare a value measure in the numerator to a financial performance metric in the denominator. Since enterprise value (EV) is\nnot affected by capital structure, it is appropriate to compare EV to EBITDA, operating income, or total revenue, as all are calculated prior to\npayments to any stakeholder and therefore are unaffected by capital structure.\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 45, "q": "An analyst has calculated a company's enterprise value (EV) and plans to use a multiplier model to analyze valuation. Which of the following is most appropriately used to complete this analysis?", "opts": ["Book value", "Net income", "Total revenue"], "ans": "C", "expl": "Multiplier models compare a value measure (eg, share price, enterprise value [EV]) in the numerator with a financial performance metric—\nsuch as earnings, sales (eg, total revenue), or EBITDA—in the denominator. EV is applicable only in a multiplier model, but it is important to\nunderstand which metric is appropriate for comparison.\nEV is a comprehensive means of assessing the current market value of a company and is the preferred measure to compare companies that have\nsignificantly different capital structures since it includes all forms of capital.\nSince EV (numerator) is not affected by capital structure, it should be compared to a metric that is also unaffected by capital structure. For this\nreason, EBITDA, operating income, or total revenue are appropriate to compare to EV, as all are calculated prior to payments to any\nstakeholder (ie, unaffected by the capital structure).\n(Choice A) Book value is difficult to compare across companies with widely varying capital structures. Book value is most appropriately\ncompared to price or market cap (eg, price/book).\n(Choice B) Net income is inappropriate to compare to EV since it is affected by interest expense and taxes and therefore is impacted by capital\nstructure.\nThings to remember:\nMultiplier models compare a value measure in the numerator to a financial performance metric in the denominator. Since enterprise value (EV) is\nnot affected by capital structure, it is appropriate to compare EV to EBITDA, operating income, or total revenue, as all are calculated prior to\npayments to any stakeholder and therefore are unaffected by capital structure.\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 46, "q": "An advantage of using the method of comparables with price multiples is most likely that:", "opts": ["it works well for relative valuations.", "the comparison of companies reflects economic fluctuations.", "it is not affected by reporting rule differences between markets."], "ans": "A", "expl": "The comparables (comps) method is the most common way to compare and report on price multiples. The analyst compares a price multiple of a\ncompany stock to that of a benchmark (ie, similar company stock, industry average) to determine if the stock is overvalued, undervalued, or fairly\nvalued.\nAdvantages of using the comps method with price multiples include: it is the most common method of valuation, the inputs are publicly\navailable, and relative comparisons between companies can be made easily.\nThere are several disadvantages of using comps with price multiples. Requirements for revenue recognition and earnings reporting differ between\nmarkets and may create problems in comparing companies across different markets (Choice C). In addition, the degree of sensitivity of company\nearnings to the business cycle may cause distortion in certain price multiples, making comparisons difficult (Choice B).\nThings to remember:\nAdvantages of using the comparables method with price multiples include: it is commonly used, the inputs are publicly available, and relative\ncomparisons are easily made. Disadvantages include potential distortion by reporting rule differences between markets and sensitivity to\neconomic fluctuations that distort comparisons.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 47, "q": "When considering multiplier models for evaluating public companies, which of the following factors is most likely an advantage of using the enterprise value/EBITDA ratio, compared to using the P/E ratio?", "opts": ["Ability to find appropriate comparable companies", "Comparing companies with different capital structures", "Ease of obtaining an accurate value for the multiple's numerator"], "ans": "B", "expl": "Multiplier models use ratios that relate market value measures, such as share price and enterprise value (EV), to values from financial reports (eg,\nearnings, EBITDA). Relative valuation can be assessed by comparing the chosen multiple (eg, P/E, EV/EBITDA) for the company being\nevaluated to a comparable company's multiple or to a benchmark.\nDifferent capital structures cause otherwise similar companies to have different P/Es. Higher proportions of debt capital, reflecting greater\nfinancial risk and more earnings volatility, often result in higher P/Es. Comparing companies by cash flows before distributions to any financial\nstakeholders (ie, EV/EBITDA) permits an analysis of operating performance irrespective of capital structure.\n(Choice A) Finding comparable companies is similarly problematic when using either multiple. Companies with similar product mixes, customer\nbases, and geographic exposure, among other factors, are good comparables.\n(Choice C) Getting an accurate EV can be challenging since debt obligations are often difficult to value. The numerator for P/E ratios for publicly\ntraded stocks is easily obtained.\nThings to remember:\nDifferent capital structures cause otherwise similar companies to have different P/Es. Comparing companies by cash flows before distributions to\nany financial stakeholders (ie, enterprise value/EBITDA) permits an analysis of operating performance irrespective of capital structure.\nExplain advantages and disadvantages of each category of valuation model", "qhtml": null}, {"n": 48, "q": "An enterprise value (EV) multiple least appropriately measures a company's EV relative to its:", "opts": ["EBITDA.", "Net income.", "Operating income."], "ans": "B", "expl": "Enterprise value vs. equity value multiples\nEV / EBITDA\nEV / Revenue\nEnterprise value (EV) multiples\nEV / Operating Income\nEV / FCFF (free cash flow to the firm)\nP/E (price-to-earnings)\nEquity value multiples PEG (price/earnings-to-growth)\nP/B (price-to-book)\nEnterprise value (EV) multiples are relative valuation metrics that gauge a firm's EV relative to a fundamental variable.\nThe ratio's numerator, the EV, measures the value of a firm's entire operation, which is financed by all sources of capital (ie, common equity,\ndebt, preferred stock).\nThe ratio's denominator, the fundamental variable, is typically a financial metric (eg, revenue, EBITDA, operating income) that represents\nfunds generated by the firm that are available to all capital providers (ie, before any interest and/or dividends are paid).\nSince EV encompasses the entire firm, it is most appropriate to compare it to a metric that represents funds available to all capital providers,\nsuch as EBITDA or operating income (Choices A and C). In contrast, net income is net of interest owed to debt providers and represents\nremaining funds available only to shareholders. Net income is appropriate for comparisons involving equity value (eg, P/E ratio).\nThings to remember:\nEnterprise value (EV) multiples are relative valuation metrics that gauge a firm's EV relative to a fundamental variable. EV measures the value of\na firm's entire operation, which is financed by all sources of capital. The fundamental variable is typically revenue, EBITDA, operating income, or\nany metric that represents funds generated by the firm that are available to all capital providers (ie, before any interest and/or dividends are paid).\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 49, "q": "Compared to other equity valuation methods, which of the following best describes an advantage of using the method of comparables?", "opts": ["It adjusts comparisons for the cyclicality of markets.", "It provides relative comparisons in cross-sectional and time-series analysis.", "It allows comparability between companies that use different accounting methods."], "ans": "B", "expl": "Due to its versatility, popularity, and ease of use, the method of comparables is commonly used in valuation to compare and analyze companies'\nprice multiples. A company's price multiples can be measured against a benchmark's price multiples to determine the stock's relative\nvaluation. This is an advantage of using the method of comparables.\nIf the stock's price multiple is:\nlower than the benchmark, the stock is considered undervalued;\nthe same as the benchmark, the stock is considered fairly valued; or\nhigher than the benchmark, the stock is considered overvalued.\nThe benchmarks can consist of cross-sectional or time-series data. Cross-sectional analysis involves comparing the price multiples of a company\nto peers' price multiples or an industry average over a single time period. Time-series analysis involves comparing the average price multiple of a\ncompany over multiple time periods.\n(Choice A) The cyclicality of business cycles can distort the comparison results since fundamentals may expand above average during economic\nbooms and compress below average during economic downturns.\n(Choice C) Different accounting methods can lead to different revenue and expense recognition; therefore, comparables may not be consistent\nacross companies in different markets.\nThings to remember:\nAn advantage of the method of comparables is the ability to measure a company's price multiples relative to benchmarks. Benchmarks can\nconsist of cross-sectional or time-series data.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 50, "q": "An analyst has gathered the following information about a company stock: The justified forward price-to-earnings ratio implies the stock is mispriced in the market by an amount closest to: ", "opts": ["€5.91", "€8.09", "€9.02"], "ans": "A", "expl": "Price-to-earnings (P/E) ratios are used in several forms: the trailing P/E ratio, the forward P/E ratio (ie, the prospective or leading P/E), and the\njustified forward P/E ratio. The trailing P/E ratio uses past earnings, while the forward P/E ratio is based on future earnings. The forward justified\nP/E ratio involves a forward earnings estimate using a model of future company fundamentals or cash flows.\nAnalysts use the justified forward P/E ratio to compare companies and draw conclusions about asset prices. The price implied by the justified\nforward P/E ratio can be compared with the current market price to determine if the asset is mispriced and, if so, by how much.\nIn this scenario, the price implied by the justified forward P/E ratio is calculated as follows:\nThe market price of the stock is given above as €31.42. The difference between 37.33 and 31.42 is €5.91, the amount by which the stock is\nmispriced (ie, undervalued) in the market.\nThings to remember:\nThe price implied by the justified forward price-to-earnings (P/E) ratio can be compared with the market price to reach conclusions about asset\nmispricing. The price implied by the justified forward P/E ratio is calculated by dividing the dividend payout ratio by the difference between the\nrequired rate of return and the long-term dividend growth rate, then multiplying the result by the next year's earnings.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 51, "q": "An analyst gathers the following information about three comparable companies: All other things being equal, based on cross-sectional analysis of the companies during the most recent year, which company is most likely overvalued?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The method of comparables can be used in two ways. Comparing the price multiple of one asset to its historical average over multiple time\nperiods is called time-series analysis. Comparing the price multiples of different assets over the same time period is called cross-sectional\nanalysis.\nIn this scenario, the analyst compares the companies in 20X9, the most recent year, using cross-sectional analysis. The price-to earnings (P/E)\nratio of Company X is greater than the average 20X9 P/E of the three companies; therefore, Company X is overvalued.\n(Choice B) Company Y's P/E ratio is close to the cross-sectional average P/E ratio in 20X9; therefore, Company Y is fairly valued.\n(Choice C) Company Z's P/E ratio is less than the cross-sectional average P/E in 20X9; therefore, Company Z is undervalued.\nThings to remember:\nComparing the price multiples of different assets over the same time period is called cross-sectional analysis. If the price multiple of the stock is\nless than, greater than, or close to the benchmark, the stock is considered undervalued, overvalued, or fairly valued, respectively.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 52, "q": "Which of the following models most likely estimates equity value from the market value of balance sheet items?", "opts": ["Multiplier models", "Present value models", "Asset-based valuation models"], "ans": "C", "expl": "Model type Stock's intrinsic value derived by:\nPresent value Discounting projected free cash flows or dividends at a required rate of return\nMultiplying a financial metric (eg, EBITDA, revenue, net income) by a market multiple (EV / EBITDA, EV /\nMultiplier\nrevenue, P/E)\nAsset-based\nSubtracting the fair value of liabilities from the fair value of assets\nvaluation\nEV = enterprise value.\nAnalysts use valuation models to estimate the intrinsic value of a stock to determine whether it is fairly valued. Common forms of valuation\nmodels include present value, multiplier, and asset-based valuation.\nWith an asset-based valuation model, the firm's equity value (ie, value to shareholders) equals the fair value of assets minus the fair value of\nliabilities. Analysts often start with the book values of line items on the balance sheet and make fair value adjustments to derive the market value\nof all total assets and liabilities. The underlying rationale is that the value of the firm can be represented by the value of its assets, and therefore\nthe value of the firm's equity equals the fair value of the firm's assets less liabilities.\n(Choice A) Multiplier models typically involve applying a market multiple to a financial metric such as EBITDA or revenue. These metrics are\nusually not found on the balance sheet.\n(Choice B) Present value models are used to discount a firm's future cash flows or dividends. The process typically does not directly involve\ntying the market value of assets and liabilities to the firm's value.\nThings to remember:\nUnder the asset-based valuation model, the firm's equity value (ie, value to shareholders) equals the fair value of assets minus the fair value of\nliabilities. The underlying rationale is that the value of the firm can be represented by the value of its assets, and therefore the value of the firm's\nequity equals the fair value of the firm's assets less liabilities.\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 53, "q": "In valuing equities, which of the following is most likely an advantage of using the method of comparables?", "opts": ["Comparable stocks are readily available.", "It is easily understood and widely used by investors.", "Its results are often consistent with other valuation models."], "ans": "B", "expl": "The most common way analysts compare and report on price multiples is the method of comparables (comps). Using this method, the analyst\ncompares the price multiple of a company stock to that of a benchmark (ie, similar company stock or industry average). If the price multiple of the\nstock is lower, higher, or the same as the benchmark, the stock is considered undervalued, overvalued, or fairly valued, respectively.\nThe method of comparables using price multiples is widely used and easily understood by investors. Moreover, the inputs are publicly\navailable, the method is simple, and it works well for relative comparisons.\nThere are a few disadvantages of using comps. Finding comparable companies can be challenging. Accordingly, analysts should try to verify that\ncompanies are similar in more than one respect. For example, instead of only considering a company's market capitalization, one should also\nconfirm that company accounting methods, earnings growth rate, and business lines are similar (Choice A).\n(Choice C) The use of comps may be inconsistent with other valuation models. Comps may indicate a company is overvalued while a present\nvalue or asset-based model determines the company is undervalued or vice versa.\nThings to remember:\nAdvantages of the method of comparables include wide use by investors, simplicity, and publicly available inputs. Disadvantages include difficulty\nin finding comparable companies, multiple factors of comparison needing to be used, comparisons being distorted by economic fluctuations, and\nresults that may be inconsistent with other models.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 54, "q": "According to the two-stage dividend discount model, the second stage most likely exhibits dividends growing at a(n):", "opts": ["decreasing rate.", "constant rate.", "increasing rate."], "ans": "B", "expl": "The two-stage dividend discount model (two-stage DDM) is used to find the value of a company expected to have high dividend growth\n(short-term growth) lasting for a certain number of years, followed by lower, positive, long-term constant growth for an infinite number of years.\nEach of the dividend discount models corresponds to a certain stage of company growth.\nIn the second stage of the two-stage DDM, the amount of the dividend grows at a constant rate, so the rate of dividend growth does not increase\nor decrease. In the example above, the first dividend in the long-term growth stage is D = D , which reflects growth of 3% over the previous\nn+1 4\ndividend: D = D (1 + g ) = €1.30(1 + 0.03) = €1.34. The next dividend, D , includes growth of another 3%: D = D (1 + g ) = €1.34(1 + 0.03) =\n4 3 L 5 5 4 L\n€1.38. The rate of dividend growth is constant, but the amount of the dividend is not the same each year (Choices A and C).\nThings to remember:\nThe two-stage dividend discount model is used to find the value of a company expected to experience high growth, followed by lower, long-term\ngrowth. The second stage consists of lower, constant, long-term growth that lasts for an infinite number of years.\nIdentify characteristics of companies for which the constant growth or a multistage dividend discount model is appropriate", "qhtml": null}, {"n": 55, "q": "Enterprise value is most appropriately viewed as a company's:", "opts": ["takeover cost.", "capital from all sources.", "equity and liquid investments."], "ans": "A", "expl": "Enterprise value (EV) is a measurement of a company's total value and is used as an alternative to the value of equity. EV can be described as\nthe total takeover cost of a company. In the event of a takeover, the acquiring company will take on the target company's debt and equity. These\ncosts are offset by the target company's cash and investments.\nSuppose a company has 10 million common shares outstanding with a current market price of CNY 43 per share and 1 million preferred shares\ntrading at CNY 26 per share. The company's total debt is CNY 126 million. The company has short-term investments of CNY 10 million and cash\nequivalents of CNY 4 million:\nIn this scenario, the EV is CNY 568 million.\n(Choice B) This choice fails to subtract cash equivalents and short-term investments, which is required to correctly calculate EV. A company's\ncapital from all sources includes market capitalization, market value of preferred stock, and the market value of debt.\n(Choice C) A company's equity and liquid investments do not take into account cash equivalents or the market value of debt.\nThings to remember:\nEnterprise value (EV) is equal to the market value of common equity, preferred equity, and debt minus cash equivalents and short-term\ninvestments. EV can be described as a company's takeover cost.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 56, "q": "A noncallable, nonconvertible, perpetual, preferred stock issued by a UK manufacturing company with £25 par value pays a 6% dividend. The required rate of return is 5%. If the long-term economic growth rate is 3%, the stock's intrinsic value is closest to:", "opts": ["£23.81", "£30.00", "£30.90"], "ans": "B", "expl": "The preferred stock valuation model assumes dividends remain the same and continue forever. The intrinsic value of a preferred stock is the\npresent value of all future dividends. Since the dividends continue forever, the cash flows to a preferred shareholder are equivalent to a\nperpetuity. Intrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate). The dividend is\nthe product of the dividend rate and the par value.\nCalculate annual dividend (D ):\n0\nSubstitute values for annual dividend and required rate of return into the formula:\n(Choice A) £23.81 is the result of discounting par value by the required rate of return instead of just dividing by the required rate of return: £25 / (1\n+ 0.05) = £23.81.\n(Choice C) £30.90 is the result of incorrectly taking into account one year of dividend growth at the long-term economic growth rate: £1.50(1 +\n0.03) / 0.05 = £30.90. The model for preferred stock valuation assumes dividends will never change (D = D = D = …), so economic growth is\n0 1 2\nirrelevant.\nThings to remember:\nThe formula for intrinsic value of a noncallable, nonconvertible, perpetual preferred stock is found as the value of a perpetuity. To calculate the intrinsic value of such\na security, divide the constant annual dividend by the required rate of return. The annual dividend is the product of the par value and the dividend rate.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 57, "q": "An analyst gathers the following information about a company: If the EV/EBITDA ratio is 25.4, the market value of the company's common equity (in € millions) is closest to:", "opts": ["150,030", "175,530", "183,030"], "ans": "C", "expl": "In this scenario, the analyst is estimating the market value of a company's equity based on its EV/EBITDA ratio. EBITDA is earnings before\ninterest, taxes, depreciation, and amortization. Begin with the formula for EV/EBITDA ratio and solve for the market capitalization (ie, the market\nvalue of common stock):\nAs this rearrangement shows, to calculate market capitalization from the EV/EBITDA ratio, multiply the ratio by EBITDA, subtract the market\nvalue of preferred stock and debt, and then add the value of cash and short-term investments. Substitute values:\nThe market capitalization is 183,030 million.\n(Choice A) 150,030 million results from subtracting cash equivalents and short-term investments instead of adding them.\n(Choice B) 175,530 million results from failing to add in short-term investments (7,500 million).\nThings to remember:\nA company's market capitalization can be calculated from the EV/EBITDA ratio: multiply the ratio by EBITDA, subtract the market value of\npreferred stock and debt, and then add the value of cash and short-term investments. EBITDA is earnings before interest, taxes, depreciation,\nand amortization.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 58, "q": "When projecting free cash flow to equity (FCFE) to estimate a stock's intrinsic value, which of the following is subtracted from the company's projected cash flow from operations (CFO)?", "opts": ["Net borrowing", "Investment in fixed capital", "Common stock repurchases"], "ans": "B", "expl": "In equity valuation, free cash flow to equity (FCFE) models estimate a company's intrinsic value as the present value of future cash flows\navailable for distribution to common shareholders. The starting point for calculating FCFE is cash flow from operations (CFO), which is the net\ncash generated from a company's business activities. However, CFO is then adjusted for:\nCash from operations that is not available for distribution to shareholders; and\nCash from another source, not operations, that is available for distribution to shareholders\nCash from operations is unavailable for distribution when it is needed to maintain and invest in fixed assets. Cash may become available from\nborrowing, a financing, not operating, activity. Therefore, the determination of FCFE starts with CFO, subtracts cash invested in fixed assets, and\nadds cash from net borrowing (ie, financing activities) to derive the cash available for distribution to shareholders.\n(Choice A) FCFE is defined as the cash available for distribution to shareholders. The immediate impact of borrowing is additional cash available\nfor distribution, so net borrowing is added to CFO.\n(Choice C) Future share repurchases represent cash distributions to shareholders. Since this is cash that shareholders will receive, it is not\ndeducted from what is available to them.\nThings to remember:\nFree cash flow to equity (FCFE) is the cash available for distribution to common shareholders. The starting point for calculating FCFE is cash flow\nfrom operations (CFO). Net borrowing creates additional cash flow and so is added to CFO. Investments in fixed assets reduce the cash\navailable and are therefore subtracted from CFO. Future share repurchases are cash distributions to shareholders, so they are included in (and\nnot subtracted from) what is available to shareholders.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 59, "q": "An analyst has compiled the following information about a company stock: The company's justified price-to-earnings ratio using the Gordon growth model indicates the stock is most likely:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "To understand the relationship between the justified forward price-to-earnings (P/E) ratio and company fundamentals, begin with the Gordon\ngrowth model (GGM). Assuming that price is equal to value, divide both sides by leading (ie, next year's) earnings (E ) and observe that the ratio\n1\nof dividends to earnings is the dividend payout ratio:\nTo calculate the justified forward P/E ratio, first calculate the long-term growth rate as (1 − dividend payout ratio) multiplied by the return on equity\n(ROE). Substitute values:\nSubstitute E , dividend payout ratio (p), required rate of return (r), and the long-term growth rate (g) into the formula for the justified forward P/E\n1\nratio to calculate the current stock price implied by the GGM and the justified forward P/E ratio:\nCompared with the price implied by the justified forward P/E ratio as calculated above (CNY 50), the stock is currently overvalued by the market\n(CNY 52).\nThings to remember:\nThe long-term growth rate is equal to (1 − dividend payout ratio) multiplied by the return on equity. The justified forward P/E ratio is equal to the\ndividend payout ratio divided by the difference between the required rate of return and the long-term growth rate.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 60, "q": "An analyst has collected the following data for a noncallable, nonconvertible, perpetual preferred stock: Required rate of return 5% Economic growth 4% Annual dividend €1.00 Market value €19.90 Par value €25.00 The intrinsic value of the preferred stock is closest to: ", "opts": ["€20.00", "€20.80", "€23.81"], "ans": "A", "expl": "The preferred stock valuation model assumes dividends remain the same and continue forever. The intrinsic value of a preferred stock is the\npresent value of all future dividends. Since the dividends continue forever, the cash flows to a preferred shareholder are equivalent to a\nperpetuity. Intrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate).\nSubstitute the values for the annual dividend and the required rate of return into the formula:\nThe par value, market value, and economic growth rate are not required to find the solution.\n(Choice B) €20.80 is the result of incorrectly accounting for growth in the dividend at the long-term rate of economic growth: €1 x (1 + 0.04) ÷\n0.05 = €20.80. The valuation model for preferred stock assumes dividends will never change, so economic growth is irrelevant.\n(Choice C) €23.81 is the result of incorrectly discounting par value by the required rate of return: €25 ÷ (1 + 0.05) = €23.81.\nThings to remember:\nThe intrinsic value of a noncallable, nonconvertible, perpetual preferred stock is the value of a perpetuity. To calculate the intrinsic value of such a\nsecurity, divide the constant annual dividend by the required rate of return.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 61, "q": "An investor evaluates a common stock using two valuation models: A free-cash-flow-to-equity model estimates the intrinsic value at 68–71. An earnings multiple model estimates the intrinsic value at 62–65. If the stock is currently trading at 68, the least appropriate conclusion the investor can make is that the stock is: ", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "A", "expl": "Security's market price vs. intrinsic value\nOvervalued Market price >> intrinsic value\nFairly valued Market price ≈ intrinsic value\nUndervalued Market price << intrinsic value\nInvestors use equity valuation models to estimate a security's intrinsic or fundamental value, and then to identify market mispricing that can be\nused to generate enhanced returns. Greater returns may be achieved by buying undervalued securities and selling overvalued securities. A\nsecurity is undervalued when it trades at market prices below its intrinsic value and vice versa.\nDefining under- and overvaluation is straightforward. Unfortunately, accurately estimating intrinsic value is difficult. Many valuation model\ninputs are difficult to estimate accurately (eg, growth rate of cash flow for present-value models, next year's earnings for multiplier models).\nConsequently, equity prices must differ substantially from intrinsic value estimates before concluding a stock is undervalued or overvalued.\nIt is difficult to conclude a security is mispriced if it trades within 1–2% of intrinsic value estimates.\nIn this scenario, the current price of the common stock is within or above the intrinsic value estimates from the two models. Therefore, the\nmost reasonable conclusion is that the security is trading at or above fair value, so the investor is least likely to undervalue the stock (Choices B\nand C).\nThings to remember:\nSecurities are undervalued when trading at market prices below their intrinsic value and overvalued when trading at prices above their intrinsic\nvalue. When a stock's price is within or above the estimated ranges for intrinsic value from different models, the least reasonable conclusion is\nthat the security is undervalued.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 62, "q": "An analyst has gathered the following information about a company: Using the two-stage dividend discount model, the terminal value of the high-growth stage is closest to:", "opts": ["€35.29", "€36.35", "€38.47"], "ans": "B", "expl": "Company growth stages may include one or more high growth stages before the company reverts to lower, long-term, constant growth. The two-\nstage dividend discount model is used to find the value of a company expected to have high growth (short-term) followed by lower, constant\ngrowth (long-term). The high growth stage is assumed to last for n years, followed by a long-term stage of infinite, constant growth.\nIn the two-stage dividend discount model, the Gordon growth model (GGM) is used to find the year n value of the second (long-term growth)\nstage, which is also the terminal value input for the first (high-growth) stage at Year n. The amount of the dividend in the first year of the long-\nterm growth stage (D ) is a required input for the GGM.\nn+1\nIn this scenario, the length of the high growth stage is four years, so D = D . The value of D results from four years of growth at 9% and one\nn+1 5 5\nyear of growth at 3%. Substitute values into the equation for D to calculate D :\nn+1 5\nTo calculate V , the Year 4 value of the long-term growth stage, substitute the values above into the GGM:\n4\n(Choice A) This answer is the result obtained by incorrectly multiplying D by (1 + g )4 to calculate D : €1.00(1.09)4 = €1.4116 ÷ (0.07 − 0.03) = €\n0 S 5\n35.29.\n(Choice C) This choice results from incorrectly multiplying D by (1 + g )5 to calculate D : €1.00(1.09)5 = €1.5386 ÷ (0.07 − 0.03) = € 38.47.\n0 S 5\nThings to remember:\nIn the two-stage dividend discount model, the Gordon growth model is used to find the Year n value of the second stage, which is also the terminal\nvalue of the first stage. The value of D reflects n years of growth at g and one year of growth at g . The two-stage dividend discount model is\nn+1 S L\nused to find the value of a company expected to have high growth in the short term, followed by lower, long-term growth.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 63, "q": "An analyst gathers the following information about a company: Metric £ thousands Market capitalization 567,100 Cash equivalents 990 Short-term investments 4,730 Accounts receivable 3,390 Market value of debt 765,700 Enterprise value 1,358,000 If the company has 1,160,000 preferred shares outstanding, then based on the company's enterprise value, the appropriate price per share of its preferred stock (in £) is closest to:", "opts": ["16.79", "26.66", "29.58"], "ans": "B", "expl": "Enterprise value (EV) is a measure of a company's total value, which includes debt, common equity, and preferred stock. It can be used to\nestimate the value of a company's equity (common or preferred) as an alternative to estimating that value directly. In a takeover, the acquiring\ncompany takes on the target company's debt and equity, so EV can be described as the acquirer's total takeover cost. That cost is offset by the\ntarget company's cash and investments, which can be used to pay down debt or redeem equity shares.\nIn this scenario, the analyst is using the EV to estimate an appropriate value per share of the company's preferred stock. Using the components of\nEV listed above, solve for the market value (£ thousands) of preferred equity as follows:\nSince there are 1,160,000 preference shares outstanding, the appropriate market value per share is:\n30,920,000 / 1,160,000 ≈ £26.66\n(Choice A) £16.79 results from incorrectly subtracting cash equivalents and short-term investments, along with market capitalization and the\nmarket value of debt, from EV to arrive at the market value of preferred stock. Cash equivalents and short-term investments are added to EV to\narrive at the market value of preferred stock since those items are subtracted when calculating EV.\n(Choice C) £29.58 results from adding accounts receivable, along with other items, to arrive at the market value of preferred stock. This is\nincorrect since accounts receivable is not part of the calculation of EV.\nThings to remember:\nEnterprise value (EV) can be used to estimate the value of a company's equity (common or preferred) as an alternative to determining that value\ndirectly. A company's EV is the sum of its market values of common equity, preferred stock, and debt less cash and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 64, "q": "To estimate a common stock's intrinsic value, an analyst has gathered the following data: The market value of the company's debt and equity One-year forecasts for revenue and earnings A list of comparable companies The analyst is most likely using a(n):", "opts": ["multiplier model.", "asset-based model.", "present value model."], "ans": "A", "expl": "Multiplier models use ratios that relate market value (eg, share price, enterprise value [EV]) to an accounting value obtained from financial\nstatements (eg, earnings per share, sales). To determine whether a stock is fairly valued or mispriced, analysts compare the chosen multiple\n(eg, P/E, EV/sales) for the company being evaluated to a comparable company's multiple or to a benchmark. Multiples are computed using\naccounting measures from previous periods (ie, trailing multiples) or forecasts (ie, forward multiples).\n(Choice B) The market value of debt is an input to an asset-based valuation. However, asset-based valuation models also require estimates of\nthe fair value of all other liabilities and all assets.\n(Choice C) Present value models estimate intrinsic value based on projected future cash flows benefiting shareholders (cash dividends or free\ncash flow to equity). Intrinsic value is the present value of the appropriate cash flow stream. Projected earnings or sales can be used to forecast\ncash flows, and present value models consider cash flows in perpetuity. However, in this scenario, the analyst has only one-year forecasts.\nThings to remember:\nMultiplier models estimate value using ratios that relate market value (eg, share price, enterprise value [EV]) to an accounting value (eg, earnings\nper share, sales). Valuation is assessed by comparing the chosen multiple (eg, P/E, EV/sales) for the company being evaluated to a comparable\ncompany's multiple or to a benchmark. Multiples can be computed using accounting measures from previous periods or forecasts for future\nperiods (ie, trailing or forward multiples).\nDescribe major categories of equity valuation models", "qhtml": null}, {"n": 65, "q": "A company declares a regular cash dividend. All else being equal, the stock's price will most likely fall by the amount of the dividend on the:", "opts": ["declaration date.", "ex-dividend date.", "holder-of-record date."], "ans": "B", "expl": "The ex-dividend date is the first day that a company's shares trade without rights to the dividend. The shares fall by the value of the dividend\nsince the cash value of the dividend is now pledged and transferred to shareholders and is no longer an asset of the company.\nThe ex-dividend date is directly tied to the settlement process (eg, T + 2) since shares purchased on or after the ex-dividend date settle after the\nholder-of-record date (eg, official ownership).\n(Choice A) The declaration date is the date the company announces the specifics of the dividend (eg, size, payment date). The share price does\nnot fall on this date since the shares could still be bought with rights to the dividend.\n(Choice C) The holder-of-record date is announced on the declaration date and is the day the company recognizes the legal owners of the\ndividend. If the holder-of-record date is known, the ex-dividend date can be determined based on the settlement process of the market in which\nthe shares trade.\nThings to remember:\nThe ex-dividend date is the first day that the shares trade without rights to the dividend. The share price falls by the value of the dividend since the\ncash value of the dividend is now pledged and transferred to shareholders and is no longer an asset of the company.\nDescribe dividend payment chronology", "qhtml": null}, {"n": 66, "q": "An analyst has gathered the following information: Using the two-stage dividend discount model, the long-term growth rate is closest to: ", "opts": ["5%", "6%", "11%"], "ans": "A", "expl": "The two-stage dividend discount model (DDM) is used to find the value of a company expected to have high growth (short term), followed by lower\nconstant growth (long term). The high-growth stage is assumed to last for a certain number of (n) years, followed by an infinite constant growth\nstage.\nIn the two-stage DDM, the Gordon growth model (GGM) is used to find the value of the second stage, which has long-term dividend growth. The\nvalue (V ) of the long-term growth stage dividends at the end of Year 3, €61.50, can be used to calculate the long-term growth rate using the\n3\nGGM. To derive the long-term growth rate, rearrange the GGM and substitute the values to calculate g :\nL\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate LOS\n67. Which of the following is least likely needed to value equity using a present value model?\n A. Dividends\nB. Time horizon\nC. Discount rate\nExplanation\nIn a present value model, the intrinsic value of a stock is determined by the present values of the stock's future cash flows. The present value of\neach cash flow is calculated by discounting it by an appropriate discount rate over a relevant time period (ie., discounting the cash flow). The sum\nof the discounted cash flows is the intrinsic value of the equity.\nA present value model uses cash flows to value equity. These cash flows may be dividends or free cash flows. If dividends are not available for\nuse, then free cash flows may be used instead. For an application of the present value model, see this present value example.\n(Choice B) Present value models are based on discounting cash flows over an appropriate time horizon. Thus, the time horizon of each cash\nflow is required to determine the intrinsic value of the asset. In some models, the time horizon may be infinity, in which case time is not a direct\ninput. However, in these cases the infinite time horizon is implicitly required to use the model.\n(Choice C) Present value models require an appropriate discount rate. Otherwise the present value cannot be obtained.\nThings to remember:\nThe rationale for using present value models to value equities is an asset's intrinsic value is equal to the sum of the present values of its future\ncash flows. Free cash flows may be used instead of dividends in present value models.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 67, "q": "Which of the following is least likely needed to value equity using a present value model?", "opts": ["Dividends", "Time horizon", "Discount rate"], "ans": "A", "expl": "In a present value model, the intrinsic value of a stock is determined by the present values of the stock's future cash flows. The present value of\neach cash flow is calculated by discounting it by an appropriate discount rate over a relevant time period (ie., discounting the cash flow). The sum\nof the discounted cash flows is the intrinsic value of the equity.\nA present value model uses cash flows to value equity. These cash flows may be dividends or free cash flows. If dividends are not available for\nuse, then free cash flows may be used instead. For an application of the present value model, see this present value example.\n(Choice B) Present value models are based on discounting cash flows over an appropriate time horizon. Thus, the time horizon of each cash\nflow is required to determine the intrinsic value of the asset. In some models, the time horizon may be infinity, in which case time is not a direct\ninput. However, in these cases the infinite time horizon is implicitly required to use the model.\n(Choice C) Present value models require an appropriate discount rate. Otherwise the present value cannot be obtained.\nThings to remember:\nThe rationale for using present value models to value equities is an asset's intrinsic value is equal to the sum of the present values of its future\ncash flows. Free cash flows may be used instead of dividends in present value models.\nExplain the rationale for using present value models to value equity and describe the dividend discount and free-cash-flow-to-equity models", "qhtml": null}, {"n": 68, "q": "An analyst compiles the following information to compare price-to-earnings ratios of stocks in the same industry: Using time-series analysis of the four years of data, as of 20X9, Company X was:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "C", "expl": "The method of comparables (comps) is the most common way to compare and report on price multiples. The analyst compares a price multiple\nof a company stock to that of a benchmark (ie, similar company stock, industry average).\nIf the price multiple of the stock is\nlower than the benchmark, then the stock is considered to be undervalued,\nthe same as the benchmark, then the stock is considered to be fairly valued,\nhigher than the benchmark, then the stock is considered to be overvalued.\nThe comparables method can be used in two ways. Time-series analysis involves comparing a price multiple of one asset with itself over multiple\ntime periods. Cross-sectional analysis involves comparing the price multiples of several different assets for a single time period.\nIn this scenario, Company X had a trailing price-to-earnings (P/E) ratio of 24.67 in 20X9, which is above its average trailing P/E of 21.42 for the\nperiod (20X6-20X9). Thus, based on time-series analysis, the stock of Company X is overvalued as of 20X9.\nAn analyst using cross-sectional analysis instead of time-series analysis would conclude that Company X is undervalued in 20X9, since its P/E\nratio of 24.67 is clearly lower than the average P/E ratio of all three companies. However, using time-series analysis, Company X is overvalued,\nnot undervalued or fairly valued (Choices A and B).\nThings to remember:\nThe method of comparables using time-series analysis compares a price multiple of a stock to the average price multiple of the same stock over\nmultiple time periods.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 69, "q": "A key assumption relating justified forward P/E ratio to company fundamentals using the Gordon growth model is that a stock's:", "opts": ["price is equal to its value.", "dividend payout ratio increases over time.", "dividend growth rate is greater than the required rate of return."], "ans": "A", "expl": "A price multiple is a ratio that compares a company's stock price to another fundamental value. One such multiple is the price-to-earnings ratio\n(P/E ratio), which equals the company's stock price divided by its earnings per share. Trailing P/E uses past earnings, whereas forward P/E is\nbased on future earnings. If the forward earnings estimate is based on a model used to estimate company fundamentals or cash flows, the ratio is\nreferred to as justified forward P/E.\nTo understand the relationship between justified forward P/E and company fundamentals, begin with the Gordon growth model (GGM):\nThis results in the formula for forward justified P/E ratio. Therefore, the assumption that price is equal to value is key to the relationship\nbetween justified forward P/E ratio and company fundamentals using the GGM.\nThings to remember:\nThe assumption that price is equal to value is key to the relationship between justified forward P/E ratio and company fundamentals using the\nGordon growth model. The P/E ratio equals a company's stock price divided by its earnings per share. Trailing P/E uses recent earnings,\nwhereas leading P/E uses future earnings.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 70, "q": "An analyst gathers the following information about a company: If the company has 50 million common and 160,000 preferred shares, the company's market price per common share is closest to:", "opts": ["CHF 21.32",
