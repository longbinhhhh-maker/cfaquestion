<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

e intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model as appropriate LOS\n4.An analyst has estimated the enterprise value of a firm and wants to calculate the market value of its common equity. The analyst would most\nappropriately:\nA. add the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\n B. subtract the market value of preferred stock and debt and add cash equivalents and short-term investments.\nC. subtract the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\nExplanation\nEnterprise value (EV) is a way of viewing the total value of an enterprise, including debt and equity. EV can be used to value a firm's equity, by\nbeginning with the value of both debt and equity. EV is described as the total takeover cost of a company since it represents the total cost an\nacquirer would pay for the company's equity and debt, minus cash equivalents and short-term investments.\nSuppose a company's EV is HKD 101,000 million, its market value of debt is HKD 14,000 million, its market value of preferred stock is HKD 70\nmillion, and its cash and short-term investments are HKD 10 million. The market capitalization (ie, the market value of common stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 3, "q": "An analyst has gathered the following information about a company's stock: According to the two-stage dividend discount model, the amount of the dividend at the end of the first year of the long-term growth stage is closest to:", "opts": ["€1.23", "€1.26", "€1.30"], "ans": "A", "expl": "The two-stage dividend discount model is used to find the value of a company expected to have high growth (short-term) followed by lower growth\n(long-term). The high-growth stage is assumed to last for n years followed by an infinite long-term growth stage:\nThe dividend in the first year of the long-term growth stage, D = D , is a component in estimating the intrinsic value of the stock, since it is\nn+1 4\nused to calculate the terminal value of the first stage. D is found by first multiplying D (€1.00) by (1 + g )3 to account for three years of dividend\n4 0 S\ngrowth during the high-growth stage and then multiplying by (1 + g ) to account for one year of dividend growth during the long-term growth stage.\nL\nSubstitute values into the formula for D to calculate D :\nn+1 4\nThe required rate of return is used to calculate the present value of future dividends, not to calculate the dividends themselves.\n(Choice B) €1.26 results from multiplying D by (1 + g )4: €1 × (1.06)4 = €1.26. The dividend increases by the short-term growth rate (6%) only\n0 S\nduring the high-growth period (Years 1-3). In Year 4, the dividend grows at the long-term growth rate of 3%.\n(Choice C) €1.30 results from multiplying D by (1 + g )4(1 +g ): €1 × (1.06)4(1.03) = €1.30. The short-term growth rate applies for Years 1-3. In\n0 S L\nYear 4, the dividend grows at the long-term growth rate of 3%.\nThings to remember:\nIn the two-stage dividend discount model, the dividend at the end of the first year of the long-term growth stage (second stage) is D = D (1 +\nn+1 0\ng )n(1 + g ). The dividend D is a component in estimating the intrinsic value of the security, used in calculating the year n value of the long-term\nS L n+1\ngrowth stage.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model as appropriate LOS\n4.An analyst has estimated the enterprise value of a firm and wants to calculate the market value of its common equity. The analyst would most\nappropriately:\nA. add the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\n B. subtract the market value of preferred stock and debt and add cash equivalents and short-term investments.\nC. subtract the market value of preferred stock and debt and subtract cash equivalents and short-term investments.\nExplanation\nEnterprise value (EV) is a way of viewing the total value of an enterprise, including debt and equity. EV can be used to value a firm's equity, by\nbeginning with the value of both debt and equity. EV is described as the total takeover cost of a company since it represents the total cost an\nacquirer would pay for the company's equity and debt, minus cash equivalents and short-term investments.\nSuppose a company's EV is HKD 101,000 million, its market value of debt is HKD 14,000 million, its market value of preferred stock is HKD 70\nmillion, and its cash and short-term investments are HKD 10 million. The market capitalization (ie, the market value of common stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 4, "q": "An analyst has estimated the enterprise value of a firm and wants to calculate the market value of its common equity. The analyst would most appropriately:", "opts": ["add the market value of preferred stock and debt and subtract cash equivalents and short-term investments.", "subtract the market value of preferred stock and debt and add cash equivalents and short-term investments.", "subtract the market value of preferred stock and debt and subtract cash equivalents and short-term investments."], "ans": "B", "expl": "Enterprise value (EV) is a way of viewing the total value of an enterprise, including debt and equity. EV can be used to value a firm's equity, by\nbeginning with the value of both debt and equity. EV is described as the total takeover cost of a company since it represents the total cost an\nacquirer would pay for the company's equity and debt, minus cash equivalents and short-term investments.\nSuppose a company's EV is HKD 101,000 million, its market value of debt is HKD 14,000 million, its market value of preferred stock is HKD 70\nmillion, and its cash and short-term investments are HKD 10 million. The market capitalization (ie, the market value of common stock) is\ncalculated as follows:\nIn this example, the company's market capitalization (ie, its market value of common stock) is HKD 86,940 million. Therefore, given the EV of a\ncompany, calculate its market capitalization by subtracting the market value of preferred stock and debt, then adding the value of cash\nequivalents and short-term investments (Choices A and C).\nThings to remember:\nEnterprise value (EV) is the sum of the company's market capitalization, market value of preferred stock, and market value of debt, minus cash\nequivalents and short-term investments. Given the EV of a company, calculate the market value of its common stock by subtracting the market\nvalue of preferred stock and debt, then adding the value of cash equivalents and short-term investments.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 5, "q": "An analyst gathers the following information about the common stock of a mature company with a stable growth pattern. The company's dividend growth is expected to be constant for an indefinite time period. Most recent dividend €0.95 Required rate of return 9% Dividend payout ratio 53% Beta 1.10 Return on equity 7% The intrinsic value of the stock is closest to:", "opts": ["€16.64", "€17.18", "€18.62"], "ans": "B", "expl": "The Gordon growth model (GGM) is used to estimate the intrinsic value of a stock. The GGM assumes the company has steady growth in\nearnings, resulting in a constant dividend growth rate (g). Dividend discount models, such as the GGM, are present value models that use\nfuture dividends as inputs to determine a stock's current value.\nThe constant dividend growth rate can be estimated as the earnings retention ratio (b) multiplied by the return on equity (ROE):\nROE is a measure of return on shareholder equity. The earnings retention ratio, b, indicates how much of that return is reinvested in the\nbusiness. Thus, the constant dividend growth rate gives an estimate of future growth of earnings and dividends based on reinvested shareholder\nreturn. Substitute values to calculate stock intrinsic value (V ):\n0\nThings to remember:\nThe Gordon growth model is used for stock valuation when growth is constant. Intrinsic value is the next period dividend divided by the difference\nbetween the required return and the growth rate. The constant dividend growth rate is the product of the earnings retention rate and return on\nequity.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate\n6.A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and has a required rate of return of 8%. If the required\nrate of return decreases to 7.5%, then the value of the preferred stock would most likely:\n\nA. increase by $4.17 per share.\nB. decrease by $4.17 per share.\nC. change to $4.65 per share.\nExplanation\nat at\n(r = 8.0%) (r = 7.5%)\nDividend (D ) 5.00 5.00\n0\n÷ Discount rate (r) 0.08 0.075\n= Value (V ) 62.50 66.67\n0\nΔV = 66.67 − 62.50 = $4.17\n0\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\n(Choice B) The value of the stock increased, not decreased, by $4.17.\n(Choice C) $4.65 results from dividing $5 by (1 + 7.5%).\nThings to remember:\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 6, "q": "A company's noncallable, nonconvertible preferred stock pays dividends of $5 per share and has a required rate of return of 8%. If the required rate of return decreases to 7.5%, then the value of the preferred stock would most likely: ", "opts": ["increase by $4.17 per share.", "decrease by $4.17 per share.", "change to $4.65 per share."], "ans": "A", "expl": "at at\n(r = 8.0%) (r = 7.5%)\nDividend (D ) 5.00 5.00\n0\n÷ Discount rate (r) 0.08 0.075\n= Value (V ) 62.50 66.67\n0\nΔV = 66.67 − 62.50 = $4.17\n0\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\n(Choice B) The value of the stock increased, not decreased, by $4.17.\n(Choice C) $4.65 results from dividing $5 by (1 + 7.5%).\nThings to remember:\nPreferred stock is a type of equity that typically pays regular fixed dividends. Since all cash flows are forever the same, preferred stock is valued\nas a perpetuity and its present value is calculated using the perpetuity formula, that is, by dividing the dividend payment by the required rate of\nreturn.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 7, "q": "An analyst gathers the following data about two companies: Compared with Company X, Company Y most likely has a:", "opts": ["higher trailing P/E and justified forward P/E.", "higher trailing P/E and lower justified forward P/E.", "lower trailing P/E and higher justified forward P/E."], "ans": "B", "expl": "The P/E ratio has different forms: trailing P/E, forward P/E (prospective or leading P/E), and justified forward P/E. Trailing P/E is based on past\nearnings and forward P/E on future earnings. If the forward earnings estimate is based on a model used to estimate future company\nfundamentals or cash flows, the ratio is referred to as justified forward P/E.\nForward multiples allow analysts to predict and compare potential future prices of companies' stock. The justified forward P/E ratio, derived from\nthe Gordon growth model, allows analysts to do such comparisons based on a projected value of future earnings.\nValues should be substituted into the formulas for trailing P/E and justified forward P/E for each company:\nBased on these calculations, Company Y has a higher trailing P/E ratio and lower justified forward P/E ratio than Company X.\nThings to remember:\nThe trailing P/E ratio is calculated as the current market price divided by past earnings: P /E . The forward P/E ratio is the current market price\n0 0\ndivided by future earnings: P /E . The justified forward P/E ratio is the dividend payout ratio divided by the difference between the required rate of\n0 1\nreturn and the long-term dividend growth rate: P /E = p ÷ (r - g).\n0 1\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 8, "q": "An analyst gathers the following data on a company whose dividend growth rate is expected to be constant indefinitely: Current market price £61.03 Last dividend paid £2.74 Required rate of return 8.0% Weighted average cost of capital 7.6% Assuming the stock is fairly valued, its long-term growth rate is closest to:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Security's market price vs. intrinsic value\nOvervalued Market price >> intrinsic value\nFairly valued Market price ≈ intrinsic value\nUndervalued Market price << intrinsic value\nInvestors use equity valuation models to estimate a security's intrinsic (ie, fundamental) value and to identify market mispricing that can be used to\ngenerate enhanced returns. Greater returns may be achieved by buying undervalued securities and selling overvalued securities. Securities are\nundervalued when trading at market prices below their intrinsic value and vice versa.\nDefining under- and overvalued is straightforward. Unfortunately, accurately estimating intrinsic value is very difficult. Many valuation model\ninputs are difficult to estimate accurately (eg, growth rate of cash flow for present value models, next year's earnings for multiplier models).\nConsequently, equity prices need to differ substantially from intrinsic value estimates before concluding a stock is undervalued or\novervalued. It is difficult to conclude a security is mispriced if trading within 1–2% of intrinsic value estimates.\nIn this scenario, the stock's market price differs by less than 1% from the nearer end of the estimated range of values from each valuation model.\nSince the current price of the common stock is between the range of estimated intrinsic values from the two models, the most reasonable\nconclusion is that the security is fairly valued (Choices A and C).\nThings to remember:\nSecurities are undervalued when trading at market prices below their intrinsic value and overvalued when trading at prices above intrinsic value.\nWhen a stock's price does not differ substantially from estimates of intrinsic value and is between the estimates from different models, the most\nreasonable conclusion is that the security is fairly valued.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 9, "q": "An investor evaluates a common stock using two valuation models: A free-cash-flow-to-equity model estimates the intrinsic value at 158–161. An earnings multiple model estimates intrinsic value at 163–167. If the stock is currently trading at 162, the investor's most appropriate conclusion is that the stock is:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Security's market price vs. intrinsic value\nOvervalued Market price >> intrinsic value\nFairly valued Market price ≈ intrinsic value\nUndervalued Market price << intrinsic value\nInvestors use equity valuation models to estimate a security's intrinsic (ie, fundamental) value and to identify market mispricing that can be used to\ngenerate enhanced returns. Greater returns may be achieved by buying undervalued securities and selling overvalued securities. Securities are\nundervalued when trading at market prices below their intrinsic value and vice versa.\nDefining under- and overvalued is straightforward. Unfortunately, accurately estimating intrinsic value is very difficult. Many valuation model\ninputs are difficult to estimate accurately (eg, growth rate of cash flow for present value models, next year's earnings for multiplier models).\nConsequently, equity prices need to differ substantially from intrinsic value estimates before concluding a stock is undervalued or\novervalued. It is difficult to conclude a security is mispriced if trading within 1–2% of intrinsic value estimates.\nIn this scenario, the stock's market price differs by less than 1% from the nearer end of the estimated range of values from each valuation model.\nSince the current price of the common stock is between the range of estimated intrinsic values from the two models, the most reasonable\nconclusion is that the security is fairly valued (Choices A and C).\nThings to remember:\nSecurities are undervalued when trading at market prices below their intrinsic value and overvalued when trading at prices above intrinsic value.\nWhen a stock's price does not differ substantially from estimates of intrinsic value and is between the estimates from different models, the most\nreasonable conclusion is that the security is fairly valued.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 10, "q": "An analyst has gathered the following information about a company's stock: According to the Gordon growth model, the company's justified price-to-earnings ratio implies its stock's value is closest to:", "opts": ["SGD 10", "SGD 20", "SGD 30"], "ans": "B", "expl": "The price-to-earnings (P/E) ratio is used mainly in three different forms: trailing P/E, forward P/E ratio (prospective or leading P/E), and justified\nforward P/E ratio. Trailing P/E uses past earnings, whereas forward P/E is based on future earnings. If the forward earnings estimate is based on\nsome predictive model involving company fundamentals or cash flows, the ratio is referred to as justified forward P/E.\nIn this scenario, first calculate the dividend payout ratio p = (1 − earnings retention ratio) = (1 − 0.60) = 0.40. Substitute next year's earnings (E ),\n1\ndividend payout ratio (p), required rate of return (r), and the long-term growth rate (g), into the formula for the forward justified P/E ratio to\ncalculate the current value of the stock implied by the justified forward P/E:\nThe derivation of the justified forward P/E ratio from the Gordon growth model includes the assumption that the stock's price is assumed to be\nequal to its value in this model. The weighted average cost of capital is not used in this calculation.\n(Choice A) SGD 10 is incorrect. The forward justified P/E ratio of the stock is 10, and its price is SGD 20.\n(Choice C) SGD 30 results from using the earnings retention ratio instead of the dividend payout ratio in the numerator.\nThings to remember:\nThe justified forward price-to-earnings (P/E) ratio is equal to the dividend payout ratio divided by the difference between the required rate of return\nand the long-term growth rate. The dividend payout ratio divided by the difference between the required rate of return and the long-term growth\nrate and then multiplied by next year's earnings results in the stock's current price (and value).\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 11, "q": "An analyst determines that all companies in a universe of widely followed global large-cap stocks are significantly undervalued. The most appropriate next step would be to:", "opts": ["buy all these undervalued stocks in client portfolios.", "buy only the most undervalued stocks in client portfolios.", "review the forecasts and assumptions used in the models."], "ans": "C", "expl": "When faced with an intrinsic value estimate that is significantly different from the market price, the most appropriate next step is to reassess and\nconfirm confidence in the model's inputs before acting.\nComparing a model's valuation estimate with the market price to determine whether a stock is over- or undervalued seems straightforward, but\nthere are nuances to consider (eg, degree of confidence in the model's inputs and assumptions, whether the mispricing will converge over a\nsuitable investment horizon). In the quest to identify and exploit market mispricing, analysts can become overconfident in the output of their\nvaluation models (Choices A and B).\nIn this case, the facts strongly suggest a problem with the model's output. Stocks that are widely followed and well known to market participants\n(eg, large-cap stocks), and trade in different markets around the world (eg, global stocks), are unlikely to be simultaneously and universally\nundervalued.\nThings to remember:\nWhen faced with an intrinsic value estimate that is significantly different than the market price, the most appropriate next step is to reassess and\nconfirm confidence in the model's inputs before acting.\nEvaluate whether a security, given its current market price and a value estimate, is overvalued, fairly valued, or undervalued by the market", "qhtml": null}, {"n": 12, "q": "When using enterprise value to estimate a company's market value of common equity, an analyst has difficulty finding quotes for the market value of the company's long-term bonds. The market value of company debt is best estimated using the: ", "opts": ["market quotes of similar bonds.", "bonds' cash flows discounted by 3-month LIBOR.", "value of the bonds on the company's balance sheet."], "ans": "A", "expl": "Enterprise value (EV) can be used to estimate the value of a company's equity. A critical input for its use is the market value of the company's\ndebt, which is ideally calculated using market quotations for the company's bonds. If obtaining market quotes for the company's bonds is\nproblematic, the market value of debt is most appropriately estimated using available quotes for bonds with similar characteristics (eg,\ncredit, sector, maturity) that are currently trading in the market.\n(Choice B) Although the bonds' intrinsic value can be viewed as the present value of future cash flows, the 3-month LIBOR rate is a short-term\nrate and, therefore, would be inappropriate for such a calculation.\n(Choice C) Using the value of the bonds on a company's balance sheet (eg, book value of bonds) is an inaccurate way to estimate the market\nvalue of the company's debt. Over time, interest rates change and the market perception of the company's credit risk will also change. These two\nfactors may cause the book value of the bonds to differ significantly from their market value.\nThings to remember:\nEnterprise value can be used to estimate the market value of a company's common equity. If obtaining market quotes for a company's bonds is\nproblematic, the market value of company debt is most appropriately estimated using available quotes for bonds with similar characteristics that\nare currently trading in the market.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 13, "q": "Which of the following best describes the impacts of a reverse stock split on share prices and on the market value of a company's equity?", "opts": ["Higher price per share and greater market value of equity", "Lower price per share and unchanged market value of equity", "Higher price per share and unchanged market value of equity"], "ans": "C", "expl": "A reverse split is a corporate action in which a company cancels a portion of its outstanding shares. For example, in a 1-for-5 reverse split, 4/5\nof the outstanding shares are canceled: For every 5 shares outstanding before the split, only 1 share remains. All common equity holders\nexperience the same proportional reduction in the number of shares. A shareholder with 200 shares before the split has only 40 shares after the\nsplit.\nThe split has no impact on the metrics that affect company value (eg, expected earnings, forecasted free cash flow to equity), so the market\nvalue of the outstanding equity is unchanged. Since the reverse split results in a smaller number of shares representing the ownership of the\ncompany, the price per share must increase (Choices A and B).\nReverse splits are often used to address low share prices, which may have some negative impacts. Very low prices are often associated with\nspeculative companies, and many stock exchanges have listing requirements that specify a minimum share price.\nThings to remember:\nIn a reverse split, a company cancels a portion of its outstanding shares. However, the split has no impact on the metrics that affect company\nvalue such as expected earnings or cash flow, so the market value of the equity is unchanged. Since a smaller number of shares represent\nownership of the company, the price per share must increase.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 14, "q": "All else being equal, the impact of a share repurchase on shareholders' wealth is most likely similar to the impact of:", "opts": ["cash dividends.", "stock dividends.", "reverse stock splits."], "ans": "A", "expl": "Both cash dividends and share repurchases (ie, buybacks) entail money distributions to shareholders. Cash dividends are payments to every\nshareholder of an equal dividend for each share owned. Share repurchases are cash payments going only to those shareholders selling shares\nto the company.\nDespite the different patterns of cash distributions, the economic impact of cash dividends and share repurchases on shareholders' wealth is\nsimilar. In either case, the total market value of the outstanding shares (ie, market capitalization) should decline by the amount of cash\ndistributed. For cash dividends, that will result in a lower price per share. For stock repurchases, the result is an unchanged share price but a\nsmaller number of shares outstanding.\n(Choices B and C) Stock dividends and reverse splits leave a company's market capitalization unchanged. In either case, the number of shares\noutstanding changes but there is an offsetting proportional change in the share price, resulting in no change in market capitalization. This\ncontrasts with cash dividends and share repurchases, which reduce market capitalization by the amount of cash expended.\nThings to remember:\nThe economic impact of cash dividends and stock repurchases on shareholders' wealth is similar: The total market value of the outstanding shares\n(ie, market capitalization) should decline by the amount of cash distributed. In contrast, stock dividends and reverse splits leave a company's\nmarket capitalization unchanged.\nDescribe regular cash dividends, extra dividends, stock dividends, stock splits, reverse stock splits, and share repurchases", "qhtml": null}, {"n": 15, "q": "The long-term growth stage of the two-stage dividend discount model is most appropriately valued using the:", "opts": ["Gordon growth model.", "capital asset pricing model.", "free cash flow to equity model."], "ans": "A", "expl": "The two-stage dividend discount model (two-stage DDM) is used to find the value of a company expected to have high growth (short term),\nfollowed by lower constant growth (long term). The high growth stage is assumed to last for a certain number of (n) years, followed by an infinite\nlong-term growth stage.\nIn the two-stage DDM, the Gordon growth model (GGM) is used to find the value of the second stage, which has constant dividend growth. The\nGGM value of the long-term growth stage is used as the terminal value input for valuation of the high growth stage. The value is discounted\nback to the present using the required rate of return (r) and added to the present value of the first (high growth) stage to find the security's intrinsic\nvalue.\n(Choice B) The capital asset pricing model (CAPM) is not a dividend discount model and is used to find the expected return of a security, not its\ncurrent intrinsic value. The CAPM can be used to find the required rate of return, a variable of the two-stage DDM.\n(Choice C) The free cash flow to equity (FCFE) model is based on free cash flows and not dividends, so FCFE would not be used in the two\nstage dividend discount model.\nThings to remember:\nThe two-stage dividend discount model (two-stage DDM) is used to find the intrinsic value of a company expected to grow at a high rate, followed\nby a stage of constant, sustainable long-term growth. The Gordon growth model is used within the two-stage DDM to estimate the value, as of the\nend of the high growth stage, of dividends from the long-term growth stage.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 16, "q": "A company issued retractable term preferred shares on June 30, 20X1, with the following characteristics: Selected Data Par value, per share $25.00 Dividend yield at issuance 6.0% Dividend payments Annually on June 30 Retraction date June 30, 20X8 Maturity date June 30, 20X9 On July 1, 20X5, an analyst trying to value these shares assumes that the retraction feature will be exercised at par on June 30, 20X8, and that the required rate of return is 7.5%. The analyst's most appropriate conclusion is that the intrinsic value ($) per share is closest to:", "opts": ["23.74", "24.00", "25.00"], "ans": "B", "expl": "Retractable term preferred shares (RTPS) are a special type of preferred stock. Preferred stock is typically viewed and valued as a perpetuity.\nConversely, RTPS have a maturity date, are often callable, and always include a retraction provision (ie, put provision). The retraction provision\nallows the investor to \"put\" (ie, sell) the preferred shares back to the issuer at a predetermined price and time.\nThe intrinsic value of a RTPS is equal to the present value of its dividend stream plus the present value of the expected final principal payment,\nwhich could occur on a call date, a retraction date, or at maturity.\nTo determine the intrinsic value in this instance, the initial dividend yield must be converted into a cash value. The initial yield of 6% based on a\n$25 par value equals an annual dividend of $25 × 0.06 = $1.50. Therefore, intrinsic value is calculated using the dividends from 20X6 through\n20X8 and the par value at the retraction date (ie, 20X8), discounted by the required rate of return:\nBased on the intrinsic value calculation, the shares are fairly valued at approximately $24.00.\n(Choice A) $23.74 is the intrinsic value of the shares if valued to maturity, not to the retraction date.\n(Choice C) $25.00 is the undiscounted par value whether using either the retraction date or maturity date.\nThings to remember:\nRetractable term preferred shares are a special type of preferred stock that have an embedded put provision, allowing the investor to \"put\" the\nshares back to the issuer at a predetermined price and time.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 17, "q": "An analyst using the method of comparables is concerned about business cycle effects on price multiples. To address this concern, the analyst would most appropriately use the: ", "opts": ["price-to-sales ratio.", "earnings per share.", "price-to-earnings ratio."], "ans": "A", "expl": "The most common way that analysts compare and report on price multiples is the method of comparables. The analysts compare the price\nmultiple of a company stock with that of a benchmark (ie, a similar company stock or average). If the price multiple of the stock is\nlower than the benchmark, then the stock is considered to be undervalued,\nthe same as the benchmark, then the stock is considered to be fairly valued,\nhigher than the benchmark, then the stock is considered to be overvalued.\nThe price-to-earnings (P/E) ratio is commonly used for this type of comparison. However, in this scenario, the analyst is concerned that business\ncycle fluctuations might distort the comparison results. Since earnings are very sensitive to changes in the business cycle, the P/E ratio\nduring periods of high growth or economic downturn might take on extreme values that do not reflect the company's long-term value (Choice C).\nAn appropriate alternative to using P/E to make comparisons is to use the price-to-sales (P/S) ratio instead. Although the P/S ratio is affected by\neconomic boom and recession, the effect is not as pronounced as with the P/E ratio since earnings are more heavily influenced than sales by fixed\noperating and financial costs.\n(Choice B) The analyst wants to compare price multiples; earnings per share is not a price multiple. Earnings per share is also highly sensitive to\nchanges in the business cycle and therefore would not be a good alternative to the P/E ratio in this scenario.\nThings to remember:\nThe price-to-sales ratio can be used as an alternative to the price-to-earnings (P/E) ratio if there are concerns about earnings values caused by\nfluctuations in the business cycle and distorting P/E ratio comparisons.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 18, "q": "Which of the following statements is most accurate concerning an asset-based valuation model?", "opts": ["It derives a firm's equity value from the book value of assets and liabilities.", "It is appropriate for valuing firms with significant proportions of working capital.", "It is appropriate for valuing firms with significant proportions of intangible assets."], "ans": "B", "expl": "Equity represents the claim that shareholders have on a firm's net assets after accounting for liabilities. Companies report assets and liabilities at\nbook value, which may not always reflect current market conditions. Therefore, it is important for analysts to adjust book values to market (fair)\nvalues when valuing a company.\nThe short-term (one year or less) nature of current assets and liabilities (ie, working capital) makes them easy to value since market prices are\nlikely to be close to their book values. As such, it is often appropriate to apply asset-based valuation to a firm that holds a large percentage of\nworking capital (relative to total assets). Conversely, it is difficult to value firms with large proportions of noncurrent assets (eg, equipment), since\nbook values can differ drastically from market values.\n(Choice A) Under asset-based valuation, a firm's equity value is approximated from the market value, not the book value, of assets and liabilities.\n(Choice C) Intangible assets (eg, goodwill, patents) are usually hard to measure and company specific. Therefore, it is difficult to obtain market\nprices as proxies.\nThings to remember:\nAsset-based valuation models derive a firm's equity value by subtracting the market (fair) value of liabilities from the market value of assets.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}, {"n": 19, "q": "The best rationale for matching EBITDA with enterprise value (EV) in the EV/EBITDA ratio is that EBITDA:", "opts": ["is a proxy for free cash flow to equity.", "indicates cash flow to pay all financial stakeholders.", "excludes all noncash expenses and noncash revenues."], "ans": "B", "expl": "EBITDA is considered a rough proxy for operating cash flow available to pay interest, dividends, and taxes. Thus, it is a measure of a company's\nability to support the claims of all financial stakeholders. Enterprise value (EV) is a comprehensive way of assessing the value of a company,\nby looking at the market value of the entire enterprise, including preferred stock, common stock, and debt.\nThe EV/EBITDA ratio of firms may be compared as an alternative to the more common practice of comparing firms' P/E ratios. The P/E ratio has\nthe disadvantage that earnings may be negative. EBITDA is usually positive.\nThe P/E ratio is used to compare the market value of the shareholder claim (the stock price) with the earnings that are generated for their benefit.\nSimilarly, EBITDA is used with EV since EV is a measure of the firm's entire debt and equity value and EBITDA is a rough measure of cash flow\navailable to all financial stakeholders. Therefore, EV aligns with EBITDA in the same way that price aligns with earnings.\n(Choice A) EBITDA is a measure of a firm's financial resources available for common equity, preferred equity, and debt holders, not a measure of\ncash flow exclusively available to equity.\n(Choice C) EBITDA is earnings before depreciation, amortization, or taxes but it does not exclude all noncash expenses and revenues.\nThings to remember:\nEBITDA is considered a rough proxy for operating cash flow available to pay interest, dividends, and taxes, and therefore is a measure of the\nresources available to financial stakeholders. The EV/EBITDA ratio of firms may be compared as an alternative to comparing firms' P/E ratios.\nDescribe enterprise value multiples and their use in estimating equity value", "qhtml": null}, {"n": 20, "q": "An analyst gathers the following information about the common stock of a mature company for which dividend growth is expected to be constant for an indefinite period. Selected Data Current market price €48.53 Last dividend paid €1.65 Required rate of return 6.5% Long-term dividend growth rate 3.1% Long-term economic growth rate 2.9% Based on this information, the stock is most likely: ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "B", "expl": "The method of comparables can be used in two ways. Comparing one asset's price multiple to its historical average (ie, benchmark) over multiple\nyears is called time-series analysis. Comparing the price multiples of several similar assets over the same time period is called cross-sectional\nanalysis. If the price multiple of the asset is\nless than the benchmark, it is considered undervalued\nnearly equal to the benchmark, it is considered fairly valued\ngreater than the benchmark, it is considered overvalued.\nIn this scenario, there are three price multiples under consideration: price-to-earnings (P/E), price-to-book (P/B), and price-to-sales (P/S). Since\nonly one year is given, time-series analysis is not an option; therefore, cross-sectional analysis is appropriate. Company Y's P/B is the same as\nthe average P/B for the three companies. However, Company Y's P/E and P/S are below the average P/E and P/S for all three companies.\nTherefore, Company Y is considered undervalued.\n(Choice A) Company X's P/B is virtually the same as the average of all three companies. Its P/E and P/S are well over the three companies'\naverage, so Company X would be considered overvalued.\n(Choice C) Company Z's P/E is above the companies' average, its P/S is the same as the average, and its P/B is below the average. Therefore,\nit would be inappropriate to conclude that Company Z is undervalued.\nThings to remember:\nIn cross-sectional analysis, an asset's price multiples are compared with the average multiples of other similar assets for the same time period. If\na price multiple is less than, greater than, or nearly equal to its benchmark, it is considered undervalued, overvalued, or fairly valued, respectively.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 21, "q": "An analyst gathered the following price multiples: The analyst will most appropriately conclude that which of the following companies is undervalued?", "opts": ["Company X", "Company Y", "Company Z"], "ans": "B", "expl": "The method of comparables can be used in two ways. Comparing one asset's price multiple to its historical average (ie, benchmark) over multiple\nyears is called time-series analysis. Comparing the price multiples of several similar assets over the same time period is called cross-sectional\nanalysis. If the price multiple of the asset is\nless than the benchmark, it is considered undervalued\nnearly equal to the benchmark, it is considered fairly valued\ngreater than the benchmark, it is considered overvalued.\nIn this scenario, there are three price multiples under consideration: price-to-earnings (P/E), price-to-book (P/B), and price-to-sales (P/S). Since\nonly one year is given, time-series analysis is not an option; therefore, cross-sectional analysis is appropriate. Company Y's P/B is the same as\nthe average P/B for the three companies. However, Company Y's P/E and P/S are below the average P/E and P/S for all three companies.\nTherefore, Company Y is considered undervalued.\n(Choice A) Company X's P/B is virtually the same as the average of all three companies. Its P/E and P/S are well over the three companies'\naverage, so Company X would be considered overvalued.\n(Choice C) Company Z's P/E is above the companies' average, its P/S is the same as the average, and its P/B is below the average. Therefore,\nit would be inappropriate to conclude that Company Z is undervalued.\nThings to remember:\nIn cross-sectional analysis, an asset's price multiples are compared with the average multiples of other similar assets for the same time period. If\na price multiple is less than, greater than, or nearly equal to its benchmark, it is considered undervalued, overvalued, or fairly valued, respectively.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 22, "q": "An analyst gathers the following information related to a company's stock: Current annual dividend per share €1.00 Annual dividend growth rate for Years 1–3 6% Annual dividend growth rate for Years 4+ 2% Required rate of return 10% If the stock is fairly valued, then the terminal value at the end of Year 3 using the two-stage dividend discount model is closest to:", "opts": ["€14.20", "€14.89", "€15.19"], "ans": "C", "expl": "The two-stage dividend growth model is used to determine the intrinsic value of the stock of a company that is expected to experience a period of\nhigh, short-term dividend growth followed by lower long-term growth. The stock's intrinsic value is the sum of the present values of dividends from\nboth stages.\nThe terminal value represents the stock's intrinsic value at the end of the short-term, high-growth stage. At that point, the dividend is expected\nto grow at a lower rate over a period expected to continue indefinitely. The terminal value can be calculated using the Gordon growth model since\nthat model is appropriate for a stock with expected constant dividend growth.\nIn this scenario, the terminal value is the value at the end of Year 3, when the long-term growth stage begins. First, calculate the dividend at the\nend of Year 3 using the short-term growth rate of 6% since the dividend grows at the higher rate up to that point. Then, the terminal value is\ncalculated using the lower, long-term growth rate of 2%:\nThings to remember:\nIn the two-stage dividend growth model, a stock's intrinsic value is the sum of the present values of dividends from both a short-term, high-growth\nstage and a subsequent, long-term stage of lower growth. The terminal value represents the intrinsic value at the beginning of the second stage,\nwhich is expected to continue indefinitely. The Gordon growth model, which is appropriate for a stock with an expected constant growth rate, can\nbe used to determine the terminal value.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate\n23.An analyst has collected the following data for a noncallable, nonconvertible preferred stock:\nSelected Data\nPar value SAR 25.00\nMarket value SAR 24.56\nPreferred stock dividend rate 5.6%\nRequired rate of return 5.7%\nBased on this information, the stock is most likely:\nA. undervalued.\n\nB. fairly valued.\nC. overvalued.\nExplanation\nLike other equities, the intrinsic value of a preferred stock is the present value of all its future dividends. The model for determining the\nintrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result, the value of a preferred stock is\ncalculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's dividends:\nIntrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate).\nThe dividend is the product of the preferred dividend rate and the par value.\nIn this scenario, the last preferred dividend is calculated by multiplying the par value by the preferred dividend rate (25 × 0.056 = 1.4). Substitute\nvalues into the preferred stock valuation model to calculate the intrinsic value:\nSince the intrinsic value is equal to the market value (after rounding to two decimal places), the preferred stock is considered fairly valued.\n(Choice A) Determining the stock is undervalued is the result of incorrectly reversing the required rate of return and the preferred stock dividend\nrate in the calculation.\n(Choice C) Concluding that the stock is overvalued results from using the market value, rather than the par value, to determine the dividend used\nto calculate intrinsic value.\nThings to remember:\nThe model for determining the intrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result,\nthe intrinsic value of a preferred stock is calculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's\ndividends. If intrinsic value is equal to market value, the preferred stock is considered fairly valued.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 23, "q": "An analyst has collected the following data for a noncallable, nonconvertible preferred stock: Selected Data Par value SAR 25.00 Market value SAR 24.56 Preferred stock dividend rate 5.6% Required rate of return 5.7% Based on this information, the stock is most likely:", "opts": ["undervalued.", "fairly valued.", "overvalued."], "ans": "B", "expl": "Like other equities, the intrinsic value of a preferred stock is the present value of all its future dividends. The model for determining the\nintrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result, the value of a preferred stock is\ncalculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's dividends:\nIntrinsic value is equal to the annual dividend divided by the required rate of return (ie, the prevailing market rate).\nThe dividend is the product of the preferred dividend rate and the par value.\nIn this scenario, the last preferred dividend is calculated by multiplying the par value by the preferred dividend rate (25 × 0.056 = 1.4). Substitute\nvalues into the preferred stock valuation model to calculate the intrinsic value:\nSince the intrinsic value is equal to the market value (after rounding to two decimal places), the preferred stock is considered fairly valued.\n(Choice A) Determining the stock is undervalued is the result of incorrectly reversing the required rate of return and the preferred stock dividend\nrate in the calculation.\n(Choice C) Concluding that the stock is overvalued results from using the market value, rather than the par value, to determine the dividend used\nto calculate intrinsic value.\nThings to remember:\nThe model for determining the intrinsic value of a preferred stock assumes that dividends remain the same and continue indefinitely. As a result,\nthe intrinsic value of a preferred stock is calculated as the value of a perpetuity, where the perpetuity's future payments are the preferred stock's\ndividends. If intrinsic value is equal to market value, the preferred stock is considered fairly valued.\nCalculate the intrinsic value of a non-callable, non-convertible preferred stock", "qhtml": null}, {"n": 24, "q": "In valuing equities, a disadvantage of using the method of comparables with price multiples is most likely that it:", "opts": ["may be unnecessarily complex.", "does not work well for industry analysis.", "is impacted by choice of accounting methods."], "ans": "C", "expl": "The comparables (comps) method is the most common way to compare and report on price multiples. The analyst compares a price multiple of a\ncompany stock to that of a benchmark (ie, similar company stock, industry average). If the price multiple of the stock is lower, higher, or the same\nas the benchmark, then the stock is considered undervalued, overvalued, or fairly valued, respectively.\nThere are disadvantages to the comps method. Results can be inconsistent with other types of models (eg, present value, asset-based). Also,\nfactors that decrease comparability, such as economic fluctuations and choice of accounting methods, may distort comparisons. For\nexample, companies have flexibility on the timing and amount of expenses they recognize, which can potentially impact income statement items\nand therefore price multiples.\nUsing comps to make valuation decisions also has advantages. The data needed to construct price multiples and make comparisons are publicly\navailable, and the method is easily used and widely understood. Compared with other valuation methods, use of comps is relatively simple and\nallows for relative comparisons between companies. It is particularly suited to comparing companies in the same industry (Choices A and B).\nThings to remember:\nDisadvantages of the comparables method include potential distortion by economic fluctuations, factors that diminish comparability, and results\nthat may be inconsistent with other types of models.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 25, "q": "An advantage of using the justified forward P/E ratio in valuation of a company's equity is that it most likely:", "opts": ["provides a way to compare companies in the future.", "does not require estimating future company values or cash flows.", "can be reliably compared to trailing price multiples of other companies."], "ans": "A", "expl": "Price-to-earnings (P/E) ratios\nTrailing P/E Forward P/E Justified forward P/E\nJustified by future flows\nNumerator Current price\n(free cash flow, dividends)\nDenominator Past earnings Future earnings Future earnings\nA price multiple is the ratio of a company's stock price to another fundamental value or cash flow. One such multiple is the price-to-earnings ratio\n(P/E ratio), which is equal to the company's stock price divided by its earnings per share. For example, if a company's earnings per share is CNY\n2 and the stock price is CNY 40, the P/E ratio is 40 / 2 = 20.\nThe P/E ratio is used in mainly three different forms: trailing P/E, forward P/E ratio (ie, prospective or leading P/E), and justified forward P/E.\nTrailing P/E uses past earnings. An obvious drawback of using trailing P/E is that it fails to consider a company's future earnings.\nForward P/E is based on future earnings. If the forward P/E ratio estimate is based on a model of future company fundamentals or cash flows, the\nratio is referred to as justified forward P/E. Using a justified forward multiple allows comparison of company price multiples in the future.\n(Choice B) Justified forward P/E requires estimating future earnings growth using a predictive model, such as the Gordon growth model.\n(Choice C) Justified forward P/E is based on an estimate of future earnings, whereas trailing P/E is based on past or recent earnings. For this\nreason, the leading P/E of one company should not be compared with the trailing P/E of another company, as this will produce misleading\nconclusions.\nThings to remember:\nThe P/E ratio is equal to a company's stock price divided by its earnings per share. The trailing P/E ratio uses recent earnings, and the forward\nP/E ratio uses future earnings. The trailing P/E of one company should not be compared with the forward P/E of another company. The justified\nforward P/E ratio is a way to compare companies in the future based on modeling.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 26, "q": "When estimating a company's intrinsic value using an asset-based valuation model, an analyst would least likely need the value of the company's:", "opts": ["liabilities.", "preferred shares.", "capital expenditures."], "ans": "C", "expl": "Asset-based valuation models\nAn asset-based valuation model estimates a company's value as the common shareholders' claim on the company's net assets. These models\ncalculate the company's value as:\nthe market value of its assets, less\nthe market value of its liabilities and\nthe value of its preferred shares.\nThese market values include any off–balance sheet items that have value. The value of preferred shares must be removed from net assets in\nasset-based models since preferred shareholders' claims have priority over those of common shareholders (Choice B).\nCapital expenditures are a cash flow item measuring the value of new fixed assets a company has purchased during a period. Capital\nexpenditures increase the company's assets but are not needed for asset-based valuation models since their value will already be reflected in\nthe company's assets. Similarly, any debt required to fund the purchase of capital expenditures would be reflected in the company's liabilities.\n(Choice A) The value of liabilities is needed in asset-based valuation models since liabilities are subtracted from assets to calculate the net value\nof the assets.\nThings to remember:\nAn asset-based valuation model calculates a company's value as the market value of its assets less the market value of its liabilities and the value\nof its preferred shares. Capital expenditures increase a company's assets but are not needed for asset-based valuation models since their value\nis reflected in the company's assets.\nDescribe asset-based valuation models and their use in estimating equity value", "qhtml": null}, {"n": 27, "q": "All else equal, an identical increase to a company's long-term growth rate and required rate of return will most likely:", "opts": ["increase its justified forward P/E ratio.", "not affect its justified forward P/E ratio.", "decrease its justified forward P/E ratio."], "ans": "B", "expl": "The Gordon growth model can be used to derive a stock's intrinsic value (P ), which in turn can be used to calculate a justified forward P/E ratio.\n0\nThe inclusion of a company's expected earnings converts the numerator in the Gordon growth model equation from the expected dividend to the\ndividend payout ratio (p).\nThe Gordon growth model uses the difference between a company's required rate of return (r) and its long-term growth rate (g) as the\ndenominator of the equation. Since the denominator is the difference between rand g, an identical increase to both variables will result in no\nchange to the denominator.\nThe numerator in the calculation of justified forward P/E is next year's dividend divided by next year's earnings (D / E ). An increase to g will\n1 1\nresult in the same proportional increases to D and E since both are derived from their current values and the same estimated growth rate;\n1 1\ntherefore, an increase to g does not change the numerator. Thus, all else equal, identical increases to a company's long-term growth rate and\nrequired rate of return will not affect the company's justified forward P/E (Choices A and C).\nThings to remember:\nA company's justified forward P/E ratio can be derived from the Gordon growth model by including its expected earnings. Identical increases to a\ncompany's required rate of return (r) and long-term growth rate (g) will have no effect on the company's justified forward P/E ratio. Since the\ndenominator is the difference between the two variables, an identical increase will result in no change. Similarly, a change in g results in\nproportional increases to D and E , so the equation's numerator does not change.\n1 1\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 28, "q": "In the two-stage dividend discount model, the second stage most likely includes a:", "opts": ["constant dividend payout ratio.", "finite number of years of dividend payments.", "lower required rate of return than in the first stage."], "ans": "A", "expl": "The two-stage dividend discount model (DDM) is used to find the value of a stock that is expected to have high (short-term) dividend growth\nfollowed by lower, (long-term) constant dividend growth. The high growth stage is assumed to last for a certain number of (n) years and to be\nfollowed by an infinite constant growth stage. The value of the dividends received in the second stage is calculated using the Gordon growth\nmodel.\nA key assumption of the Gordon growth model is that the long-term dividend growth rate is constant. For dividends to grow at a constant rate,\nthe percentage of dividends that is paid from company earnings (dividend payout ratio) must remain the same. Otherwise, dividends will not\ngrow at a constant rate—even if earnings do.\nOther assumptions of the Gordon growth model include a required rate of return that is constant over time, long-term dividend growth that is at a\nlower rate (less than the required rate of return), and dividends that continue into infinity. The required rate of return is assumed constant for\nsimplicity within the model. Long-term growth is lower in this stage since the company is in a mature growth stage. (Choices B and C).\nThings to remember:\nThe two-stage dividend discount model includes the Gordon growth model, which is used to calculate the value of the second stage. Key\nassumptions of the Gordon growth model include constant dividend payout ratio, long-term dividend growth at less than the required rate of return,\nand constant dividend growth that continues infinitely.\nCalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend discount model or a two-stage\ndividend discount model, as appropriate", "qhtml": null}, {"n": 29, "q": "An analyst uses the method of comparables to evaluate cyclical companies during economic downturns. Which of the following ratios is least likely to be useful for that analysis?", "opts": ["Price-to-sales", "Price-to-earnings", "Enterprise value-to-EBITDA"], "ans": "B", "expl": "Multiples based on price and enterprise value are widely used to assess the relative value of comparable companies [ie, method of\ncomparables]. Such multiplier models are attractive since their factors are easy to obtain and the process is much less complicated than valuation\nmethods that attempt to estimate intrinsic value (eg, discounted cash flow analysis).\nCompanies are usually valued based on their long-term prospects. However, typical valuation multiples use operating measures (eg, earnings,\nEBITDA) for a single year. In economic downturns, the earnings of companies in cyclical industries are often highly depressed or negative (ie, net\nlosses). Negative earnings result in negative P/E ratios, which are problematic due to the difficulty of interpreting their meaning for relative\nvalue.\n(Choices A and C) Although the sales and EBITDA of cyclical companies are also depressed during economic downturns, both measures are\nlikely to remain positive. Therefore, analysts are not confronted with the problem of interpreting a negative ratio when using price-to-sales or\nenterprise value-to-EBITDA.\nThings to remember:\nValuation multiples are widely used to assess companies' values. In economic downturns, cyclical companies' earnings are often negative,\nresulting in negative P/E ratios, which are difficult to interpret. Since both sales and EBITDA are generally positive, the price-to-sales and\nenterprise value-to-EBITDA ratios do not create the same problem for analysts.\nCalculate and interpret the following multiples: price to earnings, price to an estimate of operating cash flow, price to sales, and price to book\nvalue", "qhtml": null}, {"n": 30, "q": "Which of the following is most likely the rationale for using the method of comparables to value equities?", "opts": ["Present value", "Law of one price", "Competitive advantage"], "ans": "B", "expl": "The most common way analysts compare and report on price multiples is the method of comparables. An analyst compares the price multiple of a\ncompany stock to a benchmark (ie, price multiple of a similar company stock or average). In a well-functioning financial system, arbitrage forces\nidentical assets to have the same price. Therefore, a price multiple should be close to its benchmark.\nMarket participants engage in arbitrage by purchasing a lower-priced asset and selling it at a higher price. This puts upward pressure on the lower\nprice and downward pressure on the higher price until the prices of the identical assets converge. The method of comparables is based on the\nlaw of one price, which is enforced by arbitrage.\n(Choice A) The present value approach assumes that an asset's intrinsic value is equal to the discounted value of all its future cash flows and\nthen compares that value to the asset's market price to determine whether it is fairly priced. In contrast, the method of comparables measures an\nasset's price against a benchmark of similar assets.\n(Choice C) Competitive advantage is a set of business conditions or company attributes that allows a business to outperform competitors and\nachieve superior results. Competitive advantage may allow one firm to sell at a lower price than its competitors but would not be associated with\nidentical assets having the same price.\nThings to remember:\nThe law of one price, the conceptual rationale for the method of comparables, holds that identical assets will have the same price in the\nmarketplace. The law of one price is enforced by market participants engaging in arbitrage.\nExplain the rationale for using price multiples to value equity, how the price to earnings multiple relates to fundamentals, and the use of multiples\nbased on comparables", "qhtml": null}, {"n": 31, "q": "To estimate a company's intrinsic value using a present value model, an analyst most likely needs to estimate the:", "opts": ["fair market value of assets.", "price multiples of comparable companies.", "cash flows available to common shareholders."], "ans": "C", "expl": "Each type of equity valuation model uses different metrics
