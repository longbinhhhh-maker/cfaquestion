<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

<script>
const DATA = [{"n":45,"q":"Using his multiple linear regression, Clark's sales forecast for 2019 is closest to:","opts":["–$191,914.","$180,502.","$192,090."],"ans":"A","expl":"2019 sales forecast = 20.1 + 0.001 × 8,000 + 1,000.6 × 0.05 + 0.1 × 97 − 3.2 × 60,000 − 40.3 × 0.055 = –$191,914 (Module 1.2, LOS 1.f)","explhtml":"<p>2019 sales forecast = 20.1 + 0.001 × 8,000 + 1,000.6 × 0.05 + 0.1 × 97 − 3.2 × 60,000 − 40.3 × 0.055 = –$191,914 (Module 1.2, LOS 1.f)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>Austin Clark, CFA, has been asked to analyze White Goods Corporation, a $9 billion company that owns a nationwide chain of stores selling appliances and other electronic goods. As part of his analysis of the White Goods Corporation, Clark&#x27;s supervisor, David Horvath, asks Clark to forecast White Goods&#x27;s 2019 sales using multiple regression analysis. The following model was developed:<\/p><div class=\"tbl\"><table><tr><td>+ 0.001<\/td><td>+ 1,000.6<\/td><td>+ 0.1<\/td><td>− 3.2<\/td><td>− 40.3<\/td><td><\/td><\/tr><tr><td>sales<\/td><td>= 20.1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>GDP<\/td><td>TR<\/td><td>CC<\/td><td>PC<\/td><td>UR<\/td><td><\/td><\/tr><tr><td>VIF<\/td><td>(5.2)<\/td><td>(3.1)<\/td><td>(5.3)<\/td><td>(1.9)<\/td><td>(4.7)<\/td><\/tr><tr><td>Number of observations:<\/td><td>76<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Standard error estimate:<\/td><td>15.67<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><sup>2<\/sup><\/td><td>0.96<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Unadjusted R:<\/p><p>Regression sum of 412,522 squares:<\/p><div class=\"tbl\"><table><tr><td>Error sum of squares:<\/td><td>17,188<\/td><\/tr><\/table><\/div><p>Independent Variable Descriptions<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= gross domestic product<\/td><\/tr><tr><td>TR<\/td><td>= average rate on 5-year U.S. Treasury securities<\/td><\/tr><tr><td>CC<\/td><td>= most recent quarter end consumer confidence index value<\/td><\/tr><tr><td>PC<\/td><td>= previous year&#x27;s sales of personal computers<\/td><\/tr><tr><td>UR<\/td><td>= most recent quarter end unemployment rate<\/td><\/tr><\/table><\/div><p>Variable Estimates for 2019<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= 8,000<\/td><\/tr><tr><td>TR<\/td><td>= 0.05<\/td><\/tr><tr><td>CC<\/td><td>= 97<\/td><\/tr><tr><td>PC<\/td><td>= 60,000<\/td><\/tr><tr><td>UR<\/td><td>= 0.055<\/td><\/tr><\/table><\/div><p>Dave Carington was recently hired by the same investment firm as a quantitative analyst. During Horvath&#x27;s meeting with Carington, the two discussed the application of big data and machine learning to investing. Carington makes the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>One has to be careful to avoid overfitting in these models. Overfitting occurs when the noise in the data is perceived as relationships.<\/td><\/tr><tr><td>Comment 2:<\/td><td>To reduce the risk of type II error, choose a model with a high recall.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using his multiple linear regression, Clark&#x27;s sales forecast for 2019 is closest to:<\/p><\/div>","subj":"quant"},{"n":46,"q":"Based on the information provided, which of the following concerns about the model would be most appropriate?","opts":["Low explanatory power.","Type II error.","Type I error."],"ans":"B","expl":"2 Unadjusted R is very high at 96% so the model explanatory power is not low. VIFs for variables GDP and CC are greater than 5 indicating that multicollinearity may be a problem. GDP and consumer confidence would also be reasonably expected to be highly correlated (in addition to the correlation to other variables included). Multicollinearity would result in Type II error. Type II errors may also be caused by negative serial correlation, but we don't have any supporting evidence for that. Type I errors can be caused by positive serial correlation as well as with conditional heteroskedasticity. Again, there is no evidence presented for that.\n(Module 1.3, LOS 1.j)","explhtml":"<p><sup>2<\/sup> Unadjusted R is very high at 96% so the model explanatory power is not low. VIFs for variables GDP and CC are greater than 5 indicating that multicollinearity may be a problem. GDP and consumer confidence would also be reasonably expected to be highly correlated (in addition to the correlation to other variables included). Multicollinearity would result in Type II error. Type II errors may also be caused by negative serial correlation, but we don&#x27;t have any supporting evidence for that. Type I errors can be caused by positive serial correlation as well as with conditional heteroskedasticity. Again, there is no evidence presented for that.<\/p><p>(Module 1.3, LOS 1.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Austin Clark, CFA, has been asked to analyze White Goods Corporation, a $9 billion company that owns a nationwide chain of stores selling appliances and other electronic goods. As part of his analysis of the White Goods Corporation, Clark&#x27;s supervisor, David Horvath, asks Clark to forecast White Goods&#x27;s 2019 sales using multiple regression analysis. The following model was developed:<\/p><div class=\"tbl\"><table><tr><td>+ 0.001<\/td><td>+ 1,000.6<\/td><td>+ 0.1<\/td><td>− 3.2<\/td><td>− 40.3<\/td><td><\/td><\/tr><tr><td>sales<\/td><td>= 20.1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>GDP<\/td><td>TR<\/td><td>CC<\/td><td>PC<\/td><td>UR<\/td><td><\/td><\/tr><tr><td>VIF<\/td><td>(5.2)<\/td><td>(3.1)<\/td><td>(5.3)<\/td><td>(1.9)<\/td><td>(4.7)<\/td><\/tr><tr><td>Number of observations:<\/td><td>76<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Standard error estimate:<\/td><td>15.67<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><sup>2<\/sup><\/td><td>0.96<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Unadjusted R:<\/p><p>Regression sum of 412,522 squares:<\/p><div class=\"tbl\"><table><tr><td>Error sum of squares:<\/td><td>17,188<\/td><\/tr><\/table><\/div><p>Independent Variable Descriptions<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= gross domestic product<\/td><\/tr><tr><td>TR<\/td><td>= average rate on 5-year U.S. Treasury securities<\/td><\/tr><tr><td>CC<\/td><td>= most recent quarter end consumer confidence index value<\/td><\/tr><tr><td>PC<\/td><td>= previous year&#x27;s sales of personal computers<\/td><\/tr><tr><td>UR<\/td><td>= most recent quarter end unemployment rate<\/td><\/tr><\/table><\/div><p>Variable Estimates for 2019<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= 8,000<\/td><\/tr><tr><td>TR<\/td><td>= 0.05<\/td><\/tr><tr><td>CC<\/td><td>= 97<\/td><\/tr><tr><td>PC<\/td><td>= 60,000<\/td><\/tr><tr><td>UR<\/td><td>= 0.055<\/td><\/tr><\/table><\/div><p>Dave Carington was recently hired by the same investment firm as a quantitative analyst. During Horvath&#x27;s meeting with Carington, the two discussed the application of big data and machine learning to investing. Carington makes the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>One has to be careful to avoid overfitting in these models. Overfitting occurs when the noise in the data is perceived as relationships.<\/td><\/tr><tr><td>Comment 2:<\/td><td>To reduce the risk of type II error, choose a model with a high recall.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on the information provided, which of the following concerns about the model would be most appropriate?<\/p><\/div>","subj":"quant"},{"n":47,"q":"Regarding Carington's comments:","opts":["both comments are accurate.","neither comments are accurate.","only one comment is accurate."],"ans":"A","expl":"Comment 1 is correct. Overfitting means training a model to such a degree that noise or randomness is mistaken for patterns and relationships. Comment 2 is also correct. High precision is important when the cost of a Type I error is large, while high recall is needed when the cost of a Type II error is large.\n(Module 4.3, LOS 4.c)","explhtml":"<p>Comment 1 is correct. Overfitting means training a model to such a degree that noise or randomness is mistaken for patterns and relationships. Comment 2 is also correct. High precision is important when the cost of a Type I error is large, while high recall is needed when the cost of a Type II error is large.<\/p><p>(Module 4.3, LOS 4.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 45–48 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Austin Clark, CFA, has been asked to analyze White Goods Corporation, a $9 billion company that owns a nationwide chain of stores selling appliances and other electronic goods. As part of his analysis of the White Goods Corporation, Clark&#x27;s supervisor, David Horvath, asks Clark to forecast White Goods&#x27;s 2019 sales using multiple regression analysis. The following model was developed:<\/p><div class=\"tbl\"><table><tr><td>+ 0.001<\/td><td>+ 1,000.6<\/td><td>+ 0.1<\/td><td>− 3.2<\/td><td>− 40.3<\/td><td><\/td><\/tr><tr><td>sales<\/td><td>= 20.1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>GDP<\/td><td>TR<\/td><td>CC<\/td><td>PC<\/td><td>UR<\/td><td><\/td><\/tr><tr><td>VIF<\/td><td>(5.2)<\/td><td>(3.1)<\/td><td>(5.3)<\/td><td>(1.9)<\/td><td>(4.7)<\/td><\/tr><tr><td>Number of observations:<\/td><td>76<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Standard error estimate:<\/td><td>15.67<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><sup>2<\/sup><\/td><td>0.96<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Unadjusted R:<\/p><p>Regression sum of 412,522 squares:<\/p><div class=\"tbl\"><table><tr><td>Error sum of squares:<\/td><td>17,188<\/td><\/tr><\/table><\/div><p>Independent Variable Descriptions<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= gross domestic product<\/td><\/tr><tr><td>TR<\/td><td>= average rate on 5-year U.S. Treasury securities<\/td><\/tr><tr><td>CC<\/td><td>= most recent quarter end consumer confidence index value<\/td><\/tr><tr><td>PC<\/td><td>= previous year&#x27;s sales of personal computers<\/td><\/tr><tr><td>UR<\/td><td>= most recent quarter end unemployment rate<\/td><\/tr><\/table><\/div><p>Variable Estimates for 2019<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= 8,000<\/td><\/tr><tr><td>TR<\/td><td>= 0.05<\/td><\/tr><tr><td>CC<\/td><td>= 97<\/td><\/tr><tr><td>PC<\/td><td>= 60,000<\/td><\/tr><tr><td>UR<\/td><td>= 0.055<\/td><\/tr><\/table><\/div><p>Dave Carington was recently hired by the same investment firm as a quantitative analyst. During Horvath&#x27;s meeting with Carington, the two discussed the application of big data and machine learning to investing. Carington makes the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>One has to be careful to avoid overfitting in these models. Overfitting occurs when the noise in the data is perceived as relationships.<\/td><\/tr><tr><td>Comment 2:<\/td><td>To reduce the risk of type II error, choose a model with a high recall.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Carington&#x27;s comments:<\/p><\/div>","subj":"quant"},{"n":48,"q":"What is the F-value that tests the hypothesis that all of the coefficients are equal to zero?","opts":["42.0.","101.0.","336.0."],"ans":"C","expl":"The F-value is calculated as (mean regression sum of squares) / (mean squared error) = (412,522 / 5) / (17,188 / 70) = 336. (Module 1.2, LOS 1.e)","expl UR<\/td><td>= most recent quarter end unemployment rate<\/td><\/tr><\/table><\/div><p>Variable Estimates for 2019<\/p><div class=\"tbl\"><table><tr><td>GDP<\/td><td>= 8,000<\/td><\/tr><tr><td>TR<\/td><td>= 0.05<\/td><\/tr><tr><td>CC<\/td><td>= 97<\/td><\/tr><tr><td>PC<\/td><td>= 60,000<\/td><\/tr><tr><td>UR<\/td><td>= 0.055<\/td><\/tr><\/table><\/div><p>Dave Carington was recently hired by the same investment firm as a quantitative analyst. During Horvath&#x27;s meeting with Carington, the two discussed the application of big data and machine learning to investing. Carington makes the following comments:<\/p><div class=\"tbl\"><table><tr><td>Comment 1:<\/td><td>One has to be careful to avoid overfitting in these models. Overfitting occurs when the noise in the data is perceived as relationships.<\/td><\/tr><tr><td>Comment 2:<\/td><td>To reduce the risk of type II error, choose a model with a high recall.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>What is the F-value that tests the hypothesis that all of the coefficients are equal to zero?<\/p><\/div>","subj":"quant"},{"n":49,"q":"The amount of goodwill Best should report in its consolidated balance sheet immediately after the acquisition of Gremlin is closest to:","opts":["$250 million under the partial goodwill method.","$350 million under the pooling method.","$400 million under the full goodwill method."],"ans":"C","expl":"Full goodwill method (in millions) (= 900 purchase price / 60%\nFair value of Gremlin | $1,500 ownership interest)\nLess: Fair value of Gremlin's identifiable 1,100 | (= 700CA + 950 NCA −250 CL −\nnet assets | 300LTD)\nGoodwill | $400\nPartial goodwill method (in millions)\nPurchase price | $900\nLess: Pro rata share of Gremlin's 660 | (= 700 CA + 950 NCA − 250 CL −\nidentifiable net assets at FV | 300 LTD) × 60%\nGoodwill | $240\nGoodwill is not created under the pooling method. (Module 8.7, LOS 8.b)","explhtml":"<p>Full goodwill method (in millions) <sup>(= 900 purchase price / 60%<\/sup><\/p><div class=\"tbl\"><table><tr><td>Fair value of Gremlin<\/td><td>$1,500 ownership interest)<\/td><\/tr><tr><td>Less: Fair value of Gremlin&#x27;s identifiable 1,100<\/td><td><sup>(= 700CA + 950 NCA −250 CL −<\/sup><\/td><\/tr><tr><td>net assets<\/td><td>300LTD)<\/td><\/tr><tr><td>Goodwill<\/td><td>$400<\/td><\/tr><\/table><\/div><p>Partial goodwill method (in millions)<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>$900<\/td><\/tr><tr><td>Less: Pro rata share of Gremlin&#x27;s 660<\/td><td><sup>(= 700 CA + 950 NCA − 250 CL −<\/sup><\/td><\/tr><tr><td>identifiable net assets at FV<\/td><td>300 LTD) × 60%<\/td><\/tr><tr><td>Goodwill<\/td><td>$240<\/td><\/tr><\/table><\/div><p>Goodwill is not created under the pooling method. (Module 8.7, LOS 8.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Best Tools, Inc., supplies automotive accessories to several major auto manufacturers in North America and Europe. On January 1, 2020, Best purchased a 60% controlling interest in Gremlin Corporation for $900 million. Best paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Best&#x27;s and Gremlin&#x27;s preacquisition balance sheet data. Exhibit 1: Preacquisition Balance Sheet Data<\/p><div class=\"tbl\"><table><tr><td>In Millions<\/td><td>Best<\/td><td>Gremlin<\/td><td><\/td><td><\/td><\/tr><tr><td>Book Value<\/td><td>Fair Value<\/td><td>Book Value<\/td><td>Fair Value<\/td><td><\/td><\/tr><tr><td>Current assets<\/td><td>$ 9,000<\/td><td>$ 9,000<\/td><td>$ 500<\/td><td>$ 700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>$ 7,500<\/td><td>$ 7,800<\/td><td>$ 900<\/td><td>$ 950<\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$ 3,000<\/td><td>$ 3,000<\/td><td>$ 250<\/td><td>$ 250<\/td><\/tr><tr><td>Long-term debt<\/td><td>$ 7,700<\/td><td>$ 7,500<\/td><td>$ 400<\/td><td>$ 300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>$ 5,800<\/td><td>$ 750<\/td><td><\/td><td><\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Best&#x27;s financial statement footnotes. Exhibit 2: Selected Footnote Information (Amounts in $ Millions) At the end of 2020, the carrying value of Best&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin* was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350*. The recoverable amount was estimated at $1,430*.<\/p><p>* for pro rata share Outside of United States, Best operates in two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3. Exhibit 3: Selected Financial Information by Segment<\/p><div class=\"tbl\"><table><tr><td>in millionsEBIT<\/td><td>Revenue<\/td><td>Total CapEx<\/td><td>Total Assets<\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>$7,203<\/td><td>$50,463<\/td><td>$4,452<\/td><td>$36,642<\/td><\/tr><tr><td>Mexico<\/td><td>$787<\/td><td>$9,766<\/td><td>$8,269<\/td><td>$14,250<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The amount of goodwill Best should report in its consolidated balance sheet immediately after the acquisition of Gremlin is closest to:<\/p><\/div>","subj":"fsa"},{"n":50,"q":"According to U.S. GAAP, Best's long-term debt-to-equity ratio, calculated immediately after the acquisition, is closest to:","opts":["1.07.","1.10.","1.12."],"ans":"B","expl":"Best's post-acquisition LTD is $8,000 million [= 7,700 million BV of Best + 300 million fair value (FV) of Gremlin debt]. Best's post-acquisition equity is equal to $7,300 million (= 5,800 million Best pre-acquisition equity + 900 million FV of shares used to acquire Gremlin + 600 million noncontrolling interest). Under U.S. GAAP, the noncontrolling interest is based on the full goodwill method (= 1,500 million FV of Gremlin × 40% noncontrolling interest). Thus, the long-term debt-to-equity ratio is 1.10 (= 8,000 million LTD / 7,300 million equity).\n(Module 8.7, LOS 8.c)","explhtml":"<p>Best&#x27;s post-acquisition LTD is $8,000 million [= 7,700 million BV of Best + 300 million fair value (FV) of Gremlin debt]. Best&#x27;s post-acquisition equity is equal to $7,300 million (= 5,800 million Best pre-acquisition equity + 900 million FV of shares used to acquire Gremlin + 600 million noncontrolling interest). Under U.S. GAAP, the noncontrolling interest is based on the full goodwill method (= 1,500 million FV of Gremlin × 40% noncontrolling interest). Thus, the long-term debt-to-equity ratio is 1.10 (= 8,000 million LTD / 7,300 million equity).<\/p><p>(Module 8.7, LOS 8.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Best Tools, Inc., supplies automotive accessories to several major auto manufacturers in North America and Europe. On January 1, 2020, Best purchased a 60% controlling interest in Gremlin Corporation for $900 million. Best paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Best&#x27;s and Gremlin&#x27;s preacquisition balance sheet data. Exhibit 1: Preacquisition Balance Sheet Data<\/p><div class=\"tbl\"><table><tr><td>In Millions<\/td><td>Best<\/td><td>Gremlin<\/td><td><\/td><td><\/td><\/tr><tr><td>Book Value<\/td><td>Fair Value<\/td><td>Book Value<\/td><td>Fair Value<\/td><td><\/td><\/tr><tr><td>Current assets<\/td><td>$ 9,000<\/td><td>$ 9,000<\/td><td>$ 500<\/td><td>$ 700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>$ 7,500<\/td><td>$ 7,800<\/td><td>$ 900<\/td><td>$ 950<\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Curren
