dex that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p>Exhibit 1: Swiss Interest Rates<\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50%<\/td><td>0.9996<\/td><\/tr><tr><td>60<\/td><td>0.54%<\/td><td>0.9991<\/td><\/tr><tr><td>90<\/td><td>0.48%<\/td><td>0.9988<\/td><\/tr><tr><td>120<\/td><td>0.65%<\/td><td>0.9978<\/td><\/tr><tr><td>180<\/td><td>0.77%<\/td><td>0.9962<\/td><\/tr><tr><td>210<\/td><td>0.67%<\/td><td>0.9961<\/td><\/tr><tr><td>300<\/td><td>0.82%<\/td><td>0.9932<\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sixty days after inception, the value of the currency swap to Witkowski&#x27;s client is closest to:<\/p><\/div>","subj":"derivatives"},{"n":77,"q":"Based on the information in Exhibit 1, the ex-ante active return for the Premier fund is closest to:","opts":["0.63%.","1.05%.","2.92%."],"ans":"A","expl":"E(RA) = ΣwP,jE(RP,j) − ΣwB,jE(RB,j) = 11.07% − 10.44% = 0.63% (Module 40.1, LOS 40.a)","explhtml":"<p>E(RA) = ΣwP,jE(RP,j) − ΣwB,jE(RB,j) = 11.07% − 10.44% = 0.63% (Module 40.1, LOS 40.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p>Exhibit 1: Premier Fund Characteristics<\/p><div class=\"tbl\"><table><tr><td>Security (i)<\/td><td><sup>Portfolio Weight (w<\/sup>Pi<sup>)<\/sup><\/td><td><sup>Benchmark Weight (w<\/sup>Bi<sup>)<\/sup><\/td><td><sup>Return E(R<\/sup>i<sup>)<\/sup><\/td><\/tr><tr><td>X<\/td><td>35%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>Y<\/td><td>20%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or leverage.&quot;<\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active weights.&quot;<\/td><\/tr><\/table><\/div><p>Ogle then considers the Dena and Orient funds. Exhibit 2 shows selected data for the two funds.<\/p><p>Exhibit 2: Selected Information for Dena and Orient Funds<\/p><div class=\"tbl\"><table><tr><td>Dena<\/td><td>Orient<\/td><td><\/td><\/tr><tr><td>Information coefficient<\/td><td>0.20<\/td><td>0.25<\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.99<\/td><td>0.80<\/td><\/tr><tr><td>Independent bets/year<\/td><td>12<\/td><td>X<\/td><\/tr><\/table><\/div><p>Segovia also considers three funds that specialize in market timing. Information about the funds is given in Exhibit 3.<\/p><p>Exhibit 3: Selected Fund Data<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>Frequency of bets per year<\/td><td>12<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Number of independent stocks followed<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Probability of correct call<\/td><td>0.52<\/td><td>0.58<\/td><td>0.59<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 1, the ex-ante active return for the Premier fund is closest to:<\/p><\/div>","subj":"portfolio"},{"n":78,"q":"Regarding Ogle's Statements 1 and 2:","opts":["both statements are incorrect.","one statement is correct and one is incorrect.","both statements are correct."],"ans":"C","expl":"Both statements are correct. Information ratio, unlike the Sharpe ratio, is affected by an allocation to cash or by the use of leverage. For an unconstrained optimization, a change in aggressiveness in active weights changes both the active return and active risk proportionally, leaving the information ratio unchanged.\n(Module 40.2, LOS 40.b)","explhtml":"<p>Both statements are correct. Information ratio, unlike the Sharpe ratio, is affected by an allocation to cash or by the use of leverage. For an unconstrained optimization, a change in aggressiveness in active weights changes both the active return and active risk proportionally, leaving the information ratio unchanged.<\/p><p>(Module 40.2, LOS 40.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p>Exhibit 1: Premier Fund Characteristics<\/p><div class=\"tbl\"><table><tr><td>Security (i)<\/td><td><sup>Portfolio Weight (w<\/sup>Pi<sup>)<\/sup><\/td><td><sup>Benchmark Weight (w<\/sup>Bi<sup>)<\/sup><\/td><td><sup>Return E(R<\/sup>i<sup>)<\/sup><\/td><\/tr><tr><td>X<\/td><td>35%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>Y<\/td><td>20%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or leverage.&quot;<\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active weights.&quot;<\/td><\/tr><\/table><\/div><p>Ogle then considers the Dena and Orient funds. Exhibit 2 shows selected data for the two funds.<\/p><p>Exhibit 2: Selected Information for Dena and Orient Funds<\/p><div class=\"tbl\"><table><tr><td>Dena<\/td><td>Orient<\/td><td><\/td><\/tr><tr><td>Information coefficient<\/td><td>0.20<\/td><td>0.25<\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.99<\/td><td>0.80<\/td><\/tr><tr><td>Independent bets/year<\/td><td>12<\/td><td>X<\/td><\/tr><\/table><\/div><p>Segovia also considers three funds that specialize in market timing. Information about the funds is given in Exhibit 3.<\/p><p>Exhibit 3: Selected Fund Data<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>Frequency of bets per year<\/td><td>12<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Number of independent stocks followed<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Probability of correct call<\/td><td>0.52<\/td><td>0.58<\/td><td>0.59<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Ogle&#x27;s Statements 1 and 2:<\/p><\/div>","subj":"portfolio"},{"n":79,"q":"Assuming that Dena Fund and Orient Fund both have the same information ratio, the value of \"X\" in Exhibit 2 must be closest to:","opts":["10.","12.","16."],"ans":"B","expl":"IR(Dena) = IR(Orient) (0.2) × (0.99) × √12 = (0.25) × (0.80) × √X √X = 3.429; X = 11.76 (Module 40.3, LOS 40.c)","explhtml":"<p>IR(Dena) = IR(Orient) (0.2) × (0.99) × √12 = (0.25) × (0.80) × √X √X = 3.429; X = 11.76 (Module 40.3, LOS 40.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p>Exhibit 1: Premier Fund Characteristics<\/p><div class=\"tbl\"><table><tr><td>Security (i)<\/td><td><sup>Portfolio Weight (w<\/sup>Pi<sup>)<\/sup><\/td><td><sup>Benchmark Weight (w<\/sup>Bi<sup>)<\/sup><\/td><td><sup>Return E(R<\/sup>i<sup>)<\/sup><\/td><\/tr><tr><td>X<\/td><td>35%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>Y<\/td><td>20%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or leverage.&quot;<\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active weights.&quot;<\/td><\/tr><\/table><\/div><p>Ogle then considers the Dena and Orient funds. Exhibit 2 shows selected data for the two funds.<\/p><p>Exhibit 2: Selected Information for Dena and Orient Funds<\/p><div class=\"tbl\"><table><tr><td>Dena<\/td><td>Orient<\/td><td><\/td><\/tr><tr><td>Information coefficient<\/td><td>0.20<\/td><td>0.25<\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.99<\/td><td>0.80<\/td><\/tr><tr><td>Independent bets/year<\/td><td>12<\/td><td>X<\/td><\/tr><\/table><\/div><p>Segovia also considers three funds that specialize in market timing. Information about the funds is given in Exhibit 3.<\/p><p>Exhibit 3: Selected Fund Data<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>Frequency of bets per year<\/td><td>12<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Number of independent stocks followed<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Probability of correct call<\/td><td>0.52<\/td><td>0.58<\/td><td>0.59<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming that Dena Fund and Orient Fund both have the same information ratio, the value of &quot;X&quot; in Exhibit 2 must be closest to:<\/p><\/div>","subj":"portfolio"},{"n":80,"q":"Based on the information in Exhibit 3, an investor that wishes to construct a portfolio with an active risk of 4% would most appropriately choose to combine the benchmark with:","opts":["fund A.","fund B.","fund C."],"ans":"B","expl":"IC = 2(% correct) − 1 ICA = 2(0.52) − 1 = 0.04 ICB = 2(0.58) − 1 = 0.16 ICC = 2(0.59) − 1 = 0.18 IR = IC√BR IRA= 0.04√12 × 2 = 0.20 IRB= 0.16√4 × 3 = 0.55 IRC= 0.18√2 × 2 = 0.36 Any investor should always choose the fund with the highest information ratio. The amount of active risk can then be adjusted by changing the allocation of portfolio to the benchmark versus the active fund.\n(Module 40.4, LOS 40.e)","explhtml":"<p>IC = 2(% correct) − 1 ICA = 2(0.52) − 1 = 0.04 ICB = 2(0.58) − 1 = 0.16 ICC = 2(0.59) − 1 = 0.18 IR = IC√BR IRA= 0.04√12 × 2 = 0.20 IRB= 0.16√4 × 3 = 0.55 IRC= 0.18√2 × 2 = 0.36 Any investor should always choose the fund with the highest information ratio. The amount of active risk can then be adjusted by changing the allocation of portfolio to the benchmark versus the active fund.<\/p><p>(Module 40.4, LOS 40.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 77–80 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tamara Ogle, CFA, and Isaac Segovia, CAIA, are portfolio managers for Lucas Investment Management (Lucas). Ogle and Segovia both manage large institutional investment portfolios and are working together to research portfolio optimization strategies. Ogle mentions the Premier fund. Exhibit 1 shows the Premier fund&#x27;s exposures and expected return, as well as benchmark specifications.<\/p><p>Exhibit 1: Premier Fund Characteristics<\/p><div class=\"tbl\"><table><tr><td>Security (i)<\/td><td><sup>Portfolio Weight (w<\/sup>Pi<sup>)<\/sup><\/td><td><sup>Benchmark Weight (w<\/sup>Bi<sup>)<\/sup><\/td><td><sup>Return E(R<\/sup>i<sup>)<\/sup><\/td><\/tr><tr><td>X<\/td><td>35%<\/td><td>40%<\/td><td>11.20%<\/td><\/tr><tr><td>Y<\/td><td>20%<\/td><td>25%<\/td><td>4.25%<\/td><\/tr><tr><td>Z<\/td><td>45%<\/td><td>35%<\/td><td>14.00%<\/td><\/tr><tr><td>Total<\/td><td>100%<\/td><td>100%<\/td><td><\/td><\/tr><\/table><\/div><p>Ogle states that the information ratio for a manager is a good indicator of relative performance. Ogle also makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>&quot;Unlike the Sharpe ratio, the information ratio can be affected by the addition of cash or leverage.&quot;<\/td><\/tr><tr><td>Statement 2: <\/td><td>&quot;The information ratio of an unconstrained portfolio is unaffected by aggressiveness of the active weights.&quot;<\/td><\/tr><\/table><\/div><p>Ogle then considers the Dena and Orient funds. Exhibit 2 shows selected data for the two funds.<\/p><p>Exhibit 2: Selected Information for Dena and Orient Funds<\/p><div class=\"tbl\"><table><tr><td>Dena<\/td><td>Orient<\/td><td><\/td><\/tr><tr><td>Information coefficient<\/td><td>0.20<\/td><td>0.25<\/td><\/tr><tr><td>Transfer coefficient<\/td><td>0.99<\/td><td>0.80<\/td><\/tr><tr><td>Independent bets/year<\/td><td>12<\/td><td>X<\/td><\/tr><\/table><\/div><p>Segovia also considers three funds that specialize in market timing. Information about the funds is given in Exhibit 3.<\/p><p>Exhibit 3: Selected Fund Data<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>Frequency of bets per year<\/td><td>12<\/td><td>4<\/td><td>2<\/td><\/tr><tr><td>Number of independent stocks followed<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>Probability of correct call<\/td><td>0.52<\/td><td>0.58<\/td><td>0.59<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on the information in Exhibit 3, an investor that wishes to construct a portfolio with an active risk of 4% would most appropriately choose to combine the benchmark with:<\/p><\/div>","subj":"portfolio"},{"n":81,"q":"Chester's new compensation plan for awarding bonuses to individual portfolio managers is consistent with CFA Institute Standards:","opts":["and does not require disclosure.","only if fully disclosed to clients.","but any bonuses awarded under the plan must be fully disclosed to clients."],"ans":"B","expl":"Standard VI(A). The compensation plan is acceptable under Standard VI(A) Conflicts of Interest – Disclosure of Conflicts, but Chester must disclose the plan to clients. The firm's equity strategy is described as \"large cap core.\" The S&P 500 Index is an appropriate benchmark for such a strategy, but the incentive for portfolio managers is to invest outside the index in order to achieve excess returns. Managers may be motivated to invest in securities that would not be consistent with client objectives or risk profiles.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard VI(A). The compensation plan is acceptable under Standard VI(A) Conflicts of Interest – Disclosure of Conflicts, but Chester must disclose the plan to clients. The firm&#x27;s equity strategy is described as &quot;large cap core.&quot; The S&amp;P 500 Index is an appropriate benchmark for such a strategy, but the incentive for portfolio managers is to invest outside the index in order to achieve excess returns. Managers may be motivated to invest in securities that would not be consistent with client objectives or risk profiles.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out-performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. Pierce soon accepted a position at a competing firm, Cheeri Group.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Chester&#x27;s new compensation plan for awarding bonuses to individual portfolio managers is consistent with CFA Institute Standards:<\/p><\/div>","subj":"ethics"},{"n":82,"q":"Assuming Rogers would like to accept the offer to serve on the Grumpp investment advisory committee, Rogers's obligations under the CFA Institute Standards require that he:","opts":["refuse to serve on the Grumpp committee.","accept the Grumpp committee position only after disclosing the offer to his supervisor.","accept the Grumpp committee position and disclose his acceptance as soon as possible to his supervisor."],"ans":"B","expl":"Standard VI(A). Rogers must discuss the offer with supervisory personnel at Chester before accepting the offer. His employer then has the opportunity to evaluate the effect of the offer on Rogers's ability to continue to perform his duties for Chester. The foundation is very large, and the position appears likely to consume much of Rogers's time and effort. If compensation is involved, Rogers would have to decline the offer unless Chester consented to the arrangement.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard VI(A). Rogers must discuss the offer with supervisory personnel at Chester before accepting the offer. His employer then has the opportunity to evaluate the effect of the offer on Rogers&#x27;s ability to continue to perform his duties for Chester. The foundation is very large, and the position appears likely to consume much of Rogers&#x27;s time and effort. If compensation is involved, Rogers would have to decline the offer unless Chester consented to the arrangement.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out-performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. Pierce soon accepted a position at a competing firm, Cheeri Group.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Assuming Rogers would like to accept the offer to serve on the Grumpp investment advisory committee, Rogers&#x27;s obligations under the CFA Institute Standards require that he:<\/p><\/div>","subj":"ethics"},{"n":83,"q":"Chester's advertising campaign includes claims about Rogers's investment performance, as well as Rogers's use and reference to the CFA charter. Is Chester's advertising campaign consistent with the CFA Institute Standards?","opts":["Chester’s performance claims are inconsistent with CFA Institute Standards, but his use and reference to the CFA designation is appropriate.","Both the performance claim and the reference to the CFA charter are violations.","Neither the performance claims nor the use and reference to the CFA designation are violations."],"ans":"A","expl":"Standard III(D). Chester has violated Standard III(D) Duties to Clients – Performance Presentation. The claim in itself is acceptable. Rogers's superior performance has lasted only a short time, and the advertising does not suggest otherwise. However, the superior performance has been achieved by investing in small cap securities, which is inconsistent with the stated style of Chester's equity management. Unless Chester discloses this change in style, the performance claims do not accurately reflect the firm's performance. Chester has not violated the Standards regarding use of and reference to the CFA designation. Rogers's use of the CFA designation is acceptable, and the quote stating that a CFA charterholder is committed to high ethical standards is acceptable as well.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard III(D). Chester has violated Standard III(D) Duties to Clients – Performance Presentation. The claim in itself is acceptable. Rogers&#x27;s superior performance has lasted only a short time, and the advertising does not suggest otherwise. However, the superior performance has been achieved by investing in small cap securities, which is inconsistent with the stated style of Chester&#x27;s equity management. Unless Chester discloses this change in style, the performance claims do not accurately reflect the firm&#x27;s performance. Chester has not violated the Standards regarding use of and reference to the CFA designation. Rogers&#x27;s use of the CFA designation is acceptable, and the quote stating that a CFA charterholder is committed to high ethical standards is acceptable as well.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out-performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. Pierce soon accepted a position at a competing firm, Cheeri Group.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Chester&#x27;s advertising campaign includes claims about Rogers&#x27;s investment performance, as well as Rogers&#x27;s use and reference to the CFA charter. Is Chester&#x27;s advertising campaign consistent with the CFA Institute Standards?<\/p><\/div>","subj":"ethics"},{"n":84,"q":"Cheeri's presentation of Pierce's investment performance is inconsistent with CFA Institute Standards because:","opts":["the results were not calculated under GIPS.","performance from a previous employer should not be included.","the results misrepresent Pierce’s large cap performance."],"ans":"C","expl":"Standard III (D). The problem is that Pierce's performance over the past three quarters arose from large cap securities, not small cap securities. Excluding these results misrepresents her ability as a large cap manager. The Standards do not require compliance with GIPS, nor do they require that previous employer results be excluded. Stating results of a specific style, such as large cap, is acceptable if it is accurate.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard III (D). The problem is that Pierce&#x27;s performance over the past three quarters arose from large cap securities, not small cap securities. Excluding these results misrepresents her ability as a large cap manager. The Standards do not require compliance with GIPS, nor do they require that previous employer results be excluded. Stating results of a specific style, such as large cap, is acceptable if it is accurate.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 81–84 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Chester Brothers, LLC, is an investment management firm with $200 million in assets under management. Chester&#x27;s equity style is described to clients as a large-cap core strategy. One year ago, Chester instituted a new compensation plan for its equity portfolio managers. Under this new plan, each portfolio manager receives an annual bonus based upon that manager&#x27;s quarterly performance relative to the S&amp;P 500 Index. For each quarter of out-performance, the manager receives a bonus in the amount of 20% of his regular annual compensation. Chester has not disclosed this new plan to clients. Portfolio managers at Chester are not bound by non-compete agreements.<\/p><p>James Rogers, CFA, and Karen Pierce, CFA, are both portfolio managers affected by the new policy. Rogers out-performed the S&amp;P 500 Index in each of the last three quarters, largely because he began investing his clients&#x27; funds in small-cap securities. Chester has recently been citing Rogers&#x27;s performance in local media advertising, including claims that &quot;Chester&#x27;s star manager, James Rogers, has outperformed the S&amp;P 500 Index in each of the last three quarters.&quot; The print advertising associated with the media campaign includes a photograph of Rogers, identifying him as James Rogers, CFA. Below his name is a quote apparently attributable to Rogers saying &quot;as a CFA charterholder, I am committed to the highest ethical standards.&quot;<\/p><p>A few weeks after the advertising campaign began, Rogers was approached by the Grumpp Foundation, a local charitable endowment with $3 billion in assets, about serving on its investment advisory committee. The committee meets weekly to review the portfolio and make adjustments as needed. The Grumpp trustees were impressed by the favorable mention of Rogers in the marketing campaign. In making their offer, they even suggested that Rogers could mention his position on the advisory committee in future Chester marketing material. Rogers has not informed Chester about the Grumpp offer, but he has not yet accepted the position.<\/p><p>Pierce has not fared as well as Rogers. She also shifted into smaller-cap securities, but due to two extremely poor performing large-cap stocks, her performance lagged the S&amp;P 500 Index for the first three quarters. After an angry confrontation with her supervisor, Pierce resigned. Pierce soon accepted a position at a competing firm, Cheeri Group.<\/p><p>Cheeri has posted Pierce&#x27;s investment performance for the past five years on its website, excluding the three most recent quarters. The footnotes to the performance information include the following two statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1:<\/td><td>Includes large capitalization portfolios only.<\/td><\/tr><tr><td>Statement 2:<\/td><td>Results reflect manager&#x27;s performance at previous employer.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Cheeri&#x27;s presentation of Pierce&#x27;s investment performance is inconsistent with CFA Institute Standards because:<\/p><\/div>","subj":"ethics"},{"n":85,"q":"Is the use of client brokerage to make the $25,000 contribution to the Hoover Study Center of Unions a violation of the CFA Institute Standards of Professional Conduct?","opts":["Yes, because Patel must ensure that client brokerage fees are directed to the benefit of the client.","Yes, because client brokerage must only be used to pay for goods and services directly related to the investment decision-making process.","No, because the client brokerage has been spent at the specific direction of the client."],"ans":"A","expl":"In making a $25,000 contribution to the Hoover Study Center of Unions, Patel has violated Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, which states that Members and Candidates must act for the benefit of their clients and place their clients' interest before their employers' or their own interest. In relationships with clients, Members and Candidates must determine applicable fiduciary duties and must comply with such duties to the persons and interests to whom it is owed. The contribution to the Hoover Study Center of Unions, authorized by the trustees of the union, brings into question whether the union is acting for the benefit of the client. Despite providing guidance and governance for the union, trustees are not the client of the union fund; rather, the members of the union and their beneficiaries are the clients of the fund. By making a $25,000 contribution from the client brokerage, Patel and the trustees have used funds that rightly belong to the members of the union, and they have done so without direct compensation to the union members. Patel should not have authorized the pension account to make the contribution, and in doing so he has violated his duty to guard the assets of his clients as a fiduciary. Client brokerage is the property of the client, and not of the trustee or fiduciary representing the client.\n(Module 42.4, LOS 42.a)","explhtml":"<p>In making a $25,000 contribution to the Hoover Study Center of Unions, Patel has violated Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, which states that Members and Candidates must act for the benefit of their clients and place their clients&#x27; interest before their employers&#x27; or their own interest. In relationships with clients, Members and Candidates must determine applicable fiduciary duties and must comply with such duties to the persons and interests to whom it is owed. The contribution to the Hoover Study Center of Unions, authorized by the trustees of the union, brings into question whether the union is acting for the benefit of the client. Despite providing guidance and governance for the union, trustees are not the client of the union fund; rather, the members of the union and their beneficiaries are the clients of the fund. By making a $25,000 contribution from the client brokerage, Patel and the trustees have used funds that rightly belong to the members of the union, and they have done so without direct compensation to the union members. Patel should not have authorized the pension account to make the contribution, and in doing so he has violated his duty to guard the assets of his clients as a fiduciary. Client brokerage is the property of the client, and not of the trustee or fiduciary representing the client.<\/p><p>(Module 42.4, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>Darren Patel, CFA, has worked at Analytica Partners, LLC, for the past six years as a portfolio manager and has built up a book of several large clients. Patel notes that his clients have become increasingly aware of the directed client brokerage (soft dollar commissions) issue. At a recent meeting with one of his large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Patel to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. The Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Patel concurs with the trustees&#x27; goal of increasing union enrollment, and follows the client&#x27;s instructions: he makes the $25,000 contribution to the Hoover Study Center.<\/p><p>Another client, Rosa Lutz, has asked Patel to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy to update their computer lab. Patel agrees that a new computer lab for Roswell Academy is greatly needed, and he allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><p>Jessica Burns, CFA, one of Patel&#x27;s colleague at Analytica, recently quit. When she left, Burns took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Burns soon accepts a position at a competing firm, Babylon Group. On her first day at Babylon, she contacts each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Analytica to Babylon. During telephone conversations and emails with her former clients, Burns mentions that Analytica has a new compensation program that created incentives for managers to shift into mid-cap securities.<\/p><\/div><\/details><div class=\"qtext\"><p>Is the use of client brokerage to make the $25,000 contribution to the Hoover Study Center of Unions a violation of the CFA Institute Standards of Professional Conduct?<\/p><\/div>","subj":"ethics"},{"n":86,"q":"Is the use of client brokerage to make the $10,000 contribution to the Roswell Academy a violation of the CFA Institute Standards of Professional Conduct?","opts":["Yes, because client brokerage must only be used to pay for goods and services directly related to the investment decision-making process.","Yes, because client brokerage of tax-deferred accounts cannot be used to make charitable contributions.","No, because the client brokerage has been spent at the specific direction of the client."],"ans":"C","expl":"In this case, Lutz is the client and, therefore, the direct owner of the client brokerage. If Lutz's desire is to give the soft dollar client brokerage asset to the Roswell Academy, she is free to do so because it is her asset; she is sole owner of her own retirement account. Patel, by following the wishes of the client, is complying with his duty of loyalty. Thus, there is no violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, in the case of the $10,000 contribution to Roswell Academy.\n(Module 42.4, LOS 42.a)","explhtml":"<p>In this case, Lutz is the client and, therefore, the direct owner of the client brokerage. If Lutz&#x27;s desire is to give the soft dollar client brokerage asset to the Roswell Academy, she is free to do so because it is her asset; she is sole owner of her own retirement account. Patel, by following the wishes of the client, is complying with his duty of loyalty. Thus, there is no violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care, in the case of the $10,000 contribution to Roswell Academy.<\/p><p>(Module 42.4, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darren Patel, CFA, has worked at Analytica Partners, LLC, for the past six years as a portfolio manager and has built up a book of several large clients. Patel notes that his clients have become increasingly aware of the directed client brokerage (soft dollar commissions) issue. At a recent meeting with one of his large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Patel to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. The Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Patel concurs with the trustees&#x27; goal of increasing union enrollment, and follows the client&#x27;s instructions: he makes the $25,000 contribution to the Hoover Study Center.<\/p><p>Another client, Rosa Lutz, has asked Patel to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy to update their computer lab. Patel agrees that a new computer lab for Roswell Academy is greatly needed, and he allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><p>Jessica Burns, CFA, one of Patel&#x27;s colleague at Analytica, recently quit. When she left, Burns took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Burns soon accepts a position at a competing firm, Babylon Group. On her first day at Babylon, she contacts each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Analytica to Babylon. During telephone conversations and emails with her former clients, Burns mentions that Analytica has a new compensation program that created incentives for managers to shift into mid-cap securities.<\/p><\/div><\/details><div class=\"qtext\"><p>Is the use of client brokerage to make the $10,000 contribution to the Roswell Academy a violation of the CFA Institute Standards of Professional Conduct?<\/p><\/div>","subj":"ethics"},{"n":87,"q":"By taking the computer model when leaving her position at Analytica, Burns has most likely violated CFA Institute Standards:","opts":["because she should have obtained the permission from her colleague in writing.","by placing the interests of her current employer above the interests of her former employer.","unless she obtained permission from Analytica."],"ans":"C","expl":"Burns should not have taken any employer records, and the computer model was Analytica's property, regardless of her co-worker's role in developing the model. Burns has violated Standard IV(A) Duties to Employers – Loyalty by taking the model without Analytica's consent.\n(Module 42.7, LOS 42.a)","explhtml":"<p>Burns should not have taken any employer records, and the computer model was Analytica&#x27;s property, regardless of her co-worker&#x27;s role in developing the model. Burns has violated Standard IV(A) Duties to Employers – Loyalty by taking the model without Analytica&#x27;s consent.<\/p><p>(Module 42.7, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darren Patel, CFA, has worked at Analytica Partners, LLC, for the past six years as a portfolio manager and has built up a book of several large clients. Patel notes that his clients have become increasingly aware of the directed client brokerage (soft dollar commissions) issue. At a recent meeting with one of his large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Patel to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. The Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Patel concurs with the trustees&#x27; goal of increasing union enrollment, and follows the client&#x27;s instructions: he makes the $25,000 contribution to the Hoover Study Center.<\/p><p>Another client, Rosa Lutz, has asked Patel to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy to update their computer lab. Patel agrees that a new computer lab for Roswell Academy is greatly needed, and he allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><p>Jessica Burns, CFA, one of Patel&#x27;s colleague at Analytica, recently quit. When she left, Burns took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Burns soon accepts a position at a competing firm, Babylon Group. On her first day at Babylon, she contacts each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Analytica to Babylon. During telephone conversations and emails with her former clients, Burns mentions that Analytica has a new compensation program that created incentives for managers to shift into mid-cap securities.<\/p><\/div><\/details><div class=\"qtext\"><p>By taking the computer model when leaving her position at Analytica, Burns has most likely violated CFA Institute Standards:<\/p><\/div>","subj":"ethics"},{"n":88,"q":"Burns's behavior upon assuming her new position at Babylon can best be described as violating CFA Institute Standards because she:","opts":["encouraged her former clients to leave Analytica.","should not have contacted her former clients.","disclosed her former employer’s new compensation program."],"ans":"C","expl":"Burns took no client records with her from Analytica. (It is reasonable to assume that she is using publicly available information to contact her former clients.) So long as Burns did not have a non-compete agreement, the standards do not preclude her from contacting former clients or encouraging them to move their accounts. The violation in this case was disclosing the new compensation plan: this plan should be disclosed to Analytica's clients by Analytica. Burns does not have whistleblower status in this case because she stands to receive a personal gain by bringing her former clients to Babylon. By disclosing the plan, Burns has violated Standard IV(A) Duties to Employers – Loyalty by attempting to injure her former employer. Note that the compensation plan is not illegal; it is only a policy that should be disclosed. (Had there been an illegal activity, Burns might have had justification as a whistleblower.)\n(Module 42.7, LOS 42.a)","explhtml":"<p>Burns took no client records with her from Analytica. (It is reasonable to assume that she is using publicly available information to contact her former clients.) So long as Burns did not have a non-compete agreement, the standards do not preclude her from contacting former clients or encouraging them to move their accounts. The violation in this case was disclosing the new compensation plan: this plan should be disclosed to Analytica&#x27;s clients by Analytica. Burns does not have whistleblower status in this case because she stands to receive a personal gain by bringing her former clients to Babylon. By disclosing the plan, Burns has violated Standard IV(A) Duties to Employers – Loyalty by attempting to injure her former employer. Note that the compensation plan is not illegal; it is only a policy that should be disclosed. (Had there been an illegal activity, Burns might have had justification as a whistleblower.)<\/p><p>(Module 42.7, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 85–88 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darren Patel, CFA, has worked at Analytica Partners, LLC, for the past six years as a portfolio manager and has built up a book of several large clients. Patel notes that his clients have become increasingly aware of the directed client brokerage (soft dollar commissions) issue. At a recent meeting with one of his large pension clients, Service Workers Union Local No. 1418, the subject of directed commissions came up. Upon learning of the commission dollars available to their account, the Union trustees directed Patel to use their client brokerage of approximately $25,000 to donate to a think tank called the Hoover Study Center of Unions at Samford University. The Service Workers trustees believe the Hoover study will increase the public awareness of the benefits unions offer to their members and increase union membership. Patel concurs with the trustees&#x27; goal of increasing union enrollment, and follows the client&#x27;s instructions: he makes the $25,000 contribution to the Hoover Study Center.<\/p><p>Another client, Rosa Lutz, has asked Patel to credit the soft dollar client brokerage proceeds from her personal retirement accounts to Roswell Academy to update their computer lab. Patel agrees that a new computer lab for Roswell Academy is greatly needed, and he allocates $10,000 of Lutz&#x27;s commission dollars to Roswell Academy.<\/p><p>Jessica Burns, CFA, one of Patel&#x27;s colleague at Analytica, recently quit. When she left, Burns took a copy of a computer model with the permission of the co-worker who developed the model, as well as the most recent list of her buy recommendations, which was created from the output of the computer model. Burns soon accepts a position at a competing firm, Babylon Group. On her first day at Babylon, she contacts each of her five largest former clients, informing them of her new employment and asking that they consider moving their accounts from Analytica to Babylon. During telephone conversations and emails with her former clients, Burns mentions that Analytica has a new compensation program that created incentives for managers to shift into mid-cap securities.<\/p><\/div><\/details><div class=\"qtext\"><p>Burns&#x27;s behavior upon assuming her new position at Babylon can best be described as violating CFA Institute Standards because she:<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 1 (2025) — Session 2", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");

}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");

  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}
