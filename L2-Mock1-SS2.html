,"expl":"According to U.S. GAAP, goodwill is not impaired because the $1,475 million fair value of Gremlin exceeds the $1,425 million carrying value. Thus, no impairment loss is recognized under GAAP.\nUnder IFRS, no impairment loss is recognized because the $1,430 million recoverable amount exceeds the $1,425 million carrying value.\n(Module 8.2, LOS 8.b)","explhtml":"<p>According to U.S. GAAP, goodwill is not impaired because the $1,475 million fair value of Gremlin exceeds the $1,425 million carrying value. Thus, no impairment loss is recognized under GAAP.<\/p><p>Under IFRS, no impairment loss is recognized because the $1,430 million recoverable amount exceeds the $1,425 million carrying value.<\/p><p>(Module 8.2, LOS 8.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Best Tools, Inc., supplies automotive accessories to several major auto manufacturers in North America and Europe. On January 1, 2020, Best purchased a 60% controlling interest in Gremlin Corporation for $900 million. Best paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Best&#x27;s and Gremlin&#x27;s preacquisition balance sheet data. Exhibit 1: Preacquisition Balance Sheet Data<\/p><div class=\"tbl\"><table><tr><td>In Millions<\/td><td>Best<\/td><td>Gremlin<\/td><td><\/td><td><\/td><\/tr><tr><td>Book Value<\/td><td>Fair Value<\/td><td>Book Value<\/td><td>Fair Value<\/td><td><\/td><\/tr><tr><td>Current assets<\/td><td>$ 9,000<\/td><td>$ 9,000<\/td><td>$ 500<\/td><td>$ 700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>$ 7,500<\/td><td>$ 7,800<\/td><td>$ 900<\/td><td>$ 950<\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$ 3,000<\/td><td>$ 3,000<\/td><td>$ 250<\/td><td>$ 250<\/td><\/tr><tr><td>Long-term debt<\/td><td>$ 7,700<\/td><td>$ 7,500<\/td><td>$ 400<\/td><td>$ 300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>$ 5,800<\/td><td>$ 750<\/td><td><\/td><td><\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Best&#x27;s financial statement footnotes. Exhibit 2: Selected Footnote Information (Amounts in $ Millions) At the end of 2020, the carrying value of Best&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin* was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350*. The recoverable amount was estimated at $1,430*.<\/p><p>* for pro rata share Outside of United States, Best operates in two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3. Exhibit 3: Selected Financial Information by Segment<\/p><div class=\"tbl\"><table><tr><td>in millionsEBIT<\/td><td>Revenue<\/td><td>Total CapEx<\/td><td>Total Assets<\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>$7,203<\/td><td>$50,463<\/td><td>$4,452<\/td><td>$36,642<\/td><\/tr><tr><td>Mexico<\/td><td>$787<\/td><td>$9,766<\/td><td>$8,269<\/td><td>$14,250<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using only the information contained in Exhibit 2, which of the following statements is most accurate regarding Best&#x27;s consolidated income statement for the year ended 2020?<\/p><\/div>","subj":"fsa"},{"n":52,"q":"The data found in Exhibit 3 most likely indicates that Best may be over-allocating resources to:","opts":["the Europe segment.","the Mexico segment.","the Europe segment and the Mexico segment."],"ans":"B","expl":"As indicated below, the Mexico segment has the lowest EBIT margin, yet it has the highest proportional capital expenditures to proportional assets ratio. Thus, Best may be overallocating resources to the Mexico segment.\nSegment Analysis for 2020\nEBIT Margin | Total CapEx % | Total Assets % | CapEx % / Assets %\nEurope | 14.3% | 35.0% | 72.0% | 0.5\nMexico | 8.1% | 65.0% | 28.0% | 2.3\n(Module 13.2, LOS 13.b)","explhtml":"<p>As indicated below, the Mexico segment has the lowest EBIT margin, yet it has the highest proportional capital expenditures to proportional assets ratio. Thus, Best may be overallocating resources to the Mexico segment.<\/p><p>Segment Analysis for 2020<\/p><div class=\"tbl\"><table><tr><td>EBIT Margin<\/td><td>Total CapEx %<\/td><td>Total Assets %<\/td><td>CapEx % / Assets %<\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>14.3%<\/td><td>35.0%<\/td><td>72.0%<\/td><td>0.5<\/td><\/tr><tr><td>Mexico<\/td><td>8.1%<\/td><td>65.0%<\/td><td>28.0%<\/td><td>2.3<\/td><\/tr><\/table><\/div><p>(Module 13.2, LOS 13.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 49–52 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Best Tools, Inc., supplies automotive accessories to several major auto manufacturers in North America and Europe. On January 1, 2020, Best purchased a 60% controlling interest in Gremlin Corporation for $900 million. Best paid for the acquisition with shares of its common stock.<\/p><p>Exhibit 1 contains Best&#x27;s and Gremlin&#x27;s preacquisition balance sheet data. Exhibit 1: Preacquisition Balance Sheet Data<\/p><div class=\"tbl\"><table><tr><td>In Millions<\/td><td>Best<\/td><td>Gremlin<\/td><td><\/td><td><\/td><\/tr><tr><td>Book Value<\/td><td>Fair Value<\/td><td>Book Value<\/td><td>Fair Value<\/td><td><\/td><\/tr><tr><td>Current assets<\/td><td>$ 9,000<\/td><td>$ 9,000<\/td><td>$ 500<\/td><td>$ 700<\/td><\/tr><tr><td>Noncurrent assets<\/td><td>$ 7,500<\/td><td>$ 7,800<\/td><td>$ 900<\/td><td>$ 950<\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Current liabilities<\/td><td>$ 3,000<\/td><td>$ 3,000<\/td><td>$ 250<\/td><td>$ 250<\/td><\/tr><tr><td>Long-term debt<\/td><td>$ 7,700<\/td><td>$ 7,500<\/td><td>$ 400<\/td><td>$ 300<\/td><\/tr><tr><td>Stockholders&#x27; equity<\/td><td>$ 5,800<\/td><td>$ 750<\/td><td><\/td><td><\/td><\/tr><tr><td>$ 16,500<\/td><td>$ 1,400<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div><p>Exhibit 2 contains selected information from Best&#x27;s financial statement footnotes. Exhibit 2: Selected Footnote Information (Amounts in $ Millions) At the end of 2020, the carrying value of Best&#x27;s investment in Gremlin was $1,425, including goodwill. On that date, the fair value of Gremlin* was $1,475, and the fair value of Gremlin&#x27;s identifiable net assets was $1,350*. The recoverable amount was estimated at $1,430*.<\/p><p>* for pro rata share Outside of United States, Best operates in two geographic segments: Europe and Mexico. Selected financial information for each segment is found in Exhibit 3. Exhibit 3: Selected Financial Information by Segment<\/p><div class=\"tbl\"><table><tr><td>in millionsEBIT<\/td><td>Revenue<\/td><td>Total CapEx<\/td><td>Total Assets<\/td><td><\/td><\/tr><tr><td>Europe<\/td><td>$7,203<\/td><td>$50,463<\/td><td>$4,452<\/td><td>$36,642<\/td><\/tr><tr><td>Mexico<\/td><td>$787<\/td><td>$9,766<\/td><td>$8,269<\/td><td>$14,250<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The data found in Exhibit 3 most likely indicates that Best may be over-allocating resources to:<\/p><\/div>","subj":"fsa"},{"n":53,"q":"Using the information in Exhibit 1, what is the cost of debt for X-Sport?","opts":["7.45%.","7.30%.","7.35%."],"ans":"A","expl":"Because the bond rating is assumed to be A, we interpolate the yield on a 7-year bond using the 5-year and 8-year yields of A rated bonds.\ninterpolated yield | = yield5+[(yield8 – yield5) / (8 – 5)] × (7 – 5) = 7.05% + [(7.65% – 7.05%) / 3] × 2 = 7.45%\n(Module 17.1, LOS 17.e)","explhtml":"<p>Because the bond rating is assumed to be A, we interpolate the yield on a 7-year bond using the 5-year and 8-year yields of A rated bonds.<\/p><div class=\"tbl\"><table><tr><td>interpolated yield<\/td><td><sup>= yield<\/sup>5<sup>+[(yield<\/sup>8<sup> – yield<\/sup>5<sup>) / (8 – 5)] × (7 – 5)<\/sup> = 7.05% + [(7.65% – 7.05%) / 3] × 2 = 7.45%<\/td><\/tr><\/table><\/div><p>(Module 17.1, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Equity Valuation<\/summary><div class=\"vig-body\"><p>James Kelley is analyzing X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Kelley has been asked by his supervisor, Jessica Malone, to estimate the cost of capital for X-Sport. X-Sport has a $30 million face value, 5.75% annual-pay, senior unsecured debt with 7 years remaining to maturity. The unrated debt does not publicly trade, but Kelley estimates that it would be rated A based on X-Sport&#x27;s metrics. Kelley has collected current information on yields as shown in  Exhibit 1: Current Yield to Maturity by Rating Class and Maturity.<\/p><p>Exhibit 1: Current Yield to Maturity by Rating Class and Maturity<\/p><p>Maturity<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>3<\/td><td>5<\/td><td>8<\/td><td>10<\/td><td>Average<\/td><\/tr><tr><td>AAA<\/td><td>5.00%<\/td><td>6.00%<\/td><td>6.50%<\/td><td>7.25%<\/td><td>6.19%<\/td><\/tr><tr><td>AA<\/td><td>5.50%<\/td><td>6.55%<\/td><td>7.15%<\/td><td>8.00%<\/td><td>6.80%<\/td><\/tr><tr><td>A<\/td><td>6.00%<\/td><td>7.05%<\/td><td>7.65%<\/td><td>8.50%<\/td><td>7.30%<\/td><\/tr><tr><td>BBB<\/td><td>6.50%<\/td><td>7.60%<\/td><td>8.25%<\/td><td>9.25%<\/td><td>7.90%<\/td><\/tr><tr><td>BB<\/td><td>7.00%<\/td><td>8.15%<\/td><td>8.85%<\/td><td>10.00%<\/td><td>8.50%<\/td><\/tr><tr><td>B<\/td><td>7.50%<\/td><td>8.70%<\/td><td>9.45%<\/td><td>10.75%<\/td><td>9.10%<\/td><\/tr><\/table><\/div><p>To estimate X-Sport&#x27;s cost of equity, Kelley uses the firm&#x27;s model.  Exhibit 2: Estimated Inputs for Cost of Capital Estimates shows the estimates of inputs that the model uses.<\/p><p>Exhibit 2: Estimated Inputs for Cost of Capital Estimates<\/p><div class=\"tbl\"><table><tr><td>Input<\/td><td>Estimate<\/td><\/tr><tr><td>Long-term inflation forecast<\/td><td>2.50%<\/td><\/tr><tr><td>Current level of inflation<\/td><td>4.50%<\/td><\/tr><tr><td>Forecast div. yield—public companies<\/td><td>1.20%<\/td><\/tr><tr><td>Real GDP growth rate<\/td><td>3.20%<\/td><\/tr><tr><td>LT government securities YTM<\/td><td>3.00%<\/td><\/tr><tr><td>ST government securities YTM<\/td><td>5.00%<\/td><\/tr><tr><td>Market P/E multiple<\/td><td>Fairly valued<\/td><\/tr><tr><td>Growth in shares outstanding<\/td><td>0%<\/td><\/tr><\/table><\/div><p>Kelley believes that X-Sport&#x27;s cost of capital should include specific company risk premium (SCRP) and makes the following notes:<\/p><p>1. Qualitative factors affecting SCRP include corporate governance quality, use of leverage to finance assets, and customer and supplier concentration, among others.<\/p><p>2. Firms with most of the assets represented by successful R&amp;D would command a lower SCRP.<\/p><p>While discussing a foreign competitor of X-Sport, Kelley brings up the use of the international capital asset pricing model (ICAPM). While discussing the two factors in the ICAPM, Malone makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The first factor captures the company&#x27;s relationship with the local economy relative to the global economy.<\/td><\/tr><tr><td>Statement 2: <\/td><td>The second factor captures the sensitivity of the company&#x27;s cash flows to changes in its currency value.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1, what is the cost of debt for X-Sport?<\/p><\/div>","subj":"equity"},{"n":54,"q":"Using the information in Exhibit 2 and the Grinold-Kroner model, the estimate of ERP is closest to:","opts":["1.90%.","3.90%.","5.90%."],"ans":"B","expl":"ERP = [DY + ΔP/E + i + G + ΔS] – rf = [1.20% + 0 + 2.50% + 3.20% + 0] – 3% = 3.90%. (Module 17.2, LOS 17.c)","explhtml":"<p>ERP = [DY + ΔP/E + i + G + ΔS] – rf = [1.20% + 0 + 2.50% + 3.20% + 0] – 3% = 3.90%. (Module 17.2, LOS 17.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is analyzing X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Kelley has been asked by his supervisor, Jessica Malone, to estimate the cost of capital for X-Sport. X-Sport has a $30 million face value, 5.75% annual-pay, senior unsecured debt with 7 years remaining to maturity. The unrated debt does not publicly trade, but Kelley estimates that it would be rated A based on X-Sport&#x27;s metrics. Kelley has collected current information on yields as shown in  Exhibit 1: Current Yield to Maturity by Rating Class and Maturity.<\/p><p>Exhibit 1: Current Yield to Maturity by Rating Class and Maturity<\/p><p>Maturity<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>3<\/td><td>5<\/td><td>8<\/td><td>10<\/td><td>Average<\/td><\/tr><tr><td>AAA<\/td><td>5.00%<\/td><td>6.00%<\/td><td>6.50%<\/td><td>7.25%<\/td><td>6.19%<\/td><\/tr><tr><td>AA<\/td><td>5.50%<\/td><td>6.55%<\/td><td>7.15%<\/td><td>8.00%<\/td><td>6.80%<\/td><\/tr><tr><td>A<\/td><td>6.00%<\/td><td>7.05%<\/td><td>7.65%<\/td><td>8.50%<\/td><td>7.30%<\/td><\/tr><tr><td>BBB<\/td><td>6.50%<\/td><td>7.60%<\/td><td>8.25%<\/td><td>9.25%<\/td><td>7.90%<\/td><\/tr><tr><td>BB<\/td><td>7.00%<\/td><td>8.15%<\/td><td>8.85%<\/td><td>10.00%<\/td><td>8.50%<\/td><\/tr><tr><td>B<\/td><td>7.50%<\/td><td>8.70%<\/td><td>9.45%<\/td><td>10.75%<\/td><td>9.10%<\/td><\/tr><\/table><\/div><p>To estimate X-Sport&#x27;s cost of equity, Kelley uses the firm&#x27;s model.  Exhibit 2: Estimated Inputs for Cost of Capital Estimates shows the estimates of inputs that the model uses.<\/p><p>Exhibit 2: Estimated Inputs for Cost of Capital Estimates<\/p><div class=\"tbl\"><table><tr><td>Input<\/td><td>Estimate<\/td><\/tr><tr><td>Long-term inflation forecast<\/td><td>2.50%<\/td><\/tr><tr><td>Current level of inflation<\/td><td>4.50%<\/td><\/tr><tr><td>Forecast div. yield—public companies<\/td><td>1.20%<\/td><\/tr><tr><td>Real GDP growth rate<\/td><td>3.20%<\/td><\/tr><tr><td>LT government securities YTM<\/td><td>3.00%<\/td><\/tr><tr><td>ST government securities YTM<\/td><td>5.00%<\/td><\/tr><tr><td>Market P/E multiple<\/td><td>Fairly valued<\/td><\/tr><tr><td>Growth in shares outstanding<\/td><td>0%<\/td><\/tr><\/table><\/div><p>Kelley believes that X-Sport&#x27;s cost of capital should include specific company risk premium (SCRP) and makes the following notes:<\/p><p>1. Qualitative factors affecting SCRP include corporate governance quality, use of leverage to finance assets, and customer and supplier concentration, among others.<\/p><p>2. Firms with most of the assets represented by successful R&amp;D would command a lower SCRP.<\/p><p>While discussing a foreign competitor of X-Sport, Kelley brings up the use of the international capital asset pricing model (ICAPM). While discussing the two factors in the ICAPM, Malone makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The first factor captures the company&#x27;s relationship with the local economy relative to the global economy.<\/td><\/tr><tr><td>Statement 2: <\/td><td>The second factor captures the sensitivity of the company&#x27;s cash flows to changes in its currency value.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 2 and the Grinold-Kroner model, the estimate of ERP is closest to:<\/p><\/div>","subj":"equity"},{"n":55,"q":"Regarding Kelley's statements about specific company risk premium:","opts":["only one of the statements is correct.","both statements are correct.","both statements are incorrect."],"ans":"C","expl":"Statement 1 is incorrect. Leverage is a quantitative factor and should not be listed in the list of qualitative factors.\nStatement 2 is incorrect. Assets represented by successful R&D would be intangible. Firms with mostly liquid, tangible, and fungible assets would command a lower SCRP.\n(Module 17.2, LOS 17.e)","explhtml":"<p>Statement 1 is incorrect. Leverage is a quantitative factor and should not be listed in the list of qualitative factors.<\/p><p>Statement 2 is incorrect. Assets represented by successful R&amp;D would be intangible. Firms with mostly liquid, tangible, and fungible assets would command a lower SCRP.<\/p><p>(Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is analyzing X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Kelley has been asked by his supervisor, Jessica Malone, to estimate the cost of capital for X-Sport. X-Sport has a $30 million face value, 5.75% annual-pay, senior unsecured debt with 7 years remaining to maturity. The unrated debt does not publicly trade, but Kelley estimates that it would be rated A based on X-Sport&#x27;s metrics. Kelley has collected current information on yields as shown in  Exhibit 1: Current Yield to Maturity by Rating Class and Maturity.<\/p><p>Exhibit 1: Current Yield to Maturity by Rating Class and Maturity<\/p><p>Maturity<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>3<\/td><td>5<\/td><td>8<\/td><td>10<\/td><td>Average<\/td><\/tr><tr><td>AAA<\/td><td>5.00%<\/td><td>6.00%<\/td><td>6.50%<\/td><td>7.25%<\/td><td>6.19%<\/td><\/tr><tr><td>AA<\/td><td>5.50%<\/td><td>6.55%<\/td><td>7.15%<\/td><td>8.00%<\/td><td>6.80%<\/td><\/tr><tr><td>A<\/td><td>6.00%<\/td><td>7.05%<\/td><td>7.65%<\/td><td>8.50%<\/td><td>7.30%<\/td><\/tr><tr><td>BBB<\/td><td>6.50%<\/td><td>7.60%<\/td><td>8.25%<\/td><td>9.25%<\/td><td>7.90%<\/td><\/tr><tr><td>BB<\/td><td>7.00%<\/td><td>8.15%<\/td><td>8.85%<\/td><td>10.00%<\/td><td>8.50%<\/td><\/tr><tr><td>B<\/td><td>7.50%<\/td><td>8.70%<\/td><td>9.45%<\/td><td>10.75%<\/td><td>9.10%<\/td><\/tr><\/table><\/div><p>To estimate X-Sport&#x27;s cost of equity, Kelley uses the firm&#x27;s model.  Exhibit 2: Estimated Inputs for Cost of Capital Estimates shows the estimates of inputs that the model uses.<\/p><p>Exhibit 2: Estimated Inputs for Cost of Capital Estimates<\/p><div class=\"tbl\"><table><tr><td>Input<\/td><td>Estimate<\/td><\/tr><tr><td>Long-term inflation forecast<\/td><td>2.50%<\/td><\/tr><tr><td>Current level of inflation<\/td><td>4.50%<\/td><\/tr><tr><td>Forecast div. yield—public companies<\/td><td>1.20%<\/td><\/tr><tr><td>Real GDP growth rate<\/td><td>3.20%<\/td><\/tr><tr><td>LT government securities YTM<\/td><td>3.00%<\/td><\/tr><tr><td>ST government securities YTM<\/td><td>5.00%<\/td><\/tr><tr><td>Market P/E multiple<\/td><td>Fairly valued<\/td><\/tr><tr><td>Growth in shares outstanding<\/td><td>0%<\/td><\/tr><\/table><\/div><p>Kelley believes that X-Sport&#x27;s cost of capital should include specific company risk premium (SCRP) and makes the following notes:<\/p><p>1. Qualitative factors affecting SCRP include corporate governance quality, use of leverage to finance assets, and customer and supplier concentration, among others.<\/p><p>2. Firms with most of the assets represented by successful R&amp;D would command a lower SCRP.<\/p><p>While discussing a foreign competitor of X-Sport, Kelley brings up the use of the international capital asset pricing model (ICAPM). While discussing the two factors in the ICAPM, Malone makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The first factor captures the company&#x27;s relationship with the local economy relative to the global economy.<\/td><\/tr><tr><td>Statement 2: <\/td><td>The second factor captures the sensitivity of the company&#x27;s cash flows to changes in its currency value.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Kelley&#x27;s statements about specific company risk premium:<\/p><\/div>","subj":"equity"},{"n":56,"q":"Regarding Malone's statements about ICAPM:","opts":["only one of the statements is correct.","both statements are correct.","both statements are incorrect."],"ans":"B","expl":"Both statements are correct. The first factor captures the company's relationship with the local economy relative to the global economy: lower values of βG indicate lower integration of the company with the global economy. The second factor captures the sensitivity of the company's cash flows to changes in its local currency exchange rate.\n(Module 17.2, LOS 17.e)","explhtml":"<p>Both statements are correct. The first factor captures the company&#x27;s relationship with the local economy relative to the global economy: lower values of βG indicate lower integration of the company with the global economy. The second factor captures the sensitivity of the company&#x27;s cash flows to changes in its local currency exchange rate.<\/p><p>(Module 17.2, LOS 17.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 53–56 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>James Kelley is analyzing X-Sport, Inc., a manufacturer of high-end outdoor sporting equipment. Kelley has been asked by his supervisor, Jessica Malone, to estimate the cost of capital for X-Sport. X-Sport has a $30 million face value, 5.75% annual-pay, senior unsecured debt with 7 years remaining to maturity. The unrated debt does not publicly trade, but Kelley estimates that it would be rated A based on X-Sport&#x27;s metrics. Kelley has collected current information on yields as shown in  Exhibit 1: Current Yield to Maturity by Rating Class and Maturity.<\/p><p>Exhibit 1: Current Yield to Maturity by Rating Class and Maturity<\/p><p>Maturity<\/p><div class=\"tbl\"><table><tr><td>Rating<\/td><td>3<\/td><td>5<\/td><td>8<\/td><td>10<\/td><td>Average<\/td><\/tr><tr><td>AAA<\/td><td>5.00%<\/td><td>6.00%<\/td><td>6.50%<\/td><td>7.25%<\/td><td>6.19%<\/td><\/tr><tr><td>AA<\/td><td>5.50%<\/td><td>6.55%<\/td><td>7.15%<\/td><td>8.00%<\/td><td>6.80%<\/td><\/tr><tr><td>A<\/td><td>6.00%<\/td><td>7.05%<\/td><td>7.65%<\/td><td>8.50%<\/td><td>7.30%<\/td><\/tr><tr><td>BBB<\/td><td>6.50%<\/td><td>7.60%<\/td><td>8.25%<\/td><td>9.25%<\/td><td>7.90%<\/td><\/tr><tr><td>BB<\/td><td>7.00%<\/td><td>8.15%<\/td><td>8.85%<\/td><td>10.00%<\/td><td>8.50%<\/td><\/tr><tr><td>B<\/td><td>7.50%<\/td><td>8.70%<\/td><td>9.45%<\/td><td>10.75%<\/td><td>9.10%<\/td><\/tr><\/table><\/div><p>To estimate X-Sport&#x27;s cost of equity, Kelley uses the firm&#x27;s model.  Exhibit 2: Estimated Inputs for Cost of Capital Estimates shows the estimates of inputs that the model uses.<\/p><p>Exhibit 2: Estimated Inputs for Cost of Capital Estimates<\/p><div class=\"tbl\"><table><tr><td>Input<\/td><td>Estimate<\/td><\/tr><tr><td>Long-term inflation forecast<\/td><td>2.50%<\/td><\/tr><tr><td>Current level of inflation<\/td><td>4.50%<\/td><\/tr><tr><td>Forecast div. yield—public companies<\/td><td>1.20%<\/td><\/tr><tr><td>Real GDP growth rate<\/td><td>3.20%<\/td><\/tr><tr><td>LT government securities YTM<\/td><td>3.00%<\/td><\/tr><tr><td>ST government securities YTM<\/td><td>5.00%<\/td><\/tr><tr><td>Market P/E multiple<\/td><td>Fairly valued<\/td><\/tr><tr><td>Growth in shares outstanding<\/td><td>0%<\/td><\/tr><\/table><\/div><p>Kelley believes that X-Sport&#x27;s cost of capital should include specific company risk premium (SCRP) and makes the following notes:<\/p><p>1. Qualitative factors affecting SCRP include corporate governance quality, use of leverage to finance assets, and customer and supplier concentration, among others.<\/p><p>2. Firms with most of the assets represented by successful R&amp;D would command a lower SCRP.<\/p><p>While discussing a foreign competitor of X-Sport, Kelley brings up the use of the international capital asset pricing model (ICAPM). While discussing the two factors in the ICAPM, Malone makes the following statements:<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>The first factor captures the company&#x27;s relationship with the local economy relative to the global economy.<\/td><\/tr><tr><td>Statement 2: <\/td><td>The second factor captures the sensitivity of the company&#x27;s cash flows to changes in its currency value.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding Malone&#x27;s statements about ICAPM:<\/p><\/div>","subj":"equity"},{"n":57,"q":"The allocation approach that is most appropriate for the endowment is:","opts":["Direct investment.","FoFs.","Multistrategy funds."],"ans":"B","expl":"The most appropriate approach for the endowment is to allocate the hedge funds through an FoF.\nThe endowment does not have historical relationships with hedge fund managers. This suggests that the current investment staff does not have the expertise or experience to do due diligence of direct investments in hedge funds; hence, a direct approach is inappropriate.\nWe are asked to minimize operational risk. The single fund structure of a multistrategy fund creates the greatest operational risk because fund failure would wipe out 100% of the investment. This would not occur for a diversified portfolio of hedge funds created under a direct investment program, or an FoF, which would spread investments across multiple individual hedge funds.\n(Module 34.3, LOS 34.g)","explhtml":"<p>The most appropriate approach for the endowment is to allocate the hedge funds through an FoF.<\/p><p>The endowment does not have historical relationships with hedge fund managers. This suggests that the current investment staff does not have the expertise or experience to do due diligence of direct investments in hedge funds; hence, a direct approach is inappropriate.<\/p><p>We are asked to minimize operational risk. The single fund structure of a multistrategy fund creates the greatest operational risk because fund failure would wipe out 100% of the investment. This would not occur for a diversified portfolio of hedge funds created under a direct investment program, or an FoF, which would spread investments across multiple individual hedge funds.<\/p><p>(Module 34.3, LOS 34.g)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Tomas Dench is an investment analyst working for the Onebridge University Endowment. The investment committee has recently decided to make an allocation to hedge funds for the first time. The committee has asked Dench to consider whether a direct investment, fund-of-funds (FoFs), or multistrategy fund would be the most appropriate approach.<\/p><p>Key considerations in the decision are as follows:<\/p><p>The internal investment staff at the endowment has no historical relationships with hedge fund managers.<\/p><p>Operational risk caused by the allocation to hedge funds should be minimized.<\/p><p>Dench agrees to meet with Etienne Cardoni, an investment consultant who covers FoFs and multistrategy funds, to discuss the requirements of the endowment. Cardoni states that netting risk and gaining access to closed funds are both advantages of multistrategy funds over FoFs that should be considered in Dench&#x27;s analysis.<\/p><p>Dench admits to Cardoni that he does not fully understand the various hedge fund strategies that are employed by managers. In particular, he feels he needs a better understanding of event-driven strategies such as merger arbitrage and distressed debt investing.<\/p><p>Cardoni demonstrates a simple merger arbitrage trade using the following deal information:<\/p><p>Essco Corp. offers to purchase Jayco Corp. in a stock-for-stock deal. Deal terms include 1 share of Essco for 2.5 shares of Jayco. Upon announcement of the deal, Essco&#x27;s share price falls from $89 to $85, and Jayco&#x27;s share price rises from $30 to $33.<\/p><p>If the merger fails, the share prices are expected to return to their pre-announcement levels.<\/p><p>The hedge fund manager establishes a merger arbitrage trade based on a position size of 50,000 shares in Jayco.<\/p><\/div><\/details><div class=\"qtext\"><p>The allocation approach that is most appropriate for the endowment is:<\/p><\/div>","subj":"alternatives"},{"n":58,"q":"Cardoni's statement regarding netting risk and gaining access to closed funds is best described as:","opts":["correct in regards to both netting risk, and gaining access to closed funds.","correct about netting risk, but incorrect about gaining access to closed funds.","incorrect about netting risk, but correct about gaining access to closed funds."],"ans":"B","expl":"Cardoni's statement on netting risk is correct. In an FoF, the performance fees paid to outperforming individual underlying fund managers are not offset by losses in underperforming underlying funds, because the underlying funds are independent of one another. This results in netting risk: the FoF investor may have to pay performance fees to some managers – even when the investor is not earning a positive return in the FoF overall.\nNetting risk is not present in a multistrategy fund structure (and therefore it is an advantage of multistrategy funds over FoFs), because there is a single fund structure with multiple management teams. Returns of different fund strategies are offset against each other when performance fees are calculated.\nCardoni's statement about gaining access to closed funds is incorrect: in fact, FoF managers can provide investors with access to certain closed hedge funds. Through their network of relationships and their large scale, FoFs may provide access to successful managers whose funds are otherwise closed to new investment.\n(Module 34.3, LOS 34.g)","explhtml":"<p>Cardoni&#x27;s statement on netting risk is correct. In an FoF, the performance fees paid to outperforming individual underlying fund managers are not offset by losses in underperforming underlying funds, because the underlying funds are independent of one another. This results in netting risk: the FoF investor may have to pay performance fees to some managers – even when the investor is not earning a positive return in the FoF overall.<\/p><p>Netting risk is not present in a multistrategy fund structure (and therefore it is an advantage of multistrategy funds over FoFs), because there is a single fund structure with multiple management teams. Returns of different fund strategies are offset against each other when performance fees are calculated.<\/p><p>Cardoni&#x27;s statement about gaining access to closed funds is incorrect: in fact, FoF managers can provide investors with access to certain closed hedge funds. Through their network of relationships and their large scale, FoFs may provide access to successful managers whose funds are otherwise closed to new investment.<\/p><p>(Module 34.3, LOS 34.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Dench is an investment analyst working for the Onebridge University Endowment. The investment committee has recently decided to make an allocation to hedge funds for the first time. The committee has asked Dench to consider whether a direct investment, fund-of-funds (FoFs), or multistrategy fund would be the most appropriate approach.<\/p><p>Key considerations in the decision are as follows:<\/p><p>The internal investment staff at the endowment has no historical relationships with hedge fund managers.<\/p><p>Operational risk caused by the allocation to hedge funds should be minimized.<\/p><p>Dench agrees to meet with Etienne Cardoni, an investment consultant who covers FoFs and multistrategy funds, to discuss the requirements of the endowment. Cardoni states that netting risk and gaining access to closed funds are both advantages of multistrategy funds over FoFs that should be considered in Dench&#x27;s analysis.<\/p><p>Dench admits to Cardoni that he does not fully understand the various hedge fund strategies that are employed by managers. In particular, he feels he needs a better understanding of event-driven strategies such as merger arbitrage and distressed debt investing.<\/p><p>Cardoni demonstrates a simple merger arbitrage trade using the following deal information:<\/p><p>Essco Corp. offers to purchase Jayco Corp. in a stock-for-stock deal. Deal terms include 1 share of Essco for 2.5 shares of Jayco. Upon announcement of the deal, Essco&#x27;s share price falls from $89 to $85, and Jayco&#x27;s share price rises from $30 to $33.<\/p><p>If the merger fails, the share prices are expected to return to their pre-announcement levels.<\/p><p>The hedge fund manager establishes a merger arbitrage trade based on a position size of 50,000 shares in Jayco.<\/p><\/div><\/details><div class=\"qtext\"><p>Cardoni&#x27;s statement regarding netting risk and gaining access to closed funds is best described as:<\/p><\/div>","subj":"alternatives"},{"n":59,"q":"Assuming Cardoni is using a hard-catalyst, event-driven approach, the maximum gain and the maximum loss of the Essco and Jayco merger-arbitrage trade are closest to:\nMaximum Gain | Maximum Loss","opts":["$80,000 $40,000","$50,000 $200,000","$50,000 $230,000"],"ans":"C","expl":"The manager establishes a long position in Jayco totaling 50,000 shares. Under a hard-catalyst event-driven approach, the manager will invest in the trade post-announcement. This will cost 50,000 × $33 = $1,650,000. The deal ratio is 1 share of Essco per 2.5 shares of Jayco; hence, the manager will short sell 50,000 / 2.5 = 20,000 shares of Essco at a post-announcement price of $85, raising 20,000 × $85 = $1,700,000 short proceeds. Therefore, the manager will earn a spread of $1,700,000 - $1,650,000 = $50,000 if the deal goes through.\nIf the deal fails, prices are expected to revert to their pre-announcement levels. This means the manager will lose 50,000 × ($33 - $30) = $150,000 on the long position in Jayco shares. The manager will also lose 20,000 × ($89 - $85) = $80,000 on the short position in Essco shares, making total losses of $230,000.\n(Module 34.2, LOS 34.c)","explhtml":"<p>The manager establishes a long position in Jayco totaling 50,000 shares. Under a hard-catalyst event-driven approach, the manager will invest in the trade post-announcement. This will cost 50,000 × $33 = $1,650,000. The deal ratio is 1 share of Essco per 2.5 shares of Jayco; hence, the manager will short sell 50,000 / 2.5 = 20,000 shares of Essco at a post-announcement price of $85, raising 20,000 × $85 = $1,700,000 short proceeds. Therefore, the manager will earn a spread of $1,700,000 - $1,650,000 = $50,000 if the deal goes through.<\/p><p>If the deal fails, prices are expected to revert to their pre-announcement levels. This means the manager will lose 50,000 × ($33 - $30) = $150,000 on the long position in Jayco shares. The manager will also lose 20,000 × ($89 - $85) = $80,000 on the short position in Essco shares, making total losses of $230,000.<\/p><p>(Module 34.2, LOS 34.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Dench is an investment analyst working for the Onebridge University Endowment. The investment committee has recently decided to make an allocation to hedge funds for the first time. The committee has asked Dench to consider whether a direct investment, fund-of-funds (FoFs), or multistrategy fund would be the most appropriate approach.<\/p><p>Key considerations in the decision are as follows:<\/p><p>The internal investment staff at the endowment has no historical relationships with hedge fund managers.<\/p><p>Operational risk caused by the allocation to hedge funds should be minimized.<\/p><p>Dench agrees to meet with Etienne Cardoni, an investment consultant who covers FoFs and multistrategy funds, to discuss the requirements of the endowment. Cardoni states that netting risk and gaining access to closed funds are both advantages of multistrategy funds over FoFs that should be considered in Dench&#x27;s analysis.<\/p><p>Dench admits to Cardoni that he does not fully understand the various hedge fund strategies that are employed by managers. In particular, he feels he needs a better understanding of event-driven strategies such as merger arbitrage and distressed debt investing.<\/p><p>Cardoni demonstrates a simple merger arbitrage trade using the following deal information:<\/p><p>Essco Corp. offers to purchase Jayco Corp. in a stock-for-stock deal. Deal terms include 1 share of Essco for 2.5 shares of Jayco. Upon announcement of the deal, Essco&#x27;s share price falls from $89 to $85, and Jayco&#x27;s share price rises from $30 to $33.<\/p><p>If the merger fails, the share prices are expected to return to their pre-announcement levels.<\/p><p>The hedge fund manager establishes a merger arbitrage trade based on a position size of 50,000 shares in Jayco.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming Cardoni is using a hard-catalyst, event-driven approach, the maximum gain and the maximum loss of the Essco and Jayco merger-arbitrage trade are closest to:<\/p><div class=\"tbl\"><table><tr><td>Maximum Gain<\/td><td>Maximum Loss<\/td><\/tr><\/table><\/div><\/div>","subj":"alternatives"},{"n":60,"q":"Assuming a successful merger, the use of a soft-catalyst, event-driven approach is most likely to lead to:","opts":["higher profits.","equal profits.","lower profits."],"ans":"A","expl":"Under a soft-catalyst, event-driven approach, the hedge fund manager will aim to anticipate the deal announcement and enter the trade before the deal is announced. This will increase profits if the merger is completed, because the manager will buy shares in the target company at a lower price and short sell shares in the acquiring company at a higher price.\n(Module 34.2, LOS 34.c)","explhtml":"<p>Under a soft-catalyst, event-driven approach, the hedge fund manager will aim to anticipate the deal announcement and enter the trade before the deal is announced. This will increase profits if the merger is completed, because the manager will buy shares in the target company at a lower price and short sell shares in the acquiring company at a higher price.<\/p><p>(Module 34.2, LOS 34.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 57–60 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Dench is an investment analyst working for the Onebridge University Endowment. The investment committee has recently decided to make an allocation to hedge funds for the first time. The committee has asked Dench to consider whether a direct investment, fund-of-funds (FoFs), or multistrategy fund would be the most appropriate approach.<\/p><p>Key considerations in the decision are as follows:<\/p><p>The internal investment staff at the endowment has no historical relationships with hedge fund managers.<\/p><p>Operational risk caused by the allocation to hedge funds should be minimized.<\/p><p>Dench agrees to meet with Etienne Cardoni, an investment consultant who covers FoFs and multistrategy funds, to discuss the requirements of the endowment. Cardoni states that netting risk and gaining access to closed funds are both advantages of multistrategy funds over FoFs that should be considered in Dench&#x27;s analysis.<\/p><p>Dench admits to Cardoni that he does not fully understand the various hedge fund strategies that are employed by managers. In particular, he feels he needs a better understanding of event-driven strategies such as merger arbitrage and distressed debt investing.<\/p><p>Cardoni demonstrates a simple merger arbitrage trade using the following deal information:<\/p><p>Essco Corp. offers to purchase Jayco Corp. in a stock-for-stock deal. Deal terms include 1 share of Essco for 2.5 shares of Jayco. Upon announcement of the deal, Essco&#x27;s share price falls from $89 to $85, and Jayco&#x27;s share price rises from $30 to $33.<\/p><p>If the merger fails, the share prices are expected to return to their pre-announcement levels.<\/p><p>The hedge fund manager establishes a merger arbitrage trade based on a position size of 50,000 shares in Jayco.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming a successful merger, the use of a soft-catalyst, event-driven approach is most likely to lead to:<\/p><\/div>","subj":"alternatives"},{"n":61,"q":"®\nPrizm's EVA | for 20X6 is closest to:","opts":["negative $1.3 million.","negative $1.2 million.","positive $1.8 million."],"ans":"C","expl":"EVA = NOPAT − $WACC NOPAT = EBIT × (1 − t) = 28.1 × (1 − 0.45) = 15.455 $WACC = WACC × total capital = 12.5% × 109.2 = $13.65m For EVA computation, we need beginning 20X6 total capital (i.e., 20X5 ending). EVA = 15.455 − 13.65 = $1.805m (Module 23.1, LOS 23.a)","explhtml":"<p>EVA = NOPAT − $WACC NOPAT = EBIT × (1 − t) = 28.1 × (1 − 0.45) = 15.455 $WACC = WACC × total capital = 12.5% × 109.2 = $13.65m For EVA computation, we need beginning 20X6 total capital (i.e., 20X5 ending). EVA = 15.455 − 13.65 = $1.805m (Module 23.1, LOS 23.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 61–64 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Asante Bizou is an equity analyst for Alpha, Inc., a boutique consulting firm in San Jose, CA. Alpha is providing consulting services isk of the two bonds is similar to the credit risk premium embedded in the swap rate. Selected data for the two bonds is provided in Exhibit 2.<\/p><p>Exhibit 2: Selected Data on Two Dxon Bonds<\/p><div class=\"tbl\"><table><tr><td>Bond<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>Coupon<\/td><td>5%, annual pay<\/td><td>5% annual pay<\/td><\/tr><tr><td>Par Value<\/td><td>$100<\/td><td>$100<\/td><\/tr><tr><td>Type<\/td><td>Option-Free<\/td><td>Extendible*<\/td><\/tr><tr><td>Maturity<\/td><td>3 years<\/td><td>2 years<\/td><\/tr><\/table><\/div><p>*Bond B has an investor option to extend its maturity for an additional year at the same coupon rate.<\/p><p>Thomas states that pathwise valuation can also be used for the bonds instead of the binomial tree approach. She highlights one of the interest rate paths (labeled Path X) as 2.50% in Year 1, 4.9445% in Year 2, and 6.6821% in Year 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1 and Exhibit 2, the value of Bond A is closest to:<\/p><\/div>","subj":"fixed"},{"n":66,"q":"The value of Bond A under Path X is closest to:","opts":["$98.02.","$99.63.","$101.02."],"ans":"C","expl":"The value of Bond A under interest rate scenario of Path X is determined as:\n5 | 5 | 105\nValue | = | + | +\n(1.025) | (1.025)(1.049445) = $101.02 | (1.025)(1.049445)(1.066821)\n(Module 26.2, LOS 26.g)","explhtm k of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>The value of Bond A under Path X is closest to:<\/p><\/div>","subj":"fixed"},{"n":67,"q":"Using the information in Exhibit 1 and Exhibit 2, the value of Bond B is closest to:","opts":["$98.96.","$101.16.","$102.91."],"ans":"C","expl":"An extendible bond is valued identically to a putable bond. Bond B would be identical to a 3-year putable bond where the underlying option is a European put option exercisable in 2 years at par. The completed binomial tree is given below.\n105\nV2,UU | = (1.081616) | = $97.08. Investor will not extend the bond.\nValue 105 | = $100\nV2,UL | = (1.066821) | = $98.42. Investor will not extend the bond.\nValue 105 | = $100\nV2,LL | = (1.054709) | = $99.55. Investor will not extend the bond.\nValue [(100.00+100.00)/2]+5 | = $100\nV1,U | = [ 1.049445 [(100.00+100.00)/2]+5 | ] = $100.05\nV1,L | = [ 1.040482 (100.05+100.91)/2+5 | ] = $100.91\nV0 | = [ 1.025 | ] = $102.91\n(Module 27.2, LOS 27.f)","explhtml":"<p>An extendible bond is valued identically to a putable bond. Bond B would be identical to a 3-year putable bond where the underlying option is a European put option exercisable in 2 years at par. The completed binomial tree is given below.<\/p><img class=\"pimg\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAlgCWAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJ ear 3.<\/p><p>Joplin feels that the default risk of Dxon Corp. is higher than the default risk of the surveyed banks reflected in the rates used to generate the interest rate tree in Exhibit 1. Accordingly, a spread should be added to the interest rate tree used in Exhibit 1. She learns that such a spread is called the OAS.<\/p><p>During lunch, Joplin sits next to Rex Briar, another intern. Briar notes that Bond B has an OAS of 28 basis points. Another bond, issued by Geneva, Inc., has the same credit quality and other features as Bond B, except it is option free. The OAS for the Geneva, Inc., bond is 24 basis points.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the information in Exhibit 1 and Exhibit 2, the value of Bond B is closest to:<\/p><\/div>","subj":"fixed"},{"n":68,"q":"Relative to Bond B, the Geneva, Inc., bond is most likely to be:","opts":["underpriced.","overpriced.","correctly priced."],"ans":"B","expl":"Bond B and Geneva, Inc., bonds are of the same credit quality, but Geneva Inc.'s bond offers a lower OAS and, hence, offers lower compensation for taking the same credit risk. Hence, the Geneva, Inc., bond is overpriced. The difference in option feature is not relevant, as OAS is computed after adjusting for option risk.\n(Module 27.4, LOS 27.g)","explhtml":"<p>Bond B and Geneva, Inc., bonds are of the same credit quality, but Geneva Inc.&#x27;s bond offers a lower OAS and, hence, offers lower compensation for taking the same credit risk. Hence, the Geneva, Inc., bond is overpriced. The difference in option feature is not relevant, as OAS is computed after adjusting for option risk.<\/p><p>(Module 27.4, LOS 27.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 65–68 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Juanita Joplin has just begun her summer internship in the bond trading department of Bearclaw Bank NA. Joplin is assigned to Suzann },{"n":69,"q":"If the volatility estimate used in generating the interest rate tree is less than the true volatility, which of the following would most accurately describes the impact on the calculated value of bond X and the estimated OAS of bond X?\nEstimated OAS of Value of Bond X Bond X","opts":["Underestimated Too low","Underestimated Too high","Overestimated Too high"],"ans":"A","expl":"Bond X is equivalent to a six-year putable bond with the put option exercisable in Year 4. If the volatility estimate used to generate the interest rate tree is lower than the actual volatility, the value of the put option and, thus, the value of the putable bond would be underestimated. A lower volatility estimate would underestimate the OAS computed for the putable bond. When the assumed level of interest rate volatility is underestimated, the computed value of the bond using backward induction methodology will be too low; therefore, the OAS needed to force the model price to be equal to the market price will be lower as well.\n(Module 27.4, LOS 27.h)","explhtml":"<p>Bond X is equivalent to a six-year putable bond with the put option exercisable in Year 4. If the volatility estimate used to generate the interest rate tree is lower than the actual volatility, the value of the put option and, thus, the value of the putable bond would be underestimated. A lower volatility estimate would underestimate the OAS computed for the putable bond. When the assumed level of interest rate volatility is underestimated, the computed value of the bond using backward induction methodology will be too low; therefore, the OAS needed to force the model price to be equal to the market price will be lower as well.<\/p><p>(Module 27.4, LOS 27.h)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<\/summary><div class=\"vig-body\"><p>Garima Kahn is the head of analytics at Molson Traders. Kahn is onboarding Jason Bates, a new recruit. Kahn provides several research papers and other internal documents for Bates to review.<\/p><p>Bates looks over the section about credit analysis and how OAS is used to value different credit risky bonds. He notes that there is a warning statement that the calculated OAS is sensitive to inputs used in the model, and that care should be taken to use an appropriate level of future interest rate volatility in the model. Bates wants to use a binomial interest rate tree to value bond X. Bond X is a four year bond, extendible by the investor for an additional two years at the same coupon rate.<\/p><p>Bates reads a report prepared by Kahn for the risk management department. Bates underlines the following statement in the report:<\/p><p>The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option will have a lower one-sided down duration than the one-sided down duration of a comparable option-free bond.<\/p><p>Bates then prepares a summary documenting his understanding of various spread measures as shown in Exhibit 1.<\/p><p>Exhibit 1: Spreads<\/p><p>The swap spread is a useful indicator of credit risk in the markets. It can be used in conjunction with the TED, MRR-OIS, and z-spread to get an in-depth view of the state of the fixed-income markets, as follows:<\/p><p>Z-spread: Calculated as the constant number of basis points that must be added to the implied spot yield curve to make the discounted cash flows of a bond add up to its market price. For a risky bond, the z-spread is a more accurate measure of compensation for credit and liquidity risk than is the swap spread. TED spread: Calculated as the difference between MRR and the yield on a maturity-matched T-bill. TED spread gives better insight into supply and demand conditions in the market at a given maturity than does the swap spread (which focuses more on the risks in the banking system). MRR-OIS spread: Calculated as the difference between MRR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Bates prepares a partial report about his understanding of bond analytics and submits it to Kahn for feedback. Kahn&#x27;s feedback is shown in Exhibit 2.<\/p><p>Exhibit 2: Kahn&#x27;s Feedback<\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally, I would remove the theory stating that lenders and borrowers influence the shape of the yield curve, and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following term structure model, which calculates the change in the log of the short term interest rate over small increments of time (dt):<\/p><p>dln(rt) = <i>ϴ<\/i>tdt + σdzt<\/p><\/div><\/details><div class=\"qtext\"><p>If the volatility estimate used in generating the interest rate tree is less than the true volatility, which of the following would most accurately describes the impact on the calculated value of bond X and the estimated OAS of bond X?<\/p><p>Estimated OAS of Value of Bond X Bond X<\/p><\/div>","subj":"fixed"},{"n":70,"q":"Kahn's statement to the risk management department is best described as:","opts":["correct.","incorrect about effective duration only.","incorrect about both effective duration and about one-sided duration."],"ans":"B","expl":"Both callable and putable bonds have an effective duration that is less-than-or-equal-to the effective duration of an option-free bond. When the underlying call option is deep-out-of-the-money, the effective duration of a callable bond and that of an option-free bond will be the same. As a result, the statement about effective duration is incorrect. Thomas's statement about one-sided down duration is correct: due to the limited upside for a callable bond, the change in price of a calla s><div class=\"qtext\"><p>Kahn&#x27;s statement to the risk management department is best described as:<\/p><\/div>","subj":"fixed"},{"n":71,"q":"With regard to the summary of spreads in Exhibit 1, Kahn is least accurate in her:","opts":["definition of the MRR-OIS spread.","assertion that the z-spread provides a more accurate measure of credit risk than does the swap spread.","claim that the TED spread gives better insight into supply and demand conditions than does the swap spread."],"ans":"C","expl":"The swap spread gives more information about supply and demand, whereas the TED spread more accurately reflects the level of risk in the banking system. (Module 25.4, LOS 25.g)","explhtml":"<p>The swap spread gives more information about supply and demand, whereas the TED spread more accurately reflects the level of risk in the banking system. (Module 25.4, LOS 25.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Garima Kahn is the head of analytics at Molson Traders. Kahn is onboarding Jason Bates, a new recruit. Kahn provides several research papers and other internal documents for Bates to review.<\/p><p>Bates looks over the section about credit analysis and how OAS is used to value different credit risky bonds. He notes that there is a warning statement that the calculated OAS is sensitive to inputs used in the model, and that care should be taken to use an appropriate level of future interest rate volatility in the model. Bates wants to use a binomial interest rate tree to value bond X. Bond X is a four year bond, extendible by the investor for an additional two years at the same coupon rate.<\/p><p>Bates reads a report prepared by Kahn for the risk management department. Bates underlines the following statement in the report:<\/p><p>The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option will have a lower one-sided down duration than the one-sided down duration of a comparable option-free bond.<\/p><p>Bates then prepares a summary documenting his understanding of various spread measures as shown in Exhibit 1.<\/p><p>Exhibit 1: Spreads<\/p><p>The swap spread is a useful indicator of credit risk in the markets. It can be used in conjunction with the TED, MRR-OIS, and z-spread to get an in-depth view of the state of the fixed-income markets, as follows:<\/p><p>Z-spread: Calculated as the constant number of basis points that must be added to the implied spot yield curve to make the discounted cash flows of a bond add up to its market price. For a risky bond, the z-spread is a more accurate measure of compensation for credit and liquidity risk than is the swap spread. TED spread: Calculated as the difference between MRR and the yield on a maturity-matched T-bill. TED spread gives better insight into supply and demand conditions in the market at a given maturity than does the swap spread (which focuses more on the risks in the banking system). MRR-OIS spread: Calculated as the difference between MRR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Bates prepares a partial report about his understanding of bond analytics and submits it to Kahn for feedback. Kahn&#x27;s feedback is shown in Exhibit 2.<\/p><p>Exhibit 2: Kahn&#x27;s Feedback<\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally, I would remove the theory stating that lenders and borrowers influence the shape of the yield curve, and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following term structure model, which calculates the change in the log of the short term interest rate over small increments of time (dt):<\/p><p>dln(rt) = <i>ϴ<\/i>tdt + σdzt<\/p><\/div><\/details><div class=\"qtext\"><p>With regard to the summary of spreads in Exhibit 1, Kahn is least accurate in her:<\/p><\/div>","subj":"fixed"},{"n":72,"q":"Kahn's feedback in Exhibit 2 is most likely to be advocating the exclusion of:","opts":["the segmented markets theory in favor of the Kalotay-Williams-Fabozzi (KWF) model.","the preferred habitat theory in favor of the Vasicek model.","the segmented markets theory in favor of the Cox-Ingersoll-Ross model."],"ans":"A","expl":"The Kalotay-Williams-Fabozzi (KWF) model assumes constant drift, no mean reversion, and constant volatility. The KWF differential equation describes the dynamics of the log of the short interest rate. The segmented markets theory and the preferred habitat theory both state that rates are influenced by lenders and borrowers, but it is the segmented markets theory that proposes that the maturity sectors are independent. The \"b\" term in the Cox-Ingersoll-Ross model is the mean reverting level for the short-term interest rate. (Module 26.3, LOS 26.i)","explhtml":"<p>The Kalotay-Williams-Fabozzi (KWF) model assumes constant drift, no mean reversion, and constant volatility. The KWF differential equation describes the dynamics of the log of the short interest rate. The segmented markets theory and the preferred habitat theory both state that rates are influenced by lenders and borrowers, but it is the segmented markets theory that proposes that the maturity sectors are independent. The &quot;b&quot; term in the Cox-Ingersoll-Ross model is the mean reverting level for the short-term interest rate. (Module 26.3, LOS 26.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 69–72 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Garima Kahn is the head of analytics at Molson Traders. Kahn is onboarding Jason Bates, a new recruit. Kahn provides several research papers and other internal documents for Bates to review.<\/p><p>Bates looks over the section about credit analysis and how OAS is used to value different credit risky bonds. He notes that there is a warning statement that the calculated OAS is sensitive to inputs used in the model, and that care should be taken to use an appropriate level of future interest rate volatility in the model. Bates wants to use a binomial interest rate tree to value bond X. Bond X is a four year bond, extendible by the investor for an additional two years at the same coupon rate.<\/p><p>Bates reads a report prepared by Kahn for the risk management department. Bates underlines the following statement in the report:<\/p><p>The effective duration of a callable bond is greater than the effective duration of a comparable option-free bond. Furthermore, a bond with an embedded at- or near-the-money call option will have a lower one-sided down duration than the one-sided down duration of a comparable option-free bond.<\/p><p>Bates then prepares a summary documenting his understanding of various spread measures as shown in Exhibit 1.<\/p><p>Exhibit 1: Spreads<\/p><p>The swap spread is a useful indicator of credit risk in the markets. It can be used in conjunction with the TED, MRR-OIS, and z-spread to get an in-depth view of the state of the fixed-income markets, as follows:<\/p><p>Z-spread: Calculated as the constant number of basis points that must be added to the implied spot yield curve to make the discounted cash flows of a bond add up to its market price. For a risky bond, the z-spread is a more accurate measure of compensation for credit and liquidity risk than is the swap spread. TED spread: Calculated as the difference between MRR and the yield on a maturity-matched T-bill. TED spread gives better insight into supply and demand conditions in the market at a given maturity than does the swap spread (which focuses more on the risks in the banking system). MRR-OIS spread: Calculated as the difference between MRR and the overnight indexed swap rate. It is considered a good indicator of the risk and liquidity inherent in the money markets.<\/p><p>Bates prepares a partial report about his understanding of bond analytics and submits it to Kahn for feedback. Kahn&#x27;s feedback is shown in Exhibit 2.<\/p><p>Exhibit 2: Kahn&#x27;s Feedback<\/p><p>&quot;…I would suggest one area you could look at improving is the portion on term structure theories. Personally, I would remove the theory stating that lenders and borrowers influence the shape of the yield curve, and that the yield of each maturity sector is determined independently.<\/p><p>I suggest instead that you take a look at the following term structure model, which calculates the change in the log of the short term interest rate over small increments of time (dt):<\/p><p>dln(rt) = <i>ϴ<\/i>tdt + σdzt<\/p><\/div><\/details><div class=\"qtext\"><p>Kahn&#x27;s feedback in Exhibit 2 is most likely to be advocating the exclusion of:<\/p><\/div>","subj":"fixed"},{"n":73,"q":"The price of the futures contract on the equity index as of the inception date, January 18, is closest to:","opts":["1,064.","1,071.","1,078."],"ans":"A","expl":"The futures price can be calculated by growing the spot price at the difference between the continuously compounded risk-free rate and the dividend yield as a continuously compounded rate. The continuously compounded risk-free rate is ln(1.040811) = 4%, so the futures price for a 240-day future is:\n(r-d)t | (0.04-0.02)(240/365)\nFP = S0e | = 1,050e | = 1,064\n(Module 30.2, LOS 30.a)","explhtml":"<p>The futures price can be calculated by growing the spot price at the difference between the continuously compounded risk-free rate and the dividend yield as a continuously compounded rate. The continuously compounded risk-free rate is ln(1.040811) = 4%, so the futures price for a 240-day future is:<\/p><div class=\"tbl\"><table><tr><td><sup>(r-d)t<\/sup><\/td><td><sup>(0.04-0.02)(240/365)<\/sup><\/td><td><\/td><\/tr><tr><td>FP = S0e<\/td><td> = 1,050e<\/td><td> = 1,064<\/td><\/tr><\/table><\/div><p>(Module 30.2, LOS 30.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Derivatives<\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p>Exhibit 1: Swiss Interest Rates<\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50%<\/td><td>0.9996<\/td><\/tr><tr><td>60<\/td><td>0.54%<\/td><td>0.9991<\/td><\/tr><tr><td>90<\/td><td>0.48%<\/td><td>0.9988<\/td><\/tr><tr><td>120<\/td><td>0.65%<\/td><td>0.9978<\/td><\/tr><tr><td>180<\/td><td>0.77%<\/td><td>0.9962<\/td><\/tr><tr><td>210<\/td><td>0.67%<\/td><td>0.9961<\/td><\/tr><tr><td>300<\/td><td>0.82%<\/td><td>0.9932<\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The price of the futures contract on the equity index as of the inception date, January 18, is closest to:<\/p><\/div>","subj":"derivatives"},{"n":74,"q":"Which of the following best describes the movement of the futures price on the 240-day equity index futures contract as the contract moves toward the expiration date?","opts":["The futures price will move toward zero as expiration nears.","The futures price will move toward the (at inception) expected spot price as expiration nears.","The futures price will move toward the spot price as expiration nears."],"ans":"C","expl":"The futures price for a given contract maturity must converge to the spot price as the contract moves toward expiration. Otherwise, arbitrage opportunities would exist.\n(Module 30.2, LOS 30.a)","explhtml":"<p>The futures price for a given contract maturity must converge to the spot price as the contract moves toward expiration. Otherwise, arbitrage opportunities would exist.<\/p><p>(Module 30.2, LOS 30.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p>Exhibit 1: Swiss Interest Rates<\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50%<\/td><td>0.9996<\/td><\/tr><tr><td>60<\/td><td>0.54%<\/td><td>0.9991<\/td><\/tr><tr><td>90<\/td><td>0.48%<\/td><td>0.9988<\/td><\/tr><tr><td>120<\/td><td>0.65%<\/td><td>0.9978<\/td><\/tr><tr><td>180<\/td><td>0.77%<\/td><td>0.9962<\/td><\/tr><tr><td>210<\/td><td>0.67%<\/td><td>0.9961<\/td><\/tr><tr><td>300<\/td><td>0.82%<\/td><td>0.9932<\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of the following best describes the movement of the futures price on the 240-day equity index futures contract as the contract moves toward the expiration date?<\/p><\/div>","subj":"derivatives"},{"n":75,"q":"Sixty days after the inception of the futures contract on the equity index, Norris has suggested an arbitrage strategy. Regarding the appropriateness of the strategy, the strategy is best described as:","opts":["appropriate since the futures contract is underpriced.","inappropriate since the futures contract is overpriced.","inappropriate since the futures contract is properly priced in the market."],"ans":"B","expl":"First, calculate the continuously compounded risk-free rate as ln(1.040811) = 4% and then calculate the theoretically correct futures price as follows:\n(r-d)t | (0.04 – 0.02)(180/365)\nFP = S0e | = 1,015e | = 1,025\nThen, compare the theoretical price to the observed market price: 1,035 – 1,025 = 10. The futures contract is overpriced. To take advantage of the arbitrage opportunity, the investor should sell the (overpriced) futures contract and buy the underlying asset (the equity index) using borrowed funds. Norris has suggested the opposite.\n(Module 30.2, LOS 30.a)","explhtml":"<p>First, calculate the continuously compounded risk-free rate as ln(1.040811) = 4% and then calculate the theoretically correct futures price as follows:<\/p><div class=\"tbl\"><table><tr><td><sup>(r-d)t<\/sup><\/td><td><sup>(0.04 – 0.02)(180/365)<\/sup><\/td><td><\/td><\/tr><tr><td>FP = S0e<\/td><td> = 1,015e<\/td><td> = 1,025<\/td><\/tr><\/table><\/div><p>Then, compare the theoretical price to the observed market price: 1,035 – 1,025 = 10. The futures contract is overpriced. To take advantage of the arbitrage opportunity, the investor should sell the (overpriced) futures contract and buy the underlying asset (the equity index) using borrowed funds. Norris has suggested the opposite.<\/p><p>(Module 30.2, LOS 30.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity index that will expire 240 days from today. The closing price as of yesterday, January 17, for the equity index was 1,050. The expected dividends from the index yield 2% (continuously compounded annual rate). The continuously compounded risk-free rate is 4%. Norris decides that this equity index futures contract is the appropriate hedge for her client&#x27;s portfolio and enters into the contract.<\/p><p>Sixty days after entering into the futures contract, the equity index reached a level of 1,015. The futures contract that Norris purchased is now trading on the Chicago Mercantile Exchange for a price of 1,035. Interest rates have not changed. After performing some calculations, Norris calls her client to let him know of an arbitrage opportunity related to his futures position. Over the phone, Norris makes the following comments to her client:<\/p><p>&quot;We have an excellent opportunity to earn a riskless profit by engaging in arbitrage using the equity index, risk-free assets, and futures contracts. My recommended strategy is as follows: We should sell the equity index short, buy the futures contract, and pay any dividends occurring over the life of the contract. By pursuing this strategy, we can generate profits for your portfolio without incurring any risk.&quot;<\/p><p>Sixty days ago when the Swiss franc/euro exchange rate was SF1.12 per euro, Witkowski entered into (on behalf of a client) a 1-year, quarterly settlement euro-Swiss franc swap paying €1 million at inception. The fixed-for-fixed swap had the franc fixed rate at 0.96% and the euro fixed rate at 0.78%. Currently, the euro position has a value of €1.0014 per €1 notional and the exchange rate is SF 1.10 per euro. Exhibit 1 provides information about Swiss interest rates.<\/p><p>Exhibit 1: Swiss Interest Rates<\/p><div class=\"tbl\"><table><tr><td>Term<\/td><td>Rate<\/td><td>DF<\/td><\/tr><tr><td>30<\/td><td>0.50%<\/td><td>0.9996<\/td><\/tr><tr><td>60<\/td><td>0.54%<\/td><td>0.9991<\/td><\/tr><tr><td>90<\/td><td>0.48%<\/td><td>0.9988<\/td><\/tr><tr><td>120<\/td><td>0.65%<\/td><td>0.9978<\/td><\/tr><tr><td>180<\/td><td>0.77%<\/td><td>0.9962<\/td><\/tr><tr><td>210<\/td><td>0.67%<\/td><td>0.9961<\/td><\/tr><tr><td>300<\/td><td>0.82%<\/td><td>0.9932<\/td><\/tr><tr><td>360<\/td><td>1%<\/td><td>0.9901<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sixty days after the inception of the futures contract on the equity index, Norris has suggested an arbitrage strategy. Regarding the appropriateness of the strategy, the strategy is best described as:<\/p><\/div>","subj":"derivatives"},{"n":76,"q":"Sixty days after inception, the value of the currency swap to Witkowski's client is closest to:","opts":["–€19,633.","–€141,584.","–€1,021,033."],"ans":"A","expl":"Based on the exchange rate at initiation, the notional principals were €1,000,000 and SF 1,120,000. Sixty days after initiation, the remaining settlement days are 30, 120, 210, and 300 days into the future. The value of the Swiss franc position (per 1 SF notional) is calculated as: (0.0096 / 4) × (0.9996 + 0.9978 + 0.9961 + 0.9932) + 1 × 0.9932 = SF 1.0028. For the notional principal of SF 1,120,000, the value is SF 1,123,136. Based on the current exchange rate, this translates into (1,123,136 / 1.10) euros or €1,021,033.\nThe euro position value is given as €1.0014 per €1 notional. For €1 million notional, this translates into a value of €1,001,400. Because Witkowski's client paid the euro notional at initiation, they will receive the euros and have a value of €1,001,400 − €1,021,033 = –€19,633. (Module 30.7, LOS 30.f)","explhtml":"<p>Based on the exchange rate at initiation, the notional principals were €1,000,000 and SF 1,120,000. Sixty days after initiation, the remaining settlement days are 30, 120, 210, and 300 days into the future. The value of the Swiss franc position (per 1 SF notional) is calculated as: (0.0096 / 4) × (0.9996 + 0.9978 + 0.9961 + 0.9932) + 1 × 0.9932 = SF 1.0028. For the notional principal of SF 1,120,000, the value is SF 1,123,136. Based on the current exchange rate, this translates into (1,123,136 / 1.10) euros or €1,021,033.<\/p><p>The euro position value is given as €1.0014 per €1 notional. For €1 million notional, this translates into a value of €1,001,400. Because Witkowski&#x27;s client paid the euro notional at initiation, they will receive the euros and have a value of €1,001,400 − €1,021,033 = –€19,633. (Module 30.7, LOS 30.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 73–76 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Michelle Norris, CFA, manages assets for individual investors in the United States as well as in other countries. Norris limits the scope of her practice to equity securities traded on U.S. stock exchanges. Her partner, John Witkowski, handles any requests for international securities. Recently, one of Norris&#x27;s wealthiest clients suffered a substantial decline in the value of his international portfolio. Worried that his U.S. allocation might suffer the same fate, he has asked Norris to implement a hedge on his portfolio. Norris has agreed to her client&#x27;s request and is currently in the process of evaluating several futures contracts. Her primary interest is in a futures contract on a broad equity in
