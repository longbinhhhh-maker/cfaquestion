<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following statements regarding indexes for alternative investments\nis most accurate?", "opts": ["Hedge funds determine whether their results will be included in an index.", "Commodity indexes consist of a market-weighted basket of one or more specific commodities", "Commodity index returns are based on changes in the prices of the underlying commodities"], "ans": "A", "expl": "investors. As a result, rather than index providers determining the constituents, the constituents determine the\nindex.\nB. Incorrect. Commodity indexes consist of futures contracts. There is no market weighting mechanism\nC. Incorrect. Commodity indexes are based upon futures contracts, not prices of the underlying commodities\nthemselves.\nSecurityMarketIndexes\n· describe indexes representing alternative investments\nDiscuss\nFilter", "qhtml": null}, {"n": 2, "q": "Which of the following transactions poses the risk of losing the greatest dollar\namount?", "opts": ["Selling a put with a strike price of $15 for $0.90", "Buying a call with a strike price of $15 for $11.25", "Buying a put with a strike price of $37.50 for $12.75"], "ans": "A", "expl": "A. Correct because the largest dollar amount loss out of the three answer options occurs for the case of selling a put\nwith a strike price of $15 for $0.90: The profit to the put seller is I = -Max(0,X - ST) + p0, where X is the exercise\nprice, S is the price of the underlying at expiration, and po is the put price or premium. The put seller, like the\ninsurer, has a limited gain and a loss that is larger the lower the value of the underlying. Therefore, the maximum\nloss to the put seller occurs when S = 0, in which case the profit to the seller is -Max(0,$15 - 0) + $0.90 = -$15 +\n$0.90 = -$14.10 which is equal to a loss of $14.10. This loss is greater than the loss of the other two responses.\nB. Incorrect because the largest dollar amount loss out of the three answer options is $14.10, which occur apturing only\nsmall changes in the value of the underlying.\nC. Correct because VaR does not tell the maximum loss. The maximum loss is the entire equity of an organization or\nthe entire value of a portfolio, but the statistics used to estimate VaR can be used to gauge average extreme\nlosses. Conditional VaR or CVaR is a common tail loss measure, defined as the weighted average of all loss\noutcomes in the statistical distribution that exceed the VaR loss.\nIntroduction to Risk Management\n· describe methods for measuring and modifying risk exposures and factors to consider in choosing among the\nmethods\nDiscuss\nFilter", "qhtml": null}, {"n": 5, "q": "With respect to fintech applications, the instantaneous transfer of collateral in the\nevent of default is an example of:", "opts": ["tokenization.", "smart contracts.", "high-frequency trading."], "ans": "B", "expl": "A. Incorrect because tokenization refers to the process of representing ownership rights to physical assets on a\nblockchain or distributed ledger.\nB. Correct because DLT has the potential to accommodate 'smart contracts,' which are computer programs that\nsmart contract use are the automatic execution of contingent claims for derivatives and the instantaneous transfer\nof collateral in the event of default.\nC. Incorrect because high-frequency trading (HFT) is a form of algorithmic trading that makes use of vast quantities\nof granular financial data (tick data, for example) to automatically place trades when certain conditions are met.\nIntroduction to Digital Assets\n·describe financial applications of distributed ledger technology\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 6, "q": "Which of the following is an example of an event-driven hedge fund strategy?", "opts": ["Buying the stock of a company that is spinning off a subsidiary", "Selling stock options to earn premiums and benefit from limited market movements", "Taking long positions in /zUchmHQCvCG9u7di0YAAIB/hJOTU1BQENoB/o6IiIjAwECCTDD8WWPHjkUjAAAAAEFNMAAAAAAAgmAAAAAAAATBAAAAAAAIggEAAAAAEAQDAAAAACAIBgAAAAB4l/4fVjA7cBvdieMAAAAASUVORK5CYII=\" alt=\"exhibit\">This forecast table is best described as a:"}, {"n": 12, "q": "Which of the following statements concerning financial regulatory bodies is least\naccurate? Financial regulatory bodies:", "opts": ["act to level the playing field for market participants.", "define minimum standards of competence for agents.", "require that regulated firms maintain optimum levels of capital."], "ans": "C", "expl": "A. Incorrect. Financial regulators act to level the playing field for market participants as in the case of regulation\nconcerning insider trading.\nB. Incorrect. Financial regulators help define minimum standards of competence for agents (e.g., the GIPS standards\nfrom CFA Institute).\nC. Correct. Financial regulators impose minimum levels of capital that apply across the board to all regulated firms-\nnot the optimum level, which is firm specific.\nMarket Organization and Structure\ndescribe objectives of market regulation\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 13, "q": "According to the size effect anomaly:", "opts": ["equities with low P/Es tend to outperform equities with high P/Es.", "equities with above-average dividend yields tend to outperform equities with below-average dividend yields.", "equities of small-cap companies tend to outperform equities of large-cap companies on a risk adjusted basis."], "ans": "C", "expl": "A. Incorrect because the size effect results from the observation that equities of small-cap companies tend to\nthe value effect.\nB. Incorrect because the size effect results from the observation that equities of small-cap companies tend to\noutperform equities of large-cap companies on a risk adjusted basis. The outperformance of equities with above-\naverage dividend yields describes the value effect.\noutperform equities of large-cap companies on a risk adjusted basis.\nMarketEfficiency\n·describe market anomalies\nDiscuss\nFilter\ni\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 14, "q": "Which of the following is most likely a consequence of the overconfidence bias?\nAn investor who:", "opts": ["overestimates downside risks", "underestimates expected returns", "holds a poorly diversified portfolio"], "ans": "C", "expl": "A. Incorrect because as a result of overconfidence bias, investors may underestimate, not overestimate, downside\nrisks.\nB. Incorrect because as a result of overconfidence bias investors may overestimate, not underestimate, expected\nreturns.\nC. Correct because as a result of overconfidence bias, investors may underestimate risks and overestimate\nexpected returns and/or hold poorly diversified portfolios, which may result in significant downside risk.\nThe Behavioral Biases of Individuals\ndiscuss commonly recognized behavioral biases and their implications for financial decision making\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 15, "q": "Which of the following statements is least accurate concerning differences in the\npricing of forwards and futures?", "opts": ["Interest rate volatility can explain pricing differences.", "Pricing differences can arise if futures prices and interest rates are uncorrelated.", "Differences in the pattern of cash flows of forwards and futures can explain pricing differences."], "ans": "B", "expl": "A. Incorrect. The statement is true.\nB. Correct. If futures prices and interest rates are uncorrelated, the prices of forwards and futures will be identical.\nC. Incorrect. The statement is true.\nPricing and Valuation of Futures Contracts\nexplain why forward and futures prices differ\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 16, "q": "Which of the following sections of the IPS most likely explains how to respond\nto various contingencies?", "opts": ["Procedures", "Investment guidelines", "Evaluation and review"], "ans": "A", "expl": "A. Correct because the procedures section explains the steps to take to keep the IPS current and the procedures to\nfollow to respond to various contingencies.\nB. Incorrect because the investment guidelines section provides information about how policy should be executed\nand on specific types of assets excluded from investment, if any.\nC. Incorrect because this evaluation and review section provides guidance on obtaining feedback on investment\nresults.\nBasics of Portfolio Planning and Construction\ndescribe the major components of an IPS\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 17, "q": "Assuming the beginning value of the float-adjusted\nmarket-capitalization-weighted equity index is 100, the ending value is closest to:", "opts": ["102.06.", "102.68.", "103.80."], "ans": "A", "expl": "A. Correct. In float-adjusted market-capitalization weighting, the weight on each constituent security is determined by\nadjusting its market capitalization for its market float. As the following computations show, the ending value of the\nindex equals 102.06 (322,500/316,000).\nEnding\nPercent of\nBeginning\nFloated\nShares in\nBeginning of\nFloat Adj.\nEnd of\nAdjusted\nShares\nMarket\nShares in Period Price\nMarket Cap\nPeriod\nMarket Cap\nStock\nOutstanding\nFloat\nIndex\n($)\nPrice ($)\n($)\n(1)\n(2)\n(1) ×(2) =\n(4)\n(3) × (4) = (5)\n(6)\n(3) × (6)\nCalculation\n(3)\nA\n5,000\n90\n4,500\n40\n180,000\n45\n202,500\nB\n2,000\n100\n2,000\n68\n136,000\n60\n120,000\nQuestion17 of 90\nSolution\nA. Correct. In float-adjusted market-capitalization weighting, the weight on each constituent security is determined by\nadjusting its market capitalization for its market float. As the following computations show, the ending value of the\nindexequals102.06(322,500/316,000).\nEnding\nPercent o me that borrowing and lending\nat the risk-free rate is possible.\nB. Incorrect because the CAPM assumes that investors are risk-averse, utility-maximizing, rational individuals. Risk\naversion means that investors expect to be compensated for accepting risk.\nC. Incorrect because the CAPM assumes that there are many investors and that no investor is large enough to\ninfluence prices. Thus, investors are price takers, and we assume that security prices are unaffected by investor\ntrades.\nPortfolio Risk and Return: Part II\nexplain the capital asset pricing model (CAPM), including its assumptions, and the security market line (SML)\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 19, "q": "Which of the following factors is most appropriate to consider when determining\na company's risk tolerance?", "opts": ["The company's positioning within its industry", "The beliefs of the company's board members", "The short-term stability of the market environment"], "ans": "A", "expl": "A. Correct because both the board's and investors' expectations are usually developed in the context of how a\ncompany is positioned in its industry.\nB. Incorrect because there are other factors that should not determine risk tolerance, but in many cases they do.\nPersonal motivations, beliefs, and agendas of board members (the agency problem); company size; whether the\nmarket environment seems stable; short-term pressures; and management compensation often affect risk\ntolerance in ways that might not be in line with the owners' best interests.\nPersonal motivations, beliefs, and agendas of board members (the agency problem); company size; whether the\nmarket environment seems stable; short-term pressures; and management compensation often affect risk\ntolerance in ways that might not be in line with the owners' best interests.\nIntroduction to Risk Management\n· explain how risk tolerance affects risk management\nDiscuss\nFilter", "qhtml": null}, {"n": 20, "q": "Which of the following contingency provisions in a bond most likely benefits the\nissuer?", "opts": ["Put provision", "Call provision", "Conversion to common shares"], "ans": "B", "expl": "A. Incorrect because a put provision gives the bondholders (the borrower) the right to sell the bond back to the issuer\nat a pre-determined price on specified dates in the event of interest rates rise.\nB. Correct because a call provision gives the issuer the right to redeem all or part of the bond before the specified\nmaturity date to protect the issuer against a decline in interest rates. Therefore, it benefits the issuer and provides\na lower future funding cost.\nC. Incorrect because a conversion provision gives the bondholder (the borrower) the right to exchange the bond for a\nspecified number of common shares in the issuing company in case of share price appreciation.\nFixed-lncome Cash Flows and Types\nthat benefit issuers and investors\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 21, "q": "Debtor-in-possession (DIP) financing refers to financing for firms:", "opts": ["already in bankruptcy.", "at the risk of bankruptcy without additional financing.", "with strong financial positions and promising growth prospects."], "ans": "A", "expl": "A. Correct because several distressed debt funds focus on debtor-in-possession (DiP) financing, which provides\noperating funds for firms already in bankruptcy.\nB. Incorrect because several distressed debt funds focus on debtor-in-possession (DiP) financing, which provides\noperating funds for firms already in bankruptcy.\nC. Incorrect because several distressed debt funds focus on debtor-in-possession (DiP) financing, which provides\noperating funds for firms already in bankruptcy.\nInvestments in Private Capital: Equity and Debt\n· explain features of private debt and its investment characteristics\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 22, "q": "An investor allocates $10 million at the beginning of the year to a hedge fund\ncharging a management fee of 2% and an incentive fee of 20% with a 6% hard hurdle\nrate. At year-end the value of the investment is $11.8 million. The incentive fee is\ncalculated net of the management fee and the management fee is based on the\nyear-end value. The net-of-fees return the investor earned is closest to:", "opts": ["13.24%.", "13.71%.", "13.93%."], "ans": "B", "expl": "A. Incorrect because 13.24% results from calculating the incentive fee independently from the management fee as\nopposed to net of the management fee:\nPortfolio gain = year-end value - beginning value = $11.8 million - $10 million = $1.8 million\nHurdle amount = beginning value × hurdle % = $10 million × 6% = $600,000\nManagement fee = year-end value x management fee % = $11.8 million x 2% = $236,000\nIncentive fee = (portfolio gain - hurdle amount) × incentive fee %\n= ($1.8 million - $600,000) × 20% = $240,000\nTotal fees = management fee + incentive fee = $236,000 + $240,000 = $476,000\nNet-of-fees return = (portfolio gain - total fees)/beginning value\n=($1.8 million - $476,000)/$10 million = 13.24%\nQuestion 22 of 90\nB. Correct because the net-of-fees return to the investor at year-end is closest to 13.71%.\nPortfolio gain = year-end value - beginning value = $11.8 million - $10 million = $1.8 million\nHurdle amount = beginning value × hurdle % = $10 million x 6% = $600,000\nManagement fee = year-end value × management fee % = $11.8 million x 2% = $236,000\nIncentive fee = (portfolio gain - hurdle amount - management fee) x Incentive fee %\n= ($1.8 million - $600,000 - $236,000) × 20% = $192,800\nTotal fees = management fee + incentive fee = $236,000 + $192,800 = $428,800\nNet-of-fees return = (portfolio gain - total fees)/beginning value\n=($1.8 million - $428,800)/$10 million = 13.71%\nthe beginning-of-period value:\nPortfolio gain = year-end value -beginning value = $11.8 million - $10 million = $1.8 million\nHurdle amount = ending value × hurdle % = $11.8 million x 6% = $708,000\nManagement fee = year-end value x management fee % = $11.8 million x 2% = $236,000\nIncentive fee = (portfolio gain - hurdle amount - management fee) x incentive fee %\n= ($1.8 million - $708,000 - 236,000) × 20% = $171,200\nTotal fees = management fee + incentive fee = $236,000 + $171,200 = $407,200\nQuestion22 of 90\n= ($1.8 million - $600,000 - $236,000) × 20% = $192,800\nTotal fees = management fee + incentive fee = $236,000 + $192,800 = $428,800\nNet-of-fees return = (portfolio gain - total fees)/beginning value\n= ($1.8 million - $428,800)/$10 million = 13.71%\nC. Incorrect because 13.93% results from calculating the hurdle amount based on the end-of-period value instead of\nthe beginning-of-period value:\nPortfolio gain = year-end value -beginning value = $11.8 million - $10 million = $1.8 million\nHurdle amount = ending value × hurdle % = $11.8 million × 6% = $708,000\nManagement fee = year-end value × management fee % = $11.8 million × 2% = $236,000\nIncentive fee = (portfolio gain - hurdle amount - management fee) x incentive fee %\n= ($1.8 million - $708,000 - 236,000) × 20% = $171,200\nTotal fees = management fee + incentive fee = $236,000 + $171,200 = $407,200\nNet-of-fees return = (portfolio gain - total fees)/beginning value\n= ($1.8 million - $407,200)/$10 million = 13.93%\nAlternative Investment Performance and Returns\ncalculate and interpret alternative investment returns both before and after fees", "qhtml": null}, {"n": 23, "q": "For non-amortizing, non-mortgage asset-backed securities, the lockout period\nmost likely represents when:", "opts": ["investors start receiving repayments.", "overcollateralization begins to be reduced.", "repaid principal is reinvested in loans of equal principal."], "ans": "C", "expl": "A. Incorrect. When the lockout period is over, any principal that is repaid will not be used to reinvest in new loans but\nwill instead be distributed to the bond classes.\nB. Incorrect. Overcollateralization refers to a reserve account, often an excess spread account.\nC. Correct. The lockout period, or revolving period, is the period during which the principal repaid is reinvested to\nthat is repaid will not be used to reinvest in new loans but will instead be distributed to the bond classes.\nOvercollateralization refers to a reserve account, often an excess spread account.\nAsset-Backed Security (ABS) Instrument and Market Features\ndescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of\neach type\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 24, "q": "Which of the following statements regarding rebalancing and reconstitution of\nan index is most accurate?", "opts": ["Market-capitalization-weighted indexes require frequent rebalancing.", "Reconstitution can dramatically affect prices of both current and prospective constituents.", "Reconstitution is part of index management that reduces the need for rebalancing."], "ans": "B", "expl": "A. Incorrect because market-capitalization-weighted indexes largely rebalance themselves. An equal-weighted index\nis one that needs frequent rebalancing.\nB. Correct. Reconstitution is the process in which index providers review whether securities are retained, removed, or\nadded. Prior to the index's reconstitution date, portfolio managers buy stocks they think will be added to an index\nC. Incorrect because reconstitution and rebalancing are both part of index management and create turnover of an\nindex. Besides, reconstitution is a part of the rebalancing cycle.\nSecurity Market Indexes\ndescribe rebalancing and reconstitution of an index\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 25, "q": "The average (annual) modified duration of the portfolio is closest to:", "opts": ["5.  Co = Po + So - X/(1 + r)T\" which implies that a “long call =\nlong put, long asset, short bond\"\nC. Incorrect because the put-call parity relationship implies Co = Po + So - X/(1 + r)T\" which implies that a “long call =\nlong put, long asset, short bond\". So, a long call can be replicated by creating a portfolio of a long (not short) put, a\nlong (not short) asset, and a short (not long) bond.\nOption Replication Using Put-Call Parity\nexplain put-call parity for European options\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 27, "q": "Assuming annual interest payments, the G-spread is closest to:", "opts": ["149 basis points.", "193 basis points.", "300 basis points."], "ans": "B", "expl": "A. Incorrect because the yield spread in basis points over an actual or interpolated government bond is known as the\nG-spread. This answer is only the yield of the US government bond Corporate Bond. 101 = 2 / (1 + r) + 102 / (1 +\nr)?. r = 1.498% or 149 basis points.\nB. Correct because the yield spread in basis points over an actual or interpolated government bond is known as the\nG- spread. Using the data provided, the yield for the US Government Bond is found by 101 = 2 / (1 + r) + 102 / (1 +\nr)?. r = 1.49%. While the yield on the corporate bond is 103 = 5 / (1 + r) + 105 / (1 + r)2. r = 3.42%. G-spread = 3.42\n- 1.49 = 1.93 or 193 basis points.\nC. Incorrect because the yield spread in basis points over an actual or interpolated government bond is known as the\nG-spread. This answer incorrectly uses the difference between the coupon rates 5.00 - 2.00 = 3.00 or 300 basis\npoints.\nYield and Yield Spread Measures for Fixed-Rate Bonds\nIcompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAADvCAIAAAB5fc5MAADQd0lEQVR42uydZ5gU1da2d3VVdc49OTMMQ45DkpyjJEUOkhFzREWP6SiY9ZhFBSOoIBIGJAdJAwKSmQGGyUxOPZ1zpe/H+q Investment Features, Methods, and Structures\n· describe investment ownership and compensation structures commonly used in alternative investments\nDiscuss\nFilter\n1\nDiscussion", "qhtml": null}, {"n": 29, "q": "The put premium is closest to:", "opts": ["0.0273 USD/EUR.", "0.0727 USD/EUR.", "0.0750 USD/EUR."], "ans": "B", "expl": "A. Incorrect because this answer mistakenly flips the strike price and the forward price in the equation po = co + [X -\nFo(T)] / (1 + r)T. This incorrect answer is calculated as Po = 0.0500 + (1.2000 - 1.2250) / (1 + 0.05)2 = 0.0273.\nB. Correct because put-call forward parity can be expressed as:\nF(T(1 + r)-T + po = Co + X(1 + r)-T,\nwhere F。(T)(1 + r)-T is the present value of F。(T) discounted at the risk-free rate, Po is the price of the put option on\nthe underlying at t = 0, co is the price of the call option on the underlying at t = 0, X(1 + r)-T is a risk-free bond that\npays the amount of the exercise price X at t = T.\nIn other words, under put-call parity, at t = 0 the price of the long underlying asset plus the long put must equal the\nprice of the long call plus the risk-free asset.\nQuestion 29 of 90\nB. Correct because put-call forward parity can be expressed as:\nF(T)(1 + r)-T + po = co + X(1 + r)-T,\nwhere F。(T)(1 + r)-T is the present value of F。(T) discounted at the risk-free rate, Po is the price of the put option on\nthe underlying at t = 0, co is the price of the call option on the underlying at t = 0, X(1 + r)-T is a risk-free bond that\npays the amount of the exercise price X at t = T.\nIn other words, under put-call parity, at t = 0 the price of the long underlying asset plus the long put must equal the\nprice of the long call plus the risk-free asset.\nRearranging the formula yields:\nF(T)(1 + r)-T -x(1 + r)-T = co - Po\n[F(T) - X] / (1 + r)T = co - Po\nPo = Co + [X- Fo(T)] / (1 + r)T\nSubstituting in yields:\nPo = 0.0500 + (1.2250 - 1.2000) / (1 + 0.05)2 = 0.0727.\nC. Incorrect because this fails to take the pr  risks of derivative instruments\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 31, "q": "If a stock is purchased on margin where the minimum margin requirement is\n35%, the maximum leverage ratio is closest to:", "opts": ["1.54.", "1.86.", "2.86."], "ans": "C", "expl": "A. Incorrect because the value of the borrowing is used instead of equity. Accordingly, leverage ratio = 1/borrowing\nratio; 0r = 1/(1 - 0.35) = 1/0.65 = 1.538 ~ 1.54.\nB. Incorrect because leverage ratio = 1/initial margin requirement, but it is wrongly calculated as (1 - 0.35)/0.35 =\n1.857 ~ 1.86.\nC. Correct because the leverage ratio is the ratio of the value of the position to the value of the equity investment in\nit. Leverage ratio = 1/initial margin requirement; or = 1/0.35 = 2.857 ~ 2.86.\nMarket Organization and Structure\ncalculate and interpret the leverage ratio, the rate of return on a margin transaction, and the security price at which\nthe investor would receive a margin call\nDiscuss θ\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 32, "q": "An investor analyzes the stock market of a specific country and discovers that\nthe stock prices are very slow to reflect new information. The investor can best profit\nfrom this situation using a(n):", "opts": ["active fund.", "passive fund.", "low cost approach."], "ans": "A", "expl": "active investment strategies (such as those used by active funds) to achieve superior risk-adjusted returns as\ncompared with passive investment strategies (such as those used by equity index funds or passive funds).\nB. Incorrect. An efficient market is a market in which asset prices reflect new information quickly. Conversely, an\ninefficient market reflects new information slowly. In a very inefficient market, as implied in this situation,\nopportunities may exist for active investment strategies (such as those employed by active funds) to achieve\nindex funds or passivefunds).\nC. Incorrect. An efficient market is a market in which asset prices reflect new information quickly. Conversely, an\ninefficient market reflects new information slowly. In a very inefficient market, as implied in this situation,\nopportunities may exist for active investment strategies (such as those employed by active funds) to achieve\nsuperior risk-adjusted returns despite higher costs as compared with passive investment strategies (such as those\nemployed by equity index funds or passive funds).\nMarket Efficiency\n· describe market efficiency and related concepts, including their importance to investment practitioners", "qhtml": null}, {"n": 33, "q": "The option-free bonds issued by ALS Corp. are currently priced at 108.50.\nBased on a portfolio manager's valuation model, a 1 bp increase in interest rates will\nresult in the bond price falling to 108.40, whereas a 1 bp decrease in interest rates will\nresult in the bond price rising to 108.59. The price value of a basis point (PVBP) for\nthe bonds is closest to:", "opts": ["0.088.", "0.095.", "0.190."], "ans": "B", "expl": "A. Incorrect because the PVBP is calculated using the incorrect formula:\n108.59-108.40\n= 0.088\n2x108.50x0.01\nB. Correct. The bond's PVBP is computed using:\n(+Ad)-(-Ad)\n108.59-108.40\n2= 0.095\nPVBP=\n2\nC. Incorrect because the PVBP is calculated by omitting the 2 in the denominator:\n108.59 - 108.40 = 0.190\nYield-Based Bond Duration Measures and Properties\ndefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP)\nDiscuss\nFilter", "qhtml": null}, {"n": 34, "q": "Over-the-counter derivatives markets most likely have a lower degree of:", "opts": ["privacy than exchange-traded derivatives markets.", "flexibility than exchange-traded derivatives markets.", "transparency than exchange-traded derivatives markets."], "ans": "C", "expl": "A. Incorrect because exchange markets are said to have transparency, which means that full information on all\ntransactions is disclosed to exchanges and regulatory bodies. Transparency means a loss of privacy: National\nregulators can see what transactions have been done. Many transactions in OTC markets will retain a degree of\nexchange-traded derivatives markets.\nB. Incorrect because exchange-traded derivatives are standardized and standardization means a loss of flexibility. By\ncontrast, OTC markets will remain considerably more flexible than the exchange-listed markets.\nand more privacy than exchange-traded derivatives markets.\nDerivative Instrument and Derivative Market Features\n· describe the basic features of derivative markets, and contrast over-the-counter and exchange-traded derivative\nmarkets\nDis\nFilter", "qhtml": null}, {"n": 35, "q": "The sustainable growth rate is closest to:", "opts": ["3.4%.", "5.2%.", "6.2%."], "ans": "C", "expl": "A. Incorrect because it assumes that the sustainable growth rate = Dividend Payout Ratio x ROE instead of retention\nrate x ROE. The calculation becomes 35% x (8% x 1.2) = 35% x 9.6% = 0.0336 = 3.4%.\nB. Incorrect because it assumes that the sustainable growth rate = Retention Rate x ROA instead of retention rate x\nROE. The calculation becomes (1 - 35%) × 8% = 65% x 8% = 0.052 = 5.2%.\nC. Correct because the sustainable growth rate = Retention rate x ROE, where ROE = ROA x Leverage, and the\nretention rate = (1 - Payout Ratio). The calculation becomes (1 - 35%) × (8% x 1.2) = 0.65 x 9.6% = 0.0624 ~\n6.2%.\nEquity Valuation: Concepts and Basic Tools\nn ba", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAD7CAIAAADhOo7BAABecUlEQVR42u3dd0BT1/8+8HOzCCHsDSKKIoIIinvvDVJ33dVW3KvuUVete+/Ruq0DUYYLUat1IoKAimxk7x0CJCT398f5en8pILXVtn7a5/VXuNzc3JzcJE/OfZ9zmbdv3xIAAAAAgP8SpqysDK0AAAAAAP8pPDQBAAAAACAEAwAAAAD8ywn4fD5aAQAAAAD+UxiWZdEKAAAAAEBQDgEAAAAAgBAMAAAAAIAQDAAAAACAEAwAAAAAgBAMAAAAAIAQ/GHUajUmrAAAAACA/1YIzsvLKykpwQsDAAAAACiHAAAAAABACAYAAAAAQAgGAAAAAEAIBgAAAABACAYAAAAA+FQhOD hich of the following statements about alternative investments' compensation\nstructures is most accurate?", "opts": ["A hurdle rate protects clients from paying twice for the same performance", "The management fee for a private equity fund is based on committed capital until fully drawn", "The management fee is earned only after the fund achieves a return known as a high-water mark"], "ans": "B", "expl": "A. Incorrect because it is a high-water mark (not a hurdle rate) that protects clients from paying twice for the same\nperformance. The hurdle rate is a minimum rate of return, typically 8%, that the GP must exceed in order to earn\nthe performance fee.\nB. Correct because until the committed capital is fully drawn down and invested, the management fee for a private\nequity fund is based on committed capital, not invested capital.\nC. Incorrect because performance fee (not a management fee) is earned only after the fund achieves a return known\nas a hurdle rate (not a high-water mark). The hurdle rate is a minimum rate of return, typically 8%, that the GP\nmust exceed in order to earntheperformancefee.\nAlternative Investment Features, Methods, and Structures\n· describe investment ownership and compensation structures commonly used in alternative investments\nDiscuss\nFilter\nDiscussion\nWhat doyou want to discuss... (required)", "qhtml": null}, {"n": 37, "q": "Which of the following statements about endowments and foundations is most\naccurate?", "opts": ["Most endowments and foundations have relatively short time horizons.", "Endowments typically allocate a sizable portion of their assets in alternative investments.", "Foundations are funds of non-profit institutions that help the institutions provide designated services."], "ans": "B", "expl": "A. Incorrect because most foundations and endowments are established with the intent of having perpetual lives.\nB. Correct because endowments and foundations typically allocate a sizable portion of their assets in alternative\ninvestments.\nC. Incorrect because foundations are grant-making entities, while endowments are funds of non-profit institutions that\nhelp the institutions provide designated services.\nPortfolio Management: An Overview\ndescribe types of investors and distinctive characteristics and needs of each\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 38, "q": "If the expected return on the market portfolio is 6% and the risk-free rate is 2%,\nthe expected return of a security with a beta of 1.25 is closest to:", "opts": ["5.00%.", "7.00%.", "9.50%."], "ans": "B", "expl": "A. Incorrect. It fails to add the risk-free rate: 1.25 × (6% - 2%) = 5.00%.\nB. Correct. The capital asset pricing model posits that the expected return of a security is E(R) = Rf + β;[E(Rm) - R]\nwhere Rf is the risk-free rate, Rm is the return on the market portfolio, and β is the beta of the security: 2% + 1.25 x\n(6% - 2%) = 7.00%.\nC. Incorrect. It fails to subtract the risk-free rate from the market portfolio's expected return: 2% + 1.25 x (6%) =\n9.50%.\nPortfolio Risk and Return: Part ll\ncalculate and interpret the expected return of an asset using the CAPM\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 39, "q": "A hedge fund with $225 million of initial capital charges a management fee of\n1% and an incentive fee of 10%. The management fee is based on assets under\nmanagement at year-end, and the incentive fee is calculated independently from the\nmanagement fee. Assuming the fund earns a 15% return at year-end, total fees earned\nby the hedge fund during the year are closest to:", "opts": ["$5.63 million.", "$5.70 million.", "$5.96 million."], "ans": "C", "expl": "A. Incorrect. $5.63 million results from calculating the management fee based on assets under management at the\nbeginning of the period, rather than the end of the period:\nYear-end value = $225 millionx 1.15 = $258.75 million\nManagement fee = Beginning value x Management fee %\n= $225 million × 1% = $2.25 million\nIncentive fee = (Year-end value - Beginning value) × Incentive fee %\n= ($258.75 million - $225 million) × 10% = $3.375 million\nTotal fees = Management fee + Incentive fee\n= $2.25 million + $3.375 million = $5.625 million = $5.63 million\nB. Incorrect. $5.70 million represents the total fees earned if the incentive fee was calculated net of the management\nfee as opposed to independently from the management fee:\nQuestion39 of 90\nfee as opposed to independently from the management fee:\nYear-end value = $225 million × 1.15 = $258.75 million\nManagement fee = Year-end value x Management fee %\n= $258.75 million x 1% = $2.5875 million\nIncentive fee = (Year-end value - Beginning value - Management fee) x Incentive fee %\n($258.75 million - $225 million - $2.5875 million) × 10% = $3.1163 million\nTotal fees = Management fee + Incentive fee\n= $2.5875 million + $3.1163 million = $5.7038 million = $5.70 million\nYear-end value = $225 million x 1.15 = $258.75 million\nManagement fee = Year-end value x Management fee %\n= $258.75 million × 1% = $2.5875 million\nIncentive fee = (Year-end value - Beginning value) x Incentive fee %\n=($258.75 million - $225 million) × 10% = $3.375 million\nTotal fees = Management fee + Incentive fee\n= $2.5875 million + $3.375 million = $5.9625 million = $5.96 million", "qhtml": null}, {"n": 40, "q": "When incorporating ESG considerations into portfolio implementation and\nmanagement, client-directed proxy voting is most likely a characteristic of:", "opts": ["thematic investing.", "negative screening.", "shareholder engagement"], "ans": "C", "expl": "A. Incorrect because thematic investing focuses on investment in objectives, themes, and trends that relate positively\nto ESG issues. In impact investing, an investment is selected primarily on its expected social or environmental\nbenefits with measurable investment returns. While thematic investing does not exclude directed proxy voting, the\nclient invests in assets that already meet an objective and firm behavior is consistent with client objectives.\nB. Incorrect because negative screening is the practice of excluding certain sectors or excluding companies that\ndeviate from accepted standards or norms. Exclusion based on values, such as exclusion of gambling, alcohol and\nSince these firms are not owned by the client, there are no proxy votes.\nC. Correct because shareholder engagement is the practice of entering into a dialogue with companies (including\neach other about the exercise of voting rights, filing shareholder proposals or entering into conversations with\nf s       s      s\nto its ownstewardshippolicies.\nBasics of Portfolio Planning and Construction\nand construction", "qhtml": null}, {"n": 41, "q": "Using the dividend discount model, the value of the company's stock is closest\nto:", "opts": ["$37.50.", "$40.13.", "$73.67"], "ans": "B", "expl": "A. Incorrect. D, is used instead of D, in the dividend discount model.\nVo = 3 ÷ (15% - 7%) = $37.50\nB. Correct because\nV。= D ÷ (r-g)\nwhere\nV。 = value of a share of stock today\nD, = expected dividend in year 1 = current dividend (Do) × (1 + g)\nr = required rate of return on the stock\nQuestion 41 of 90\nB. Correct because\nV。= D ÷ (r-g)\nwhere\nVo=value of a share of stock today\nD, = expected dividend in year 1 = current dividend (Do) × (1 + g)\nr =required rate of return on the stock\ng = dividend growth rate = b x RoE\nwhere\nb = earnings retention rate = (1 - Dividend payout ratio)\nROE = return on equity\nPlugging in the equation for g\n= (1-3/5)x17.5%\n= 7%\nPlugging in the equation for V.\n= 3(1+7%) ÷ (15% - 7%)\n= $40.125 ~ $40.13\nC. Incorrect. The dividend payout ratio is used instead of earnings retention rate to calculate g. This incorrect\nQuestion 41 of 90\nROE = return on equity\nPlugging in the equation for g\n= (1-3/5)x17.5%\n= 7%\nPlugging in the equation for Vo\n= 3(1+7%) ÷ (15% - 7%)\n= $40.125 ~ $40.13\nC. Incorrect. The dividend payout ratio is used instead of earnings retention rate to calculate g. This incorrect\ncalculation is as follows:\ng = (3/5)x17.5%\n= 10.5%\nV。 = 3(1+10.5%) ÷ (15% - 10.5%)\n= $73.666 ~ $73.67\nEquityValuation: Concepts and BasicTools\ncalculate and interpret the intrinsic value of an equity security based on the Gordon (constant) growth dividend\ndiscount model or a two-stage dividend discount model, as appropriate", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAD7CAIAAADhOo7BAADV2klEQVR42uydd3wUdf7/PzOzve9ms+mEBEIgkNBDjfReBUVEQMCOXewNETnPO8t55yl2BAUboCIISu8dEiBAQkghfTfby8zulN8f75/z2G+Cep7ljvP9/INH2J2d+cxnZj7z+rw/70LV1NQQBEEQBEEQBPkjQUmShL2AIAiCIAiC/KGgsQsQBEEQBEEQFMEIgiAIgiAIgiIYQRAEQRAEQVAE/9awLIsXBkEQBEEQBPntUPxXtSYajXq9XkmSNBoNXhsEQRAEQRCE/EEswbFYTBRFvDAIgiAIgiAI+SNYgmOxmEqlUiqVeFUQBEEQBEEQ8oeyBPM8j5ZgBEEQBEEQ5L9XBMdiMfK9L2+8iiWEiKIIf/yMptA0y7IajUav1//kxuFwGP4QBEE+KDTp9y//EQqFRFEUBIFlWUmSeJ6XJOn3lPKCIASDwfhPOI6DixKJRAghfr//3+iWQCAQf00BOFNBEOIdV+AqwJbxNwPcIfBtLBbjef7n3hUIgiAIgiD/dSKYoihCiMfj8Xg8svZVKBSgaBmG+e3ardPpRFGMxWJwFDioJEkKhSIcDvt8PkEQQqHQ79OJFEXB+Yqi6PF4KIoKhUI0TUcikd+0DbKu9fl8KpUqXoOqVCr4BNQqwzA/VwTHYjGj0QiaHroXri+cKU3TSqWSpmkQ3BzHgQmfoig4rvxDeVoCji4KhQKzfyAIgiAIcmWLYDAEbtmy5W9/+1tpaSloX0EQ4HOQyOS3dJwAXRUOhzmOgyNKkqTVas1mczQalaXbb41OpwOzqE6ns9lsDMMYDAYQfP+KVfsXTkIIITabDaSnKIoMw7AsK3+l1WqVSqVKpYIu+tdhGIbneYqiWnWjbOgFgzchRK1Wq9VqhUJB03Q0GoXpEMdxsViMoiilUinvARQ5pv5AEARBEIRc0YFxKpUqGo1u3Ljx4MGDhw4dys3NffXVV1Uqlbz8/ZtGualUKp7naZrW6XSEkLVr177xxhuBQKC+vp7n+UGDBuXk5Dz66KNmszkYDIIq/e1QKpWyb4Aoihs3bnzzzTe7d+8+b968nJyc3+igHMd9+eWX586dI4QsWLAgKSlJFEWVSgUuEJWVle+++65KpXrsscdomv650lMQBKVSWVNTs2TJkpaWlmg0OnPmzLlz54K8ZllWq9USQnw+3yeffFJbWxuJRPLy8gYNGtSpU6dAIGA0Ggkhhw8frqioOHXqlEaj6dChww033ICPHIIgCIIg/wvZITiOkyTJZrNdunSpoaHh8OHDAwcOBBeF3yHPA8uyOp0uEomUl5e/9dZbFRUVOp3OaDSqVKqDBw8eOXKkU6dOU6ZMUavVv2kz3G73/PnzXS7Xm2++2a1bN5qmw+FwWVmZw+GId5D91dm3b98nn3xy5MgRQsiQIUPS09Nh+kFRVDA al the fund has identified.", "participating in an investment fund that invests in deals identified and managed by the general partner."], "ans": "B", "expl": "A. Incorrect because it describes the partnership structure common to alternative investments, which is not unique to\npartners (LPs). Limited partners are outside investors who own a fractional interest in the partnership based on the\namount of their initial investment and the terms set out in the partnership documentation.\nB. Correct because in co-investing, the investor invests in assets indirectly through the fund but also possesses rights\nmake an investment alongside a fund when the fund identifies deals.\nC. Incorrect because it describes the fund investing method. In fund investing, the investor contributes capital to a\nfund, and the fund identifies, selects, and makes investments on the investor's behalf. Although co-investing\nincludes an indirect investment through a fund, this is not unique to co-investing.\nAlternative Investment Features, Methods, and Structures\nDiscuss\nFilter", "qhtml": null}, {"n": 43, "q": "With respect to return-generating models for stock returns, the three-factor\nmodel of Fama and French includes which of the following factors? Relative:", "opts": ["earnings growth", "price-to-sales ratio", "book-to-market value"], "ans": "C", "expl": "A. Incorrect because Eugene Fama and Kenneth French suggested that a return-generating model for stock returns\nshould include relative size of the company and relative book-to-market value of the company, not the relative\ndriver of stock returns.\nshould include relative size of the company and relative book-to-market value of the company, not the relative\nprice-to-sales ratio of the company. A candidate may select this answer choice if they confuse the book-to-market\nvaluewiththeprice-to-salesratio.\nC. Correct because Eugene Fama and Kenneth French suggested that a return-generating model for stock returns\nshould include relative size of the company and relative book-to-market value of the company in addition to beta.\nFama and French found that past returns could be explained better with their model than with other models\nthat three factors seem to explain asset returns better than just systematic risk. Those three factors are relative\nsize, relative book-to-market value, and beta of the asset.\nPortfolioRiskandReturn:Part ll\nexplain return generating models (including the market model) and their uses", "qhtml": null}, {"n": 44, "q": "Which of the following statements about mutual funds is most accurate?", "opts": ["Open-end funds tend to be fully invested without keeping cash.", "Closed-end funds can sell for a premium or discount to net asset value.", "Investors in a closed-end fund liquidate by selling their shares back to the fund itself."], "ans": "B", "expl": "A. Incorrect because open-end funds tend not to be fully invested but rather keep some cash for redemptions not\ncovered by new investments.\nB. Correct because closed-end funds can sell for a premium or discount to net asset value depending on the demand\nfor the shares.\nC. Incorrect because for a closed-end fund, investors liquidate by selling their shares to other investors, and not to the\nfund itself.\nPortfolio Management: An Overview\ndescribe mutual funds and compare them with other pooled investment products\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 45, "q": "Forward rate agreements can be used by firms to:", "opts": ["lock in a fixed borrowing or lending rate at a future date.", "pay the return on an equity index and receive a fixed rate.", "hedge against exchange rate fluctuations in foreign-currency investments."], "ans": "A", "expl": "A. Correct because forward contracts in which the underlying is an interest rate are called forward rate agreements,\nor FRAs. FRAs are forward contracts that allow participants to make a known interest payment at a later date and\ne u bo  (i  ) ah e bna  s s u   ss   p\npayment and receiving a random payment that offsets the unknown interest payment it will make on its loan.\none stock index and receive the return on another index or a fixed rate.\nC. Incorrect because FRAs are contracts in which the underlying is an interest rate and are used to lock in a fixed\nborrowing or lending rate at a future date. Therefore, FRAs hedge against interest rate risks, rather than currency\nfluctuations or exchange rate risks.\nPricing and valuation of forward contracts and for an underlying with varying maturities\n· explain how forward rates are determined for interest rate forward contracts and describe the uses of these forward\nrates.\nDiscuss θ\nFilter", "qhtml": null}, {"n": 46, "q": "Accrued interest:", "opts": ["depends on a bond's yield-to-maturity.", "is equal to a bond's full price minus its flat price.", "is typically included in the price quoted by bond dealers."], "ans": "B", "expl": "A. Incorrect because the accrued interest is part of the full price and does not depend on the yield-to-maturity.\nB. Correct because PvFull = PvFlat + Al, where PvFull is the bond's full price, PvFlat is the bond's flat price, and A/ is\nthe accrued interest.\nC. Incorrect because the flat price usually is quoted by bond dealers. If a trade takes place, the accrued interest is\nadded to the flat price to obtain the full price paid by the buyer and received by the seller on the settlement date.\nFixed-lncome Bond Valuation: Prices and Yields\ncalculate a bond's price given a yield-to-maturity on or between coupon dates\nDiscuss\ni\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 47, "q": "A put option has a strike price of $20.50. The option premium is $1.00. If the\nprice of the underlying at expiration is $21.50, the put option is:", "opts": ["in the money.", "at the money.", "out of the money."], "ans": "C", "expl": "A. Incorrect because a put option is called \"in the money\" if the underlying value is less than the exercise price.\nB. Incorrect because a put option is called \"at the money\" if the underlying value is equal to the exercise price.\nC. Correct because a put option is called \"out of the money\" if the underlying value is greater than the exercise price.\nIn this case, the underlying value of $21.50 is greater than the strike price of $20.50.\nForward Commitment and Contingent Claim Features and Instruments\ndetermine the value at expiration and profit from a long or a short position in a call or put option\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss...(required)", "qhtml": null}, {"n": 48, "q": "All else being equal, non-cumulative preference shares most likely:", "opts": ["offer dividends that are less than common shares.", "have a claim on net assets upon liquidation of the company.", "receive any past unpaid dividends prior to dividends being paid to common shareholders."], "ans": "B", "expl": "A. Incorrect because the dividends on preference shares are generally higher than the dividends on common shares.\nB. Correct because preference shares rank above common shares with respect to the distribution of the company's\nnet assets upon liquidation.\nC. Incorrect because the requirement to pay past unpaid dividends applies specifically to cumulative preference\nshares, not preference shares in general.\nOverview of Equity Securities\ndescribe differences in voting rights and other ownership characteristics among different equity classes\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 49, "q": "Which of the following objectives of a client's IPS is best described as a relative\nrisk objective? For the next year, a client's portfolio objective is to:", "opts": ["have a 95% value at risk that is less than $100,000.", "outperform the local stock market index by 100 basis points.", "earn a return within plus or minus 2 percentage points of the local stock market index return."], "ans": "C", "expl": "A. Incorrect because value at risk is an absolute risk measure, not a relative one. Examples of an absolute risk\nrestated as an objective that with 95% probability the portfolio not lose more than 4% in any 12-month period.\nMeasures of absolute risk include the variance or standard deviation of returns and value at risk.\nB. Incorrect because it represents a relative return objective, not a relative risk objective. The return objective can be\nstated on a relative basis—for example, relative to a benchmark return. The benchmark could be an equity market\nindex, such as the SP 500 or the FTSE 1o0, or a cash rate of interest. A relative return objective might be stated\nC. Correct because some clients may choose to express relative risk objectives, which relate risk relative to one or\nmore benchmarks perceived to represent appropriate risk standards. When a policy portfolio is used, the risk\nobjective may be expressed as a desire for the portfolio return to be within a band of plus or minus X% of the\n95% probability that the portfolio return will be within X% of the benchmark return over a stated period.\nBasics of Portfolio Planning and Construction\n· describe risk and return objectives and how they may be developed for a client", "qhtml": null}, {"n": 50, "q": "In addition to investing in core real estate, a real estate private equity fund\nfollowing a core-plus strategy most likely invests in properties with:", "opts": ["slightly less leasing risk than a core strategy.", "the same level of leasing risk as a core strategy.", "slightly more leasing risk than a core strategy."], "ans": "C", "expl": "B. Incorrect because core-plus strategies are higher on the risk-return spectrum than core strategies.\nC. Correct because core-plus strategies are higher on the risk-return spectrum than core strategies. The third and\nfourth parts of the spectrum offer higher, riskier, and less predictable potential returns; the main source of return\nfrom potential price appreciation. The main source of return for core-plus holdings comes from leases, but the cost\nof acquiring these leases and maintaining and updating the underlying properties may become significant,\nReal Estate Infrastructure\n1 explain the investment characteristics of real estate investments\nDiscuss ①\nFilter\nDiscussion\n(reauired)", "qhtml": null}, {"n": 51, "q": "Assuming that the expected return and the standard deviation of each security\nare the same, a portfolio consisting of an equal allocation of which two securities will\nbe most effective for portfolio diversification?", "opts": ["Securities A and B", "Securities A and C", "Securities B and C"], "ans": "C", "expl": "A. Incorrect. The neutral correlation of 0.0 between investment securities A and B means that these instruments have\nno correlation with each other. While portfolio A and B is superior to portfolio A and C, it is not superior to the\nnegative correlation of portfolio B and C.\nB. Incorrect. The positive correlation of 0.5 between investment securities A and C means that these instruments have\npositive correlation with each other and are not effective for portfolio diversification.\nC. Correct. The negative correlation of -0.5 between investment securities B and C is the lowest and thus is the most\neffective for portfolio diversification.\nPortfolio Risk and Return: Part T\ndescribe the effect on a portfolio's risk of investing in assets that are less than perfectly correlated", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAELCAIAAABS35xsAABaqElEQVR42u3dd1xT5/s38DsJSYAEwt4oIIo4UJx1VRy4rbtVaR111NlWbWu11lZta20dgLvuVhyooKioKNiKyhBlKEtlCcgIOwSyz/PH/Xh++QJSW621+nn/4SuEmByuM3Kd61z3fTi5ubkEAAAAAOBNwmEYBlEAAAAAgDcKFyEAAAAAACTBAAAAAABIggEAAAAAkAQDAAAAACAJfpFKS0urq6uxYgAAAAAAlWAAAAAAACTBAAAAAABIggEAAAAAkAQDAAAAACAJBgAAAAB4UUnwpUuXPvjgg5KSklfkT1Kr1VivAAAAANAMDsMwz/kWM2bMiIuLEwqFvr6+P//8M3nuKdKEQqFEIvmr//HkyZO//PJLTU have amortizing principal.", "do not have call protection."], "ans": "A", "expl": "A. Correct. Many commercial loans backing CMBSs are balloon loans that require a substantial principal repayment\nat maturity of the loan. If the borrower fails to make the balloon payment, the borrower is in default. CMBSs\ngenerally do not have amortizing principal as RMBSs do, and they do offer call protection.\nB. Incorrect. CMBSs generally do not have amortizing principal as RMBSs do.\nC. Incorrect. CMBSs generally do offer call protection.\nMortgage-Backed Security (MBS) Instrument and Market Features\ndescribe characteristics and risks of commercial mortgage-backed securities\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 54, "q": "Expected future benefits to be received from a common share are most likely an\nimportant input for a(n):", "opts": ["multiplier model.", "asset-based model.", "present value model."], "ans": "C", "expl": "A. Incorrect. Multiplier models are based chiefly on share price multiples or enterprise value multiples.\nB. Incorrect. Asset-based valuation models estimate the intrinsic value of a common share from the estimated value\nof assets of a corporation minus the estimated value of its liabilities and preferred shares.\nC. Correct. Present value models estimate a security's intrinsic value based on the present value of the future\nbenefits expected tobe received from the security.\nEquity Valuation: Concepts and Basic Tools\n1describe major categories of equity valuation models\nDiscuss\ni\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 55, "q": "Which of the following is used by clearinghouses to determine the daily gain and\nloss to the parties of a futures contract?", "opts": ["Mark to market", "Maintenance margin", "Limit up and limit down"], "ans": "A", "expl": "A. Correct because the most important feature of futures contracts is the daily settlement of gains and losses and the\nclearinghouse engages in a practice called mark to market (MTM), also known as the daily settlement. The\nend-of-day settlement price. All contracts are then said to be marked to the end-of-day settlement price.\nB. Incorrect because the maintenance margin is the amount of money that each participant must maintain in the\naccount after the trade is initiated, and it is always significantly lower than the initial margin. Therefore, the\nmaintenance margin covers any potential losses arising from the mark to market practice which has to occur first\nbefore any shortfall in the maintenance margin is calculated.\nC. Incorrect because some futures contracts contain a provision limiting price changes. These rules, called price\nlimits, establish a band relative to the previous day's settlement price, within which all trades must occur. If market\nthe lower band, which is called limit down, no trade can take place until two parties agree to trade at a price above\ngain and loss positions of futures contract parties.\nForward Commitment and Contingent Claim Features and Instruments\n· define forward contracts, futures contracts, swaps, options (calls and puts), and credit derivatives and compare their", "qhtml": null}, {"n": 56, "q": "At expiration, an option that is in the money will most likely have:", "opts": ["time value, but no exercise value.", "exercise value, but no time value.", "both time value and exercise value."], "ans": "B", "expl": "A. Incorrect. At expiration, options have no time value.\nB. Correct. At expiration, options have no time value; if they are in the money, they have exercise value.\nC. Incorrect. At expiration, options have no time value.\nPricing and Valuation of Options\nexplain the exercise value, moneyness, and time value of an option\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 57, "q": "Compared to investing in a single security, the portfolio approach can improve\ninvestors' risk-return trade-off by offering:", "opts": ["lower expected return with the same overall volatility of returns.", "the same expected return with lower overall volatility of returns.", "higher overall volatility of returns for a given level of expected return."], "ans": "B", "expl": "A. Incorrect because in addition to avoiding a potential disaster associated with over investing in a single security,\nby a measure such as standard deviation.\nB. Correct because in addition to avoiding a potential disaster associated with over investing in a single security,\nportfolios also generally offer equivalent expected returns with lower overall volatility of returns-as represented\nby a measure such as standard deviation. One of the critical ideas about portfolios: Portfolios affect risk more than\nreturns.\nC. Incorrect because in addition to avoiding a potential disaster associated with over investing in a single security,\nrepresented by a measure such as standard deviation. One of the critical ideas about portfolios: Portfolios affect\nrisk more than returns.\nPortfolio Management: An Overview\n· describe the portfolio approach to investing\nDiscuss ①\nFilter", "qhtml": null}, {"n": 58, "q": "When buying a stock, a limit order is more likely to be:", "opts": ["executed faster than a market order.", "completely filled than a market order.", "executed at lower prices than a market order."], "ans": "C", "expl": "A. Incorrect because the main problem with limit orders is that they may not execute, while a market order would\nexecute at the best price immediately available. Limit orders do not execute if the limit price on a buy order is too\nlow, or if the limit price on a sell order is too high. If the limit price is placed above the best offer, the buy order\ngenerally will partially or completely fill at the best offer price.\nexecute at the best price immediately available. Limit orders do not execute if the limit price on a buy order is too\nlow, or if the limit or using price multiples to value equity, how the price to earnings multiple relates to\nfundamentals, and the use of multiples based on comparables\nDiscuss\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 61, "q": "With respect to the absolute priority of claims in bankruptcy, which of the\nfollowing most likely has the highest seniority ranking?", "opts": ["Third lien debt", "Subordinated debt", "Senior unsecured debt"], "ans": "A", "expl": "A. Correct because in the event of default, unsecured debtholders' claims rank below (i.e., get paid after) those of\nsecured creditors under what's known as the priority of claims. Within secured debt there can also be second lien,\nsubordinated debt and junior subordinated debt.\nB. Incorrect because as specified in the justification for the correct response, subordinated debt ranks below third lien\ndebt (secured debt).\nlien debt (secured debt).\nCredit Analysis for Corporate Issuers\n1 describe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and\ntheir impact on credit ratings\nDiscuss\nFilter", "qhtml": null}, {"n": 62, "q": "For portfolios composed of the risk-free asset and a risky asset, the expected\nreturn as a function of standard deviation of returns is graphically represented by the:", "opts": ["security market line.", "capital allocation line.", "Markowitz efficient frontier."], "ans": "B", "expl": "A. Incorrect because the security market line (SML) is a graphical representation of the capital asset pricing model\nwith beta, not standard deviation of returns, reflecting systematic risk, on the x-axis and expected return on the y-\naxis.\nB. Correct because a combination of the risk-free asset and a risky asset can result in a better risk-return trade-off\nthan an investment in only one type of asset because the risk-free asset has zero correlation with the risky asset.\nThe combination is called the capital allocation line.\nC. Incorrect because the Markowitz efficient frontier is the curve that lies above and to the right of the global\nminimum-variance portfolio on the minimum-variance frontier, which in turn depicts portfolios with the minimum\nvariance for a given return in a graph where the axes are standard deviation of returns and expected return. Thus,\nthe Markowitz efficient frontier is a curve that contains many risky assets, and not the combinations of one risky\nasset with the risk-free asset.\nPortfolio Risk and Return: Part I!\n· explain the capital allocation line (CAL) and the capital market line (CML)\nDiscuss ①\nFilter", "qhtml": null}, {"n": 63, "q": "Based on the interest coverage ratio using EBITDA, the company's\ncreditworthiness has:", "opts": ["deteriorated.", "remained unchanged.", "improved."], "ans": "C", "expl": "A. Incorrect because over the period the interest coverage ratio increased and a higher ratio indicates higher, not\nlower, credit quality.\nIf the interest coverage ratio is calculated as EBlT/lnterest expense, the ratios are:\nYear 1: 255/170 = 1.5x;\nYear 2: 234/156 = 1.5x.\nThis stable ratio would imply no change to the company's creditworthiness.\nC. Correct because over the period the interest coverage ratio increased, which indicates that the company is better\npositioned to service its debt. A higher ratio indicates higher credit quality.\nInterest coverage ratio is calculated as EBlTDA/lnterest expense and EBlTDA = Operating income + Depreciation\nQuestion 63 of 90\nA. deteriorated.\nB. remained unchanged.\nC. improved.\nSolution\nA. Incorrect because over the period the interest coverage ratio increased and a higher ratio indicates higher, not\nlower, credit quality.\nB. Incorrect because EBIT (i.e., operating income) is used instead of EBITDA to calculate the interest coverage ratio.\nIf the interest coverage ratio is calculated as EBlT/lnterest expense, the ratios are:\nYear 1: 255/170 = 1.5x;\nYear2: 234/156 =1.5x.\nThis stable
