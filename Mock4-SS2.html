 the object of the acquisition) narrows to the closing value of the transaction after it is fully\nconsummated.\nembedded call option.\nInvestments in Private Capital: Equity and Debt\n· explain features of private equity and its investment characteristics", "qhtml": null}, {"n": 65, "q": "The minimum rate of return required by investors to purchase an equity security\nis most likely approximated by the company's:", "opts": ["cost of equity.", "return on equity.", "weighted average cost of capital."], "ans": "A", "expl": "A. Correct because the company's cost of equity is often used as a proxy for the investors' minimum required rate of\nreturn.\nB. Incorrect because when investors purchase the company's equity securities, their minimum required rate of return\nis based on the future cash flows they expect to receive. Return on equity is a historical accounting measure which\nmeasures the total return on the firm's book value, therefore it may or may not approximate investors' minimum\nrequired rate of return.\nC. Incorrect because the WAcC represents the minimum required rate of return that the company must earn on its\nlong-term investments to satisfy all providers of capital, i.e. both debt holders and equity investors not just equity\ninvestors.\nOverviewofEquitySecurities\ncompare a company's cost of equity, its (accounting) return on equity, and investors' required rates of return\nDiscuss\nFilter\nDiscussion", "qhtml": null}, {"n": 66, "q": "Which of the following is most likely a means of executing a differentiation\ncompetitive strategy?", "opts": ["Trademarks", "Economies of scope", "Geographical proximity to its customers"], "ans": "A", "expl": "A. Correct because protection using trademarks, copyright, patents is a means of executing a differentiation strategy.\nB. Incorrect because economies of scope is a means of executing a cost leadership strategy.\nC. Incorrect because proximity to customers and strong understanding of their needs is a means of executing a focus\nstrategy.\nIndustry and Competitive Analysis\nevaluate the competitive strategy and position of a company\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 67, "q": "If the asset is added to the portfolio, the portfolio standard deviation will most\nlikely:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "A", "expl": "A. Correct because the correlation coefficient between two assets determines the effect on portfolio risk when the two\nassets are combined. Portfolio risk falls when the two assets are not perfectly correlated (r12 < +1). Since the\ncorrelation of returns between the asset and the portfolio is 0.5, portfolio risk will decrease with the addition of the\nnew asset.\nB. Incorrect because, although the standard deviations for the asset and the portfolio are equal, the correlation of\nreturns between the asset and the portfolio is 0.5. The correlation coefficient between two assets determines the\neffect on portfolio risk when the two assets are combined. Portfolio risk falls when the two assets are not perfectly\ncorrelated (r12 < +1).\nC. Incorrect because the correlation coefficient between two assets determines the effect on portfolio risk when the\ntwo assets are combined. Portfolio risk falls when the two assets are not perfectly correlated (r12 < +1). Since the\ncorrelation of returns between the asset and the portfolio is 0.5, portfolio risk will decrease, not increase, with the\naddition of the newasset.\nPortoioRisk", "qhtml": "<img class=\"qfig\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA6wAAAEBCAIAAADzRL8KAACsH0lEQVR42uzdZ1wUV/s4/DNb6b1XKQoWsCBWVFRAsSNWbICKBY3dGBM1Go2Jxo4Ne0NERUVRBDuIIEV6l97rwrLA1nlenCfz399SJJqY+/a+vi/84JbZmTPtmmuuc4YoLCxEAAAAAAAA/C8hSJKEVgAAAAAAAP9TaNAEAAAAAAAAgmAAAAAAAAAgCAYAAAAAAACCYAAAAAAAACAI/jtVV1c3NjbCigEAAAAAAJAJBgAAAAAAAIJgAAAAAAAAIAgGAAAAAAAAgmAAAAAAAAD+sSBYKBRyOBxoSgAAAAAA8D8UBL948WLt2rVVVVX/IYskFAphvQIAAAAAgC4QJEl+4SQ8PT1jY2PZ  "A. Correct because a key rate duration (or partial duration) is a measure of a bond's sensitivity to a change in the\nidentify “shaping risk\" for a bond-—that is, a bond's sensitivity to changes in the shape of the benchmark yield\ncurve (e.g., the yield curve becoming steeper or flatter).\nB. Incorrect because effective duration is a curve duration statistic in that it measures interest rate risk in terms of a\nparallel shift in the benchmark yield curve (△Curve). Because effective duration measures interest rate risk in\nterms of a parallel shift, it does not accurately represent the risk of a non-parallel shift, such as a flattening of the\nyield curve.\nchange in its yield-to-maturity. Using modified duration to reflect the risk of a non-parallel shift in the yield curve will\na curve statistic.\nCurve-Based and Empirical Fixed-lncome Risk Measures\n· define key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark\nyield curve changes", "qhtml": null}, {"n": 77, "q": "A consequence of preventing the exploitation of private information is that the\nmarket is not:", "opts": ["weak-form efficient.", "semi-strong efficient.", "strong-form efficient."], "ans": "C", "expl": "A. Incorrect because in the weak-form efficient market hypothesis, security prices fully reflect all past market data,\nwhich refers to all historical price and trading volume information. Putting into place securities laws that are\npreventing the exploitation of private information does not affect the market's capability to reflect past market data.\nB. Incorrect because in a semi-strong-form efficient market, prices reflect all publicly known and available information.\nmarket's capability to reflect public information.\nC. Correct because securities markets are not strong-form efficient because securities laws are intended to prevent\nexploitation of private information.\nMarket Efficiency\n1 explain the implications of each form of market efficiency for fundamental analysis, technical analysis, and the\nchoice between active and passive portfolio management\nDiscuss\nFilter\nDiscu", "qhtml": null}, {"n": 78, "q": "Two investors have utility functions that differ only with regard to the coefficient\nof risk aversion. Relative to the investor with a higher coefficient of risk aversion, the\noptimal portfolio for the investor with a lower coefficient of risk aversion will most\nlikely have:", "opts": ["a lower level of risk and return.", "the same level of risk and return.", "a higher level of risk and return."], "ans": "C", "expl": "A. Incorrect. For a high coefficient of risk aversion, the investor will seek a lot of return for a bit of extra risk and will\nhave an optimal portfolio that is tangential to the capital allocation line at a lower level of risk and return relative to\nthe investor with a lower coefficient of risk aversion.\nB. Incorrect. Only investors with identical coefficients of risk aversion would select the same optimal portfolio.\ntouch the capital allocation line at a point that would represent a portfolio with higher risk and more expected\nreturn.\nPortfolio Risk and Return: Part I\nexplain the selection of an optimal portfolio, given an investor's utility (or risk aversion) and the capital allocation\nline\nDiscuss\nFilter\ni", "qhtml": null}, {"n": 79, "q": "A bond has a modified duration of 7.5 years and an annual convexity of 280. If\nyields decrease by 60 basis points, the percentage price change is closest to:", "opts": ["4.00%.", "5.00%.", "5.51%."], "ans": "B", "expl": "A. Incorrect because the convexity adjustment is subtracted instead of added:\n≠ (-7.5 x -0.006) - (0.5 × 280 × 0.0062)\n=0.045 -0.00504 = 0.03996 ≈ 4.00%.\nB. Correct because the %△PV = (-AnnModDur × △Yield) + (0.5 × AnnConvexity x △Yield2)\n= (-7.5 × -0.006) + (0.5 × 280 × 0.0062)\n= 0.045 + 0.00504 = 0.05004 ≈ 5.00%.\nC. Incorrect because the convexity adjustment is missing the 0.5 in the calculation:.\n≠ (-7.5 x -0.006) + (280 x 0.0062)\n=0.045+ 0.01008=0.05508~5.51%.\nYield-Based Bond Convexity and Portfolio Properties\ncalculate the percentage price change of a bond for a specified change in yield, given the bond's duration and\nconvexity", "qhtml": null}, {"n": 80, "q": "In the binomial model, if the probability of a downward movement in an\nunderlying increases, the value of a call option:", "opts": ["decreases.", "remains unchanged.", "increases."], "ans": "B", "expl": "A. Incorrect because, according to the binomial model, the value of call option is co = (trc,u + (1 - T)c, d)/(1 + r), where\nIT = (1 + r - d)/(u - d). Notably, the probabilities of the up and down moves, q and 1 - q, do not appear in the\nunderlying.\nop *b - L pue b 'saow umop pue dn aun jo saqeqoid au Xiqejon (p - n)(p - I + L) = ll ahaym (u + L)/(,lo(\nnot appear in the formula. Therefore, the value of a call option is independent of the probability of a downward\nmovement in an underlying.\nC. Incorrect because, according to the binomial model, the value of call option is co = (rc,\" + (1 - tr)c,d)/(1 + r),\nadde pou op b - L pue b 'sasow umop pue dn aun jo saeqod aun igeon (p - n)/(p -I + l) = l aaym\nunderlying.\nValuing a derivative using a one-period binomial model\nexplain how to value a derivative using a one-period binomial model", "qhtml": null}, {"n": 81, "q": "Returns adjusted for the total risk of a portfolio relative to a benchmark are most\nappropriately measured using which of the following?", "opts": ["M?", "Treynor ratio", "Jensen's alpha"], "ans": "A", "expl": "A. Correct because M² provides a measure of portfolio return that is adjusted for the total risk of the portfolio relative\nto that of some benchmark. Total risk is relevant for an investor when he or she holds a portfolio that is not fully\ndiversified, which is not a desirable portfolio. In such cases, the Sharpe ratio and M? are appropriate performance\nmeasures.\nB. Incorrect because the Treynor ratio is a simple extension of the Sharpe ratio and resolves the Sharpe ratio's first\nlimitation by substituting beta (systematic risk) for total risk.\nC. Incorrect because Jensen's alpha is based on systematic risk. Performance measures relative to beta risk-\nTreynor ratio and Jensen's alpha-are relevant when the investor holds a well-diversified portfolio with negligible\ndiversifiable risk.\nPortfolio Risk and Return: Part Ii\ncalculate and interpret the Sharpe ratio, Treynor ratio, M2, and Jensen's alpha\nDiscuss\nFilter", "qhtml": null}, {"n": 82, "q": "The value of a forward contract at initiation is most likely:", "opts": ["less than zero.", "equal to zero.", "greater than zero."], "ans": "B", "expl": "A. Incorrect because the value of a forward contract when initiated is zero.\nB. Correct because the forward price that the parties agree to at the initiation date of the contract is a special price\nthat results in the contract having zero value and prohibiting arbitrage. Because neither the long nor the short pays\nanything to the other at the initiation date of a forward contract, the value of a forward contract when initiated is\nzero.\nC. Incorrect because the value of a forward contract when initiated is zero.\nPricing and valuation of forward contracts and for an underlying with varying maturities\nexplain how the value and price of a forward contract are determined at initiation, during the life of the contract, and\nat expiration\nDiscuss\nFilter\n1\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 83, "q": "Over a given holding period, performance of credit-risky bonds will most likely\nbenefit from:", "opts": ["periods of high demand.", "widening credit spreads.", "weakening economic conditions."], "ans": "A", "expl": "A. Correct because in periods of high demand for bonds, spreads will move tighter. Wider spreads hurt bond\nperformance, whereas narrower spreads help bond performance.\nB. Incorrect because wider spreads hurt bond performance, whereas narrower spreads help bond performance.\nC. Incorrect because weakening economic conditions will push investors to desire a greater risk premium and drive\noverall credit spreads wider. Wider spreads hurt bond performance, whereas narrower spreads help bond\nperformance.\nCredit Risk\n· describe macroeconomic, market, and issuer-specific factors that influence the level and volatility of yield spreads\nDiscuss\nFilter\n1\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 84, "q": "Which of the following US sovereign securities is a pure discount bond?", "opts": ["Treasury bill", "Treasury note", "Treasury bond"], "ans": "A", "expl": "A. Correct because sovereign debt issues include the following: Short-term securities (with maturities ranging from 1\nto 12 months), often known as Treasury bills, which are usually zero-coupon instruments sold at a discount to par.\nMedium- and long-term securities often known as Treasury notes and bonds. Fixed-rate coupon instruments in the\ndomestic currency are most common, but sovereigns also issue floating-rate, inflation-linked, and foreign currency\ninstruments.\nC. Incorrect because sovereign debt issues include the following: Short-term securities (with maturities ranging from 1\nto 12 months), often known as Treasury bills, which are usually zero-coupon instruments sold at a discount to par.\nMedium- and long-term securities often known as Treasury notes and bonds. Fixed-rate coupon instruments in the\ndomestic currency are most common, but sovereigns also issue floating-rate, inflation-linked, and foreign currency\ninstruments.\nFixed-lncome Markets for Government Issuers\n· describe funding choices by sovereign and non-sovereign governments, quasi-government entities, and\nsupranational agencies", "qhtml": null}, {"n": 85, "q": "The Gordon growth model is most appropriate for valuing the common stock of\na dividend paying company that is:", "opts": ["young and just entering the growth phase.", "mature and relatively insensitive to economic fluctuations.", "experiencing growth that is higher than the sustainable growth rate."], "ans": "B", "expl": "A. Incorrect. A three-stage dividend discount model would be most appropriate for a fairly young company that is just\nentering thegrowthphase.\nB. Correct. The Gordon growth model is most appropriate for valuing common stock of a dividend paying company\nthat is mature and relatively insensitive to the business cycle or economic fluctuations.\nC. Incorrect. A two-stage dividend discount model would be appropriate for a company that is experiencing a higher\nthan the sustainable growth rate.\nEquity Valuation: Concepts and Basic Tools\nidentify characteristics of companies for which the constant growth or a multistage dividend discount model is\nappropriate\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 86, "q": "Bonds issued in which of the following markets most likely have fewer\nreporting, regulatory, and tax constraints?", "opts": ["Eurobond markets", "Foreign bond markets", "Domestic bond markets"], "ans": "A", "expl": "A. Correct because domestic and foreign bonds are subject to the legal, regulatory, and tax requirements that apply\nin that particular country. In contrast, a Eurobond is issued internationally, outside the jurisdiction of the country in\nreporting, regulatory, and tax constraints than domestic and foreign bond markets.\nB. Incorrect because the Eurobond market has traditionally been characterized by fewer reporting, regulatory, and tax\nconstraints than domestic and foreign bond markets.\nC. Incorrect because the Eurobond market has traditionally been characterized by fewer reporting, regulatory, and tax\nconstraints than domestic and foreignbond markets.\nFixed-lncome Cash Flows and Types\n· describe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities\nDiscuss ①\nFilter\nDiscussion", "qhtml": null}, {"n": 87, "q": "The value of a call option is inversely related to the:", "opts": ["risk-free rate.", "exercise price.", "value of the underlying."], "ans": "B", "expl": "A. Incorrect because the value of a European call is directly (not inversely) related to the risk-free interest rate.\nB. Correct because the value of a European call option is inversely related to the exercise price.\nC. Incorrect because the value of a European call is directly (not inversely) related to the value of the underlying.\nPricing and Valuation of Options\n· identify the factors that determine the value of an option and describe how each factor affects the value of an option\nDiscuss 6\nFilter\n1\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 88, "q": "When the investment horizon is less than the Macaulay duration of a bond:", "opts": ["coupon reinvestment risk offsets market price risk.", "market price risk is greater than coupon reinvestment risk.", "coupon reinvestment risk is greater than market price risk."], "ans": "B", "expl": "A. Incorrect because this is the case when the investment horizon is equal to the Macaulay duration. When the\ninvestment horizon is equal to the Macaulay duration of a bond, coupon reinvestment risk offsets market price risk.\nB. Correct because when the investment horizon is less than the Macaulay duration of the bond, market price risk\ndominates coupon reinvestment risk.\nC. Incorrect because this is the case when the investment horizon is greater than the Macaulay duration. When the\nprice risk.\nInterest Rate Risk and Return\n· describe the relationships among a bond's holding period return, its Macaulay duration, and the investment horizon;\nDiscuss\nFilter\n1\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 89, "q": "If a hedge fund imposes a gate, it is temporarily limiting the:", "opts": ["redemptions from the fund.", "inflow of money into the fund.", "amount of leverage in the fund."], "ans": "A", "expl": "A. Correct because funds sometimes impose a gate, which limits or restricts redemptions for a period of time.\nInvestors should be aware of their liquidity needs before investing in a fund with restrictive provisions.\nB. Incorrect because a gate limits or restricts redemptions, not inflows, for a period of time.\nC. Incorrect because a gate limits or restricts redemptions, not leverage, for a period of time.\nAlternative Investment Performance and Returns\n1describe the performance appraisal of alternative investments\nDiscuss ①\nFilter\nDiscussion\nWhat do you want to discuss... (required)", "qhtml": null}, {"n": 90, "q": "Financial instruments trade for delivery in:", "opts": ["spot markets only.", "forward markets only.", "both spot and forward markets."], "ans": "C", "expl": "the markets trade instruments for immediate delivery or for future delivery. Markets that trade contracts that call for\nB. Incorrect because spot markets also trade instruments for delivery. Practitioners classify markets by whether the\nC. Correct because practitioners classify markets by whether the markets trade instruments for immediate delivery or\nfor future delivery. Markets that trade contracts that call for delivery in the future are forward or futures markets.\nThose that trade for immediate delivery are called spot markets to distinguish them from forward markets that\ntrade contracts on the same underlying instruments.\nMarket Organization and Structure\n·describeclassificationsofassetsand markets", "qhtml": null}];
const CFG = {"title": "Mock Exam 4 — Session 2", "subtitle": "CFA Level I · 90 câu · 2h15p", "minutes": 135, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";

<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
