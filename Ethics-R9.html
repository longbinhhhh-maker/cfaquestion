<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#6d5efc,secondary:#9d8bff"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "In the preparation of a research report, a CFA Institute member may emphasize certain\nmatters, touch briefly on others, and omit some altogether:", "opts": ["provided that the analyst both has a reasonable basis and is unconstrained by the Mosaic theory.", "provided that the analyst has a reasonable basis for his or her actions.", "under no circumstances."], "ans": "B", "expl": "According to Standard V(B), the analyst must use reasonable judgment in identifying\nrelevant factors when communicating with clients and prospects. The Mosaic theory does\nnot apply here."}, {"n": 2, "q": "Standard V(B), Communication with Clients and Prospective Clients, least likely requires\nmembers to:", "opts": ["disclose the general principles of investment processes used to analyze and select securities, and construct portfolios.", "make clear buy or sell recommendations on the securities covered in research reports.", "use reasonable judgment regarding the inclusion or exclusion of relevant factors in research reports."], "ans": "B", "expl": "There is no obligation to make buy or sell recommendations on securities that are covered\nby research reports."}, {"n": 3, "q": "Peggy Green, CFA, is a research analyst following Brown Co. All the information she has\ngathered suggests the stock should be rated a weak \"hold.\" During a recent lunch, Green\noverheard another analyst say that the stock should be rated a \"buy.\" Green returns to her\noffice and issues a \"buy\" recommendation. Green has most likely violated the Code and\nStandards by:", "opts": ["acting or causing others to act on material nonpublic information.", "failing to distinguish between fact and opinion.", "recommending an investment action without a reasonable basis."], "ans": "C", "expl": "Standard V(A) Diligence and Reasonable Basis requires members and candidates to have a\nreasonable and adequate basis, supported by appropriate research and investigation, for\ntheir recommendations.\n(Module 91.7, LOS 91: V(A))"}, {"n": 4, "q": "Bill Fox, CFA, has been preparing a research report on New London Wire and Cable, one of\nhis major investment clients. He had completed much of his analysis and had planned on\nhaving his report typed and bound today. Unfortunately, his briefcase was stolen while he\nate breakfast, and he lost all his notes and working papers. The lost materials included his\nnotes from management interviews, conversations with suppliers and competitors, dates of\ncompany visits, and his computer diskette containing much of his quantitative analysis. Fox's\nclient needs this report tomorrow. In a panic, Fox called New London's vice president of\nfinance and was faxed a copy of the company's most recent financial projections. Fox\nremembered that his own analysis showed that management's estimates were too high. He\ndid not remember the exact amount, so he revised New London's figures downward 10%.\nFox incorporated some charts and graphs on New London from a research report he\nreceived last week from a small regional research firm and some information from a\nStandard & Poor's reference work in his report, without reference to their sources. Fox has:", "opts": ["violated none of the Standards.", "violated the requirement to have a reasonable basis for a recommendation, the prohibition against plagiarism, and the requirement to maintain appropriate records.", "violated the requirement to have a reasonable basis for a recommendation and the prohibition against plagiarism."], "ans": "B", "expl": "New London's report is potentially self serving, so Fox did not exercise diligence or have\nan adequate basis for his recommendation. In addition, Fox did not acknowledge his\nsource of the charts and graphs. Finally, he did not maintain adequate records."}, {"n": 5, "q": "Todd Gable, CFA, was attending a noon luncheon when he overheard two software\nexecutives talking about a common vendor, Datagen, about how wonderful they thought the\ncompany was, and about a rumor that a major brokerage firm was preparing to issue a\nstrong buy recommendation on the stock. Gable returned to the office, checked a couple of\nonline sources, and then placed an order to purchase Datagen in all of his discretionary\nportfolios. The orders were filled within an hour. Three days later, a brokerage house issued\na strong buy recommendation and Datagen's share price went up 20%. Gable then obtained\nthe brokerage house's research report on Datagen and quoted parts of it in a report to his\nclients. Gable has most likely violated the Standards by:\nGable has:", "opts": ["using material nonpublic information.", "using the recommendation of another brokerage firm in his report.", "not having a reasonable basis for an investment action."], "ans": "C", "expl": "Standard V(A) requires members to have a reasonable and adequate basis for taking\ninvestment actions. Overhearing a conversation does not provide adequate basis.\nHowever, the overheard rumor was not material nonpublic information. Quoting another\nfirm's research is acceptable as long as the material is properly attributed to its source."}, {"n": 6, "q": "Don Wilson and Nadine Chavis, both CFA charterholders, are investment advisors at Uptown\nSecurities. Wilson recommends that one of his clients buy Alpha Company based on\nresearch conducted by Uptown. Chavis recommends that one of her clients sell Alpha\nCompany based on research conducted by another brokerage firm for general distribution.\nBoth recommendations are consistent with each client's investment objectives and within\nthe context of their entire portfolios. Neither Wilson nor Chavis has reason to suspect that\nany information contained in the research reports from these two sources is inaccurate or\ninadequately supported. According to Standard V(A) Diligence and Reasonable Basis, do\nWilson and Chavis have a reasonable basis for making their investment recommendations?", "opts": ["Both of these advisors have a reasonable basis for their recommendations.", "Neither of these advisors has a reasonable basis for their recommendations.", "Only one of these advisors has a reasonable basis for his or her recommendation."], "ans": "A", "expl": "Wilson and Chavis have a reasonable and adequate basis if they recommend an\ninvestment transaction based on sound research prepared by their firm or an\nindependent third party.\n(Module 91.7, LOS 91: V(A))"}, {"n": 7, "q": "Wes Smith, CFA, works for Advisors, Inc. In order to remain in compliance with Standard V(A),\nDiligence and Reasonable Basis, Smith may recommend a security in which of the following\nsituations?", "opts": ["Advisors' research department recommends a stock.", "For either of the reasons listed here.", "Smith reads a favorable review of the security in a widely read periodical."], "ans": "A", "expl": "Smith will be in violation if he acts solely on the basis of what he read in the periodical.\nUse of information within the firm can be relied upon unless the Smith has reason to\nbelieve the source lacks a sound basis."}, {"n": 8, "q": "Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of\nthe two clients are equal in value. It is Hatfield's opinion that interest rates will fall in the\nnear future. Based upon this, Hatfield begins increasing the bond allocation of each\nportfolio. In order to comply with Standard V(B), Communication with Clients and\nProspective Clients, the analyst needs to:", "opts": ["inform the clients of the change and tell them it is based upon an opinion and not a fact.", "make sure that the change is identical for both clients.", "perform both of these functions."], "ans": "A", "expl": "According to Standard V(B), the analyst must inform the clients of the change and tell them\nit is based upon an opinion and not a fact. Making an identical change in two portfolios\nmay be a violation of this standard if the needs of the clients are not identical."}, {"n": 9, "q": "Rhonda Meyer, CFA, is preparing a research report on Moon Ventures, Inc. In the course of\nher research she learns the following:\nMoon had its credit rating downgraded by a prominent rating agency 3 years ago due\nto sales pressure in the industry. The rating was restored 3 months later when the\npressure resolved.\nMoon's insider trading has been substantial over the last 3 months. Holdings of Moon\nshares by officers, directors, and key employees were reduced by 50% during that\nperiod.\nIn Meyer's detailed report making a buy recommendation for Moon, both the credit rating\ndowngrade and the insider trading were omitted from the report.\nMeyer has:", "opts": ["not violated the Code and Standards in her report.", "violated the Code and Standards by not including the insider trading information and by not including the credit rating downgrade in her report.", "violated the Code and Standards by not including the insider trading information in her report."], "ans": "C", "expl": "Standard V(B), Communication with Clients and Prospective Clients, requires analysts to\nuse reasonable judgment regarding the inclusion or exclusion of relevant factors in their\nresearch reports. It would not be unreasonable to exclude the temporary credit\ndowngrade from 3 years earlier."}, {"n": 10, "q": "An analyst receives a research report from a colleague. The colleague's report has an\nelaborate table with performance data on publicly traded stocks. The colleague says the data\nin the table consists of measures provided by Standard & Poor's. The analyst finds the table\na useful reference for a report she is writing. She uses several pieces of data from the table.\nThe analyst is potentially in violation of:", "opts": ["Standard V(A), Diligence and Reasonable Basis, if she does not first verify the data in the table is accurate.", "Standard I(C), Misrepresentation, concerning the use of the work of others.", "no particular standard because this is appropriate activity."], "ans": "A", "expl": "Since the data in the table supposedly comes from Standard & Poor's, a recognized data\nsource, the analyst does not have to cite the source of the data. However, the analyst\nneeds to use reasonable care and verify that the data is accurate by going back to the\nsource. Had the analyst printed the table prepared by her colleague without\nacknowledgement, the analyst would have violated Standard I(C), Misrepresentation."}, {"n": 11, "q": "An analyst finds a stock with historical returns that are not correlated with interest rate\nchanges. The analyst writes a report for his clients that have large allocations in fixed-income\ninstruments and emphasizes the observed lack of correlation. He feels the stock would be of\nlittle value to investors whose portfolios are composed primarily of equities. The clients with\nallocations of fixed income instruments are the only clients to see the report. According to\nStandard V(B), Communication with Clients and Prospective Clients, the analyst has:", "opts": ["violated the article in the Standard concerning facts and opinions.", "not violated the Standard.", "violated the Standard concerning fair dealings with all clients."], "ans": "B", "expl": "Recommending a stock whose return is uncorrelated with interest rate changes is\nappropriate for the clients described in the problem. Emphasizing the lack of correlation is\nappropriate as long as the analyst makes no guarantees concerning the relationship in the\nfuture. Reporting historical correlation is a presentation of fact, and is not in violation. The\nanalyst is free to show the report only to investors for whom the investment is\nappropriate."}, {"n": 12, "q": "An analyst has found an investment with what appears to be a great return-to-risk ratio. The\nanalyst double-checks the data for accuracy, keeps careful records, and is careful to not\nmake any misrepresentations as he simultaneously sends an e-mail to all his clients with a\n\"buy\" recommendation. According to Standard V(A), Diligence and Reasonable Basis, the\nanalyst has:", "opts": ["fulfilled all obligations.", "violated the Standard by communicating the recommendation via e-mail.", "violated the Standard if he does not verify whether the investment is appropriate for all the clients."], "ans": "A", "expl": "If the analyst had been an investment manager, it would have been inappropriate for him\nto make a blanket recommendation for all of his clients without considering the unique\nneeds of each. However, the analyst is merely stating that given the qualities of the\ninvestment, it is an attractive buy. He has kept adequate records, and made fair disclosure\nof his rating decision."}, {"n": 13, "q": "Nicole Wise, CFA, is an analyst at Chicago Securities. She attends a meeting with\nmanagement of one of the companies that she covers. During the meeting, management\nexpresses great optimism about the company's recent acquisition of a new business. Wise is\nexcited about these prospects and issues a research report that states that the company is\nabout to achieve significant success with the new acquisition. Wise has:", "opts": ["not violated CFA Institute Standards of Professional Conduct because she had reasonable reason to believe that the statements in her report were true.", "violated CFA Institute Standards of Professional Conduct because she did not check the accuracy of the statements that management made.", "violated CFA Institute Standards of Professional Conduct because she misrepresented the optimism by turning it to certainty."], "ans": "C", "expl": "Standard V(B), Communication with Clients and Prospective Clients. Members must\ndistinguish between fact and opinion in the presentation of a research report or\ninvestment recommendation. Wise violated the standard because she misrepresented\nmanagement's enthusiasm by turning it into certainty."}, {"n": 14, "q": "A client calls his money manager and asks the manager to liquidate a large portion of his\nassets under management for an emergency. The manager warns the client of the risk of\nselling many assets quickly but says that he will try to get the client the best possible price.\nThis is a violation of:", "opts": ["none of the Standards listed here.", "Standard III(C), Suitability.", "Standard V(A), Diligence and Reasonable Basis."], "ans": "A", "expl": "The money manager has done his duty. He has warned the client of the risk and made no\nexplicit promises concerning what he can and cannot do.\n(Module 91.7, LOS 91: V(A))"}, {"n": 15, "q": "According to CFA Institute Standards of Professional Conduct, members are least likely\nrequired to:", "opts": ["analyze the investment's basic characteristics before recommending a specific investment to a broad client group.", "distribute a detailed research report to clients with any recommendation.", "make diligent efforts to determine whether third party research relied on is sound."], "ans": "B", "expl": "Recommendations can be made in various contexts. For example, an analyst's firm may\nissue a list of buy recommendations or a brief recommendation that does not contain all\nthe relevant details of the analysis, but clients must be informed that a full analysis\nsupporting the recommendation is available. The other actions are required by the\nStandards."}, {"n": 16, "q": "Dawn Wyche, CFA, is an investment manager for high-net-worth clients. One of Wyche's\nclients contacts Wyche's supervisor to complain about a 0.1% fee for access to research that\nwas not specified in the client agreement. If the client's complaint is valid, has Wyche\nviolated the Code and Standards?", "opts": ["Yes, by failing to disclose the nature and cost of the services provided.", "Yes, by misrepresenting what services were included in the client agreement.", "No, because the money amount of the fee could not be stated in advance."], "ans": "A", "expl": "Wyche violated Standard V(B) Communication with Clients and Prospective Clients by\nfailing to make the cost of her services clear to the client. This requirement applies\nregardless of whether the specific money amount can be known in advance. The\ninformation given does not suggest Wyche misrepresented what services she would\nprovide to the client.\n(Module 91.7, LOS 91: V(B))"}, {"n": 17, "q": "Ted Riczek, CFA, is an independent investment advisor. Riczek often makes investment\nrecommendations to clients based on research from several third-party sources. The Code\nand Standards most likely require Riczek to:", "opts": ["disclose to his clients the sources of any third-party research that supports his recommendations.", "make a reasonable effort to verify that the third-party research is sound.", "perform his own research rather than relying on third-party research."], "ans": "B", "expl": "Standard V(A) Diligence and Reasonable Basis states that members and candidates who\nrely on third-party research must make reasonable efforts to ensure that the research has\na sound basis. According to Standard I(C) Misrepresentation, if members and candidates\nuse third-party research they should disclose this fact to clients, but the Standards do not\nrequire disclosure of the specific sources.\n(Module 91.7, LOS 91: V(A))"}, {"n": 18, "q": "Ethyl Redd recently joined Bloomington Investments as a research analyst. After spending an\nafternoon looking through the research team's archives, Redd is not sure Bloomington\nmaintains the records that support the team's analysis and recommendations for the\nminimum 7-year period called for by Standard V(C), Record Retention. What is Redd's most\nappropriate course of action?", "opts": ["Decline to participate in any new research until she can verify that the firm is in compliance with the Standard.", "Keep her own copies of the relevant records and maintain them at home for a minimum 7-year holding period.", "Review the firm’s record retention procedures with her supervisor or compliance officer to ensure that they comply with the Standard, or suggest ways to bring them into compliance."], "ans": "C", "expl": "Standard V(C), Record Retention requires that members maintain all records supporting\nanalysis, recommendations, actions, and all other investment related communications\nwith clients and prospects. The recommended procedures for compliance with Standard\nV(C) state that the record-keeping requirement is generally the firm's responsibility. These\nrecords are the property of the firm, so Redd keeping her own copies at home could\npotentially violate Standard IV(A), Loyalty. Redd's best course of action is to review the\nfirm's procedures with her supervisor and recommend any improvements that are\nnecessary to bring them into compliance with Standard V(C).\n(Module 91.7, LOS 91: V(C))"}, {"n": 19, "q": "The following scenarios refer to recommendations made by two analysts.\nJean King, CFA, is a quantitative analyst at Quantlogic, Inc. King uses computer-\ngenerated screens to differentiate value and growth stocks based on accounting\nnumbers such as sales, cash flow, earnings, and book value. Based on her analysis of\nall domestically traded stocks in the U.S. over the past year, King concludes that value\nstocks as a class have underperformed growth stocks over that period. Using only this\nanalysis, she recommends that account executives at Quantlogic sell all value stocks\nfrom the portfolios for which they have discretionary authority to trade and replace\nthese stocks with growth stocks.\nJames Capelli, CFA, is a fundamental analyst at Wheaton Capital Management, which\nfocuses on regional stocks. His analysis of Branson Wireless includes the investment's\nbasic characteristics such as information about historical earnings, ownership of\nassets, outstanding contracts, and other business factors. In addition to conducting\nboth a general industry analysis and a company financial analysis, Capelli interviews\nkey executives at Branson. Based on his analysis, he concludes that the company's\nfuture prospects are strong and issues a \"buy\" recommendation.\nAccording to CFA Institute Standards of Professional Conduct, did King and Capelli have a\nreasonable and adequate basis for making their recommendations?", "opts": ["Both King and Capelli have a reasonable basis for their recommendations.", "Capelli has a reasonable basis for his recommendation, but King does not.", "King has a reasonable basis for his recommendation, but Capelli does not."], "ans": "B", "expl": "Capelli appears to have exercised diligence and thoroughness in making his\nrecommendation. King's recommendation is not based on thorough quantitative work\nbecause the period used in her study is only one year. Also, her recommendation does not\nconsider the client's specific needs and circumstances."}, {"n": 20, "q": "An analyst writes a report and includes the forecasts of an econometric model developed by\nthe firm's research department. The analyst identifies the source of the forecast and\nincludes all the relevant statistics concerning the model. With respect to diligence and\nreasonable basis, the analyst has:", "opts": ["complied with the Standards.", "violated the Standards by not evaluating the model independently.", "violated the Standards by relying on model forecasts."], "ans": "A", "expl": "Members and candidates may reasonably rely on their firms' research departments for\nanalysis and remain in compliance with Standard V(A) Diligence and Reasonable Basis."}, {"n": 21, "q": "Lee Hurst, CFA, is an equity research analyst who has recently left a large firm to start\nindependent practice. He is able to re-create several of his previous research reports, based\non his clear recollection of supporting documentation he compiled at his previous employer.\nHe publishes the reports and obtains several new clients. Hurst is most likely:", "opts": ["not in violation of any Standard.", "in violation of the Standard concerning diligence and reasonable basis.", "in violation of the Standard concerning record retention."], "ans": "C", "expl": "Hurst is most likely in violation of Standard V(C) Record Retention because the supporting\ndocumentation is unavailable. He needs to recreate the supporting records based on\ninformation gathered through public sources or the covered company. He may have a\nreasonable basis for his recommendations and have been diligent in his analysis, but must\nreconstruct the records of this analysis before issuing the reports."}, {"n": 22, "q": "Several years ago, Hilton and Ross, a full service investment firm, managed the initial public\noffering of eCom, Inc. Now, eCom wants Hilton and Ross to underwrite its secondary public\noffering. A senior manager at Hilton and Ross asks Brent Whitman, CFA, one of its equity\nanalysts, to write a favorable research report on eCom to help make the underwriting a\nsuccess. Whitman conducts a thorough analysis of eCom and concludes that the company\nhas serious problems that do not suggest a favorable financial outlook. Nevertheless,\nWhitman writes a favorable report because he is fearful of losing his job. Hilton and Ross\npublicly distribute a report that only contains a buy recommendation and a brief description\nof the basic characteristics of eCom. Whitman has violated:", "opts": ["Both Standard I(B) Independence and Objectivity and Standard V(A) Diligence and Reasonable Basis.", "Standard I(B) Independence and Objectivity, only.", "Standard V(A) Diligence and Reasonable Basis only."], "ans": "A", "expl": "Whitman violated Standard V(A) Diligence and Reasonable Basis because he did not have a\nreasonable and adequate basis for issuing a favorable recommendation. Whitman violated\nStandard I(B) Independence and Objectivity because he did not act independently in\nissuing his recommendation but instead was influenced by senior management at Hilton\nand Ross."}, {"n": 23, "q": "Bertrand Greene, CFA, is preparing a report on Blanding, Inc. Blanding's earnings have\nincreased in each of the last six years by an average of 11.8%. Based on his analysis, Greene\nprojects that Blanding's earnings will increase by 12.5% in each of the next two years. When\nhe refers to this projection in his report, Greene will violate the Code and Standards if he\nstates:", "opts": ["\"We expect Blanding's earnings growth to increase to 12.5% annually in the next two years.\"", "\"Blanding's earnings will grow at 12.5% annually in each of the next two years.\"", "\"Blanding's earnings have been compounding at approximately 11.8% annually.\""], "ans": "B", "expl": "Standard V(B) Communication with Clients and Prospective Clients requires members to\ndistinguish between fact and opinion. \"Blanding's earnings will grow at 12.5% annually in\neach of the next two years\" violates the Standard by stating an uncertain future outcome\nas a fact. Preceding the statement with a qualifier such as \"We expect...\" identifies the\nforecast as an opinion.\n(Module 91.7, LOS 91: V(B))"}, {"n": 24, "q": "Janet Coleman, CFA, is preparing a research report on Union Utilities. During the past year,\nthree of the five utility companies in her region have cut their dividends by 50%, on average,\nto provide more internal funds for capital investment. Coleman reasons that the\nmanagement of Union will be under pressure to cut its dividends within the next year to\nremain competitive. Coleman issues a research report in which she states:\n\"Union will decrease its dividend from $2 to $1 a share by the second quarter to finance its\ninvestment opportunities. If investors buy the stock now at around $50 a share, their total\nreturn could exceed 20%.\"\nWith regard to the Standard on communication with clients and prospective clients,\nColeman:", "opts": ["violated the Standard because she failed to distinguish opinion from fact.", "did not violate the Standard.", "violated the Standard because she promised a specific return on an investment."], "ans": "A", "expl": "Coleman's statement that Union \"will\" decrease its dividend fails to distinguish between\nfact and opinion, as required by Standard V(B) Communication with Clients and\nProspective Clients, because a prediction is not a fact. Her statement that total return\n\"could\" exceed 20% is appropriately phrased as an opinion."}, {"n": 25, "q": "An analyst has several groups of clients who are categorized according to their specific\nneeds. Compared to research reports distributed to all of the clients, reports for a specific\ngroup:", "opts": ["are required to include more basic facts.", "may generally exclude more basic facts.", "are not permitted by the Code and Standards."], "ans": "B", "expl": "According to Standard V(B) Communication with Clients and Prospective Clients, an analyst\ncan use reasonable judgment regarding the exclusion of some facts and should include\nmore basic facts for reports to wider audiences. The key issue is that analysts should tailor\ntheir reports to the intended audience."}, {"n": 26, "q": "In preparing research reports, which of the following is least likely required or\nrecommended by the Code and Standards?", "opts": ["Attribute paraphrases and summaries of material prepared by others.", "Maintain copies of materials that were relied on in preparing the research report.", "Send all reports to the firm's legal counsel to ensure compliance with securities laws."], "ans": "C", "expl": "Members do not need to send all reports to the firm's legal counsel to ensure compliance\nwith securities laws.\n(Module 91.7, LOS 91: V(B))"}];
const CFG = {"title": "Guidance for Standard V", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.7 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const day = new Date().toISOString().slice(0,10);
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    document.querySelectorAll('.opt.correct').forEach(function(o){ addMark(o,'✅'); });
    document.querySelectorAll('.opt.wrong').forEach(function(o){ addMark(o,'❌'); });
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#6d5efc','#9d8bff','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
</body>
</html>
