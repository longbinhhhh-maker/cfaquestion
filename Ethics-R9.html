<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"In the preparation of a research report, a CFA Institute member may emphasize certain\nmatters, touch briefly on others, and omit some altogether:","opts":["provided that the analyst both has a reasonable basis and is unconstrained by the Mosaic theory.","provided that the analyst has a reasonable basis for his or her actions.","under no circumstances."],"ans":"B","expl":"Theo Tiêu chuẩn V(B), nhà phân tích phải sử dụng phán đoán hợp lý trong việc xác định\ncác yếu tố liên quan khi giao tiếp với khách hàng và khách hàng tiềm năng. Lý thuyết khả thi\nkhông áp dụng ở đây."},{"n":2,"q":"Standard V(B), Communication with Clients and Prospective Clients, least likely requires\nmembers to:","opts":["disclose the general principles of investment processes used to analyze and select securities, and construct portfolios.","make clear buy or sell recommendations on the securities covered in research reports.","use reasonable judgment regarding the inclusion or exclusion of relevant factors in research reports."],"ans":"B","expl":"Không có nghĩa vụ đưa ra khuyến nghị mua hoặc bán đối với các chứng khoán được đề cập\ntheo nghiên cứu báo cáo."},{"n":3,"q":"Peggy Green, CFA, is a research analyst following Brown Co. All the information she has\ngathered suggests the stock should be rated a weak \"hold.\" During a recent lunch, Green\noverheard another analyst say that the stock should be rated a \"buy.\" Green returns to her\noffice and issues a \"buy\" recommendation. Green has most likely violated the Code and\nStandards by:","opts":["acting or causing others to act on material nonpublic information.","failing to distinguish between fact and opinion.","recommending an investment action without a reasonable basis."],"ans":"C","expl":"Tiêu chuẩn V(A) Cần mẫn và Cơ sở hợp lý yêu cầu các thành viên và ứng viên phải có\ncơ sở hợp lý và đầy đủ, được hỗ trợ bởi nghiên cứu và điều tra phù hợp, cho\nđề xuất của họ.\n(Mô-đun 91.7, LOS 91: V(A))"},{"n":4,"q":"Bill Fox, CFA, has been preparing a research report on New London Wire and Cable, one of\nhis major investment clients. He had completed much of his analysis and had planned on\nhaving his report typed and bound today. Unfortunately, his briefcase was stolen while he\nate breakfast, and he lost all his notes and working papers. The lost materials included his\nnotes from management interviews, conversations with suppliers and competitors, dates of\ncompany visits, and his computer diskette containing much of his quantitative analysis. Fox's\nclient needs this report tomorrow. In a panic, Fox called New London's vice president of\nfinance and was faxed a copy of the company's most recent financial projections. Fox\nremembered that his own analysis showed that management's estimates were too high. He\ndid not remember the exact amount, so he revised New London's figures downward 10%.\nFox incorporated some charts and graphs on New London from a research report he\nreceived last week from a small regional research firm and some information from a\nStandard & Poor's reference work in his report, without reference to their sources. Fox has:","opts":["violated none of the Standards.","violated the requirement to have a reasonable basis for a recommendation, the prohibition against plagiarism, and the requirement to maintain appropriate records.","violated the requirement to have a reasonable basis for a recommendation and the prohibition against plagiarism."],"ans":"B","expl":"Có khả năng báo cáo của New London tự phục vụ, vì vậy Fox đã không thực hiện sự siêng năng hoặc có\ncơ sở thích hợp cho khuyến nghị của mình. Ngoài ra, Fox cũng không thừa nhận nguồn\ncủa mình về các biểu đồ và đồ thị. Cuối cùng, anh ta đã không lưu giữ đầy đủ hồ sơ."},{"n":5,"q":"Todd Gable, CFA, was attending a noon luncheon when he overheard two software\nexecutives talking about a common vendor, Datagen, about how wonderful they thought the\ncompany was, and about a rumor that a major brokerage firm was preparing to issue a\nstrong buy recommendation on the stock. Gable returned to the office, checked a couple of\nonline sources, and then placed an order to purchase Datagen in all of his discretionary\nportfolios. The orders were filled within an hour. Three days later, a brokerage house issued\na strong buy recommendation and Datagen's share price went up 20%. Gable then obtained\nthe brokerage house's research report on Datagen and quoted parts of it in a report to his\nclients. Gable has most likely violated the Standards by:\nGable has:","opts":["using material nonpublic information.","using the recommendation of another brokerage firm in his report.","not having a reasonable basis for an investment action."],"ans":"C","expl":"Tiêu chuẩn V(A) yêu cầu các thành viên phải có cơ sở hợp lý và đầy đủ để thực hiện\ncác hành động đầu tư. Việc nghe lén một cuộc trò chuyện không cung cấp đủ cơ sở.\nTuy nhiên, tin đồn nghe được không phải là thông tin quan trọng không công khai. Việc trích dẫn nghiên cứu của một công ty\nkhác được chấp nhận miễn là tài liệu được ghi nguồn hợp lý."},{"n":6,"q":"Don Wilson and Nadine Chavis, both CFA charterholders, are investment advisors at Uptown\nSecurities. Wilson recommends that one of his clients buy Alpha Company based on\nresearch conducted by Uptown. Chavis recommends that one of her clients sell Alpha\nCompany based on research conducted by another brokerage firm for general distribution.\nBoth recommendations are consistent with each client's investment objectives and within\nthe context of their entire portfolios. Neither Wilson nor Chavis has reason to suspect that\nany information contained in the research reports from these two sources is inaccurate or\ninadequately supported. According to Standard V(A) Diligence and Reasonable Basis, do\nWilson and Chavis have a reasonable basis for making their investment recommendations?","opts":["Both of these advisors have a reasonable basis for their recommendations.","Neither of these advisors has a reasonable basis for their recommendations.","Only one of these advisors has a reasonable basis for his or her recommendation."],"ans":"A","expl":"Wilson và Chavis có cơ sở hợp lý và đầy đủ nếu họ đề xuất một\ngiao dịch đầu tư dựa trên nghiên cứu hợp lý do công ty của họ hoặc\nbên thứ ba độc lập chuẩn bị.\n(Module 91.7, LOS 91: V(A))"},{"n":7,"q":"Wes Smith, CFA, works for Advisors, Inc. In order to remain in compliance with Standard V(A),\nDiligence and Reasonable Basis, Smith may recommend a security in which of the following\nsituations?","opts":["Advisors' research department recommends a stock.","For either of the reasons listed here.","Smith reads a favorable review of the security in a widely read periodical."],"ans":"A","expl":"Smith sẽ vi phạm nếu anh ta hành động chỉ dựa trên những gì anh ta đọc trong tạp chí định kỳ.\nViệc sử dụng thông tin trong công ty có thể được tin cậy trừ khi Smith có lý do\ntin rằng nguồn thiếu cơ sở vững chắc."},{"n":8,"q":"Bob Hatfield, CFA, has his own money management firm with two clients. The accounts of\nthe two clients are equal in value. It is Hatfield's opinion that interest rates will fall in the\nnear future. Based upon this, Hatfield begins increasing the bond allocation of each\nportfolio. In order to comply with Standard V(B), Communication with Clients and\nProspective Clients, the analyst needs to:","opts":["inform the clients of the change and tell them it is based upon an opinion and not a fact.","make sure that the change is identical for both clients.","perform both of these functions."],"ans":"A","expl":"Theo Tiêu chuẩn V(B), nhà phân tích phải thông báo cho khách hàng về sự thay đổi và cho họ biết\nnó dựa trên ý kiến chứ không phải sự thật. Thực hiện một thay đổi giống hệt nhau trong hai danh mục\ncó thể vi phạm tiêu chuẩn này nếu nhu cầu của khách hàng không giống nhau."},{"n":9,"q":"Rhonda Meyer, CFA, is preparing a research report on Moon Ventures, Inc. In the course of\nher research she learns the following:\nMoon had its credit rating downgraded by a prominent rating agency 3 years ago due\nto sales pressure in the industry. The rating was restored 3 months later when the\npressure resolved.\nMoon's insider trading has been substantial over the last 3 months. Holdings of Moon\nshares by officers, directors, and key employees were reduced by 50% during that\nperiod.\nIn Meyer's detailed report making a buy recommendation for Moon, both the credit rating\ndowngrade and the insider trading were omitted from the report.\nMeyer has:","opts":["not violated the Code and Standards in her report.","violated the Code and Standards by not including the insider trading information and by not including the credit rating downgrade in her report.","violated the Code and Standards by not including the insider trading information in her report."],"ans":"C","expl":"Tiêu chuẩn V(B), Giao tiếp với Khách hàng và Khách hàng tiềm năng, yêu cầu các nhà phân tích\nsử dụng phán đoán hợp lý về việc đưa vào hoặc loại trừ các yếu tố liên quan trong báo cáo nghiên cứu\ncủa họ. Sẽ không phải là vô lý nếu loại trừ việc hạ cấp tín dụng\ntạm thời từ 3 năm trước."},{"n":10,"q":"An analyst receives a research report from a colleague. The colleague's report has an\nelaborate table with performance data on publicly traded stocks. The colleague says the data\nin the table consists of measures provided by Standard & Poor's. The analyst finds the table\na useful reference for a report she is writing. She uses several pieces of data from the table.\nThe analyst is potentially in violation of:","opts":["Standard V(A), Diligence and Reasonable Basis, if she does not first verify the data in the table is accurate.","Standard I(C), Misrepresentation, concerning the use of the work of others.","no particular standard because this is appropriate activity."],"ans":"A","expl":"Vì dữ liệu trong bảng được cho là đến từ Standard & Poor's, một nguồn dữ liệu được công nhận\n nên nhà phân tích không cần phải trích dẫn nguồn dữ liệu. Tuy nhiên, nhà phân tích\ncần thận trọng hợp lý và xác minh rằng dữ liệu là chính xác bằng cách quay lại nguồn\n. Nếu nhà phân tích in bảng do đồng nghiệp của cô ấy chuẩn bị mà không có\nxác nhận thì nhà phân tích đó đã vi phạm Tiêu chuẩn I(C), Trình bày sai."},{"n":11,"q":"An analyst finds a stock with historical returns that are not correlated with interest rate\nchanges. The analyst writes a report for his clients that have large allocations in fixed-income\ninstruments and emphasizes the observed lack of correlation. He feels the stock would be of\nlittle value to investors whose portfolios are composed primarily of equities. The clients with\nallocations of fixed income instruments are the only clients to see the report. According to\nStandard V(B), Communication with Clients and Prospective Clients, the analyst has:","opts":["violated the article in the Standard concerning facts and opinions.","not violated the Standard.","violated the Standard concerning fair dealings with all clients."],"ans":"B","expl":"Đề xuất một cổ phiếu có lợi nhuận là không tương quan với những thay đổi về lãi suất\nthích hợp cho các khách hàng được mô tả trong vấn đề. Việc nhấn mạnh đến việc thiếu sự tương quan là\nphù hợp miễn là nhà phân tích không đưa ra đảm bảo nào về mối quan hệ trong\ntương lai. Báo cáo mối tương quan lịch sử là sự trình bày sự thật và không vi phạm.\nnhà phân tích chỉ có quyền hiển thị báo cáo cho những nhà đầu tư có khoản đầu tư\nthích hợp."},{"n":12,"q":"An analyst has found an investment with what appears to be a great return-to-risk ratio. The\nanalyst double-checks the data for accuracy, keeps careful records, and is careful to not\nmake any misrepresentations as he simultaneously sends an e-mail to all his clients with a\n\"buy\" recommendation. According to Standard V(A), Diligence and Reasonable Basis, the\nanalyst has:","opts":["fulfilled all obligations.","violated the Standard by communicating the recommendation via e-mail.","violated the Standard if he does not verify whether the investment is appropriate for all the clients."],"ans":"A","expl":"Nếu nhà phân tích là nhà quản lý đầu tư, điều đó sẽ việc anh ấy\nđưa ra đề xuất chung cho tất cả khách hàng của mình mà không xem xét đến\nnhu cầu riêng của từng khách hàng là không phù hợp. Tuy nhiên, nhà phân tích chỉ đơn thuần tuyên bố rằng xét đến chất lượng của khoản đầu tư\n, đây là một giao dịch mua hấp dẫn. Anh ấy đã lưu giữ đầy đủ hồ sơ và tiết lộ công bằng\nvề quyết định xếp hạng của mình."},{"n":13,"q":"Nicole Wise, CFA, is an analyst at Chicago Securities. She attends a meeting with\nmanagement of one of the companies that she covers. During the meeting, management\nexpresses great optimism about the company's recent acquisition of a new business. Wise is\nexcited about these prospects and issues a research report that states that the company is\nabout to achieve significant success with the new acquisition. Wise has:","opts":["not violated CFA Institute Standards of Professional Conduct because she had reasonable reason to believe that the statements in her report were true.","violated CFA Institute Standards of Professional Conduct because she did not check the accuracy of the statements that management made.","violated CFA Institute Standards of Professional Conduct because she misrepresented the optimism by turning it to certainty."],"ans":"C","expl":"Tiêu chuẩn V(B), Giao tiếp với Khách hàng và Khách hàng tiềm năng. Các thành viên phải\nphân biệt giữa thực tế và quan điểm trong việc trình bày báo cáo nghiên cứu hoặc\nkhuyến nghị đầu tư. Wise đã vi phạm tiêu chuẩn vì cô ấy đã xuyên tạc\nsự nhiệt tình của ban quản lý bằng cách biến nó thành sự chắc chắn."},{"n":14,"q":"A client calls his money manager and asks the manager to liquidate a large portion of his\nassets under management for an emergency. The manager warns the client of the risk of\nselling many assets quickly but says that he will try to get the client the best possible price.\nThis is a violation of:","opts":["none of the Standards listed here.","Standard III(C), Suitability.","Standard V(A), Diligence and Reasonable Basis."],"ans":"A","expl":"Người quản lý tiền đã hoàn thành nhiệm vụ của mình. Anh ta đã cảnh báo khách hàng về rủi ro và không đưa ra\nlời hứa rõ ràng về những gì anh ta có thể và không thể làm.\n(Module 91.7, LOS 91: V(A))"},{"n":15,"q":"According to CFA Institute Standards of Professional Conduct, members are least likely\nrequired to:","opts":["analyze the investment's basic characteristics before recommending a specific investment to a broad client group.","distribute a detailed research report to clients with any recommendation.","make diligent efforts to determine whether third party research relied on is sound."],"ans":"B","expl":"Có thể đưa ra đề xuất trong nhiều bối cảnh khác nhau. Ví dụ: công ty của nhà phân tích có thể\nđưa ra danh sách đề xuất mua hoặc đề xuất ngắn gọn không chứa tất cả\nchi tiết liên quan của bản phân tích, nhưng khách hàng phải được thông báo rằng có sẵn bản phân tích đầy đủ\nhỗ trợ cho đề xuất đó. Các hành động khác được yêu cầu theo\nTiêu chuẩn."},{"n":16,"q":"Dawn Wyche, CFA, is an investment manager for high-net-worth clients. One of Wyche's\nclients contacts Wyche's supervisor to complain about a 0.1% fee for access to research that\nwas not specified in the client agreement. If the client's complaint is valid, has Wyche\nviolated the Code and Standards?","opts":["Yes, by failing to disclose the nature and cost of the services provided.","Yes, by misrepresenting what services were included in the client agreement.","No, because the money amount of the fee could not be stated in advance."],"ans":"A","expl":"Wyche đã vi phạm Giao tiếp V(B) Tiêu chuẩn với Khách hàng và Khách hàng tiềm năng bởi\nkhông thông báo rõ ràng chi phí dịch vụ của mình cho khách hàng. Yêu cầu này áp dụng\nbất kể số tiền cụ thể có thể được biết trước hay không.\nthông tin được cung cấp không cho thấy Wyche đã trình bày sai về những dịch vụ mà cô ấy sẽ\ncung cấp cho khách hàng.\n(Mô-đun 91.7, LOS 91: V(B))"},{"n":17,"q":"Ted Riczek, CFA, is an independent investment advisor. Riczek often makes investment\nrecommendations to clients based on research from several third-party sources. The Code\nand Standards most likely require Riczek to:","opts":["disclose to his clients the sources of any third-party research that supports his recommendations.","make a reasonable effort to verify that the third-party research is sound.","perform his own research rather than relying on third-party research."],"ans":"B","expl":"Cơ sở hợp lý và siêng năng tiêu chuẩn V(A) quy định rằng các thành viên và ứng viên\ndựa vào nghiên cứu của bên thứ ba phải nỗ lực hợp lý để đảm bảo rằng nghiên cứu\nmột cơ sở vững chắc. Theo Tiêu chuẩn I(C) Trình bày sai, nếu các thành viên và ứng viên\nsử dụng nghiên cứu của bên thứ ba thì họ phải tiết lộ thông tin này cho khách hàng, nhưng Tiêu chuẩn không\nyêu cầu tiết lộ các nguồn cụ thể.\n(Mô-đun 91.7, LOS 91: V(A))"},{"n":18,"q":"Ethyl Redd recently joined Bloomington Investments as a research analyst. After spending an\nafternoon looking through the research team's archives, Redd is not sure Bloomington\nmaintains the records that support the team's analysis and recommendations for the\nminimum 7-year period called for by Standard V(C), Record Retention. What is Redd's most\nappropriate course of action?","opts":["Decline to participate in any new research until she can verify that the firm is in compliance with the Standard.","Keep her own copies of the relevant records and maintain them at home for a minimum 7-year holding period.","Review the firm’s record retention procedures with her supervisor or compliance officer to ensure that they comply with the Standard, or suggest ways to bring them into compliance."],"ans":"C","expl":"Tiêu chuẩn V(C), Lưu giữ hồ sơ yêu cầu các thành viên duy trì tất cả hồ sơ hỗ trợ\nphân tích, đề xuất, hành động và tất cả các thông tin liên lạc liên quan đến đầu tư khác\nvới khách hàng và triển vọng. Các quy trình được khuyến nghị để tuân thủ Tiêu chuẩn\nV(C) nêu rõ rằng yêu cầu lưu giữ hồ sơ nói chung là trách nhiệm của công ty. Những\nhồ sơ này là tài sản của công ty, vì vậy Redd giữ bản sao của riêng mình ở nhà có thể\ncó khả năng vi phạm Tiêu chuẩn IV(A), Lòng trung thành. Cách hành động tốt nhất của Redd là xem xét\ncác quy trình của công ty với người giám sát của cô ấy và đề xuất bất kỳ cải tiến nào\ncần thiết để khiến chúng tuân thủ Tiêu chuẩn V(C).\n(Mô-đun 91.7, LOS 91: V(C))"},{"n":19,"q":"The following scenarios refer to recommendations made by two analysts.\nJean King, CFA, is a quantitative analyst at Quantlogic, Inc. King uses computer-\ngenerated screens to differentiate value and growth stocks based on accounting\nnumbers such as sales, cash flow, earnings, and book value. Based on her analysis of\nall domestically traded stocks in the U.S. over the past year, King concludes that value\nstocks as a class have underperformed growth stocks over that period. Using only this\nanalysis, she recommends that account executives at Quantlogic sell all value stocks\nfrom the portfolios for which they have discretionary authority to trade and replace\nthese stocks with growth stocks.\nJames Capelli, CFA, is a fundamental analyst at Wheaton Capital Management, which\nfocuses on regional stocks. His analysis of Branson Wireless includes the investment's\nbasic characteristics such as information about historical earnings, ownership of\nassets, outstanding contracts, and other business factors. In addition to conducting\nboth a general industry analysis and a company financial analysis, Capelli interviews\nkey executives at Branson. Based on his analysis, he concludes that the company's\nfuture prospects are strong and issues a \"buy\" recommendation.\nAccording to CFA Institute Standards of Professional Conduct, did King and Capelli have a\nreasonable and adequate basis for making their recommendations?","opts":["Both King and Capelli have a reasonable basis for their recommendations.","Capelli has a reasonable basis for his recommendation, but King does not.","King has a reasonable basis for his recommendation, but Capelli does not."],"ans":"B","expl":"Capelli dường như đã thực hiện sự siêng năng và kỹ lưỡng trong việc đưa ra\nđề xuất của mình. Khuyến nghị của King không dựa trên công việc định lượng kỹ lưỡng\nvì khoảng thời gian được sử dụng trong nghiên cứu của cô chỉ là một năm. Ngoài ra, đề xuất của cô ấy không\nxem xét nhu cầu và hoàn cảnh cụ thể của khách hàng."},{"n":20,"q":"An analyst writes a report and includes the forecasts of an econometric model developed by\nthe firm's research department. The analyst identifies the source of the forecast and\nincludes all the relevant statistics concerning the model. With respect to diligence and\nreasonable basis, the analyst has:","opts":["complied with the Standards.","violated the Standards by not evaluating the model independently.","violated the Standards by relying on model forecasts."],"ans":"A","expl":"Các thành viên và ứng viên có thể tin cậy một cách hợp lý vào bộ phận nghiên cứu của công ty họ để\nanalysis và vẫn tuân thủ Cơ sở hợp lý và siêng năng của Tiêu chuẩn V(A)."},{"n":21,"q":"Lee Hurst, CFA, is an equity research analyst who has recently left a large firm to start\nindependent practice. He is able to re-create several of his previous research reports, based\non his clear recollection of supporting documentation he compiled at his previous employer.\nHe publishes the reports and obtains several new clients. Hurst is most likely:","opts":["not in violation of any Standard.","in violation of the Standard concerning diligence and reasonable basis.","in violation of the Standard concerning record retention."],"ans":"C","expl":"Hurst rất có thể vi phạm Lưu giữ bản ghi Tiêu chuẩn V(C) vì hỗ trợ\nkhông có sẵn. Anh ta cần tạo lại các bản ghi hỗ trợ dựa trên\nthông tin được thu thập thông qua các nguồn công cộng hoặc công ty được bảo hiểm. Anh ta có thể có\ncơ sở hợp lý cho các khuyến nghị của mình và đã siêng năng phân tích, nhưng phải\nxây dựng lại hồ sơ của phân tích này trước khi đưa ra báo cáo."},{"n":22,"q":"Several years ago, Hilton and Ross, a full service investment firm, managed the initial public\noffering of eCom, Inc. Now, eCom wants Hilton and Ross to underwrite its secondary public\noffering. A senior manager at Hilton and Ross asks Brent Whitman, CFA, one of its equity\nanalysts, to write a favorable research report on eCom to help make the underwriting a\nsuccess. Whitman conducts a thorough analysis of eCom and concludes that the company\nhas serious problems that do not suggest a favorable financial outlook. Nevertheless,\nWhitman writes a favorable report because he is fearful of losing his job. Hilton and Ross\npublicly distribute a report that only contains a buy recommendation and a brief description\nof the basic characteristics of eCom. Whitman has violated:","opts":["Both Standard I(B) Independence and Objectivity and Standard V(A) Diligence and Reasonable Basis.","Standard I(B) Independence and Objectivity, only.","Standard V(A) Diligence and Reasonable Basis only."],"ans":"A","expl":"Whitman đã vi phạm Tiêu chuẩn V(A) Siêng năng và Cơ sở Hợp lý vì ông không có\ncơ sở hợp lý và đầy đủ để đưa ra khuyến nghị có lợi. Whitman đã vi phạm\nTính độc lập và khách quan của Tiêu chuẩn I(B) vì ông không hành động độc lập khi\nđưa ra khuyến nghị của mình mà thay vào đó lại bị ảnh hưởng bởi quản lý cấp cao tại Hilton\nvà Ross."},{"n":23,"q":"Bertrand Greene, CFA, is preparing a report on Blanding, Inc. Blanding's earnings have\nincreased in each of the last six years by an average of 11.8%. Based on his analysis, Greene\nprojects that Blanding's earnings will increase by 12.5% in each of the next two years. When\nhe refers to this projection in his report, Greene will violate the Code and Standards if he\nstates:","opts":["\"We expect Blanding's earnings growth to increase to 12.5% annually in the next two years.\"","\"Blanding's earnings will grow at 12.5% annually in each of the next two years.\"","\"Blanding's earnings have been compounding at approximately 11.8% annually.\""],"ans":"B","expl":"Giao tiếp tiêu chuẩn V(B) với Khách hàng và Khách hàng tiềm năng yêu cầu các thành viên\nphân biệt giữa thực tế và quan điểm. \"Thu nhập của Blanding sẽ tăng trưởng với tốc độ 12,5% hàng năm trong\nmỗi năm trong hai năm tới\" vi phạm Tiêu chuẩn khi nêu rõ một kết quả không chắc chắn trong tương lai\nlà một thực tế. Trước câu phát biểu bằng một từ hạn định, chẳng hạn như \"Chúng tôi mong đợi...\" xác định\ndự báo là một ý kiến.\n(Mô-đun 91.7, LOS 91: V(B))"},{"n":24,"q":"Janet Coleman, CFA, is preparing a research report on Union Utilities. During the past year,\nthree of the five utility companies in her region have cut their dividends by 50%, on average,\nto provide more internal funds for capital investment. Coleman reasons that the\nmanagement of Union will be under pressure to cut its dividends within the next year to\nremain competitive. Coleman issues a research report in which she states:\n\"Union will decrease its dividend from $2 to $1 a share by the second quarter to finance its\ninvestment opportunities. If investors buy the stock now at around $50 a share, their total\nreturn could exceed 20%.\"\nWith regard to the Standard on communication with clients and prospective clients,\nColeman:","opts":["violated the Standard because she failed to distinguish opinion from fact.","did not violate the Standard.","violated the Standard because she promised a specific return on an investment."],"ans":"A","expl":"Tuyên bố của Coleman rằng Union \"sẽ\" giảm cổ tức không phân biệt được giữa\nthực tế và quan điểm, theo yêu cầu của Giao tiếp với khách hàng của Standard V(B) và\nKhách hàng tiềm năng, vì dự đoán không phải là sự thật. Tuyên bố của cô ấy rằng tổng lợi nhuận\n\"có thể\" vượt quá 20% được diễn đạt một cách thích hợp như một ý kiến."},{"n":25,"q":"An analyst has several groups of clients who are categorized according to their specific\nneeds. Compared to research reports distributed to all of the clients, reports for a specific\ngroup:","opts":["are required to include more basic facts.","may generally exclude more basic facts.","are not permitted by the Code and Standards."],"ans":"B","expl":"Theo Giao tiếp Tiêu chuẩn V(B) với Khách hàng và Khách hàng tiềm năng, một nhà phân tích\ncó thể đưa ra phán đoán hợp lý về việc loại trừ một số thông tin và nên đưa vào\ncác thông tin cơ bản hơn để báo cáo cho nhiều đối tượng hơn. Vấn đề chính là các nhà phân tích nên điều chỉnh\nbáo cáo của họ cho phù hợp với đối tượng mục tiêu."},{"n":26,"q":"In preparing research reports, which of the following is least likely required or\nrecommended by the Code and Standards?","opts":["Attribute paraphrases and summaries of material prepared by others.","Maintain copies of materials that were relied on in preparing the research report.","Send all reports to the firm's legal counsel to ensure compliance with securities laws."],"ans":"C","expl":"Các thành viên không cần gửi tất cả báo cáo cho cố vấn pháp lý của công ty để đảm bảo tuân thủ\nluật chứng khoán.\n(Module 91.7, LOS 91: V(B))"}];
const CFG = {"title": "Guidance for Standard V", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.7 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  return sections;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;

    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

(function(){
  var loaded=false;
  function P(){return document.getElementById("qnotesPanel");}
  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");

    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();

<script id="qcheck-js">
/* Kiểm tra đáp án từng câu (chỉ áp dụng cho các đề Ethics theo Reading). */
(function(){
  function idx(card){ return (card.id && card.id.indexOf("q-")===0) ? +card.id.slice(2) : -1; }
  function addBtn(card){
    if(!card.classList || !card.classList.contains("card")) return;
    if(card.querySelector(".qcheck-wrap")) return;
    var i = idx(card); if(i<0) return;
    if(typeof CFG!=="undefined" && CFG && CFG.hasAnswers===false) return; // không có đáp án -> bỏ qua
    var wrap=document.createElement("div"); wrap.className="qcheck-wrap";
    var btn=document.createElement("button"); btn.type="button"; btn.className="qcheck-btn";
    btn.textContent="Kiểm tra đáp án";
    var msg=document.createElement("span"); msg.className="qcheck-msg";
    btn.onclick=function(){ checkOne(i, card, btn, msg); };
    wrap.appendChild(btn); wrap.appendChild(msg);
    var expl=card.querySelector(".expl");
    if(expl) card.insertBefore(wrap, expl); else card.appendChild(wrap);
  }
  function checkOne(i, card, btn, msg){
    if(typeof graded!=="undefined" && graded) return;      // đã nộp cả bài
    if(btn.classList.contains("done")) return;             // đã kiểm tra câu này
    var pick = (typeof answers!=="undefined") ? answers[i] : undefined;
    if(pick===undefined){
      msg.textContent="Hãy chọn một đáp án để kiểm tra."; msg.className="qcheck-msg warn";
      return;
    }
    var ans = (typeof DATA!=="undefined" && DATA[i]) ? DATA[i].ans : null;
    if(ans){
      var cb=document.getElementById("opt-"+i+"-"+ans);
      if(cb) cb.classList.add("correct");
      if(pick===ans){
        msg.textContent="Chính xác ✓"; msg.className="qcheck-msg ok";
      }else{
        var wb=document.getElementById("opt-"+i+"-"+pick);
        if(wb) wb.classList.add("wrong");
        msg.textContent="Chưa đúng — đáp án đúng là "+ans; msg.className="qcheck-msg bad";
      }
    }
    var e=document.getElementById("expl-"+i); if(e) e.classList.add("show");
    card.classList.add("qc-locked");
    btn.classList.add("done"); btn.textContent="Đã kiểm tra";
  }
  function scan(){
    if(document.body.classList.contains("qc-graded")) return;
    var cards=document.querySelectorAll("#quiz .card");
    for(var k=0;k<cards.length;k++) addBtn(cards[k]);
  }
  // Sau khi NỘP CẢ BÀI: ẩn nút kiểm tra từng câu (bài đã được chấm toàn bộ).
  if(typeof grade==="function"){
    var _g=grade;
    grade=function(a){ _g(a); document.body.classList.add("qc-graded"); };
  }
  // LÀM LẠI: bỏ trạng thái đã-chấm để nút kiểm tra từng câu hiện lại.
  if(typeof restart==="function"){
    var _r=restart;
    restart=function(){ document.body.classList.remove("qc-graded"); _r(); };
  }
  var quiz=document.getElementById("quiz");
  if(quiz){
    scan();
    new MutationObserver(function(){ scan(); }).observe(quiz,{childList:true});
  }
})();
</script>
<!--qcheck-end-->

  <div class="bp-head" id="baiiHead"><span class="bp-grip" aria-hidden="true">⠿</span><b>Máy tính BA II Plus</b><a class="bp-open" href="baii-plus.html" target="_blank" rel="noopener">Mở trang ↗</a><button type="button" class="bp-x" onclick="baiiClose()" title="Đóng (Esc)">✕</button></div>
  <iframe id="baiiFrame" title="BA II Plus" loading="lazy"></iframe>
</div>
<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
