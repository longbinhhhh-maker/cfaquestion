<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 24 — The Arbitrage-Free Valuation Framework · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<style id="subject-breakdown-css">

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";

rice of an intact bond, one can purchase the strips, combine them (\"reconstitution\"), and sell them as a bond. Similarly, if the bond is worth less than its component parts, one could purchase the bond, break it into a portfolio of strips (\"stripping\"), and sell those components. When one security trades at a lower price than another security with identical characteristics, this is known as dominance, and the arbitrage required to earn a profit involves going long the underpriced security and short the overpriced security.", "explhtml": "<p>If the principle of value additivity holds, it will not be possible to earn arbitrage profits through stripping (or reconstitution). If a portfolio of strips is trading for less than the price of an intact bond, one can purchase the strips, combine them (&quot;reconstitution&quot;), and sell them as a bond. Similarly, if the bond is worth less than its component parts, one could purchase the bond, break it into a portfolio of strips (&quot;stripping&quot;), and sell those components. When one security trades at a lower price than another security with identical characteristics, this is known as dominance, and the arbitrage required to earn a profit involves going long the underpriced security and short the overpriced security.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.a<\/div><div class=\"qtext\"><p>The process of stripping is most likely to be used to earn arbitrage profits in a situation where:<\/p><\/div>", "subj": "fixed"}, {"n": 11, "q": "Relative to the binomial model, Monte Carlo method is most likely:", "opts": ["more suitable when valuing securities whose cash flows are interest rate path dependent.", "less flexible in forcing interest rates to mean revert.", "more flexible as it does not need a volatility estimate."], "ans": "A", "expl": "Monte Carlo method does not require that cash flows of a security be path independent and hence is suitable alternative to the binomial model to value securities such as mortgage backed securities whose cash flows are path dependent. The model generating interest rates paths in a Monte Carlo simulation is based on an assumed level of volatility (i.e., model needs a volatility input). The model generating interest rates in a Monte Carlo simulation can incorporate bounds for interest rates to force mean reversion of rates. Such bounded optimization is not possible in a binomial model.", "explhtml": "<p>Monte Carlo method does not require that cash flows of a security be path independent and hence is suitable alternative to the binomial model to value securities such as mortgage backed securities whose cash flows are path dependent. The model generating interest rates paths in a Monte Carlo simulation is based on an assumed level of volatility (i.e., model needs a volatility input). The model generating interest rates in a Monte Carlo simulation can incorporate bounds for interest rates to force mean reversion of rates. Such bounded optimization is not possible in a binomial model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.h<\/div><div class=\"qtext\"><p>Relative to the binomial model, Monte Carlo method is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 12, "q": "A bond with a 10% annual coupon will mature in two years at par value. The current one-year spot rate is 8.5%. For the second year, the yield volatility model forecasts that the one-year rate will be either 8% or 9%. Using a binomial interest rate tree, what is the current price?", "opts": ["103.572.", "102.659.", "101.837."], "ans": "B", "expl": "The tree will have three nodal periods: 0, 1, and 2. The goal is to find the value at node 0. We know the value in nodal period 2: V₂=100. In nodal period 1, there will be two possible prices: V1,U=[(100+10)/1.09+(100+10)/1.09]/2= 100.917 V1,L=[(100+10)/1.08+(100+10)/1.08]/2= 101.852 Thus V₀=[(100.917+10)/1.085+(101.852+10)/1.085]/2= 102.659", "explhtml": "<p>The tree will have three nodal periods: 0, 1, and 2. The goal is to find the value at node 0. We know the value in nodal period 2: V<sub>2<\/sub>=100. In nodal period 1, there will be two possible prices:<\/p><p>V<sub>1,U<\/sub>=[(100+10)/1.09+(100+10)/1.09]/2= 100.917<\/p><p>V<sub>1,L<\/sub>=[(100+10)/1.08+(100+10)/1.08]/2= 101.852<\/p><p>Thus<\/p><p>V<sub>0<\/sub>=[(100.917+10)/1.085+(101.852+10)/1.085]/2= 102.659<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.e<\/div><div class=\"qtext\"><p>A bond with a 10% annual coupon will mature in two years at par value. The current one-year spot rate is 8.5%. For the second year, the yield volatility model forecasts that the one-year rate will be either 8% or 9%. Using a binomial interest rate tree, what is the current price?<\/p><\/div>", "subj": "fixed"}, {"n": 13, "q": "A binomial model or any other model that uses the backward induction method cannot be used to value a mortgage-backed security (MBS) because:", "opts": ["the prepayments occur linearly over the life of an interest rate trend (either up or down).", "the cash flows for the MBS are dependent upon the path that interest rates follow.", "the cash flows for an MBS only depend on the current rate, not the path that rates have followed."], "ans": "B", "expl": "A binomial model or any other model that uses the backward induction method cannot be used to value an MBS because the cash flows for the MBS are dependent upon the path that interest rates have followed.", "explhtml": "<p>A binomial model or any other model that uses the backward induction method cannot be used to value an MBS because the cash flows for the MBS are dependent upon the path that interest rates have followed.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.h<\/div><div class=\"qtext\"><p>A binomial model or any other model that uses the backward induction method cannot be used to value a mortgage-backed security (MBS) because:<\/p><\/div>", "subj": "fixed"}, {"n": 14, "q": "Tim Brospack is generating a binomial interest rate tree assuming a volatility of 15%. Current 1-year spot rate is 5%. The 1-year forward rate in the second year is either a low estimate of 5.250% or a high estimate of 7.087%.The middle 1-year forward rate in year three is estimated at 6.25%. The lower node 1-year forward rate in year three is closest to:", "opts": ["4.63%", "5.342%", "6.747%"], "ans": "A", "expl": "Lower node interest rate = 6.25 / e2×0.15 = 4.63%", "explhtml": "<p>Lower node interest rate = 6.25 / e<sup>2×0.15<\/sup> = 4.63%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.c<\/div><div class=\"qtext\"><p>Tim Brospack is generating a binomial interest rate tree assuming a volatility of 15%. Current 1-year spot rate is 5%. The 1-year forward rate in the second year is either a low estimate of 5.250% or a high estimate of 7.087%.The middle 1-year forward rate in year three is estimated at 6.25%. The lower node 1-year forward rate in year three is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 15, "q": "Jill Sebelius, editor-in-chief of a monthly interest-rate newsletter uses the following model to forecast short-term interest rates: dr = a(b −r) dt + σ√rdz For the current newsletter, Sebelius has issued the following expectations: a=0.40, b = 3%, r = 2%. Sebelius's model is most accurately described as the:", "opts": ["Ho-Lee model.", "Cox-Ingersoll-Ross model.", "Vasicek model."], "ans": "B", "expl": "The model given is an example of the Cox-Ingersoll-Ross model which differs from the Vasicek model by including the square root of current level of short-term interest rates in the stochastic part of the equation.", "explhtml": "<p>The model given is an example of the Cox-Ingersoll-Ross model which differs from the Vasicek model by including the square root of current level of short-term interest rates in the stochastic part of the equation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.3, LOS 24.i<\/div><div class=\"qtext\"><p>Jill Sebelius, editor-in-chief of a monthly interest-rate newsletter uses the following model to forecast short-term interest rates:<\/p><p>dr = a(b −r) dt + σ√rdz<\/p><p>For the current newsletter, Sebelius has issued the following expectations:<\/p><p>a=0.40, b = 3%, r = 2%.<\/p><p>Sebelius&#x27;s model is most accurately described as the:<\/p><\/div>", "subj": "fixed"}, {"n": 16, "q": "Using the following interest rate tree of semiannual interest rates what is the value of an option free semiannual bond that has one year remaining to maturity and has a 6% coupon rate? 6.53% 6.30% 5.67%", "opts": ["98.52.", "99.81.", "97.53."], "ans": "B", "expl": "The option-free bond price tree is as follows: 100.00 A ==> 99.74 99.81  100.00 100.16 100.00 As an example, the price at node A is obtained as follows: PriceA = (prob × (Pᵤₚ + coupon/2) + prob × (Pdown + coupon/2))/(1 + rate/2) = (0.5 × (100 + 3) + 0.5 × (100 + 3))/(1 + 0.0653/2) = 99.74. The bond values at the other nodes are obtained in the same way. The calculation for node 0 or time 0 is 0.5[(99.74 + 3)/(1+ 0.063/2) + (100.16 + 3)/(1 + 0.063/2)] = 99.81", "explhtml": "<p>The option-free bond price tree is as follows:<\/p><p>100.00<\/p><p>A ==&gt; 99.74 99.81 &nbsp; 100.00<\/p><p>100.16<\/p><p>100.00<\/p><p>As an example, the price at node A is obtained as follows:<\/p><p>Price<sub>A<\/sub> = (prob × (P<sub>up<\/sub> + coupon/2) + prob × (P<sub>down<\/sub> + coupon/2))/(1 + rate/2) = (0.5 × (100 + 3) + 0.5 × (100 + 3))/(1 + 0.0653/2) = 99.74. The bond values at the other nodes are obtained in the same way.<\/p><p>The calculation for node 0 or time 0 is<\/p><p>0.5[(99.74 + 3)/(1+ 0.063/2) + (100.16 + 3)/(1 + 0.063/2)] =<\/p><p>99.81<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.e<\/div><div class=\"qtext\"><p>Using the following interest rate tree of semiannual interest rates what is the value of an option free semiannual bond that has one year remaining to maturity and has a 6% coupon rate?<\/p><p>6.53%<\/p><p>6.30%<\/p><p>5.67%<\/p><\/d ncrease the number of paths.", "explhtml": "<p>Increasing the number of paths would increase the statistical accuracy of the estimate but does nothing for the fundamental accuracy of the estimated value which depends on the quality of model inputs. Model utility depends on valuation accuracy of the model and hence would not increase as we increase the number of paths.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.h<\/div><div class=\"qtext\"><p>Increasing the number of paths generated in a Monte Carlo simulation is most likely to increase the:<\/p><\/div>", "subj": "fixed"}, {"n": 19, "q": "A 3-year, 3% annual pay, $100 par bond is valued using pathwise valuation. The interest rate paths are provided below: Path Year 1 Year 2 Year 3 1 2% 2.8050% 4.0787% 2 2% 2.8050% 3.0216% 3 2% 2.0780% 3.0216% 4 2% 2.0780% 2.2384% The value of the bond in path 4 is closest to:", "opts": ["$100.02", "$101.88", "$102.58"], "ans": "C", "expl": "Path 4 value = 3.0  3.0  103.0 |  +    +    = 102.58 | (1.02)  (1.02)(1.02078)  (1.02)(1.02078)(1.022384)", "explhtml": "<p>Path 4 value =<\/p><div class=\"tbl\"><table><tr><td>3.0<\/td><td>3.0<\/td><td>103.0<\/td><\/tr><tr><td> + <\/td><td> + <\/td><td> = 102.58<\/td><\/tr><tr><td>(1.02)<\/td><td>(1.02)(1.02078)<\/td><td>(1.02)(1.02078)(1.022384)<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.g<\/div><div class=\"qtext\"><p>A 3-year, 3% annual pay, $100 par bond is valued using pathwise valuation. The interest rate paths are provided below:<\/p><div class=\"tbl\"><table><tr><td>Path<\/td><td>Year 1<\/td><td>Year 2<\/td><td>Year 3<\/td><\/tr><tr><td>1<\/td><td>2%<\/td><td>2.8050%<\/td><td>4.0787%<\/td><\/tr><tr><td>2<\/td><td>2%<\/td><td>2.8050%<\/td><td>3.0216%<\/td><\/tr><tr><td>3<\/td><td>2%<\/td><td>2.0780%<\/td><td>3.0216%<\/td><\/tr><tr><td>4<\/td><td>2%<\/td><td>2.0780%<\/td><td>2.2384%<\/td><\/tr><\/table><\/div><p>The value of the bond in path 4 is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 20, "q": "Currently the term structure of interest rate is downward sloping. Which of the following models most accurately describe the current term structure?", "opts": ["Cox-Ingersoll-Ross model.", "Ho-Lee model.", "Vasicek model."], "ans": "B", "expl": "Ho-Lee model is an arbitrage-free term structure that is calibrated to the current actual term structure (regardless of whether it is upward or downward sloping). Vasicek and Cox-Ingersoll-Ross model are examples of equilibrium term structure models and may generate term structures inconsistent with current market observations.", "explhtml": "<p>Ho-Lee model is an arbitrage-free term structure that is calibrated to the current actual term structure (regardless of whether it is upward or downward sloping). Vasicek and Cox-Ingersoll-Ross model are examples of equilibrium term structure models and may generate term structures inconsistent with current market observations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.3, LOS 24.i<\/div><div class=\"qtext\"><p>Currently the term structure of interest rate is downward sloping. Which of the following models most accurately describe the current term structure?<\/p><\/div>", "subj": "fixed"}, {"n": 21, "q": "Why is the backward induction methodology used to value a bond rather than a forward induction scheme?", "opts": ["Future interest rate changes are difficult to forecast.", "The convexity of a bond changes over time.", "The price of the bond is known at maturity."], "ans": "C", "expl": "The objective is to value a bond's current price while the bond price at maturity is known. Therefore, price at maturity is used as a starting point, and we work backward to the current value.", "explhtml": "<p>The objective is to value a bond&#x27;s current price while the bond price at maturity is known. Therefore, price at maturity is used as a starting point, and we work backward to the current value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.e<\/div><div class=\"qtext\"><p>Why is the backward induction methodology used to value a bond rather than a forward induction scheme?<\/p><\/div>", "subj": "fixed"}, {"n": 22, "q": "Sam Roit, CFA, has collected the following information on the par rate curve, spot rates, and forward rates to generate a binomial interest rate tree consistent with this data. Maturity Par Rate Spot Rate 1 5% 5.000% 2 6% 6.030% 3 7% 7.097% The binomial tree generated is shown below (one year forward rates) assuming a volatility level of 10%: 0 1 2 5% 7.7099% C  A 9.2625%   B Riot also generated another tree using the same spot rates but this time assuming a volatility level of 20% as shown below: 0 1 2 5% 8.9480% 13.8180%  5.9980% 9.2625%   6.2088% The one-year forward rate represented by 'A' is closest to:", "opts": ["6.3123%", "5.4223%", "6.7732%"], "ans": "A", "expl": "Value represented by 'A' = 7.7099 / e2x0.10 = 6.3123%", "explhtml": "<p>Value represented by &#x27;A&#x27; = 7.7099 / e<sup>2x0.10<\/sup> = 6.3123%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.d<\/div><div class=\"qtext\"><p>Sam Roit, CFA, has collected the following information on the par rate curve, spot rates, and forward rates to generate a binomial interest rate tree consistent with this data.<\/p><div class=\"tbl\"><table><tr><td>Maturity<\/td><td>Par Rate<\/td><td>Spot Rate<\/td><\/tr><tr><td>1<\/td><td>5%<\/td><td>5.000%<\/td><\/tr><tr><td>2<\/td><td>6%<\/td><td>6.030%<\/td><\/tr><tr><td>3<\/td><td>7%<\/td><td>7.097%<\/td><\/tr><\/table><\/div><p>The binomial tree generated is shown below (one year forward rates) assuming a volatility level of 10%:<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>5%<\/td><td>7.7099%<\/td><td>C<\/td><\/tr><tr><td><\/td><td>A<\/td><td>9.2625%<\/td><\/tr><tr><td><\/td><td><\/td><td>B<\/td><\/tr><\/table><\/div><p>Riot also generated another tree using the same spot rates but this time assuming a volatility level of 20% as shown below:<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>5%<\/td><td>8.9480%<\/td><td>13.8180%<\/td><\/tr><tr><td><\/td><td>5.9980%<\/td><td>9.2625%<\/td><\/tr><tr><td><\/td><td><\/td><td>6.2088%<\/td><\/tr><\/table><\/div><p>The one-year forward rate represented by &#x27;A&#x27; is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 23, "q": "For a 3-year, semiannual coupon payment bond, the number of interest rate paths that would be generated using the pathwise valuation is closest to:", "opts": ["32", "4", "64"], "ans": "A", "expl": "For a 3-year, semiannual coupon bond, there will be six nodal periods resulting in 2⁽⁶⁻¹⁾ = 32 paths.", "explhtml": "<p>For a 3-year, semiannual coupon bond, there will be six nodal periods resulting in 2<sup>(6-1)<\/sup> = 32 paths.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.g<\/div><div class=\"qtext\"><p>For a 3-year, semiannual coupon payment bond, the number of interest rate paths that would be generated using the pathwise valuation is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 24, "q": "Sam Roit, CFA, has collected the following information on the par rate curve, spot rates, and forward rates to generate a binomial interest rate tree consistent with this data. Maturity Par Rate Spot Rate 1 5% 5.000% 2 6% 6.030% 3 7% 7.097% The binomial tree generated is shown below (one year forward rates) assuming a volatility level of 10%: 0 1 2 5% 7.7099% C  A 9.2625%   B Riot also generated another tree using the same spot rates but this time assuming a volatility level of 20% as shown below: 0 1 2 5% 8.9480% 13.8180%  5.9980% 9.2625%   6.2088% The one-year forward rate represented by 'C' is closest to:", "opts": ["8.7732%", "7.4223%", "11.3132%"], "ans": "C", "expl": "Value represented by 'C' = 9.2625 x e2x0.10 = 11.3132%", "explhtml": "<p>Value represented by &#x27;C&#x27; = 9.2625 x e<sup>2x0.10<\/sup> = 11.3132%<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.2, LOS 24.d<\/div><div class=\"qtext\"><p>Sam Roit, CFA, has collected the following information on the par rate curve, spot rates, and forward rates to generate a binomial interest rate tree consistent with this data.<\/p><div class=\"tbl\"><table><tr><td>Maturity<\/td><td>Par Rate<\/td><td>Spot Rate<\/td><\/tr><tr><td>1<\/td><td>5%<\/td><td>5.000%<\/td><\/tr><tr><td>2<\/td><td>6%<\/td><td>6.030%<\/td><\/tr><tr><td>3<\/td><td>7%<\/td><td>7.097%<\/td><\/tr><\/table><\/div><p>The binomial tree generated is shown below (one year forward rates) assuming a volatility level of 10%:<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>5%<\/td><td>7.7099%<\/td><td>C<\/td><\/tr><tr><td><\/td><td>A<\/td><td>9.2625%<\/td><\/tr><tr><td><\/td><td><\/td><td>B<\/td><\/tr><\/table><\/div><p>Riot also generated another tree using the same spot rates but this time assuming a volatility level of 20% as shown below:<\/p><div class=\"tbl\"><table><tr><td>0<\/td><td>1<\/td><td>2<\/td><\/tr><tr><td>5%<\/td><td>8.9480%<\/td><td>13.8180%<\/td><\/tr><tr><td><\/td><td>5.9980%<\/td><td>9.2625%<\/td><\/tr><tr><td><\/td><td><\/td><td>6.2088%<\/td><\/tr><\/table><\/div><p>The one-year forward rate represented by &#x27;C&#x27; is closest to:<\/p><\/div>", "subj": "fixed"}, {"n": 25, "q": "Which of the following is a correct statement concerning the backward induction technique used within the binomial interest rate tree framework? From the maturity date of a bond:", "opts": ["the corresponding interest rates and interest rate probabilities are used to discount the value of the bond.", "the corresponding interest rates are weighted by the bond's duration to discount the value of the bond.", "a deterministic interest rate path is used to discount the value of the bond."], "ans": "A", "expl": "For a bond that has N compounding periods, the current value of the bond is determined by computing the bond's possible values at period N and working \"backwards\" to the present. The value at any given node is the probability-weighted average of the discounted values of the next period's nodal values.", "explhtml": "<p>For a bond that has N compounding periods, the current value of the bond is determined by computing the bond&#x27;s possible values at period N and working &quot;backwards&quot; to the present. The value at any given node is the probability-weighted average of the discounted values of the next period&#x27;s nodal values.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.1, LOS 24.e<\/div><div class=\"qtext\"><p>Which of the following is a correct statement concerning the backward induction technique used within the binomial interest rate tree framework? From the maturity date of a bond:<\/p><\/div>", "subj": "fixed"}, {"n": 26, "q": "Jill Sebelius, editor-in-chief of a monthly interest-rate newsletter uses the following model to forecast short-term interest rates: dr = a(b −r) dt + σ√rdz For the current newsletter, Sebelius has issued the following expectations: a=0.40, b = 3%, r = 2%. According to the model used by Sebelius, volatility in the short-term in interest rate is most likely:", "opts": ["independent of the current level of the short-term interest rate.", "negatively related to the current level of the short-term interest rate.", "positively related to the current level of the short-term interest rate."], "ans": "C", "expl": "Under the Cox-Ingersoll-Ross model, the random or stochastic component incorporates the square root of current level of interest rate. Hence the higher the current level of interest rates, the higher the volatility of interest rates.", "explhtml": "<p>Under the Cox-Ingersoll-Ross model, the random or stochastic component incorporates the square root of current level of interest rate. Hence the higher the current level of interest rates, the higher the volatility of interest rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 24.3, LOS 24.i<\/div><div class=\"qtext\"><p>Jill Sebelius, editor-in-chief of a monthly interest-rate newsletter uses the following model to forecast short-term interest rates:<\/p><p>dr = a(b −r) dt + σ√rdz<\/p><p>For the current newsletter, Sebelius has issued the following expectations:<\/p><p>a=0.40, b = 3%, r = 2%.<\/p><p>According to the model used by Sebelius, volatility in the short-term in interest rate is most likely:<\/p><\/div>", "subj": "fixed"}, {"n": 27, "q": "Based on Jensen's Statement 1, which model is most appropriate?", "opts": ["The Ho-Lee model.", "The Kalotay-Williams-Fabozzi (KWF) model.", "A Gauss+ multifactor model."], "ans": "C", "expl": "Gauss+ is a multi-factor model that incorporates short-, medium-, and long-term rates where the short-term rate is devoid of a random component—consistent with the role of the central bank controlling short-term rate. The Ho-Lee model is calibrated to the current term structure using the time-dependent drift term θₜ and has a random noise component σdzₜ. Like the Ho-Lee model, the KWF model uses a random noise component (but assumes that the short rate is lognormally distributed).", "explhtml": "<p>Gauss+ is a multi-factor model that incorporates short-, medium-, and long-term rates where the short-term rate is devoid of a random component—consistent with the role of the central bank controlling short-term rate. The Ho-Lee model is calibrated to the current term structure using the time-dependent drift term θ<sub>t<\/sub> and has a random noise component σdz<sub>t<\/sub>. Like the Ho-Lee model, the KWF model uses a random noise component (but assumes that the short rate is lognormally distributed).<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<\/summary><div class=\"vig-body\"><p>Dan Laske, CFA, recently joined Axes Bank as a bond trader. Laske is reviewing bank's interest rate models and meets with Sheila Jensen, a senior portfolio manager at the bank.<\/p><p>Jensen makes the following statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r24/v001.webp\" style=\"max-width:min(100%,648px)\" alt=\"Statement 1: I don&#x27;t want any random noise in the short-term rate forecasts. I like interest models to incorporate mean reversion of rates. Statement 2: I prefer that the interest rate volatility varies with the level of interest Statement 3: rates.\"><p>Laske finally decides on using the Gausst model and asks Jensen about her opinion.<\/p><p>Jensen makes the following observations about the Gausst model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r24/v002.webp\" style=\"max-width:min(100%,646px)\" alt=\"Gauss+ models are primarily used for forecasting long-term rates, Observation 1: while equilibrium models are used for short-term rates. Observation 2: Gausst models assume that the long-term rates are mean reverting. while the central bank actions determine the short-term rates.\"><\/div><\/details><div class=\"pp-topic\">Module 24.3, LOS 24.i<\/div><div class=\"qtext\"><p>Based on Jensen&#x27;s Statement 1, which model is most appropriate?<\/p><\/div>", "subj": "fixed"}, {"n": 28, "q": "Based on Jensen's Statement 2, which model is least appropriate?", "opts": ["The Cox-Ingersoll-Ross (CIR) model.", "The Ho-Lee model.", "The Vasicek model."], "ans": "B", "expl": "The CIR model and the Vasicek model are equilibrium models and assume that interest rates follow a mean-reverting process. The Ho-Lee and the Kalotay-Williams-Fabozzi (KWF) models are arbitrage-free models and do not require mean reversion in rates.", "explhtml": "<p>The CIR model and the Vasicek model are equilibrium models and assume that interest rates follow a mean-reverting process. The Ho-Lee and the Kalotay-Williams-Fabozzi (KWF) models are arbitrage-free models and do not require mean reversion in rates.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 27–30<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p> -tag\">Vignette<\/span>Item set · Câu 27–30<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Dan Laske, CFA, recently joined Axes Bank as a bond trader. Laske is reviewing bank's interest rate models and meets with Sheila Jensen, a senior portfolio manager at the bank.<\/p><p>Jensen makes the following statements:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r24/v001.webp\" style=\"max-width:min(100%,648px)\" alt=\"Statement 1: I don&#x27;t want any random noise in the short-term rate forecasts. I like interest models to incorporate mean reversion of rates. Statement 2: I prefer that the interest rate volatility varies with the level of interest Statement 3: rates.\"><p>Laske finally decides on using the Gausst model and asks Jensen about her opinion.<\/p><p>Jensen makes the following observations about the Gausst model:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r24/v002.webp\" style=\"max-width:min(100%,646px)\" alt=\"Gauss+ models are primarily used for forecasting long-term rates, Observation 1: while equilibrium models are used for short-term rates. Observation 2: Gausst models assume that the long-term rates are mean reverting. while the central bank actions determine the short-term rates.\"><\/div><\/details><div class=\"pp-topic\">Module 24.3, LOS 24.i<\/div><div class=\"qtext\"><p>Based on Jensen&#x27;s Statement 3, which model is most appropriate?<\/p><\/div>", "subj": "fixed"}, {"n": 30, "q": "Regarding Jensen's observations:", "opts": ["only Observation 2 is correct.", "only Observation 1 is correct.", "both observations are incorrect."], "ans": "A", "expl": "Gauss+ is a multifactor model that incorporates short-, medium-, and long-term rates where the long-term rate is designed to be mean reverting and depends on macroeconomic variables. Medium-term rates revert to the long-term rate, while the short-term rate is devoid of a random component—consistent with the role of the central bank controll   try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage

// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  if(/alternative investment|private capital|private equity|private debt|hedge fund|real estate|\breit\b|\breits\b|infrastructure|natural resources|commodit(?:y|ies)|digital assets?|cryptocurrenc|bitcoin|collectibles|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption regime|pooled investment product|timberland|farmland/.test(prompt)) return "alternatives";
  if(/fixed-income|fixed income|bond\b|bonds\b|debt rating|corporate debt|credit rating|credit spread|creditworthiness|yield curve|yield spread|spot rate|forward rate|yield-to-maturity|yield to maturity|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|\bcds\b|repo market|central bank funds|covenant|accrued interest|priority of claims|default risk|extension risk/.test(prompt)) return "fixed";
  if(/portfolio|asset allocation|investment policy statement|\bips\b|behavioral finance|behavioral bias|cognitive error|risk aversion|utility function|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation between|covariance between|portfolio standard deviation|sharpe ratio|treynor ratio|jensen['’]?s alpha|information ratio|two-fund separation|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral investor/.test(prompt)) return "portfolio";
  return "equity";
}

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
  corporate:/corporate|company lifecycle|start-up|startup|early-stage|business model|franchise|board of directors|proxy voting|stakeholder|shareholder|creditor|governance|capital budgeting|capital investment|project|real option|\bnpv\b|internal rate of return|\birr\b|cost of debt|cost of capital|capital structure|weight of debt|modigliani|dividend policy|double taxation|principal-agent|working capital|liquidity|compensation|competitive strategy|porter|economies of scale|information asymmetry|agency relationship/g,
  equity:/equity|common share|preferred share|stock|market index|index weighting|market efficiency|efficient market|security market|buy order|sell order|limit order|dealer|margin requirement|leverage ratio|industry classification|company analysis|enterprise value|price-to|free cash flow to equity|\bfcfe\b|dividend discount|earnings multiplier|book value per share|intrinsic value|voting|ex-dividend/g,
  fixed:/fixed-income|fixed income|bond|debt|credit rating|credit spread|yield|spot rate|duration|convexity|mortgage|asset-backed|securiti[sz]ation|commercial paper|certificate of deposit|repo|covenant|accrued interest|priority of claims|default|extension risk|interest coverage/g,
  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
