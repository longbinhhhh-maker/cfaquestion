biệt chính giữa nguồn thanh khoản sơ cấp và thứ cấp là\nsử dụng nguồn chính không có khả năng ảnh hưởng đến hoạt động bình thường của công ty, trong khi việc sử dụng\nnguồn thứ cấp có thể dẫn đến thay đổi về tình hình tài chính và hoạt động của công ty.\nCác nguồn thứ cấp được các công ty sử dụng bao gồm: thanh lý tài sản, phụ thuộc vào mức độ\nngắn hạn và/hoặc dài hạn tài sản có thể được thanh lý và chuyển đổi thành tiền mặt mà\nkhông bị mất giá trị đáng kể.\nC. Không chính xác vì các nguồn thanh khoản chính đại diện cho các nguồn lực\ncó thể truy cập dễ dàng nhất hiện có của công ty. Đây có thể là chứng khoán được giữ bằng tiền mặt hoặc gần như tiền mặt và bao gồm những điều sau:\nQuản lý tiền mặt, là hiệu quả của công ty trong hệ thống quản lý tiền mặt và\ncác phương pháp cũng như mức độ phân cấp của quy trình thu hoặc thanh toán\nCác tổ chức phát hành doanh nghiệp: giải thích tính thanh khoản và so sánh mức thanh khoản của các tổ chức phát hành","qhtml":null},{"n":47,"q":"Which of the following committees of a board of directors oversees the development of\nthe company's conflict of interest policy?","opts":["Risk committee","Governance committee","Remuneration committee"],"ans":"B","expl":"A. Không chính xác vì chính ủy ban quản trị chứ không phải ủy ban rủi ro có\ntrách nhiệm giám sát việc phát triển các chính sách quản trị, bao gồm cả xung đột lợi ích\nchính sách. Tóm lại, các chức năng giám sát chính của ủy ban rủi ro bao gồm\n- xác định hồ sơ rủi ro của công ty,\n- đảm bảo quản lý rủi ro doanh nghiệp phù hợp và\n- điều chỉnh các hoạt động của công ty phù hợp với khẩu vị rủi ro\nB. Đúng vì vai trò chính của ủy ban quản trị hội đồng quản trị là đảm bảo rằng\ncông ty áp dụng các cơ cấu và thông lệ quản trị doanh nghiệp tốt. Với mục đích này, nó giám sát\nsự phát triển của các chính sách quản trị tại công ty như\n- quy tắc quản trị doanh nghiệp\n- điều lệ của hội đồng quản trị và các ủy ban\n- quy tắc đạo đức và\n- chính sách xung đột lợi ích, cùng nhiều chính sách khác.\nC. Không chính xác vì chính ủy ban quản trị chứ không phải ủy ban thù lao có\ntrách nhiệm giám sát việc phát triển các chính sách quản trị, bao gồm cả xung đột lợi ích\nchính sách. Tóm lại, các chức năng giám sát chính của ủy ban thù lao bao gồm\n- phát triển các chính sách thù lao cho giám đốc và điều hành,\n- giám sát việc quản lý và đánh giá chính sách hiệu suất và\n- thiết lập các chính sách nhân sự (HR) liên quan đến lương thưởng cho nhân viên.\nCác tổ chức phát hành doanh nghiệp: mô tả quản trị doanh nghiệp và các cơ chế để quản lý các mối quan hệ giữa các bên liên quan\nvà giảm thiểu rủi ro liên quan","qhtml":null},{"n":48,"q":"A company with a required rate of return of 12% is considering a capital project with the\nfollowing cash flows (in millions):\nInitial Outlay Year 1 Year 2\nCash flow: -£150 £8 £175\nThe expected IRR for this project is most likely.","opts":["less than 12%.","equal to 12%.","greater than 12%."],"ans":"A","expl":"A. Đúng vì IRR là tỷ lệ chiết khấu làm cho giá trị hiện tại của dòng tiền sau thuế trong tương lai\nbằng với số tiền đầu tư đó hoặc ∑𝑛 𝐶𝐹 /(1+𝐼𝑅𝑅)𝑡 = chi tiêu., trong đó IRR là\n𝑡=1 𝑡\ninternal tỷ lệ hoàn vốn. Giải quyết bằng cách sử dụng các dữ liệu đầu vào của máy tính sau: CF =-150, CF = 8, CF₂ = 175,\n0 1\nTính IRR = 10,7119, làm tròn đến 10,71%, nhỏ hơn 12%.\nB. Không chính xác vì nó đề cập đến tỷ suất lợi nhuận yêu cầu của công ty chứ không phải IRR dự kiến.\nC. Không chính xác vì nó tăng dòng tiền trong Năm 2 lên 8 và thể hiện phép tính IRR bằng cách sử dụng\nđầu vào của máy tính sau: IRR≠ PV=-150, PMT = 8, N=2, FV = 175, Tính = 13,15246%, làm tròn\nđến 13,15%, tức là lớn hơn 12%.\nCác tổ chức phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính toán giá trị hiện tại ròng (NPV),\ntỷ suất lợi nhuận nội bộ (IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn","qhtml":null},{"n":49,"q":"All else being equal, if interest on debt is tax deductible, an increase in the company's\nmarginal tax rate will:","opts":["decrease the company's WACC.","not affect the company's WACC.","increase the company's WACC."],"ans":"A","expl":"A. Đúng vì chi phí cận biên của việc vay nợ là chi phí nợ sau khi xem xét\nkhấu trừ được phép đối với lãi vay. Nếu tiền lãi có thể được khấu trừ toàn bộ, thì khả năng khấu trừ thuế của\nnợ làm giảm chi phí biên hiệu dụng của nợ để phản ánh thu nhập được bảo vệ khỏi thuế (thường\nđược gọi là lá chắn thuế) và chi phí biên của nợ là r (1-t). Nếu thuế suất biên\nd\ntăng, điều này làm tăng lá chắn thuế và giảm chi phí biên của nợ cũng như WACC\nB. Không chính xác vì WACC không giữ nguyên. Nếu tiền lãi có thể được khấu trừ toàn bộ, khả năng khấu trừ thuế\ncủa nợ làm giảm chi phí biên hiệu dụng của nợ để phản ánh thu nhập được bảo vệ khỏi thuế\n(thường được gọi là lá chắn thuế) và chi phí biên của nợ là r (1-t). Nếu thuế suất cận biên\nd\ntăng, điều này làm tăng lá chắn thuế và giảm chi phí biên của nợ cũng như\nWACC.\nC. Không chính xác vì nó không làm tăng WACC. Nếu tiền lãi có thể được khấu trừ toàn bộ, khả năng khấu trừ thuế\ncủa nợ làm giảm chi phí biên hiệu dụng của nợ để phản ánh thu nhập được bảo vệ khỏi thuế\n(thường được gọi là lá chắn thuế) và chi phí biên của nợ là r (1-t). Nếu thuế suất biên\nd\ntăng, điều này làm tăng lá chắn thuế và giảm chi phí biên của nợ cũng như\nWACC.\nCác tổ chức phát hành doanh nghiệp: tính toán và giải thích chi phí vốn bình quân gia quyền của một công ty","qhtml":null},{"n":50,"q":"A company increases its debt from 20% to 60% of its capital structure. Based on the\nModigliani and Miller proposition (without taxes) regarding capital structure, the WACC of\nthe company:","opts":["decreases.","remains the same.","increases."],"ans":"B","expl":"A. Không chính xác vì đề xuất của Modigliani và Miller ngụ ý rằng đòn bẩy tài chính cao hơn sẽ làm tăng\nchi phí vốn cổ phần nhưng không làm thay đổi giá trị công ty hoặc WACC.\nB. Đúng vì đề xuất của Modigliani và Miller ngụ ý rằng đòn bẩy tài chính cao hơn sẽ làm tăng chi phí\nvốn chủ sở hữu nhưng không làm thay đổi giá trị công ty hoặc WACC.\nC. Không chính xác vì mệnh đề Modigliani và Miller ngụ ý rằng đòn bẩy cao hơn sẽ làm tăng\nchi phí vốn cổ phần nhưng không làm thay đổi giá trị công ty hoặc WACC.\nCác tổ chức phát hành doanh nghiệp: giải thích các mệnh đề Modigliani-Miller liên quan đến cấu trúc vốn","qhtml":null},{"n":51,"q":"The NPV of a new project is expected to be -$0.20 million. An incremental investment of\n$0.40 million would give management the flexibility to switch to a lower cost input in the\nfuture. If this option has an estimated value of $0.80 million, the value of the project\nincluding the option is:","opts":["$0.20 million.","$0.40 million.","$1.00 million"],"ans":"A","expl":"A. Đúng vì NPV, bao gồm cả quyền chọn thực, phải là:\nNPV dự án = NPV (chỉ dựa trên DCF) - Chi phí quyền chọn + Giá trị quyền chọn.\nNPV dự án = -0,2 triệu USD - 0,4 triệu USD+ 0,8 triệu USD = 0,2 triệu USD.\nB. Không chính xác vì NPV ban đầu của khoản đầu tư không được xem xét.\nNPV dự án≠ - Chi phí quyền chọn + Giá trị quyền chọn.\nNPV dự án ≠ -0,4 triệu USD+ 0,8 triệu USD = 0,4 triệu USD.\nC. Không chính xác vì chi phí của phương án đã được thêm vào NPV (chỉ dựa trên DCF) thay vì\nbị trừ.\nNPV dự án ≠ NPV (chỉ dựa trên DCF) + Chi phí của các phương án + Giá trị của các phương án\nNPV dự án≠ - 0,2 triệu USD+ 0,4 triệu USD+ 0,8 triệu USD = 1,0 triệu USD\nCác tổ chức phát hành doanh nghiệp: mô tả các loại quyền chọn thực tế liên quan đến đầu tư vốn","qhtml":null},{"n":52,"q":"According to the pecking order theory, company managers most likely prefer to:","opts":["issue debt as the last resort.","raise equity first to preserve cash-flow.","rely on internal financing over new equity."],"ans":"C","expl":"A. Không chính xác vì lý thuyết trật tự phân hạng gợi ý rằng các nhà quản lý chọn các phương pháp tài trợ\ntheo một hệ thống phân cấp ưu tiên hàng đầu cho các phương pháp có nội dung thông tin ít tiềm năng nhất\n(quỹ được tạo ra nội bộ và ưu tiên thấp nhất cho hình thức có nội dung thông tin\ntiềm năng lớn nhất (chào bán vốn cổ phần đại chúng) trong ngắn hạn, các nhà quản lý thích tài trợ thông tin hơn nếu tài chính mtamal\nkhông hiệu quả, otänagcis khoản nợ tiếp theo, sau đó là vốn chủ sở hữu\nB. Không chính xác vì lý thuyết trật tự phân hạng gợi ý rằng các nhà quản lý chọn hình thức tài trợ hỗn hợp\ntheo hệ thống hai thứ bậc.Inal ưu tiên hàng đầu cho các phương pháp có nội dung thông tin ít tiềm năng nhất\n(quỹ do internet tạo ra) và ưu tiên thấp nhất cho hình thức có nội dung thông tin\ntiềm năng lớn nhất (chào bán vốn cổ phần đại chúng) trong một, các nhà quản lý pater tài trợ nội bộ nếu nguồn tài chính nội bộ\nkhông đủ cho các nhà quản lý.next.thích nợ hơn là vốn chủ sở hữu\nC. Đúng vì lý thuyết trật tự phân hạng cho thấy rằng các nhà quản lý chọn phương pháp đưa vào\ntheo hệ thống cấp bậc cho vay ưu tiên đầu tiên cho những khoản tiền có ít âm điệu nhất trong năm\nnội dung nguồn vốn được tạo ra) và ưu tiên thấp nhất cho hình thức có tiềm năng lớn nhất\nnội dung thông tin (chào bán cổ phần ra công chúng) trong Duet Các nhà quản lý thích tài trợ nội bộ Nếu tài trợ nội bộ\ncó tính quyết định thì tiếp theo các nhà quản lý thích nợ hơn là vốn chủ sở hữu.","qhtml":null},{"n":53,"q":"Which of the following is most accurate?","opts":["Risk appetites are similar among private lenders","Staggered boards provide continuous implementation of strategy and oversight","A company's CEO is responsible for implementing the company's strategy under the oversight of the company's shareholders"],"ans":"B","expl":"A. Không chính xác vì các chủ nợ tư nhân có mức độ chấp nhận rủi ro rất khác nhau. Với các ngân hàng và\nngười cho vay tư nhân, quan điểm chung của các chủ nợ áp dụng ít đòn bẩy tài chính hơn hàm ý ít rủi ro\n hơn và do đó được ưu tiên hơn. Tuy nhiên, giữa những người cho vay tư nhân, có sự khác biệt lớn về sở thích, cách tiếp cận, hành vi và mối quan hệ với các công ty mà họ đã cung cấp\nvốn.\nB. Đúng vì khía cạnh tích cực của một hội đồng quản trị so le là nó cung cấp khả năng thực hiện\nliên tục chiến lược và giám sát mà không bị các thành viên hội đồng quản trị mới\nđánh giá lại liên tục, điều này có nguy cơ đưa chủ nghĩa ngắn hạn vào chiến lược công ty\nC. Không chính xác vì Giám đốc điều hành của công ty được hội đồng quản trị thuê và chịu trách nhiệm thực hiện chiến lược của công ty\ndưới sự giám sát của ban giám đốc. Các nhà quản lý, đứng đầu là\ngiám đốc điều hành của công ty, chịu trách nhiệm xác định và thực hiện chiến lược của công ty\ndưới sự giám sát của ban giám đốc. Ngoài ra, hội đồng quản trị\ncủa công ty được các cổ đông bầu ra để bảo vệ lợi ích của cổ đông và đưa ra định hướng\nchiến lược, có tính đến khẩu vị rủi ro của công ty mà nó xác định cho công ty.\nHội đồng quản trị cũng chịu trách nhiệm thuê Giám đốc điều hành và giám sát hiệu quả hoạt động của công ty\nvà ban quản lý.\nNhà phát hành doanh nghiệp: mô tả hoạt động của công ty các nhóm bên liên quan và so sánh lợi ích của họ","qhtml":null},{"n":54,"q":"The potential for conflict between debtholders and shareholders is:","opts":["lower for long-term debt than for short-term debt.","the same for long-term debt and short-term debt.","higher for long-term debt than for short-term debt."],"ans":"C","expl":"A. Không chính xác vì xung đột nợ/vốn cổ phần tiềm tàng lớn hơn trong trường hợp nợ dài hạn thay vì\nnợ ngắn hạn vì thời gian trôi qua khiến chủ nợ có thể gặp những thay đổi về\nđiều kiện kinh doanh, chiến lược và hành vi quản lý Vì vậy, xung đột giữa chủ nợ và\ncổ đông lớn hơn (không thấp hơn) trong trường hợp nợ dài hạn so với nợ ngắn hạn\nB. Không chính xác vì xung đột nợ/vốn chủ sở hữu tiềm ẩn lớn hơn trong trường hợp nợ dài hạn thay vì\nnợ ngắn hạn vì thời gian trôi qua khiến các chủ nợ có thể gặp phải những thay đổi có thể xảy ra trong điều kiện, chiến lược và hành vi quản lý kinh doanh\n. Vì vậy, xung đột giữa chủ nợ và\ncổ đông lớn hơn (không giống nhau) trong trường hợp nợ dài hạn và nợ ngắn hạn\nC. Đúng vì xung đột về mức độ công bằng tiềm ẩn lớn hơn trong trường hợp khoản nợ dài hạn\nnợ bậc thang khác của họ vì thời gian trôi qua khiến các chủ nợ có thể gặp phải những thay đổi trong\nchiến lược điều kiện kinh doanh và hành vi quản lý\nCác tổ chức phát hành doanh nghiệp: mô tả mối quan hệ đại diện chính và các xung đột có thể nảy sinh giữa\ncác nhóm bên liên quan","qhtml":null},{"n":55,"q":"A corporation's stakeholders most likely include:","opts":["shareholders only.","controlling shareholders only.","all shareholders and all employees."],"ans":"C","expl":"A. Không chính xác vì các nhóm bên liên quan chính của một công ty bao gồm các cổ đông,\nchủ nợ, người quản lý (hoặc giám đốc điều hành), nhân viên khác, ban giám đốc, khách hàng, nhà cung cấp và\nchính phủ/cơ quan quản lý (và nói rộng ra là các cá nhân và nhóm cộng đồng bị ảnh hưởng).\nNgoài ra, ở một số công ty, một cổ đông hoặc nhóm cổ đông cụ thể có thể nắm giữ\ntỷ lệ cổ phần để họ có đủ quyền biểu quyết quyền kiểm soát việc bầu cử hội đồng quản trị\nvà ảnh hưởng đến việc phê duyệt hoặc phong tỏa một công ty: những cổ đông này được biết đến\nlà cổ đông kiểm soát. Ngược lại, cổ đông không kiểm soát (cổ đông thiểu số) nắm giữ\ntỷ lệ nhỏ hơn nhiều trong số cổ phiếu đang lưu hành của công ty, dẫn đến khả năng\nthực hiện quyền kiểm soát trong hoạt động biểu quyết bị hạn chế hơn. Cổ đông kiểm soát và cổ đông thiểu số là các bên liên quan và\nchỉ các bên liên quan sở hữu cổ phiếu. Nhóm đầy đủ các bên liên quan mang tính toàn diện hơn\nB. Không chính xác vì các nhóm bên liên quan chính của một công ty bao gồm các cổ đông,\nchủ nợ, người quản lý (hoặc giám đốc điều hành), nhân viên khác, ban giám đốc, khách hàng, nhà cung cấp và\nchính phủ/cơ quan quản lý (và nói rộng ra là các cá nhân và nhóm cộng đồng bị ảnh hưởng).\nNgoài ra, ở một số công ty, một cổ đông hoặc nhóm cổ đông cụ thể có thể nắm giữ\ntỷ lệ cổ phần để họ có đủ quyền biểu quyết quyền kiểm soát việc bầu cử ban giám đốc\nvà gây ảnh hưởng đến việc phê duyệt hoặc phong tỏa một công ty; những cổ đông này được biết đến\nlà cổ đông kiểm soát. Ngược lại, cổ đông không kiểm soát (cổ đông thiểu số) nắm giữ\ntỷ lệ nhỏ hơn nhiều trong số cổ phiếu đang lưu hành của công ty, dẫn đến khả năng\nthực hiện quyền kiểm soát trong hoạt động biểu quyết bị hạn chế hơn. Cổ đông kiểm soát và cổ đông thiểu số là các bên liên quan và\nchỉ các bên liên quan sở hữu cổ phần. Nhóm đầy đủ các bên liên quan mang tính toàn diện hơn\nC. Đúng vì các nhóm bên liên quan chính của một công ty bao gồm các cổ đông,\nchủ nợ, người quản lý (hoặc giám đốc điều hành), các nhân viên khác, ban giám đốc, khách hàng, nhà cung cấp và\nchính phủ/cơ quan quản lý (và nói rộng hơn là các cá nhân và nhóm cộng đồng bị ảnh hưởng).\nNhà phát hành doanh nghiệp: mô tả các nhóm bên liên quan của công ty và so sánh lợi ích của họ","qhtml":null},{"n":56,"q":"In a corporation, which of the following stakeholder groups is the principal in a principal-\nagent relationship?","opts":["Shareholders","Board of directors","Senior management"],"ans":"A","expl":"A. Đúng vì mối quan hệ giữa cổ đông và người quản lý/giám đốc là một\nví dụ cổ điển về mối quan hệ người ủy quyền-người đại diện, theo đó các cổ đông (người ủy quyền trong trường hợp này) bầu\ngiám đốc (người đại diện), những người được kỳ vọng sẽ bảo vệ lợi ích của họ bằng cách bổ nhiệm người quản lý cấp cao\n(một người đại diện khác) để điều hành công ty\nB. Không chính xác vì mối quan hệ giữa cổ đông và người quản lý/giám đốc là một\nví dụ cổ điển về mối quan hệ người ủy quyền-người đại diện, theo đó các cổ đông (người ủy quyền trong trường hợp này) bầu\ngiám đốc (người đại diện) được kỳ vọng sẽ bảo vệ lợi ích của họ bằng cách bổ nhiệm người quản lý cấp cao\n(người đại diện khác) để điều hành công ty. Vì vậy, ban giám đốc là một đại lý (không phải là hiệu trưởng) trong một\ntập đoàn.\nC. Không chính xác vì mối quan hệ giữa cổ đông và người quản lý/giám đốc là một\nví dụ cổ điển về mối quan hệ người ủy quyền-người đại diện, theo đó các cổ đông (người ủy quyền trong trường hợp này) bầu\ngiám đốc (người đại diện) được kỳ vọng sẽ bảo vệ lợi ích của họ bằng cách bổ nhiệm người quản lý cấp cao\n(người đại diện khác) để điều hành công ty. Vì vậy, ban quản lý cấp cao là người đại diện (không phải người đứng đầu) trong một\ntập đoàn.\nNhà phát hành doanh nghiệp: mô tả mối quan hệ giữa người đại diện và người ủy quyền và những xung đột có thể nảy sinh giữa\nnhóm bên liên quan","qhtml":null},{"n":57,"q":"An analyst gathers the following information about a company:\nCapital Source Market Value (Millions) Before-tax Cost of Capital\nBonds €60 6%\nPreferred stock €20 8%\nCommon stock €120 15%\nIf the company's marginal tax rate is 40%, its weighted average cost of capital is closest to:","opts":["9.7%.","10.9%.","11.6%."],"ans":"B","expl":"A. Không chính xác vì đây là mức trung bình chứ không phải mức trung bình có trọng số của chi phí vốn (như được tính\ntrong cơ sở phản hồi cho đáp án). WACC = (6% +8% +15%)/3 = 9,67%.\nB. Đúng vì WACC = x (1-t) + w r + w r\nword p p e e\nTrong đó:\n𝑤 = trọng số giá trị thị trường của khoản nợ = 60/(60+20 + 120) = 0,30\n𝑑\nr = chi phí nợ trước thuế = 6%\nd\nt= thuế suất cận biên của công ty = 40% = 0,4\nw = trọng số giá trị thị trường của cổ phiếu ưu đãi = 20 / (60+20+ 120) = 0,10\np\nr = chi phí cận biên của cổ phiếu ưu đãi = 8%\np\nw = trọng số giá trị thị trường của vốn chủ sở hữu = 120 / (60+20+ 120) = 0,60\ne\nr = chi phí biên của vốn chủ sở hữu = 15%\ne\nWACC = (0,30 x 6% x (1 -0,4)) + (0,10 x 8% ) + (0,60 x 15% ) = 10,88%.\nC. Không chính xác vì chi phí nợ trước thuế được sử dụng trong tính toán. WACC = (0,30 x 6%) + (0,10 x\n8%) + (0,60 x 15%) =11,60%\nTổ chức phát hành doanh nghiệp: tính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty","qhtml":null},{"n":58,"q":"Covenants are most likely to exist between a company and its:","opts":["creditors.","management.","board of directors."],"ans":"A","expl":"A. Đúng vì để hạn chế rủi ro của người sở hữu trái phiếu trong thời hạn của trái phiếu (hoặc khoản vay), khế ước trái phiếu\nthường chứa các giao ước, là các điều khoản và điều kiện của thỏa thuận cho vay, cho phép\nchủ nợ chỉ định các hành động mà nhà phát hành có nghĩa vụ thực hiện hoặc bị cấm thực hiện.\nB. Không chính xác vì các giao ước, là điều khoản và điều kiện của các thỏa thuận cho vay, cho phép\nchủ nợ chỉ định các hành động mà tổ chức phát hành có nghĩa vụ thực hiện hoặc bị cấm thực hiện.\nCác giao ước áp dụng cho mối quan hệ của tổ chức phát hành với các chủ nợ, không phải với ban quản lý.\nC. Không chính xác vì các giao ước, là điều khoản và điều kiện của các thỏa thuận cho vay, cho phép\nchủ nợ chỉ định các hành động mà tổ chức phát hành có nghĩa vụ thực hiện hoặc bị cấm thực hiện.\nCác giao ước áp dụng cho mối quan hệ của tổ chức phát hành với các chủ nợ, không phải với hội đồng quản trị.\nNhà phát hành doanh nghiệp: mô tả quản trị doanh nghiệp và cơ chế quản lý các mối quan hệ của bên liên quan\nvà giảm thiểu các mối quan hệ liên quan rủi ro","qhtml":null},{"n":59,"q":"If a company's debt-to-equity ratio is 0.5, the weight of equity applied in estimating the\ncompany's WACC is closest to:","opts":["0.33.","0.50.","0.67."],"ans":"C","expl":"A. Không chính xác vì đó là sức nặng của nợ chứ không phải vốn chủ sở hữu. 0,5/ (1,5) = 0,333 -0,33.\nB. Không chính xác vì đây là tỷ lệ D/E chứ không phải tỷ trọng vốn chủ sở hữu.\nC. Đúng vì trọng số của khoản nợ được xác định theo công thức:\nW =D/E/(1+D/E) trong đó D là giá trị của khoản nợ và E là giá trị của vốn chủ sở hữu. Tỷ trọng vốn chủ sở hữu (w.) là\nd\nđược biểu thị bằng 1 trừ đi tỷ trọng nợ. Tính toán: 1-0,5/(1,5)=1-0,333 =0,667 ≈0,67.\nTổ chức phát hành doanh nghiệp: tính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty","qhtml":null},{"n":60,"q":"Compared to those of public companies, share issuances of private companies most\nlikely.","opts":["raise larger amounts of capital.","include a larger number of investors.","include investors with longer holding periods."],"ans":"C","expl":"A. Không chính xác vì các công ty tư nhân thường huy động ít tiền mặt hơn so với các công ty đại chúng. Ngược lại, các công ty tư nhân tài trợ số tiền nhỏ hơn nhiều trên thị trường sơ cấp (nợ tư nhân hoặc\nvốn chủ sở hữu) với ít nhà đầu tư có thời gian nắm giữ dài hơn nhiều.\nB. Không chính xác vì số lượng nhà đầu tư tham gia chào bán của các công ty tư nhân\nthấp hơn. Ngược lại, các công ty tư nhân tài trợ số tiền nhỏ hơn nhiều trên thị trường sơ cấp (nợ hoặc vốn chủ sở hữu\ntư nhân) với ít nhà đầu tư có thời gian nắm giữ dài hơn nhiều.\nC. Đúng vì để huy động thêm vốn sau khi niêm yết, các công ty đại chúng có thể phát hành thêm cổ phiếu trên\nthị trường vốn, thường huy động số tiền rất lớn từ nhiều nhà đầu tư, những người sau đó có thể chủ động\ngiao dịch cổ phiếu với nhau trên thị trường thứ cấp. Ngược lại, các công ty tư nhân tài trợ\nsố tiền nhỏ hơn nhiều trên thị trường sơ cấp (nợ tư nhân hoặc vốn cổ phần) với rất ít nhà đầu tư\ncó thời gian nắm giữ lâu hơn nhiều.\nCác tổ chức phát hành doanh nghiệp: so sánh các tổ chức phát hành doanh nghiệp thuộc sở hữu công và tư nhân","qhtml":null},{"n":61,"q":"Tiered pricing is best described as:","opts":["charging different prices at different times.","charging different prices to different buyers.","combining a low price on a piece of equipment with high-margin pricing on repeat-purchase consumables."],"ans":"B","expl":"A. Không chính xác vì tính năng định giá động tính các mức giá khác nhau vào những thời điểm khác nhau.\nB. Đúng vì định giá theo cấp độ tính các mức giá khác nhau cho những người mua khác nhau, phổ biến nhất là dựa trên\ndựa trên số lượng mua\nC. Không chính xác vì định giá theo dao cạo kết hợp giữa mức giá thấp cho một thiết bị và\nđịnh giá lợi nhuận cao cho các mặt hàng tiêu dùng mua lặp lại.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":62,"q":"A company is deciding whether to invest in one of two mutually exclusive projects with\npositive NPVs. If Project 1 has a higher NPV but a lower IRR than Project 2, the company\nshould:","opts":["prefer Project 1.","prefer Project 2.","be indifferent between Project 1 and Project 2."],"ans":"A","expl":"A. Đúng vì khi lựa chọn giữa hai dự án loại trừ lẫn nhau và NPV và IRR\nxếp hạng hai dự án khác nhau thì tiêu chí NPV được ưu tiên hơn.... Về mặt thực tế,\nkhi một công ty có dữ liệu để tính NPV, việc tính IRR và\ntiêu chí phân bổ vốn khác là khá đơn giản. Tuy nhiên, tiêu chí phù hợp nhất và hợp lý nhất về mặt lý thuyết là\nNPV.\nB. Không chính xác vì khi lựa chọn giữa hai dự án loại trừ lẫn nhau và NPV cũng như\nIRR xếp hạng hai dự án khác nhau thì tiêu chí NPV [không phải IRR] được ưu tiên nhiều hơn.\nC. Không chính xác vì khi lựa chọn giữa hai dự án loại trừ lẫn nhau và NPV cũng như\nIRR xếp hạng hai dự án khác nhau thì tiêu chí NPV [không phải một] được ưu tiên sử dụng.\nNhà phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV),\ntỷ lệ hoàn vốn (IRR) nội bộ và lợi tức trên vốn đầu tư (ROIC) cũng như đối chiếu việc sử dụng chúng trong phân bổ vốn","qhtml":null},{"n":63,"q":"Compared to private corporations, which of the following is a typical characteristic of\npublic corporations?","opts":["A government is a shareholder","Shares are listed on a stock exchange","Transfer of ownership between investors is more difficult"],"ans":"B","expl":"A. Không chính xác vì từ 'công khai' có thể gây hiểu lầm vì nó thường ám chỉ sự tham gia của chính phủ\nTuy nhiên, khi nói đến các tập đoàn, 'công khai' và 'tư nhân' thường được xác định bởi\nliệu vốn cổ phần của công ty có được niêm yết trên sàn giao dịch chứng khoán hay không.\nB. Đúng vì khi nói đến các tập đoàn, 'công khai' và 'riêng tư' thường được xác định bởi\nliệu vốn cổ phần của công ty có được niêm yết trên sàn giao dịch chứng khoán hay không, mặc dù ở một số quốc gia, việc một\ncông ty có được coi là công khai hay không có thể phụ thuộc vào số lượng cổ đông của công ty đó, bất kể\ncho dù công ty đó có được niêm yết hay không.\nC. Không chính xác vì đây là cổ phiếu của công ty tư nhân không được giao dịch trên sàn giao dịch nên không có\ngiá trị rõ ràng hoặc sự minh bạch về giá đối với công ty và cổ phiếu không dễ dàng được mua và bán.\nĐiều này khiến việc chuyển quyền sở hữu giữa người bán và người mua khó khăn hơn nhiều so với một công ty\nđại chúng.\nCác tổ chức phát hành doanh nghiệp: so sánh các tổ chức phát hành doanh nghiệp thuộc sở hữu công và tư nhân","qhtml":null},{"n":64,"q":"When choosing between mutually exclusive projects, an analyst should:","opts":["accept the project with the highest IRR.","use the opportunity cost of funds as the discount rate.","accept the projects for which the IRR is greater than the opportunity cost of funds."],"ans":"B","expl":"A. Không chính xác vì khi lựa chọn giữa hai dự án loại trừ lẫn nhau và NPV và\nIRR xếp hạng hai dự án khác nhau thì tiêu chí NPV được ưu tiên nhiều hơn. Các dự án độc lập\nso với các dự án loại trừ lẫn nhau: Các dự án độc lập là những khoản đầu tư vốn có dòng tiền\nđộc lập với nhau. Các dự án loại trừ lẫn nhau sẽ cạnh tranh trực tiếp với nhau.\nquy tắc quyết định cho IRR là đầu tư nếu IRR vượt quá tỷ suất lợi nhuận yêu cầu cho khoản đầu tư\n. Đầu tư nếu: IRR >r và Không đầu tư nếu IRR <r. Tỷ suất lợi nhuận yêu cầu thường được gọi là\ntỷ lệ vượt rào, tỷ lệ mà IRR của dự án phải vượt quá để dự án được công ty\nchấp nhận.\nB . Đúng vì khi lựa chọn giữa hai dự án loại trừ lẫn nhau và NPV và\nIRR xếp hạng hai dự án khác nhau thì tiêu chí NPV được ưu tiên hơn, chúng tôi gọi tỷ lệ\nđược sử dụng để chiết khấu dòng tiền là \"tỷ suất lợi nhuận yêu cầu\". Tỷ suất lợi nhuận yêu cầu là\ntỷ lệ chiết khấu mà nhà cung cấp vốn của tổ chức phát hành yêu cầu do tính rủi ro của dự án.\ntỷ lệ chiết khấu này thường được gọi là \"chi phí cơ hội của vốn\" hoặc \"chi phí vốn. Đối với khoản đầu tư\nvới một khoản đầu tư được thực hiện ban đầu, giá trị hiện tại ròng (NPV) là giá trị hiện tại\ncủa dòng tiền sau thuế trong tương lai trừ đi chi phí đầu tư, trong đó tỷ lệ chiết khấu bằng\ntỷ suất lợi nhuận yêu cầu.\nC. Không chính xác vì quy tắc quyết định cho IRR là đầu tư nếu IRR vượt quá tỷ lệ hoàn vốn\nyêu cầu cho một khoản đầu tư vốn Đầu tư nếu IRR > r và Không đầu tư nếu IRR <r. Tuy nhiên, khi\nlựa chọn nằm giữa hai dự án loại trừ lẫn nhau và NPV và IRR xếp hạng hai dự án\nkhác nhau, thì tiêu chí NPV được ưu tiên hơn. Tiêu chí IRR không được ưu tiên trong\ntrường hợp này. Ngoài ra, các dự án loại trừ lẫn nhau ngụ ý rằng chỉ có thể chọn một dự án.\nNhà phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính toán giá trị hiện tại ròng (NPV),\ntỷ lệ hoàn vốn (IRR) nội bộ và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn","qhtml":null},{"n":65,"q":"An electric vehicle manufacturer invests in a new technology to meet new safety\nstandards. This project is best classified as a(n):","opts":["expansion project.","compliance project.","going concern project."],"ans":"B","expl":"A. Không chính xác vì các dự án mở rộng là những dự án làm tăng quy mô kinh doanh, thường bằng cách đầu tư vào\nđể phát triển các sản phẩm hoặc dịch vụ mới và/hoặc mua lại các công ty khác. Việc đầu tư vào\ncông nghệ mới để đáp ứng các tiêu chuẩn an toàn được cải thiện không phải là một dự án mở rộng.\nB. Đúng vì các dự án tuân thủ và quy định được yêu cầu bởi các bên thứ ba, chẳng hạn như\ncơ quan quản lý chính phủ, để đáp ứng các tiêu chuẩn về an toàn và tuân thủ quy định. Do đó, việc đầu tư\nvào công nghệ mới để đáp ứng các tiêu chuẩn an toàn được cải thiện là một dự án tuân thủ.\nC. Không chính xác vì các dự án đang được quan tâm là những khoản đầu tư cần thiết để tiếp tục các hoạt động hiện tại của công ty\n và duy trì quy mô hiện tại của doanh nghiệp. Việc đầu tư vào công nghệ\nmới để đáp ứng các tiêu chuẩn an toàn được cải thiện không phải là một dự án đang được quan tâm.\nCác tổ chức phát hành doanh nghiệp: mô tả các loại hình đầu tư vốn","qhtml":null},{"n":66,"q":"The flow of finished goods from manufacturer to wholesaler, retailer, and finally to the\nend customer best describes a(n):","opts":["direct sales strategy.","omnichannel strategy.","traditional channel strategy."],"ans":"C","expl":"A. Không chính xác vì nhà sản xuất [đôi khi] sử dụng chiến lược bán hàng trực tiếp, bán trực tiếp cho\nkhách hàng cuối. Bán trực tiếp cho khách hàng cuối bỏ qua ('hủy trung gian') nhà phân phối hoặc\nnhà bán lẻ. Thông thường, điều này liên quan đến lực lượng bán hàng của chính công ty, mà trong một số trường hợp đại diện cho một\nđầu tư kinh doanh đáng kể và chi phí vận hành cho công ty.\nB. Không chính xác vì với chiến lược đa kênh, cả kênh kỹ thuật số và kênh truyền thống đều được sử dụng để\nhoàn tất giao dịch bán hàng. Ví dụ: khách hàng có thể đặt hàng trực tuyến và nhận hàng tại cửa hàng ('nhấp\nvà nhận hàng') hoặc chọn một mặt hàng trong cửa hàng và yêu cầu giao hàng. Do đó, chiến lược đa kênh\nkhông nói gì về dòng hàng hóa từ nhà sản xuất đến nhà bán buôn, nhà bán lẻ và sau đó là khách hàng\ncuối cùng.\nC. Đúng vì đối với các doanh nghiệp 'sản phẩm', chiến lược kênh truyền thống thường được phản ánh trong\nluồng hàng hóa thành phẩm (ví dụ: từ nhà sản xuất đến nhà bán buôn, nhà bán lẻ và khách hàng cuối), mỗi\ncó cơ sở vật chất riêng và sản phẩm được bán và mua ở mỗi giai đoạn.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":67,"q":"A company is evaluating the following mutually exclusive capital projects:\nProject 1 Project 2\nNPV $180,000 $100,000\nIRR 10% 15%\nIf the hurdle rate is 8%, the company should invest in:","opts":["Project 1 only.","Project 2 only.","both Project 1 and Project 2."],"ans":"A","expl":"A. Đúng vì Dự án 1 có NPV cao hơn. Đối với các khoản đầu tư loại trừ lẫn nhau được xếp hạng\nkhác nhau theo NPV và IRR, tiêu chí NPV hợp lý hơn về mặt kinh tế.\nB. Không chính xác vì Dự án 2 có NPV thấp hơn mặc dù IRR cao hơn. Đối với các khoản đầu tư\nloại trừ lẫn nhau được xếp hạng khác nhau theo NPV và IRR, tiêu chí NPV mang tính kinh tế hơn\nâm thanh.\nC. Không chính xác vì Dự án 1 và Dự án 2 là các dự án loại trừ lẫn nhau. Trong trường hợp các dự án đầu tư\nđộc quyền lẫn nhau, đôi khi, một công ty có thể gặp phải tình huống sau Dự án A\ncó thể có NPV lớn hơn Dự án B, nhưng Dự án B có IRR cao hơn dự án A. Vì\ncông ty chỉ có thể đầu tư vào một dự án, nên đó sẽ là Dự án A hay Dự án B? Lựa chọn\nđúng là Dự án A, dự án có NPV cao hơn.\nNhà phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV),\ntỷ lệ hoàn vốn nội bộ (IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu cách sử dụng chúng trong phân bổ vốn.","qhtml":"<p>A company is evaluating the following mutually exclusive capital projects:</p><table class=\"qtable\"><thead><tr><th></th><th>Project 1</th><th>Project 2</th></tr></thead><tbody><tr><td>NPV</td><td>$180,000</td><td>$100,000</td></tr><tr><td>IRR</td><td>10%</td><td>15%</td></tr></tbody></table><p>If the hurdle rate is 8%, the company should invest in:</p>"}];
const CFG = {"title": "Corporate Issuers", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 134, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;

    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);

  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');

      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';

    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;

    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}

    var chips=document.getElementById("chips");

  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";

      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

<script id="qnotes-panel-js">
(function(){

    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();

    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;

  });
  head.addEventListener("pointermove",function(e){

    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

    panel.style.left=nx+"px"; panel.style.top=ny+"px";

})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
