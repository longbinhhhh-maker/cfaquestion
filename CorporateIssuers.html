orrect because the NPV, including the real option, should be:\nProject NPV = NPV (based on DCF alone) - Cost of options + Value of options.\nProject NPV = -$0.2 million - $0.4 million+ $0.8 million = $0.2 million.\nB. Incorrect because the original NPV of the investment was not considered.\nProject NPV≠ - Cost of options + Value of options.\nProject NPV ≠ -$0.4 million+ $0.8 million = $0.4 million.\nC. Incorrect because the cost of the option was added to the NPV (based on DCF alone) instead of\nbeing subtracted.\nProject NPV ≠ NPV (based on DCF alone) + Cost of options + Value of options\nProject NPV≠ - $0.2 million+ $0.4 million+ $0.8 million = $1.0 million\nCorporate Issuers: describe types of real options relevant to capital investments", "qhtml": null}, {"n": 52, "q": "According to the pecking order theory, company managers most likely prefer to:", "opts": ["issue debt as the last resort.", "raise equity first to preserve cash-flow.", "rely on internal financing over new equity."], "ans": "C", "expl": "A. Incorrect because the pecking order theory suggests that managers choose methods of financing\naccording to a hierarchy that gives first preference to methods with the least potential information\ncontent (internally generated funds and lowest preference to the form with the greatest potential\ninformation content (public equity offerings) in brief managers prefer theaval financing if mtamal\nfinancing is matfficient, otänagcis next pieter debt, then equity\nB. incorrect because the pecking order theory suggests that managers choose melbous of financing\naccording to a bierarchy.Inal gives first preference to methods with the least potential information\ncontent (internet generated funds) and lowest preference to the form with the greatest potential\ninformation content (public equity offerings) in one, managers pater internal financing if internal\nfinancing is insufficient managers.next.prefer debt then equity\nC. Correct because the pecking order theory suggests that managers choose methods of inboeing\naccording to a hierarchy loat gives first preference to etempts with the least perenal intoniasion\ncontent miernaky generated funds) and lowest preference to the form with the greatest potential\ninformation content (public equity offerings) in Duet managers prefer internal financing If internal\nfinancing is meatticent, managers next prefer debt then equity.", "qhtml": null}, {"n": 53, "q": "Which of the following is most accurate?", "opts": ["Risk appetites are similar among private lenders", "Staggered boards provide continuous implementation of strategy and oversight", "A company's CEO is responsible for implementing the company's strategy under the oversight of the company's shareholders"], "ans": "B", "expl": "A. Incorrect because private debtholders have wide variation in risk appetites. With banks and\nprivate lenders, the general perspective of debtholders applies less financial leverage implies less\nrisk and is therefore preferred. Among private lenders, however, there is wide variation in their risk\nappetite, approach, behavior, and relationships with companies to whom they have provided\ncapital.\nB. Correct because the positive aspect of a staggered board, though, is that it provides continuous\nimplementation of strategy and oversight without constantly being reassessed by new board\nmembers, which otherwise risks bringing short-termism into company strategy\nC. Incorrect because a company's CEO is hired by the board and responsible for implementing the\ncompany's strategy under the oversight of the board of directors. Managers, led by the chief\nexecutive officer of the company, are responsible for determining and implementing the\ncorporation's strategy under the oversight of the board of directors. In addition, a company's board\nof directors is elected by shareholders to protect shareholders' interests and provide strategic\ndirection, taking into consideration the company's risk appetite, which it defines for the company.\nThe board is also responsible for hiring the CEO and monitoring the performance of the company\nand management.\nCorporate Issuers: describe a company's stakeholder groups and compare their interests", "qhtml": null}, {"n": 54, "q": "The potential for conflict between debtholders and shareholders is:", "opts": ["lower for long-term debt than for short-term debt.", "the same for long-term debt and short-term debt.", "higher for long-term debt than for short-term debt."], "ans": "C", "expl": "A. Incorrect because the potential debt/equity conflict is greater in the case of long-term rather\nthan short-term debt because the passage of time exposes debtholders to possible changes in\nbusiness conditions, strategy, and management behavior So, the conflict between debtholders and\nshareholders is greater (not lower) in the case of long term versus short-term debt\nB. Incorrect because the potential debt/equity conflict is greater in the case of long-term rather than\nshort-term debt because the passage of time exposes debtholders to possible changes in business\nconditions, strategy, and management behavior. So, the conflict between debtholders and\nshareholders is greater (not the same) in the case of long-term versus snott-term debt\nC. Correct because the potential devequity conflict is greater to the case of long-term other their\nstair-te debt because the passage of time exposes debtholders to possible changes in business\nconditions strategy and management behavior\nCorporate Issuers: describe the principal-agent relationship and conflicts that may arise between\nstakeholder groups", "qhtml": null}, {"n": 55, "q": "A corporation's stakeholders most likely include:", "opts": ["shareholders only.", "controlling shareholders only.", "all shareholders and all employees."], "ans": "C", "expl": "A. Incorrect because the primary stakeholder groups of a corporation consist of shareholders,\ncreditors, managers (or executives), other employees, board of directors, customers, suppliers, and\ngovernments/regulators (and, by extension, affected individuals and community groups).\nAdditionally, in some companies, a particular shareholder or block of shareholders may hold a\npercentage of shares that gives them sufficient voting power to control the election of the board of\ndirectors and to influence the approval or blockage of a company re : these shareholders are known\nas controlling shareholders. In contrast, non-controlling shareholders (minority shareholders) hold a\nmuch smaller proportion of a company's outstanding shares, resulting in a more limited ability to\nexercise control in voting activities. Controlling and minority shareholders are stakeholders, and the\nonly stakeholders who own shares. The full group of stakeholders is more inclusive\nB. Incorrect because the primary stakeholder groups of a corporation consist of shareholders,\ncreditors, managers (or executives), other employees, board of directors, customers, suppliers, and\ngovernments/regulators (and, by extension, affected individuals and community groups).\nAdditionally, in some companies, a particular shareholder or block of shareholders may hold a\npercentage of shares that gives them sufficient voting power to control the election of the board of\ndirectors and to influence the approval or blockage of a company re ; these shareholders are known\nas controlling shareholders. In contrast, non-controlling shareholders (minority shareholders) hold a\nmuch smaller proportion of a company's outstanding shares, resulting in a more limited ability to\nexercise control in voting activities. Controlling and minority shareholders are stakeholders, and the\nonly stakeholders who own shares. The full group of stakeholders is more inclusive\nC. Correct because the primary stakeholder groups of a corporation consist of shareholders,\ncreditors, managers (or executives), other employees, board of directors, customers, suppliers, and\ngovemments/regulators (and, by extension, affected individuals and community groups).\nCorporate Issuers: describe a company's stakeholder groups and compare their interests", "qhtml": null}, {"n": 56, "q": "In a corporation, which of the following stakeholder groups is the principal in a principal-\nagent relationship?", "opts": ["Shareholders", "Board of directors", "Senior management"], "ans": "A", "expl": "A. Correct because the relationship between shareholders and managers/directors is a classic\nexample of a principal-agent relationship, whereby shareholders (the principal in this case) elect\ndirectors (an agent) who are expected to protect their interests by appointing senior managers\n(another agent) to run the company\nB. Incorrect because the relationship between shareholders and managers/directors is a classic\nexample of a principal-agent relationship, whereby shareholders (the principal in this case) elect\ndirectors (an agent) who are expected to protect their interests by appointing senior managers\n(another agent) to run the company. So, the board of directors is an agent (not a principal) in a\ncorporation.\nC. Incorrect because the relationship between shareholders and managers/directors is a classic\nexample of a principal-agent relationship, whereby shareholders (the principal in this case) elect\ndirectors (an agent) who are expected to protect their interests by appointing senior managers\n(another agent) to run the company. So, the senior management is an agent (not a principal) in a\ncorporation.\nCorporate Issuers: describe the principal-agent relationship and conflicts that may arise between\nstakeholder groups", "qhtml": null}, {"n": 57, "q": "An analyst gathers the following information about a company:\nCapital Source Market Value (Millions) Before-tax Cost of Capital\nBonds €60 6%\nPreferred stock €20 8%\nCommon stock €120 15%\nIf the company's marginal tax rate is 40%, its weighted average cost of capital is closest to:", "opts": ["9.7%.", "10.9%.", "11.6%."], "ans": "B", "expl": "A. Incorrect because it is the average, not the weighted average of the costs of capital (as calculated\nin the response rationale for the answer key). WACC = (6% +8% +15%)/3 = 9.67%.\nB. Correct because the WACC = x (1-t) + w r + w r\nword p p e e\nWhere:\n𝑤 = the market value weight for debt = 60/(60+20 + 120) = 0.30\n𝑑\nr = the before-tax cost of debt = 6%\nd\nt= the company's marginal tax rate = 40% = 0.4\nw = the market value weight for preferred stock = 20 / (60+20+ 120) = 0.10\np\nr =the marginal cost of preferred stock = 8%\np\nw = the market value weight for equity = 120 / (60+20+ 120) = 0.60\ne\nr = the marginal cost of equity = 15%\ne\nWACC = (0.30 x 6% x (1 -0.4)) + (0.10 x 8% ) + (0.60 x 15% ) = 10.88%.\nC. Incorrect because before-tax cost of debt is used in the calculation. WACC = (0.30 x 6%) + (0.10 x\n8%) + (0.60 x 15%) =11.60%\nCorporate Issuers: calculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 58, "q": "Covenants are most likely to exist between a company and its:", "opts": ["creditors.", "management.", "board of directors."], "ans": "A", "expl": "A. Correct because to limit bondholders' risk during the term of a bond (or loan), the bond indenture\ntypically contains covenants, which are the terms and conditions of lending agreements, enabling\ncreditors to specify the actions an issuer is obligated to perform or prohibited from performing.\nB. Incorrect because covenants, which are the terms and conditions of lending agreements, enabling\ncreditors to specify the actions an issuer is obligated to perform or prohibited from performing.\nCovenants apply to an issuer's relationship with creditors, not with management.\nC. Incorrect because covenants, which are the terms and conditions of lending agreements, enabling\ncreditors to specify the actions an issuer is obligated to perform or prohibited from performing.\nCovenants apply to an issuer's relationship with creditors, not with the board of directors.\nCorporate Issuers: describe corporate governance and mechanisms to manage stakeholder\nrelationships and mitigate associated risks", "qhtml": null}, {"n": 59, "q": "If a company's debt-to-equity ratio is 0.5, the weight of equity applied in estimating the\ncompany's WACC is closest to:", "opts": ["0.33.", "0.50.", "0.67."], "ans": "C", "expl": "A. Incorrect because it is the weight of debt, not equity. 0.5/ (1.5) = 0.333 -0.33.\nB. Incorrect because it is the D/E ratio not the weight of equity.\nC. Correct because the weight of debt is determined by the formula:\nW =D/E/(1+D/E) where D is the value of debt and E is the value of equity. Weight of equity (w.) is\nd\nrepresented by 1 minus the weight of debt. Calculation: 1-0.5/(1.5)=1-0.333 =0.667 ≈0.67.\nCorporate Issuers: calculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 60, "q": "Compared to those of public companies, share issuances of private companies most\nlikely.", "opts": ["raise larger amounts of capital.", "include a larger number of investors.", "include investors with longer holding periods."], "ans": "C", "expl": "A. Incorrect because private companies usually raise less cash compared to public companies. In\ncontrast, private companies finance much smaller amounts in the primary market (private debt or\nequity) with far fewer investors who have much longer holding periods.\nB. Incorrect because the number of investors that participate in offerings of private companies is\nlower. In contrast, private companies finance much smaller amounts in the primary market (private\ndebt or equity) with far fewer investors who have much longer holding periods.\nC. Correct because to raise more capital after listing, public companies may issue additional shares in\nthe capital markets, typically raising very large amounts from many investors who may then actively\ntrade shares among themselves in the secondary market. In contrast, private companies finance\nmuch smaller amounts in the primary market (private debt or equity) with far fewer investors who\nhave much longer holding periods.\nCorporate Issuers: compare publicly and privately owned Corporate Issuers", "qhtml": null}, {"n": 61, "q": "Tiered pricing is best described as:", "opts": ["charging different prices at different times.", "charging different prices to different buyers.", "combining a low price on a piece of equipment with high-margin pricing on repeat-purchase consumables."], "ans": "B", "expl": "A. Incorrect because dynamic pricing charges different prices at different times.\nB. Correct because tiered pricing charges different prices to different buyers, most commonly based\non volume purchased\nC. Incorrect because razors-and-blades pricing combines a low price on a piece of equipment and\nhigh-margin pricing on repeat-purchase consumables.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 62, "q": "A company is deciding whether to invest in one of two mutually exclusive projects with\npositive NPVs. If Project 1 has a higher NPV but a lower IRR than Project 2, the company\nshould:", "opts": ["prefer Project 1.", "prefer Project 2.", "be indifferent between Project 1 and Project 2."], "ans": "A", "expl": "A. Correct because when the choice is between two mutually exclusive projects and the NPV and IRR\nrank the two projects differently, the NPV criterion is strongly preferred.... As a practical matter,\nonce a corporation has the data to calculate the NPV, it is fairly trivial to then calculate the IRR and\nother capital allocation criteria. However, the most appropriate and theoretically sound criterion is\nthe NPV.\nB. Incorrect because when the choice is between two mutually exclusive projects and the NPV and\nIRR rank the two projects differently, the NPV [not IRR] criterion is strongly preferred.\nC. Incorrect because when the choice is between two mutually exclusive projects and the NPV and\nIRR rank the two projects differently, the NPV criterion [not either one] is strongly preferred.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation", "qhtml": null}, {"n": 63, "q": "Compared to private corporations, which of the following is a typical characteristic of\npublic corporations?", "opts": ["A government is a shareholder", "Shares are listed on a stock exchange", "Transfer of ownership between investors is more difficult"], "ans": "B", "expl": "A. Incorrect because the word 'public' can be misleading because it typically implies government\ninvolvement However, when it comes to corporations, 'public' and 'private' are typically defined by\nwhether the company's equity is listed on a stock exchange.\nB. Correct because when it comes to corporations, 'public' and 'private' are typically defined by\nwhether the company's equity is listed on a stock exchange, although in some countries whether a\ncompany is considered public or not may depend on its number of shareholders, irrespective of\nwhether it is listed.\nC. Incorrect because these are private company shares do not trade on an exchange, so no visible\nvaluation or price transparency exists for the company and shares are not easily bought and sold.\nThis makes ownership transfers between seller and buyer much more difficult than for a public\ncompany.\nCorporate Issuers: compare publicly and privately owned Corporate Issuers", "qhtml": null}, {"n": 64, "q": "When choosing between mutually exclusive projects, an analyst should:", "opts": ["accept the project with the highest IRR.", "use the opportunity cost of funds as the discount rate.", "accept the projects for which the IRR is greater than the opportunity cost of funds."], "ans": "B", "expl": "A. Incorrect because when the choice is between two mutually exclusive projects and the NPV and\nIRR rank the two projects differently, the NPV criterion is strongly preferred. Independent projects\nversus mutually exclusive projects: Independent projects are capital investments whose cash flows\nare independent of each other. Mutually exclusive projects compete directly with each other. The\ndecision rule for the IRR is to invest if the IRR exceeds the required rate of return for a capital\ninvestment. Invest if: IRR >r, and Do not invest if IRR <r. The required rate of return is often called\nthe hurdle rate, the rate that a project's IRR must exceed for the project to be accepted by the\ncompany.\nB . Correct because when the choice is between two mutually exclusive projects and the NPV and\nIRR rank the two projects differently, the NPV criterion is strongly preferred, we referred to the rate\nused in discounting the cash flows as the \"required rate of return.\" The required rate of return is the\ndiscount rate that the issuer's suppliers of capital require given the riskiness of the project. This\ndiscount rate is frequently called the \"opportunity cost of funds\" or the \"cost of capital. For a capital\ninvestment with one investment outlay, made initially, the net present value (NPV) is the present\nvalue of the future after-tax cash flows minus the investment outlay, where the discount rate equals\nthe required rate of return.\nC. Incorrect because the decision rule for the IRR is to invest if the IRR exceeds the required rate of\nreturn for a capital investment Invest if IRR > r, and Do not invest if IRR <r. However, when the\nchoice is between two mutually exclusive projects and the NPV and IRR rank the two projects\ndifferently, the NPV criterion is strongly preferred. Therefore, the IRR criterion is not preferred in\nthis case. In addition, mutually exclusive projects imply that only one project can be chosen.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation", "qhtml": null}, {"n": 65, "q": "An electric vehicle manufacturer invests in a new technology to meet new safety\nstandards. This project is best classified as a(n):", "opts": ["expansion project.", "compliance project.", "going concern project."], "ans": "B", "expl": "A. Incorrect because expansion projects are those that increase business size, usually by investing in\nthe development of new products or services and/or acquiring other companies. The investment in\nnew technology to meet improved safety standards is not an expansion project.\nB. Correct because regulatory and compliance projects are required by third parties, such as\ngovernment regulatory bodies, to meet safety and regulatory compliance standards. The investment\nin new technology to meet improved safety standards is therefore a compliance project.\nC. Incorrect because going concern projects are those investments needed to continue the\ncompany's current operations and maintain the existing size of the business. The investment in new\ntechnology to meet improved safety standards is not a going concern project.\nCorporate Issuers: describe types of capital investments", "qhtml": null}, {"n": 66, "q": "The flow of finished goods from manufacturer to wholesaler, retailer, and finally to the\nend customer best describes a(n):", "opts": ["direct sales strategy.", "omnichannel strategy.", "traditional channel strategy."], "ans": "C", "expl": "A. Incorrect because manufacturers [sometimes] employ a direct sales strategy, selling directly to\nthe end customer Direct sales to the end customer bypass ('disintermediate') the distributor or\nretailer. Typically, this involves the company's own sales force, which in some cases represents a\nsignificant business investment and carrying cost for the firm.\nB. Incorrect because, with an omnichannel strategy, both digital and physical channels are used to\ncomplete a sale. For example, a customer might order an item online and pick it up in a store ('click\nand collect') or select an item in a store and have it delivered. Thus, an omnichannel strategy does\nnot say anything about the flow of goods from manufacturer to wholesaler, retailer, and then end\ncustomer.\nC. Correct because, for 'product' businesses, the traditional channel strategy is typically reflected in\nthe flow of finished goods (eg, from manufacturer to wholesaler, retailer, and end customer), each\nwith its own physical facilities and with the product sold and purchased at each stage.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 67, "q": "A company is evaluating the following mutually exclusive capital projects:\nProject 1 Project 2\nNPV $180,000 $100,000\nIRR 10% 15%\nIf the hurdle rate is 8%, the company should invest in:", "opts": ["Project 1 only.", "Project 2 only.", "both Project 1 and Project 2."], "ans": "A", "expl": "A. Correct because Project 1 has a higher NPV. For mutually exclusive investments that are ranked\ndifferently by the NPV and IRR, the NPV criterion is more economically sound.\nB. Incorrect because Project 2 has a lower NPV despite a higher IRR. For mutually exclusive\ninvestments that are ranked differently by the NPV and IRR, the NPV criterion is more economically\nsound.\nC. Incorrect because Project 1 and Project 2 are mutually exclusive projects. In the case of mutually\nexclusive investment projects, a company could, on occasion, face the following situation Project A\nmight have a larger NPV than Project B, but Project B has a higher IRR than project A. Since the\ncompany can invest in only one project, which should it be- Project A or Project B? The correct\nchoice is Project A, the one with the higher NPV.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation.", "qhtml": "<p>A company is evaluating the following mutually exclusive capital projects:</p><table class=\"qtable\"><thead><tr><th></th><th>Project 1</th><th>Project 2</th></tr></thead><tbody><tr><td>NPV</td><td>$180,000</td><td>$100,000</td></tr><tr><td>IRR</td><td>10%</td><td>15%</td></tr></tbody></table><p>If the hurdle rate is 8%, the company should invest in:</p>"}];

(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");

      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;

})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;

      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){

  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

<style id="qnote-css">
  main#quiz{max-width:1180px}
  .qrow{display:flex;gap:16px;align-items:flex-start;margin:0 0 16px}
  .qrow > .card{flex:1 1 auto;min-width:0;margin:0}
  .qnote{flex:0 0 300px;align-self:stretch;display:flex;flex-direction:column;
    border-radius:12px;border:1px solid var(--line);

    font-size:12.5px;font-weight:600;color:var(--muted)}

  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}

  .qnote textarea{flex:1 1 auto;width:100%;resize:vertical;min-height:96px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);

  @media (max-width:860px){
    .qrow{flex-direction:column;gap:10px}

    .qnote textarea{min-height:52px}
  }
</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
