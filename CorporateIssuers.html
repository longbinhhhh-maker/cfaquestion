<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"If a corporation is financed with both debt and equity, which of the following must the\ncorporation pay?","opts":["Interest only","Dividends only","Both interest and dividends"],"ans":"A","expl":"A. Đúng vì nợ phải được hoàn trả vào một ngày xác định trước trong tương lai cùng với lãi suất.\nB. Không chính xác vì các nhà đầu tư cổ phần (cổ đông) có quyền nhận bất kỳ khoản phân phối lợi nhuận\n nào, được gọi là cổ tức. Tuy nhiên, mặc dù cổ đông có quyền nhận cổ tức nhưng công ty\nkhông bắt buộc phải trả cổ tức.\nC. Không chính xác vì các nhà đầu tư cổ phần (cổ đông) có quyền nhận bất kỳ khoản phân phối lợi nhuận\n nào, được gọi là cổ tức. Tuy nhiên, mặc dù cổ đông có quyền nhận cổ tức nhưng công ty\nkhông bắt buộc phải trả cổ tức.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":2,"q":"A company that produces goods to be marketed by other firms is best described as having\na:","opts":["value added reseller business model.","licensing arrangement business model.","contract manufacturer business model."],"ans":"C","expl":"A. Không chính xác vì người bán lại giá trị gia tăng không chỉ phân phối sản phẩm mà còn xử lý nhiều\nkhía cạnh phức tạp hơn trong việc cài đặt, tùy chỉnh hoặc hỗ trợ sản phẩm\nB. Không chính xác vì thỏa thuận cấp phép là mô hình kinh doanh trong đó một công ty sẽ sản xuất\nsản phẩm sử dụng tên thương hiệu của người khác để đổi lấy tiền bản quyền.\nC. Đúng vì các nhà sản xuất theo hợp đồng sản xuất hàng hóa để người khác tiếp thị.\nNhà phát hành doanh nghiệp: mô tả nhiều loại mô hình kinh doanh khác nhau","qhtml":null},{"n":3,"q":"\"Economic\" profit is best described as the return to a firm's owners:","opts":["in the form of retained earnings and distributions to the owners.","after corporate taxes and taxes on distributions have been paid.","in excess of what they could have earned elsewhere on different investments."],"ans":"C","expl":"A. Không chính xác vì báo cáo thu nhập của tổ chức phát hành phân biệt giữa thu nhập tài chính hoặc thu nhập ròng\nkhi các nghĩa vụ cố định đã được đáp ứng và lợi nhuận 'kinh tế' hoặc lợi nhuận cho chủ sở hữu công ty\nvượt quá số tiền họ có thể kiếm được ở nơi khác từ các khoản đầu tư khác nhau, được gọi là\ntỷ suất lợi nhuận yêu cầu trên vốn chủ sở hữu.\nB. Không chính xác vì báo cáo thu nhập của tổ chức phát hành phân biệt giữa thu nhập tài chính hoặc thu nhập\nròng sau khi các nghĩa vụ cố định đã được đáp ứng và 'lợi nhuận kinh tế hoặc lợi nhuận cho chủ sở hữu công ty vượt quá\nvượt quá những gì họ có thể kiếm được ở nơi khác từ các khoản đầu tư khác nhau, được gọi là tỷ lệ lợi nhuận trên vốn chủ sở hữu\nbắt buộc.\nC. Đúng vì báo cáo kết quả hoạt động kinh doanh của tổ chức phát hành phân biệt giữa thu nhập tài chính hoặc thu nhập\nròng khi các nghĩa vụ cố định đã được đáp ứng và 'lợi nhuận kinh tế hoặc lợi nhuận cho chủ sở hữu công ty vượt quá\nvượt quá những gì họ có thể kiếm được ở nơi khác từ các khoản đầu tư khác nhau, được gọi là\ntỷ suất lợi nhuận trên vốn chủ sở hữu bắt buộc.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":4,"q":"The purchase of which of the following shares most likely requires investors to be\naccredited?","opts":["Public company shares only","Private company shares only","Both public company shares and private company shares"],"ans":"B","expl":"A. Không chính xác vì các nhà đầu tư của công ty tư nhân có thể bị giới hạn ở các nhà đầu tư\nđủ điều kiện hoặc được gọi là được công nhận hoặc các nhà đầu tư tinh vi, hoặc những người được cơ quan quản lý cho là có khả năng và sẵn lòng\ngánh nhận rủi ro lớn hơn từ đợt chào bán cổ phiếu không ra công chúng.\nB. Đúng vì các nhà đầu tư của công ty tư nhân có thể bị giới hạn ở những nhà đầu tư\nđủ điều kiện hoặc được gọi là được công nhận hoặc những nhà đầu tư tinh vi, hoặc những người được các cơ quan quản lý cho là có khả năng và sẵn lòng\ngánh nhận rủi ro lớn hơn từ đợt chào bán không ra công chúng.\nC. Không chính xác vì các nhà đầu tư của công ty tư nhân có thể bị giới hạn ở những nhà đầu tư\nđủ điều kiện hoặc được gọi là được công nhận hoặc những nhà đầu tư tinh vi, hoặc những người được cơ quan quản lý cho là có thể và sẵn lòng\ngánh nhận rủi ro lớn hơn từ đợt chào bán cổ phiếu riêng lẻ.","qhtml":null},{"n":5,"q":"Which best describes business growth that attracts more customers and merchants,\ncontributing to further growth in\nthe business?","opts":["Crowdsourcing","A one-sided network","A multi-sided network"],"ans":"C","expl":"A. Không chính xác vì nguồn lực cộng đồng là nơi người dùng đóng góp trực tiếp cho sản phẩm hoặc dịch vụ. Những\ndoanh nghiệp này tạo điều kiện thuận lợi cho \"cộng đồng người dùng cho phép cộng tác tự nguyện giữa những người dùng sản phẩm\nvới một ít sự kiểm duyệt và giám sát của công ty.\nB. Không chính xác vì mạng một phía là mạng trong đó chỉ có một loại người dùng có giá trị đối với\nnhững người dùng khác.\nC. Đúng vì mạng nhiều mặt [hai mặt] ngày càng phát triển người dùng tham gia dịch vụ, điều này\nthu hút nhiều người bán hơn, từ đó thu hút nhiều người dùng hơn. Các doanh nghiệp này có thể phát triển theo cấp số nhân.\nNhà phát hành doanh nghiệp: mô tả nhiều loại mô hình kinh doanh khác nhau","qhtml":null},{"n":6,"q":"Private companies most likely have:","opts":["less share price transparency compared to public companies.","similar share price transparency as public companies.","greater share price transparency compared to public companies."],"ans":"A","expl":"A. Đúng vì ngược lại [với các công ty đại chúng], cổ phiếu của một công ty tư nhân không được niêm yết\n(không tồn tại định giá giao dịch hoặc tính minh bạch về giá cổ phiếu. trên sàn giao dịch), vì vậy\nB. Không chính xác vì các công ty tư nhân thường ít có công ty hữu hình thường ít\ntính minh bạch về giá cổ phiếu hơn các công ty đại chúng về tính minh bạch về giá cổ phiếu so với các công ty đại chúng\nC. Không chính xác vì các công ty tư nhân\nNhà phát hành doanh nghiệp: so sánh các nhà phát hành doanh nghiệp thuộc sở hữu công và tư nhân","qhtml":null},{"n":7,"q":"The business model of a knowledge aggregation company that allows its users to\ncontribute directly to online content is best referred to as a:","opts":["platform business model.","marketplace business model.","crowdsourcing business model."],"ans":"C","expl":"A. Không chính xác vì doanh nghiệp nền tảng dựa trên mạng và có thể được phân biệt với doanh nghiệp\ntruyền thống hoặc \"tuyến tính\" giúp tăng thêm giá trị cho thứ gì đó được bán cho khách hàng theo tuyến tính\nchuỗi cung ứng. Các mô hình kinh doanh nền tảng không được phát triển đặc biệt để cho phép người dùng đóng góp\ntrực tiếp vào sản phẩm, dịch vụ hoặc nội dung trực tuyến.\nB. Không chính xác vì các doanh nghiệp trên thị trường tạo ra mạng lưới người mua và người bán mà không có\nquyền sở hữu hàng hóa trong quá trình này. đặc biệt là cho phép người dùng đóng góp\ntrực tiếp vào sản phẩm, dịch vụ hoặc nội dung trực tuyến.\nC. Đúng vì mô hình kinh doanh cung cấp nguồn lực từ cộng đồng cho phép người dùng đóng góp trực tiếp vào một sản phẩm,\nhoặc nội dung trực tuyến. Ví dụ bao gồm: các cuộc thi và cuộc thi trực tuyến, phát triển sản phẩm\n, chẳng hạn như phần mềm nguồn mở, tổng hợp kiến thức, chẳng hạn như Wikipedia và\nWaze/Google Maps; câu lạc bộ người hâm mộ hoặc người có sở thích và mạng lưới thương nhân hoặc chuyên gia.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":8,"q":"Which of the following would most likely be included on a company's \"financial\" balance\nsheet?","opts":["Short-term debt obligations","Relationships with customers","Relationships with key suppliers"],"ans":"A","expl":"A. Đúng vì nợ ngắn hạn được bao gồm trong bảng cân đối tài chính của công ty.\nB. Không chính xác vì hợp đồng với khách hàng và bảng cân đối tài sản vô hình khác nhưng\nđược bao gồm trong bảng cân đối kế toán \"kinh tế\" tài chính của công ty\nC. Không chính xác vì các thỏa thuận với nhà cung cấp và các tài sản vô hình khác được loại trừ khỏi bảng cân đối tài chính của công ty\n nhưng được đưa vào bảng cân đối \"kinh tế\" rộng hơn của nhà phát hành\n.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":9,"q":"Which of the following is a recommended procedure for complying with the Standard\nrelating to preservation of confidentiality?\n● Procedure 1: Disclose to authorized fellow employees only information that will\nimprove service to the client\n● Procedure 2: Encourage the adoption of standard confidentiality procedures utilized\nby leading firms in the industry","opts":["tiered pricing.","dynamic pricing.","value-based pricing."],"ans":"A","expl":"A. Đúng vì định giá theo cấp độ đang tính các mức giá khác nhau cho những người mua khác nhau, thường dựa trên\nsố lượng đã mua nhưng cũng dựa trên các tính năng của sản phẩm (ví dụ: phiên bản cơ bản so với phiên bản cao cấp của xe).\nB. Không chính xác vì tính năng định giá linh hoạt đang tính các mức giá khác nhau tại các thời điểm khác nhau và cho các loại\nkhách hàng khác nhau tùy thuộc vào các biến số như mức cung và cầu sẵn có.\nC. Không chính xác vì định giá dựa trên giá trị là đặt giá dựa trên giá trị mà\nkhách hàng nhận được, thường liên quan đến việc ước tính chi phí cơ hội.\nNhà phát hành doanh nghiệp: mô tả nhiều loại mô hình kinh doanh khác nhau","qhtml":null},{"n":10,"q":"Which of the following is a pull on a company's liquidity?","opts":["Obsolete inventory","Reduced credit limits","Uncollected receivables"],"ans":"B","expl":"A. Không chính xác vì lực cản lớn đối với các khoản thu liên quan đến áp lực từ việc quản lý tín dụng và\nsự suy giảm của các tài sản khác và bao gồm cả hàng tồn kho lỗi thời. Nếu khoảng không quảng cáo không được sử dụng trong khoảng thời gian\ndài, đó có thể là dấu hiệu cho thấy khoảng không quảng cáo đó không còn sử dụng được nữa. Vì vậy, hàng tồn kho lỗi thời là lực cản (không phải là\nlực kéo) đối với tính thanh khoản của công ty.\nB. Đúng vì sự sụt giảm thanh khoản là khi các khoản giải ngân (dòng tiền ra) được công ty\n thanh toán quá nhanh hoặc khả năng cung cấp tín dụng thương mại bị hạn chế, yêu cầu các công ty phải tiêu tiền trước khi họ\nnhận được tiền từ việc bán hàng có thể trang trải khoản nợ. Ngoài ra, những hạn chế lớn đối với thanh toán bao gồm\nHạn mức tín dụng bị giảm. >Nếu một công ty có lịch sử thanh toán trễ. nhà cung cấp có thể cắt\nsố lượng tín dụng mà họ cho phép tồn đọng bất cứ lúc nào.\" Vì vậy, giới hạn tín dụng giảm là một lực cản\nđối với tính thanh khoản của công ty.\nC. Không chính xác vì lực cản lớn đối với các khoản thu liên quan đến áp lực từ việc quản lý tín dụng và\nsự suy giảm của các tài sản khác và bao gồm các khoản phải thu chưa thu được. Các khoản nợ này càng dài thì\nth nguy cơ chúng sẽ không được thu thập càng lớn. Chúng được biểu thị bằng số ngày\ncác khoản phải thu lớn và mức chi phí nợ khó đòi cao. Vì vậy, các khoản phải thu chưa thu được là lực cản (không phải\nmột lực cản) đối với tính thanh khoản của công ty.\nCác tổ chức phát hành doanh nghiệp: giải thích tính thanh khoản và so sánh mức độ thanh khoản của các tổ chức phát hành","qhtml":null},{"n":11,"q":"Which of the following pricing models is most likely used when a firm willingly sacrifices\nmargins to build market share?","opts":["Dynamic pricing","Freemium pricing","Penetration pricing"],"ans":"C","expl":"A. Không chính xác vì định giá thâm nhập được sử dụng thay vì định giá linh hoạt. Định giá động\ntính giá khác nhau vào những thời điểm khác nhau. Các ví dụ cụ thể bao gồm giá thấp điểm (ví dụ: đối với khách sạn\nphòng, quảng cáo, vé máy bay, điện hoặc vé xem phim buổi sáng), giá cả 'tăng đột biến' và\nđịnh giá 'tắc nghẽn' (ví dụ: đối với việc đi chung xe và đường khó khăn)\nB. Không chính xác vì giá thâm nhập được sử dụng thay vì giá freemium. Giá miễn phí\ncho phép khách hàng sử dụng miễn phí một mức độ sử dụng hoặc chức năng nhất định - ví dụ: với tin tức\nnội dung, ứng dụng phần mềm hoặc trò chơi. Mô hình này được sử dụng rộng rãi trong nội dung và dịch vụ số,\nchẳng hạn như tạp chí định kỳ, trò chơi điện tử, phần mềm/ứng dụng và lưu trữ đám mây, nơi nhà cung cấp đại diện\nhưởng lợi từ việc áp dụng rộng rãi (thường thông qua hiệu ứng mạng)\nC. Đúng vì định giá thâm nhập là một ví dụ về định giá chiết khấu và được sử dụng khi một công ty\nsẵn sàng hy sinh lợi nhuận để xây dựng quy mô và thị phần.\nTổ chức phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":12,"q":"Which of the following pricing models is most likely used when a firm willingly sacrifices\nmargins to build market\nshare?","opts":["Dynamic pricing","Freemium pricing","Penetration pricing"],"ans":"B","expl":"A. Không chính xác vì chuỗi giá trị của một công ty là các hệ thống và quy trình trong một công ty tạo ra giá trị\ncho khách hàng của mình. Lưu ý rằng chuỗi giá trị của một công ty khác với chuỗi cung ứng, trong đó đề cập đến\ntrình tự các quy trình liên quan đến việc tạo ra sản phẩm, cả bên trong và bên ngoài công ty.\nB. Đúng vì chuỗi cung ứng đề cập đến trình tự các quy trình liên quan đến việc tạo ra một\nsản phẩm, cả bên trong và bên ngoài một công ty. Chuỗi cung ứng bao gồm tất cả các bước liên quan đến\nsản xuất và phân phối sản phẩm thực tế cho khách hàng cuối, bất kể các bước đó\ncó được thực hiện bởi một công ty duy nhất hay không.\nC. Không chính xác vì không có định nghĩa chính xác nhưng về cơ bản, mô hình kinh doanh mô tả cách tổ chức một\ndoanh nghiệp để mang lại giá trị cho khách hàng. Mô hình kinh doanh làm rõ\ndoanh nghiệp làm gì, hoạt động như thế nào cũng như cách tạo ra doanh thu và lợi nhuận, cũng như sự khác biệt của nó về\nvới các đối thủ cạnh tranh về những khía cạnh này.\nMột mô hình kinh doanh nên có tuyên bố giá trị và chuỗi giá trị. Vì vậy, mô hình kinh doanh là một khái niệm\nrộng hơn, bao gồm chuỗi giá trị và các yếu tố tổ chức kinh doanh khác.\nNhà phát hành doanh nghiệp: mô tả những độc giả chính của mô hình kinh doanh","qhtml":null},{"n":13,"q":"A company manufacturing and selling a product using someone else's brand name in\nreturn for a royalty most likely operates:","opts":["under a franchise model","as a contract manufacturer.","under a licensing arrangement."],"ans":"C","expl":"A. Không chính xác vì theo mô hình nhượng quyền, các nhà phân phối hoặc nhà bán lẻ có mối quan hệ được xác định chặt chẽ và\nthường độc quyền với công ty mẹ.\nB. Không chính xác vì nhãn hiệu riêng hoặc nhà sản xuất theo hợp đồng sản xuất hàng hóa để\nngười khác tiếp thị.\nC. Đúng vì một công ty sẽ sản xuất một sản phẩm sử dụng thương hiệu của người khác để đổi lấy\ntiền bản quyền theo thỏa thuận cấp phép.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":14,"q":"When analyzing a company, analysts should:","opts":["ignore the company's business model.","develop their own understanding of the company's business model.","rely on management's description of the company's business model."],"ans":"B","expl":"A. Không chính xác vì chiến lược, mục tiêu của mô hình kinh doanh được mô tả rõ ràng giúp nhà phân tích\nhiểu được doanh nghiệp: cách thức hoạt động. khách hàng, đối tác chính, triển vọng, rủi ro và hồ sơ\ntài chính.\nB. Đúng vì mô hình kinh doanh được mô tả rõ ràng sẽ giúp nhà phân tích hiểu được doanh nghiệp:\nnó hoạt động như thế nào, chiến lược, khách hàng mục tiêu, đối tác chính, triển vọng, rủi ro và hồ sơ tài chính. Thay vì\nthay vì dựa vào mô tả của ban quản lý về mô hình kinh doanh, các nhà phân tích nên phát triển\nsự hiểu biết của riêng mình.\nC. Không chính xác vì thay vì dựa vào mô tả của ban quản lý về mô hình kinh doanh, các nhà phân tích\nnên phát triển sự hiểu biết của riêng mình.\nNhà phát hành doanh nghiệp: mô tả các đặc điểm chính của mô hình kinh doanh","qhtml":null},{"n":15,"q":"Which of the following is best categorized as a drag on liquidity?","opts":["Insufficient credit lines","Uncollected receivables","Early payments to vendors"],"ans":"B","expl":"A. Không chính xác vì lực cản thanh khoản xảy ra khi các khoản giải ngân được thanh toán quá nhanh hoặc khả năng cung cấp tín dụng thương mại\nbị hạn chế, yêu cầu các công ty phải chi tiêu trước khi nhận được tiền từ việc bán hàng mà\ncó thể trang trải trách nhiệm pháp lý. Những hạn chế chính trong thanh toán bao gồm: Giảm giới hạn tín dụng. Nếu một công ty có\nlịch sử thanh toán trễ. các nhà cung cấp có thể cắt giảm số lượng tín dụng mà họ cho phép để trở thành\nnổi bật bất cứ lúc nào, điều này có thể siết chặt tính thanh khoản của công ty.\nB. Đúng vì aA cản trở tính thanh khoản là khi các khoản thu bị chậm lại, tạo ra áp lực từ nguồn vốn khả dụng\ngiảm. Những lực cản chính đối với các khoản thu liên quan đến áp lực từ việc quản lý tín dụng và\nsự suy giảm của các tài sản khác và bao gồm; Các khoản phải thu chưa thu được. Khoản nợ này càng dài thì\nrủi ro C. Không chính xác vì thanh khoản bị kéo xuống khi các khoản giải ngân được thanh toán quá nhanh\nhoặc khả năng cung cấp tín dụng thương mại bị hạn chế, yêu cầu các công ty phải chi tiêu trước khi họ\nnhận được tiền từ việc bán hàng có thể trang trải khoản nợ mà họ sẽ không được thu.\nC. Không chính xác vì lực cản thanh khoản là khi các khoản giải ngân được thanh toán quá nhanh hoặc khả năng cung cấp tín dụng thương mại\nbị hạn chế, yêu cầu các công ty phải chi tiêu trước khi nhận được tiền từ việc bán hàng mà\ncó thể trang trải trách nhiệm pháp lý","qhtml":null},{"n":16,"q":"Which of the following combination of factors most likely increases a company's ability to\nsupport debt in its capital structure?","opts":["High revenue, low cash flow volatility, and a low level of fungible assets","High revenue, low operating leverage, and a high level of fungible assets","Low cash flow volatility, low operating leverage, and a low level of fungible assets"],"ans":"B","expl":"A. Không chính xác vì khả năng hỗ trợ nợ tăng lên được biểu thị bằng doanh thu cao, độ biến động của dòng tiền\nthấp và tài sản có thể thay thế lớn hơn (không thấp hơn).\nB. Đúng vì khả năng hỗ trợ nợ tăng lên được biểu thị bằng doanh thu cao, đòn bẩy\nhoạt động thấp,\nC. Không chính xác vì khả năng hỗ trợ nợ tăng lên được biểu thị bằng độ biến động của dòng tiền thấp,\nđòn bẩy hoạt động thấp và\ncác tổ chức phát hành doanh nghiệp có thể thay thế lớn hơn (không thấp hơn): giải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí trung bình có trọng số của\nvốn","qhtml":null},{"n":17,"q":"According to the Modigliani-Miller propositions, if a company's debt-to-equity ratio\nincreases, which of the following costs is most likely to exhibit the largest increase?","opts":["WACC","Cost of debt","Cost of equity"],"ans":"C","expl":"A. Không chính xác vì theo đề xuất của Modigliani-Miller, việc tăng tỷ lệ nợ trên\nvốn chủ sở hữu không ảnh hưởng đến WACC (Dự luật 1) hoặc (tất cả các yếu tố khác đều bằng nhau) làm giảm\nWACC (Dự luật II). Theo Dự luật MM I, giá trị của công ty không thay đổi\nhoặc không đổi khi cơ cấu vốn thay đổi Do đó, chi phí vốn trung bình có trọng số phải\ncũng không đổi khi cơ cấu vốn thay đổi Theo Dự luật MM, chi phí vốn chủ sở hữu\ntăng khi công ty tăng số nợ trong cơ cấu vốn của mình, nhưng nó tăng với tốc độ\nchậm hơn so với trường hợp không có thuế. Khi nợ tăng, WACC giảm và giá trị của công ty\ntăng.\nB. Không chính xác vì giả định của Dự luật Modigliani-Miller I không có thuế là\ncác nhà đầu tư có thể vay và cho vay với lãi suất phi rủi ro. Điều này có nghĩa là sự thay đổi trong chi phí nợ sẽ\nkhông ảnh hưởng đến chi phí nợ trong trường hợp này. Hơn nữa, theo Dự luật Modigliani-Miller II với\nthuế, đối với một công ty có đòn bẩy, chi phí vốn cổ phần sẽ tăng nhiều hơn chi phí nợ nếu\ntỷ lệ nợ trên vốn chủ sở hữu tăng…𝑟 = 𝑟 +(𝑟 −𝑟 )(1−𝑡)𝐷/𝐸 …trong đó 𝑟 = Chi phí vốn sở hữu của a\n𝑒 0 𝑜 𝑑 𝑒\ncông ty có đòn bẩy tài chính, 𝑟 = Chi phí vốn của một công ty chỉ được tài trợ bằng vốn chủ sở hữu. 𝑟 = Chi phí nợ\n0 𝑑\nđối với một công ty có sử dụng vốn vay, t = Thuế suất công ty và D/E = Tỷ lệ nợ trên vốn chủ sở hữu. Vì 𝑟 > 𝑟 the\n𝑜 𝑑\nchi phí vốn cổ phần (𝑟 ) sẽ tăng nhiều hơn chi phí nợ (𝑟 ) nếu tỷ lệ nợ trên vốn chủ sở hữu (D/E)\n𝑒 𝑑\ntăng, ngay cả khi 𝑟 cũng tăng lên mà văn bản không trực tiếp dự tính đến.\n𝑑\nC. Đúng vì tỷ lệ nợ trên vốn chủ sở hữu tăng lên và công ty sử dụng nhiều nợ hơn. Rủi ro của nó\ntăng lên và chi phí vốn cổ phần phải tăng lên. Dự luật II của MM cho rằng sự gia tăng chi phí của\nvốn chủ sở hữu phải bù đắp chính xác cho việc sử dụng nhiều hơn nợ có chi phí thấp hơn.\nCác tổ chức phát hành doanh nghiệp: giải thích các đề xuất của Modigliani-Miller về cơ cấu vốn","qhtml":null},{"n":18,"q":"At which stage in its life cycle would a typical company most likely have more debt than\nequity in its capital\nstructure?","opts":["Start-up stage","Growth stage","Mature stage"],"ans":"C","expl":"A. Không chính xác vì ở giai đoạn đầu này, vốn nợ thường không có sẵn hoặc chỉ có sẵn với chi phí cao. Từ quan điểm của một tổ chức phát hành ở giai đoạn đầu, nợ có thể là một cách hấp dẫn để giảm bớt hoặc\ntránh sự pha loãng liên quan đến việc phát hành cổ phiếu. Tuy nhiên, với dòng tiền âm và\nkhông thể đoán trước, một công ty khởi nghiệp điển hình sẽ gặp khó khăn trong việc thanh toán nợ thường xuyên hoặc 'trả nợ\n. Ngay cả khi có sẵn nợ, chi phí, tính không linh hoạt và rủi ro liên quan đến việc vay mượn thường\nkhông hấp dẫn đối với một công ty khởi nghiệp. Do đó, nợ là một thành phần không đáng kể trong cơ cấu vốn của hầu hết\ncác công ty mới thành lập.\nB. Không chính xác vì khi một công ty thoát khỏi giai đoạn tăng trưởng và tiến dần qua giai đoạn tăng trưởng,\nviệc tài trợ bằng nợ có thể trở nên dễ tiếp cận hơn, nhưng công ty có thể muốn sử dụng nợ\nmột cách thận trọng và tiếp tục chủ yếu dựa vào tài trợ vốn cổ phần. Cả tính sẵn có và các điều khoản\ncủa việc tài trợ bằng nợ đều được cải thiện cho công ty trong giai đoạn này. Nhiều công ty tăng trưởng sử dụng nợ\nmột cách thận trọng để duy trì tính linh hoạt trong hoạt động và tài chính, đồng thời giảm thiểu rủi ro\nkhủng hoảng tài chính. Vốn chủ sở hữu vẫn là nguồn vốn chủ yếu.\nC. Đúng vì ở giai đoạn trưởng thành, công ty có thể hỗ trợ các khoản nợ chi phí thấp, thường\ntrên cơ sở không có bảo đảm. Từ quan điểm của công ty, việc tài trợ bằng nợ có thể sẽ hấp dẫn hơn\nso với việc tài trợ bằng vốn cổ phần với chi phí cao hơn. Ngoài ra, khi các công ty trưởng thành, rủi ro kinh doanh thường\ngiảm và dòng tiền của họ chuyển biến tích cực và ngày càng có thể dự đoán được, cho phép\nsử dụng đòn bẩy nhiều hơn với các điều khoản tài chính hấp dẫn hơn (ít tốn kém hơn). Nợ sau đó trở thành một phần\nlớn hơn trong cấu trúc vốn của họ.\nCác tổ chức phát hành doanh nghiệp: giải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí bình quân gia quyền của\nvốn","qhtml":null},{"n":19,"q":"With respect to a publicly listed company, a conflict of interest due to information\nasymmetry is most likely to occur between shareholders and:","opts":["creditors.","managers.","customers."],"ans":"B","expl":"A. Không chính xác vì thông tin bất cân xứng, áp dụng giữa người quản lý và cổ đông. Xung đột\nlợi ích giữa cổ đông và chủ nợ thường phát sinh do sự khác biệt trong khả năng chấp nhận rủi ro\nliên quan đến các khoản đầu tư của công ty tồn tại giữa cổ đông và chủ nợ\nB. Đúng vì so với các cổ đông, các nhà quản lý thường có quyền truy cập nhiều hơn vào\nthông tin về doanh nghiệp và hiểu biết nhiều hơn về hoạt động của doanh nghiệp. Thông tin\nbất đối xứng như vậy (nghĩa là khả năng tiếp cận thông tin không bình đẳng) giúp các nhà quản lý dễ dàng đưa ra các quyết định chiến lược\nmà không nhất thiết mang lại lợi ích tốt nhất cho cổ đông và làm suy yếu khả năng\ncác cổ đông thực hiện quyền kiểm soát.\nC. Không chính xác vì thông tin bất cân xứng áp dụng giữa người quản lý và cổ đôngNhững xung đột lợi ích điển hình\ngiữa cổ đông và khách hàng phát sinh chẳng hạn như khi một công ty\nquyết định tính giá cao cho sản phẩm của mình hoặc giảm các tính năng an toàn của sản phẩm để giảm chi phí.\nNhà phát hành doanh nghiệp: mô tả mối quan hệ bên ủy thác-đại lý và những xung đột có thể nảy sinh giữa\ncác nhóm bên liên quan","qhtml":null},{"n":20,"q":"Compared to going concern projects, expansion projects most likely involve:","opts":["greater uncertainty only.","greater amounts of capital only.","both greater uncertainty and greater amounts of capital."],"ans":"C","expl":"A. Không chính xác vì các dự án mở rộng thường liên quan đến sự không chắc chắn, thời gian và số lượng vốn\n lớn hơn so với các dự án đang hoạt động.\nB. Không chính xác vì các dự án mở rộng thường liên quan đến sự không chắc chắn, thời gian và số lượng vốn\n lớn hơn so với các dự án đang hoạt động.\nC. Đúng vì các dự án mở rộng thường liên quan đến sự không chắc chắn, thời gian và số lượng\nvốn lớn hơn so với các dự án đang hoạt động.\nCác tổ chức phát hành doanh nghiệp: mô tả các loại đầu tư vốn","qhtml":null},{"n":21,"q":"From the perspective of a corporate issuer, which of the following is a benefit of issuing\ndebt rather than equity as a\nsource of capital? Debt is most likely","opts":["cheaper.","less risky.","more permanent."],"ans":"A","expl":"A. Đúng vì nợ đại diện cho nguồn tài chính rẻ hơn cho các công ty và rủi ro thấp hơn cho các nhà đầu tư\n. Bởi vì lợi nhuận dành cho người cho vay bị giới hạn và vì chi phí nợ thấp hơn\nchi phí vốn cổ phần, các công ty có dòng tiền có thể dự đoán được có thể thích vay tiền hơn là bán\ncổ phần sở hữu để huy động vốn mà họ cần để tài trợ cho các khoản đầu tư của mình. Điều này là do\nphát hành thêm vốn chủ sở hữu làm giảm lợi nhuận ngược lại của các chủ sở hữu vốn hiện tại do giá trị còn lại phải\nđược chia sẻ cho nhiều chủ sở hữu hơn.\nB. Không chính xác vì từ góc độ của nhà phát hành, trái phiếu rủi ro hơn cổ phiếu vì cùng một lý do\ntrái phiếu an toàn hơn cổ phiếu đối với các nhà đầu tư. Trái phiếu làm tăng rủi ro cho tập đoàn bằng cách tăng\nđòn bẩy. Nếu công ty đang gặp khó khăn và không thể đáp ứng các nghĩa vụ đã hứa với các trái chủ,\ntrái chủ có tư cách pháp lý để buộc công ty phải thực hiện một số hành động nhất định, chẳng hạn như\nphá sản và thanh lý.\nC. Không chính xác vì các cổ đông đại diện cho một nguồn vốn lâu dài hơn và có quyền biểu quyết\nđể bầu ra ban giám đốc, cơ quan giám sát việc quản lý công ty. Nợ có\nđã nêu, có thời hạn hữu hạn và thường không có quyền biểu quyết, trong khi vốn chủ sở hữu không có thời hạn hữu hạn và bao gồm quyền biểu quyết\n.\nCác tổ chức phát hành doanh nghiệp: so sánh các yêu cầu tài chính và động cơ của người cho vay và cổ đông","qhtml":null},{"n":22,"q":"An improvement in corporate governance structure most likely results in:","opts":["lower cost of debt borrowing.","less control by management.","reduced operational efficiency."],"ans":"A","expl":"A. Đúng vì rủi ro vỡ nợ cũng được giảm thiểu nhờ các hệ thống kiểm toán hoạt động đúng cách,\nbáo cáo thu nhập minh bạch và tốt hơn cũng như kiểm soát sự bất cân xứng về thông tin giữa\ncông ty và các nhà cung cấp vốn của công ty. Rủi ro vỡ nợ thấp hơn có liên quan đến xếp hạng tín dụng tốt hơn cho\ncông ty và chi phí vay nợ thấp hơn, do các chủ nợ thường yêu cầu lợi nhuận thấp hơn\nkhi tiền của họ được đảm bảo tốt hơn và quyền lợi của họ được bảo vệ. Rằng, một cơ cấu quản trị doanh nghiệp\nhiệu quả sẽ giúp giảm chi phí vay nợ cho công ty.\nB. Không chính xác vì thông lệ quản trị mạnh tạo ra các thủ tục hiệu quả hơn để giám sát và\nkiểm soát ở tất cả các cấp độ công ty, bắt đầu từ cấp cổ đông và chuyển lên cấp quản lý\nvà hội đồng quản trị. Các cơ chế này cho phép giảm thiểu các yếu tố rủi ro cũng như\nlừa đảo hoặc xác định và kiểm soát chúng ở giai đoạn đầu, do đó ngăn chặn chúng\ngây cản trở hiệu quả hoạt động và danh tiếng của công ty.\nC. Không chính xác vì các cơ chế kiểm soát nội bộ đầy đủ là một trụ cột quan trọng không kém của\ncơ cấu tổ chức và quản trị vì chúng nhằm mục đích đảm bảo rằng các quyết định và hoạt động được\ngiám sát và kiểm soát đúng cách nhằm ngăn ngừa rủi ro phát sinh và tránh các hành vi sai trái hoặc\nlạm dụng. Các cơ chế này cải thiện [không làm giảm] hiệu quả hoạt động của\ncông ty.\nTổ chức phát hành doanh nghiệp: Mô tả những rủi ro tiềm ẩn của việc quản trị doanh nghiệp và quản lý các bên liên quan kém\ncũng như lợi ích của việc quản trị doanh nghiệp và quản lý các bên liên quan hiệu quả","qhtml":null},{"n":23,"q":"An analyst gathers the following information about a company's capital investment:\nInitial cash outlay: $90 million\nAnnual before-tax cash flows (year-end) for Year 1 through Year 6: $50 million\nMarginal tax rate: 15%\nRequired rate of return: 12%\nThe net present value of the investment is closest to:","opts":["$85 million.","$116 million.","$175 million."],"ans":"A","expl":"A. Đúng vì đối với một khoản đầu tư vốn với một khoản đầu tư được thực hiện ban đầu, giá trị hiện tại thuần\ngiá trị hiện tại (NPV) ròng của dòng tiền sau thuế trong tương lai trừ đi khoản chi đầu tư\nNPV = ∑𝑛 𝐶𝐹/(1+𝑟)𝑡 − chi tiêu.\n𝑡=1 𝑡\nChúng tôi tính toán giá trị hiện tại của dòng tiền sau thuế trong tương lai bằng cách sử dụng máy tính với\ncác thông số sau:\nThanh toán sau thuế/dòng tiền hàng năm: PMT = 50 x (1 - 0,15) = 42,5\nSố lần thanh toán: N = 6\nInt. rate = 12%,\nĐể tính NPV, từ giá trị hiện tại, chúng tôi trừ đi dòng tiền chi ra ban đầu là 90 triệu USD. Theo đó,\nNPV = 174,7 triệu USD - 90,0 triệu USD = 84,7 ≈ 85 triệu USD.\nB. Không chính xác vì nó sử dụng dòng tiền trước thuế là 50 triệu USD trong phép tính (thay vì\ndòng tiền sau thuế là 42,5 triệu USD). Tính giá trị hiện tại của dòng tiền với các tham số\nPMT = 50, N = 6 và Int. Tỷ lệ = 12% cho giá trị hiện tại là 205,57 triệu USD và trừ đi\ndòng tiền chi ra ban đầu là 90 triệu USD, NPV được tính toán không chính xác là NPV = 205,57 triệu USD - 90 triệu USD =\n115,6 triệu USD ≈ 116 triệu USD.\nC. Không chính xác vì nó bỏ qua số tiền chi tiêu ban đầu. Theo đó, NPV = $174,7 ≈ $175 triệu.\nNhà phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính giá trị hiện tại ròng (NPV),\ntỷ suất lợi nhuận nội bộ (IRR) và lợi tức trên vốn đầu tư (ROIC), đồng thời đối chiếu việc sử dụng chúng trong phân bổ vốn","qhtml":null},{"n":24,"q":"Which of the following is most likely a feature of sole proprietorships?","opts":["Existence of a legal identity","Operational simplicity and flexibility","Taxation of business profits as corporate income"],"ans":"B","expl":"A. Không chính xác vì các đặc điểm chính của doanh nghiệp tư nhân bao gồm những điều sau: Không có danh tính pháp lý:\nđược coi là phần mở rộng của chủ sở hữu.\nB. Đúng vì các đặc điểm chính của doanh nghiệp tư nhân bao gồm: Tính đơn giản trong hoạt động\nvà tính linh hoạt.\nC. Không chính xác vì các đặc điểm chính của doanh nghiệp tư nhân bao gồm: Lợi nhuận từ kinh doanh\nbị đánh thuế là thu nhập cá nhân.\nTổ chức phát hành doanh nghiệp: so sánh các hình thức tổ chức của doanh nghiệp","qhtml":null},{"n":25,"q":"The source of capital that most likely benefits from a tax shield is:","opts":["debt.","equity.","preferred equity."],"ans":"A","expl":"A. Đúng vì nếu tiền lãi có thể được khấu trừ toàn bộ, khả năng khấu trừ thuế của nợ sẽ làm giảm\nchi phí biên hiệu quả của nợ để phản ánh thu nhập được bảo vệ khỏi thuế và chi phí biên của\nnợ là 𝑟 (1-t). Chi phí vốn nợ là chi phí vốn duy nhất có thể được hưởng lợi từ lá chắn thuế.\n𝑑\nB. Không chính xác vì chỉ có nợ được hưởng lợi từ lá chắn thuế. Chi phí tính toán vốn chủ sở hữu được sử dụng trong\nWACC chỉ đơn giản là trọng số của vốn chủ sở hữu nhân với chi phí vốn cổ phần mà không có sự điều chỉnh nào về thuế.\nLấy nguồn vốn là cổ phiếu phổ thông, cổ phiếu ưu đãi và nợ và tính đến\nthực tế... rằng ở một số khu vực pháp lý, chi phí lãi vay có thể được khấu trừ thuế, biểu thức cho WACC là\nWACC = 𝑤 𝑟 (1 - t) + 𝑤 𝑟 + 𝑤 𝑟 …𝑤 = tỷ lệ vốn chủ sở hữu mà công ty sử dụng khi\ngây quỹ và 𝑟 = chi phí biên của vốn chủ sở hữu.\n𝑒\nC. Không chính xác vì không giống như lãi suất nợ, cổ tức trên cổ phiếu ưu đãi không được khấu trừ thuế bởi\ncông ty: do đó, không có sự điều chỉnh đối với chi phí thuế. Do đó, việc huy động vốn bằng cách\nphát hành vốn cổ phần ưu đãi không tạo ra lá chắn thuế cho công ty.\nCác tổ chức phát hành doanh nghiệp: tính toán và diễn giải chi phí vốn bình quân gia quyền của một công ty","qhtml":null},{"n":26,"q":"Which of the following mature companies is most likely to use the greatest amount of\nleverage in its capital structure?","opts":["Mining company","Software company","Shipping company"],"ans":"C","expl":"A. Không chính xác vì một công ty khai thác mỏ sẽ có nhiều khả năng huy động vốn cổ phần hơn là huy động vốn bằng nợ.\nTrong các lĩnh vực mang tính chu kỳ, chẳng hạn như khai thác mỏ và khoáng sản, cũng như nhiều ngành công nghiệp, doanh thu và dòng tiền thay đổi rất nhiều\ntheo chu kỳ kinh tế, điều này làm hạn chế khả năng vay nợ. Kết quả là, các doanh nghiệp trong các ngành\ncó tính chu kỳ có thể có ít nợ hơn trong cơ cấu vốn so với các công ty trong các ngành ít mang tính chu kỳ hơn.\nB. Không chính xác vì là một công ty phần mềm. ít vốn, ít có khả năng cần tăng nợ hơn\nmột công ty vận tải có thể sẽ cần thực hiện các khoản đầu tư vốn đáng kể được tài trợ bằng nợ.\nMột số mô hình kinh doanh vốn dĩ là \"vốn ít\", tức là chúng yêu cầu ít\nđầu tư gia tăng vào tài sản cố định hoặc vốn lưu động để tăng trưởng doanh thu. Do đó, họ không cần\nvay hoặc huy động vốn để phát triển, mặc dù họ có thể dễ dàng hỗ trợ nợ\nCác doanh nghiệp phần mềm thường phù hợp với mô tả này\nC. Đúng vì trong các ngành bất động sản, vận chuyển, hàng không và một số doanh nghiệp\nsử dụng nhiều vốn khác, các tài sản cơ bản có thể được mua và bán khá dễ dàng, có xu hướng giữ nguyên giá trị\nbất kể ai sở hữu chúng và do đó có thể hỗ trợ khoản nợ đáng kể được đảm bảo bằng các tài sản đó\nNhà phát hành doanh nghiệp: giải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí bình quân gia quyền của\nvốn","qhtml":null},{"n":27,"q":"A company should exercise the abandonment option on an investment if the present\nvalue of the cash flows from continuing the investment is:","opts":["lower than the cash flow from abandoning the investment.","the same as the cash flow from abandoning the investment.","greater than the cash flow from abandoning the investment."],"ans":"A","expl":"A. Đúng vì nếu dòng tiền từ việc từ bỏ khoản đầu tư vượt quá giá trị hiện tại của\ndòng tiền từ việc tiếp tục đầu tư thì công ty nên thực hiện tùy chọn từ bỏ.\nNgược lại, nếu PV của dòng tiền từ việc tiếp tục đầu tư thấp hơn dòng tiền\ndòng tiền từ việc từ bỏ khoản đầu tư, công ty nên thực hiện tùy chọn từ bỏ.\nB. Không chính xác vì nếu dòng tiền từ việc từ bỏ một khoản đầu tư vượt quá giá trị hiện tại của\ndòng tiền từ việc tiếp tục đầu tư [chứ không phải khi nó bằng] thì công ty nên\nthực hiện tùy chọn từ bỏ.\nC. Không chính xác vì nếu dòng tiền từ việc từ bỏ một khoản đầu tư vượt quá giá trị hiện tại của\ndòng tiền từ việc tiếp tục đầu tư thì công ty nên thực hiện tùy chọn từ bỏ\n. PV của dòng tiền từ việc tiếp tục đầu tư lớn hơn dòng tiền\ntừ việc từ bỏ khoản đầu tư, công ty không nên thực hiện quyền chọn từ bỏ.\nNhà phát hành doanh nghiệp: mô tả các loại quyền chọn thực có liên quan đến đầu tư vốn","qhtml":null},{"n":28,"q":"Consider the following information about a company:\nMarket value of debt outstanding: £15,000\nMarket value of company: £40,000\nCost of debt: 4.0%\nUnlevered WACC: 9.0%\nTax rate: 25%\nBased on the Modigliani-Miller propositions, the company's cost of equity is closest to:","opts":["10.4%.","11.3%.","12.0%."],"ans":"B","expl":"A. Không chính xác vì đây là kết quả được tạo ra nếu giá trị công ty được sử dụng thay vì giá trị vốn chủ sở hữu\n. Chi phí vốn sở hữu ≠ 0,09 + (0,09 - 0,04) x (1 - 0,25) x (15.000 bảng Anh/40.000 bảng Anh) = 0,1041 ≈ 10,4%.\nB. Đúng vì Modigliani và Miller cũng chỉ ra rằng chi phí vốn sở hữu của cùng một công ty\ncó nợ là: 𝑟 = 𝑟 + (𝑟 -𝑟 )(1 - t)(D/E), trong đó:\n𝑒 0 0 𝑑\n𝑟 = chi phí vốn chủ sở hữu\n𝑒\n𝑟 = chi phí vốn của một công ty chỉ được tài trợ bằng vốn chủ sở hữu\n0\n𝑟 = chi phí nợ\n𝑑\nD = giá trị thị trường của nợ\nE = giá trị thị trường của vốn chủ sở hữu.\nChi phí vốn chủ sở hữu = 0,09 + (0,09 - 0,04) x (1 - 0,25) x (£15.000/(40.000 bảng - 15.000)) = 0,1125 ≈ 11,3%.\nC. Không chính xác vì kết quả này phản ánh chi phí vốn cổ phần khi không có thuế doanh nghiệp. Chi phí\nvốn chủ sở hữu ≠ 0,09 + (0,09 - 0,04) x (£15.000/(£40.000 - £15.000)) = 0,1200 ≈12,0%.\nNhà phát hành doanh nghiệp: giải thích các đề xuất của Modigliani-Miller về cơ cấu vốn","qhtml":null},{"n":29,"q":"All else being equal, a company most likely has a reduced debt capacity when its:","opts":["current ratio increases.","leverage ratio decreases.","Interest coverage ratio decreases."],"ans":"C","expl":"A. Không chính xác vì đây là tỷ số thanh toán hiện thời thấp hơn chứ không phải cao hơn cho thấy có vấn đề về thanh khoản đối với\nmột công ty, và do đó làm giảm khả năng vay nợ (tức là khả năng vay thêm nợ). Một điểm khởi đầu\nđể xác định khả năng nợ của một công ty là tỷ lệ hiện tại của nó, bằng tài sản hiện tại chia cho\nnợ ngắn hạn. Tỷ số thanh toán hiện thời cung cấp một dấu hiệu về khả năng của công ty trong việc đáp ứng nhu cầu ngắn hạn của nó.\nnghĩa vụ nợ có kỳ hạn. Hệ số này càng lớn thì khả năng trả nợ của công ty càng lớn\nB. Không chính xác vì tỷ lệ đòn bẩy cao hơn chứ không phải thấp hơn sẽ cho thấy khả năng vay nợ giảm (ví dụ:\nkhả năng công ty vay thêm nợ) Các công ty có tỷ lệ nợ trong vốn cao hơn\ncác cơ cấu phải đối mặt với xác suất vỡ nợ cao hơn và có ít khả năng trả nợ bổ sung hơn so với\ncác công ty không có đòn bẩy tài chính\nC. Đúng vì tỷ lệ thanh toán lãi vay cũng thường được sử dụng để đánh giá nợ của công ty\nnăng lực. Nói chung, các tỷ lệ này cung cấp ước tính số lần một công ty có thể trang trải\nchi phí lãi vay (hoặc chi phí lãi vay cộng với các khoản thanh toán tiền thuê) với thu nhập chính xác (thường được tính\nlà EBIT hoặc EBITDA) Nói cách khác, tỷ lệ khả năng thanh toán lãi suất cung cấp dấu hiệu cho thấy khả năng thanh toán của công ty\nđệm tài chính để đáp ứng các nghĩa vụ trả nợ. Tỷ lệ thanh toán lãi suất càng lớn thì\ntấm đệm tài chính càng lớn và khả năng thanh toán các nghĩa vụ nợ của công ty càng lớn\nTổ chức phát hành doanh nghiệp: giải thích các yếu tố ảnh hưởng đến cơ cấu vốn và chi phí bình quân gia quyền của\nvốn","qhtml":null},{"n":30,"q":"According to the Modigliani-Miller Proposition I without taxes, when a firm increases the\nproportion of debt in its capital structure, the firm value:","opts":["decreases.","remains unchanged.","increases."],"ans":"B","expl":"A. Không chính xác vì theo Dự luật MM I không có thuế, giá trị công ty không bị ảnh hưởng\nbởi cơ cấu vốn của công ty. Nó chỉ được xác định bởi dòng tiền dự kiến ​​trong tương lai của công ty.\nB. Đúng vì Modigliani và Miller đã chứng minh rằng việc thay đổi cấu trúc vốn không ảnh hưởng đến\ngiá trị công ty. Do đó, giá trị của một bộ phim được xác định không phải bởi chứng khoán mà nó phát hành mà bởi\ndòng tiền dự kiến ​​trong tương lai.\nC. Không chính xác vì theo Dự luật MM I không có thuế, giá trị công ty không bị ảnh hưởng\nbởi cơ cấu vốn của công ty. Nó chỉ được xác định bởi dòng tiền dự kiến ​​trong tương lai của công ty.\nCác tổ chức phát hành doanh nghiệp: giải thích các đề xuất của Modigliani-Miller về cơ cấu vốn","qhtml":null},{"n":31,"q":"With respect to liquidity management, which of the following activities most likely\nprovides access to a primary source of liquidity?","opts":["Liquidating obsolete assets","Creating an effective cash management system","Negotiating new debt contracts that delay principal repayment"],"ans":"B","expl":"A. Không chính xác vì sự khác biệt chính giữa nguồn thanh khoản sơ cấp và thứ cấp là\nviệc sử dụng nguồn chính không có khả năng ảnh hưởng đến hoạt động bình thường của công ty. Tuy nhiên,\nthanh lý tài sản, tùy thuộc vào mức độ tài sản ngắn hạn và/hoặc dài hạn có thể được thanh lý\nvà chuyển thành tiền mặt mà không bị mất giá trị đáng kể, có thể ảnh hưởng đến hoạt động\nbình thường của công ty do năng suất bị giảm. Do đó. thanh lý tài sản không thể là nguồn thanh khoản chính\n.\nB. Đúng vì nguồn thanh khoản chính là tính thanh khoản, nguồn là tài nguyên\ncó thể truy cập dễ dàng nhất hiện có của công ty Một trong những ví dụ là quản lý dòng tiền, trong đó\nlà hiệu quả của công ty trong hệ thống và thông lệ quản lý tiền mặt cũng như mức độ\nphân cấp của các quy trình thu tiền hoặc thanh toán Ví dụ: hệ thống thu thập\ncàng phi tập trung hơn thì công ty càng có nhiều khả năng bị ràng buộc tiền mặt trong hệ thống và\nkhông có sẵn để sử dụng. Do đó, hệ thống quản lý tiền mặt hiệu quả là nguồn thanh khoản chính\nvì đây có thể là nguồn lực sẵn có dễ tiếp cận nhất đối với công ty\nC. Không chính xác vì việc đàm phán hợp đồng nợ, giảm bớt áp lực từ việc thanh toán lãi suất cao hoặc\ntrả nợ gốc có thể báo hiệu tình hình tài chính đang xấu đi của công ty và cung cấp tính thanh khoản ở mức giá\ncao. Điều này có thể ảnh hưởng tới hoạt động bình thường của công ty. Do đó, các hợp đồng nợ\nkhông thể là nguồn thanh khoản chính.\nCác tổ chức phát hành doanh nghiệp: giải thích tính thanh khoản và so sánh mức thanh khoản của các tổ chức phát hành","qhtml":null},{"n":32,"q":"Which of the following company stakeholders is most likely exposed to the greatest\ninformation asymmetry when compared to the company's management?","opts":["A bank lender","A public debtholder","A member of the board"],"ans":"B","expl":"A. Không chính xác vì các ngân hàng và người cho vay tư nhân thường nắm giữ khoản nợ của công ty cho đến ngày đáo hạn. Về nguyên tắc, họ\nthường có quyền truy cập trực tiếp vào ban quản lý công ty và thông tin không công khai về công ty\n. điều này làm giảm sự bất cân xứng thông tin tồn tại giữa công ty và\ncác nhóm này.\nB. Đúng vì chủ nợ công không được tiếp cận thông tin ngoài công lập. Công\ncác chủ nợ (hoặc chủ trái phiếu) dựa vào thông tin công khai và quyết định của cơ quan xếp hạng tín dụng để\nđưa ra quyết định đầu tư của họ. Không giống như các cổ đông, chủ nợ không có quyền biểu quyết và\nhọ thường có ảnh hưởng hạn chế đến hoạt động hàng ngày của công ty.\nC. Không chính xác vì một thành viên hội đồng quản trị có ảnh hưởng và quyền truy cập đáng kể vào thông tin không công khai\nHội đồng quản trị của công ty được các cổ đông bầu ra để bảo vệ\nlợi ích của cổ đông và đưa ra định hướng chiến lược, có tính đến khẩu vị\ncủa công ty, điều mà nó xác định cho công ty. Hội đồng quản trị cũng chịu trách nhiệm tuyển dụng Giám đốc điều hành và\ngiám sát hiệu quả hoạt động của công ty và management.\nCác tổ chức phát hành doanh nghiệp: mô tả các nhóm bên liên quan của công ty và so sánh lợi ích của họ","qhtml":null},{"n":33,"q":"According to Modigliani and Miller's Proposition II without taxes:","opts":["the cost of bankruptcy is high.","a company's cost of equity is a linear function of its debt-to-assets ratio.","substituting equity with lower-cost debt capital results in an unchanged overall WACC."],"ans":"C","expl":"A. Không chính xác vì Modigliani và Miller không loại trừ khả năng phá sản. Họ\nchỉ đơn giản cho rằng việc phá sản không mất phí.\nB. Không chính xác vì Dự luật MM II không có thuế cho chúng ta biết rằng chi phí vốn cổ phần của một công ty là hàm tuyến tính của tỷ lệ nợ trên vốn chủ sở hữu chứ không phải tỷ lệ nợ trên tài sản.\nC. Đúng vì Dự luật MM II không có thuế cho chúng ta biết rằng việc bổ sung bất kỳ lượng vốn nợ\nchi phí thấp nào vào cơ cấu vốn luôn được bù đắp một cách hoàn hảo bằng sự gia tăng chi phí vốn cổ phần,\ndẫn đến không có thay đổi nào đối với chi phí vốn bình quân gia quyền tổng thể của công ty.\nNhà phát hành doanh nghiệp: giải thích các đề xuất của Modigliani-Miller về cơ cấu vốn","qhtml":null},{"n":34,"q":"According to the Modigliani and Miller Proposition I with taxes, the value of a levered\ncompany is greater than the value of the unlevered company by an amount equal to the:","opts":["value of the debt.","after-tax interest paid.","tax rate multiplied by the value of the debt."],"ans":"C","expl":"A. Không chính xác vì số tiền tiết kiệm được bằng thuế suất nhân với giá trị của khoản nợ chứ không phải\ngiá trị của khoản nợ. Modigliani và Miller cho thấy rằng khi có thuế doanh nghiệp (chứ không phải\nthuế cá nhân), giá trị của công ty có vay nợ lớn hơn giá trị của công ty hoàn toàn bằng vốn chủ sở hữu\nmột số tiền bằng thuế suất nhân với giá trị của khoản nợ, còn được gọi là lá chắn thuế nợ\nB. Không chính xác vì đây là chi phí nợ sau thuế ((1-t) thay vì thuế tiết kiệm được (t) do\nnợ. Modigliani và Miller cho thấy rằng khi có thuế doanh nghiệp (nhưng không phải thuế cá nhân),\ngiá trị của công ty có vay nợ lớn hơn giá trị của công ty sử dụng toàn bộ vốn chủ sở hữu một lượng bằng\nthuế suất nhân với giá trị của khoản nợ, cũng được gọi là lá chắn thuế nợ.\nC. Đúng vì Modigliani và Miller cho thấy rằng khi có thuế doanh nghiệp (nhưng không phải\nthuế cá nhân), giá trị của công ty có vay nợ lớn hơn giá trị của công ty có vốn chủ sở hữu\nmột số tiền bằng thuế suất nhân với giá trị của khoản nợ, còn được gọi là lá chắn thuế nợ.\nNhà phát hành doanh nghiệp: giải thích Đề xuất của Modigliani-Miller về cơ cấu vốn","qhtml":null},{"n":35,"q":"In a limited partnership, business operations are the responsibility of.","opts":["the general partner only.","the limited partners only.","both the general partner and the limited partners."],"ans":"A","expl":"A. Đúng vì các đặc điểm chính của quan hệ đối tác hữu hạn bao gồm: GP điều hành doanh nghiệp, có\ntrách nhiệm pháp lý vô hạn, LP có trách nhiệm hữu hạn nhưng thiếu kiểm soát hoạt động kinh doanh.\nB. Không chính xác vì các đặc điểm chính của quan hệ đối tác hữu hạn bao gồm: GP điều hành doanh nghiệp, có\ntrách nhiệm vô hạn, LP có trách nhiệm hữu hạn nhưng thiếu quyền kiểm soát hoạt động kinh doanh.\nC. Không chính xác vì các đặc điểm chính của quan hệ đối tác hữu hạn bao gồm: GP điều hành doanh nghiệp, có\ntrách nhiệm pháp lý vô hạn, LP có trách nhiệm hữu hạn nhưng thiếu quyền kiểm soát hoạt động kinh doanh.\nTổ chức phát hành doanh nghiệp: so sánh các hình thức tổ chức của doanh nghiệp","qhtml":null},{"n":36,"q":"Which of the following is considered a capital allocation pitfall? Basing investment\ndecisions on:","opts":["opportunity costs.","after-tax cash flows.","short-run accounting numbers."],"ans":"C","expl":"A. Không chính xác vì không xác định được các lựa chọn thay thế kinh tế (thực tế và tài chính) là chi phí cơ hội\ncó lẽ là thất bại lớn nhất của các công ty trong phân tích của họ. Việc đầu tư dựa trên các quyết định\ndựa trên chi phí cơ hội là cách tiếp cận đúng đắn và do đó không phải là cạm bẫy phân bổ vốn\nB. Không chính xác vì một trong những giả định phân bổ vốn là các quyết định phải phản ánh tác động\ncủa thuế. Hơn nữa, khi phân tích một khoản đầu tư phức tạp, các cá nhân đánh giá khoản đầu tư\ncho công ty có thể bỏ sót dòng tiền liên quan, dòng tiền tính hai lần,\nvà xử lý sai thuế. Đưa ra quyết định đầu tư dựa trên dòng tiền sau thuế là cách tiếp cận đúng\nvà do đó không phải là cạm bẫy phân bổ vốn\nC. Đúng vì một cạm bẫy phổ biến là đưa ra quyết định đầu tư dựa trên EPS, thu nhập ròng hoặc ROE:\nCác công ty đôi khi có động cơ để tăng thu nhập trên mỗi cổ phiếu, thu nhập ròng hoặc lợi nhuận trên vốn chủ sở hữu.\nNhiều khoản đầu tư: ngay cả những khoản đầu tư có NPV cao, không làm tăng các con số kế toán này trong\nngắn hạn và thậm chí có thể làm giảm chúng. Việc chú ý quá nhiều đến các con số kế toán ngắn hạn\ncó thể dẫn đến việc công ty lựa chọn các khoản đầu tư không mang lại lợi ích kinh tế lâu dài cho\ncác cổ đông của mình.\nCác tổ chức phát hành doanh nghiệp: mô tả các nguyên tắc phân bổ vốn và những cạm bẫy phân bổ vốn chung","qhtml":null},{"n":37,"q":"Which of the following is defined as the sensitivity of a firm's operating profit to a change\nin its revenues?","opts":["Total leverage","Financial leverage","Operating leverage"],"ans":"C","expl":"A. Không chính xác vì cách tiếp cận là xem xét độ nhạy lợi nhuận bằng cách xem xét sự thay đổi trong\ndoanh thu để nắm bắt tổng đòn bẩy của doanh nghiệp.\nB. Không chính xác vì đòn bẩy tài chính phản ánh sự thay đổi độ nhạy của lợi nhuận ròng đối với sự thay đổi\ntrong lợi nhuận hoạt động.\nC. Đúng vì đòn bẩy hoạt động phản ánh mức độ nhạy cảm của lợi nhuận hoạt động, được đại diện bởi EBIT, đối với\nsự thay đổi về doanh thu.\nCác tổ chức phát hành doanh nghiệp: giải thích các yếu tố ảnh hưởng đến cấu trúc vốn và chi phí bình quân gia quyền của\nvốn","qhtml":null},{"n":38,"q":"Proxy voting is best described as permitting:","opts":["different voting rights for multiple share classes.","shareholders to cast all of their votes for one board nominee.","shareholders to vote their shares when absent from meetings."],"ans":"C","expl":"A. Không chính xác vì nó mô tả hai loại cổ phần chung chứ không phải bỏ phiếu ủy quyền. Bỏ phiếu ủy quyền là một\nquy trình cho phép các cổ đông không thể tham dự cuộc họp ủy quyền cho một\ncá nhân khác (ví dụ: một cổ đông hoặc giám đốc khác) bỏ phiếu thay mặt họ.\nB. Không chính xác vì nó mô tả biểu quyết tích lũy chứ không phải biểu quyết ủy quyền. Bỏ phiếu tích lũy (trái ngược với\nbỏ phiếu trực tiếp) cho phép mỗi cổ đông tích lũy và bỏ phiếu tất cả cổ phần của mình cho một\nứng cử viên duy nhất trong một cuộc bầu cử có nhiều hơn một giám đốc.\nC. Đúng vì bỏ phiếu theo ủy quyền là một quy trình ủy quyền cho một cá nhân khác (ví dụ:\nkhác cho phép các cổ đông không thể tham dự cuộc họp với cổ đông hoặc giám đốc) bỏ phiếu thay mặt họ.\nNhà phát hành doanh nghiệp: mô tả quản trị doanh nghiệp và cơ chế quản lý các mối quan hệ giữa các bên liên quan\n và giảm thiểu rủi ro liên quan","qhtml":null},{"n":39,"q":"Owners have limited liability in a:","opts":["corporation.","sole proprietorship.","general partnership."],"ans":"A","expl":"A. Đúng vì chủ sở hữu trong một công ty có trách nhiệm hữu hạn.\nB. Không chính xác vì trong doanh nghiệp tư nhân, chủ sở hữu có trách nhiệm pháp lý vô hạn và chịu mọi rủi ro\nliên quan đến doanh nghiệp, nghĩa là cô ấy có thể chịu trách nhiệm tài chính đối với mọi khoản nợ mà\ndoanh nghiệp nợ.\nC. Không chính xác vì một công ty hợp danh chung có hai hoặc nhiều chủ sở hữu được gọi là đối tác và tất cả lợi nhuận,\ntổn thất và rủi ro của doanh nghiệp đều được các đối tác cùng thừa nhận và chia sẻ. Nếu một đối tác\nkhông thể trả phần nợ của doanh nghiệp thì các đối tác còn lại phải chịu trách nhiệm hoàn toàn. Các đối tác\ntrong quan hệ đối tác chung có trách nhiệm pháp lý vô hạn.\nTổ chức phát hành doanh nghiệp: so sánh các hình thức tổ chức của các doanh nghiệp","qhtml":null},{"n":40,"q":"Which of the following statements about sources of liquidity is most accurate?","opts":["Filing for bankruptcy is considered a secondary source of liquidity.","Secondary sources of liquidity have a lower cost than primary sources of liquidity.","Using a primary source of liquidity impacts the financial and operating positions of a company."],"ans":"A","expl":"A. Đúng vì các nguồn thứ cấp bao gồm: nộp đơn xin bảo hộ phá sản và tái tổ chức.\nHơn nữa, tái tổ chức thông qua phá sản cũng có thể được coi là một công cụ thanh khoản vì một\ncông ty được bảo hộ phá sản tạo ra tiền mặt hoạt động sẽ có tính thanh khoản và nói chung\ncó thể tiếp tục hoạt động kinh doanh cho đến khi việc tái cơ cấu được đưa ra và phê duyệt.\nB. Không chính xác vì các nguồn chính thể hiện các khoản tiền có thể truy cập dễ dàng với chi phí\ntương đối thấp. Mặt khác, việc sử dụng các nguồn thứ cấp có thể báo hiệu tình hình tài chính\ncủa công ty đang xấu đi và cung cấp tính thanh khoản ở mức giá cao - chi phí từ bỏ tài sản của công ty để tạo ra\ntiền mặt khẩn cấp.\nC. Không chính xác vì sự khác biệt chính giữa nguồn thanh khoản sơ cấp và thứ cấp là\nviệc sử dụng nguồn chính không có khả năng ảnh hưởng đến hoạt động bình thường của công ty, trong khi\nsử dụng nguồn thứ cấp có thể dẫn đến thay đổi vị thế tài chính và hoạt động của công ty.\nCác tổ chức phát hành doanh nghiệp: giải thích tính thanh khoản và so sánh mức thanh khoản của các tổ chức phát hành","qhtml":null},{"n":41,"q":"Subsequent to making a capital investment, a company reacts to poor financial results\nfrom the project by abandoning it. This action alone best exemplifies the exercise of a:","opts":["sizing option.","timing option.","flexibility option."],"ans":"A","expl":"A. Đúng vì các tùy chọn định cỡ bao gồm việc từ bỏ hoặc mở rộng công suất. Nếu sau\nđầu tư, công ty có thể từ bỏ khoản đầu tư nếu kết quả tài chính đáng thất vọng, thì công ty có\nmột lựa chọn từ bỏ. Vào một ngày nào đó trong tương lai, nếu dòng tiền từ việc từ bỏ một khoản đầu tư\nvượt quá giá trị hiện tại của dòng tiền từ việc tiếp tục đầu tư thì công ty nên\nthực hiện tùy chọn từ bỏ Ngược lại, nếu công ty có thể thực hiện các khoản đầu tư bổ sung\nkhi kết quả tài chính trong tương lai cao, công ty có quyền chọn tăng trưởng hoặc quyền chọn mở rộng.\nB. Không chính xác vì các tùy chọn thời gian liên quan đến trình tự của các dự án. Thay vì đầu tư ngay bây giờ. công ty\ncó thể trì hoãn đầu tư Trì hoãn đầu tư và đưa ra quyết định dựa trên những thông tin\nhy vọng được cải thiện mà bạn có thể có trong một năm chẳng hạn có thể giúp cải thiện NPV của các dự án đã chọn.\nCác tùy chọn trình tự dự án cho phép công ty trì hoãn quyết định đầu tư vào một khoản đầu tư trong tương lai\ncho đến khi biết được kết quả của một phần hoặc toàn bộ khoản đầu tư hiện tại Các khoản đầu tư được sắp xếp theo trình tự\nthời gian, do đó việc đầu tư vào một dự án sẽ tạo ra tùy chọn thực hiện các khoản đầu tư trong tương lai\nC. Không chính xác vì các tùy chọn linh hoạt bao gồm những thay đổi về hoạt động có thể xảy ra với năng lực hiện tại,\nchẳng hạn như trả lương làm thêm giờ hoặc thêm ca để đáp ứng nhu cầu vượt mức. Khi khoản đầu tư được thực hiện,\ncó thể có tính linh hoạt trong hoạt động bên cạnh việc từ bỏ hoặc mở rộng. Nếu nhu cầu vượt quá\ncông suất, bằng cách tăng giá, công ty có thể hưởng lợi từ nhu cầu dư thừa, điều mà\nkhông thể làm được bằng cách tăng sản xuất. Ngoài ra còn có các tùy chọn linh hoạt trong sản xuất, cung cấp\nsự linh hoạt trong vận hành để thay đổi sản xuất khi nhu cầu thay đổi so với dự báo. Mặc dù\nđắt nhưng công ty có thể thu lợi từ việc làm thêm giờ hoặc làm thêm ca\nCác tổ chức phát hành doanh nghiệp: mô tả các loại quyền chọn thực tế liên quan đến đầu tư vốn","qhtml":null},{"n":42,"q":"A measure of how effectively capital is converted into after-tax operating profits is the:","opts":["hurdle rate.","cost of capital.","return on invested capital."],"ans":"C","expl":"A. Không chính xác vì tỷ lệ ngưỡng là tỷ lệ mà IRR của dự án phải vượt quá để dự án được\nđược công ty chấp nhận.\nB. Không chính xác vì chi phí vốn (COC) là lợi nhuận bắt buộc được sử dụng trong tính toán NPV và\nchi phí vốn liên quan của công ty.\nC. Đúng vì ROIC phản ánh mức độ hiệu quả mà ban quản lý công ty có thể chuyển đổi vốn\nthành lợi nhuận hoạt động sau thuế.\nNhà phát hành doanh nghiệp: mô tả quy trình phân bổ vốn, tính toán giá trị hiện tại ròng (NPV),\ntỷ suất lợi nhuận nội bộ (IRR) và lợi tức trên vốn đầu tư (ROIC) cũng như đối chiếu việc sử dụng chúng trong phân bổ vốn.","qhtml":null},{"n":43,"q":"Which of the following statements about corporations is most accurate?","opts":["Upside return potential is unlimited for both equity holders and debtholders","Equity is riskier than debt from the perspective of both investors and issuers","Losses for both equity holders and debtholders are limited to their initial investment"],"ans":"C","expl":"A. Không chính xác vì tiềm năng lợi nhuận tăng lên bị giới hạn đối với chủ nợ trong khi đó là không giới hạn đối với\nchủ sở hữu cổ phần. Nếu công ty thành công, về mặt lý thuyết sẽ không có giới hạn nào về số vốn chủ sở hữu\ncó thể kiếm được từ khoản đầu tư của họ. Tuy nhiên, cho dù công ty có sinh lời đến đâu,\ntuy nhiên, các trái chủ sẽ không bao giờ nhận được nhiều hơn tiền lãi và tiền gốc của họ.\nB. Không chính xác vì từ góc độ của tổ chức phát hành, nợ có rủi ro cao hơn vốn chủ sở hữu trong khi điều ngược lại là đúng đối với các nhà đầu tư. Từ quan điểm của nhà đầu tư, cổ phiếu rủi ro hơn trái phiếu vì các cổ đông\nlà những người có quyền sở hữu còn lại trong công ty. Từ quan điểm của nhà phát hành, trái phiếu rủi ro hơn cổ phiếu vì\ncùng một lý do khiến trái phiếu an toàn hơn cổ phiếu đối với các nhà đầu tư. Trái phiếu làm tăng rủi ro cho tập đoàn bằng cách\ntăng đòn bẩy. Nếu công ty đang gặp khó khăn và không thể đáp ứng các nghĩa vụ đã hứa với\ncác trái chủ, thì các trái chủ có tư cách pháp lý để buộc công ty phải thực hiện một số hành động nhất định,\nchẳng hạn như phá sản và thanh lý.\nC. Đúng vì tổn thất của cổ đông chỉ giới hạn ở khoản đầu tư ban đầu của họ. Đối với cả chủ sở hữu cổ phần\nvà chủ nợ, khoản đầu tư ban đầu của họ thể hiện khoản lỗ tối đa có thể xảy ra\nTổ chức phát hành doanh nghiệp: so sánh các yêu cầu tài chính và động cơ của người cho vay và cổ đông","qhtml":null},{"n":44,"q":"With respect to ESG implementation, which of the following is most likely a social factor?","opts":["Board composition","Pollution prevention","Management of human capital"],"ans":"C","expl":"A. Không chính xác vì yếu tố quản trị từ lâu đã được thừa nhận trong phân tích đầu tư. Nhiều\nchỉ số hiệu suất có thể giúp đánh giá rủi ro phát sinh từ các vấn đề quản trị như cơ cấu quyền sở hữu\n, tính độc lập và thành phần của hội đồng quản trị. Do đó, thành phần hội đồng quản trị là vấn đề quản trị\nvà không phải là yếu tố xã hội được xem xét khi thực hiện ESG.\nB. Không chính xác vì các yếu tố môi trường thường được coi là quan trọng trong phân tích đầu tư\nbao gồm quản lý tài nguyên thiên nhiên và/hoặc ngăn ngừa ô nhiễm. Do đó, việc ngăn ngừa ô nhiễm\nlà sự cân nhắc về môi trường chứ không phải là yếu tố xã hội được xem xét khi triển khai ESG\n.\nC. Đúng vì các yếu tố xã hội được xem xét khi triển khai ESG thường liên quan đến\nquản lý nguồn nhân lực của một doanh nghiệp, bao gồm các mối quan tâm về nhân quyền và phúc lợi tại\nnơi làm việc, phát triển sản phẩm và trong một số trường hợp là tác động đến cộng đồng.\nCác tổ chức phát hành doanh nghiệp: mô tả các yếu tố môi trường, xã hội và quản trị của các tổ chức phát hành doanh nghiệp\nđược các nhà đầu tư xem xét","qhtml":null},{"n":45,"q":"Double taxation of profits is most likely a concern for owners in:","opts":["corporations.","limited partnerships.","general partnerships."],"ans":"A","expl":"A. Đúng vì bất lợi về thuế đối với chủ sở hữu ở các quốc gia đánh thuế hai lần là đặc điểm chính của\ncác tập đoàn. Ở hầu hết các quốc gia, các tập đoàn bị đánh thuế trực tiếp vào lợi nhuận của họ. Ở nhiều quốc gia,\ncổ đông phải trả thuế bổ sung đối với việc phân phối (cổ tức) được chuyển cho họ.\nCác nhà kinh tế gọi đây là việc đánh thuế hai lần đối với lợi nhuận doanh nghiệp.\nB. Không chính xác vì lợi nhuận của công ty hợp danh hữu hạn chỉ bị đánh thuế ở cấp độ cá nhân. Đặc điểm chính\ncủa quan hệ đối tác hạn chế là tất cả các đối tác đều chia sẻ lợi nhuận, với lợi nhuận bị đánh thuế là thu nhập\ncá nhân.\nC. Không chính xác vì lợi nhuận của công ty hợp danh chung chỉ bị đánh thuế ở cấp độ cá nhân. Đặc điểm chính\ncủa quan hệ đối tác chung là tất cả các đối tác chia sẻ mọi lợi nhuận, với lợi nhuận bị đánh thuế là thu nhập\ncá nhân.\nNhà phát hành doanh nghiệp: so sánh các hình thức tổ chức của doanh nghiệp","qhtml":null},{"n":46,"q":"Which of the following is an example of a secondary source of liquidity for a company?","opts":["Short-term funds","Liquidating assets","Effective cash management"],"ans":"B","expl":"A. Không chính xác vì các nguồn thanh khoản chính đại diện cho các nguồn lực\ncó thể truy cập dễ dàng nhất hiện có của công ty. Đây có thể là chứng khoán được giữ bằng tiền mặt hoặc gần bằng tiền mặt và bao gồm những loại sau:\nQuỹ ngắn hạn, có thể bao gồm các hạng mục như tín dụng thương mại, hạn mức tín dụng ngân hàng và\ndanh mục đầu tư ngắn hạn của công ty.\nB. Đúng vì sự khác
