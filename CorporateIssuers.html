<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

se an issuer's income statement distinguishes between its financial income or net\nincome once fixed obligations have been met and its 'economic' profit, or return to a firm's owners\nin excess of what they could have earned elsewhere on different investments, known as their\nrequired rate of return on equity.\nB. Incorrect because an issuer's income statement distinguishes between its financial income or net\nincome once fixed obligations have been met and its 'economic profit, or return to a firm's owners in\nexcess of what they could have earned elsewhere on different investments, known as their required\nrate of return on equity.\nC. Correct because an issuer's income statement distinguishes between its financial income or net\nincome once fixed obligations have been met and its 'economic profit, or return to a firm's owners in\nexcess of what they could have earned elsewhere on different investments, known as their required\nrate of return on equity.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 4, "q": "The purchase of which of the following shares most likely requires investors to be\naccredited?", "opts": ["Public company shares only", "Private company shares only", "Both public company shares and private company shares"], "ans": "B", "expl": "A. Incorrect because private company investors may be limited to qualified or so-called accredited\ninvestors or sophisticated investors, or those deemed to be able and willing by regulatory authorities\nto assume the greater risk of a non-public offering.\nB. Correct because private company investors may be limited to qualified or so-called accredited\ninvestors or sophisticated investors, or those deemed to be able and willing by regulatory authorities\nto assume the greater risk of a non-public offering.\nC. Incorrect because private company investors may be limited to qualified or so-called accredited\ninvestors or sophisticated investors, or those deemed to be able and willing by regulatory authorities\nto assume the greater risk of a non-public offering.", "qhtml": null}, {"n": 5, "q": "Which best describes business growth that attracts more customers and merchants,\ncontributing to further growth in\nthe business?", "opts": ["Crowdsourcing", "A one-sided network", "A multi-sided network"], "ans": "C", "expl": "A. Incorrect because crowdsourcing is where users contribute directly to a product or service. These\nbusinesses facilitate \"user communities that enable voluntary collaboration between users of a\nproduct with a small amount of moderation and oversight by the company.\nB. Incorrect because a one-sided network is one where it is only one type of user that is valuable to\nother users.\nC. Correct because as multi-sided [two-sided] networks grow-more users join the service, which\nattracts more merchants, which in turn attracts more users these businesses can grow exponentially.\nCorporate Issuers: describe various types of business models", "qhtml": null}, {"n": 6, "q": "Private companies most likely have:", "opts": ["less share price transparency compared to public companies.", "similar share price transparency as public companies.", "greater share price transparency compared to public companies."], "ans": "A", "expl": "A. Correct because in contrast [to public companies] the shares of a private company are not listed\n(do not trade valuation or share price transparency exists. on an exchange), so\nB. Incorrect because private companies typically have less no visible company typically have less\nshare price transparency than public companies share price transparency than public companies\nC. Incorrect because private companies\nCorporate Issuers: compare publicly and privately owned Corporate Issuers", "qhtml": null}, {"n": 7, "q": "The business model of a knowledge aggregation company that allows its users to\ncontribute directly to online content is best referred to as a:", "opts": ["platform business model.", "marketplace business model.", "crowdsourcing business model."], "ans": "C", "expl": "A. Incorrect because a platform business is based on a network and can be distinguished from a\ntraditional or \"linear\" business that adds value to something that is sold to customers in a linear\nsupply chain. Platform business models are not developed specifically to allow users to contribute\ndirectly to product, service, or online content.\nB. Incorrect because marketplace businesses create networks of buyers and sellers without taking\nownership of the goods during the process. Examples include Alibaba, eBay, Mercado Libre, and\nEtsy. Marketplace business models are not developed specifically to allow users to contribute\ndirectly to product, service, or online content.\nC. Correct because crowdsourcing business models enable users to contribute directly to a product,\nservice, or online content. Examples include: contests and competitions; online gaming, product\ndevelopment, such as open source software, knowledge aggregation, such as Wikipedia and\nWaze/Google Maps; fan or hobbyist clubs, and networks of tradespersons or professionals.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 8, "q": "Which of the following would most likely be included on a company's \"financial\" balance\nsheet?", "opts": ["Short-term debt obligations", "Relationships with customers", "Relationships with key suppliers"], "ans": "A", "expl": "A. Correct because short-term debt is included in a company's financial balance sheet.\nB. Incorrect because contracts with customers and other intangible assets balance sheet but are\nincluded on the issuer's broader are excluded from a company's financial \"economic\" balance sheet\nC. Incorrect because agreements with suppliers and other intangible assets are excluded from a\ncompany's financial balance sheet but are included on the issuer's broader \"economic\" balance\nsheet.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 9, "q": "Which of the following is a recommended procedure for complying with the Standard\nrelating to preservation of confidentiality?\n● Procedure 1: Disclose to authorized fellow employees only information that will\nimprove service to the client\n● Procedure 2: Encourage the adoption of standard confidentiality procedures utilized\nby leading firms in the industry", "opts": ["tiered pricing.", "dynamic pricing.", "value-based pricing."], "ans": "A", "expl": "A. Correct because tiered pricing is charging different prices to different buyers, often based on\nvolume purchased but also based on product features (e.g., base versus premium trims of vehicles).\nB. Incorrect because dynamic pricing is charging different prices at different times and for different\ntypes of customers depending on such variables as available supply levels and demand.\nC. Incorrect because value based pricing is setting prices based on the value received by the\ncustomer, which often involves estimating opportunity cost.\nCorporate Issuers: describe various types of business models", "qhtml": null}, {"n": 10, "q": "Which of the following is a pull on a company's liquidity?", "opts": ["Obsolete inventory", "Reduced credit limits", "Uncollected receivables"], "ans": "B", "expl": "A. Incorrect because major drags on receipts involve pressures from credit management and\ndeterioration in other assets and include Obsolete inventory. If inventory stands unused for long\nperiods, it might be an indication that it is no longer usable. So, obsolete inventory is a drag (not a\npull) on a company's liquidity.\nB. Correct because a pull on liquidity is when disbursements (outflows) are paid too quickly by the\ncompany or trade credit availability is limited, requiring companies to expend funds before they\nreceive funds from sales that could cover the liability. Also, major pulls on payments include\nReduced credit limits. >If a company has a history of making late payments. suppliers might cut the\namount of credit they will allow to be outstanding at any time.\" So, reduced credit limits are a pull\non a company's liquidity.\nC. Incorrect because major drags on receipts involve pressures from credit management and\ndeterioration in other assets and include Uncollected receivables. The longer these are outstanding,\nthe greater the risk that they will not be collected at all. They are indicated by the large number of\ndays of receivables and high levels of bad debt expenses. So, uncollected receivables are a drag (not\na pull) on a company's liquidity.\nCorporate Issuers: explain liquidity and compare issuers' liquidity levels", "qhtml": null}, {"n": 11, "q": "Which of the following pricing models is most likely used when a firm willingly sacrifices\nmargins to build market share?", "opts": ["Dynamic pricing", "Freemium pricing", "Penetration pricing"], "ans": "C", "expl": "A. Incorrect because penetration pricing, rather than dynamic pricing, is used. Dynamic pricing\ncharges different prices at different times. Specific examples include off-peak pricing (e.g., for hotel\nrooms, advertising, airline tickets, electricity, or matinee movie tickets), 'surge' pricing, and\n'congestion' pricing (e.g., for ride sharing and toil roads)\nB. Incorrect because penetration pricing, rather than freemium pricing, is used. Freemium pricing\nallows customers a certain level of usage or functionality at no charge-for example, with news\ncontent, a software application, or a game. This model is widely used in digital content and services,\nsuch as periodicals, video games, software/apps, and cloud storage, where the provider stands to\nbenefit from wide adoption (often via network effects)\nC. Correct because penetration pricing is an example of discount pricing and is used when a firm\nwillingly sacrifices margins in order to build scale and market share.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 12, "q": "Which of the following pricing models is most likely used when a firm willingly sacrifices\nmargins to build market\nshare?", "opts": ["Dynamic pricing", "Freemium pricing", "Penetration pricing"], "ans": "B", "expl": "A. Incorrect because a firm's value chain is the systems and processes within a firm that create value\nfor its customers. Note that a firm's value chain is different from a supply chain, which refers to the\nsequence of processes involved in the creation of a product, both within and external to a firm.\nB. Correct because a supply chain refers to the sequence of processes involved in the creation of a\nproduct, both within and external to a firm. A supply chain includes all the steps involved in\nproducing and delivering a physical product to the end customer, regardless of whether those steps\nare performed by a single firm.\nC. Incorrect because there is no precise definition, but a business model essentially describes how a\nbusiness is organized to deliver value to its customers. A business model makes it clear what the\nbusiness does, how it operates, and how it generates revenue and profits, as well as how it differs in\nthese respects from its competitors.\nA business model should have a value proposition and a value chain. So, business model is a broader\nconcept, which includes value chain but also other business organization elements.\nCorporate Issuers: describe key readers of business models", "qhtml": null}, {"n": 13, "q": "A company manufacturing and selling a product using someone else's brand name in\nreturn for a royalty most likely operates:", "opts": ["under a franchise model", "as a contract manufacturer.", "under a licensing arrangement."], "ans": "C", "expl": "A. Incorrect because under a franchise model distributors or retailers have a tightly defined and\noften exclusive relationship with the parent company.\nB. Incorrect because private label or contract manufacturers produce goods to be marketed by\nothers.\nC. Correct because a company will produce a product using someone else's brand name in return for\na royalty under a licensing arrangement.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 14, "q": "When analyzing a company, analysts should:", "opts": ["ignore the company's business model.", "develop their own understanding of the company's business model.", "rely on management's description of the company's business model."], "ans": "B", "expl": "A. Incorrect because a its strategy, target clearly described business model helps the analyst\nunderstand a business: how it operates. customers, key partners, prospects, risks, and financial\nprofile.\nB. Correct because a clearly described business model helps the analyst understand a business: how\nit operates, its strategy, target customers, key partners, prospects, risks, and financial profile. Rather\nthan rely on management's description of its business model, analysts should develop their own\nunderstanding.\nC. Incorrect because rather than rely on management's description of its business model, analysts\nshould develop their own understanding.\nCorporate Issuers: describe key features of business models", "qhtml": null}, {"n": 15, "q": "Which of the following is best categorized as a drag on liquidity?", "opts": ["Insufficient credit lines", "Uncollected receivables", "Early payments to vendors"], "ans": "B", "expl": "A. Incorrect because a pull on liquidity is when disbursements are paid too quickly or trade credit\navailability is limited, requiring companies to expend funds before they receive funds from sales that\ncould cover the liability. Major pulls on payments include: Reduced credit limits. If a company has a\nhistory of making late payments. suppliers may cut the amount of credit they will allow to be\noutstanding at any time, which can squeeze the company's liquidity.\nB. Correct because aA drag on liquidity is when receipts lag, creating pressure from the decreased\navailable funds. Major drags on receipts involve pressures from credit management and\ndeterioration in other assets and include; Uncollected receivables. The longer these are outstanding,\nthe greater the risk that C. Incorrect because a pull on liquidity is when disbursements are paid too\nquickly or trade credit availability is limited, requiring companies to expend funds before they\nreceive funds from sales that could cover the liability they will not be collected at all.\nC. Incorrect because a pull on liquidity is when disbursements are paid too quickly or trade credit\navailability is limited, requiring companies to expend funds before they receive funds from sales that\ncould cover the liability", "qhtml": null}, {"n": 16, "q": "Which of the following combination of factors most likely increases a company's ability to\nsupport debt in its capital structure?", "opts": ["High revenue, low cash flow volatility, and a low level of fungible assets", "High revenue, low operating leverage, and a high level of fungible assets", "Low cash flow volatility, low operating leverage, and a low level of fungible assets"], "ans": "B", "expl": "A. Incorrect because an increased ability to support debt is indicated by high revenue, low cash flow\nvolatility, and greater (not lower) fungible assets.\nB. Correct because an increased ability to support debt is indicated by high revenue, low operating\nleverage,\nC. Incorrect because an increased ability to support debt is indicated by low cash flow volatility, low\noperating leverage, and greater (not lower) fungible\nCorporate Issuers: explain factors affecting capital structure and the weighted average cost of\ncapital", "qhtml": null}, {"n": 17, "q": "According to the Modigliani-Miller propositions, if a company's debt-to-equity ratio\nincreases, which of the following costs is most likely to exhibit the largest increase?", "opts": ["WACC", "Cost of debt", "Cost of equity"], "ans": "C", "expl": "A. Incorrect because according to the Modigliani-Miller propositions, an increase in the debt to\nequity ratio either has no effect on the WACC (Proposition 1) or (all else being equal) decreases the\nWACC (Proposition II). According to MM Proposition I, the value of the company remains unchanged\nor constant as the capital structure changes Therefore the weighted average cost of capital must\nalso remain constant as the capital structure changes According to MM Proposition the cost of\nequity rises as the company increases the amount of debt in its capital structure, but it rises at a\nslower rate than in the no-tax case. As debt increases the WACC decreases and the comppoy's value\nincreases.\nB. Incorrect because an assumption of the Modigliani-Miller Proposition I without taxes is that\ninvestors can borrow and lend at the risk-free rate. This means a change in the cost of debt will have\nno effect on the cost of debt in this case, Further, according to Modigliani-Miller Proposition II with\ntaxes, for a leveraged company the cost of equity will increase by more than the cost of debt if the\ndebt-to-equity ratio increases…𝑟 = 𝑟 +(𝑟 −𝑟 )(1−𝑡)𝐷/𝐸 …where 𝑟 = Cost of equity for a\n𝑒 0 𝑜 𝑑 𝑒\nleveraged company, 𝑟 = Cost of capital for a company financed only with equity. 𝑟 = Cost of debt\n0 𝑑\nfor a leveraged company, t = Company tax rate and D/E = Debt-to-equity ratio. Sincer 𝑟 > 𝑟 the\n𝑜 𝑑\ncost of equity (𝑟 ) will increase by more than the cost of debt (𝑟 ) if the debt-to-equity ratio (D/E)\n𝑒 𝑑\nincreases, even if 𝑟 also increases which is not directly contemplated by the text.\n𝑑\nC. Correct because as the debt-to-equity ratio increases and the company uses more debt. Its risk\ngoes up and the cost of equity must increase MM Proposition II holds that the increase in the cost of\nequity must exactly offset the greater use of lower cost debt.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 18, "q": "At which stage in its life cycle would a typical company most likely have more debt than\nequity in its capital\nstructure?", "opts": ["Start-up stage", "Growth stage", "Mature stage"], "ans": "C", "expl": "A. Incorrect because at this early stage, debt capital is typically not available or available only at a\nhigh cost. From the perspective of an early-stage issuer, debt may be an attractive way to reduce or\navoid the dilution associated with equity issuance. However, with cash flows that are negative and\nunpredictable, a typical start-up would have difficulty making regular debt payments, or 'servicing\nthe debt.' Even if debt is available, the cost, inflexibility, and risk associated with borrowing are often\nunattractive to a start-up. As a result, debt is a negligible component of capital structures of most\nstart-up companies.\nB. Incorrect because as a company exits the growth stage and progresses through the growth stage,\ndebt financing might become more accessible, but the company might want to use debt\nconservatively and continue relying primarily on equity financing. Both the availability and the terms\nof debt financing improve for the company during this stage. Many growth companies use debt\nconservatively in order to preserve operational and financial flexibility and minimize the risk of\nfinancial distress. Equity remains the predominant source of capital.\nC. Correct because at the mature stage, the company becomes able to support low-cost debt, often\non an unsecured basis. From the company's perspective, debt financing is likely to be more\nattractive than higher-cost equity financing. Also, as companies mature, business risk typically\ndeclines, and their cash flows turn positive and become increasingly predictable, allowing for greater\nuse of leverage on more attractive (less costly) financing terms. Debt then becomes a larger\ncomponent of their capital structures.\nCorporate Issuers: explain factors affecting capital structure and the weighted-average cost of\ncapital", "qhtml": null}, {"n": 19, "q": "With respect to a publicly listed company, a conflict of interest due to information\nasymmetry is most likely to occur between shareholders and:", "opts": ["creditors.", "managers.", "customers."], "ans": "B", "expl": "A. Incorrect because information asymmetr, applies between managers and shareholders. Conflicts\nof interest between shareholders and creditors arise typically due to a divergence in risk tolerance\nregarding the company's investments that exists between shareholders and creditors\nB. Correct because compared with shareholders, managers typically have greater access to\ninformation about the business and are more knowledgeable about its operations. Such information\nasymmetry (that is, unequal access to information) makes it easier for managers to make strategic\ndecisions that are not necessarily in the best interest of shareholders and weakens the ability of\nshareholders to exercise control.\nC. Incorrect because information asymmetry applies between managers and shareholders Typical\nconflicts of interest between shareholders and customers arise when, for example, a company\ndecides to charge a high price for its products or reduces product safety features to reduce costs.\nCorporate Issuers: describe the principal-agent relationship and conflicts that may arise between\nstakeholder groups", "qhtml": null}, {"n": 20, "q": "Compared to going concern projects, expansion projects most likely involve:", "opts": ["greater uncertainty only.", "greater amounts of capital only.", "both greater uncertainty and greater amounts of capital."], "ans": "C", "expl": "A. Incorrect because expansion projects typically involve greater uncertainty, time, and amounts of\ncapital than going concern projects.\nB. Incorrect because expansion projects typically involve greater uncertainty, time, and amounts of\ncapital than going concern projects.\nC. Correct because expansion projects typically involve greater uncertainty, time, and amounts of\ncapital than going concern projects.\nCorporate Issuers: describe types of capital investments", "qhtml": null}, {"n": 21, "q": "From the perspective of a corporate issuer, which of the following is a benefit of issuing\ndebt rather than equity as a\nsource of capital? Debt is most likely", "opts": ["cheaper.", "less risky.", "more permanent."], "ans": "A", "expl": "A. Correct because debt represents a cheaper financing source for companies and a lower risk for\ninvestors. Because the returns to lenders are capped and because the cost of debt is lower than the\ncost of equity, corporations with predictable cash flows may prefer to borrow money rather than sell\nan ownership stake to raise the capital they need to finance their investments. This is because\nissuing more equity dilutes upside return for existing equity owners given that residual value must\nbe shared across more owners.\nB. Incorrect because from the issuer's perspective, bonds are riskier than stocks for the same reason\nbonds are safer than stocks for investors. Bonds increase risk to the corporation by increasing\nleverage. If the company is struggling and cannot meet its promised obligations to bondholders,\nbondholders have the legal standing to force certain actions upon the corporation, such as\nbankruptcy and liquidation.\nC. Incorrect because equityholders represent a more permanent source of capital and have voting\nrights to elect the board of directors, which oversees the management of the company. Debt has a\nstated, finite term with generally no voting rights, while equity has no finite term and includes voting\nrights.\nCorporate Issuers: compare the financial claims and motivations of lenders and shareholders", "qhtml": null}, {"n": 22, "q": "An improvement in corporate governance structure most likely results in:", "opts": ["lower cost of debt borrowing.", "less control by management.", "reduced operational efficiency."], "ans": "A", "expl": "A. Correct because default risks are also mitigated by properly functioning audit systems,\ntransparent and better reporting of earnings, and controlling information asymmetries between the\ncompany and its capital providers. Lower default risks are associated with better credit ratings for\nthe company and lower costs of debt borrowing, given that creditors typically require a lower return\nwhen their funds are better secured and their rights protected. That, an effective corporate\ngovernance structure will result in lower cost of debt borrowing for the company.\nB. Incorrect because strong governance practices institute more efficient procedures for scrutiny and\ncontrol at all corporate levels, starting at the level of shareholders and moving up to management\nand the board of directors. These mechanisms allow for the mitigation of risk factors as well as\nfraudulent activities or for their identification and control at early stages, thus preventing them from\nhindering corporate performance and reputation.\nC. Incorrect because the adequate internal control mechanisms are an equally important pillar of the\norganizational and governance structures as they aim at ensuring that decisions and activities are\nproperly monitored and controlled to prevent risks from arising and to circumvent misconduct or\nabusive behaviors. These mechanisms improve [not reduce] the operational efficiency of the\ncompany.\nCorporate Issuers: Describe potential risks of poor corporate governance and stakeholder\nmanagement and benefits of effective corporate governance and stakeholder management", "qhtml": null}, {"n": 23, "q": "An analyst gathers the following information about a company's capital investment:\nInitial cash outlay: $90 million\nAnnual before-tax cash flows (year-end) for Year 1 through Year 6: $50 million\nMarginal tax rate: 15%\nRequired rate of return: 12%\nThe net present value of the investment is closest to:", "opts": ["$85 million.", "$116 million.", "$175 million."], "ans": "A", "expl": "A. Correct because for a capital investment with one investment outlay, made initially, the net\npresent value (NPV) present value of the future after-tax cash flows minus the investment outlay\nNPV = ∑𝑛 𝐶𝐹/(1+𝑟)𝑡 − outlay.\n𝑡=1 𝑡\nWe calculate the present value of the future after-tax cash flows using the calculator with the\nfollowing parameters:\nYearly after-tax payment/cash-flow: PMT = 50 x (1 - 0.15) = 42.5\nNumber of payments: N = 6\nInt. rate = 12%,\nTo calculate the NPV, from the present value we subtract the initial $90 million outflow. Accordingly,\nNPV = $174.7 million - $90.0 million = $84.7 ≈ $85 million.\nB. Incorrect because it uses the before-tax cash flow of $50 million in the calculation (instead of the\nafter-tax cash flow of $42.5 million). Calculating the present value of the cash flows with parameters\nPMT = 50, N = 6 and Int. Rate = 12% gives a present value of $205.57 million, and subtracting the\ninitial $90 million outflow, the NPV is incorrectly calculated as NPV = $205.57 million - $90 million =\n$115.6 million ≈ $116 million.\nC. Incorrect because it omits the initial cash outlay. Accordingly, the NPV = $174.7 ≈ $175 million.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation", "qhtml": null}, {"n": 24, "q": "Which of the following is most likely a feature of sole proprietorships?", "opts": ["Existence of a legal identity", "Operational simplicity and flexibility", "Taxation of business profits as corporate income"], "ans": "B", "expl": "A. Incorrect because key features of sole proprietorships include the following: No legal identity:\nconsidered extension of owner.\nB. Correct because key features of sole proprietorships include the following: Operational simplicity\nand flexibility.\nC. Incorrect because key features of sole proprietorships include the following: Profits from business\ntaxed as personal income.\nCorporate Issuers: compare the organizational forms of businesses", "qhtml": null}, {"n": 25, "q": "The source of capital that most likely benefits from a tax shield is:", "opts": ["debt.", "equity.", "preferred equity."], "ans": "A", "expl": "A. Correct because if interest can be deducted in full, the tax deductibility of debt reduces the\neffective marginal cost of debt to reflect the income shielded from taxation and the marginal cost of\ndebt is 𝑟 (1-t). The cost of debt capital is the only cost of capital that can benefit from a tax shield.\n𝑑\nB. Incorrect because only debt benefits from a tax shield. The cost of equity calculation used in the\nWACC is simply the weight of equity times the cost of equity with no adjustments made for taxation.\nTaking the sources of capital to be common stock, preferred stock, and debt and allowing for the\nfact... that in some jurisdictions interest expense may be tax deductible, the expression for WACC is\nWACC = 𝑤 𝑟 (1 - t) + 𝑤 𝑟 + 𝑤 𝑟 …𝑤 = the proportion of equity that the company uses when it\n𝑑 𝑑 𝑝 𝑝 𝑒 𝑒 𝑒\nraises funds and 𝑟 = the marginal cost of equity.\n𝑒\nC. Incorrect because unlike interest on debt, the dividend on preferred stock is not tax-deductible by\nthe company: therefore, there is no adjustment to the cost of taxes. Therefore, raising capital by\nissuing preferred equity does not give rise to a tax shield to the company.\nCorporate Issuers: calculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 26, "q": "Which of the following mature companies is most likely to use the greatest amount of\nleverage in its capital structure?", "opts": ["Mining company", "Software company", "Shipping company"], "ans": "C", "expl": "A. Incorrect because a mining company will be more likely to raise equity funding than debt funding.\nIn cyclical sectors, such as mining and minerals, and many industrials, revenues and cash flows vary\nwidely through the economic cycle, which limits debt capacity. As a result, businesses in cyclical\nsectors may have less debt in their capital structures than companies in other less cyclical industries.\nB. Incorrect because a software company is. being capital light, less likely to need to raise debt than\na shipping company which will likely need to make substantial debt-funded capital investments.\nSome business models are inherently \"capital light,\" that is, they require little incremental\ninvestment in fixed assets or working capital to enable revenue growth As a result, they have no\nneed to borrow or otherwise raise capital to grow, even though they could easily suppon debt\nSoftware businesses often fit this description\nC. Correct because in real estate utilities, shipping, airlines, and certain other highly capital-intensive\nbusinesses, the underlying assets can be bought and sold fairly easily, tend to retain their value\nregardless of who owns them and can therefore support substantial debt secured by those assets\nCorporate Issuers: explain factors affecting capital structure and the weighted average cost of\ncapital", "qhtml": null}, {"n": 27, "q": "A company should exercise the abandonment option on an investment if the present\nvalue of the cash flows from continuing the investment is:", "opts": ["lower than the cash flow from abandoning the investment.", "the same as the cash flow from abandoning the investment.", "greater than the cash flow from abandoning the investment."], "ans": "A", "expl": "A. Correct because if the cash flow from abandoning an investment exceeds the present value of the\ncash flows from continuing the investment, the company should exercise the abandonment option.\nConversely, if the the PV of the cash flows from continuing the investment is lower than the cash\nflow from abandoning the investment, the company should exercise the abandonment option.\nB. Incorrect because if the cash flow from abandoning an investment exceeds the present value of\nthe cash flows from continuing the investment [and not when it is equal to], the company should\nexercise the abandonment option.\nC. Incorrect because if the cash flow from abandoning an investment exceeds the present value of\nthe cash flows from continuing the investment, the company should exercise the abandonment\noption. The the PV of the cash flows from continuing the investment is greater than the cash flow\nfrom abandoning the investment, the company should not exercise the abandonment option.\nCorporate Issuers: describe types of real options relevant to capital investments", "qhtml": null}, {"n": 28, "q": "Consider the following information about a company:\nMarket value of debt outstanding: £15,000\nMarket value of company: £40,000\nCost of debt: 4.0%\nUnlevered WACC: 9.0%\nTax rate: 25%\nBased on the Modigliani-Miller propositions, the company's cost of equity is closest to:", "opts": ["10.4%.", "11.3%.", "12.0%."], "ans": "B", "expl": "A. Incorrect because this is the result generated if the company value is used rather than the equity\nvalue. Cost of equity ≠ 0.09 + (0.09 - 0.04) x (1 - 0.25) x (£15,000/£40,000) = 0.1041 ≈ 10.4%.\nB. Correct because Modigliani and Miller also show that the cost of equity for the same company\nwith debt is: 𝑟 = 𝑟 + (𝑟 -𝑟 )(1 - t)(D/E), where:\n𝑒 0 0 𝑑\n𝑟 = cost of equity\n𝑒\n𝑟 = cost of capital for a company financed only with equity\n0\n𝑟 = cost of debt\n𝑑\nD = market value of debt\nE = market value of equity.\nCost of equity = 0.09 + (0.09 - 0.04) x (1 - 0.25) x (£15,000/(£40,000 - 15,000)) = 0.1125 ≈ 11.3%.\nC. Incorrect because this result reflects the cost of equity in the absence of corporate taxes. Cost of\nequity ≠ 0.09 + (0.09 - 0.04) x (£15,000/(£40,000 - £15,000)) = 0.1200 ≈12.0%.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 29, "q": "All else being equal, a company most likely has a reduced debt capacity when its:", "opts": ["current ratio increases.", "leverage ratio decreases.", "Interest coverage ratio decreases."], "ans": "C", "expl": "A. Incorrect because it is a lower, not higher, current ratio that would indicate liquidity problems for\na company, and hence a reduced debt capacity (ie., ability to take additional debt). A starting point\nfor determining a company's debt capacity is its current ratio, equal to current assets divided by\ncurrent liabilities. The current ratio provides an Indication of the ability of the firm to meet its short-\nterm debt obligations. The bigher the ratio, the greater the ability of the company to repay its debt\nB. Incorrect because a higher, not lower, leverage ratio would indicate a reduced debt capacity (ie.,\nability for a company to take additional debt) Firms with higher proportions of debt in their capital\nstructures face a higher probability of default and have less ability to service additional debt than\nunderleveraged firms\nC. Correct because interest coverage ratios are also commonly used to assess companies' debt\ncapacities. Generally, these ratios provide an estimate of how many times a company can cover its\ninterest expense (or interest expense plus lease payments) with corragt earnings (usually measured\nas EBIT or EBITDA) In other words, interest coverage ratios provide an indication of a company's\nfinancial cushion in meeting its debt service obligations The larger the interest coverage ratio, the\nlarger the financial cushion and the greater the company's ability to service its debt obligations\nCorporate Issuers: explain factors affecuno capital structure and the weighted average cost of\ncapital", "qhtml": null}, {"n": 30, "q": "According to the Modigliani-Miller Proposition I without taxes, when a firm increases the\nproportion of debt in its capital structure, the firm value:", "opts": ["decreases.", "remains unchanged.", "increases."], "ans": "B", "expl": "A. Incorrect because, according to the MM Proposition I without taxes, the firm value is not affected\nby the company's capital structure. It is determined solely by the firm’s expected future cash flows.\nB. Correct because Modigliani and Miller proved that changing the capital structure does not affect\nfirm value. The value of a film is thus determined not by the securities it issues but, rather, by its\nexpected future cash flows.\nC. Incorrect because, according to the MM Proposition I without taxes, the firm value is not affected\nby the company's capital structure. It is determined solely by the firm's expected future cash flows.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 31, "q": "With respect to liquidity management, which of the following activities most likely\nprovides access to a primary source of liquidity?", "opts": ["Liquidating obsolete assets", "Creating an effective cash management system", "Negotiating new debt contracts that delay principal repayment"], "ans": "B", "expl": "A. Incorrect because the main difference between the primary and secondary sources of liquidity is\nthat using a primary source is not likely to affect the normal operations af the company. However,\nliquidating assets, which depends on the degree to which short-term and/or long-term assets can be\nliquidated and converted into cash without substantial loss in value may affect a company's normal\noperation as productivity is reduced Therefore. liquidating assets cannot be a primary source of\nliquidity.\nB. Correct because primary sources of liquidity are liquidity, sources that are the most readily\naccessible resources available to the company One of the examples is cash flow management, which\nis the company's effectiveness in its cash management system and practices and the degree of\ndecentralization of the collections or payments processes The more decentralized the system of\ncollections for example, the more likely the company will be to have cash tied up in the system and\nnot available for use. Therefore, an effective cash management system is a primary source of\nliquidity as it is likely to be the most readily accessible resources available to the company\nC. Incorrect because negotiating debt contracts, relieving pressures from high interest payments or\nprincipal repayments may signal a company's deteriorating financial health and provide liquidity at a\nhigh price. This may well affect the normal operations of the company. Therefore, negobainig debts\ncontracts cannot be a primary source of liquidity.\nCorporate Issuers: explain liquidity and compare issuers' liquidity levels", "qhtml": null}, {"n": 32, "q": "Which of the following company stakeholders is most likely exposed to the greatest\ninformation asymmetry when compared to the company's management?", "opts": ["A bank lender", "A public debtholder", "A member of the board"], "ans": "B", "expl": "A. Incorrect because banks and private lenders generally hold a company's debt to maturity. They\ntypically have direct access to company management and non-public information about the\ncompany in principle. this reduces information asymmetries that exist between the company and\nthese groups.\nB. Correct because public debtholders do not have access to non-public information. Public\ndebtholders (or bondholders) rely on public information and credit rating agency determinations to\nmake their investment decisions. Unlike shareholders, debtholders do not hold voting power and\nthey typically have limited influence over a company's day-to-day operations.\nC. Incorrect because a member of the board of directors has significant influence and access to non-\npublic information A company's board of directors is elected by shareholders to protect\nshareholders' interests and provide strategic direction, taking into consideration the company's risk\nappetite, which it defines for the company The board is also responsible for hiring the CEO and\nmonitoring the performance of the company and management.\nCorporate Issuers: describe a company's stakeholder groups and compare their interests", "qhtml": null}, {"n": 33, "q": "According to Modigliani and Miller's Proposition II without taxes:", "opts": ["the cost of bankruptcy is high.", "a company's cost of equity is a linear function of its debt-to-assets ratio.", "substituting equity with lower-cost debt capital results in an unchanged overall WACC."], "ans": "C", "expl": "A. Incorrect because Modigliani and Miller did not assume away the possibility of bankruptcy. They\nsimply assumed there was no cost to bankruptcy.\nB. Incorrect because MM Proposition II without taxes tells us that a company's cost of equity is a\nlinear function of its debt-to-equity ratio not debt-to-assets ratio.\nC. Correct because MM Proposition II without taxes tells us that adding any amount of lower-cost\ndebt capital to the capital structure is always perfectly offset by an increase in the cost of equity,\nresulting in no change to the company's overall weighted average cost of capital.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 34, "q": "According to the Modigliani and Miller Proposition I with taxes, the value of a levered\ncompany is greater than the value of the unlevered company by an amount equal to the:", "opts": ["value of the debt.", "after-tax interest paid.", "tax rate multiplied by the value of the debt."], "ans": "C", "expl": "A. Incorrect because the savings are equal to the tax rate multiplied by the value of the debt, not the\nvalue of the debt. Modigliani and Miller show that in the presence of corporate taxes (but not\npersonal taxes), the value of the levered company is greater than that of the all-equity company by\nan amount equal to the tax rate multiplied by the value of the debt, also termed the debt tax shield\nB. Incorrect because this is the after-tax cost of debt ((1-t) rather than taxes saved (t) because of the\ndebt. Modigliani and Miller show that in the presence of corporate taxes (but not personal taxes),\nthe value of the levered company is greater than that of the all-equity company by an amount equal\nto the tax rate multiplied by the value of the debt, also termed the debt tax shield.\nC. Correct because Modigliani and Miller show that in the presence of corporate taxes (but not\npersonal taxes), the value of the levered company is greater than that of the all-equity company by\nan amount equal to the tax rate multiplied by the value of the debt, also termed the debt tax shield.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 35, "q": "In a limited partnership, business operations are the responsibility of.", "opts": ["the general partner only.", "the limited partners only.", "both the general partner and the limited partners."], "ans": "A", "expl": "A. Correct because key features of limited partnerships include: GP operates the business, having\nunlimited liability, LPs have limited liability but lack control over business operations.\nB. Incorrect because key features of limited partnerships include: GP operates the business, having\nunlimited liability, LPs have limited liability but lack control over business operations.\nC. Incorrect because key features of limited partnerships include: GP operates the business, having\nunlimited liability, LPs have limited liability but lack control over business operations.\nCorporate Issuers: compare the organizational forms of businesses", "qhtml": null}, {"n": 36, "q": "Which of the following is considered a capital allocation pitfall? Basing investment\ndecisions on:", "opts": ["opportunity costs.", "after-tax cash flows.", "short-run accounting numbers."], "ans": "C", "expl": "A. Incorrect because not identifying the economic alternatives (real and financial) that are the\nopportunity costs is probably the biggest failure by companies in their analyses. Basing investments\ndecisions on opportunity costs is the correct approach and hence not a capital allocation pitfall\nB. Incorrect because one of the capital allocation assumptions is that decisions must reflect the\nimpact of taxes. Furthermore, in analyzing a complicated investment, individuals assessing the\ninvestment for the company may erroneously omit relevant cash flows, double-count cash flows,\nand mishandle taxes. Basing investments decisions on after-tax cash flows is the correct approach\nand hence not a capital allocation pitfall\nC. Correct because one common pitfall is basing investment decisions on EPS, net income or ROE:\nCompanies sometimes have incentives to boost earnings per share, net income, or return on equity.\nMany investments: even those with strong NPVs, do not increase these accounting numbers in the\nshort run and may even reduce them. Paying too much attention to short-run accounting numbers\ncan result in a company choosing investments that are not in the long-run economic interests of its\nshareholders.\nCorporate Issuers: describe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 37, "q": "Which of the following is defined as the sensitivity of a firm's operating profit to a change\nin its revenues?", "opts": ["Total leverage", "Financial leverage", "Operating leverage"], "ans": "C", "expl": "A. Incorrect because an approach is to consider profit sensitivity by looking at the change in\nrevenues to capture total leverage of the business.\nB. Incorrect because financial leverage reflects the variability of sensitivity of net profit to a change\nin operating profit.\nC. Correct because operating leverage captures the sensitivity of operating profit, proxied by EBIT, to\na change in revenues.\nCorporate Issuers: explain factors affecting capital structure and the weighted-average cost of\ncapital", "qhtml": null}, {"n": 38, "q": "Proxy voting is best described as permitting:", "opts": ["different voting rights for multiple share classes.", "shareholders to cast all of their votes for one board nominee.", "shareholders to vote their shares when absent from meetings."], "ans": "C", "expl": "A. Incorrect because it describes dual classes of common equity, not proxy voting. Proxy voting is a\nprocess that enables shareholders who are unable to attend a meeting to authorize another\nindividual (for example, another shareholder or director) to vote on their behalf.\nB. Incorrect because it describes cumulative voting, not proxy voting. Cumulative voting (as opposed\nto straight voting) enables each shareholder to accumulate and vote all his or her shares for a single\ncandidate in an election involving more than one director.\nC. Correct because proxy voting is a process that authorize another individual (for example, another\nenables shareholders who are unable to attend a meeting to shareholder or director) to vote on\ntheir behalf.\nCorporate Issuers: describe corporate governance and mechanisms to manage stakeholder\nrelationships and mitigate associated risks", "qhtml": null}, {"n": 39, "q": "Owners have limited liability in a:", "opts": ["corporation.", "sole proprietorship.", "general partnership."], "ans": "A", "expl": "A. Correct because owners in a corporation have limited liability.\nB. Incorrect because in a sole proprietorship the owner has unlimited liability and retains all risk\nassociated with the business, meaning she can be held financially responsible for all debt the\nbusiness owes.\nC. Incorrect because a general partnership has two or more owners called partners and all profits,\nlosses, and risks of the business are collectively assumed and shared by the partners. If one partner\nis unable to pay their share of the business's debts, the remaining partners are fully liable. Partners\nin a general partnership have unlimited liability.\nCorporate Issuers: compare the organizational forms of businesses", "qhtml": null}, {"n": 40, "q": "Which of the following statements about sources of liquidity is most accurate?", "opts": ["Filing for bankruptcy is considered a secondary source of liquidity.", "Secondary sources of liquidity have a lower cost than primary sources of liquidity.", "Using a primary source of liquidity impacts the financial and operating positions of a company."], "ans": "A", "expl": "A. Correct because secondary sources include: filing for bankruptcy protection and reorganization.\nFurther, reorganization through bankruptcy, may also be considered a liquidity tool because a\ncompany under bankruptcy protection that generates operating cash will be liquid and generally\nable to continue business operations until a restructuring has been devised and approved.\nB. Incorrect because primary sources represent funds that are readily accessible at relatively low\ncost. On the other hand, use of secondary sources may signal a company's deteriorating financial\nhealth and provide liquidity at a high price - the cost of giving up a company asset to produce\nemergency cash.\nC. Incorrect because the main difference between the primary and secondary sources of liquidity is\nthat using a primary source is not likely to affect the normal operations of the company, whereas\nusing a secondary source may result in a change in the company's financial and operating positions.\nCorporate Issuers: explain liquidity and compare issuers' liquidity levels", "qhtml": null}, {"n": 41, "q": "Subsequent to making a capital investment, a company reacts to poor financial results\nfrom the project by abandoning it. This action alone best exemplifies the exercise of a:", "opts": ["sizing option.", "timing option.", "flexibility option."], "ans": "A", "expl": "A. Correct because sizing options encompass abandonment or expansion of capacity. If after\ninvesting the company can abandon the investment if the financial results are disappointing, it has\nan abandonment option. Al some future date, if the cash flow from abandoning an investment\nexceeds the present value of the cash flows from continuing the investment the company should\nexercise the abandonment option Conversely, if the company can make additional investments\nwhen future financial results are strong, the company has a growth option or an expansion option.\nB. Incorrect because timing options involve the sequencing of projects. Instead of investing now. the\ncompany can delay investing Delaying an investment and basing the decision on hopefully improved\ninformation that you might have in, say, a year could help improve the NPV of the projects selected.\nProject sequencing options allow the company to defer the decision to invest in a future investment\nuntil the outcome of some or all of a current investment is known Investments are sequenced over\ntime, so that investing in a project creates the option to make future investments\nC. Incorrect because flexibility options include operational changes possible with current capacity,\nsuch as paying overtime or adding a shift to meet excess demand. Once an investment is made,\noperational flexibilities besides abandonment or expansion may be available. If demand exceeds\ncapacity, by increasing prices, the company could benefit from the excess demand, which it cannot\ndo by increasing production. There are also production- flexibility options, which offer the\noperational flexibility to alter production when demand varies from what is forecast. Even though it\nis expensive, the company can profit from working overtime or from adding additional shifts\nCorporate Issuers: describe types of real options relevant to capital investments", "qhtml": null}, {"n": 42, "q": "A measure of how effectively capital is converted into after-tax operating profits is the:", "opts": ["hurdle rate.", "cost of capital.", "return on invested capital."], "ans": "C", "expl": "A. Incorrect because the hurdle rate is the rate that a project's IRR must exceed for the project to be\naccepted by the company.\nB. Incorrect because cost of capital (COC), is the required return used in the NPV calculation, and the\ncompany's associated cost of funds.\nC. Correct because ROIC reflects how effectively a company's management is able to convert capital\ninto after-tax operating profits.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation.", "qhtml": null}, {"n": 43, "q": "Which of the following statements about corporations is most accurate?", "opts": ["Upside return potential is unlimited for both equity holders and debtholders", "Equity is riskier than debt from the perspective of both investors and issuers", "Losses for both equity holders and debtholders are limited to their initial investment"], "ans": "C", "expl": "A. Incorrect because upside return potential is capped for debtholders while it is unlimited for\nequityholders. If the corporation is successful, there is theoretically no limit to how much equity\nowners could make from their investment. No matter how profitable the company becomes,\nhowever, bondholders will never receive more than their interest and principal repayment.\nB. Incorrect because from issuers' perspective debt is riskier than equity while the opposite is true\nfor the investors. From an investor's perspective, stocks are riskier than bonds because shareholders\nare residual claimants on the firm. From the issuer's perspective, bonds are riskier than stocks for\nthe same reason bonds are safer than stocks for investors. Bonds increase risk to the corporation by\nincreasing leverage. If the company is struggling and cannot meet its promised obligations to\nbondholders, bondholders have the legal standing to force certain actions upon the corporation,\nsuch as bankruptcy and liquidation.\nC. Correct because shareholder losses are limited to their initial investment. For both equityholders\nand debtholders, their initial investment represents their maximum possible loss\nCorporate Issuers: compare the financial claims and motivations of lenders and shareholders", "qhtml": null}, {"n": 44, "q": "With respect to ESG implementation, which of the following is most likely a social factor?", "opts": ["Board composition", "Pollution prevention", "Management of human capital"], "ans": "C", "expl": "A. Incorrect because governance factors have long been recognized in investment analysis. Many\nperformance indicators can help evaluate risks arising from governance issues such as ownership\nstructure, board independence and composition. Thus, board composition is a matter of governance\nand not a social factor considered in ESG implementation.\nB. Incorrect because environmental factors that are generally considered material in investment\nanalysis include natural resource management and/or pollution prevention Thus, pollution\nprevention is an environmental consideration and not a social factor considered in ESG\nimplementation.\nC. Correct because social factors considered in ESG implementation generally pertain to the\nmanagement of the human capital of a business, including human rights and welfare concerns in the\nworkplace, product development, and, in some cases, community impact.\nCorporate Issuers: describe environmental, social, and governance factors of Corporate Issuers\nconsidered by investors", "qhtml": null}, {"n": 45, "q": "Double taxation of profits is most likely a concern for owners in:", "opts": ["corporations.", "limited partnerships.", "general partnerships."], "ans": "A", "expl": "A. Correct because tax disadvantage for owners in countries with double taxation is a key feature of\ncorporations. In most countries, corporations are taxed directly on their profits. In many countries,\nshareholders pay an additional tax on distributions (dividends) that are passed on to them.\nEconomists refer to this as the double taxation of corporate profits.\nB. Incorrect because profits of limited partnerships are taxed only at the personal level. A key\nfeature of limited partnerships is that all partners share in return, with profits taxed as personal\nincome.\nC. Incorrect because profits of general partnerships are taxed only at the personal level. A key\nfeature of general partnerships is that all partners share all return, with profits taxed as personal\nincome.\nCorporate Issuers: compare the organizational forms of businesses", "qhtml": null}, {"n": 46, "q": "Which of the following is an example of a secondary source of liquidity for a company?", "opts": ["Short-term funds", "Liquidating assets", "Effective cash management"], "ans": "B", "expl": "A. Incorrect because primary sources of liquidity represent the most readily accessible resources\navailable to the company. These can be cash held or near-cash securities and include the following:\nShort-term funds, which can include items such as trade credit, bank lines of credit, and short-term\ninvestment portfolios of the firm.\nB. Correct because the main difference between primary and secondary sources of liquidity is that\nusing a primary source is not likely to affect the normal operations of the company, whereas using a\nsecondary source might result in a change in the company's financial and operating positions.\nSecondary sources used by companies include: liquidating assets, which depends on the degree to\nwhich short-term and/or long-term assets can be liquidated and converted into cash without\nsubstantial loss in value.\nC. Incorrect because primary sources of liquidity represent the most readily accessible resources\navailable to the company. These can be cash held or near-cash securities and include the following:\nCash management, which is the company's effectiveness in its cash management system and\npractices and the degree of decentralization of the collections or payments processes\nCorporate Issuers: explain liquidity and compare issuers' liquidity levels", "qhtml": null}, {"n": 47, "q": "Which of the following committees of a board of directors oversees the development of\nthe company's conflict of interest policy?", "opts": ["Risk committee", "Governance committee", "Remuneration committee"], "ans": "B", "expl": "A. Incorrect because it is the governance committee, not the risk committee, that has the\nresponsibility to oversee the development of governance policies, including a conflict of interest\npolicy. In summary, key oversight functions of the risk committee include\n- determining company risk profile,\n- ensuring appropriate enterprise risk management, and\n- aligning corporate activities with risk appetite\nB. Correct because the main role of the board's governance committee is to ensure that the\ncompany adopts good corporate governance structures and practices. For this purpose, it oversees\nthe development of the governance policies at the company such as\n- the corporate governance code\n- the charter of the board and as committees\n- the code of ethics and\n- the conflict of interest policy, among others.\nC. Incorrect because it is the governance committee, not the remuneration committee, that has the\nresponsibility to oversee the development of governance policies, including a conflict of interest\npolicy. In summary key oversight functions of the remuneration committee include\n- developing director and executive remuneration policies,\n- overseeing performance policy management and evaluation, and\n- setting human resources (HR) policies relating to employee compensation.\nCorporate Issuers: describe corporate governance and mechanisms to manage stakeholder\nrelationships and mitigate associated risks", "qhtml": null}, {"n": 48, "q": "A company with a required rate of return of 12% is considering a capital project with the\nfollowing cash flows (in millions):\nInitial Outlay Year 1 Year 2\nCash flow: -£150 £8 £175\nThe expected IRR for this project is most likely.", "opts": ["less than 12%.", "equal to 12%.", "greater than 12%."], "ans": "A", "expl": "A. Correct because the IRR is the discount rate that makes the present value of the future after-tax\ncash flows equal that investment outlay or ∑𝑛 𝐶𝐹 /(1+𝐼𝑅𝑅)𝑡 = outlay., where IRR is the\n𝑡=1 𝑡\ninternal rate of return. Solved using the following calculator inputs: CF =-150, CF = 8, CF₂ = 175,\n0 1\nCalculate IRR = 10.7119, rounded to 10.71% which is less than 12%.\nB. Incorrect because it refers to the company's required rate of return, not the expected IRR.\nC. Incorrect because it inflates cash flows in Years 2 by 8 and represents an IRR calculation using the\nfollowing calculator inputs: IRR≠ PV=-150, PMT = 8, N=2, FV = 175, Calculate = 13.15246%, rounded\nto 13.15% which is more than 12%.\nCorporate Issuers: describe the capital allocation process, calculate net present value (NPV), internal\nrate of return (IRR), and return on invested capital (ROIC), and contrast their use in capital allocation", "qhtml": null}, {"n": 49, "q": "All else being equal, if interest on debt is tax deductible, an increase in the company's\nmarginal tax rate will:", "opts": ["decrease the company's WACC.", "not affect the company's WACC.", "increase the company's WACC."], "ans": "A", "expl": "A. Correct because the marginal cost of debt financing is the cost of debt after considering the\nallowable deduction for interest on debt. If interest can be deducted in full, the tax deductibility of\ndebt reduces the effective marginal cost of debt to reflect the income shielded from taxation (often\nreferred to as the tax shield) and the marginal cost of debt is r (1-t). If the marginal tax rate\nd\nincreases, this increases the tax shield and lowers the marginal cost of debt and also the WACC\nB. Incorrect because the WACC does not remain the same. If interest can be deducted in full, the tax\ndeductibility of debt reduces the effective marginal cost of debt to reflect the income shielded from\ntaxation (often referred to as the tax shield) and the marginal cost of debt is r (1-t). If the marginal\nd\ntax rate increases, this increases the tax shield and lowers the marginal cost of debt and also the\nWACC.\nC. Incorrect because it does not increase the WACC. If interest can be deducted in full, the tax\ndeductibility of debt reduces the effective marginal cost of debt to reflect the income shielded from\ntaxation (often referred to as the tax shield) and the marginal cost of debt is r (1-t). If the marginal\nd\ntax rate increases, this increases the tax shield and lowers the marginal cost of debt and also the\nWACC.\nCorporate Issuers: calculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 50, "q": "A company increases its debt from 20% to 60% of its capital structure. Based on the\nModigliani and Miller proposition (without taxes) regarding capital structure, the WACC of\nthe company:", "opts": ["decreases.", "remains the same.", "increases."], "ans": "B", "expl": "A. Incorrect because the Modigliani and Miller proposition implies that higher leverage raises the\ncost of equity but does not change firm value or WACC.\nB. Correct because the Modigliani and Miller proposition implies that higher leverage raises the cost\nof equity but does not change firm value or WACC.\nC. Incorrect because the Modigliani and Miller proposition implies that higher leverage raises the\ncost of equity but does not change firm value or WACC.\nCorporate Issuers: explain the Modigliani-Miller propositions regarding capital structure", "qhtml": null}, {"n": 51, "q": "The NPV of a new project is expected to be -$0.20 million. An incremental investment of\n$0.40 million would give management the flexibility to switch to a lower cost input in the\nfuture. If this option has an estimated value of $0.80 million, the value of the project\nincluding the option is:", "opts": ["$0.20 million.", "$0.40 million.", "$1.00 million"], "ans": "A", "expl": "A. C
