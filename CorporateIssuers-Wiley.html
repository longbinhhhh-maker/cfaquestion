<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "An investor wants to partially fund a small business that will not be a separate legal entity. Also, the investor does not want management responsibilities or unlimited liability. Which of the following roles is best for this investor? ", "opts": ["Limited partner", "General partner", "Corporate shareholder"], "ans": "A", "expl": "Across most economies, organizations can be classified as governments, nonprofits (eg, foundations, endowment funds), or businesses.\nBusinesses can also be categorized among three general structures according to their common characteristics: sole proprietorships, partnerships,\nor limited companies.\nA partnership is a business arrangement involving two or more parties who combine resources and skills while sharing profits and risks. Limited\npartnerships are a common form of partnership, with two types of owners:\nGeneral partners (GPs) have managerial control of the business and joint and unlimited liability for the obligations of the partnership.\nLimited partnerships have one or more GPs.\nLimited partners (LPs) are not involved in management, and their liability is limited to their investment in the partnership.\nIn this situation, the investor wants to be a passive investor and avoid unlimited liability. This could be achieved by forming a limited partnership, in\nwhich the investor would be an LP and the original owner would be the GP. Limited partnerships are not separate legal entities, which also\nmeets the objectives of the investor.\n(Choice B) A general partner has unlimited liability and management responsibilities, which does not satisfy the investor's criteria.\n(Choice C) Corporations exist as separate legal entities from their owners; therefore, the role of corporate shareholder does not satisfy the\ninvestor's criteria.\nThings to remember:\nA partnership is a business arrangement involving two or more parties who combine resources and skills. Limited partnerships are owned by one\nor more general partners, who manage the business and have unlimited liability, and by limited partners, who are not involved in management and\nhave limited liability.\nCompare the organizational forms of businesses", "qhtml": null}, {"n": 2, "q": "Which of the following most likely applies to both general and limited partnerships?", "opts": ["Partners have unlimited liability.", "Neither is typically taxed at the entity level.", "Both are legal entities separate from their owners."], "ans": "B", "expl": "Organizational forms of business: key distinctions\nSole General Limited\nFeature Corporations\nproprietorship partnership partnership\nBoard and\nOperator Owner Partners GPs\nmanagement\nUnlimited (GPs)\nOwner liability Unlimited Limited\nand limited (LPs)\nSeparate legal\nNo Yes\nentity?\nIncome and\nTaxation Pass-through (income taxed at personal level)\ndistributions\nAccess to Unlimited\nRestricted by owner's/partners' access to capital\nfinancing potential\nGPs = General partners\nLPs = Limited partners\nOrganizational forms of business can be categorized into different structures according to their characteristics. Two common structures are sole\nproprietorships and partnerships. A partnership is an arrangement between two or more parties to become co-owners of a business, using\ntheir combined resources and skills while sharing profits and risks. Two common partnership structures, general partnerships and limited\npartnerships, are:\nnot considered separate legal entities from their owners (Choice C).\ntaxed only at the personal level of the partners (ie, pass-through taxation), not at the entity level.\nrestricted by the partners' access to financing.\nThese two forms, however, also have contrasting attributes. In general partnerships, all the partners (GPs) operate the business together and\nhave unlimited liability for all its aspects, including debt and obligations. In limited partnerships, the business is managed by one or more GPs with\nunlimited owner liability, while the limited partners (LPs) are typically passive investors whose liability is limited to what they have invested in the\ncompany (Choice A).\nThings to remember:\nOrganizational forms of business can be sole proprietorships, general partnerships, or limited partnerships, according to their characteristics.\nGeneral partnerships and limited partnerships share common attributes regarding legal identity, taxation, and access to financing, but differ in the\nowner-manager relationship and owner liability for business debts and obligations.\nCompare the organizational forms of businesses", "qhtml": null}, {"n": 3, "q": "In the last fiscal year, a corporation generated $3.5 billion in pretax income, paid $1.26 billion in taxes at the corporate level, and distributed all remaining income to investors. If the corporation operates in a country that taxes dividend distributions at 25%, the total tax rate as a percentage of pretax income is closest to:", "opts": ["48%", "52%", "61%"], "ans": "B", "expl": "Taxation of corporations depends on the rules established by the tax authorities of each country. Corporations are typically taxed on their profits\nand, in several countries, shareholders are then taxed on the dividends they receive. This is known as double taxation since profit is taxed at\ntwo different levels, corporate and personal.\nWhen a corporation's profits are distributed to shareholders, those profits are double-taxed. In this scenario, all after-tax earnings are distributed\nas dividends. The company pays $1.26 billion in corporate taxes, and shareholders are subject to a 25% tax on dividends distributed to them.\nThe total tax rate paid as a percentage of pretax income is calculated as follows:\nTherefore, the total tax rate equals 52% of pretax income.\n(Choice A) 48% is the portion of pretax income that is received by shareholders net of both corporate and personal taxes. The total tax rate\nrepresents the portion that is paid in taxes.\n(Choice B) 61% (= 0.36 + 0.25) results from incorrectly adding corporate and personal tax rates.\nThings to remember:\nCorporations are typically taxed on their profits and, in several countries, shareholders are then taxed on the dividends they receive. This is\nknown as double taxation since profit is being taxed at two different levels, corporate and personal.\nDescribe key features of corporate issuers", "qhtml": null}, {"n": 4, "q": "Which of the following is most likely an example of a sole proprietorship?", "opts": ["A bookstore whose income is taxed at the corporate level", "A software development firm whose owner has unlimited liability", "A chain of auto repair stores issuing bonds to expand its operation"], "ans": "B", "expl": "Organizational forms of business: key distinctions\nSole General Limited\nFeature Corporations\nproprietorship partnership partnership\nBoard and\nOperator Owner Partners GPs\nmanagement\nUnlimited (GPs)\nOwner liability Unlimited Limited\nand limited (LPs)\nSeparate legal\nNo Yes\nentity?\nIncome and\nTaxation Pass-through (income taxed at personal level)\ndistributions\nAccess to Unlimited\nRestricted by owner's/partners' access to capital\nfinancing potential\nGPs = General partners\nLPs = Limited partners\nOrganizational forms of business can be categorized into different structures according to their characteristics. The structures include sole\nproprietorships, general partnerships, limited partnerships, and corporations.\nA sole proprietorship has a single owner who operates the company and holds complete management control. This is the simplest and most\ncommon organizational form; some countries do not even require registration for this form, so that any business started by an individual and not\nincorporated under one of the other structures is automatically classified as a sole proprietorship.\nFinancing for such businesses is typically limited by the sole proprietor's access to capital, so they are often funded by that individual's savings\nor personal loans. A sole proprietorship is not a separate legal entity from its owner, and taxation occurs only at the personal (owner) level (ie,\npass-through taxation), not at the company level. Also, in a sole proprietorship, the owner is personally and legally liable for all the company's\ndebt and obligations, a concept known as unlimited liability.\n(Choice A) In this scenario, the bookstore is taxed at the corporate level, so it is not a sole proprietorship but instead some form of limited\ncompany that is not a pass-through entity.\n(Choice C) Bonds are normally issued by corporations, which have attributes (eg, separate legal entity status, professional managers) that\nfacilitate access to external financing. A sole proprietorship typically does not issue bonds.\nThings to remember:\nOrganizational forms of business can be categorized into different structures according to their characteristics. One structure, a sole\nproprietorship, has a single owner who operates and controls the company and has unlimited liability for all debt and obligations. Financing for\nsuch a business is typically limited by the owner's access to capital.\nCompare the organizational forms of businesses", "qhtml": null}, {"n": 5, "q": "A competitor offers to acquire a company for 20% above its publicly traded price. The competitor seeks to increase the target company's value through cost synergies. Based only on this information, which of the following stakeholder groups has the best reason(s) to oppose the merger?", "opts": ["Shareholders", "Nonowner managers", "Nonexecutive directors"], "ans": "B", "expl": "Companies have a wide range of stakeholder groups, each with its own priorities and concerns. Each group of stakeholders may be affected\ndifferently by the company's actions, which can put them at odds.\nJob security is a priority for managers and employees. After an acquisition, synergies generated through cost cuts often involve job cuts.\nTherefore, a company's nonowner managers and employees will most likely oppose a takeover offer by another entity seeking synergies.\nIf managers and employees own stock in the company, the gains they would realize as stockholders could help to offset their concerns about the\nrisk of job loss. However, that would not be the case in this scenario. The managers do not own any stock in the company, so they will not directly\nbenefit from the acquisition's premium and the potential impact on the stock price.\n(Choice A) Shareholders are typically focused on maximizing the value of the company's equity. They will likely support the deal, given that the\nvalue of their shares will probably increase with the offer price at 20% above market value.\n(Choice C) Nonexecutive directors are board members who are not also managers of the company. They are elected by shareholders to protect\nshareholder interests and oversee the company on the shareholders' behalf. In this scenario, accepting an offer with the potential to increase\nshare price and make the company more efficient and profitable would be in the shareholders' interest.\nThings to remember:\nJob security is a priority for managers and employees. After an acquisition, synergies generated through cost cuts often involve job cuts.\nTherefore, a company's nonowner managers and employees will most likely oppose a takeover offer by another entity seeking synergies.\nDescribe a company’s stakeholder groups and compare their interests", "qhtml": null}, {"n": 6, "q": "All else equal, which stakeholder group can most likely benefit from increased financial leverage?", "opts": ["Creditors", "Customers", "Shareholders"], "ans": "C", "expl": "Companies have a wide range of stakeholder groups, each with its own priorities and concerns. Each group may be affected differently by\ncompany actions, which can put various stakeholders at odds.\nCreditors typically want companies to produce stable cash flows to service debt. In contrast, shareholders want companies to maximize company\nprofits and stock returns. As such, shareholders may favor taking on projects with more risk and potential return and/or adding more debt to\namplify returns using financial leverage. When more debt is added, default risk increases, which is unfavorable to creditors (Choice A).\n(Choice B) Increased debt may increase the chances of bankruptcy, which may hurt customers when a company cannot continue providing\ngoods and services.\nThings to remember:\nCreditors benefit when companies produce stable cash flows to service debt. In contrast, shareholders benefit when companies maximize profits\nand stock returns. As such, shareholders may favor taking on projects with more risk and potential return and/or adding more debt to amplify\nreturns using financial leverage.\nDescribe a company’s stakeholder groups and compare their interests", "qhtml": null}, {"n": 7, "q": "A company's operating cycle lengthens as a result of extending its credit terms from 30 to 90 days. This is least likely to cause concern for the company's:", "opts": ["creditors.", "suppliers.", "customers."], "ans": "C", "expl": "A company's stakeholder groups can be affected in different ways by the same event since each stakeholder group has a different set of priorities\nand concerns. Customers are one such stakeholder group. Customer priorities include making sure the company's products and services:\nprovide the proper value for the price paid,\nsatisfy the customers' needs,\nmeet expected levels of safety, and\nif applicable, are provided with ongoing support, service, and guarantees.\nCustomers are typically less concerned with a company's financial issues than other stakeholder groups. For example, a customer may not\ncare much about whether a clothing manufacturer reports a profit or loss as long as it continues to offer attractive products. In this scenario, the\nlengthening of the operating cycle will delay the timing of the company's cash receipts but should not risk the company's viability.\n(Choice A) Creditors' primary concern is the company's ability to pay the interest and principal payments on its debt. A delay in the collection of\nreceivables can threaten a company's ability to make these payments, which can cause creditors concern. A company with cash issues could face\ncredit downgrades even if it makes its payments on time.\n(Choice B) Suppliers' primary concern is getting paid in a timely manner for the goods and services provided to the company. Short-term cash\nflow issues threaten the company's ability to pay its suppliers in a timely manner, which can cause suppliers concern.\nThings to remember:\nCustomer priorities center on making sure the company's products and services meet the customers' expectations and standards and, if\napplicable, are provided with ongoing support. Customers are unlikely to be concerned by near-term cash flow issues that do not threaten a\ncompany's long-term viability.\nDescribe a company’s stakeholder groups and compare their interests", "qhtml": null}, {"n": 8, "q": "An investor who invests only in the alternative energy subsector is most likely employing which environmental, social, and governance implementation approach?", "opts": ["Positive screening", "Thematic investing", "Exclusionary screening"], "ans": "B", "expl": "Investors often consider environmental, social, and governance (ESG) factors when evaluating companies. ESG factors may have substantial\nbut immeasurable impact on a company's performance. Investors frequently employ several different approaches to screen for ESG factors.\nUsing multiple approaches reduces risk while investing responsibly.\nThematic investing focuses on selecting companies only from a particular sector (eg, alternative energy) or theme (eg, climate change). This\ninvestor, who chooses to invest exclusively in alternative energy companies, is using a thematic investing approach.\n(Choice A) Positive screening involves selecting companies with favorable ESG prospects regardless of sector or theme.\n(Choice C) Exclusionary (negative) screening precludes investments in specific sectors (eg, fossil fuels) or companies with poor ESG standards\n(eg, poor human rights).\nThings to remember:\nThematic investing is an approach that focuses on selecting companies only from within a specific sector or theme.\nDescribe environmental, social, and governance factors of corporate issuers considered by investors", "qhtml": null}, {"n": 9, "q": "Based on personal beliefs, an investor excludes all energy and mining companies from an investable universe. The investor's environmental, social, and governance (ESG) implementation approach is best described as:", "opts": ["impact investing.", "thematic investing.", "negative screening."], "ans": "C", "expl": "Environmental, social, and governance (ESG) implementation\napproaches\nDescription\nExcludes companies or sectors in which activities go\nNegative screening\nagainst investor beliefs\nPositive screening Selects companies with favorable ESG attributes\nBest-in-class Uses an ESG scoring system to rank companies\nESG integration Combines qualitative ESG factors with quantitative data\nFocuses on a specific ESG theme or attribute in which\nThematic investing\nto invest\nSeeks to achieve targeted ESG goals along with\nImpact investing\nmeasurable financial results\nNegative screening involves excluding from consideration certain company, industry, or sector attributes that conflict with an investor's\nbeliefs. Negative screening is the most common approach to environmental, social, and governance (ESG) implementation.\nThe culling process begins at the sector or industry level (eg, energy, mining) and filters down to specific companies that may not be as easily\nclassified. Common candidates for negative ESG screening include companies involved with fossil fuels, tobacco, or alcohol.\n(Choice A) Impact investing seeks to achieve targeted ESG goals and measurable financial results by exerting shareholder influence over\ncorporate decision-making. Examples include publicly interacting with senior management, filing proxy proposals to effect change, and green\nfinance.\n(Choice B) Thematic investing focuses on investments concerning very specific themes or attributes. An investment that specifically focuses on\nalternative energy is a common example of a thematic investing approach.\nThings to remember:\nNegative screening involves excluding from consideration certain company, industry, or sector attributes that conflict with an investor's beliefs.\nNegative screening is the most common approach to environmental, social, and governance implementation.\nDescribe environmental, social, and governance factors of corporate issuers considered by investors", "qhtml": null}, {"n": 10, "q": "The category of stakeholders that will least likely benefit from a significant rise in market value of a public corporation is:", "opts": ["creditors.", "shareholders.", "senior executives."], "ans": "A", "expl": "A corporation's primary stakeholders include creditors, shareholders, and executives. These stakeholders have different interests and do not\nbenefit in the same way when market value increases.\nCreditors (eg, bondholders, banks) lend money to a company and receive interest and principal payments in return. These payments are\npredetermined by the terms of the loan. They do not depend on a company's change in market value, so creditors do not benefit when the\nstock's price appreciates.\n(Choice B) Shareholders own equity in a corporation by owning common stock. Their wealth increases when market value appreciates.\n(Choice C) Senior executives often receive equity-based compensation, which increases their wealth as the company's market value increases.\nThings to remember:\nCreditors receive interest payments in return for providing debt financing to companies. Creditors do not benefit when the company's market value\nincreases whereas shareholders and senior executives do.\nDescribe a company’s stakeholder groups and compare their interests", "qhtml": null}, {"n": 11, "q": "Company XYZ has evolved into a company with significant debt, moderate revenue growth, and steady positive cash flow. Its stock price is consistently undervalued by the market. Based on only this information, XYZ's current scenario is most advantageous for which of the following stakeholder groups?", "opts": ["Creditors", "Customers", "Board of directors"], "ans": "A", "expl": "Most companies have several different types of stakeholders, such as creditors, customers, shareholders, employees, etc. These stakeholders\nhave different interests and benefit differently from a company's transition from growth to stability.\nCreditors (eg, bondholders, banks) lend money to a company and receive interest and principal payments in return. They are primarily\nconcerned with the company's ability to generate cash to service debt and prefer steady, predictable cash flows.\n(Choice B) Customers are consumers of a company's goods and services, and their primary focus is on the quality of what they purchase. They\nare not as concerned with the company's financial performance.\n(Choice C) Members of a company's board of directors are elected by shareholders to protect shareholder interests; therefore, a consistent\nundervaluing of the stock price by the market is not advantageous to the board.\nThings to remember:\nCreditors are concerned primarily with a company's ability to service debt and therefore prefer companies with steady cash flows.\nDescribe a company’s stakeholder groups and compare their interests", "qhtml": null}, {"n": 12, "q": "With regard to environmental, social, and governance (ESG) investing, full integration can be best described as:", "opts": ["investment in assets related to specific ESG factors or themes.", "explicit inclusion of ESG factors in a fundamental analysis of individual stocks.", "inclusion of certain sectors or companies that have favorable ESG factors in a fund."], "ans": "B", "expl": "Environmental, social, and governance (ESG) implementation\napproaches\nDescription\nExcludes companies or sectors in which activities go\nNegative screening\nagainst investor beliefs\nPositive screening Selects companies with favorable ESG attributes\nBest-in-class Uses an ESG scoring system to rank companies\nESG integration Combines qualitative ESG factors with quantitative data\nFocuses on a specific ESG theme or attribute in which\nThematic investing\nto invest\nSeeks to achieve targeted ESG goals along with\nImpact investing\nmeasurable financial results\nInvestors have increasingly considered environmental, social, and governance (ESG) factors when evaluating companies. In turn, companies\nhave increased their ESG reporting. This reporting allows investors to take different approaches when screening potential investments and using\nthose insights in their investment strategies.\nOne ESG implementation approach is full integration (ie, ESG integration): investors explicitly include ESG factors in their traditional\nfundamental analysis of companies (eg, when making cash flow forecasts). Full integration allows analysts to understand the opportunities and\nrisks arising from a company's management of its ESG resources.\n(Choice A) Investment in assets related to specific ESG factors or themes describes thematic investing.\n(Choice C) Including certain sectors or companies with favorable ESG factors in a fund describes positive screening.\nThings to remember:\nFull integration is an environmental, social, and governance (ESG) implementation approach by which investors explicitly include ESG factors in\ntheir traditional fundamental analysis of companies. Full integration allows analysts to understand the opportunities and risks arising from a\ncompany's management of its ESG resources and how that management affects the company's value.\nDescribe environmental, social, and governance factors of corporate issuers considered by investors", "qhtml": null}, {"n": 13, "q": "Of the following, the most likely source of principal-agent conflict between managers and shareholders is managers' having:", "opts": ["remuneration tied to stock-based compensation.", "different levels of risk tolerance than shareholders.", "more limited access to information about the business."], "ans": "B", "expl": "Shareholders' primary goal is maximizing the value of their shares in the company, while managers may focus on maximizing job security\nand total compensation, including salary, bonuses, and stock-based compensation. Differing priorities (eg, different levels of risk tolerance)\ncan cause principal-agent conflict between shareholders and managers.\nTo protect their jobs, a company's managers may be more risk-averse than its shareholders. Shareholders can diversify risk across investments,\nallowing higher risk tolerance, whereas managers may lose their jobs when risky projects fail. In other cases, managers, expecting to increase\ntheir standing or compensation, may accept risky projects when shareholders prefer stability.\n(Choice A) When management compensation includes stock-based compensation, the managers' interests are more closely aligned with the\nshareholders', which reduces the risk of conflict.\n(Choice C) A company's managers are more involved in its day-to-day operations and, as a result, are likely to have more, not less, information\nthan shareholders. Information asymmetry can lead managers to make decisions that may not be in the shareholders' best interest, leading to\nprincipal-agent conflict.\nThings to remember:\nDiffering priorities can cause principal-agent conflict between a company's shareholders and managers. One source of conflict is the managers'\nhaving different levels of risk tolerance than shareholders.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 14, "q": "Which component of stakeholder management does a corporation least likely control?", "opts": ["Legal infrastructure", "Contractual infrastructure", "Organizational infrastructure"], "ans": "A", "expl": "Effective stakeholder management provides a framework for limiting conflicts of interest among different stakeholder groups by proactively\nidentifying and balancing their needs. This framework follows a set of legal, contractual, organizational, and governmental infrastructure that\ndefines the rights and responsibilities of each stakeholder.\nLegal infrastructure is established and controlled by law and not by the corporation. It refers to rights as well as legal remedies that address\nbreaches of those rights.\nGovernmental infrastructure, like legal infrastructure, is outside the control of the corporation. It refers to the rules and regulations established by\nthe government.\n(Choice B) Contractual terms arranged by a corporation and its stakeholders (eg, customers) shape contractual infrastructure, which establishes\nthe rights of all parties in a contractual agreement.\n(Choice C) The corporation's internal systems, practices, and procedures for managing stakeholder relationships shape organizational\ninfrastructure.\nThings to remember:\nLegal infrastructure is established by law and not by the corporation.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 15, "q": "An effective corporate governance system most likely:", "opts": ["helps protect creditor rights.", "creates incentive for management to take fewer risks.", "impedes a company's ability to respond quickly to market events."], "ans": "A", "expl": "Benefits of strong corporate governance\nIncreased operational efficiency and improved\ninternal controls\nIncreased creditworthiness (eg, lower default\nprobability, lower cost of debt)\nEarlier identification of potential conflicts\nImproved operating and financial results\nBetter alignment of manager decisions and\ncompany value maximization\nReduced legal costs and reputational damage\nAn effective corporate governance system prevents one stakeholder group from benefitting at the expense of others by establishing strong\nstakeholder management guidelines and operational controls. These features lead to better relationships with investors and creditors, fewer\nconflicts of interest, more efficient operations, and improved financial results.\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency. The better the\ncontrols and reporting, the more confidence creditors have in the business, reducing borrowing costs and increasing access to funds.\n(Choice B) Strong corporate governance better aligns manager decisions to maximize shareholder wealth; it does not necessarily make\nmanagement more or less risk averse. Proper controls and well-designed compensation plans may encourage potentially risk-averse managers\nto take on risky projects that maximize shareholder wealth. Likewise, effective governance and controls can prevent undue risk-taking that\nemphasizes short-term gains without enhancing long-term shareholder value.\n(Choice C) Effective corporate governance systems typically improve a company's decision-making process, thereby improving, not impeding,\nthe company's ability to quickly respond to market factors.\nThings to remember:\nA robust corporate governance system protects creditor rights by lowering default risk and improving financial transparency, thereby reducing\nborrowing costs and increasing access to funds. In addition, strong corporate governance increases efficiency, improves financial results, and\nbetter aligns manager decisions and company value creation.\nDescribe potential risks of poor corporate governance and stakeholder management and benefits of effective corporate governance and\nstakeholder management", "qhtml": null}, {"n": 16, "q": "Which of the following factors is most appropriately a concern for potential shareholders?", "opts": ["An activist shareholder with a significant position", "Executive remuneration that includes time-vested shares", "Governance codes implemented on a \"comply or explain\" basis"], "ans": "A", "expl": "Key factors related to corporate governance and stakeholder\nmanagement\nCompany ownership and voting structure\nShareholder representation on board of directors\nRemuneration and incentives for management\nSignificant activist investors\nStrength of shareholder rights\nManagement of long-term risks\nGovernance codes and disclosure of deviation from codes\nSignificant investors with activist tendencies can heavily influence many corporate functions by pressuring management through tactics such\nas initiating proxy battles, proposing shareholder resolutions, and raising awareness of potentially contentious issues.\nThe primary motivation for activism is usually to increase shareholder value in the manner the activist believes is best. This may concern potential\nshareholders since the presence of an activist can influence a company's strategic direction and cause significant changes to shareholder\ncomposition.\n(Choice B) An executive remuneration plan that includes time-vested shares encourages executives to take a long-term view of company\nperformance. This view better aligns with shareholders' interests than cash or other short-term incentives.\n(Choice C) Governance codes implemented on a \"comply or explain\" basis are voluntary but require any deviation from the codes to be disclosed\npublicly, which promotes transparency of information and is an advantage for shareholders.\nThings to remember:\nShareholder engagement describes a company's interaction with its shareholders. An activist investor with a significant position in the company's\nstock can substantially change shareholder composition and influence company strategy. The presence of such an investor may be a concern for\npotential investors.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 17, "q": "An argument supporting a dual-class structure of common equity is most likely that compared to single-class structures, dual-class structures better:", "opts": ["align voting power with economic ownership.", "promote stability and long-term strategic investments.", "remove conflicts of interest between noncontrolling shareholders and management."], "ans": "B", "expl": "A common share structure for public companies is the single-class structure, wherein each share grants the holder one vote so that every\nshareholder has proportional voting power based on the number of shares held (eg, a shareholder owning 5% of the company controls 5% of\nthe votes). Other companies have dual-class structures, with multiple share classes that allow different numbers of votes per share (eg, Class A\nhas one vote per share, while Class B has five votes per share).\nProponents of dual-class structures argue that they provide more stability since founders and insiders can better retain control when faced with\nactivism or a takeover attempt. In addition, shareholders and their chosen managers are insulated when voting power is controlled, so the\ncompany can focus on long-term strategic investments instead of short-term financial results. Once created, dual-class structures are difficult to\ndismantle.\n(Choice A) Dual-class structures separate voting power from economic ownership since owners of the class with more votes (usually founders or\ninsiders) have voting power disproportionate to their share ownership.\n(Choice C) Critics of dual-class structures argue that they can create conflicts of interest between company executives and noncontrolling\nshareholders, who lack the voting power to enforce their preferences when the executives—chosen by insiders—have different goals.\nThings to remember:\nDual-class share structures separate voting power from economic ownership since owners of the class with more votes have voting power\ndisproportionate to their number of shares. Proponents of dual-class structures argue that they provide more stability and allow companies to\nfocus on long-term strategic investments.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 18, "q": "Which of the following topics is most likely to be voted on during a company's annual general meeting?", "opts": ["Approving the external auditor", "Accepting a merger or acquisition", "Amending the rights of a class of shares"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated\nsolely to the board of directors. Typical (and often recurring) agenda items for an AGM include the following:\nAn overview of the company's financial statements and performance\nApproval of audited financial statements (if applicable)\nElection and discharge of directors\nRemuneration of directors and executives\nAppointment of external auditors\nThe opportunity for shareholders to voice concerns or opinion\nAn extraordinary general meeting (EGM) is called by a company to address irregular and timely matters, often related to a corporate transaction or\nmaterial corporate change that requires shareholder approval. Items may include mergers and acquisitions or amendments to the rights of a class\nof shares. If the timing is appropriate, special items may be voted on during an AGM; this is less likely, however, if the items are not of a pressing\nnature or occur infrequently (Choices B and C).\nThings to remember:\nCompanies normally hold an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that are not delegated solely\nto the board of directors. Approval of the external auditor is a typical AGM agenda item.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 19, "q": "At a shareholders' annual general meeting (AGM), which of the following most likely requires a supermajority vote?", "opts": ["Merger or takeover transaction", "Approval of financial statements", "Election of directors and auditors"], "ans": "A", "expl": "General meetings agenda items\nFinancial statement approval\nCompany performance review\nAnnual general meeting (AGM)\nElection of directors and auditors\nBoard and management compensation\nMaterial corporate changes\nExtraordinary general meeting (EGM) Mergers and acquisitions\nSale or spinoff of corporate assets\nA company holds an annual general meeting (AGM) to give shareholders an opportunity to vote on decisions that the board of directors does not\nhave the authority to make alone. The AGM is mandatory, is usually composed of routine items, and often has a similar agenda each year.\nTypical agenda items for an AGM include approval of audited financial statements, the election of directors, and the opportunity for shareholders to\nvoice concerns or opinions.\nAn extraordinary general meeting (EGM) is called to address items that need more immediate attention, often related to a corporate transaction\nthat requires shareholder approval. Special items are not necessarily reserved for an EGM; if the timing is appropriate, the AGM may also include\nspecial one-time items for shareholder consideration, such as a merger or acquisition.\nOrdinary agenda items require only a simple majority to pass, whereas more significant matters that would materially affect the organization\nusually require a supermajority vote (eg, 66%, 75%). Examples of items requiring a supermajority vote include changes or amendments to the\ncorporate charter or by-laws, mergers, and a takeover of the business.\n(Choices B and C) The approval of financial statements and the election of directors and auditors are routine matters, requiring only a simple\nmajority to pass.\nThings to remember:\nOrdinary agenda items require only a simple majority to pass, while more significant matters that would materially affect the organization usually\nrequire a supermajority vote. Examples of items requiring a supermajority vote include mergers, changes or amendments to the corporate charter\nor by-laws, , and a takeover of the business.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 20, "q": "Which of the following is most likely a responsibility of a board of director's remuneration committee?", "opts": ["Proposing the compensation for the external auditors", "Evaluating the performance of the company's managers", "Setting the criteria for what constitutes an independent director"], "ans": "B", "expl": "A company's board of directors (ie, board) is composed of individuals who are elected by and represent the company's shareholders to ensure\nmanagement acts in the best interest of shareholders. A board has several roles and is usually broken into committees that focus on different\nfunctions.\nThe remuneration committee is primarily responsible for performance evaluation and compensation policies related to the company's\nmanagers. This often includes:\nproposing remuneration for managers,\nhandling managers' contracts,\nsetting performance criteria and evaluating management performance,\nestablishing human resources policies related to remuneration, and\noverseeing the implementation of the company's benefit plans.\n(Choice A) The audit committee is typically responsible for matters pertaining to the external auditors, including proposing their remuneration.\n(Choice C) The nomination committee is typically responsible for setting the criteria for what constitutes an independent director.\nThings to remember:\nThe board of directors is elected by and represents the interests of shareholders and is usually broken into committees that focus on specific\nfunctions. The remuneration committee is responsible for performance evaluation and compensation policies related to the company's managers,\nwhich includes setting performance criteria and evaluating management performance.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 21, "q": "The founder of Company P, who owns 51% of the company, chooses to buy materials from Firm S, which is owned by a family relative. Firm S charges 25% above current market price for its products, which are of ordinary quality. In this scenario, conflicts of interest are most likely to arise between Company P's:", "opts": ["customers and suppliers.", "creditors and board of directors.", "controlling shareholder and minority shareholders."], "ans": "C", "expl": "In companies where a single shareholder or group of shareholders holds a controlling stake, conflicts may arise between the controlling and\nminority shareholders. The opinions and decisions of controlling shareholders often outweigh the concerns of minority shareholders since\nminority shareholders have little or no influence in corporate decision making.\nIn this example, the founder and majority owner (at 51% ownership) of Company P places his/her interest above that of minority shareholders in a\nrelated-party transaction. The transaction may benefit the founder and the relative but diminishes profitability of Company P, thus creating a\nconflict of interest between the controlling shareholder and minority shareholders.\n(Choice A) Conflicts between customers and suppliers typically result from a company offering lenient credit terms to its customers, which may\nimpact the company's own ability to pay its suppliers on time.\n(Choice B) Both creditors and the board of directors want the company's profits to be healthy. Since the related-party transaction benefits the\ncontrolling shareholder to the detriment of the company's profits, the creditors and the board are aligned in interest, not conflicted.\nThings to remember:\nThe decisions made by a controlling shareholder may create a conflict of interest with the minority shareholders.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 22, "q": "With regard to remuneration policies, which of the following practices is least likely to align executive compensation with shareholder interests?", "opts": ["Implementing clawback provisions", "Giving shareholders \"say on pay\" rights", "Granting stock options rather than performance shares"], "ans": "C", "expl": "Executive compensation structure\nFixed component Base salary\nVariable component Profit sharing, stock options, stocks\nTypically, executive compensation includes a variable component tied to company or stock performance. Since shareholders seek to maximize\nstock value in the long run, proper remuneration policies ensure that executives focus on long-term company gains rather than short-term\nprofits. One way of doing so is to grant executives performance shares instead of stock options.\nPerformance shares are typically awarded when long-term company performance objectives (eg, targeted earnings per share) are met. In\ncontrast, employee stock options (ESO) can be exercised immediately to the holder's benefit anytime the company's stock price rises above the\noption's strike price. For this reason, ESO can lead management to overly focus on short-term performance.\nOther alignment mechanisms include clawback provisions and shareholder \"say on pay\" rights. Clawbacks allow companies to retract prior\ncompensation if executives miss certain corporate objectives (Choice A). \"Say on pay\" rights allow shareholders to vote on remuneration matters\n(Choice B).\nThings to remember:\nProper executive remuneration policies can align the interests of executives with stakeholder objectives and company performance. Ways to\nensure alignment include granting performance shares, imposing clawback provisions, and giving shareholders \"say on pay.\"\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 23, "q": "Which of the following is a function of a company's board of directors?", "opts": ["Execute company strategy", "Prepare company financial statements", "Review merger and acquisition proposals"], "ans": "C", "expl": "The board of directors (the board) is composed of individuals elected by shareholders primarily to represent shareholder interests. The board\nmonitors the managers (eg, executives) of the company on behalf of its shareholders, effectively serving as the central link between the two.\nBoard members serve on different functional committees (eg, investment committee) that oversee different areas of the company.\nThe major functions of the board include:\nEstablishing the company's strategic direction\nMonitoring execution of strategy by management\nSelecting, appointing, and terminating senior managers\nReviewing corporate and management performance\nEnsuring effectiveness of audit and control systems\nEnsuring adoption of corporate governance principles (ie,\ncomplying with laws and ethical standards)\nAppropriating enterprise risk management systems\nReviewing proposals for corporate transactions or changes\n(eg, M&A, divestitures)\n(Choice A) Managers execute a company's strategy after the board establishes it.\n(Choice B) The board does not directly prepare company financials; instead, the board oversees the company's audit and control systems to\nensure financial integrity.\nThings to remember:\nThe board of directors is elected by shareholders primarily to represent shareholders' interests. The board sets company strategy and oversees\nits implementation and execution, monitors management performance, ensures audit controls, ensures adoption of governance, appropriates\nenterprise risk management, and reviews major corporate transactions (eg, M&A, divestitures).\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 24, "q": "Which function is least likely a responsibility of the audit committee?", "opts": ["Recommending an external auditor", "Providing oversight of the application of accounting policies", "Monitoring company-wide compliance with all relevant laws and regulations"], "ans": "C", "expl": "Audit committee responsibilities\nOversee audit and control systems\nMonitor financial reporting process and ensure financial accuracy\nOversee application of accounting policies\nEnsure integrity of financial statements\nSupervise internal audit function\nRecommend external auditor\nPresent annual audit report to board\nBoard members serve on functional committees, which oversee different areas of a company. These committees include but are not limited to\ngovernance, risk, and investment committees. The governance committee, not the audit committee, is responsible for maintaining compliance\nwith laws and regulations.\nThe audit committee is one of the most common committees on corporate boards. In addition to its primary function of overseeing a\ncompany's reporting process, the audit committee is charged with mitigating the risk of fraud or misstatements in both accounting and financial\ninformation. The committee maintains independence from company management and establishes policies and procedures to ensure financial\nintegrity.\n(Choices A and B) The audit committee's responsibilities include oversight of both the audit process (eg, recommending an external auditor) and\nthe application of accounting policies.\nThings to remember:\nThe audit committee maintains independence from management as it oversees a company's audit and control systems and establishes policies\nand procedures to ensure financial integrity (eg, mitigating the risk of fraud or misstatements). The governance committee, not the audit\ncommittee, is responsible for monitoring company-wide compliance with laws and regulations.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 25, "q": "Stakeholder theory asserts that the primary responsibility of corporate governance is to:", "opts": ["maximize shareholder returns.", "prioritize the needs of employees.", "balance the competing needs of all interested parties."], "ans": "C", "expl": "Corporate governance overview\nCorporate The framework of managing priorities between a company's management and board, relative to its shareholders\ngovernance and other stakeholders\nShareholder theory Prioritizes maximizing returns to equity shareholders\nConsiders shareholders' needs, but takes a more balanced approach toward managing the diverging interests\nStakeholder theory\nthat arise between all interested parties\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders (ie,\nowners) and other stakeholders. There is not one universally accepted approach to corporate governance, but the two most widely practiced\napproaches are:\nShareholder theory, in which the priority is maximizing shareholder returns above all else (Choice A).\nStakeholder theory, which takes a more balanced approach in managing the conflicting interests of shareholders and all other\nstakeholders without unduly favoring one group over another (Choice B).\nThe practice of corporate governance is often influenced by long-standing cultural, legal, and political factors specific to a country or geographic\nregion. Corporate governance approaches are best seen as placed along a continuum, with shareholder theory at one end and stakeholder\ntheory at the other.\nWhile there is not a single unifying set of global rules and regulations for what constitutes the proper model of corporate governance, the trend has\nbeen toward a convergence of ideas for a consensus framework regarding what is considered best practice.\nThings to remember:\nCorporate governance is the framework of managing priorities between a company's management and board, relative to its shareholders and\nstakeholders. Shareholder theory places the needs of equity owners above all else, while stakeholder theory takes a more balanced approach\ntoward the concerns of all stakeholders.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 26, "q": "Which of the following is most accurate with regard to a dual-class share structure?", "opts": ["Shareholders have voting power equal to their percentage of ownership.", "It may grant founders superior voting control even if their ownership level falls below 50%.", "It typically grants outside shareholders greater voting power than insiders and family members."], "ans": "B", "expl": "Normally, public companies have a share structure that grants each shareholder proportional voting power based on the number of shares\nheld. For example, a shareholder who owns 50% of the company controls 50% of the votes. One exception to the general rule is a dual-class\nstructure, where different share classes allow different numbers of votes per share (eg, Class A at one vote per share vs. Class B at two votes per\nshare).\nA dual-class structure may create disproportional voting power relative to share ownership. Insiders (eg, founders) commonly hold Class B\nshares, which grant them dominant voting control on important issues (eg, board elections or strategic decisions) even if their share ownership\nfalls below 50%.\n(Choice A) Shareholders have voting power equal to their percentage of share ownership only if all shares grant the same number of votes.\nDifferent share classes allow for different votes per share in a dual-class structure.\n(Choice C) Class B shares are granted mainly to insiders and family members and not to outside shareholders; therefore, greater voting power is\ntypically held by insiders and family members.\nThings to remember:\nDual-class share structure creates disproportional voting power since different share classes carry unequal voting rights.\nDescribe the principal-agent relationship and conflicts that may arise between stakeholder groups", "qhtml": null}, {"n": 27, "q": "Which of the following is least likely a role of the governance committee?", "opts": ["Develop the company's code of ethics", "Ensure compliance with applicable laws and regulations", "Establish nomination and identification processes for director positions"], "ans": "C", "expl": "Board members serve on functional committees, which oversee different areas of the company. The governance committee safeguards the\ncompany by implementing best practices in the company's policy and procedures. The main functions of the governance committee are:\nReview and update policies for regulatory changes and developments\nEnsure compliance with applicable laws and regulations\nRecommend remedial actions for breaches of laws\nDevelop and supervise the implementation of:\nCorporate governance code\nCharter of the board and its committees\nCompany's code of ethics and conflicts of interest policy\nOversee annual evaluation of the board\nThe nomination committee, not the governance committee, focuses on identifying candidates for board of director positions and establishing the\nprocess behind nominating these candidates.\n(Choices A and B) Developing a code of ethics and ensuring compliance with laws and regulations are both functions of the governance\ncommittee.\nThings to remember:\nThe governance committee ensures that the company adopts good corporate governance practices and procedures. The nomination committee\nestablishes nomination and identification processes for director positions.\nDescribe corporate governance and mechanisms to manage stakeholder relationships and mitigate associated risks", "qhtml": null}, {"n": 28, "q": "Which of the following factors most likely results in a drag, rather than a pull, on a company's liquidity position?", "opts": ["Delinquent customer payments", "Reduced limits on lines of credit", "Payments to vendors before the due date"], "ans": "A", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nA company's liquidity position is a measure of its ability to meet short-term cash flow needs. Liquidity is impacted by drags and pulls:\nA drag on liquidity refers to slower cash inflows\nA pull on liquidity refers to faster cash outflows or limited availability of trade credit\nBoth pulls and drags reduce a company's available cash balance.\nDelinquent customer payments slow the company's receipts of cash, create a drag on liquidity, and increase the likelihood of uncollected accounts\nreceivable. As a result, the company receives cash more slowly or receives less cash.\n(Choice B) A reduction in the company's credit limit is a pull on liquidity: the company will hit the lower limit sooner and more often, accelerating\nrequired repayments (ie, cash outflows).\n(Choice C) When a company pays its vendors before the due date, it is speeding up cash outflows, which is a pull on liquidity.\nThings to remember:\nA company's liquidity position measures its ability to meet short-term cash flow needs. A drag on liquidity indicates slower or smaller cash inflows;\na pull on liquidity refers to faster or greater cash outflows. Both scenarios reduce a company's liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 29, "q": "A company has a quick ratio of 0.95. If the company reports current liabilities of HKD400 million, deferred tax liabilities due in 14 months of HKD100 million, and inventory of HKD120 million, its current ratio is closest to:", "opts": ["0.65", "0.80", "1.25"], "ans": "C", "expl": "The current ratio and the quick ratio are two related liquidity metrics for a company's ability to meet short-term (ie, due within a year)\nobligations. Both ratios express the relationship between current assets (eg, cash, short-term marketable investments, receivables, inventory) and\ncurrent liabilities (eg, accounts payable, accrued liabilities, short-term debt). A higher ratio indicates better liquidity.\nThe quick ratio is the more conservative liquidity measure because it excludes inventory in the numerator. Inventory is the least liquid current\nasset as it requires the longest time to convert to cash.\nTo calculate the current ratio, first derive the value of current assets by using the given values for the quick ratio, current liabilities, and inventory.\nThe current asset value is then inserted into the current ratio formula.\n(Choice A) In calculating the current ratio, the level of current assets is incorrectly computed by subtracting inventory from the quick assets\n(current assets excluding inventory) instead of adding inventory to the quick assets.\n(Choice B) The denominator incorrectly includes deferred tax liabilities as a current liability. The deferred tax liabilities are due more than a year\nfrom now, so they are not a current liability.\nThings to remember:\nThe current ratio is equal to the current assets divided by the current liabilities. The quick ratio is equal to the current assets less inventory divided\nby the current liabilities. Inventory is excluded from the quick ratio since it is the least liquid of current assets and takes the longest time to convert\nto cash.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 30, "q": "A company has CAD 50 million of short-term liquidity needs. The company has the following assets and liabilities: CAD 20 million in marketable securities, which can be sold with a 0.5% brokerage cost CAD 35 million in bonds, able to be liquidated at 2.5% cost CAD 50 million in accounts payable with terms of 2/10, net 60 To cover its liquidity needs at lowest cost, which of the following strategies would be most appropriate for the company to use?", "opts": ["Issue new equity in secondary offering", "Sell all the marketable securities and sell bonds", "Sell all the marketable securities and delay accounts payable"], "ans": "C", "expl": "Companies typically have many options for short-term financing, including internal sources and financial intermediaries (eg, lines of credit).\nMismanaging capital can result in higher costs paid or a shortage of funds. When managing funds, a company should ensure that:\nsufficient sources of capital are maintained to meet the company's cash needs, especially peak needs, and\nmarket rates for these sources are not excessive compared with market averages.\nIn this scenario, selling the marketable securities is the company's cheapest option, with a 0.5% fee on sales. The company can free up funds by\ndelaying its accounts payable payment up to 60 days, forgoing a 2% discount. (\"2/10, net 60\" means that the company has 60 days to pay but it\ncan earn a 2% discount if payment is made within 10 days.) This lower cost option is preferable to liquidating bonds at a cost of 2.5% (Choice B).\n(Choice A) Issuing new equity in a secondary offering would be inappropriate for a company trying to meet short-term liquidity needs. Equity\nissuances typically take time to execute and can have high costs, which makes this option more appropriate to fund long-term needs.\nThings to remember:\nA company's management should know how different sources of short-term funds can affect its liquidity position and risks. When funds are\nmanaged, sufficient sources of capital must be maintained to meet the company's peak cash needs. In addition, market rates for these sources\nmust not be excessive compared with market averages.\nDescribe issuers’ objectives and compare methods for managing working capital and liquidity", "qhtml": null}, {"n": 31, "q": "Which of the following situations most likely creates a pull on a company's liquidity?", "opts": ["Major suppliers change payment terms from 60 days to 30 days.", "Obsolete inventory accumulates beyond one normal sales cycle.", "Interest rates for sources of short-term funding increase by 100 basis points."], "ans": "A", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nBusinesses manage liquidity by controlling cash inflows and outflows effectively in the near term. Certain events may drain liquidity through drags\nand pulls. A drag on liquidity generally refers to a slowdown in cash inflows. A pull on liquidity generally refers to a speedup in cash\noutflows. Both pulls and drags reduce a company's available cash balance.\nIn this scenario, a company's major suppliers shortening payment terms from 60 to 30 days means that the company must disburse cash earlier\nto satisfy payables. This situation creates a pull on liquidity.\n(Choice B) Excess buildup of obsolete inventory negatively affects a company's ability to generate sales. This creates a drag on liquidity.\n(Choice C) An increase in short-term borrowing rates makes it more difficult for a company to obtain funds. This creates a drag on liquidity.\nThings to remember:\nBusinesses manage liquidity by controlling cash inflows and outflows effectively in the near term. A drag on liquidity generally refers to a\nslowdown in cash inflows. A pull on liquidity generally refers to a speedup in cash outflows.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 32, "q": "An analyst gathers the following information about a company: Based on this information, the company's inventory turnover ratio is closest to:", "opts": ["8.0", "9.6", "12.0"], "ans": "B", "expl": "Inventory turnover is a liquidity metric that measures how many times inventory has been bought (eg, acquired, created), sold, and\nreplenished in a given period. All else being equal, the faster a company sells its inventory, the quicker it can convert its assets back to cash and\nrepeat the cycle. For example, everyday consumable products (eg, milk, bread) tend to turn over rapidly, while more durable items (eg, TV,\nwashing machine) tend to turn over more slowly.\nInventory turnover is particularly useful when comparing similar businesses as a means of contrasting operating and asset efficiency. In this case,\ninventory turnover is 9.6 times:\n(Choice A) 8.0 results from subtracting accounts receivable from COGS and then dividing by average inventory.\n(Choice C) 12.0 results from using credit sales instead of COGS as the numerator. This answer could also have been calculated by dividing\nCOGS by ending inventory instead of average inventory.\nThings to remember:\nInventory turnover is a liquidity metric that measures how many times inventory has been bought (eg, acquired, created), sold, and replenished in\na given period. Inventory turnover is calculated as COGS divided by average inventory.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 33, "q": "An analyst gathers the following data for a company: Based on this information, the days of inventory on hand (DOH) is closest to:", "opts": ["36.5", "40.6", "48.7"], "ans": "C", "expl": "Days of inventory on hand (DOH), also referred to as number of days of inventory, measures the average number of days it takes a company\nto sell its inventory. DOH is an activity ratio that indicates management's effectiveness in managing its inventory, with fewer days usually\nindicating more efficiency as capital is tied up in inventory for a shorter time. DOH is particularly useful as a means of contrasting operating and\nasset efficiency when comparing similar businesses.\nDOH is calculated as average inventory for the period divided by daily COGS. In this case, DOH equals 48.7.\n(Choice A) 36.5 is credit sales, not average inventory, divided by daily COGS.\n(Choice B) 40.6 is ending inventory, not average inventory, divided by daily COGS.\nThings to remember:\nThe number of days of inventory (DOH), also referred to as days of inventory on hand, measures the average number of days that it takes a\ncompany to sell its inventory. DOH is calculated as average inventory for the period divided by daily COGS.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 34, "q": "An analyst gathers the following data for a company for 20X1: Based on this information, the company's day's sales outstanding (DSO) in 20X1 is closest to: ", "opts": ["47.5", "51.1", "68.5"], "ans": "A", "expl": "Days sales outstanding (DSO), also referred to as number of days of receivables, is one of several activity ratios used to measure operational\nefficiency. DSO represents the average number of days it takes for a company to collect cash from credit sales.\nDSO performance is particularly useful for evaluating operating and asset efficiency when conducting trend analysis or comparing similar\nbusinesses. Faster collection of receivables enhances liquidity and results in a lower DSO; a higher DSO indicates that customers are slower to\npay invoices and are more of a drag on liquidity.\nDSO
