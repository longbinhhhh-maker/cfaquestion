 equals average accounts receivable divided by daily credit sales:\n(Choice B) 51.1 results from using ending accounts receivable, not average accounts receivable.\n(Choice C) 68.5 is equal to daily credit sales.\nThings to remember:\nDays sales outstanding (DSO) is used to measure the average time needed for a company to collect cash from credit sales. A lower DSO value is\ngenerally desirable and can improve a company's liquidity position. DSO is calculated as average accounts receivable divided by daily credit\nsales.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 35, "q": "An analyst is evaluating the performance of inventory management across several manufacturing companies. The analyst gathers the following data: Based on the data, and assuming all companies manufacture the same product, which of the following best describes the improvements in the number of days of inventory (DOH) from the previous year? ", "opts": ["Company X shows the most improvement.", "Company Z shows more improvement than Company Y.", "The industry average shows more improvement than Company Y."], "ans": "A", "expl": "The number of days of inventory (DOH), also referred to as days of inventory on hand, measures the average number of days that it takes a\ncompany to sell its inventory. Analysts can use DOH to evaluate a company's inventory management. Shorter DOH indicates greater speed\nand efficiency in selling inventory. In contrast, longer DOH can lead to inventory obsolescence and extra storage costs.\nCalculate the changes in DOH between FY18 and FY17:\nCompany X improved the most (by 3.4 days) over the previous year. On average, it took Company X 3.4 fewer days to sell its inventory compared\nto the prior year.\n(Choice B) Compared with the previous year, Company Z's DOH increased by 2.1 days while Company Y's DOH decreased by 2.2 days. This\nmeans that Company Z's DOH worsened by 2.1 days while Company Y's DOH improved by 2.2 days.\n(Choice C) Compared with the previous year, the industry's DOH decreased by 1 day while Company Y's DOH decreased by 2.2 days. This\nmeans that the industry's DOH improved by only 1 day while Company Y's DOH improved by 2.2 days.\nThings to remember:\nThe number of days of inventory (DOH) measures the average number of days that it takes a company to sell its inventory. Fewer days indicate\ngreater speed and efficiency in turning inventory into sales.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 36, "q": "An analyst is evaluating the performance of three manufacturers with the following information: Which company has the highest inventory turnover? ", "opts": ["Company X", "Company Y", "Company Z"], "ans": "A", "expl": "The inventory turnover ratio represents the number of times, on average, inventory is sold and replenished during a fiscal period. It is calculated\nby dividing the cost of goods sold (COGS) by the average inventory. Average inventory is used since inventory fluctuates throughout the year.\nCOGS, or the cost at which the inventory was acquired or manufactured, is recorded when an item is sold.\nHigher inventory turnover can imply stronger sales relative to inventory levels whereas lower inventory turnover can imply slower sales or\nexcess inventory. The faster a company sells its inventory, the quicker it can convert its assets to cash and improve liquidity. In addition, long\ninventory storage times can lead to obsolete inventory.\nCompany X has the highest inventory turnover ratio of 4.3.\n(Choice B) Company Y has a lower inventory turnover ratio than Company X, meaning that Company Y was less efficient in converting its\ninventory into sales.\n(Choice C) Company Z has the lowest inventory turnover ratio.\nThings to remember:\nThe inventory turnover ratio is calculated as cost of goods sold divided by average inventory. It represents the number of times, on average,\ninventory is sold during the fiscal period. Higher inventory turnover can imply stronger sales relative to inventory levels.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 37, "q": "An analyst gathers the following data for a company: Based on this information, days payable outstanding (DPO) is closest to: ", "opts": ["45.6", "46.8", "49.0"], "ans": "A", "expl": "Days payable outstanding (DPO), also called number of day's payables, is one of several activity ratios used to measure operational efficiency.\nDPO is used to measure the average number of days it takes a company to pay its suppliers, which is one indicator of the company's\neffectiveness in managing its suppliers, cash disbursements, and operating cycle. A larger DPO, resulting from slower payments to suppliers, is\ndesirable since it enhances liquidity. DPO, like all activity ratios, is most useful when comparing against peers or an industry benchmark.\nDPO is the ratio of average accounts payable to average daily purchases. Average daily purchases is calculated as (COGS + Ending inventory –\nBeginning inventory) / 365.\n(Choice B) 46.8 results from dividing average accounts payable by COGS.\n(Choice C) 49.0 results from using ending payables instead of average payables.\nThings to remember:\nDays payable outstanding (DPO) is used to measure the average number of days it takes a company to pay its suppliers. DPO is the ratio of\naverage accounts payable to average daily purchases. Average daily purchases is calculated as (COGS + Ending inventory – Beginning\ninventory) / 365.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 38, "q": "All else being equal, which of the following changes to pulls and drags on liquidity most likely decreases a company's liquidity?", "opts": ["Increased pulls and drags", "Decreased pulls and drags", "Decreased pulls and increased drags"], "ans": "A", "expl": "Factors influencing a company's liquidity (ie, ability to generate cash to meet short-term obligations) are described as pulls and drags. Pulls are\nfactors affecting cash outflows, and drags are factors affecting cash inflows.\nLiquidity decreases with:\nincreased pulls: larger/more rapid outflows such as paying employees weekly rather than monthly; and\nincreased drags: smaller/slower inflows such as a reduction of credit lines from lenders.\n(Choice B) Liquidity increases with reduced pulls (ie, smaller/slower outflows), such as deferring payments to vendors to a later date, and\nreduced drags (ie, larger/more rapid inflows), such as faster inventory turnover.\n(Choice C) Increased drags decrease liquidity. However, decreased pulls favorably affect liquidity.\nThings to remember:\nPulls are factors that accelerate the flow of liquidity out of a company. Drags are factors that slow the flow of liquidity into a company. Increased\npulls and drags decrease liquidity, and reduced pulls and drags increase liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 39, "q": "An analyst gathers the following information for 20X1 for a Brazilian company (in BRL millions): Credit sales 135 Cost of goods sold (COGS) 108 Purchases 127 Accounts receivable 12 Beginning inventory balance 15 Ending inventory balance 17 Accounts payable 8 If the average length of the cash conversion cycle for the industry is 58 days, then the cash conversion cycle for the company is most likely:", "opts": ["better than that of the industry.", "the same as that of the industry.", "worse than that of the industry."], "ans": "C", "expl": "The cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers. The CCC consists of the number of days of inventory (ie, days of inventory on hand, DOH) plus the number of days of receivables (ie,\ndays of sales outstanding, DSO) less the number of days of payables (ie, days of payables outstanding, DPO).\nDOH measures the average time needed for a company to sell its inventory. DSO measures the average time needed to collect cash from the\nsales. DPO measures the average time needed to pay suppliers for the materials used to make the goods.\nIn this scenario, it takes the company 5.52 (63.52 − 58) more days than the industry, on average, to convert its inventory to cash after paying\nsuppliers. This indicates a worse CCC relative to the industry since it takes longer for the company to convert inventory to cash (Choices A and\nB).\nThings to remember:\nThe cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers. CCC is calculated by adding the number of days of inventory and the number of days of receivables, and then deducting the number of\ndays of payables. A longer CCC can be detrimental to a company's cash position.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 40, "q": "All else equal, a firm increasing its accounts receivables turnover will most likely:", "opts": ["decrease its operating cycle.", "increase its days of sales outstanding.", "increase its ending accounts receivables."], "ans": "A", "expl": "Accounts receivable turnover is a liquidity measure that approximates the number of times, on average, a company converts its accounts\nreceivables (AR) from credit sales to cash, within a reporting period. All else equal, higher AR turnover can signal more efficient working capital\nmanagement.\nA related measure, derived from AR turnover, is Days Sales Outstanding (DSO) (also known as \"days receivable\"). DSO measures the average\ntime in days it takes to collect cash from customers after making credit sales. Higher AR turnover results in lower (shorter) DSO, which can\ndecrease the operating cycle (Choice B).\nThe operating cycle (OC) measures the average time in days it takes a company to convert its inventory to cash. The OC is the sum of days of\ninventory on hand (DOH), which measures the average time in days to sell inventory, and DSO.\n(Choice C) All else equal, higher AR turnover suggests that receivables are turned into cash more frequently. This most likely leads to lower\nlevels of ending AR, not higher.\nThings to remember:\nAccounts receivable turnover measures the number of times, on average, a company converts its accounts receivables (AR) from credit sales to\ncash, within a reporting period. All else equal, a higher AR turnover results in lower days sales outstanding, which ultimately shortens the\noperating cycle.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 41, "q": "A company improved its operating cycle this fiscal year. If the company significantly increased its days of inventory on hand (DOH) over the same period, then the company most likely decreased its:", "opts": ["days payable outstanding (DPO).", "days of sales outstanding (DSO).", "accounts receivables turnover ratio."], "ans": "B", "expl": "The operating cycle (OC) measures the time required to convert inventory to cash. The OC consists of the days of inventory on hand (DOH),\nand the days of sales outstanding (DSO). The DOH measures the average time needed for a company to sell its inventory. The DSO measures\nthe average time needed for a company to collect cash from the sales. Decreasing the OC improves a company's overall cash position.\nThe company improved its OC by reducing the number of days. The OC is the sum of DOH and DSO, so an increase in DOH must be offset by a\ngreater decrease in DSO for the overall OC to decrease. Essentially, the company offsets an increase in its sales cycle with a greater decrease in\nits collections cycle. This results in a shorter OC, and the company receives cash faster.\n(Choice A) The OC, unlike the cash conversion cycle (CCC), is not impacted by changes to days payable outstanding (DPO). The CCC is the\ndifference between the OC and the DPO.\n(Choice C) The accounts receivable (AR) turnover ratio (credit sales ÷ AR) gauges the collection frequency over a period. AR turnover is\ninversely related to DSO. A decrease in AR turnover indicates that fewer collections are made over a set period, which indicates an increase in\nthe DSO in each collection cycle.\nThings to remember:\nThe operating cycle (OC) measures the time required to convert inventory to cash. The OC consists of days of inventory on hand (DOH) and days\nof sales outstanding (DSO). A company can offset an increase in DOH with a decrease in DSO in order to reduce the overall impact to OC.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 42, "q": "A consultant is evaluating several companies and has collected the following information for the fiscal year: Which company has the best accounts receivable turnover? ", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "A", "expl": "The accounts receivable (AR) turnover ratio measures the number of times, on average, accounts receivable is generated by credit sales and\ncollected as cash during a fiscal period. Credit sales occur when companies allow customers to defer sales invoice payments for a short period of\ntime (commonly 30-60 days). Companies then record the amount owed from the customers as AR.\nA higher AR turnover ratio implies greater efficiency in converting receivables to cash and indicates better liquidity. This efficiency can result from\na firm's effectiveness in receivables collection or from its credit-extension policies (eg, granting trade discount incentives for early payment).\nAR turnover for the three companies are as follows:\nCompany 1 has the highest AR turnover ratio of 3.64, which means that it is the most efficient in collecting its AR among the three companies.\n(Choice B) Company 2 has collected on its AR 2.50 times on average during the year. This means that it was less efficient than Company 1 at\nconverting receivables to cash.\n(Choice C) Company 3 has collected on its AR 3.04 times on average during the year. This means that it was less efficient that Company 1 at\nconverting receivables to cash.\nThings to remember:\nThe accounts receivable (AR) turnover ratio is calculated by dividing credit sales by average AR. A higher AR turnover ratio indicates higher\nefficiency in a company's credit collections.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 43, "q": "Which of the following factors is most likely considered a drag rather than a pull on a company's liquidity position?", "opts": ["Central bank tightening credit", "Accelerating payments to vendors", "Lenders reducing company credit lines"], "ans": "A", "expl": "A company's liquidity position measures its ability to generate cash to meet its short-term obligations. Factors influencing a liquidity position are\ndescribed as:\npulls, which make cash flows going out larger and/or faster (eg, paying accounts payable more rapidly), or\ndrags, which make cash flows coming in smaller and/or slower (eg, collecting accounts receivable more slowly).\nCentral bank credit tightening is a drag on liquidity since tighter credit implies capital is both less available and more expensive, slowing access to\ncapital inflows.\n(Choice B) Accelerating payments to vendors is an increasing pull on liquidity, as cash flows out of the company more quickly. Companies\ntypically do not meet payables before the due date to minimize these pulls. However, companies sometimes pay early to receive discounts or to\nmove recognition of the expense to an earlier tax year.\n(Choice C) Lenders reducing credit lines is a pull on liquidity since a credit line's balance must be paid down more often to keep it below a lower\ncredit limit.\nThings to remember:\nPulls are factors that may accelerate the draining of liquidity from a company. Drags are factors that may slow the flow of liquidity into a company.\nCentral bank credit tightening is a drag on liquidity since tight credit implies capital is both less available and more expensive.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 44, "q": "Which of the following events most likely creates a drag on liquidity for a business?", "opts": ["A supplier has reduced credit limits for purchases made by the business.", "Tightened credit conditions have raised the borrowing costs on new short-term loans.", "A bank has requested a partial repayment on a line of credit after a covenant violation."], "ans": "B", "expl": "Factors that affect liquidity\nDrag Pull\n(slowdown in cash inflows) (speedup in cash outflows)\nUncollected receivables Shorter payment terms from suppliers\nObsolete inventory Lack of collateral to pledge for loans\nHigher borrowing rates Reduced borrowing limits\nBusinesses manage liquidity by managing cash inflows and outflows effectively in the near term. Certain events may drain liquidity through drags\nand pulls. A drag on liquidity generally refers to a slowdown in cash inflows. A pull on liquidity generally refers to an acceleration in cash\noutflows. Both pulls and drags reduce a company's available cash balance.\nA rise in borrowing costs is considered a drag since higher interest rates make obtaining new commercial loans more costly and difficult. Less\nborrowing reduces a company's inflow of funds.\n(Choice A) When suppliers reduce credit limits on purchases, it forces businesses to make payments earlier. This creates a pull on liquidity by\nspeeding up cash outflows.\n(Choice C) A repayment on the amount drawn from a line of credit represents a pull on liquidity since it requires a cash outflow.\nThings to remember:\nBusinesses manage liquidity by managing cash inflows and outflows effectively in the near term. A drag on liquidity generally refers to a slowdown\nin cash inflows. A pull-on liquidity generally refers to a speedup in cash outflows.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 45, "q": "Companies can most likely shorten their cash conversion cycle and generate funds internally by increasing days of:", "opts": ["inventory.", "accounts payable.", "accounts receivable."], "ans": "B", "expl": "Companies can generate funds internally from current assets and liabilities by:\nliquidating current assets,\nincreasing cash inflow from operations, and\nimproving working capital efficiency.\nWorking capital efficiency is improved when the amount of time that operations need cash financing is minimized. This occurs when the time\nrequired to receive cash from customers is reduced and the time for paying cash to creditors is extended. A common indicator of working capital\nefficiency is the cash conversion cycle. This cycle measures the number of days it takes to convert goods purchased from suppliers into cash\nfrom customers, starting from date of payment to suppliers. Firms seek to shorten their cash conversion cycle by:\nincreasing trade creditor days,\ndecreasing the inventory holding period, and\ndecreasing the accounts receivable collection period.\nIncreasing trade creditor days means that a company can finance more of its operations with financing from suppliers (ie, trade credit) instead of\nthe company's own cash. A company can generate internal financing by extending the period between its inventory purchases and the date when\npayment is due to suppliers. This allows the company to retain its cash for a longer period.\n(Choice A) Increasing days of inventory means goods take longer to sell (ie, inventory takes longer to generate cash).\n(Choice C) Increasing days of accounts receivable means the company takes longer to receive cash from sales made on credit.\nThings to remember:\nCompanies can generate funds internally by improving their working capital efficiency through shorter cash conversion cycles. This can be\nachieved by shortening the period between inventory purchases and cash collection from customers, and/or extending the period between\ninventory purchases and payment to suppliers.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 46, "q": "All else being equal, which of the following events most likely improves a company's liquidity position?", "opts": ["Inventory decreases relative to sales", "Accounts receivable increase relative to sales", "Accounts payable decrease relative to inventory"], "ans": "A", "expl": "A company's liquidity position measures its ability to generate cash to meet its short-term obligations. Factors influencing a liquidity position are\ndescribed as:\npulls, which make cash flows going out larger and/or faster (eg, high payables turnover), or\ndrags, which make cash flows coming in smaller and/or slower (eg, low receivables turnover and/or low inventory turnover).\nA company's liquidity position improves if pulls and drags are reduced and worsens if pulls and drags increase.\nIf a company's inventory is declining relative to sales, the company's inventory turnover ratio increases since its inventory is selling faster. All\nelse being equal, inventory is converted to cash more rapidly, reducing a liquidity drag, which improves liquidity.\n(Choice B) All else constant, if accounts receivable increase relative to sales, the average time to collect receivables has increased. This is an\nincreased drag and indicates worsening of liquidity.\n(Choice C) All else constant, if accounts payable decrease relative to inventory, on average accounts payable are being paid faster. This is an\nincreased pull, which worsens liquidity.\nThings to remember:\nPulls relate to factors \"pulling\" liquidity out of a company. Drags relates to the speed of liquidity flowing into a company. Increased pulls and drags\nworsen liquidity. Reduced pulls and drags improve liquidity.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 47, "q": "A company has short-term liquidity needs of €50 million. The following sources of liquidity are available: Liquidity source (€ millions) Accounts payable with terms of 2/10 net 60 25 Accounts receivable sold to a factor at a 40 3.5% discount Bonds with a 3% liquidation cost 30 To cover the company's liquidity needs at the lowest cost, which of the following strategies would least likely be useful?", "opts": ["Sell bonds", "Delay accounts payable", "Sell accounts receivable"], "ans": "C", "expl": "Companies typically have access to many choices for short-term funding, including internal and external sources (eg, credit line). Mismanaging\nshort-term funding can result in paying higher costs or experiencing a shortage of funds. When managing liquidity, a company should ensure that:\navailable sources of funding are sufficient to meet cash needs, especially peak cash needs, and\nthe cost of these sources is not excessive relative to market averages.\nIn this scenario, since the company needs more funding than is available from any one source, it will need to use at least two of these sources.\nThe terms of 2/10 net 60 indicate that the company can use accounts payable as a 60-day funding source or earn a 2% discount if payment is\nmade within 10 days. Thus, ranking the costs of funding sources from lowest to highest:\ndelaying accounts payable costs 2% (ie, forgoing a 2% discount),\nliquidating bonds costs 3%, and\nselling accounts receivable to a factor (ie, factoring receivables) costs 3.5%.\nSince liquidating accounts receivable has the highest cost, the other two sources would be more useful for this company to fulfill its needs at\nminimal cost (Choices A and B).\nThings to remember:\nCompanies must evaluate a range of short-term funding sources to ensure access to sufficient liquidity that meets cash needs (eg, peak cash\nneeds) at a reasonable cost. Mismanaging short-term funding can result in paying higher costs or experiencing a shortage of funds.\nDescribe issuers’ objectives and compare methods for managing working capital and liquidity", "qhtml": null}, {"n": 48, "q": "An analyst is evaluating several companies and has compiled the following information: From 20X1 to 20X2, which company improved the most in days sales outstanding?", "opts": ["Company 1", "Company 2", "Company 3"], "ans": "C", "expl": "Days sales outstanding (DSO), sometimes referred to as days in receivables, calculates the number of days, on average, for a company to\ncollect cash from its customers after sales are made on credit. It measures how quickly a company converts its receivables into cash.\nFaster collection of receivables results in a lower DSO, and this enhances a company's liquidity. By contrast, a higher DSO indicates that\ncustomers are too slow to pay invoices or that the company has poor credit extension policies (eg, not granting trade discount incentives for early\npayment), both of which can act as a drag on liquidity.\nIt is helpful to gauge a company's DSO performance by comparing it across time, to that of the industry average, or to peers.\nCompany 3 showed the most improvement from the previous year. It reduced its DSO by 2.4 days, meaning that it collected its receivables, on\naverage, 2.4 days faster than it did for the previous year.\n(Choice A) Company 1 took 5.0 days longer, on average, to collect its receivables compared to its performance the prior year.\n(Choice B) Although Company 2 improved its DSO from the previous year (−0.3 days), the improvement was less than that of Company 3.\nThings to remember:\nDays sales outstanding (DSO) represents the average length in days for a company to collect its receivables following its sales. A smaller DSO\nvalue can improve a company's liquidity position.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 49, "q": "A firm increasing its number of days of payables will most likely experience:", "opts": ["fewer days in the cash conversion cycle .", "the same number of days in the cash conversion cycle.", "more days in the cash conversion cycle."], "ans": "A", "expl": "The cash conversion cycle (CCC), or net operating cycle (OC), measures the number of days between a company's disbursement of cash to\nsuppliers and receipt of cash from customers. The CCC is equal to the difference between the OC and days payable outstanding (DPO).\nThe OC measures the time required to convert raw inventory to cash from sales. The company first needs time to sell inventory (measured in\nnumber of days of inventory) and then needs time to collect cash from those sales (measured in number of days of receivables). However, the OC\ndoes not consider the cash benefits from delaying time to pay suppliers (measured in DPO).\nThe DPO measures the average number of days to pay suppliers. The effect of changes in DPO is reflected in the CCC. When a company\nsaves cash by delaying payments, it extends its DPO, which reduces (improves) its CCC.\nThings to remember:\nThe cash conversion cycle (CCC) measures the number of days between a company's disbursement of cash to suppliers and receipt of cash from\ncustomers. The CCC is equal to the difference between the operating cycle and the number of days of payables. Extending the DPO reduces\n(improves) the CCC.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 50, "q": "Which of the following factors will most likely result in a pull, rather than a drag, on a company's liquidity position?", "opts": ["Accelerating payments to suppliers", "Increasing levels of obsolete inventory", "Slower collection of accounts receivable"], "ans": "A", "expl": "A company's liquidity position measures its ability to meet short-term cash flow needs. Both pulls (ie, faster cash outflows) and drags (ie,\nslower cash inflows) weaken a company's liquidity position.\nPulls include:\naccelerating payments to suppliers.\nspending more cash for inventory due to cuts in vendor credit.\nDrags include:\nless sales due to inventory obsolescence (Choice B).\nslower collection of accounts receivable (Choice C).\nThings to remember:\nA company's liquidity position is a measure of its ability to meet short-term cash flow needs. Both pulls (ie, faster cash outflows) and drags (eg,\nslower cash inflows) weaken a company's liquidity position.\nExplain liquidity and compare issuers’ liquidity levels", "qhtml": null}, {"n": 51, "q": "An analyst gathers the following information about three companies: Company X Company Y Company Z Days of inventory on hand 70 72 68 Days of sales outstanding 35 37 35 Days of payables outstanding 27 13 22 The company with the shortest cash conversion cycle is most likely: ", "opts": ["Company X.", "Company Y.", "Company Z."], "ans": "A", "expl": "A cash conversion cycle (CCC) is the average number of days it takes a company to collect the cash from a sale of goods after paying\nsuppliers for the materials used to make those goods.\nThe CCC is the sum of the average number of days needed to sell a company's inventory (DOH) and the average number of days needed to\ncollect receivables (DSO), minus the average number of days needed to pay suppliers (DPO). The DPO is subtracted because deferring\npayments to suppliers allows the company to hold cash longer. The lower the CCC, the faster the company turns the purchase of materials into\ncash.\nIn this scenario, the three companies' CCCs are calculated as follows:\nCompany X Company Y Company Z\nDOH 70 72 68\n+DSO 35 37 35\n−DPO 27 13 22\nCCC 78 96 81\nCompany X has the shortest CCC, 78 days.\n(Choice B) Selecting Company Y results from incorrectly adding DPO instead of subtracting it.\n(Choice C) Selecting Company Z results from calculating the operating cycle instead of the CCC. The operating cycle is the sum of DOH and\nDSO, and it excludes DPO.\nThings to remember:\nA cash conversion cycle (CCC) is the number of days needed to turn a company's purchase of materials from suppliers to cash from the sale of\ngoods produced by those materials. The CCC is the sum of the average number of days needed to sell the inventory and the average number of\ndays needed to collect receivables, minus the average number of days needed to pay suppliers.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 52, "q": "An analyst gathers the following data for a company: Based on this information, the accounts receivable turnover is closest to:", "opts": ["3.3", "4.0", "4.5"], "ans": "B", "expl": "Accounts receivable (AR) turnover measures the number of times, on average, that AR are generated by credit sales and collected as cash\nover a period. AR turnover indicates management's effectiveness in managing credit given to customers. Higher AR turnover implies greater\nefficiency in converting receivables to cash and indicates better liquidity.\nAR turnover is calculated as credit sales for the period divided by average receivables. In this case, AR turnover is closest to 4.0.\n(Choice A) 3.3 results from dividing cost of goods sold, not credit sales, by average receivables.\n(Choice C) 4.5 results from dividing credit sales by ending accounts receivable, not average receivables.\nThings to remember:\nAccounts receivable (AR) turnover measures the number of times, on average, that AR are generated by credit sales and collected as cash over a\nperiod. AR turnover is calculated as credit sales for the period divided by average receivables. A higher AR turnover ratio implies greater\nefficiency in converting receivables to cash and indicates better liquidity.\nExplain the cash conversion cycle and compare issuers’ cash conversion cycles", "qhtml": null}, {"n": 53, "q": "A company is building a new plant. The NPV of the plant is projected to be €8 million if demand is high, and −€3 million if demand is low. Both scenarios are equally likely. The company has also secured a 1-year lease on some adjoining land, with an option to buy, to expand the facility if demand is high. The costs of the lease and expected cash flows from the expansion option are: Option cost (1-year lease expense) 0.5 million Annual net cash inflows over 5 years (Years 2–6), if exercised 0.4 million Required rate of return 8% The value of the plant with the option (in EUR) is closest to:", "opts": ["Regulatory", "Expansion", "Replacement"], "ans": "B", "expl": "Categories of capital projects\nProject type Rationale for undertaking project\nReplacement To replace existing equipment due to wear and tear, or to improve efficiency\nExpansion To expand business volume through scaling\nNew products and services To produce new products and provide new services\nRegulatory, safety, and environmental To comply with regulation\nCapital projects take years to complete and require large amounts of monetary investment. Companies group capital projects into various\ncategories, as shown above. In this scenario, the vendor plans to scale up the business by moving it into a restaurant building that would be much\nlarger than the truck. This expansion project would allow the vendor to meet growing demand for the product and increase sales.\n(Choice A) The vendor is not undertaking the project for regulatory compliance purposes.\n(Choice C) Replacement projects are undertaken when existing equipment is worn out. In this scenario, the food truck is being replaced with a\nrestaurant building due to rising customer demand, not due to equipment wear and tear.\nThings to remember:\nCompanies group capital projects into various categories: replacement projects; expansion projects; new products and services; and regulatory,\nsafety, and environmental projects. An expansion project is undertaken when a business needs to scale up its sales volume.\nDescribe types of capital investments", "qhtml": null}, {"n": 54, "q": "A corporation is evaluating two projects with the following cash flows (INR million): Year 0 1 2 3 Project 1 −10 3 6 8 Project 2 −10 8 6 3 Project 1 has a required rate of return of 3% and an internal rate of return (IRR) of 26.9%, while Project 2 has a required rate of return of 8% and an IRR of 38.8%. If the projects are mutually exclusive, the most appropriate investment decision is to invest in: ", "opts": ["Regulatory", "Expansion", "Replacement"], "ans": "B", "expl": "Categories of capital projects\nProject type Rationale for undertaking project\nReplacement To replace existing equipment due to wear and tear, or to improve efficiency\nExpansion To expand business volume through scaling\nNew products and services To produce new products and provide new services\nRegulatory, safety, and environmental To comply with regulation\nCapital projects take years to complete and require large amounts of monetary investment. Companies group capital projects into various\ncategories, as shown above. In this scenario, the vendor plans to scale up the business by moving it into a restaurant building that would be much\nlarger than the truck. This expansion project would allow the vendor to meet growing demand for the product and increase sales.\n(Choice A) The vendor is not undertaking the project for regulatory compliance purposes.\n(Choice C) Replacement projects are undertaken when existing equipment is worn out. In this scenario, the food truck is being replaced with a\nrestaurant building due to rising customer demand, not due to equipment wear and tear.\nThings to remember:\nCompanies group capital projects into various categories: replacement projects; expansion projects; new products and services; and regulatory,\nsafety, and environmental projects. An expansion project is undertaken when a business needs to scale up its sales volume.\nDescribe types of capital investments", "qhtml": null}, {"n": 55, "q": "A street vendor sells pizza from a food truck. To accommodate rapidly rising customer demand, the vendor seeks to replace the food truck with a much larger restaurant building. Which of the following capital budgeting categories best describes this project?", "opts": ["Regulatory", "Expansion", "Replacement"], "ans": "B", "expl": "Categories of capital projects\nProject type Rationale for undertaking project\nReplacement To replace existing equipment due to wear and tear, or to improve efficiency\nExpansion To expand business volume through scaling\nNew products and services To produce new products and provide new services\nRegulatory, safety, and environmental To comply with regulation\nCapital projects take years to complete and require large amounts of monetary investment. Companies group capital projects into various\ncategories, as shown above. In this scenario, the vendor plans to scale up the business by moving it into a restaurant building that would be much\nlarger than the truck. This expansion project would allow the vendor to meet growing demand for the product and increase sales.\n(Choice A) The vendor is not undertaking the project for regulatory compliance purposes.\n(Choice C) Replacement projects are undertaken when existing equipment is worn out. In this scenario, the food truck is being replaced with a\nrestaurant building due to rising customer demand, not due to equipment wear and tear.\nThings to remember:\nCompanies group capital projects into various categories: replacement projects; expansion projects; new products and services; and regulatory,\nsafety, and environmental projects. An expansion project is undertaken when a business needs to scale up its sales volume.\nDescribe types of capital investments", "qhtml": null}, {"n": 56, "q": "A company is using net present value analysis to evaluate an investment that it will finance with borrowed funds. The most appropriate discount rate to use in evaluating the project is the:", "opts": ["project's internal rate of return.", "project's opportunity cost of funds.", "cost of debt capital borrowed to finance the project."], "ans": "B", "expl": "Net present value (NPV) analysis evaluates investments based on the present value of a project's cash flows. NPV is the difference between\nthe present values of the cash outflows and inflows generated by the project. The present values are the nominal cash flows discounted by the\nopportunity cost of funds.\nThe opportunity cost of funds (r) is the rate of return that could be earned on another investment of equivalent risk. Every project must earn at\nleast the return available from comparable projects, given that return also meets the investors' requirements. Therefore, the opportunity cost of\nfunds is the investors' required rate of return and the project's cost of capital and is used as the discount rate in NPV analysis.\n(Choice A) Since the internal rate of return (IRR) does not reflect the investors' required return or the opportunity cost of funds, it is not an\nappropriate discount rate for NPV analysis. The IRR is an alternative to NPV analysis in capital budgeting.\n(Choice C) Discounting by the cost of debt capital borrowed to finance a project is inappropriate since it does not reflect the return necessary to\ncompensate all sources of funds for a project's risk.\nThings to remember:\nNet present value (NPV) analysis evaluates investments based on the present value of project cash flows. A project's NPV is the difference\nbetween cash outflows and inflows discounted by the opportunity cost of funds. The opportunity cost of funds is the rate of return required to\ncompensate investors' for the project's risk and is the project's cost of capital.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 57, "q": "When evaluating mutually exclusive projects, the IRR most likely:", "opts": ["is appropriate for a project with nonconventional cash flows.", "does not provide context regarding the scale of the investment options.", "provides realistic reinvestment assumptions for projects with conventional cash flows."], "ans": "B", "expl": "Problems when using internal rate of return (IRR) to evaluate capital projects\nPotentially more than one IRR exists when future cash flows are negative (eg, expanding original\nMultiple IRR\nproject)\nNo IRR Possible that no IRR exists: no discount rate results in zero net present value (NPV)\nRelative scale A project with small NPV could have high IRR, and one with low IRR could have large NPV\nUnrealistic reinvestment\nUnlikely that firms with high hurdle rates can reinvest at those rates\nassumption\nNet present value (NPV) and internal rate of return (IRR) are the most common methods used to determine a project's profitability in capital\nbudgeting decisions. The general rule is to accept a project if:\nthe project's NPV is positive or\nthe project's IRR is greater than the company's required rate of return.\nA project's IRR is the single discount rate that equates the present value of forecasted cash flows to the initial investment, resulting in a zero NPV.\nIf projects are mutually exclusive, the decision to pursue one project precludes investing in the others. In such cases, a ranking problem (eg,\none project with a higher IRR but smaller NPV than another) could exist.\nSince IRR does not provide context regarding the scale (ie, monetary amount of value added) of investment options, best practice is for a\ncompany to maximize profitability as measured by project NPV. For example, a project may generate an IRR of 20% and NPV of $1 million, but\nan alternative project that generates a 16% IRR and NPV of $3 million adds more value.\n(Choice A) A project with unconventional cash flows can generate multiple IRRs. This complicates the investment decision since there is no way\nto assess which rate is correct, making IRR an inferior measure of project profitability, especially when projects must be ranked.\n(Choice C) The IRR method assumes that a company will be able to reinvest cash flows at the IRR rate. The NPV required rate of return\nassumption (ie, that the company can reinvest at its cost of capital) is considered more conservative and realistic than IRR for all types of cash\nflows.\nThings to remember:\nIf projects are mutually exclusive, a ranking problem could exist between them when making capital budgeting decisions. Since IRR does not\nprovide context regarding the scale of investment options, best practice is for a company to maximize profitability as measured by project NPV.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 58, "q": "An automobile manufacturer has a factory producing low-margin compact cars. The company is considering converting the factory to the production of luxury sedans, financed by borrowing the necessary funds. The company is also considering selling the factory. Using net present value (NPV) analysis, which of the following is least likely an incremental cash flow for investing in luxury sedan production?", "opts": ["Potential proceeds from selling the factory", "Financing costs of funds borrowed to finance investment", "Forgone profits on the compact cars no longer being produced"], "ans": "B", "expl": "Capital budgeting cash flow considerations\nCharacterization Definition Include\nIncremental cash flows Cash flows resulting from decision to invest Yes\nSunk costs Funds spent previously No\nOpportunity costs Returns from alternate use of investment funds or fixed assets Yes\nExternalities Cash flow impacts on other company investments Yes\nFinancing costs Cost of capital to invest No\nPotential investment projects should be evaluated based on their incremental cash flows. Incremental refers to changes in cash flows that\nresult from the decision to invest or not invest in a project. In this scenario, incremental cash flows should include:\nProject cash flows: the costs of retooling the factory and operating cash flows from producing the luxury sedans;\nOpportunity costs: cash flows forgone since the proceeds from selling the factory and operating cash flows from producing compact cars are\nnot realized (Choices A and C); and\nExternalities: the reduction in net revenues from other product lines if customers buy the new luxury sedans instead of other automobiles\nproduced by the company.\nCash flows the company should not consider include:\nSunk costs: the funds previously spent to build and maintain the factory; and\nFinancing costs: the costs factored in when cash flows are discounted using an opportunity cost of capital.\nSubtracting the interest expense from project cash flows amounts to double counting the financing costs.\nThings to remember:\nPotential investment projects should be evaluated based on their incremental cash flows: the changes in cash flows that result from the decision to\ninvest or not invest in a project. Cash flows that should be considered include project operating cash flows, opportunity costs, and externalities.\nSunk costs and financing costs should be excluded.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 59, "q": "When making capital budgeting decisions, which of the following types of investment projects most likely allow management to have the highest level of confidence?", "opts": ["Expansion projects", "Replacement projects", "New products and services"], "ans": "B", "expl": "Categories of capital projects\nRationale Decision considerations\nMost accurate cash flow projections, greatest\nReplacement Worn, broken, or inefficient assets\ncertainty of decisions\nGreater uncertainties over cost and revenues\nExpansion Add capacity for existing products\ncompared with replacement projects\nNew products and Research and development, and investment in Greater uncertainties than expansion projects,\nservices products not yet offered by the company most complex investment decisions\nRegulatory, safety, and Driven by external party (eg, government, insurance Necessary to stay in business, not directly profit-\nenvironmental company) driven like other categories\nPet projects or high-risk Overly optimistic projections, or failure to apply\nCapital allocation error\ninvestments proper project analyses\nProfit-motivated capital budgeting decisions are classified as replacement projects, expansion projects, or introduction of new products and\nservices. Since replacement projects are projects that replace assets already in use, net cash flows can be estimated much more accurately\ncompared to other capital budgeting decisions:\nAcquisition and operating costs: Such assets have been purchased or constructed previously, and there is an operating history on which to\nbase cost estimates.\nRevenues: Previous period revenues and familiarity with the product market's competitive environment allow for better revenue estimates.\nMore accurate cash flow estimates allow managers a higher degree of confidence regarding decisions on replacement projects compared to\ndecisions on other types of projects.\n(Choice A) Although expansion projects also imply an extension of previous investments, they entail more uncertainties than replacement\nprojects. There may be advantages and disadvantages related to the larger scale of operations and reactions of competitors that are difficult to\nquantify. These factors cause expansion project decisions to be more complex.\n(Choice C) Decisions to invest in new products or services are the most complex capital budgeting decisions since they have the greatest\nuncertainties regarding initial cost, operating expenses, and revenues.\nThings to remember:\nCapital budgeting decisions are classified as replacement projects, expansion projects, or introduction of new products or services. Replacement\nprojects' net cash flows can typically be estimated with less uncertainty and therefore less risk compared to other capital budgeting decisions.\nDescribe types of capital investments", "qhtml": null}, {"n": 60, "q": "Which of the following most accurately describes the opportunity cost of funds used in net present value (NPV) analysis of investment projects?", "opts": ["Company's average cost of debt capital", "Expected return on comparable investment projects", "Discount rate that results in projects having a zero NPV"], "ans": "B", "expl": "Net present value (NPV) analysis evaluates investments based on the present value of a project's cash flows. NPV is the difference between\nthe present value of the cash outflows and inflows generated by the project. The present values are the nominal cash flows discounted by the\nproject's required rate of return (r).\nInvestment in a project means forgoing the return that could have been earned from investing in other projects (ie, opportunity cost of funds).\nTherefore, companies require a return that is at least equal to the rate of return available from comparable projects, given that return also meets\nthe investors' requirements.\n(Choice A) A company's average cost of debt capital is inappropriate for valuing an individual project since the average cost is not based on the\nproject's risk or required return.\n(Choice C) The discount rate that results in projects having an NPV of zero is the internal rate of return (IRR). IRR is an alternative capital\nbudgeting method to NPV analysis.\nThings to remember:\nNet present value (NPV) analysis evaluates investments based on the present value of a project's cash flows. NPV is the difference between cash\noutflows and inflows discounted by the opportunity cost of capital. The opportunity cost of capital is the rate of return required to compensate\ninvestors for the project's risk.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 61, "q": "A company plans to retool an automobile factory to produce a new model to replace the existing model. Which of the following is most appropriately considered an opportunity cost? ", "opts": ["Forgone revenue from the existing model", "Interest expense on money borrowed to finance the project", "Decline in sales of another model produced by the company"], "ans": "A", "expl": "Capital budgeting considerations\nDescription Impact on projected cash flows\nSunk costs Costs previously incurred None\nOpportunity Forgone value of using an asset in its next-best\nReduce net cash flows by cash flow forgone\ncosts use\nIgnore if outside of company, adjust cash flows if inside\nExternalities Side effects of project\ncompany\nUsing an asset in one activity often means forgoing its use in some other endeavor. In capital budgeting, an opportunity cost is the net cash flow\nnot realized from an asset being used in some alternative activity. The net cash flows not received from the highest value alternate use of the\nasset are treated as an opportunity cost and subtracted from cash flows projected in the capital budgeting process.\nIn this scenario, a company considers retooling the factory to produce a new model and discontinuing production of the existing model. The\nrevenue no longer earned on the discontinued model is an opportunity cost related to the introduction of the new model. The net cash flows\nprojected for the new model must be reduced by the net cash flows no longer earned on the discontinued model.\n(Choice B) Financing costs are related to the opportunity cost of capital. However, the opportunity cost of capital is not factored into the net cash\nflows from an investment. Financing costs are related to the discount rate used to calculate the cash flows' present value.\n(Choice C) Lost revenues on another model still being sold should be factored into incremental net cash flows. However, this is an example of an\nexternality—specifically, cannibalization—and not an opportunity cost.\nThings to remember:\nIn capital budgeting, an opportunity cost is the net cash flow not realized from an asset since it is used in some alternative activity. The net cash\nflows not received from the highest value alternate use of the asset are treated as an opportunity cost and subtracted from cash flows projected in\nthe capital budgeting process.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 62, "q": "A company's analyst made the following after-tax cash flow projections for two independent investments: Year 0 1 2 3 Project A −36,000 14,000 16,000 16,000 Project B −39,000 15,500 16,500 17,000 The cost of capital is the company's hurdle rate of 12.5%. Based on the internal rate of return (IRR) approach, which of the following actions is most appropriate for the company? ", "opts": ["The price paid for acquiring the land", "The amount the company could realize from selling the land", "The company's costs of debt and equity that are used to finance the factory"], "ans": "B", "expl": "Basic principles of capital budgeting\n1. Decisions are based on cash flows.\n2. Timing of cash flows is crucial.\n3. Cash flows are based on opportunity costs.\n4. Cash flows are analyzed on an after-tax basis.\n5. Cash flows exclude financing costs.\n6. Cash flows are not accounting net income.\nCapital budgeting refers to how companies decide to invest in long-term projects. When analyzing a specific project, a company should\nconsider the project's cash flows from the perspective of opportunity costs: the cash flows if the project is accepted versus what they would be\nif it is not.\nIn this scenario, the company could sell the land instead of building the factory, so the cash received from the potential sale represents an\nopportunity cost of building the factory. The cash received from the sale would be compared to the discounted future cash flows generated from\nthe factory.\nNot all cash flows are relevant to the analysis. Costs that the company previously incurred, such as the price paid for the land, are considered\nsunk costs. Sunk costs are those that cannot be recovered regardless of whether the project is accepted and should not be considered in the\nanalysis (Choice A).\n(Choice C) Financing costs are factored into the company's required rate of return, which is used as the rate to discount the cash flows. Including\nthese costs as separate cash flows would be double counting them.\nThings to remember:\nWhen analyzing a specific project, a company should consider the project's cash flows from the perspective of opportunity costs. Sunk costs,\nwhich are costs that have already been incurred and cannot be recovered regardless of whether the project is accepted, should not be considered\nin the analysis.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 63, "q": "A company considers building a new factory on land that it owns. When deciding whether to proceed with the project, which of the following is most appropriate to include as a cash flow?", "opts": ["The price paid for acquiring the land", "The amount the company could realize from selling the land", "The company's costs of debt and equity that are used to finance the factory"], "ans": "B", "expl": "Basic principles of capital budgeting\n1. Decisions are based on cash flows.\n2. Timing of cash flows is crucial.\n3. Cash flows are based on opportunity costs.\n4. Cash flows are analyzed on an after-tax basis.\n5. Cash flows exclude financing costs.\n6. Cash flows are not accounting net income.\nCapital budgeting refers to how companies decide to invest in long-term projects. When analyzing a specific project, a company should\nconsider the project's cash flows from the perspective of opportunity costs: the cash flows if the project is accepted versus what they would be\nif it is not.\nIn this scenario, the company could sell the land instead of building the factory, so the cash received from the potential sale represents an\nopportunity cost of building the factory. The cash received from the sale would be compared to the discounted future cash flows generated from\nthe factory.\nNot all cash flows are relevant to the analysis. Costs that the company previously incurred, such as the price paid for the land, are considered\nsunk costs. Sunk costs are those that cannot be recovered regardless of whether the project is accepted and should not be considered in the\nanalysis (Choice A).\n(Choice C) Financing costs are factored into the company's required rate of return, which is used as the rate to discount the cash flows. Including\nthese costs as separate cash flows would be double counting them.\nThings to remember:\nWhen analyzing a specific project, a company should consider the project's cash flows from the perspective of opportunity costs. Sunk costs,\nwhich are costs that have already been incurred and cannot be recovered regardless of whether the project is accepted, should not be considered\nin the analysis.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 64, "q": "A project has the following forecasted annual cash flows (in ¥ billions): Year Cash Flow 0 −5 1 15 2 8 3 −20 Based on this information, which of the following discount rates will produce the lowest net present value (NPV)? ", "opts": ["The cost of retooling", "The original cost of the factory before retooling", "The market value of the factory before retooling"], "ans": "B", "expl": "Capital budgeting considerations\nDescription Impact on projected cash flows\nSunk costs Costs previously incurred None\nOpportunity Forgone value of using an asset in its next-best\nReduce net cash flows by cash flow forgone\ncosts use\nIgnore if outside of company, adjust cash flows if inside\nExternalities Side effects of project\ncompany\nCapital budgeting decisions should be based only on a project's expected incremental future cash flows: changes in cash flows that will result from\nan investment under consideration. The basis for making the decision is the amount and/or timing of those future cash flows, including opportunity\ncosts and externalities but excluding sunk costs.\nSunk costs are expenditures previously incurred. Funds already spent (ie, past cash flows) should not factor into the capital budgeting\ndecision. If a project is partially completed and being evaluated while still in the construction phase, its sunk costs are its earlier (ie, incurred to\nthat point) expenditures.\n(Choice A) Retooling the factory is the cost of the investment being evaluated. Since this cost has not yet been incurred, it is not a sunk cost.\n(Choice C) The current market value of the existing factory is an opportunity cost, which the net cash flow forecasts should include.\nThings to remember:\nSunk costs are expenditures previously incurred. Capital budgeting decisions should be based only on a project's expected incremental future—\nnot past—cash flows. Therefore, sunk costs should not be included in the capital budgeting decision.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 65, "q": "A company is evaluating a high-risk investment in a new product line. A facility to produce the new product would be built on land that previously generated rental income of CAD 20,000 per year. The product will benefit from a recently run marketing campaign with a cost of CAD 80,000. Other data related to the investment are as follows: Initial outlay (in CAD) 700,000 Annual after-tax cash flows for 4 years (in CAD) 240,000 Required return on investment 8.0% WACC 6.4% The project's NPV (in CAD) is closest to:", "opts": ["The cost of retooling", "The original cost of the factory before retooling", "The market value of the factory before retooling"], "ans": "B", "expl": "Capital budgeting considerations\nDescription Impact on projected cash flows\nSunk costs Costs previously incurred None\nOpportunity Forgone value of using an asset in its next-best\nReduce net cash flows by cash flow forgone\ncosts use\nIgnore if outside of company, adjust cash flows if inside\nExternalities Side effects of project\ncompany\nCapital budgeting decisions should be based only on a project's expected incremental future cash flows: changes in cash flows that will result from\nan investment under consideration. The basis for making the decision is the amount and/or timing of those future cash flows, including opportunity\ncosts and externalities but excluding sunk costs.\nSunk costs are expenditures previously incurred. Funds already spent (ie, past cash flows) should not factor into the capital budgeting\ndecision. If a project is partially completed and being evaluated while still in the construction phase, its sunk costs are its earlier (ie, incurred to\nthat point) expenditures.\n(Choice A) Retooling the factory is the cost of the investment being evaluated. Since this cost has not yet been incurred, it is not a sunk cost.\n(Choice C) The current market value of the existing factory is an opportunity cost, which the net cash flow forecasts should include.\nThings to remember:\nSunk costs are expenditures previously incurred. Capital budgeting decisions should be based only on a project's expected incremental future—\nnot past—cash flows. Therefore, sunk costs should not be included in the capital budgeting decision.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 66, "q": "A company is considering retooling an existing factory to manufacture a new product. Which of the following is most appropriately considered a sunk cost?", "opts": ["The cost of retooling", "The original cost of the factory before retooling", "The market value of the factory before retooling"], "ans": "B", "expl": "Capital budgeting considerations\nDescription Impact on projected cash flows\nSunk costs Costs previously incurred None\nOpportunity Forgone value of using an asset in its next-best\nReduce net cash flows by cash flow forgone\ncosts use\nIgnore if outside of company, adjust cash flows if inside\nExternalities Side effects of project\ncompany\nCapital budgeting decisions should be based only on a project's expected incremental future cash flows: changes in cash flows that will result from\nan investment under consideration. The basis for making the decision is the amount and/or timing of those future cash flows, including opportunity\ncosts and externalities but excluding sunk costs.\nSunk costs are expenditures previously incurred. Funds already spent (ie, past cash flows) should not factor into the capital budgeting\ndecision. If a project is partially completed and being evaluated while still in the construction phase, its sunk costs are its earlier (ie, incurred to\nthat point) expenditures.\n(Choice A) Retooling the factory is the cost of the investment being evaluated. Since this cost has not yet been incurred, it is not a sunk cost.\n(Choice C) The current market value of the existing factory is an opportunity cost, which the net cash flow forecasts should include.\nThings to remember:\nSunk costs are expenditures previously incurred. Capital budgeting decisions should be based only on a project's expected incremental future—\nnot past—cash flows. Therefore, sunk costs should not be included in the capital budgeting decision.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 67, "q": "With regards to capital budgeting, which of the following statements best describes project interactions?", "opts": ["Mutually exclusive projects do not compete directly for resources.", "When a company has unlimited funds, all projects should be selected.", "Project sequencing refers to undertaking one project based on the outcome of another project."], "ans": "C", "expl": "Companies typically select projects to undertake based on each project's net present values (NPVs). When there are no constraints (eg, limited\nfunds, mutually exclusive projects, time constraints), projects with positive NPVs should be chosen. However, constraints often prevent\ncompanies from doing so. Depending on the situation, certain project interactions (illustrated above) need to be considered.\nWith project sequencing, the ability to start a project is contingent on the completion of another project. For example, the second version of\na device will start production only after the first version of the device proves its potential.\n(Choice A) If two projects are mutually exclusive, then only one can be selected. For example, a company with financing to bring only one\ngaming device to market would have to choose between two prototypes in development.\n(Choice B) Even when a company has access to unlimited funding, projects with negative NPVs should be rejected since they destroy wealth.\nThings to remember:\nConstraints often prevent companies from investing in all profitable projects. Three types of project interactions include project sequencing, capital\nrationing, and mutually exclusive projects. With project sequencing, the ability to begin one project is contingent on the completion of another\nproject.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 68, "q": "A company is considering the introduction of a new product and expects that, as a result, sales of its existing products will decrease. This is best described as a(n):", "opts": ["sunk cost.", "externality.", "opportunity cost."], "ans": "B", "expl": "Capital budgeting cash flow considerations\nCharacterization Definition Include\nIncremental cash flows Cash flows resulting from decision to invest Yes\nSunk costs Funds spent previously No\nOpportunity costs Returns from alternate use of investment funds or fixed assets Yes\nExternalities Cash flow impacts on other company investments Yes\nFinancing costs Cost of capital to invest No\nIn the context of capital budgeting analysis, an externality occurs when a project under consideration affects other company projects.\nCannibalization is a type of externality that results when sales of a company's new product are offset by decreased sales for one of its existing\nproducts; in essence, the new product is a competitor of the existing product.\n(Choice A) Sunk costs are costs incurred in the past as a result of a decision to spend those funds at that time. The past decision to spend those\nfunds cannot be changed; since the introduction of a new product is a capital budgeting decision about how to use new capital, it does not take\ninto consideration sunk costs.\n(Choice C) Opportunity cost is the value of a resource in its next best use. In this situation, the opportunity cost would be the potential revenue of\nusing the same resources to develop a different product.\nThings to remember:\nIn capital budgeting analysis, an externality occurs when a project under consideration affects other company projects. Cannibalization is a type of\nexternality that reduces the number of customers or sales for another product of the company.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 69, "q": "A company has a budget of $100 million for its next fiscal year and is evaluating multiple independent, profitable projects in which to invest. The sum of the projects' initial investments surpasses $100 million, and none are mutually exclusive. Which of the following is most appropriate for the company to employ when evaluating the projects?", "opts": ["Post-auditing", "Capital rationing", "Project sequencing"], "ans": "B", "expl": "Companies regularly evaluate potential projects to see if they will be profitable based on the expected required rate of return for each project. In\nan ideal world, companies would take on every project that was profitable. However, companies often have a limited amount of funds that can be\nput toward potential projects.\nA company uses the capital rationing process to allocate funds to projects when it does not have enough funding for all profitable projects.\nBest practice would be for a company to maximize profitability, measured by the net present value (NPV) of the project or combination of\nprojects within its budget. In this scenario, the company should ration its capital and maximize value by finding the combination of projects with a\ntotal investment of no more than $100 million that also have the highest cumulative NPV.\n(Choice A) Post-auditing is the process of comparing a completed project's actual results to its projected results. This process helps companies\nexplain why results differ from expectations and improve projections for future projects. Post-auditing occurs after a project is completed, so it\nwould not be used in evaluating new projects.\n(Choice C) Project sequencing occurs when the ability to undertake one project is contingent on the success of another (eg, expansion of a\nmanufacturing plant if new machinery performs).\nThings to remember:\nCapital rationing is a process to allocate company funds to projects when the company does not have enough funding for all available profitable\nprojects. Best practice would be for a company to maximize the NPV of the project or combination of projects within its budget.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 70, "q": "An analyst is evaluating the profitability of a five-year expansion project. Which of the following should be used to value the project according to the principles of capital budgeting?", "opts": ["Net income", "Operating profit", "After-tax cash flows"], "ans": "C", "expl": "Basic principles of capital budgeting\n1. Decisions are based on cash flows.\n2. Timing of cash flows is crucial.\n3. Cash flows are based on opportunity costs.\n4. Cash flows are analyzed on an after-tax basis.\n5. Cash flows exclude financing costs.\n6. Cash flows are not accounting net income.\nCapital budgeting is the process that companies use to select the most profitable capital projects. Capital projects involve the initial purchase\nof a long-term asset that generates future cash flow. These decisions are crucial because a company's limited funds will be locked in for the\nduration of the project. Projects can be so grand in scale that the company's success may hinge on selecting the optimal projects.\nCapital budgeting uses after-tax cash flows, not net income. Furthermore, financing costs are ignored in the cash flows because the cost of\ndebt is already factored into the required rate of return.\n(Choice A) Net income cannot be used to evaluate capital projects because accounting net income does not equate to cash flow (Principle 6): net\nincome includes non-cash expenses such as depreciation and amortization. Furthermore, net income includes financing costs (Principle 5).\n(Choice B) Operating profit cannot be used to evaluate capital projects since operating profit is pre-tax (Principle 4). Furthermore, operating\nprofit may include non-cash items such as depreciation and amortization.\nThings to remember:\nCapital budgeting decisions are made using after-tax cash flows. Interest expense is not accounted for in cash flows since interest is a component\nof the discount rate used to discount cash flows.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 71, "q": "A manufacturer is evaluating a plan to replace an existing product with a new product. For the capital budgeting decision, an externality is most appropriately considered to be the company's:", "opts": ["borrowing costs to finance the plan.", "lost net cash flow from the product replaced.", "increased sales of a complementary product."], "ans": "C", "expl": "Capital budgeting considerations\nDescription Impact on projected cash flows\nSunk costs Costs previously incurred None\nOpportunity Forgone value of using an asset in its next-best\nReduce net cash flows by cash flow forgone\ncosts use\nIgnore if outside of company, adjust cash flows if inside\nExternalities Side effects of project\ncompany\nIn capital budgeting decisions, externalities are indirect effects of an investment that are not reflected in its direct cash flows. As such,\nexternalities are not included in the:\ncosts related to acquiring and operating the investment or\nthe net revenue created by the investment.\nExternalities may be positive or negative.\nWhen an investment affects other operations of the company, creating externalities, the related changes in those net cash flows should be\nfactored into the investment decision. For example, if a new product is expected to result in increased sales of a complementary company\nproduct, those projected net cash flows should be included in the capital budgeting analysis of the new product investment.\n(Choice A) Financing costs of an investment are not an externality. They are related to the cost of capital used in evaluating a capital budgeting\ndecision.\n(Choice B) The lost net cash flow of the discontinued product replaced by the new product is considered an opportunity cost of making the\ninvestment, not an externality.\nThings to remember:\nIn capital budgeting, externalities are any effects not included in the costs related to acquiring and operating the investment and the net revenue\ncreated by the investment. When an investment is expected to affect other operations of the company, creating externalities, the related changes\nin those net cash flows should be factored into the investment decision.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 72, "q": "A company plans to replace its old equipment. The replacement equipment would cost AUD 20 million, and the cash flows (in AUD millions) are expected to be: Projected Cash Flows (AUD) Year 1 2 3 4 Cash Flow 4 8 8 4 Based on this information, the internal rate of return (IRR) for replacing the equipment is closest to:", "opts": ["A only.", "B only.", "both A and B."], "ans": "A", "expl": "NPV and IRR criteria are commonly used to make capital investment decisions. The general rule is to accept a project if:\nthe project's NPV is positive or\nthe project's IRR is greater than the required rate of return (ie, hurdle rate).\nFor independent projects with conventional cash flows, the NPV and IRR lead to the same investment decision. When a project has a positive\nNPV, IRR will always be greater than the project's required rate of return, and vice versa.\nIRR and NPV can produce conflicting rankings when projects are mutually exclusive (ie, the firm can accept only one project). NPV is a better\ncriterion than IRR since the NPV model:\nshows the amount of value added to the firm, whereas IRR shows only the rate of return, not the actual value added. In this case, Project B\nhas a higher IRR (24.3%) that translates into a lower NPV of £18.10 million (as per the calculations below). The greater the NPV, the more\nvalue added to the firm.\nuses a more conservative reinvestment rate. The discounted cash flow analysis implicitly assumes cash flows are reinvested at the discount\nrate, which is the required rate of return (for NPV) or the IRR. Required rates of return are returns that could be earned on equivalent\nprojects, so NPV reflects a more realistic reinvestment assumption.\n12 30 55\n= −60 + + + = 20.49\nNPV of Project A\n(1 + 0.08)1 (1 + 0.08)2 (1 + 0.08)3\n60 45 5\n= −80 + + + = 18.10\nNPV of Project B\n(1 + 0.08)1 (1 + 0.08)2 (1 + 0.08)3\nThe company should choose Project A since the projects are mutually exclusive and Project A has a greater NPV than Project B.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC),\nand contrast their use in capital allocation LOS\n22. In forecasting cash flows for capital budgeting decisions, managers most appropriately exclude:\n A. sunk costs.\nB. externalities.\nC. opportunity costs.\nExplanation\nThe capital allocation process is a series of steps typically undertaken in making a capital investment decision. The process assumes that the\ndecision is based on cash flow analysis. When analyzing a project as a capital investment opportunity, not all costs are included in estimating\nthe project's cash flows.\nCosts excluded from the cash flow estimate are:\nSunk costs, which are cash outflows incurred prior to the investment decision. Since these costs exist regardless of the decision, they do\nnot represent a cost of the project and are therefore not included in the estimate.\nFinancing costs (interest costs), which are already reflected in the required rate of return used to discount after-tax cash flows and are\ntherefore not included.\nCosts included in the cash flow estimate are:\nExternalities, which are the positive (eg, synergy) or negative (eg, cannibalization) effects that an investment would have on other projects\nor business activities within the company. Externalities are included since they would affect the firm's overall cash flow (Choice B).\nOpportunity costs, which represent income that may be generated if the resources for the project are invested elsewhere (ie, the second-\nbest use). Opportunity costs would affect cash flows and are therefore included (Choice C).\nThings to remember:\nThe capital allocation process is a series of steps typically undertaken in making a capital investment decision. The process assumes that the\ndecision is based on cash flow analysis. Sunk costs are incurred prior to making the investment decision and are therefore not included in the\ninvestment's estimated cash flows.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation\n23. When establishing a company's investment decision-making process, which of the following recommendations would be most appropriate?\n A. Ignore sunk costs as part of the investment analysis.\nB. Use ROE as a key determinant in investment decisions.\nC. Rely primarily on allocation templates to improve turnaround.\nExplanation\nCommon pitfalls in capital allocation\nImproper discount
