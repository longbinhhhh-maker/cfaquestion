 rates\nCalculation mistakes Accounting errors\nPoor estimates of overhead cost\nMisuse or overuse of allocation templates\nFavoring IRR for investments with uneven cash flows\nProcess deficiencies\nIncluding sunk costs\nIgnoring opportunity costs\nFailing to capture competitor response to investments\nLack of scrutiny around pet projects\nFlawed managerial decision-making Reliance on short-term metrics (ie, EPS, ROE)\nOverspending or underspending allocation budgets\nFailing to consider investment alternatives\nThe general principles of capital allocation (ie, investment decision-making) are often very difficult to apply since:\nsome decisions are subjective, requiring a manager's judgment, and\ncertain risks may be hard to capture in capital allocation models.\nA robust capital allocation process does not include sunk costs (ie, unrecoverable costs incurred in the past). Only costs that directly affect or are\naffected by the investment decision should be considered; therefore, sunk costs should be disregarded.\n(Choice B) Focusing on ROE instead of NPV may not lead to investments that improve long-term shareholder wealth. Often, companies focus\non ROE to boost short-term performance; investments with large NPVs may take time to become profitable and would not improve short-term\nperformance.\n(Choice C) Investment allocation templates might improve efficiency in the decision-making process, but the characteristics of investment\nopportunities that do not fit into the standardized template may be inadvertently ignored. Instead of quick turnaround, a strong capital allocation\nprocess should focus primarily on properly capturing investment characteristics.\nThings to remember:\nThere are several common pitfalls that companies may face when making investment decisions. Investment analysts should disregard sunk\ncosts, avoid relying on allocation templates, and focus on NPV instead of metrics like ROE, which typically has a short-term focus.\nDescribe principles of  today. If the company renovates the building, it will have to invest $100 million immediately. The company also will have to borrow the $100 million at a 6% annual interest rate. If the company decides to renovate, the project's initial cash outlay ($ millions) is closest to: ", "opts": ["600", "602", "606"], "ans": "A", "expl": "Cash flows $ in millions Include in cash flow?\nMarket research 2 No, sunk cost\nOpportunity cost of not selling building 500 Yes, opportunity cost\nRenovation costs 100 Yes, initial investment\nInterest cost on loan 6 No, financing cost\nCapital budgeting is the process companies use to select the most profitable capital projects; projected cash flows are useful for evaluating\neach potential project. Capital projects usually involve an initial cash outlay followed by a series of cash inflows. In addition to direct inflows and\noutflows, opportunity costs should be considered when estimating a project's cash flows.\nIn this scenario, if the company uses the building instead of selling it, the sale offer represents opportunity cost. This cost should be included in\nthe net cash flow for Year 0 along with the renovation costs, resulting in an initial cash outlay of $600 million ($500 million + $100 million).\n(Choice B) $602 million includes the market research, a sunk cost that is irrelevant to future investment decisions.\n(Choice C) $606 million includes the interest cost for the loan. Financing costs are not included in cash flows since they are implicitly reflected in\nthe required rate of return.\nThings to remember:\nIn capital budgeting, some cash flows that are not directly part of a project represent an opportunity cost and should be included in the investment\ndecision. Sunk costs are not relevant to the investment decision. Financing costs are not included in cash flows since they are implicit in the\nrequired rate of return.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 77, "q": "A corporation is investing in a three-year project that generates the following after-tax cash flows: Year 0 1 2 3 Cash flow (€) −20,000 10,000 15,000 17,000 If the weighted average cost of capital (WACC) is 10%, the net present value (NPV) is closest to: ", "opts": ["Project A", "Project B", "Project C"], "ans": "C", "expl": "Capital rationing is the process of allocating limited funds to the most profitable project(s). When projects are mutually exclusive, only one\nproject can be selected. Net present value (NPV) is the best profitability indicator for project selection. NPV is calculated as the sum of the\nproject's discounted cash flows minus the initial outlay. Positive NPV is the best measure of profitability; therefore, the manager should choose\nProject C.\nThe internal rate of return (IRR) is another commonly used measure of profitability. IRR is the discount rate that equates the present value of the\nfuture cash flows to the initial outlay, effectively causing NPV to be zero. Project A has the highest IRR, but it is not the optimal selection (Choice\nA).\nNPV is better than the IRR due to more conservative reinvestment assumptions. NPV assumes reinvestment of cash flows at the weighted\naverage cost of capital, which is frequently lower than the IRR. Furthermore, NPV is preferred since gains are measured in currency amounts, not\nin percentage terms.\n(Choice B) The discounted payback period is a measure of liquidity. The drawback to liquidity measures is that they consider how quickly an\ninvestment can be recovered but fail to consider the profitability of the investment. Project B has the lowest (best) discounted payback period, yet\nit has the worst profitability as indicated by both NPV and IRR.\nThings to remember:\nWhen projects are mutually exclusive, select the project with the highest net present value (NPV). NPV is the best metric for determining the most\nprofitable project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 78, "q": "A finance manager collects the following data on three projects: The weighted average cost of capital is 11%. The company has limited capital and the projects are mutually exclusive. Which project is the company's best choice?", "opts": ["Project A", "Project B", "Project C"], "ans": "C", "expl": "Capital rationing is the process of allocating limited funds to the most profitable project(s). When projects are mutually exclusive, only one\nproject can be selected. Net present value (NPV) is the best profitability indicator for project selection. NPV is calculated as the sum of the\nproject's discounted cash flows minus the initial outlay. Positive NPV is the best measure of profitability; therefore, the manager should choose\nProject C.\nThe internal rate of return (IRR) is another commonly used measure of profitability. IRR is the discount rate that equates the present value of the\nfuture cash flows to the initial outlay, effectively causing NPV to be zero. Project A has the highest IRR, but it is not the optimal selection (Choice\nA).\nNPV is better than the IRR due to more conservative reinvestment assumptions. NPV assumes reinvestment of cash flows at the weighted\naverage cost of capital, which is frequently lower than the IRR. Furthermore, NPV is preferred since gains are measured in currency amounts, not\nin percentage terms.\n(Choice B) The discounted payback period is a measure of liquidity. The drawback to liquidity measures is that they consider how quickly an\ninvestment can be recovered but fail to consider the profitability of the investment. Project B has the lowest (best) discounted payback period, yet\nit has the worst profitability as indicated by both NPV and IRR.\nThings to remember:\nWhen projects are mutually exclusive, select the project with the highest net present value (NPV). NPV is the best metric for determining the most\nprofitable project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 79, "q": "All else equal, the net present value (NPV) analysis for which of the following types of projects correctly uses the highest discount rate?", "opts": ["Expansion projects", "Replacement projects", "New products and services"], "ans": "C", "expl": "Categories of capital projects\nRationale Decision considerations\nMost accurate cash flow projections, greatest\nReplacement Worn, broken, or inefficient assets\ncertainty of decisions\nGreater uncertainties over cost and revenues\nExpansion Add capacity for existing products\ncompared with replacement projects\nNew products and Research and development, and investment in Greater uncertainties than expansion projects,\nservices products not yet offered by the company most complex investment decisions\nRegulatory, safety, and Driven by external party (eg, government, insurance Necessary to stay in business, not directly profit-\nenvironmental company) driven like other categories\nPet projects or high-risk Overly optimistic projections, or failure to apply\nCapital allocation error\ninvestments proper project analyses\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments in new products and services are riskier, so a company would require a higher expected return. This results in a higher discount\nrate for NPV analysis compared with other types of projects. The greater uncertainty of success may mean more difficulty in estimating both the:\ncosts, since the firm has no experience developing the product or service, or acquiring and managing the operations it requires, and\nrevenues, since it is difficult to estimate either the size of the market for a product or service that did not previously exist or the potential\nmarket share for a product introduced amid existing competition.\n(Choice A) Expansion projects enlarge or replicate existing facilities, so the firm could estimate the investment's cost based on experience and\nforecast revenues from existing operations. Therefore, all else equal, expansion projects are less risky, which allows for a lower discount rate.\n(Choice B) Replacement projects replace operating assets to maintain a company's existing size. In general, such projects do not affect revenue\nforecasts, and the firm can base cost estimates on experience; therefore, all else equal, replacement projects are the least risky and use the\nlowest discount rate.\nThings to remember:\nCapital projects are classified as replacement projects, expansion projects, or introductions of new products and services. All else equal,\ninvestments to develop, make, and sell new products and services are riskier than other types of projects and therefore require higher discount\nrates.\nDescribe types of capital investments", "qhtml": null}, {"n": 80, "q": "A company invests in Project X in 20X8 and plans to invest in Project Y in 20X9 only if Project X is financially successful. This project interaction is best described as:", "opts": ["capital rationing.", "mutually exclusive.", "project sequencing."], "ans": "C", "expl": "Companies often make choices among possible projects since there are constraints that prevent them from pursuing all net present value (NPV)\npositive projects. Depending on the circumstances, these project interactions include:\nproject sequencing,\ncapital rationing, or\nmutually exclusive projects.\nWith project sequencing, projects are lined up sequentially through time, so that investing in Project X creates the option to invest in Project Y.\nThe decision to invest in Project Y (or other future projects) will be based on the completion and success of Project X. For example, a company\nmay begin delivery services in a new region. Depending on the success of the delivery service, the company will decide whether to build a\ndistribution center in that region.\n(Choice A) Capital rationing is the process of allocating limited resources (at any one time) to the most profitable combination of projects. This\noccurs when a company has more positive NPV projects than its resources will allow it to pursue.\n(Choice B) Mutually exclusive projects are those that compete directly with each other, so only one project can be selected. This is usually due to\na resource constraint.\nThings to remember:\nProject sequencing is the process of lining up projects sequentially through time. A company invests in a project and bases the decision to pursue\nfuture projects on the success of the previous project.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 81, "q": "In capital budget decisions, which of the following best describes a project sequencing interaction?", "opts": ["Ranking investment selections based on projects' net present values", "Choosing projects with shorter payback periods to speed reinvestment of capital", "Investing in a project today to create the option to invest in another, future projects"], "ans": "C", "expl": "Companies regularly evaluate the potential profitability of projects based on their expected cash flows. With no constraints, companies could take\non every project that has a positive net present value (NPV). However, companies are often forced to make choices since constraints prevent\nthem from pursuing all profitable projects or can mandate a specific order of project completion. Depending on the circumstances, these project\ninteractions include:\nproject sequencing,\ncapital rationing, and\nmutually exclusive projects.\nWith project sequencing, the ability to undertake one project is dependent on the completion of another. For example, the successful\ncompletion of one project may create the option to invest in future contingent projects, assuming favorable economic conditions at that time.\n(Choice A) Ordering investment selections based on projects' net present values is a common criterion for making investment decisions but is not\nrelated to project sequencing.\n(Choice B) Choosing projects with shorter payback periods to speed the reinvestment of funds is one criterion for making investment decisions,\nbut it not related to project sequencing. The payback period is deemed an inferior criterion to NPV since it does not account for performance over\nthe entire life of the investment.\nThings to remember:\nProject sequencing, capital rationing, or mutual exclusivity are constraints that can prevent companies from pursuing all profitable projects or\nmandate a specific order of project completion. With project sequencing, the ability to undertake one project is contingent on the successful\ncompletion of another.\nDescribe the capital allocation process, calculate net present value (NPV), internal rate of return (IRR), and return on invested capital (ROIC), and\ncontrast their use in capital allocation", "qhtml": null}, {"n": 82, "q": "A company is evaluating the production of a new product that requires an initial outlay of CHF 1 billion. The product is expected to produce after-tax cash flows of CHF 250 million for six years. The company anticipates that the new product will reduce existing product sales, net of variable costs, by CHF 50 million each year the new product is sold. Based on only this information, the project's IRR is closest to:", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 83, "q": "A project with an initial investment of CNY 7.0 million generates the following after-tax cash flows: If the required rate of return is 15%, the net present value (in CNY millions) is closest to: ", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 84, "q": "A company undertakes an average-risk project, which is 100% financed with debt and generates relevant overhead costs. One year later, the CFO realizes that the project's NPV had been significantly overestimated. Which of the following capital allocation mistakes would most appropriately explain this overestimation?", "opts": ["Overestimating overhead costs", "Disregarding ROE when analyzing the project", "Using the cost of debt to discount the projected cash flows"], "ans": "C", "expl": "A company's management uses the capital allocation process when making capital investment decisions. One important assumption of this\nprocess is that financing costs are ignored when estimating the project cash flows since they are already reflected in the discount rate. The\nappropriate discount rate is the required rate of return, which is:\nthe minimum return an investor will accept when undertaking a project,\na risk-adjusted discount rate, and\nproject-specific, so riskier projects will require a higher rate.\nThe required rate of return is also called the opportunity cost of capital since the company estimates returns of comparable projects and selects\nthe best alternative(s) to invest. All undertaken projects become part of the company's portfolio, which is financed by a mix of equity and\ndebt instruments. Equity investors' required rate of return is defined by this capital structure, adjusted by the risk profile of each project.\nEven for an average-risk project, the cost of debt will always be lower than this required rate of return, which reflects the greater risk to equity\ninvestors (ie, cost of equity). Therefore, discounting the cash flows by the cost of debt underestimates the required return and overestimates\nthe project's NPV.\n(Choice A) Incorrectly estimating overhead costs generated by the project is a common capital allocation mistake. Overestimating overhead\nwould result in an underestimated NPV.\n(Choice B) ROE is a short-run accounting number and should not be included in the investment decision, which should be based on cash flow\nanalysis and focused on the long-term interest of shareholders.\nThings to remember:\nA project's cash flow should be discounted by the proper risk-adjusted discount rate, the required rate of return. Discounting it by only the cost of\ndebt is a mistake that will result in an overestimated NPV.\nDescribe principles of capital allocation and common capital allocation pitfalls", "qhtml": null}, {"n": 85, "q": "A company considers whether it should increase its production capacity based on a 50% probability that export restrictions will be lifted and demand will increase. Managers gather the following data (in SEK millions): Current production facility NPV 30 Cost of license to expand production facility 10 Value of option to expand 20 The value of the production facility with the option (in SEK millions) is closest to:", "opts": ["20", "30", "40"], "ans": "C", "expl": "Real option classifications\nReal option type Flexibility offered to:\nTiming Delay an investment decision until more information becomes available (eg, project sequencing)\nFundamental Undertake projects only when fundamentals of underlying asset are favorable (eg, oil refineries)\nAbandon a project (ie, abandonment option)\nSizing\nExpand (ie, growth option)\nPrice-setting Increase prices with demand\nChange output volume\nProduction-flexibility Use alternative input\nProduce different output\nA real option arises during normal business activities or operations when management has some flexibility in the investment decision process.\nWhen evaluating investment projects, management should consider whether any real options are embedded in or linked to a project and the\nvalue they add to the project.\nA production-flexibility option allows management to alter production to manage demand-supply mismatches. It offers flexibility to:\nuse alternative inputs,\nchange output volume, and\nproduce different outputs.\nIn this scenario, the option gives the firm flexibility to increase production as demand increases. The option value takes into account that the\noption will be exercised only under favorable conditions and reflects the probability of those conditions. Firms typically use the NPV criterion to\nevaluate a capital investment with a real option. The NPV of the production facility can be calculated as follows:\nProduction facility's NPV = NPV without option − Cost of option + Value of option\n= 30 million − 10 million + 20 million\n= SEK 40 million\n(Choice A) SEK 20 million results from considering only the project's initial NPV and the option cost. When calculating total project value, the\noption value should also be considered.\n(Choice B) SEK 30 million results from incorrectly multiplying the option value by the probability of demand rising (ie, probability of the option\nbeing exercised).\nThings to remember:\nWhen evaluating investment projects, management should consider whether any real options are embedded in or linked to a project, as well as\nthe value of the option(s). The investment decision will then be based on total project NPV, which considers both the cost and the value of the\noption(s).\nDescribe types of real options relevant to capital investments", "qhtml": null}, {"n": 86, "q": "Which of the following companies will most likely employ the greatest amount of debt relative to its equity?", "opts": ["A real estate developer during its initial growth phase", "A cyclical car manufacturer during an economic downturn", "A consulting firm that uses highly paid consultants and few physical assets"], "ans": "A", "expl": "A firm will typically increase the proportion of debt in its capital structure as it matures through its life cycle. In early (ie, start-up) stages,\nbusinesses have very limited access to debt due to high operating risk and unstable cash flows. In general, as a business gradually matures,\nmore funds can be borrowed since increased revenues and stable cash flows are opening the firm to more potential lenders. However, there are\nexceptions to this tendency for capital-intensive, capital-light, and cyclical businesses.\nCapital-intensive firms (eg, companies operating in real estate, utilities, or transportation) require relatively high levels of debt financing to\npurchase fixed assets during any stage of the life cycle. For example, a real estate developer would most likely have a lot of debt, even in its\nearly stages.\nCapital-light firms (eg, consulting firms, software companies) have fewer capital expenditures. Such companies often require little debt\nfinancing throughout the life cycle (Choice C).\nCyclical firms (eg, car manufacturers, mining companies) have more volatile revenues and cash flows that fluctuate with economic cycles. This\nvolatility reduces their debt capacity, especially during an economic downturn (Choice B).\nThings to remember:\nGenerally, firms will borrow more funds as they mature and thus have proportionately more debt in their capital structure. However, exceptions to\nthis tendency exist for capital-intensive, capital-light, and cyclical businesses.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 87, "q": "Analysts most appropriately use the company's weighted average cost of capital to determine a project's:", "opts": ["value.", "future cash flows.", "investment opportunity schedule."], "ans": "A", "expl": "A company's weighted average cost of capital is the rate the company pays for new capital to fund new projects, which typically require cash\noutflows to generate cash inflows. Inflows and outflows may occur throughout the project's life. The project's value is the net present value of\nits cash inflows and outflows. The discount rate used to find that the present value is the WACC. Therefore, analysts use the WACC to\ncalculate a project's value.\n(Choice B) A project's future cash flows are estimated by making assumptions about the project's need for cash (ie, outflows) and its ability to\ngenerate cash (ie, inflows). The WACC is then used to discount those cash flows to find the project's net present value.\n(Choice C) The investment opportunity schedule (IOS) is a graph of all the company's projects ranked from highest to lowest return against the\ncumulative amount of new capital needed for each project. A company's WACC does not determine the IOS.\nThings to remember:\nA company's weighted average cost of capital (WACC) is the rate the company pays for new capital to fund new projects, which typically require\ncash outflows to generate cash inflows. The project's value is the net present value of its cash inflows and outflows. The discount rate used to\nfind that present value is the WACC, so analysts use the WACC to find a project's value.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 88, "q": "An analyst wants to calculate a company's weighted average cost of capital (WACC) and compiles the following data: Weight of debt 20% Market yield on similar BBB debt 8% Corporate tax rate 30% Weight of preferred stock 10% Preferred dividend £2.00 Preferred stock share price £40.00 Weight of common stock 70% Last common dividend £1.90 Expected common dividend £2.00 Common dividend growth rate 5% Common stock share price £50.00 The analyst believes that the company's debt should be rated BBB. If the analyst uses the debt-rating approach to calculate the cost of debt and the dividend discount model (DDM) approach to calculate the cost of equity, the WACC is closest to:", "opts": ["7.79%", "7.92%", "8.40%"], "ans": "B", "expl": "The weighted average cost of capital (WACC) for a company is the weighted average cost of the different sources of capital. Suppliers of capital\nrequire risk-adjusted returns. The most common sources of capital include equity, preferred stock, and debt.\nCalculate costs of each capital source:\nInsert variables to calculcate WACC:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n4.All else equal, if a firm maintains a larger proportion of equity in its actual capital structure than in its target structure, the most likely reason is\nthat:\nA. the stock is currently trading at a historic low price.\n B. the stock will be included in an index once it reaches a greater market capitalization.\nC. management is raising capital for an infrastructure project that produces stable cash flows.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nA firm's stated capital structure (ie, mix of debt and equity) policy is often based on how much debt the firm can assume. Mature companies\ntypically prefer to issue debt since debt is cheaper than equity and its market value is more predictable. Debt such as tax shields (from interest\ndeductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of financial distress and bankruptcy.\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. At this optimal ratio of debt to equity,\nthe difference between the expected benefits and costs of debt is maximized.\nIn reality, capital structures often deviate from their optimal targets for the reasons shown in the table above. For example, investors may\ndesire an increase in a company's market cap to satisfy index listing requirements. In response, the company may issue more public equity, which\ncan cause the actual capital structure to deviate from the target.\n(Choice A) Firms tend to issue equity when the share price is high, not low. When the share price is low, the proceeds from the issuance will also\nbe low.\n(Choice C) The type of capital raised for a project depends largely on the project's nature. An infrastructure project with stable cash flows is well\nsuited to servicing debt, so the firm in this instance would more likely increase the proportion of debt, not equity, in its capital structure.\nThings to remember:\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from their\ntarget capital structures. A firm may issue more equity to have its stock listed in an index, causing a deviation from the target capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 89, "q": "All else equal, if a firm maintains a larger proportion of equity in its actual capital structure than in its target structure, the most likely reason is that:", "opts": ["the stock is currently trading at a historic low price.", "the stock will be included in an index once it reaches a greater market capitalization.", "management is raising capital for an infrastructure project that produces stable cash flows."], "ans": "B", "expl": "Reasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nA firm's stated capital structure (ie, mix of debt and equity) policy is often based on how much debt the firm can assume. Mature companies\ntypically prefer to issue debt since debt is cheaper than equity and its market value is more predictable. Debt such as tax shields (from interest\ndeductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of financial distress and bankruptcy.\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. At this optimal ratio of debt to equity,\nthe difference between the expected benefits and costs of debt is maximized.\nIn reality, capital structures often deviate from their optimal targets for the reasons shown in the table above. For example, investors may\ndesire an increase in a company's market cap to satisfy index listing requirements. In response, the company may issue more public equity, which\ncan cause the actual capital structure to deviate from the target.\n(Choice A) Firms tend to issue equity when the share price is high, not low. When the share price is low, the proceeds from the issuance will also\nbe low.\n(Choice C) The type of capital raised for a project depends largely on the project's nature. An infrastructure project with stable cash flows is well\nsuited to servicing debt, so the firm in this instance would more likely increase the proportion of debt, not equity, in its capital structure.\nThings to remember:\nIn theory, an optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from their\ntarget capital structures. A firm may issue more equity to have its stock listed in an index, causing a deviation from the target capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 90, "q": "Based on the pecking order theory, when a company issues equity, management is most likely signaling that:", "opts": ["the stock is overvalued.", "the company can pay larger dividends.", "they have confidence in meeting future commitments."], "ans": "A", "expl": "Information asymmetry arises from the fact that a company's managers know more about the company and its prospects than the company's\ninvestors. Investors realize this and try to interpret signals based on how management conducts the business, including raising capital.\nThe pecking order theory suggests that managers prefer to raise capital through methods that require the least amount of disclosure, thus\nproviding investors with the least amount of information necessary. Based on this theory, issuing equity is the least preferred method since it\nrequires significant disclosure and is scrutinized by investors. Equity issues may indicate that managers believe:\nthe company's prospects are not encouraging. If prospects were better, managers would hesitate to dilute their ownership.\nthe stock is overvalued and therefore a good form of financing to fund projects or acquisitions. Managers would be reluctant to issue stock if\nthey thought it was undervalued.\n(Choice B) The pecking order theory does not link the method of financing to dividend payments. However, since equity issues indicate future\nprospects are not encouraging, they are unlikely to indicate that the company can pay larger dividends.\n(Choice C) The issuance of debt would indicate that management has confidence in meeting future commitments since additional debt commits\nthe company to future obligations.\nThings to remember:\nThe pecking order theory suggests that managers prefer raising capital through methods that provide investors with the least amount of\ninformation necessary. Issuing equity is the least preferred method since it indicates to investors that management believes the company's\nprospects are not encouraging or that the stock is overvalued.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 91, "q": "According to the Modigliani-Miller propositions (with taxes), if a company increases its debt level, its market value will most likely:", "opts": ["decrease since the costs of financial distress are increasing.", "remain the same since the market value is unaffected by the capital structure.", "increase proportionally to the change in debt."], "ans": "C", "expl": "The Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no transaction or bankruptcy costs, and symmetric\ninformation) and assert that a company's market value equals the present value of its future cash flows. Modigliani and Miller propose that, in the\nabsence of taxes:\nA company's capital structure does not affect its value (MM I without taxes); and\nA company's cost of equity (r ) is directly proportional to its debt-to-equity ratio (D/E), but WACC remains constant (MM II without taxes).\ne\nHowever, these propositions change when there are corporate taxes:\nThe market value of a levered company is greater than the value of an unlevered but otherwise identical company; tax-exempt interest\npayments improve the levered company's cash flows, increasing its value. The difference in value is the amount of the debt tax shield (tD),\nwhich is the product of a company's tax rate (t) and value of debt (D) (MM I with taxes).\nA company's r is directly proportional to D/E, adjusted by (1 − t). Greater leverage will increase the cost of equity, but at a slower pace\ne\ndue to taxes. The greater the tax rate (t), the slower the increase in r when D/E increases (MM II with taxes).\ne\nTherefore, with taxes, an increase in debt will proportionally increase a company's value and reduce its WACC.\n(Choice A) The MM propositions assume no cost of financial distress.\n(Choice B) The market value would remain the same in the absence of taxes.\nThings to remember:\nThe Modigliani-Miller (MM) propositions assume perfect capital markets (ie, no arbitrage, no transaction or bankruptcy costs, and symmetric\ninformation). When these propositions include corporate taxes, greater leverage will increase a company's market value (MM I) and reduce its\nWACC (MM II).\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 92, "q": "A company is evaluating two projects. Project A has an IRR of 6.4%, and Project B has an IRR of 7.5%. The company has the following information: Next year's dividend ¥40 Dividend growth rate 2.5% Stock price ¥500 After-tax cost of debt 5.0% Debt-to-equity ratio 80% Assuming average risk and no capital constraints, the company should most likely invest in:", "opts": ["both projects.", "only Project B.", "neither project."], "ans": "C", "expl": "A company's weighted average cost of capital (WACC) measures its cost to raise additional capital, assuming new projects are funded by the\nsame proportions of capital. WACC is often used to evaluate the potential profitability of new projects. When projects have average risk, an\ninternal rate of return (IRR) that is less (greater) than the company's WACC means the project is deemed unprofitable (profitable) since its\nreturn is less (greater) than the company's opportunity cost of capital.\nIn this question, to calculate the WACC the cost of equity component must be derived via the Gordon growth model, then the weights of debt and\nequity must be derived from the company's debt-to-equity (D/E) ratio. This can be done as follows:\nThe company's WACC is 8.06%. Since both projects have IRRs that are less than the company's WACC, the company should invest in neither\nproject.\n(Choice A) The company would invest in both projects if the D/E ratio were misinterpreted as the percentage of the company's capital financed by\ndebt when calculating the WACC. This would result in a WACC of 6.1%.\n(Choice B) The company would invest only in Project B if the dividend growth rate were not added to (D /V ) when calculating the cost of equity\n1 0\n(8%). This would result in a WACC of 6.67%.\nThings to remember:\nA company's weighted average cost of capital (WACC) measures its cost to raise additional capital. When projects have average risk, an internal\nrate of return (IRR) less than the company's WACC means the project is deemed unprofitable since its return is less than the company's\nopportunity cost of capital.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 93, "q": "If senior management is compensated with stock options, that would most likely provide an incentive for it to pursue which of the following strategies?", "opts": ["Decrease leverage", "Practice risk avoidance", "Increase share buybacks"], "ans": "C", "expl": "Companies have many stakeholder groups, each with its own priorities and concerns. The groups may be affected differently by company actions,\nwhich can put various stakeholders at odds with each other.\nDifferent compensation structures are used to align management's interests with the interests of shareholders (ie, to maximize wealth), but can\nsometimes have the opposite effect. These include paying out bonuses in shares or stock options based on company performance.\nStock options are assumed to align management and shareholder interests since, in effect, they turn managers into shareholders. Options are in\nthe money (ie, have an intrinsic value) when the market price exceeds the options' exercise price; this provides an incentive for management to\nincrease a company's value and thus increase the market price.\nShare price is also affected by changes in capital structure. In a share buyback, management uses available cash to reduce the number of\noutstanding shares, which increases the price per share since total company value is unchanged. Stock options would encourage\nmanagement to buy back outstanding shares even when they are overvalued, directing funds away from projects that could increase value for\nshareholders.\n(Choice A) Compensation with stock options would motivate management to add more debt to amplify returns. Default risk would also increase,\nwhich is not in shareholders' interests.\n(Choice B) Stock option holders, like shareholders, have limited downside risk, so managers have no incentive to practice risk avoidance.\nThings to remember:\nDifferent compensation structures are used to align the interests of management with the interests of shareholders, but some structures can have\nthe opposite effect. Stock options are used to link compensation to company performance but may incentivize management to take unjustifiable\nactions (eg, buying back outstanding shares, increasing leverage) that increase the stock price.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 94, "q": "An analyst reviews the following information about a company: Cost of Capital Target (Pretax) Weight Debt 8% 30% Preferred stock 9% 20% Common equity 14% 50% If the company's tax rate decreases from 25% to 20%, then the company's weighted average cost of capital will be closest to:", "opts": ["10.36%", "10.72%", "10.83%"], "ans": "B", "expl": "When a company uses debt it incurs interest expense, which lowers taxable income and tax expense. This creates a benefit of using debt that\npartially offsets the cost of debt, so that the after-tax cost of debt [r (1 − t)] is less than the pretax cost of debt.\nd\nThe WACC formula can be used to find the company's WACC with a lower tax rate:\n(Choice A) 10.36% results from incorrectly applying an after-tax rate on the cost of preferred stock. Taxes do not affect the cost of preferred\nstock.\n(Choice C) 10.83% results from incorrectly using the higher tax rate of 25%, not the new lower tax rate of 20%.\nThings to remember:\nWhen a company uses debt it incurs interest expense, which lowers taxable income and tax expense. This creates a benefit from using debt that\npartially offsets the cost of debt. To calculate WACC, use the after-tax cost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 95, "q": "According to pecking order theory, the sources of capital from least to most attractive are:", "opts": ["bonds, common stock, net operating cash flows.", "common stock, bonds, net operating cash flows.", "common stock, net operating cash flows, bonds."], "ans": "B", "expl": "Pecking order theory suggests that companies' managements choose sources of capital based on the required information disclosures and\npotential information signaling effects. In general, lower disclosure requirements and less potential for signaling make a particular source of\ncapital more attractive.\nPecking order theory implies that management will:\nrely entirely on internally generated funds (ie, net operating cash flows) if they are adequate to meet the firm's financing needs,\nissue debt (eg, bonds) only when internally generated funds prove inadequate for funding all desired activities, and\nissue equity (eg, common stock) only after the other sources of funding have been fully exploited.\nThis hierarchy reflects a preference for using the available funding source that requires the least amount of information disclosure. Based on the\nrequired disclosures, the ranking of sources of capital from least to most attractive is common stock, debt, and internally generated funds\n(Choices A and C).\nThings to remember:\nPecking order theory suggests that, in general, lower disclosure requirements and less potential for signaling make a particular source of capital\nmore attractive. Therefore, equity is the least attractive source since it requires the most disclosure, internally generated funds are the most\nattractive since there are no required disclosures, and debt ranks in the middle.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 96, "q": "An analyst gathers the following information about a profitable company's target costs of capital: Selected Financial Data Cost of equity 16% Pretax cost of debt 8% Weighted average cost of capital (WACC) 12% The company has no other sources of capital. All else being equal, if its tax rate changes from 25% to 40%, its new WACC will be closest to:", "opts": ["9.60%", "11.52%", "12.34%"], "ans": "B", "expl": "When a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) using debt that partially offsets the cost of debt, such that:\nthe after-tax cost of debt [r (1 − t)] < the pretax cost of debt (r ).\nd d\nAll else equal, a higher (lower) tax rate creates a greater (smaller) benefit and decreases (increases) the after-tax cost of debt. Since an\nincrease in the tax rate decreases the cost of debt, it decreases the weighted average cost of capital (WACC). In this question, the increase in the\ntax rate means that WACC can only decrease, not increase, so 12% represents the highest possible WACC (Choice C).\nw w\nTo solve for the WACC when the tax rate is 40%, first calculate the weights of debt ( d) and equity ( e by using the WACC formula with the\nw + w w w\nexisting tax rate of 25%. Since the company has no preferred stock, d e = 100% and d = 1 − e:\nCalculations Steps\nWACC = (1 − w )r (1 − t) + w r Modify the WACC formula\ne d e e\n0.12 = (1 − w ) 0.08(1 – 0.25) + w 0.16 Use given information\ne e\n0.12 = 0.06 – 0.06w + w 0.16 Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 – 0.60) = 0.40 Solve for the weight of debt\nd\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again, but with the higher tax rate of 40%.\nThe decrease in the company's WACC from 12.00% to 11.52% is solely due to a higher tax rate.\nWACC = (0.4)(0.08)(1 − 0.4) + (0.6)(0.16)\n= 0.0192 + 0.096\n= 11.52%\n(Choice A) 9.60% is the WACC if the weight of equity and debt are the same (50%). This would be the case if 8% were the after-tax cost of debt.\nThings to remember:\nAll else equal, a higher (lower) tax rate creates a greater (smaller) tax shield and decreases (increases) the net cost of debt. Since a change in\nthe tax rate affects the cost of debt, it also affects the WACC.\nCalculate and interpret the weighted-average cost of capital for a company\n12. Which of the following types of capital is most likely to have an after-tax cost that is less than its before-tax cost?\n A. Debt\nB. Common stock\nC. Preferred stock\nExplanation\nComponent cost of capital is the cost associated with each source of external capital (eg, debt, common stock, preferred stock). Interest\nexpense is related to debt and can reduce tax expense (see modified income statement below) by lowering taxable income (ie, pretax income),\nthus creating tax savings.\nMany companies pay dividends to preferred and common stock investors. Unlike interest, dividends are not tax-deductible and cannot reduce the\ncost of common stock and preferred stock through tax savings (Choices B and C).\nThings to remember:\nDividends on preferred stock and common stock are not tax-deductible; conversely, interest on debt is tax-deductible, resulting in lower after-tax\ncost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 97, "q": "Which of the following types of capital is most likely to have an after-tax cost that is less than its before-tax cost?", "opts": ["Debt", "Common stock", "Preferred stock"], "ans": "A", "expl": "Component cost of capital is the cost associated with each source of external capital (eg, debt, common stock, preferred stock). Interest\nexpense is related to debt and can reduce tax expense (see modified income statement below) by lowering taxable income (ie, pretax income),\nthus creating tax savings.\nMany companies pay dividends to preferred and common stock investors. Unlike interest, dividends are not tax-deductible and cannot reduce the\ncost of common stock and preferred stock through tax savings (Choices B and C).\nThings to remember:\nDividends on preferred stock and common stock are not tax-deductible; conversely, interest on debt is tax-deductible, resulting in lower after-tax\ncost of debt.\nCalculate and interpret the weighted-average cost of capital for a company", "qhtml": null}, {"n": 98, "q": "According to pecking order theory, the relative attractiveness of different sources of capital is most likely based on:", "opts": ["agency costs.", "priority of claims.", "information asymmetries."], "ans": "C", "expl": "Pecking order theory proposes that required information disclosure determines the relative attractiveness of different sources of capital.\nManagement would prefer to generate funds:\n1. internally, since that requires the least amount of information disclosure to investors, rather than\n2. externally, since that requires a greater amount of information disclosure to investors.\nThis theory reflects the presumption that\ncompany management has both public and nonpublic information, while\ninvestors have only public information, and funding decisions thus contain signals.\nFor example, a company would prefer to issue stock when it believes the stock is overvalued, so an equity offering signals that management\nbelieves the stock is overvalued. Since management has more knowledge about the company's prospects, the equity offering reveals information\nabout the stock's value to investors.\nThe sources of financing for company operations determine its capital structure. Many companies have target capital structures based on long-\nrun targets/objectives (eg, minimizing WACC, desired credit rating). However, various factors such as information asymmetries can also affect\nfunding decisions and result in capital structures that differ from the target.\n(Choice A) Agency costs are incurred by principals (eg, shareholders) to monitor the actions of parties acting as the principals' agents (eg,\ncompany managers) due to potential conflicts of interest. Agency costs do not affect pecking order theory.\n(Choice B) Priority of claims, the relative seniority or subordination of claims by creditors and shareholders, is based on contract law and the legal\nsystem, not on pecking order theory.\nThings to remember:\nPecking order theory is based on the presumption that management has more information than investors regarding future performance and that\nraising capital discloses information. Such disclosures can affect management's preferred choice of financing.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 99, "q": "All else being equal, which of the following factors is least likely to cause a company's actual capital structure to diverge from its target capital structure? The company:", "opts": ["generated greater than anticipated operating cash flow.", "refinanced maturing debt at a lower rate to reduce the cost of debt.", "issued equity when management perceived company stock was overvalued."], "ans": "B", "expl": "There are three general sources of funds companies use to finance operations:\nissuing common or preferred stock,\nborrowing (eg, loans, bonds), and\ngenerating cash from operations.\nUltimately, these amounts are reflected on balance sheets as debt or equity. The proportional split between the amounts of debt and equities is a\ncompany's capital structure.\nAlthough many companies have a target capital structure, various factors influence a company's reliance on different funding sources and may\nresult in the actual capital structure not matching the target. However, refinancing maturing debt at a lower interest rate does not change the\ncapital structure since the amount of debt is unchanged. All else equal, reducing the interest rate on debt lowers the company's WACC, but it\nwould not alter the company's capital structure.\n(Choice A) Greater than anticipated net operating cash flow results in cash in excess of amounts budgeted for other purposes (eg, debt\nretirement, investments). All else equal, this increases equity capital, raising it above the targeted proportion of the capital structure.\n(Choice C) A company may opportunistically issue equity securities if management perceives its common stock is overpriced. For a company\noperating at its target capital structure, issuing additional shares increases equity above the targeted proportion of the capital structure.\nThings to remember:\nFunding decisions are reflected in a company's capital structure. Many companies have a target capital structure, but various factors may result in\nactual capital structures not matching the target. However, all else equal, refinancing maturing debt with lower-cost debt does not change a\ncompany's capital structure.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 100, "q": "A company's current financial information includes the following data: Unlevered value (AUD millions) 1.75 Debt (AUD millions) 0 Cost of equity (%) 8 Tax rate (%) 30 If the company borrows AUD 1 million at a rate of 4% for a stock buyback, then after the buyback and based on the Modigliani-Miller propositions (with taxes), the company's WACC is closest to:", "opts": ["5.71%", "6.83%", "8.00%"], "ans": "B", "expl": "The Modigliani-Miller (MM) propositions hold that, assuming perfectly efficient capital markets, a company's value and WACC are unaffected by\ncapital structure changes. However, if the perfectly efficient market assumption is relaxed to acknowledge corporate taxes, all else equal, then\naccording to the MM propositions:\nThe market value of a levered company is greater than that of an unlevered but otherwise identical company due to the debt tax shield.\nSince the value of the levered company is greater, its WACC must be lower.\nThe cost of equity moves in proportion to the levered company's tax-adjusted D/E ratio.\nIn this case, the company currently has no debt, so its WACC equals the cost of equity. After adding leverage, the company's WACC is calculated\nas follows:\nThe levered WACC is approximately 6.83%. All else equal, with leverage, the company's WACC is less than its unlevered WACC (8.00%); the\nbenefit of the tax shield increases the company's value, decreasing its WACC (Choice C).\n(Choice A) 5.71% is the result of using the company's unlevered value to find the levered cost of equity.\nThings to remember:\nThe Modigliani-Miller propositions hold that, in perfectly efficient capital markets, capital structure does not affect a company's value. All else\nequal, if taxes are considered, a levered company likely has a greater value, greater cost of equity, and lower WACC than an unlevered but\notherwise identical company.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 101, "q": "An analyst has compiled the following data for a company: Selected Financial Data Stock price $100 Most recent annual dividend $2 Dividend growth rate 5% Cost of new debt 8% Tax rate 25% Using the dividend discount model (DDM) approach and assuming a debt-to-equity ratio of 1.5, the company's weighted average cost of capital (WACC) is closest to:", "opts": ["6.40%", "6.44%", "7.64%"], "ans": "B", "expl": "The weighted average cost of capital (WACC) is a company's weighted average after-tax cost of capital from all sources. The most common\nsources of capital include equity, preferred stock, and debt. The WACC also represents the weighted average required return of all capital\nproviders. In this scenario, the only capital sources are debt and common equity.\nUse the steps below to calculate WACC:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n17.An analyst gathers the following information about a company with only debt and common equity in its capital structure.\nBased on Target Capital Structure\nCost of common equity 10.0%\nPretax cost of debt 5.0%\nWeighted average cost of capital (WACC) 7.5%\nAll else being equal, if the company's tax rate decreases from 25% to 15%, the company's new WACC will be closest to:\nA. 7.50%\n\nB. 7.70%\nC. 7.83%\nExplanation\nWhen a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) of using debt that partially offsets the cost of debt, such that the after-tax cost of debt [r (1 − t)] is less than the\nd\npretax cost of debt (r ).\nd\nWith all else equal, a lower (higher) tax rate creates a smaller (greater) benefit and increases (decreases) the after-tax cost of debt. Since a\ndecrease in the tax rate increases the after-tax cost of debt, it increases the weighted average cost of capital (WACC). In this question, the\ndecrease in the tax rate means that the WACC can only increase, so the correct answer must be a WACC greater than 7.5%.\nw w\nTo solve for the WACC when the tax rate is 15%, first calculate the weights of debt ( d) and equity ( e) by using the WACC formula with the\nw + w = 100% w = 1 − w\nexisting tax rate of 25%. Since the company has no preferred stock, d e and d e:\nCalculations Steps\nWACC = (1 − w )(r )(1 − t) + w r Modify the WACC formula\ne d e e\n0.075 = (1 − w )(0.05)(1 − 0.25) + 0.10w Use given information\ne e\n0.075 = 0.0375 − 0.0375w + 0.10w Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 − 0.60) = 0.40 Solve for the weight of debt\nd\nWACC = (0.4)(0.05)(1 − 0.15) + (0.6)(0.10)\n= 0.017 + 0.06\n= 0.077, or 7.70%\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again but with a lower tax rate of 15%. The\nincrease in the company's WACC from 7.50% to 7.70% is due solely to a lower tax rate.\n(Choice A) 7.50% is the WACC found by assuming that the weights of debt and equity are each 50%, using the pretax cost of debt. This\nsuggests that there is no tax effect on the cost of debt.\n(Choice C) 7.83% is the WACC found by using the lower tax rate of 15%, not 25%, to determine the weight of debt and equity in the target\nallocation.\nCalculate and interpret the weighted-average cost of capital for a company LOS\n18.All else equal, it would be most attractive for a firm to issue debt instead of equity if:\nA. the stock price is very high.\n\nB. the firm's creditworthiness is about to deteriorate.\nC. the firm is financing the acquisition of a start-up company.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 102, "q": "An analyst gathers the following information about a company with only debt and common equity in its capital structure. Based on Target Capital Structure Cost of common equity 10.0% Pretax cost of debt 5.0% Weighted average cost of capital (WACC) 7.5% All else being equal, if the company's tax rate decreases from 25% to 15%, the company's new WACC will be closest to:", "opts": ["7.50%", "7.70%", "7.83%"], "ans": "B", "expl": "When a company uses debt, it incurs interest expense, which lowers taxable income and tax expense. This creates a beneficial \"tax shield\" (ie,\nshielding income from taxation) of using debt that partially offsets the cost of debt, such that the after-tax cost of debt [r (1 − t)] is less than the\nd\npretax cost of debt (r ).\nd\nWith all else equal, a lower (higher) tax rate creates a smaller (greater) benefit and increases (decreases) the after-tax cost of debt. Since a\ndecrease in the tax rate increases the after-tax cost of debt, it increases the weighted average cost of capital (WACC). In this question, the\ndecrease in the tax rate means that the WACC can only increase, so the correct answer must be a WACC greater than 7.5%.\nw w\nTo solve for the WACC when the tax rate is 15%, first calculate the weights of debt ( d) and equity ( e) by using the WACC formula with the\nw + w = 100% w = 1 − w\nexisting tax rate of 25%. Since the company has no preferred stock, d e and d e:\nCalculations Steps\nWACC = (1 − w )(r )(1 − t) + w r Modify the WACC formula\ne d e e\n0.075 = (1 − w )(0.05)(1 − 0.25) + 0.10w Use given information\ne e\n0.075 = 0.0375 − 0.0375w + 0.10w Simplify\ne e\nw = 0.60 Solve for the weight of equity\ne\nw = (1.00 − 0.60) = 0.40 Solve for the weight of debt\nd\nWACC = (0.4)(0.05)(1 − 0.15) + (0.6)(0.10)\n= 0.017 + 0.06\n= 0.077, or 7.70%\nOnce the weights of debt and equity are known, the answer can be found by using the WACC formula again but with a lower tax rate of 15%. The\nincrease in the company's WACC from 7.50% to 7.70% is due solely to a lower tax rate.\n(Choice A) 7.50% is the WACC found by assuming that the weights of debt and equity are each 50%, using the pretax cost of debt. This\nsuggests that there is no tax effect on the cost of debt.\n(Choice C) 7.83% is the WACC found by using the lower tax rate of 15%, not 25%, to determine the weight of debt and equity in the target\nallocation.\nCalculate and interpret the weighted-average cost of capital for a company LOS\n18.All else equal, it would be most attractive for a firm to issue debt instead of equity if:\nA. the stock price is very high.\n\nB. the firm's creditworthiness is about to deteriorate.\nC. the firm is financing the acquisition of a start-up company.\nExplanation\nReasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 103, "q": "All else equal, it would be most attractive for a firm to issue debt instead of equity if:", "opts": ["the stock price is very high.", "the firm's creditworthiness is about to deteriorate.", "the firm is financing the acquisition of a start-up company."], "ans": "B", "expl": "Reasons for deviations from target capital structure\nDebt ratings can deteriorate with more debt\nTarget capital structure may use book values\nType of capital may depend on investment cash flows\nMarket conditions (stock price, interest rates)\nAspirations to list stock on an index\nInformation asymmetry/information signaling\nDebt such as tax shields (from interest deductions) can enhance a firm's value, but debt may also reduce the value by increasing the risk of\nfinancial distress and bankruptcy. In theory, the optimal (ie, target) capital structure is the proportion of debt to equity that results in the lowest\nWACC and the highest firm valuation. At the optimal capital structure, the difference between the expected costs and benefits of debt is\nmaximized.\nIn reality, a capital structure can deviate from the optimal target for any of the reasons listed in the table above. For example, a firm may benefit\nfrom issuing more debt at a lower cost right before its creditworthiness deteriorates. Once the credit rating declines, it will be more costly for the\nfirm to incur debt since its cost of debt has increased.\n(Choice A) A firm would most likely issue more equity than debt when the stock price is high since it would receive more proceeds from the\nissuance.\n(Choice C) The type of capital raised largely depends on the nature of the project. A start-up is ill-suited for servicing debt since it produces little\ncash flow.\nThings to remember:\nIn theory, the optimal (ie, target) capital structure results in the lowest WACC and the highest firm valuation. In reality, firms often deviate from\ntheir target capital structure. If a firm's credit ratings are expected to deteriorate soon, it may be attractive to issue more debt today at a lower\ncost.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 104, "q": "Which of the following is correct according to the pecking order theory? Managers prefer:", "opts": ["issuing new equity more than issuing debt.", "issuing debt more than using internal financing.", "using internal financing more than issuing new equity."], "ans": "C", "expl": "In finance, pecking order theory states that managers prefer sources of capital that require the least amount of information disclosure. On a\npreference hierarchy, sourcing capital from:\ninternally generated funds (ie, retained earnings) requires no public disclosure and is most preferred.\npublicly issued equity requires the most disclosure and is least preferred.\nAccording to pecking order theory, a company will typically finance internally if it has sufficient funds. When internal financing is insufficient, the\ncompany will turn to debt (Choice B). From an investor's perspective, a company issuing debt is a positive signal that management is confident\nthat the company can service future debt obligations.\nAt the bottom of the pecking order, a company will finance through issuing new equity, which is a negative signal to investors since the cost of\nequity is the highest (Choice A). Furthermore, companies tend to issue shares when the stock is overvalued but will not do so if the stock is\nundervalued, signaling that management is pessimistic about the company's valuation.\nThings to remember:\nPecking order theory states that managers prefer sources of capital that require the least amount of information disclosure and generate the\nfewest potential signaling effects. The order of preference from most to least preferred is as follows: internal funds, debt, and then equity.\nExplain factors affecting capital structure and the weighted-average cost of capital", "qhtml": null}, {"n": 105, "q": "Information for a company is shown below: Book value of assets $70 million Market value of assets $92.5 million Book value of equity $20 million Market value of equity $30 million Cost of equity 13% Percentage of liabilities that is debt 80% Corporate tax rate 30% If the company's weighted average cost of capital (WACC) is 8.0%, its pretax cost of debt is closest to:", "opts": ["5.0%", "5.7%", "7.1%"], "ans": "C", "expl": "A company's weighted average cost of capital (WACC) is its overall cost of capital. WACC combines the proportion of each component in the\noverall capital structure (ie, \"weight\") with the cost of that component. When calculating WACC, weights are based on the components' market\nvalues, not their book values. The steps demonstrating how to derive the cost of debt are shown below:\nCalculate and interpret the weighted-average cost of capital for a company LOS\n21.A firm uses comparable companies' capital structures to estimate its target capital structure and gathers the following data:\nBook value of debt Market value of debt\nCompany\nto book value of equity to market value of equity\nA 0.8 0.6\nB 0.6 0.2\nC 0.7 0.3\nIf the firm's cost of equity is 11% and its after-tax cost of debt is 7%, the firm's WACC is closest to:\nA. 9.35%\nB. 9.53%\n\nC. 9.93%\nExplanation\nA firm maximizes its value when operating at its optimal capital structure. In practice, this point of maximization is difficult to identify, and a range\nfor leverage is often used when specifying a target capital structure. A firm may operate at its current capital structure in the short run and\ntheoretically achieve its target capital structure in the long run; the firm's WACC would be calculated using the target structure.\nWhen a company's target capital structure is unknown, it can be estimated as:\nthe company's current capital structure,\nan average of comparable companies' capital structures, or\nby examining the company's historical capital structure and management's capital structure policy.\nThe table below demonstrates how to calculate WACC using target weights of debt and equity:\n(Choice A) 9.35% results from incorrectly using the book values of debt and equity when estimating the target capital structure, instead of using\nthe market values.\n(Choice B) 9.53% results from incorrectly using the average debt-to-equity ratio as the weight of debt.\nThings to remember:\nA firm's target capital structure is used to calculate its WACC. The target capital structure can be estimated by calculating the average of\ncomparable companies' current capital structures based on market value weights.\nDescribe optimal and target capital structures\n22.According to Modigliani-Miller Proposition I without taxes, if a company reduces the amount of debt in its capital structure, most likely the\ncompany's:\nA. value will increase.\nB. cost of equity will be unchanged.\n\nC. weighted average cost of capital will be unchanged.\nExplanation\nModigliani-Miller Proposition I (without taxes) assumes a perfectly efficient market (ie, no arbitrage, transaction costs, bankruptcy costs, or\ntaxes) and asserts that a company's market value is the present value of its future cash flows.\nSince markets are perfectly efficient, the cost of capital depends only on risk, so companies with the same risk, regardless of capital\nstructure, should have the same weighted average cost of capital (WACC).\nSince WACC is used as the discount rate in determining present value, companies with the same risk and thus WACC and the same\nprojected cash flows would have the same market value, regardless of capital structure (Choice A).\nIn perfectly efficient markets, investors can create their own leverage; in effect, they create their own optimal capital structure by borrowing to\nfinance investments. Since investors can recreate a company's capital structure—or change it—they put no value on the company by doing so,\nand there is no difference in value due to capital structure.\n(Choice B) Modigliani-Miller's Proposition II (without taxes) asserts that a company's cost of equity is a linear function of its debt-to-equity ratio.\nAlthough WACC is unaffected by changes in capital structure, reducing debt results in a lower cost of equity.\nThings to remember:\nModigliani-Miller Proposition I asserts that without taxes, transaction costs, bankruptcy costs, or arbitrage opportunities, capital structure is\nirrelevant to a company's market value. This means that a company cannot change value solely by changing its capital structure. One implication\nof Proposition I (without taxes) is that a change in capital structure has no effect on a company's WACC.\nExplain the Modigliani–Miller propositions regarding capital structure", "qhtml": null}, {"n": 106, "q": "A firm uses comparable companies' capital structures to estimate its target capital structure and gathers the following data: Book value of debt Market value of debt Company to book value of equity to market value of equity A 0.8 0.6 B 0.6 0.2 C 0.7 0.3 If the firm's cost of equity is 11% and its after-tax cost of debt is 7%, the firm's WACC is closest to:", "opts": ["9.35%", "9.53%", "9.93%"], "ans": "C", "expl": "A firm maximizes its value when operating at its optimal capital structure. In practice, this point of maximization is difficult to identify, and a range\nfor leverage is often used when specifying a target capital structure. A firm may operate at its current capital structure in the short run and\ntheoretically achieve its target capital structure in the long run; the firm's WACC would be calculated using the target structure.\nWhen a company's target capital structure is unknown, it can be estimated as:\nthe company's current capital structure,\nan average of comparable companies' capital structures, or\nby examining the company's historical capital structure and management's capital structure policy.\nThe table below demonstrates how to calculate WACC using target weights of debt and equity:\n(Choice A) 9.35% results from incorrectly using the book values of debt and equity when estimating the target capital structure, instead of using\nthe market values.\n(Choice B) 9.53% results from incorrectly using the average debt-to-equity ratio as the weight of debt.\nThings to remember:\nA firm's target capital structure is used to calculate its WACC. The target capital structure can be estimated by calculating the average of\ncomparable companies' current capital structures based on market value weights.\nDescribe optimal and target capital structures\n22.According to Modigliani-Miller Proposition I without taxes, if a company reduces the amount of debt in its capital structure, most likely the\ncompany's:\nA. value will increase.\nB. cost of equity will be unchanged.\n\nC. weighted average cost of capi
