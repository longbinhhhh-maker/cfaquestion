<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":14,"q":"A CFA Institute member is also a member and the portfolio manager of an environmentalist\ngroup. In its charter, the environmentalist group lists a group of companies its members\nshould boycott. The CFA Institute member would violate Standard I(A) concerning obeying all\nrules and regulations if the member:","opts":["actively protests against a publicly traded firm boycotted by the group.","performs either of the activities listed here.","purchases stock of a boycotted firm for the group's portfolio."],"ans":"C","expl":"Tiêu chuẩn I(A) quy định rằng thành viên phải được hướng dẫn bởi tất cả các quy tắc và quy định hiện hành của\ncác hiệp hội nghề nghiệp quản lý các hoạt động nghề nghiệp của thành viên. Việc mua\ncổ phiếu cho công ty sẽ là vi phạm vì nó liên quan đến các hoạt động chuyên môn\ncủa thành viên và các quy tắc của nhóm mà thành viên đó là thành viên và làm việc cho. Tiêu chuẩn đó sẽ không bao gồm việc tích cực\nviệc phản đối."},{"n":21,"q":"Bob Blanford, CFA, is an investment analyst for a large global brokerage firm. He recently\nmoved to Ragatan, a developing country. As part of conducting a company analysis, Blanford\ninterviews Ravi Shanti, vice president of finance at Starr Industries. Starr is a major industrial\nfirm in Ragatan and a client at Blanford's firm. Based on his analysis, Blanford suspects that\nShanti may have deliberately overstated Starr's current earnings and its earnings for the\npast several quarters. Blanford suspects that Shanti may have violated Ragatan's securities\nlaws. To comply with the Code and Standards, Blanford should least likely:","opts":["determine the legality of the activity, possibly by consulting counsel.","disassociate himself from the client, if the activity is illegal or unethical.","take no action."],"ans":"C","expl":"Vì Blanford nghi ngờ Shanti tham gia vào các hoạt động bất hợp pháp đang diễn ra nên Blanford nên\nthực hiện hành động bằng cách xác định tính hợp pháp của hành động bị nghi ngờ, tách khỏi mọi\nhoạt động bất hợp pháp và thúc giục công ty của mình cố gắng thuyết phục Shanti ngừng hành vi đó nếu\nhoạt động đó là bất hợp pháp hoặc phi đạo đức."},{"n":22,"q":"Janet Green, CFA, provides investment advice and other services to clients in several\ncountries. She resides in Country A whose securities laws and regulations are less strict than\nthe Code and Standards. She also conducts business with clients in Country B, which has no\nsecurities laws or regulations, and in Country C, which has securities laws and regulations\nthat are stricter than the Code and Standards. Which of the following statements is\nCORRECT? According to CFA Institute Standards of Professional Conduct, Green must adhere\nto the Code and Standards in:","opts":["Country A and Country B but the law in Country C.","Country A but the law in Country B and Country C.","Country A, Country B, and Country C."],"ans":"A","expl":"Xanh cần tuân theo Tiêu chuẩn I(A) -- Kiến thức về luật. Ở Quốc gia A, Green phải\ntuân thủ Quy tắc và Tiêu chuẩn vì luật pháp của Quốc gia A ít nghiêm ngặt hơn. Ở Quốc gia B,\nGreen cũng phải tuân thủ Quy tắc và Tiêu chuẩn vì Quốc gia B không có luật chứng khoán\n. Vì luật hiện hành của Quốc gia C nghiêm ngặt hơn các yêu cầu của Bộ quy tắc và\nTiêu chuẩn nên Green phải tuân thủ luật pháp của Quốc gia C."},{"n":31,"q":"A CFA Institute member works for Secure Securities, Inc., and plays rugby on the firm's rugby\nteam. Secure Securities' team recently played the team of a rival firm. During the game, a\nfight broke out and the CFA Institute member was the instigator, but no one was seriously\nhurt. Is this a violation of I(A) concerning maintaining knowledge and complying with laws,\nrules, and regulations?","opts":["No, because a fight at a rugby game is not a professional activity.","Yes, because the member could have hurt someone in the fight.","Yes, because the member is bound by the Code of Ethics."],"ans":"A","expl":"Tiêu chuẩn I(A) bao gồm chỉ hoạt động nghề nghiệp của các thành viên. Các vi phạm bên ngoài hoạt động\nchuyên nghiệp liên quan đến gian lận, trộm cắp hoặc lừa dối có thể sẽ bị coi là vi phạm."},{"n":32,"q":"Sam Lecheval, a Level I CFA candidate, resides in a European Union (EU) country and does\nbusiness in Japan. Lecheval is required to maintain knowledge of and comply with all\napplicable laws, rules, and regulations in:","opts":["the EU and the CFA Institute Standards of Professional Conduct, but not Japan.","both the EU and Japan, but not the CFA Institute Standards of Professional Conduct.","the EU, Japan, and the CFA Institute Standards of Professional Conduct."],"ans":"C","expl":"Các thành viên và ứng cử viên được yêu cầu áp dụng luật nghiêm ngặt nhất, quy tắc hoặc quy định\náp dụng ở nơi họ cư trú, áp dụng ở nơi họ kinh doanh hoặc được bao gồm trong các tiêu chuẩn của Viện CFA\n, trong mọi trường hợp có bất kỳ điều nào trong số này khác nhau."},{"n":33,"q":"If a member does business in a country with stricter securities laws and regulations than the\nCode and Standards, but the member's home country has less strict securities laws or\nregulations than the Code and Standards, the member must abide by the:","opts":["laws and regulations of the country in which the member is doing business.","Code and Standards only.","home country’s securities laws and regulations only."],"ans":"A","expl":"Thành viên phải tuân thủ luật pháp và quy định của quốc gia nơi anh ta đang kinh doanh\nnếu những luật này nghiêm ngặt hơn luật pháp của nước sở tại hoặc Bộ quy tắc và\nTiêu chuẩn. Theo Tiêu chuẩn I(A) Kiến thức về Luật, thành viên hoặc ứng cử viên phải\ntuân thủ luật hoặc quy định hiện hành nghiêm ngặt nhất.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":34,"q":"Ernesto Vivaldo is a CFA candidate. He is working in the branch office of an American-based\ninvestment company in Belgium. Vivaldo is a citizen of Venezuela. In his country, a portfolio\nmanager is not required to disclose referral fees. Belgian law does not allow referral fees for\nportfolio managers. Vivaldo has been offered a deal that involves a referral fee. Vivaldo\nshould follow the requirements of:","opts":["Belgium.","CFA Institute.","Venezuela."],"ans":"A","expl":"Theo Tiêu chuẩn I(A) Kiến thức về Luật, các ứng viên CFA và các thành viên hiện tại của Học viện CFA\nphải tuân theo bất kỳ luật nào nghiêm ngặt hơn. Trong trường hợp này, luật nghiêm ngặt nhất là luật của\nBỉ.\n(Học phần 91.1, LOS 91: I(A))"},{"n":46,"q":"Maria Valdes, CFA, is an analyst for Venture Investments in the country of Newamerica,\nwhich has laws prohibiting the acceptance of any gift from a vendor if the gift exceeds US\n$250. Valdes has evidence that her Venture Investments colleague, Ernesto Martinez, CFA,\nhas been receiving gifts from vendors in excess of US $250.\nValdes is obligated to:","opts":["disassociate herself from the activity, and urge Venture to persuade Martinez to cease the activity.","disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute and regulatory authorities of the violation.","disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute of the violation."],"ans":"A","expl":"Tiêu chuẩn I(A), Kiến thức về Luật yêu cầu các thành viên có kiến thức về đồng nghiệp\ntham gia vào các hoạt động bất hợp pháp phải tách khỏi hoạt động đó và thúc giục công ty của họ\nthuyết phục cá nhân ngừng hoạt động đó. Việc báo cáo cho cơ quan quản lý có thể\nthận trọng trong một số trường hợp nhất định nhưng không bắt buộc. Không cần phải báo cáo cho Viện CFA\n."},{"n":49,"q":"According to the CFA Institute Standards of Professional Conduct, Standard I(A), Knowledge\nof the Law, members shall not knowingly participate or assist in any violations of laws, rules,\nor regulations. An analyst:","opts":["is held responsible for participating in illegal acts when the law is evident to anyone knowing the law and can participate in a violation by having knowledge of the violation and taking no action to stop it or disassociate from it.","is held responsible for participating in illegal acts when the law is evident to anyone knowing the law and is held responsible for violations by others when the analyst is unaware of the facts giving rise to the violation.","must report all legal violations to the proper regulatory commission and is held responsible for participating in illegal acts when the law is evident to anyone knowing the law."],"ans":"A","expl":"Nếu nghi ngờ ai đó đang lên kế hoạch hoặc tham gia vào các hoạt động bất hợp pháp, bạn nên:\n1. Xác định tính hợp pháp của các hoạt động. Hãy tham khảo ý kiến ​​của người giám sát và cố vấn pháp lý của bạn.\n2. Hãy hành động thích hợp. Tách biệt, cố gắng thuyết phục thủ phạm dừng lại.\nViện CFA không yêu cầu bạn báo cáo họ với chính quyền, nhưng luật\ncó thể."},{"n":52,"q":"Mary Kim, CFA, practices in the established country of Oldasia as well as in the emerging\ncountry of Newasia. By regulation, Oldasia prohibits licensed investment advisors from\ntrading in securities ahead of their clients. Newasia has no laws or regulations in this area.\nMary Kim may:","opts":["not trade ahead of her clients in either country.","trade ahead of her clients in Newasia only, as long as she has made full disclosure to her clients that she reserves the right to do this.","trade ahead of her clients in Newasia only."],"ans":"A","expl":"Theo Tiêu chuẩn I(A), Mary Kim, với tư cách là người sở hữu hợp đồng CFA, phải áp dụng Bộ luật của Viện CFA\nvà các Tiêu chuẩn hoặc luật kiểm soát, tùy theo điều kiện nào nghiêm ngặt hơn. Vì Tiêu chuẩn VI(B)\nyêu cầu các thành viên đặt giao dịch của khách hàng lên trước các giao dịch của chính họ nên Mary Kim phải\ntuân theo tiêu chuẩn này trong trường hợp không có luật điều chỉnh hoặc khi luật pháp ít nghiêm ngặt hơn tiêu chuẩn\n.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":55,"q":"If an analyst suspects a client or a colleague of planning or engaging in ongoing illegal\nactivities, which of the statements about the actions that the analyst should take is most\ncorrect? According to the CFA Institute Standards of Professional Conduct, the analyst\nshould:","opts":["consult counsel to determine the legality of the activity and disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical.","consult counsel to determine the legality of the activity.","disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical."],"ans":"A","expl":"Theo quy trình tuân thủ Tiêu chuẩn I(A), các thành viên của Viện CFA\nnên xác định tính hợp pháp và tách khỏi mọi hoạt động bất hợp pháp hoặc phi đạo đức."},{"n":58,"q":"CFA Institute believes:","opts":["that a maximum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct.","that firms should comply with all domestic laws and regulations and that these laws also govern behavior in foreign markets, regardless of foreign laws and requirements.","that a minimum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct."],"ans":"C","expl":"Quy tắc và Tiêu chuẩn của Viện CFA quy định mức độ ứng xử tối thiểu. Các tiêu chuẩn\nkhông được dựa trên đạo đức của ban quản lý cấp trên và ban giám đốc của một công ty.\nCác công ty phải tuân thủ các tiêu chuẩn hiện hành nghiêm ngặt nhất, cho dù đó là luật và quy định của nước ngoài hay\ntrong nước."},{"n":66,"q":"Allen Parsons, a CFA candidate, suspects a colleague at his firm of engaging in an illegal\nactivity. Which of the following statements about procedures for compliance involving\nStandard I(A), Knowledge of the law is NOT correct? Parsons:","opts":["is required to report this legal violation to the appropriate governmental or regulatory organizations.","should consult counsel to determine whether the conduct is, in fact, illegal.","should urge his firm to attempt to persuade the perpetrator to cease such conduct."],"ans":"A","expl":"Tiêu chuẩn I(A), Kiến thức về luật, không yêu cầu Parsons báo cáo các hành vi vi phạm pháp luật\ncho các tổ chức chính phủ hoặc cơ quan quản lý thích hợp, nhưng những tiết lộ như vậy có thể\nphù hợp trong một số trường hợp nhất định."},{"n":67,"q":"What is the rule for members, CFA charterholders, and candidates in the CFA program with\nregard to the requirements of the Code and Standards and the requirements of local laws? If\nthe applicable laws are:","opts":["less strict, members and candidates are only responsible for complying with the local laws.","more strict, members and candidates are responsible for complying with the applicable laws.","more strict, members and candidates are only responsible for complying with the Code and Standards."],"ans":"B","expl":"Theo Tiêu chuẩn I(A) Kiến thức về Luật, các thành viên và ứng viên phải tuân thủ\ncác quy định chặt chẽ hơn của địa phương pháp luật hoặc Quy tắc và Tiêu chuẩn.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":71,"q":"Which of the following is most accurate concerning a member's duty under the Code and\nStandards?","opts":["In the absence of specific applicable law or other regulatory requirements, the Code and Standards govern the member's actions.","A member who trades securities in a country with less strict laws, rules, regulations, or customs may follow those laws if he discloses this information to his client.","A member is required to comply only with applicable local laws, rules, regulations, or customs even if the Code and Standards impose a higher degree of responsibility."],"ans":"A","expl":"Các thành viên ít nhất luôn phải tuân theo Quy tắc và Tiêu chuẩn. Các thành viên và\nứng cử viên có trách nhiệm tuân thủ các quy định và luật pháp địa phương chặt chẽ hơn hoặc\nQuy tắc và Tiêu chuẩn.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":80,"q":"Nicholas Brynne, CFA, is a fixed-income analyst who trades in mortgage-backed securities\n(MBS). The MBS industry has seen sweeping regulatory changes since Brynne took his\ncurrent position, and he now feels his understanding of applicable laws and regulatory\nstandards is dated. To comply with the Code and Standards, Brynne is required to:","opts":["have all trades reviewed by his compliance department until he has obtained an expert level of knowledge in compliance.","update his understanding of applicable laws and regulatory standards relating to his position.","rely on his firm’s policies and procedures for guidance on legal and regulatory standards."],"ans":"B","expl":"Để tuân thủ Tiêu chuẩn I(A) Kiến thức về Luật, Brynne nên cập nhật\nsự hiểu biết của mình về luật hiện hành và các tiêu chuẩn quy định liên quan đến vị trí của mình,\nmặc dù anh ta không bắt buộc phải là chuyên gia về tuân thủ. Chỉ dựa vào các chính sách của công ty\nvà các thủ tục là không đủ."},{"n":82,"q":"Mary White, CFA, sits on the board of directors of XYZ Manufacturing, Inc. She discovers that\nmanagement has knowingly participated in an activity she knows is illegal. According to the\nCFA Institute Standards of Professional Conduct, White is least likely to be required to:","opts":["disassociate herself from the activity.","report the violation to the CFA Institute Professional Conduct Program.","seek legal advice to determine what actions should be taken."],"ans":"B","expl":"Các thành viên được khuyến khích -- nhưng không bắt buộc -- báo cáo hành vi vi phạm của người khác. Tiêu chuẩn\nI(A), Kiến thức về Pháp luật. Cấm cố ý thực hành hoặc hỗ trợ\nvi phạm luật pháp, quy tắc và quy định. Nếu White biết rằng ai đó đã tham gia vào một\nhoạt động có thể là bất hợp pháp, cô ấy nên: (1) báo cáo phát hiện này cho người giám sát\nthích hợp tại công ty của cô ấy, (2) nếu tình huống không được khắc phục, hãy tách mình ra khỏi tình huống\nvà (3) tìm kiếm lời khuyên pháp lý để xem những hành động nào khác, chẳng hạn như thông báo cho cơ quan quản lý\nthích hợp, nên làm đã lấy.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":83,"q":"Fran Lester, CFA, works for a broker based in a country in which participation in any IPO is\npermitted with her employer's permission. She lives and works in a country that has no\nrestrictions on her participation in IPOs. If Lester's firm is distributing shares of an\noversubscribed IPO through the office Lester works in, can Lester receive shares in the IPO?","opts":["Yes, because the applicable law is that of her home country.","Yes, but she must obtain permission from her employer.","No, not under any circumstances."],"ans":"C","expl":"Tiêu chuẩn I(A) Kiến thức về Luật yêu cầu các thành viên và ứng viên phải tuân thủ với\nyêu cầu khắt khe nhất trong số luật pháp nơi họ cư trú, luật pháp tại khu vực họ kinh doanh\ncũng như Quy tắc và Tiêu chuẩn. Trong trường hợp này, Quy tắc và Tiêu chuẩn là\nnghiêm ngặt nhất. Tiêu chuẩn III(B) Giao dịch công bằng cấm các thành viên và ứng viên giữ lại\ncổ phiếu trong các đợt IPO được đăng ký vượt mức từ khách hàng vì lợi ích riêng của họ. (Mô-đun 3.1, 3.4)\n(Mô-đun 91.1, LOS 91.b)"},{"n":85,"q":"Benito Salvatore, CFA, is licensed in the established country of Oldworld but has clients and\nmakes investments in the emerging country of Newworld. The regulations of Oldworld\nprohibit licensed investment professionals from taking gifts or gratuities in any amount from\nvendors or persons connected with potential investments. The laws of Newworld are silent\non this issue. Unsolicited, Salvatore is offered a vase worth US $75 by a Newworld trust\ncompany and a bronze statue worth US $200 by a Newworld company that Salvatore is\nconsidering as a potential investment.\nSalvatore is:","opts":["permitted to accept both gifts.","not permitted to accept either gift.","permitted to accept the vase but not the statue."],"ans":"B","expl":"Theo Tiêu chuẩn I(A) Kiến thức về Theo Luật, Salvatore phải, với tư cách là chủ sở hữu CFA, áp dụng\nluật hoặc quy định hiện hành nghiêm ngặt nhất. Trong trường hợp này, luật nghiêm ngặt hơn của Oldworld,\nnơi Salvatore được cấp phép, áp dụng để cấm quà tặng, ngay cả khi quà tặng được cung cấp ở\nNewworld.\n(Module 91.1, LOS 91: I(A))"},{"n":86,"q":"A member or candidate who suspects that a colleague is violating the law should most\nappropriately:","opts":["consult with the company counsel to determine if in fact a law is being violated.","report all illegal activities to the appropriate regulatory agency.","report the illegal activity to CFA Institute Professional Standards Review Board for action."],"ans":"A","expl":"Theo Tiêu chuẩn I(A) Kiến thức về Luật, các thành viên và ứng viên không được\ncố ý tham gia hoặc hỗ trợ bất kỳ hành vi vi phạm luật, quy tắc, quy định hoặc Quy tắc nào và\nTiêu chuẩn.\nKhi các thành viên nghi ngờ một khách hàng hoặc đồng nghiệp đang lập kế hoạch hoặc tham gia vào các hoạt động bất hợp pháp đang diễn ra\n, các thành viên nên thực hiện các hành động sau:\nTham khảo ý kiến của cố vấn để xác định xem hành vi đó trên thực tế có bất hợp pháp hay không.\nTách khỏi mọi hoạt động bất hợp pháp hoặc phi đạo đức. Khi các thành viên có\ncơ sở hợp lý để tin rằng các hoạt động của khách hàng hoặc nhân viên là bất hợp pháp hoặc phi đạo đức, các thành viên\n nên tách khỏi các hoạt động này và thúc giục công ty của họ cố gắng\nthuyết phục thủ phạm ngừng hoạt động đó.\nLưu ý: Quy tắc và Tiêu chuẩn không yêu cầu các thành viên báo cáo các hành vi vi phạm pháp luật cho\ncác tổ chức chính phủ hoặc cơ quan quản lý phù hợp, nhưng việc tiết lộ như vậy có thể\nthận trọng trong một số trường hợp nhất định.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":92,"q":"Jane Dawson, CFA, an analyst at a New York brokerage firm, suspects that Bob Boatman,\nCFA, another analyst at the same firm, has violated a state securities law. According to the\nCFA Institute Standards of Professional Conduct, Dawson is:","opts":["NOT required to report the violation to the appropriate governmental or regulatory organizations.","required to report the suspected violation to CFA Institute.","required to report the suspected violation to the appropriate state regulatory agency."],"ans":"A","expl":"Quy tắc và Tiêu chuẩn không yêu cầu các thành viên báo cáo các hành vi vi phạm pháp luật cho\ncác tổ chức chính phủ hoặc cơ quan quản lý phù hợp, nhưng việc tiết lộ như vậy có thể\nthận trọng trong những hoàn cảnh nhất định. Dawson nên tham khảo ý kiến ​​của cố vấn pháp lý và tách\nkhỏi hoạt động."},{"n":94,"q":"Bob Smith, CFA, is an independent board member of Atlantic Technologies, but is not paid\nby the firm for his services. An employee at Atlantic informs Smith that Atlantic has\nimproperly timed the booking of contracts to achieve the desired quarterly financial results.\nThe misleading financial statements would turn losses into profits. Smith confers with the\nfirm's legal counsel who indicates that this conduct is, in fact, illegal. Smith urges Sharon\nWhite, Atlantic's chief financial executive, to change the financial statements, but she refuses\nto do so and indicates the firm's external auditors have approved the method of revenue\nrecognition she has used. According to CFA Institute Standards of Professional Conduct,\nwhich of the following actions is least likely appropriate for Smith: in this situation?","opts":["Dissociate from the activity by resigning as a director or by reporting the activities to the appropriate authorities.","Bring his concerns to the other board members.","Report the illegal activity to CFA Institute."],"ans":"C","expl":"Báo cáo hành vi vi phạm Tiêu chuẩn cho Viện CFA có thể phù hợp với những lo ngại\nvề hành vi của thành viên nhưng không phải là cách thích hợp để báo cáo công ty\nsự cố nói chung. Các thành viên phải tách khỏi bất kỳ hoạt động nào mà họ biết là bất hợp pháp và\nnếu Smith không thể yêu cầu công ty của mình sửa báo cáo tài chính sai lệch thì anh ta phải rời khỏi hội đồng\n. Có những bước trung gian mà Smith có thể thực hiện để khắc phục tình trạng này.\nSmith có thể trình bày mối quan ngại của mình với các thành viên hội đồng quản trị khác để yêu cầu công ty dừng\nhoạt động bất hợp pháp. Nếu hội đồng quản trị không khắc phục tình trạng này thì việc tách khỏi hội đồng quản trị\ncó thể là cách duy nhất để Smith tuân thủ Quy tắc và Tiêu chuẩn.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":96,"q":"The Securities and Exchange Board of India (SEBI) has just enacted a new stock-trading rule.\nSEBI will give brokers a 10-day grace period, during which violators of the rule will be\nimmediately notified and given a chance to remedy their situation to comply with the new\nrule. If a CFA Institute member located in India or doing business in India unknowingly\nviolates the rule and then remedies the situation within the 10-day grace period, has the\nmember violated the Standard concerning knowledge of the law?","opts":["No, because the member remedied the situation.","No, because the member unknowingly broke the rule.","Yes, because the member did not maintain knowledge and know of the rule."],"ans":"C","expl":"Kiến thức về Luật tiêu chuẩn I(A) quy định rõ ràng rằng thành viên phải duy trì\nkiến thức và tuân thủ luật pháp, quy tắc và quy định. Do không biết quy tắc,\nthành viên đã vi phạm tiêu chuẩn.\n(Học phần 91.1, LOS 91: I(A))"},{"n":99,"q":"After working 20 years on Wall Street, Jim Gentry, CFA, decides to open his own investment\nfirm on Turtle Island, located in the Caribbean. Turtle Island has securities laws that are\nmuch less stringent than U.S. laws or the CFA Institute Standards of Professional Conduct.\nMany of his U.S.-based clients have agreed to keep Gentry as their portfolio manager and\nmove their assets to his new firm. After a few months of operations, Gentry has encountered\nseveral instances in which Turtle Island regulations relieve him of disclosing information to\ninvestors that he had been required to disclose while working in New York. According to the\nCFA Institute Code and Standards, Gentry must adhere to the:","opts":["Code and Standards or U.S. law, whichever is more strict.","laws of Turtle Island, but disclose any discrepancies to U.S.-based clients.","Code and Standards because as a charterholder, he need only adhere to the Code and Standards under all circumstances."],"ans":"A","expl":"Tiêu chuẩn I(A) Kiến thức về Luật quy định rằng khi luật hiện hành, Quy tắc và\nTiêu chuẩn có các yêu cầu khác nhau, các ứng cử viên và thành viên phải tuân theo những điều nghiêm ngặt nhất\nluật pháp nơi họ cư trú, luật pháp nơi họ kinh doanh hoặc Quy tắc và Tiêu chuẩn.\n(Mô-đun 91.1, LOS 91.b)"},{"n":102,"q":"If a CFA Institute member knows that a fellow member has violated the Code and Standards,\naccording to Standard I(A) the member is:","opts":["required to dissociate from the activity and strongly encouraged to report it.","required to report the activity.","strongly encouraged to dissociate from the activity."],"ans":"A","expl":"Tiêu chuẩn I(A) không yêu cầu thành viên Viện CFA báo cáo các vi phạm tiềm ẩn của\nngười khác, nhưng \"khuyến khích mạnh mẽ các thành viên và ứng viên báo cáo các vi phạm tiềm ẩn đối với\nQuy tắc và Tiêu chuẩn được các thành viên và ứng viên cam kết.\"\n(Học phần 91.1, LOS 91: I(A))"},{"n":104,"q":"Shortly after becoming employed by Valco & Co., an investment banking firm, Stan\nMcDowell, CFA, learns that most of Valco's initial public offerings (IPO) are really put in place\nto profit management via price manipulation of the shares. McDowell observes an illegal act,\nsanctioned by senior management, in progress and refuses to sign off on his responsibility.\nInstead, McDowell takes the documentation to his supervisor and tells him he should sign it\nin his place. This action is:","opts":["a suitable reaction, and he is in compliance with the Code and Standards.","a violation of the Code and Standards since he is required not to knowingly participate or assist in such an act.","an overreaction. Senior management's sanctioning of the act absolves McDowell from his ordinary responsibility as a CFA Institute member."],"ans":"B","expl":"McDowell, qua hành động đưa tài liệu cho người giám sát của mình, đã cố tình\ntham gia và/hoặc hỗ trợ vào một hành động bất hợp pháp. Điều này rõ ràng bị cấm theo Tiêu chuẩn\nI(A) và anh ta vi phạm Tiêu chuẩn."},{"n":13,"q":"To comply with the Standard on independence and objectivity, an analyst making investment\nrecommendations:","opts":["may use outside research only after verifying its accuracy.","must use only his own or his company's research.","must use only his own research."],"ans":"A","expl":"Tiêu chuẩn I(B), Độc lập và Khách quan: nhà phân tích được phép sử dụng nghiên cứu bên ngoài\nchỉ sau khi xem xét sâu sắc. Không có hạn chế nào liên quan đến việc sử dụng độc quyền thông tin nội bộ."},{"n":25,"q":"Roger Smith, CFA, has been invited to join a group of analysts in touring the riverboats of\nRiver Casino Corp. For the tour, River Casino has arranged chartered flights from casino to\ncasino since commercial flight schedules are not practical for the group's time schedule.\nRiver Casino has also arranged to pay for the analysts' lodging for the three nights of the\ntour. According to CFA Institute Standards of Professional Conduct, Smith:","opts":["is required to pay for his flight and lodging.","may accept the arrangements as they are.","may accept the flight but is required to pay for his lodging."],"ans":"B","expl":"Vì hành trình yêu cầu các chuyến bay thuê chuyến do thiếu phương tiện vận tải thương mại,\nRiver Sòng bạc có thể cung cấp chúng một cách thích hợp. Mặc dù Tiêu chuẩn I(B) Độc lập và\nTính khách quan khuyến nghị các thành viên nên tự thanh toán chi phí phòng của mình nhưng điều đó là không bắt buộc và\nkhông có gì lạ khi các thành viên chấp nhận chỗ ở.\n(Module 91.1, LOS 91.b)"},{"n":30,"q":"A member or candidate who produces issuer-paid research should most appropriately\nnegotiate:","opts":["compensation in the form of equity or options, but not cash.","a flat fee prior to writing the report.","a fee scale based on the subsequent performance of the issuer’s securities."],"ans":"B","expl":"Tiêu chuẩn I(B) Tính độc lập và khách quan nêu rõ rằng cách tốt nhất cho nghiên cứu\ndo nhà phát hành trả tiền là thương lượng một khoản phí cố định trước khi viết báo cáo. Khoản bồi thường phụ thuộc\nvào hiệu quả hoạt động chứng khoán của tổ chức phát hành có thể ảnh hưởng đến tính khách quan của nhà phân tích bằng cách\ntạo ra động cơ khuyến khích viết khuyến nghị tích cực.\n(Mô-đun 91.1, LOS 91: I(B))"},{"n":39,"q":"Joshua Rosenberg, CFA, is an equity analyst who covers Northwest Implements, a farm\nimplement manufacturer. Northwest's main factory is located in a sparsely inhabited region\nsix hours by automobile from the nearest airport. Northwest has its own corporate jet and a\nlanding strip near its facility. When Rosenberg contacts Northwest's management to arrange\na visit for a report he is preparing on the company, Northwest's chief financial officer offers\nto send Northwest's corporate jet to pick up Rosenberg from an airport near his home and\nreturn him home the same evening. Rosenberg estimates that it would require three days\nfor him to make the visit using commercial travel. If Rosenberg makes the trip to Northwest's\nheadquarters on the corporate jet, the Standard concerning independence and objectivity:","opts":["permits him to do so.","requires him to disclose in his report on Northwest the company's payment of his travel expenses.","requires him or his employer to reimburse Northwest for the cost of the trip."],"ans":"A","expl":"Theo Tiêu chuẩn I(B) Tính độc lập và khách quan, việc một nhà phân tích ghé thăm một địa điểm ngoài\ncó thể được chủ công ty cung cấp nếu vận chuyển thương mại\nkhông có sẵn hoặc không hiệu quả. Nếu việc sử dụng phương tiện vận chuyển như vậy tạo ra một\nxung đột lợi ích hoặc cản trở khả năng đưa ra ý kiến không thiên vị của nhà phân tích,\nTiêu chuẩn VI(A) Tránh hoặc tiết lộ xung đột sẽ yêu cầu nhà phân tích tiết lộ thông tin đó cho\nchủ lao động và khách hàng của mình."},{"n":42,"q":"Amanda Bradford is a security analyst at UpTrend, Inc. During a routine visit to a beauty\nsalon, she learns that a major cosmetic company, Lorean, is expected to present a\nrevolutionary formula for facial cream. Bradford begins writing a research report on the\ncompany. Bradford also calls Hillary Lang, CFA, an investment advisor at UpTrend, to inform\nher about the news and her forthcoming report. Lang buys Lorean stock for her clients'\nportfolios. Bradford's report, which is distributed two days later to all UpTrend clients, states\nthat given the ongoing research activity at Lorean, investors can expect some successful new\nproducts and a sharp increase in its share price.\nLang's actions least likely violate the Standard concerning:","opts":["independence and objectivity.","material nonpublic information.","fair dealing."],"ans":"A","expl":"Việc dựa vào nghiên cứu từ một nhà phân tích khác trong công ty có thể được chấp nhận theo Tiêu chuẩn I(B)\nTính độc lập và khách quan. Tuy nhiên, Lang đã vi phạm Tiêu chuẩn III(B) Xử lý công bằng khi\nthực hiện nghiên cứu của Bradford cho chính khách hàng của cô ấy trước khi nó được phổ biến tới tất cả\nkhách hàng. .Mặc dù tình huống đưa ra trong câu hỏi này không gợi ý thông tin về\nLorean là không công khai, nhưng Thông tin quan trọng không công khai theo Tiêu chuẩn II(A) tuyên bố rằng các đề xuất\nnghiên cứu có thể quan trọng vì chúng có khả năng ảnh hưởng đến giá\nbảo mật. Do đó, Lang cũng có thể đã vi phạm Tiêu chuẩn này khi hành động dựa trên báo cáo của Bradford\ntrước khi nó được công khai.\n(Module 91.1, LOS 91.b)"},{"n":50,"q":"Cynthia Abbott, a CFA charterholder, is preparing a research report on Boswell Company for\nher employer, Capital Asset Management. Bob Carter, president of Boswell, invites Abbott\nand several other analysts to visit his company and offers to pay her transportation and\nlodging. While visiting the company, Abbott accepts an item of small value from Carter.\nAbbott does not disclose this gift to her supervisor at Capital when she returns. According to\nthe Standard related to independence and objectivity, Abbott most likely:","opts":["may allow Carter to pay for her transportation and lodging but is required to disclose the gift.","should have her employer pay for her transportation and lodging, but is not required to disclose the gift.","is required to refuse both the gift and the offer to pay for her transportation and lodging."],"ans":"B","expl":"Tiêu chuẩn I(B) Tính độc lập và khách quan quy định rằng\ncác thành viên và ứng viên phải được chủ lao động hoặc chính họ trả tiền, ngoại trừ trong\ntrường hợp thương mại phương tiện di chuyển không có sẵn. Những món quà khiêm tốn không\nđược cho là sẽ không làm ảnh hưởng đến phán đoán độc lập của thành viên hoặc ứng viên\nđều được chấp nhận và Tiêu chuẩn không yêu cầu tiết lộ những điều này cho người sử dụng lao động.\n(Mô-đun 91.1, LOS 91.b)"},{"n":54,"q":"Susan Nielsen, CFA, is an equity research analyst on a fact-finding property tour with 6 other\nanalysts to learn about Just Kittens, Inc. Just Kittens sells tungsten ball-bearings and has 16\nwarehouses, and 20 manufacturing, research, and wholesale sales outlets scattered over 8\ncountries – mostly emerging markets. Because of the remote location of some of the\nfacilities, commercial travel is effectively unavailable. Just Kittens charters a jet and various\nbusses to take the research analysts to the properties. If Nielsen accepts these\naccommodations, she is most likely:","opts":["in violation of Standard I(B) \"Independence and Objectivity.\"","not in violation of Standard I(B) \"Independence and Objectivity\" because best practices dictate that better access to company executives is likely to lead to more accurate and timely information.","not in violation of Standard I(B) \"Independence and Objectivity\" because commercial travel is effectively unavailable."],"ans":"C","expl":"Nielsen không vi phạm Tiêu chuẩn I(B) \"Độc lập và Khách quan\" vì\ndu lịch thương mại thực tế không được cung cấp.\n(Mô-đun 91.1, LOS 91: I(B))"},{"n":68,"q":"Luis Rodriguez, CFA, is an analyst at XYZ Investments. He covers a company that is located in\na region that is not easily accessible. The company invites analysts for their annual analyst\nmeeting and pays for the transportation to the remote location. Rodriguez is:","opts":["allowed to accept the payment for transportation as long as it does not exceed $100.","allowed to accept the payment for transportation because the trip was all business and was out of the way.","not allowed to accept the payment for transportation because this is a considered a “perk” and may influence his independent judgment."],"ans":"B","expl":"Tiêu chuẩn I(B) Độc lập và Khách quan. Các nhà phân tích nên tự thanh toán chi phí đi lại\nnếu địa điểm đó có thể tiếp cận được bằng các phương tiện thông thường. Trong trường hợp này, khoản thanh toán\ncó thể chấp nhận được vì địa điểm ở xa và mục đích của chuyến đi hoàn toàn là\nkinh doanh.\n(Mô-đun 91.1, LOS 91: I(B))"},{"n":1,"q":"Patricia Young is an individual investment advisor who uses a computer model to place each\nof her clients into an appropriate portfolio. The model analyzes a range of simulated\nportfolios and computes for each the probabilities of achieving various levels of return.\nYoung then selects the portfolio that provides the highest probability of achieving the clients'\nminimum required return. By using this process, Young is:","opts":["not violating the Standards.","violating Standard III(C) - Suitability.","violating Standard I(C) - Misrepresentation."],"ans":"B","expl":"Tiêu chuẩn III(C) Sự phù hợp đòi hỏi Young phải lựa chọn các khoản đầu tư phù hợp với\nmục tiêu lợi nhuận và rủi ro của khách hàng. Tuy nhiên, khả năng chấp nhận rủi ro không được giải quyết thỏa đáng bằng\nquy trình của Young.\n(Mô-đun 91.1, LOS 91.b)"},{"n":2,"q":"Denise Weaver, CFA, manages a mutual fund and several pension plans. When Weaver\nreceives a proxy for stock held by the mutual fund, she gives it to Susan Griffith, her\nadministrative assistant, to vote according to the recommendations of the company's\nmanagement. When the proxy is for a stock held by one of the pension plans, she asks\nGriffith to send the proxy on to the pension fund's sponsor to vote. Weaver has:","opts":["violated the Standards by her policy on mutual fund proxies, but not her policy on pension fund proxies.","violated the Standards by her policy on mutual fund and pension fund proxies.","not violated the Standards with her policies on voting proxies."],"ans":"B","expl":"Hướng dẫn về Lòng trung thành, Thận trọng và Quan tâm theo Tiêu chuẩn III(A) nêu rõ rằng việc cung cấp thông tin và\nbỏ phiếu có trách nhiệm cho người được ủy quyền là trách nhiệm của các thành viên và ứng cử viên. Cả\nChính sách bỏ phiếu ủy quyền của Weaver đều không đáp ứng Tiêu chuẩn này. Không nên bỏ phiếu một cách mù quáng trong thỏa thuận\nvới ban quản lý công ty. Các ủy quyền cho kế hoạch hưu trí phải được bỏ phiếu vì\nlợi ích tốt nhất của người thụ hưởng chứ không phải nhà tài trợ kế hoạch. Lợi ích của nhà tài trợ sẽ không\nluôn giống với lợi ích của người thụ hưởng."},{"n":3,"q":"Which of the following statements about a member's use of client brokerage commissions is\nNOT correct? Client brokerage commissions:","opts":["may be directed to pay for the investment manager's operating expenses.","should be commensurate with the value of the brokerage and research services received.","should be used by the member to ensure that fairness to the client is maintained."],"ans":"A","expl":"Hoa hồng môi giới là tài sản của khách hàng và chỉ có thể được sử dụng cho khách hàng\nlợi ích."},{"n":4,"q":"Sean Jones places an order with his investment advisor Lisa Johnson, CFA, to buy 1,000\nshares of Orkle Incorporated. Johnson's firm makes a market in Orkle and she executes the\ntrade through her own firm. According to the Code and Standards, Johnson should:","opts":["decline to execute trades in securities for which her firm makes a market.","contact her firm’s compliance department before accepting the order.","disclose her firm’s market making activities to Jones."],"ans":"C","expl":"Tiêu chuẩn VI(A) Tránh hoặc Tiết lộ Xung đột quy định rằng các hoạt động tạo lập thị trường của nhà môi giới-đại lý\nphải được tiết lộ cho khách hàng.\n(Mô-đun 91.1, LOS 91.b)"},{"n":5,"q":"Betsy Fox is an investment advisor who has a client, Don Gordon, who is an employment\nlawyer. At lunch, Fox noticed Gordon and the Chief Financial Officer of Blue Star Company at\nthe next table. She overhears them talking and ascertains that Blue Star is about to\nannounce higher than expected earnings. Before the earnings release, Gordon contacts Fox\nand asks her to purchase 3,000 shares for his portfolio. Fox:","opts":["can only purchase shares for her personal account after informing all of her clients about the potential of the increase in earnings.","can purchase shares for Gordon, but cannot ever purchase shares for her personal account.","must refuse to purchase shares for Gordon."],"ans":"C","expl":"Theo Tiêu chuẩn II(A), Thông tin quan trọng không công khai, Fox không thể hành động hoặc gây ra\nngười khác hành động dựa trên thông tin quan trọng không công khai cho đến khi thông tin đó được công khai. Thông tin\nnghe được trong bữa trưa là thông tin quan trọng và không công khai; do đó, Fox phải đợi cho đến khi\nthông tin được công khai trước khi chấp nhận đơn đặt hàng của Gordon."},{"n":6,"q":"Brenda Simone is a money manager and the Blue Streets Pension Fund is one of her clients.\nThe director of the pension fund calls Simone and asks her to use a particular broker so that\nthe fund can obtain some research services with the soft dollars from that broker. Simone\nbelieves that the desired broker will provide the same price and execution as the normal\nbroker that Simone uses. Simone does as the client wishes. Simone has:","opts":["not violated the Standards as long as the research provided by the broker will benefit Blue Streets.","not violated the Standards as long as the research provided by the broker will benefit the plan beneficiaries.","violated the Standards."],"ans":"B","expl":"Simone phải đảm bảo rằng nghiên cứu này mang lại lợi ích cho các bên mà cô ấy nợ người được ủy thác\n, là những người tham gia kế hoạch."},{"n":7,"q":"John McNeal, CFA, has a friend named Stan Green, a journalist at Investment News, a weekly\nmagazine. In one of their conversations, Green tells McNeal he has written an article about\nundisclosed financial problems at Brightstar Company. Green says the article will appear in\nthe issue of Investment News that will be released tomorrow. According to the Standards,\nMcNeal:","opts":["may act on this information because it is in the process of becoming public.","should ask Green to disseminate the information immediately.","may not act on this information."],"ans":"C","expl":"Để tuân thủ Thông tin quan trọng không công khai Tiêu chuẩn II(A), McNeal không được hành động hoặc\nkhiến người khác hành động dựa trên thông tin cho đến khi thông tin đó được công khai.\n(Mô-đun 91.1, LOS 91.b)"},{"n":8,"q":"Laura Smith, CFA, is an analyst with the trust department of Bright Star Bank. The\ndepartment's portfolio managers use a proprietary model to select stocks. Bright Star has\nbeen purchased by Mega Bank, which does not plan to use Bright Star's model after\ncompleting the purchase. A few weeks before the Bright Star/Mega Bank merger date, Smith\ndownloads the model to her laptop and modifies the model for her own use. Do Smith's\nactions violate the Standards of Professional Conduct?","opts":["No, because Smith modified the model.","Yes, because the model is the property of Mega Bank.","No, because Mega Bank has discontinued use of the model."],"ans":"B","expl":"Smith đã vi phạm Tiêu chuẩn IV(A) Lòng trung thành bằng cách sao chép thông tin máy tính độc quyền\nmà không có sự cho phép của chủ sở hữu, Ngân hàng Bright Star và giờ là Mega Bank. Ngay cả khi Bright\nStar đã được Mega Bank tiếp quản, tài sản của bộ phận ủy thác, bao gồm cả mô hình\n, hiện thuộc về Mega Bank, ngay cả khi họ chọn không sử dụng chúng. Smith sẽ\ntuân thủ Tiêu chuẩn nếu cô ấy được Mega Bank cho phép sao chép\nmô hình.\n(Mô-đun 90.1, LOS 90.b, 90.c; Mô-đun 91.2, LOS 91.a, 91.b, 91.c; và Mô-đun 93.1, LOS 93.a,\n93.b)"},{"n":9,"q":"June Carter passed Level III of the CFA examination in June but will not complete her work\nexperience requirement until August of next year. Carter can state on her resume that she:","opts":["is a CFA in waiting.","passed Levels I, II, and III of the CFA examination.","will be a CFA charterholder in August of next year as long as she is on track to complete her work experience."],"ans":"B","expl":"Ứng viên không thể sử dụng bất kỳ hình thức chỉ định CFA nào cho đến khi nhận được điều lệ của mình.\n(Module 91.1, LOS 91.b)"},{"n":10,"q":"Chuck Hill, CFA, the financial manager of Niseron Corp., has just learned that Niseron's\nquarterly net income will fall well short of consensus analyst expectations. Hill decides that\nhe should immediately notify analysts covering Niseron of this negative development. He\ncalls two particular analysts first who have followed Niseron stock for several years and have\nalerted Hill to important developments at competing firms. Failing to notify these analysts\nmight damage Hill's ability to monitor his competition, to the detriment of his own\nshareholders. Under CFA Institute's Code and Standards, Hill should most appropriately:","opts":["notify no analysts until he is ready to issue the final numbers for the quarter.","notify the two analysts first because their information adds value for Niseron’s shareholders.","issue a press release regarding Niseron’s earnings prior to calling analysts."],"ans":"C","expl":"Phát hành thông cáo báo chí là cách tốt nhất để đạt được sự phổ biến rộng rãi một cách công bằng. Việc thông báo trước cho bất kỳ nhà phân tích cụ thể\n nào là vi phạm Tiêu chuẩn III(B) Giao dịch công bằng, bất kể bất kỳ trợ giúp nào\nhọ có thể đã cung cấp trước đây. (Mô-đun 91.1, LOS 91.b)"},{"n":11,"q":"Alpha Advisors, Inc., is an investment management firm with a client base that ranges from\nindividuals to large foundations. Which of the following firm policies is least appropriate if\nAlpha adopts the Code and Standards? Alpha:","opts":["regularly calls larger accounts first after changes in investment recommendations have been faxed to all clients.","monitors the personal trading activity of firm personnel and requires them to pre- clear personal trades.","excludes client accounts of family members of employees from participating in IPOs."],"ans":"C","expl":"Tiêu chuẩn III(B) Giao dịch công bằng yêu cầu tất cả khách hàng phải được đối xử công bằng. Các thành viên và\nứng viên không được phân biệt đối xử với bất kỳ khách hàng nào. Thành viên gia đình là khách hàng trả phí\nkhông được đối xử khác biệt với các khách hàng khác khi thực hiện hành động đầu tư\n. Việc theo dõi các thay đổi trong đề xuất bằng các cuộc gọi điện thoại tới các khách hàng lớn hơn không phải là\nvi phạm Tiêu chuẩn nếu các thay đổi đó được phổ biến một cách công bằng.\n(Mô-đun 91.1, LOS 91.b)"},{"n":12,"q":"Ann Dunbar, a portfolio manager, wishes to buy stock of Knight Enterprises for her personal\naccount and for clients. Knight is a thinly traded stock. Dunbar believes her own purchase is\ntoo small to affect the price but the purchase for clients is likely to increase the price.\nAccording to the Code and Standards, when may Dunbar buy the stock for her personal\naccount?","opts":["She may not buy the same stock that she buys for her clients.","After the buy order for her clients is executed.","At the same time she enters the buy order for her clients."],"ans":"B","expl":"Tiêu chuẩn VI(B) Mức độ ưu tiên của Giao dịch yêu cầu các giao dịch dành cho khách hàng được ưu tiên\nso với giao dịch cá nhân của một thành viên hoặc ứng cử viên. Các thành viên và\nứng viên không được hưởng lợi cá nhân từ các giao dịch của khách hàng, như sẽ xảy ra trong trường hợp\nnày nếu người quản lý thực hiện giao dịch cá nhân của mình cùng lúc với giao dịch cho khách hàng.\nTiêu chuẩn không cấm các thành viên và ứng viên đầu tư vào cùng những loại chứng khoán\nmà họ đề xuất cho khách hàng.\n(Mô-đun 91.1, LOS 91.b)"},{"n":15,"q":"CFA Institute members should encourage their employers to do all of the following EXCEPT:","opts":["conduct background checks on potential employees to ensure that they are of good character and eligible to work in the investment industry.","make clear that dishonest personal behavior reflects poorly on the profession.","require employees to write personal ethics statements."],"ans":"C","expl":"Không có lý do gì để nhân viên viết tuyên bố về đạo đức cá nhân. Viện CFA\nkhuyến khích tất cả các hành động khác.\n(Học phần 91.1, LOS 91: I(A))"},{"n":16,"q":"Kim Lee is a research analyst at Superior Investments and is researching a biotech firm that\nis developing a treatment for a brain disease. While touring company facilities and meeting\nwith management, she learns that they believe they may have found a way to reverse the\ndisease. Moreover, one manager conjectured, \"Suppose that we reversed the disease in\nsomeone who didn't even have it? We might then be able to boost that individual's IQ into\nthe stratosphere!\" After returning to her office, Lee issues a research report describing the\ntreatment as an \"IQ booster with huge potential.\" In the context of the Code and Standards,\nthis statement:","opts":["lacks a reasonable and adequate basis.","is reasonable given the information she was provided by the company.","is allowable only if quoted verbatim from her conversations with management."],"ans":"A","expl":"Tiêu chuẩn V(A) Cần mẫn và Cơ sở hợp lý yêu cầu thành viên phải có \"cơ sở\nhợp lý và đầy đủ, được hỗ trợ bởi nghiên cứu và điều tra thích hợp\" trước khi thực hiện\nmột khuyến nghị đầu tư. Việc ngoại suy dựa trên phỏng đoán của một\nthành viên trong nhóm quản lý mà không nghiên cứu và điều tra là vi phạm\nTiêu chuẩn này. Cô ấy cũng có thể đã vi phạm Giao tiếp Tiêu chuẩn V(B) với Khách hàng và\nKhách hàng tiềm năng do không phân biệt được giữa thực tế và ý kiến.\n(Module 91.1, LOS 91.b)"},{"n":17,"q":"Sharon Pope has been asked by the Chief Investment Officer to develop a firm-wide policy\nfor proxy voting. Which of the following would NOT be acceptable to include in the policy\nstatement?","opts":["Portfolio managers of active funds must vote in all proxies; portfolio managers of index funds should vote only when they have a definitive opinion.","The value of proxy voting must be maximized.","Voting proxies may not be necessary in all instances."],"ans":"A","expl":"Các ủy quyền cho cổ phiếu trong quỹ được quản lý thụ động cũng phải được bỏ phiếu. Phân tích chi phí-lợi ích\ncó thể cho thấy rằng việc bỏ phiếu cho tất cả các proxy có thể không mang lại lợi ích cho tất cả khách hàng."},{"n":18,"q":"The Konkol Company implements a new methodology for portfolio valuation that is licensed\nto them by ABC Statistics. To comply with the Code and standards, Konkol should:","opts":["discuss the new methodology only with clients whose security selection process will change as a result.","not discuss the new methodology with clients because doing so would fail to preserve ABC’s confidentiality.","discuss the new methodology with its clients."],"ans":"C","expl":"Giao tiếp V(B) tiêu chuẩn với khách hàng và khách hàng tiềm năng yêu cầu bất kỳ thay đổi nào về\nphạm vi, phương pháp định giá hoặc trọng tâm của danh mục đầu tư sẽ được thảo luận với khách hàng. Không có\nthông tin nào được đưa ra cho thấy phương pháp này là bí mật."},{"n":19,"q":"Juan Lopez manages accounts for Street Capital. Lopez's mother is a client of the firm. Lopez\ndoes not make trades in his mother's accounts until all other clients of the firm have been\ngiven an opportunity to trade. Lopez has:","opts":["violated CFA Institute Standards of Professional Conduct because he is not allowed to trade in family accounts.","violated CFA Institute Standards of Professional Conduct because family accounts that are client accounts should be treated like any other firm accounts.","not violated CFA Institute Standards of Professional Conduct because transactions for clients should have priority over personal transactions and transactions for beneficial owners."],"ans":"B","expl":"Ưu tiên giao dịch VI(B) tiêu chuẩn. Tài khoản gia đình là tài khoản khách hàng phải được\nxử lý giống như bất kỳ tài khoản công ty nào khác. Lopez nên hạn chế thận trọng quá mức\nvì mẹ anh ấy cũng là khách hàng của công ty như tất cả các khách hàng khác.\n(Module 91.1, LOS 91.b)"},{"n":20,"q":"Member compliance on issues relating to corporate governance or to soft dollars is primarily\naddressed by the Standard:","opts":["Avoid or Disclose Conflicts.","Referral Fees.","Loyalty, Prudence, and Care."],"ans":"C","expl":"Trách nhiệm ủy thác đối với các vấn đề liên quan đến quản trị doanh nghiệp hoặc đô la mềm chủ yếu\nđược giải quyết theo Tiêu chuẩn III(A), Lòng trung thành, Thận trọng và Cẩn trọng."},{"n":23,"q":"WEB, an investment-banking firm, is the principal underwriter for MTEX's upcoming\ndebenture issue. Wendy Berry, CFA, an analyst with WEB, has found out from an employee in\nMTEX's programming department that a serious glitch was recently discovered in the\nsoftware program of their major new product line. In fact, the glitch is so bad that most of\ntheir orders have been canceled. Berry checked the debenture's prospectus and found no\nmention of this development. The red herring prospectus has already been distributed.\nBerry's best course of action is to:","opts":["take no action because this is material non-public information.","notify potential investors of the omission on a fair and equitable basis.","inform her immediate supervisor at WEB of her discovery."],"ans":"C","expl":"Berry chỉ nên báo cáo thông tin này cho người giám sát trực tiếp của mình. Sau đó, cô\nvà người giám sát của cô có thể tham khảo ý kiến ​​của cố vấn pháp lý liên quan đến các vấn đề cạnh tranh trong tình huống\nnày. Hiện tại, cô ấy nên tránh tiết lộ thông tin cho những đồng nghiệp không cần\nbiết và cô ấy cũng nên tránh tiết lộ thông tin đó cho khách hàng."},{"n":24,"q":"Rachel Young, CFA, is making preparations to start a competitive business before\nterminating her relationship with her employer, a large money management company.\nYoung has used excerpts from research reports by others with only a slight change in\nwording without acknowledging the source. Which of these actions violate the Code and\nStandards?","opts":["Only one of these actions.","Neither of these actions.","Both of these actions."],"ans":"A","expl":"Bằng cách sử dụng các đoạn trích từ báo cáo nghiên cứu của những người khác chỉ với một thay đổi nhỏ trong cách diễn đạt\nmà không thừa nhận nguồn, Young đã phạm tội đạo văn và vi phạm Tiêu chuẩn I(C)\nTrình bày sai. Young không vi phạm Tiêu chuẩn IV(A) Lòng trung thành vì việc chuẩn bị\nbắt đầu kinh doanh độc lập được cho phép với điều kiện là họ không vi phạm nghĩa vụ trung thành\ncủa Young với chủ của cô ấy. Các hành động vi phạm Tiêu chuẩn IV(A) bao gồm lôi kéo\nkhách hàng hoặc lấy hồ sơ hoặc hồ sơ trong khi vẫn làm việc cho chủ lao động hiện tại."},{"n":26,"q":"Chuck Thomas is the trustee of a trust of which Jill Wyatt is the main beneficiary. Wyatt's\nhusband is the president of a company. In emptying the recycling bin at home, Wyatt finds\nsome papers that lead her to believe that her husband's company will make a tender offer to\nacquire another firm. Wyatt takes the information to Thomas, who uses it to purchase\nshares of the company for the trust, but does not further disclose the information. Thomas\nhas:","opts":["not violated any Standards.","violated the Standards concerning loyalty, prudence, and care.","violated the Standards concerning material nonpublic information."],"ans":"C","expl":"Thomas không thể hành động hoặc khiến người khác hành động về thông tin quan trọng không công khai."},{"n":27,"q":"Janice Melfi is a portfolio manager for Soprano Advisors. Soprano has developed a\nproprietary model that has been thoroughly researched and is known throughout the\nindustry as the Soprano model. The model is purely quantitative and screens stocks into\nbuy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to\nclients. The director of research frequently alters the model based on rigorous research—an\naspect that is well explained to clients, although the specific alterations are not continually\ndisclosed. Portfolio managers use the model to assist them in making portfolio decisions,\nbut, based on their own fundamental research, are allowed to purchase securities not\nrecommended by the model. This fact is not disclosed to the clients, because the head of\nmarketing does not think it is relevant. Which of the following statements regarding the\nportfolio manager's investment decisions is CORRECT?","opts":["Melfi is violating the Standards by using two investment processes that are in conflict with each other.","Soprano is violating the Standards by not disclosing the fundamental research aspect of the investment process.","There is no violation of the Standards."],"ans":"B","expl":"Soprano đang vi phạm Tiêu chuẩn về khuyến nghị và hành động đầu tư danh mục đầu tư\nbằng cách loại trừ các yếu tố liên quan của quy trình đầu tư. Khía cạnh nghiên cứu cơ bản\nrất phù hợp với quy trình và cần được tiết lộ cho khách hàng. Việc\nMelfi sử dụng hai quy trình đầu tư có thể xung đột với nhau và sử dụng một\nquy trình không phải do cô ấy phát triển là có thể chấp nhận được."},{"n":28,"q":"Lynne Jennings is a chemical industry research analyst for a large brokerage company. That\nindustry is currently seeing an increase in mergers and acquisitions. While flying through\nChicago, Jennings sees several senior officers who she knows are from the largest and fourth\nlargest chemical companies walk into a conference room. She concludes that negotiations\nfor an acquisition might be taking place. Jennings:","opts":["may not act or cause others to act on this information.","may use this information to support an investment recommendation.","should inform her compliance officer that she has material nonpublic information on firms she covers."],"ans":"B","expl":"Việc các quan chức công ty gặp nhau không phải là thông tin quan trọng không công khai. Miễn là\ncô đưa ra khuyến nghị đầu tư dựa trên nghiên cứu độc lập của riêng mình, Jennings\nsẽ không vi phạm bất kỳ Tiêu chuẩn nào nếu cô sử dụng thông tin bổ sung này để hỗ trợ."},{"n":29,"q":"Art Dodd, CFA, is a registered representative with Owens Securities. He is currently in a\ndispute with one client, Madge Phillips, about a limit order for her account that she feels was\nentered incorrectly, resulting in a loss (in her opinion) of $500. Dodd has 1,000 shares of an\noversubscribed new issue to allocate to clients. He suggests to Phillips that he will give her\n250 shares of this allocation to make up for the supposed trade error. Further, he offers to\nbuy her dinner at a nice restaurant. According to the Standards of Practice, Dodd has most\nlikely violated the Standard concerning:","opts":["additional compensation.","fair dealing.","misconduct."],"ans":"B","expl":"Dodd rất có thể đã vi phạm Tiêu chuẩn III(B) Giao dịch công bằng bằng cách giao cho Phillips\nsự phân bổ quá hào phóng đối với vấn đề mới được đăng ký quá mức (\"nóng\"). Vấn đề không phải là\nanh ta đề nghị bồi thường cho khách hàng để giải quyết tranh chấp mà là do việc phân bổ tổng thể\ncổ phiếu IPO cho Phillips, anh ta đã không đối xử công bằng với các khách hàng khác của mình. Tiêu chuẩn III(B) Giao dịch công bằng\nyêu cầu các thành viên và ứng viên không được sử dụng cổ phiếu phát hành nóng làm động lực để\nđạt được phần thưởng hoặc lợi ích. Lợi ích trong trường hợp này là tranh chấp sẽ được giải quyết.\nHành động của Dodd không thể hiện bất kỳ sự thiếu trung thực nào có thể vi phạm Hành vi sai trái Tiêu chuẩn I(D),\nvà Dodd không nhận được bất kỳ khoản bồi thường bổ sung nào.\n(Mô-đun 91.1, LOS 91.b)"},{"n":35,"q":"Judy Gonzales is a portfolio manager with Brenly Capital and works on Johnson Company's\naccount. Brenly has a policy against accepting gifts over $25 from clients. The Johnson\nportfolio has a fantastic year, and in appreciation, the pension fund manager sent Gonzales\na rare bottle of wine. Gonzales should:","opts":["inform her supervisor in writing that she received additional compensation in the form of the wine.","present the bottle of wine to her supervisor.","return the bottle to the client explaining Brenly's policy."],"ans":"C","expl":"Nếu không trả lại chai, cô ấy sẽ vi phạm Tiêu chuẩn về tránh hoặc tiết lộ\nxung đột với người sử dụng lao động, quy định rằng nhân viên phải tuân thủ các lệnh cấm\ndo chủ lao động của họ áp đặt."},{"n":36,"q":"One year ago, Karen Jason left the employment as a portfolio manager of Howe Advisors.\nThe departure was contentious and both parties threatened legal action. As a result, both\nparties signed a settlement in which Jason was paid a prorated bonus, but agreed not to\nwork on the portfolios of any existing Howe client for two years. The terms of the agreement\nwere that both parties agreed to keep all aspects of the agreement confidential, including\nthe fact that there was hostility surrounding the departure. Jason now works for Torre\nAdvisors, who has the Stein Company as a new client. At the time Jason left Howe, Stein was\n
