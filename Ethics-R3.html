<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Patricia Young is an individual investment advisor who uses a computer model to place each\nof her clients into an appropriate portfolio. The model analyzes a range of simulated\nportfolios and computes for each the probabilities of achieving various levels of return.\nYoung then selects the portfolio that provides the highest probability of achieving the clients'\nminimum required return. By using this process, Young is:", "opts": ["not violating the Standards.", "violating Standard III(C) - Suitability.", "violating Standard I(C) - Misrepresentation."], "ans": "B", "expl": "Standard III(C) Suitability requires that Young select investments that are consistent with\nclients' risk and return objectives. However risk tolerance is not adequately addressed by\nYoung's process.\n(Module 91.1, LOS 91.b)"}, {"n": 2, "q": "Denise Weaver, CFA, manages a mutual fund and several pension plans. When Weaver\nreceives a proxy for stock held by the mutual fund, she gives it to Susan Griffith, her\nadministrative assistant, to vote according to the recommendations of the company's\nmanagement. When the proxy is for a stock held by one of the pension plans, she asks\nGriffith to send the proxy on to the pension fund's sponsor to vote. Weaver has:", "opts": ["violated the Standards by her policy on mutual fund proxies, but not her policy on pension fund proxies.", "violated the Standards by her policy on mutual fund and pension fund proxies.", "not violated the Standards with her policies on voting proxies."], "ans": "B", "expl": "Guidance for Standard III(A) Loyalty, Prudence, and Care states that informed and\nresponsible voting of proxies is a responsibility of members and candidates. Neither of\nWeaver's proxy voting policies meets this Standard. Proxies should not be voted blindly in\nagreement with company management. Proxies for a pension plan should be voted in the\nbest interests of the beneficiaries, not the plan sponsor. The sponsor's interests will not\nalways be the same as the beneficiaries' interests."}, {"n": 3, "q": "Which of the following statements about a member's use of client brokerage commissions is\nNOT correct? Client brokerage commissions:", "opts": ["may be directed to pay for the investment manager's operating expenses.", "should be commensurate with the value of the brokerage and research services received.", "should be used by the member to ensure that fairness to the client is maintained."], "ans": "A", "expl": "Brokerage commissions are the property of the client and may only be used for client\nbenefit."}, {"n": 4, "q": "Sean Jones places an order with his investment advisor Lisa Johnson, CFA, to buy 1,000\nshares of Orkle Incorporated. Johnson's firm makes a market in Orkle and she executes the\ntrade through her own firm. According to the Code and Standards, Johnson should:", "opts": ["decline to execute trades in securities for which her firm makes a market.", "contact her firm’s compliance department before accepting the order.", "disclose her firm’s market making activities to Jones."], "ans": "C", "expl": "Standard VI(A) Avoid or Disclose Conflicts states that broker-dealer market making\nactivities must be disclosed to clients.\n(Module 91.1, LOS 91.b)"}, {"n": 5, "q": "Betsy Fox is an investment advisor who has a client, Don Gordon, who is an employment\nlawyer. At lunch, Fox noticed Gordon and the Chief Financial Officer of Blue Star Company at\nthe next table. She overhears them talking and ascertains that Blue Star is about to\nannounce higher than expected earnings. Before the earnings release, Gordon contacts Fox\nand asks her to purchase 3,000 shares for his portfolio. Fox:", "opts": ["can only purchase shares for her personal account after informing all of her clients about the potential of the increase in earnings.", "can purchase shares for Gordon, but cannot ever purchase shares for her personal account.", "must refuse to purchase shares for Gordon."], "ans": "C", "expl": "According to Standard II(A), Material Nonpublic Information, Fox cannot act or cause\nothers to act on material nonpublic information until the information is made public. The\ninformation overheard at lunch was material and nonpublic; therefore, Fox must wait until\nthe information is made public before accepting Gordon's order."}, {"n": 6, "q": "Brenda Simone is a money manager and the Blue Streets Pension Fund is one of her clients.\nThe director of the pension fund calls Simone and asks her to use a particular broker so that\nthe fund can obtain some research services with the soft dollars from that broker. Simone\nbelieves that the desired broker will provide the same price and execution as the normal\nbroker that Simone uses. Simone does as the client wishes. Simone has:", "opts": ["not violated the Standards as long as the research provided by the broker will benefit Blue Streets.", "not violated the Standards as long as the research provided by the broker will benefit the plan beneficiaries.", "violated the Standards."], "ans": "B", "expl": "Simone must ensure that the research benefits the parties to whom she owes fiduciary\nduty, which are the plan participants."}, {"n": 7, "q": "John McNeal, CFA, has a friend named Stan Green, a journalist at Investment News, a weekly\nmagazine. In one of their conversations, Green tells McNeal he has written an article about\nundisclosed financial problems at Brightstar Company. Green says the article will appear in\nthe issue of Investment News that will be released tomorrow. According to the Standards,\nMcNeal:", "opts": ["may act on this information because it is in the process of becoming public.", "should ask Green to disseminate the information immediately.", "may not act on this information."], "ans": "C", "expl": "To comply with Standard II(A) Material Nonpublic Information, McNeal may not act or\ncause others to act on the information until it becomes public.\n(Module 91.1, LOS 91.b)"}, {"n": 8, "q": "Laura Smith, CFA, is an analyst with the trust department of Bright Star Bank. The\ndepartment's portfolio managers use a proprietary model to select stocks. Bright Star has\nbeen purchased by Mega Bank, which does not plan to use Bright Star's model after\ncompleting the purchase. A few weeks before the Bright Star/Mega Bank merger date, Smith\ndownloads the model to her laptop and modifies the model for her own use. Do Smith's\nactions violate the Standards of Professional Conduct?", "opts": ["No, because Smith modified the model.", "Yes, because the model is the property of Mega Bank.", "No, because Mega Bank has discontinued use of the model."], "ans": "B", "expl": "Smith has violated Standard IV(A) Loyalty by copying proprietary computerized information\nwithout authorization of the owner, Bright Star Bank and now Mega Bank. Even if Bright\nStar has been absorbed by Mega Bank, the assets of the trust department, including the\nmodel, now belong to Mega Bank, even if it chooses not to use them. Smith would have\ncomplied with the Standard if she had obtained permission from Mega Bank to copy the\nmodel.\n(Module 90.1, LOS 90.b, 90.c; Module 91.2, LOS 91.a, 91.b, 91.c; and Module 93.1, LOS 93.a,\n93.b)"}, {"n": 9, "q": "June Carter passed Level III of the CFA examination in June but will not complete her work\nexperience requirement until August of next year. Carter can state on her resume that she:", "opts": ["is a CFA in waiting.", "passed Levels I, II, and III of the CFA examination.", "will be a CFA charterholder in August of next year as long as she is on track to complete her work experience."], "ans": "B", "expl": "A candidate cannot use any form of the CFA designation until receiving her charter.\n(Module 91.1, LOS 91.b)"}, {"n": 10, "q": "Chuck Hill, CFA, the financial manager of Niseron Corp., has just learned that Niseron's\nquarterly net income will fall well short of consensus analyst expectations. Hill decides that\nhe should immediately notify analysts covering Niseron of this negative development. He\ncalls two particular analysts first who have followed Niseron stock for several years and have\nalerted Hill to important developments at competing firms. Failing to notify these analysts\nmight damage Hill's ability to monitor his competition, to the detriment of his own\nshareholders. Under CFA Institute's Code and Standards, Hill should most appropriately:", "opts": ["notify no analysts until he is ready to issue the final numbers for the quarter.", "notify the two analysts first because their information adds value for Niseron’s shareholders.", "issue a press release regarding Niseron’s earnings prior to calling analysts."], "ans": "C", "expl": "Issuing a press release is the best way to achieve fair public dissemination. Notifying any\nspecific analysts first is a violation of Standard III(B) Fair Dealing, regardless of any help\nthey may have provided in the past. (Module 91.1, LOS 91.b)"}, {"n": 11, "q": "Alpha Advisors, Inc., is an investment management firm with a client base that ranges from\nindividuals to large foundations. Which of the following firm policies is least appropriate if\nAlpha adopts the Code and Standards? Alpha:", "opts": ["regularly calls larger accounts first after changes in investment recommendations have been faxed to all clients.", "monitors the personal trading activity of firm personnel and requires them to pre- clear personal trades.", "excludes client accounts of family members of employees from participating in IPOs."], "ans": "C", "expl": "Standard III(B) Fair Dealing requires that all clients be treated fairly. Members and\ncandidates should not discriminate against any client. A family member who is a fee-\npaying client should not be treated differently from other clients when taking investment\naction. Following up changes in recommendations with phone calls to larger clients is not a\nviolation of the Standard if the changes have been disseminated fairly.\n(Module 91.1, LOS 91.b)"}, {"n": 12, "q": "Ann Dunbar, a portfolio manager, wishes to buy stock of Knight Enterprises for her personal\naccount and for clients. Knight is a thinly traded stock. Dunbar believes her own purchase is\ntoo small to affect the price but the purchase for clients is likely to increase the price.\nAccording to the Code and Standards, when may Dunbar buy the stock for her personal\naccount?", "opts": ["She may not buy the same stock that she buys for her clients.", "After the buy order for her clients is executed.", "At the same time she enters the buy order for her clients."], "ans": "B", "expl": "Standard VI(B) Priority of Transactions requires that transactions for clients take\nprecedence over a personal transactions of a member or candidate. Members and\ncandidates should not benefit personally from client transactions, as would occur in this\ncase if the manager enters her personal trade at the same time as the trade for clients.\nThe Standard does not prohibit members and candidates from investing in the same\nsecurities they recommend for clients.\n(Module 91.1, LOS 91.b)"}, {"n": 13, "q": "To comply with the Standard on independence and objectivity, an analyst making investment\nrecommendations:", "opts": ["may use outside research only after verifying its accuracy.", "must use only his own or his company's research.", "must use only his own research."], "ans": "A", "expl": "Standard I(B), Independence and Objectivity: the analyst is allowed to use outside research\nonly after an insightful review. There are no restrictions regarding the exclusive use of in-\nhouse information."}, {"n": 14, "q": "A CFA Institute member is also a member and the portfolio manager of an environmentalist\ngroup. In its charter, the environmentalist group lists a group of companies its members\nshould boycott. The CFA Institute member would violate Standard I(A) concerning obeying all\nrules and regulations if the member:", "opts": ["actively protests against a publicly traded firm boycotted by the group.", "performs either of the activities listed here.", "purchases stock of a boycotted firm for the group's portfolio."], "ans": "C", "expl": "Standard I(A) says the member must be guided by all applicable rules and regulations of\nprofessional associations governing the member's professional activities. Purchasing the\nstock for the firm would be a violation because it involves the member's professional\nactivities and the rules of a group to which the member belongs and works for. Actively\nprotesting would not be covered by that standard."}, {"n": 15, "q": "CFA Institute members should encourage their employers to do all of the following EXCEPT:", "opts": ["conduct background checks on potential employees to ensure that they are of good character and eligible to work in the investment industry.", "make clear that dishonest personal behavior reflects poorly on the profession.", "require employees to write personal ethics statements."], "ans": "C", "expl": "There is no reason to have employees write personal ethics statements. CFA Institute\nencourages all of the other actions.\n(Module 91.1, LOS 91: I(A))"}, {"n": 16, "q": "Kim Lee is a research analyst at Superior Investments and is researching a biotech firm that\nis developing a treatment for a brain disease. While touring company facilities and meeting\nwith management, she learns that they believe they may have found a way to reverse the\ndisease. Moreover, one manager conjectured, \"Suppose that we reversed the disease in\nsomeone who didn't even have it? We might then be able to boost that individual's IQ into\nthe stratosphere!\" After returning to her office, Lee issues a research report describing the\ntreatment as an \"IQ booster with huge potential.\" In the context of the Code and Standards,\nthis statement:", "opts": ["lacks a reasonable and adequate basis.", "is reasonable given the information she was provided by the company.", "is allowable only if quoted verbatim from her conversations with management."], "ans": "A", "expl": "Standard V(A) Diligence and Reasonable Basis requires that a member have a \"reasonable\nand adequate basis, supported by appropriate research and investigation\" before making\nan investment recommendation. Extrapolating on the basis of the conjecture of one\nmember of the management team, without research and investigation, violates this\nStandard. She may also have violated Standard V(B) Communication with Clients and\nProspective Clients by failing to distinguish between fact and opinion.\n(Module 91.1, LOS 91.b)"}, {"n": 17, "q": "Sharon Pope has been asked by the Chief Investment Officer to develop a firm-wide policy\nfor proxy voting. Which of the following would NOT be acceptable to include in the policy\nstatement?", "opts": ["Portfolio managers of active funds must vote in all proxies; portfolio managers of index funds should vote only when they have a definitive opinion.", "The value of proxy voting must be maximized.", "Voting proxies may not be necessary in all instances."], "ans": "A", "expl": "Proxies for stocks in passively managed funds must also be voted. A cost-benefit analysis\nmay show that voting all proxies may not benefit all clients."}, {"n": 18, "q": "The Konkol Company implements a new methodology for portfolio valuation that is licensed\nto them by ABC Statistics. To comply with the Code and standards, Konkol should:", "opts": ["discuss the new methodology only with clients whose security selection process will change as a result.", "not discuss the new methodology with clients because doing so would fail to preserve ABC’s confidentiality.", "discuss the new methodology with its clients."], "ans": "C", "expl": "Standard V(B) Communication with Clients and Prospective Clients requires any change in\nthe scope, valuation methodology, or focus of the portfolio to be discussed with clients. No\ninformation is given that would suggest the methodology is confidential."}, {"n": 19, "q": "Juan Lopez manages accounts for Street Capital. Lopez's mother is a client of the firm. Lopez\ndoes not make trades in his mother's accounts until all other clients of the firm have been\ngiven an opportunity to trade. Lopez has:", "opts": ["violated CFA Institute Standards of Professional Conduct because he is not allowed to trade in family accounts.", "violated CFA Institute Standards of Professional Conduct because family accounts that are client accounts should be treated like any other firm accounts.", "not violated CFA Institute Standards of Professional Conduct because transactions for clients should have priority over personal transactions and transactions for beneficial owners."], "ans": "B", "expl": "Standard VI(B) Priority of Transactions. Family accounts that are client accounts should be\ntreated like any other firm accounts. Lopez should refrain from exercising excess caution\nsince his mother is a client of the firm like all other clients.\n(Module 91.1, LOS 91.b)"}, {"n": 20, "q": "Member compliance on issues relating to corporate governance or to soft dollars is primarily\naddressed by the Standard:", "opts": ["Avoid or Disclose Conflicts.", "Referral Fees.", "Loyalty, Prudence, and Care."], "ans": "C", "expl": "Fiduciary duty on issues relating to corporate governance or to soft dollars is primarily\naddressed by Standard III(A), Loyalty, Prudence, and Care."}, {"n": 21, "q": "Bob Blanford, CFA, is an investment analyst for a large global brokerage firm. He recently\nmoved to Ragatan, a developing country. As part of conducting a company analysis, Blanford\ninterviews Ravi Shanti, vice president of finance at Starr Industries. Starr is a major industrial\nfirm in Ragatan and a client at Blanford's firm. Based on his analysis, Blanford suspects that\nShanti may have deliberately overstated Starr's current earnings and its earnings for the\npast several quarters. Blanford suspects that Shanti may have violated Ragatan's securities\nlaws. To comply with the Code and Standards, Blanford should least likely:", "opts": ["determine the legality of the activity, possibly by consulting counsel.", "disassociate himself from the client, if the activity is illegal or unethical.", "take no action."], "ans": "C", "expl": "Because Blanford suspects Shanti of engaging in ongoing illegal activities, Blanford should\ntake action by determining the legality of the suspected action, disassociating from any\nillegal activity, and urging his firm to attempt to persuade Shanti to cease such conduct if\nsuch an activity is illegal or unethical."}, {"n": 22, "q": "Janet Green, CFA, provides investment advice and other services to clients in several\ncountries. She resides in Country A whose securities laws and regulations are less strict than\nthe Code and Standards. She also conducts business with clients in Country B, which has no\nsecurities laws or regulations, and in Country C, which has securities laws and regulations\nthat are stricter than the Code and Standards. Which of the following statements is\nCORRECT? According to CFA Institute Standards of Professional Conduct, Green must adhere\nto the Code and Standards in:", "opts": ["Country A and Country B but the law in Country C.", "Country A but the law in Country B and Country C.", "Country A, Country B, and Country C."], "ans": "A", "expl": "Green needs to follow Standard I(A) -- Knowledge of the law. In Country A, Green must\nadhere to the Code and Standards because Country A's laws are less strict. In Country B,\nGreen must also adheres to the Code and Standards because Country B has no securities\nlaws. Because Country C's applicable law is stricter than the requirements of the Code and\nStandards, Green must adhere to the laws of Country C."}, {"n": 23, "q": "WEB, an investment-banking firm, is the principal underwriter for MTEX's upcoming\ndebenture issue. Wendy Berry, CFA, an analyst with WEB, has found out from an employee in\nMTEX's programming department that a serious glitch was recently discovered in the\nsoftware program of their major new product line. In fact, the glitch is so bad that most of\ntheir orders have been canceled. Berry checked the debenture's prospectus and found no\nmention of this development. The red herring prospectus has already been distributed.\nBerry's best course of action is to:", "opts": ["take no action because this is material non-public information.", "notify potential investors of the omission on a fair and equitable basis.", "inform her immediate supervisor at WEB of her discovery."], "ans": "C", "expl": "Berry should report this information only to her immediate supervisor. Subsequently, she\nand her supervisor may consult with legal counsel concerning the competing issues in this\nsituation. For the present, she should avoid disclosure to colleagues who do not need to\nknow the information and she should also avoid disclosure to clients."}, {"n": 24, "q": "Rachel Young, CFA, is making preparations to start a competitive business before\nterminating her relationship with her employer, a large money management company.\nYoung has used excerpts from research reports by others with only a slight change in\nwording without acknowledging the source. Which of these actions violate the Code and\nStandards?", "opts": ["Only one of these actions.", "Neither of these actions.", "Both of these actions."], "ans": "A", "expl": "By using excerpts from research reports by others with only a slight change in wording\nwithout acknowledging the source, Young committed plagiarism and violated Standard I(C)\nMisrepresentation. Young did not violate Standard IV(A) Loyalty because preparations to\nbegin an independent business are permitted provided that they do not breach Young's\nduty of loyalty to her employer. Actions that would violate Standard IV(A) include soliciting\nclients or taking records or files while still working for the current employer."}, {"n": 25, "q": "Roger Smith, CFA, has been invited to join a group of analysts in touring the riverboats of\nRiver Casino Corp. For the tour, River Casino has arranged chartered flights from casino to\ncasino since commercial flight schedules are not practical for the group's time schedule.\nRiver Casino has also arranged to pay for the analysts' lodging for the three nights of the\ntour. According to CFA Institute Standards of Professional Conduct, Smith:", "opts": ["is required to pay for his flight and lodging.", "may accept the arrangements as they are.", "may accept the flight but is required to pay for his lodging."], "ans": "B", "expl": "Because the itinerary required charter flights due to a lack of commercial transportation,\nRiver Casino can appropriately provide them. While Standard I(B) Independence and\nObjectivity recommends that members pay their own room costs, it is not required and it\nis not unusual for members to accept accommodations.\n(Module 91.1, LOS 91.b)"}, {"n": 26, "q": "Chuck Thomas is the trustee of a trust of which Jill Wyatt is the main beneficiary. Wyatt's\nhusband is the president of a company. In emptying the recycling bin at home, Wyatt finds\nsome papers that lead her to believe that her husband's company will make a tender offer to\nacquire another firm. Wyatt takes the information to Thomas, who uses it to purchase\nshares of the company for the trust, but does not further disclose the information. Thomas\nhas:", "opts": ["not violated any Standards.", "violated the Standards concerning loyalty, prudence, and care.", "violated the Standards concerning material nonpublic information."], "ans": "C", "expl": "Thomas cannot act or cause others to act on material nonpublic information."}, {"n": 27, "q": "Janice Melfi is a portfolio manager for Soprano Advisors. Soprano has developed a\nproprietary model that has been thoroughly researched and is known throughout the\nindustry as the Soprano model. The model is purely quantitative and screens stocks into\nbuy, hold, and sell categories. The basic philosophy of the model is thoroughly explained to\nclients. The director of research frequently alters the model based on rigorous research—an\naspect that is well explained to clients, although the specific alterations are not continually\ndisclosed. Portfolio managers use the model to assist them in making portfolio decisions,\nbut, based on their own fundamental research, are allowed to purchase securities not\nrecommended by the model. This fact is not disclosed to the clients, because the head of\nmarketing does not think it is relevant. Which of the following statements regarding the\nportfolio manager's investment decisions is CORRECT?", "opts": ["Melfi is violating the Standards by using two investment processes that are in conflict with each other.", "Soprano is violating the Standards by not disclosing the fundamental research aspect of the investment process.", "There is no violation of the Standards."], "ans": "B", "expl": "Soprano is violating the Standard on portfolio investment recommendations and actions\nby excluding relevant factors of the investment process. The fundamental research aspect\nis highly relevant to the process and should be disclosed to clients. It is acceptable for\nMelfi to use two investment processes that may be in conflict with each other and to use a\nprocess that was not developed by her."}, {"n": 28, "q": "Lynne Jennings is a chemical industry research analyst for a large brokerage company. That\nindustry is currently seeing an increase in mergers and acquisitions. While flying through\nChicago, Jennings sees several senior officers who she knows are from the largest and fourth\nlargest chemical companies walk into a conference room. She concludes that negotiations\nfor an acquisition might be taking place. Jennings:", "opts": ["may not act or cause others to act on this information.", "may use this information to support an investment recommendation.", "should inform her compliance officer that she has material nonpublic information on firms she covers."], "ans": "B", "expl": "The fact that the company officers met is not material nonpublic information. As long as\nshe bases her investment recommendation on her own independent research, Jennings\nwill not violate any Standards if she uses this additional information to support it."}, {"n": 29, "q": "Art Dodd, CFA, is a registered representative with Owens Securities. He is currently in a\ndispute with one client, Madge Phillips, about a limit order for her account that she feels was\nentered incorrectly, resulting in a loss (in her opinion) of $500. Dodd has 1,000 shares of an\noversubscribed new issue to allocate to clients. He suggests to Phillips that he will give her\n250 shares of this allocation to make up for the supposed trade error. Further, he offers to\nbuy her dinner at a nice restaurant. According to the Standards of Practice, Dodd has most\nlikely violated the Standard concerning:", "opts": ["additional compensation.", "fair dealing.", "misconduct."], "ans": "B", "expl": "Dodd has most likely violated Standard III(B) Fair Dealing by giving Phillips an\novergenerous allocation of the oversubscribed (\"hot\") new issue. The problem is not that\nhe is offering compensation to a client to resolve a dispute but that by overallocating the\nIPO shares to Phillips, he is not treating his other clients fairly. Standard III(B) Fair Dealing\nrequires that members and candidates not use shares of hot issues as an incentive to\nachieve a reward or benefit. The benefit in this case is that the dispute will be resolved.\nDodd's actions do not exhibit any dishonesty that would violate Standard I(D) Misconduct,\nand Dodd is not receiving any additional compensation.\n(Module 91.1, LOS 91.b)"}, {"n": 30, "q": "A member or candidate who produces issuer-paid research should most appropriately\nnegotiate:", "opts": ["compensation in the form of equity or options, but not cash.", "a flat fee prior to writing the report.", "a fee scale based on the subsequent performance of the issuer’s securities."], "ans": "B", "expl": "Standard I(B) Independence and Objectivity states that the best practice for issuer-paid\nresearch is to negotiate a flat fee before writing the report. Compensation that depends\non the performance of the issuer's securities can compromise an analyst's objectivity by\ncreating an incentive to write a positive recommendation.\n(Module 91.1, LOS 91: I(B))"}, {"n": 31, "q": "A CFA Institute member works for Secure Securities, Inc., and plays rugby on the firm's rugby\nteam. Secure Securities' team recently played the team of a rival firm. During the game, a\nfight broke out and the CFA Institute member was the instigator, but no one was seriously\nhurt. Is this a violation of I(A) concerning maintaining knowledge and complying with laws,\nrules, and regulations?", "opts": ["No, because a fight at a rugby game is not a professional activity.", "Yes, because the member could have hurt someone in the fight.", "Yes, because the member is bound by the Code of Ethics."], "ans": "A", "expl": "Standard I(A) covers members' professional activity only. Violations outside professional\nactivity that involve fraud, theft or deceit would potentially be violations."}, {"n": 32, "q": "Sam Lecheval, a Level I CFA candidate, resides in a European Union (EU) country and does\nbusiness in Japan. Lecheval is required to maintain knowledge of and comply with all\napplicable laws, rules, and regulations in:", "opts": ["the EU and the CFA Institute Standards of Professional Conduct, but not Japan.", "both the EU and Japan, but not the CFA Institute Standards of Professional Conduct.", "the EU, Japan, and the CFA Institute Standards of Professional Conduct."], "ans": "C", "expl": "Members and candidates are required to apply the strictest law, rule, or regulation that\napplies where they reside, applies where they do business, or is included in the CFA\nInstitute standards, in all cases where any of these differ."}, {"n": 33, "q": "If a member does business in a country with stricter securities laws and regulations than the\nCode and Standards, but the member's home country has less strict securities laws or\nregulations than the Code and Standards, the member must abide by the:", "opts": ["laws and regulations of the country in which the member is doing business.", "Code and Standards only.", "home country’s securities laws and regulations only."], "ans": "A", "expl": "The member must abide by the laws and regulations of the country in which he is doing\nbusiness if these laws are stricter than his home country's laws or the Code and\nStandards. According to Standard I(A) Knowledge of the Law, a member or candidate must\nadhere to the strictest applicable law or regulation.\n(Module 91.1, LOS 91: I(A))"}, {"n": 34, "q": "Ernesto Vivaldo is a CFA candidate. He is working in the branch office of an American-based\ninvestment company in Belgium. Vivaldo is a citizen of Venezuela. In his country, a portfolio\nmanager is not required to disclose referral fees. Belgian law does not allow referral fees for\nportfolio managers. Vivaldo has been offered a deal that involves a referral fee. Vivaldo\nshould follow the requirements of:", "opts": ["Belgium.", "CFA Institute.", "Venezuela."], "ans": "A", "expl": "According to Standard I(A) Knowledge of the Law, CFA candidates and current CFA Institute\nmembers must follow whichever law is stricter. In this case, the strictest laws are those of\nBelgium.\n(Module 91.1, LOS 91: I(A))"}, {"n": 35, "q": "Judy Gonzales is a portfolio manager with Brenly Capital and works on Johnson Company's\naccount. Brenly has a policy against accepting gifts over $25 from clients. The Johnson\nportfolio has a fantastic year, and in appreciation, the pension fund manager sent Gonzales\na rare bottle of wine. Gonzales should:", "opts": ["inform her supervisor in writing that she received additional compensation in the form of the wine.", "present the bottle of wine to her supervisor.", "return the bottle to the client explaining Brenly's policy."], "ans": "C", "expl": "By not returning the bottle she would be violating the Standard on avoiding or disclosing\nconflicts to the employer, which states that employees must comply with prohibitions\nimposed by their employer."}, {"n": 36, "q": "One year ago, Karen Jason left the employment as a portfolio manager of Howe Advisors.\nThe departure was contentious and both parties threatened legal action. As a result, both\nparties signed a settlement in which Jason was paid a prorated bonus, but agreed not to\nwork on the portfolios of any existing Howe client for two years. The terms of the agreement\nwere that both parties agreed to keep all aspects of the agreement confidential, including\nthe fact that there was hostility surrounding the departure. Jason now works for Torre\nAdvisors, who has the Stein Company as a new client. At the time Jason left Howe, Stein was\na client of Howe, although Jason did not personally work on the Stein portfolio. Jason's\nsupervisor at Torre wants Jason to work on the Stein portfolio. Jason should:", "opts": ["inform her supervisor that she cannot work on the portfolio because of a legal agreement, but cannot tell him why.", "inform her supervisor that she cannot work on the portfolio because of a non- compete agreement.", "work on the portfolio because she did not personally work on the portfolio when she was at Howe."], "ans": "A", "expl": "Jason must inform her supervisor of the conflict, but she cannot violate the terms of the\nconfidentiality agreement and she cannot work on the portfolio."}, {"n": 37, "q": "Ken Koski, CFA, issues a press release that includes the following statement:\nWe are proud to announce that two of our managers have earned the right to\nuse the CFA designation. In addition, four of our junior analysts have become\nLevel III CFA candidates. These individuals have proven their dedication to the\ninvestment community and shown commitment to the highest ethical\nstandards.\nWith regard to the statements in the press release:", "opts": ["Koski has violated the Code and Standards by improperly referencing the managers’ right to use the CFA designation.", "Koski has violated the Code and Standards by implying superior performance results.", "all these statements are in compliance with CFA Institute Standards."], "ans": "C", "expl": "All of the statements are acceptable according to Standard VII(B), Reference to CFA\nInstitute, the CFA designation, and the CFA Program. Koski is allowed to make a statement\nof fact such as the managers' right to use the CFA designation. Koski may reference the\nparticipation of his employees in the CFA program if the employees are currently\nregistered to take one of the exams. The statements regarding dedication to the\ninvestment community and commitment to the highest ethical standards are proper\nreferences regarding the CFA program.\n(Module 91.1, LOS 91.b)"}, {"n": 38, "q": "While copying some of her research materials at work, Mary Jones comes across a few\nincomplete research notes written by one of her colleagues. As a result of reading the notes,\nand without further review, Jones immediately changes one of her stock recommendations\nfrom sell to buy. Which of the following CFA Institute Standards has Jones violated?", "opts": ["Standard III(A), Loyalty, Prudence, and Care.", "Standard I(B), Independence and Objectivity.", "Standard V(A), Diligence and Reasonable Basis."], "ans": "C", "expl": "Jones has violated Standard V(A) by failing to exercise diligence and thoroughness.\n(Module 91.1, LOS 91.b)"}, {"n": 39, "q": "Joshua Rosenberg, CFA, is an equity analyst who covers Northwest Implements, a farm\nimplement manufacturer. Northwest's main factory is located in a sparsely inhabited region\nsix hours by automobile from the nearest airport. Northwest has its own corporate jet and a\nlanding strip near its facility. When Rosenberg contacts Northwest's management to arrange\na visit for a report he is preparing on the company, Northwest's chief financial officer offers\nto send Northwest's corporate jet to pick up Rosenberg from an airport near his home and\nreturn him home the same evening. Rosenberg estimates that it would require three days\nfor him to make the visit using commercial travel. If Rosenberg makes the trip to Northwest's\nheadquarters on the corporate jet, the Standard concerning independence and objectivity:", "opts": ["permits him to do so.", "requires him to disclose in his report on Northwest the company's payment of his travel expenses.", "requires him or his employer to reimburse Northwest for the cost of the trip."], "ans": "A", "expl": "According to Standard I(B) Independence and Objectivity, a visit by an analyst to an out-of-\nthe-way site may be provided by a company host if commercial transportation is\nunavailable or inefficient. If the use of such transportation creates the appearance of a\nconflict of interest or interferes with an analyst's ability to provide unbiased opinions,\nStandard VI(A) Avoid or Disclose Conflicts would require the analyst to disclose it to his\nemployer and clients."}, {"n": 40, "q": "Under Standard IV(A) Loyalty (to employers):", "opts": ["it is recommended that members deliver a copy of the Code and Standards to their employer.", "members are encouraged to leave an employer that does not adopt the Code and Standards as part of its policies and procedures.", "members are required to deliver a copy of the Code and Standards to their employer."], "ans": "A", "expl": "Standard IV(A) Loyalty recommends (not requires) that members and candidates provide\ntheir employer with a copy of the Code and Standards and notify their employer that they\nare required to follow the Code and Standards. There is no recommendation to leave a\nfirm simply because the Code and Standards have not been adopted by the firm in its\npolicies and procedures."}, {"n": 41, "q": "Rhonda Morrow, CFA, is an analyst for Waller & Madison, a brokerage and investment\nbanking firm. Waller & Madison is a market maker for CorpEast, and Tim Waller, a principal\nin Morrow's firm, sits on CorpEast's board. Morrow has been asked to write a research\nreport on CorpEast. According to the Standard regarding disclosure of conflicts, Morrow:", "opts": ["must disclose that Waller & Madison is a market maker in CorpEast shares but not that Waller is a board member.", "must not write the report.", "may write the report if she discloses both that Waller & Madison is a market maker in CorpEast shares and that Waller sits on the CorpEast board."], "ans": "C", "expl": "To comply with Standard VI(A) Avoid or Disclose Conflicts, both the market-making\nactivities by the firm and the directorship held by a principal in the firm must be disclosed.\n(Module 91.1, LOS 91.b)"}, {"n": 42, "q": "Amanda Bradford is a security analyst at UpTrend, Inc. During a routine visit to a beauty\nsalon, she learns that a major cosmetic company, Lorean, is expected to present a\nrevolutionary formula for facial cream. Bradford begins writing a research report on the\ncompany. Bradford also calls Hillary Lang, CFA, an investment advisor at UpTrend, to inform\nher about the news and her forthcoming report. Lang buys Lorean stock for her clients'\nportfolios. Bradford's report, which is distributed two days later to all UpTrend clients, states\nthat given the ongoing research activity at Lorean, investors can expect some successful new\nproducts and a sharp increase in its share price.\nLang's actions least likely violate the Standard concerning:", "opts": ["independence and objectivity.", "material nonpublic information.", "fair dealing."], "ans": "A", "expl": "Relying on research from another analyst in the firm is acceptable under Standard I(B)\nIndependence and Objectivity. However, Lang violated Standard III(B) Fair Dealing by\nacting on Bradford's research for her own clients before it has been disseminated to all\nclients. .While the scenario given in this question does not suggest the information about\nLorean is nonpublic, Standard II(A) Material Nonpublic Information states that research\nrecommendations may be material because they have the potential to affect security\nprices. Thus Lang may have violated this Standard as well by acting on Bradford's report\nbefore it became public.\n(Module 91.1, LOS 91.b)"}, {"n": 43, "q": "Joan Platt, CFA, operates an investment advisory service in New York but maintains an office\nin Xania. Xania recently established a stock market, which is not very efficient. None of the\nXanian stocks trade in the U.S. market. Xania legally permits the use of material nonpublic\ninformation. Platt believes that using nonpublic information would help her compete against\nother Xanian investment advisors and also help some of her Xanian clients reach their\ninvestment objectives. Platt is considering adopting local investment practices in Xania.\nAccording to CFA Institute Standards of Professional Conduct, Platt may:", "opts": ["use material nonpublic information because Xania legally permits this practice.", "not use material nonpublic information for her own benefit, but may use it to benefit her clients.", "not use material nonpublic information."], "ans": "C", "expl": "Because applicable law involving material nonpublic information is less strict than the\nCode and Standards, Platt must adhere to the Code and Standards. Standard II(A) Material\nNonpublic Information prohibits members and candidates from acting or causing others to\nact on such information.\n(Module 91.1, LOS 91: I(A))"}, {"n": 44, "q": "Jack Stevens is employed by a company to provide investment advice to participants in the\nfirm's 401(k) plan. One of the investment options is a stable value fund run by the company.\nStevens' research indicates that the fund is far riskier and less liquid than the typical stable\nvalue fund and has a fundamental asset value lower than the book value of the assets. He\ntells Jessica Cox, the head of employee benefits, about his research, and indicates that he\nwill advise new employees to not invest in the fund and will advise employees who already\nown the fund to reduce their holdings in the fund. Cox points out that the fund is not in any\ncurrent danger because there are very few redemptions requested of the fund. Cox also\nstates that a sell recommendation may become a self fulfilling prophecy, causing investors\nto redeem their shares and forcing the fund to liquidate, which in turn will cause the\nremaining investors to receive less than their promised value. Stevens agrees with this\nassessment and feels his fiduciary duty is to all employees. Stevens should:", "opts": ["continue to recommend that new investors do not invest in the fund and existing investors reduce their holdings.", "continue to recommend that new investors do not invest in the fund, but not advise existing investors to reduce their holdings.", "tell investors he cannot give advice on the fund because of a conflict of interest."], "ans": "A", "expl": "The employees to whom Stevens owes fiduciary duty are the ones who are seeking his\nadvice, even if acting on that advice hurts other employees who might eventually become\nclients."}, {"n": 45, "q": "Greg Allen is a security analyst and visits David Dawson, the Chief Financial Officer of\nEdmonds Company. Dawson reveals a great deal of nonmaterial financial data to Allen, data\nthat Dawson routinely reveals to all security analysts who visit him. From this data and other\nindustry information, Allen conjectures that Edmonds is likely to make a tender offer for\nanother company in the industry, a fact that if true would be considered material to the\nvalue of the company. Allen:", "opts": ["can publish his conclusion in a research report.", "must not disseminate the information or use it for trading purposes until the tender offer is announced.", "should send a copy of the report to Dawson for verification before disseminating the report to clients."], "ans": "A", "expl": "While the information that Allen received from the Edmonds CEO may be non-public, we\nare also told that it is non-material. Because Allen has reached his investment conclusion\nthrough an analysis of public information together with items of non-material non-public\ninformation (i.e., \"mosaic theory\"), publishing this conclusion is not a violation of the Code\nand Standards."}, {"n": 46, "q": "Maria Valdes, CFA, is an analyst for Venture Investments in the country of Newamerica,\nwhich has laws prohibiting the acceptance of any gift from a vendor if the gift exceeds US\n$250. Valdes has evidence that her Venture Investments colleague, Ernesto Martinez, CFA,\nhas been receiving gifts from vendors in excess of US $250.\nValdes is obligated to:", "opts": ["disassociate herself from the activity, and urge Venture to persuade Martinez to cease the activity.", "disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute and regulatory authorities of the violation.", "disassociate herself from the activity, urge Venture to persuade Martinez to cease the activity, and inform CFA Institute of the violation."], "ans": "A", "expl": "Standard I(A), Knowledge of the Law requires members who have knowledge of colleagues\nengaging in illegal activities to disassociate from the activity and urge their firms to\npersuade the individual to cease such activity. Reporting to regulatory authorities may be\nprudent in certain circumstances, but is not required. Reporting to CFA Institute is not\nrequired."}, {"n": 47, "q": "Randy Wesson is a research analyst for a large brokerage company following the chemical\nindustry. Wesson During a visit to Hunt Chemical Company, Wesson overhears two\nexecutives talking about an upcoming divestiture of a significant subsidiary, which has not\nbeen announced to the public. Wesson should:", "opts": ["not use the information.", "write a research report describing the possibility of a divestiture, but not mention that the company has decided to carry it out.", "inform his company’s clients of the divestiture."], "ans": "A", "expl": "The information is material and nonpublic; therefore, Wesson must not act or cause\nothers to act on the information. To do so would violate Standard II(A) Material Nonpublic\nInformation.\n(Module 91.1, LOS 91.b)"}, {"n": 48, "q": "Rickard Advisors recently had a trading error in a customer account that was subsequently\ndiscovered by Rickard. The firm felt embarrassed by the disclosure of this error, and, in\norder to induce the client to continue its relationship, Rickard offers the client preferential\naccess to a new issue that is expected to be \"hot.\" Which Standard is violated, if any?", "opts": ["The Standard concerning Fair Dealing.", "The Standard concerning Fiduciary Duty.", "The Standard concerning Independence and Objectivity."], "ans": "A", "expl": "Rickard is in violation of the Standard concerning Fair Dealing by offering the client\npreferential access to a \"hot\" new issue. There is no obvious violation of Fiduciary Duty,\nsince there is no evidence that Rickard is placing its own financial interest ahead of the\nclient.\n(Module 91.1, LOS 91.b)"}, {"n": 49, "q": "According to the CFA Institute Standards of Professional Conduct, Standard I(A), Knowledge\nof the Law, members shall not knowingly participate or assist in any violations of laws, rules,\nor regulations. An analyst:", "opts": ["is held responsible for participating in illegal acts when the law is evident to anyone knowing the law and can participate in a violation by having knowledge of the violation and taking no action to stop it or disassociate from it.", "is held responsible for participating in illegal acts when the law is evident to anyone knowing the law and is held responsible for violations by others when the analyst is unaware of the facts giving rise to the violation.", "must report all legal violations to the proper regulatory commission and is held responsible for participating in illegal acts when the law is evident to anyone knowing the law."], "ans": "A", "expl": "If you suspect someone is planning or engaging in illegal activities, you should:\n1. Determine the legality of the activities. Consult your supervisor and legal counsel.\n2. Take appropriate action. Disassociate, attempt to persuade the perpetrator to stop.\nCFA Institute does not require you to report them to the authorities, but the law\nmight."}, {"n": 50, "q": "Cynthia Abbott, a CFA charterholder, is preparing a research report on Boswell Company for\nher employer, Capital Asset Management. Bob Carter, president of Boswell, invites Abbott\nand several other analysts to visit his company and offers to pay her transportation and\nlodging. While visiting the company, Abbott accepts an item of small value from Carter.\nAbbott does not disclose this gift to her supervisor at Capital when she returns. According to\nthe Standard related to independence and objectivity, Abbott most likely:", "opts": ["may allow Carter to pay for her transportation and lodging but is required to disclose the gift.", "should have her employer pay for her transportation and lodging, but is not required to disclose the gift.", "is required to refuse both the gift and the offer to pay for her transportation and lodging."], "ans": "B", "expl": "Standard I(B) Independence and Objectivity states that travel to outside companies by\nmembers and candidates should be paid for by their employers or themselves, except in\ncases where commercial transportation is unavailable. Modest gifts that would not\nreasonably be expected to compromise a member or candidate's independent judgment\nare acceptable and the Standard does not require these to be disclosed to employers.\n(Module 91.1, LOS 91.b)"}, {"n": 51, "q": "Jim Crockett is a portfolio manager for Miami Advisors and reports to Vicki Tubbs, the Chief\nInvestment Officer. Miami has developed a proprietary model that has been thoroughly\nresearched and is known throughout the industry as the Miami model. The model is purely\nquantitative and takes a given set of client characteristics and universe of potential securities\nand forms a portfolio for the investor. Individual portfolio managers are responsible for\nselecting securities to fit into the model based on recommendations from the firm's research\ndepartment and the managers' own judgment. Because of the specific nature of the inputs\nto the model, each manager is responsible for applying the model on his or her own\ncomputer. The basic philosophy of the process is thoroughly explained to clients. Crockett\ndoes not understand the basics of the model, but feels that since it provides pure\nquantitative output, he does not need to understand it. However, he misapplies the model\nfor several of his clients. In reviewing some of Crockett's portfolios, Tubbs finds the errors\nand points them out to Crockett. Which of the following statements regarding Tubbs and\nCrockett is CORRECT?", "opts": ["Tubbs has violated the Standards by failing to supervise adequately.", "Crockett has violated the Standards by not exercising diligence and thoroughness in making investment recommendations.", "Crockett has violated the Standards by not considering the appropriateness and suitability of the investment for his clients."], "ans": "B", "expl": "Crockett had a responsibility to know the model well enough to detect the mistakes that\ncould occur from misapplication, so he violated the Standard of diligence and reasonable\nbasis.\n(Module 91.1, LOS 91.b)"}, {"n": 52, "q": "Mary Kim, CFA, practices in the established country of Oldasia as well as in the emerging\ncountry of Newasia. By regulation, Oldasia prohibits licensed investment advisors from\ntrading in securities ahead of their clients. Newasia has no laws or regulations in this area.\nMary Kim may:", "opts": ["not trade ahead of her clients in either country.", "trade ahead of her clients in Newasia only, as long as she has made full disclosure to her clients that she reserves the right to do this.", "trade ahead of her clients in Newasia only."], "ans": "A", "expl": "Under Standard I(A), Mary Kim, as a CFA charterholder, must apply the CFA Institute Code\nand Standards or the controlling law, whichever is stricter. Because Standard VI(B)\nrequires members to put client trades ahead of their own transactions, Mary Kim must\nfollow the standard in the absence of governing law, or where the law is less strict than the\nstandard.\n(Module 91.1, LOS 91: I(A))"}, {"n": 53, "q": "Brendan Duval works as a research analyst for Toby Securities. Duval recommends changing\na recommendation from \"sell\" to \"buy\" on Dalton Company. His firm, which manages several\nmutual funds, may be interested in buying Dalton's stock. He also manages the retirement\naccount that his parents established with Toby. Duval wants to buy shares of Dalton's stock\nbecause it is an appropriate investment for his parent's retirement account and obtains\napproval from his employer to do so. Duval is also thinking about personally investing in\nDalton stock. According to CFA Institute Standards of Professional Conduct, which of the\nfollowing best describes the priority of transactions? Duval should give:", "opts": ["priority to Toby's clients and his employer concurrently, followed by his parent's retirement account, and finally his personal account.", "priority of transactions to Toby's clients, followed by his employer, then his parent's retirement account, and finally his personal account.", "Toby's clients and his parent's account equal priority, followed by his employer, and then his personal account."], "ans": "C", "expl": "According Standard VI(B) Priority of Transactions, Duval should give transactions for clients\nand employers priority over his personal transactions. Because his parent's retirement\naccount represents a client account at Toby, Duval should treat this account just like any\nother firm account. His parent's retirement account should neither be given special\ntreatment nor disadvantaged because of an existing family relationship with Duval. If\nDuval treats his parent's retirement account differently from other accounts at Toby, he\nwould breach his fiduciary duty to his parents."}, {"n": 54, "q": "Susan Nielsen, CFA, is an equity research analyst on a fact-finding property tour with 6 other\nanalysts to learn about Just Kittens, Inc. Just Kittens sells tungsten ball-bearings and has 16\nwarehouses, and 20 manufacturing, research, and wholesale sales outlets scattered over 8\ncountries – mostly emerging markets. Because of the remote location of some of the\nfacilities, commercial travel is effectively unavailable. Just Kittens charters a jet and various\nbusses to take the research analysts to the properties. If Nielsen accepts these\naccommodations, she is most likely:", "opts": ["in violation of Standard I(B) \"Independence and Objectivity.\"", "not in violation of Standard I(B) \"Independence and Objectivity\" because best practices dictate that better access to company executives is likely to lead to more accurate and timely information.", "not in violation of Standard I(B) \"Independence and Objectivity\" because commercial travel is effectively unavailable."], "ans": "C", "expl": "Nielsen is not in violation of Standard I(B) \"Independence and Objectivity\" because\ncommercial travel is effectively unavailable.\n(Module 91.1, LOS 91: I(B))"}, {"n": 55, "q": "If an analyst suspects a client or a colleague of planning or engaging in ongoing illegal\nactivities, which of the statements about the actions that the analyst should take is most\ncorrect? According to the CFA Institute Standards of Professional Conduct, the analyst\nshould:", "opts": ["consult counsel to determine the legality of the activity and disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical.", "consult counsel to determine the legality of the activity.", "disassociate from any illegal or unethical activity if the member has reasonable grounds to believe that the activity is illegal or unethical."], "ans": "A", "expl": "According to the procedures for compliance involving Standard I(A), CFA Institute members\nshould determine legality and disassociate from any illegal or unethical activity."}, {"n": 56, "q": "Todd Gregory has been recently hired as the head of compliance for Speed Capital. He\ndecides the firm should precisely follow the recommendations of the CFA Institute Standards\nof Professional Conduct to ensure integrity within the firm. Which of the following is NOT a\ncompliance procedure that Speed should put in place?", "opts": ["A requirement of disclosure of all investment holdings of friends and family members of employees on an annual basis.", "A requirement that employees provide duplicate confirmations of personal investing transactions.", "A requirement that investment personnel should clear all personal investments to identify possible conflicts."], "ans": "A", "expl": "Members and Candidates are not required to disclose investment holdings of friends\nunless those holdings create a conflict of interest.\n(Module 91.1, LOS 91.b)"}, {"n": 57, "q": "Graham Carson, CFA, is an investment advisor to Ron Grayson, a client with moderate risk\ntolerance and an investment horizon of 15 years. Grayson calls Carson to complain about\ntwo stocks in his account that have performed poorly. He feels that one stock was too risky\nfor him as it paid no dividend and had a beta of 1.4. The other stock had a beta of 0.9 and\npaid a dividend of 3%, but financial regulators have indicated that the firm's reported\nearnings were incorrectly stated. Based on this information, Carson has most likely:", "opts": ["violated both the Standard on suitability and the Standard on diligence and reasonable basis.", "not violated the Standards.", "violated only the Standard on suitability."], "ans": "B", "expl": "Carson has not violated either Standard based on the information given. The suitability of\nan investment is to be determined based on the risk and return characteristics of the\nportfolio and not on the risk and return characteristics of each individual security. The fact\nthat a security does not pay a dividend and has a beta higher than the market is not\nenough to determine its suitability in a portfolio context. The fact that regulators have\ncalled previously reported earnings into question does not necessarily mean that Carson's\nanalysis was not diligent or that he did not have a reasonable basis for his selection of this\nsecurity.\n(Module 91.1, LOS 91.b)"}, {"n": 58, "q": "CFA Institute believes:", "opts": ["that a maximum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct.", "that firms should comply with all domestic laws and regulations and that these laws also govern behavior in foreign markets, regardless of foreign laws and requirements.", "that a minimum level of professional responsibility and conduct dictates that members be aware of and comply with laws, rules, and regulations governing their conduct."], "ans": "C", "expl": "CFA Institute's Code and Standards dictate a minimum level of conduct. Standards should\nnot be based on ethics of upper management and the board of directors of a company.\nFirms must comply with the strictest applicable standards, whether they be foreign or\ndomestic laws and regulations."}, {"n": 59, "q": "In the course of reviewing the Corn Co., an analyst has received comments from\nmanagement that, while not meaningful by themselves, when pieced together with data he\nhas accumulated from outside sources, lead him to recommend placing Corn Co. on his\nfirm's sell list. What should the analyst do?", "opts": ["Not issue the report until the comments are publicly announced.", "The comments are non material and the report can be issued as long as he maintains a file of the facts as supplied by management.", "Show his report to his own manager and counsel for their review since this information has become material once it was combined with his analysis."], "ans": "B", "expl": "This is an example of the mosaic theory where separate pieces of nonmaterial information\nare pieced together to make an investment recommendation."}, {"n": 60, "q": "Ken James has been an independent financial advisor for 15 years. He received his CFA\nCharter in 2013, but did not feel it helped his business, so he let his dues lapse this year. He\nstill has several hundred business cards with the CFA designation printed on them. His\npromotional materials state that he received his CFA designation in 2013. James:", "opts": ["must cease distributing the cards with the CFA designation, but may continue to use the existing promotional materials.", "must cease distributing the cards with the CFA designation and the existing promotional materials.", "may continue to use the existing promotional materials, and may use the cards until his supply runs out—his new cards cannot have the designation."], "ans": "A", "expl": "Because he is not currently a dues-paying member, James must stop using the CFA\ndesignation immediately. However, the year he was awarded the Charter is a fact."}, {"n": 61, "q": "Jack Harris, a CFA candidate, is a telecommunications analyst at Hasten Securities. Based\nupon his analysis of Midwest Telecom, he changes his recommendation of the company's\ncommon stock from \"hold\" to \"sell.\" Before disseminating his recommendation and the\nreason for the change to Hasten's clients, Harris informs several portfolio managers at\nHasten, whom he knows personally own Midwest stock, of the changed recommendation.\nSeveral days later, Hasten communicates the change in investment recommendation on\nMidwest to clients known to have bought Midwest and those who currently hold the stock.\nJane White, CFA, is a broker at Hasten Securities. One of her clients places a buy order\ncontrary to the current recommendation on Midwest. After advising her client of the\nrecommendation, she executes the transaction.\nAccording to Standard III(B), Fair Dealing, which of the following statements about Harris and\nWhite's actions is CORRECT?", "opts": ["Both Harris and White violated Standard III(B).", "Harris violated Standard III(B), but White did not violate Standard III(B).", "Neither Harris nor White violated Standard III(B)."], "ans": "B", "expl": "Harris violated Standard III(B), Fair Dealing by not treating all customers fairly. Instead, he\ndisclosed the information selectively to some of his firm's portfolio managers. White did\nnot violate Standard III(B) because she communicated to the person placing a buy order\non Midwest that the order was contrary to the current recommendation before executing\nthe order.\n(Module 91.1, LOS 91.b)"}, {"n": 62, "q": "Ken Howell, CFA, plans to issue a buy recommendation for Glazer Oil, Inc., based on his\nanalysis and forecasts. Howell suspects that the company will soon announce merger plans\nwith a Japanese oil company. To investigate, Howell attempts to call three executives at\nGlazer. Different secretaries inform Howell that the executives are \"attending a conference\noverseas\" or \"traveling in Japan.\" Howell is able to confirm that all three are in the same city\nin Japan where the potential merger partner is headquartered. Howell feels confident that\nthe merger will go forward. According to CFA Institute Standards of Professional Conduct,\nHowell may issue a buy recommendation on the oil company:", "opts": ["immediately.", "only after allowing the companies a reasonable time to disclose
