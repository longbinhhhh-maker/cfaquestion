a client of Howe, although Jason did not personally work on the Stein portfolio. Jason's\nsupervisor at Torre wants Jason to work on the Stein portfolio. Jason should:","opts":["inform her supervisor that she cannot work on the portfolio because of a legal agreement, but cannot tell him why.","inform her supervisor that she cannot work on the portfolio because of a non- compete agreement.","work on the portfolio because she did not personally work on the portfolio when she was at Howe."],"ans":"A","expl":"Jason phải thông báo cho người giám sát của mình về xung đột nhưng cô không thể vi phạm các điều khoản của\nthỏa thuận bảo mật và cô ấy không thể làm việc với danh mục đầu tư."},{"n":37,"q":"Ken Koski, CFA, issues a press release that includes the following statement:\nWe are proud to announce that two of our managers have earned the right to\nuse the CFA designation. In addition, four of our junior analysts have become\nLevel III CFA candidates. These individuals have proven their dedication to the\ninvestment community and shown commitment to the highest ethical\nstandards.\nWith regard to the statements in the press release:","opts":["Koski has violated the Code and Standards by improperly referencing the managers’ right to use the CFA designation.","Koski has violated the Code and Standards by implying superior performance results.","all these statements are in compliance with CFA Institute Standards."],"ans":"C","expl":"Tất cả các tuyên bố đều được chấp nhận theo Tiêu chuẩn VII(B), Tham khảo CFA\nInstitute, chỉ định CFA và Chương trình CFA. Koski được phép đưa ra tuyên bố\nthực tế chẳng hạn như quyền của người quản lý trong việc sử dụng chỉ định CFA. Koski có thể tham khảo\nsự tham gia của nhân viên vào chương trình CFA nếu nhân viên đó hiện\nđã đăng ký tham gia một trong các kỳ thi. Các tuyên bố liên quan đến sự cống hiến cho cộng đồng đầu tư\nvà cam kết đối với các tiêu chuẩn đạo đức cao nhất là\ntài liệu tham khảo thích hợp về chương trình CFA.\n(Module 91.1, LOS 91.b)"},{"n":38,"q":"While copying some of her research materials at work, Mary Jones comes across a few\nincomplete research notes written by one of her colleagues. As a result of reading the notes,\nand without further review, Jones immediately changes one of her stock recommendations\nfrom sell to buy. Which of the following CFA Institute Standards has Jones violated?","opts":["Standard III(A), Loyalty, Prudence, and Care.","Standard I(B), Independence and Objectivity.","Standard V(A), Diligence and Reasonable Basis."],"ans":"C","expl":"Jones đã vi phạm Tiêu chuẩn V(A) do không thực hiện sự siêng năng và kỹ lưỡng.\n(Mô-đun 91.1, LOS 91.b)"},{"n":40,"q":"Under Standard IV(A) Loyalty (to employers):","opts":["it is recommended that members deliver a copy of the Code and Standards to their employer.","members are encouraged to leave an employer that does not adopt the Code and Standards as part of its policies and procedures.","members are required to deliver a copy of the Code and Standards to their employer."],"ans":"A","expl":"Tiêu chuẩn IV(A) Lòng trung thành khuyến nghị (không yêu cầu) các thành viên và ứng viên cung cấp\ncho chủ nhân của họ một bản sao Quy tắc và Tiêu chuẩn, đồng thời thông báo cho chủ nhân của họ rằng họ\nđược yêu cầu phải tuân theo Quy tắc và Tiêu chuẩn. Không có khuyến nghị nào về việc rời bỏ một công ty\nchỉ vì Quy tắc và Tiêu chuẩn chưa được công ty áp dụng trong\ncác chính sách và thủ tục của mình."},{"n":41,"q":"Rhonda Morrow, CFA, is an analyst for Waller & Madison, a brokerage and investment\nbanking firm. Waller & Madison is a market maker for CorpEast, and Tim Waller, a principal\nin Morrow's firm, sits on CorpEast's board. Morrow has been asked to write a research\nreport on CorpEast. According to the Standard regarding disclosure of conflicts, Morrow:","opts":["must disclose that Waller & Madison is a market maker in CorpEast shares but not that Waller is a board member.","must not write the report.","may write the report if she discloses both that Waller & Madison is a market maker in CorpEast shares and that Waller sits on the CorpEast board."],"ans":"C","expl":"Tuân thủ với Tiêu chuẩn VI(A) Tránh hoặc Tiết lộ Xung đột, cả hoạt động tạo lập thị trường\ncủa công ty và quyền giám đốc do người đứng đầu nắm giữ trong công ty đều phải được tiết lộ.\n(Mô-đun 91.1, LOS 91.b)"},{"n":43,"q":"Joan Platt, CFA, operates an investment advisory service in New York but maintains an office\nin Xania. Xania recently established a stock market, which is not very efficient. None of the\nXanian stocks trade in the U.S. market. Xania legally permits the use of material nonpublic\ninformation. Platt believes that using nonpublic information would help her compete against\nother Xanian investment advisors and also help some of her Xanian clients reach their\ninvestment objectives. Platt is considering adopting local investment practices in Xania.\nAccording to CFA Institute Standards of Professional Conduct, Platt may:","opts":["use material nonpublic information because Xania legally permits this practice.","not use material nonpublic information for her own benefit, but may use it to benefit her clients.","not use material nonpublic information."],"ans":"C","expl":"Vì luật hiện hành liên quan đến thông tin quan trọng không công khai ít nghiêm ngặt hơn\nQuy tắc và Tiêu chuẩn nên Platt phải tuân thủ Quy tắc và Tiêu chuẩn. Tài liệu Tiêu chuẩn II(A)\nThông tin không công khai cấm các thành viên và ứng viên hành động hoặc khiến người khác\nhành động dựa trên thông tin đó.\n(Mô-đun 91.1, LOS 91: I(A))"},{"n":44,"q":"Jack Stevens is employed by a company to provide investment advice to participants in the\nfirm's 401(k) plan. One of the investment options is a stable value fund run by the company.\nStevens' research indicates that the fund is far riskier and less liquid than the typical stable\nvalue fund and has a fundamental asset value lower than the book value of the assets. He\ntells Jessica Cox, the head of employee benefits, about his research, and indicates that he\nwill advise new employees to not invest in the fund and will advise employees who already\nown the fund to reduce their holdings in the fund. Cox points out that the fund is not in any\ncurrent danger because there are very few redemptions requested of the fund. Cox also\nstates that a sell recommendation may become a self fulfilling prophecy, causing investors\nto redeem their shares and forcing the fund to liquidate, which in turn will cause the\nremaining investors to receive less than their promised value. Stevens agrees with this\nassessment and feels his fiduciary duty is to all employees. Stevens should:","opts":["continue to recommend that new investors do not invest in the fund and existing investors reduce their holdings.","continue to recommend that new investors do not invest in the fund, but not advise existing investors to reduce their holdings.","tell investors he cannot give advice on the fund because of a conflict of interest."],"ans":"A","expl":"Những nhân viên mà Stevens có nghĩa vụ ủy thác là những người đang tìm kiếm\nlời khuyên của anh ấy, ngay cả khi hành động theo lời khuyên đó làm tổn thương những nhân viên khác, những người cuối cùng có thể trở thành\nkhách hàng."},{"n":45,"q":"Greg Allen is a security analyst and visits David Dawson, the Chief Financial Officer of\nEdmonds Company. Dawson reveals a great deal of nonmaterial financial data to Allen, data\nthat Dawson routinely reveals to all security analysts who visit him. From this data and other\nindustry information, Allen conjectures that Edmonds is likely to make a tender offer for\nanother company in the industry, a fact that if true would be considered material to the\nvalue of the company. Allen:","opts":["can publish his conclusion in a research report.","must not disseminate the information or use it for trading purposes until the tender offer is announced.","should send a copy of the report to Dawson for verification before disseminating the report to clients."],"ans":"A","expl":"Mặc dù thông tin mà Allen nhận được từ Giám đốc điều hành Edmonds có thể không công khai nhưng chúng tôi\ncũng được thông báo rằng đó là thông tin phi vật chất. Bởi vì Allen đã đạt được kết luận đầu tư của mình\nthông qua việc phân tích thông tin công khai cùng với các mục thông tin phi vật chất, không công khai\n(tức là \"lý thuyết khảm\") nên việc công bố kết luận này không vi phạm Quy tắc\nvà Tiêu chuẩn."},{"n":47,"q":"Randy Wesson is a research analyst for a large brokerage company following the chemical\nindustry. Wesson During a visit to Hunt Chemical Company, Wesson overhears two\nexecutives talking about an upcoming divestiture of a significant subsidiary, which has not\nbeen announced to the public. Wesson should:","opts":["not use the information.","write a research report describing the possibility of a divestiture, but not mention that the company has decided to carry it out.","inform his company’s clients of the divestiture."],"ans":"A","expl":"Thông tin này là quan trọng và không công khai; do đó, Wesson không được hành động hoặc khiến\nngười khác hành động dựa trên thông tin đó. Làm như vậy sẽ vi phạm Tiêu chuẩn II(A) Tài liệu không công khai\nThông tin.\n(Mô-đun 91.1, LOS 91.b)"},{"n":48,"q":"Rickard Advisors recently had a trading error in a customer account that was subsequently\ndiscovered by Rickard. The firm felt embarrassed by the disclosure of this error, and, in\norder to induce the client to continue its relationship, Rickard offers the client preferential\naccess to a new issue that is expected to be \"hot.\" Which Standard is violated, if any?","opts":["The Standard concerning Fair Dealing.","The Standard concerning Fiduciary Duty.","The Standard concerning Independence and Objectivity."],"ans":"A","expl":"Rickard đã vi phạm Tiêu chuẩn liên quan đến Giao dịch công bằng khi cung cấp cho khách hàng\nquyền truy cập ưu tiên vào một vấn đề mới \"nóng\". Không có hành vi vi phạm rõ ràng nào về Nghĩa vụ ủy thác,\nvì không có bằng chứng nào cho thấy Rickard đang đặt lợi ích tài chính của mình lên trên\nkhách hàng.\n(Module 91.1, LOS 91.b)"},{"n":51,"q":"Jim Crockett is a portfolio manager for Miami Advisors and reports to Vicki Tubbs, the Chief\nInvestment Officer. Miami has developed a proprietary model that has been thoroughly\nresearched and is known throughout the industry as the Miami model. The model is purely\nquantitative and takes a given set of client characteristics and universe of potential securities\nand forms a portfolio for the investor. Individual portfolio managers are responsible for\nselecting securities to fit into the model based on recommendations from the firm's research\ndepartment and the managers' own judgment. Because of the specific nature of the inputs\nto the model, each manager is responsible for applying the model on his or her own\ncomputer. The basic philosophy of the process is thoroughly explained to clients. Crockett\ndoes not understand the basics of the model, but feels that since it provides pure\nquantitative output, he does not need to understand it. However, he misapplies the model\nfor several of his clients. In reviewing some of Crockett's portfolios, Tubbs finds the errors\nand points them out to Crockett. Which of the following statements regarding Tubbs and\nCrockett is CORRECT?","opts":["Tubbs has violated the Standards by failing to supervise adequately.","Crockett has violated the Standards by not exercising diligence and thoroughness in making investment recommendations.","Crockett has violated the Standards by not considering the appropriateness and suitability of the investment for his clients."],"ans":"B","expl":"Crockett có trách nhiệm hiểu rõ mô hình để phát hiện những sai sót\ncó thể xảy ra do áp dụng sai, vì vậy anh ta đã vi phạm Tiêu chuẩn về sự siêng năng và hợp lý\nbasis.\n(Mô-đun 91.1, LOS 91.b)"},{"n":53,"q":"Brendan Duval works as a research analyst for Toby Securities. Duval recommends changing\na recommendation from \"sell\" to \"buy\" on Dalton Company. His firm, which manages several\nmutual funds, may be interested in buying Dalton's stock. He also manages the retirement\naccount that his parents established with Toby. Duval wants to buy shares of Dalton's stock\nbecause it is an appropriate investment for his parent's retirement account and obtains\napproval from his employer to do so. Duval is also thinking about personally investing in\nDalton stock. According to CFA Institute Standards of Professional Conduct, which of the\nfollowing best describes the priority of transactions? Duval should give:","opts":["priority to Toby's clients and his employer concurrently, followed by his parent's retirement account, and finally his personal account.","priority of transactions to Toby's clients, followed by his employer, then his parent's retirement account, and finally his personal account.","Toby's clients and his parent's account equal priority, followed by his employer, and then his personal account."],"ans":"C","expl":"Theo Tiêu chuẩn VI(B) Ưu tiên giao dịch, Duval nên ưu tiên các giao dịch cho khách hàng\nvà người sử dụng lao động ưu tiên hơn các giao dịch cá nhân của mình. Bởi vì tài khoản hưu trí\ncủa cha mẹ anh đại diện cho một tài khoản khách hàng tại Toby, Duval nên coi tài khoản này giống như bất kỳ tài khoản công ty nào\nkhác. Tài khoản hưu trí của cha mẹ anh ấy sẽ không được đối xử\nđặc biệt cũng như không bị thiệt thòi vì mối quan hệ gia đình hiện có với Duval. Nếu\nDuval xử lý tài khoản hưu trí của cha mẹ mình khác với các tài khoản khác tại Toby, thì anh\nsẽ vi phạm nghĩa vụ ủy thác của mình đối với cha mẹ mình."},{"n":56,"q":"Todd Gregory has been recently hired as the head of compliance for Speed Capital. He\ndecides the firm should precisely follow the recommendations of the CFA Institute Standards\nof Professional Conduct to ensure integrity within the firm. Which of the following is NOT a\ncompliance procedure that Speed should put in place?","opts":["A requirement of disclosure of all investment holdings of friends and family members of employees on an annual basis.","A requirement that employees provide duplicate confirmations of personal investing transactions.","A requirement that investment personnel should clear all personal investments to identify possible conflicts."],"ans":"A","expl":"Thành viên và Ứng viên không bắt buộc phải tiết lộ cổ phần đầu tư của bạn bè\ntrừ khi những cổ phần đó tạo ra xung đột lợi ích.\n(Module 91.1, LOS 91.b)"},{"n":57,"q":"Graham Carson, CFA, is an investment advisor to Ron Grayson, a client with moderate risk\ntolerance and an investment horizon of 15 years. Grayson calls Carson to complain about\ntwo stocks in his account that have performed poorly. He feels that one stock was too risky\nfor him as it paid no dividend and had a beta of 1.4. The other stock had a beta of 0.9 and\npaid a dividend of 3%, but financial regulators have indicated that the firm's reported\nearnings were incorrectly stated. Based on this information, Carson has most likely:","opts":["violated both the Standard on suitability and the Standard on diligence and reasonable basis.","not violated the Standards.","violated only the Standard on suitability."],"ans":"B","expl":"Carson không vi phạm Tiêu chuẩn nào dựa trên thông tin được cung cấp. Sự phù hợp của\nmột khoản đầu tư phải được xác định dựa trên đặc điểm rủi ro và lợi nhuận của danh mục đầu tư\nchứ không dựa trên đặc điểm rủi ro và lợi nhuận của từng chứng khoán riêng lẻ. Thực tế\nrằng một chứng khoán không trả cổ tức và có beta cao hơn thị trường là không\nđủ để xác định sự phù hợp của nó trong bối cảnh danh mục đầu tư. Việc các cơ quan quản lý\ngọi thu nhập được báo cáo trước đó là vấn đề không nhất thiết có nghĩa là việc phân tích\ncủa Carson không được thực hiện cẩn thận hoặc rằng ông không có cơ sở hợp lý cho việc lựa chọn biện pháp bảo mật\nnày.\n(Module 91.1, LOS 91.b)"},{"n":59,"q":"In the course of reviewing the Corn Co., an analyst has received comments from\nmanagement that, while not meaningful by themselves, when pieced together with data he\nhas accumulated from outside sources, lead him to recommend placing Corn Co. on his\nfirm's sell list. What should the analyst do?","opts":["Not issue the report until the comments are publicly announced.","The comments are non material and the report can be issued as long as he maintains a file of the facts as supplied by management.","Show his report to his own manager and counsel for their review since this information has become material once it was combined with his analysis."],"ans":"B","expl":"Đây là một ví dụ về lý thuyết khảm trong đó các phần thông tin phi vật chất riêng biệt\nđược ghép lại với nhau để đưa ra khuyến nghị đầu tư."},{"n":60,"q":"Ken James has been an independent financial advisor for 15 years. He received his CFA\nCharter in 2013, but did not feel it helped his business, so he let his dues lapse this year. He\nstill has several hundred business cards with the CFA designation printed on them. His\npromotional materials state that he received his CFA designation in 2013. James:","opts":["must cease distributing the cards with the CFA designation, but may continue to use the existing promotional materials.","must cease distributing the cards with the CFA designation and the existing promotional materials.","may continue to use the existing promotional materials, and may use the cards until his supply runs out—his new cards cannot have the designation."],"ans":"A","expl":"Vì hiện tại anh ấy không phải là thành viên trả phí nên James phải ngừng sử dụng chỉ định CFA\nngay lập tức. Tuy nhiên, năm ông được trao tặng Điều lệ là một sự thật."},{"n":61,"q":"Jack Harris, a CFA candidate, is a telecommunications analyst at Hasten Securities. Based\nupon his analysis of Midwest Telecom, he changes his recommendation of the company's\ncommon stock from \"hold\" to \"sell.\" Before disseminating his recommendation and the\nreason for the change to Hasten's clients, Harris informs several portfolio managers at\nHasten, whom he knows personally own Midwest stock, of the changed recommendation.\nSeveral days later, Hasten communicates the change in investment recommendation on\nMidwest to clients known to have bought Midwest and those who currently hold the stock.\nJane White, CFA, is a broker at Hasten Securities. One of her clients places a buy order\ncontrary to the current recommendation on Midwest. After advising her client of the\nrecommendation, she executes the transaction.\nAccording to Standard III(B), Fair Dealing, which of the following statements about Harris and\nWhite's actions is CORRECT?","opts":["Both Harris and White violated Standard III(B).","Harris violated Standard III(B), but White did not violate Standard III(B).","Neither Harris nor White violated Standard III(B)."],"ans":"B","expl":"Harris đã vi phạm Tiêu chuẩn III(B), Giao dịch công bằng khi không đối xử công bằng với tất cả khách hàng. Thay vào đó, anh\ntiết lộ thông tin một cách có chọn lọc cho một số nhà quản lý danh mục đầu tư của công ty mình. White\nkhông vi phạm Tiêu chuẩn III(B) vì cô ấy đã thông báo với người đặt lệnh mua\nở Trung Tây rằng lệnh này trái với khuyến nghị hiện tại trước khi thực hiện\nlệnh.\n(Module 91.1, LOS 91.b)"},{"n":62,"q":"Ken Howell, CFA, plans to issue a buy recommendation for Glazer Oil, Inc., based on his\nanalysis and forecasts. Howell suspects that the company will soon announce merger plans\nwith a Japanese oil company. To investigate, Howell attempts to call three executives at\nGlazer. Different secretaries inform Howell that the executives are \"attending a conference\noverseas\" or \"traveling in Japan.\" Howell is able to confirm that all three are in the same city\nin Japan where the potential merger partner is headquartered. Howell feels confident that\nthe merger will go forward. According to CFA Institute Standards of Professional Conduct,\nHowell may issue a buy recommendation on the oil company:","opts":["immediately.","only after allowing the companies a reasonable time to disclose their merger plans.","only after encouraging the companies’ managements to publicly disclose their merger plans."],"ans":"A","expl":"Howell đang sử dụng các báo cáo tài chính công khai cũng như thông tin không công khai\nliên quan đến kế hoạch đi lại của các giám đốc điều hành công ty, khiến ông\nnghi ngờ rằng công ty đang có kế hoạch sáp nhập với một công ty dầu khí Nhật Bản. Do đó, Howell\nđã đưa ra kết luận của mình bằng cách sử dụng lý thuyết khảm và không vi phạm Tài liệu Tiêu chuẩn II(A)\nThông tin không công khai. (Mô-đun 91.1, LOS 91.b)"},{"n":63,"q":"Scott Andrews, CFA, is a stockbroker selling an oversubscribed stock issue. Which of the\nfollowing best describes Andrews' actions regarding this sale? Andrews:","opts":["can offer this security on a prorated basis to all clients for which the security is appropriate.","can only offer this security to clients for which it is appropriate on a first come first serve basis.","cannot offer an oversubscribed issue of stock to any clients."],"ans":"A","expl":"Tiêu chuẩn III(B), Giao dịch công bằng, được áp dụng. Khi phát hành mới hoặc chào bán thứ cấp có sẵn\nhoặc đang được cung cấp bởi công ty hoặc nếu công ty là một phần của tổ chức bán hàng, tất cả khách hàng\ncó bảo mật phù hợp sẽ có cơ hội tham gia phát hành. Nếu\nvấn đề được đăng ký vượt mức thì vấn đề đó sẽ được chia theo tỷ lệ cho tất cả người đăng ký."},{"n":64,"q":"The following information pertains to the Galaxy Trust, a trust established by Stephen P.\nHouse and managed by Gamma Investment LLC:\nAt the time the trust was established House provided $5 million in cash to fund the\ntrust, but Gamma was aware that 93% of his personal assets were in the form of\nOracle stock.\nGamma has been asked to view his funds and the trust as a single entity for planning\npurposes, since House's will stipulates that all of his estate will pass to the trust upon\nhis death.\nThe investment policy statement, developed in September 1996, stipulates that the\ntrust should maintain a short position in Oracle stock and use the proceeds to\ndiversify the trust more adequately.\nHouse was able to sell all of his Oracle shares back to the corporation in January 1999\nfor cash.\nThe policy statement redrawn in September 1999 continues to stipulate that the trust\nhold a short position in Oracle stock.\nHouse has given the portfolio manager in charge of the trust an all-expenses paid\nvacation package anywhere in the world each year at Christmas. The portfolio\nmanager has reported this fact in writing to his immediate supervisor at Gamma.\nWhich of the following is most correct? The investment manager is:","opts":["in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances and is in violation with regard to the acceptance of the gift from House.","in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances but is not in violation with regard to the acceptance of the gift from House.","not in violation of the Code and Standards for not properly updating the investment policy statement in light of the change in the circumstances and is not in violation with regard to the acceptance of the gift from House."],"ans":"B","expl":"Người quản lý đầu tư đã vi phạm Tiêu chuẩn yêu cầu anh ta thực hiện\nđiều tra hợp lý về tình hình tài chính của khách hàng và cập nhật tuyên bố chính sách đầu tư\nvì sự thay đổi đáng kể như vậy trong hoàn cảnh của khách hàng chắc chắn sẽ\nthay đổi tuyên bố chính sách đầu tư và có thể sẽ loại bỏ nhu cầu nắm giữ\nvị thế bán khống trong Oracle. Người quản lý đầu tư không vi phạm Tiêu chuẩn\nliên quan đến khoản thù lao bổ sung vì món quà đã được báo cáo cho người giám sát của anh ta\nvà đến từ một khách hàng. Nếu không báo cáo về một món quà như vậy, nếu công ty có\nquy định cấm nhận quà từ khách hàng hoặc nếu món quà đến từ một\nkhông phải là khách hàng thì sẽ vi phạm tiêu chuẩn."},{"n":65,"q":"The use of client brokerage by an investment manager to obtain certain products and\nservices to aid the manager in the investment decision-making process is called:","opts":["quid pro quo practices.","soft dollar practices.","trading practices."],"ans":"B","expl":"Chỉ đạo môi giới khách hàng cho nghiên cứu và/hoặc dịch vụ được gọi là hoạt động đồng đô la mềm.\n(Mô-đun 91.1, LOS 91.b)"},{"n":69,"q":"Fred Dean, CFA, has just taken a job as trader for LPC. One of his first assignments is to\nexecute the purchase of a block of East Street Industries. While working with East Street on\nan assignment for his previous employer, he learned that East Street's sales have weakened\nand will likely be significantly below the LPC analyst's estimate, but no public announcement\nof this has been made. Which of the following actions would be the most appropriate for\nDean to take according to the Standards?","opts":["Post the information about the drop in sales on an internet bulletin board to achieve public dissemination and inform his supervisor of the posting.","Contact East Street’s management and urge them to make the information public and make the trade if they refuse.","Request that the firm place East Street’s stock on a restricted list and decline to make any trades of the company’s stock."],"ans":"B","expl":"Thông tin quan trọng không công khai Tiêu chuẩn II(A) yêu cầu các thành viên và ứng viên\nsở hữu thông tin quan trọng không công khai không được hành động hoặc yêu cầu người khác hành động dựa trên thông tin đó.\nTừ chối Trade sẽ vi phạm Tiêu chuẩn này vì nó sẽ hành động hoặc khiến\nngười khác hành động dựa trên thông tin không công khai. Dean nên tìm cách để East Street công khai thông tin\n. Nếu East Street không làm như vậy, Dean phải hành động như thể anh ta sẽ hành động nếu\nanh ta không có thông tin. Từ chối thực hiện giao dịch mà anh ta được hướng dẫn thực hiện\nsẽ là \"hành động\" dựa trên thông tin trong trường hợp này. Nghĩa vụ ở đây là tính toàn vẹn của\nthị trường tài chính.\n(Mô-đun 91.1, LOS 91.b)"},{"n":70,"q":"Paul Drake, CFA, is employed by Muskie Company to provide investment advice to\nparticipants in the firm's defined contribution pension plan. Muskie stock is one of the\ninvestment options in the plan. Drake feels that the stock is too risky for employees to own\nand starts advising them to pull out of the stock. The Treasurer of the company calls Drake\nand tells him that he will be fired if he continues making such advice because he is violating\nhis fiduciary duty to the company. Drake should most appropriately:","opts":["tell employees that he cannot provide advice on company stock because of a conflict of interest.","make sell recommendations but point out that the company Treasurer has a differing and valid point of view.","continue to advise employees to sell their stock."],"ans":"C","expl":"Mặc dù Drake được công ty trả tiền nhưng nghĩa vụ ủy thác của anh ấy là đối với những người tham gia kế hoạch.\nlời khuyên của anh ấy không thể bị tổn hại bởi những cân nhắc trong kinh doanh, nếu không anh ấy sẽ vi phạm\nTiêu chuẩn về lòng trung thành, sự thận trọng và sự quan tâm."},{"n":72,"q":"Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup,\nzippy.com, in Boise, Idaho. Feldman learns that Larry Smith, controller, is altering the\naccounting records. Feldman advises some of his personal friends to sell short zippy.com.\nThis action:","opts":["constitutes a violation of the Standard concerning prohibition against misrepresentation.","constitutes professional misconduct but not the use of nonpublic information and is a violation of the Code and Standards.","constitutes the use of material nonpublic information and is a violation of the Code and Standards."],"ans":"C","expl":"Thông tin này rõ ràng là không công khai và rõ ràng là quan trọng vì việc định giá\nchứng khoán trên thị trường được xác định dựa trên dữ liệu tài chính và các thông tin\ncó liên quan khác. Giao dịch hoặc xúi giục người khác giao dịch rõ ràng là vi phạm Tiêu chuẩn II(A).\n(Module 91.1, LOS 91.b)"},{"n":73,"q":"Patricia Spraetz is the chief financial officer and compliance officer at Super Selection\nInvestment Advisors. Super Selection is a medium-sized money management firm which has\nincorporated the CFA Institute Code of Ethics and Standards of Practice into the firm's\ncompliance manual.\nKaren Jackson is a portfolio manager for Super Selection. She is not a CFA\ncharterholder. Jackson is friendly with David James, president of AMD, a rapidly growing\nbiotech company. James has provided Jackson with recommendations in the biotech\nindustry, which she buys for her own portfolio before buying them for her clients. For three\nyears, Jackson has also served on AMD's board of directors but has never notified Super\nSelection of this fact. She has received options and fees as compensation.\nRecently, the board of AMD decided to raise capital by voting to issue shares to the\npublic. This was attractive to board members (including Jackson) who wanted to exercise\ntheir stock options and sell their shares to get cash. When the demand for initial public\nofferings (IPO) diminished, just before AMD's public offering, James asked Jackson to commit\nto a large purchase of the offering for her portfolios. Jackson had previously determined that\nAMD was a questionable investment but agreed to reconsider at James' request. Her\nreevaluation confirmed the stock to be overpriced, but she nevertheless decided to\npurchase AMD for her clients' portfolios.\nWhich of the following statements is NOT correct?\nJackson did not violate Standard III(A) on Fiduciary Duty to clients because she was","opts":["bound by her fiduciary duty to AMD and its stockholders as a board member. Therefore, when she reversed her decision to buy AMD shares for Super Selection's clients, portfolios on James' request, her obligation to AMD took precedence.","Jackson violated Standard IV(B) regarding Disclosure of Additional Compensation by not disclosing additional compensation in the form of cash and stock options received from AMD, as its board member to her employer.","Jackson violated Standard VI(A) regarding Conflicts of interest by not disclosing her board membership and ownership of stock options to her employer."],"ans":"A","expl":"Jackson đã vi phạm Tiêu chuẩn III(A) vì nghĩa vụ đầu tiên của cô ấy là đối với khách hàng của công ty cô ấy.\nTiêu chuẩn VI(A) giải quyết chính xác những loại tình huống liên quan đến xung đột lợi ích\ncó thể xảy ra. Do xung đột lợi ích này, Jackson cũng đã làm tổn hại đến tính khách quan của mình khi vi phạm Tiêu chuẩn I(B). Nghĩa vụ ủy thác của cô đối với khách hàng được ưu tiên hơn nghĩa vụ ủy thác\ncủa cô đối với các cổ đông của AMD theo Quy tắc và Tiêu chuẩn của Viện CFA. Bằng cách không\ntiết lộ mối quan hệ của mình với AMD, cô ấy cũng đã vi phạm Tiêu chuẩn IV(B). Việc thực hiện\ncác giao dịch bảo mật cá nhân trong quá khứ trước khi mua cùng loại chứng khoán cho khách hàng của cô ấy đã\nkhiến Jackson vi phạm Tiêu chuẩn VI(B). Tiêu chuẩn này nghiêm cấm những hành động như vậy một cách rõ ràng.\n(Module 91.1, LOS 91.b)"},{"n":74,"q":"Dick Charles is a security analyst with a large brokerage company. Sean Donaldson is a\nmoney manager. They both listen in on a conference call for security analysts with the\npresident of Stoppard, Inc., who states that in two days the company will be holding a press\nconference announcing a new product. Both Charles and Donaldson feel the news will\nincrease the value of Stoppard.","opts":["Charles can disseminate the information to clients, and Donaldson can purchase the stock for his clients immediately.","Charles must wait until after the press conference to disseminate the information to clients, and Donaldson must wait until after the press conference to purchase the stock for his clients.","Charles must wait until after the press conference to disseminate the information to clients, but Donaldson can purchase the stock for his clients immediately."],"ans":"B","expl":"Bằng cách đợi cho đến sau cuộc họp báo, thông tin sẽ được cung cấp được coi là\nthông tin công khai và sau đó có thể được phổ biến tới khách hàng và giao dịch mà không gặp bất kỳ vấn đề gì về giao dịch nội gián."},{"n":75,"q":"Linda Schultz, CFA, is an investment advisor at Wheaton Investments. Schultz has been\nemployed there for five years, and has never signed a \"non-compete\" clause. While at\nWheaton, Schultz makes preparations to set up her own money management firm. She does\nnot contact any existing clients before leaving Wheaton and does not take any firm records\nor files. After her resignation becomes effective, Schultz replicates a list of former clients\nfrom memory and uses public sources to get their contact information. She then contacts\nthese former clients and solicits their business for her new firm. Has Schultz violated any\nCFA Institute Standards?","opts":["No. Schultz is in compliance with CFA Institute Standards.","Yes. Schultz may not contact clients of her old firm.","Yes. Schultz is permitted to notify clients that she has left her old firm, but she cannot encourage them to come with her to the new firm."],"ans":"A","expl":"Schultz tiếp tục hành động trong vai trò của mình lợi ích tốt nhất của người sử dụng lao động trong khi vẫn còn làm việc và không\ntham gia vào bất kỳ hoạt động nào có thể xung đột với nghĩa vụ này cho đến khi việc từ chức của cô ấy có hiệu lực\n. Standard IV(A) Loyalty không cấm cô liên hệ với khách hàng từ\ncông ty trước đây nếu cô không nhận được thông tin liên hệ từ hồ sơ của\nchủ lao động cũ của mình hoặc vi phạm thỏa thuận không cạnh tranh hiện hành.\n(Module 91.1, LOS 91.b)"},{"n":76,"q":"Victor Logan is a portfolio manager for McCoy Advisors, and Jack Brisco is the Director of\nResearch for McCoy. Brisco has developed a proprietary model that has been thoroughly\nresearched and is known throughout the industry as the McCoy model. The model is purely\nquantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of\nthe model is thoroughly explained to clients. Brisco frequently alters the model based on\nrigorous research—an aspect that is well explained to clients, although the specific\nalterations are not continually disclosed. Portfolio managers then make specific sector and\nsecurity holding decisions, purchasing only securities that are indicated as \"buys\" by the\nmodel. Logan has conducted very thorough research on his own, using the same process\nthat Brisco uses to validate his findings. Logan feels the model is missing some key elements\nthat would further reduce the list of acceptable securities to purchase, however, Brisco has\nrefused to look at Logan's research. Frustrated by this, Logan applies his own version of the\nmodel, with the justification that he is still only purchasing securities on the buy list. Because\nof the conflict with Brisco, he does not disclose the use of the model to anyone at McCoy or\nto clients. Which of the following statements regarding Logan and Brisco is CORRECT? Logan\nis:","opts":["not violating the Standards by applying his version of the model, but is violating the Standards by not disclosing it to clients. Brisco is not violating the Standards.","violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is not violating the Standards.","violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is violating the Standards by failing to consider Logan's research."],"ans":"A","expl":"Vì nghiên cứu được tiến hành kỹ lưỡng và Logan có quyền đưa ra các quyết định lựa chọn bảo mật riêng lẻ nên Logan không vi phạm Tiêu chuẩn khi áp dụng mô hình của mình.\nTuy nhiên, Logan đang vi phạm Tiêu chuẩn về giao tiếp với khách hàng và khách hàng\ntiềm năng bằng cách loại trừ các yếu tố liên quan của quá trình đầu tư. Việc sử dụng mô hình của ông là một\nkhía cạnh quan trọng của quá trình đầu tư và cần được tiết lộ cho khách hàng. Brisco\nkhông vi phạm Tiêu chuẩn khi không xem xét nghiên cứu của Logan."},{"n":77,"q":"Preston Partners is an investment management firm that adopted the Code and Standards\nas part of its policy manual. Gerald Smithson, CFA, has recently added the stock of Utah\nBiochemical Company and Norgood PLC to all his client's investment portfolios. Shortly\nafterwards Utah Biochemical and Norgood announced a merger that increased the share\nprice of both companies. Smithson contends he saw the president of Utah Biochemical\ndining with the chairman of Norgood, but did not overhear their conversation. Smithson\nresearched both companies extensively and determined that each company was a good\ninvestment. He put in a block trade for shares in each company. Preston's policies were not\nclear in this area as he allocated the shares by starting with his largest client accounts and\nworking down to the small accounts. Some of Smithson's clients were very conservative\npersonal trust accounts, others were pension funds who had aggressive investment\nobjectives. Which standard was NOT broken?","opts":["Standard III(C)—Suitability.","Standard IV(C)—Responsibilities of Supervisors.","Standard V(A)—Diligence and Reasonable Basis."],"ans":"C","expl":"Tiêu chuẩn V(A)—Sự siêng năng và Cơ sở hợp lý không bị vi phạm vì Smithson\nđã tiến hành nghiên cứu kỹ lưỡng và siêng năng. Tiêu chuẩn III(C)—Sự phù hợp, Smithson đã thất bại trong việc\nxem xét nhu cầu của những khách hàng bảo thủ và hung hãn của mình. Tiêu chuẩn IV(C)—\nTrách nhiệm của Người giám sát, Đối tác Preston không có chính sách giải thích cách\nphân bổ cổ phần giữa các khách hàng."},{"n":78,"q":"Janine Walker is an individual investment advisor with 200 individual clients. When she first\nobtains a client, Walker solicits personal data that helps her formulate an investment\nrecommendation, including tax status, income, expenditure needs, and risk tolerance. The\nStandards:","opts":["only require to update a client's data when a material change is being made to the clients' portfolio.","require updating a client's data only when a material change occurs to the personal data.","require Walker to update the data regularly."],"ans":"C","expl":"Theo Tiêu chuẩn III(C), Tính phù hợp, Thành viên và Ứng viên phải đánh giá lại\nthông tin khách hàng và cập nhật thường xuyên.\n(Mô-đun 91.1, LOS 91.b)"},{"n":79,"q":"Albert Long, CFA, manages portfolios of high-net-worth individuals for HKB Corp. One of his\nclose friends, who heads a local charity for homeless children, asks Long to give her a partial\nlist of his clients so that she can contact them to make tax-deductible donations. Because\nLong knows that the charity provides much benefit to the community, he provides the\nrequested list.\nBetty Short, CFA, also works for HKB Corp. She receives a letter from CFA Institute's\nProfessional Conduct Program (PCP) requesting that she provide information about one of\nHKB's clients who is being investigated. Short complies with the request despite the\nconfidential nature of the information requested by the PCP.\nWith regard to Standard III(E) Preservation of Confidentiality:","opts":["Short violated the Standard but Long did not.","Long violated the Standard but Short did not.","Both Long and Short violated the Standard."],"ans":"B","expl":"Đã vi phạm Tiêu chuẩn III(E) lâu dài về Bảo mật vì anh ta đã không bảo vệ\ntính bảo mật của thông tin mà khách hàng truyền đạt. Short không vi phạm Tiêu chuẩn\nIII(E) vì tiêu chuẩn này không ngăn cản các thành viên hợp tác với cuộc điều tra\ndo Chương trình Ứng xử Chuyên nghiệp của Viện CFA. Do đó, Short có thể chuyển tiếp\nthông tin bí mật tới PCP."},{"n":81,"q":"While visiting the CSI Company, Mark Ramsey, CFA, overheard management make comments\nthat were not public information, but were not really meaningful by themselves. However,\nwhen this information is combined with his own analysis and other outside sources, Ramsey\ndecides to change his recommendation on CSI from buy to sell. According to CFA Institute\nStandards of Professional Conduct, Ramsey should:","opts":["issue his sell report because the facts are nonmaterial, but maintain a file of the facts and documents leading to this conclusion.","not issue his report until these comments are made public.","report these events to his immediate supervisor and legal counsel, since they have become material in combination with his analysis."],"ans":"A","expl":"Việc sử dụng phân tích bảo mật kết hợp với thông tin phi vật chất không công khai để đưa ra\nkết luận quan trọng là hợp pháp và được gọi là lý thuyết khảm."},{"n":84,"q":"Steven Wade, CFA, writes an investment newsletter focusing on high-tech companies, which\nhe distributes by e-mail to paid subscribers. Wade does not gather any information about his\nclients' needs and circumstances. Wade has developed several complex valuation models\nthat serve as the basis for his recommendations. Each month, his newsletter contains a list\nof \"buy\" and \"sell\" recommendations. He states that his recommendations are suitable for\nall types of portfolios and clients. Because of their proprietary nature, Wade does not\ndisclose, except in general terms, the nature of his valuation models. He conducted\nnumerous statistical tests of these models and they appear to have worked well in the past.\nIn his newsletter, Wade claims that subscribers who follow his recommendations can expect\nto earn superior returns because of the past success of his models.\nWade violated all of the following CFA Institute Standards of Professional Conduct EXCEPT:","opts":["Standard I(C), Misrepresentation.","Standard III(B), Fair Dealing.","Standard V(B), Communication with Clients and Prospective Clients."],"ans":"B","expl":"Wade không vi phạm Tiêu chuẩn III(B), Giao dịch công bằng, vì tình huống này không cho thấy\nrằng anh ta đã không giao dịch công bằng và khách quan với tất cả khách hàng khi phổ biến\nbản tin chứa các khuyến nghị đầu tư.\nWade đã vi phạm Tiêu chuẩn V(B), Giao tiếp với khách hàng và khách hàng tiềm năng,\nvì anh ta không đưa vào tất cả các yếu tố liên quan đằng sau khuyến nghị của mình. Nếu không\ncung cấp cơ sở cho các đề xuất của anh ấy, khách hàng không thể đánh giá các hạn chế hoặc\nrủi ro vốn có trong các đề xuất của anh ấy.\nWade đã vi phạm Tiêu chuẩn I(C), Trình bày sai, vì tuyên bố của anh ấy về việc đạt được\nlợi nhuận kỳ vọng cao hơn đang gây hiểu lầm cho các nhà đầu tư tiềm năng."},{"n":87,"q":"Ned Brenan manages two dozen pension accounts, one of which earned over 25% during\nthe past two years. Brenan tells prospective clients that based on past experience they can\nexpect a 25% return on their funds. Which of the following statements is CORRECT?","opts":["Brenan has not violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has violated Standard I(C), Misrepresentation.","Brenan has violated both Standard of Professional Conduct III(D), Performance Presentation, and Standard I(C), Misrepresentation.","Brenan has violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has not violated Standard I(C), Misrepresentation."],"ans":"B","expl":"Brenan đã vi phạm Tiêu chuẩn ứng xử chuyên nghiệp III(D) khi chỉ sử dụng kết quả\ncủa một danh mục đầu tư để tạo ấn tượng sai về tất cả các danh mục đầu tư và Brenan đã vi phạm Tiêu chuẩn\nHành vi chuyên nghiệp I(C) bằng cách tạo ấn tượng rằng lợi nhuận nhất định đã được đảm bảo (anh ấy\nlẽ ra nên sử dụng các từ \"có thể\" hoặc \"có thể\" thay vì \"có thể\")."},{"n":88,"q":"While attending his wife's office party, Donald North, CFA, overhears two top executives\nfrom Parker Industries discussing that the company's Board of Directors just approved to\nomit its cash dividend due to unexpected losses during the quarter. Parker has paid a\nquarterly dividend for the past ten years. The next day, North calls his broker and instructs\nher to sell short Parker's common stock.\nWhile in a coffee shop, Diane South, CFA, overhears two top executives from Ryland\nProducts say that their company is about to be acquired by another company for a\nsubstantial premium over the market price. The next day, South calls her broker and\ninstructs him to buy 500 shares of Ryland's common stock.\nWith regard to North's and South's compliance with the Standard concerning material\nnonpublic information:","opts":["neither of them violated the Standard.","both of them violated the Standard.","only one of them violated the Standard."],"ans":"B","expl":"Theo Tiêu chuẩn II(A) Thông tin quan trọng không công khai, thành viên hoặc ứng cử viên không được hành động hoặc yêu cầu người khác hành động dựa trên thông tin quan trọng không công khai cho đến khi thông tin đó\ntương tự được công khai. Trong cả hai trường hợp, thông tin đó là thông tin quan trọng không công khai\n; do đó, cả miền Bắc và miền Nam đều vi phạm.\n(Mô-đun 91.1, LOS 91.b)"},{"n":89,"q":"Paul Clark, CFA, has just learned from a financial analyst at Corvac Industries that orders for\ntheir core products are running ahead of last year's orders by 15%, information that has not\nbeen publicly disclosed by the company. Clark currently has a hold rating on Corvac based\non his expectation of a 5% increase in revenues for the current year. Based on Standard II(A)\nMaterial Non-public Information, Clark's most appropriate course of action is to:","opts":["disclose the information publicly prior to making any changes in his recommendation.","encourage Corvac to publicly release the order information and not act on that information until it is publicly disclosed.","put Corvac on his firm’s restricted list and not make a recommendation until the increase in orders is publicly disclosed."],"ans":"B","expl":"Tiêu chuẩn khuyến nghị rằng nhà phân tích sở hữu tài liệu thông tin không công khai\nkhuyến khích công ty tiết lộ thông tin một cách công khai. Các Tiêu chuẩn cấm Clark\nhành động dựa trên thông tin cho đến khi nó được tiết lộ công khai. Vì thông tin chỉ\nđược Clark biết nên việc đưa nó vào danh sách hạn chế là không cần thiết. Việc nhà phân tích tiết lộ công khai thông tin quan trọng\nkhông công khai có thể bị coi là vi phạm\nTiêu chuẩn."},{"n":90,"q":"A company has a defined benefit plan that is currently under-funded. The plan sponsor has\ninstructed the portfolio manager of the plan to invest more aggressively to bring the funding\nlevel up to an adequate amount. Which of the following statements best describes the\ncourse of action the portfolio manager should take? The portfolio manager should:","opts":["invest more aggressively because his fiduciary duties lie with the plan sponsor.","not invest more aggressively because this is not the method used to increase the funding level of a plan.","not invest more aggressively since this may expose the plan to too much risk and may not be in the best interest of the plan's beneficiaries."],"ans":"C","expl":"Tiêu chuẩn III(A), Lòng trung thành, sự thận trọng và sự quan tâm áp dụng trong tình huống này. Theo\nTiêu chuẩn này, các hoạt động đầu tư phải được thực hiện vì lợi ích duy nhất của khách hàng và\ntheo cách mà người quản lý tin rằng có lợi nhất cho khách hàng. Ở đây, khách hàng\nlà người thụ hưởng chương trình, không phải là người quản lý hay tổ chức đã thuê người quản lý."},{"n":91,"q":"David Martin, CFA, recently joined Arc Financial as a portfolio manager of an emerging\nmarkets mutual fund. For the past three years, he managed an emerging markets mutual\nfund for Landmark Investments. Upon Martin's arrival, Arc Financial announces to existing\nand prospective clients, \"While at Landmark Investments, Martin was the senior portfolio\nmanager of Alpha Emerging Markets Fund. In Martin's three years as manager, this fund\noutperformed its benchmark each year, as documented in recent reports by Landmark.\"\nDoes this statement violate the CFA Institute Standard of Professional Conduct related to\nperformance presentation?","opts":["No.","Yes, because the Standards prohibit showing past performance at a prior firm.","Yes, because Arc must present at least five years of Martin’s performance history."],"ans":"A","expl":"Bản trình bày Hiệu suất Tiêu chuẩn III(D) không cấm hiển thị hiệu suất trước đây của các quỹ\nđược quản lý tại công ty trước đây như một phần của hồ sơ theo dõi hiệu suất nếu đi kèm\ntiết lộ thích hợp. Trong trường hợp này, Arc đã trình bày chi tiết rõ ràng rằng hiệu quả\nđã xảy ra khi Martin là người quản lý Quỹ Thị trường Mới nổi Alpha. Tiêu chuẩn III(D) không yêu cầu lịch sử hiệu suất tối thiểu 5-\nnăm.\n(Mô-đun 90.1, LOS 90.b, 90.c; Mô-đun 91.5, LOS 91.a, 91.b, 91.c; và Mô-đun 93.1, LOS 93.a,\n93.b)"},{"n":93,"q":"Lynn Black, CFA, is an analyst with the underwriter for an upcoming issue of Mtex Software\ndebentures. Black learns from an employee in Mtex's programming department that there is\na serious problem with Mtex's newest software program and that many customers have\ncanceled their orders with Mtex. There is no mention of these problems in the prospectus\nfor the debentures, which has been circulated. According to the CFA Institute Standards of\nProfessional Conduct, Black's best course of action is to:","opts":["notify potential investors of the omission on a fair and equitable basis.","take no action because this is material nonpublic information.","inform her supervisor of her discovery."],"ans":"C","expl":"Black sở hữu thông tin quan trọng không công khai và cách hành động thích hợp nhất\nlà thông báo cho người giám sát của cô ấy (hoặc cơ quan viên tuân thủ của công ty) về những gì cô ấy đã học được\n. Các nhà bảo lãnh phát hành và chủ ngân hàng đầu tư thường xuyên sở hữu thông tin quan trọng không công khai\nvề các công ty khách hàng của họ và có thể chấp nhận chia sẻ thông tin này trong\nbộ khi việc làm như vậy là cần thiết để tiến hành phát hành chứng khoán\ncủa công ty khách hàng. Nếu công ty của Black xác định rằng thông tin đó ảnh hưởng đến giá trị của trái phiếu\n, họ phải sửa lại và lưu hành lại bản cáo bạch. Việc không làm như vậy có thể vi phạm\nTrình bày sai Tiêu chuẩn I(C). Việc không thông báo cho người chủ của cô ấy có thể gây bất lợi cho lợi ích và danh tiếng của công ty\ncủa cô ấy nếu việc tiếp tục phát hành vấn đề mới mà không tiết lộ sẽ\nvi phạm các quy định hoặc luật pháp. Tuy nhiên, Black không được chia sẻ thông tin quan trọng không công khai\nvới những người mua tiềm năng hoặc với bất kỳ ai trong công ty của cô ấy ngoài bộ phận bảo lãnh\n.\n(Module 91.1, LOS 91.b)"},{"n":95,"q":"John Farr, CFA, has accumulated several pieces of nonmaterial nonpublic information about\nCattleCorp from his contacts with the company. From analysis based on this information,\ntogether with public information, Farr concludes that CattleCorp will have unexpectedly low\nearnings this year. Farr has contacted the company, but they will not confirm his conclusion.\nAccording to CFA Institute Standards of Professional Conduct, Farr:","opts":["may not trade or make recommendations based on his analysis.","may trade or make recommendations based on his analysis only if his company’s compliance officer determines that the nonpublic information he used was not material.","may trade or make recommendations based on his analysis."],"ans":"C","expl":"Theo Thông tin quan trọng không công khai Tiêu chuẩn II(A), Farr được tự do hành động theo\nlý thuyết khảm vì thông tin phi vật chất không công khai không nằm trong phạm vi\ncấm giao dịch dựa trên thông tin quan trọng không công khai. Anh ấy nên giữ chi tiết\ntài liệu phân tích của anh ta để chứng minh rằng anh ta không tư vấn hoặc hành động dựa trên tài liệu\nthông tin không công khai.\n(Mô-đun 91.1, LOS 91.b)"},{"n":97,"q":"Which of the following actions is least likely to prevent the misuse of insider information?","opts":["Controlling relevant interdepartmental information.","Monitoring all the phone calls made by the brokers.","Placing securities on a restricted list when the firm is in possession of material nonpublic information."],"ans":"B","expl":"Tiêu chuẩn II(A), Thông tin quan trọng không công khai, áp dụng trong trường hợp này. Tiêu chuẩn II(A)\nđề xuất việc sử dụng \"bức tường lửa\" để bảo vệ công ty và tuân thủ các Tiêu chuẩn. Tường lửa\nlà một rào cản thông tin được thiết kế để ngăn chặn việc truyền thông tin quan trọng\nkhông công khai giữa các phòng ban của một công ty. Mặc dù hệ thống tường lửa\ncần cung cấp phương tiện để xem xét các giao dịch nhưng việc giám sát tất cả\nthông tin liên lạc vào/ra các phòng ban là không khả thi. Việc đặt các chứng khoán/công ty nhạy cảm vào danh sách \"theo dõi,\n\"bị hạn chế\" hoặc \"tin đồn\" giúp ban quản lý nhắm mục tiêu giám sát các giao dịch.\n(Mô-đun 91.1, LOS 91.b)"},{"n":98,"q":"Steve Jones is a portfolio manager for Gregg Advisors. Gregg has developed a proprietary\nmodel that has been thoroughly researched and is known throughout the industry as the\nGregg model. The model is purely quantitative and screens stocks into buy, hold, and sell\ncategories. The basic philosophy of the model is thoroughly explained to clients. The director\nof research frequently alters the model based on rigorous research—an aspect that is well\nexplained to clients, although the specific alterations are not continually disclosed. Portfolio\nmanagers then make specific sector and security holding decisions, purchasing only\nsecurities that are indicated as \"buys\" by the model. Jones thoroughly understands the\nmodel and uses it with all of his clients. Jones is:","opts":["not violating the Standards either in purchasing stocks without a thorough research basis or in not disclosing all alterations of the model to clients.","violating the Standards in not disclosing all alterations of the model to clients, but not in purchasing stocks without a thorough research basis.","violating the Standards in purchasing stocks without a thorough research basis and in not disclosing all alterations of the model to clients."],"ans":"A","expl":"Jones và Gregg đang sử dụng phán đoán hợp lý để không liên tục tiết lộ tất cả\nnhững thay đổi của mô hình. Có thể chấp nhận sử dụng mô hình định lượng thuần túy làm cơ sở duy nhất\nđể mua cổ phiếu, miễn là nó được nghiên cứu kỹ lưỡng.\n(Mô-đun 91.1, LOS 91.b)"},{"n":100,"q":"Caroline Turner, an analyst for Lansing Asset Management, just completed an investment\nreport in which she recommends changing a \"buy\" to a \"sell\" for Gallup Company. Her\nsupervisor at Lansing approves of the change in recommendation. Turner wonders about\nwhether she needs to disseminate this investment recommendation to Lansing's clients and\nif so, how to distribute this information. According to CFA Institute Standards of Professional\nConduct, Turner is:","opts":["not required to disseminate the change of recommendation from a buy to a sell because the change is not material.","required to design an equitable system to disseminate the change in a prior investment recommendation.","required to disseminate the change in a prior investment recommendation to all clients and customers on a uniform basis."],"ans":"B","expl":"Tiêu chuẩn III(B) – Giao dịch công bằng yêu cầu giao dịch công bằng và khách quan với tất cả khách hàng và\nkhách hàng tiềm năng khi phổ biến những thay đổi quan trọng trong đề xuất đầu tư trước đó.\nLưu ý rằng tiêu chuẩn yêu cầu việc phổ biến phải công bằng nhưng không nhất thiết phải bằng nhau do\nkhông thể liên hệ đồng thời với tất cả khách hàng. Việc thay đổi đề xuất\ntừ \"mua\" sang \"bán\" nhìn chung là quan trọng."},{"n":101,"q":"Steve Phillips is the new director of equity research for a brokerage company. He receives a\ncall from a reporter at the Financial News, a weekly publication that comes out on Mondays.\nThe reporter explains the relationship she had with his predecessor. They would share\ninformation that they both learned on stocks—the former director would benefit the\ncompany's clients by news he obtained from the reporter in exchange for information he\ngave to her. The former director could ask her not to publish any information he gave her\nuntil after a certain date, ensuring that the brokerage clients would be informed before the\npublication date. After the conversation, Phillips called the former director, who confirmed\nthat the reporter was trustworthy with respect to honoring the agreement for delaying\npublication until clients have been informed. Philips should:","opts":["disclose research not yet disclosed to clients, as long as the reporter promises not to publish the information until after all clients have received the research, and the reporter provides valuable information of her own.","not disclose any research even after it has been disseminated to clients regardless of the value of the information that the reporter may have.","only disclose research that has already been disseminated to clients, as long as the reporter is providing valuable information of her own."],"ans":"C","expl":"Trong mọi trường hợp, thông tin không được tiết lộ cho phóng viên trước khi tất cả khách hàng được cung cấp\n nghiên cứu—làm như vậy sẽ vi phạm Tiêu chuẩn về đối xử công bằng. Tuy nhiên, sau khi khách hàng\nđã được thông báo thì sẽ không có vi phạm nào trong việc tiết lộ thông tin cho người báo cáo và\nlàm như vậy Phillips có thể thu được thông tin có thể giúp ích thêm cho khách hàng của mình.\n(Mô-đun 91.1, LOS 91.b)"},{"n":103,"q":"Chuck Daniels has just been hired to manage a security analysis group for Aaron Asset\nManagement. Daniels performed a similar function at another firm and finds the compliance\nsystem at Aaron inadequate. He develops a system that he feels is appropriate, but senior\nmanagement tells him he will have to wait six months to implement the system. Daniels\nshould:","opts":["decline in writing to accept supervisory responsibility until a satisfactory compliance system is put into place.","protest in writing the delay, listing the potential dangers that can occur.","resign his position immediately."],"ans":"A","expl":"Theo Tiêu chuẩn về trách nhiệm giám sát, Daniels nên từ chối bằng văn bản\nđể chấp nhận trách nhiệm giám sát cho đến khi hệ thống tuân thủ thỏa đáng được đưa vào\nplace."}];
const CFG = {"title": "Guidance for Standards I(A) and I(B)", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.1 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
