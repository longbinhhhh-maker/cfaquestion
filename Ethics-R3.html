 their merger plans.", "only after encouraging the companies’ managements to publicly disclose their merger plans."], "ans": "A", "expl": "Howell is using publicly available financial reports as well as non-material nonpublic\ninformation regarding the travel plans of the company's executive officers that led him to\nsuspect that the company is planning a merger with a Japanese oil company. Thus, Howell\nformed his conclusion using the mosaic theory and did not violate Standard II(A) Material\nNonpublic Information. (Module 91.1, LOS 91.b)"}, {"n": 63, "q": "Scott Andrews, CFA, is a stockbroker selling an oversubscribed stock issue. Which of the\nfollowing best describes Andrews' actions regarding this sale? Andrews:", "opts": ["can offer this security on a prorated basis to all clients for which the security is appropriate.", "can only offer this security to clients for which it is appropriate on a first come first serve basis.", "cannot offer an oversubscribed issue of stock to any clients."], "ans": "A", "expl": "Standard III(B), Fair Dealing, applies. When new issues or secondary offerings are available\nor are being offered by the firm or if the firm is part of a selling syndicate, all clients for\nwhom the security is appropriate are to be offered a chance to take part in the issue. If the\nissue is oversubscribed, then the issue is to be prorated to all subscribers."}, {"n": 64, "q": "The following information pertains to the Galaxy Trust, a trust established by Stephen P.\nHouse and managed by Gamma Investment LLC:\nAt the time the trust was established House provided $5 million in cash to fund the\ntrust, but Gamma was aware that 93% of his personal assets were in the form of\nOracle stock.\nGamma has been asked to view his funds and the trust as a single entity for planning\npurposes, since House's will stipulates that all of his estate will pass to the trust upon\nhis death.\nThe investment policy statement, developed in September 1996, stipulates that the\ntrust should maintain a short position in Oracle stock and use the proceeds to\ndiversify the trust more adequately.\nHouse was able to sell all of his Oracle shares back to the corporation in January 1999\nfor cash.\nThe policy statement redrawn in September 1999 continues to stipulate that the trust\nhold a short position in Oracle stock.\nHouse has given the portfolio manager in charge of the trust an all-expenses paid\nvacation package anywhere in the world each year at Christmas. The portfolio\nmanager has reported this fact in writing to his immediate supervisor at Gamma.\nWhich of the following is most correct? The investment manager is:", "opts": ["in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances and is in violation with regard to the acceptance of the gift from House.", "in violation of the Code and Standards by not properly updating the investment policy statement in light of the change in the circumstances but is not in violation with regard to the acceptance of the gift from House.", "not in violation of the Code and Standards for not properly updating the investment policy statement in light of the change in the circumstances and is not in violation with regard to the acceptance of the gift from House."], "ans": "B", "expl": "The investment manager is in violation of the Standard requiring him to make a\nreasonable inquiry into the client's financial situation and update the investment policy\nstatement since such a dramatic change in the client's circumstances would undoubtedly\nalter the investment policy statement and would probably eliminate the need to hold a\nshort position in Oracle. The investment manager is not in violation of the Standard\nconcerning additional compensation, since the gift has been reported to his supervisor\nand has come from a client. If there was a failure to report such a gift, if the firm had a\nrule in place against the acceptance of gifts from clients, or if the gift had come from a\nnon-client, there would be a violation of the standard."}, {"n": 65, "q": "The use of client brokerage by an investment manager to obtain certain products and\nservices to aid the manager in the investment decision-making process is called:", "opts": ["quid pro quo practices.", "soft dollar practices.", "trading practices."], "ans": "B", "expl": "Directing client brokerage for research and/or services is called soft dollar practices.\n(Module 91.1, LOS 91.b)"}, {"n": 66, "q": "Allen Parsons, a CFA candidate, suspects a colleague at his firm of engaging in an illegal\nactivity. Which of the following statements about procedures for compliance involving\nStandard I(A), Knowledge of the law is NOT correct? Parsons:", "opts": ["is required to report this legal violation to the appropriate governmental or regulatory organizations.", "should consult counsel to determine whether the conduct is, in fact, illegal.", "should urge his firm to attempt to persuade the perpetrator to cease such conduct."], "ans": "A", "expl": "Standard I(A), Knowledge of the law, does not require that Parsons report legal violations\nto the appropriate governmental or regulatory organizations, but such disclosures may be\nappropriate under certain circumstances."}, {"n": 67, "q": "What is the rule for members, CFA charterholders, and candidates in the CFA program with\nregard to the requirements of the Code and Standards and the requirements of local laws? If\nthe applicable laws are:", "opts": ["less strict, members and candidates are only responsible for complying with the local laws.", "more strict, members and candidates are responsible for complying with the applicable laws.", "more strict, members and candidates are only responsible for complying with the Code and Standards."], "ans": "B", "expl": "According to Standard I(A) Knowledge of the Law, members and candidates must comply\nwith the stricter of local laws or the Code and Standards.\n(Module 91.1, LOS 91: I(A))"}, {"n": 68, "q": "Luis Rodriguez, CFA, is an analyst at XYZ Investments. He covers a company that is located in\na region that is not easily accessible. The company invites analysts for their annual analyst\nmeeting and pays for the transportation to the remote location. Rodriguez is:", "opts": ["allowed to accept the payment for transportation as long as it does not exceed $100.", "allowed to accept the payment for transportation because the trip was all business and was out of the way.", "not allowed to accept the payment for transportation because this is a considered a “perk” and may influence his independent judgment."], "ans": "B", "expl": "Standard I(B) Independence and Objectivity. Analysts should pay for their own travel\naccommodations if the location is accessible by normal means. In this situation payment is\nacceptable because the location is out of the way and the purpose of the trip is all\nbusiness.\n(Module 91.1, LOS 91: I(B))"}, {"n": 69, "q": "Fred Dean, CFA, has just taken a job as trader for LPC. One of his first assignments is to\nexecute the purchase of a block of East Street Industries. While working with East Street on\nan assignment for his previous employer, he learned that East Street's sales have weakened\nand will likely be significantly below the LPC analyst's estimate, but no public announcement\nof this has been made. Which of the following actions would be the most appropriate for\nDean to take according to the Standards?", "opts": ["Post the information about the drop in sales on an internet bulletin board to achieve public dissemination and inform his supervisor of the posting.", "Contact East Street’s management and urge them to make the information public and make the trade if they refuse.", "Request that the firm place East Street’s stock on a restricted list and decline to make any trades of the company’s stock."], "ans": "B", "expl": "Standard II(A) Material Nonpublic Information requires that members and candidates who\npossess material nonpublic information not act or cause others to act on the information.\nRefusing the trade would violate this Standard because it would be acting or causing\nothers to act on the nonpublic information. Dean should seek to have East Street make the\ninformation public. If East Street does not do so, Dean must act as he would have acted if\nhe did not possess the information. Refusing to make the trade he was instructed to make\nwould be \"acting\" on the information in this case. The obligation here is to the integrity of\nfinancial markets.\n(Module 91.1, LOS 91.b)"}, {"n": 70, "q": "Paul Drake, CFA, is employed by Muskie Company to provide investment advice to\nparticipants in the firm's defined contribution pension plan. Muskie stock is one of the\ninvestment options in the plan. Drake feels that the stock is too risky for employees to own\nand starts advising them to pull out of the stock. The Treasurer of the company calls Drake\nand tells him that he will be fired if he continues making such advice because he is violating\nhis fiduciary duty to the company. Drake should most appropriately:", "opts": ["tell employees that he cannot provide advice on company stock because of a conflict of interest.", "make sell recommendations but point out that the company Treasurer has a differing and valid point of view.", "continue to advise employees to sell their stock."], "ans": "C", "expl": "Although Drake is paid by the company, his fiduciary duty is to the plan participants. His\nadvice cannot be compromised by business considerations, otherwise he will be violating\nthe Standard on loyalty, prudence, and care."}, {"n": 71, "q": "Which of the following is most accurate concerning a member's duty under the Code and\nStandards?", "opts": ["In the absence of specific applicable law or other regulatory requirements, the Code and Standards govern the member's actions.", "A member who trades securities in a country with less strict laws, rules, regulations, or customs may follow those laws if he discloses this information to his client.", "A member is required to comply only with applicable local laws, rules, regulations, or customs even if the Code and Standards impose a higher degree of responsibility."], "ans": "A", "expl": "Members are always, at a minimum, subject to the Code and Standards. Members and\ncandidates are responsible for complying with the stricter of local laws and regulations or\nthe Code and Standards.\n(Module 91.1, LOS 91: I(A))"}, {"n": 72, "q": "Marc Feldman, CFA, is manager of corporate investor relations for a high-tech startup,\nzippy.com, in Boise, Idaho. Feldman learns that Larry Smith, controller, is altering the\naccounting records. Feldman advises some of his personal friends to sell short zippy.com.\nThis action:", "opts": ["constitutes a violation of the Standard concerning prohibition against misrepresentation.", "constitutes professional misconduct but not the use of nonpublic information and is a violation of the Code and Standards.", "constitutes the use of material nonpublic information and is a violation of the Code and Standards."], "ans": "C", "expl": "The information is apparently nonpublic, and is clearly material since the valuation of\nsecurities in the market place is predicated upon financial data and other relevant\ninformation. Trading or inducing others to trade is a clear violation of Standard II(A).\n(Module 91.1, LOS 91.b)"}, {"n": 73, "q": "Patricia Spraetz is the chief financial officer and compliance officer at Super Selection\nInvestment Advisors. Super Selection is a medium-sized money management firm which has\nincorporated the CFA Institute Code of Ethics and Standards of Practice into the firm's\ncompliance manual.\nKaren Jackson is a portfolio manager for Super Selection. She is not a CFA\ncharterholder. Jackson is friendly with David James, president of AMD, a rapidly growing\nbiotech company. James has provided Jackson with recommendations in the biotech\nindustry, which she buys for her own portfolio before buying them for her clients. For three\nyears, Jackson has also served on AMD's board of directors but has never notified Super\nSelection of this fact. She has received options and fees as compensation.\nRecently, the board of AMD decided to raise capital by voting to issue shares to the\npublic. This was attractive to board members (including Jackson) who wanted to exercise\ntheir stock options and sell their shares to get cash. When the demand for initial public\nofferings (IPO) diminished, just before AMD's public offering, James asked Jackson to commit\nto a large purchase of the offering for her portfolios. Jackson had previously determined that\nAMD was a questionable investment but agreed to reconsider at James' request. Her\nreevaluation confirmed the stock to be overpriced, but she nevertheless decided to\npurchase AMD for her clients' portfolios.\nWhich of the following statements is NOT correct?\nJackson did not violate Standard III(A) on Fiduciary Duty to clients because she was", "opts": ["bound by her fiduciary duty to AMD and its stockholders as a board member. Therefore, when she reversed her decision to buy AMD shares for Super Selection's clients, portfolios on James' request, her obligation to AMD took precedence.", "Jackson violated Standard IV(B) regarding Disclosure of Additional Compensation by not disclosing additional compensation in the form of cash and stock options received from AMD, as its board member to her employer.", "Jackson violated Standard VI(A) regarding Conflicts of interest by not disclosing her board membership and ownership of stock options to her employer."], "ans": "A", "expl": "Jackson has violated Standard III(A) because her first obligation is to her firm's clients.\nStandard VI(A) addresses precisely these kinds of situations regarding potential conflict of\ninterest. Given this conflict of interest, Jackson also compromised her objectivity in\nviolation of Standard I(B). Her fiduciary duty to her clients takes precedence over her\nfiduciary duty to AMD's stockholders under the CFA Institute Code and Standards. By not\ndisclosing her relationship with AMD, she also violated Standard IV(B). Making past\npersonal security transactions ahead of purchase of the same securities for her clients has\nput Jackson in violation of Standard VI(B). This standard clearly prohibits such actions.\n(Module 91.1, LOS 91.b)"}, {"n": 74, "q": "Dick Charles is a security analyst with a large brokerage company. Sean Donaldson is a\nmoney manager. They both listen in on a conference call for security analysts with the\npresident of Stoppard, Inc., who states that in two days the company will be holding a press\nconference announcing a new product. Both Charles and Donaldson feel the news will\nincrease the value of Stoppard.", "opts": ["Charles can disseminate the information to clients, and Donaldson can purchase the stock for his clients immediately.", "Charles must wait until after the press conference to disseminate the information to clients, and Donaldson must wait until after the press conference to purchase the stock for his clients.", "Charles must wait until after the press conference to disseminate the information to clients, but Donaldson can purchase the stock for his clients immediately."], "ans": "B", "expl": "By waiting until after the press conference the information would then be considered\npublic information and can then be disseminated to clients and traded on without there\nbeing any issues of insider trading."}, {"n": 75, "q": "Linda Schultz, CFA, is an investment advisor at Wheaton Investments. Schultz has been\nemployed there for five years, and has never signed a \"non-compete\" clause. While at\nWheaton, Schultz makes preparations to set up her own money management firm. She does\nnot contact any existing clients before leaving Wheaton and does not take any firm records\nor files. After her resignation becomes effective, Schultz replicates a list of former clients\nfrom memory and uses public sources to get their contact information. She then contacts\nthese former clients and solicits their business for her new firm. Has Schultz violated any\nCFA Institute Standards?", "opts": ["No. Schultz is in compliance with CFA Institute Standards.", "Yes. Schultz may not contact clients of her old firm.", "Yes. Schultz is permitted to notify clients that she has left her old firm, but she cannot encourage them to come with her to the new firm."], "ans": "A", "expl": "Schultz continued to act in her employer's best interest while still employed and did not\nengage in any activities that would conflict with this duty until her resignation became\neffective. Standard IV(A) Loyalty does not prohibit her from contacting clients from her\nprevious firm if she does not get the contact information from the records of her former\nemployer or violate an applicable non-compete agreement.\n(Module 91.1, LOS 91.b)"}, {"n": 76, "q": "Victor Logan is a portfolio manager for McCoy Advisors, and Jack Brisco is the Director of\nResearch for McCoy. Brisco has developed a proprietary model that has been thoroughly\nresearched and is known throughout the industry as the McCoy model. The model is purely\nquantitative and screens stocks into buy, hold, and sell categories. The basic philosophy of\nthe model is thoroughly explained to clients. Brisco frequently alters the model based on\nrigorous research—an aspect that is well explained to clients, although the specific\nalterations are not continually disclosed. Portfolio managers then make specific sector and\nsecurity holding decisions, purchasing only securities that are indicated as \"buys\" by the\nmodel. Logan has conducted very thorough research on his own, using the same process\nthat Brisco uses to validate his findings. Logan feels the model is missing some key elements\nthat would further reduce the list of acceptable securities to purchase, however, Brisco has\nrefused to look at Logan's research. Frustrated by this, Logan applies his own version of the\nmodel, with the justification that he is still only purchasing securities on the buy list. Because\nof the conflict with Brisco, he does not disclose the use of the model to anyone at McCoy or\nto clients. Which of the following statements regarding Logan and Brisco is CORRECT? Logan\nis:", "opts": ["not violating the Standards by applying his version of the model, but is violating the Standards by not disclosing it to clients. Brisco is not violating the Standards.", "violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is not violating the Standards.", "violating the Standards by applying his version of the model and by not disclosing it to clients. Brisco is violating the Standards by failing to consider Logan's research."], "ans": "A", "expl": "Because the research is thoroughly conducted, and Logan has authority to make individual\nsecurity selection decisions, Logan is not violating the Standards by applying his model.\nHowever, Logan is violating the Standard on communication with clients and prospective\nclients by excluding relevant factors of the investment process. The use of his model is an\nimportant aspect of the investment process and should be disclosed to clients. Brisco is\nnot violating the Standards by not considering Logan's research."}, {"n": 77, "q": "Preston Partners is an investment management firm that adopted the Code and Standards\nas part of its policy manual. Gerald Smithson, CFA, has recently added the stock of Utah\nBiochemical Company and Norgood PLC to all his client's investment portfolios. Shortly\nafterwards Utah Biochemical and Norgood announced a merger that increased the share\nprice of both companies. Smithson contends he saw the president of Utah Biochemical\ndining with the chairman of Norgood, but did not overhear their conversation. Smithson\nresearched both companies extensively and determined that each company was a good\ninvestment. He put in a block trade for shares in each company. Preston's policies were not\nclear in this area as he allocated the shares by starting with his largest client accounts and\nworking down to the small accounts. Some of Smithson's clients were very conservative\npersonal trust accounts, others were pension funds who had aggressive investment\nobjectives. Which standard was NOT broken?", "opts": ["Standard III(C)—Suitability.", "Standard IV(C)—Responsibilities of Supervisors.", "Standard V(A)—Diligence and Reasonable Basis."], "ans": "C", "expl": "Standard V(A)—Diligence and Reasonable Basis was not broken because Smithson\nconducted thorough and diligent research. Standard III(C)—Suitability, Smithson failed to\nconsider the needs of his conservative and aggressive clients. Standard IV(C)—\nResponsibilities of Supervisors, Preston Partners didn't have policies explaining how to\nallocate shares among clients."}, {"n": 78, "q": "Janine Walker is an individual investment advisor with 200 individual clients. When she first\nobtains a client, Walker solicits personal data that helps her formulate an investment\nrecommendation, including tax status, income, expenditure needs, and risk tolerance. The\nStandards:", "opts": ["only require to update a client's data when a material change is being made to the clients' portfolio.", "require updating a client's data only when a material change occurs to the personal data.", "require Walker to update the data regularly."], "ans": "C", "expl": "According to Standard III(C), Suitability, Members and Candidates must reassess client\ninformation and update regularly.\n(Module 91.1, LOS 91.b)"}, {"n": 79, "q": "Albert Long, CFA, manages portfolios of high-net-worth individuals for HKB Corp. One of his\nclose friends, who heads a local charity for homeless children, asks Long to give her a partial\nlist of his clients so that she can contact them to make tax-deductible donations. Because\nLong knows that the charity provides much benefit to the community, he provides the\nrequested list.\nBetty Short, CFA, also works for HKB Corp. She receives a letter from CFA Institute's\nProfessional Conduct Program (PCP) requesting that she provide information about one of\nHKB's clients who is being investigated. Short complies with the request despite the\nconfidential nature of the information requested by the PCP.\nWith regard to Standard III(E) Preservation of Confidentiality:", "opts": ["Short violated the Standard but Long did not.", "Long violated the Standard but Short did not.", "Both Long and Short violated the Standard."], "ans": "B", "expl": "Long violated Standard III(E) Preservation of Confidentiality because he did not preserve\nthe confidentiality of information communicated by clients. Short did not violate Standard\nIII(E) because this standard does not prevent members from cooperating with an\ninvestigation by CFA Institute's Professional Conduct Program. Thus, Short can forward\nconfidential information to the PCP."}, {"n": 80, "q": "Nicholas Brynne, CFA, is a fixed-income analyst who trades in mortgage-backed securities\n(MBS). The MBS industry has seen sweeping regulatory changes since Brynne took his\ncurrent position, and he now feels his understanding of applicable laws and regulatory\nstandards is dated. To comply with the Code and Standards, Brynne is required to:", "opts": ["have all trades reviewed by his compliance department until he has obtained an expert level of knowledge in compliance.", "update his understanding of applicable laws and regulatory standards relating to his position.", "rely on his firm’s policies and procedures for guidance on legal and regulatory standards."], "ans": "B", "expl": "To comply with Standard I(A) Knowledge of the Law, Brynne should update his\nunderstanding of applicable laws and regulatory standards relating to his position,\nalthough he is not required to be an expert in compliance. Relying only on firm policies\nand procedures is not sufficient."}, {"n": 81, "q": "While visiting the CSI Company, Mark Ramsey, CFA, overheard management make comments\nthat were not public information, but were not really meaningful by themselves. However,\nwhen this information is combined with his own analysis and other outside sources, Ramsey\ndecides to change his recommendation on CSI from buy to sell. According to CFA Institute\nStandards of Professional Conduct, Ramsey should:", "opts": ["issue his sell report because the facts are nonmaterial, but maintain a file of the facts and documents leading to this conclusion.", "not issue his report until these comments are made public.", "report these events to his immediate supervisor and legal counsel, since they have become material in combination with his analysis."], "ans": "A", "expl": "The use of security analysis combined with nonmaterial nonpublic information to arrive at\nsignificant conclusions is legal and is called the mosaic theory."}, {"n": 82, "q": "Mary White, CFA, sits on the board of directors of XYZ Manufacturing, Inc. She discovers that\nmanagement has knowingly participated in an activity she knows is illegal. According to the\nCFA Institute Standards of Professional Conduct, White is least likely to be required to:", "opts": ["disassociate herself from the activity.", "report the violation to the CFA Institute Professional Conduct Program.", "seek legal advice to determine what actions should be taken."], "ans": "B", "expl": "Members are encouraged -- but not required -- to report violations of others. Standard\nI(A), Knowledge of the Law. Prohibition against knowingly practicing or assisting in\nviolation of laws, rules, and regulations. If White knows that someone has engaged in a\npossible illegal activity, she should: (1) report the finding to the appropriate supervisory\nperson at her firm, (2) if the situation is not remedied, disassociate herself from the\nsituation, and (3) seek legal advice to see what other actions, such as notifying the proper\nregulatory agency, should be taken.\n(Module 91.1, LOS 91: I(A))"}, {"n": 83, "q": "Fran Lester, CFA, works for a broker based in a country in which participation in any IPO is\npermitted with her employer's permission. She lives and works in a country that has no\nrestrictions on her participation in IPOs. If Lester's firm is distributing shares of an\noversubscribed IPO through the office Lester works in, can Lester receive shares in the IPO?", "opts": ["Yes, because the applicable law is that of her home country.", "Yes, but she must obtain permission from her employer.", "No, not under any circumstances."], "ans": "C", "expl": "Standard I(A) Knowledge of the Law requires members and candidates to comply with the\nstrictest requirement among the law where they reside, the law in the area where they do\nbusiness, and the Code and Standards. In this case, the Code and Standards is the\nstrictest. Standard III(B) Fair Dealing prohibits members and candidates from withholding\nshares in oversubscribed IPOs from clients for their own benefit. (Module 3.1, 3.4)\n(Module 91.1, LOS 91.b)"}, {"n": 84, "q": "Steven Wade, CFA, writes an investment newsletter focusing on high-tech companies, which\nhe distributes by e-mail to paid subscribers. Wade does not gather any information about his\nclients' needs and circumstances. Wade has developed several complex valuation models\nthat serve as the basis for his recommendations. Each month, his newsletter contains a list\nof \"buy\" and \"sell\" recommendations. He states that his recommendations are suitable for\nall types of portfolios and clients. Because of their proprietary nature, Wade does not\ndisclose, except in general terms, the nature of his valuation models. He conducted\nnumerous statistical tests of these models and they appear to have worked well in the past.\nIn his newsletter, Wade claims that subscribers who follow his recommendations can expect\nto earn superior returns because of the past success of his models.\nWade violated all of the following CFA Institute Standards of Professional Conduct EXCEPT:", "opts": ["Standard I(C), Misrepresentation.", "Standard III(B), Fair Dealing.", "Standard V(B), Communication with Clients and Prospective Clients."], "ans": "B", "expl": "Wade did not violate Standard III(B), Fair Dealing, because this situation does not indicate\nthat he failed to deal fairly and objectively with all clients when disseminating his\nnewsletter containing investment recommendations.\nWade violated Standard V(B), Communication with Clients and Prospective Clients,\nbecause he failed to include all relevant factors behind his recommendations. Without\nproviding the basis for his recommendations, clients cannot evaluate the limitations or the\nrisks inherent in his recommendations.\nWade violated Standard I(C), Misrepresentation, because his claims about gaining superior\nexpected returns are misleading to potential investors."}, {"n": 85, "q": "Benito Salvatore, CFA, is licensed in the established country of Oldworld but has clients and\nmakes investments in the emerging country of Newworld. The regulations of Oldworld\nprohibit licensed investment professionals from taking gifts or gratuities in any amount from\nvendors or persons connected with potential investments. The laws of Newworld are silent\non this issue. Unsolicited, Salvatore is offered a vase worth US $75 by a Newworld trust\ncompany and a bronze statue worth US $200 by a Newworld company that Salvatore is\nconsidering as a potential investment.\nSalvatore is:", "opts": ["permitted to accept both gifts.", "not permitted to accept either gift.", "permitted to accept the vase but not the statue."], "ans": "B", "expl": "Under Standard I(A) Knowledge of the Law, Salvatore must, as a CFA charterholder, apply\nthe strictest applicable law or regulation. In this instance the stricter laws of Oldworld,\nwhere Salvatore is licensed, apply to prohibit the gifts, even though the gifts are offered in\nNewworld.\n(Module 91.1, LOS 91: I(A))"}, {"n": 86, "q": "A member or candidate who suspects that a colleague is violating the law should most\nappropriately:", "opts": ["consult with the company counsel to determine if in fact a law is being violated.", "report all illegal activities to the appropriate regulatory agency.", "report the illegal activity to CFA Institute Professional Standards Review Board for action."], "ans": "A", "expl": "According to Standard I(A) Knowledge of the Law, members and candidates shall not\nknowingly participate or assist in any violation of laws, rules, regulations, or the Code and\nStandards.\nWhen members suspect a client or a colleague of planning or engaging in ongoing illegal\nactivities, members should take the following actions:\nConsult counsel to determine if the conduct is, in fact, illegal.\nDisassociate from any illegal or unethical activity. When members have reasonable\ngrounds to believe that a client's or employee's activities are illegal or unethical, the\nmembers should disassociate from these activities and urge their firm to attempt to\npersuade the perpetrator to cease such activity.\nNote: The Code and Standards do not require that members report legal violations to the\nappropriate governmental or regulatory organizations, but such disclosure may be\nprudent in certain circumstances.\n(Module 91.1, LOS 91: I(A))"}, {"n": 87, "q": "Ned Brenan manages two dozen pension accounts, one of which earned over 25% during\nthe past two years. Brenan tells prospective clients that based on past experience they can\nexpect a 25% return on their funds. Which of the following statements is CORRECT?", "opts": ["Brenan has not violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has violated Standard I(C), Misrepresentation.", "Brenan has violated both Standard of Professional Conduct III(D), Performance Presentation, and Standard I(C), Misrepresentation.", "Brenan has violated Standard of Professional Conduct III(D), Performance Presentation, but Brenan has not violated Standard I(C), Misrepresentation."], "ans": "B", "expl": "Brenan violated Standard of Professional Conduct III(D) by using only one portfolio's\nresults to create a false impression of all the portfolios, and Brenan violated Standard of\nProfessional Conduct I(C) by creating the impression that a certain return was assured (he\nshould have used the words \"might\" or \"could\" instead of \"can\")."}, {"n": 88, "q": "While attending his wife's office party, Donald North, CFA, overhears two top executives\nfrom Parker Industries discussing that the company's Board of Directors just approved to\nomit its cash dividend due to unexpected losses during the quarter. Parker has paid a\nquarterly dividend for the past ten years. The next day, North calls his broker and instructs\nher to sell short Parker's common stock.\nWhile in a coffee shop, Diane South, CFA, overhears two top executives from Ryland\nProducts say that their company is about to be acquired by another company for a\nsubstantial premium over the market price. The next day, South calls her broker and\ninstructs him to buy 500 shares of Ryland's common stock.\nWith regard to North's and South's compliance with the Standard concerning material\nnonpublic information:", "opts": ["neither of them violated the Standard.", "both of them violated the Standard.", "only one of them violated the Standard."], "ans": "B", "expl": "According to Standard II(A) Material Nonpublic Information, a member or candidate must\nnot act or cause others to act on material nonpublic information until that same\ninformation is made public. In both cases, the information was material nonpublic\ninformation; therefore, both North and South are in violation.\n(Module 91.1, LOS 91.b)"}, {"n": 89, "q": "Paul Clark, CFA, has just learned from a financial analyst at Corvac Industries that orders for\ntheir core products are running ahead of last year's orders by 15%, information that has not\nbeen publicly disclosed by the company. Clark currently has a hold rating on Corvac based\non his expectation of a 5% increase in revenues for the current year. Based on Standard II(A)\nMaterial Non-public Information, Clark's most appropriate course of action is to:", "opts": ["disclose the information publicly prior to making any changes in his recommendation.", "encourage Corvac to publicly release the order information and not act on that information until it is publicly disclosed.", "put Corvac on his firm’s restricted list and not make a recommendation until the increase in orders is publicly disclosed."], "ans": "B", "expl": "The Standard recommends that an analyst who possesses material non-public information\nencourage the company to release the information publicly. The Standards prohibit Clark\nfrom acting on the information until it is publicly disclosed. Since the information is only\nknown by Clark, putting it on a restricted list is not necessary. Public disclosure of material\nnon-public information by an analyst would likely be considered a violation of the\nStandard."}, {"n": 90, "q": "A company has a defined benefit plan that is currently under-funded. The plan sponsor has\ninstructed the portfolio manager of the plan to invest more aggressively to bring the funding\nlevel up to an adequate amount. Which of the following statements best describes the\ncourse of action the portfolio manager should take? The portfolio manager should:", "opts": ["invest more aggressively because his fiduciary duties lie with the plan sponsor.", "not invest more aggressively because this is not the method used to increase the funding level of a plan.", "not invest more aggressively since this may expose the plan to too much risk and may not be in the best interest of the plan's beneficiaries."], "ans": "C", "expl": "Standard III(A), Loyalty, Prudence, and Care, applies in this situation. According to this\nStandard, investment actions should be carried out for the sole benefit of the client and in\na manner the manager believes to be in the best interest of the client. Here, the client is\nthe plan beneficiaries, not the manager or the entity that hired the manager."}, {"n": 91, "q": "David Martin, CFA, recently joined Arc Financial as a portfolio manager of an emerging\nmarkets mutual fund. For the past three years, he managed an emerging markets mutual\nfund for Landmark Investments. Upon Martin's arrival, Arc Financial announces to existing\nand prospective clients, \"While at Landmark Investments, Martin was the senior portfolio\nmanager of Alpha Emerging Markets Fund. In Martin's three years as manager, this fund\noutperformed its benchmark each year, as documented in recent reports by Landmark.\"\nDoes this statement violate the CFA Institute Standard of Professional Conduct related to\nperformance presentation?", "opts": ["No.", "Yes, because the Standards prohibit showing past performance at a prior firm.", "Yes, because Arc must present at least five years of Martin’s performance history."], "ans": "A", "expl": "Standard III(D) Performance Presentation does not prohibit showing past performance of\nfunds managed at a previous firm as part of a performance track record if accompanied by\nappropriate disclosures. In this instance, Arc clearly detailed that the performance\noccurred while Martin was the manager of Alpha Emerging Markets Fund. A minimum 5-\nyear performance history is not required by Standard III(D).\n(Module 90.1, LOS 90.b, 90.c; Module 91.5, LOS 91.a, 91.b, 91.c; and Module 93.1, LOS 93.a,\n93.b)"}, {"n": 92, "q": "Jane Dawson, CFA, an analyst at a New York brokerage firm, suspects that Bob Boatman,\nCFA, another analyst at the same firm, has violated a state securities law. According to the\nCFA Institute Standards of Professional Conduct, Dawson is:", "opts": ["NOT required to report the violation to the appropriate governmental or regulatory organizations.", "required to report the suspected violation to CFA Institute.", "required to report the suspected violation to the appropriate state regulatory agency."], "ans": "A", "expl": "The Code and Standards do not require that members report legal violations to the\nappropriate governmental or regulatory organizations, but such disclosure may be\nprudent in certain circumstances. Dawson should consult legal counsel and disassociate\nfrom the activity."}, {"n": 93, "q": "Lynn Black, CFA, is an analyst with the underwriter for an upcoming issue of Mtex Software\ndebentures. Black learns from an employee in Mtex's programming department that there is\na serious problem with Mtex's newest software program and that many customers have\ncanceled their orders with Mtex. There is no mention of these problems in the prospectus\nfor the debentures, which has been circulated. According to the CFA Institute Standards of\nProfessional Conduct, Black's best course of action is to:", "opts": ["notify potential investors of the omission on a fair and equitable basis.", "take no action because this is material nonpublic information.", "inform her supervisor of her discovery."], "ans": "C", "expl": "Black is in possession of material nonpublic information, and her most appropriate course\nof action is to inform her supervisor (or the firm's compliance officer) of what she has\nlearned. Underwriters and investment bankers routinely possess material nonpublic\ninformation about their client firms, and it is acceptable to share this information within\nthe department when doing so is necessary to carry out an issuance of the client firm's\nsecurities. If Black's firm determines that the information affects the value of the\ndebentures, they must revise and recirculate the prospectus. Failing to do so may violate\nStandard I(C) Misrepresentation. Not informing her employer may be detrimental to her\nfirm's interests and reputation if proceeding with the new issue without disclosure would\nviolate regulations or laws. Black may not, however, share the material nonpublic\ninformation with prospective buyers, or with anyone in her firm outside the underwriting\ndepartment.\n(Module 91.1, LOS 91.b)"}, {"n": 94, "q": "Bob Smith, CFA, is an independent board member of Atlantic Technologies, but is not paid\nby the firm for his services. An employee at Atlantic informs Smith that Atlantic has\nimproperly timed the booking of contracts to achieve the desired quarterly financial results.\nThe misleading financial statements would turn losses into profits. Smith confers with the\nfirm's legal counsel who indicates that this conduct is, in fact, illegal. Smith urges Sharon\nWhite, Atlantic's chief financial executive, to change the financial statements, but she refuses\nto do so and indicates the firm's external auditors have approved the method of revenue\nrecognition she has used. According to CFA Institute Standards of Professional Conduct,\nwhich of the following actions is least likely appropriate for Smith: in this situation?", "opts": ["Dissociate from the activity by resigning as a director or by reporting the activities to the appropriate authorities.", "Bring his concerns to the other board members.", "Report the illegal activity to CFA Institute."], "ans": "C", "expl": "Reporting violations of the Standards to the CFA Institute may be appropriate for concerns\nabout a member's conduct, but is not the proper avenue for reporting corporate\nmalfeasance in general. Members must dissociate from any activity they know is illegal and\nif Smith cannot get his firm for correct the misleading financial report he must leave the\nboard. There are intermediate steps that Smith can take in order to remedy the situation.\nSmith may bring his concerns to the other board members in order to get the firm to stop\nthe illegal activity. If the board will not remedy the situation, dissociating from the board\nmay be Smith's only way to remain in compliance with the Code and Standards.\n(Module 91.1, LOS 91: I(A))"}, {"n": 95, "q": "John Farr, CFA, has accumulated several pieces of nonmaterial nonpublic information about\nCattleCorp from his contacts with the company. From analysis based on this information,\ntogether with public information, Farr concludes that CattleCorp will have unexpectedly low\nearnings this year. Farr has contacted the company, but they will not confirm his conclusion.\nAccording to CFA Institute Standards of Professional Conduct, Farr:", "opts": ["may not trade or make recommendations based on his analysis.", "may trade or make recommendations based on his analysis only if his company’s compliance officer determines that the nonpublic information he used was not material.", "may trade or make recommendations based on his analysis."], "ans": "C", "expl": "According to Standard II(A) Material Nonpublic Information, Farr is free to act under the\nmosaic theory because nonmaterial nonpublic information does not fall within the\nprohibition on trading based on material nonpublic information. He should keep detailed\ndocumentation of his analysis to document that he did not advise or act based on material\nnonpublic information.\n(Module 91.1, LOS 91.b)"}, {"n": 96, "q": "The Securities and Exchange Board of India (SEBI) has just enacted a new stock-trading rule.\nSEBI will give brokers a 10-day grace period, during which violators of the rule will be\nimmediately notified and given a chance to remedy their situation to comply with the new\nrule. If a CFA Institute member located in India or doing business in India unknowingly\nviolates the rule and then remedies the situation within the 10-day grace period, has the\nmember violated the Standard concerning knowledge of the law?", "opts": ["No, because the member remedied the situation.", "No, because the member unknowingly broke the rule.", "Yes, because the member did not maintain knowledge and know of the rule."], "ans": "C", "expl": "Standard I(A) Knowledge of the Law explicitly says that a member shall maintain\nknowledge and comply with laws, rules, and regulations. By not knowing of the rule, the\nmember broke the standard.\n(Module 91.1, LOS 91: I(A))"}, {"n": 97, "q": "Which of the following actions is least likely to prevent the misuse of insider information?", "opts": ["Controlling relevant interdepartmental information.", "Monitoring all the phone calls made by the brokers.", "Placing securities on a restricted list when the firm is in possession of material nonpublic information."], "ans": "B", "expl": "Standard II(A), Material Nonpublic Information, applies in this situation. Standard II(A)\nsuggests the use of \"fire walls\" to protect the firm and to conform to the Standards. A fire\nwall is an information barrier designed to prevent the communication of material\nnonpublic information between departments of a firm. Although the fire wall system\nshould provide a means to review transactions, it is not feasible to monitor all\ncommunications into/out of departments. Placing sensitive securities/firms on \"watch,\n\"restricted,\" or \"rumor\" lists helps management target monitoring of transactions.\n(Module 91.1, LOS 91.b)"}, {"n": 98, "q": "Steve Jones is a portfolio manager for Gregg Advisors. Gregg has developed a proprietary\nmodel that has been thoroughly researched and is known throughout the industry as the\nGregg model. The model is purely quantitative and screens stocks into buy, hold, and sell\ncategories. The basic philosophy of the model is thoroughly explained to clients. The director\nof research frequently alters the model based on rigorous research—an aspect that is well\nexplained to clients, although the specific alterations are not continually disclosed. Portfolio\nmanagers then make specific sector and security holding decisions, purchasing only\nsecurities that are indicated as \"buys\" by the model. Jones thoroughly understands the\nmodel and uses it with all of his clients. Jones is:", "opts": ["not violating the Standards either in purchasing stocks without a thorough research basis or in not disclosing all alterations of the model to clients.", "violating the Standards in not disclosing all alterations of the model to clients, but not in purchasing stocks without a thorough research basis.", "violating the Standards in purchasing stocks without a thorough research basis and in not disclosing all alterations of the model to clients."], "ans": "A", "expl": "Jones and Gregg are using reasonable judgment in not continually disclosing all of the\nalterations of the model. It is acceptable to use a pure quantitative model as a sole basis\nfor purchasing stocks, as long as it is thoroughly researched.\n(Module 91.1, LOS 91.b)"}, {"n": 99, "q": "After working 20 years on Wall Street, Jim Gentry, CFA, decides to open his own investment\nfirm on Turtle Island, located in the Caribbean. Turtle Island has securities laws that are\nmuch less stringent than U.S. laws or the CFA Institute Standards of Professional Conduct.\nMany of his U.S.-based clients have agreed to keep Gentry as their portfolio manager and\nmove their assets to his new firm. After a few months of operations, Gentry has encountered\nseveral instances in which Turtle Island regulations relieve him of disclosing information to\ninvestors that he had been required to disclose while working in New York. According to the\nCFA Institute Code and Standards, Gentry must adhere to the:", "opts": ["Code and Standards or U.S. law, whichever is more strict.", "laws of Turtle Island, but disclose any discrepancies to U.S.-based clients.", "Code and Standards because as a charterholder, he need only adhere to the Code and Standards under all circumstances."], "ans": "A", "expl": "Standard I(A) Knowledge of the Law states that when applicable law and the Code and\nStandards have differing requirements, candidates and members must follow the strictest\nof the law where they reside, the law where they do business, or the Code and Standards.\n(Module 91.1, LOS 91.b)"}, {"n": 100, "q": "Caroline Turner, an analyst for Lansing Asset Management, just completed an investment\nreport in which she recommends changing a \"buy\" to a \"sell\" for Gallup Company. Her\nsupervisor at Lansing approves of the change in recommendation. Turner wonders about\nwhether she needs to disseminate this investment recommendation to Lansing's clients and\nif so, how to distribute this information. According to CFA Institute Standards of Professional\nConduct, Turner is:", "opts": ["not required to disseminate the change of recommendation from a buy to a sell because the change is not material.", "required to design an equitable system to disseminate the change in a prior investment recommendation.", "required to disseminate the change in a prior investment recommendation to all clients and customers on a uniform basis."], "ans": "B", "expl": "Standard III(B) – Fair Dealing requires dealing fairly and objectively with all clients and\nprospects when disseminating material changes in prior investment recommendations.\nNote that the standard requires the dissemination be fair, but not necessarily equal due to\nthe impossibility of contacting all clients simultaneously. A change of recommendation\nfrom \"buy\" to \"sell\" is generally material."}, {"n": 101, "q": "Steve Phillips is the new director of equity research for a brokerage company. He receives a\ncall from a reporter at the Financial News, a weekly publication that comes out on Mondays.\nThe reporter explains the relationship she had with his predecessor. They would share\ninformation that they both learned on stocks—the former director would benefit the\ncompany's clients by news he obtained from the reporter in exchange for information he\ngave to her. The former director could ask her not to publish any information he gave her\nuntil after a certain date, ensuring that the brokerage clients would be informed before the\npublication date. After the conversation, Phillips called the former director, who confirmed\nthat the reporter was trustworthy with respect to honoring the agreement for delaying\npublication until clients have been informed. Philips should:", "opts": ["disclose research not yet disclosed to clients, as long as the reporter promises not to publish the information until after all clients have received the research, and the reporter provides valuable information of her own.", "not disclose any research even after it has been disseminated to clients regardless of the value of the information that the reporter may have.", "only disclose research that has already been disseminated to clients, as long as the reporter is providing valuable information of her own."], "ans": "C", "expl": "In no case should information be disclosed to a reporter before all clients are provided\nwith the research—doing so will violate the Standard on fair dealing. However, once clients\nhave been informed, there is no violation in releasing the information to the reporter, and\nin doing so Phillips might obtain information that can further help his clients.\n(Module 91.1, LOS 91.b)"}, {"n": 102, "q": "If a CFA Institute member knows that a fellow member has violated the Code and Standards,\naccording to Standard I(A) the member is:", "opts": ["required to dissociate from the activity and strongly encouraged to report it.", "required to report the activity.", "strongly encouraged to dissociate from the activity."], "ans": "A", "expl": "Standard I(A) does not require a CFA Institute member to report potential violations by\nothers, but \"strongly encourages members and candidates to report potential violations of\nthe Code and Standards committed by fellow members and candidates.\"\n(Module 91.1, LOS 91: I(A))"}, {"n": 103, "q": "Chuck Daniels has just been hired to manage a security analysis group for Aaron Asset\nManagement. Daniels performed a similar function at another firm and finds the compliance\nsystem at Aaron inadequate. He develops a system that he feels is appropriate, but senior\nmanagement tells him he will have to wait six months to implement the system. Daniels\nshould:", "opts": ["decline in writing to accept supervisory responsibility until a satisfactory compliance system is put into place.", "protest in writing the delay, listing the potential dangers that can occur.", "resign his position immediately."], "ans": "A", "expl": "According to the Standard on supervisory responsibilities, Daniels should decline in writing\nto accept supervisory responsibility until a satisfactory compliance system is put into\nplace."}, {"n": 104, "q": "Shortly after becoming employed by Valco & Co., an investment banking firm, Stan\nMcDowell, CFA, learns that most of Valco's initial public offerings (IPO) are really put in place\nto profit management via price manipulation of the shares. McDowell observes an illegal act,\nsanctioned by senior management, in progress and refuses to sign off on his responsibility.\nInstead, McDowell takes the documentation to his supervisor and tells him he should sign it\nin his place. This action is:", "opts": ["a suitable reaction, and he is in compliance with the Code and Standards.", "a violation of the Code and Standards since he is required not to knowingly participate or assist in such an act.", "an overreaction. Senior management's sanctioning of the act absolves McDowell from his ordinary responsibility as a CFA Institute member."], "ans": "B", "expl": "McDowell, by his action in taking the documentation to his supervisor, is knowingly\nparticipating in and/or assisting in an illegal act. This is clearly prohibited under Standard\nI(A), and he is in violation of the Standard."}];
const CFG = {"title": "Guidance for Standards I(A) and I(B)", "subtitle": "CFA · Ethical & Professional Standards · Reading 91.1 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>

</style>
<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnav-note-end-->
