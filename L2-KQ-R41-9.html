<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 41.9 — Guidance for Standard VI · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

<style id="ui-polish">

    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;

  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>

<script>
const DATA = [{"n": 1, "q": "Toni Florence, CFA, CAIA, leases office space to her best friend, Tom Rigs. Florence is an independent investment advisor specializing in high net worth clients and Rigs is a licensed real estate broker. In lieu of paying rent, Rigs refers his real estate clients to Florence, but only with the clients' permission. For clients referred by Rigs, Florence:", "opts": ["need not disclose the terms of the lease arrangement because Rigs obtained the clients’ permission for the referral.", "must disclose the terms of the lease arrangement.", "need not disclose the referral fee if Rigs discloses the lease arrangement to the clients first."], "ans": "B", "expl": "Standard VI(C), Referral Fees, requires members to disclose to clients and prospects any consideration or benefit received by the member or delivered to others for the recommendation of any services to the client or prospect. Florence has delivered a benefit (free rent) to Rigs, which must be disclosed to the clients referred by Rigs. Florence must not rely on Rigs to make the disclosure.", "explhtml": "<p>Standard VI(C), Referral Fees, requires members to disclose to clients and prospects any consideration or benefit received by the member or delivered to others for the recommendation of any services to the client or prospect. Florence has delivered a benefit (free rent) to Rigs, which must be disclosed to the clients referred by Rigs. Florence must not rely on Rigs to make the disclosure.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(C)<\/div><div class=\"qtext\"><p>Toni Florence, CFA, CAIA, leases office space to her best friend, Tom Rigs. Florence is an independent investment advisor specializing in high net worth clients and Rigs is a licensed real estate broker. In lieu of paying rent, Rigs refers his real estate clients to Florence, but only with the clients&#x27; permission.<\/p><p>For clients referred by Rigs, Florence:<\/p><\/div>", "subj": "ethics"}, {"n": 2, "q": "Rochester Frankfurt is a market maker in the stock of Byrne Brands, Inc. The chairman of Rochester Frankfurt serves on the board of directors of Byrne Brands. If an analyst at Rochester Frankfurt who is a CFA charterholder makes an investment recommendation on Byrne Brands, which of these two facts is the analyst required to disclose?", "opts": ["Both of these facts.", "Neither of these facts.", "Only one of these facts."], "ans": "A", "expl": "Both of these are examples of potential conflicts of interest that Standard VI(A) Avoid or Disclose Conflicts requires members or candidates to disclose.", "explhtml": "<p>Both of these are examples of potential conflicts of interest that Standard VI(A) Avoid or Disclose Conflicts requires members or candidates to disclose.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Rochester Frankfurt is a market maker in the stock of Byrne Brands, Inc. The chairman of Rochester Frankfurt serves on the board of directors of Byrne Brands. If an analyst at Rochester Frankfurt who is a CFA charterholder makes an investment recommendation on Byrne Brands, which of these two facts is the analyst required to disclose?<\/p><\/div>", "subj": "ethics"}, {"n": 3, "q": "The following scenarios involve two analysts at Dupree Asset Management, a small New York-based company with about $150 million in assets under management. Dupree restricts personal trading of stocks analyzed, corporate directorships, trustee positions, and other special relationships that could reasonably be considered a conflict of interest with their responsibilities to their employer. Ray Bolt, CFA, is a senior investment analyst. Bolt was recently elected to the board of trustees of his alma mater, Midwest University, and was appointed as the chairman of the University's endowment committee. Midwest has more than $2 billion in its endowment. Bolt must travel from New York to Chicago eight times a year to attend meetings of the board of trustees and endowment committee. Bolt did not inform Dupree of his involvement with Midwest University. Wanda Delvecco, a candidate in the CFA Program, is a junior investment analyst. She recently wrote a research report on Aveco Communications and recommended the stock for Dupree's \"buy\" list. Delvecco bought 200 shares of Aveco stock for her personal account 12 months before she wrote her research report. Over the past 12 months, the stock's price has been in the $20-42 price range. Delvecco has not informed Dupree of her ownership of Aveco stock. According to CFA Institute Standards of Professional Conduct, which the following statements about Bolt and Delvecco's actions is CORRECT?", "opts": ["Both Bolt and Delvecco violated the Standards.", "Neither Bolt nor Delvecco violated the Standards.", "Delvecco violated the Standards, but Bolt did not."], "ans": "A", "expl": "Standard VI(A), Avoid or Disclose Conflicts, requires that Bolt inform Dupree of his involvement with Midwest University given that Bolt's new role can be expected to be time consuming and possibly affect his responsibilities at Dupree. Delvecco is required to disclose her ownership of Aveco stock before conducting the research report because such ownership could bias her objectivity in making a recommendation. She should have discussed owning the stock with her supervisor before beginning to write the research report on Aveco.", "explhtml": "<p>Standard VI(A), Avoid or Disclose Conflicts, requires that Bolt inform Dupree of his involvement with Midwest University given that Bolt&#x27;s new role can be expected to be time consuming and possibly affect his responsibilities at Dupree. Delvecco is required to disclose her ownership of Aveco stock before conducting the research report because such ownership could bias her objectivity in making a recommendation. She should have discussed owning the stock with her supervisor before beginning to write the research report on Aveco.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>The following scenarios involve two analysts at Dupree Asset Management, a small New York-based company with about $150 million in assets under management. Dupree restricts personal trading of stocks analyzed, corporate directorships, trustee positions, and other special relationships that could reasonably be considered a conflict of interest with their responsibilities to their employer.<\/p><p>Ray Bolt, CFA, is a senior investment analyst. Bolt was recently elected to the board of trustees of his alma mater, Midwest University, and was appointed as the chairman of the University&#x27;s endowment committee. Midwest has more than $2 billion in its endowment. Bolt must travel from New York to Chicago eight times a year to attend meetings of the board of trustees and endowment committee. Bolt did not inform Dupree of his involvement with Midwest University. Wanda Delvecco, a candidate in the CFA Program, is a junior investment analyst. She recently wrote a research report on Aveco Communications and recommended the stock for Dupree&#x27;s &quot;buy&quot; list. Delvecco bought 200 shares of Aveco stock for her personal account 12 months before she wrote her research report. Over the past 12 months, the stock&#x27;s price has been in the $20-42 price range. Delvecco has not informed Dupree of her ownership of Aveco stock.<\/p><p>According to CFA Institute Standards of Professional Conduct, which the following statements about Bolt and Delvecco&#x27;s actions is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 4, "q": "Dwight Dawson, a CFA charterholder and portfolio manager at Ascott Investments, was recently appointed to the investments committee at Brightwood College. He will receive no compensation from Brightwood for serving on this committee. Another person at Ascott manages part of Brightwood's endowment. Dawson does not inform Ascott's compliance office of his involvement with Brightwood, because he does not believe doing so is necessary. Brenda Hamilton, a CFA candidate, also works for Ascott as an investment analyst. Procedures established at Ascott prohibit personal trading in securities analyzed or recommended by Ascott. One of these securities is Horizon, a telecommunications firm. Hamilton buys 10 shares of Horizon for her infant son's trust account. She believes that reporting this purchase to Ascott's compliance officer is unnecessary because the amount of the transaction is small and is not for her own personal account. Did Dawson or Hamilton's actions violate CFA Institute Standards of Professional Conduct?", "opts": ["Dawson: No, Hamilton: Yes.", "Dawson: No, Hamilton: No.", "Dawson: Yes, Hamilton: Yes."], "ans": "C", "expl": "Dawson violated Standard VI(A), Avoid or Disclose Conflicts, by failing to inform Ascott of her involvement with Brightwood College. Dawson could reasonably be expected to be involved with investment policy decisions at Brightwood that could affect Ascott because Ascott manages a portion of Brightwood's endowment. Hamilton also violated Standard VI(A), because she ignored a directive of her employer. Her purchase of Horizon stock has an appearance of impropriety. Hamilton could discuss the purchase of Horizon stock with her firm's compliance officer and request an exception to the prohibition against personal trading in securities analyzed or recommended by Ascott.", "explhtml": "<p>Dawson violated Standard VI(A), Avoid or Disclose Conflicts, by failing to inform Ascott of her involvement with Brightwood College. Dawson could reasonably be expected to be involved with investment policy decisions at Brightwood that could affect Ascott because Ascott manages a portion of Brightwood&#x27;s endowment. Hamilton also violated Standard VI(A), because she ignored a directive of her employer. Her purchase of Horizon stock has an appearance of impropriety. Hamilton could discuss the purchase of Horizon stock with her firm&#x27;s compliance officer and request an exception to the prohibition against personal trading in securities analyzed or recommended by Ascott.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Dwight Dawson, a CFA charterholder and portfolio manager at Ascott Investments, was recently appointed to the investments committee at Brightwood College. He will receive no compensation from Brightwood for serving on this committee. Another person at Ascott manages part of Brightwood&#x27;s endowment. Dawson does not inform Ascott&#x27;s compliance office of his involvement with Brightwood, because he does not believe doing so is necessary.<\/p><p>Brenda Hamilton, a CFA candidate, also works for Ascott as an investment analyst. Procedures established at Ascott prohibit personal trading in securities analyzed or recommended by Ascott. One of these securities is Horizon, a telecommunications firm. Hamilton buys 10 shares of Horizon for her infant son&#x27;s trust account. She believes that reporting this purchase to Ascott&#x27;s compliance officer is unnecessary because the amount of the transaction is small and is not for her own personal account.<\/p><p>Did Dawson or Hamilton&#x27;s actions violate CFA Institute Standards of Professional Conduct?<\/p><\/div>", "subj": "ethics"}, {"n": 5, "q": "Standard VI(C), Referral Fees, requires the member to do all of the following EXCEPT:", "opts": ["disclose to the referred client how much the referral source was paid to refer the client.", "disclose to the referred client the percentage of the member's business that comes from referrals.", "make required disclosures to the referred client before an agreement is made to provide services to the referred client."], "ans": "B", "expl": "The applicable Standard, VI(C), does not require a member to disclose the percentage of their business that comes from referrals. Standard VI(C) states, \"Members shall disclose to clients and prospects any consideration or benefit received by the member or delivered to others for the recommendation of any services to the client or prospect.\" Appropriate disclosure means telling the client or prospect, before agreeing to perform services, of any benefit given or received for recommending the member's services.", "explhtml": "<p>The applicable Standard, VI(C), does not require a member to disclose the percentage of their business that comes from referrals.<\/p><p>Standard VI(C) states, &quot;Members shall disclose to clients and prospects any consideration or benefit received by the member or delivered to others for the recommendation of any services to the client or prospect.&quot; Appropriate disclosure means telling the client or prospect, before agreeing to perform services, of any benefit given or received for recommending the member&#x27;s services.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(C)<\/div><div class=\"qtext\"><p>Standard VI(C), Referral Fees, requires the member to do all of the following EXCEPT:<\/p><\/div>", "subj": "ethics"}, {"n": 6, "q": "Steve Copper has worked as an independent consultant for the past ten years advising companies on various ways to increase their internal efficiency and thereby increase the firm's stock price as well. Copper recently accepted a job offer from an equity research firm as a senior stock analyst. One of the firms he will be responsible for researching, Johnson Machine Tools (JMT), is also one of his consulting clients. Copper currently has a contract with JMT to provide consulting services for another six months which he plans to honor even though there are no penalties in the contract for early termination on his part. According to CFA Institute Standards of Professional Conduct, which of the following is the most appropriate action for Copper to take? Copper should:", "opts": ["disclose the consulting arrangement to clients considering JMT as an investment.", "terminate the contract with JMT prior to issuing any research on the company.", "disclose the arrangement only if he plans to renew the contract in six months."], "ans": "B", "expl": "Standard VI(A)—Disclosure of Conflicts requires members and candidates to inform clients, prospects, and their employers of any situation that may impair their independence and objectivity or interfere with duties owed to the same groups. The Standard notes that best practice is to avoid conflicts of interest when possible. This best practice recommendation is consistent with Standard I(B) – Independence and Objectivity, which requires that independence and objectivity be maintained. The consulting arrangement with JMT, a company about which Copper will write research reports, divides his loyalty between JMT and the clients purchasing Copper's research on the same company. This is a clear conflict of interest which must be disclosed to clients, prospects, and Copper's employer if the conflict cannot be avoided. However, there is no penalty for ending the consulting relationship and best practice would dictate that Copper terminate the contract with JMT.", "explhtml": "<p>Standard VI(A)—Disclosure of Conflicts requires members and candidates to inform clients, prospects, and their employers of any situation that may impair their independence and objectivity or interfere with duties owed to the same groups. The Standard notes that best practice is to avoid conflicts of interest when possible. This best practice recommendation is consistent with Standard I(B) – Independence and Objectivity, which requires that independence and objectivity be maintained. The consulting arrangement with JMT, a company about which Copper will write research reports, divides his loyalty between JMT and the clients purchasing Copper&#x27;s research on the same company. This is a clear conflict of interest which must be disclosed to clients, prospects, and Copper&#x27;s employer if the conflict cannot be avoided. However, there is no penalty for ending the consulting relationship and best practice would dictate that Copper terminate the contract with JMT.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Steve Copper has worked as an independent consultant for the past ten years advising companies on various ways to increase their internal efficiency and thereby increase the firm&#x27;s stock price as well. Copper recently accepted a job offer from an equity research firm as a senior stock analyst. One of the firms he will be responsible for researching, Johnson Machine Tools (JMT), is also one of his consulting clients. Copper currently has a contract with JMT to provide consulting services for another six months which he plans to honor even though there are no penalties in the contract for early termination on his part. According to CFA Institute Standards of Professional Conduct, which of the following is the most appropriate action for Copper to take? Copper should:<\/p><\/div>", "subj": "ethics"}, {"n": 7, "q": "Phil Trobb, CFA, is preparing a purchase recommendation on Aneas Lumber for his research firm. Which of the following least likely represents a conflict of interest that Trobb should disclose in his report?", "opts": ["Trobb's research firm has a large stake of ownership in Aneas.", "Trobb's cousin repairs machines for Aneas.", "Aneas hires Trobb as a consultant to analyze Aneas' financial statements."], "ans": "B", "expl": "Standard VI(A) Avoid or Disclose Conflicts defines what constitutes a conflict of interest with regard to clients, prospective clients, and employers. All of these represent potential conflicts of interest with the exception of the cousin working for Aneas Lumber in a job that is unrelated to the Aneas' financing.", "explhtml": "<p>Standard VI(A) Avoid or Disclose Conflicts defines what constitutes a conflict of interest with regard to clients, prospective clients, and employers. All of these represent potential conflicts of interest with the exception of the cousin working for Aneas Lumber in a job that is unrelated to the Aneas&#x27; financing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Phil Trobb, CFA, is preparing a purchase recommendation on Aneas Lumber for his research firm. Which of the following least likely represents a conflict of interest that Trobb should disclose in his report?<\/p><\/div>", "subj": "ethics"}, {"n": 8, "q": "An analyst, who is a CFA Institute member, manages a high-grade bond mutual fund. This is his only professional responsibility. When the analyst comes across a speculative stock investment that he feels is a good investment for his personal portfolio, the analyst:", "opts": ["may invest in the stock because the analyst would not purchase the stock for the bond portfolio he manages.", "must notify his supervisor about the stock according to Standard VI(B), Priority of Transactions, to see if it is appropriate for the portfolio that he manages.", "is in violation of Standard IV(A), Loyalty to Employer, by spending time analyzing stocks when he should only analyze bonds."], "ans": "A", "expl": "The problem says the analyst \"came across\" the speculative stock investment. We do not know if the analyst neglected his duties. Since such an investment is clearly not appropriate for a high-grade bond fund, the analyst may invest in the stock without any restrictions relating to the fund.", "explhtml": "<p>The problem says the analyst &quot;came across&quot; the speculative stock investment. We do not know if the analyst neglected his duties. Since such an investment is clearly not appropriate for a high-grade bond fund, the analyst may invest in the stock without any restrictions relating to the fund.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>An analyst, who is a CFA Institute member, manages a high-grade bond mutual fund. This is his only professional responsibility. When the analyst comes across a speculative stock investment that he feels is a good investment for his personal portfolio, the analyst:<\/p><\/div>", "subj": "ethics"}, {"n": 9, "q": "Harry Lee, CFA, is an equity research analyst for a long-term investment fund. His annual bonus is linked to the fund's three-year average gains. Under a new policy, the bonus criterion is changed to include a link to the fund's quarterly trading profits. According to the Code and Standards, best practices dictate:", "opts": ["updating disclosures when the policy change is implemented.", "treating the policy change as proprietary information.", "requiring Hurst to obtain permission from each client prior to implementation of the new policy."], "ans": "A", "expl": "Standard VI(A) Disclosures of Conflicts recognizes this policy as a potential conflict of interest as members and candidates could be incentivized to favor short-term trading gains over long-term value creation. Best practices dictate updating disclosures when the policy change is implemented. The long-term investors should know how members and candidates are compensated, especially when there is the potential for conflicts of interest.", "explhtml": "<p>Standard VI(A) Disclosures of Conflicts recognizes this policy as a potential conflict of interest as members and candidates could be incentivized to favor short-term trading gains over long-term value creation. Best practices dictate updating disclosures when the policy change is implemented. The long-term investors should know how members and candidates are compensated, especially when there is the potential for conflicts of interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Harry Lee, CFA, is an equity research analyst for a long-term investment fund. His annual bonus is linked to the fund&#x27;s three-year average gains. Under a new policy, the bonus criterion is changed to include a link to the fund&#x27;s quarterly trading profits. According to the Code and Standards, best practices dictate:<\/p><\/div>", "subj": "ethics"}, {"n": 10, "q": "An analyst likes to trade commodity futures in her own account. She does not deem any of her client accounts suitable for commodity futures trading. When she identifies a favorable commodity futures position, the Standard concerning priority of transactions suggests she should:", "opts": ["refrain from acting until she notifies her supervisor.", "act on it on her own behalf as she sees fit.", "first tell her clients about it before acting herself."], "ans": "B", "expl": "The analyst's commodity futures trading is not a violation of Standard VI(B) Priority of Transactions because the investment is not suitable for her clients. If the analyst believes that none of her clients should trade commodity futures, she is not obligated to advise them of her own investments in them.", "explhtml": "<p>The analyst&#x27;s commodity futures trading is not a violation of Standard VI(B) Priority of Transactions because the investment is not suitable for her clients. If the analyst believes that none of her clients should trade commodity futures, she is not obligated to advise them of her own investments in them.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>An analyst likes to trade commodity futures in her own account. She does not deem any of her client accounts suitable for commodity futures trading. When she identifies a favorable commodity futures position, the Standard concerning priority of transactions suggests she should:<\/p><\/div>", "subj": "ethics"}, {"n": 11, "q": "If a CFA charterholder receives a referral fee, he must:", "opts": ["disclose the nature of the fee arrangement to the client before entering into a formal agreement.", "consult with the firm's compliance officer, and follow his or her instructions concerning disclosure.", "disclose the fee to the supervisor, in written form, as an additional benefit."], "ans": "A", "expl": "According to Standard VI(C), the nature as well as the value of the fee must be disclosed to the client before entering into a formal agreement. The compliance officer and/or the employee's supervisor should be contacted for consultation.", "explhtml": "<p>According to Standard VI(C), the nature as well as the value of the fee must be disclosed to the client before entering into a formal agreement. The compliance officer and/or the employee&#x27;s supervisor should be contacted for consultation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(C)<\/div><div class=\"qtext\"><p>If a CFA charterholder receives a referral fee, he must:<\/p><\/div>", "subj": "ethics"}, {"n": 12, "q": "Greg Allen is a security analyst and visits David Dawson, the Chief Financial Officer of Edmonds Company. Dawson reveals a great deal of nonmaterial financial data to Allen, data that Dawson routinely reveals to all security analysts who visit him. From this data and other industry information, Allen conjectures that Edmonds is likely to make a tender offer for another company in the industry, a fact that if true would be considered material to the value of the company. Allen:", "opts": ["can publish his conclusion in a research report.", "should send a copy of the report to Dawson for verification before disseminating the report to clients.", "must not disseminate the information or use it for trading purposes until the tender offer is announced."], "ans": "A", "expl": "Releasing information to analysts does not constitute a public release of information. Dawson's information should be considered nonpublic until it is released to the public. Allen has used this information, along with other industry information, to come to his conclusion of a pending tender offer which he can use to trade upon based on the mosaic theory.", "explhtml": "<p>Releasing information to analysts does not constitute a public release of information. Dawson&#x27;s information should be considered nonpublic until it is released to the public. Allen has used this information, along with other industry information, to come to his conclusion of a pending tender offer which he can use to trade upon based on the mosaic theory.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.3, LOS 41.b<\/div><div class=\"qtext\"><p>Greg Allen is a security analyst and visits David Dawson, the Chief Financial Officer of Edmonds Company. Dawson reveals a great deal of nonmaterial financial data to Allen, data that Dawson routinely reveals to all security analysts who visit him. From this data and other industry information, Allen conjectures that Edmonds is likely to make a tender offer for another company in the industry, a fact that if true would be considered material to the value of the company. Allen:<\/p><\/div>", "subj": "ethics"}, {"n": 13, "q": "An analyst has the opportunity to offer his clients shares in a \"hot new issue.\" One of the analyst's clients is his brother. When the new issue comes out, for those clients he deems it would be appropriate, he offers them an equal share. He includes his brother in that group. With respect to Standard VI(B), Priority of Transactions, this is:", "opts": ["congruent with the Standard if his brother is not a 'covered person'.", "congruent with the Standard as long as he does not have a direct personal interest in his brother's account.", "congruent with the Standard even if he has a direct personal interest in his brother's account."], "ans": "B", "expl": "Client accounts that belong to family members should be treated like any other account so long as there is no direct interest on the part of the analyst. In other words, these types of accounts should not be at a disadvantage relative to other client accounts when there is no direct interest on the part of the analyst overseeing the account.", "explhtml": "<p>Client accounts that belong to family members should be treated like any other account so long as there is no direct interest on the part of the analyst. In other words, these types of accounts should not be at a disadvantage relative to other client accounts when there is no direct interest on the part of the analyst overseeing the account.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>An analyst has the opportunity to offer his clients shares in a &quot;hot new issue.&quot; One of the analyst&#x27;s clients is his brother. When the new issue comes out, for those clients he deems it would be appropriate, he offers them an equal share. He includes his brother in that group. With respect to Standard VI(B), Priority of Transactions, this is:<\/p><\/div>", "subj": "ethics"}, {"n": 14, "q": "The following scenarios refer to two analysts who are employed at Global Securities, a large brokerage firm. Paula Linstrom, CFA, is instructed by her supervisor to write a research report on Delta Enterprises. Delta's stock is widely held by institutional and individual investors. Although Linstrom does not own any of Delta's stocks, she believes that one of her friends may own 10 shares of Delta. The stock currently sells for $25 per share. Linstrom does not believe that informing her employer about her friend's possible ownership of Delta shares is necessary. Hershel Wadel, a member of CFA Institute, is asked by his supervisor to write a research report on Gamma Company. Wadel's wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 per share. Wadel does not believe that informing his employer about his wife's ownership of Gamma shares is necessary. According to CFA Institute Standards of Professional Conduct, which the following statements about Linstrom and Wadel's conduct is most accurate?", "opts": ["Only one of these analysts must disclose a potential conflict of interest.", "Both of these analysts must disclose a potential conflict of interest.", "Neither of these analysts must disclose a potential conflict of interest."], "ans": "A", "expl": "The possibility that Linstrom's friend may own shares of Delta's stock does not create a conflict of interest for Linstrom, who has no beneficial interest in these shares. On the other hand, Wadel has a beneficial interest in his wife's ownership of Gamma shares. Standard VI(A) Avoid or Disclose Conflicts requires that Wadel disclose this information so that his employer can make the proper determination.", "explhtml": "<p>The possibility that Linstrom&#x27;s friend may own shares of Delta&#x27;s stock does not create a conflict of interest for Linstrom, who has no beneficial interest in these shares. On the other hand, Wadel has a beneficial interest in his wife&#x27;s ownership of Gamma shares. Standard VI(A) Avoid or Disclose Conflicts requires that Wadel disclose this information so that his employer can make the proper determination.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>The following scenarios refer to two analysts who are employed at Global Securities, a large brokerage firm.<\/p><p>Paula Linstrom, CFA, is instructed by her supervisor to write a research report on Delta Enterprises. Delta&#x27;s stock is widely held by institutional and individual investors. Although Linstrom does not own any of Delta&#x27;s stocks, she believes that one of her friends may own 10 shares of Delta. The stock currently sells for $25 per share. Linstrom does not believe that informing her employer about her friend&#x27;s possible ownership of Delta shares is necessary. Hershel Wadel, a member of CFA Institute, is asked by his supervisor to write a research report on Gamma Company. Wadel&#x27;s wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 per share. Wadel does not believe that informing his employer about his wife&#x27;s ownership of Gamma shares is necessary.<\/p><p>According to CFA Institute Standards of Professional Conduct, which the following statements about Linstrom and Wadel&#x27;s conduct is most accurate?<\/p><\/div>", "subj": "ethics"}, {"n": 15, "q": "Wes Smith, CFA, refers many of his clients to Bill Towers, CPA, for accounting services. In return, Towers performs routine services for Smith, such as his tax returns, for no charge. Towers has just become a member of CFA Institute. With this development, Towers must:", "opts": ["only reveal to the prospects referred by Smith that he performs services for Smith.", "discontinue his services for Smith.", "reveal to the prospects referred by Smith that he performs services for Smith, along with the estimated value of those services."], "ans": "C", "expl": "According to VI(C), Referral Fees, as a member of CFA Institute, Towers must tell his clients about the payment in kind to Smith along with an estimate of the value of those services.", "explhtml": "<p>According to VI(C), Referral Fees, as a member of CFA Institute, Towers must tell his clients about the payment in kind to Smith along with an estimate of the value of those services.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(C)<\/div><div class=\"qtext\"><p>Wes Smith, CFA, refers many of his clients to Bill Towers, CPA, for accounting services. In return, Towers performs routine services for Smith, such as his tax returns, for no charge. Towers has just become a member of CFA Institute. With this development, Towers must:<\/p><\/div>", "subj": "ethics"}, {"n": 16, "q": "Standard VI(B), Priority of Transactions, applies to transactions an analyst takes on behalf of:", "opts": ["his clients.", "his employer.", "both of these."], "ans": "C", "expl": "Standard VI(B) addresses the treatment of both these accounts. The accounts of clients and employers have priority over personal accounts.", "explhtml": "<p>Standard VI(B) addresses the treatment of both these accounts. The accounts of clients and employers have priority over personal accounts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>Standard VI(B), Priority of Transactions, applies to transactions an analyst takes on behalf of:<\/p><\/div>", "subj": "ethics"}, {"n": 17, "q": "Abner Flome, CFA, is writing a research report on Paulsen Group, an investment advisory firm. Flome's brother-in-law holds shares of Paulsen stock. Flome has recently interviewed for a position with Paulsen and expects a second interview. According to the Standards, Flome's most appropriate action is to disclose in the research report:", "opts": ["his brother-in-law’s holding of Paulsen stock.", "that he is being considered for a job at Paulsen.", "his brother-in-law’s holding of Paulsen stock and that he is being considered for a job at Paulsen."], "ans": "B", "expl": "The possibility of employment with Paulsen creates a potential conflict of interest which Flome must disclose. Standard VI(A) Avoid or Disclose Conflicts does not require disclosure of his brother-in-law's ownership of Paulsen stock.", "explhtml": "<p>The possibility of employment with Paulsen creates a potential conflict of interest which Flome must disclose. Standard VI(A) Avoid or Disclose Conflicts does not require disclosure of his brother-in-law&#x27;s ownership of Paulsen stock.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Abner Flome, CFA, is writing a research report on Paulsen Group, an investment advisory firm. Flome&#x27;s brother-in-law holds shares of Paulsen stock. Flome has recently interviewed for a position with Paulsen and expects a second interview. According to the Standards, Flome&#x27;s most appropriate action is to disclose in the research report:<\/p><\/div>", "subj": "ethics"}, {"n": 18, "q": "Futura Investments Co. decides to diversify its current portfolio with stocks from three companies in a new segment of the biotechnology industry. William Burgin, CFA, is an analyst at Futura and had previously bought shares of the same three companies for his own portfolio, well before his employer started researching them. Burgin has already disclosed the composition of his personal portfolio to Futura Investments, to be in compliance with the Code & the Standards. Which of the following actions should Burgin take?", "opts": ["Hire a full discretionary power or blind trust manager for his portfolio.", "Open an account that will be managed by someone else but will allow him to maintain his investment preferences.", "Diversify his personal portfolio so, in this way, these stocks will no longer represent a substantial portion of the portfolio."], "ans": "A", "expl": "Burgin followed Standard VI(A) and informed his employer about the potential conflict of interest. He needs to follow the CFA Institute Standards in the best interest of his employer. To prevent any future problems with conflict of interest, his best option is to discontinue the active management of his personal portfolio and use a blind trust.", "explhtml": "<p>Burgin followed Standard VI(A) and informed his employer about the potential conflict of interest. He needs to follow the CFA Institute Standards in the best interest of his employer. To prevent any future problems with conflict of interest, his best option is to discontinue the active management of his personal portfolio and use a blind trust.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Futura Investments Co. decides to diversify its current portfolio with stocks from three companies in a new segment of the biotechnology industry. William Burgin, CFA, is an analyst at Futura and had previously bought shares of the same three companies for his own portfolio, well before his employer started researching them. Burgin has already disclosed the composition of his personal portfolio to Futura Investments, to be in compliance with the Code &amp; the Standards. Which of the following actions should Burgin take?<\/p><\/div>", "subj": "ethics"}, {"n": 19, "q": "Will Lambert, CFA, is a financial analyst for Offshore Investments. He is preparing a purchase recommendation on Burch Corporation. According to the Standards of Professional Conduct, which of the following relationships with Burch is Lambert least likely required to disclose?", "opts": ["His son-in-law was formerly employed by Burch.", "His wife owns 2,000 shares of Burch.", "He has a material beneficial ownership of Burch through a family trust."], "ans": "A", "expl": "Standard VI(A) Avoid or Disclose Conflicts requires that Members and Candidates fully disclose all matters which may impair their independence or objectivity or interfere with their duties to their employer, clients and prospects. Beneficial ownership of shares in a firm on which a member is making investment recommendations is an example of such a matter.", "explhtml": "<p>Standard VI(A) Avoid or Disclose Conflicts requires that Members and Candidates fully disclose all matters which may impair their independence or objectivity or interfere with their duties to their employer, clients and prospects. Beneficial ownership of shares in a firm on which a member is making investment recommendations is an example of such a matter.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Will Lambert, CFA, is a financial analyst for Offshore Investments. He is preparing a purchase recommendation on Burch Corporation. According to the Standards of Professional Conduct, which of the following relationships with Burch is Lambert least likely required to disclose?<\/p><\/div>", "subj": "ethics"}, {"n": 20, "q": "June Bird is a pension consultant asked to advise on the Backwater County Pension Plan. Bird notices that 20 percent of the plan's assets are invested in privately held local businesses. Bird is concerned about the lack of liquidity and diversification caused by such an investment. She learns that state law allows investing in local businesses and county law requires at least one-fifth of the plan's assets to be dedicated to investing in local businesses. Bird:", "opts": ["should file a written complaint to the Department of Labor pointing out that the law is in conflict with the Employee Retirement Income Security Act (ERISA).", "can continue to advise the pension plan as best she can with the restrictions.", "should recommend that the trustees resign or risk being sued for violating the Prudent Expert Rule."], "ans": "B", "expl": "According to Standard III(A), Loyalty, Prudence, and Care, Bird can continue to serve as a consultant to the plan, but must follow the applicable law.", "explhtml": "<p>According to Standard III(A), Loyalty, Prudence, and Care, Bird can continue to serve as a consultant to the plan, but must follow the applicable law.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>June Bird is a pension consultant asked to advise on the Backwater County Pension Plan. Bird notices that 20 percent of the plan&#x27;s assets are invested in privately held local businesses. Bird is concerned about the lack of liquidity and diversification caused by such an investment. She learns that state law allows investing in local businesses and county law requires at least one-fifth of the plan&#x27;s assets to be dedicated to investing in local businesses. Bird:<\/p><\/div>", "subj": "ethics"}, {"n": 21, "q": "A firm produces regular proprietary research reports on various companies. According to Standard VI(B), Priority of Transactions, which of the following would be an \"access person\"?", "opts": ["A person working in the mail room.", "A supervisory analyst who reviews all research reports prior to dissemination.", "An independent auditor with access to material, non-public information on a company being analyzed."], "ans": "B", "expl": "Persons with access to information during the normal preparation of research recommendations are subject to Standard VI(B). An independent auditor is not involved in the normal preparation of research recommendations.", "explhtml": "<p>Persons with access to information during the normal preparation of research recommendations are subject to Standard VI(B). An independent auditor is not involved in the normal preparation of research recommendations.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>A firm produces regular proprietary research reports on various companies. According to Standard VI(B), Priority of Transactions, which of the following would be an &quot;access person&quot;?<\/p><\/div>", "subj": "ethics"}, {"n": 22, "q": "Gordon McKinney, CFA, works in the trust department of a bank. The bank's trust account holds a large block of a particular company. McKinney learns from a market news service that this company is going to buy back one million shares at a 15% premium to the market price on a first-come-first-served basis. McKinney immediately tells his mother-in-law to tender her shares but waits until the end of the day to tender the trust's shares. McKinney has most likely violated the Standard concerning:", "opts": ["priority of transactions.", "material nonpublic information.", "loyalty."], "ans": "A", "expl": "Standard VI(B) Priority of Transactions applies. If an analyst decides to make a recommendation about the purchase or sale of a security, he must give his customers or employer adequate opportunity to act on this recommendation before acting on his own behalf. Personal transactions include those made for the member's own account and family accounts. Here, McKinney violated Standard VI(B) by acting on his mother-in-law's behalf and then waiting until the end of the day to act on his employer's behalf. Explanations for other responses: Standard IV(A), Loyalty to Employer, does not apply. This standard concerns a member competing with his/her employer (independent practice), for example a member who engages in outside consulting. Standard II(A), Material Nonpublic Information, does not apply. The question does not indicate that the information is not public.", "explhtml": "<p>Standard VI(B) Priority of Transactions applies. If an analyst decides to make a recommendation about the purchase or sale of a security, he must give his customers or employer adequate opportunity to act on this recommendation before acting on his own behalf. Personal transactions include those made for the member&#x27;s own account and family accounts. Here, McKinney violated Standard VI(B) by acting on his mother-in-law&#x27;s behalf and then waiting until the end of the day to act on his employer&#x27;s behalf.<\/p><p>Explanations for other responses:<\/p><p>Standard IV(A), Loyalty to Employer, does not apply. This standard concerns a member competing with his/her employer (independent practice), for example a member who engages in outside consulting. Standard II(A), Material Nonpublic Information, does not apply. The question does not indicate that the information is not public.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(B)<\/div><div class=\"qtext\"><p>Gordon McKinney, CFA, works in the trust department of a bank. The bank&#x27;s trust account holds a large block of a particular company. McKinney learns from a market news service that this company is going to buy back one million shares at a 15% premium to the market price on a first-come-first-served basis. McKinney immediately tells his mother-in-law to tender her shares but waits until the end of the day to tender the trust&#x27;s shares. McKinney has most likely violated the Standard concerning:<\/p><\/div>", "subj": "ethics"}, {"n": 23, "q": "Regarding their research reports, which of the following statements about Linstrom and Wadel's conduct is CORRECT?", "opts": ["Both Linstrom and Wadel violated Standard VI(A)—Disclosure of Conflicts.", "Wadel violated Standard VI(A)—Disclosure of Conflicts, and Linstrom did not violate Standard VI(A).", "Wadel did not violate Standard VI(A)—Disclosure of Conflicts, and Linstrom did violate Standard VI(A)."], "ans": "B", "expl": "Wadel violated Standard VI(A) by not disclosing his wife's holdings. Linstrom is not in violation of the Standard because a friend's ownership of the shares should not be expected to impair her ability to make objective decisions.", "explhtml": "<p>Wadel violated Standard VI(A) by not disclosing his wife&#x27;s holdings. Linstrom is not in violation of the Standard because a friend&#x27;s ownership of the shares should not be expected to impair her ability to make objective decisions.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<\/summary><div class=\"vig-body\"><p>Joan Platt, CFA, operates an investment firm in New York, but maintains an office in Xania. Platt's firm invests on its clients' behalf in both domestic and international stocks and bonds. Platt's employees include two analysts, Paula Linstrom, CFA, and Hershel Wadel, a member of the CFA Institute. Both analysts report to Platt directly. Thorvald Knudsen, CFA, manages the international bond portfolio.<\/p><p>Xania recently established a stock market, which is not very efficient. None of the Xanian stocks trade in the U.S. market. Xania legally permits the use of material inside information. Platt believes that using inside information would help her compete against other Xanian investment advisers, and also help some of her Xanian clients reach their investment objectives.<\/p><p>Platt instructs Wadel to write a research report on Gamma Company. Wadel's wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 a share. Wadel does not believe that informing Platt about his wife's inheritance is necessary. Doris Black, one of Wadel's long-time clients, verbally promised Wadel that he could use her vacation home in Aspen, Colo., for a week during skiing season if the return on her portfolio exceeded its benchmark by two percentage points during the next year. Black also promised to reimburse Wadel for his travel expenses. Because Wadel is the sole manager of Black's portfolio, he says nothing to Platt about his arrangement with Black.<\/p><p>Platt instructs Linstrom to write a research report on Delta Enterprises. Delta's stock is widely held by institutional and individual investors. Linstrom does not own any Delta shares, though one of her friends owns 100 shares of Delta. Linstrom does not believe that informing Platt about her friend's ownership of Delta shares is necessary.<\/p><p>Platt suspects that one of the firm's unpaid interns has violated a federal securities regulation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Regarding their research reports, which of the following statements about Linstrom and Wadel&#x27;s conduct is CORRECT?<\/p><\/div>", "subj": "ethics"}, {"n": 24, "q": "What is the obligation, if any, to disclose Wadel's arrangement with Black?", "opts": ["Wadel must disclose the arrangement to Platt but is not required to disclose the arrangement to his other clients.", "Wadel need not disclose anything to his clients or to Platt because he is violating no fiduciary duty.", "Wadel must disclose the arrangements to his clients and to Platt only if he believes it will create a conflict with his responsibilities to other clients."], "ans": "A", "expl": "Wadel is required to disclose the arrangement between him and Black under Standard IV(B)— Additional Compensation Arrangements, regardless of whether or not the compensation is cash or noncash. Under Standard I(B)—Independence and Objectivity, members may accept bonuses or gifts from clients, so long as they disclose them to their employers, because gifts in a client relationship are deemed less likely to affect a member's objectivity and independence than gifts in other situations. Token gifts need not be disclosed.", "explhtml": "<p>Wadel is required to disclose the arrangement between him and Black under Standard IV(B)— Additional Compensation Arrangements, regardless of whether or not the compensation is cash or noncash. Under Standard I(B)—Independence and Objectivity, members may accept bonuses or gifts from clients, so long as they disclose them to their employers, because gifts in a client relationship are deemed less likely to affect a member&#x27;s objectivity and independence than gifts in other situations. Token gifts need not be disclosed.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Platt, CFA, operates an investment firm in New York, but maintains an office in Xania. Platt's firm invests on its clients' behalf in both domestic and international stocks and bonds. Platt's employees include two analysts, Paula Linstrom, CFA, and Hershel Wadel, a member of the CFA Institute. Both analysts report to Platt directly. Thorvald Knudsen, CFA, manages the international bond portfolio.<\/p><p>Xania recently established a stock market, which is not very efficient. None of the Xanian stocks trade in the U.S. market. Xania legally permits the use of material inside information. Platt believes that using inside information would help her compete against other Xanian investment advisers, and also help some of her Xanian clients reach their investment objectives.<\/p><p>Platt instructs Wadel to write a research report on Gamma Company. Wadel's wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 a share. Wadel does not believe that informing Platt about his wife's inheritance is necessary. Doris Black, one of Wadel's long-time clients, verbally promised Wadel that he could use her vacation home in Aspen, Colo., for a week during skiing season if the return on her portfolio exceeded its benchmark by two percentage points during the next year. Black also promised to reimburse Wadel for his travel expenses. Because Wadel is the sole manager of Black's portfolio, he says nothing to Platt about his arrangement with Black.<\/p><p>Platt instructs Linstrom to write a research report on Delta Enterprises. Delta's stock is widely held by institutional and individual investors. Linstrom does not own any Delta shares, though one of her friends owns 100 shares of Delta. Linstrom does not believe that informing Platt about her friend's ownership of Delta shares is necessary.<\/p><p>Platt suspects that one of the firm's unpaid interns has violated a federal securities regulation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>What is the obligation, if any, to disclose Wadel&#x27;s arrangement with Black?<\/p><\/div>", "subj": "ethics"}, {"n": 25, "q": "According to the Standards, how must Platt deal with the intern's alleged illegal activity?", "opts": ["Initiate an investigation and place limits on the intern’s activities pending the outcome.", "Report the intern’s behavior to the appropriate regulatory authority.", "Tell the intern to stop the conduct."], "ans": "A", "expl": "Platt must initiate an investigation, and must also take steps to ensure that additional violations do not occur during the investigation. The investigation could be handled internally by the firm's compliance officer, or could involve outside legal counsel. Simply instructing the intern to stop the conduct is not sufficient—the Standards require a more proactive response. Reporting the intern to the authorities is not appropriate because Platt is not sure the intern is violating the law. The fact that the intern is not paid does not absolve Platt or her company from liability for the intern's actions.", "explhtml": "<p>Platt must initiate an investigation, and must also take steps to ensure that additional violations do not occur during the investigation. The investigation could be handled internally by the firm&#x27;s compliance officer, or could involve outside legal counsel. Simply instructing the intern to stop the conduct is not sufficient—the Standards require a more proactive response. Reporting the intern to the authorities is not appropriate because Platt is not sure the intern is violating the law. The fact that the intern is not paid does not absolve Platt or her company from liability for the intern&#x27;s actions.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Platt, CFA, operates an investment firm in New York, but maintains an office in Xania. Platt's firm invests on its clients' behalf in both domestic and international stocks and bonds. Platt's employees include two analysts, Paula Linstrom, CFA, and Hershel Wadel, a member of the CFA Institute. Both analysts report to Platt directly. Thorvald Knudsen, CFA, manages the international bond portfolio.<\/p><p>Xania recently established a stock market, which is not very efficient. None of the Xanian stocks trade in the U.S. market. Xania legally permits the use of material inside information. Platt believes that using inside information would help her compete against other Xanian investment advisers, and also help some of her Xanian clients reach their investment objectives.<\/p><p>Platt instructs Wadel to write a research report on Gamma Company. Wadel's wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 a share. Wadel does not believe that informing Platt about his wife's inheritance is necessary. Doris Black, one of Wadel's long-time clients, verbally promised Wadel that he could use her vacation home in Aspen, Colo., for a week during skiing season if the return on her portfolio exceeded its benchmark by two percentage points during the next year. Black also promised to reimburse Wadel for his travel expenses. Because Wadel is the sole manager of Black's portfolio, he says nothing to Platt about his arrangement with Black.<\/p><p>Platt instructs Linstrom to write a research report on Delta Enterprises. Delta's stock is widely held by institutional and individual investors. Linstrom does not own any Delta shares, though one of her friends owns 100 shares of Delta. Linstrom does not believe that informing Platt about her friend's ownership of Delta shares is necessary.<\/p><p>Platt suspects that one of the firm's unpaid interns has violated a federal securities regulation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>According to the Standards, how must Platt deal with the intern&#x27;s alleged illegal activity?<\/p><\/div>", "subj": "ethics"}, {"n": 26, "q": "Platt is renouncing her U.S. citizenship and becoming a citizen of Xania. According to the Standards, if Platt renounces her U.S. citizenship, she may then:", "opts": ["use material inside information when trading in Xania only if the information does not relate to a tender offer.", "not use material inside information when trading in Xania.", "not use material inside information unless trading Xanian stocks exclusively."], "ans": "B", "expl": "Standard II(A)—Material Nonpublic Information does not allow the use of material nonpublic information in investment decisions. Platt is bound by the law of the land if it is stricter than the Standards, and by the Standards if they are stricter than the law. Since the Standards are stricter than Xanian law, Platt's Xanian operations are governed by the Standards. Thus, she cannot use material nonpublic information under any circumstances.", "explhtml": "<p>Standard II(A)—Material Nonpublic Information does not allow the use of material nonpublic information in investment decisions. Platt is bound by the law of the land if it is stricter than the Standards, and by the Standards if they are stricter than the law. Since the Standards are stricter than Xanian law, Platt&#x27;s Xanian operations are governed by the Standards. Thus, she cannot use material nonpublic information under any circumstances.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 23–26<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Joan Platt, CFA, operates an investment firm in New York, but maintains an office in Xania. Platt's firm invests on its clients' behalf in both domestic and international stocks and bonds. Platt's employees include two analysts, Paula Linstrom, CFA, and Hershel Wadel, a member of the CFA Institute. Both analysts report to Platt directly. Thorvald Knudsen, CFA, manages the international bond portfolio.<\/p><p>Xania recently established a stock market, which is not very efficient. None of the Xanian stocks trade in the U.S. market. Xania legally permits the use of material inside information. Platt believes that using inside information would help her compete against other Xanian investment advisers, and also help some of her Xanian clients reach their investment objectives.<\/p><p>Platt instructs Wadel to write a research report on Gamma Company. Wadel's wife inherited 500 shares of Gamma Company from her father when he died five years ago. Gamma stock currently sells for $35 a share. Wadel does not believe that informing Platt about his wife's inheritance is necessary. Doris Black, one of Wadel's long-time clients, verbally promised Wadel that he could use her vacation home in Aspen, Colo., for a week during skiing season if the return on her portfolio exceeded its benchmark by two percentage points during the next year. Black also promised to reimburse Wadel for his travel expenses. Because Wadel is the sole manager of Black's portfolio, he says nothing to Platt about his arrangement with Black.<\/p><p>Platt instructs Linstrom to write a research report on Delta Enterprises. Delta's stock is widely held by institutional and individual investors. Linstrom does not own any Delta shares, though one of her friends owns 100 shares of Delta. Linstrom does not believe that informing Platt about her friend's ownership of Delta shares is necessary.<\/p><p>Platt suspects that one of the firm's unpaid interns has violated a federal securities regulation.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Platt is renouncing her U.S. citizenship and becoming a citizen of Xania. According to the Standards, if Platt renounces her U.S. citizenship, she may then:<\/p><\/div>", "subj": "ethics"}, {"n": 27, "q": "Will Lambert, CFA, is a financial analyst for Offshore Investments. He is preparing a purchase recommendation on Burch Corporation for internal use. According to the CFA Institute Standards of Professional Conduct, Lambert would least likely need to disclose to his employer that:", "opts": ["he is a beneficiary of a pension plan of his former employer that owns a large number of shares of Burch's stock.", "Offshore is an OTC market maker for Burch Corporation's stock.", "his wife owns 2,000 shares of Burch Corporation."], "ans": "B", "expl": "Standard VI(A), Avoid or Disclose Conflicts, requires members to disclose to their employer all matters, including beneficial ownership of securities, that reasonably could be expected to interfere with their duty to their employer or ability to make unbiased and objective recommendations. Disclosure of an employer's own involvement with the security is not necessary in this instance. If the report had been for external use, it would have been necessary to make all of the disclosures given as choices.", "explhtml": "<p>Standard VI(A), Avoid or Disclose Conflicts, requires members to disclose to their employer all matters, including beneficial ownership of securities, that reasonably could be expected to interfere with their duty to their employer or ability to make unbiased and objective recommendations. Disclosure of an employer&#x27;s own involvement with the security is not necessary in this instance. If the report had been for external use, it would have been necessary to make all of the disclosures given as choices.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Will Lambert, CFA, is a financial analyst for Offshore Investments. He is preparing a purchase recommendation on Burch Corporation for internal use. According to the CFA Institute Standards of Professional Conduct, Lambert would least likely need to disclose to his employer that:<\/p><\/div>", "subj": "ethics"}, {"n": 28, "q": "Jim Taylor works as a portfolio manager for Rose Capital and also serves as president of the Little League board of directors in his town. He receives no money from Little League, however the local golf club provides him with a free membership for volunteering his time on the Little League board. Taylor's involvement with Little League is in his company biography, but the club membership has not been disclosed to Rose or his clients. Taylor has:", "opts": ["not violated the Standards.", "violated the Standards by not disclosing the club membership to Rose, but not by failing to disclose it to clients.", "violated the Standards by not disclosing the club membership to Rose and failing to disclose it to clients."], "ans": "A", "expl": "He must disclose any compensation to his employer if it conflicts with his employers/clients interests. However, this relationship does not likely represent any conflict of interest.", "explhtml": "<p>He must disclose any compensation to his employer if it conflicts with his employers/clients interests. However, this relationship does not likely represent any conflict of interest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Jim Taylor works as a portfolio manager for Rose Capital and also serves as president of the Little League board of directors in his town. He receives no money from Little League, however the local golf club provides him with a free membership for volunteering his time on the Little League board. Taylor&#x27;s involvement with Little League is in his company biography, but the club membership has not been disclosed to Rose or his clients. Taylor has:<\/p><\/div>", "subj": "ethics"}, {"n": 29, "q": "An analyst who is a member of CFA Institute has composed an introductory information packet for her new clients, which includes information on fees she receives for referring clients to other professionals and those she pays for having clients referred to her. With respect to Standard VI(C), Referral Fees, this action:", "opts": ["exceeds the requirement of the Standard because she does not need to reveal the fees she pays to those that refer clients to her.", "may not satisfy the Standard if such information is only provided after the receivers of the information have become clients.", "is not addressed in the Standard."], "ans": "B", "expl": "Standard VI(C) says that a member must reveal information both on fees she receives for referring clients to other professionals and those she pays for having clients referred to her before a prospect becomes a client. This allows the prospect to evaluate any partiality of a recommendation and the full cost of the services.", "explhtml": "<p>Standard VI(C) says that a member must reveal information both on fees she receives for referring clients to other professionals and those she pays for having clients referred to her before a prospect becomes a client. This allows the prospect to evaluate any partiality of a recommendation and the full cost of the services.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(C)<\/div><div class=\"qtext\"><p>An analyst who is a member of CFA Institute has composed an introductory information packet for her new clients, which includes information on fees she receives for referring clients to other professionals and those she pays for having clients referred to her. With respect to Standard VI(C), Referral Fees, this action:<\/p><\/div>", "subj": "ethics"}, {"n": 30, "q": "Which of the following Standards is most relevant regarding Pennington's meeting with Elise?", "opts": ["Standard III(A), Loyalty, Prudence, and Care.", "Standard III(C), Suitability.", "Standard III(E), Preservation of Confidentiality."], "ans": "B", "expl": "Standard III(C), Suitability, is most relevant for Pennington's meeting with Elise. This Standard requires Pennington to make a reasonable inquiry into Elise's financial situation, investment experience, and investment objectives prior to making any recommendations about her portfolio. Pennington must also consider the appropriateness of the existing portfolio and investment policy statement for Elise. Standard III(A) also has some relevance since Pennington is in a position of trust with respect to Elise, and Pennington must ensure that his and AIA's goals do not conflict with Elise's.", "explhtml": "<p>Standard III(C), Suitability, is most relevant for Pennington&#x27;s meeting with Elise. This Standard requires Pennington to make a reasonable inquiry into Elise&#x27;s financial situation, investment experience, and investment objectives prior to making any recommendations about her portfolio. Pennington must also consider the appropriateness of the existing portfolio and investment policy statement for Elise. Standard III(A) also has some relevance since Pennington is in a position of trust with respect to Elise, and Pennington must ensure that his and AIA&#x27;s goals do not conflict with Elise
