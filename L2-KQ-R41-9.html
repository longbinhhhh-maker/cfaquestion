&#x27;s.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 30–33<\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v001.webp\" style=\"max-width:min(100%,264px)\" alt=\"Michael Pennington Case Scenario\"><p>Michael Pennington is Senior Vice President of equity investments at Alpha Investment Advisors, Inc. (AIA). He manages a team of analysts and portfolio managers and is responsible for maintaining and developing client relationships. AIA is located in Belgium and provides investment management services to high net worth individuals. Pennington is also a Level III Candidate in the CFA Program.<\/p><p>One of Pennington's clients is the Flanders family. Pennington had a long relationship with Helmut Flanders. Before Flanders's untimely death, he gave Pennington full discretion over his portfolio based on an investment policy statement that had been refined continuously over the years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v002.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Flanders was the president of a publicly traded manufacturing company, Allux, and 20% of his portfolio&#x27;s assets were invested in Allux equity. His contract with Allux prohibited selling his Allux shares while he was employed. • Flanders had little liquidity needs. His children were grown, and his salary at Allux was sufficient to cover his annual expenditures as well as contribute to his investment portfolio. • A former accountant, Flanders had been extremely knowledgeable and comfortable with the investment decision-making process. • Pennington owns 10,000 shares of Allux and serves on\"><p>AIA has an agreement with a local brokerage firm, First Brokerage, owned by Pennington's sister to place all AIA trades through First Brokerage.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"• Flanders agreed in writing that all trades in his portfolio would be directed to First Brokerage. • Pennington purchased new carpets for his office with soft dollars. He believes that his managers make better investment decisions when their environment is pleasant and\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"comfortable. • Pennington attended an industry conference in the Bahamas with soft dollars. The program is devoted to improving management of the investment advisory firm. He believes that a well-run firm makes better investment decisions. • Pennington consistently uses soft dollars to purchase research reports from an independent research firm that does in-depth analysis of a company&#x27;s financial reporting. Several of his managers have commented on the quality and usefulness of these reports to their analysis and decision making. • After Flander&#x27;s death, Pennington decided to sell al\"><p>Pennington has an appointment to meet with Flanders's widow, Elise, who, as an artist, left management of their financial assets to her husband. She is meeting with Pennington to better understand her financial position.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.5, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following Standards is most relevant regarding Pennington&#x27;s meeting with Elise?<\/p><\/div>", "subj": "ethics"}, {"n": 31, "q": "Standard VI(A), Disclosures of Conflicts, requires Pennington to disclose all matters, including beneficial ownership of securities of other investments, that could be expected to impair the member's ability to make unbiased and objective recommendations. Which of the following matters would least likely be disclosed to Elise?", "opts": ["AIA has a soft dollar arrangement with a brokerage firm owned by Pennington’s sister.", "Pennington owns shares in Allux.", "Pennington played golf with Helmut Flanders on a regular basis and developed client relationships from those golf outings."], "ans": "C", "expl": "Pennington playing golf with Elise's husband Helmut Flanders is not a conflict with respect to his relationship with Elsie and he need not disclose to her that he played golf with Flanders. Flanders was his client at the time and there was full disclosure that Pennington developed new client relationships. Al the other matters must be disclosed.", "explhtml": "<p>Pennington playing golf with Elise&#x27;s husband Helmut Flanders is not a conflict with respect to his relationship with Elsie and he need not disclose to her that he played golf with Flanders. Flanders was his client at the time and there was full disclosure that Pennington developed new client relationships. Al the other matters must be disclosed.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 30–33<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v001.webp\" style=\"max-width:min(100%,264px)\" alt=\"Michael Pennington Case Scenario\"><p>Michael Pennington is Senior Vice President of equity investments at Alpha Investment Advisors, Inc. (AIA). He manages a team of analysts and portfolio managers and is responsible for maintaining and developing client relationships. AIA is located in Belgium and provides investment management services to high net worth individuals. Pennington is also a Level III Candidate in the CFA Program.<\/p><p>One of Pennington's clients is the Flanders family. Pennington had a long relationship with Helmut Flanders. Before Flanders's untimely death, he gave Pennington full discretion over his portfolio based on an investment policy statement that had been refined continuously over the years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v002.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Flanders was the president of a publicly traded manufacturing company, Allux, and 20% of his portfolio&#x27;s assets were invested in Allux equity. His contract with Allux prohibited selling his Allux shares while he was employed. • Flanders had little liquidity needs. His children were grown, and his salary at Allux was sufficient to cover his annual expenditures as well as contribute to his investment portfolio. • A former accountant, Flanders had been extremely knowledgeable and comfortable with the investment decision-making process. • Pennington owns 10,000 shares of Allux and serves on\"><p>AIA has an agreement with a local brokerage firm, First Brokerage, owned by Pennington's sister to place all AIA trades through First Brokerage.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"• Flanders agreed in writing that all trades in his portfolio would be directed to First Brokerage. • Pennington purchased new carpets for his office with soft dollars. He believes that his managers make better investment decisions when their environment is pleasant and\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"comfortable. • Pennington attended an industry conference in the Bahamas with soft dollars. The program is devoted to improving management of the investment advisory firm. He believes that a well-run firm makes better investment decisions. • Pennington consistently uses soft dollars to purchase research reports from an independent research firm that does in-depth analysis of a company&#x27;s financial reporting. Several of his managers have commented on the quality and usefulness of these reports to their analysis and decision making. • After Flander&#x27;s death, Pennington decided to sell al\"><p>Pennington has an appointment to meet with Flanders's widow, Elise, who, as an artist, left management of their financial assets to her husband. She is meeting with Pennington to better understand her financial position.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Standard VI(A), Disclosures of Conflicts, requires Pennington to disclose all matters, including beneficial ownership of securities of other investments, that could be expected to impair the member&#x27;s ability to make unbiased and objective recommendations. Which of the following matters would least likely be disclosed to Elise?<\/p><\/div>", "subj": "ethics"}, {"n": 32, "q": "Which of the following best describes Pennington's compliance with the CFA Institute Standards regarding his use of soft dollars? The purchase of:", "opts": ["both research reports and carpeting are allowable uses of soft dollars.", "research reports and attending the conference are allowable uses of soft dollars.", "research reports is an allowable use of soft dollars."], "ans": "C", "expl": "Brokerage is commission generated from trades and is an asset of the client not the investment manager. Soft dollars is the use of brokerage to purchase research services that benefit the client in the investment decision-making process. The investment manager has an ongoing responsibility to seek to obtain best execution, minimize transaction costs, and use client brokerage to benefit clients. Consequently, contingent on disclosure of a soft dollar arrangement to clients whose portfolios might be affected, the CFA Institute Standards permit client brokerage only to be used to purchase research; that is, goods and services, the primary use of which directly assists the investment manager in the investment decision making process and not in the management of the firm.", "explhtml": "<p>Brokerage is commission generated from trades and is an asset of the client not the investment manager. Soft dollars is the use of brokerage to purchase research services that benefit the client in the investment decision-making process. The investment manager has an ongoing responsibility to seek to obtain best execution, minimize transaction costs, and use client brokerage to benefit clients. Consequently, contingent on disclosure of a soft dollar arrangement to clients whose portfolios might be affected, the CFA Institute Standards permit client brokerage only to be used to purchase research; that is, goods and services, the primary use of which directly assists the investment manager in the investment decision making process and not in the management of the firm.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 30–33<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v001.webp\" style=\"max-width:min(100%,264px)\" alt=\"Michael Pennington Case Scenario\"><p>Michael Pennington is Senior Vice President of equity investments at Alpha Investment Advisors, Inc. (AIA). He manages a team of analysts and portfolio managers and is responsible for maintaining and developing client relationships. AIA is located in Belgium and provides investment management services to high net worth individuals. Pennington is also a Level III Candidate in the CFA Program.<\/p><p>One of Pennington's clients is the Flanders family. Pennington had a long relationship with Helmut Flanders. Before Flanders's untimely death, he gave Pennington full discretion over his portfolio based on an investment policy statement that had been refined continuously over the years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v002.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Flanders was the president of a publicly traded manufacturing company, Allux, and 20% of his portfolio&#x27;s assets were invested in Allux equity. His contract with Allux prohibited selling his Allux shares while he was employed. • Flanders had little liquidity needs. His children were grown, and his salary at Allux was sufficient to cover his annual expenditures as well as contribute to his investment portfolio. • A former accountant, Flanders had been extremely knowledgeable and comfortable with the investment decision-making process. • Pennington owns 10,000 shares of Allux and serves on\"><p>AIA has an agreement with a local brokerage firm, First Brokerage, owned by Pennington's sister to place all AIA trades through First Brokerage.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"• Flanders agreed in writing that all trades in his portfolio would be directed to First Brokerage. • Pennington purchased new carpets for his office with soft dollars. He believes that his managers make better investment decisions when their environment is pleasant and\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"comfortable. • Pennington attended an industry conference in the Bahamas with soft dollars. The program is devoted to improving management of the investment advisory firm. He believes that a well-run firm makes better investment decisions. • Pennington consistently uses soft dollars to purchase research reports from an independent research firm that does in-depth analysis of a company&#x27;s financial reporting. Several of his managers have commented on the quality and usefulness of these reports to their analysis and decision making. • After Flander&#x27;s death, Pennington decided to sell al\"><p>Pennington has an appointment to meet with Flanders's widow, Elise, who, as an artist, left management of their financial assets to her husband. She is meeting with Pennington to better understand her financial position.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following best describes Pennington&#x27;s compliance with the CFA Institute Standards regarding his use of soft dollars? The purchase of:<\/p><\/div>", "subj": "ethics"}, {"n": 33, "q": "What additional Standard is specifically applicable to Pennington's decision to sell his and his clients' shares of Allux?", "opts": ["Standard II, Integrity of Capital Markets.", "Standard IV, Duties to Employers.", "Standard VII, Responsibilities as a CFA Institute Member or CFA Candidate."], "ans": "A", "expl": "As a director and member of Allux's audit committee, Pennington possesses material nonpublic information about a tender offer. Therefore, Pennington must be particularly concerned about complying with Standard II(A), Material Nonpublic Information.", "explhtml": "<p>As a director and member of Allux&#x27;s audit committee, Pennington possesses material nonpublic information about a tender offer. Therefore, Pennington must be particularly concerned about complying with Standard II(A), Material Nonpublic Information.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 30–33<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v001.webp\" style=\"max-width:min(100%,264px)\" alt=\"Michael Pennington Case Scenario\"><p>Michael Pennington is Senior Vice President of equity investments at Alpha Investment Advisors, Inc. (AIA). He manages a team of analysts and portfolio managers and is responsible for maintaining and developing client relationships. AIA is located in Belgium and provides investment management services to high net worth individuals. Pennington is also a Level III Candidate in the CFA Program.<\/p><p>One of Pennington's clients is the Flanders family. Pennington had a long relationship with Helmut Flanders. Before Flanders's untimely death, he gave Pennington full discretion over his portfolio based on an investment policy statement that had been refined continuously over the years.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v002.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Flanders was the president of a publicly traded manufacturing company, Allux, and 20% of his portfolio&#x27;s assets were invested in Allux equity. His contract with Allux prohibited selling his Allux shares while he was employed. • Flanders had little liquidity needs. His children were grown, and his salary at Allux was sufficient to cover his annual expenditures as well as contribute to his investment portfolio. • A former accountant, Flanders had been extremely knowledgeable and comfortable with the investment decision-making process. • Pennington owns 10,000 shares of Allux and serves on\"><p>AIA has an agreement with a local brokerage firm, First Brokerage, owned by Pennington's sister to place all AIA trades through First Brokerage.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v003.webp\" style=\"max-width:min(100%,615px)\" alt=\"• Flanders agreed in writing that all trades in his portfolio would be directed to First Brokerage. • Pennington purchased new carpets for his office with soft dollars. He believes that his managers make better investment decisions when their environment is pleasant and\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r41-9/v004.webp\" style=\"max-width:min(100%,637px)\" alt=\"comfortable. • Pennington attended an industry conference in the Bahamas with soft dollars. The program is devoted to improving management of the investment advisory firm. He believes that a well-run firm makes better investment decisions. • Pennington consistently uses soft dollars to purchase research reports from an independent research firm that does in-depth analysis of a company&#x27;s financial reporting. Several of his managers have commented on the quality and usefulness of these reports to their analysis and decision making. • After Flander&#x27;s death, Pennington decided to sell al\"><p>Pennington has an appointment to meet with Flanders's widow, Elise, who, as an artist, left management of their financial assets to her husband. She is meeting with Pennington to better understand her financial position.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>What additional Standard is specifically applicable to Pennington&#x27;s decision to sell his and his clients&#x27; shares of Allux?<\/p><\/div>", "subj": "ethics"}, {"n": 34, "q": "A CFA Institute member makes a recommendation of a stock in which his firm has a material ownership, but neglects to inform clients of that ownership. The candidate has most clearly violated:", "opts": ["Standard III(B) - Fair Dealing.", "Standard V(B) - Communication with Clients and Prospective Clients.", "Standard VI(A) - Disclosure of Conflicts."], "ans": "C", "expl": "Standard VI(A)requires that members fully disclose all potential conflicts of interest, including ownership of stock in companies that the member recommends or that clients hold. Standard III(B), Fair Dealing, forbids members and Candidates from discriminating against any clients when disseminating recommendations or taking investment action. Standard V(B), Communication with Clients and Prospective Clients, requires that members disclose the general principles of the investment processes used, and distinguish between opinions and facts.", "explhtml": "<p>Standard VI(A)requires that members fully disclose all potential conflicts of interest, including ownership of stock in companies that the member recommends or that clients hold. Standard III(B), Fair Dealing, forbids members and Candidates from discriminating against any clients when disseminating recommendations or taking investment action. Standard V(B), Communication with Clients and Prospective Clients, requires that members disclose the general principles of the investment processes used, and distinguish between opinions and facts.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>A CFA Institute member makes a recommendation of a stock in which his firm has a material ownership, but neglects to inform clients of that ownership. The candidate has most clearly violated:<\/p><\/div>", "subj": "ethics"}, {"n": 35, "q": "In order to conform to the Code and Standards with relation to Northern Lights stock, Hartsburg MUST:", "opts": ["directly disclose his holdings or have his company issue a generic disclaimer about analyst stock ownership.", "ask the company to assign another analyst to cover the stock in an effort to avoid the conflict of interest.", "sell the shares before issuing the report."], "ans": "A", "expl": "If the brokerage uses language related to the analysts' potential stock ownership, that should satisfy the requirements of Standard VI(A): Disclosure of Conflicts. The other answers would satisfy the Standard, but are not REQUIRED. Requiring the selling of shares or requesting another analyst is overkill, as analysts are not prohibited from owning stocks they cover.", "explhtml": "<p>If the brokerage uses language related to the analysts&#x27; potential stock ownership, that should satisfy the requirements of Standard VI(A): Disclosure of Conflicts. The other answers would satisfy the Standard, but are not REQUIRED. Requiring the selling of shares or requesting another analyst is overkill, as analysts are not prohibited from owning stocks they cover.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<\/summary><div class=\"vig-body\"><p>Greg Hartsburg, a CFA charterholder, is a leading health-care industry analyst for Reynolds and Co., a New York-based brokerage firm. He has ten years of industry experience and has appeared on the Wall Street Journal's roster of all-star analysts for four straight years.<\/p><p>Hartsburg initiates coverage on Northern Lights Medical Equipment, a Minnesota-based company that designs medical equipment. Hartsburg owns shares of Northern Lights in his personal trading account, a stake of which his company is aware.<\/p><p>Maria Voltaire, a junior analyst working under Hartsburg, has asked the senior analyst to help her prepare for the 2009 Level III CFA exam. He makes himself available to answer her questions on specific topics during the course of her study and gives her two days off, with pay. to study during the week before the exam. He also discusses with her in detail his recollection of the topical areas covered on the 2007 Level III exam, which he took and passed.<\/p><p>One of Reynolds' traders tells Hartsburg that he believes Voltaire is trading in her own account based on information she gathers from research reports written by analysts in the office before the reports are publicly released.<\/p><p>Hartsburg is planning to leave Reynolds at the end of the month to take a position as a portfolio manager at Lone Pine Investments. He has disclosed to Reynolds, in the form of an e-mail message to his supervisor, his intention to take with him to his new position a fundamental factor model that he developed before coming to Reynolds and further refined during his time at Reynolds.<\/p><p>He also discloses plans to take with him three sample client investment policy statements (with the client names eliminated) to use as templates in the development of policy statements for his new clients at Lone Pine. In the e-mail to his supervisor, Hartsburg promises he will not solicit the business of these three clients.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>In order to conform to the Code and Standards with relation to Northern Lights stock, Hartsburg MUST:<\/p><\/div>", "subj": "ethics"}, {"n": 36, "q": "Hartsburg's efforts to help Voltaire pass the CFA exam:", "opts": ["violate both Standard I(D): Misconduct and Standard VII(A): Conduct as Members and Candidates in the CFA Program.", "conform to all relevant standards.", "conform to Standard I(D): Misconduct, but violate Standard VII(A): Conduct as Members and Candidates in the CFA Program."], "ans": "C", "expl": "Hartsburg violated Standard VII(A) when he discussed with Voltaire in detail his recollection of the topical areas covered on the 2007 Level III exam.", "explhtml": "<p>Hartsburg violated Standard VII(A) when he discussed with Voltaire in detail his recollection of the topical areas covered on the 2007 Level III exam.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Greg Hartsburg, a CFA charterholder, is a leading health-care industry analyst for Reynolds and Co., a New York-based brokerage firm. He has ten years of industry experience and has appeared on the Wall Street Journal's roster of all-star analysts for four straight years.<\/p><p>Hartsburg initiates coverage on Northern Lights Medical Equipment, a Minnesota-based company that designs medical equipment. Hartsburg owns shares of Northern Lights in his personal trading account, a stake of which his company is aware.<\/p><p>Maria Voltaire, a junior analyst working under Hartsburg, has asked the senior analyst to help her prepare for the 2009 Level III CFA exam. He makes himself available to answer her questions on specific topics during the course of her study and gives her two days off, with pay. to study during the week before the exam. He also discusses with her in detail his recollection of the topical areas covered on the 2007 Level III exam, which he took and passed.<\/p><p>One of Reynolds' traders tells Hartsburg that he believes Voltaire is trading in her own account based on information she gathers from research reports written by analysts in the office before the reports are publicly released.<\/p><p>Hartsburg is planning to leave Reynolds at the end of the month to take a position as a portfolio manager at Lone Pine Investments. He has disclosed to Reynolds, in the form of an e-mail message to his supervisor, his intention to take with him to his new position a fundamental factor model that he developed before coming to Reynolds and further refined during his time at Reynolds.<\/p><p>He also discloses plans to take with him three sample client investment policy statements (with the client names eliminated) to use as templates in the development of policy statements for his new clients at Lone Pine. In the e-mail to his supervisor, Hartsburg promises he will not solicit the business of these three clients.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.1, LOS 41.a<\/div><div class=\"qtext\"><p>Hartsburg&#x27;s efforts to help Voltaire pass the CFA exam:<\/p><\/div>", "subj": "ethics"}, {"n": 37, "q": "With respect to the allegation that Voltaire is front-running research recommendations, Hartsburg's first priority, under CFA Institute Standard IV(C) concerning supervisory responsibilities, should be to:", "opts": ["promptly initiate an investigation.", "freeze Voltaire’s trading account and begin documenting her conduct as a precursor to possible termination.", "report the situation to his supervisor."], "ans": "A", "expl": "Standard IV(C) calls for supervisors to \"prevent any violation of applicable statutes, regulation, or provisions of the Code and Standards.\" While reporting the situation to a superior and discussing the situation with Voltaire are good ideas, he should first investigate the situation to see if these actions are warranted. Freezing Voltaire's trading account is premature, as Hartsburg has not yet investigated the situation to find out whether a violation is actually taking place.", "explhtml": "<p>Standard IV(C) calls for supervisors to &quot;prevent any violation of applicable statutes, regulation, or provisions of the Code and Standards.&quot; While reporting the situation to a superior and discussing the situation with Voltaire are good ideas, he should first investigate the situation to see if these actions are warranted. Freezing Voltaire&#x27;s trading account is premature, as Hartsburg has not yet investigated the situation to find out whether a violation is actually taking place.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Greg Hartsburg, a CFA charterholder, is a leading health-care industry analyst for Reynolds and Co., a New York-based brokerage firm. He has ten years of industry experience and has appeared on the Wall Street Journal's roster of all-star analysts for four straight years.<\/p><p>Hartsburg initiates coverage on Northern Lights Medical Equipment, a Minnesota-based company that designs medical equipment. Hartsburg owns shares of Northern Lights in his personal trading account, a stake of which his company is aware.<\/p><p>Maria Voltaire, a junior analyst working under Hartsburg, has asked the senior analyst to help her prepare for the 2009 Level III CFA exam. He makes himself available to answer her questions on specific topics during the course of her study and gives her two days off, with pay. to study during the week before the exam. He also discusses with her in detail his recollection of the topical areas covered on the 2007 Level III exam, which he took and passed.<\/p><p>One of Reynolds' traders tells Hartsburg that he believes Voltaire is trading in her own account based on information she gathers from research reports written by analysts in the office before the reports are publicly released.<\/p><p>Hartsburg is planning to leave Reynolds at the end of the month to take a position as a portfolio manager at Lone Pine Investments. He has disclosed to Reynolds, in the form of an e-mail message to his supervisor, his intention to take with him to his new position a fundamental factor model that he developed before coming to Reynolds and further refined during his time at Reynolds.<\/p><p>He also discloses plans to take with him three sample client investment policy statements (with the client names eliminated) to use as templates in the development of policy statements for his new clients at Lone Pine. In the e-mail to his supervisor, Hartsburg promises he will not solicit the business of these three clients.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>With respect to the allegation that Voltaire is front-running research recommendations, Hartsburg&#x27;s first priority, under CFA Institute Standard IV(C) concerning supervisory responsibilities, should be to:<\/p><\/div>", "subj": "ethics"}, {"n": 38, "q": "Which statement about Hartsburg's actions prior to his leaving Reynolds is most accurate? His actions regarding the factor model:", "opts": ["do not conform to Standard IV(A): Loyalty to Employer, but his actions regarding the investment-policy statements do.", "conform to Standard IV(A): Loyalty to Employer, as do his actions regarding the investment-policy statements.", "do not conform to Standard IV(A): Loyalty to Employer, nor do his actions regarding the investment-policy statements."], "ans": "C", "expl": "According to Standard IV(A): Loyalty to Employer, Hartsburg cannot, without the consent of Reynolds, his current employer, take with him any property that rightfully belongs to Reynolds. Merely disclosing to his supervisor his intention to take the model and the investment policy statements with him does not constitute consent on the part of Reynolds, and as such could be considered misappropriation. Therefore his actions regarding both the model and the policy statements fail to conform to Standard IV(A).", "explhtml": "<p>According to Standard IV(A): Loyalty to Employer, Hartsburg cannot, without the consent of Reynolds, his current employer, take with him any property that rightfully belongs to Reynolds. Merely disclosing to his supervisor his intention to take the model and the investment policy statements with him does not constitute consent on the part of Reynolds, and as such could be considered misappropriation. Therefore his actions regarding both the model and the policy statements fail to conform to Standard IV(A).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 35–38<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Greg Hartsburg, a CFA charterholder, is a leading health-care industry analyst for Reynolds and Co., a New York-based brokerage firm. He has ten years of industry experience and has appeared on the Wall Street Journal's roster of all-star analysts for four straight years.<\/p><p>Hartsburg initiates coverage on Northern Lights Medical Equipment, a Minnesota-based company that designs medical equipment. Hartsburg owns shares of Northern Lights in his personal trading account, a stake of which his company is aware.<\/p><p>Maria Voltaire, a junior analyst working under Hartsburg, has asked the senior analyst to help her prepare for the 2009 Level III CFA exam. He makes himself available to answer her questions on specific topics during the course of her study and gives her two days off, with pay. to study during the week before the exam. He also discusses with her in detail his recollection of the topical areas covered on the 2007 Level III exam, which he took and passed.<\/p><p>One of Reynolds' traders tells Hartsburg that he believes Voltaire is trading in her own account based on information she gathers from research reports written by analysts in the office before the reports are publicly released.<\/p><p>Hartsburg is planning to leave Reynolds at the end of the month to take a position as a portfolio manager at Lone Pine Investments. He has disclosed to Reynolds, in the form of an e-mail message to his supervisor, his intention to take with him to his new position a fundamental factor model that he developed before coming to Reynolds and further refined during his time at Reynolds.<\/p><p>He also discloses plans to take with him three sample client investment policy statements (with the client names eliminated) to use as templates in the development of policy statements for his new clients at Lone Pine. In the e-mail to his supervisor, Hartsburg promises he will not solicit the business of these three clients.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>Which statement about Hartsburg&#x27;s actions prior to his leaving Reynolds is most accurate? His actions regarding the factor model:<\/p><\/div>", "subj": "ethics"}, {"n": 39, "q": "Arthur Harrow, CFA, is a pharmaceuticals analyst at Dominion Asset Management. His supervisor directs him to prepare separate research reports on Miracle Drug Company and Wonder Drug Company. Harrow serves on the board of Miracle and owns shares of Wonder. According to the Standards of Professional Conduct, which of the following actions is Harrow required to take when he writes the research reports?", "opts": ["Harrow must disclose his ownership of shares in Wonder but not his relationship with Miracle.", "Harrow must disclose his relationship with Miracle but not his ownership of shares in Wonder.", "Harrow must disclose both his relationship with Miracle and his ownership of shares in Wonder."], "ans": "C", "expl": "Standard VI(A) Avoid or Disclose Conflicts requires that Harrow disclose matters that reasonably could be expected to interfere with his independence and objectivity. Both Harrow's relationship with Miracle and his ownership of Wonder's shares represent potential conflicts of interest and must be disclosed prominently and in clear language in the research report, giving clients the ability to weigh the possible effects of these potential conflicts on his analysis and conclusions.", "explhtml": "<p>Standard VI(A) Avoid or Disclose Conflicts requires that Harrow disclose matters that reasonably could be expected to interfere with his independence and objectivity. Both Harrow&#x27;s relationship with Miracle and his ownership of Wonder&#x27;s shares represent potential conflicts of interest and must be disclosed prominently and in clear language in the research report, giving clients the ability to weigh the possible effects of these potential conflicts on his analysis and conclusions.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 41.9, LOS 41: VI(A)<\/div><div class=\"qtext\"><p>Arthur Harrow, CFA, is a pharmaceuticals analyst at Dominion Asset Management. His supervisor directs him to prepare separate research reports on Miracle Drug Company and Wonder Drug Company. Harrow serves on the board of Miracle and owns shares of Wonder. According to the Standards of Professional Conduct, which of the following actions is Harrow required to take when he writes the research reports?<\/p><\/div>", "subj": "ethics"}, {"n": 40, "q": "Is it likely that Myers violated any CFA Institute Standards of Professional Conduct with respect to her disclosure of the partnership interest in the software company or did Harrison violate any standards with respect to the sale of Breakthrough stock? Partnership interest  Breakthrough sale", "opts": ["No Yes", "Yes Yes", "Yes No"], "ans": "B", "expl": "Standard VI(A) – Disclosure of Conflicts, is applicable since Myers is a portfolio manager with fiduciary responsibility for institutional clients of Ironclad who may also be clients of her software company, thereby potentially compromising her ability to make unbiased and objective investment recommendations. Myers should disclose the potential conflict to her clients and to Ironclad and abide by any restrictions imposed by the firm. Myers has not disclosed the conflict to clients and has therefore violated the Standard. Harrison has violated Standard IV(C) – Responsibilities of Supervisors by failing to prevent Myers from trading on material nonpublic information. He has a responsibility as a supervisor to make reasonable efforts to detect and prevent violations of the Standards by his employees.", "explhtml": "<p>Standard VI(A) – Disclosure of Conflicts, is applicable since Myers is a portfolio manager with fiduciary responsibility for institutional clients of Ironclad who may also be clients of her software company, thereby potentially compromising her ability to make unbiased and objective investment recommendations. Myers should disclose the potential conflict to her clients and to Ironclad and abide by any restrictions imposed by the firm. Myers has not disclosed the conflict to clients and has therefore violated the Standard. Harrison has violated Standard IV(C) – Responsibilities of Supervisors by failing to prevent Myers from trading on material nonpublic information. He has a responsibility as a supervisor to make reasonable efforts to detect and prevent violations of the Standards by his employees.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<\/summary><div class=\"vig-body\"><p>Hunter Harrison, CFA, has recently been promoted to Chief Investment Officer (CIO) of Ironclad Investments, an investment adviser and pension consultant for medium and large corporate pension clients. Ironclad recently hired a compliance officer to update its compliance manual, which is consistent with the CFA Institute Code and Standards. Harrison serves as a director on several non-profit and corporate boards of directors, some of which have their pension assets managed by Ironclad. As part of his new job duties, Harrison will oversee Ironclad's research analysts and portfolio managers, including Michelle Myers, who passed the Level || CFA examination last year and is registered for the next exam. Myers is a portfolio manager who regularly meets with clients and prospects. Myers is also a partner in a software company that sells retirement and benefit administration services to institutional clients, some of which are also clients of Ironclad to whom Myers has recommended the software company. Myers has disclosed her partnership interest in the software company to Ironclad, including the potential for additional compensation and the possible conflicts of interest, but not to her clients.<\/p><p>One of Myers' software clients, Breakthrough Pharmaceuticals (Breakthrough), is a publicly traded corporation that is also held in many of Ironclad's client portfolios. In the course of their business relationship, Breakthrough's CEO informs Myers that the company has been having difficulty making retirement benefit payments, and its pension plan has recently gone from \"overfunded\" to \"significantly underfunded\" as a result of market conditions. Breakthrough's CEO indicates to Myers that he is attempting to source additional short-term financing to make retiree benefit payments and will disclose the significant \"underfunded status\" of the pension plan in the upcoming financial statements. Myers, concerned that Breakthrough's current pension troubles and short-term liquidity issues will negatively affect its earnings and consequently the performance of the company's stock, informs Harrison of the impending disclosure. Harrison allows Myers to sell 1,800,000 shares of Breakthrough stock for clients, causing the price to drop by 5%. When the pension troubles are later disclosed in the company's financial statements, Breakthrough's stock price drops an additional 18%.<\/p><p>Harrison, as CIO, is chairman of Ironclad's proxy voting committee. Myers is also a member of the committee. Ironclad, as a discretionary investment manager, votes proxies through the proxy voting committee on behalf of clients. Ironclad is currently reviewing proxies for several companies covered in research, including technology companies Advanced DSL (Advanced). InterConnect Inc. (InterConnect), Speedy Chip Technology (Speedy Chip), and Wavelength Digital (Wavelength). Each company's current proxy contains voting proposals pertaining to employee stock option expensing methods. This issue is particularly important to Ironclad because several of its investment personnel recently participated in an industry forum that supported increased disclosure for company stock options. The panel concluded that such disclosure will provide investors with a more complete estimate of corporate earnings. Ironclad, through its clients, owns approximately 4% of the outstanding shares of Advanced and InterConnect and approximately 6% of the outstanding shares of Speedy Chip and Wavelength. Harrison serves on the board of directors for InterConnect and Wavelength, while Myers provides consulting services for Speedy Chip. Harrison receives cash compensation and stock options for his services, while Myers receives restricted stock and stock options. The investment bank that led the public offering of InterConnect and Speedy Chip and seven of nine sell-side analysts covering the companies have \"sell\" ratings on the stocks. Ironclad's analysts have also issued \"sell\" recommendations on the companies due to, among other issues, lack of earnings transparency and low earnings quality. Contrary to committee consensus, Harrison and Myers vote client proxies \"against\" the expensing of employee stock options for InterConnect, Wavelength, and Speedy Chip. Harrison increases his clients' positions in both InterConnect and Wavelength, citing \"growth opportunities\" and \"consensus opinion.\" Neither Harrison nor Myers has disclosed these compensation arrangements to Ironclad.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.9, LOS 41.a<\/div><div class=\"qtext\"><p>Is it likely that Myers violated any CFA Institute Standards of Professional Conduct with respect to her disclosure of the partnership interest in the software company or did Harrison violate any standards with respect to the sale of Breakthrough stock? Partnership interest &nbsp; Breakthrough sale<\/p><\/div>", "subj": "ethics"}, {"n": 41, "q": "Is it likely that Myers violated any CFA Institute Standards of Professional Conduct by selling the Breakthrough stock for her clients' accounts?", "opts": ["Yes, because the information shared by Breakthrough's CEO was nonpublic.", "No, because Myers is not considered an insider with respect to the information.", "No, because Myers has a fiduciary duty to her clients."], "ans": "A", "expl": "Although the information shared by Myers may have helped Ironclad's clients avoid losses in shares of Breakthrough, the information was material nonpublic information. Information is \"material\" if its disclosure would have an impact on the stock or if a reasonable investor would want to know the information prior to making an investment decision. Information is \"nonpublic\" until it has been generally disseminated to the marketplace and investors have had an opportunity to react to the information. The information about Breakthrough's pension difficulties was both material and nonpublic, as the stock dropped significantly upon disclosure of the information in the market. Therefore, Myers had a duty to keep the information confidential and not to trade or cause others to trade on the information. By sharing the information with Harrison and trading on that information, Myers violated Standard II(A) – Material Nonpublic Information.", "explhtml": "<p>Although the information shared by Myers may have helped Ironclad&#x27;s clients avoid losses in shares of Breakthrough, the information was material nonpublic information. Information is &quot;material&quot; if its disclosure would have an impact on the stock or if a reasonable investor would want to know the information prior to making an investment decision. Information is &quot;nonpublic&quot; until it has been generally disseminated to the marketplace and investors have had an opportunity to react to the information. The information about Breakthrough&#x27;s pension difficulties was both material and nonpublic, as the stock dropped significantly upon disclosure of the information in the market. Therefore, Myers had a duty to keep the information confidential and not to trade or cause others to trade on the information. By sharing the information with Harrison and trading on that information, Myers violated Standard II(A) – Material Nonpublic Information.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hunter Harrison, CFA, has recently been promoted to Chief Investment Officer (CIO) of Ironclad Investments, an investment adviser and pension consultant for medium and large corporate pension clients. Ironclad recently hired a compliance officer to update its compliance manual, which is consistent with the CFA Institute Code and Standards. Harrison serves as a director on several non-profit and corporate boards of directors, some of which have their pension assets managed by Ironclad. As part of his new job duties, Harrison will oversee Ironclad's research analysts and portfolio managers, including Michelle Myers, who passed the Level || CFA examination last year and is registered for the next exam. Myers is a portfolio manager who regularly meets with clients and prospects. Myers is also a partner in a software company that sells retirement and benefit administration services to institutional clients, some of which are also clients of Ironclad to whom Myers has recommended the software company. Myers has disclosed her partnership interest in the software company to Ironclad, including the potential for additional compensation and the possible conflicts of interest, but not to her clients.<\/p><p>One of Myers' software clients, Breakthrough Pharmaceuticals (Breakthrough), is a publicly traded corporation that is also held in many of Ironclad's client portfolios. In the course of their business relationship, Breakthrough's CEO informs Myers that the company has been having difficulty making retirement benefit payments, and its pension plan has recently gone from \"overfunded\" to \"significantly underfunded\" as a result of market conditions. Breakthrough's CEO indicates to Myers that he is attempting to source additional short-term financing to make retiree benefit payments and will disclose the significant \"underfunded status\" of the pension plan in the upcoming financial statements. Myers, concerned that Breakthrough's current pension troubles and short-term liquidity issues will negatively affect its earnings and consequently the performance of the company's stock, informs Harrison of the impending disclosure. Harrison allows Myers to sell 1,800,000 shares of Breakthrough stock for clients, causing the price to drop by 5%. When the pension troubles are later disclosed in the company's financial statements, Breakthrough's stock price drops an additional 18%.<\/p><p>Harrison, as CIO, is chairman of Ironclad's proxy voting committee. Myers is also a member of the committee. Ironclad, as a discretionary investment manager, votes proxies through the proxy voting committee on behalf of clients. Ironclad is currently reviewing proxies for several companies covered in research, including technology companies Advanced DSL (Advanced). InterConnect Inc. (InterConnect), Speedy Chip Technology (Speedy Chip), and Wavelength Digital (Wavelength). Each company's current proxy contains voting proposals pertaining to employee stock option expensing methods. This issue is particularly important to Ironclad because several of its investment personnel recently participated in an industry forum that supported increased disclosure for company stock options. The panel concluded that such disclosure will provide investors with a more complete estimate of corporate earnings. Ironclad, through its clients, owns approximately 4% of the outstanding shares of Advanced and InterConnect and approximately 6% of the outstanding shares of Speedy Chip and Wavelength. Harrison serves on the board of directors for InterConnect and Wavelength, while Myers provides consulting services for Speedy Chip. Harrison receives cash compensation and stock options for his services, while Myers receives restricted stock and stock options. The investment bank that led the public offering of InterConnect and Speedy Chip and seven of nine sell-side analysts covering the companies have \"sell\" ratings on the stocks. Ironclad's analysts have also issued \"sell\" recommendations on the companies due to, among other issues, lack of earnings transparency and low earnings quality. Contrary to committee consensus, Harrison and Myers vote client proxies \"against\" the expensing of employee stock options for InterConnect, Wavelength, and Speedy Chip. Harrison increases his clients' positions in both InterConnect and Wavelength, citing \"growth opportunities\" and \"consensus opinion.\" Neither Harrison nor Myers has disclosed these compensation arrangements to Ironclad.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.3, LOS 41.a<\/div><div class=\"qtext\"><p>Is it likely that Myers violated any CFA Institute Standards of Professional Conduct by selling the Breakthrough stock for her clients&#x27; accounts?<\/p><\/div>", "subj": "ethics"}, {"n": 42, "q": "With respect to Harrison's directorships with InterConnect and Wavelength and Myers' consulting arrangement with Speedy Chip, is it likely that any CFA Institute Standards of Professional Conduct have been violated? Myers' Harrison's consulting directorships arrangements", "opts": ["Yes Yes", "Yes No", "No No"], "ans": "A", "expl": "Standard IV(B) – Additional Compensation Arrangements, applies to both Harrison and Myers, as they both receive compensation for their respective outside services in the form of cash, stock, and stock options. There is no indication that either of them have disclosed their compensation arrangements to Ironclad, which constitutes a violation of Standard IV(B). Standard I(B) – Independence and Objectivity also applies to this situation, as both Harrison and Myers have outside activities that have the appearance of compromising their independence and objectivity regarding Ironclad's clients. Harrison's role on the boards of directors for InterConnect and Wavelength and Myers' role as a consultant for Speedy Chip appear to drive their proxy voting decisions, on behalf of Ironclad's clients, regarding the expensing of stock options. Thus both Harrison and Myers have also violated Standard I(B). Harrison and Myers may have also violated Statement VI(A) – Disclosure of Conflict by failing to disclose the conflicts of interest that exist as a result of Harrison's directorships with Interconnect and Wavelength and Myers' consulting arrangement with Speedy Chip. Such conflicts (whether actual or potential) are required to be disclosed prominently and in clear language to clients, prospects, and employers according to Standard VI(A).", "explhtml": "<p>Standard IV(B) – Additional Compensation Arrangements, applies to both Harrison and Myers, as they both receive compensation for their respective outside services in the form of cash, stock, and stock options. There is no indication that either of them have disclosed their compensation arrangements to Ironclad, which constitutes a violation of Standard IV(B). Standard I(B) – Independence and Objectivity also applies to this situation, as both Harrison and Myers have outside activities that have the appearance of compromising their independence and objectivity regarding Ironclad&#x27;s clients. Harrison&#x27;s role on the boards of directors for InterConnect and Wavelength and Myers&#x27; role as a consultant for Speedy Chip appear to drive their proxy voting decisions, on behalf of Ironclad&#x27;s clients, regarding the expensing of stock options. Thus both Harrison and Myers have also violated Standard I(B). Harrison and Myers may have also violated Statement VI(A) – Disclosure of Conflict by failing to disclose the conflicts of interest that exist as a result of Harrison&#x27;s directorships with Interconnect and Wavelength and Myers&#x27; consulting arrangement with Speedy Chip. Such conflicts (whether actual or potential) are required to be disclosed prominently and in clear language to clients, prospects, and employers according to Standard VI(A).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 40–43<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Hunter Harrison, CFA, has recently been promoted to Chief Investment Officer (CIO) of Ironclad Investments, an investment adviser and pension consultant for medium and large corporate pension clients. Ironclad recently hired a compliance officer to update its compliance manual, which is consistent with the CFA Institute Code and Standards. Harrison serves as a director on several non-profit and corporate boards of directors, some of which have their pension assets managed by Ironclad. As part of his new job duties, Harrison will oversee Ironclad's research analysts and portfolio managers, including Michelle Myers, who passed the Level || CFA examination last year and is registered for the next exam. Myers is a portfolio manager who regularly meets with clients and prospects. Myers is also a partner in a software company that sells retirement and benefit administration services to institutional clients, some of which are also clients of Ironclad to whom Myers has recommended the software company. Myers has disclosed her partnership interest in the software company to Ironclad, including the potential for additional compensation and the possible conflicts of interest, but not to her clients.<\/p><p>One of Myers' software clients, Breakthrough Pharmaceuticals (Breakthrough), is a publicly traded corporation that is also held in many of Ironclad's client portfolios. In the course of their business relationship, Breakthrough's CEO informs Myers that the company has been having difficulty making retirement benefit payments, and its pension plan has recently gone from \"overfunded\" to \"significantly underfunded\" as a result of market conditions. Breakthrough's CEO indicates to Myers that he is attempting to source additional short-term financing to make retiree benefit payments and will disclose the significant \"underfunded status\" of the pension plan in the upcoming financial statements. Myers, concerned that Breakthrough's current pension troubles and short-term liquidity issues will negatively affect its earnings and consequently the performance of the company's stock, informs Harrison of the impending disclosure. Harrison allows Myers to sell 1,800,000 shares of Breakthrough stock for clients, causing the price to drop by 5%. When the pension troubles are later disclosed in the company's financial statements, Breakthrough's stock price drops an additional 18%.<\/p><p>Harrison, as CIO, is chairman of Ironclad's proxy voting committee. Myers is also a member of the committee. Ironclad, as a discretionary investment manager, votes proxies through the proxy voting committee on behalf of clients. Ironclad is currently reviewing proxies for several companies covered in research, including technology companies Advanced DSL (Advanced). InterConnect Inc. (InterConnect), Speedy Chip Technology (Speedy Chip), and Wavelength Digital (Wavelength). Each company's current proxy contains voting proposals pertaining to employee stock option expensing methods. This issue is particularly important to Ironclad because several of its investment personnel recently participated in an industry forum that supported increased disclosure for company stock options. The panel concluded that such disclosure will provide investors with a more complete estimate of corporate earnings. Ironclad, through its clients, owns approximately 4% of the outstanding shares of Advanced and InterConnect and approximately 6% of the outstanding shares of Speedy Chip and Wavelength. Harrison serves on the board of directors for InterConnect and Wavelength, while Myers provides consulting services for Speedy Chip. Harrison receives cash compensation and stock options for his services, while Myers receives restricted stock and stock options. The investment bank that led the public offering of InterConnect and Speedy Chip and seven of nine sell-side analysts covering the companies have \"sell\" ratings on the stocks. Ironclad's analysts have also issued \"sell\" recommendations on the companies due to, among other issues, lack of earnings transparency and low earnings quality. Contrary to committee consensus, Harrison and Myers vote client proxies \"against\" the expensing of employee stock options for InterConnect, Wavelength, and Speedy Chip. Harrison increases his clients' positions in both InterConnect and Wavelength, citing \"growth opportunities\" and \"consensus opinion.\" Neither Harrison nor Myers has disclosed these compensation arrangements to Ironclad.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.7, LOS 41.a<\/div><div class=\"qtext\"><p>With respect to Harrison&#x27;s directorships with InterConnect and Wavelength and Myers&#x27; consulting arrangement with Speedy Chip, is it likely that any CFA Institute Standards of Professional Conduct have been violated?<\/p><p>Myers&#x27;<\/p><p>Harrison&#x27;s<\/p><p>consulting<\/p><p>directorships<\/p><p>arrangements<\/p><\/div>", "subj": "ethics"}, {"n": 43, "q": "Which of the following least accurately describes Harrison's actions necessary for compliance with the Code and Standards regarding proxy voting? Harrison should:", "opts": ["discard all proxies on behalf of Ironclad’s clients when there is a conflict of interest.", "abstain from voting on matters affecting Internet and Wavelength to avoid conflicts of interest.", "disclose all proxy voting policies to Ironclad’s clients including the treatment of routine and nonroutine issues."], "ans": "A", "expl": "According to Standard III(A) – Loyalty, Prudence, and Care, Ironclad, as a discretionary investment manager, is responsible (unless otherwise stipulated in the client guidelines or agreement) for making informed and reasonable decisions regarding proxy voting on behalf of clients. Among other things, Ironclad should have a proxy voting policy and a process for identifying and reviewing major proxy issues for appropriate clients. Ironclad and Harrison also have an obligation to avoid conflicts of interest when voting proxies. Although Harrison has a conflict of interest in voting issues on behalf of InterConnect and Wavelength due to his role on their board of directors, proxies on non-routine matters should not be discarded under any circumstances, as such action would constitute a breach of fiduciary duty. Harrison should abstain from voting on matters affecting InterConnect and Wavelength to avoid the appearance of a conflict of interest. Harrison should also ensure proper treatment of any confidential information received in his role on the respective boards of directors. Harrison should maintain confidentiality of voting information on behalf of clients and follow Ironclad's proxy voting policy. Clients must be made aware of the firm's policies on voting routine and non-routine proxy issues.", "explhtml": "<p>According to Standard III(A) – Loyalty, Prudence, and Care, Ironclad, as a discretionary investment manager, is responsible (unless otherwise stipulated in the client guidelines or agreement) for making informed and reasonable decisions regarding proxy voting on behalf of clients. Among other things, Ironclad should have a proxy voting policy and a process for identifying and reviewing major proxy issues for appropriate clients. Ironclad and Harrison also have an obligation to avoid conflicts of interest when voting proxies. Although Harrison has a conflict of interest in voting issues on behalf of Inter el recently participated in an industry forum that supported increased disclosure for company stock options. The panel concluded that such disclosure will provide investors with a more complete estimate of corporate earnings. Ironclad, through its clients, owns approximately 4% of the outstanding shares of Advanced and InterConnect and approximately 6% of the outstanding shares of Speedy Chip and Wavelength. Harrison serves on the board of directors for InterConnect and Wavelength, while Myers provides consulting services for Speedy Chip. Harrison receives cash compensation and stock options for his services, while Myers receives restricted stock and stock options. The investment bank that led the public offering of InterConnect and Speedy Chip and seven of nine sell-side analysts covering the companies have \"sell\" ratings on the stocks. Ironclad's analysts have also issued \"sell\" recommendations on the companies due to, among other issues, lack of earnings transparency and low earnings quality. Contrary to committee consensus, Harrison and Myers vote client proxies \"against\" the expensing of employee stock options for InterConnect, Wavelength, and Speedy Chip. Harrison increases his clients' positions in both InterConnect and Wavelength, citing \"growth opportunities\" and \"consensus opinion.\" Neither Harrison nor Myers has disclosed these compensation arrangements to Ironclad.<\/p><\/div><\/details><div class=\"pp-topic\">Module 41.4, LOS 41.a<\/div><div class=\"qtext\"><p>Which of the following least accurately describes Harrison&#x27;s actions necessary for compliance with the Code and Standards regarding proxy voting? Harrison should:<\/p><\/div>", "subj": "ethics"}, {"n": 44, "q": "An analyst routinely has the opportunity to offer his clients the opportunity to purchase \"hot new issues.\" He tells his clients that he will distribute each issue equally among those interested, with himself included in the distribution. The clients do not object to this. const CFG = {"title": "Reading 41.9 — Guidance for Standard VI", "subtitle": "CFA Level II · 44 câu · Kaplan Schweser QBank 2025 (28 câu đơn · 16 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){

  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }

function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){

    const c = document.createElement("div");

function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));

}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";

const CFA_SESSION_SUBJECT_RANGES = {
  1:{ethics:[27,27],quant:[11,17],economics:[11,17],fsa:[20,25],corporate:[10,16]},
  2:{equity:[20,25],fixed:[20,25],derivatives:[9,14],alternatives:[11,16],portfolio:[14,22]}
};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,
  fsa:/financial statement|financial reporting|accounting|income statement|balance sheet|cash flow|revenue|expense|inventory|cost of sales|gross profit|gross margin|shareholders?['’]? equity|earnings per share|\beps\b|audit|gaap|ifrs|taxable income|deferred tax|temporary difference|intangible|long-lived|revaluation|impairment|amortization|depreciation|pension|financial ratio|receivables turnover|payables turnover|cash conversion|fixed charge coverage|normalized earnings|management['’]?s commentary/g,
