tarted hiring full-time workers and ordering heavy equipment. This economy is most likely in the:", "opts": ["peak phase.", "late expansion phase.", "early expansion phase."], "ans": "B", "expl": "Economies experience business cycle phases of trough, expansion, peak, and contraction. Each phase is associated with certain characteristics\nregarding GDP growth and inflation. Expansion is divided into early (ie, recovery) and late phases (ie, boom).\nDuring an early expansion phase, consumers begin to spend more, and GDP growth becomes moderately positive. Businesses begin to\npurchase inventory but are hesitant to hire new employees until there is evidence of further economic growth (Choice C).\nDuring the late expansion phase, consumer spending increases even further, and GDP growth becomes accelerated. Businesses rehire\nfull time employees and invest in heavy capital equipment.\n(Choice A) The peak phase follows late expansion and is characterized by decelerating GDP growth and a slowdown in hiring.\nThings to remember:\nEconomies experience business cycle phases of trough, expansion (early and late), peak, and contraction. In the late expansion phase GDP\ngrowth is accelerated, and businesses begin to rehire employees and invest in capital equipment.\nDescribe the business cycle and its phases", "qhtml": null}, {"n": 32, "q": "Which of the following best describes a characteristic of the early expansion phase of the business cycle?", "opts": ["Inflation accelerates, leading economic growth", "Capital spending by businesses expands rapidly", "Consumers accelerate spending on housing and durable goods"], "ans": "C", "expl": "The phases of the business cycle are expansion, peak, contraction (ie, recession), and trough. The length of a business cycle, or any specific\nphase, is not predictable. However, each phase is associated with certain characteristics regarding GDP growth and inflation.\nExpansions are divided into early (ie, initial recovery) and late phases. The early expansion phase occurs after the economy has been in a trough,\nwhich is considered a turning point in the cycle, when economic activities begin to expand. Characteristics of the early expansion phase\ninclude the following:\nBusinesses begin to replenish inventories.\nConsumers start spending more, particularly on housing and durable goods, as incomes stabilize.\nGDP moves from negative to moderately positive.\nCentral banks generally keep interest rates low to support the expanding economy.\nUnemployment levels decline but remain high. Layoffs slow, but employers are reluctant to hire new staff without evidence of sustained\neconomic growth.\n(Choice A) Inflation tends to lag other variables, exhibiting slow growth or even deflation. Inflation catches up to economic growth during the later\nexpansion phase.\n(Choice B) Early in the expansion, businesses are not yet willing or able to commit to large capital spending plans (eg, new manufacturing\nfacilities, expanding production capabilities). It is during the peak phase that business capital spending expands rapidly since confidence in the\nbusiness cycle is high.\nThings to remember:\nThe early expansion phase occurs after the economy has been in a trough, when economic activities begin to expand. GDP growth moves from\nnegative to moderately positive. Consumers start spending more, particularly on housing and durable goods.\nDescribe the business cycle and its phases", "qhtml": null}, {"n": 33, "q": "Loose private sector credit conditions occurring at the peak of a credit cycle are most likely to:", "opts": ["contribute to financial asset price bubbles.", "result in a stronger recovery during the early part of the next economic expansion.", "moderate the economic downturn associated with a contraction of the business cycle."], "ans": "A", "expl": "Business cycles measure changes in economic activity. Financial cycles measure changes in financing and credit conditions. Credit cycles are a\nsubset of financial cycles and describe changes in availability and pricing (ie, interest rates/yields) of private sector credit, which has direct\nimplications for the business cycle.\nThe credit cycle tends to be longer and more extreme than the business cycle. Credit cycle peaks are often a precursor to the peak of the\nbusiness cycle. They are characterized by loose credit conditions (ie, easily available credit) that contribute to bubbles (ie, unsustainable\nvaluations) in financial assets such as stocks and real estate.\nTherefore, investors monitor the credit cycle to better understand and anticipate:\nits alignment with the business cycle,\nthe valuation of financial assets,\nchanges in real estate markets (eg, housing, construction), and\ngovernment policy actions.\nMonetary and fiscal policymakers have increasingly focused on the management of financial market stability. This focus is influenced by their\nrecognition that credit cycle peaks are often associated with subsequent banking crises.\n(Choice B) Since the credit cycle is usually longer than the business cycle, credit tends to be an economic headwind early in the expansion\nphase of the business cycle. It is not uncommon for credit to still be contracting (tight, not loose) during this first stage of an economic recovery.\n(Choice C) A peaking credit cycle would intensify (not moderate) the economic downturn associated with a contraction of the business cycle.\nTypically, credit contraction and the associated reduction in asset values is well underway by the time the business cycle begins its downturn.\nThings to remember:\nLoose credit conditions, which often occur at the peak of a credit cycle, contribute to bubbles in financial assets such as stocks and real estate.\nDescribe the business cycle and its phases", "qhtml": null}, {"n": 34, "q": "Credit cycles are least likely to:", "opts": ["peak prior to recessions.", "be countercyclical to business cycles.", "amplify the duration and magnitude of business cycles."], "ans": "B", "expl": "Business cycles measure changes in economic activity. Financial cycles measure changes in financing and credit conditions (eg, pricing,\navailability, risk attitudes). Credit cycles are a subset of financial cycles and describe changes in availability and pricing (ie, interest\nrates/yields) of private sector credit, which has direct implications for the business cycle. Credit cycles tend to be procyclical, not\ncountercyclical, to business cycles since credit availability expands during economic expansions and contracts sharply during economic\ndownturns.\n(Choice A) The credit cycle tends to peak prior to the onset of a recession and is often a precursor to the peak of the economic cycle. As the\nbusiness cycle slows/contracts, lending institutions often severely restrict credit availability while increasing the cost of credit.\n(Choice C) Credit cycles tend to amplify the duration and magnitude of the business cycle: when the economy is expanding (contracting),\ncreditors are more (less) willing to lend, so the supply of credit increases (decreases) and its price decreases (increases), accelerating the trend of\nthe business cycle.\nThings to remember:\nCredit cycles are a subset of financial cycles and describe the change in availability and pricing of private sector credit, which has direct\nimplications for the business cycle. Credit cycles are procyclical since credit availability expands during economic expansions and contracts\nsharply during economic downturns.\nDescribe credit cycles", "qhtml": null}, {"n": 35, "q": "If an economy is in the early expansion phase of the business cycle, this most likely indicates that:", "opts": ["both inventory-to-sales ratios and labor utilization are increasing.", "both inventory-to-sales ratios and labor utilization are decreasing.", "inventory-to-sales ratios are decreasing, and labor utilization is increasing."], "ans": "C", "expl": "Business cycle impact on inventory-to-sales ratios and labor utilization\nInventory-to-sales ratio Labor utilization\nDecreases Increases\nEarly expansion\nProduction ramp-up lags sales growth Existing labor force used to meet demand; additional hiring postponed\nIncreases Decreases\nContraction\nProduction cuts lag sales decline Minimum employment level to maintain operations\nEconomies experience business cycle phases of expansion, peak, and contraction (ie, recession). Expansions are divided into early (ie, recovery)\nand late phases. Both the inventory-to-sales ratio and labor utilization rates are sensitive to stages of the business cycle, and changes in these\nareas often lag an economy's move from one phase to another.\nThe inventory-to-sales ratio measures the inventory available for sale relative to the level of sales. In the early phase of an expansion, as\nconsumer spending and sales begin to increase, companies may hold off on increasing production out of concern that the expansion is not yet\nunderway. This lag means that the rate of increase in sales typically outpaces the rate of increase in inventory, and the inventory-to-sales\nratio declines. During or soon after a peak, the inventory-to-sales ratio tends to increase as production cutbacks lag the slowdown in sales\n(Choice A).\nLabor utilization refers to how companies manage workforce productivity through hiring and firing practices. Companies tend to retain a certain\nworkforce strength during a downturn, even if not fully utilized. In the early expansion phase of the business cycle, companies meet increased\nproduct demand primarily by more fully utilizing the existing workforce and tend to postpone new hiring until later in the recovery (Choice B).\nThings to remember:\nIn the early expansion phase of the business cycle, the inventory-to-sales ratio tends to decline as production fails to keep pace with increased\nsales demand. Labor utilization increases as companies more fully utilize workers who were retained during the downturn.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 36, "q": "An economic diffusion index is most appropriately used to identify:", "opts": ["trend change.", "rate of change.", "magnitude of change."], "ans": "A", "expl": "A diffusion index measures the dispersion of change among its components by calculating the proportion of components that are increasing\nor decreasing in a period. Diffusion indexes are often used in economics to identify trends (ie, consecutive changes in the same direction) and\npotential turning points for metrics such as new orders, pricing, and employment. An index is usually based at 50 or zero, at which point activity is\ndeemed to be roughly unchanged from the prior period, with higher (or lower) values indicating increasing (or decreasing) levels of activity.\nFor example, one widely followed diffusion index is a monthly purchasing manager index (PMI). To create this index, national surveys are\nconducted in many countries to ask manufacturing and service purchasing managers about the current state of business in their organizations.\nThe new orders component of these surveys is considered a leading indicator; a reading above (or below) 50 indicates more firms are reporting\nimprovement (or deterioration) in orders compared to the previous month.\n(Choices B and C) Diffusion indexes capture trends (ie, direction of change), not the magnitude (ie, size) or rate (ie, speed) of change.\nThings to remember:\nA diffusion index measures the dispersion of change among components by calculating the proportion of components that are increasing or\ndecreasing in a period. Diffusion indexes capture trends, not magnitude or rates of change.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 37, "q": "If an economy has stabilized GDP growth and moderate inflation, it is most likely in which of the following phases of the business cycle?", "opts": ["Peak", "Contraction", "Early expansion"], "ans": "C", "expl": "Economies experience three business cycle phases: expansion, peak, and contraction (ie, recession). Expansion is divided into the early (ie,\nrecovery) and late phases. The length of a full cycle, or any phase of the cycle, is unpredictable. However, each phase is associated with certain\ncharacteristics regarding GDP growth and inflation.\nThe early phase of expansion occurs after the end of contraction. Characteristics of this phase include:\nBusinesses begin to recover and build up inventories.\nGDP moves from negative to positive (with moderate growth).\nConsumers start spending more, particularly on housing and durable goods.\nCentral banks tend to keep interest rates low to spur the economy.\nInflation tends to lag other variables; therefore, it is moderate in growth and may continue to fall. Inflation catches up to economic growth\nduring the later expansion phase.\nUnemployment levels decline but remain high because employers tend to halt layoffs but are slow to hire additional staff.\n(Choice A) During the peak phase, the GDP growth rate decelerates, possibly as a result of the shock to the economy or restrictive policies put in\nplace during expansion. Inflation tends to accelerate, which is a lagged reaction to the rising wages and input prices during the late expansion\nphase.\n(Choice B) Contraction is defined by negative GDP growth (ie, declining economic output) and is usually accompanied by a falling rate of\ninflation, which typically lags the decline in GDP.\nThings to remember:\nThe phases of the business cycle are expansion, peak, and contraction (ie, recession). Expansion is divided into the early and late phases. The\nearly phase of expansion occurs after the end of contraction. GDP moves from negative to positive, although it is moderate in growth. Inflation\ntends to be moderate in growth and may continue to fall.\nDescribe the business cycle and its phases", "qhtml": null}, {"n": 38, "q": "The business cycle phase typically characterized by decelerating GDP growth and accelerating inflation is most likely a:", "opts": ["peak.", "contraction.", "late expansion."], "ans": "A", "expl": "The phases of the business cycle are expansion, peak, contraction (ie, recession), and trough. Expansions are divided into early (ie, recovery)\nand late phases. The length of a cycle or any phase is not predictable. However, each type of phase shares certain characteristics regarding\nGDP growth and inflation across cycles.\nPeaks occur after expansions have been ongoing for some time. There is often a lack of available labor and capital to fuel further growth. Most\nwho want to work have already found employment; capacity utilization is likely quite high. The lack of resources to expand production results in a\ndeceleration of growth. At the same time, tight labor markets and lack of excess capacity result in wages and prices being bid up, leading to an\nacceleration of inflation.\n(Choice B) A contraction is defined by negative GDP growth (ie, declining economic output). This is usually accompanied by falling rates of\ninflation, although the inflation decline typically lags the decline in GDP.\n(Choice C) The late expansion phase is characterized by an acceleration of both growth and inflation above the moderate rates typical for each in\nthe early expansion phase.\nThings to remember:\nThe phases of the business cycle are expansion, peak, contraction (ie, recession), and trough. Peaks are usually characterized by a lack of\navailable labor and capital resulting in a deceleration of growth. Tight labor markets and lack of excess capacity often result in wages and prices\nbeing bid up, leading to an acceleration of inflation.\nDescribe the business cycle and its phases", "qhtml": null}, {"n": 39, "q": "The following table lists various economic indicators and the trend in each one over the past several months for an economy. Economic Indicator Trend Unemployment Record low Unit labor costs Modestly rising Industrial production growth Steadily higher Residential building permits Steady decline New orders for manufacturing Steady decline Long-term bond yields Declined 1% Short-term bond yields Stable This mix of economic indicators most likely forecasts near-term future economic:", "opts": ["stability.", "acceleration.", "deceleration."], "ans": "C", "expl": "Certain economic and financial measures have historically exhibited consistent patterns indicating the stage of the business cycle. These\neconomic indicators are characterized as leading, coincident, or lagging indicators.\nLeading indicators provide the most value to investment practitioners since they signal changes in real GDP several months to a year in\nadvance. Coincident indicators move largely in tandem with the economy, and lagging indicators trail changes in the economy by several months\nor quarters. How specific indicators are classified will vary from country to country, but leading indicators that are consistent across most\neconomies include:\nInterest rate spread\nResidential building permits/construction\nStock market performance\nNew manufacturing/machinery orders\nBusiness confidence/expectations\nIn this scenario, all three leading indicators are indicating a period of economic deceleration or slowing growth in the coming quarters.\nResidential building permits and new orders for manufacturing have been in steady decline. The interest rate spread is the difference\nbetween short-term rates and long-term rates. A narrowing of the spread, as is the case here (ie, the yield curve flattened by 1%), implies\neconomic deceleration.\nThings to remember:\nLeading indicators provide the most value to investment practitioners since they signal changes in real GDP several months to a year in advance.\nResidential building permits, new orders for manufacturing, and interest rate spread are all leading indicators.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators\n10.After a prolonged recession, a developed economy has experienced several quarters of rapid GDP growth and strong increases in average\nhourly earnings. The most likely impacts on housing sector activity and an existing trade deficit are that:\n\nA. both increase.\nB. both decrease.\nC. housing sector activity increases and the trade deficit decreases.\nExplanation\nRapid GDP growth after a prolonged recession implies an economy in the early expansion phase of the business cycle. The housing and external\ntrade sectors are sensitive to business cycle changes.\nHousing sector activity, such as existing home sales and new construction, is sensitive to affordability (ie, housing prices versus income). In the\nearly expansion phase, home prices are relatively low, a carryover from the preceding contraction. Low home prices, in addition to rising\nincomes due to the expansion, drive demand. Consumers reinforce the effect by buying in anticipation of housing appreciation fueled by a\nstrengthening economy.\nTrade deficits occur when imports exceed exports. Imports are directly related to domestic income (ie, GDP). As incomes rise, demand\nincreases, which consequently increases the purchasing of domestic products and foreign goods (ie, increased imports). Domestic exports are a\nfunction of income in foreign countries; therefore, the state of the domestic business cycle has no direct impact on a country's exports. The\nresult is an increase in the trade deficit.\nThings to remember:\nBoth housing sector activity and trade deficits are likely to increase during the early expansion phase. Housing sector activity improves due to\nimproved affordability (ie, relatively low prices and rising incomes) and anticipated housing appreciation. The trade deficit worsens since rising\ndomestic income leads to increased imports.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 40, "q": "After a prolonged recession, a developed economy has experienced several quarters of rapid GDP growth and strong increases in average hourly earnings. The most likely impacts on housing sector activity and an existing trade deficit are that: ", "opts": ["both increase.", "both decrease.", "housing sector activity increases and the trade deficit decreases."], "ans": "A", "expl": "Rapid GDP growth after a prolonged recession implies an economy in the early expansion phase of the business cycle. The housing and external\ntrade sectors are sensitive to business cycle changes.\nHousing sector activity, such as existing home sales and new construction, is sensitive to affordability (ie, housing prices versus income). In the\nearly expansion phase, home prices are relatively low, a carryover from the preceding contraction. Low home prices, in addition to rising\nincomes due to the expansion, drive demand. Consumers reinforce the effect by buying in anticipation of housing appreciation fueled by a\nstrengthening economy.\nTrade deficits occur when imports exceed exports. Imports are directly related to domestic income (ie, GDP). As incomes rise, demand\nincreases, which consequently increases the purchasing of domestic products and foreign goods (ie, increased imports). Domestic exports are a\nfunction of income in foreign countries; therefore, the state of the domestic business cycle has no direct impact on a country's exports. The\nresult is an increase in the trade deficit.\nThings to remember:\nBoth housing sector activity and trade deficits are likely to increase during the early expansion phase. Housing sector activity improves due to\nimproved affordability (ie, relatively low prices and rising incomes) and anticipated housing appreciation. The trade deficit worsens since rising\ndomestic income leads to increased imports.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 41, "q": "An economy has been experiencing decelerating GDP growth rates for several quarters. In the past quarter, short-term interest rates moved above long-term interest rates and initial claims for unemployment insurance increased more rapidly. Based on these indicators, the most appropriate forecast for the future of the economy is:", "opts": ["further deceleration of growth, possibly leading to a recession.", "a reversal of recent trends resulting in an acceleration of GDP growth.", "difficult to predict due to the conflicting evidence reflected in the indicators"], "ans": "A", "expl": "Economic indicators\nType Turning point relative to economy Examples\nInitial unemployment claims\nStock market indexes\nLeading Several months to a year ahead\nConsumer expectations\nShort/long-term interest rate spread\nReal personal income\nIndustrial production indexes\nCoincident Within a few months before or after\nNonagricultural payroll\nManufacturing and trade sales\nAverage duration of unemployment\nInventory-sales ratio\nLagging Several months to a quarter behind\nBank prime lending rate\nChange in unit labor costs\nVarious statistics drawn from the real economy and the financial markets have historically exhibited stable patterns of change relative to turns in\nthe business cycle. These economic indicators are characterized as leading, coincident, or lagging indicators.\nLeading indicators signal economic change several months to a year in advance of a change in real GDP growth rates. Coincident indicators\nmove largely in tandem with the economy. Lagging indicators trail changes in the economy by several months or quarters.\nThe spread between short-term (eg, three-month government security) and long-term (eg, ten-year government bond) interest rates as well as\ninitial claims for unemployment insurance are leading indicators. A narrowing of the spread of long-term over short-term rates and increases\nin new applications for unemployment compensation usually foreshadow a weakening economy. Changes in the opposite direction forecast\neconomic strengthening.\nIn this case, both indicators are exhibiting negative signals. Before the specified changes occurred, the indicators had been consistent with a\nweakening economy, and both have become even more negative. Initial unemployment claims have increased more rapidly. The spread between\nshort-term and long-term rates must have previously narrowed since it has recently inverted. Both indicators signify an economy going from bad\nto worse.\nBased on the information about the indicators, the most appropriate forecast is for further slowing of growth, if not an outright contraction of\neconomic activity (ie, a recession).\nThings to remember:\nChanges in leading indicators precede changes in the direction of the economy. The spread between short- and long-term rates and new\napplications for unemployment insurance are leading indicators. A narrower spread or an increase in unemployment applications usually precedes\neconomic weakening.\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 42, "q": "As an economy moves from an expansion to a contraction phase of the business cycle, which of the following indicators is most likely the last to signal a turn in the business cycle? ", "opts": ["Average duration of unemployment", "Average weekly hours in manufacturing", "Building permits for new private housing units"], "ans": "A", "expl": "Economic indicators\nType Turning point relative to economy Examples\nInitial unemployment claims\nStock market indexes\nLeading Several months to a year ahead\nConsumer expectations\nShort/long-term interest rate spread\nReal personal income\nIndustrial production indexes\nCoincident Within a few months before or after\nNonagricultural payroll\nManufacturing and trade sales\nAverage duration of unemployment\nInventory-sales ratio\nLagging Several months to a quarter behind\nBank prime lending rate\nChange in unit labor costs\nEconomic indicators help provide insight on the overall state of the economy and are classified as either leading, coincident, or lagging indicators.\nLagging indicators tend to reflect economic conditions of the previous few months or quarters. Given previous worsening of the leading and\ncoincident indicators, a worsening of the lagging indicators confirms a business cycle has peaked and is in a contractionary phase.\nAverage duration of unemployment is a lagging indicator since businesses hesitate to lay off workers due to the high costs of training and low\nproductivity of new employees. Therefore, businesses typically wait several months to confirm the recession has truly started before laying off\nworkers. Likewise, when the economy first appears to be coming out of a recession, businesses defer hiring until a recovery is confirmed by\nseveral months or quarters of rising GDP.\n(Choice B) Average weekly hours in manufacturing usually decline before a contraction begins since businesses initially reduce overtime rather\nthan laying off workers when the economy slows. Likewise, companies increase overtime before rehiring workers when a recovery begins.\nAverage weekly hours is a leading indicator.\n(Choice C) Most governments require building permits prior to construction. Since developers plan construction projects long in advance,\nbuilding permits is a leading indicator.\nThings to remember:\nLagging indicators tend to reflect economic conditions of the previous few months or quarters and are interpreted as confirming signals previously\ngiven by leading and coincident indicators. Average duration of unemployment is a lagging indicator since businesses are slow to fire (hire)\nemployees until seeing confirmation of a contraction (expansion).\nDescribe how resource use, consumer and business activity, housing sector activity, and external trade sector activity vary over the business\ncycle and describe their measurement using economic indicators", "qhtml": null}, {"n": 43, "q": "Which of the following is most likely a long-run objective of fiscal policy?", "opts": ["Stabilize GDP growth rates", "Maximize growth and minimize unemployment", "Minimize the amount of government borrowing"], "ans": "A", "expl": "The general goal of fiscal policy (ie, government spending and taxes) is maximizing overall welfare. Specific policies are often designed to aid\ndisadvantaged population groups (eg, disabled or low-income populations) or help specific sectors (eg, infant or strategic industries). Those goals\nare more easily attained when an economy is growing at its potential.\nConsequently, the most significant fiscal policies are designed to stabilize output near an economy's sustainable GDP growth rate. At that level\nof output, income growth and employment are at the highest levels that can be maintained without creating inflationary pressure. Growth above\nthat level is countered with contractionary policies to stifle inflation. Growth below potential is addressed by fiscal stimulus to prevent excessive\nunemployment.\n(Choice B) Expansionary fiscal policies could enable an economy to grow above its sustainable rate in the short run, at the cost of rising\ninflation. The long-run result is likely slower growth and higher unemployment.\n(Choice C) Although less indebtedness is preferable, the amount of government borrowing is much less important than GDP growth and\nunemployment rate targets. Also, many economists believe government deficits and debt have little impact on GDP growth.\nThings to remember:\nThe broad goal of fiscal policy is maximizing general welfare. Policies are usually designed to stabilize an economy at levels of output near its\nsustainable GDP growth rate. Growth exceeding that level is countered with contractionary policies to stifle inflation. Growth below potential is\naddressed by fiscal stimulus.\nDescribe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative to GDP matters", "qhtml": null}, {"n": 44, "q": "An economy is experiencing a recession and rising rates of unemployment. If income tax cuts are used to stimulate more rapid GDP growth, which of the following factors is most likely to impede the effectiveness of that fiscal policy? ", "opts": ["Consumers may decide to increase savings.", "Businesses may not be able to increase output to meet rising demand.", "Government spending will be reduced to offset the decline in tax revenues."], "ans": "A", "expl": "It is often difficult to predict the private sector's reaction to government economic policy actions. In weak economies, the expansionary impact of\nincome tax cuts may be significantly dampened by consumers' decisions against spending the additional after-tax income. Consumers may\nincrease savings instead, either to cushion the impact of an ongoing recession or to pay for expected future tax increases.\n(Choice B) In a recession, the business sector is operating well below full capacity. Consequently, any increase in demand could be met by\nincreasing output.\n(Choice C) Unless operating under a balanced budget constraint, governments would not have to reduce spending to offset the loss of revenue\nfrom cutting income tax rates.\nThings to remember:\nIncome tax cuts may not result in economic growth. Consumers may increase savings due to fears of an ongoing recession or to pay for expected\nfuture tax increases.\nExplain the implementation of fiscal policy and difficulties of implementation as well as whether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 45, "q": "Which of the following is most likely to be considered a type of indirect tax?", "opts": ["Taxes on corporate profits", "Inheritance taxes on estates", "Excise taxes on sales of fuel"], "ans": "C", "expl": "Categories of taxes\nDirect Indirect\nIncome: wages, interest, business profits, capital\nSales of goods or services: sales, value-added (VAT),\nTax on gains\nexcise\nWealth: real estate, inheritances\nPaid by Recipient/holder Buyer\nCollected\nRecipient/holder Seller\nfrom\nFiscal policy is the use of government spending and taxation to influence economic activity. Governments impose taxes primarily to raise\nrevenue to fund operations and repay debt, although tax policy can also be used to encourage or discourage certain consumer and business\nbehaviors.\nIndirect taxes are taxes on spending for goods or services. The tax may apply to the full price of a product (eg, sales tax) or to only a portion of\nthe product's value (eg, value-added tax). Such taxes are described as indirect since, although the tax is effectively paid by the buyer (as part of\nthe purchase cost), the tax is collected by the product seller, who then pays it to the government. A sales tax applies generally to all products\n(with specified exemptions); an excise tax is applied only to a specific product (eg, fuel, tobacco).\nOne way to view the distinction between direct and indirect taxes is that a collector of indirect tax, such as a gas station, collects the excise tax on\ngasoline from consumers and remits it to the government. A direct tax, such as an income tax on the gas station's profits, is assessed against the\nstation and is not passed along to the station's customers.\n(Choices A and B) Both taxes on corporate profits (a type of income tax) and inheritance taxes (a type of wealth tax) are direct taxes. Direct\ntaxes are paid directly to the government by the beneficiary of the item being taxed.\nThings to remember:\nIndirect taxes are taxes on spending for goods or services. An indirect tax is effectively paid by the buyer but collected by the product seller, who\nthen pays it to the government. A sales tax is generally applied to all products; an excise tax is applied only to specific products such as fuel or\ntobacco.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 46, "q": "A country with an independent central bank experiences an unanticipated recession and responds with an expansionary monetary policy rather than a discretionary fiscal policy. Which of the following is the best rationale for the country's response? ", "opts": ["Monetary policy can be implemented more rapidly.", "Monetary policy is more powerful than fiscal policy.", "Fiscal policy is ineffective at stimulating economic activity."], "ans": "A", "expl": "Recognition lags, action lags, and impact lags impede successful management of economic cycles. The first of these (ie, recognition lag) results\nfrom not recognizing the need to act, which may delay both monetary and fiscal policy actions.\nHowever, monetary policy (eg, reducing interest rates) can usually be implemented more rapidly and can affect the economy more immediately\nthan fiscal policy (eg, infrastructure spending). Central banks can implement monetary policy changes within days of deciding to act, and the\nchanges begin affecting the economy fairly quickly.\nIn contrast, even when governments have discretionary spending authority, well-designed fiscal stimulus programs can take many months to plan.\nWhen significant changes in government spending or taxes require legislative approval, action and impact lags often result in prolonged delays\nbefore the new policies affect the economy.\n(Choice B) Both monetary and fiscal policy actions can have a substantial impact on an economy. The impact depends on the magnitude of the\npolicy action. No consensus exists regarding which is more powerful.\n(Choice C) Increases in government spending or reductions in taxes (ie, expansionary fiscal policy) are usually very effective at stimulating higher\nlevels of GDP.\nThings to remember:\nRecognition, action, and impact lags impede successful economic management. Both monetary and fiscal policy actions can be delayed if the\nneed to act is not recognized. Since monetary policy usually has shorter action and impact lags, it is more frequently used to offset unexpected\neconomic fluctuation.\nCompare monetary and fiscal policy", "qhtml": null}, {"n": 47, "q": "An extended period of GDP growth causes a country's budget balance to change from a slight deficit to a substantial surplus. Due to the budget surplus, the impact of fiscal policy on the future course of the economy is most likely:", "opts": ["neutral.", "expansionary.", "contractionary."], "ans": "C", "expl": "Government spending and taxation are the tools of fiscal policy. As the largest economic agent in most economies, the balance between\ngovernment expenditures and tax revenues has a substantial impact. Changes in the net budget balance are often more significant for the near-\nterm direction of the economy than the absolute levels of spending or revenues.\nA shift in the net budget balance from deficit to surplus results from tax revenues rising more rapidly than increases in government expenditures\ndue to past GDP growth. A current surplus represents a withdrawal of spending power from the economy by the government. Reduced\nspending results in a GDP lower than it otherwise would have been, which is why a budget surplus is viewed as having a contractionary impact\n(Choices A and B).\nThings to remember:\nA budget surplus represents a withdrawal of money from the economy by the government. As a result, there is less spending by consumers and\nbusinesses than otherwise would have occurred. The direct result of a budget surplus is slower GDP growth, so its impact is contractionary.\nExplain the implementation of fiscal policy and difficulties of implementation as well as whether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 48, "q": "Which of the following statements is most likely an appropriate description of indirect taxes? When used as a fiscal policy tool, in the short run indirect taxes:", "opts": ["are difficult to implement.", "have little impact on spending behavior.", "generate tax revenue at little cost to the government."], "ans": "C", "expl": "Categories of taxes\nDirect Indirect\nIncome: wages, interest, business profits, capital\nSales of goods or services: sales, value-added (VAT),\nTax on gains\nexcise\nWealth: real estate, inheritances\nPaid by Recipient/holder Buyer\nCollected\nRecipient/holder Seller\nfrom\nFiscal policy (ie, taxes and government spending) is implemented to optimize or improve economic factors such as GDP growth, wealth\ndistribution, and allocation of resources. Tax revenues are the primary source of financing for government expenditures and can be used as a\ntool of fiscal policy implementation, for example, by encouraging (discouraging) consumer spending.\nThe primary advantages of using indirect taxes as a tool of fiscal policy is that they:\nare easy to implement,\naffect spending behavior immediately (buyers' costs change as tax rates change), and\nimpose little or no cost on the government (collection costs are borne by the seller).\n(Choice A) Indirect taxes are collected by product sellers that can easily adjust their systems (eg, cash registers) so that a higher tax rate is\nreflected in the gross selling price. Direct taxes often require much longer to implement since systems for collecting withholding taxes from\nemployees and estimated taxes from businesses must be reprogrammed to reflect the new tax and withholding rates.\n(Choice B) Indirect taxes usually have an immediate effect on consumers' spending behavior.\nThings to remember:\nTaxation is a fiscal policy tool and taxes are categorized as direct or indirect. The primary advantages of indirect taxes as a tool of fiscal policy are\nthat they are easy to implement, affect spending behavior immediately, and increase tax revenues while imposing little or no cost on the\ngovernment.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 49, "q": "Which of the following statements best describes a disadvantage of using fiscal policy as a short-run economic tool?", "opts": ["Indirect taxes are difficult to implement and have a delayed impact.", "Capital spending plans take a long time to formulate and implement.", "Direct taxes have very small expectational effects and long lead times."], "ans": "B", "expl": "Fiscal policy vs. short-run cyclical fluctuations\nPolicy tool Examples Issues\nSales\nIndirect taxes Easily enacted, affect behavior and government revenues quickly\nExcise\nAdvantages\nTaxes\nSocial policy Adjustments can almost instantly encourage or discourage behavior\nSubsidies\nIndividual income\nDirect taxes Requires significant notice to update computerized systems\nCorporate profits\nDisadvantages\nHighways\nCapital spending Lengthy lead times needed to formulate and implement\nSchools\nFiscal policy (ie, government spending and taxes) attempts to maximize overall welfare by stabilizing output near an economy's sustainable GDP\ngrowth rate. At that level of output, income growth and employment are at the highest levels that can be maintained without creating inflationary\npressure:\nGrowth above that level may be countered with contractionary policies to stifle inflation.\nGrowth below that level may be addressed by fiscal stimulus to prevent excessive unemployment.\nGovernment capital spending on infrastructure (eg, bridges, airports) provides strong stimulus to output and can increase the sustainable GDP\ngrowth rate. However, effective capital spending plans can take years to formulate and implement and, therefore, may have little effect on the\neconomy in the short run.\n(Choice A) Indirect taxes are easy to implement and affect consumer and business behavior and government revenues immediately. These are\nadvantages of using this short-run tool.\n(Choice C) Direct taxes (eg, individual income taxes) can take a long time to change but have powerful effects on economic activity. The impact\nof direct taxes is felt well before their implementation, with powerful expectational impacts occurring as soon as the new tax rates are announced.\nThings to remember:\nFiscal policy attempts to stabilize output near an economy's sustainable GDP growth rate. Expansionary or contractionary fiscal policy is pursued\nwhen GDP diverges from the economy's potential. Government capital spending plans can take years to formulate and implement and, therefore,\nmay have little effect on the economy in the short run.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 50, "q": "An economist states: \"Fiscal deficits and tax cuts have no net effect on the economy since the private sector offsets these policy actions by increasing savings to pay for future tax increases.\" The economist's statement best reflects which of the following?", "opts": ["Fisher effect", "Money neutrality", "Ricardian equivalence"], "ans": "C", "expl": "Ricardian equivalence\nFiscal deficits have no net effect on the economy.\nGovernment's choice is essentially to tax now or to tax in the future.\nPrivate sector increases savings by an amount equal to the deficit to pay future taxes.\nFiscal deficits have little effect on private consumption and investment decisions.\nPolicymakers should favor monetary policy tools over fiscal deficits.\nRicardian equivalence is an economic theory suggesting that fiscal deficits and tax cuts have no net effect on the economy. According to\nthis theory, the private sector reacts to these fiscal policy actions by increasing savings to pay for inevitable future tax increases; this reaction\nleaves national savings (ie, the sum of all public and private savings) unchanged.\nFor example, a government enacts a tax cut to stimulate the economy but needs to borrow an equivalent amount to cover current spending.\nAccording to the Ricardian equivalence theory, these actions would have no net effect on the economy since the private sector would increase its\nsavings by an amount equal to the tax cut to ensure there would be enough to repay the debt in the future. Thus, there would be no change in\nincome available for consumption and no change to aggregate demand.\n(Choice A) The Fisher effect theorizes that real (ie, inflation-adjusted) interest rates are stable. It is not a theory about reaction to fiscal policies.\n(Choice B) Money neutrality refers to the idea that in the long run, an increase in the money supply only affects nominal price factors (eg, wages,\nexchange rates) and has no impact on real variables such as production and employment.\nThings to remember:\nRicardian equivalence is an economic theory that suggests fiscal deficits and tax cuts have no net effect on the economy. According to this theory,\nthe private sector reacts to these fiscal policy actions by increasing savings to pay for inevitable future tax increases, and this reaction leaves\nnational savings unchanged.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 51, "q": "Country A is a small country, with very low per capita GDP, running a large fiscal deficit. The government has substantially increased its debt burden over the last 10 years, and, as a result, investment flowing into the private sector has declined. This situation best describes:", "opts": ["the Fisher effect.", "Ricardian equivalence.", "the crowding out effect."], "ans": "C", "expl": "The crowding out effect refers to the idea that too much government borrowing may divert savings away from private investment. The\ncrowding out effect assumes:\nA finite amount of savings is to be used for investment.\nAn increasing supply of government debt (ie, increasing demand for funds from savings) raises the cost of borrowing for all market\nparticipants.\nCrowding out occurs over the long run (ie, more than a few years).\nThe concept is based on the notion that government borrowing absorbs capital that could otherwise be used for private investment. Thus, private\ninvestment is displaced and becomes more expensive (ie, higher borrowing costs), leading to suboptimal economic allocations and slower\ngrowth over the long run.\n(Choice A) The Fisher effect does not address private sector investment and the supply/demand dynamic of government debt. The Fisher effect\nposits that real (ie, inflation-adjusted) interest rates are stable and that fluctuations in nominal interest rates are primarily a function of changes in\ninflation expectations.\n(Choice B) Ricardian equivalence suggests that fiscal deficits and tax cuts have no net effect on the economy. According to this theory, the\nprivate sector reacts to these fiscal policy actions by increasing savings to pay for inevitable future tax increases, suggesting that consumer\nexpenditures will decrease as savings increase.\nThings to remember:\nThe crowding out concept refers to the idea that too much government borrowing may divert savings away from private investment. Private\ninvestment is displaced and becomes more expensive, leading to suboptimal economic allocations and slower growth over the long run.\nDescribe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative to GDP matters", "qhtml": null}, {"n": 52, "q": "Which of the following most likely limits the effectiveness of fiscal policy in stabilizing aggregate demand? The government's inability to:", "opts": ["run a budget deficit large enough to stimulate the economy.", "slow an overheated economy by reducing government spending.", "borrow during recessions due to investor preference for corporate debt."], "ans": "A", "expl": "Macroeconomic issues that inhibit effective fiscal policy\nUnemployment/inflation Higher employment increases inflation, so policies to\ntradeoff lower inflation create more unemployment\nMarkets limit access to and/or increase cost of debt,\nBudget deficit limits\npreventing adequate stimulus spending\nDifficult to determine accurately since expansionary\nFull-employment GDP policy for an economy at full employment creates\ninflation without increasing growth\nShortages of labor or capital prevent expansionary\nFactor constraints policy from increasing growth and may result in higher\ninflation\nGovernment borrowing displaces private sector\nCrowding out borrowing, so reduced private spending offsets\nincreases in government spending\nStabilizing aggregate demand is a primary objective of fiscal policy. Adjustments to spending and tax rates are the main fiscal policy tools\ngovernments use. A variety of factors can impede their success:\nRecognition, action, and impact lags\nMacroeconomic issues\nUncertainty as to:\nthe future of the economy and\nthe reaction of the private sector to policy actions\nGovernment budgets are likely to already be operating at a deficit during a recession. Financial market reaction (ie, higher interest rates) or\npolitical pressure may prevent a government from increasing the deficit by increased spending or lower tax rates. In that case, the government\nmay be unable to run a deficit large enough to stabilize aggregate demand and stimulate economic recovery.\n(Choice B) Government spending is a significant contributor to GDP, so reductions in spending result in lowering GDP. If the political will exists,\ngovernment spending can be cut to slow an economy's rate of growth.\n(Choice C) As the most creditworthy borrower in an economy, a government usually is able to issue debt, even during recessions. However,\nexcessive borrowing may increase interest rates and/or crowd out (displace) private borrowers.\nThings to remember:\nThe primary objective of fiscal policy is to stabilize aggregate demand. During recessions, governments may not be able to run large enough\ndeficits to provide adequate stimulus to create economic growth.\nExplain the implementation of fiscal policy and difficulties of implementation as well as whether a fiscal policy is expansionary or contractionary", "qhtml": null}, {"n": 53, "q": "As opposed to fiscal policy, monetary policy is used to:", "opts": ["maintain price stability.", "raise revenue through taxation.", "determine the level of government spending."], "ans": "A", "expl": "Monetary policy tools Fiscal policy tools\nSet reserve requirements\nSet tax rates\nSet short-term interest rates\nSet levels of government spending\nManage foreign exchange and gold reserves\nMonetary policy refers to activities directed by central banks to promote stable economic growth. Price stability is one of the components of\nstable growth. Central banks attempt to achieve stability by influencing money supply levels with tools such as the following:\nRequiring banks to maintain reserves with the central bank to meet customers' withdrawal demands\nSetting targets for short-term interest rates and using open market operations to achieve interest rate targets\nManaging foreign currency and gold reserves by buying/selling as needed to maintain liquidity and national currency.\n(Choices B and C) Fiscal policy applications optimize economic activity without creating inflationary pressure. Governments set tax and\nspending levels to achieve their goals and support economic growth.\nThings to remember:\nMonetary policy refers to activities directed by central banks to promote stable economic growth. Price stability is one of the components of stable\ngrowth. Fiscal policy refers to government taxation and spending policies.\nCompare monetary and fiscal policy", "qhtml": null}, {"n": 54, "q": "Governments have numerous fiscal policy tools at their disposal. Which of the following statements best describes an advantage of using a specific fiscal policy tool? ", "opts": ["Indirect taxes can be adjusted quickly.", "Direct taxes can target certain products to modify consumer behavior.", "Capital spending programs are one of the fastest ways to provide fiscal stimulus."], "ans": "A", "expl": "Government tax types\nDescription Advantages Disadvantages\nLong lead time to change\nApplies to income, wealth, and corporate Ease of collection\nDirect Potential disincentives if taxes are too\nprofits Progressive in nature\nhigh\nQuickly adjustable\nRegressive tax\nIndirect Applies to spending on goods and services Can be used to modify social\nPotentially costly to collect\nbehavior\nFiscal policy broadly describes the policies around government revenues and expenditures. For most economies, taxes provide the revenues that\nfund the government's operations and programs (ie, expenditures). If taxes do not provide the required revenues, debt is often issued to make up\nthe difference. Taxes can be classified into two broad categories:\nDirect taxes are imposed on wealth and income, such as an income, inheritance, and capital gains taxes.\nIndirect taxes are transaction-based and apply to the purchase or sale of goods and services.\nExamples of indirect taxes include sales and value-added taxes (VAT). Indirect taxes can be adjusted quickly and used to influence certain\nsocial behaviors, such as a tax on alcohol, tobacco, or fossil fuels.\n(Choice B) Changes to direct taxes require a relatively long lead time since they require a change to the tax code. Adjustments to payroll\nsystems and other similar tax schedules tied to income can be quite cumbersome and time-consuming to adjust.\n(Choice C) Capital spending programs are government expenditures that take considerable time to plan and implement. For example, the life\ncycle of large-scale road construction or improvements is often measured in years.\nThings to remember:\nIndirect taxes are transaction-based and apply to the purchase or sale of goods and services. Indirect taxes can be adjusted quickly and used to\ninfluence certain social behaviors, such as a tax on alcohol, tobacco, or fossil fuels.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 55, "q": "The advantage of automatic stabilizers over discretionary fiscal policy is that they most likely:", "opts": ["affect real GDP growth rates more rapidly.", "have a greater impact on GDP per unit of fiscal expenditure.", "can be more precisely calibrated to achieve the desired impact."], "ans": "A", "expl": "Discretionary fiscal policies (ie, government spending and taxes) require specific actions (eg, legislation) to be implemented. However,\nvarious lags impede the effectiveness of discretionary fiscal policy. In contrast, automatic stabilizers are programs already in place that are\ntriggered by changes in economic activity, so they are not subject to these lags. Automatic stabilizers steady the economy by their\ncountercyclical nature. Examples of automatic stabilizers include:\nUnemployment benefits: Unemployment increases as economies weaken, so government spending on these programs increases. The\nreverse occurs when economies strengthen.\nProgressive income tax: Incomes rise as economies strengthen, placing more workers in higher tax brackets, resulting in less spending\nrelative to income. The reverse occurs when economies weaken.\n(Choice B) The economic impact on GDP per unit of fiscal expenditure is not determined by whether it results from automatic stabilizers or\ndiscretionary policy. The impact depends on the timing and the change in spending or tax revenues.\n(Choice C) Discretionary fiscal policy can achieve very specific changes in government spending or tax rates. The impact of automatic\nstabilizers, however, cannot be precisely quantified because spending and tax revenue changes depend on the level of economic activity, which\ncannot be accurately predicted.\nThings to remember:\nA variety of lags impede the success of discretionary fiscal policy. There are often long delays before changes in government spending or taxes\nimpact the economy. In contrast, automatic stabilizers result in changes to government spending and tax revenues triggered by changes in\neconomic activity, providing the desired countercyclical impact.\nDescribe tools of fiscal policy, including their advantages and disadvantages", "qhtml": null}, {"n": 56, "q": "Which of the following is the most appropriate argument in support of larger government budget deficits during a recession, despite high levels of government debt relative to GDP?", "opts": ["Higher taxes can be imposed to pay the debt.", "Increased debt can result in the utilization of idle resources.", "Governments can borrow at lower rates than businesses or consumers."], "ans": "B", "expl": "Government debt reflects a government's cumulative budget deficits (ie, shortfalls of revenues versus expenditures). Economists disagree about\nthe significance of high levels of government debt relative to GDP. Those who favor increasing already high levels of debt argue that budget\ndeficits may generate economic growth if there are underutilized resources.\nIn recessions, the unemployment rate is relatively high and capacity utilization is low. Increases in government debt resulting from tax cuts or\nspending increases do not necessarily divert resources from productive uses. Therefore, a budget deficit can result in higher levels of\nemployment and GDP growth.\n(Choice A) Raising taxes to repay debt may be a disincentive to economic activity. Higher tax rates may reduce the incentive to work and invest,\nleading to lower growth in the long run.\n(Choice C) Governments can usually borrow at lower rates than businesses or consumers. However, this may crowd out other borrowers and\nlead to higher interest rates on the smaller pool of capital for private borrowers.\nThings to remember:\nIncreases in government debt may generate economic growth if there are underutilized resources. In recessions, the unemployment rate is\nrelatively high and capacity utilization is low. So long as the increased debt does not divert resources from productive uses, it can result in higher\nlevels of employment and GDP growth.\nDescribe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative to GDP matters", "qhtml": null}, {"n": 57, "q": "An economist reads the following statement in a research article: \"If a country's national debt is financed by borrowing, the size of its national debt relative to GDP may not matter, in the long run.\" This statement is most likely supported if:", "opts": ["government borrowing discourages private borrowing.", "most of the debt is owed to the country's own citizens.", "the debt reduces incentives for consumers to increase savings."], "ans": "B", "expl": "Economists debate whether the size of a country's national debt relative to GDP matters. If the debt grows too large relative to GDP, it may\ncast doubt on the country's ability to pay its debts in the future (ie, solvency). Interest payments on the debt may burden the current budget. A\nlarge existing national debt may also hinder efforts at expansionary fiscal policy, which typically enlarges public debt. One factor that eases these\nconcerns is if most of a country's debt is owed internally to fellow citizens, as is currently the case in Japan and South Korea, for example.\n(Choice A) Too much government borrowing may discourage or \"crowd out\" private borrowing and investment, both by diverting capital from the\nprivate sector and by creating greater demand for capital that pushes up interest rates. This scenario would support the argument that the size of\nthe national debt relative to GDP does matter.\n(Choice C) Concerns about the size of government debt relative to GDP would be countered by increased consumer saving rates, particularly if\nconsumers increased saving rates in anticipation of supporting the higher debt. Adding, not reducing, incentives for consumers to save would be a\ncondition that would support this statement.\nThings to remember:\nEconomists debate whether the size of a country's national debt relative to GDP matters. If the debt grows too large relative to GDP, it may\nnegatively affect the country's economy. One factor that eases these concerns is if most of a country's debt is owed to its own citizens, as is the\ncase in Japan and South Korea, for example.\nDescribe roles and objectives of fiscal policy as well as arguments as to whether the size of a national debt relative to GDP matters", "qhtml": null}, {"n": 58, "q": "Open market purchases of government securities by a central bank are most likely:", "opts": ["neutral.", "expansionary.", "contractionary."], "ans": "B", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nOpen market operations (ie, buying or selling government securities) is the most frequently used monetary policy tool for most major central\nbanks. Central bank purchases of securities are an expansionary policy.\nCentral banks usually purchase securities from commercial banks or designated market makers. The immediate impact is an increase in bank\nreserves. Banks employ the additional reserves by making loans or investments, which results in an expansion of the money supply. As the\nmoney supply increases, the cost of borrowing (ie, interest rates) tends to fall.\nLower interest rates stimulate borrowing by consumers to buy houses, cars, appliances, and other major items. Lower rates also encourage\nbusinesses to invest because profit margins will be higher due to lowered interest expenses. Additionally, some projects not viable at the previous\nborrowing cost may now be profitable.\nThings to remember:\nOpen market purchases of securities are expansionary central bank policies that increase bank reserves. Added reserves usually result in a larger\nmoney supply, putting downward pressure on interest rates. Lower rates spur consumption and investment, causing the economy to expand.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 59, "q": "In an economy that operates under an exchange rate targeting policy, which of the following conditions is most likely?", "opts": ["The central bank is required to maintain a fixed policy interest rate.", "Monetary policy can focus on internal rather than external considerations.", "Target country inflation (deflation) is imported regardless of the effect on the domestic economy."], "ans": "C", "expl": "Monetary policy targets\nStated Long-run Country\npolicy target economic goal characteristics\nFixed rate or\nPrice stability leading to better long-\nInflation range for specified\nrun performance\nprice index\nLarger,\nOptimize across\nmore developed economies\nInterest multiple goals\nTarget adjusted over business cycle\nrates (employment,\nGDP growth)\nSmaller,\nExchange Fixed rate or range versus target Stability versus economies of major less developed\nrate currency trading partners with significant import/export\nsectors\nThe goal of monetary policy is to optimize economic welfare, although central banks are given a variety of policy targets intended to attain that\ngoal. Central banks may have:\nOne policy target (ie, single mandate) that guides all policy actions:\nA specific inflation target (eg, 2%) or a specified range\nAn exchange rate target, which is a fixed level or band of values versus a major currency (eg, EUR)\nMultiple policy targets that seek an optimal balance among potentially conflicting goals:\nHigh employment\nGDP growth\nStable prices\nStable exchange rate\nWhen a country uses exchange rate targeting, its policies are designed to maintain an exchange rate target (or range) with another currency,\nusually from a larger and/or more stable economy. As a result, if the target currency's economy experiences inflation or deflation, so does the\neconomy that targets it.\nIn this situation, since all policy actions must be aimed at maintaining the targeted currency exchange value, the targeting economy gives up\nmonetary policy independence. This may adversely affect both the targeting economy and its ability to address any adverse effects. For\nexample, exchange rate targeting may keep a central bank from exercising independent monetary policies based solely on domestic conditions,\nsuch as maintaining a fixed policy interest rate or adjusting monetary policy (Choices A and B).\nThings to remember:\nExchange rate targeting results in giving up monetary policy independence. Maintaining the target often means tolerating conditions that\nadversely affect the domestic economy.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 60, "q": "A developing economy has a target exchange rate for its currency. The inflation rate in the developing economy drops below the inflation rate in the target currency. Central bank action to defend the target exchange rate is most likely to result in a decrease in the developing economy's:", "opts": ["money supply.", "short-term interest rates.", "balance of payments surplus."], "ans": "B", "expl": "A country forgoes monetary policy independence if it establishes a target exchange value for its currency. Monetary policy cannot pursue goals\nrelated to GDP growth, unemployment, or inflation. Policy actions are driven by the demands of maintaining the announced exchange rate target.\nThe domestic economy must adapt to the policy of the target currency country. This often results in increased volatility of the domestic money\nsupply and interest rates.\nDomestic inflation rates below target currency inflation rates put upward pressure on the exchange value of the developing economy's\ncurrency. To offset the currency market pressure and maintain the target exchange rate, the central bank must sell its currency and buy the\ntarget currency. Sales of the developing economy currency will expand the domestic money supply and decrease interest rates.\n(Choice A) The central bank needs to sell the domestic currency to maintain the target exchange rate. This would increase the domestic money\nsupply.\n(Choice C) The balance of payments must always net to zero, so there can be neither a surplus nor a deficit.\nThings to remember:\nDomestic inflation below target currency inflation will put upward pressure on the domestic currency. Maintaining the target exchange rate\nnecessitates sales of the domestic currency by the central bank. Currency sales will expand the domestic money supply and decrease interest\nrates.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 61, "q": "Which of the following is most likely a role of a central bank?", "opts": ["Issues national debt", "Sets long-term interest rates", "Acts as lender of last resort to banks"], "ans": "C", "expl": "Typical roles of a central bank\nLender of last resort\nSupplier of currency\nResponsible for monetary policy\nServes as the government's and banker's bank\nOversees the banking system\nRegulates the payments system\nManages foreign exchange and gold reserves\nCentral banks are a key component of a modern, financially connected world. The roles and responsibilities of central banks can be broadly split\ninto banking and monetary functions.\nBanking responsibilities include overseeing and regulating the banking and payment processing system. A central bank also functions as the\ngovernment's and bankers' bank, providing funds and liquidity when needed. As such, central banks are ultimately the lender of last resort to\nbanks, when other sources of capital are unavailable.\nMonetary responsibilities include money creation and, to a certain extent, overseeing the value of the currency. This leads directly to the role of\nconducting monetary policy and managing a country's foreign exchange and gold reserves.\n(Choice A) Central banks do not issue debt; this is usually a treasury function.\n(Choice B) Central banks set short-term interest rates through monetary policy, not long-term rates.\nThings to remember:\nThe roles and responsibilities of a central bank include acting as the government's and bankers' bank and lender of last resort; regulating the\nbanking and payment system; supplying the currency; and managing monetary policy, foreign exchange, and gold reserves.\nDescribe the roles and objectives of central banks", "qhtml": null}, {"n": 62, "q": "Which of the following best characterizes the approach most central banks take regarding inflation?", "opts": ["Minimize inflation rates", "Maintain targeted inflation rates", "Accept market-determined inflation rates"], "ans": "B", "expl": "Periods of high inflation usually coincide with poor economic growth and greater inflation uncertainty. Unexpected inflation carries great economic\ncosts (eg, low GDP growth). Consequently, price stability is a primary goal for most central banks. As a means of attaining that goal, target\ninflation rates consistent with price stability are established.\nQuality improvements complicate measuring changes in the cost of living. Innovation leads to the creation of more useful (ie, valuable) products\nover time. Some amount of price level increase reflects the higher quality goods, not an erosion in the purchasing power of money. Therefore,\nprice stability is not defined as a 0% inflation rate. Instead, it is defined as a low and stable inflation rate (one generally consistent with product\nenhancements).\nIn some countries the inflation target is set by the government. In other countries the central banks set the inflation target independently of the\ngovernment; such central banks are said to be target independent. Central banks' performance is assessed in part by monitoring their\neffectiveness at keeping inflation within the target range.\n(Choice A) Central banks do not attempt to achieve the lowest possible inflation rates. Very low inflation (eg, <1%) or negative inflation (ie,\ndeflation) is believed to inhibit an economy from fully achieving its potential GDP.\n(Choice C) Central banks believe the goal of price stability is too important to allow inflation to result from the unconstrained interplay of market\nforces. All major central banks have inflation targets or target ranges for achieving price stability.\nThings to remember:\nPrice stability is a goal of monetary policy for most central banks. To achieve this goal, most central banks use inflation rate targets. Central\nbanks adjust their policies to achieve actual inflation consistent with the target.\nDescribe the roles and objectives of central banks", "qhtml": null}, {"n": 63, "q": "Which of the following best describes a contractionary fiscal policy?", "opts": ["A decrease in the government budget surplus", "A reduction in export subsidies to manufacturers", "An expansion of eligibility for unemployment benefits"], "ans": "B", "expl": "Contractionary fiscal policies are designed to constrain economic growth. Contractionary policies are usually not intended to literally contract\n(ie, shrink) the size of an economy but to prevent an economy from growing too rapidly. Excessive growth relative to an economy's sustainable\ngrowth rate is a possible cause of inflation. Increased taxation and reduced spending are contractionary fiscal policies.\nExport subsidies are payments made by the government to domestic businesses designed to increase exports. A reduction in export subsidies\nreduces government payments to the exporters. The direct contractionary impact is lower revenue for the manufacturers. The result is fewer\npurchases of materials and cutbacks on employee hours. The effects filter through the economy as other impacted suppliers and employees\nreduce their spending accordingly.\n(Choice A) Other things constant, decreases in government budget surpluses are expansionary. Reductions in government budget surpluses\nresult from increases in spending or reductions in taxes (or both). Since both of those government actions are expansionary, smaller surpluses\nlead to increases in GDP.\n(Choice C) Increasing government transfer payments is an expansionary policy. Expanded eligibility for unemployment benefits generally results\nin more total money being paid to beneficiaries. The consequence is greater consumption spending and higher GDP.\nThings to remember:\nIncreased taxation and reduced spending are contractionary fiscal policies. A reduction in export subsidies reduces government payments to\nexporting businesses. Beyond the directly impacted businesses, the effects will filter through the economy as suppliers and their employees cut\nback spending.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 64, "q": "If a central bank wants to increase the money supply, the most appropriate action it can take is to:", "opts": ["increase the policy rate.", "reduce the reserve requirements.", "sell government bonds to commercial banks."], "ans": "B", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nIn a system of fractional reserve banking, reserve requirements are one policy tool used by central banks to control the money supply and, in turn,\nspending and economic growth. Reserve requirements set the minimum percentage of commercial banks' deposit liabilities that must be held as\nreserves; banks make loans with the excess deposits.\nLowering the reserve requirements for commercial banks allows those banks to lend more money. In theory, this should increase the money\nsupply since additional money lent by banks can be deposited and lent multiple times.\nThus, there is an inverse relationship between reserve requirements and the amount of money created, as reflected by the money multiplier. All\nelse being equal, the smaller (larger) the reserve requirement is:\nthe larger (smaller) the money multiplier, and\nthe more (less) money is created by fractional reserve banking, and\nthe greater (smaller) the money supply.\n(Choice A) Increasing the policy rate makes taking out short-term loans from the central bank more expensive for commercial banks. This\ntypically causes commercial banks to increase their own lending rates, which lowers demand for loans and reduces the money supply.\n(Choice C) Selling securities to commercial banks reduces the commercial banks' reserves and typically makes them less willing and/or able to\nmake loans, which reduces the money supply.\nThings to remember:\nLowering the reserve requirements for commercial banks allows those banks to lend more money. In theory, this should increase the money\nsupply since additional money that is lent by banks can be deposited and lent multiple times. Thus, there is an inverse relationship between\nreserve requirements and the amount of money created.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 65, "q": "Which of the following is least likely a quality of an effective central bank?", "opts": ["Transparency", "Independence", "Creditworthiness"], "ans": "C", "expl": "The qualities of effective central banks are independence, credibility, and transparency. Since central banks do not issue debt securities, the\nability to repay debt in a timely fashion (ie, creditworthiness) is not a factor in assessing their effectiveness.\nMajor central banks have large amounts of liabilities outstanding; however, the liabilities are either physical currency issued by the central bank or\ndeposits (by other financial institutions) held at the central bank. As such, central bank liabilities have no stated maturity and do not need to be\nretired. Furthermore, most central banks face no legal limits on the amount of money they can create. This means any requests for withdrawals\ncan be honored; therefore, creditworthiness is not a factor for central banks.\n(Choices A and B) Central banks should have independence since they must be able to act considering only the long-term economic\nconsequences, not the short-term political consequences, of their actions. Independence is supported by transparency in setting policy objectives\nand actions.\nThings to remember:\nThe qualities of effective central banks are independence, credibility, and transparency. Since central banks do not issue debt securities and can\ncreate money to satisfy liabilities, creditworthiness is not a factor in assessing their effectiveness.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 66, "q": "An increase in which of the following would most appropriately be considered expansionary fiscal policy?", "opts": ["New excise taxes on vehicle motor fuel", "Infrastructure spending on highways and bridges", "Reducing budget deficits by raising corporate income taxes"], "ans": "B", "expl": "Increases in government spending cause an increase in GDP. More infrastructure spending causes the aggregate demand to increase.\nConsequently, an increase in government spending is an expansionary fiscal policy.\nThe immediate impact of increased spending on highways and bridges is the additional sales revenue for the firms that supply the materials and\nmachinery used in the construction projects. The firms involved in the construction—and their equipment and materials suppliers—will hire\nadditional workers. As a result, aggregate demand is further stimulated by the increased income that workers spend on consumption.\n(Choice A) A tax on vehicle fuel raises consumers' costs. This puts downward pressure on GDP and is therefore a contractionary policy.\n(Choice C) Raising corporate income taxes reduces investments and hiring. This is a contractionary policy, not an expansionary policy.\nThings to remember:\nIncreases in government spending lead to increases in GDP. More spending results in increased sales by government suppliers. Those firms and\ntheir suppliers need to hire additional workers. As a result, aggregate demand expan
