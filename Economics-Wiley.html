a wider variety of goods available to consumers.", "increased employment in industries facing import competition.", "higher wages in industries that expand due to increased exports."], "ans": "B", "expl": "Most economists believe greater overall welfare is attained when countries engage in international trade rather than by attempting self-sufficiency\nin meeting domestic demand (ie, autarky). The gains from international trade derive from each country concentrating on the production of\ngoods it produces relatively more efficiently and trading for goods it produces relatively less efficiently. Gains result from specialization and\neconomies of scale.\nThe gains from trade are not shared equally; there are winners and losers. On one hand, industries expanding to meet export opportunities will\nbenefit from higher prices, due to increased foreign demand, and their employees will benefit from greater job opportunities and higher wages\n(Choice C). On the other hand, the industries' domestic customers must pay higher prices. In addition, industries facing import competition will\nsuffer domestic market share decline. As such industries contract, they will employ fewer workers.\n(Choice A) Increased trade results in greater consumer choice. This is due both to imported goods competing with domestic suppliers and the\nintroduction of previously unavailable products.\nThings to remember:\nThe gains from international trade result from greater efficiency due to specialization and economies of scale. These gains are not shared equally,\nhowever. Industries facing import competition will suffer domestic market share decline. As these industries contract, the number of their\nemployees will decline.\nDescribe the benefits and costs of international trade", "qhtml": null}, {"n": 105, "q": "If a government wants to increase its revenue while limiting the quantity of imports of a certain good, it would least likely implement a:", "opts": ["tariff.", "import quota.", "voluntary export restraint."], "ans": "C", "expl": "A voluntary export restraint (VER) is a method that governments use to reduce trade deficits and protect domestic producers. With a VER, an\nexporting country's government agrees to limit exports of a certain good or set of goods to an importing country, typically at the request of the\nimporting country's government. The exporting country may agree to a VER to avoid a stricter tariff or import quota.\nFor the importing (ie, domestic) country, a VER operates in the same way as an import quota to limit imports. However, since the limit is\nimposed by the exporting (ie, foreign) government, the domestic government does not receive any quota rent. Therefore, a VER allows a\ndomestic government to limit the volume of imports of a good, but it does not increase the domestic government's revenues.\n(Choice A) A tariff aims to limit imports of specific goods into a domestic country by setting a tax on the imported goods. This raises the cost for\nforeign producers and increases the price of the goods for domestic producers and consumers. With a tariff, the domestic government generates\nrevenue through the tax collected on the imports.\n(Choice B) A quota limits the quantity of a good imported into a domestic country. A domestic government can generate revenue under a quota\nby selling import licenses to foreign exporters. Without licenses, quota rents will likely be captured by foreign exporters.\nThings to remember:\nA voluntary export restraint (VER) is a method that governments use to reduce trade deficits by limiting the amount of goods exported from one\ncountry to another. Since a VER is imposed by the exporting country, the importing country does not receive any quota rent.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": null}, {"n": 106, "q": "All else being equal, if the domestic price level decreases relative to the foreign price level, the real exchange rate between the two currencies, when quoted as domestic currency per unit of foreign currency, will most likely:", "opts": ["decrease.", "remain the same.", "increase."], "ans": "C", "expl": "Real exchange rates measure the relative purchasing power for the goods and services of two currencies and are typically created for\neconomic analysis. Nominal (ie, observed or spot) exchange rates show the price of one currency in terms of another currency and are the quotes\nused in currency markets for currency purchases and sales.\nThe real exchange rate is calculated by adjusting the nominal exchange rate by the ratio of price levels (ie, relative rate of inflation) in the\ncorresponding countries. By removing the effects of inflation, real exchange rates better represent economic changes to exchange rates over\ntime.\nThe formula shows that the direction of change in real exchange rates (when quoted as domestic currency per unit of foreign currency) is:\nDirectly related to\nthe direction of change in the nominal exchange rate and\nthe direction of change in the foreign price level\nInversely related to the direction of change in the domestic price level\nAs a result, if the domestic price level decreases, all else being equal, the real exchange rate will increase (Choices A and B).\nThings to remember:\nThe real exchange rate between two currencies measures the relative purchasing power of the currencies. Changes in the real exchange rate,\nwhen quoted as domestic currency per unit of foreign currency, are directly related to movements in the nominal exchange rate and the foreign\nprice level. The changes are inversely related to movements in the domestic price level.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 107, "q": "The exchange rate between the euro (EUR) and the Japanese yen (JPY) is quoted by the amount of JPY per EUR 1 (JPY/EUR). If JPY appreciates against EUR, the spot exchange rate quote will be for a(n): ", "opts": ["smaller amount of JPY.", "equal amount of JPY.", "greater amount of JPY."], "ans": "A", "expl": "Currency values are expressed as a ratio of exchange between currencies. In the question, Japanese yen (JPY) is the price currency and the\neuro (EUR) is the base currency. JPY appreciation against EUR means JPY 1 is worth a greater amount of EUR in Year 1 than it was in Year 0.\nSince the exchange rate quote is given as the number of JPY per EUR 1, the question requires the relationship between the currencies to be\nviewed from the opposite perspective, with EUR as the price currency and JPY as the base currency.\nAppreciation of JPY means the same thing as depreciation of EUR. The EUR depreciation means EUR 1 buys fewer JPY. Consequently,\nJPY/EUR will be quoted at a lower number since it will take a smaller amount of JPY to buy EUR 1.\nThings to remember:\nAn exchange rate is expressed in the number of units of the price currency per one unit of the base currency. Appreciation of the price currency\nmeans it will take less of the price currency to buy a unit of the base currency. This results in an exchange rate that is quoted for a smaller amount\nof the price currency.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 108, "q": "An investor wants to diversify into foreign currency-denominated securities while minimizing exchange rate risk. Which of the following currency regimes would expose the investor to the least exchange rate risk?", "opts": ["Target zone", "Managed float", "Currency board"], "ans": "C", "expl": "An investor looking to add foreign currency-denominated investments to a portfolio is exposed not only to asset price risk but also to exchange\nrate risk. The more potential fluctuation in the exchange rate, the higher the exchange rate risk.\nA currency regime broadly describes the policies of a country's monetary authority for managing domestic currency exchange rates. Between the\nextremes of dollarization and independent floating regimes, exchange rate risk increases as regimes allow greater exchange rate flexibility and\nsupport increased monetary policy independence. Of the regimes in this scenario, the order from lowest to highest exchange rate risk is:\nCurrency board, a legislative commitment to exchange the domestic currency for a specific foreign currency while holding full reserves\nagainst the foreign currency. Minor fluctuations in exchange rates may occur. Hong Kong SAR operates under this regime with the US\ndollar as the anchor currency.\nTarget zone, a commitment to maintain the exchange rate within a preset range. Syria operates under such a regime (Choice A).\nManaged float is similar to an independent float since exchange rates are market-determined. However, the monetary authority is more\nlikely to intervene to manage domestic economic measures (eg, the balance of payments). Russia operates under this type of regime\n(Choice B).\nThings to remember:\nExchange rate risk increases as currency regimes allow greater exchange rate flexibility and support increased monetary policy independence. A\ncurrency board regime is typically associated with a low level of exchange rate risk since it is a legislative commitment to fix the exchange rate to a\nspecific currency and is backed by full reserves.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 109, "q": "A country with a well-respected monetary authority maintains the domestic currency exchange rate within 1% of the US dollar through direct and indirect intervention in the currency markets. The country is most likely using which of the following currency regimes? ", "opts": ["Fixed parity", "Dollarization", "Currency board"], "ans": "A", "expl": "A currency regime broadly describes the policies of a country's monetary authority for managing domestic currency exchange rates. A country\nwith its own currency may choose either a fixed-type or floating-type regime. The various regimes reflect a spectrum of exchange rate flexibility\nand monetary policy independence.\nA fixed parity regime, often called a fixed peg regime, refers to a country maintaining the domestic currency exchange rate with a specific\nforeign currency or a basket of foreign currencies (typically from major trading partners) within a narrow range or \"band\" (typically +/− 1.0%).\nThe monetary authority keeps the exchange rate within this band by selling or buying the foreign currency.\nA fixed parity regime is often used to increase exchange rate predictability since the foreign currency selected for the peg is typically a more stable\nor more widely used currency than the domestic currency. The increased exchange rate stability facilitates trading and investment between the\ncountry and major foreign partners.\n(Choice B) Dollarization (a term that does not apply exclusively to the dollar) occurs when countries without their own currency adopt and use a\nforeign currency for all transactions.\n(Choice C) A currency board regime differs from a fixed parity regime in that the exchange rate is a legislative commitment to a set rate, and the\namount of foreign currency reserves held is nondiscretionary.\nThings to remember:\nA fixed parity regime refers to a country fixing the domestic currency exchange rate with a specific foreign currency or a basket of foreign\ncurrencies (typically from major trading partners) and maintaining that exchange rate within a narrow range (typically +/− 1.0%).\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 110, "q": "A Canadian tourist in Hong Kong needs to exchange Canadian dollars (CAD) for Hong Kong dollars (HKD). A dealer provides a quote of 0.1799 CAD/HKD. Since the inverse of 0.1799 is 5.5586, from the perspective of the Canadian tourist, the dealer's quote is most appropriately described as a(n):", "opts": ["direct quote of 0.1799 CAD per HKD.", "direct quote of 5.5586 HKD per CAD.", "indirect quote of 0.1799 CAD per HKD."], "ans": "A", "expl": "Exchange rates show the price of one currency per unit of another currency. The two methods of quoting exchange rates are:\nDirect quotes, domestic currency per unit of foreign currency\nIndirect quotes, foreign currency per unit of domestic currency\nThinking of currency as a consumer good can be helpful. For example, the quote of 0.1799 CAD/HKD means that the Canadian must pay CAD\n0.1799 for HKD 1.000 (the good). From the Canadian perspective, this is a direct quote because the Canadian's domestic currency is in the\nnumerator.\n(Choice B) From the Canadian's perspective, the quote of 5.5586 HKD per CAD is an indirect quote because the foreign currency is in the\nnumerator. Note that this quote is the inverse of the direct quote 0.1799 CAD per HKD.\n(Choice C) Since indirect quotes have the domestic currency in the denominator, a quote of 0.1799 CAD per HKD is an indirect quote from a\nHong Kong resident's, not a Canadian's, perspective.\nThings to remember:\nIn the CFA Curriculum, direct currency exchange rate quotes are presented as domestic currency per unit of foreign currency, while indirect quotes\nare the reverse, presented as foreign currency per unit of domestic currency. The domestic currency is the currency of residence or operations.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 111, "q": "For this question, assume that GBP is the domestic currency and INR is the foreign currency. If the consumer price index (CPI) in the United Kingdom rises more than the CPI in India, the real INR/GBP exchange rate most likely: ", "opts": ["will decrease, and the purchasing power of the INR will increase.", "will increase, and the purchasing power of the INR will decrease.", "will decrease, and the purchasing power of the INR will decrease."], "ans": "A", "expl": "Purchasing power refers to the amount of goods or services a currency can purchase. Changes in purchasing power are inversely related to\nchanges in relative price levels, which are commonly measured by the consumer price index (CPI). As a country's price level (CPI) rises, its\ncurrency's purchasing power falls.\nReal exchange rates measure the purchasing power of one currency relative to another. All else equal, the real exchange rate moves as a\nfunction of changes in the ratio of the foreign CPI to the domestic CPI (assuming no movements in the nominal exchange rate). This is\ndemonstrated with a simple example:\nIf the nominal INR/GBP exchange rate = 10, and the Indian CPI rises by 2% while simultaneously the UK CPI rises by 5%, the expected real\nexchange rate will be 10 × (1.02 / 1.05) ≈ 9.7142. This means that fewer INR (9.7142 vs. 10) are needed to purchase GBP 1 worth of goods and\nservices: GBP purchasing power has decreased, and INR purchasing power has increased. The smaller increase in the Indian price level (relative\nto the UK increase) leads to a decrease in the INR/GBP real exchange rate, and thus an increase in the INR purchasing power relative to the GBP\npurchasing power (Choices B and C).\nThings to remember:\nChanges in price levels affect real exchange rates, which affect currency purchasing power. The real exchange rate moves in the same direction\nas changes in the ratio of the foreign price level to the domestic price level. When real exchange rates decrease, the purchasing power of the\ndomestic currency decreases, and vice versa.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 112, "q": "When a country uses dollarization as a currency regime, which of the following is the most likely consequence?", "opts": ["It loses the ability to set its own monetary policy.", "It maintains foreign currency reserves against its monetary base.", "Domestic bank interest rates are close to those of the adopted country."], "ans": "A", "expl": "A currency regime broadly describes the policies of a country's central bank for managing its currency's exchange rates. Some countries do not\nhave their own currency. Dollarization refers to those countries adopting and using another country's currency for all its transactions. The\nterm \"dollarization\" derives from the US dollar being the most often adopted currency, but the term does not apply exclusively to the dollar.\nThe main advantage of dollarization as a formal policy is that it imposes fiscal discipline on the adopting country. A country could theoretically print\nlimitless amounts of its own currency to pay its own government debt, but it cannot print the currency of another country. This prevents a country\nfrom taking on unsustainable debt loads. However, the trade-off is that the country can no longer set its own monetary policy since it cannot\nregulate its own money supply.\nAlthough a country may adopt the US dollar, there are no protections, such as FDIC deposit insurance, afforded to that country. This lack of\nprotection makes dollarized accounts riskier than accounts in the US, so interest rates for bank accounts in dollarized countries are higher than\nsimilar accounts in the US (Choice C).\n(Choice B) This is characteristic of a currency board system, where a country has its own currency but collateralizes it with foreign currency\nreserves. There is usually a fixed exchange rate between the domestic and foreign currencies.\nThings to remember:\nDollarization refers to a country without its own domestic currency adopting and using the currency of another country. This can result in better\nfiscal discipline for the dollarized country, but a dollarized country cannot establish its own monetary policy.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 113, "q": "A Singapore-based investor holds assets in New Zealand denominated in NZD. The investor forecasts the following changes over the next year: SGD/NZD spot exchange rate +6% SGD nominal inflation rate +3% NZD nominal inflation rate −2% Based on this information, the expected change in the SGD/NZD real exchange rate is closest to: ", "opts": ["1%", "5%", "11%"], "ans": "A", "expl": "The purchasing power of one currency versus another is measured by the real exchange rate between the two. The real exchange rate is a\nfunction of both the quoted (ie, nominal) exchange rate between the currencies and the price level in each currency; changes in real exchange\nrates result from changes in one or more of those factors.\nConsidered from the perspective of the price currency versus the base currency, a change in the real exchange rate reflects the cumulative impact\nof changes to the:\nspot exchange rate,\nthe net inflation rate in the base currency (ie, NZD), and\nthe net inflation rate in the price currency (ie, SGD).\n≈\nThe more precise measure of changes in real exchange rates is calculated as 0.85% 1%:\nHowever, the change in the SGD/NZD real exchange rate change may also be estimated using a second formula. This formula estimates the net\nchange in the real exchange rate as the expected change in the spot rate, adjusted for the difference between the expected change in the price\ncurrency's inflation and the expected change in the base currency's inflation; the three expected changes are expressed as percentage changes.\n%ΔR ≈ %ΔS + %ΔP − %ΔP = +6% + (−2%) − (+3%) = 1%\nSGD/NZD SGD/NZD NZD SGD\n(Choice B) 5% results from incorrectly treating NZD deflation as reinforcing, not offsetting, the impact of the increase in the SGD/NZD spot\nexchange rate.\n(Choice C) 11% results from incorrectly treating both NZD deflation and SGD inflation as factors that reinforce the impact of the increase in the\nSGD/NZD spot exchange rate.\nThings to remember:\nThe purchasing power of currency is measured by real exchange rates, which are a function of nominal exchange rates and price levels. Real\nexchange rate changes can be estimated from changes in the spot exchange rate between two currencies and changes in both currencies'\ninflation rates.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 114, "q": "According to the Marshall-Lerner condition, domestic currency devaluation is least likely to improve a country's trade balance if the mix of imports and exports primarily consists of:", "opts": ["luxury goods.", "goods with few available substitutes.", "goods that represent a large portion of a consumer's budget."], "ans": "B", "expl": "Goods with higher price elasticities\nHave many available substitutes\nTrade in competitive markets\nAre considered luxury or discretionary goods\nRepresent a significant portion of consumer spending\nRepresent a significant portion of input costs\nExchange rate movements affect a country's trade balance by influencing imports and exports. Devaluation of the domestic currency reduces the\ncost of a country's exports to foreign buyers and increases the cost of imports to domestic consumers. Therefore, in theory, the quantity of exports\ndemanded will increase and the quantity of imports demanded will decline.\nHowever, currency devaluation is just one factor influencing the change in quantity demanded. The Marshall-Lerner condition, part of the elasticity\napproach to understanding trade balances, asserts that total expenditures on imports and exports are driven by the price elasticities of the traded\ngoods. Under this approach, a devaluation of the domestic currency will be more successful at reducing a trade deficit if the price elasticity of\nthose goods is high.\nWhen a product has few substitutes (eg, petroleum, medications), demand may not change in proportion to a change in price. A lack of\nalternative goods that can satisfy the same desire or purpose results in price inelasticity. A country that exports or imports goods with\ninelastic demand will probably not improve its trade balance through currency devaluation since total expenditures are unlikely to be affected.\n(Choices A and C) In general, luxury goods and goods that represent a large portion of consumer budgets have higher price elasticities.\nConsumers are likely to purchase fewer of these goods when prices increase and more of them when prices decrease.\nThings to remember:\nThe elasticity approach to analyzing the impact of exchange rate changes on a country's trade balance focuses on the effect of price elasticity on\ntotal import and export expenditures. A devaluation of the domestic currency will be more successful at reducing a trade deficit if the price\nelasticity of the traded goods is high.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 115, "q": "If the Japanese yen/US dollar (JPY/USD) spot rate declines 5% from 120 to 114, the appreciation of JPY relative to USD is most likely:", "opts": ["A capital account deficit decrease", "A capital account surplus increase", "A capital account surplus decrease"], "ans": "B", "expl": "The balance of payments (BOP) includes the current account, capital account, and financial account. The net balance of all entries in a country's\nBOP accounts should theoretically always equal zero. A deficit in one or two of the components must be offset by an equivalent surplus in the\nother(s). Since initially there is a deficit in the current and financial accounts, the capital account must be in surplus.\nAppreciation of a country's currency reduces the cost of imports and increases the cost of exports and, as a result, adversely affects the country's\ntrade balance (ie, current account). Given no change in the financial account deficit, an increase in the current account deficit must be\ncounterbalanced by an equal increase in the capital account surplus (Choices A and C).\nThings to remember:\nIn the aggregate, the balance of payments (BOP) must net to zero. If currency appreciation causes the current account deficit to increase, given\nno change in the financial account, the capital account surplus must increase by an equal amount for the BOP to stay in balance.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 116, "q": "A country has deficits in both its current account and financial account. Its currency appreciates significantly, causing the current account deficit to increase. Assuming no change in the financial account, which of the following must occur to keep the balance of payments in balance?", "opts": ["A capital account deficit decrease", "A capital account surplus increase", "A capital account surplus decrease"], "ans": "B", "expl": "The balance of payments (BOP) includes the current account, capital account, and financial account. The net balance of all entries in a country's\nBOP accounts should theoretically always equal zero. A deficit in one or two of the components must be offset by an equivalent surplus in the\nother(s). Since initially there is a deficit in the current and financial accounts, the capital account must be in surplus.\nAppreciation of a country's currency reduces the cost of imports and increases the cost of exports and, as a result, adversely affects the country's\ntrade balance (ie, current account). Given no change in the financial account deficit, an increase in the current account deficit must be\ncounterbalanced by an equal increase in the capital account surplus (Choices A and C).\nThings to remember:\nIn the aggregate, the balance of payments (BOP) must net to zero. If currency appreciation causes the current account deficit to increase, given\nno change in the financial account, the capital account surplus must increase by an equal amount for the BOP to stay in balance.\nDescribe exchange rate regimes and explain the effects of exchange rates on countries’ international trade and capital flows", "qhtml": null}, {"n": 117, "q": "Conventionally, which of the following is most likely part of the sell side of the foreign currency market?", "opts": ["A large international bank that makes a market in all major currencies", "A multinational manufacturer generating revenues in multiple currencies", "A central bank that intervenes in currency markets to maintain a fixed exchange rate"], "ans": "A", "expl": "Identifying the buy side or the sell side in a currency trade may seem arbitrary since every trade entails a purchase and sale of different\ncurrencies by both trade counterparties. The foreign exchange (FX) market follows the conventions of other financial markets and designates the\nintermediaries as the sell side. The sell side is composed of the banks that trade currencies and provide related products.\nDue to economies of scale a preponderance of trading occurs at a handful of global money center banks (ie, first-tier banks). In addition to being\nmarket makers these banks sell currencies and provide related products (eg, currency derivatives, trade financing) to their clients. Although not\nmajor currency market players, regional and local banks (ie, second- and third-tier banks) provide similar currency-related products to their\ncustomers.\n(Choice B) Corporations other than banks are part of the buy side of the currency market.\n(Choice C) Central banks are part of the buy side of the currency market.\nThings to remember:\nThe sell side is composed of the banks that trade currencies and provide related products. Sell-side participants are categorized as first-tier (ie,\nmoney center banks making markets in currencies) and second- or third-tier (ie, regional and local banks). Banks in all categories sell currencies\nand provide related products to their clients.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 118, "q": "An analyst gathers the following information: Spot CAD/AUD 0.9434 AUD Consumer Price Index 119.7 Expected Australian inflation rate 2.0% CAD Consumer Price Index 144.4 Expected Canadian inflation rate 3.50% The real CAD/AUD exchange rate is closest to: ", "opts": ["0.7820", "0.9575", "1.1380"], "ans": "A", "expl": "Real exchange rates are used to measure the relative purchasing power between two currencies. Relative purchasing power is measured by\nadjusting the nominal exchange rate by the ratio of the aggregate price levels for similar goods in each currency.\nBased on the formula shown above, the real exchange rate:\nvaries directly with the nominal exchange rate and the foreign price level, and\nvaries inversely with the domestic price level (which itself is typically measured using a consumer price index.\nIn this case, CAD is the domestic currency and AUD is the foreign currency.\nIf the purchasing power of both currencies were the same, the real exchange rate would equal 1.0 and the nominal exchange rate would need to\nbe adjusted to offset the relative price level difference (ie, the nominal exchange rate would be the inverse of the ratio of price levels).\nAs the real exchange rate rises (falls), the relative purchasing power of the domestic currency declines (increases), such that imported foreign\ngoods become more expensive (cheaper). If the real exchange rate falls below zero (as in this case), the domestic currency's relative purchasing\npower has increased (ie, imported foreign-priced goods become more affordable).\n(Choice B) 0.9575 results from using the relative inflation rate, instead of price levels, to adjust the nominal exchange rate.\n(Choice C) 1.1380 results from mistakenly inverting the ratio of foreign to domestic price levels.\nThings to remember:\nReal exchange rates measure the relative purchasing power between two currencies. To calculate a real exchange rate, adjust the spot exchange\nrate by the ratio of foreign to domestic price levels (measured by the two currencies' consumer price indexes).\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 119, "q": "A lender is most likely to benefit when, over the life of a loan, actual inflation:", "opts": ["is less than expected inflation.", "equals expected inflation.", "is greater than expected inflation."], "ans": "A", "expl": "Impact of inflation differing from expectations\nGroup benefiting Rationale\nBorrowers\nPayments made have less purchasing\nInflation > expectations Purchasers under fixed-\npower than expected\nprice contracts\nLenders\nIncome received has more purchasing\nInflation < expectations Retirees with fixed pension\npower than expected\nbenefits\nInflation is a change in average nominal price levels over time and is characterized as either expected or unexpected:\nExpected: price level changes match expectations\nUnexpected: price level changes are above or below expectations\nLenders benefit when actual inflation is less than expected inflation. Interest rates reflect expected inflation. If the rise in price levels over the\nlife of a loan is less than the expected inflation rate reflected in the loan's interest rate, a lender's interest income has greater purchasing power\nthan expected at the loan's origination. There is a transfer of wealth from borrowers to lenders when actual inflation is less than expected inflation.\n(Choice B) Lenders are neither advantaged nor disadvantaged when actual inflation equals expected inflation since the interest income has the\nsame purchasing power (real value) as anticipated at loan origination.\n(Choice C) If actual inflation is greater than expected inflation, lenders earn interest with less purchasing power than originally expected, which is\na transfer of real wealth from lenders to borrowers.\nThings to remember:\nInflation is a change in average nominal price levels over time. Lenders benefit (suffer) when actual inflation is less (more) than expected inflation\nsince interest earned has greater (less) purchasing power than originally anticipated.\nDescribe common objectives of capital restrictions imposed by governments", "qhtml": null}, {"n": 120, "q": "After a 6% depreciation of the euro (EUR) versus the Japanese yen (JPY), the exchange rate between the currencies is JPY/EUR 120. Before EUR depreciation, the JPY/EUR exchange rate was closest to:", "opts": ["113.21", "127.20", "127.66"], "ans": "C", "expl": "Currency values are expressed as a ratio of exchange; they represent the amount of the price currency per one unit of the base currency.\nChanges in exchange rates are often expressed as a percentage change. If the current rate and the percentage change are known, the\npercentage change formula can be adjusted to calculate the original exchange rate, as shown:\nA 6% depreciation of EUR means it only buys 94% of the JPY that it could purchase before the depreciation. In the context of this currency\npair, EUR depreciation means the same thing as JPY appreciation.\n(Choice A) 113.21 is the original exchange rate if EUR had appreciated, not depreciated, by 6% against JPY.\n(Choice B) 127.20 would be the correct choice if JPY had appreciated by 6% instead of EUR depreciating by 6%. EUR depreciation of 6%\nresults in JPY appreciation of 6.38%.\nThings to remember:\nA percent change in the base currency's value reflects how much more or less of the price currency it buys compared with its previous value. For\nexample, a 5% depreciation of the base currency means it only buys 95% as much of the price currency as before. The original exchange rate is\nequal to the current spot rate divided by 1 plus percentage change in base currency.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 121, "q": "If the Canadian dollar (CAD) depreciates 3% against the Australian dollar (AUD) over a period, then the appreciation of the AUD against the CAD is most likely:", "opts": ["less than 3%.", "equal to 3%.", "greater than 3%."], "ans": "C", "expl": "Currency values are expressed in exchange rates as the amount of the price currency per one unit of the base currency. When an exchange rate\nchanges, the percentage change in each of the two currencies' values is inversely proportional. The absolute value of the changes must be the\nsame for both currencies, but the percentage changes cannot be equal. The percentage increase of one currency is always greater than the\npercentage decrease of the other currency.\nIn this scenario, the depreciation in the Canadian dollar (CAD) against the Australian dollar (AUD) must be converted to appreciation of the AUD\nagainst the CAD based on the above equation:\nThe appreciation of the AUD is 3.09%, which is greater than the depreciation of the CAD of 3% (Choices A and B).\nThings to remember:\nWhen an exchange rate changes, the percentage change in the two currencies' values are inversely proportional. Althoughthe absolute money\nvalue of the changes must be the same for both currencies, the percentage gain of one currency is always greater than the percentage loss of the\nother.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 122, "q": "If the Swiss franc (CHF) appreciated by 4% against the euro (EUR), the percentage decline of EUR is closest to:", "opts": ["3.85%", "4.00%", "4.17%"], "ans": "A", "expl": "Currency values are expressed as a ratio of exchange (ie, the amount of the price currency per one unit of the base currency). For any exchange\nrate change, as one currency appreciates, the other depreciates.\nThe absolute value of the changes must be the same for both currencies, but the percentage changes cannot be equal. An exchange quote in\neither currency is the reciprocal of the other: CHF/EUR = 1/(CHF/EUR = EUR/CHF). This remains true even as exchange rates move.\nConsequently, 1 + percentage changes in the two currencies are inversely proportional.\nGiven a percentage change in either the base or price currency, the percentage change in the other can always be calculated. Insert the\npercentage appreciation in CHF on the right-hand side of the equation and solve for the percentage depreciation in EUR.\n(Choice B) 4.00% is the percentage appreciation of CHF. The percentage decline in the depreciating currency is always smaller than the\npercentage increase in the appreciating currency.\n(Choice C) 4.17% would be the gain in the appreciating currency if the depreciating currency declined by 4%.\nThings to remember:\nThere is a reciprocal relationship between exchange rate changes for any currency pair. Consequently, an exchange rate change will result in a\ndiffering percentage change in value for each currency. The percentage change can be calculated as: 1 / [(1 + % change in other currency) – 1].\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 123, "q": "An analyst gathers the following information: Expected spot rates Spot rates in six months USD/CAD 0.8650 0.8740 JPY/USD 98.50 97.50 USD/EUR 1.2050 1.1950 Based on this information, which currency is most likely to show the greatest percentage appreciation versus USD? ", "opts": ["CAD", "JPY", "EUR"], "ans": "A", "expl": "The percentage change in an exchange rate is the percentage change in the amount of price currencyper one unit of base currency.\nIn this question, the expected change in CAD and EUR can be computed using the given exchange rates since both are stated as the base\ncurrency quoted against USD. However, EUR can be seen as an incorrect answer without any calculation: since one EUR is expected to convert\nto fewer USD in the future, the EUR is expected to depreciate, rather than appreciate, against the USD (Choice C).\nThe expected change in JPY is more easily compared to the other currencies if it is first converted to the base currency by inverting the exchange\nrate given:\nThen, the expected percentage change in each base currency's value, relative to USD, is:\nThings to remember:\nThe percentage change in an exchange rate is the percentage change in the amount of price currency per one unit of base currency. The change\nin value can be computed directly from given exchange values if measuring change for the base currency. When measuring change in value for a\nprice currency, the quoted exchange rate is inverted to directly calculate the percentage change.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 124, "q": "If a Brazilian converts BRL 781.25 to EUR 125, then the direct exchange rate from the Brazilian's perspective is closest to:", "opts": ["0.16 BRL/EUR", "6.25 EUR/BRL", "6.25 BRL/EUR"], "ans": "C", "expl": "Currency exchanges rates can be expressed as direct or indirect quotes:\nIn a direct quote, the domestic currency is the price currency in the numerator and expresses how many units of domestic currency are\nrequired to buy one unit of foreign currency.\nIn an indirect quote, the domestic currency is the base currency in the denominator and expresses how many units of foreign currency\ncan be bought with one unit of domestic currency.\nThis question asks for the direct quote from the Brazilian perspective, so BRL is the domestic currency and therefore the price currency in the\nnumerator:\n(Choice A) 0.16 is the ratio EUR to BRL, not BRL to EUR.\n(Choice B) 6.25 EUR/BRL results from inverting the currency ISO codes.\nThings to remember:\nCurrency exchanges rates can be expressed as direct or indirect quotes. Direct quotes include the domestic currency as the price currency in the\nnumerator. Indirect quotes include the domestic currency as the base currency in the denominator.\nDescribe the foreign exchange market, including its functions and participants, distinguish between nominal and real exchange rates, and\ncalculate and interpret the percentage change in a currency relative to another currency", "qhtml": null}, {"n": 125, "q": "A US investor receives a dividend payment from a French company. The dividend is most appropriately classified as a:", "opts": ["US current account debit.", "US financial account credit.", "French capital account debit."], "ans": "A", "expl": "The balance of payments (BOP) summarizes a country's international capital inflows and outflows. BOP accounting is based on a double-entry\nbookkeeping system.\nAll transactions are allocated to either the current account, the capital account, or the financial account. Broadly speaking, the current account\nreflects the net value of imported and exported goods and services but can be further subdivided into:\nMerchandise trade: Import and export of physical commodities and manufactured goods\nServices: Service industry imports and exports (eg, software, movies, legal services)\nIncome receipts: Income from foreign assets, such as dividend income or interest payments\nUnilateral transfers: One-way transfers, such as foreign aid or worker remittance\nIn each account, debits increase assets or decrease liabilities whereas credits decrease assets or increase liabilities. In this instance, a US\ninvestor receiving a dividend payment from a French company (which is an income receipt in the US) results in a debit (ie, increase in assets) to\nthe US current account.\n(Choice B) The financial account captures cross-border transfers of assets, not the income or interest received from owning an asset.\n(Choice C) The capital account captures sales and transfers of nonproduced and intangible assets, such as mineral rights or patents.\nThings to remember:\nIn the balance of payments, the current account records transactions from merchandise and services trade, income receipts, and unilateral\ntransfers. An income receipt would increase (ie, debit) the current account for the country in which it is received.\nDescribe common objectives of capital restrictions imposed by governments", "qhtml": null}, {"n": 126, "q": "A government would most likely impose capital restrictions in order to:", "opts": ["reduce imports that compete with domestic producers.", "limit foreign influence in strategically important sectors.", "restrict flight of foreign capital during economic expansions."], "ans": "B", "expl": "Government policies to place limits on foreign markets\nQuotas\nTariffs\nTrade restrictions\nVoluntary export restraints\n(limits on goods)\nExport subsidies\nDomestic content provisions\nCapital restrictions Restrictions on inflows from foreigners\n(limits on capital) Restrictions on outflows by citizens\nCapital restrictions are used by governments and other regulatory bodies to limit a country's openness to foreign markets. Unlike trade\nrestrictions, which limit the flow of international goods, capital restrictions limit the flow of capital to and from international sources.\nCapital restrictions can limit foreigners' ability to own domestic assets and can limit citizens' ability to own foreign assets. Restrictions on inflows\ninclude limiting how much foreigners can invest in an asset (eg, real estate) and imposing maximum levels on foreign ownership in strategic\nindustries (eg, defense). Restrictions on outflows include capping the amount domestic citizens can invest abroad and imposing deadlines for\nrepatriation of foreign capital and investments.\n(Choice A) Capital restrictions set conditions on the flow of capital to and from other countries and are not used to reduce imports of a good.\nTrade restrictions are policies that set conditions on trade with other countries.\n(Choice C) Capital restrictions may be imposed to restrict flight of foreign capital in times of macroeconomic crisis, when a rapid recall of foreign\nfunds could leave domestic companies more vulnerable. During times of economic expansion, the risk of a rapid recall of foreign funds is lower,\nso capital restrictions are unlikely to be needed.\nThings to remember:\nCapital restrictions limit a country's openness to foreign markets by restricting the flow of capital to and from international sources. Capital\nrestrictions can limit foreigners' ability to own domestic assets and limit citizens' ability to own foreign assets.\nDescribe common objectives of capital restrictions imposed by governments", "qhtml": null}, {"n": 127, "q": "An analyst gathers the following information related to the New Zealand dollar (NZD) and the Australian dollar (AUD): Selected Exchange Rate Information Spot exchange rate (NZD/AUD) 1.1800 Arbitrage-free one-year forward exchange rate (NZD/AUD) 1.1974 Dealer offered one-year forward exchange rate (NZD/AUD) 1.1700 New Zealand one-year interest rate 3.0% Australian one-year interest rate 1.5% Based on this information, the maximum arbitrage profits (in AUD) are closest to:", "opts": ["0.0120", "0.0238", "0.0276"], "ans": "B", "expl": "When the risk-free interest rates of two countries are different, the forward rates of their currencies must be priced to prevent arbitrage profit in an\nefficient market. The forward rate calculation is based on the spot rate, the interest rates, and the length of the forward period. In this scenario,\nsince a dealer is offering a rate of 1.1700 NZD/AUD, which differs from the arbitrage-free rate, arbitrage profits are possible.\nAccording to the arbitrage-free rate, AUD 1.000 should purchase NZD 1.1974. However, using the dealer quote, AUD 1.000 only purchases NZD\n1.1700. Therefore, in the market, the AUD is underpriced and the NZD is overpriced.\nArbitrage profits can be earned by committing today to sell (ie, deliver) the overpriced NZD and to buy (ie, take delivery of) the underpriced AUD\nthrough a forward exchange rate contract. One of the key elements of arbitrage is that investors do not risk their own funds, but instead borrow to\ninitiate the transaction. In this scenario, the first step is to borrow AUD to obtain the NZD, which will be invested and eventually delivered under\nthe forward contract. The complete steps to exploit this opportunity are as follows:\n(Choice A) 0.0120 represents the difference between the arbitrage-free forward exchange rate and the market rate, or 1/1.1700 − 1/1.1974\n(quotes are inverted to obtain the AUD result).\n(Choice C) 0.0276 represents the loss that would be incurred by entering into a forward contract to sell the AUD (ie, underpriced asset) and buy\nthe NZD (ie, overpriced asset). This transaction is unlikely since it would lock in a loss.\nThings to remember:\nArbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower price\nin a different market. If the arbitrage-free forward rate differs from the market rate, an arbitrage opportunity exists.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 128, "q": "If spot exchange rate quotes are 0.1427 CAD/SEK and 0.1366 CAD/NOK, the no-arbitrage SEK/NOK spot rate is closest to:", "opts": ["0.0195", "0.9573", "1.0447"], "ans": "B", "expl": "A cross exchange rate can be derived by cross multiplying two other rates. Cross rates are commonly used to derive an exchange rate for a\nseldom-quoted currency pair, but they can also be used to determine whether a quoted rate is fairly priced. One currency must be common to\nboth cross-multiplied rates.\nIn this scenario, the SEK/NOK cross rate is calculated by cross multiplying the CAD/SEK and CAD/NOK exchange rates. Since both quotes have\nCAD in the numerator, the steps to calculate the cross rate are as follows:\nThis cross rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. Here, any SEK/NOK exchange rate\nother than 0.9573 would allow an investor to earn arbitrage profits by selling the relatively overvalued currency and buying the relatively\nundervalued currency.\n(Choice A) 0.0195 results from failing to invert the CAD/SEK quote before multiplying it by the CAD/NOK rate.\n(Choice C) 1.0447 results from incorrectly inverting the CAD/NOK quote rather than the CAD/SEK rate. Doing so results in the NOK/SEK cross\nrate instead of the SEK/NOK rate.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 129, "q": "A GBP/USD forward exchange rate quoted at positive forward points most likely indicates that GBP:", "opts": ["is expected to appreciate against USD.", "is trading at a forward discount relative to USD.", "has an interest rate that is lower than the USD interest rate."], "ans": "B", "expl": "A forward exchange rate is the amount of one currency that can be exchanged for one unit of another currency in the future; this rate can be\nquoted by forward points. The forward exchange rate is determined by adding the quoted number of positive or negative forward points, also\nknown as pips, to the price currency in the spot rate quote.\nIf there are:\nPositive forward points, then the specified number of pips is added to the spot rate to determine the forward exchange rate. In this\nscenario, it takes more GBP (ie, price currency) to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth\nless relative to the USD in the forward market, so the GBP is trading at a forward discount.\nNegative forward points, then the specified number of pips is subtracted from the spot rate to determine the forward exchange rate. In that\ncase, it takes fewer GBP to buy USD 1 at the forward rate than at the spot rate. This means each GBP is worth more relative to the USD in\nthe forward market, so the GBP is trading at a forward premium.\n(Choice A) The positive points signal that it will take a greater amount of GBP to buy USD 1 at the forward rate than at the spot rate and that\nmarket participants expect the GBP to depreciate against the USD.\n(Choice C) A forward exchange rate greater than the spot rate indicates that the price currency interest rate is greater than the base currency\ninterest rate.\nThings to remember:\nForward discounts or premiums refer to the value of a currency at the forward versus the spot exchange rate. Positive forward points indicate it\ntakes more of the price currency to buy one unit of the base currency at the forward rate (ie, in the future) and the price currency is trading at a\nforward discount.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 130, "q": "A currency trader observes the following currency spot exchange rates from two dealers: Source Currency Exchange Rate Dealer 1 CNY/THB 0.22 Dealer 1 INR/THB 2.35 Dealer 2 INR/CNY 10.75 Based on only this information, the arbitrage profit available per every CNY 1 is closest to: ", "opts": ["INR 0.0682", "INR 0.0064", "CNY 0.0682"], "ans": "A", "expl": "A cross-rate is the exchange rate implied by two related exchange rates, assuming that no arbitrage opportunities exist. If the actual exchange\nrate differs from the no-arbitrage exchange rate implied by the cross-rate, then an arbitrage opportunity exists. An investor can profit by\npurchasing a currency from the source where it is underpriced and simultaneously selling the same currency to the source where it is\noverpriced.\nFinding an arbitrage opportunity from cross-rates can be conceptualized as a triangle, as shown above. Potential arbitrage profits can be\nobserved by moving from one currency to another in two directions around the triangle. When moving around the triangle, one currency is\nmultiplied by the actual exchange rate to convert to another currency.\nIn this scenario, the INR/CNY rate from Dealer 2 is 10.75. Using the INR/THB and CNY/THB rates quoted by Dealer 1, Dealer 1's INR/CNY cross-\nrate is 10.6818. The arbitrage profit is the difference between buying CNY 1 for INR 10.6818 from Dealer 1 and simultaneously selling CNY 1 for\nINR 10.75 to Dealer 2. The profit is INR 10.75 − INR 10.6818 = INR 0.0682 per every CNY 1 (Choice C).\n(Choice B) 0.0064 is the potential arbitrage profit in CNY, not INR.\nThings to remember:\nIf an actual exchange rate differs from a cross-rate derived from two related exchange rates, an arbitrage opportunity becomes available by\npurchasing a currency from the underpriced source and selling the same currency to the overpriced source.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 131, "q": "The EUR/GBP spot exchange rate is 1.1650. The EUR one-year interest rate is 0.25%, and the GBP one-year interest rate is 1.50%. The one- year forward exchange rate expressed in forward points is closest to: ", "opts": ["−143", "−115", "145"], "ans": "A", "expl": "Exchange rate quotes specify the amount of one currency to be traded for one unit of another currency. The value is expressed in units of the\nprice currency per one unit of the base currency. If the EUR/GBP exchange rate is quoted at 1.1650, it costs 1.1650 EUR (the price currency) to\npurchase one GBP (the base currency).\nThe spot exchange rate is the value at which one currency can be traded for another today. The forward exchange rate is the current quotation\nfor the value at which one currency can be exchanged for another in the future. The difference between the spot and forward exchange rates is\ndetermined by the relative level of risk-free interest rates in the two currencies.\nGiven the spot rate and one-year interest rates in the two currencies, the one-year forward rate can be calculated. The forward points equal\nforward exchange rate minus the spot exchange rate, with the difference multiplied by 10,000 (unless the JPY is one of the currency pair, in which\ncase the multiplier is 100).\n(Choice B) −115 is the negative of the one-year forward exchange rate.\n(Choice C) 145 is the result if the EUR and GBP interest rates are inverted in the forward exchange rate calculation.\nThings to remember:\nTo determine forward points, the spot exchange rate is subtracted from the forward exchange rate, and the difference is multiplied by 10,000\nunless JPY is involved causing the multiplier to be 100.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 132, "q": "An analyst observes the following exchange rate data: Selected foreign exchange rate quotes Source Currencies Spot rate Market JPY/EUR 115.85 Market JPY/USD 106.60 Dealer EUR/USD 0.9050 Based only on this information, the arbitrage profit (in USD) available for each USD 1.000 invested is closest to:", "opts": ["0", "0.0152", "0.0168"], "ans": "C", "expl": "Arbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset at a lower\nprice in a different market. For this question, the first step is to identify any mispricing between the market and dealer quotes.\nTo compare the dealer quote of 0.0950 EUR/USD to a similar market quote, first calculate the market available EUR/USD cross-rate. Since both\nmarket quotes have JPY in the numerator, the steps to calculate the no-arbitrage market rate are as follows:\nThere is an arbitrage opportunity since the no-arbitrage rate of 0.9202 EUR/USD differs from the dealer-offered rate of 0.9050 EUR/USD\n(Choice A). The steps to exploit the arbitrage are as follows:\nPlease note that the calculations shown above are rounded to four decimals. The approximate answer will result from using the entire numbers\ngenerated from the calculations. Users who calculate subsequent steps using only the numbers shown in the preceding step(s) will obtain an\nincorrect answer.\n(Choice B) 0.0152 is the profit per EUR converted at the rate of 0.09050 EUR/USD.\nThings to remember:\nArbitrage refers to the riskless sale of an asset at a higher price in one market and the simultaneous purchase of the same asset a lower price in a\ndifferent market.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 133, "q": "The USD/GBP spot rate is 1.3075, and the one-year USD/GBP forward rate is 1.3266. If the one-year USD risk-free interest rate is 4.00%, then the one-year GBP risk-free interest rate is closest to: ", "opts": ["2.50%", "2.55%", "5.51%"], "ans": "A", "expl": "Arbitrage-free pricing of forward exchange rates requires the spot/forward difference to reflect the difference in the currencies' risk-free\ninterest rates. This reflects the difference over the term to the forward date between:\nthe interest income earned on the currency purchased, and\nthe interest expense (if borrowed) or opportunity cost on the currency sold in the spot market.\nGiven the forward and spot exchange rates between a pair of currencies and the interest rate in one of them, the risk-free rate in the other\ncurrency can be calculated. Since GBP is the base currency, rearrange the equation to isolate the base currency's risk-free rate:\n(Choice B) 2.55% results from adding the USD interest rate (1.04) to the difference between the spot rate and forward exchange rates (1.3266 −\n1.3075).\n(Choice C) 5.51% results from incorrectly using the ratio of the forward rate to the spot rate (1.3266/1.3075), instead of the spot rate to the\nforward rate, before multiplying by the USD interest rate (1.04).\nThings to remember:\nArbitrage-free pricing of forward exchange rates requires the spot/forward difference to reflect the difference in the two currencies' risk-free interest\nrates. The spot and forward exchange rates between a pair of currencies and one interest rate can be used to calculate the other interest rate.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 134, "q": "A foreign exchange dealer observes that the USD/EUR spot rate is 1.1733, and the two-month forward rate is 1.1849. Based on this information, the two-month forward points are closest to:", "opts": ["0.0116", "1.1600", "116.0000"], "ans": "C", "expl": "Forward exchange rates are currency exchange rates for transactions occurring in the future. In this question, the two-month USD/EUR\nforward rate of 1.1849 means that two months from today, one party will pay $1.1849 in exchange for €1. The convention in the foreign exchange\nmarket is to express the forward rate in terms of the number of points, or pips, between the forward rate and the spot rate.\nForward points are calculated in a two-step process:\nFirst, calculate the difference between the two rates. The spot rate is always subtracted from the forward rate, so the difference can be\neither positive or negative. In this question, the difference is 1.1849 − 1.1733 = USD/EUR 0.0116.\nNext, scale the difference by the number of decimal places in the spot rate. Since the spot rate for all major currencies except JPY is quoted\nto four decimal places (JPY is quoted to two decimal places), multiply the difference in the rates by 10,000 (100 for JPY). Multiplying 0.0116\n× 10,000 = 116.0 forward points. Another way is to simply move the decimal in the difference four places to the right.\nThings to remember:\nForward exchange rates are often quoted as forward points relative to the spot exchange rate. Forward points for all currencies except JPY are\ncalculated as (Forward rate − spot rate) × 10,000. Forward points can be positive or negative.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 135, "q": "A currency trader observes the following spot rates involving the Chinese yuan (CNY), Hong Kong dollar (HKD), and Australian dollar (AUD): The no-arbitrage AUD/CNY spot rate is closest to:", "opts": ["0.0215", "0.6176", "1.6193"], "ans": "B", "expl": "A cross rate is an exchange rate that cross multiplies two exchange rates to derive a third rate. Cross rates are commonly used to derive an\nexchange rate for a seldom-quoted currency pair, but they can also be used to determine whether a quoted rate is properly priced. One currency\nmust be common to both cross multiplied rates.\nIn this case, the AUD/CNY cross rate is calculated by taking the cross product of the HKD/AUD and HKD/CNY exchange rates. However, HKD is\nthe numerator of both rates, so to produce a rate that can be cross multiplied, the HKD/AUD rate must be inverted. This is done by using the\nreciprocal of the rate, as shown below:\nThe AUD/CNY quote is then calculated as follows:\nThis rate is referred to as the no-arbitrage rate since it is calculated from observed market rates. In this case, any AUD/CNY exchange rate other\nthan 0.6176 would allow a trader to earn arbitrage profits by selling the relatively overvalued currency and buying the undervalued currency.\n(Choice A) 0.0215 results from failing to invert the HKD/AUD quote before multiplying it with the HKD/CNY rate.\n(Choice C) 1.6193 results from incorrectly inverting the HKD/CNY quote rather than the AUD/HKD rate. Doing so results in the CNY/AUD cross\nrate instead of the AUD/CNY rate.\nThings to remember:\nCross rates result from multiplying two exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is fairly priced.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 136, "q": "The SGD/USD spot rate is 1.4148, and the three-month forward rate is 1.4431. Based on this information, the three-month forward points, expressed as a percentage, are closest to:", "opts": ["1.96", "2.00", "2.83"], "ans": "B", "expl": "Forward exchange rates are currency exchange rates for transactions being entered into today that will actually occur in the future. In this\nscenario, the three-month SGD/USD forward rate of 1.4431 means that three months from today, one party will pay SGD 1.4431 in exchange for\nUSD 1.0000.\nThe convention in the foreign exchange market is to express the forward rate in terms of the number of points, or pips, between the forward rate\nand the spot rate, or as a percentage of the spot rate. Forward points as a percentage of the spot rate, in this scenario, are calculated as follows:\n(Choice A) 1.96 results from dividing by the forward rate, not the spot rate.\n(Choice C) 2.83 results from subtracting the spot rate from the forward rate (1.4431 − 1.4148) and then multiplying by 100.\nThings to remember:\nForward exchange rates are quoted as forward points relative to the spot exchange rate or as a percentage of the spot exchange rate. Forward\npoints expressed as a percentage are equal to subtracting 1 from the ratio of the forward rate to the spot rate, and then multiplying by 100.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 137, "q": "A currency trader observes the following spot exchange rates involving the British pound (GBP), US dollar (USD), and Mexican peso (MXN): If the trader is quoted 27.2511 for the MXN/GBP rate, the most appropriate conclusion is that:", "opts": ["no arbitrage opportunity exists.", "the MXN is undervalued relative to the GBP.", "risk-free interest rates are higher in Mexico than in the UK."], "ans": "B", "expl": "A cross rate is an exchange rate obtained by cross-multiplying two exchange rates to derive a third rate. Cross rates are commonly used to\nderive an exchange rate for a seldom-quoted currency pair, but they can also be used to determine whether a quoted rate is properly priced. One\ncurrency must be common to both cross-multiplied rates.\nIn this question, the MXN/GBP cross rate is the cross-product of the USD/GBP and MXN/USD. The 27.2511 rate quoted to the dealer means GBP\nis overvalued: It costs more MXN to buy GBP 1 (27.2511) than indicated by the cross-rate formula shown above (26.6417). Describing GBP as\novervalued relative to MXN is the same as describing MXN as undervalued relative to GBP.\n(Choice A) When an exchange rate is mispriced, an arbitrage profit can be earned by selling the relatively overvalued currency and buying the\nrelatively undervalued currency.\n(Choice C) Risk-free interest rates are a key determinant of the difference between forward and spot exchange rates. All exchange rates in this\nquestion are spot rates, and since no information on forward rates is provided, no conclusions can be reached regarding interest rates in either\nMexico or the UK.\nThings to remember:\nCross rates result from multiplying two separate exchange rates to derive a third rate. They can be used to provide an exchange rate between two\ncurrencies that are not commonly traded or to determine whether a quoted rate is priced fairly.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 138, "q": "An analyst obtains the following exchange rates among EUR, GBP, and CHF: CHF/EUR 1.1010 GBP/EUR 0.8602 CHF/GBP 1.2799 If CHF appreciates by 5% versus EUR and EUR appreciates by 2% versus GBP, the no-arbitrage CHF/GBP rate would be closest to:", "opts": ["1.1951", "1.2434", "1.3176"], "ans": "A", "expl": "Among any three currencies (eg, EUR, CHF, and GBP), three exchange rates express the value between each possible pair (ie, CHF/EUR,\nGBP/EUR, and CHF/GBP). Given any two of the three exchange rates, the third is effectively fixed by arbitrage. This implied exchange rate is\nknown as a cross rate, which is obtained by multiplying the two given rates and factoring out the currency common to both quotes. In some\ncases, currency quotes need to be inverted to facilitate cancelling out the intermediary currency.\nIn this scenario, EUR has appreciated by 2% against GBP and CHF has appreciated by 5% against EUR.\nSince EUR has appreciated relative to the GBP and is the base currency in the given GBP/EUR exchange rate, that rate is multiplied by\n1.02, indicating that 1 EUR now buys more GBP.\nSince CHF has appreciated relative to the EUR and is the price currency in the given CHF/EUR exchange rate, it is multiplied by (1/1.05),\nindicating that the EUR now buys fewer CHF.\nThe new CHF/GBP cross rate is:\n(Choice B) 1.2434 CHF/GBP results from dividing the original GBP/EUR exchange rate by 1.02, rather than multiplying to reflect EUR's\nappreciation against GBP.\n(Choice C) 1.3176 CHF/GBP results from multiplying the original CHF/EUR exchange rate by 1.05 rather than dividing to reflect the CHF's\nappreciation against the EUR.\nThings to remember:\nFor any three currencies, three exchange rates express the value between each possible pair. Given any two of the exchange rates, the third is\nfixed by arbitrage. This implied exchange rate is known as a cross rate, which is obtained by multiplying the two given exchange rates and\nfactoring out the currency common to both quotes.\nCalculate and interpret currency cross-rates", "qhtml": null}, {"n": 139, "q": "Which of the following conditions is most likely if the base currency interest rate is lower than the price currency interest rate?", "opts": ["The forward points are positive.", "The price currency trades at a forward premium.", "The base currency inflation is greater than price currency inflation."], "ans": "A", "expl": "Foreign exchange quotes specify an amount of price currency per unit of base currency. Spot exchange rates are values at which currencies can\nbe exchanged today. Forward exchange rates are current quotes for future exchanges.\nTo find the forward points, subtract the spot rate from the forward rate and multiply the difference by the appropriate multiplier either 100 or\n10,000. The forward points are positive when the forward rate is greater than the spot rate. The relationship between interest rates, exchange\nrates, and forward points is shown below:\n(Choice B) Forward premium refers to a currency with a higher value in the forward market than in the spot market. The currency with the lower\ninterest rate, the base currency in this question, would trade at a forward premium.\n(Choice C) Inflation expectations impact interest rates, but inflation is not a direct input in determining the difference between the spot and\nforward rates.\nThings to remember:\nIf the base currency interest rate is lower than the price currency interest rate, the forward exchange rate is greater than the spot rate and the\nforward points are positive.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 140, "q": "The spot rate is 5.5945 BRL/USD when the one-year, risk-free interest rates are 3.5% in Brazil and 2.0% in the US. Based on the arbitrage- free BRL/USD forward rate, the BRL is most likely trading at a: ", "opts": ["discount to the USD and the forward points are 823.", "discount to the USD and the forward points are 811.", "premium to the USD and the forward points are −823."], "ans": "A", "expl": "When risk-free interest rates for two countries are different, the forward rates for their currencies must be priced to prevent arbitrage profit. The\nconvention in the foreign exchange market is to express the forward rate in terms of the number of points, or pips, between the forward rate and\nthe spot rate quotes.\nThe BRL/USD no-arbitrage forward rate and the forward points for this question are calculated using the formulas above:\nWhen the forward rate (expressed as price currency per unit of the base currency) is higher than the spot rate, the forward points are positive,\nand the price currency (BRL) is said to be trading at a forward discount to the base currency (USD). A forward discount indicates that the\nprice currency is expected to depreciate relative to the base currency, such that it will take more units of the price currency to buy one unit of the\nbase currency.\n(Choice B) Forward points of 811 result from switching the numerator and denominator in the forward rate formula. While the points are\nincorrectly calculated, positive points do indicate the price currency is trading at a forward discount.\n(Choice C) Forward points of −823 result from incorrectly subtracting the forward rate from the spot rate and then multiplying by 10,000.\nNegative forward points do indicate the price currency is trading at a forward premium, but that is not the case here.\nThings to remember:\nWhen risk-free interest rates for two countries are different, the forward rates for their currencies must be priced to prevent arbitrage profit. When\nthe forward rate is higher than the spot rate, the price currency is said to be trading at a discount. Forward points are calculated as (forward rate −\nspot rate) × 10,000.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 141, "q": "The CAD/USD spot rate is 0.7191 and the one-month forward rate is 0.7131. Based on this information, the one-month forward points are closest to:", "opts": ["−83", "−60", "60"], "ans": "B", "expl": "Forward exchange rates are currency exchange rates for transactions that will occur in the future. In this question, the one-month CAD/USD\nforward rate of 0.7131 indicates that one month from today, one party will pay CAD 0.7131 in exchange for USD 1.0000. Except for the Japanese\nyen (JPY), the spot rate of all major currencies is quoted to 4 decimal places (ie, ten-thousandth of a percent).\nThe convention in the foreign exchange market is to express the forward rate as a number of points (ie, pips) added to the spot rate. In this\nquestion:\nForward points = (0.7131 − 0.7191) × 10,000\n= −0.0060 × 10,000 = −60 points\nNote that the spot rate is subtracted from the forward rate to find the difference between them; therefore:\nif forward rate < spot rate, the points are negative, and\nif forward rate > spot rate, the points are positive.\nTo convert the rate to forward points, multiply the difference by 10,000.\n(Choice A) The −83 amount results from incorrectly dividing the forward points by the spot rate before multiplying by 10,000.\n(Choice C) The forward points should be negative since, in this case, forward rate < spot rate.\nThings to remember:\nA forward rate may be expressed as a number of points (ie, pips) added to the spot rate. The forward points of all currencies (except JPY) are\ncalculated as: (Forward rate − Spot rate) × 10,000. If forward rate < spot rate, the points are negative, and if forward rate > spot rate, the points\nare positive.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 142, "q": "An analyst gathers the following spot exchange rate quotes: MXN/USD 20.6558 USD/JPY 0.008770 JPY/MXN 5.5502 The analyst's most appropriate conclusion is that the MXN is:", "opts": ["undervalued versus JPY.", "fairly valued versus JPY.", "overvalued versus JPY."], "ans": "C", "expl": "A cross rate is an implied exchange rate between two currencies that is derived from quoted exchange rates. The cross rate for any pair of\ncurrencies is obtained by multiplying two quoted exchange rates, each containing one of the currencies from the pair and a common\ncurrency (eg, USD). If the cross rate between two currencies does not equal the quoted exchange rate between them, the currencies are not\nfairly valued versus each other.\nIn this scenario, the cross rate between MXN and JPY is calculated as follows:\nSince the quoted rate is expressed as JPY/MXN, the cross rate must be inverted:\nAs expressed, JPY is the price currency and MXN is the base currency. Based on their cross rates relative to USD, it should take less JPY to buy\nMXN 1 than indicated by the current JPY/MXN spot exchange rate (5.5502). Therefore, since MXN 1 is worth more JPY 1 in the spot market than\nat the cross rate, MXN is overvalued versus JPY at the quoted exchange rate between them (Choices A and B).\nThings to remember:\nA cross rate is an implied exchange rate between two currencies obtained by multiplying the exchange rates for both currencies against a common\ncurrency. In a currency pair, the base currency is undervalued (overvalued) in the currency market if it buys fewer (more) units of the price\ncurrency at their quoted exchange rate that at the cross rate between them.\nCalculate and interpret currency cross-rates\n17. When the price currency is trading at a forward premium to the base currency, it is most likely that the:\nA. forward points are positive.\n\nB. price currency is expected to appreciate against the base currency.\nC. interest rate for the price currency is higher than for the base currency.\nExplanation\nWhen the risk-free interest rates for two countries differ, the forward exchange rate between their currencies will differ from the spot (ie, current)\nexchange rate. A foreign exchange quote specifies the amount of price currency that can be acquired for each unit of base currency. When the\nforward rate is:\nless than the spot rate, the price currency is trading at a forward premium to the base currency.\ngreater than the spot rate, the price currency is trading at a forward discount to the base currency.\nA forward premium signals that market participants expect the price currency to appreciate relative to the base currency: in the future, one unit\nof base currency will buy less price currency than it does today since the price currency has become more valuable than the base currency. A\nforward discount signals that the price currency is expected to depreciate relative to the base currency.\n(Choice A) When the price currency is trading at a forward premium, the forward rate is less than the spot rate and the forward points are\nnegative.\n(Choice C) When the price currency is trading at a forward premium, its interest rate must be less than the base currency's interest rate. The\ncurrency with the lower interest rate trades at a forward premium.\nThings to remember:\nForward rates reflect expectations of future currency values based on interest rates: when the risk-free interest rates of two countries are different,\nthe forward exchange rate will differ from the spot rate. When the forward rate is lower than the spot rate, it signals that market participants expect\nthe price currency to appreciate against the base currency.\nExplain the arbitrage relationship between spot and forward exchange rates and interest rates, calculate a forward rate using points or in\npercentage terms, and interpret a forward discount or premium", "qhtml": null}, {"n": 143, "q": "When the price currency is trading at a forward premium to the base currency, it is most likely that the:", "opts": ["forward points are positive.", "price currency is expected to appreciate against the base currency.", "interest rate for the price currency is higher than for the base currency."], "ans": "B", "expl": "When the risk-free interest rates for two countries differ, the forward exchange rate between their currencies will differ from the spot (ie, cu
