ds, so increased government spending is an expansionary\nfiscal policy.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 67, "q": "Which of the following monetary policy actions is most likely expansionary?", "opts": ["Selling government securities through open market operations", "Lowering the policy rate to a level below the neutral interest rate", "Raising reserve requirements to reduce the amount of excess reserves"], "ans": "B", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nExpansionary monetary policies encourage more rapid growth of GDP by stimulating economic activity, including business and consumer\ninvestment and consumption. Since businesses borrow to invest in additional plant and equipment and consumers borrow to increase purchases\nof goods and services, policies that stimulate lending and borrowing are expansionary.\nA policy rate (ie, official interest rate or official policy rate) is the interest rate a central bank charges when it lends money to commercial banks.\nSetting the policy rate below a neutral rate of interest means the central bank is attempting to increase the real GDP growth rate by:\nreducing the cost of borrowing from the central bank, which encourages commercial banks to use additional reserves to make loans,\nincreasing the supply of available credit; and\nlowering borrowing rates generally since commercial bank base lending rates are often tied to the policy rate, stimulating demand for credit.\nSince this policy leads to increased lending and borrowing and should stimulate economic growth, it is expansionary.\n(Choice A) When central banks sell government securities, they reduce bank reserves since commercial banks pay for the securities using\nreserves. This discourages lending and borrowing and slows GDP growth; therefore, it is a contractionary monetary policy.\n(Choice C) Raising the reserve requirement to reduce excess reserves inhibits commercial banks' ability to make loans; therefore, it is not an\nexpansionary policy.\nThings to remember:\nLowering the policy rate below the neutral interest rate is an expansionary monetary policy. A lower policy rate encourages commercial banks to\nincrease reserves by borrowing from the central bank. The additional reserves are used to make loans, which results in increased consumption\nand investment, leading to higher rates of GDP growth.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 68, "q": "If the inflation rate is expected to rise above a central bank's inflation target, that central bank's most appropriate action would be to:", "opts": ["increase the policy rate above the neutral rate.", "buy government bonds from commercial banks.", "lower the reserve requirement for commercial banks."], "ans": "A", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nCentral banks have different primary policy objectives, but one common goal is price stability. Central banks attempt to achieve this stability by\ninfluencing money supply levels with one or more monetary policy tools. When a central bank expects inflation to rise above the target, it\nwould most appropriately seek to curb inflation by implementing a contractionary monetary policy.\nTo accomplish this, the central bank can target an increase in commercial banks' lending rates by increasing its policy rate above the neutral\nrate. Commercial banks tend to base their lending rates on the policy rate plus a spread. Therefore, a higher policy rate would cause those banks\nto either raise their lending rates or accept lower margins, thus discouraging lending and borrowing. Less supply and demand for business and\nconsumer loans would slow capital expenditures and consumption. In theory, these effects should lower inflationary pressures.\n(Choice B) Buying government bonds from commercial banks is an expansionary monetary policy that gives those banks more excess reserves\nto lend. This policy would be inappropriate if the goal is to reduce inflationary pressures.\n(Choice C) Lowering the reserve requirement for commercial banks encourages those banks to lend more money. This expansionary monetary\npolicy would be inappropriate if the goal is to reduce inflationary pressures.\nThings to remember:\nA central bank's policy rate is the interest rate it charges when lending money to commercial banks. If a central bank expects inflation to rise\nabove its target, it can increase the policy rate above the neutral rate with the goal of reducing inflationary pressures by increasing commercial\nbanks' lending rates.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 69, "q": "When the central bank sells securities to banks via open market operations, which of the following is the most likely result?", "opts": ["An increase in bank reserves", "A decrease in base lending rates", "A decrease in banks' capacity to lend"], "ans": "C", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nCentral banks use monetary policy tools to manage the money supply and achieve price stability.\nWhen the economy is growing too fast and inflation is high, central banks will enact contractionary policies to reduce the money supply to\nmoderate growth and inflation.\nWhen the economy is slow and inflation is low, central banks will enact expansionary policies to increase the money supply to accelerate\ngrowth and inflation.\nOpen market operations involve the central bank buying (selling) securities from (to) banks or market makers. Selling securities to banks is a\ncontractionary tactic. Bank reserves are reduced when commercial banks buy securities as the central banks sells securities (Choice A); in\neffect, the central bank has taken money out of circulation. Since bank reserves are lower, banks are less willing and/or able to extend loans,\nreducing the money supply.\n(Choice B) Base lending rates used by banks are directly tied to the central bank policy rate and not related to open market operations.\nThings to remember:\nOpen market operations involve the central bank buying (selling) securities from (to) banks or market makers. Selling securities to banks is a\ncontractionary tool that decreases bank reserves and the money supply. Buying securities from banks is an expansionary tool that increases bank\nreserves and the money supply.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 70, "q": "Most central banks with an inflation-targeting policy aim for an inflation rate of about 2%. Which of the following best describes a reason why this level has become the prevailing standard? ", "opts": ["A lower rate would risk deflation", "To adhere to a neutral policy rate", "To keep the country's borrowing costs low"], "ans": "A", "expl": "Features of successful central bank inflation-targeting policy\nCentral bank independence and transparency\nPolicy decisions based on a wide range of financial and economic considerations\nAn inflation target high enough to avoid deflation but low enough to achieve price stability\nInflation targeting is the most widely implemented central bank monetary policy framework used to achieve price stability. Broadly speaking,\nmonetary policy is a blunt tool that influences the economy and inflation to varying degrees and with lagged effects.\nWith inflation targeting, the central bank's goal is to maintain an inflation rate low enough to avoid destabilizing inflation yet high enough to\navoid the risk of deflation. Since it is not possible to precisely calibrate monetary policy to achieve an ideal inflation rate—consistently positive\nand just above zero—the prevailing preference among central banks has settled around a 2% inflation target as the optimum policy level.\n(Choice B) The neutral policy rate is the monetary policy rate that maintains the existing state of economic growth. The neutral policy rate equals\nthe economy's real trend rate of growth plus long-run inflation rate expectations.\n(Choice C) Keeping the government's interest costs low is not a stated objective of monetary policy for any of the world's major central banks.\nThings to remember:\nInflation targeting is the most widely implemented central bank monetary policy framework used to achieve price stability. A 2% inflation target is\nviewed as the optimum policy level since it is far enough above zero to avoid deflation but low enough to avoid destabilizing high inflation.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 71, "q": "If a monetary system has a fractional reserve banking system and the central bank changes the reserve requirement from 10% to 12%, it is most likely that: ", "opts": ["the money multiplier decreases.", "money supply growth increases.", "interest rates on bank deposits decrease."], "ans": "A", "expl": "With a fractional reserve banking system, banks keep only a portion (ie, fraction) of deposits as reserves and make loans with the excess. The\nminimum reserve requirement is most often set by the central bank and is one of three primary tools of monetary policy. In theory, the smaller\n(larger) the reserve requirement, the more (less) excess there is to be lent out and circulated in the economy, increasing (decreasing) the money\nsupply and stimulating (contracting) spending and economic growth.\nThe money multiplier is a measure of the inverse effect of the reserve requirement on the money supply, defined as 1 ÷ reserve requirement.\nFor example, a reserve requirement of 10% results in a money multiplier of 10. Each deposit in excess of the reserve requirement is multiplied as\nit is loaned and deposited multiple times, each time as a fraction of the initial deposit. Therefore, as the reserve requirement increases\n(decreases), the money multiplier decreases (increases), resulting in slower (faster) money supply growth (Choice B).\n(Choice C) Interest rates on bank deposits are primarily a function of the central bank's policy rate, not the reserve requirement.\nThings to remember:\nBanks are required to hold reserves equal to a fraction of their deposits; this is known as the reserve requirement. The money multiplier is a\nmeasure of the inverse effect of the reserve requirement on the money supply, defined as 1 ÷ reserve requirement.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 72, "q": "When the commercial banking system holds significant excess reserves, which of the following central bank actions is most likely to affect commercial banks' base lending rates? ", "opts": ["Changing the official policy rate", "Changing the reserve requirement", "Buying or selling securities in the open market"], "ans": "A", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nA policy rate (or official interest rate or official policy rate) is the rate at which a central bank lends to commercial banks. Policy rates are\nadjusted to influence interest rates throughout the economy and affect economic activity.\nSince the policy rate is the cost of obtaining reserves from the central bank, commercial banks often tie base lending rates to the central bank\npolicy rate. Therefore, commercial banks usually increase their base lending rate when a central bank increases its policy rate. Base lending\nrates are reference rates for setting loan interest rates for different types of clients (eg, large corporations: Base lending rate + 0.50%; privately\nheld small businesses: Base lending rate + 3.00%).\nSince changing reserve requirements and buying or selling securities affects reserves, such policy actions by central banks are less likely to\nimpact base lending rates when there are already significant excess reserves and therefore ample capacity to make loans and expand the money\nsupply (Choices B and C).\nThings to remember:\nA policy rate is the rate at which a central bank lends to commercial banks. Since the policy rate is the cost of obtaining reserves from the central\nbank, commercial banks often tie their base lending rates to the central bank policy rate.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 73, "q": "A demand curve for money is depicted in the graph below: Which of the following best explains the shape of the curve between M and M ? 0 1 ", "opts": ["Liquidity trap", "Policy rate of zero", "Neutral rate of interest"], "ans": "A", "expl": "There are limits to the effectiveness of monetary policy. This is often true in a deflationary environment when the demand curve for money\nbecomes horizontal (ie, infinitely elastic), as shown in the graphs above. A liquidity trap occurs when the quantity of money continues to expand\nbut fails to lower interest rates since economic agents would rather hold cash than borrow or lend. At this point, monetary policy stops\nstimulating economic activity and loses its effectiveness.\nA central bank's monetary policy tools depend on others to implement them. For example, a central bank can lower interest rates or reduce\nreserve requirements but cannot force anyone to borrow or lend. A liquidity trap is an example of such ineffectiveness.\nThe economist John Maynard Keynes is credited with coining the phrase \"pushing on a string\" to describe the limitations of monetary policy. It is\neasy to visualize how pulling on a string can bring something closer and how pushing on a string has no effect since it crumples and goes\nnowhere. In a liquidity trap, the central bank is effectively \"pushing on a string.\"\n(Choice B) Central bank policy is not constrained by the zero boundary; policy rates can and have been negative. The demand for money does\nnot necessarily stagnate at a zero-bound policy rate.\n(Choice C) The neutral rate of interest is the central bank's policy rate that neither slows nor accelerates economic activity and is not specifically\nassociated with the money demand curve.0\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 74, "q": "Quantitative easing is operationally similar to which monetary policy tool?", "opts": ["Changing the reserve requirement", "Conducting open market operations", "Increasing or decreasing the policy rate"], "ans": "B", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nQuantitative easing (QE) is operationally equivalent to buying securities through open market operations. QE is pursued after other\nexpansionary policies (eg, decreasing interest rates) have failed to return the economy to its potential growth rate. QE is intended to prevent a\nrecession from becoming a depression. The differences between open market operations and QE are the scale of the purchases, the types of\nsecurities purchased, and the sellers.\nIn the aftermath of the 2008 financial crisis, QE purchases were of unprecedented magnitude (multiple trillions of USD or similar values of EUR,\nGBP, and JPY). Furthermore, whereas open market operations normally dealt in short-term government securities, QE purchases were often\nlong-term government securities and securities of other issuers (eg, corporate bonds). Also, many sellers were not from the usual group of banks\nand market makers.\n(Choices A and C) Neither changing the reserve requirement nor adjusting the policy rate (also called the official interest rate or official policy\nrate) requires central banks to trade securities; therefore, neither is operationally similar to QE.\nThings to remember:\nQuantitative easing (QE) is operationally equivalent to buying securities through open market operations at a much larger scale. QE is undertaken\nwhen other expansionary policies have failed to return the economy to its potential growth rate and extraordinary measures are required. QE is\nenacted to prevent an already weak economy from weakening further.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 75, "q": "Large open market purchases of government securities by a central bank are used to decrease:", "opts": ["real GDP growth rates.", "domestic inflation rates.", "domestic currency's exchange value."], "ans": "C", "expl": "Monetary policy actions are typically used to affect one or more of the following domestic economic variables: GDP growth, inflation, interest rates,\nand/or currency value. Monetary policies are either:\nexpansionary, which are typically used to increase economic growth when it is below potential GDP or when the economy is in recession, or\ncontractionary, which are typically used to reduce inflation expectations and often accompanied by policies that reduce expected GDP\ngrowth rates.\nA policy of central bank open market purchases of securities is an expansionary policy. Such purchases increase commercial bank reserves,\nin turn leading to an increase in the money supply. All else equal, this causes domestic interest rates to decrease and investors to invest in\ncurrencies with relatively higher interest rates, resulting in a decrease in the domestic currency's exchange value.\n(Choices A and B) Open market security purchases are indicative of an expansionary monetary policy, which would be used to increase GDP\ngrowth rates and put upward pressure on domestic inflation.\nThings to remember:\nA policy of central bank open market purchases is an expansionary policy that results in a money supply increase and lower domestic interest\nrates. All else equal, this causes investors to invest in currencies with relatively higher interest rates, resulting in a decrease in the domestic\ncurrency's exchange value.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 76, "q": "Which of the following is least accurate regarding monetary policy tools?", "opts": ["Bank reserve requirements are independent of the central bank policy rate.", "Banks typically increase base rates when the central bank increases the policy rate.", "Bank reserve requirements increase when the central bank buys securities from banks."], "ans": "C", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nCentral banks use monetary policy tools to manipulate the money supply to achieve price stability. When the economy is growing too fast and\ninflation is high, central banks will enact contractionary policies to reduce the money supply to moderate growth and inflation. When the economy\nis growing slowly and inflation is muted, central banks will enact expansionary policies to increase the money supply to accelerate growth.\nCentral banks use open market operations (ie, buying [selling] of securities from [to] banks) to manipulate the amount of bank reserves. Banks\nreserves increase when the central bank buys securities from banks. Conversely, bank reserves decrease when central banks sell securities.\nNote that the open market operations change the amount of bank reserves, and not the bank reserve requirement.\n(Choice A) The bank reserve requirement and the central bank's policy rate are two separate monetary policy tools for influencing the amount of\nloanable money.\n(Choice B) Central banks will typically lend to banks at the policy rate. When policy rates change, banks will adjust their own base lending rates\naccordingly.\nThings to remember:\nCentral banks use monetary policy tools to manipulate the money supply to achieve price stability. The three tools are open market operations,\nthe policy rate, and reserve requirements. Central banks buy and sell securities to banks in the open market to manage the money supply.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 77, "q": "A country pursues tight fiscal policy and easy monetary policy for several years. Which of the following are the most likely consequences for the size of the public and private sectors relative to the country's GDP?", "opts": ["Larger public sector and smaller private sector", "Smaller public sector and larger private sector", "No change in their relative sizes as both sectors would be equally affected"], "ans": "B", "expl": "Economic activity is divided between the public sector (eg, government bureaucracy, the military) and private sector (eg, businesses, consumers).\nThe private sector accounts for the bulk of economic activity in most countries. However, the public sector accounts for a significant portion of\nGDP in most developed economies. Since monetary policy and fiscal policy impact the economy through different channels, the specific policy\nmix may impact the two sectors differently.\nTight fiscal policy (eg, lower government spending) may result in slower growth, if not outright shrinkage, of the public sector. Easy monetary\npolicy (eg, increased open market purchases) likely causes lower interest rates, stimulating expansion of the private sector through more\nconsumer spending and business investment. The mix of tight fiscal and easy monetary policy usually results in the private sector accounting for\na larger proportion of GDP and the public sector a smaller proportion (Choices A and C).\nThings to remember:\nThe relative sizes of the public and private sectors can be impacted by the specific mix of monetary and fiscal policies. Tight fiscal policy likely\nresults in slower growth of the public sector. Easy monetary policy likely stimulates expansion of the private sector through more consumer\nspending and business investment.\nExplain the interaction of monetary and fiscal policy", "qhtml": null}, {"n": 78, "q": "Which of the following is least likely a function of a central bank?", "opts": ["Regulate the payment system", "Determine infrastructure spending", "Manage foreign exchange and gold reserves"], "ans": "B", "expl": "Typical roles of central banks\nMonetary roles Banking roles\nAct as lenders of last resort\nManage money supply\nOversee the banking system\nImplement monetary policy\nRegulate the payment system\nManage foreign exchange and gold reserves\nServe as government's and bankers' bank\nFiscal policy (ie, government management of expenditures and receipts to affect economic growth) is executed by governments, not central\nbanks. Infrastructure spending is a fiscal policy tool used to provide public goods (eg, hospitals, schools) and stimulate economic activity.\nCentral banks are responsible for monetary and banking functions. For example, central banks manage foreign currency and gold reserves by\nbuying/selling as needed to maintain liquidity and stabilize national currency (Choice C). In addition, central banks regulate payment processing\nsystems to ensure efficient financial transactions (Choice A).\nThings to remember:\nInfrastructure spending is a fiscal policy tool used by governments, not central banks. Central banks are responsible for monetary policy activities\nand oversight of banking functions.\nDescribe the roles and objectives of central banks", "qhtml": null}, {"n": 79, "q": "Which of the following factors may limit the impact of expansionary monetary policy in a deflationary economy?", "opts": ["Short-term interest rates cannot be reduced to 0% by central banks.", "Central bank policy may fail to induce banks to increase lending activity.", "Central bank open market operations may be unable to sufficiently expand bank reserves."], "ans": "B", "expl": "Monetary policy impacts the real economy indirectly. Central banks attempt to influence the direction of the real economy by manipulating bank\nreserves. Expansionary monetary policies create excess bank reserves with the intent of expanding the money supply, resulting in lower\ninterest rates and more rapid GDP growth.\nThe money supply expands only if the banks use the reserves to make loans. However, banks must expect to profit from making a loan.\nFurthermore, businesses normally borrow only if the loan proceeds can be profitably invested. A weak economy undermines the incentives of both\nborrowers and lenders. The inability of central banks to induce more lending activity can impede the transmission of monetary policy actions to the\nreal economy.\n(Choice A) Interest rates can be reduced below 0%. Several major central banks (eg, Bank of Japan, European Central Bank) have pursued\npolicies resulting in negative short-term interest rates.\n(Choice C) Independent central banks generally face no limits on their ability to create excess reserves through open market purchases. The US\nFederal Reserve created trillions of dollars of bank reserve in the attempt to foster economic recovery after the financial crisis of 2008.\nThings to remember:\nAn expansionary monetary policy increases bank reserves, but the money supply is expanded only if banks use the additional reserves to make\nmore loans. A weak economy reduces the incentives of both borrowers and lenders. Central banks' inability to induce more lending dampens the\nimpact of expansionary monetary policy.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 80, "q": "Which of the following most likely limits a central bank's ability to implement effective expansionary monetary policy? The central bank is unable to:", "opts": ["reduce the policy interest rate below the neutral rate.", "increase the amount of excess reserves held by commercial banks.", "increase businesses and consumers' willingness to hold bank deposits."], "ans": "C", "expl": "In a system of fractional reserve banking, banks hold reserves to back their deposits. Central banks directly control commercial bank reserves but\nnot the money supply. To increase the money supply, the usual transition mechanism for expansionary monetary policy is:\ncentral banks create excess bank reserves by\nbuying securities through open market operations or\nreducing reserve requirements for commercial banks;\ncommercial banks use their excess reserves to make loans;\nborrowers use loan proceeds to make payments; and\nrecipients of the payments deposit the money into their banks.\nThe increase in deposits increases the money supply.\nHowever, the effectiveness of expansionary policy may be limited by businesses' and consumers' unwillingness to hold money in bank\ndeposits (eg, when interest rates are low). Furthermore, money in deposits is exposed to the bank's credit risk, which may in turn cause\nwithdrawals from the bank. This reduces the money supply and limits the effect of the expansionary policy.\n(Choices A and B) Central banks face few limits on setting policy rates or creating excess reserves. Central banks can pursue these policies to\nthe extent they deem appropriate, so the inability to reduce the policy rate or increase excess bank reserves are not impediments to pursuing\nexpansionary policies.\nThings to remember:\nCentral banks face few limits on reducing policy rates or creating excess reserves. A major constraint on expansionary monetary policy is central\nbanks' inability to control businesses' and consumers' willingness to hold bank deposits.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 81, "q": "Which of the following is least likely a transmission mechanism of central bank policy?", "opts": ["Gold prices", "Asset prices", "Exchange rates"], "ans": "A", "expl": "One of a central bank's fundamental roles is implementing policies that promote price stability. Long-term price stability is achieved largely by\nestablishing long-term inflation expectations through monetary policy tools that first affect the money supply.\nIn turn, those effects are spread through the economy by monetary transmission mechanisms, including the following:\nShort-term interest rates\nAsset prices (eg, stocks, housing)\nExchange rates\nExpectations and confidence of economic agents (eg, individuals, firms, governments)\nMonetary transmission mechanisms spread policy changes through the economy, affecting prices and ultimately the level of inflation\n(Choices B and C).\nIndependence and transparency enhance a central bank's credibility. After establishing its credibility with the financial markets and economic\nagents, the central bank can more effectively steer long-term inflation expectations through policy actions since the transmission mechanisms\nreact in expected ways, creating a mutually beneficial feedback loop.\nThings outside the scope of a central bank's influence that are not considered transmission mechanisms include fiscal policy, commodity (eg, gold)\nprices, and economic agents' willingness to borrow or lend.\nThings to remember:\nMonetary transmission mechanisms, including short-term interest rates, asset prices, exchange rates, and the expectations and confidence of\neconomic agents, spread policy changes through the economy.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 82, "q": "All else being equal, which of the following central bank actions is most appropriate to reduce interest rates?", "opts": ["Sell government securities", "Reduce reserve requirements", "Increase prudential regulation of banks"], "ans": "B", "expl": "Reserves are funds that banks hold to meet customer withdrawals. Central banks usually set minimum reserve requirements, sometimes to\nmaintain bank solvency but often as a monetary policy tool. Supply and demand for money determines interest rates. Lowering the reserve\nrequirement creates excess reserves. Banks use the additional reserves to make loans, resulting in an expansion of the money supply.\nIncreases in the money supply should put downward pressure on interest rates.\n(Choice A) The sale of government securities by a central bank is a contractionary monetary policy and is likely to put upward pressure on\ninterest rates.\n(Choice C) Prudential regulations are rules designed to protect bank customers. Although central banks have a role in banking regulation in\nmany countries, prudential regulation is not a monetary policy tool.\nThings to remember:\nA reduction in the reserve requirement creates excess reserves in the banking system. Banks will likely use the excess reserves to make\nbusiness and consumer loans; loans that lead to an increase in the money supply, and a larger money supply puts downward pressure on interest\nrates.\nDescribe tools used to implement monetary policy tools and the monetary transmission mechanism, and explain the relationships between\nmonetary policy and economic growth, inflation, interest, and exchange rates", "qhtml": null}, {"n": 83, "q": "Which of the following central bank actions is most likely considered expansionary monetary policy?", "opts": ["Reducing the reserve requirement", "Selling government bonds through open market operations", "Holding the policy rate constant as the neutral rate falls below it"], "ans": "A", "expl": "Monetary policy tools\nTool Description Expansionary Contractionary\nOpen market operations Trade securities (usually government securities) Buy securities Sell securities\nPolicy interest rate Set interest rate used to signal markets Lower Raise\nReserve requirements Set percentage of bank deposits held in reserves Decrease Increase\nExpansionary monetary policies are used to increase economic growth during periods of decline (eg, when output is below potential GDP). For\nexample, a central bank can implement an expansionary policy of increasing excess reserves in the commercial banking system by:\nmaking open market purchases,\nreducing reserve requirements, which turns some required reserves into excess reserves, or\nreducing the policy interest rate, which reduces the costs banks incur when borrowing reserves.\nExcess reserves encourage increased lending since banks can earn higher returns by making loans than by holding reserves. This expands the\nmoney supply and lowers interest rates, leading to growth in borrowing, investment, and consumption, and thus an expanded GDP.\n(Choice B) A central bank conducts open market sales to reduce its holdings of government bonds when implementing a contractionary monetary\npolicy. Commercial banks use reserves to purchase the bonds, which contracts the money supply.\n(Choice C) A central bank holds its policy interest rate constant as the neutral rate of interest falls below the policy rate in order to tighten credit\nconditions. This inaction by a central bank is contractionary, not expansionary.\nThings to remember:\nExpansionary monetary policies are used to increase economic growth. Reducing reserve requirements creates excess reserves, leading to\nexpansion of the money supply and lower interest rates. Lower interest rates result in increased borrowing, investment, and consumption, and\nthus an expanded GDP.\nDescribe qualities of effective central banks; contrast their use of inflation, interest rate, and exchange rate targeting in expansionary or\ncontractionary monetary policy; and describe the limitations of monetary policy", "qhtml": null}, {"n": 84, "q": "Reduction in energy costs due to displacement of gasoline cars is most likely a type of:", "opts": ["event risk.", "thematic risk.", "exogenous risk."], "ans": "B", "expl": "Geopolitical risks\nType Description\nKnown event date, unknown event outcome\nEvent risk\n(eg, political election, new legislation)\nUnanticipated event (eg, sudden uprisings, impact\nExogenous risk\nfrom natural disasters)\nKnown risks that evolve over time (eg, displacement\nThematic risk\nof fuel vehicles, rise of political factions)\nGeopolitical risks can have major impacts on investment returns globally and can be identified as different risk types: event risk, exogenous risk,\nand thematic risk. Analysts often model such risks as a part of their investment decision-making process.\nThematic risks arise from events that evolve over a long period of time, such as climate change, rising political trends, and technological\ninnovation. For example, the reduction in energy costs due to the displacement of gasoline cars is a thematic risk. This phenomenon may\nbe driven by the gradual passage of climate-friendly regulations and may negatively affect major oil-producing economies.\nEvent risk describes the uncertain outcome of an event that will occur on a known date. For example, the date of a US presidential election\nis known, but the winner is unknown until the event occurs (Choice A).\nExogenous risk describes sudden or unanticipated geopolitical risk. One example is the aftermath of a sudden natural disaster, such as the\nMount St. Helens eruption in 1980, which caused significant environmental harm in parts of the US and Canada (Choice C).\nThings to remember:\nGeopolitical risks can be identified as different types: event risk, exogenous risk, and thematic risk. Event risk describes the uncertain outcome of\na known event. Exogenous risk describes the risk from an unanticipated event. Thematic risk refers to risks that evolve over a long period of time.\nDescribe geopolitical risk", "qhtml": null}, {"n": 85, "q": "Which of the following is least likely a reason for a country to cooperate with its neighbors? The country lacks:", "opts": ["economic resources.", "trade protections for domestic producers.", "national security and defense capabilities."], "ans": "B", "expl": "Motivations for political cooperation\nProtect against external threats\nNational security or\nAccess vital resources that are scarce or unavailable\nmilitary interest\ndomestically\nSecure essential resources through trade\nEconomic interest Standardize international production and/or trading\nprotocols to achieve fairness\nCultural considerations Promote cultural exchange to strengthen international ties\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries.\nFor example, if a country lacks protections for its domestic producers from foreign competition, it may be motivated to cooperate less with\nforeign countries by imposing tariffs that favor domestic purchases over foreign purchases.\n(Choice A) A country lacking vital economic resources is likely to cooperate with other countries to gain access to such resources at favorable\nterms.\n(Choice C) A country lacking national security and defense capabilities is likely to cooperate with other countries to prevent and/or mitigate\nmilitary threats.\nThings to remember:\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries to promote its own wellbeing.\nDescribe geopolitics from a cooperation versus competition perspective", "qhtml": null}, {"n": 86, "q": "A country will most likely seek geopolitical cooperation if it:", "opts": ["has a strong military supported by advanced technology.", "possesses a seaport that acts as a center for global trade.", "engages in many large cross-border financial transactions."], "ans": "C", "expl": "Motivations for political cooperation\nProtect against external threats\nNational security or\nAccess vital resources that are scarce or unavailable\nmilitary interest\ndomestically\nSecure essential resources through trade\nEconomic interest Standardize international production and/or trading\nprotocols to achieve fairness\nCultural considerations Promote cultural exchange to strengthen international ties\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries to promote its own wellbeing.\nStandardization is a form of cooperation that refers to standardizing protocols pertaining to cross-border trade and capital flows among\ncountries. In this scenario, a country is likely to cooperate with other countries in following standardized protocols for large cross-border financial\ntransactions. Doing so will help promote cross-border economic prosperity when all parties follow the same rules of engagement for conducting\nbusiness.\n(Choice A) When considered by itself, having a strong military does not provide incentive for a country to cooperate more with others. However,\na country with a weak military has incentive to cooperate with others to avoid the need for national defense.\n(Choice B) When considered by itself, a country with a seaport that facilitates global trade is not incentivized to cooperate with other countries. A\nlandlocked country without international hubs has incentive to cooperate with other countries in order to obtain resources more easily.\nThings to remember:\nStandardization is a form of cooperation that refers to standardizing protocols pertaining to cross-border trade and capital flows among countries.\nStandardization helps promote cross-border economic prosperity when all parties follow the same rules of engagement for conducting business.\nDescribe geopolitics from a cooperation versus competition perspective", "qhtml": null}, {"n": 87, "q": "A country is experiencing economic difficulties due to persistent, large balance-of-trade deficits. The most appropriate organization to assist that country is the:", "opts": ["World Bank Group (World Bank).", "World Trade Organization (WTO).", "International Monetary Fund (IMF)."], "ans": "C", "expl": "The International Monetary Fund (IMF) engages in the broadest range of activities compared to the other international organizations. The IMF's\nresponsibilities fall into four main categories: addressing international monetary problems; facilitating growth of trade and poverty reduction;\nsupporting exchange rate stability; and lending foreign exchange to address balance of payments problems.\nIMF loans are temporary and are not considered foreign aid or a source of long-term funding. Loans are made only with adequate safeguards (ie,\nsenior creditor status) and only after countries have filed a plan with the IMF to resolve their difficulties.\n(Choice A) The World Bank Group (World Bank) is primarily involved (through affiliate organizations) in long-term lending to facilitate economic\ndevelopment in developing countries. The World Bank also provides advice and analysis to foster economic and social improvements. It does not\ndirectly assist in resolving problems due to trade imbalances.\n(Choice B) The World Trade Organization (WTO) fosters global trade through a variety of means. It administers bilateral and multilateral trade\nagreements as well as related dispute resolution. The WTO seeks to reduce tariffs and non-tariff barriers to trade. It does not help resolve\nproblems involving trade imbalances.\nThings to remember:\nThe International Monetary Fund makes foreign exchange loans to countries experiencing balance of payments problems. IMF loans are\nextended under very strict guidelines and are intended as temporary funding, not as foreign aid or a source of long-term financing.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null}, {"n": 88, "q": "Three geopolitical risks may affect a country's investment returns: Event Risk Likelihood Velocity Impact Size Impact Breadth A High High Moderate Discrete B Moderate High High Broad C High Medium Low Broad Within the context of a country's investment returns, based on only the above information, which event warrants the highest level of risk assessment?", "opts": ["Event A", "Event B", "Event C"], "ans": "B", "expl": "Event risk Likelihood Velocity Impact size Impact breadth\nA High High Moderate Discrete\nB Moderate High High Broad\nC High Medium Low Broad\nAnalysts evaluate geopolitical risks to gauge their potential impact on investment returns. To do so, an analyst collectively assesses an event's:\nLikelihood (ie, probability of the event)\nVelocity of the impact (ie, how quickly the event may impact investment returns)\nSize and nature of the impact (ie, how large the impact may be, and its overall reach)\nIn this scenario, Event B poses the most significant risk. Even though it has only a moderate probability of occurring, its impact on the country's\neconomy will be fast, intense, and broad-based if it occurs. As an example, pandemics do not occur frequently, but when a pandemic occurs, its\ndisastrous impact on an economy will be swift.\n(Choice A) Although Event A has high probability and high velocity, its impact is moderate and discrete (ie, narrowly limited to one sector or to a\nfew sectors). Therefore, its threat is not as significant as Event B's.\n(Choice C) Compared with Event B, Event C has lower impact and takes longer to move the market.\nThings to remember:\nAnalysts evaluate geopolitical risks by assessing the likelihood of occurrence, velocity of impact, and size and nature of impact. Likelihood\nmeasures the probability of a risk's occurrence, velocity gauges how quickly the risk may impact portfolio returns, and size and nature measure the\nimpact's magnitude and breadth (eg, discrete sector versus overall economy).\nDescribe geopolitical risk", "qhtml": null}, {"n": 89, "q": "The growth in populism is most likely consistent with which type of geopolitical risk?", "opts": ["Event", "Thematic", "Exogenous"], "ans": "B", "expl": "Geopolitical risk types\nRisk Characteristics Examples\nSpecific date\nEvent Country elections\nKnown risk\nClimate change\nOngoing\nThematic Cyber threats\nKnown and evolving risk\nTerrorism\nSurprise Natural disaster\nExogenous\nUnknown risk Pandemic\nGeopolitical risk represents the risk from political changes, natural disasters, and other factors that affect international relations. Risks differ in\ntheir timing and predictability. Thematic risks are known and can remain present for an extended period as they evolve and change in scope or\nfrequency. Awareness of a thematic risk allows companies and investors to manage the risk through preparation.\nPopulism is a type of political movement and a known risk that continues evolving over time. Therefore, a growth in populism is a thematic\ngeopolitical risk and, as such, its potential effects can be incorporated by investors into their risk analysis.\n(Choice A) Event risks (eg, government elections) occur on specific dates that are known in advance. In contrast, political movements such as\npopulism develop over time and thus are not considered specific events.\n(Choice C) Exogenous risks involve surprising events that are often uncontrollable, whereas a political movement is a more predictable and\nongoing risk.\nThings to remember:\nThematic geopolitical risks are known and continue evolving and changing in scope or frequency over time. Awareness of thematic risks allows\ncompanies and investors to manage the risks through preparation. A growth in populism is considered a thematic geopolitical risk.\nDescribe geopolitical risk", "qhtml": null}, {"n": 90, "q": "A developing economy needs long-term financing to fund infrastructure improvements and facilitate general economic growth. According to its mission, which of the following organizations is most appropriate to provide the financing? ", "opts": ["World Bank Group (World Bank)", "International Monetary Fund (IMF)", "International Trade Organization (ITO)"], "ans": "A", "expl": "At the Bretton Woods Conference in 1944, three global organizations were created to facilitate economic activity:\nWorld Bank Group (World Bank),\nInternational Monetary Fund (IMF), and\nInternational Trade Organization (ITO).\nThe World Bank's primary mission is to facilitate economic and social development in emerging economies. The World Bank largely\naccomplishes its mission by providing long-term, low- or no-interest loans through the International Bank for Reconstruction and Development\n(IBRD) and the International Development Association (IDA), which are affiliated organizations. The World Bank also provides advice and analysis\nto foster economic and social improvements in developing countries.\n(Choice B) The IMF is primarily responsible for addressing international monetary problems to encourage economic growth and reduce poverty,\nsupporting exchange rate stability, and lending foreign exchange to address balance of payments problems.\n(Choice C) The ITO was never ratified by the United States and was replaced by the General Agreement on Trade and Tariffs (GATT) in 1948.\nGATT remained the international framework governing trade until 1995, when it was replaced by the World Trade Organization (WTO), whose\nmission is to facilitate trade.\nThings to remember:\nThe World Bank Group's (World Bank's) primary mission is to facilitate economic development in emerging economies. The World Bank largely\naccomplishes its mission by providing long-term, low- or no-interest loans; advice; and analysis to developing countries to foster economic and\nsocial improvements.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null}, {"n": 91, "q": "Which archetype of globalization and cooperation provides the greatest contrast to multilateralism?", "opts": ["Autarky", "Hegemony", "Bilateralism"], "ans": "A", "expl": "Globalization describes how companies, governments, and people transact across the world. Globalization involves some level of cooperation\nacross countries to promote the exchange of information, goods and services, technology, and jobs. In modern times, both state and non-state\nactors (eg, companies) are the drivers behind globalization to access resources, markets, and profits across borders.\nIn contrast, anti-globalization or nationalism is characterized by limited cooperation with other countries to promote a country's own self-interest.\nHistorically, nationalistic governments have practiced policies that at times negatively impacted other countries.\nMost countries can be labeled as an archetype that falls on the spectrum of globalization and cooperation. A country that practices multilateralism\n(eg, Singapore) is very cooperative and open to globalization. Multilaterally oriented countries typically adopt beneficial trade terms to facilitate\ninternational business. In contrast, autarky describes a country that adopts nationalistic policies and seeks self-sufficiency through limited trade\nand little cooperation.\n(Choice B) Hegemony describes countries that are open to globalization but less cooperative (eg, United States, Russia, China). Hegemonic\ncountries are often powerful global leaders who exert significant economic and political influence worldwide.\n(Choice C) Bilateralism is characterized by regionalism, where two countries cooperate with each other. Countries that practice bilateralism\ntypically have customized relationships with each partner.\nThings to remember:\nMost countries can be labeled as an archetype that falls on the spectrum of globalization and cooperation. Multilateral countries are very open to\nglobalization and cooperative; they typically adopt beneficial trade terms to facilitate international business. In contrast, autarky describes a\ncountry that adopts nationalistic policies and seeks self-sufficiency through little cooperation.\nDescribe geopolitics and its relationship with globalization", "qhtml": null}, {"n": 92, "q": "Which of the following best describes the mission of the World Trade Organization? The organization promotes:", "opts": ["the economic development of emerging economies through trade.", "exchange rate stability, leading to a greater willingness among countries to trade.", "free trade by providing the basic system of global trade rules and dispute resolution."], "ans": "C", "expl": "The World Trade Organization (WTO) came into existence in 1995, replacing the General Agreement on Tariff and Trade, which had regulated\ninternational trade for most of the prior 50 years. The WTO is the only global organization that provides a formal framework for international\ntrade. It primarily seeks to reduce tariffs and nontariff barriers to trade by fostering global trade through the administration of bilateral and\nmultilateral trade agreements, along with related trade dispute resolution.\n(Choice A) The World Bank Group's fundamental purpose is to assist in the economic development of emerging economies but not necessarily\nthrough trade.\n(Choice B) The International Monetary Fund is the organization that supports exchange rate stability to promote global growth and poverty\nreduction.\nThings to remember:\nThe World Trade Organization (WTO) is the only global organization that governs and regulates international trade. The WTO primarily seeks to\nreduce tariffs and nontariff barriers to trade by fostering global trade through the administration of bilateral and multilateral trade agreements, along\nwith related trade dispute resolution.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null}, {"n": 93, "q": "Country Z's government recently nationalized the country's largest steel-producing companies and generously compensated those companies' shareholders. This scenario best describes the use of a:", "opts": ["cooperative financial tool.", "noncooperative economic tool.", "noncooperative national security tool."], "ans": "B", "expl": "Geopolitical tools\nTool type Examples\nAlliances (eg, NATO)\nNational security Armed conflict\nEspionage\nMultilateral trade agreements (eg, NAFTA)\nEconomic\nNationalization\nFree exchange of currencies\nPermitting foreign investments\nFinancial\nReducing access to local currency markets\nLimiting foreign investments\nActors often use geopolitical tools to improve or strain relationships with other countries to achieve certain objectives. Generally, there are three\ntypes of tools: national security, economic, and financial. The positive (ie, cooperative) use of these tools can improve capital, labor, and economic\nflows across borders. In contrast, the negative (ie, noncooperative) use of such tools has the opposite effect and may heighten geopolitical risk\nand worsen investment returns.\nGovernments can apply economic tools to impact the level of cooperation with others globally. One cooperative tool is a multilateral trade\nagreement. For example, the North American Free Trade Agreement (NAFTA) was created to facilitate the cross-border exchange of goods and\nservices among Canada, the US, and Mexico.\nIn contrast, nationalization, which involves the state seizure of a private industry, is a noncooperative economic tool. For example, Britain's\ngovernment nationalized its steel industry in 1967 to preserve domestic jobs (later re-privatized in 1988).\n(Choice A) Financial tools mainly pertain to the cross-border movement of currencies and the level of foreign investments.\n(Choice C) National security tools typically involve alliances, armed conflict, or espionage.\nThings to remember:\nGeopolitical tools can be related to national security, economic, or financial strategies. Each category includes cooperative tools, such as\nmultilateral trade agreements that facilitate the cross-border exchange of goods and services among nations, and noncooperative tools, such as\nnationalization, which involves the state seizure of a private industry.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null}, {"n": 94, "q": "Which of the following actions by a country is most likely to increase geopolitical risk?", "opts": ["Initiating export subsidies", "Eliminating capital controls", "Coordinating standardized rules"], "ans": "A", "expl": "Investors can evaluate geopolitical risk using a framework based on two questions:\nHow cooperative is a country toward strategic, economic, or cultural coordination?\nHow much is a country focused on economic nationalism versus globalization?\nChanges to a country's position along the cooperation and globalization spectrums, especially a shift toward noncooperative or nationalistic\nbehavior, potentially increase geopolitical risk. Initiating export subsidies, which favor internal companies at the expense of foreign competitors,\nconstitutes a change toward noncooperative behavior that increases geopolitical risk.\n(Choice B) Eliminating capital controls is a cooperative action that supports globalization and most likely leads to economic benefits and a\nreduction in geopolitical risk.\n(Choice C) Coordinating standardization rules is a cooperative action that most likely leads to increased economic coordination, benefits to trade\nand capital flows, and a reduction in geopolitical risk.\nThings to remember:\nInvestors can evaluate geopolitical risk using a framework that assesses a country's level of cooperation and its focus on globalization or\nnationalism. Countries that move toward noncooperative or nationalistic behavior increase geopolitical risk.\nDescribe geopolitics and its relationship with globalization", "qhtml": null}, {"n": 95, "q": "Regarding geopolitics, which of the following statements is correct?", "opts": ["Nationalization occurs mainly in nonvital economic sectors.", "Free exchange of currencies can leave countries vulnerable.", "National security tools are used more when state actors cooperate."], "ans": "B", "expl": "Geopolitical tools\nTool type Examples\nAlliances (eg, NATO)\nNational security Armed conflict\nEspionage\nMultilateral trade agreements (eg, NAFTA)\nEconomic\nNationalization\nFree exchange of currencies\nPermitting foreign investments\nFinancial\nReducing access to local currency markets\nLimiting foreign investments\nGovernments can use financial tools to strengthen (or weaken) their relationships with other countries.\nCooperative financial tools include:\nallowing more free exchange of international currencies, and\nencouraging foreign investments.\nNoncooperative financial tools include:\nrestricting access to local currency markets, and\ndiscouraging foreign investments.\nAlthough the free exchange of currencies can benefit participant countries, it can also create vulnerabilities in the international financial\nsystem. For instance, many countries openly borrow from and lend to each other in US dollars. This exposes participants to risk of a change in\nUS monetary policy that may impact the real value of the US dollar.\n(Choice A) Nationalization is an economic tool that involves a government seizing control of a private sector. It is most common in sectors\nperceived vital to economic security or competitiveness.\n(Choice C) Governments typically cooperate with each other (eg, in treaty organizations such as NATO) to minimize the need to use national\nsecurity tools (eg, armed conflict).\nThings to remember:\nCooperative financial tools include allowing more free exchange of international currencies and encouraging foreign investments. Noncooperative\nfinancial tools include constraining access to local currency markets and limiting foreign investments. Although largely beneficial, cooperative\nfinancial tools can also create vulnerabilities in the international financial system.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null}, {"n": 96, "q": "For an investor with a long-term investment horizon, the most appropriate response to a new, high-velocity geopolitical risk is to adjust a portfolio's:", "opts": ["sector allocation.", "tactical asset allocation.", "strategic asset allocation."], "ans": "B", "expl": "Framework for assessing geopolitical risks\nLikelihood Probability that a geopolitical risk will occur\nVelocity How quickly the risk will impact investment returns\nImpact Size of impact and breadth of impact\nAnalysts evaluate geopolitical risks by assessing the:\nlikelihood that they will occur,\nvelocity of impact, and\nsize and nature of impact.\nVelocity describes the speed of impact on investment returns. High-velocity risks have short-term impacts and create short-term market volatility\n(eg, 1987 stock market crash). Investors may capitalize on such market dislocations via tactical asset allocations (ie, short-term shifts in asset\nclass composition of a portfolio).\n(Choice A) Investors typically shift sector allocations in response to medium-velocity risks, which have medium-term impacts and may negatively\nimpact a company's operations and reduce cash flows, thereby reducing valuation (eg, a crop disease decimates potato harvests for more than\none season).\n(Choice C) Changes to strategic asset allocation may be warranted by low-velocity risks that have major long-term impacts due to changes to\nasset class returns and risks.\nThings to remember:\nAnalysts evaluate geopolitical threats by assessing the likelihood of occurrence, velocity of impact, and size and nature of impact. Velocity\ndescribes the speed of impact on investment returns. Investors respond to high-velocity risks by making short-term tactical asset allocations.\nInvestors generally respond to long-term risks by changing strategic asset allocation.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null}, {"n": 97, "q": "Trading bloc members would most likely use a common currency in a:", "opts": ["free trade area.", "economic union.", "common market."], "ans": "B", "expl": "Trading blocs are formal agreements that reduce or eliminate barriers to trade. An economic union is a type of trading bloc characterized by\nthe greatest amount of economic integration and cooperation among its members. In addition to features of a common market, economic unions\nshare common economic institutions (eg, one central bank for all members) and policies.\nEconomic unions may also elect to adopt a common currency (eg, members of the European Union use the euro as their currency). An\neconomic union that adopts a common currency is known as a monetary union.\n(Choice A) A free trade area is a common trading bloc that eliminates barriers such as tariffs on goods and services between members.\nHowever, it lacks both coordinated trade policies against nonmembers and free movement of labor and capital between members.\n(Choice C) A common market shares many characteristics of an economic union, but it does not have common economic institutions or policies.\nNor does it adopt a common currency.\nThings to remember:\nAn economic union is a trading bloc that displays a large degree of economic integration among its members. It is the only type of trading bloc\ncharacterized by common economic institutions and policies. It is also the only trading bloc that might adopt a common currency for its members.\nIf that occurs, the economic union is known as a monetary union.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions", "qhtml": null}, {"n": 98, "q": "Several countries have signed an agreement creating a trading bloc. The agreement allows tariff-free trade in goods and services among members and requires that they impose the same tariffs on imports from all nonmembers. However, the movement of people and capital among members is restricted. This trading bloc is best described as a:", "opts": ["customs union.", "free trade area.", "common market."], "ans": "A", "expl": "Trading blocs are groups of countries that have signed agreements designed to increase trade. The agreements can narrowly focus on trade in\ngoods and services or encompass additional considerations such as movement of the factors of production (ie, capital and labor) or common\nexternal trade policies.\nCustoms unions allow tariff-free trade in goods and services among members and require that member countries have common trade policies\n(eg, tariffs) with all nonmember countries. However, customs unions do not allow free movement of people or capital among member\ncountries.\n(Choice B) Free trade areas (FTAs) allow tariff-free trade in goods and services among member countries. However, FTAs neither require\ncommon trade policies with nonmember countries nor allow free movement of people or capital among member countries.\n(Choice C) Common markets allow tariff-free trade in goods and services and free movement of people and capital among member countries.\nMembers also have common trade policies with all nonmember countries.\nThings to remember:\nTypes of trading blocs include free trade areas, customs unions, and common markets. Customs unions allow tariff-free trade in goods and\nservices among members and require that member countries have common trade policies with all nonmember countries. However, customs\nunions do not allow free movement of people or capital among member countries.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions", "qhtml": null}, {"n": 99, "q": "Which of the following trade policies is most appropriate for a country to enact if it is trying to reduce a large trade deficit?", "opts": ["Reduce import tariffs on raw materials and manufactured goods by an average of 50%.", "Impose import quotas limiting foreigners to 20% of a domestic market in which imports constitute 5% of the market.", "Negotiate a voluntary export restraint agreement with a country running a large trade surplus with the domestic economy."], "ans": "C", "expl": "Quotas, tariffs, and voluntary export restraints are the policies most commonly used to reduce trade deficits. Imposing quotas or levying tariffs\non imports directly impacts commercial counterparties. Alternatively, agreements with foreign governments are used to restrain their firms from\nexporting to the domestic market. Although the specific mechanisms of each policy differ, all restrict foreign sales in the domestic market. All else\nconstant, the trade balance is favorably affected as reduced imports shrink trade deficits or increase trade surpluses.\nVoluntary export restraints are negotiated with countries currently running large surpluses. Foreign governments agreeing to constrain their\nexports will reduce domestic imports. Effective voluntary export restraint agreements reduce trade deficits.\n(Choice A) Reducing tariffs on raw materials and manufactured goods tends to make those foreign-sourced items less expensive. Tariff cuts\nincrease imports, which leads to higher trade deficits.\n(Choice B) Import quotas normally reduce trade deficits. Limiting foreign producers to a 20% market share in a market where foreign sales\naccount for only 5% of sales is an ineffective way to reduce the trade deficit.\nThings to remember:\nImposing quotas, raising tariffs, or negotiating voluntary export restraints tends to restrict foreign sales in the domestic market. All else constant,\nreduced imports shrink trade deficits (or increase trade surpluses).\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": null}, {"n": 100, "q": "Unlike members of a customs union, members of a common market most likely:", "opts": ["have a common currency.", "maintain uniform trade policies with nonmembers.", "may freely move factors of production between members."], "ans": "C", "expl": "Trading blocs are formal agreements that reduce or eliminate barriers to trade. They can be bilateral or multilateral and are classified based\non the topics covered by the agreement. Common markets and customs unions are both characterized by an absence of tariffs for goods and\nservices between members, as well as common trade policies imposed against all nonmembers (Choice B).\nHowever, a common market is broader than a customs union in that it also allows members to move labor and capital (ie, factors of production)\namong other members. This means that a manufacturer headquartered in Country A can build a factory in Country B and staff it with citizens of\nCountry A and other member countries. This would not be allowed if the countries' trading bloc were only a customs union.\n(Choice A) A common currency can be adopted by members of an economic union. An economic union is considered the broadest type of\ntrading bloc. It incorporates all the characteristics of a common market shown above in addition to having common economic institutions (eg, one\ncentral bank for all members) and policies.\nThings to remember:\nA common market is a type of trading bloc that allows free movement of goods and services among members and establishes common trade\npolicies against nonmembers. A common market shares those characteristics with a customs union, but unlike a customs union, it also permits\nfree movement of factors of production among its members.\nExplain motivations for and advantages of trading blocs, common markets, and economic unions", "qhtml": null}, {"n": 101, "q": "An analyst has compiled the following information: Economic Coffee Price Sugar Price Model ($) ($) Country Autarky 0.70 0.50 A Country Autarky 1.00 0.45 B Country Autarky 0.90 0.60 C Country Open economy 1.10 0.40 Z Country Z is an open economy, trading at world prices, and does not currently trade with any of the other three countries. Assuming equal consumption of both commodities, which country will benefit the most from a trading relationship with Country Z? ", "opts": ["Country A", "Country B", "Country C"], "ans": "A", "expl": "An autarky is a country that produces all goods and services consumed internally and does not trade with others. An autarkic economy is\nconsidered a closed economy. Domestic prices within a country are a function of its ability to produce those goods with only domestic resources\nand are known as the autarkic prices.\nCountries that do not place restrictions on imports and exports are known as open economies. Open economies are said to practice free trade as\nthey import and export at the world's price for goods and services (eg, Country Z).\nThe further away the world price is relative to a country's autarkic price, the greater the potential trade benefit for the autarky. A country's\nterms of trade benefit the most if world export prices are greater than its autarkic price and world import prices are less than its autarkic price since\nthe country can achieve greater purchasing power.\nIn this scenario, all the autarkies produce coffee below world price and sugar above world price. Thus, if all three traded with other countries, each\nwould export coffee and import sugar. The net terms-of-trade improvement would be greatest for Country A since it would sell (ie, export) coffee at\nthe world price of $1.10 and buy (ie, import) sugar at the world price of $0.40, netting a $0.50 improvement.\n(Choices B and C) The net terms-of-trade improvement for Country B is $0.15. For Country C, it is $0.40.\nThings to remember:\nThe further away the world price is relative to a country's autarkic price, the greater the potential trade benefit. A country's terms of trade benefit\nthe most if world export prices are greater than its autarkic price and world import prices are less than its autarkic price since the country can\nachieve greater purchasing power.\nDescribe the benefits and costs of international trade", "qhtml": null}, {"n": 102, "q": "A country recently imposed a tariff on apples of €300 per metric ton. The pre-tariff price for apples was €2,000 per metric ton. The table below shows the quantity demanded and the quantity supplied by domestic producers, along with the pre- and post-tariff prices of apples: Pre-Tariff Post-Tariff Quantity demanded (metric tons) 200 150 Quantity supplied (domestic producers) 110 130 Price per metric ton €2,000 €2,300 The image below shows the market for apples in this country: The area labeled A in the image represents an increase in: ", "opts": ["producer surplus.", "consumer surplus.", "government revenue."], "ans": "A", "expl": "A tariff is one type of trade restraint. It is a tax on imported goods that is usually paid by domestic consumers in the form of higher prices.\nAlthough tariffs are intended to protect domestic producers, they often lead to inefficiencies in an economy's production and consumption\nfunctions.\nArea A in the diagram above represents an increase in the producer surplus. This surplus is the sum of two components:\nThe higher revenue for the pre-tariff quantity sold: Before the tariff, domestic producers sold 110 metric tons of apples for €2,000 per metric\nton. They now sell those 110 metric tons for €2,300 per metric ton.\nThe revenue generated from the additional quantity produced: After the tariff, domestic producers increased their output from 110 to 130\nmetric tons.\n(Choice B) The tariff results in an increase in producer surplus but it also causes a decrease, not an increase, in consumer surplus. The\ndecrease consists of the sum of areas A, B, C, and D in the diagram.\n(Choice C) The government revenue from the tariff is the amount shown in area C in the diagram. It represents the amount of imports (ie, the\ndifference between the quantity demanded by domestic consumers and the quantity supplied by domestic producers) multiplied by the tariff.\nThings to remember:\nA tariff is a tax on imports. All else equal, it results in the price of the good increasing by the amount of the tariff, which is paid by domestic\nconsumers. Although tariffs are often imposed to protect domestic suppliers, they can cause inefficiencies for both consumers and producers.\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications", "qhtml": null}, {"n": 103, "q": "A country that is a price taker in the international market imposes a per-unit tariff of €50 on imported mobile phones. The table below shows domestic consumption, domestic production, and mobile phone prices before and after the tariff's imposition: Before Tariff After Tariff Domestic quantity demanded (thousands) 8,200 7,000 Quantity supplied (domestic suppliers) (thousands) 4,000 6,500 Price (per phone) €200 €250 The total deadweight loss (in €) from the imposition of the tariff is closest to:", "opts": ["25.0 million", "62.5 million", "92.5 million"], "ans": "C", "expl": "A tariff is one type of trade restraint. It is a tax on imported goods that is usually paid as a higher price for the goods and usually results in a\nloss to the net welfare of the economy. Tariffs cause inefficiencies in both the supply and production functions of the economy; these losses are\nknown as deadweight losses. In the diagram above, the supply deadweight loss is Region B and the demand deadweight loss is Region D.\nBefore the tariff, all suppliers had per-unit production costs of €200 or less. The tariff caused the price to increase to €250 so domestic suppliers\nwhose production costs were greater than €200 could now compete. However, domestic supply increased (from 4 million to 6.5 million) while\ndomestic demand decreased (from 8.2 million to 7 million), therefore the additional domestic supply represented a reallocation of resources to\nphones when those resources could have been better employed elsewhere in the economy, creating an inefficiency.\nThe demand deadweight loss is evidenced from the reduced domestic demand after the tariff. Consumers who might have spent more than €200\nfor a phone but would not spend €250 were excluded from the market.\nThe deadweight loss is the sum of the areas of the triangles B and D:\nCompare types of trade restrictions, such as tariffs, quotas, and export subsidies, and their economic implications\nC i ht©UW ld C i htCFAI tit t All i ht d\n8. A country initiating a free trade agreement with its major trading partners is least likely to experience:\nA. a wider variety of goods available to consumers.\n\nB. increased employment in industries facing import competition.\nC. higher wages in industries that expand due to increased exports.\nExplanation\nMost economists believe greater overall welfare is attained when countries engage in international trade rather than by attempting self-sufficiency\nin meeting domestic demand (ie, autarky). The gains from international trade derive from each country concentrating on the production of\ngoods it produces relatively more efficiently and trading for goods it produces relatively less efficiently. Gains result from specialization and\neconomies of scale.\nThe gains from trade are not shared equally; there are winners and losers. On one hand, industries expanding to meet export opportunities will\nbenefit from higher prices, due to increased foreign demand, and their employees will benefit from greater job opportunities and higher wages\n(Choice C). On the other hand, the industries' domestic customers must pay higher prices. In addition, industries facing import competition will\nsuffer domestic market share decline. As such industries contract, they will employ fewer workers.\n(Choice A) Increased trade results in greater consumer choice. This is due both to imported goods competing with domestic suppliers and the\nintroduction of previously unavailable products.\nThings to remember:\nThe gains from international trade result from greater efficiency due to specialization and economies of scale. These gains are not shared equally,\nhowever. Industries facing import competition will suffer domestic market share decline. As these industries contract, the number of their\nemployees will decline.\nDescribe the benefits and costs of international trade", "qhtml": null}, {"n": 104, "q": "A country initiating a free trade agreement with its major trading partners is least likely to experience:", "opts": ["
