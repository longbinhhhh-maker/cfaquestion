<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Reduction in energy costs due to displacement of gasoline cars is most likely a type of:", "opts": ["event risk.", "thematic risk.", "exogenous risk."], "ans": "B", "expl": "Geopolitical risks\nType Description\nKnown event date, unknown event outcome\nEvent risk\n(eg, political election, new legislation)\nUnanticipated event (eg, sudden uprisings, impact\nExogenous risk\nfrom natural disasters)\nKnown risks that evolve over time (eg, displacement\nThematic risk\nof fuel vehicles, rise of political factions)\nGeopolitical risks can have major impacts on investment returns globally and can be identified as different risk types: event risk, exogenous risk,\nand thematic risk. Analysts often model such risks as a part of their investment decision-making process.\nThematic risks arise from events that evolve over a long period of time, such as climate change, rising political trends, and technological\ninnovation. For example, the reduction in energy costs due to the displacement of gasoline cars is a thematic risk. This phenomenon may\nbe driven by the gradual passage of climate-friendly regulations and may negatively affect major oil-producing economies.\nEvent risk describes the uncertain outcome of an event that will occur on a known date. For example, the date of a US presidential election\nis known, but the winner is unknown until the event occurs (Choice A).\nExogenous risk describes sudden or unanticipated geopolitical risk. One example is the aftermath of a sudden natural disaster, such as the\nMount St. Helens eruption in 1980, which caused significant environmental harm in parts of the US and Canada (Choice C).\nThings to remember:\nGeopolitical risks can be identified as different types: event risk, exogenous risk, and thematic risk. Event risk describes the uncertain outcome of\na known event. Exogenous risk describes the risk from an unanticipated event. Thematic risk refers to risks that evolve over a long period of time.\nDescribe geopolitical risk", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Which of the following is least likely a reason for a country to cooperate with its neighbors? The country lacks:", "opts": ["economic resources.", "trade protections for domestic producers.", "national security and defense capabilities."], "ans": "B", "expl": "Motivations for political cooperation\nProtect against external threats\nNational security or\nAccess vital resources that are scarce or unavailable\nmilitary interest\ndomestically\nSecure essential resources through trade\nEconomic interest Standardize international production and/or trading\nprotocols to achieve fairness\nCultural considerations Promote cultural exchange to strengthen international ties\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries.\nFor example, if a country lacks protections for its domestic producers from foreign competition, it may be motivated to cooperate less with\nforeign countries by imposing tariffs that favor domestic purchases over foreign purchases.\n(Choice A) A country lacking vital economic resources is likely to cooperate with other countries to gain access to such resources at favorable\nterms.\n(Choice C) A country lacking national security and defense capabilities is likely to cooperate with other countries to prevent and/or mitigate\nmilitary threats.\nThings to remember:\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries to promote its own wellbeing.\nDescribe geopolitics from a cooperation versus competition perspective", "qhtml": null, "explfigs": null}, {"n": 3, "q": "A country will most likely seek geopolitical cooperation if it:", "opts": ["has a strong military supported by advanced technology.", "possesses a seaport that acts as a center for global trade.", "engages in many large cross-border financial transactions."], "ans": "C", "expl": "Motivations for political cooperation\nProtect against external threats\nNational security or\nAccess vital resources that are scarce or unavailable\nmilitary interest\ndomestically\nSecure essential resources through trade\nEconomic interest Standardize international production and/or trading\nprotocols to achieve fairness\nCultural considerations Promote cultural exchange to strengthen international ties\nPolitical relationships among countries can be cooperative or noncooperative based on a country's national interest at any given time. A country's\nmilitary, economic, and/or cultural aims can influence its degree of cooperation with other countries to promote its own wellbeing.\nStandardization is a form of cooperation that refers to standardizing protocols pertaining to cross-border trade and capital flows among\ncountries. In this scenario, a country is likely to cooperate with other countries in following standardized protocols for large cross-border financial\ntransactions. Doing so will help promote cross-border economic prosperity when all parties follow the same rules of engagement for conducting\nbusiness.\n(Choice A) When considered by itself, having a strong military does not provide incentive for a country to cooperate more with others. However,\na country with a weak military has incentive to cooperate with others to avoid the need for national defense.\n(Choice B) When considered by itself, a country with a seaport that facilitates global trade is not incentivized to cooperate with other countries. A\nlandlocked country without international hubs has incentive to cooperate with other countries in order to obtain resources more easily.\nThings to remember:\nStandardization is a form of cooperation that refers to standardizing protocols pertaining to cross-border trade and capital flows among countries.\nStandardization helps promote cross-border economic prosperity when all parties follow the same rules of engagement for conducting business.\nDescribe geopolitics from a cooperation versus competition perspective", "qhtml": null, "explfigs": null}, {"n": 4, "q": "A country is experiencing economic difficulties due to persistent, large balance-of-trade deficits. The most appropriate organization to assist that country is the:", "opts": ["World Bank Group (World Bank).", "World Trade Organization (WTO).", "International Monetary Fund (IMF)."], "ans": "C", "expl": "The International Monetary Fund (IMF) engages in the broadest range of activities compared to the other international organizations. The IMF's\nresponsibilities fall into four main categories: addressing international monetary problems; facilitating growth of trade and poverty reduction;\nsupporting exchange rate stability; and lending foreign exchange to address balance of payments problems.\nIMF loans are temporary and are not considered foreign aid or a source of long-term funding. Loans are made only with adequate safeguards (ie,\nsenior creditor status) and only after countries have filed a plan with the IMF to resolve their difficulties.\n(Choice A) The World Bank Group (World Bank) is primarily involved (through affiliate organizations) in long-term lending to facilitate economic\ndevelopment in developing countries. The World Bank also provides advice and analysis to foster economic and social improvements. It does not\ndirectly assist in resolving problems due to trade imbalances.\n(Choice B) The World Trade Organization (WTO) fosters global trade through a variety of means. It administers bilateral and multilateral trade\nagreements as well as related dispute resolution. The WTO seeks to reduce tariffs and non-tariff barriers to trade. It does not help resolve\nproblems involving trade imbalances.\nThings to remember:\nThe International Monetary Fund makes foreign exchange loans to countries experiencing balance of payments problems. IMF loans are\nextended under very strict guidelines and are intended as temporary funding, not as foreign aid or a source of long-term financing.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAIjCAIAAAAfmaZwAAEAAElEQVR42ux9ebxN1fv/c+ZzZ7NEJRFSMmT6mDOXUJJKpTSqNNDwSQOhIppFaU4aNBiiREXJEDKkUZOhJPMdz3zO74/3975/q7Xv1dVHA573H17nHvvsvfbaa639rOd5P+/HlUqlRKFQKBQKhUKhUPy74dYuUCgUCoVCoVAo1HBXKBQKhUKhUCgUargrFAqFQqFQKBRquCsUCoVCoVAoFAo13BUKhUKhUCgUCoUa7gqFQqFQKBQKhRruCoVCoVAoFAqFQg13hUKhUCgUCoVCoYa7QqFQKBQKhUKhhrtCoVAoFAqFQqFQw12hUCgUCoVCoVDDXaFQKBQKhUKhUKjhrlAoFAqFQqFQKNRwVygUCoVCoVAo1HBXKBQKhUKhUCgUargrFAqFQqFQKBQKNdwVCoVCoVAoFAo13BUKhUKhUCgUCoUa7gqFQqFQKBQKhUINd4VCoVAoFAqFQg13hUKhUCgUCoVCoYa7QqFQKBQKhUKhhrtCoVAoFAqFQqFQw12hUCgUCoVCoVCUGV7tAoXiEEYqlRIRl8tlfZ9IJETE4/Ekk8n/28S7//82PplM4s9oNOr3+/FNPB4XEfxJxGIxn88nIvF43Ov17uOiPJWFSCQSCATMb8xToXloTCKRQLP9fr/5PW/H5XLhoslkEh/cbnc4HBaRYDBotcrZSNygx+PB9ziAbXC5XLic84dsDJrBk+CEXq+XvR2LxUQEPVbGx4HL4V+3281WoQGpVAo/wRX38cTj8Tg7Bwegk83etprHI/G93+9nO63jeaTVmEgkIiKBQIAfrAfnBDvN+p7X4gO1GoM/E4kEhlkqlXJ2QlFRkYikp6eX2P98xPsYM9Y5OWb4ONh1HIEl/pBTzDlmcO+JRIJnYO9ZzWa3c0iYvZdIJHBOXkuhUIh63BUKhUKhUCgUCsXfgP/vVVIoFAc7SnPc4s94PG75vE1vN47BguDxeCzPrhPwSvr9fqczr0R3OM9JZ7blnRWRUCgkImlpaVbzcHwsFqP7H7/1er2WT9Ty1xYWFmZkZOyjx+iMLO1+GVL4Q/DIWCxm+l99Ph9bxdbCf4w/SwxElNaZPIPVq9FoVAynbCqVwkXL0njLocunYz4aHIazWY1xHhkKhfAI8L3b7baeSzwex0ncbje6gg8U38fjcbbc9Kzn5+dnZWWZAZy9e/fm5OQ4YylmXzFeYXYmrmt1UWFhoYjsY8zwDOar0xwzpQVVShwwOBIfOGYYwsI3Ho8HPcBmoyvMPmcXWVEIhUKhhrtCofi3w2lgye8j+26322LCxONxUkRMc9bkUcCqxgHBYNCitSQSCS4mFs/BMiZodvOKOCCVSvGH5CpIMc3GNHDN0D/uiCaOZa+TokCruqCgQEQyMzP3TeAhzcC02EzjmLQQ8nPC4TAbLGUjLJVm+icSCRqyTk5 ectively assesses an event's:\nLikelihood (ie, probability of the event)\nVelocity of the impact (ie, how quickly the event may impact investment returns)\nSize and nature of the impact (ie, how large the impact may be, and its overall reach)\nIn this scenario, Event B poses the most significant risk. Even though it has only a moderate probability of occurring, its impact on the country's\neconomy will be fast, intense, and broad-based if it occurs. As an example, pandemics do not occur frequently, but when a pandemic occurs, its\ndisastrous impact on an economy will be swift.\n(Choice A) Although Event A has high probability and high velocity, its impact is moderate and discrete (ie, narrowly limited to one sector or to a\nfew sectors). Therefore, its threat is not as significant as Event B's.\n(Choice C) Compared with Event B, Event C has lower impact and takes longer to move the market.\nThings to remember:\nAnalysts evaluate geopolitical risks by assessing the likelihood of occurrence, velocity of impact, and size and nature of impact. Likelihood\nmeasures the probability of a risk's occurrence, velocity gauges how quickly the risk may impact portfolio returns, and size and nature measure the\nimpact's magnitude and breadth (eg, discrete sector versus overall economy).\nDescribe geopolitical risk", "qhtml": null, "explfigs": null}, {"n": 6, "q": "The growth in populism is most likely consistent with which type of geopolitical risk?", "opts": ["Event", "Thematic", "Exogenous"], "ans": "B", "expl": "Geopolitical risk types\nRisk Characteristics Examples\nSpecific date\nEvent Country elections\nKnown risk\nClimate change\nOngoing\nThematic Cyber threats\nKnown and evolving risk\nTerrorism\nSurprise Natural disaster\nExogenous\nUnknown risk Pandemic\nGeopolitical risk represents the risk from political changes, natural disasters, and other factors that affect international relations. Risks differ in\ntheir timing and predictability. Thematic risks are known and can remain present for an extended period as they evolve and change in scope or\nfrequency. Awareness of a thematic risk allows companies and investors to manage the risk through preparation.\nPopulism is a type of political movement and a known risk that continues evolving over time. Therefore, a growth in populism is a thematic\ngeopolitical risk and, as such, its potential effects can be incorporated by investors into their risk analysis.\n(Choice A) Event risks (eg, government elections) occur on specific dates that are known in advance. In contrast, political movements such as\npopulism develop over time and thus are not considered specific events.\n(Choice C) Exogenous risks involve surprising events that are often uncontrollable, whereas a political movement is a more predictable and\nongoing risk.\nThings to remember:\nThematic geopolitical risks are known and continue evolving and changing in scope or frequency over time. Awareness of thematic risks allows\ncompanies and investors to manage the risks through preparation. A growth in populism is considered a thematic geopolitical risk.\nDescribe geopolitical risk", "qhtml": null, "explfigs": null}, {"n": 7, "q": "A developing economy needs long-term financing to fund infrastructure improvements and facilitate general economic growth. According to its mission, which of the following organizations is most appropriate to provide the financing?", "opts": ["World Bank Group (World Bank)", "International Monetary Fund (IMF)", "International Trade Organization (ITO)"], "ans": "A", "expl": "At the Bretton Woods Conference in 1944, three global organizations were created to facilitate economic activity:\nWorld Bank Group (World Bank),\nInternational Monetary Fund (IMF), and\nInternational Trade Organization (ITO).\nThe World Bank's primary mission is to facilitate economic and social development in emerging economies. The World Bank largely\naccomplishes its mission by providing long-term, low- or no-interest loans through the International Bank for Reconstruction and Development\n(IBRD) and the International Development Association (IDA), which are affiliated organizations. The World Bank also provides advice and analysis\nto foster economic and social improvements in developing countries.\n(Choice B) The IMF is primarily responsible for addressing international monetary problems to encourage economic growth and reduce poverty,\nsupporting exchange rate stability, and lending foreign exchange to address balance of payments problems.\n(Choice C) The ITO was never ratified by the United States and was replaced by the General Agreement on Trade and Tariffs (GATT) in 1948.\nGATT remained the international framework governing trade until 1995, when it was replaced by the World Trade Organization (WTO), whose\nmission is to facilitate trade.\nThings to remember:\nThe World Bank Group's (World Bank's) primary mission is to facilitate economic development in emerging economies. The World Bank largely\naccomplishes its mission by providing long-term, low- or no-interest loans; advice; and analysis to developing countries to foster economic and\nsocial improvements.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAIjCAIAAAAfmaZwAAEAAElEQVR42ux9ebxN1fv/c+ZzZ7NEJRFSMmT6mDOXUJJKpTSqNNDwSQOhIppFaU4aNBiiREXJEDKkUZOhJPMdz3zO74/3975/q7Xv1dVHA573H17nHvvsvfbaa639rOd5P+/HlUqlRKFQKBQKhUKhUPy74dYuUCgUCoVCoVAo1HBXKBQKhUKhUCgUargrFAqFQqFQKBRquCsUCoVCoVAoFAo13BUKhUKhUCgUCoUa7gqFQqFQKBQKhRruCoVCoVAoFAqFQg13hUKhUCgUCoVCoYa7QqFQKBQKhUKhhrtCoVAoFAqFQqFQw12hUCgUCoVCoVDDXaFQKBQKhUKhUKjhrlAoFAqFQqFQKNRwVygUCoVCoVAo1HBXKBQKhUKhUCgUargrFAqFQqFQKBQKNdwVCoVCoVAoFAo13BUKhUKhUCgUCoUa7gqFQqFQKBQKhUINd4VCoVAoFAqFQg13hUKhUCgUCoVCoYa7QqFQKBQKhUKhhrtCoVAoFAqFQqFQw12hUCgUCoVCoVCUGV7tAoXiEEYqlRIRl8tlfZ9IJETE4 eled as an archetype that falls on the spectrum of globalization and cooperation. Multilateral countries are very open to\nglobalization and cooperative; they typically adopt beneficial trade terms to facilitate international business. In contrast, autarky describes a\ncountry that adopts nationalistic policies and seeks self-sufficiency through little cooperation.\nDescribe geopolitics and its relationship with globalization", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApIAAAKrCAIAAADNn/pUAABQiElEQVR42u3dT2wbV5rv/Z965s28wNuIVN5c9MKxRK1m2kFkU5txDMT2kIu4gbbTBoV4gozdcEBm4FzEjQQhkfZFYrxOQBoO4sbYGItoo50bZNwg4cQOEGUhRpEB23cjWm7Yd3olSrEWjbtxyY25wDt9Me138URnylUkRVL/pe9nEcgMWSwenqrD5zlPnep6/PixAADAevADmgAAAIZtAADAsA0AAMM2AABg2AYAAAzbAAAwbAMAAIZtAADAsA0AAMM2AABg2AYAAAzbAAAwbAMAAIZtAADAsA0AAMM2AABg2AYAAAzbAAAwbAMAAIZtAADAsA0AAMM2AABg2AYAAAzbAAAwbAMAAIZtAADAsA0AAMM2AABg2AYAgGEbAABsqmHb933f97ueVCgUVv7z9Pf327snk8lkMrncb5fL5XK5HN2oddVqtVqtJpPJUG+pVqvL0RmsPyy+MxSLxWKx6Pa2WCwuax+uu9uZTMbtwMp/ceVyuVwuVyqV1T3i1qNQb6dB1shZKHoUL+EZg2gbAABI0l8uyVbqBh/lcjmbzW7IVqvVahb9WPCRz+fpSS3KZDL2a5emWF9fmR3jo6OjNAjWtWKxaF16/Z63/3KpEmhqkIiQFI/HN9gXb583mjCEWphPsT+sV0xMTNAmLRoeHh4eHl7hN61UKs1nBKampvhqsO5+hq7rzkySHAAAbaKStFqt5gJrSel0OlTGUvcltVotWLxmJQBdXV1btmzZsmWL1bi55xcKBXvcvWRwcHBwcHDByqBKpWLPdC9sUkFm9WWhqrpoYV0ymQxVonV1dVktQyaTCdYNBT9CMAMRrdpzj9gWisWi+7z2R5NPatVSwcaxjVgjR59fKBRC5WD2Fh2UEPq+H20024HQu1cqFftf7nHXFC1Wf1ghW7C6x97abdkqxdoqFov2K3uLVvIooQ9u3azuC+2TDg0NhVqpyUsaRQmhsqbQcdRE6OuIfvDo0WGdP/TVuPZ3W1uwJK31Rg5+lfZt2j6419qB0NZXbGeSaBdttCn3Afv7++t+cUNDQ02OrODB1d/f3+gEqJazeqHTlx2nTQ7VDrp0oyZqdA4JfsZKpVKpVFpvInt+8BM12r1oEWijerFQJ2l0qne9K3gIh84bC5akRd+rSWcOnZrca1s8sRNtAwCwITxetNDE/sTERCKRSCQSkjzP8zzv4cOHoZdMTU0FZxE8zwv+7Xmee2YqlUqlUk32P5/P5/N59/xYLBbcTt2XZLPZbDYb2qUmE/DxeDwej7tPYR8tJBaLxWKx0dHRYM1OqVQKvYu9tQJTKfZ46OO38kndBhvttm1qYmKi9ca0J7Typds36Fp7wXdvUspkvWXB92rULMF9sNnfYGew/xt9C9dF1XQi2T0/NK/caGes/wfb3Pa8yfMlWbdZcLeDeay6x5GazkBbZwv1wCZfh/W3JhsMHXGLb+RQJ2nSu0IvbMIO3tZPI wAAMGwDAMCwDQAA1pL/H+q1GQRzTwnnAAAAAElFTkSuQmCC"]}, {"n": 9, "q": "Which of the following best describes the mission of the World Trade Organization? The organization promotes:", "opts": ["the economic development of emerging economies through trade.", "exchange rate stability, leading to a greater willingness among countries to trade.", "free trade by providing the basic system of global trade rules and dispute resolution."], "ans": "C", "expl": "The World Trade Organization (WTO) came into existence in 1995, replacing the General Agreement on Tariff and Trade, which had regulated\ninternational trade for most of the prior 50 years. The WTO is the only global organization that provides a formal framework for international\ntrade. It primarily seeks to reduce tariffs and nontariff barriers to trade by fostering global trade through the administration of bilateral and\nmultilateral trade agreements, along with related trade dispute resolution.\n(Choice A) The World Bank Group's fundamental purpose is to assist in the economic development of emerging economies but not necessarily\nthrough trade.\n(Choice B) The International Monetary Fund is the organization that supports exchange rate stability to promote global growth and poverty\nreduction.\nThings to remember:\nThe World Trade Organization (WTO) is the only global organization that governs and regulates international trade. The WTO primarily seeks to\nreduce tariffs and nontariff barriers to trade by fostering global trade through the administration of bilateral and multilateral trade agreements, along\nwith related trade dispute resolution.\nDescribe functions and objectives of the international organizations that facilitate trade, including the World Bank, the International Monetary\nFund, and the World Trade Organization", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAIjCAIAAAAfmaZwAAEAAElEQVR42ux9ebxN1fv/c+ZzZ7NEJRFSMmT6mDOXUJJKpTSqNNDwSQOhIppFaU4aNBiiREXJEDKkUZOhJPMdz3zO74/3 s created to facilitate the cross-border exchange of goods and\nservices among Canada, the US, and Mexico.\nIn contrast, nationalization, which involves the state seizure of a private industry, is a noncooperative economic tool. For example, Britain's\ngovernment nationalized its steel industry in 1967 to preserve domestic jobs (later re-privatized in 1988).\n(Choice A) Financial tools mainly pertain to the cross-border movement of currencies and the level of foreign investments.\n(Choice C) National security tools typically involve alliances, armed conflict, or espionage.\nThings to remember:\nGeopolitical tools can be related to national security, economic, or financial strategies. Each category includes cooperative tools, such as\nmultilateral trade agreements that facilitate the cross-border exchange of goods and services among nations, and noncooperative tools, such as\nnationalization, which involves the state seizure of a private industry.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null, "explfigs": null}, {"n": 11, "q": "Which of the following actions by a country is most likely to increase geopolitical risk?", "opts": ["Initiating export subsidies", "Eliminating capital controls", "Coordinating standardized rules"], "ans": "A", "expl": "Investors can evaluate geopolitical risk using a framework based on two questions:\nHow cooperative is a country toward strategic, economic, or cultural coordination?\nHow much is a country focused on economic nationalism versus globalization?\nChanges to a country's position along the cooperation and globalization spectrums, especially a shift toward noncooperative or nationalistic\nbehavior, potentially increase geopolitical risk. Initiating export subsidies, which favor internal companies at the expense of foreign competitors,\nconstitutes a change toward noncooperative behavior that increases geopolitical risk.\n(Choice B) Eliminating capital controls is a cooperative action that supports globalization and most likely leads to economic benefits and a\nreduction in geopolitical risk.\n(Choice C) Coordinating standardization rules is a cooperative action that most likely leads to increased economic coordination, benefits to trade\nand capital flows, and a reduction in geopolitical risk.\nThings to remember:\nInvestors can evaluate geopolitical risk using a framework that assesses a country's level of cooperation and its focus on globalization or\nnationalism. Countries that move toward noncooperative or nationalistic behavior increase geopolitical risk.\nDescribe geopolitics and its relationship with globalization", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA9kAAALPCAIAAAD5LpSPAABtgklEQVR42u3dPXAj55Xv/wMOhxJHL6PGWlVT65rybGN8U7sKyFe3CsidALEiIHUGhA6Bqgk2RUd2ik6UA1VXCm2z60rXu5uxVxtd+cpDWJY9GokzxD/4/XnqUTcAgq/Dl+8nYJFgo/vpBy99+vR5nq4sFgsDAAAAcOW26AIAAACAWBwAAAAgFgcAAABALA4AAAAQiwMAAAAgFgcAAACIxQEAAAAQiwMAAADE4gAAAACIxQEAAABicQAAAADE4gAAAACxOAAAAEAsDgAAAIBYHAAAACAWBwAAAEAsDgAAABCLAwAAACAWBwAAAIjFAQAAABCLAwAAAMTiAAAAAIjFAQAAAGJxAAAAgFgcAAAAALE4AAAAQCwOAAAAgFgcAAAAIBYHAAAAQCwOAAAAEIsDAAAAIBYHAAAAiMUBbCzP8zzPR6NRZZlOp5OmaZqmd6dDarWa9r3VaoWP93o975alT0zTdDabzWazsG/9KaPRaDQaXeWO9Hq9E9v8BtfpK9E6z7Oq+Xw+n8/Dhnmf8wG/eoUvkzzP6RPgGtqmC4DrIE3TTqezfgEF4t1udzwe02OrIlQzS5JkOp3SG28k+FP/0xUAYOTFAQAAACMvDmCVLMvMbH1SPJQkSb1eN7Nut3s3e2w8HpevDKgiZVVGNo7jxWJxyzrBf14f8/k8/PPg4CCKIj7jAGDkxQEAAABicQA/MhgMBoOB/9lsNqfT6XQ6XRzb29vb29trNpsWpMaXJoC1qsKYufXD5rRAtVr1p7RarVarVRj7aGZ6xBdTG8LNNRqNRqNReNbZtmUnFYUXxiyORiOtypfRnxqvJuv7JMuyTqfT6XQKgw4Hg4GebqURioWurlQq1Wq1Wq2ev1o6SZJCP4fDWLWba8Zu+lP8Wb4v2p3N35mnGn/prfVH/LU2s7A9rVZLr4Kv3N8AWZbptSj0rd5a5fdJuE6NqWg0GuETvT1JkugF8ldq1Ujo2WymN3P5jWo/Hr/hC+jq1tJBk4Uh14UdD68kLG1/rVYrf96XvqX1htfe6S1qq4eJe1fodVm/PIDLtQDwhijI9g9ju91ut9trlo/jOI7j4XC4v7+/v78f/qter6twZal6vX5wcHBwcFBYYRjf24pCCF9YZwj+ryiKVpUfFM4lzrAt318/PwkfD4tz9MhwOFy12v1j/shwOBwOh6teBVtW3xLHcdh763u7vIlut1tu8xph5Umhn/1Nsmqda7rCd6fwZvB/aZ1aSbiefr/f7/dPbP n3+32lvVfp9/uaR6VSqTCPCgAAAIy8OAAAAICCypqbw2ugpLLgPrbSjlPUw+EwvOE8AAAAgAuLxQEAAAAYNSoAAAAAsTgAAAAAYnEAAACAWBwAAAAAsTgAAABwA/x/GgDzIatzaF0AAAAASUVORK5CYII="]}, {"n": 12, "q": "Regarding geopolitics, which of the following statements is correct?", "opts": ["Nationalization occurs mainly in nonvital economic sectors.", "Free exchange of currencies can leave countries vulnerable.", "National security tools are used more when state actors cooperate."], "ans": "B", "expl": "Geopolitical tools\nTool type Examples\nAlliances (eg, NATO)\nNational security Armed conflict\nEspionage\nMultilateral trade agreements (eg, NAFTA)\nEconomic\nNationalization\nFree exchange of currencies\nPermitting foreign investments\nFinancial\nReducing access to local currency markets\nLimiting foreign investments\nGovernments can use financial tools to strengthen (or weaken) their relationships with other countries.\nCooperative financial tools include:\nallowing more free exchange of international currencies, and\nencouraging foreign investments.\nNoncooperative financial tools include:\nrestricting access to local currency markets, and\ndiscouraging foreign investments.\nAlthough the free exchange of currencies can benefit participant countries, it can also create vulnerabilities in the international financial\nsystem. For instance, many countries openly borrow from and lend to each other in US dollars. This exposes participants to risk of a change in\nUS monetary policy that may impact the real value of the US dollar.\n(Choice A) Nationalization is an economic tool that involves a government seizing control of a private sector. It is most common in sectors\nperceived vital to economic security or competitiveness.\n(Choice C) Governments typically cooperate with each other (eg, in treaty organizations such as NATO) to minimize the need to use national\nsecurity tools (eg, armed conflict).\nThings to remember:\nCooperative financial tools include allowing more free exchange of international currencies and encouraging foreign investments. Noncooperative\nfinancial tools include constraining access to local currency markets and limiting foreign investments. Although largely beneficial, cooperative\nfinancial tools can also create vulnerabilities in the international financial system.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null, "explfigs": null}, {"n": 13, "q": "For an investor with a long-term investment horizon, the most appropriate response to a new, high-velocity geopolitical risk is to adjust a portfolio's:", "opts": ["sector allocation.", "tactical asset allocation.", "strategic asset allocation."], "ans": "B", "expl": "Framework for assessing geopolitical risks\nLikelihood Probability that a geopolitical risk will occur\nVelocity How quickly the risk will impact investment returns\nImpact Size of impact and breadth of impact\nAnalysts evaluate geopolitical risks by assessing the:\nlikelihood that they will occur,\nvelocity of impact, and\nsize and nature of impact.\nVelocity describes the speed of impact on investment returns. High-velocity risks have short-term impacts and create short-term market volatility\n(eg, 1987 stock market crash). Investors may capitalize on such market dislocations via tactical asset allocations (ie, short-term shifts in asset\nclass composition of a portfolio).\n(Choice A) Investors typically shift sector allocations in response to medium-velocity risks, which have medium-term impacts and may negatively\nimpact a company's operations and reduce cash flows, thereby reducing valuation (eg, a crop disease decimates potato harvests for more than\none season).\n(Choice C) Changes to strategic asset allocation may be warranted by low-velocity risks that have major long-term impacts due to changes to\nasset class returns and risks.\nThings to remember:\nAnalysts evaluate geopolitical threats by assessing the likelihood of occurrence, velocity of impact, and size and nature of impact. Velocity\ndescribes the speed of impact on investment returns. Investors respond to high-velocity risks by making short-term tactical asset allocations.\nInvestors generally respond to long-term risks by changing strategic asset allocation.\nDescribe tools of geopolitics and their impact on regions and economies", "qhtml": null, "explfigs": null}];
const CFG = {"title": "Wiley · Introduction to Geopolitics", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Economics · 13 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<style id="qnote-css">
  .qnote{margin-top:12px;border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:8px 10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{width:100%;resize:vertical;min-height:40px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
</style>
<script>
/* ===== Ghi chú cá nhân cho mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      if(card.querySelector(".qnote")) continue;
      var k = keyFor(card);
      if(k===null) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú của bạn</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.rows = 2;
      ta.setAttribute("placeholder","Viết ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      card.appendChild(wrap);
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
