<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following is least likely a benefit of securitization? Securitization provides:", "opts": ["lenders with the ability to finance more loans.", "companies with an alternate source of funding.", "investors with less inherent credit risk from the underlying collateral."], "ans": "C", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans and receivables, such as auto loans or credit card\nreceivables, to create asset-backed securities (ABS). The cash flows from these assets (ie, payments from the borrowers) are used to pay the\nbonds' interest and principal.\nSecuritization has many benefits, including the redistribution of the risk of the underlying collateral. Credit enhancements allow investors to tailor\ntheir interest rate and credit risk exposure. However, the level of inherent credit risk on this collateral does not change. Therefore, securitization is\nnot guaranteed to reduce the overall credit risk to investors. If losses on the collateral are particularly high, the credit enhancements can fail to\nprovide the intended protection.\n(Choices A and B) One benefit of securitization is that it allows financial institutions to sell loans and use the proceeds to provide more lending.\nSecuritization also provides a funding source for companies in addition to equity and bond issuance because companies that originate loans and\nreceivables can sell these assets directly to financial intermediaries.\nThings to remember:\nSecuritization is a process that bundles assets to create asset-backed securities (ABS) with credit enhancements. These enhancements\nredistribute the risk of the underlying collateral and allow investors to tailor the risk of their investment. Securitization does not change the inherent\ncredit risk of the underlying collateral, so the ABS structures can fail to provide their intended benefits if losses in the collateral are particularly\nhigh.\nExplain benefits of securitization for issuers, investors, economies, and financial markets.", "qhtml": null}, {"n": 2, "q": "A residential mortgage-backed security (RMBS) has a credit rating higher than the bonds of the seller of the securitized assets. All else being equal, this scenario least likely results from which of the following factors?", "opts": ["The RMBS is issued by a special purpose entity.", "The seller's bonds are subordinate to the RMBS.", "The RMBS may be backed by guarantees if the underlying borrowers default."], "ans": "B", "expl": "A characteristic common to all asset-backed securities (ABS), including residential mortgage-backed securities (RMBS), is how they are created.\nAs shown, assets that collateralize the ABS are sold to a special purpose entity (SPE), which then becomes the issuer of the ABS.\nThe SPE and the seller are separate entities, so if the seller declares bankruptcy, its debts cannot be satisfied by creditors seizing the ABS\ncollateral. The collateral may be of high quality, and its immunity to the seller's bankruptcy potentially makes the ABS that it supports more\ncreditworthy than a bond issued by the seller, even if that bond were backed by similar collateral. This translates into a higher credit rating for the\nABS than for an otherwise identical bond issued by the seller (Choice A).\nAnother consequence of the SPE and the seller being separate entities is that creditors' claims are not prioritized based on different bond issues\nbeing designated as senior vs. subordinated. Since the seller's bondholders have no claims against the SPE's assets (and vice versa), each\nbond's credit rating cannot depend on whether one bond is \"senior\" to the other.\n(Choice C) Financial guarantees are one type of credit enhancement that can be used for all types of ABS, including RMBS. A financial\nguarantee may warrant a higher credit rating for ABS than for a bond issued by the collateral seller.\nThings to remember:\nAsset-backed securities (ABS) are created by selling assets, such as mortgages, to a special purpose entity (SPE), which subsequently issues the\nABS. Since the SPE and asset seller are separate entities, the ABS collateral is not subject to the claims of the seller's creditors. This can result\nin the ABS having a higher credit rating than the bonds issued by the collateral seller.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 3, "q": "A retailer offers loans to customers to finance purchases of high-priced merchandise. If a customer defaults on a loan, the retailer will repossess and resell the merchandise. The retailer securitizes USD 30 million of these loans by selling them to a special purpose vehicle (SPV). Subsequently, the SPV will sell asset-backed securities (ABS) to investors. Based on this information, for the ABS, which of the following descriptions is most appropriate?", "opts": ["The retailer is the issuer.", "The SPV is the depositor.", "The merchandise financing loans are the collateral."], "ans": "C", "expl": "Lenders often package loans together and sell them for quick cash; this process is known as securitization. In general, the process involves the\nlender (ie, depositor) selling bundled loans to a special purpose vehicle (ie, issuer). The SPV then issues asset-backed securities, using the\nloans as collateral, to investors. As return, the ABS investors receive periodic cash flows from the SPV, which are provided by the loan payments\nfrom the loans that serve as collateral.\nIn this scenario, the retailer (ie, depositor) sells customer loans to the SPV (ie, issuer) (Choices A and B). The SPV subsequently sells ABS to\ninvestors using the customer loans as collateral. After investors purchase the ABS, they receive future payments from the SPV, which are\nprovided from customer repayment of the merchandise loans.\nThings to remember:\nLenders often package loans together and sell them for quick cash through securitization. In general, the process involves the lender (ie,\ndepositor) selling bundled loans to a special purpose vehicle (SPV) (ie, issuer). The SPV then issues asset-backed securities (ABS), using the\nloans as collateral, to investors. As return, the ABS investors receive periodic cash flows from the SPV, which are provided from the collateral.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 4, "q": "A company sells ¥485 million of its receivables to a special purpose entity (SPE). Using the receivables as collateral, the SPE issues asset- backed securities (ABS) with the following structure: Bond Class Par Value (¥ Millions) A (senior) 275 B (subordinate to A) 120 C (subordinate to B) 90 Total 485 If customers default on ¥120 million of the receivables owed, then bond class(es):", "opts": ["B and C realize losses of ¥60 million each.", "A, B, and C realize losses of ¥40 million each.", "C realizes losses of ¥90 million and B realizes losses of ¥30 million."], "ans": "C", "expl": "In a securitization, a company sells an asset such as accounts receivable to a special purpose entity (SPE), which then issues asset-backed\nsecurities (ABS) using the receivables as collateral. As customers make payments on the receivables to the SPE, the cash flow is used to pay\ndown the ABS tranches. Defaults on receivables can lead to losses in the ABS; the assignment of payments and losses to the tranches differs\naccording to the ABS structure.\nIn this scenario, the ABS is structured to provide credit enhancement (known as credit tranching) using a \"waterfall\" structure. Payments are\ndirected to the senior tranche first until its principal is reduced to zero, and then to other tranches sequentially by seniority. The flow of losses\nis in the opposite direction: Losses are absorbed by the most subordinate tranche until its principal is reduced to zero, then the next most\nsubordinate tranche absorbs the remaining losses, and so on.\nIn this ABS structure, there is one senior tranche and two subordinate tranches. The ¥120 million in losses are absorbed as follows:\nThe first ¥90 million in losses is applied to bond class C, which reduces its principal to zero.\nThe remaining ¥30 million in losses is applied to bond class B, leaving a par value of ¥90 million.\nBond class A is unaffected.\n(Choices A and B) In a waterfall structure, losses are not allocated proportionally but sequentially and by seniority. Losses are allocated to the\nmost junior tranche first.\nThings to remember:\nIn a waterfall structure (also known as credit tranching), payments go to the most senior tranche until its principal reaches zero and then cascade\ndown the tranches, paying the principal of each in order of seniority. Losses are absorbed by the most subordinate tranche first and then move\nupward sequentially to more senior tranches.\nDescribe securitization, including the parties and the roles they play. LOS\n5. Company X securitizes some of its receivables, selling them to a special purpose entity (SPE). Using the receivables as collateral, the SPE\nissues asset-backed securities (ABS), with one senior bond class and two subordinated bond classes. Company X files for bankruptcy after the\nABS issuance, due solely to a dramatic decline in sales. All else being equal, the bankruptcy's effect on the ABS structure will most likely be that:\nA. all of the bond classes will default.\n\nB. none of the bond classes will default.\nC. the bond classes will default according to seniority.\nExplanation\nIn a securitization, a company may sell an asset (eg, accounts receivable) to a special purpose entity (SPE), which then issues asset-backed\nsecurities, using the bundled receivables as collateral.\nThe SPE is a separate legal entity from the company selling the receivables. If the company later declares bankruptcy, its debts cannot be\nsatisfied by the receivables that are now owned by the SPE. The receivables now collateralize the SPE's bonds, not the company's debt.\nIf customers continue to pay the receivables, the SPE can make interest and principal payments so that all bond classes are unaffected by the\ncompany's bankruptcy. For that reason, the SPE is commonly referred to as \"bankruptcy remote\" since, all else being equal, the company's\nbankruptcy does not affect to the SPE's ABS investors (Choices A and C).\nThings to remember:\nCompanies may sell receivables to a special purpose entity (SPE), which then issues asset-backed securities (ABS) with the receivables as\ncollateral. Since the receivables are owned by the SPE (a separate legal entity), ABS investors are protected from the company's creditors if the\ncompany goes bankrupt.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 5, "q": "Company X securitizes some of its receivables, selling them to a special purpose entity (SPE). Using the receivables as collateral, the SPE issues asset-backed securities (ABS), with one senior bond class and two subordinated bond classes. Company X files for bankruptcy after the ABS issuance, due solely to a dramatic decline in sales. All else being equal, the bankruptcy's effect on the ABS structure will most likely be that:", "opts": ["all of the bond classes will default.", "none of the bond classes will default.", "the bond classes will default according to seniority."], "ans": "B", "expl": "In a securitization, a company may sell an asset (eg, accounts receivable) to a special purpose entity (SPE), which then issues asset-backed\nsecurities, using the bundled receivables as collateral.\nThe SPE is a separate legal entity from the company selling the receivables. If the company later declares bankruptcy, its debts cannot be\nsatisfied by the receivables that are now owned by the SPE. The receivables now collateralize the SPE's bonds, not the company's debt.\nIf customers continue to pay the receivables, the SPE can make interest and principal payments so that all bond classes are unaffected by the\ncompany's bankruptcy. For that reason, the SPE is commonly referred to as \"bankruptcy remote\" since, all else being equal, the company's\nbankruptcy does not affect to the SPE's ABS investors (Choices A and C).\nThings to remember:\nCompanies may sell receivables to a special purpose entity (SPE), which then issues asset-backed securities (ABS) with the receivables as\ncollateral. Since the receivables are owned by the SPE (a separate legal entity), ABS investors are protected from the company's creditors if the\ncompany goes bankrupt.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 6, "q": "In the context of securitization, describing a special-purpose entity (SPE) as \"bankruptcy remote\" most likely refers to the:", "opts": ["probability that the SPE declares bankruptcy.", "protection of the collateral from creditors' claims against the asset seller if the seller declares bankruptcy.", "responsibility of the SPE for principal and interest of a securitized loan if the borrower declares bankruptcy."], "ans": "B", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans such as mortgages or credit card receivables. The original\nlender sells the loans to a special-purpose entity (SPE), which then issues bonds that use the bundled loans as collateral. Borrowers make\npayments on the loans to the SPE, which applies the payments to the bonds' interest and principal.\nPayments made on the collateral are often the only source of payments for the bonds. For this reason, it is critical that the SPE be independent\nfrom the seller of the assets used to create the bonds. This prevents the possibility that, if the seller went bankrupt, creditors of the seller could\nseize the collateral for the securitized loans to satisfy claims against the seller. For this reason, the SPE is commonly referred to as \"bankruptcy\nremote.\"\n(Choice A) If borrowers on the collateral default in repaying those loans, this could cause the SPE to become bankrupt. \"Bankruptcy remote\"\ndoes not refer to the SPE's possibility of bankruptcy.\n(Choice C) The SPE has no obligation to assume a borrower's debt if the borrower declares bankruptcy.\nThings to remember:\nA special-purpose entity (SPE) is created to purchase loans such as mortgages or credit card receivables that will be used as collateral for bonds.\nCash generated from payments from the assets is used to pay the bonds' principal and interest. The sale of the assets must be structured so that\nthe SPE is \"bankruptcy remote,\" meaning that those assets are not subject to claims by seller's creditors if the seller later declares bankruptcy.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 7, "q": "An equipment manufacturer provides customer financing through loans. The manufacturer transfers the loans to a special purpose entity (SPE) that issues bonds to investors. The investors' collateral is most likely the: ", "opts": ["loans held by the SPE.", "cash flows of the manufacturer.", "equipment purchased with the loan financing."], "ans": "A", "expl": "Asset-backed securities (ABS) are created through a process called securitization. Firms, such as the manufacturer in this scenario, sponsor a\nspecial purpose entity (SPE), which then acquires an asset, or a portfolio of assets (eg, customer loans), that serves as collateral. As in this\ncase, the ABS sponsor is often the originator of loans that become the collateral. The SPE then issues bonds, backed by this asset, to investors.\nThe investors' collateral is the assets (ie, loans) held by the SPE. The bond investors have no claim on the assets or cash flows of the ABS\nsponsor and/or the loan originator. In this case, the manufacturer is both sponsor and originator, but it no longer owns the loans since they have\nbeen sold to the SPE (Choice B).\n(Choice C) The equipment purchased with the loan proceeds may serve as collateral for the loans but not for the bonds that use the loans as\ncollateral.\nThings to remember:\nAsset-backed securities (ABS) give investors a share of the cash flows generated by a pool of assets held by a special purpose entity (SPE). The\nassets held by the SPE serve as collateral on the ABS. ABS investors have no claim on the assets or cash flow of the loan originator or SPE\nsponsor.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 8, "q": "Which of the following is least likely a benefit of securitization?", "opts": ["Lenders enjoy additional capital resources.", "Lenders can relax credit standards in their lending decisions.", "Asset-backed securities are more liquid than the collateral used to create them."], "ans": "B", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans, such as mortgages or credit card receivables. The original\nlenders sell the assets to an entity that issues bonds secured by the assets, which are broadly referred to as asset-backed securities. The cash\nflows from these assets are used to pay the bonds' interest and principal.\nAlthough securitization offers many benefits, it can also present increased risks. A lender that plans to sell a 30-year home mortgage immediately\nafter originating it, rather than keeping the loan until it matures, has less incentive to conduct proper due diligence concerning the borrower's credit\nquality or the collateral securing the loan. This can lead to later defaults, as in the financial crisis of 2006-2008.\n(Choices A and C) Traditionally, lenders kept loans on their balance sheets until they matured; therefore, they were not liquid. However, bonds\nthat are secured by bundled assets can be traded in the secondary market; therefore, they are liquid. This liquidity is a benefit of securitization. In\naddition, securitization provides lenders with another source of capital aside from borrowing or selling equity.\nThings to remember:\nSecuritization is the process of bundling cash-generating loans that serve as collateral for bonds. The benefits of securitization include enhanced\nliquidity as well as an additional means to raise capital, but there is a risk that lenders may not exercise appropriate due diligence with respect to\nthe borrower's credit quality or the collateral that backs the loan.\nExplain benefits of securitization for issuers, investors, economies, and financial markets.", "qhtml": null}];
const CFG = {"title": "Wiley · Fixed-Income Securitization", "subtitle": "CFA Level I · Wiley/UWorld 2024 · Fixed Income · 8 câu", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
