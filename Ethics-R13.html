<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Gordon McKinney, CFA, works in the trust department of a bank. The bank's trust account\nholds a large block of a particular company. McKinney learns from a market news service\nthat this company is going to buy back one million shares at a 15% premium to the market\nprice on a first-come-first-served basis. McKinney immediately tells his mother-in-law to\ntender her shares but waits until the end of the day to tender the trust's shares. McKinney\nhas most likely violated the Standard concerning:", "opts": ["material nonpublic information.", "loyalty.", "priority of transactions."], "ans": "C", "expl": "Standard VI(B) Priority of Transactions applies. If an analyst decides to make a\nrecommendation about the purchase or sale of a security, he must give his customers or\nemployer adequate opportunity to act on this recommendation before acting on his own\nbehalf. Personal transactions include those made for the member's own account and\nfamily accounts. Here, McKinney violated Standard VI(B) by acting on his mother-in-law's\nbehalf and then waiting until the end of the day to act on his employer's behalf.\nExplanations for other responses:\nStandard IV(A), Loyalty to Employer, does not apply. This standard concerns a\nmember competing with his/her employer (independent practice), for example a\nmember who engages in outside consulting.\nStandard II(A), Material Nonpublic Information, does not apply. The question does\nnot indicate that the information is not public."}, {"n": 2, "q": "Robert Hamilton, a CFA candidate, is preparing a research report on Pets-R-Us for public\ndistribution. Hamilton's preliminary report contains unfavorable earnings forecasts for the\nnext four quarters. As part of his analysis, Hamilton met with Linda Brisson, the president of\nPets-R-Us, and asked her to review the preliminary report for factual inaccuracies. Brisson\nrevised Hamilton's earnings forecasts so that the quarterly earnings showed an upward\ntrend and resulted in positive earnings by the fourth quarter. Hamilton included the revised\nearnings figures in his report without further review. Although the final report included the\nbasic characteristics of Pets-R-Us, it emphasized certain areas such as projected quarterly\nearnings but only briefly touched on others. According to CFA Institute Standards of\nProfessional Conduct on research reports, Hamilton:", "opts": ["did not violate the Standard.", "violated the Standard because the report did not give similar attention to all areas but instead emphasized quarterly earnings at the expense of other areas.", "violated the Standard because he did not thoroughly review and analyze any information provided by Brisson."], "ans": "C", "expl": "Standard V(B) permits Hamilton to ask company management to review his report for\nfactual inaccuracies, but Hamilton should have taken care to thoroughly review and\nanalyze any information provided by the company. Hamilton is not required to give equal\nemphasis to all areas but can emphasize certain areas, touch briefly on others, and omit\ncertain aspects deemed unimportant.\n(Module 93.1, LOS 93.b)"}, {"n": 3, "q": "Mary Hiller, CFA, is a senior analyst at a mutual fund. She is also a member of the Board of\nthe Directors of her daughter's Skating Club. She is often asked for advice about the\nmanagement of the club budget and about possible short-term investments, but she is not\npaid for this advice. She does not undertake any research to answer these questions,\nproviding information based only on the general practices of the mutual fund at that\nmoment. The only benefit she receives is a free monthly membership for her daughter that\nwould usually cost $182. What should she do before making any recommendations, in order\nto comply with the CFA Institute requirements?", "opts": ["Consult only on her free time and do not accept any benefit greater than $100.", "Inform her current clients about her outside consulting.", "Obtain prior permission from her employer."], "ans": "C", "expl": "According to Standard IV(A) Loyalty to Employer, it is the employee's duty to inform the\nemployer about any type of outside consulting service, including duration and any\ncompensation. Only after receiving permission from her employer, can she proceed.\n(Module 93.1, LOS 93.b)"}, {"n": 4, "q": "Deloris Johnson, CFA, observed that her supervisor has violated a federal securities\nregulation. Johnson discussed the matter with her company's compliance department but\nthey have taken no action. According to the CFA Institute Code and Standards of\nProfessional Conduct, Johnson is required to:", "opts": ["confront the supervisor and attempt to stop the violation.", "dissociate from the supervisor’s activity.", "report the violation to securities regulators."], "ans": "B", "expl": "Johnson must dissociate herself from her supervisor's activity, for example by asking to be\nreassigned. The Code and Standards do not require Johnson to report the violation to\ngovernmental or regulatory organizations unless doing so is required by applicable law.\nJohnson has attempted to stop the violation by discussing it with her compliance\ndepartment. She is not required by the Code and Standards to confront the supervisor."}, {"n": 5, "q": "Lisa Pierce, CFA, has been researching Lander Manufacturing for the past three weeks. She\nlikes the company's history of fulfilling its contracts on time and within budget. She learns\nfrom the uncle of a maintenance worker at Lander's headquarters that a group of well-\ndressed individuals arrived at headquarters in a lime green-colored limousine. Pierce knows\nfrom publicly available information that Gilbert Controls needs a large supply of specialized\nmotors in its domestic division. She also knows that the executive officers of Gilbert usually\ntravel in a lime green limousine. Pierce concludes that it is very likely that Gilbert will offer a\nlarge contract to Lander. Based on this development and her prior research Pierce would\nlike to acquire Lander Manufacturing shares for her client accounts.\nPierce should:", "opts": ["not acquire the shares because she possesses material nonpublic information. not acquire the shares until after she has contacted Lander's management and", "encouraged them to publicly announce information about the Gilbert Controls contract. She should also wait until Lander has made the announcement and the", "public has had time to react to it and then make the acquisition. proceed to acquire the shares."], "ans": "C", "expl": "Standard II(A) prohibits members from taking investment action if they possess material\nnonpublic information. Pierce combined information that was not misappropriated, with\nher knowledge of the company, to reach a conclusion under the mosaic theory, which is\npermissible under the standards. She can proceed to buy the shares.\n(Module 93.1, LOS 93.a)"}, {"n": 6, "q": "Jess Green, CFA, is the research director for Castle Investment, Inc., and has supervisory\nresponsibility over eight analysts, including three CFA charterholders. Castle has a\ncompliance program in place. According to CFA Institute Standards of Professional Conduct,\nwhich of the following is least likely an action that Green should take to adhere to the\ncompliance procedures involving responsibilities of supervisors? Green should:", "opts": ["issue periodic reminders of the procedures to all analysts under his supervision.", "disseminate the contents of the compliance program to the eight analysts.", "incorporate a professional conduct evaluation as part of the performance review only for the three CFA charterholders."], "ans": "C", "expl": "Green should incorporate a professional conduct evaluation as part of his review of all\neight analysts under his supervision, not just the three CFA charterholders."}, {"n": 7, "q": "Seminole Equity Fund has been in existence for eight years. In a brief presentation to\npotential investors, the fund's manager reports its performance history for the most recent\nfive years, and notes that more detailed information is available on request. This action is:", "opts": ["in accordance with the Code and Standards.", "a violation of the Standard concerning performance presentation.", "a violation of the Standard concerning misrepresentation."], "ans": "A", "expl": "Standard III(D) Performance Presentation states that members and candidates may make\nbrief presentations and offer more detailed information on request, as long as the\npresentation does not mislead clients and prospects about the performance of the fund or\nmanager.\n(Module 93.1, LOS 93.b)"}, {"n": 8, "q": "Ralph Lim and Susan Bland have both passed Level I of the CFA Program. Both are currently\nenrolled to sit for Level II. Lim's business card reads, \"Ralph Lim, CFA Level I.\" Bland's resume\nstates, \"Level II Candidate in the CFA Program.\" According to CFA Institute Standards of\nProfessional Conduct involving use of the professional designation:", "opts": ["Bland violated the Standard, but Lim did not.", "Both Lim and Bland violated the Standard.", "Lim violated the Standard, but Bland did not."], "ans": "C", "expl": "There is no designation for someone who has passed Level I, Level II, or Level III of the CFA\nexamination. Candidates may state, however, that they have completed Level I, II, or III, as\nthe case may be, in the CFA Program. Thus, Lim violated the Standard, but Bland did not."}, {"n": 9, "q": "Heidi Krueger, CFA, an investment advisor, applies soft dollars generated from client\naccounts to purchase a report on the economic impact of world events, and to purchase a\nnew conference table for the office she uses to meet with clients and prospects. Do these\ntwo purchases violate the Standard related to loyalty, prudence, and care?", "opts": ["Only one of these purchases violates the Standard.", "Both of these purchases violate the Standard.", "Neither of these purchases violates the Standard."], "ans": "A", "expl": "Using soft dollars for the purchase of office furniture does not benefit clients and is a\nviolation. Purchasing research reports with soft dollars is not a violation, but the advisor\nshould ensure that research purchased with client brokerage will benefit her clients.\n(Module 93.1, LOS 93.a)"}, {"n": 10, "q": "Nancy Hall, a candidate in the CFA program, is an analyst for a mutual fund. As part of her\njob she makes company visits to interview executives. On a recent trip she stayed with her\nsister instead of at a hotel. In her expenses Hall included a hotel charge of $100, which was\nless than the amount allowed by her employer. After receiving a check for her expenses, Hall\ndisclosed to her supervisor that she had stayed with her sister instead of at a hotel. She also\nreturned the $100 to her employer. According to CFA Institute Standards of Professional\nConduct, which of the following statements best describes Hall's professional conduct?", "opts": ["Hall engaged in professional misconduct.", "Hall did not engage in professional misconduct because she eventually disclosed this information and returned the $100 to her employer.", "Hall did not engage in professional misconduct because she did not meet all of the requirements to use the CFA designation."], "ans": "A", "expl": "Hall engaged in professional misconduct because her act involved dishonesty, fraud, and\ndeceit.\n(Module 93.1, LOS 93.b)"}, {"n": 11, "q": "Paul Thomas, CFA, is designing a new layout for research reports his firm writes and issues\non individual stocks. In his design, Thomas includes a stock chart on the first page of each\nreport. He does not reference that the charts are copied from an unrecognizable finance\nwebsite. Thomas has:", "opts": ["not violated CFA Institute Standards of Professional Conduct because these charts are widely available over the internet.", "violated CFA Institute Standards of Professional Conduct because he did not make sure that the information in these charts is accurate.", "violated CFA Institute Standards of Professional Conduct because he did not state the source of the charts."], "ans": "C", "expl": "Standard I(C) Misrepresentation. Members should not copy or use material prepared by\nothers without acknowledging and identifying the source of such material. Using charts\nand graphs without stating their source is a violation of the Standard.\n(Module 93.1, LOS 93.a)"}, {"n": 12, "q": "Calvin Doggett, CFA, has been contacted by the CFA Institute Professional Conduct Program\n(PCP) regarding allegations that he has taken investment actions that were unsuitable for his\nclients. Doggett is questioned by PCP concerning the identity of his clients he considered\nsuitable for investing in a very risky start-up company that eventually went bankrupt.\nDoggett will:", "opts": ["not violate the Code and Standards by revealing the names, financial condition and investment objectives of his clients to PCP.", "not violate the Code and Standards only if he reveals the financial condition and investment objectives of his clients on an anonymous basis and does not reveal the names of his clients to PCP.", "violate the Code and Standards by fully cooperating with a PCP investigation if it means revealing confidential information."], "ans": "A", "expl": "Standard III(E) requires members to preserve client confidentiality. An exception to this\nstandard is a PCP investigation. Because PCP will also keep the clients' information\nconfidential, members are expected to fully cooperate with PCP investigations."}, {"n": 13, "q": "Jan Hirsh, CFA, is employed by a college to manage its endowment fund. The endowment\ncarries out its transactions primarily through the brokerage firm Advisors, Inc. Over the\nyears, Hirsh has developed a solid relationship with Advisors. Advisors offers Hirsh their\nhighest level of service for her personal account if the endowment continues to exceed a\nminimum number of transactions per year with Advisors. The Code and Standards most\nlikely require Hirsh to:", "opts": ["disclose this benefit to the college, but it does not require her to receive the college’s permission.", "receive the college’s permission before accepting this benefit.", "decline this benefit because it represents a conflict of interest with the college."], "ans": "B", "expl": "Standard IV(B) Additional Compensation Arrangements requires Hirsh to receive her\nemployer's permission in writing before she can accept the offer from Advisors, because it\ncan reasonably be expected to create a conflict with the college's interests in that it may\ninduce Hirsh not to seek better execution from other brokers.\n(Module 93.1, LOS 93.a)"}, {"n": 14, "q": "Vijay Gill, CFA, leases office space from Land Bank in exchange for an agreement that Gill will\npay Land 20% of any fees paid by Land customers to Gill for investment management\nservices. Gill also has an arrangement with Bloom Insurance Advisors whereby Gill receives a\nfee for each client referred. Gill only refers clients that request insurance products. Gill\nmeets with Randolph Song, a Land Bank customer, who is interested in Gill's asset\nmanagement services as well as insurance products. Gill is required to disclose to Song:", "opts": ["neither the Land Bank nor Bloom arrangements, but may disclose them if he chooses to do so.", "the terms of the arrangement with Bloom, but not the terms of the arrangement with Land Bank.", "the terms of the arrangements with both Land Bank and Bloom."], "ans": "C", "expl": "Standard VI(C) Referral Fees requires members to disclose to clients and prospects any\nconsideration or benefit received by the member or delivered to others for the\nrecommendation of any services to the client or prospect. Gill is delivering a benefit to\nLand Bank and receiving a benefit from Bloom, both of which must be disclosed to Song.\n(Module 93.1, LOS 93.a)"}, {"n": 15, "q": "Lindsay Gordon is a Level II CFA candidate. Gordon's best friend, Steve Haney, is also a Level\nII candidate and has registered for the same exam window as Gordon. Because Haney's\nexam appointment is the day before Gordon's appointment, Gordon suggests that Haney try\nto remember some of the exam questions and let her know what they asked. After Haney\ntakes his exam, he reminds Gordon that the Code and Standards prohibit candidates from\ndisclosing specific exam questions, and only gives her a general idea of what topics were\ntested or not tested. Which of the following statements regarding Gordon and Haney is most\naccurate?", "opts": ["Both Gordon and Haney are in violation of the Code and Standards.", "Neither Gordon nor Haney is in violation of the Code and Standards.", "Gordon is in violation of the Code and Standards, but Haney is not in violation."], "ans": "A", "expl": "Both Gordon and Haney violated Standard VII(A) Conduct as Participants in CFA Institute\nPrograms by compromising the integrity of the exam. The Standard prohibits candidates\nfrom discussing specific exam questions or which topics were tested or not tested.\n(Module 93.1, LOS 93.b)"}, {"n": 16, "q": "Lance Tuipulotu, CFA, manages investments for 400 individuals and families and often finds\nhis resources stretched. When his largest investors petition him to include a 5% to 7%\nallocation of non-investment-grade bonds in their portfolios, he decides he needs additional\nhelp to meet the request. He considers various subadvisers who specialize in that asset\nclass. To have a reasonable basis for selecting a subadviser, criteria that Tuipulotu should\nuse should least likely include:", "opts": ["their internal controls.", "adherence to their stated strategies.", "consistently high historical returns."], "ans": "C", "expl": "Guidance for Standard V(A) Diligence and Reasonable Basis states that when reviewing\nexternal advisers, members and candidates should (at a minimum) evaluate the adviser's\ncode of ethics, its compliance procedures and internal controls, its investment processes\nand adherence to its stated strategies, and the quality of its published information on\nreturns."}, {"n": 17, "q": "Steve Waters, a Level I CFA candidate, has decided to enter into a long position of Farmco\nstock. Since Farmco is thinly traded, Waters is concerned the order will overwhelm the\nliquidity of Farmco and the price will surge. Waters engages in a series of block trades in\norder to accomplish the purchase. According to Standard II(B), Market Manipulation, Waters\nhas engaged in:", "opts": ["neither transaction-based manipulation nor information-based manipulation.", "transaction-based manipulation, but not information-based manipulation.", "both transaction-based manipulation and information-based manipulation."], "ans": "A", "expl": "Waters is not in violation of Standard II(B), Market Manipulation. Transaction-based\nmanipulation includes, but is not limited to, transactions that artificially distort prices or\nvolume. Information-based manipulation includes, but is not limited to, spreading false\nrumors about a firm in order to induce others to trade."}, {"n": 18, "q": "The following scenarios involve two analysts at Dupree Asset Management, a small New\nYork-based company with about $150 million in assets under management. Dupree restricts\npersonal trading of stocks analyzed, corporate directorships, trustee positions, and other\nspecial relationships that could reasonably be considered a conflict of interest with their\nresponsibilities to their employer.\nRay Bolt, CFA, is a senior investment analyst. Bolt was recently elected to the board of\ntrustees of his alma mater, Midwest University, and was appointed as the chairman of\nthe University's endowment committee. Midwest has more than $2 billion in its\nendowment. Bolt must travel from New York to Chicago eight times a year to attend\nmeetings of the board of trustees and endowment committee. Bolt did not inform\nDupree of his involvement with Midwest University.\nWanda Delvecco, a candidate in the CFA Program, is a junior investment analyst. She\nrecently wrote a research report on Aveco Communications and recommended the\nstock for Dupree's \"buy\" list. Delvecco bought 200 shares of Aveco stock for her\npersonal account 12 months before she wrote her research report. Over the past 12\nmonths, the stock's price has been in the $20-42 price range. Delvecco has not\ninformed Dupree of her ownership of Aveco stock.\nAccording to CFA Institute Standards of Professional Conduct, which the following\nstatements about Bolt and Delvecco's actions is CORRECT?", "opts": ["Neither Bolt nor Delvecco violated the Standards.", "Delvecco violated the Standards, but Bolt did not.", "Both Bolt and Delvecco violated the Standards."], "ans": "C", "expl": "Standard VI(A), Avoid or Disclose Conflicts, requires that Bolt inform Dupree of his\ninvolvement with Midwest University given that Bolt's new role can be expected to be time\nconsuming and possibly affect his responsibilities at Dupree. Delvecco is required to\ndisclose her ownership of Aveco stock before conducting the research report because\nsuch ownership could bias her objectivity in making a recommendation. She should have\ndiscussed owning the stock with her supervisor before beginning to write the research\nreport on Aveco."}];
const CFG = {"title": "Ethics Application", "subtitle": "CFA · Ethical & Professional Standards · Reading 93 (Schweser)", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; stem.textContent = q.q;
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');
    var icon=document.getElementById('rIcon');
    var title=document.getElementById('rTitle');
    var emoji=document.getElementById('rEmoji');
    var score=document.getElementById('rScore');
    var m=badgeText.split('·'); score.textContent=m.length>1?m[1].trim():'';
    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');
      emoji.textContent='🎉';
      fetchEmoji('face-positive', emoji);
      confetti();
    }else{
      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();
</script>
