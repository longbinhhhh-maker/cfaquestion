<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<title>Quiz</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='index.html#resume'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()"><lord-icon class="hi" src="https://cdn.lordicon.com/lyrrgrsl.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()"><lord-icon class="hi" src="https://cdn.lordicon.com/xjovhxra.json" trigger="loop-on-hover" colors="primary:#538297,secondary:#86a7b5"></lord-icon>Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()"><lord-icon src="https://cdn.lordicon.com/oqdmuxru.json" trigger="loop-on-hover" colors="primary:#ffffff,secondary:#ffffff"></lord-icon>Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big"><lord-icon src="https://cdn.lordicon.com/kbtmbyzy.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon></div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay">
  <div class="modal">
    <span id="rEmoji" class="r-emoji">🎉</span>
    <lord-icon id="rIcon" src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#538297,secondary:#86a7b5"></lord-icon>
    <h3 id="rTitle"></h3>
    <p id="rScore" class="r-score"></p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="document.getElementById('resultOverlay').classList.remove('show')">Xem lại bài</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n":1,"q":"Q. All else being equal, a reverse stock split results in:","opts":["a decrease in the number of shares and an increase in the share price.","an increase in the number of shares and a decrease in the share price.","an increase in the number of shares and an increase in the share price."],"ans":"A","expl":"A. Đúng vì việc chia tách cổ phiếu ngược lại liên quan đến việc giảm số lượng cổ phiếu\nđang lưu hành với mức tăng giá cổ phiếu tương ứng.\nB. Không chính xác vì điều này mô tả việc chia tách cổ phiếu chứ không phải việc chia tách cổ phiếu ngược lại. Việc chia tách cổ phiếu liên quan đến\nsự gia tăng số lượng cổ phiếu đang lưu hành dẫn đến giá cổ phiếu giảm. Việc chia tách cổ phiếu ngược lại liên quan đến việc giảm số lượng cổ phiếu đang lưu hành với a\ngiá cổ phiếu tăng tương ứng.\nC. Không chính xác vì việc chia tách cổ phiếu ngược lại liên quan đến việc giảm số lượng cổ phiếu\nđang lưu hành với mức tăng giá cổ phiếu tương ứng.\nĐầu tư vốn cổ phần\n mô tả cổ tức bằng tiền mặt thường xuyên, cổ tức tăng thêm, cổ tức bằng cổ phiếu, chia tách cổ phiếu, đảo ngược\nchia tách cổ phiếu và cổ phiếu","qhtml":null},{"n":2,"q":"Q. All else being equal, which of the following has the same effect on shareholders' wealth\nas a cash dividend?","opts":["A stock split","A stock dividend","A share repurchase"],"ans":"C","expl":"A. Không chính xác vì trái ngược với việc trả cổ tức bằng cổ phiếu và chia tách cổ phiếu, việc mua lại cổ phiếu là một\nthay thế cho việc trả cổ tức bằng tiền mặt.\nB. Không chính xác vì trái ngược với việc trả cổ tức bằng cổ phiếu và chia tách cổ phiếu, việc mua lại cổ phiếu là một\nthay thế cho việc trả cổ tức bằng tiền mặt.\nC. Đúng vì việc mua lại cổ phiếu được coi là tương đương với việc trả cổ tức bằng tiền mặt\ncó giá trị như nhau xét về mức độ ảnh hưởng đến tài sản của cổ đông, tất cả các yếu tố khác đều như nhau.\nĐầu tư vốn chủ sở hữu\n mô tả cổ tức bằng tiền mặt thường xuyên, cổ tức tăng thêm, cổ tức bằng cổ phiếu, chia tách cổ phiếu,\ntách cổ phiếu ngược và mua lại cổ phiếu","qhtml":null},{"n":3,"q":"Q. Sponsored depository receipts most likely differ from unsponsored ones in terms of\nwhether:","opts":["investors have voting rights.","they are traded on exchanges.","their prices are affected by exchange rate movements."],"ans":"A","expl":"A. Đúng vì DR được tài trợ là khi công ty nước ngoài có cổ phần do cơ quan lưu ký\n nắm giữ có liên quan trực tiếp đến việc phát hành biên lai. Các nhà đầu tư vào DR được tài trợ\ncó các quyền giống như chủ sở hữu trực tiếp của cổ phiếu phổ thông (ví dụ: quyền biểu quyết và\nquyền nhận cổ tức). Ngược lại, với DR không được tài trợ, công ty\nnước ngoài cơ bản không liên quan đến việc phát hành biên lai. Thay vào đó, cơ quan lưu ký\nmua cổ phần của công ty nước ngoài tại thị trường trong nước và sau đó phát hành biên lai\nthông qua các công ty môi giới tại thị trường địa phương của cơ quan lưu ký. Trong trường hợp này, ngân hàng lưu ký, chứ không phải\nnhà đầu tư vào DR, giữ quyền biểu quyết.\nB. Không chính xác vì biên lai lưu ký (DR) (được tài trợ hoặc không được tài trợ) là chứng khoán\ngiao dịch giống như cổ phiếu phổ thông trên một sàn giao dịch địa phương và thể hiện lợi ích kinh tế trong một\ncông ty nước ngoài.\nC. Không chính xác vì biên nhận lưu ký (DR) (được tài trợ hoặc không được tài trợ) là chứng khoán\ngiao dịch giống như cổ phiếu phổ thông trên sàn giao dịch địa phương và thể hiện lợi ích kinh tế trong một\ncông ty nước ngoài. Giá của mỗi DR sẽ bị ảnh hưởng bởi các yếu tố ảnh hưởng đến giá của\ncổ phiếu cơ bản, chẳng hạn như các nguyên tắc cơ bản của công ty, điều kiện thị trường,\nkhuyến nghị của nhà phân tích và biến động tỷ giá hối đoái.\nĐầu tư vốn cổ phần\n→ mô tả các phương pháp đầu tư vào chứng khoán vốn phi nội địa","qhtml":null},{"n":4,"q":"Q. All else being equal, which of the following are equivalent to stock dividends in terms of\nthe economic effect on the company and shareholders?","opts":["Stock splits","Cash dividends","Share repurchases"],"ans":"A","expl":"A. Đúng vì cổ tức bằng cổ phiếu chia \"chiếc bánh\" (giá trị thị trường của vốn chủ sở hữu của cổ đông)\nthành những phần nhỏ hơn mà không ảnh hưởng đến giá trị của chiếc bánh hoặc quyền sở hữu theo tỷ lệ\ncủa bất kỳ cổ đông nào trong công ty. Vì vậy, cổ tức bằng cổ phiếu không liên quan đến việc định giá. Việc chia tách cổ phiếu và\ntách cổ phiếu ngược tương tự như chia cổ tức bằng cổ phiếu ở chỗ chúng không có tác động kinh tế đối với\ncông ty hoặc cổ đông.\nB. Không chính xác vì cổ tức bằng tiền mặt là việc phân phối tiền mặt cho các cổ đông của công ty.\nKhông có dòng tiền nào từ công ty đến cổ đông xảy ra trong trường hợp chia cổ tức bằng cổ phiếu. Cổ tức\ncổ tức chia \"chiếc bánh\" (giá trị thị trường của vốn chủ sở hữu của cổ đông) thành những phần nhỏ hơn mà\nkhông ảnh hưởng đến giá trị của chiếc bánh hoặc quyền sở hữu theo tỷ lệ của bất kỳ cổ đông nào trong công ty. Do đó,\ncổ tức bằng cổ phiếu không liên quan đến việc định giá.\nC. Không chính xác vì mua lại cổ phiếu (hoặc mua lại) là một giao dịch trong đó một công ty sử dụng\ntiền mặt để mua lại cổ phiếu của chính mình. Việc mua lại cổ phiếu được coi là tương đương với việc thanh toán\ncổ tức bằng tiền mặt có giá trị như nhau xét về mức độ ảnh hưởng đến tài sản của cổ đông, tất cả các yếu tố khác\nbằng nhau.","qhtml":null},{"n":5,"q":"Q. Asset-based valuation most likely uses estimates of the company's:","opts":["assets only.","assets and liabilities only.","assets, liabilities and projected cash flow."],"ans":"B","expl":"A. Không chính xác vì việc định giá dựa trên tài sản của một công ty sử dụng các ước tính về thị trường hoặc giá trị\nhợp lý của tài sản và nợ phải trả của công ty.\nB. Đúng vì việc định giá dựa trên tài sản của một công ty sử dụng các ước tính về thị trường hoặc giá trị\nhợp lý của tài sản và nợ phải trả của công ty.\nC. Không chính xác vì việc định giá dựa trên tài sản của một công ty sử dụng các ước tính về thị trường hoặc giá trị hợp lý\ncủa tài sản và nợ phải trả của công ty.\nĐầu tư vốn cổ phần\n→ mô tả các mô hình định giá dựa trên tài sản và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu","qhtml":null},{"n":6,"q":"Q. The dividend discount model assumes that dividends are paid:","opts":["quarterly.","half yearly.","at the end of each year."],"ans":"C","expl":"A. Không chính xác vì theo mô hình chiết khấu cổ tức, cổ tức D mỗi năm là\ncổ tức dự kiến ​​trong năm t, giả định được trả vào cuối năm chứ không phải vào đầu\nmỗi năm.\nB. Không chính xác vì theo mô hình chiết khấu cổ tức, cổ tức D mỗi năm là\ncổ tức dự kiến ​​trong năm t, giả định được trả vào cuối năm, không phải vào thời điểm giữa\nmỗi năm.\nC. Đúng vì theo mô hình chiết khấu cổ tức, cổ tức D mỗi năm là\ncổ tức dự kiến trong năm t, giả định được trả vào cuối năm.\nĐầu tư vốn cổ phần\n giải thích lý do sử dụng mô hình giá trị hiện tại để định giá vốn chủ sở hữu và mô tả\nchiết khấu cổ tức và mô hình dòng tiền tự do trên vốn chủ sở hữu","qhtml":null},{"n":7,"q":"An analyst gathers the following information about a company and its common stock:\nForward P/E 8\nRequired rate of return 12%\nDividend growth rate 4%\nQ. Using the Gordon growth model, the company's dividend payout ratio is closest to:","opts":["8%.","33%.","64%."],"ans":"C","expl":"A. Không chính xác vì nó nhầm lẫn giữa tỷ lệ chi trả cổ tức với tỷ suất cổ tức trong phương trình mô hình tăng trưởng Gordon\n, dẫn đến: D₁/Por-g=0,12-0,04 = 0,08 = 8%.\nB. Không chính xác vì nó nhầm lẫn tỷ lệ chi trả cổ tức là tốc độ tăng trưởng cổ tức chia\ncho tỷ lệ lợi nhuận yêu cầu, dẫn đến p = 0,04/0,120,33333%. Con số này cũng gần nhất với tích\ncủa P/E dự phóng và tốc độ tăng trưởng cổ tức: 8,0 x 0,04 = 0,32 = 32%.\nC. Đúng vì theo phương trình mô hình tăng trưởng Gordon","qhtml":"<p>An analyst gathers the following information about a company and its common stock:</p><table class=\"qtable\"><tbody><tr><td>Forward P/E</td><td>8</td></tr><tr><td>Required rate of return</td><td>12%</td></tr><tr><td>Dividend growth rate</td><td>4%</td></tr></tbody></table><p>Using the Gordon growth model, the company's dividend payout ratio is closest to:</p>"},{"n":8,"q":"Q. Asset-based valuation models are most appropriate for companies with a high\nproportion of:","opts":["illiquid assets.","current assets.","intangible assets."],"ans":"B","expl":"A. Không chính xác vì tài sản kém thanh khoản sẽ không có giá trị thị trường (hợp lý) có thể xác định dễ dàng và\nsẽ rất khó phân tích bằng các phương pháp định giá tài sản.\nB. Đúng vì việc định giá dựa trên tài sản có hiệu quả đối với các công ty có\ntỷ lệ tài sản lưu động và nợ ngắn hạn cao.\nC. Không chính xác vì việc định giá dựa trên tài sản phù hợp với những công ty không có\ntỷ lệ tài sản vô hình hoặc 'ngoài sổ sách' cao.\nĐầu tư vốn cổ phần\n→ mô tả các mô hình định giá dựa trên tài sản và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu","qhtml":null},{"n":9,"q":"Q. Both equity and fixed income indexes can be categorized according to the:","opts":["currency of payments.","issuer's economic sector.","degree of inflation protection."],"ans":"B","expl":"A. Không chính xác vì tính năng này dành riêng cho chỉ số thu nhập cố định.\nB. Đúng vì cả chỉ số vốn chủ sở hữu và thu nhập cố định đều có thể được xây dựng theo ngành\n. Tương tự như cổ phiếu, chứng khoán có thu nhập cố định có thể được phân loại theo ngành kinh tế\ncủa tổ chức phát hành, khu vực địa lý của tổ chức phát hành hoặc sự phát triển kinh tế của\nkhu vực địa lý của tổ chức phát hành.\nC. Không chính xác vì tính năng này dành riêng cho các chỉ mục thu nhập cố định.\nĐầu tư vốn chủ sở hữu\n→ mô tả các loại chỉ mục thu nhập cố định","qhtml":null},{"n":10,"q":"Q. Trading by arbitrageurs most likely:","opts":["reduces liquidity.","increases pricing discrepancies.","contributes to market efficiency."],"ans":"C","expl":"A. Không chính xác vì các nhà kinh doanh chênh lệch giá cung cấp tính thanh khoản cho người mua và người bán đến các thị trường\nkhác nhau cùng một lúc. Họ di chuyển thanh khoản trên khắp các thị trường. Nhà kinh doanh chênh lệch giá cung cấp tính thanh khoản cho\nthị trường vì chúng giúp người mua và người bán giao dịch dễ dàng hơn khi nào và ở đâu họ\nmuốn giao dịch.\nB. Không chính xác vì sự hiện diện của các nhà kinh doanh chênh lệch giá giúp sự chênh lệch về giá biến mất nhanh chóng.\nC. Đúng vì nhà kinh doanh chênh lệch giá là những nhà giao dịch tham gia vào các giao dịch như vậy để hưởng lợi từ sự chênh lệch về giá\n(sự kém hiệu quả) trên thị trường. Hoạt động giao dịch như vậy góp phần mang lại hiệu quả cho thị trường.\nSự hiện diện của những nhà kinh doanh chênh lệch giá này giúp sự chênh lệch về giá biến mất nhanh chóng.\nĐầu tư vốn cổ phần\n→ giải thích các yếu tố ảnh hưởng đến hiệu quả của thị trường","qhtml":null},{"n":11,"q":"Q. A feature of an efficient market is that:","opts":["the market reflects all past and present information.","asset prices react to information that is fully anticipated.","an investor can earn consistent, superior, risk-adjusted returns."],"ans":"A","expl":"A. Đúng vì thị trường hiệu quả là thị trường trong đó giá tài sản phản ánh tất cả thông tin trong quá khứ và\nhiện tại.\nB. Không chính xác vì trong một thị trường hiệu quả, giá dự kiến ​​chỉ phản ứng với các yếu tố\ncủa thông tin được công bố mà các nhà đầu tư không dự đoán đầy đủ-tức là với\nyếu tố \"bất ngờ\" hoặc \"bất ngờ\" của các thông tin được công bố đó.\nC. Không chính xác vì lợi nhuận nhất quán, vượt trội, được điều chỉnh theo rủi ro (trừ tất cả các chi phí) không thể đạt được\ntrong một thị trường hiệu quả.\nĐầu tư vốn cổ phần\n mô tả hiệu quả thị trường và các khái niệm liên quan, bao gồm cả tầm quan trọng của chúng đối với\nnhững người thực hành đầu tư","qhtml":null},{"n":12,"q":"Q. Decreased market efficiency is most likely associated with an increase in:","opts":["transaction costs.","financial disclosure.","the number of market participants."],"ans":"A","expl":"A. Đúng vì chi phí giao dịch tăng sẽ làm tăng chênh lệch giá giữa\ngiá thị trường và giá hiệu quả. Chi phí giao dịch cao hơn khiến các nhà giao dịch\nkhai thác sự thiếu hiệu quả của thị trường trở nên tốn kém hơn, do đó làm giảm hiệu quả của thị trường. Sự kém hiệu quả cũng có thể\nkhông thể khai thác được nếu số tiền chi phí giao dịch bù đắp cho số tiền chênh lệch về giá.\nSự chênh lệch về giá phải đủ lớn để mang lại cho nhà đầu tư một khoản lợi nhuận (được điều chỉnh cho rủi ro\n) sau khi tính đến chi phí giao dịch và chi phí thu thập thông tin để đi đến kết luận\nrằng sự khác biệt đó có thể là một thị trường kém hiệu quả.\nB. Không chính xác vì các quy tắc và quy định thúc đẩy sự công bằng và hiệu quả trên thị trường\nbao gồm những quy tắc liên quan đến việc tiết lộ thông tin và giao dịch nội gián bất hợp pháp.\nC. Không chính xác vì sự gia tăng số lượng người tham gia thị trường làm tăng hiệu quả. Nếu một\nmột số lượng lớn nhà đầu tư (cá nhân và tổ chức) theo dõi chặt chẽ các thị trường tài chính lớn\nhàng ngày và nếu việc định giá sai tồn tại ở các thị trường này thì các nhà đầu tư sẽ hành động để những\nviệc định giá sai này biến mất nhanh chóng.","qhtml":null},{"n":13,"q":"Q. Which of the following is most likely a demographic influence on industry growth?","opts":["Lifestyle","Distribution of age","Spending behavior"],"ans":"B","expl":"A. Không chính xác vì những thay đổi trong lối sống của con người xảy ra do ảnh hưởng của xã hội.\nNhững thay đổi xã hội liên quan đến cách mọi người làm việc, tiêu tiền, tận hưởng thời gian rảnh rỗi và\ntiến hành các khía cạnh khác trong cuộc sống của họ có thể có tác động đáng kể đến doanh số bán hàng của nhiều ngành\n.\nB. Đúng vì những thay đổi trong phân bổ độ tuổi xảy ra do ảnh hưởng của nhân khẩu học.\nNhững thay đổi về quy mô dân số, phân bổ độ tuổi và giới tính cũng như các đặc điểm nhân khẩu học\ncó thể có tác động đáng kể đến tăng trưởng kinh tế cũng như số lượng và chủng loại\nhàng hóa và dịch vụ được tiêu thụ.\nC. Không chính xác vì những thay đổi trong hành vi chi tiêu của khách hàng xảy ra do ảnh hưởng của xã hội\n. Những thay đổi xã hội liên quan đến cách mọi người làm việc, tiêu tiền, tận hưởng thời gian rảnh rỗi\nvà thực hiện các khía cạnh khác trong cuộc sống của họ có thể có tác động đáng kể đến doanh thu của nhiều\ncác ngành khác nhau.\nĐầu tư vốn cổ phần\n phân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng của Porter và\nkhung PESTLE","qhtml":null},{"n":14,"q":"Q. Fixed-income indexes most likely:","opts":["are more easily replicated than equity indexes.","require the provider to estimate the prices of some constituent securities.","are created from a smaller universe of possible constituent securities than the universe of equity securities."],"ans":"B","expl":"A. Không chính xác vì so với các chỉ số vốn chủ sở hữu, các nhà đầu tư gặp khó khăn trong việc tái tạo các chỉ số thu nhập cố định\nvà nhân đôi hiệu suất của chúng.\nB. Đúng vì so với chỉ số vốn chủ sở hữu, các nhà cung cấp chỉ số thu nhập cố định phải liên hệ với\ncác đại lý để có được giá hiện tại của chứng khoán cấu thành nhằm cập nhật chỉ số hoặc họ phải\nước tính giá chứng khoán cấu thành bằng cách sử dụng giá chứng khoán thu nhập cố định được giao dịch\ncó đặc điểm tương tự.\nC. Không chính xác vì số lượng chứng khoán có thu nhập cố định lớn hơn nhiều lần so với\nsố lượng chứng khoán vốn.\nĐầu tư vốn cổ phần\n→ so sánh các loại chỉ số thị trường chứng khoán","qhtml":null},{"n":15,"q":"Q. As time passes after inception, the value of the price version of an index is:","opts":["less than the value of the total return version.","equal to the value of the total return version.","greater than the value of the total return version."],"ans":"A","expl":"A. Đúng vì ngay từ đầu, các giá trị của phiên bản giá và tổng lợi nhuận của một chỉ số\nbằng nhau. Tuy nhiên, theo thời gian, giá trị của tổng chỉ số lợi nhuận sẽ vượt quá giá trị của\nchỉ số lợi nhuận theo giá.\nB. Không chính xác vì ngay từ đầu, các giá trị của phiên bản giá và tổng lợi nhuận của một chỉ mục\nbằng nhau. Tuy nhiên, theo thời gian, giá trị của tổng chỉ số lợi nhuận sẽ vượt quá giá trị của\nchỉ số lợi nhuận theo giá.\nC. Không chính xác vì ngay từ đầu, các giá trị của phiên bản giá và tổng lợi nhuận của một chỉ mục\nbằng nhau. Tuy nhiên, theo thời gian, giá trị của tổng chỉ số lợi nhuận sẽ vượt quá giá trị của\nchỉ số lợi nhuận theo giá.\nĐầu tư vốn cổ phần\n→ tính toán và diễn giải giá trị, lợi nhuận theo giá và tổng lợi nhuận của một chỉ số","qhtml":null},{"n":16,"q":"Q. With respect to behavioral finance, which of the following is least likely a behavioral\nbias used to explain pricing anomalies?","opts":["Risk aversion","Loss aversion","Overconfidence"],"ans":"A","expl":"A. Đúng vì tài chính hành vi cho phép khả năng không còn sợ rủi ro nữa.\nđối xứng, trái ngược với các mô hình tổng quát hơn mà các nhà nghiên cứu cho rằng các nhà đầu tư\nkhông thích rủi ro (ác cảm rủi ro), cho dù rủi ro là lợi nhuận cao hơn mong đợi hay thấp hơn\nhơn dự kiến.\nB. Không chính xác vì nghiên cứu tài chính hành vi ủng hộ hiện tượng các nhà đầu tư\nkhông thích mất mát. Tài chính hành vi cho phép khả năng xảy ra sự không hài lòng do một\nsự mất mát vượt quá sự hài lòng do đạt được cùng mức độ. Một số người cho rằng\nCác lý thuyết hành vi về ác cảm mất mát có thể giải thích phản ứng thái quá được quan sát thấy trên thị trường.\nKhông đúng vì nghiên cứu tài chính hành vi ủng hộ hiện tượng các nhà đầu tư đang\nquá tự tin.\nC. Bằng chứng cho thấy rằng sự tự tin thái quá dẫn đến việc định giá sai đối với các sản phẩm của Mỹ, Anh, Đức, Pháp,\nvà thị trường Nhật Bản.\nĐầu tư cổ phần\n• mô tả tài chính hành vi và mối liên quan tiềm tàng của nó với việc hiểu thị trường\nsự bất thường","qhtml":null},{"n":17,"q":"Q. With respect to behavioral finance, which of the following is least likely a behavioral\nbias used to explain pricing anomalies?","opts":["Risk aversion","Loss aversion","Overconfidence"],"ans":"C","expl":"A. Không chính xác vì các công ty phát hành vốn chủ sở hữu để vừa thực hiện việc mua lại vừa đảm bảo rằng các giao ước nợ\nđược đáp ứng.\nB. Không chính xác vì các công ty phát hành vốn chủ sở hữu để vừa thực hiện việc mua lại vừa đảm bảo rằng các giao ước nợ\nđược đáp ứng.\nC. Đúng vì các công ty phát hành vốn chủ sở hữu để vừa thực hiện việc mua lại vừa đảm bảo rằng các giao ước nợ\nđược đáp ứng.\nĐầu tư vốn cổ phần\n→ giải thích vai trò của chứng khoán vốn trong việc tài trợ cho tài sản của công ty","qhtml":null},{"n":18,"q":"Q. The voting method that allows shareholders to cast all their votes for a single\ncandidate is best described as:","opts":["proxy voting.","statutory voting.","cumulative voting."],"ans":"C","expl":"A. Không chính xác vì bỏ phiếu theo ủy quyền được định nghĩa là các cổ đông có thể bỏ phiếu theo ủy quyền, điều này cho phép một\nbên được chỉ định-chẳng hạn như một cổ đông khác, đại diện cổ đông hoặc ban quản lý\nbỏ phiếu thay mặt cho cổ đông.\nB. Không chính xác vì biểu quyết tích lũy cho phép các cổ đông chuyển toàn bộ quyền biểu quyết của họ cho\ncác ứng cử viên cụ thể, trái ngược với việc [bỏ phiếu theo luật định] phải phân bổ quyền biểu quyết của họ một cách đồng đều\ncho tất cả các ứng cử viên.\nC. Đúng vì bỏ phiếu tích lũy cho phép các cổ đông chuyển toàn bộ quyền biểu quyết của họ đến\ncác ứng cử viên cụ thể, trái ngược với [bỏ phiếu theo luật định] phải phân bổ quyền biểu quyết một cách đồng đều\ngiữa tất cả các ứng cử viên.\nĐầu tư vốn cổ phần\n→ mô tả sự khác biệt về quyền biểu quyết và các đặc điểm sở hữu khác giữa các\ncác loại vốn chủ sở hữu","qhtml":null},{"n":19,"q":"Q. Convertible preference shares most likely:","opts":["are riskier than the underlying common shares for investors.","allow investors to benefit from a rise in the price of the common shares.","are issued primarily by companies of lower risk and used as a financing option."],"ans":"B","expl":"A. Không chính xác vì cổ phiếu ưu đãi (hoặc cổ phiếu ưu đãi) xếp trên cổ phiếu phổ thông về\nvề việc trả cổ tức và phân phối tài sản ròng của công ty khi\nthanh lý. Giá [cổ phiếu ưu đãi chuyển đổi'] của họ ít biến động hơn so với\ncổ phiếu phổ thông cơ bản vì việc thanh toán cổ tức được biết rõ và ổn định hơn.\nB. Đúng vì cổ phiếu ưu đãi chuyển đổi cho phép các nhà đầu tư được hưởng lợi từ việc tăng giá\ncủa cổ phiếu phổ thông thông qua tùy chọn chuyển đổi.\nC. Không chính xác vì việc sử dụng cổ phiếu ưu đãi chuyển đổi là một lựa chọn tài chính phổ biến trong\nvốn mạo hiểm và các giao dịch vốn cổ phần tư nhân trong đó các công ty phát hành được coi là\ncó rủi ro cao hơn và có thể phải mất nhiều năm trước khi công ty phát hành 'lên sàn' (tức là phát hành\ncổ phiếu phổ thông ra công chúng).\nĐầu tư vốn cổ phần\n→ so sánh rủi ro và đặc điểm lợi nhuận của các loại chứng khoán vốn khác nhau","qhtml":null},{"n":20,"q":"Q. Industries whose revenues and profits are least affected by fluctuations in the overall\neconomy are most likely:","opts":["growth industries.","cyclical industries.","defensive industries."],"ans":"C","expl":"A. Không chính xác vì các ngành tăng trưởng sẽ bao gồm các ngành có động lực nhu cầu cụ thể\nmạnh đến mức chúng lấn át tầm quan trọng của các yếu tố kinh tế rộng hoặc các yếu tố bên ngoài\nvà tạo ra tăng trưởng bất kể điều kiện kinh tế tổng thể, mặc dù tốc độ tăng trưởng\ncủa chúng có thể chậm lại trong thời kỳ suy thoái kinh tế.\nB. Không chính xác vì ngành mang tính chu kỳ là ngành có lợi nhuận tương quan chặt chẽ với sức mạnh\ncủa toàn bộ nền kinh tế. Những công ty như vậy trải qua những biến động rộng hơn mức trung bình về\nnhu cầu cao trong thời kỳ kinh tế mở rộng và nhu cầu thấp trong thời kỳ\nkinh tế suy thoái và/hoặc chịu sự biến động lợi nhuận lớn hơn mức trung bình liên quan đến\nđòn bẩy hoạt động cao (tức là chi phí cố định cao).\nC. Đúng vì các ngành và công ty phòng thủ là những ngành có doanh thu và lợi nhuận\nít bị ảnh hưởng nhất bởi những biến động trong hoạt động kinh tế tổng thể. Các ngành/công ty này có xu hướng\nsản xuất các mặt hàng tiêu dùng thiết yếu (ví dụ: bánh mì), cung cấp các dịch vụ cơ bản (cửa hàng tạp hóa, cửa hàng thuốc\n, cửa hàng thức ăn nhanh).","qhtml":null},{"n":21,"q":"Q. If it is difficult to find a buyer or a seller for an asset, the asset most likely trades on:","opts":["brokered markets.","order-driven markets.","quote-driven markets."],"ans":"A","expl":"A. Đúng vì thị trường được môi giới là thị trường trong đó các nhà môi giới sắp xếp giao dịch giữa các khách hàng\ncủa họ. Các nhà môi giới tổ chức thị trường cho các công cụ mà việc tìm kiếm người mua hoặc người bán sẵn sàng giao dịch\nlà khó khăn vì các công cụ này là duy nhất.\nB. Không chính xác vì việc tổ chức thị trường theo lệnh cho các công cụ này (những tài sản mà\nkhó tìm được người mua hoặc người bán) là không hợp lý vì có quá ít nhà giao dịch gửi đơn đặt hàng\ncho chúng.\nC. Không chính xác vì các đại lý thường không thể hoặc không muốn giữ những tài sản này trong kho\ncủa họ, họ sẽ không tạo ra thị trường cho chúng.\nĐầu tư vốn cổ phần\n mô tả cách chứng khoán, hợp đồng và tiền tệ được giao dịch trong các thị trường theo định giá, theo lệnh\nvà được môi giới","qhtml":null},{"n":22,"q":"Q. A disadvantage of using price multiples to value stocks is that:","opts":["multiples are not easily calculated.","cross-sectional comparisons are not possible.","accounting methods produce different results that are not easily comparable across companies."],"ans":"C","expl":"A. Không chính xác vì bội số giá được các nhà đầu tư ưa chuộng vì bội số có thể được\ntính toán dễ dàng.\nB. Không chính xác vì ưu điểm chính của việc sử dụng bội số giá là chúng cho phép so sánh\ntương đối, cả theo mặt cắt ngang (so với thị trường hoặc so sánh khác) và theo chuỗi thời gian\n.\nC. Đúng vì sự khác biệt trong quy tắc báo cáo giữa các thị trường khác nhau và trong\nphương pháp kế toán đã chọn có thể dẫn đến doanh thu, thu nhập, giá trị sổ sách và dòng tiền không\ndễ dàng so sánh.\nĐầu tư vốn chủ sở hữu\n→ giải thích ưu điểm và nhược điểm của từng loại mô hình định giá","qhtml":null},{"n":23,"q":"Q. All else being equal, an increase in which of the following most likely increases a\ncompany's enterprise value?","opts":["Book value of debt","Market value of investments","Market value of preferred stock"],"ans":"C","expl":"A. Không chính xác vì giá trị doanh nghiệp thường được xác định bằng vốn hóa thị trường\ncộng với giá trị thị trường của cổ phiếu ưu đãi cộng với giá trị thị trường của khoản nợ trừ đi tiền mặt và khoản đầu tư\n(các khoản tương đương tiền và đầu tư ngắn hạn). Giá trị doanh nghiệp tăng lên cùng với sự gia tăng\ngiá trị thị trường chứ không phải giá trị sổ sách của khoản nợ.\nB. Không chính xác vì giá trị doanh nghiệp thường được xác định bằng vốn hóa thị trường\ncộng với giá trị thị trường của cổ phiếu ưu đãi cộng với giá trị thị trường của khoản nợ trừ đi tiền mặt và khoản đầu tư\n(các khoản tương đương tiền và đầu tư ngắn hạn). Giá trị doanh nghiệp tăng lên khi giá trị thị trường của tiền mặt và các khoản đầu tư giảm chứ không phải\nC. Đúng vì giá trị doanh nghiệp thường được xác định bằng giá trị vốn hóa thị trường cộng với\ngiá trị thị trường của cổ phiếu ưu đãi cộng với giá trị thị trường của khoản nợ trừ đi tiền mặt và các khoản đầu tư (tiền mặt\ntương đương và các khoản đầu tư ngắn hạn). Do đó, giá trị doanh nghiệp tăng lên cùng với sự gia tăng\ngiá trị thị trường của cổ phiếu ưu đãi.\nĐầu tư vốn cổ phần\n→ mô tả bội số giá trị doanh nghiệp và cách sử dụng chúng trong việc ước tính giá trị vốn chủ sở hữu","qhtml":null},{"n":24,"q":"Q. The Global Industry Classification Standard (GICS) classifies industries based on:","opts":["statistical similarities.","business-cycle sensitivities.","products and/or services supplied."],"ans":"C","expl":"A. Không chính xác vì ví dụ về hệ thống phân loại dựa trên sản phẩm và/hoặc dịch vụ\nbao gồm hệ thống phân loại thương mại... cụ thể là Phân loại ngành toàn cầu\nTiêu chuẩn (GICS).\nB. Không chính xác vì ví dụ về hệ thống phân loại dựa trên sản phẩm và/hoặc dịch vụ\nbao gồm hệ thống phân loại thương mại... cụ thể là Phân loại ngành toàn cầu\nTiêu chuẩn (GICS).\nC. Đúng vì các ví dụ về hệ thống phân loại dựa trên sản phẩm và/hoặc dịch vụ bao gồm\nhệ thống phân loại thương mại... cụ thể là Tiêu chuẩn phân loại ngành toàn cầu\n(GICS).\nĐầu tư vốn cổ phần\n mô tả các phương pháp phân loại ngành và so sánh các phương pháp mà các công ty có thể được nhóm\nnhóm","qhtml":null},{"n":25,"q":"Q. Which of the following indexes is composed of futures contracts?","opts":["Commodity index","Hedge fund index","Broad equity market index"],"ans":"A","expl":"A. Đúng vì chỉ số hàng hóa bao gồm các hợp đồng tương lai trên một hoặc nhiều\nhàng hóa.\nB. Không chính xác vì chỉ số quỹ phòng hộ phản ánh lợi nhuận của các quỹ phòng hộ. Các quỹ phòng hộ là\nphương tiện đầu tư tư nhân thường sử dụng đòn bẩy cũng như các chiến lược đầu tư dài hạn và ngắn hạn.\nMột số tổ chức nghiên cứu duy trì cơ sở dữ liệu về lợi nhuận của quỹ phòng hộ và tóm tắt\nnhững khoản lợi nhuận này thành chỉ mục. Mặc dù các quỹ phòng hộ cơ bản có thể chứa các hợp đồng tương lai,\ncác chỉ số không bao gồm các hợp đồng tương lai.\nC. Không chính xác vì chỉ số thị trường vốn cổ phần rộng, như tên gọi của nó, đại diện cho toàn bộ\nthị trường vốn cổ phần nhất định và thường bao gồm các chứng khoán đại diện cho hơn 90% thị trường đã chọn\n. Mặc dù chứng khoán cơ bản có thể bao gồm các hợp đồng, nhưng chỉ số này không\nbao gồm các hợp đồng tương lai.\nĐầu tư vốn cổ phần\n→ mô tả các chỉ số đại diện cho các khoản đầu tư thay thế","qhtml":null},{"n":26,"q":"Q. External factors affecting an industry's growth most likely include:","opts":["cost structures.","economies of scale.","technological influences."],"ans":"C","expl":"A. Không chính xác vì các yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm ảnh hưởng kinh tế vĩ mô,\ncông nghệ, nhân khẩu học, chính phủ và xã hội. Ngược lại, cấu trúc chi phí (hoặc\nđiều kiện chi phí) là các yếu tố nội bộ.\nB. Không chính xác vì các yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm ảnh hưởng kinh tế vĩ mô,\ncông nghệ, nhân khẩu học, chính phủ và xã hội. Ngược lại, tính kinh tế của\nquy mô là một yếu tố nội bộ.\nC. Đúng vì các yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm ảnh hưởng kinh tế vĩ mô,\ncông nghệ, nhân khẩu học, chính phủ và xã hội.\nĐầu tư vốn cổ phần\n phân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng của Porter và\nkhuôn khổ PESTLE","qhtml":null},{"n":27,"q":"Q. Which of the following is most likely used to raise funds for a capital project?","opts":["Equity issuance only","A stock dividend only","Both equity issuance and a stock dividend"],"ans":"A","expl":"A. Đúng vì các công ty thường huy động tiền cho các dự án bằng cách bán (phát hành) quyền sở hữu\nlợi ích (ví dụ: cổ phiếu phổ thông của công ty hoặc lợi ích hợp tác). Mặc dù các công cụ vốn chủ sở hữu này\nthể hiện quyền sở hữu hợp pháp trong các công ty thay vì các khoản vay cho các công ty,\nbán vốn chủ sở hữu để huy động vốn chỉ đơn giản là một cơ chế khác để chuyển tiền từ tương lai sang\nhiện tại.\nB. Không chính xác vì phát hành cổ tức bằng cổ phiếu sẽ không phải là một hoạt động mà công ty sẽ thực hiện để\ntài trợ cho một dự án vốn. Cổ tức bằng cổ phiếu là một hình thức cổ tức không dùng tiền mặt và công ty\nphân phối thêm cổ phiếu phổ thông cho các cổ đông thay vì tiền mặt. Do đó, cổ phiếu\ncổ tức sẽ được chuyển đến cổ đông chứ không phải dự án vốn.\nC. Không chính xác vì phát hành cổ tức bằng cổ phiếu sẽ không phải là một hoạt động mà công ty sẽ thực hiện để\ntài trợ cho một dự án vốn. Cổ tức bằng cổ phiếu là một hình thức cổ tức không dùng tiền mặt và công ty\nphân phối thêm cổ phiếu phổ thông cho các cổ đông thay vì tiền mặt. Do đó, cổ tức\ncổ tức sẽ được chuyển đến cổ đông chứ không phải dự án vốn.","qhtml":null},{"n":28,"q":"Q. In dividend payment chronology, the ex-dividend date most likely comes after the:","opts":["record date.","payment date.","declaration date."],"ans":"C","expl":"A. Không chính xác vì ngày giao dịch không hưởng cổ tức được theo sát (một hoặc hai ngày làm việc sau) trước\nngày ghi sổ (còn gọi là ngày ghi sổ của chủ sở hữu, ngày ghi sổ của cổ đông, ngày ghi\n, ngày ghi chép hoặc ngày đóng sổ), ngày mà một cổ đông niêm yết trên sổ sách của\ncông ty sẽ được coi là có quyền sở hữu cổ phiếu cho mục đích nhận\ncổ tức sắp tới.\nB. Không chính xác vì cột mốc cuối cùng [theo trình tự thời gian thanh toán cổ tức] là ngày\nthanh toán (hoặc ngày thanh toán), là ngày mà công ty thực sự gửi thư (hoặc\nchuyển khoản điện tử) thanh toán cổ tức cho cổ đông.\nC. Đúng vì đầu tiên là ngày kê khai, ngày công ty phát hành tờ khai\ntuyên bố chia cổ tức cụ thể. Tiếp theo là ngày không hưởng cổ tức (hoặc ngày hết hạn), ngày đầu tiên mà\ncổ phiếu giao dịch mà không có (tức là \"không\") cổ tức.\nĐầu tư vốn chủ sở hữu\n$ mô tả trình tự thời gian thanh toán cổ tức","qhtml":null},{"n":29,"q":"An analyst gathers the following information about an industry and three comparable\ncompanies within the industry:\nCompany 1 Company 2 Company 3 Average\nPrice/sales 8.9 3.2 5.7 6.2\nPrice/book 5.7 2.6 2.3 4.7\nQ. Based only on this information, the most overvalued company is:","opts":["Company 1.","Company 2.","Company 3."],"ans":"A","expl":"A. Đúng vì P/S và P/B của Công ty 1 đều cao nhất so với hai\ncông ty cùng ngành và mức trung bình ngành. Tất cả các yếu tố khác đều bằng nhau, bội số P/S và P/B cao cho thấy\nđịnh giá tương đối đắt. Do đó, trong trường hợp không có xung đột giữa các chỉ số\ndo P/S và P/B đưa ra (vì cả hai thước đo đều là cao nhất đối với cùng một công ty), công ty\ncó nhiều khả năng được định giá quá cao là Công ty 1.\nB. Không chính xác vì P/S và P/B của Công ty 2 thấp hơn của cả Công ty 1 và\nmức trung bình ngành.\nC. Không chính xác vì P/S và P/B của Công ty 3 đều thấp hơn của cả Công ty 1 và\nmức trung bình ngành","qhtml":"<p>An analyst gathers the following information about an industry and three comparable companies within the industry:</p><table class=\"qtable\"><thead><tr><th></th><th>Company 1</th><th>Company 2</th><th>Company 3</th><th>Average</th></tr></thead><tbody><tr><td>Price/sales</td><td>8.9</td><td>3.2</td><td>5.7</td><td>6.2</td></tr><tr><td>Price/book</td><td>5.7</td><td>2.6</td><td>2.3</td><td>4.7</td></tr></tbody></table><p>Based only on this information, the most overvalued company is:</p>"},{"n":30,"q":"Q. Which of the following industries or sectors is most likely classified as cyclical?","opts":["Utilities","Industrials","Health care"],"ans":"B","expl":"A. Không chính xác vì tiện ích được phân loại là không mang tính chu kỳ. Ví dụ về các ngành không mang tính chu kỳ\nlà thực phẩm và đồ uống, sản phẩm chăm sóc cá nhân và gia đình, chăm sóc sức khỏe và tiện ích.\nB. Đúng vì ví dụ về các ngành có tính chu kỳ và các lĩnh vực rộng hơn là ô tô, nhà ở, vật liệu cơ bản\n, công nghiệp và công nghệ.\nC. Không chính xác vì chăm sóc sức khoẻ được phân loại là không theo chu kỳ. Ví dụ về các ngành không có tính chu kỳ\nlà thực phẩm và đồ uống, sản phẩm chăm sóc cá nhân và gia đình, chăm sóc sức khỏe và tiện ích.\nĐầu tư vốn cổ phần\n→ mô tả các phương pháp phân loại ngành và so sánh các phương pháp mà các công ty có thể được nhóm\nnhóm","qhtml":null},{"n":31,"q":"Q. An increase in shares held by controlling shareholders most likely impacts the\nconstituent weightings of a(n):","opts":["price-weighted index.","equal-weighted index.","float-adjusted market-capitalization-weighted index."],"ans":"C","expl":"A. Không chính xác vì khi tính trọng số giá, tỷ trọng trên mỗi chứng khoán cấu thành được xác định\nbằng cách chia giá của nó cho tổng của tất cả giá của các chứng khoán cấu thành, có nghĩa là\ntỷ trọng thả nổi thấp hơn (do tỷ trọng của cổ đông kiểm soát tăng lên) không ảnh hưởng đến\ntrọng số cấu thành.\nB. Không chính xác vì trọng số bằng nhau ấn định trọng số bằng nhau cho mỗi chứng khoán cấu thành khi\nbắt đầu, nghĩa là tỷ lệ thả nổi thấp hơn (do số lượng cổ phiếu do\ncổ đông kiểm soát nắm giữ tăng lên) không ảnh hưởng đến trọng số cấu thành.\nC. Đúng vì các chỉ số tính trọng số vốn hóa thị trường được điều chỉnh thả nổi phản ánh số cổ phiếu\ncó sẵn để giao dịch đại chúng [không bao gồm cổ phiếu do cổ đông kiểm soát nắm giữ] bằng cách nhân\ngiá thị trường trên mỗi cổ phiếu với số lượng cổ phiếu có sẵn cho công chúng đầu tư (tức là\nvốn hóa thị trường được điều chỉnh thả nổi), nghĩa là trọng số cấu thành bị ảnh hưởng.\nĐầu tư vốn cổ phần\n→ so sánh các phương pháp tính trọng số khác nhau được sử dụng trong xây dựng chỉ mục","qhtml":null},{"n":32,"q":"Q. Free-cash-flow-to-equity is equal to cash flow from operations:","opts":["less fixed capital investment less net borrowing.","less fixed capital investment plus net borrowing.","plus fixed capital investment less net borrowing."],"ans":"B","expl":"A. Không chính xác vì dòng tiền tự do trên vốn chủ sở hữu (FCFE) có thể được biểu thị dưới dạng FCFE = CFO-FCInv +\nVợ ròng [không trừ khoản vay ròng] trong đó CFO là dòng tiền từ hoạt động và FCInv là\nđầu tư vốn cố định.\nB. Đúng vì dòng tiền tự do trên vốn chủ sở hữu (FCFE) có thể được biểu thị dưới dạng FCFE = CFO-FCInv + Net\nvay trong đó CFO là dòng tiền từ hoạt động và FCInv là đầu tư vốn cố định.\nC. Không chính xác vì dòng tiền tự do trên vốn chủ sở hữu (FCFE) có thể được biểu thị dưới dạng FCFE = CFOFCInv [không phải\n+FCInv] + Vay ròng [không trừ khoản vay ròng] trong đó CFO là dòng tiền từ hoạt động và\nFCInv là đầu tư vốn cố định.\nĐầu tư vốn cổ phần\n→ giải thích lý do căn bản cho việc sử dụng mô hình giá trị hiện tại để định giá vốn chủ sở hữu và mô tả\nchiết khấu cổ tức và các mô hình dòng tiền tự do trên vốn chủ sở hữu","qhtml":null},{"n":33,"q":"Q. Over time, which of the following indexes most likely has portfolio weights that shift\naway from securities that have increased in relative value and toward securities that have\nfallen in relative value? A:","opts":["price-weighted index","fundamentally weighted index","market-capitalization-weighted index"],"ans":"B","expl":"A. Không chính xác vì nhược điểm chính của việc tính trọng số theo giá là nó dẫn đến trọng số\ntùy ý cho mỗi chứng khoán. Nó không có tác dụng ngược lại.\nB. Đúng vì các chỉ số có trọng số cơ bản thường sẽ có 'hiệu ứng' trái ngược trong\nrằng trọng số danh mục đầu tư sẽ chuyển từ những chứng khoán đã tăng giá trị tương đối\nvà hướng tới những chứng khoán giảm giá trị tương đối bất cứ khi nào danh mục đầu tư được cân bằng lại.\nC. Không chính xác vì phương pháp tính trọng số vốn hóa thị trường dẫn đến việc đánh giá quá cao những cổ phiếu\nđã tăng giá (và có thể được định giá quá cao) và đánh giá thấp những cổ phiếu đã giảm\nvề giá (và có thể bị định giá thấp). Tác dụng của phương pháp tính trọng số này tương tự như chiến lược đầu tư theo đà\ntrong đó theo thời gian, những chứng khoán tăng giá\nnhiều nhất sẽ có trọng số lớn nhất trong chỉ mục.","qhtml":null},{"n":34,"q":"An analyst gathers the following data for three companies in the same industry (in\nmillions):\nCompany Enterprise Value (EV) Earnings Before Interest, Taxes, Depreciation,\n& Amortization (EBITDA)\n1 $100 $8\n2 $150 $10\n3 $200 $15\nQ. Based on enterprise value multiples, which of the three companies is likely the most\nundervalued?","opts":["Company 1","Company 2","Company 3"],"ans":"A","expl":"A. Đúng vì EV thường được xem là chi phí của việc tiếp quản và EBITDA đại diện cho\ndòng tiền hoạt động. Các công ty có bội số EV/EBITDA tương đối thấp có thể bị\nđịnh giá thấp. Công ty 1 có bội số EV/EBITDA thấp nhất trong số ba công ty.\nCông ty 1: EV/EBITDA = 100.000.000 / 8.000.000 = 12,5;\nCông ty 2: EV/EBITDA = 150.000.000/10.000.000 = 15,0;\nCông ty 3: EV/EBITDA = 200.000.000 / 15.000.000 = 13,3.","qhtml":"<p>An analyst gathers the following data for three companies in the same industry (in millions):</p><table class=\"qtable\"><thead><tr><th>Company</th><th>Enterprise Value (EV)</th><th>EBITDA</th></tr></thead><tbody><tr><td>1</td><td>$100</td><td>$8</td></tr><tr><td>2</td><td>$150</td><td>$10</td></tr><tr><td>3</td><td>$200</td><td>$15</td></tr></tbody></table><p>Based on enterprise value multiples, which of the three companies is likely the most undervalued?</p>"},{"n":35,"q":"Q. Which of the following statements best describes hedge fund indexes?","opts":["Index constituents are regulated entities","Potential survivorship bias is reduced by voluntary performance reporting","There may be little overlap in index constituents between different indexes offered by different index providers"],"ans":"C","expl":"A. Không chính xác vì các quỹ phòng hộ là các thực thể không được kiểm soát không bắt buộc phải báo cáo kết quả hoạt động\ncủa họ. Điều này có nghĩa là chỉ số quỹ phòng hộ khó có thể bao gồm các thực thể được quản lý.\nB. Không chính xác vì hệ quả của việc báo cáo hiệu suất tự nguyện là khả năng xảy ra\nsự thiên vị người sống sót.\nC. Đúng vì thông thường, một quỹ phòng hộ chỉ báo cáo kết quả hoạt động của mình cho một cơ sở dữ liệu. Kết quả\nlà có rất ít sự chồng chéo giữa các quỹ được bao phủ bởi các chỉ số khác nhau. Với rất ít sự trùng lặp giữa\ncác thành phần cấu thành nên các chỉ số quỹ phòng hộ toàn cầu khác nhau có thể phản ánh hiệu suất rất khác nhau đối với\nngành quỹ phòng hộ trong cùng một khoảng thời gian.\nĐầu tư vốn chủ sở hữu\n→ mô tả các chỉ số đại diện cho các khoản đầu tư thay thế","qhtml":null},{"n":36,"q":"Q. A market where security prices fully reflect all publicly known and available\ninformation, but not private information, is:","opts":["weak-form efficient.","semi-strong-form efficient.","strong-form efficient."],"ans":"B","expl":"A. Không chính xác vì trong giả thuyết thị trường hiệu quả dạng yếu, giá chứng khoán phản ánh đầy đủ tất cả\ndữ liệu thị trường trong quá khứ. Nó không bao gồm tất cả thông tin có sẵn và được biết đến công khai.\nB. Đúng vì trong thị trường hiệu quả dạng bán mạnh, giá phản ánh tất cả thông tin được biết đến công khai và\ncó sẵn.\nC. Không chính xác vì trong thị trường hiệu quả dạng mạnh, giá chứng khoán phản ánh đầy đủ cả thông tin công\nvà thông tin cá nhân.\nĐầu tư vốn cổ phần\n tương phản giữa hiệu quả thị trường dạng yếu, dạng bán mạnh và dạng mạnh","qhtml":null},{"n":37,"q":"Q. In a highly efficient market, a passive investment strategy most likely has:","opts":["higher transaction costs than an active strategy.","lower information-seeking costs than an active strategy.","higher risk-adjusted returns before all expenses than an active strategy."],"ans":"B","expl":"A. Không chính xác vì trong một thị trường hiệu quả cao, chiến lược đầu tư thụ động được ưu tiên hơn chiến lược đầu tư chủ động\nvì chi phí thấp hơn (ví dụ: chi phí giao dịch và tìm kiếm thông tin-\n).\nB. Đúng vì trong một thị trường hiệu quả cao, chiến lược đầu tư thụ động (tức là mua và\nnắm giữ danh mục đầu tư thị trường rộng) không tìm kiếm lợi nhuận vượt trội được điều chỉnh theo rủi ro sẽ được ưu tiên\n hơn chiến lược đầu tư chủ động vì chi phí thấp hơn (ví dụ: chi phí giao dịch và\nchi phí tìm kiếm thông tin).\nC. Không chính xác vì không có điểm kém hiệu quả nào để khai thác trong một thị trường hiệu quả cao, chiến lược đầu tư chủ động\nrất có thể sẽ tạo ra lợi nhuận được điều chỉnh theo rủi ro tương tự như chiến lược đầu tư thụ động\nnếu chi phí không được xem xét. Không thể đạt được\nlợi nhuận nhất quán, vượt trội, được điều chỉnh theo rủi ro (ròng [không trước] của tất cả các chi phí) trong một thị trường hiệu quả. Trong một thị trường\nhiệu quả cao, chiến lược đầu tư thụ động (tức là mua và nắm giữ một danh mục đầu tư\nthị trường rộng lớn) không tìm kiếm lợi nhuận vượt trội được điều chỉnh theo rủi ro sẽ được ưu tiên hơn so với chiến lược đầu tư chủ động\n.\nĐầu tư vốn cổ phần\n→ mô tả hiệu quả thị trường và các khái niệm liên quan, bao gồm cả tầm quan trọng của chúng đối với\nngười hành nghề đầu tư","qhtml":null},{"n":38,"q":"Q. Fundamental analysis most likely.","opts":["uses stock price patterns to trade.","is an input for passive portfolio management.","helps participants understand the value implications of information."],"ans":"C","expl":"A. Không chính xác vì phân tích cơ bản liên quan đến việc ước tính giá trị tài sản bằng cách sử dụng\ndữ liệu công ty, chẳng hạn như dự báo thu nhập và doanh số chứ không phải mô hình giá cổ phiếu. Thay vào đó,\nphân tích kỹ thuật là việc sử dụng các mô hình giá nhằm cố gắng kiếm lợi nhuận từ chúng.\nB. Không chính xác vì phân tích cơ bản là nỗ lực đưa ra các quyết định\nquản lý danh mục đầu tư chủ động chứ không phải quản lý thụ động. Quản lý thụ động tập trung vào việc sao chép các chỉ mục dưới dạng\nphương tiện đầu tư.\nC. Đúng vì phân tích cơ bản là cần thiết trong một thị trường hoạt động tốt vì\nphân tích này giúp những người tham gia thị trường hiểu được ý nghĩa giá trị của thông tin.\nĐầu tư vốn cổ phần\n giải thích ý nghĩa của từng hình thức hiệu quả thị trường đối với phân tích cơ bản,\nphân tích kỹ thuật và lựa chọn giữa quản lý danh mục đầu tư chủ động và thụ động","qhtml":null},{"n":39,"q":"Q. Which of the following is considered an external influence on industry growth?","opts":["Social trends","Barriers to entry","Industry concentration"],"ans":"A","expl":"A. Đúng vì các yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm ảnh hưởng kinh tế vĩ mô,\ncông nghệ, nhân khẩu học, chính phủ và xã hội.\nB. Không chính xác vì các rào cản gia nhập được coi là các yếu tố bên trong ảnh hưởng đến một ngành, trong khi\ncác yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm các ảnh hưởng về kinh tế vĩ mô, công nghệ,\nnhân khẩu học, chính phủ và xã hội.\nC. Không chính xác vì sự tập trung của ngành được coi là yếu tố bên trong ảnh hưởng đến một ngành\n, trong khi các yếu tố bên ngoài ảnh hưởng đến sự tăng trưởng của một ngành bao gồm kinh tế vĩ mô,\nảnh hưởng của công nghệ, nhân khẩu học, chính phủ và xã hội.\nĐầu tư vốn cổ phần\n phân tích cấu trúc của một ngành và những ảnh hưởng bên ngoài bằng cách sử dụng Năm lực lượng của Porter và\nPESTLE khung","qhtml":null},{"n":40,"q":"Q. In a weak-form efficient market, which of the following information is reflected in\nsecurity prices?","opts":["Historical prices only","Historical prices and historical trading volumes only","Historical prices, historical trading volumes, and current earnings"],"ans":"B","expl":"A. Không chính xác vì trong giả thuyết thị trường hiệu quả dạng yếu, giá chứng khoán phản ánh đầy đủ tất cả\ndữ liệu thị trường trong quá khứ, trong đó đề cập đến tất cả thông tin về giá và khối lượng giao dịch trong lịch sử. Câu trả lời\nnày chưa đầy đủ vì nó không bao gồm thông tin về khối lượng giao dịch.\nB. Đúng vì trong giả thuyết thị trường hiệu quả dạng yếu, giá chứng khoán phản ánh đầy đủ tất cả\ndữ liệu thị trường trong quá khứ, trong đó đề cập đến tất cả thông tin về giá và khối lượng giao dịch trong lịch sử.\nC. Không chính xác vì trong giả thuyết thị trường hiệu quả dạng yếu, giá chứng khoán phản ánh đầy đủ tất cả\ndữ liệu thị trường trong quá khứ, đề cập đến tất cả thông tin về giá và khối lượng giao dịch trước đây nhưng không\nkhông đề cập đến thông tin thu nhập hiện tại.\nĐầu tư vốn cổ phần\n tương phản hiệu quả thị trường dạng yếu, dạng bán mạnh và dạng mạnh","qhtml":null},{"n":41,"q":"Q. Security market indices most likely serve as proxies for:","opts":["nonsystematic risk.","asset classes in asset allocation models.","the fair value of assets in asset-based valuation models."],"ans":"B","expl":"A. Không chính xác vì các chỉ số thị trường chứng khoán không đóng vai trò là đại lượng để đo lường\nrủi ro phi hệ thống. Rủi ro phi hệ thống là rủi ro cục bộ hoặc giới hạn ở một tài sản cụ thể hoặc\nngành mà không cần ảnh hưởng đến tài sản bên ngoài loại tài sản đó. Các nhà đầu tư có khả năng tránh\nrủi ro phi hệ thống thông qua đa dạng hóa bằng cách hình thành danh mục tài sản không có mối tương quan cao\nvới nhau. Các chỉ số thị trường chứng khoán thường rộng và đa dạng. Chúng\nđóng vai trò là đại diện thị trường khi đo lường hiệu suất được điều chỉnh theo rủi ro. Phiên bản beta của danh mục đầu tư được quản lý\nchủ động cho phép các nhà đầu tư hình thành một danh mục thay thế thụ động có cùng mức độ rủi ro hệ thống\n.\nB. Đúng vì các chỉ số đóng vai trò quan trọng như là đại diện cho các loại nội dung trong mô hình phân bổ nội dung\n.\nC. Không chính xác vì định giá dựa trên tài sản là một phương pháp định giá các công ty riêng lẻ, do đó,\nchỉ số thị trường chứng khoán rộng không phải là một đại diện hữu ích. Việc định giá dựa trên tài sản của một công ty sử dụng\nước tính của thị trường hoặc giá trị hợp lý của tài sản và nợ phải trả của công ty. Các mô hình định giá\ndựa trên tài sản thường được sử dụng cùng với các mô hình cấp số nhân để định giá các công ty tư nhân\n. Khi các công ty đại chúng tăng cường báo cáo hoặc công bố giá trị hợp lý, việc định giá\ndựa trên tài sản có thể ngày càng được sử dụng nhiều hơn để bổ sung cho các mô hình giá trị hiện tại và cấp số nhân của\nđịnh giá.\nĐầu tư vốn cổ phần\n→ mô tả việc sử dụng các chỉ số thị trường chứng khoán","qhtml":null},{"n":42,"q":"Q. When constructing an equity index, each company's weight in the index is dependent\non its number of shares outstanding if the index is:","opts":["price weighted.","equal weighted.","market-capitilization weighted."],"ans":"C","expl":"A. Không chính xác vì khi tính trọng số giá, trọng số của mỗi chứng khoán thành phần được xác định\nbằng cách chia giá của nó cho tổng của tất cả giá của các chứng khoán cấu thành chứ không phải chia cho giới hạn thị trường\n, tức là giá nhân với số cổ phiếu đang lưu hành.\nB. Không chính xác vì phương pháp này ấn định trọng số bằng nhau cho mỗi chứng khoán cấu thành khi\nbắt đầu và do đó trọng số không được xác định bởi vốn hóa thị trường, tức là giá nhân\nvới số cổ phiếu đang lưu hành.\nC. Đúng vì trong trọng số vốn hóa thị trường hoặc trọng số giá trị, trọng số của mỗi\nchứng khoán cấu thành được xác định bằng cách chia vốn hóa thị trường của nó cho tổng vốn hóa thị trường\n(tổng vốn hóa thị trường) của tất cả chứng khoán trong chỉ mục. Thị trường\nvốn hóa hoặc giá trị được tính bằng cách nhân số lượng cổ phiếu đang lưu hành với\ngiá thị trường trên mỗi cổ phiếu.\nĐầu tư vốn cổ phần\n so sánh các phương pháp tính trọng số khác nhau được sử dụng trong xây dựng chỉ số","qhtml":null},{"n":43,"q":"Q. All else being equal, which of the following preference shares pays the lowest\ndividend?","opts":["Putable","Callable","Non-callable"],"ans":"A","expl":"A. Đúng vì theo quan điểm của nhà đầu tư, cổ phiếu phổ thông hoặc cổ phiếu ưu đãi có thể bán được\nít rủi ro hơn so với các cổ phiếu có thể mua lại hoặc không thể mua lại vì chúng cung cấp cho nhà đầu tư\ntùy chọn bán cổ phiếu cho tổ chức phát hành ở mức giá xác định trước. Do đó, cổ phiếu có thể bán lại\nthường trả cổ tức thấp hơn cổ phiếu không thể bán được.\nB. Không chính xác vì cổ phiếu phổ thông có thể mua lại hoặc cổ phiếu ưu đãi có rủi ro cao hơn so với các cổ phiếu đối tác\nkhông thể mua lại vì nhà phát hành có tùy chọn mua lại cổ phiếu ở mức giá xác định trước.\nCổ phiếu có thể mua lại thường trả cổ tức cao hơn để đền bù cho các nhà đầu tư về rủi ro mà\ncổ phiếu có thể được mua lại trong tương lai.\nC. Không chính xác vì theo quan điểm của nhà đầu tư, cổ phiếu phổ thông hoặc cổ phiếu ưu đãi có thể bán được\nít rủi ro hơn so với các cổ phiếu có thể mua lại hoặc không thể mua lại vì chúng cung cấp cho nhà đầu tư\ntùy chọn bán cổ phiếu cho tổ chức phát hành ở mức giá xác định trước. Rủi ro thấp hơn của cổ phiếu có thể bán được\ndẫn đến cổ tức thấp hơn so với cổ phiếu không thể mua lại được.","qhtml":null},{"n":44,"q":"Q. When an investment bank guarantees the sale of an entire issue at a negotiated\noffering price, this best describes\na(n):","opts":["rights offering.","best effort offering.","underwritten offering."],"ans":"C","expl":"A. Không chính xác vì các công ty có thể phát hành cổ phiếu mới thông qua việc chào bán quyền. Trong đợt chào bán quyền,\ncông ty phân phối quyền mua cổ phiếu ở một mức giá cố định cho các cổ đông hiện hữu theo tỷ lệ\ntỷ lệ nắm giữ của họ.\nB. Không chính xác vì trong đợt chào bán với nỗ lực cao nhất, ngân hàng đầu tư chỉ đóng vai trò là nhà môi giới. Họ\nkhông đảm bảo việc bán toàn bộ số phát hành ở mức giá chào bán đã thương lượng.\nC. Đúng vì trong một đợt chào bán được bảo lãnh là loại chào bán phổ biến nhất,\nngân hàng đầu tư đảm bảo việc bán số phát hành ở mức giá chào bán mà ngân hàng thương lượng với\nnhà phát hành.\nĐầu tư vốn chủ sở hữu\n lang xác định thị trường sơ cấp và thứ cấp và giải thích cách thị trường thứ cấp hỗ trợ\nthị trường sơ cấp","qhtml":null},{"n":45,"q":"Q.Management is more likely to focus on short-term results instead of long-term earnings\ngrowth if a company raises equity through:","opts":["venture capital.","a leveraged buyout.","an initial public offering."],"ans":"C","expl":"A. Không chính xác vì bằng cách chuyển sang chế độ riêng tư, ban quản lý có thể áp dụng trọng tâm dài hạn hơn và có thể\nloại bỏ một số chi phí cần thiết để vận hành một công ty giao dịch đại chúng. Trong khi\nđiều hành một công ty giao dịch đại chúng, ban quản lý thường cảm thấy áp lực khi phải tập trung vào các kết quả\nngắn hạn (ví dụ: đáp ứng các mục tiêu về doanh thu và thu nhập hàng quý từ các nhà phân tích thiên về hiệu suất giá trong thời gian ngắn\n) thay vì điều hành công ty để đạt được mức tăng trưởng doanh thu và thu nhập bền vững lâu dài\n. Có ba loại đầu tư vốn cổ phần tư nhân chính:\nvốn mạo hiểm, mua lại bằng đòn bẩy và đầu tư tư nhân vào vốn cổ phần đại chúng (hoặc PIPE).\nB. Không chính xác vì bằng cách chuyển sang chế độ riêng tư, ban quản lý có thể áp dụng trọng tâm dài hạn hơn và có thể\nloại bỏ một số chi phí cần thiết để vận hành một công ty giao dịch đại chúng. Trong khi\nđiều hành một công ty giao dịch đại chúng, ban quản lý thường cảm thấy áp lực khi phải tập trung vào các kết quả\nngắn hạn (ví dụ: đáp ứng các mục tiêu về doanh thu và thu nhập hàng quý từ các nhà phân tích thiên về hiệu suất giá trong thời gian ngắn\n) thay vì điều hành công ty để đạt được mức tăng trưởng doanh thu và thu nhập bền vững lâu dài\n. Có ba loại đầu tư vốn cổ phần tư nhân chính:\nvốn mạo hiểm, mua lại bằng đòn bẩy và đầu tư tư nhân vào vốn cổ phần đại chúng (hoặc PIPE).\nC. Đúng vì khi điều hành một công ty giao dịch đại chúng, ban quản lý thường cảm thấy bị áp lực\nphải tập trung vào kết quả ngắn hạn (ví dụ: đáp ứng các mục tiêu về doanh thu và thu nhập hàng quý từ các nhà phân tích\nthiên về hiệu suất giá trong ngắn hạn) thay vì điều hành công ty để đạt được mức tăng trưởng doanh thu và thu nhập bền vững lâu dài\nĐầu tư vốn cổ phần\n→ so sánh và đối chiếu doanh thu và thu nhập bền vững trong dài hạn.\nĐầu tư vốn cổ phần\n chứng khoán vốn cổ phần tư nhân","qhtml":null},{"n":46,"q":"Q. If the index's value is 100 at the beginning of Period 1, the index's value at the end of\nPeriod 3 is closest to:","opts":["103.","105.","106."],"ans":"B","expl":"A. Không chính xác vì giá trị chỉ số ở cuối kỳ 2 chứ không phải kỳ 3 = Bắt đầu\ngiá trị x (1 + Lợi nhuận kỳ 1) x (1 + Lợi nhuận kỳ 2) = 100 ×(100+12%)×(100-8%) = 103,04, trong đó\ngần nhất với 103.\nB. Đúng vì là giá trị của chỉ số cuối kỳ 3 = Giá trị đầu x\n(1+Tiền lãi kỳ 1) x (1 + Lợi nhuận kỳ 2) x (1 + Lợi tức kỳ 3) = 100 ×(100+12%)×(100-\n8%)×(1+2%) ~ 105,10, gần nhất với 105.\nC. Không chính xác vì lợi nhuận của ba kỳ được cộng chứ không phải gộp: Giá trị đầu\n+ (100 x Hoàn vốn kỳ 1) + (100 x Hoàn vốn kỳ 2) + (100 x Hoàn vốn kỳ 3) = 100+\n(100×12%)+(100×8%) + (100×2%) = 100+128+2=106.\nĐầu tư cổ phần\n• tính toán và giải thích giá trị, lợi nhuận theo giá và tổng lợi nhuận của một chỉ số","qhtml":"<p>An analyst gathers the following returns for a security market index:</p><table class=\"qtable\"><thead><tr><th>Period</th><th>Return</th></tr></thead><tbody><tr><td>1</td><td>12%</td></tr><tr><td>2</td><td>&minus;8%</td></tr><tr><td>3</td><td>2%</td></tr></tbody></table><p>If the index's value is 100 at the beginning of Period 1, the index's value at the end of Period 3 is closest to:</p>"},{"n":47,"q":"Q. If the cost to fill trades increases, the market's informational efficiency most likely:","opts":["decreases.","remains the same.","increases."],"ans":"A","expl":"A. Đúng vì mức độ phản ánh chính xác của giá thông tin cơ bản phụ thuộc vào chi phí\nđể có được thông tin cơ bản và vào tính thanh khoản sẵn có cho các nhà giao dịch có đủ thông tin. Nếu\nviệc điền lệnh rất tốn kém thì giao dịch có hiểu biết có thể không mang lại lợi nhuận. Trong trường hợp đó, các nhà giao dịch có động cơ thông tin-\nsẽ không dành nguồn lực để thu thập và phân tích dữ liệu và họ sẽ không giao dịch.\nNếu không có nghiên cứu và giao dịch liên quan của họ, giá sẽ ít thông tin hơn.\nB. Không chính xác vì chi phí giao dịch ảnh hưởng đến hiệu quả thông tin: chi phí cao hơn dẫn đến giao dịch ít thông tin hơn\nvà do đó làm giảm hiệu quả.\nC. Không chính xác vì chi phí giao dịch cao hơn dẫn đến giao dịch ít thông tin hơn và do đó làm giảm\nhiệu quả.\nĐầu tư vốn cổ phần\n$ mô tả các đặc điểm của một hệ thống tài chính hoạt động tốt","qhtml":null},{"n":48,"q":"Q. The best estimate of the company's dividend growth rate is:","opts":["5.8%.","6.7%.","7.4%."],"ans":"B","expl":"A. Không chính xác vì nó sử dụng tỷ lệ giữ chân thay vì tỷ lệ chi trả;\n220=60/(0,085-g) và g = 0,0577 hoặc 5,8%.\nB. Đúng vì P/E kỳ hạn hợp lý = p/ (r-g), trong đó p = tỷ lệ chi trả = (1 - tỷ lệ duy trì)\nvà r = tỷ lệ lợi nhuận yêu cầu = lãi suất phi rủi ro danh nghĩa + phí bảo hiểm rủi ro.\n22=(1-0,60)/((0,025 +0,06) - g).\n220,40/(0,085g) và g = 0,0668~6,7%.\nC. Không chính xác vì nó sử dụng giá cổ phiếu hiện tại thay vì tỷ lệ P/E để giải g: 36 =\n0,40 / (0,085-g) và g = 0,0739~7,4%.\nĐầu tư vốn cổ phần\n‎ tính toán và giải thích giá trị nội tại của chứng khoán vốn cổ phần dựa trên chiết khấu cổ tức tăng trưởng Gordon\n(không đổi) mô hình hoặc mô hình chiết khấu cổ tức hai giai đoạn\nthích hợp","qhtml":"<p>An analyst gathers the following information about a company and its common shares:</p><table class=\"qtable\"><tbody><tr><td>Justified forward P/E</td><td>22</td></tr><tr><td>Retention rate</td><td>60%</td></tr><tr><td>Nominal risk-free rate</td><td>2.5%</td></tr><tr><td>Equity risk premium</td><td>6%</td></tr></tbody></table><p>Using the Gordon growth model, the best estimate of the company's dividend growth rate is:</p>"},{"n":49,"q":"Q.Financial intermediaries that help their clients arrange seasoned securities offerings are\nbest known as:","opts":["investment banks.","commercial banks.","multi-lateral trading facilities."],"ans":"A","expl":"A. Đúng vì các ngân hàng đầu tư cung cấp lời khuyên cho hầu hết các khách hàng doanh nghiệp của họ và giúp\nhọ sắp xếp các giao dịch như chào bán chứng khoán lần đầu và theo mùa. Ngoài ra, bảo mật dày dạn\nlà bảo mật mà nhà phát hành đã phát hành. Nếu nhà phát hành muốn bán\ncác đơn vị bổ sung của chứng khoán đã phát hành trước đó, thì họ sẽ đưa ra một đợt chào bán theo mùa (đôi khi được gọi là\nchào bán thứ cấp).\nB. Không chính xác vì các tổ chức nhận tiền gửi bao gồm ngân hàng thương mại, ngân hàng tiết kiệm và cho vay,\nhiệp hội tín dụng và các tổ chức tương tự huy động vốn từ người gửi tiền và các nhà đầu tư khác và\ncho người vay vay. Các ngân hàng cung cấp cho người gửi tiền lãi suất và các dịch vụ giao dịch, chẳng hạn như\nviết séc và rút tiền mặt bằng séc, để đổi lấy việc sử dụng tiền của họ.\nC. Không chính xác vì các cơ sở giao dịch đa phương (MTF) là địa điểm giao dịch có chức năng giống như\nsàn giao dịch nhưng không thực thi quyền quản lý đối với người đăng ký ngoại trừ\nliên quan đến việc tiến hành giao dịch trong hệ thống giao dịch của họ.","qhtml":null},{"n":50,"q":"Over the long run, if a market is semi-strong-form efficient, which of the following investment strategies should result in the highest return to investors? A(n):","opts":["passive investment strategy","active trading strategy seeking to exploit price patterns","active trading strategy seeking to exploit public information"],"ans":"A","expl":"Trong thị trường hiệu quả giống bán mạnh (bán mạnh), giá phản ánh mọi thông tin công khai bao gồm cả mẫu hình giá quá khứ, nên các chiến dịch chủ động trên thông tin công khai hay mẫu hình giá không thể thắng thị trường một cách ổn định sau chi phí. Chiến lược thụ động (thụ động) có chi phí thấp nhất nên cho lợi nhuận cao nhất trong thời gian dài."},{"n":51,"q":"A multi-market index is most appropriately used as a benchmark:","opts":["for a single country ETF.","for a small-capitalization growth stock manager.","to calculate beta for the portfolio of a global stock manager."],"ans":"C","expl":"Chỉ số đa thị trường (chỉ số đa thị trường) bao phủ nhiều quốc gia, nên phù hợp làm điểm chuẩn (và tính beta) cho nhà quản lý danh mục cổ phiếu toàn cầu. ETF một quốc gia cần chỉ số một quốc gia; nhà quản lý tăng trưởng vốn hóa nhỏ cần một số cách (chỉ số kiểu)."},{"n":52,"q":"Industry classification systems are developed and used by:","opts":["commercial entities only.","governmental agencies only.","both commercial entities and governmental agencies."],"ans":"C","expl":"Hệ thống phân tích chuyên ngành được phát triển và sử dụng bởi các tổ chức kinh tế (GICS của MSCI/S&P, ICB của FTSE...) trộn các cơ sở nhà nước (ISIC, NAICS, NACE...)."},{"n":53,"q":"According to the efficient market hypothesis, if market prices reflect private information, the market is most likely:","opts":["strong-form efficient.","weak-form efficient only.","semi-strong-form efficient, but not strong-form efficient."],"ans":"A","expl":"Theo giả thuyết thị trường hiệu quả, nếu giá phản ánh cả thông tin riêng tư (thông tin riêng tư/nội bộ) thì thị trường hiệu quả dạng mạnh (strong-form) — dạng bao trùm cả thông tin quá khứ và thông tin công khai."},{"n":54,"q":"The Global Industry Classification Standard's broadest level of classification i
