s a(n):","opts":["sector.","industry.","industry group."],"ans":"A","expl":"Cấp phân loại rộng nhất của ngành GICS là (11 lĩnh vực), sau đó mới đến nhóm ngành, ngành và sub-industry."},{"n":55,"q":"In which of the following forms of market efficiency are investors able to consistently outperform the market using fundamental analysis?","opts":["Weak-form market efficiency","Semi-strong-form market efficiency","Strong-form market efficiency"],"ans":"A","expl":"Phân tích cơ sở dựa trên thông tin công khai. Nhà đầu tư chỉ có thể thắng thị trường ổn định bằng thông tin công khai khi giá CHƯA Phản ánh thông tin đó — tức thị trường chỉ hiệu quả như yếu (dạng yếu), nơi giá mới chỉ phản ánh dữ liệu giá/khối lượng quá khứ."},{"n":56,"q":"Which of the following indexes are regularly rebalanced by the index provider?","opts":["Price-weighted indexes only","Equal-weighted indexes only","Both price-weighted indexes and equal-weighted indexes"],"ans":"B","expl":"Chỉ số trọng số bằng nhau phải được cân bằng (tái cân bằng) bất kỳ biến thể nào thực hiện các tỷ lệ chênh lệch khác nhau. Chỉ số trọng giá không cần tái cân bằng định kỳ — tỷ lệ tự thay đổi theo giá."},{"n":57,"q":"Which of the following best describes an industry-level force in a thorough industry analysis?","opts":["Threat of new entrants","Demographic influences","Technological influences"],"ans":"A","expl":"Mối đe dọa từ những người mới gia nhập (đe từ đối thủ mới gia nhập) là một trong năng lượng tranh cấp chuyên ngành của Porter. Ảnh hưởng nhân khẩu học và công nghệ là các yếu tố vĩ mô bên ngoài (ảnh hưởng bên ngoài), không phải năng lượng cung cấp ngành."},{"n":58,"q":"Commercial industry classification systems are most likely updated:","opts":["less frequently than government classification systems.","as frequently as government classification systems.","more frequently than government classification systems."],"ans":"C","expl":"Hệ thống phân tích kinh tế (GICS, ICB...) đã được dễ dàng hơn nhiều so với hệ thống của lớp phủ chính (vốn chỉ chỉnh sửa sau nhiều năm) để phản ứng ánh sáng phù hợp với sự thay đổi của các ngành."},{"n":59,"q":"A company's net income available to ordinary shareholders divided by the average total book value of equity is best described the:","opts":["company's intrinsic value.","company's return on equity.","minimum required rate of return of investors in the company's equity."],"ans":"B","expl":"Lợi nhuận Bình quân của chủ sở hữu vốn chính là ROE (lợi nhuận trên vốn chủ sở hữu)."},{"n":60,"q":"A world equity index is most likely considered a:","opts":["style index.","sector index.","multi-market index."],"ans":"C","expl":"Chỉ số cổ phiếu thế giới (chỉ số vốn chủ sở hữu thế giới) bao phủ nhiều thị trường/quốc gia nên là đa thị trường index."},{"n":61,"q":"All else being equal, which of the following preference share characteristics may contain provisions that entitle shareholders to an additional distribution of the company's assets upon liquidation, above the par value?","opts":["Callable","Cumulative","Participating"],"ans":"C","expl":"Cổ phần ưu đãi tham gia (tham gia) cho phép cổ đông nhận thêm phân cấp tài sản khi thanh lý vượt qua ý nghĩa giá trị (và/hoặc cổ lợi ích khi đạt được lợi nhuận trước đó). Có thể gọi và tích lũy không có quyền này."},{"n":62,"q":"A three-stage dividend discount model is most appropriate for valuing a company that is:","opts":["mature.","transitioning to maturity.","young and entering the growth phase."],"ans":"C","expl":"Mô hình giảm tốc tức ba giai đoạn phù hợp với công ty trẻ đang bước vào giai đoạn tăng trưởng, sẽ lần lượt trải qua tăng trưởng cao → chuyển tiếp → trưởng thành. Công ty trưởng thành công của Gordon một giai đoạn; công ty đang chuyển sang trưởng thành dùng hai giai đoạn."},{"n":63,"q":"A company's management is most likely able to directly influence the company's:","opts":["book value.","market value.","intrinsic value."],"ans":"A","expl":"Ban đạo tác động trực tiếp đạt được giá trị sổ sách (qua quyết định kinh doanh, giữ lại lợi nhuận...). Giá trị thị trường và giá trị nội tại do nhà tư/thị trường quyết định dựa trên bất kỳ tương lai nào."},{"n":64,"q":"In contrast to the market value of an equity security, intrinsic value is most likely:","opts":["not known with certainty.","constant throughout the life of the security.","determined by the intersection of supply and demand."],"ans":"A","expl":"Nội dung giá trị tại là giá trị dựa trên phân tích, không thể hy vọng chắc chắn. Nó thay đổi theo thời gian và khác với giá thị trường (giá do cung–cầu quyết định)."},{"n":65,"q":"Short sellers are most likely exposed to:","opts":["unlimited gains and limited losses.","limited gains and unlimited losses.","unlimited gains and unlimited losses."],"ans":"B","expl":"Người bán lãi tối đa khi giá về 0 (lãi suất có giới hạn) nhưng lỗi không giới hạn giá phiếu có thể tăng vô hạn."},{"n":66,"q":"In which markets are government bills most likely traded?","opts":["Money markets","Capital markets","Alternative investment markets"],"ans":"A","expl":"Tín cổ phiếu chính phủ (hóa đơn chính phủ) có thời hạn dưới 1 năm nên giao dịch trên thị trường tiền tệ (thị trường tiền tệ). Thị trường vốn dành cho công cụ có thời hạn hơn."},{"n":67,"q":"Enterprise value is most likely associated with:","opts":["multiplier models.","present value models.","asset-based valuation models."],"ans":"A","expl":"Giá trị doanh nghiệp gắn với bội số mô hình (mô hình số nhân), điển hình là EV/EBITDA."},{"n":68,"q":"A characteristic of real assets is that they most likely:","opts":["trade in liquid markets.","are inexpensive to manage.","are unique assets with different attributes."],"ans":"C","expl":"Tài sản thực (bất động sản, máy móc...) là những tài sản độc nhất, khác biệt về thuộc tính, vị trí, tình trạng; tài khoản dự phòng, chi phí quản lý cao và thông tin so sánh hạn chế."},{"n":69,"q":"If a European investor believes the US equity market will decline in the next three months, the transaction most likely to allow the investor to profit from this view is the purchase of a:","opts":["put option.","call option.","currency swap."],"ans":"A","expl":"Mua quyền chọn bán (put option) trên chỉ số phiếu bầu Mỹ sinh khi lãi thị trường giảm. Gọi sinh lời khi tăng; swap không phản ánh quan điểm về thị trường cổ phiếu."},{"n":70,"q":"If the ability of clients to identify competent agents increases, the need for regulation most likely.","opts":["decreases,","remains the same.","increases."],"ans":"A","expl":"Khi khách hàng tự đánh giá hiệu quả của các trung gian/đại lý tốt hơn, vấn đề bất cân bằng thông tin giảm → nhu cầu quản lý (quy định) giảm."},{"n":71,"q":"An analyst gathers the following book value information about a company and its common shares: Inventories €20 million Net fixed assets €80 million Total assets €150 million Total liabilities €90 million Shares outstanding 4 million Q. The analyst estimates the market value of net fixed assets to be 125% of book value and the market value of inventories to be 90% of book value. If the stock is currently trading at €19.50 per share, the asset-based value per share is most likely:","opts":["less than the market price.","equal to the market price.","greater than the market price."],"ans":"B","expl":"Điều chỉnh theo giá thị trường: tài sản cố định 80 × 125% = 100 (+20); hàng tồn tại kho 20 × 90% = 18 (−2). Tổng tài sản điều chỉnh = 150 + 20 − 2 = 168 triệu €; trừ nợ 90 → vốn chủ 78 triệu €. Giá trị mỗi cổ phần = 78/4 = €19,50, đúng với giá thị trường.","qhtml":"<p>An analyst gathers the following book value information about a company and its common shares:</p><table class=\"qtable\"><tbody><tr><td>Inventories</td><td>€20 million</td></tr><tr><td>Net fixed assets</td><td>€80 million</td></tr><tr><td>Total assets</td><td>€150 million</td></tr><tr><td>Total liabilities</td><td>€90 million</td></tr><tr><td>Shares outstanding</td><td>4 million</td></tr></tbody></table><p>The analyst estimates the market value of net fixed assets to be 125% of book value and the market value of inventories to be 90% of book value. If the stock is currently trading at €19.50 per share, the asset-based value per share is most likely:</p>"},{"n":72,"q":"The book value of a company's equity is:","opts":["the present value of its future cash flows.","the difference between its total assets and total liabilities.","its share price multiplied by the number of outstanding shares."],"ans":"B","expl":"Sổ sách giá trị của chủ sở hữu vốn = tổng tài sản − tổng nợ phải trả. Giá cổ phiếu × số cổ phần là giá trị thị trường (vốn hóa thị trường)."},{"n":73,"q":"A company's ROE most likely decreases if shareholders' equity increases at:","opts":["a lower rate than net income.","the same rate as net income.","a higher rate than net income."],"ans":"C","expl":"ROE = lợi nhuận / chủ sở hữu. If vốn chủ tăng nhanh hơn lợi nhuận ròng thì mẫu số tăng nhanh hơn số → ROE giảm."},{"n":74,"q":"An equity index representing groups of securities classified on the basis of market capitalization is most likely a:","opts":["style index.","sector index.","multi-market index."],"ans":"A","expl":"Chỉ số phân nhóm chứng chỉ theo vốn hóa thị trường (và/hoặc giá trị/tăng trưởng) chỉ là số phong cách (kiểu) chỉ số)."},{"n":75,"q":"An analyst gathers the following information about common shares: Company Peer Group Dividend payout ratio 40% 50% Estimated future dividend growth rate 5% 4% Q. If the investor's required rate of return is 9%, the company's justified forward P/E is:","opts":["less than the peer group's justified forward P/E.","the same as the peer group's justified forward P/E.","greater than the peer group's justified forward P/E."],"ans":"B","expl":"P/E dự phóng hợp lý = khoản thanh toán / (r − g). Công ty: 0,40/(0,09 − 0,05) = 10. Nhóm so sánh: 0,50/(0,09 − 0,04) = 10. Hai P/E bằng nhau.","qhtml":"<p>An analyst gathers the following information about common shares:</p><table class=\"qtable\"><thead><tr><th></th><th>Company</th><th>Peer Group</th></tr></thead><tbody><tr><td>Dividend payout ratio</td><td>40%</td><td>50%</td></tr><tr><td>Estimated future dividend growth rate</td><td>5%</td><td>4%</td></tr></tbody></table><p>If the investor’s required rate of return is 9%, the company’s justified forward P/E is:</p>"},{"n":76,"q":"An analyst gathers the following information about a company's shares: Dividend payable per share $0.50 Ex-date 20 August Closing share price on 19 August $29.00 Q. All else being equal, at the beginning of trading on 20 August, the company's shares will most likely trade at:","opts":["$28.50.","$29.00.","$29.50."],"ans":"A","expl":"Vào ngày giao dịch không có quyền (cũ), giá chứng khoán giảm tương ứng với cổ tức: $29,00 − $0,50 = $28,50.","qhtml":"<p>An analyst gathers the following information about a company’s shares:</p><table class=\"qtable\"><tbody><tr><td>Dividend payable per share</td><td>$0.50</td></tr><tr><td>Ex-date</td><td>20 August</td></tr><tr><td>Closing share price on 19 August</td><td>$29.00</td></tr></tbody></table><p>All else being equal, at the beginning of trading on 20 August, the company’s shares will most likely trade at:</p>"},{"n":77,"q":"An analyst gathers the following information about a company's dividend payment chronology: Ex-dividend date 2 August Holder-of-record date 5 August Q. The last date an investor can purchase the company's stock and be entitled to receive the dividend is most likely.","opts":["1 August.","2 August.","4 August."],"ans":"A","expl":"Để được nhận cổ, nhà tư phải mua TRƯỚC ngày giao dịch không có quyền (ngày không hưởng cổ tức 2 tháng 8), tức khắc nhất là ngày 1 tháng 8.","qhtml":"<p>An analyst gathers the following information about a company’s dividend payment chronology:</p><table class=\"qtable\"><tbody><tr><td>Ex-dividend date</td><td>2 August</td></tr><tr><td>Holder-of-record date</td><td>5 August</td></tr></tbody></table><p>The last date an investor can purchase the company’s stock and be entitled to receive the dividend is most likely:</p>"},{"n":78,"q":"The January effect is an example of:","opts":["loss aversion.","an earnings surprise.","a market pricing anomaly."],"ans":"C","expl":"Hiệu ứng tháng (hiệu ứng tháng 1) — lợi bất thường trong các ngày đầu tháng 1 — là một giá trị thường xuyên được định nghĩa dưới dạng trường (dị thường về giá thị trường) dị thường trong lịch."},{"n":79,"q":"An investor gathers the following data regarding three stocks: Stock Expected Rate of Return Investor’s Required Rate of Return 1 9% 9% 2 13% 11% 3 15% 16% Q. All else being equal, the investor should purchase:","opts":["Stock 1.","Stock 2.","Stock 3."],"ans":"B","expl":"Nên mua cổ phiếu đang được định giá thấp: tỷ suất kỳ vọng > tỷ suất yêu cầu. Cổ phiếu 2: 13% > 11% (mua). Cổ phiếu 1: 9% = 9% (định giá đúng). Kho 3: 15% < 16% (định giá cao).","qhtml":"<p>An investor gathers the following data regarding three stocks:</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Expected Rate of Return</th><th>Investor’s Required Rate of Return</th></tr></thead><tbody><tr><td>1</td><td>9%</td><td>9%</td></tr><tr><td>2</td><td>13%</td><td>11%</td></tr><tr><td>3</td><td>15%</td><td>16%</td></tr></tbody></table><p>All else being equal, the investor should purchase:</p>"},{"n":80,"q":"Behavioral finance:","opts":["suggests that behavioral biases only affect novice investors.","provides a possible explanation for a number of pricing anomalies,","relies on the assumption that people consider all available information in decision-making."],"ans":"B","expl":"Chính sách điều hành vi đưa ra lời giải thích hợp cho nhiều mức giá thường xuyên. Nó KHÔNG giả định người xem xét mọi thông tin (đó là tài chính truyền thống) và thiên lệch hành vi ảnh hưởng đến mọi nhà đầu tư, không riêng tư người mới."},{"n":81,"q":"An analyst gathers and estimates the following information about a company's stock: Current dividend per share (D) $4 Current EPS $5 Dividend growth rate 4% Q. If the estimated stock value using the Gordon growth model is $92 per share, the required return on this stock is closest to:","opts":["8.35%.","8.52%.","9.44%."],"ans":"B","expl":"Áp dụng mô hình định giá Gordon: Gordon: V = D1/(r − g) → 92 = 4 × 1,04/(r − 0,04) → r = 4,16/92 + 0,04 = 0,0452 + 0,04 = 8,52%.","qhtml":"<p>An analyst gathers and estimates the following information about a company’s stock:</p><table class=\"qtable\"><tbody><tr><td>Current dividend per share (D)</td><td>$4</td></tr><tr><td>Current EPS</td><td>$5</td></tr><tr><td>Dividend growth rate</td><td>4%</td></tr></tbody></table><p>If the estimated stock value using the Gordon growth model is $92 per share, the required return on this stock is closest to:</p>"},{"n":82,"q":"The first date that a share trades without the declared dividend is the:","opts":["ex-date.","payable date.","declaration date."],"ans":"A","expl":"Ngày đầu tiên đã gửi cổ phiếu không đính kèm cổ tức công bố là ngày cũ (ngày không hưởng cổ tức)."},{"n":83,"q":"A $25 par value non-callable, non-convertible preferred share pays an annual dividend rate of 5%. If the required rate of return is 4%, the preferred share's intrinsic value is closest to:","opts":["$25.25.","$26.00.","$31.25."],"ans":"C","expl":"Cổ tức năm = 5% × $25 = $1,25. Giá trị nội tại của cổ phần ưu đãi viễn viễn = D/r = 1.25/0.04 = $31.25."},{"n":84,"q":"An investor buys a security on margin posting 50% of the initial price as equity. All else being equal, if the price declines 25%, the investor's new leverage ratio is closest to:","opts":["2.","3.","4."],"ans":"B","expl":"Mua $100: vốn $50, vay 50 đô la. Giá giảm 25% → vị trí $75, vốn = 75 − 50 = $25. Đòn bẩy = 75/25 = 3."},{"n":85,"q":"When using a multiplier model, the fundamental variable is stated on:","opts":["a trailing basis only.","a forward basis only.","either a forward basis or a trailing basis."],"ans":"C","expl":"Biến cơ bản trong bội số mô hình có thể tính toán theo dõi (12 tháng qua) hoặc chuyển tiếp (dự phóng)."},{"n":86,"q":"For a security position purchased on margin, the leverage ratio is the ratio of the value of the position to:","opts":["the value of equity in the position.","the amount of the margin loan in the position.","the amount of the margin loan plus equity in the position."],"ans":"A","expl":"Tỷ lệ đòn bẩy = giá trị thế / vốn chủ sở hữu (vốn chủ sở hữu) ở vị trí."},{"n":87,"q":"A non-callable, non-convertible perpetual preferred share pays a level dividend of $1.20 with a current market price of $20. If an investor has a required rate of return of 6%, the preferred shares are most likely:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"B","expl":"Giá trị nội tại = D/r = 1,20/0,06 = $20 = giá thị trường → định giá đúng (có giá trị khá cao)."},{"n":88,"q":"Broker 1 has a minimum margin requirement of 62.5% and Broker 2 has a maximum leverage ratio of 1.6. The maximum financial leverage possible with Broker 1 is:","opts":["less than the maximum financial leverage with Broker 2.","equal to the maximum financial leverage with Broker 2.","greater than the maximum financial leverage with Broker 2."],"ans":"B","expl":"Đòn bẩy tối đa của Nhà môi giới 1 = 1/margin Tối thiểu = 1/0.625 = 1.6, đúng với mức tối đa 1.6 của Nhà môi giới 2."},{"n":89,"q":"If securities are purchased on margin with a maximum leverage ratio of 1.75, the minimum margin requirement is closest to:","opts":["43%.","57%.","75%."],"ans":"B","expl":"Tối thiểu ký quỹ = 1/đòn bẩy tối đa = 1/1,75 = 57,1% ≈ 57%."},{"n":90,"q":"Which of the following market anomalies is best described as a time-series anomaly?","opts":["Size effect","Momentum","Initial Public Offerings"],"ans":"B","expl":"Động lượng (quán tính giá) là thời gian chuỗi phức tạp (dị thường chuỗi thời gian). Hiệu ứng quy mô và IPO là dị thường cắt ngang (mặt cắt ngang)."},{"n":91,"q":"An analyst gathers the following information about a company: Dividend payout ratio 40% Required rate of return on equity 15% Return on equity 20% Q. The justified forward P/E ratio for the company's stock is closest to:","opts":["5.7.","8.0.","13.3."],"ans":"C","expl":"g = ROE × tỷ lệ giữ lại = 20% × (1 − 0,40) = 12%. P/E dự phóng hợp lý = khoản thanh toán/(r − g) = 0,40/(0,15 − 0,12) = 13,3.","qhtml":"<p>An analyst gathers the following information about a company:</p><table class=\"qtable\"><tbody><tr><td>Dividend payout ratio</td><td>40%</td></tr><tr><td>Required rate of return on equity</td><td>15%</td></tr><tr><td>Return on equity</td><td>20%</td></tr></tbody></table><p>The justified forward P/E ratio for the company’s stock is closest to:</p>"},{"n":92,"q":"A trader uses margin to purchase a stock for $50 by posting 30% equity. If the first margin call occurs when the price falls below $43.75, the maintenance margin requirement is closest to:","opts":["13%.","18%.","20%."],"ans":"C","expl":"Vốn vay = $50 × (1 − 0,30) = $35/cổ phiếu. Tại giá gọi ký hiệu P: (P − 35)/P = ký quỹ duy trì → (43,75 − 35)/43,75 = 8,75/43,75 = 20%."},{"n":93,"q":"A trader buys a stock on margin with the following conditions: Purchase price per share $50 Equity per share $25 Maintenance margin requirement 25% Q. If the share price declines, the highest price at which the trader will receive a margin call is closest to:","opts":["$12.50.","$33.33.","$37.50."],"ans":"B","expl":"Giá gọi ký quỹ = vốn vay/(1 − ký quỹ duy trì) = (50 − 25)/(1 − 0,25) = 25/0,75 = $33,33.","qhtml":"<p>A trader buys a stock on margin with the following conditions:</p><table class=\"qtable\"><tbody><tr><td>Purchase price per share</td><td>$50</td></tr><tr><td>Equity per share</td><td>$25</td></tr><tr><td>Maintenance margin requirement</td><td>25%</td></tr></tbody></table><p>If the share price declines, the highest price at which the trader will receive a margin call is closest to:</p>"},{"n":94,"q":"The observation that a large-capitalization company's stock price is inflated after the company releases unexpected good news at year end is most likely related to the:","opts":["value effect.","overreaction effect.","turn-of-the-year effect."],"ans":"B","expl":"Giá được điều chỉnh sau khi tin tốt bất ngờ trở thành phản ứng phản ứng thái quá (hiệu ứng phản ứng thái quá). Hiệu ứng giá trị liên quan của phiếu bầu; Turn-of-the-year là dị thường theo lịch, không gắn với tin tức."},{"n":95,"q":"Order matching rules in order-driven trading systems are used to:","opts":["match buy orders to sell orders.","determine the prices at which the orders submitted by dealers are matched.","determine the prices at which the orders submitted by customers are matched."],"ans":"A","expl":"Quy tắc so khớp (quy tắc khớp thứ tự) trong hệ thống khớp lệnh tập dùng thứ tự ưu tiên (giá trung – thời gian) để ghép command buy with sell command. Quy tắc định giá giao dịch (quy tắc định giá thương mại) mới là quy tắc xác định giá khớp."},{"n":96,"q":"Which of the following is an objective of market regulation?","opts":["Controlling agency problems only","Ensuring that long-term liabilities are funded only","Both controlling agency problems and ensuring that long-term liabilities are funded"],"ans":"C","expl":"Các mục tiêu của quản lý trường học theo chương trình CFA bao gồm kiểm tra mục đại diện (các vấn đề đại lý) và bảo đảm các nhiệm vụ dài hạn (quỹ nghỉ trí, bảo hiểm) được hỗ trợ đầy đủ."},{"n":97,"q":"An analyst gathers the following information about a company and its historical price multiples: Current Historical EPS $3.00 …. Cash flow per share $4.00 …. Book value per share $40.00 …. P/B 0.6 P/E 12.0 P/CF 8.0 Q. Based only on this information, if the share price is $30, the company's shares are most likely overvalued based on:","opts":["P/B.","P/E.","P/CF."],"ans":"A","expl":"Với giá $30: P/B = 30/40 = 0,75 > 0,6 (lịch sử) → giá theo P/B. P/E = 30/3 = 10 < 12 và P/CF = 30/4 = 7.5 < 8 → nhanh chóng theo P/E và P/CF.","qhtml":"<p>An analyst gathers the following information about a company and its historical price multiples:</p><table class=\"qtable\"><thead><tr><th></th><th>Current</th><th>Historical</th></tr></thead><tbody><tr><td>EPS</td><td>$3.00</td><td></td></tr><tr><td>Cash flow per share</td><td>$4.00</td><td></td></tr><tr><td>Book value per share</td><td>$40.00</td><td></td></tr><tr><td>P/B</td><td></td><td>0.6</td></tr><tr><td>P/E</td><td></td><td>12.0</td></tr><tr><td>P/CF</td><td></td><td>8.0</td></tr></tbody></table><p>Based only on this information, if the share price is $30, the company’s shares are most likely overvalued based on:</p>"},{"n":98,"q":"Porter's five determinants of the intensity of competition in an industry do not include the:","opts":["power of buyers.","threat of substitutes.","position of a company in its life-cycle stage."],"ans":"C","expl":"Sức mạnh của Porter: đối thủ mới gia nhập, quyền lực nhà cung cấp, quyền lực người mua, sản phẩm thay thế, cạnh tranh nội bộ ngành. Vị trí của công ty trong vòng đời không thuộc lượng năng lượng này."},{"n":99,"q":"A trader reports the following information about an equity investment which was sold after 1 year: Number of shares purchased 2,000 Leverage ratio 3 Purchase price per share $12.00 Sale price per share $9.50 Call money rate per year 3% Q. The trader's equity value as a result of the trade is closest to:","opts":["$460,","$2,520.","$3,000."],"ans":"B","expl":"Vị thế = 2.000 × $12 = $24.000; đòn bẩy 3 → vốn chủ = 24,000/3 = $8,000, vay $16,000. Bán: 2.000 × $9,50 = $19.000. Lõi vay = 3% × 16.000 = $480. Vốn chủ còn lại = 19.000 − 16.000 − 480 = $2.520.","qhtml":"<p>A trader reports the following information about an equity investment which was sold after 1 year:</p><table class=\"qtable\"><tbody><tr><td>Number of shares purchased</td><td>2,000</td></tr><tr><td>Leverage ratio</td><td>3</td></tr><tr><td>Purchase price per share</td><td>$12.00</td></tr><tr><td>Sale price per share</td><td>$9.50</td></tr><tr><td>Call money rate per year</td><td>3%</td></tr></tbody></table><p>The trader’s equity value as a result of the trade is closest to:</p>"},{"n":100,"q":"If a security's intrinsic value is $55 per share and is currently selling for $50 per share, the security is:","opts":["undervalued.","fairly valued.","overvalued."],"ans":"A","expl":"Nội dung có giá trị tại $55 > giá thị trường $50 → chứng khoán Đang được định giá thấp (được định giá thấp)."},{"n":101,"q":"Convertible preference shares.","opts":["are popular in financing venture capital and private equity transactions.","are subject to more price volatility than the underlying common shares.","do not increase in value due to an increase in price of the underlying common shares."],"ans":"A","expl":"Cổ phần ưu tiên chuyển đổi phổ biến trong vốn đầu tư mạo hiểm/vốn cổ phần tư nhân được hỗ trợ tài chính. Chúng ÍT biến động giá hơn cổ phiếu phổ thông và giá trị CÓ tăng khi giá cổ phiếu phổ thông cơ sở tăng."},{"n":102,"q":"If the price of a stock bought on 30% margin increases by 40%, the return on equity to the buyer is closest to:","opts":["52%.","75%.","133%."],"ans":"C","expl":"Mua $100 với vốn $30 (ký quỹ 30%). Giá +40% → lãi $40 trên vốn $30 → 40/30 = 133% (bỏ qua lãi vay, cổ tức)."},{"n":103,"q":"The size effect anomaly results when it is observed that on a risk-adjusted basis small cap companies tend to:","opts":["underperform equities of large-cap companies.","perform in line with equities of large-cap companies.","outperform equities of large-cap companies."],"ans":"C","expl":"Hiệu ứng quy mô (hiệu ứng kích thước): trên cơ sở điều chỉnh rủi ro, cổ phiếu vốn hóa nhỏ có xu hướng vượt trội (vượt trội) so với vốn hóa lớn."},{"n":104,"q":"Within Porter's five forces framework, the power of buyers within an industry is most likely influenced by the:","opts":["industry concentration.","availability of lower priced alternative brands.","number of customers for the industry's products."],"ans":"C","expl":"Quyền lực người mua phụ thuộc vào số lượng khách hàng của ngành: càng ít khách hàng, mỗi khách hàng càng có sức mạnh mặc định lớn. Mức độ tập trung của nội bộ cạnh tranh ảnh lớn; hàng thay thế giá rẻ thuộc năng lượng của các sản phẩm thay thế."},{"n":105,"q":"An investor purchases 1,000 shares of a non-dividend paying stock on margin and sells them after one year as follows: Purchase price per share $25 Sale price per share $20 Annual call money rate 5% Leverage ratio 2 Q. Ignoring commissions, the investor's holding period return is closest to:","opts":["-45%.","-40%.","-23%."],"ans":"A","expl":"Vị thế = 1.000 × $25 = $25.000; đòn bẩy 2 → vốn $12.500, vay $12.500. Bán = $20.000; lãi vay = 5% × 12.500 = $625. Vốn cuối cùng = 20.000 − 12.500 − 625 = $6.875. HPR = (6.875 − 12.500)/12.500 = −45%.","qhtml":"<p>An investor purchases 1,000 shares of a non-dividend paying stock on margin and sells them after one year as follows:</p><table class=\"qtable\"><tbody><tr><td>Purchase price per share</td><td>$25</td></tr><tr><td>Sale price per share</td><td>$20</td></tr><tr><td>Annual call money rate</td><td>5%</td></tr><tr><td>Leverage ratio</td><td>2</td></tr></tbody></table><p>Ignoring commissions, the investor’s holding period return is closest to:</p>"},{"n":106,"q":"An analyst gathers the following information about a market-capitalization-weighted index and one of its four constituent stocks: Total Market Capitalization (in $ billions) Stock 20 Index 57 Q. If the stock price is $30 per share and the index value is 100, the stock's weight in the index is closest to:","opts":["25%.","30%.","35%."],"ans":"C","expl":"Tỷ trọng trong chỉ số theo vốn hóa = vốn hóa cổ phiếu / tổng vốn hóa chỉ số = 20/57 = 35,1% ≈ 35%. Giá cổ phiếu và giá trị chỉ số không liên quan.","qhtml":"<p>An analyst gathers the following information about a market-capitalization-weighted index and one of its four constituent stocks:</p><table class=\"qtable\"><thead><tr><th></th><th>Total Market Capitalization (in $ billions)</th></tr></thead><tbody><tr><td>Stock</td><td>20</td></tr><tr><td>Index</td><td>57</td></tr></tbody></table><p>If the stock price is $30 per share and the index value is 100, the stock’s weight in the index is closest to:</p>"},{"n":107,"q":"The beginning value for an index is 1540 and the ending value is 1575. If the income for the period is 55, the total return of the index is closest to:","opts":["1.3%.","2.2%.","5.8%."],"ans":"C","expl":"Tổng lợi nhuận = (giá trị cuối − giá trị đầu + thu nhập)/giá trị đầu = (1575 − 1540 + 55)/1540 = 90/1540 = 5,84% ≈ 5,8%."},{"n":108,"q":"If investors can successfully predict future asset prices based on past prices, markets are most likely:","opts":["inefficient.","weak-form efficient only.","semi-strong-form efficient."],"ans":"A","expl":"Nếu dự kiến sẽ có được tương lai từ giá quá khứ thì giá CHƯA phản ánh cả thông tin giá quá khứ → thị trường không đạt được cả ý yếu → kém hiệu quả."},{"n":109,"q":"A company's current dividend (D) of $3 per share is expected to grow 20% per year for three years, then 5% per year thereafter. If the required rate of return is 10%, using a multistage dividend discount model, the intrinsic value of the stock at the end of Year 3 is closest to:","opts":["$81.79.","$92.53.","$108.86."],"ans":"C","expl":"Giá trị tại CUỐI năm 3 = D4/(r − g) với D4 = 3 × 1,20³ × 1,05 = 5,4432 → V3 = 5,4432/(0,10 − 0,05) = 108,86 USD."},{"n":110,"q":"A disadvantage of an equal-weighted index is that:","opts":["maintaining equal weights requires frequent reconstitution of the index.","securities that represent a relatively large fraction of the target market value are underrepresented.","securities that represent a relatively small fraction of the target market value are underrepresented."],"ans":"B","expl":"Nhược điểm của chỉ số có trọng số bằng nhau: cổ phiếu sử dụng tỷ lệ lớn trong trường mục tiêu được phản ánh đại diện hơn thực tế (được trình bày dưới mức). Ngoài ra nó cần tái cân bằng (tái cân bằng) thường xuyên — không phải tái lập danh mục (hoàn nguyên)."},{"n":111,"q":"An analyst gathers the following information about a company's non-callable, non- convertible preferred stock: Par value per share €100 Required rate of return 7.2% Maturity 5 years Q. If the stock's intrinsic value is €125, the company's semi-annual dividend on the preferred stock is closest to:","opts":["€6.62.","€7.20.","€9.00."],"ans":"A","expl":"Kỳ tích bán niên: r = 7.2%/2 = 3,6%, n = 10 kỳ. 125 = D × [1 − 1,036⁻¹⁰]/0,036 + 100/1,036¹⁰ = D × 8,2744 + 70,21 → D = 54,79/8,2744 = €6,62.","qhtml":"<p>An analyst gathers the following information about a company’s non-callable, non-convertible preferred stock:</p><table class=\"qtable\"><tbody><tr><td>Par value per share</td><td>€100</td></tr><tr><td>Required rate of return</td><td>7.2%</td></tr><tr><td>Maturity</td><td>5 years</td></tr></tbody></table><p>If the stock’s intrinsic value is €125, the company’s semi-annual dividend on the preferred stock is closest to:</p>"},{"n":112,"q":"In contrast to a public company, a company that has gone private most likely.","opts":["faces greater regulatory costs.","focuses more on short-term results.","lacks an active secondary market for its equity."],"ans":"C","expl":"Công ty đã sẵn sàng (riêng tư) không còn hiển thị hoạt động cấp trường thứ cho cổ phần của mình; đổi lại chi phí tập thủ thấp hơn và ít áp lực kết quả rút ngắn hơn."},{"n":113,"q":"An analyst gathers the following information about an equal-weighted index composed of three stocks: Stock Beginning of Period Price End of Period Price 1 $10 8$ 2 $20 $24 3 $30 30$ Q. If there is a 2% return from dividends for each of the three stocks, the total return of the index is:","opts":["0%.","2%.","6%."],"ans":"B","expl":"Giá hoàn lại từng cổ phiếu: (8−10)/10 = −20%; (24−20)/20 = +20%; (30−30)/30 = 0%. Lợi nhuận theo giá bình quân = (−20 + 20 + 0)/3 = 0%. Tổng lợi nhuận = 0% + 2% (cổ tức) = 2%.","qhtml":"<p>An analyst gathers the following information about an equal-weighted index composed of three stocks:</p><table class=\"qtable\"><thead><tr><th>Stock</th><th>Beginning of Period Price</th><th>End of Period Price</th></tr></thead><tbody><tr><td>1</td><td>$10</td><td>$8</td></tr><tr><td>2</td><td>$20</td><td>$24</td></tr><tr><td>3</td><td>$30</td><td>$30</td></tr></tbody></table><p>If there is a 2% return from dividends for each of the three stocks, the total return of the index is:</p>"},{"n":114,"q":"Which of the following factors would most likely increase market efficiency? Limits on:","opts":["short selling","transaction costs","trading by foreign investors"],"ans":"B","expl":"Giới hạn (giảm) chi phí giao dịch làm tăng hoạt động trọng tài → tăng hiệu quả thị trường. Chế độ bán ven và hạn chế nhà tư nước ngoài đều làm GIẢM hiệu quả."},{"n":115,"q":"Which of the following index weighting schemes most likely causes a bias in the index when high-priced stocks split?","opts":["Price weighted","Equal weighted","Value weighted"],"ans":"A","expl":"Chỉ số giá được tính theo trọng số khi đo giá cao chia: sau khi chia, tỷ trọng của cổ đó giảm một cách tiện lợi cho công việc giá trị không thay đổi."},{"n":116,"q":"In the secondary market, funds flow from:","opts":["traders to traders.","issuers to investors.","investors to issuers."],"ans":"A","expl":"Trên thị trường cấp thứ, chứng chỉ và tiền chuyển đổi giữa các nhà giao dịch/nhà đầu tư với nhau (người giao dịch với người giao dịch); tổ chức phát hành không nhận tiền."},{"n":117,"q":"When issuers sell securities to investors:","opts":["they trade in the primary market.","they trade in the secondary market.","funds flow between the primary and the secondary market."],"ans":"A","expl":"Khi tổ chức phát hành chứng chỉ trực tiếp cho nhà tư vấn, giao dịch diễn ra trên thị trường sơ cấp (thị trường sơ cấp)."},{"n":118,"q":"In a well-functioning financial system, changes in asset prices primarily reflect changes in:","opts":["execution costs.","the demand for liquidity.","fundamental asset values."],"ans":"C","expl":"Trong hệ thống tài chính vận hành tốt, giá tài sản thay đổi chủ yếu Phản ánh thay đổi giá trị cơ bản (giá trị cơ bản), không phải chi phí thực hiện hay nhu cầu thanh khoản."},{"n":119,"q":"When a company raises common equity capital in the public market, the company most likely:","opts":["moves money from the present to the future.","agrees to make scheduled distributions in the future.","is required to meet regulatory reporting requirements."],"ans":"C","expl":"Huy động vốn cổ phần trên thị trường đại chúng kéo theo nghĩa vụ báo cáo theo quy định. Cổ phần không có lịch phân phối định trước (đó là nợ), và phát hành vốn là chuyển tiền từ tương lai về hiện tại đối với công ty."},{"n":120,"q":"Preference shares are less risky than common shares because preference shares have:","opts":["fixed dividends.","a guaranteed return if a company is liquidated.","a larger portion of total return based on future price return."],"ans":"A","expl":"Cổ phần ưu vật dụng ít ro hơn cố định và được ưu tiên return before; but KHÔNG được bảo đảm nhận lại vốn khi thanh lý, và phần lớn lợi nhuận đến từ cổ tức chứ không phải tăng giá."},{"n":121,"q":"The Gordon growth model assumes a dividend growth rate:","opts":["less than the required rate of return.","equal to the required rate of return.","greater than the required rate of return."],"ans":"A","expl":"Mô hình tăng trưởng Gordon yêu cầu g < r; if g ≥ r mô hình cho giá trị vô hạn/âm, vô nghĩa."},{"n":122,"q":"Private equity securities most likely","opts":["are listed on public exchanges.","are illiquid and difficult to trade.","have easily available financial information."],"ans":"B","expl":"Chứng khoán vốn cổ phần tư nhân không trái, tiết kiệm và tài khoản giao dịch; chế độ tài chính chính thông tin."},{"n":123,"q":"The Gordon growth model is most appropriate for valuing the equity of a dividend- paying:","opts":["electric utility firm.","technology company.","automobile manufacturer."],"ans":"A","expl":"Gordon phù hợp với công ty trả cổ ổn định, tăng trưởng đều —điển hình là công ty điện năng (tiện ích). Công ty công nghệ hay ô tô có tăng trưởng biến/chu kỳ."}];
const CFG = {"title": "Equity Investments", "subtitle": "Ngân hàng câu hỏi CFA chính thức — Level I", "minutes": 246, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("resumeNote").classList.remove("show");
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<script>
/* ===== Feedback sinh động: chạy sau khi chấm bài ===== */
(function(){
  if(typeof grade!=='function') return;
  var _grade=grade;
  grade=function(a){ _grade(a); try{ afterGrade(); }catch(e){} };

  function afterGrade(){
    if(!CFG.hasAnswers) return;
    var pass=document.getElementById('badge').classList.contains('pass');
    showResult(pass, document.getElementById('badge').textContent);
  }
  function addMark(el,sym){
    if(el.querySelector('.fx-mark')) return;
    var s=document.createElement('span'); s.className='fx-mark'; s.textContent=sym;
    el.appendChild(s);
  }
  function showResult(pass, badgeText){
    var ov=document.getElementById('resultOverlay');

    if(pass){
      title.textContent='Chúc mừng! Bạn đã ĐẠT'; title.className='pass';
      icon.setAttribute('src','https://cdn.lordicon.com/lupuorrc.json');

      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);

<script id="qnotes-panel-js">
(function(){
  var loaded=false;

  window.qnotesOpen=function(){
    var fr=document.getElementById("qnotesFrame");
    if(!loaded){ fr.src="index.html?embed=1&view=notes"; loaded=true; }
    P().classList.add("open"); document.getElementById("qnotesOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.qnotesClose=function(){
    P().classList.remove("open"); document.getElementById("qnotesOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);

    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));

    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
