<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 20 — Market-Based Valuation - Price and Enterprise Value Multiples · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>

  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);

  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));

  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}

  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>

<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);

}

<script>
const DATA = [{"n": 1, "q": "At a CFA society function, Andrew Caza comments to Nanda Dhople that the expected dividend growth rate (g) for Zeron Enterprises Inc (ZEI) is expected increase 0.5% from 6% to 6.5%. Caza claims that since ZEI will maintain their historic dividend payout ratio (g) of 50% and cost of equity (k) of 10%, ZEI's P/E ratio will also increase by 0.5%. Is Caza correct?", "opts": ["Yes, ZEI's P/E ratio will increase by approximately 0.5%.", "No, ZEI's P/E ratio will increase by approximately 14.32%.", "No, ZEI's P/E ratio will decrease by approximately 14.32%."], "ans": "B", "expl": "Caza is not correct. P/EZEI = payout ratio / (k - g) When the expected dividend growth is 6%, P/E = 0.50 / (0.10 - 0.06) = 12.50 When the expected dividend growth is 6.5%, P/E = 0.50 / (0.10 - 0.065) = 14.29 The percentage change is (14.29 / 12.50) - 1 = 14.32%, representing a 14.32% increase.", "explhtml": "<p>Caza is not correct. P/E<sub>ZEI<\/sub> = payout ratio / (k - g)<\/p><p>When the expected dividend growth is 6%, P/E = 0.50 / (0.10 - 0.06) = 12.50<\/p><p>When the expected dividend growth is 6.5%, P/E = 0.50 / (0.10 - 0.065) = 14.29<\/p><p>The percentage change is (14.29 / 12.50) - 1 = 14.32%, representing a 14.32% increase.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.d<\/div><div class=\"qtext\"><p>At a CFA society function, Andrew Caza comments to Nanda Dhople that the expected dividend growth rate (g) for Zeron Enterprises Inc (ZEI) is expected increase 0.5% from 6% to 6.5%. Caza claims that since ZEI will maintain their historic dividend payout ratio (g) of 50% and cost of equity (k) of 10%, ZEI&#x27;s P/E ratio will also increase by 0.5%. Is Caza correct?<\/p><\/div>", "subj": "equity"}, {"n": 2, "q": "Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 28 while the median leading P/E of a peer group of companies within the industry is 38. Based on the method of comparables, an analyst would most likely conclude that PTI should be:", "opts": ["sold short as an overvalued stock.", "bought as an undervalued stock.", "sold as an overvalued stock."], "ans": "B", "expl": "The price per dollar of earnings is considerably lower than that for the median of the peer group, which implies that it may well be undervalued.", "explhtml": "<p>The price per dollar of earnings is considerably lower than that for the median of the peer group, which implies that it may well be undervalued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 28 while the median leading P/E of a peer group of companies within the industry is 38. Based on the method of comparables, an analyst would most likely conclude that PTI should be:<\/p><\/div>", "subj": "equity"}, {"n": 3, "q": "In interpreting the standardized unexpected earnings (SUE) momentum measure, it can be concluded that a given size forecast error is:", "opts": ["more meaningful the smaller the historical size of forecast errors.", "scaled by the earnings surprise.", "more meaningful the larger the historical size of forecast errors."], "ans": "A", "expl": "A given size forecast error is more (less) meaningful the smaller (larger) the historical size of forecast errors.", "explhtml": "<p>A given size forecast error is more (less) meaningful the smaller (larger) the historical size of forecast errors.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.q<\/div><div class=\"qtext\"><p>In interpreting the standardized unexpected earnings (SUE) momentum measure, it can be concluded that a given size forecast error is:<\/p><\/div>", "subj": "equity"}, {"n": 4, "q": "Which of the following is a disadvantage to using EV/EBITDA?", "opts": ["EBITDA is useful for valuing capital-intensive businesses with high levels of depreciation and amortization.", "EBITDA is usually positive even when EPS is not.", "Since FCFF captures the amount of capital expenditures, it is more strongly linked with valuation theory than EBITDA."], "ans": "C", "expl": "Since FCFF captures the amount of capital expenditures, it is more strongly linked with valuation theory than EBITDA. The other statements are advantages.", "explhtml": "<p>Since FCFF captures the amount of capital expenditures, it is more strongly linked with valuation theory than EBITDA. The other statements are advantages.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.o<\/div><div class=\"qtext\"><p>Which of the following is a disadvantage to using EV/EBITDA?<\/p><\/div>", "subj": "equity"}, {"n": 5, "q": "Robert Chan comments to Leslie Singer that Converted Industries' expected dividend growth rate is 5.0%, dividend payout ratio (g) is 45%, and required return on equity (r) is 10%. Based on a justified trailing P/E ratio compared to the stock's trailing P/E ratio at market of 9.0, Converted Industries is most likely:", "opts": ["undervalued.", "overvalued.", "correctly valued."], "ans": "A", "expl": "Justified trailing P/E = payout ratio * (1 + g) / (r − g). When the expected dividend growth is 5.0%, the justified trailing P/E = 0.45 * (1 + 0.05) / (0.10 − 0.05) = 9.45. This is greater than the market P/E of 9.0.", "explhtml": "<p>Justified trailing P/E = payout ratio * (1 + g) / (r − g). When the expected dividend growth is 5.0%, the justified trailing P/E = 0.45 * (1 + 0.05) / (0.10 − 0.05) = 9.45. This is greater than the market P/E of 9.0.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.l<\/div><div class=\"qtext\"><p>Robert Chan comments to Leslie Singer that Converted Industries&#x27; expected dividend growth rate is 5.0%, dividend payout ratio (g) is 45%, and required return on equity (r) is 10%. Based on a justified trailing P/E ratio compared to the stock&#x27;s trailing P/E ratio at market of 9.0, Converted Industries is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 6, "q": "Calculate free cash flow to equity (FCFE):", "opts": ["37.", "127.", "57."], "ans": "B", "expl": "Calculation of CFO: CFO = NI + NCC – WCINV CFO = $357 + $180 + $70 = $607 Depreciation  150  2010  2009 Amortization  50  Current assets  3,660 3,520 Gain on asset disposal  (30) Cash  (150)  (100) Reversal of provision  (20)  3,510 3,420 ↑DTL  30 Total non cash charges  180  Current liabilities 1,660 1,520 Notes payable  (200)  (220) 1,460 1,300 Working capital  2,050 2,120 WCINV  –70 Note that the change in the DTL liability is only included as a non-cash charge (NCC) as it is not expected to reverse in the foreseeable future. If the DTL is expected to reverse in the short run it should be ignored when adding back NCCs. Calculation of CFI: FCINV = change in NBV (net PP&E) + depreciation and amortization expense – gain on disposal FCINV = $380 + $200 – $30 = $550m Alternative using reconciliation approach: Opening PPE were $1,000m, these were depreciated by $150m and the closing PPE were $1,430. Since the disposal had a NBV of $60m the company must have spent: PPE: NBV 2009 b/fwd  1,000 NBV of disposal  (60) Depreciation expense  (150) Balancing figure 'Additions'  640 NBV 2010 c/fwd  1,430 On the disposal: Proceeds (Balancing figure)  90 NBV of disposal  60 Gain on disposal  30 Intangibles: NBV 2009 b/fwd  150 Disposals  (0) Amortization expense  (50) Balancing figure 'Additions'  0 NBV 2010 c/fwd  100 Additions  (640) | Proceeds on disposal  90 CFI  (550) Change in debt  70 Free cash flow for equity CFO  607 CFI  (550) Change in debt  70 FCFE  127", "explhtml": "<p>Calculation of CFO:<\/p><p>CFO = NI + NCC – WC<sub>INV<\/sub><\/p><p>CFO = $357 + $180 + $70 = $607 Depreciation &nbsp; 150 &nbsp; 2010 &nbsp; 2009 Amortization &nbsp; 50 &nbsp; Current assets &nbsp; 3,660 3,520 Gain on asset disposal &nbsp; (30) Cash &nbsp; (150) &nbsp; (100) Reversal of provision &nbsp; (20) &nbsp; 3,510 3,420 ↑DTL &nbsp; 30 Total non cash charges &nbsp; 180 &nbsp; Current liabilities 1,660 1,520 Notes payable &nbsp; (200) &nbsp; (220)<\/p><p>1,460 1,300 Working capital &nbsp; 2,050 2,120 WCINV &nbsp; –70<\/p><p>Note that the change in the DTL liability is only included as a non-cash charge (NCC) as it is not expected to reverse in the foreseeable future. If the DTL is expected to reverse in the short run it should be ignored when adding back NCCs.<\/p><p>Calculation of CFI:<\/p><p>FC<sub>INV<\/sub> = change in NBV (net PP&amp;E) + depreciation and amortization expense – gain on disposal<\/p><p>FC<sub>INV<\/sub> = $380 + $200 – $30 = $550m<\/p><p>Alternative using reconciliation approach:<\/p><p>Opening PPE were $1,000m, these were depreciated by $150m and the closing PPE were $1,430. Since the disposal had a NBV of $60m the company must have spent:<\/p><p>PPE: NBV 2009 b/fwd &nbsp; 1,000 NBV of disposal &nbsp; (60) Depreciation expense &nbsp; (150) Balancing figure &#x27;Additions&#x27; &nbsp; 640 NBV 2010 c/fwd &nbsp; 1,430<\/p><p>On the disposal: Proceeds (Balancing figure) &nbsp; 90 NBV of disposal &nbsp; 60 Gain on disposal &nbsp; 30<\/p><p>Intangibles: NBV 2009 b/fwd &nbsp; 150 Disposals &nbsp; (0) Amortization expense &nbsp; (50) Balancing figure &#x27;Additions&#x27; &nbsp; 0 NBV 2010 c/fwd &nbsp; 100<\/p><div class=\"tbl\"><table><tr><td>Additions<\/td><td>(640)<\/td><\/tr><tr><td>Proceeds on disposal<\/td><td>90<\/td><\/tr><\/table><\/div><p>CFI &nbsp; (550) Change in debt &nbsp; 70<\/p><p>Free cash flow for equity CFO &nbsp; 607 CFI &nbsp; (550) Change in debt &nbsp; 70 FCFE &nbsp; 127<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<\/summary><div class=\"vig-body\"><p>Victoria Banks is a senior analyst working for a large firm of portfolio managers. Her manager, David Alan, has asked her to report on a company called Retro Inc. as he believes it might offer a potentially good investment. The accounts for Retro Inc. are given below.<\/p><p>Retro prepares its accounts using U.S. GAAP.<\/p><p>Exhibit 1: Retro Inc. Balance Sheet as at 31 December<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v001.webp\" style=\"max-width:min(100%,336px)\" alt=\"20x9 20x8 $m $m\"><p>Assets<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v002.webp\" style=\"max-width:min(100%,324px)\" alt=\"Cash 150 100 1,700 1,620 Accounts receivable 1,810 1,800 Inventory Total current assets 3,660 3,520\"><p>Property, plant, and equipment 1,430 1,000<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v003.webp\" style=\"max-width:min(100%,324px)\" alt=\"Intangibles 100 150 5,190 4,670 Total assets\"><p>Liabilities and Capital<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Notes payable to banks 200 220 Accounts payable 1,330 1,200 Interest payable 130 100 Total current liabilities 1,660 1,520 770 Long-term debt 680 820 Deferred tax 790\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v005.webp\" style=\"max-width:min(100%,570px)\" alt=\"Common stock 1,300 1,300 Retained earnings 640 380 5,190 4,670 Total liabilities and capital Exhibit 2: Retro Inc. Income Statement for the Year Ended 31 December 20x9 $m Sales 3,000 Cost of goods sold (1,800) Grass profit 1,200 Depreciation (150) Amortization (50) SG&amp;A (280) Gain on disposal 30 Restructuring charge reversal 20 Interest expense (190) Income tax expense (223)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v006.webp\" style=\"max-width:min(100%,643px)\" alt=\"357 Net income\"><p>Retro disposed of PPE in the year that had a cost of $150m and accumulated depreciation at the time of disposal of $90m. No intangibles were disposed of during the year. Deferred tax liabilities are not expected to reverse for the foreseeable future.<\/p><p>Banks is also concerned that the net income looks relatively high when compared to previous years and therefore wants to measure the quality of earnings. She has heard that the lower the accruals ratio the higher the quality of earnings.<\/p><p>Banks calculates that Retro Inc. has a leading P/E ratio of 4.29 and a five-year consensus growth rate forecast at 14,85%. The median PEG, based on leading P/E, for a group of companies comparable in risk to Retro Inc. is 0.82. Based on this Banks wants to determine whether the stock is correctly priced. One of Banks's colleagues, Jennifer Cery, comments that P/E multiples are not always that useful and that sometimes enterprise value multiples are better. She makes the following comments:<\/p><p>Comment 1: Enterprise value multiples are useful when comparing firms with different<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v007.webp\" style=\"max-width:min(100%,610px)\" alt=\"degrees of financial leverage and when EPS is negative.\"><p>Comment 2: As EBITDA can be used as a proxy for free cash flow to the firm providing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v008.webp\" style=\"max-width:min(100%,613px)\" alt=\"depreciation is close to capital expenditure and the firms levels of working capital is relatively constant.\"><\/div><\/details><div class=\"pp-topic\">Module 19.1, LOS 19.c<\/div><div class=\"qtext\"><p>Calculate free cash flow to equity (FCFE):<\/p><\/div>", "subj": "equity"}, {"n": 7, "q": "Using the cash flow statement approach calculate the aggregate accruals ratio:", "opts": ["11.5%.", "5.7%.", "10.2%."], "ans": "A", "expl": "Aggregate accruals = NI – CFO – CFI Aggregate accruals = $357 – $607 + 550 = $300 Accruals ratio = $300 / ($2,760 + $2,480) / 2 = 11.5%  2010 2009 Total assets  5,190 4,670 Cash and investments  (150)  (100) Operating assets  5,040 4,570 Total liabilities  3,250 2,990 Notes payable  (200)  (220) Long term debt  (770)  (680) Operating liabilities  2,280 2,090 Net operating assets  2,760 2,480", "explhtml": "<p>Aggregate accruals = NI – CFO – CFI<\/p><p>Aggregate accruals = $357 – $607 + 550 = $300<\/p><p>Accruals ratio = $300 / ($2,760 + $2,480) / 2 = 11.5%<\/p><div class=\"tbl\"><table><tr><td><\/td><td>2010<\/td><td>2009<\/td><\/tr><\/table><\/div><p>Total assets &nbsp; 5,190 4,670 Cash and investments &nbsp; (150) &nbsp; (100) Operating assets &nbsp; 5,040 4,570 Total liabilities &nbsp; 3,250 2,990 Notes payable &nbsp; (200) &nbsp; (220) Long term debt &nbsp; (770) &nbsp; (680) Operating liabilities &nbsp; 2,280 2,090 Net operating assets &nbsp; 2,760 2,480<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Victoria Banks is a senior analyst working for a large firm of portfolio managers. Her manager, David Alan, has asked her to report on a company called Retro Inc. as he believes it might offer a potentially good investment. The accounts for Retro Inc. are given below.<\/p><p>Retro prepares its accounts using U.S. GAAP.<\/p><p>Exhibit 1: Retro Inc. Balance Sheet as at 31 December<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v001.webp\" style=\"max-width:min(100%,336px)\" alt=\"20x9 20x8 $m $m\"><p>Assets<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v002.webp\" style=\"max-width:min(100%,324px)\" alt=\"Cash 150 100 1,700 1,620 Accounts receivable 1,810 1,800 Inventory Total current assets 3,660 3,520\"><p>Property, plant, and equipment 1,430 1,000<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v003.webp\" style=\"max-width:min(100%,324px)\" alt=\"Intangibles 100 150 5,190 4,670 Total assets\"><p>Liabilities and Capital<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Notes payable to banks 200 220 Accounts payable 1,330 1,200 Interest payable 130 100 Total current liabilities 1,660 1,520 770 Long-term debt 680 820 Deferred tax 790\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v005.webp\" style=\"max-width:min(100%,570px)\" alt=\"Common stoc
