aluation. The resulting value will be labelled \"Best Case Scenario\" in the report.<\/p><p>In addition, the client has passed Pedroia their own forecasts for the performance of lliot over the next five years, and he also intends to use these forecasts to come up with an alternative valuation, which he will label \"FCF Valuation Using Forecasted Cash Flows.\" Details of the forecasted flows are as follows: Free Cash Flow to Equity Forecasts: Iliot Inc.<\/p><p>2x10 $65 million 2x11 $68 million 2x12 $72 million 2x13 $75 million Pedroia will discount the flows at a cost of equity of 12%, and that the 2x10 free cash flow will occur in one year from now. In order to calculate a terminal value at the end of 2x13, Pedroia intends to use an estimate of lliot's P/E ratio and earnings. He estimates lliot's trailing P/E ratio at the end of 2x13 to be 28 using a linear regression model based on risk, growth, and dividend payout, and forecasts 2x13 earnings to be $70 milllion.<\/p><p>Pedroia also wishes to include a note on lliot's normalized earnings in his final report. He intends to initially calculate a normalized EPS figure for 2x09. To do this he will use the method of average return on equity method. In order to assist with this task he notes down various information for lliot from the last three years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v017.webp\" style=\"max-width:min(100%,339px)\" alt=\"Iliot Historical Data 2x07 2x09 2x08 $2.80 $2.50 Earnings per share $2.85 $16.40 Book value per share $16.20 $15.80 14.8% 15.4% Return on equity 18.0%\"><p>Pedroia intends to conclude his report with a note to the client that he himself owns a small number of lliot shares. He purchased the shares after implementing a stock screen system of selection, whereby he decided to only purchase shares if they passed the following criteria:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v018.webp\" style=\"max-width:min(100%,276px)\" alt=\"• P/E less than 10 ia has decided to include two free cash flow valuations in his report for the client. An extract of the most recent cash flow statement, which he intends to use as a base for his first FCF calculation, appears below:<\/p><p>Cash Flow Statement (extract) for the Year Ended 31st December 2x09<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v015.webp\" style=\"max-width:min(100%,503px)\" alt=\"U.S. $ millions Cash flow from operating activities 130 Extracts from the Financial Statements for 2x09 also show the following: 2x08 2x09 Financial Statement Extracts Sm $m 270.0 320.0 Fixed assets (at cost)\"><p>Less: Accumulated depreciation 112.0 138.0<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v016.webp\" style=\"max-width:min(100%,660px)\" alt=\"65.2 Inventory 71.0 Accounts receivable 94.2 96.7 74.0 79.0 Accounts payable\"><p>There have been no sales or impairments of fixed assets during the year and net borrowing for 2x09 raised $14 million.<\/p><p>For his first valuation, Pedroia will make a simple assumption that free cash flow to equity will grow at 5% per annum indefinitely in order to reach his valuation. The resulting value will be labelled \"Best Case Scenario\" in the report.<\/p><p>In addition, the client has passed Pedroia their own forecasts for the performance of lliot over the next five years, and he also intends to use these forecasts to come up with an alternative valuation, which he will label \"FCF Valuation Using Forecasted Cash Flows.\" Details of the forecasted flows are as follows: Free Cash Flow to Equity Forecasts: Iliot Inc.<\/p><p>2x10 $65 million 2x11 $68 million 2x12 $72 million 2x13 $75 million Pedroia will discount the flows at a cost of equity of 12%, and that the 2x10 free cash flow will occur in one year from now. In order to calculate a terminal value at the end of 2x13, Pedroia intends to use an estimate of lliot's P/E ratio and earnings. He estimates lliot's trailing P/E ratio at the end of 2x13 to be 28 using a linear regression model based on risk, growth, and dividend payout, and forecasts 2x13 earnings to be $70 milllion.<\/p><p>Pedroia also wishes to include a note on lliot's normalized earnings in his final report. He intends to initially calculate a normalized EPS figure for 2x09. To do this he will use the method of average return on equity method. In order to assist with this task he notes down various information for lliot from the last three years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v017.webp\" style=\"max-width:min(100%,339px)\" alt=\"Iliot Historical Data 2x07 2x09 2x08 $2.80 $2.50 Earnings per share $2.85 $16.40 Book value per share $16.20 $15.80 14.8% 15.4% Return on equity 18.0%\"><p>Pedroia intends to conclude his report with a note to the client that he himself owns a small number of lliot shares. He purchased the shares after implementing a stock screen system of selection, whereby he decided to only purchase shares if they passed the following criteria:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v018.webp\" style=\"max-width:min(100%,276px)\" alt=\"• P/E less than 10 • Market Cap greater than $0.5 billion\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v019.webp\" style=\"max-width:min(100%,320px)\" alt=\"• EBITDA-to-free cash flow ratio less than 12 • PEG ratio greater than 1.2\"><p>He implemented his stock screen system in mid 2x06. Before implementing the system, Pedroia back tested it using 2x05 year-end ratios published by his favorite analyst's journal in April 2x06. Using those ratios, results showed that if he had bought stocks at the end of 2x05, which passed his screen, he would have made abnormal positive profits.<\/p><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.h<\/div><div class=\"qtext\"><p>Which of the following is least likely to be a limitation of the predicted P/E used by Pedroia to calculate the terminal value in his &quot;FCF Valuation Using Forecasted Cash Flows&quot; valuation?<\/p><\/div>", "subj": "equity"}, {"n": 55, "q": "Which of the following errors has Pedroia made in back testing his stock screen?", "opts": ["His results are subject to survivorship bias.", "His results are likely to suffer from multicollinearity.", "His results are likely to suffer from look ahead bias."], "ans": "C", "expl": "Pedroia should have assumed that he could purchase the stocks on the day the ratios were published, not the year-end. As a result of this mistake, he is exposed to the potential effects of look-ahead bias.", "explhtml": "<p>Pedroia should have assumed that he could purchase the stocks on the day the ratios were published, not the year-end. As a result of this mistake, he is exposed to the potential effects of look-ahead bias.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 50–55<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>At the end of 2x09, Dustin Pedroia, CFA, is writing a report to help advise on a potential corporate takeover. Iliot Inc. is up for sale, and Pedroia's client is considering buying 100% of the share capital.<\/p><p>Pedroia has decided to include two free cash flow valuations in his report for the client. An extract of the most recent cash flow statement, which he intends to use as a base for his first FCF calculation, appears below:<\/p><p>Cash Flow Statement (extract) for the Year Ended 31st December 2x09<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v015.webp\" style=\"max-width:min(100%,503px)\" alt=\"U.S. $ millions Cash flow from operating activities 130 Extracts from the Financial Statements for 2x09 also show the following: 2x08 2x09 Financial Statement Extracts Sm $m 270.0 320.0 Fixed assets (at cost)\"><p>Less: Accumulated depreciation 112.0 138.0<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v016.webp\" style=\"max-width:min(100%,660px)\" alt=\"65.2 Inventory 71.0 Accounts receivable 94.2 96.7 74.0 79.0 Accounts payable\"><p>There have been no sales or impairments of fixed assets during the year and net borrowing for 2x09 raised $14 million.<\/p><p>For his first valuation, Pedroia will make a simple assumption that free cash flow to equity will grow at 5% per annum indefinitely in order to reach his valuation. The resulting value will be labelled \"Best Case Scenario\" in the report.<\/p><p>In addition, the client has passed Pedroia their own forecasts for the performance of lliot over the next five years, and he also intends to use these forecasts to come up with an alternative valuation, which he will label \"FCF Valuation Using Forecasted Cash Flows.\" Details of the forecasted flows are as follows: Free Cash Flow to Equity Forecasts: Iliot Inc.<\/p><p>2x10 $65 million 2x11 $68 million 2x12 $72 million 2x13 $75 million Pedroia will discount the flows at a cost of equity of 12%, and that the 2x10 free cash flow will occur in one year from now. In order to calculate a terminal value at the end of 2x13, Pedroia intends to use an estimate of lliot's P/E ratio and earnings. He estimates lliot's trailing P/E ratio at the end of 2x13 to be 28 using a linear regression model based on risk, growth, and dividend payout, and forecasts 2x13 earnings to be $70 milllion.<\/p><p>Pedroia also wishes to include a note on lliot's normalized earnings in his final report. He intends to initially calculate a normalized EPS figure for 2x09. To do this he will use the method of average return on equity method. In order to assist with this task he notes down various information for lliot from the last three years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v017.webp\" style=\"max-width:min(100%,339px)\" alt=\"Iliot Historical Data 2x07 2x09 2x08 $2.80 $2.50 Earnings per share $2.85 $16.40 Book value per share $16.20 $15.80 14.8% 15.4% Return on equity 18.0%\"><p>Pedroia intends to conclude his report with a note to the client that he himself owns a small number of lliot shares. He purchased the shares after implementing a stock screen system of selection, whereby he decided to only purchase shares if they passed the following criteria:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v018.webp\" style=\"max-width:min(100%,276px)\" alt=\"• P/E less than 10 • Market Cap greater than $0.5 billion\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v019.webp\" style=\"max-width:min(100%,320px)\" alt=\"• EBITDA-to-free cash flow ratio less than 12 • PEG ratio greater than 1.2\"><p>He implemented his stock screen system in mid 2x06. Before implementing the system, Pedroia back tested it using 2x05 year-end ratios published by his favorite analyst's journal in April 2x06. Using those ratios, results showed that if he had bought stocks at the end of 2x05, which passed his screen, he would have made abnormal positive profits.<\/p><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.r<\/div><div class=\"qtext\"><p>Which of the following errors has Pedroia made in back testing his stock screen?<\/p><\/div>", "subj": "equity"}, {"n": 56, "q": "The Farmer Co. has a payout ratio of 65% and a return on equity (ROE) of 16% (assume that this is expected ROE for the upcoming year). What will be the appropriate price-to-book value (PBV) based on return differential if the expected growth rate in dividends is 5.6% and the required rate of return is 13%?", "opts": ["0.71.", "1.48.", "1.41."], "ans": "C", "expl": "Based on return differential: P₀ / BV₀ = (ROE₁ − g) / (r − g) = (0.16 − 0.056) / (0.13 − 0.056) = 1.41.", "explhtml": "<p>Based on return differential:<\/p><p>P<sub>0<\/sub> / BV<sub>0<\/sub> = (ROE<sub>1<\/sub> − g) / (r − g) = (0.16 − 0.056) / (0.13 − 0.056) = 1.41.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>The Farmer Co. has a payout ratio of 65% and a return on equity (ROE) of 16% (assume that this is expected ROE for the upcoming year). What will be the appropriate price-to-book value (PBV) based on return differential if the expected growth rate in dividends is 5.6% and the required rate of return is 13%?<\/p><\/div>", "subj": "equity"}, {"n": 57, "q": "The Lewis Corp. had revenue per share of $300 in 2001, earnings per share of $4.50, and paid out 60% of its earnings as dividends. If the return on equity (ROE) and required rate of return of Lewis are 20% and 13% respectively, what is the appropriate price/sales (P/S) multiple for Lewis?", "opts": ["0.18.", "0.19.", "0.12."], "ans": "B", "expl": "Profit Margin = EPS / Sales per share = 4.50 / 300 = 0.015 or 1.5%. Expected growth in dividends and earnings = ROE × (1 − payout ratio) = 0.20 × 0.40 = 0.08 or 8%. P₀/S₀ = [profit margin × payout ratio × (1 + g)] / (r − g) = [0.015 × 0.60 × (1.08)] / (0.13 − 0.08) = 0.1944.", "explhtml": "<p>Profit Margin = EPS / Sales per share = 4.50 / 300 = 0.015 or 1.5%.<\/p><p>Expected growth in dividends and earnings = ROE × (1 − payout ratio) = 0.20 × 0.40 = 0.08 or 8%.<\/p><p>P<sub>0<\/sub>/S<sub>0<\/sub> = [profit margin × payout ratio × (1 + g)] / (r − g) = [0.015 × 0.60 × (1.08)] / (0.13 − 0.08) = 0.1944.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>The Lewis Corp. had revenue per share of $300 in 2001, earnings per share of $4.50, and paid out 60% of its earnings as dividends. If the return on equity (ROE) and required rate of return of Lewis are 20% and 13% respectively, what is the appropriate price/sales (P/S) multiple for Lewis?<\/p><\/div>", "subj": "equity"}, {"n": 58, "q": "Margin and Sales Trade-off for CVR, Inc. and Home, Inc., for Next Year     Firm Strategy Retention Rate Profit Margin Sales/Book\nValue of Equity CVR, Inc. High Margin / Low\nVolume 20% 8% 1.25 CVR, Inc. Low Margin / High\nVolume 20% 2% 4.00 Home, Inc. High Margin / Low\nVolume 40% 9% 2.00 Home, Inc. Low Margin / High\nVolume 40% 1% 20.0 (Note: CVR, Inc., has a book value of equity of $80 and a required rate of return of 10%. Home, Inc., has a book value of equity of $100 and a required rate of return of 11%.) If CVR, Inc., has a required return for shareholders of 10%, what is its appropriate leading price-to-sales (P/S) multiple if the firm undertakes the high margin/low volume strategy?", "opts": ["0.20.", "0.80.", "1.46."], "ans": "B", "expl": "g = Retention Rate × Profit Margin × Sales/book value of equity = 0.20 × 0.08 × 1.25 = 0.02. If profit margin is based on the expected earnings next period, Leading P/S = (profit margin × payout ratio) / (r − g) = (0.08 × 0.80) / (0.10 − 0.02) = 0.80.", "explhtml": "<p>g = Retention Rate × Profit Margin × Sales/book value of equity = 0.20 × 0.08 × 1.25 = 0.02.<\/p><p>If profit margin is based on the expected earnings next period,<\/p><p>Leading P/S = (profit margin × payout ratio) / (r − g) = (0.08 × 0.80) / (0.10 − 0.02) = 0.80.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><div class=\"tbl\"><table><tr><td colspan=5>Margin and Sales Trade-off for CVR, Inc. and Home, Inc., for Next Year<\/td><\/tr><tr><td>Firm<\/td><td>Strategy<\/td><td>Retention Rate<\/td><td>Profit Margin<\/td><td>Sales/Book<br>Value of Equity<\/td><\/tr><tr><td>CVR, Inc.<\/td><td>High Margin / Low<br>Volume<\/td><td>20%<\/td><td>8%<\/td><td>1.25<\/td><\/tr><tr><td>CVR, Inc.<\/td><td>Low Margin / High<br>Volume<\/td><td>20%<\/td><td>2%<\/td><td>4.00<\/td><\/tr><tr><td>Home, Inc.<\/td><td>High Margin / Low<br>Volume<\/td><td>40%<\/td><td>9%<\/td><td>2.00<\/td><\/tr><tr><td>Home, Inc.<\/td><td>Low Margin / High<br>Volume<\/td><td>40%<\/td><td>1%<\/td><td>20.0<\/td><\/tr><\/table><\/div><p>(Note: CVR, Inc., has a book value of equity of $80 and a required rate of return of 10%. Home, Inc., has a book value of equity of $100 and a required rate of return of 11%.)<\/p><p>If CVR, Inc., has a required return for shareholders of 10%, what is its appropriate leading price-to-sales (P/S) multiple if the firm undertakes the high margin/low volume strategy?<\/p><\/div>", "subj": "equity"}, {"n": 59, "q": "Which of the following valuation approaches is based on the rationale that stock values differ due to differences in the expected values of variables such as sales, earnings, or related growth rates?", "opts": ["Method of forecasted fundamentals.", "Free cash flow to the firm.", "Method of comparables."], "ans": "A", "expl": "The method of forecasted fundamentals is based on the rationale that stock values differ due to differences in the expected values of fundamentals such as sales, earnings, or related growth rates.", "explhtml": "<p>The method of forecasted fundamentals is based on the rationale that stock values differ due to differences in the expected values of fundamentals such as sales, earnings, or related growth rates.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>Which of the following valuation approaches is based on the rationale that stock values differ due to differences in the expected values of variables such as sales, earnings, or related growth rates?<\/p><\/div>", "subj": "equity"}, {"n": 60, "q": "At a CFA society function, Robert Chan comments to Li Chiao that the expected dividend growth rate for Xanedu Industries has decreased 0.5% from 6.0% to 5.5%. Chan claims that since Xanedu will maintain their historic dividend payout ratio of 40% and required return on equity (r) of 12%, Xanedu's justified leading P/E ratio based on forecasted fundamentals will also decrease by 0.5%. Is Chan correct?", "opts": ["No, Xanedu's justified leading P/E ratio will decrease by approximately 7.8%.", "No, Xanedu's justified leading P/E ratio will increase by approximately 7.8%.", "Yes, Xanedu's justified leading P/E ratio will increase by approximately 0.5%."], "ans": "A", "expl": "Chan is not correct. P/EXanedu = payout ratio / (r - g) When the expected dividend growth is 6%, P/E = 0.40 / (0.12 - 0.06) = 6.67 When the expected dividend growth is 5.5%, P/E = 0.40 / (0.12 - 0.055) = 6.15 The percentage change is (6.15 / 6.67) - 1 = -7.80%, representing a 7.80% decrease.", "explhtml": "<p>Chan is not correct. P/E<sub>Xanedu<\/sub> = payout ratio / (r - g)<\/p><p>When the expected dividend growth is 6%, P/E = 0.40 / (0.12 - 0.06) = 6.67<\/p><p>When the expected dividend growth is 5.5%, P/E = 0.40 / (0.12 - 0.055) = 6.15<\/p><p>The percentage change is (6.15 / 6.67) - 1 = -7.80%, representing a 7.80% decrease.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.d<\/div><div class=\"qtext\"><p>At a CFA society function, Robert Chan comments to Li Chiao that the expected dividend growth rate for Xanedu Industries has decreased 0.5% from 6.0% to 5.5%. Chan claims that since Xanedu will maintain their historic dividend payout ratio of 40% and required return on equity (r) of 12%, Xanedu&#x27;s justified leading P/E ratio based on forecasted fundamentals will also decrease by 0.5%. Is Chan correct?<\/p><\/div>", "subj": "equity"}, {"n": 61, "q": "Industrial Light had earnings per share (EPS) of $5.00 past year, a dividend per share of $2.50, a cost of equity of 12%, and a long-term expected growth rate of 5%. What is the trailing price-to-earnings (P/E) ratio?", "opts": ["3.75.", "7.50.", "7.14."], "ans": "B", "expl": "(1−b) × (1 + g) PE = r−g 1 − b = 1 − (2.50/5.00) = 0.50 P₅ / E₅ = (0.50 × 1.05) / (0.12 − 0.05) = 7.50", "explhtml": "<p>(1−b) × (1 + g)<\/p><p>PE =<\/p><p>r−g<\/p><p>1 − b = 1 − (2.50/5.00) = 0.50<\/p><p>P<sub>5<\/sub> / E<sub>5<\/sub> = (0.50 × 1.05) / (0.12 − 0.05) = 7.50<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>Industrial Light had earnings per share (EPS) of $5.00 past year, a dividend per share of $2.50, a cost of equity of 12%, and a long-term expected growth rate of 5%. What is the trailing price-to-earnings (P/E) ratio?<\/p><\/div>", "subj": "equity"}, {"n": 62, "q": "An analyst is valuing a company with a dividend payout ratio of 0.55, a beta of 0.92, and an expected earnings growth rate of 0.07. A regression on comparable companies produces the following equation: Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta) What is the predicted P/E using the above regression?", "opts": ["7.65.", "10.14.", "11.43."], "ans": "B", "expl": "Predicted P/E = 7.65 + (3.75 × 0.55) + (15.35 × 0.07) − (0.70 × 0.92) = 10.14", "explhtml": "<p>Predicted P/E = 7.65 + (3.75 × 0.55) + (15.35 × 0.07) − (0.70 × 0.92) = 10.14<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.h<\/div><div class=\"qtext\"><p>An analyst is valuing a company with a dividend payout ratio of 0.55, a beta of 0.92, and an expected earnings growth rate of 0.07. A regression on comparable companies produces the following equation:<\/p><p>Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta)<\/p><p>What is the predicted P/E using the above regression?<\/p><\/div>", "subj": "equity"}, {"n": 63, "q": "A justified price multiple is the:", "opts": ["warranted or intrinsic price multiple.", "multiple implied by the market price.", "multiple implied by historical growth."], "ans": "A", "expl": "A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple.", "explhtml": "<p>A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.b<\/div><div class=\"qtext\"><p>A justified price multiple is the:<\/p><\/div>", "subj": "equity"}, {"n": 64, "q": "An argument for using the price-to-earnings (P/E) valuation approach is that:", "opts": ["earnings volatility facilitates interpretation.", "research shows that P/E differences are significantly related to long-run average stock returns.", "earnings can be negative."], "ans": "B", "expl": "Research shows that P/E differences are significantly related to long-run average stock returns. Both remaining factors reduce the usefulness of the P/E approach.", "explhtml": "<p>Research shows that P/E differences are significantly related to long-run average stock returns. Both remaining factors reduce the usefulness of the P/E approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>An argument for using the price-to-earnings (P/E) valuation approach is that:<\/p><\/div>", "subj": "equity"}, {"n": 65, "q": "Glad Tidings Gifts (GTG) recently reported annual earnings per share (EPS) of $2.25, which included an extraordinary loss of $0.17 and an expense of $0.12 related to acquisition costs during the accounting period, neither of which are expected to recur. Given that the most recent share price is $50.00, what is a useful GTG's trailing price to earnings (P/E) for valuation purposes?", "opts": ["22.22.", "25.51.", "19.69."], "ans": "C", "expl": "Using an underlying earnings concept, an analyst would add back the temporary charges against earnings: $2.25 + $0.17 + $0.12 = $2.54. The resulting trailing P/E = 50.00 / 2.54 = 19.69.", "explhtml": "<p>Using an underlying earnings concept, an analyst would add back the temporary charges against earnings: $2.25 + $0.17 + $0.12 = $2.54. The resulting trailing P/E = 50.00 / 2.54 = 19.69.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>Glad Tidings Gifts (GTG) recently reported annual earnings per share (EPS) of $2.25, which included an extraordinary loss of $0.17 and an expense of $0.12 related to acquisition costs during the accounting period, neither of which are expected to recur. Given that the most recent share price is $50.00, what is a useful GTG&#x27;s trailing price to earnings (P/E) for valuation purposes?<\/p><\/div>", "subj": "equity"}, {"n": 66, "q": "An increase in return on equity (ROE) will cause a price-to-earnings (P/E) multiple to:", "opts": ["increase.", "decrease.", "there is insufficient information to tell."], "ans": "A", "expl": "An increase in ROE will increase growth through the g = (ROE × retention) relation. Thus, as growth increases, the following expression for trailing P/E should increase: P₀/E₀ = [(1 – b)(1 + g)] / (r – g) Note that the topic review does not allow for any interactive relationship between leverage, ROE, and growth. Thus, no explicit consideration is given to whether the increase in ROE results from risk-increasing leverage that could cause an offsetting increase in the required rate of return.", "explhtml": "<p>An increase in ROE will increase growth through the g = (ROE × retention) relation. Thus, as growth increases, the following expression for trailing P/E should increase:<\/p><p>P<sub>0<\/sub>/E<sub>0<\/sub> = [(1 – b)(1 + g)] / (r – g)<\/p><p>Note that the topic review does not allow for any interactive relationship between leverage, ROE, and growth. Thus, no explicit consideration is given to whether the increase in ROE results from risk-increasing leverage that could cause an offsetting increase in the required rate of return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in return on equity (ROE) will cause a price-to-earnings (P/E) multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 67, "q": "An argument for using the price-to-earnings (P/E) valuation approach is that:", "opts": ["management discretion increases the reliability of the ratio.", "earnings power is the primary determinant of investment value.", "earnings can be negative."], "ans": "B", "expl": "Earnings power is the primary determinant of investment value. Both remaining factors reduce the usefulness of the P/E approach.", "explhtml": "<p>Earnings power is the primary determinant of investment value. Both remaining factors reduce the usefulness of the P/E approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>An argument for using the price-to-earnings (P/E) valuation approach is that:<\/p><\/div>", "subj": "equity"}, {"n": 68, "q": "The price-to-book value (PBV) ratio for a high-growth firm will:", "opts": ["increase as the growth rate in either the high-growth or stable-growth period increases.", "increase as the growth rate in the high-growth period increases and decrease as the growth rate in the stable-growth period increases.", "increase as the growth rate in either the high-growth or stable-growth period decreases."], "ans": "A", "expl": "The PBV ratio for a high-growth firm will be determined by growth rates in earnings in both the high-growth and stable-growth periods. The PBV ratio increases as the growth rate increases in either period.", "explhtml": "<p>The PBV ratio for a high-growth firm will be determined by growth rates in earnings in both the high-growth and stable-growth periods. The PBV ratio increases as the growth rate increases in either period.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>The price-to-book value (PBV) ratio for a high-growth firm will:<\/p><\/div>", "subj": "equity"}, {"n": 69, "q": "Which of the following measures of cash flow is most closely linked with valuation theory?", "opts": ["Cash flow from operations (CFO).", "Earnings before interest, taxes, depreciation, and amortization (EBITDA).", "Free cash flow to equity (FCFE)."], "ans": "C", "expl": "FCFE is most strongly linked to valuation theory. Both remaining proxies are in need of significant adjustment to accurately measure cash flow in valuation.", "explhtml": "<p>FCFE is most strongly linked to valuation theory. Both remaining proxies are in need of significant adjustment to accurately measure cash flow in valuation.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.n<\/div><div class=\"qtext\"><p>Which of the following measures of cash flow is most closely linked with valuation theory?<\/p><\/div>", "subj": "equity"}, {"n": 70, "q": "The goal of normalizing earnings is to adjust for:", "opts": ["cyclical elements.", "seasonal elements.", "non-cash charges."], "ans": "A", "expl": "The goal of normalizing earnings is to adjust for cyclical elements.", "explhtml": "<p>The goal of normalizing earnings is to adjust for cyclical elements.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>The goal of normalizing earnings is to adjust for:<\/p><\/div>", "subj": "equity"}, {"n": 71, "q": "An increase in financial leverage will cause the trailing price-to-earnings (P/E) multiple to:", "opts": ["decrease.", "increase.", "there is insufficient information to tell."], "ans": "A", "expl": "An increase in financial leverage will cause the required rate of return to increase, thereby decreasing the P/E. This is clear in the expression for trailing P/E: P₀ / E₀ = [(1 – b)(1 + g)] / (r – g) (Note: the topic review does not allow for any interactive relationship between leverage, return on equity (ROE), and growth. Thus, no explicit consideration is given to whether the increase in leverage would increase ROE and therefore growth through the g = (ROE × retention) relationship.)", "explhtml": "<p>An increase in financial leverage will cause the required rate of return to increase, thereby decreasing the P/E. This is clear in the expression for trailing P/E:<\/p><p>P<sub>0<\/sub> / E<sub>0<\/sub> = [(1 – b)(1 + g)] / (r – g)<\/p><p>(Note: the topic review does not allow for any interactive relationship between leverage, return on equity (ROE), and growth. Thus, no explicit consideration is given to whether the increase in leverage would increase ROE and therefore growth through the g = (ROE × retention) relationship.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in financial leverage will cause the trailing price-to-earnings (P/E) multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 72, "q": "A common price to earnings (P/E) based method for estimating terminal value in multi-stage models is the:", "opts": ["P/E to growth (PEG) approach.", "fundamentals approach.", "dividend yield approach."], "ans": "B", "expl": "It is common to restate the Gordon growth model price as a multiple of expected future book value per share or earnings per share (EPS).", "explhtml": "<p>It is common to restate the Gordon growth model price as a multiple of expected future book value per share or earnings per share (EPS).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.k<\/div><div class=\"qtext\"><p>A common price to earnings (P/E) based method for estimating terminal value in multi-stage models is the:<\/p><\/div>", "subj": "equity"}, {"n": 73, "q": "Margin and Sales Trade-off for CVR, Inc. and Home, Inc., for Next Year     Firm Strategy Retention Rate Profit Margin Sales/Book Value\n(SBV) of Equity CVR, Inc. High Margin / Low\nVolume 20% 8% 1.25 CVR, Inc. Low Margin / High\nVolume 20% 2% 4.00 Home, Inc. High Margin / Low\nVolume 40% 9% 2.00 Home, Inc. Low Margin / High\nVolume 40% 1% 20.0 Note: CVR, Inc., has a book value of equity of $80 and a required rate of return of 10%. Home, Inc., has a book value of equity of $100 and a required rate of return of 11%. If Home, Inc., has a required return for shareholders of 11%, what is its appropriate leading price-to-sales (Pₒ / S₁) multiple if the firm undertakes the low margin/high volume strategy?", "opts": ["1.00.", "0.20.", "0.80."], "ans": "B", "expl": "g = Retention Rate × Profit Margin × SBV of equity = 0.40 × 0.01 × 20.0 = 0.08. If profit margin is based on the expected earnings next period, P/S = (profit margin × payout ratio) / (r − g) = (0.01 × 0.60) / (0.11 − 0.08) = 0.20.", "explhtml": "<p>g = Retention Rate × Profit Margin × SBV of equity = 0.40 × 0.01 × 20.0 = 0.08.<\/p><p>If profit margin is based on the expected earnings next period,<\/p><p>P/S = (profit margin × payout ratio) / (r − g) = (0.01 × 0.60) / (0.11 − 0.08) = 0.20.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><div class=\"tbl\"><table><tr><td colspan=5>Margin and Sales Trade-off for CVR, Inc. and Home, Inc., for Next Year<\/td><\/tr><tr><td>Firm<\/td><td>Strategy<\/td><td>Retention Rate<\/td><td>Profit Margin<\/td><td>Sales/Book Value<br>(SBV) of Equity<\/td><\/tr><tr><td>CVR, Inc.<\/td><td>High Margin / Low<br>Volume<\/td><td>20%<\/td><td>8%<\/td><td>1.25<\/td><\/tr><tr><td>CVR, Inc.<\/td><td>Low Margin / High<br>Volume<\/td><td>20%<\/td><td>2%<\/td><td>4.00<\/td><\/tr><tr><td>Home, Inc.<\/td><td>High Margin / Low<br>Volume<\/td><td>40%<\/td><td>9%<\/td><td>2.00<\/td><\/tr><tr><td>Home, Inc.<\/td><td>Low Margin / High<br>Volume<\/td><td>40%<\/td><td>1%<\/td><td>20.0<\/td><\/tr><\/table><\/div><p>Note: CVR, Inc., has a book value of equity of $80 and a required rate of return of 10%. Home, Inc., has a book value of equity of $100 and a required rate of return of 11%.<\/p><p>If Home, Inc., has a required return for shareholders of 11%, what is its appropriate leading price-to-sales (P<sub>o <\/sub>/ S<sub>1<\/sub>) multiple if the firm undertakes the low margin/high volume strategy?<\/p><\/div>", "subj": "equity"}, {"n": 74, "q": "An increase in which of the following variables will least likely result in a corresponding increase in the price-to-book value (PBV) ratio for a high-growth firm?", "opts": ["Growth rates in earnings.", "Payout ratios.", "Required rate of return."], "ans": "C", "expl": "The PBV ratio decreases as the required rate of return increases.", "explhtml": "<p>The PBV ratio decreases as the required rate of return increases.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in which of the following variables will least likely result in a corresponding increase in the price-to-book value (PBV) ratio for a high-growth firm?<\/p><\/div>", "subj": "equity"}, {"n": 75, "q": "Sanford's economic value added (EVA®) for 2008 is closest to:", "opts": ["$1,383.20.", "$567.80.", "$525.80."], "ans": "C", "expl": "EVA is equal to net operating profit after tax (NOPAT) minus the dollar weighted average cost of capital ($WACC). NOPAT = EBIT(1 – t) = $2,900(1 − 0.4) = $1,740 Invested capital = LTD + SH equity = $5,575 + $6,100 = $11,675 $WACC = $11,675 × 0.104 = $1,214.20 EVA = $1,740 − $1,214.20 = $525.80", "explhtml": "<p>EVA is equal to net operating profit after tax (NOPAT) minus the dollar weighted average cost of capital ($WACC).<\/p><p>NOPAT = EBIT(1 – t) = $2,900(1 − 0.4) = $1,740<\/p><p>Invested capital = LTD + SH equity = $5,575 + $6,100 = $11,675<\/p><p>$WACC = $11,675 × 0.104 = $1,214.20<\/p><p>EVA = $1,740 − $1,214.20 = $525.80<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 75–78<\/summary><div class=\"vig-body\"><p>Lucas Davenport, CFA, has been assigned the task of doing a valuation analysis of Sanford Systems Inc. Sanford is currently trading at $15 per share. Exhibit 1 and Exhibit 2 present a summary of Sanford's financial statements for 2007 and 2008.<\/p><p>Davenport has previously completed a FCFE valuation, which yielded a value of $11.18 per share based on FCFE per common share in 2008 of $0.85.<\/p><p>Exhibit 1: Sanford Systems Balance Sheets as of 12/31/2008 (in US$ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v020.webp\" style=\"max-width:min(100%,601px)\" alt=\"2007 2008 $325 Cash and equivalents 450 850 870 Accounts receivable 1,000 1,050 Inventory $2,370 $2,175 Total current assets 13,600 Gross fixed assets 15,900 2,300 Accumulated depreciation 2,900 11,300 13,000 Net fixed assets $15,370 $13,475 Total assets $1,520 $1,500 Accounts payable 300 550 Notes payable Accrued taxes and expenses $2,070 $1,800 Total current liabilities $5,575 $6,111 Long-term debt 100 100 Common stock Additional paid-in capital\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v021.webp\" style=\"max-width:min(100%,669px)\" alt=\"1,089 6,000 Retained earnings $6,100 $7,189 Total shareholders&#x27; equity $13,475 $15,370 Total liabilities and shareholders&#x27; equity Exhibit 2: Sanford Systems Income Statements for 2007 and 2008 (in USS millions) 2007 2008 $12,000 $13,100 Total revenues 2,400 2,600 Operating costs and expenses $2,600 EBITDA $3,500 600 Depreciation and amortization 500 $2,100 $2,900 EBIT 500 585 Interest expense $1,600 $2,315 Income before taxes 640 926 Taxes (40%) $960 $1,389 Net income $280 Dividends $300 $680 $1,089 Change in retained earnings $1.92 $2.78 EPS $0.60 $0.56 DPS 500 # of shares outstandi\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v022.webp\" style=\"max-width:min(100%,669px)\" alt=\"P/Adjusted CFO per share 9.9% 1.20 2.0x Industry Median 9.2% 1.25 Sanford\"><p>Davenport would also like to make international price multiple comparisons and is contemplating using one or more of the following ratios: price-to-sales, price-to-earnings, price- to-book, price-to-adjusted cash flow from operations, and enterprise value-to-EBITDA.<\/p><p>Davenport decides to use a single-stage residual income model to estimate the value of Sanford, in addition to the FCFE framework he used earlier. He estimates Sanford's long-term perpetual growth rate in residual income at 5 percent, its return on equity to be 20 percent going forward, weighted average cost of capital to be 10.4 percent based on the target debt-to- asset ratio, and the required return on equity to be 14 percent.<\/p><p>Finally, Davenport solves the following equation for T, given the other inputs (where the index is the 5&amp;P 500), and determines that T = 3.6.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v023.webp\" style=\"max-width:min(100%,720px)\" alt=\"1a(Sanford P/B Tudex P/T)=IxI(Lut Suuford short-term groutch rate t Sanford diviled vield) 1 + Index growth rate + Index dividend yield\"><\/div><\/details><div class=\"pp-topic\">Module 21.1, LOS 21.a<\/div><div class=\"qtext\"><p>Sanford&#x27;s economic value added (EVA<sup>®<\/sup>) for 2008 is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 76, "q": "Based on a comparison of the actual trailing P/FCFE ratio compared to the justified trailing P/FCFE ratio (based on Davenport's FCFE valuation model) for 2008, Sanford is:", "opts": ["undervalued because the actual P/FCFE ratio is less than the justified P/FCFE ratio for 2008.", "correctly valued because the actual P/FCFE ratio is equal to the justified P/FCFE ratio for 2008.", "overvalued because the actual P/FCFE ratio is greater than the justified P/FCFE ratio for 2008."], "ans": "C", "expl": "Sanford's actual P/FCFE ratio is the current market price of $15 divided by FCFE for 2008: $15.00 P/FCFE =    = 17.6x $0.85 The justified P/FCFE ratio is the value derived from the FCFE valuation model ($11.18) divided by FCFE for 2008: $11.18 justified P/FCFE =    = 13.1x $0.85 Based on this analysis, Sanford is overvalued on an absolute basis (NOT relative to the industry benchmark) because the actual P/FCFE ratio is greater than the justified P/FCFE ratio.", "explhtml": "<p>Sanford&#x27;s actual P/FCFE ratio is the current market price of $15 divided by FCFE for 2008:<\/p><p>$15.00 P/FCFE =  &nbsp;  = 17.6x<\/p><p>$0.85<\/p><p>The justified P/FCFE ratio is the value derived from the FCFE valuation model ($11.18) divided by FCFE for 2008:<\/p><p>$11.18 justified P/FCFE =  &nbsp;  = 13.1x<\/p><p>$0.85<\/p><p>Based on this analysis, Sanford is overvalued on an absolute basis (NOT relative to the industry benchmark) because the actual P/FCFE ratio is greater than the justified P/FCFE ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 75–78<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lucas Davenport, CFA, has been assigned the task of doing a valuation analysis of Sanford Systems Inc. Sanford is currently trading at $15 per share. Exhibit 1 and Exhibit 2 present a summary of Sanford's financial statements for 2007 and 2008.<\/p><p>Davenport has previously completed a FCFE valuation, which yielded a value of $11.18 per share based on FCFE per common share in 2008 of $0.85.<\/p><p>Exhibit 1: Sanford Systems Balance Sheets as of 12/31/2008 (in US$ millions)<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v020.webp\" style=\"max-width:min(100%,601px)\" alt=\"2007 2008 $325 Cash and equivalents 450 850 870 Accounts receivable 1,000 1,050 Inventory $2,370 $2,175 Total current assets 13,600 Gross fixed assets 15,900 2,300 Accumulated depreciation 2,900 11,300 13,000 Net fixed assets $15,370 $13,475 Total assets $1,520 $1,500 Accounts payable 300 550 Notes payable Accrued taxes and expenses $2,070 $1,800 Total current liabilities $5,575 $6,111 Long-term debt 100 100 Common stock Additional paid-in capital\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v021.webp\" style=\"max-width:min(100%,669px)\" alt=\"1,089 6,000 Retained earnings $6,100 $7,189 Total shareholders&#x27; equity $13,475 $15,370 Total liabilities and shareholders&#x27; equity Exhibit 2: Sanford Systems Income Statements for 2007 and 2008 (in USS millions) 2007 2008 $12,000 $13,100 Total revenues 2,400 2,600 Operating costs and expenses $2,600 EBITDA $3,500 600 Depreciation and amortization 500 $2,100 $2,900 EBIT 500 585 Interest expense $1,600 $2,315 Income before taxes 640 926 Taxes (40%) $960 $1,389 Net income $280 Dividends $300 $680 $1,089 Change in retained earnings $1.92 $2.78 EPS $0.60 $0.56 DPS 500 # of shares outstandi\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v022.webp\" style=\"max-width:min(100%,669px)\" alt=\"P/Adjusted CFO per share 9.9% 1.20 2.0x Industry Median 9.2% 1.25 Sanford\"><p>Davenport would also like to make international price multiple comparisons and is contemplating using one or more of the following ratios: price-to-sales, price-to-earnings, price- to-book, price-to-adjusted cash flow from operations, and enterprise value-to-EBITDA.<\/p><p>Davenport decides to use a single-stage residual income model to estimate the value of Sanford, in addition to the FCFE framework he used earlier. He estimates Sanford's long-term perpetual growth rate in residual income at 5 percent, its return on equity to be 20 percent going forward, weighted average cost of capital to be 10.4 percent based on the target debt-to- asset ratio, and the required return on equity to be 14 percent.<\/p><p>Finally, Davenport solves the following equation for T, given the other inputs (where the index is the 5&amp;P 500), and determines that T = 3.6.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v023.webp\" style=\"max-width:min(100%,720px)\" alt=\"1a(Sanford P/B Tudex P/T)=IxI(Lut Suuford short-term groutch rate t Sanford diviled vield) 1 + Index growth rate + Index dividend yield\"><\/div><\/details><div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>Based on a comparison of the actual trailing P/FCFE ratio compared to the justified trailing P/FCFE ratio (based on Davenport&#x27;s FCFE valuation model) for 2008, Sanford is:<\/p><\/div>", "subj": "equity"}, {"n": 77, "q": "Based on a comparison of the actual trailing P/adjusted CFO ratio compared to the industry median trailing P/adjusted CFO per share ratio for 2008, Sanford:", "opts": ["is overvalued relative to the industry benchmark because Sanford’s P/adjusted CFO ratio is higher than the industry median, despite slightly higher systematic risk and lower 5-year earnings growth.", "may be undervalued relative to the industry benchmark because Sanford’s P/adjusted CFO ratio is higher than the industry median, despite slightly higher systematic risk and lower 5-year earnings growth.", "is correctly valued relative to the industry benchmark because Sanford’s P/adjusted CFO ratio is equal to the industry median, despite slightly higher systematic risk and lower 5-year earnings growth."], "ans": "A", "expl": "Sanford's adjusted CFO is equal to net income plus depreciation minus the increase in net working capital (excluding cash and notes payable) plus after-tax interest expense: adjusted CFO = $1,389 + $600 - $50 + $585(1 - 0.4) = $2,290 $2,290 adjusted CFO/share =    = $4.58 500 $15 P/adjusted CFO =    = 3.3x $4.58 Sanford is overvalued relative to the industry benchmark because its P/adjusted CFO ratio is higher than the industry median of 2.0, despite slightly higher systematic risk (as measured by beta) and a lower 5-year earnings growth forecast.", "explhtml": "<p>Sanford&#x27;s adjusted CFO is equal to net income plus depreciation minus the increase in net working capital (excluding cash and notes payable) plus after-tax interest expense:<\/p><p>adjusted CFO = $1,389 + $600 - $50 + $585(1 - 0.4) = $2,290<\/p><p>$2,290 adjusted CFO/share =  &nbsp;  = $4.58<\/p><p>500<\/p><p>$15 P/adjusted CFO =  &nbsp;  = 3.3x<\/p><p>$4.58<\/p><p>Sanford is overvalued relative to the industry benchmark because its P/adjusted CFO ratio is higher than the industry median of 2.0, despite slightly higher systematic risk (as measured by beta) and a lower 5-year earnings growth forecast.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 75–78<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Lucas Davenport, CFA, has been assigned the task of doing a valuation analysis of Sanford Systems Inc. Sanford is currently trading at $15 per share. Exhibit 1 and Exhibit 2 present a summary of Sanford's financial statements for 2007 and 2008.<\/p><p>Davenport has previously completed a FCFE valuation, which yielded a value of $11.18 per share based on FCFE per common share in 2008 of $0.85.<\/p><p>Exhibit 1: Sanford Systems Balance Sheets as of 12/31/2008 (in US$ millions)<\/p>< use a single-stage residual income model to estimate the value of Sanford, in addition to the FCFE framework he used earlier. He estimates Sanford's long-term perpetual growth rate in residual income at 5 percent, its return on equity to be 20 percent going forward, weighted average cost of capital to be 10.4 percent based on the target debt-to- asset ratio, and the required return on equity to be 14 percent.<\/p><p>Finally, Davenport solves the following equation for T, given the other inputs (where the index is the 5&amp;P 500), and determines that T = 3.6.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v023.webp\" style=\"max-width:min(100%,720px)\" alt=\"1a(Sanford P/B Tudex P/T)=IxI(Lut Suuford short-term groutch rate t Sanford diviled vield) 1 + Index growth rate + Index dividend yield\"><\/div><\/details><div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>For purposes of this question only, assume Sanford&#x27;s ROE is 20%, its current market price is $25, and the cost of equity is 14%. Sanford&#x27;s implied growth rate in residual income is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 79, "q": "The warranted or intrinsic price multiple is called the:", "opts": ["justified price multiple.", "multiple implied by historical growth.", "multiple implied by the market price."], "ans": "A", "expl": "A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple.", "explhtml": "<p>A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.b<\/div><div class=\"qtext\"><p>The warranted or intrinsic price multiple is called the:<\/p><\/div>", "subj": "equity"}, {"n": 80, "q": "An increase in profit margin will cause a price-to-sales (P/S) multiple to increase if:", "opts": ["there is insufficient information to tell.", "the required rate of return increases.", "the growth rate in sales does not decrease proportionately."], "ans": "C", "expl": "An increase (decrease) in the profit margin increases (decreases) the growth rate if sales do not decrease (increase) proportionately. Increases in the required rate of return would decrease the P/S ratio. This is clear in the expression for trailing P/S: P₀ / S₀ = [(E₀ / S₀)(1 – b)(1 + g)] / (r – g)", "explhtml": "<p>An increase (decrease) in the profit margin increases (decreases) the growth rate if sales do not decrease (increase) proportionately. Increases in the required rate of return would decrease the P/S ratio. This is clear in the expression for trailing P/S:<\/p><p>P<sub>0<\/sub> / S<sub>0<\/sub> = [(E<sub>0<\/sub> / S<sub>0<\/sub>)(1 – b)(1 + g)] / (r – g)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in profit margin will cause a price-to-sales (P/S) multiple to increase if:<\/p><\/div>", "subj": "equity"}, {"n": 81, "q": "What is the price-to-sales (P/S) multiple for Firm A in the high-margin, low-volume strategy?", "opts": ["2.00.", "2.18.", "0.13."], "ans": "B", "expl": "The P/S multiple = [Profit Margin × Payout Ratio × (1 + g)] / (r − g) = (0.10 × 0.4 × 1.09) / (0.11 − 0.09) = 2.18.", "explhtml": "<p>The P/S multiple = [Profit Margin × Payout Ratio × (1 + g)] / (r − g) = (0.10 × 0.4 × 1.09) / (0.11 − 0.09) = 2.18.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 81–82<\/summary><div class=\"vig-body\"><p>An analyst has gathered the following fundamental data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v024.webp\" style=\"max-width:min(100%,666px)\" alt=\"Firm B Firm A Firm B Firm A Low Margin High Margin High Margin Low Margin Strategy High Volume Low Volume High Volume Low Volume Payout Ratio 40% 40% 40% 40% 11% Required Rate of Return 11% 11% 11% Growth Rate in 9% 5% 5% 7% Dividends Sales/Book Value of 1.5 4.5 1.0 3 Equity Profit Margin 10% 2% 9% 4%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v025.webp\" style=\"max-width:min(100%,666px)\" alt=\"$125 $125 $150 $150 Book Value\"><\/div><\/details><div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>What is the price-to-sales (P/S) multiple for Firm A in the high-margin, low-volume strategy?<\/p><\/div>", "subj": "equity"}, {"n": 82, "q": "What is the P/S multiple for Firm B in the low-margin, high-volume strategy?", "opts": ["2.00.", "0.60.", "0.43."], "ans": "C", "expl": "The P/S multiple = [Profit Margin × Payout Ratio × (1 + g)] / (r − g) = (0.04 × 0.4 × 1.07) / (0.11 − 0.07) = 0.428 or 0.43.", "explhtml": "<p>The P/S multiple = [Profit Margin × Payout Ratio × (1 + g)] / (r − g) = (0.04 × 0.4 × 1.07) / (0.11 − 0.07) = 0.428 or 0.43.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 81–82<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>An analyst has gathered the following fundamental data:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v024.webp\" style=\"max-width:min(100%,666px)\" alt=\"Firm B Firm A Firm B Firm A Low Margin High Margin High Margin Low Margin Strategy High Volume Low Volume High Volume Low Volume Payout Ratio 40% 40% 40% 40% 11% Required Rate of Return 11% 11% 11% Growth Rate in 9% 5% 5% 7% Dividends Sales/Book Value of 1.5 4.5 1.0 3 Equity Profit Margin 10% 2% 9% 4%\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v025.webp\" style=\"max-width:min(100%,666px)\" alt=\"$125 $125 $150 $150 Book Value\"><\/div><\/details><div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>What is the P/S multiple for Firm B in the low-margin, high-volume strategy?<\/p><\/div>", "subj": "equity"}, {"n": 83, "q": "An analyst is valuing a company with a dividend payout ratio of 0.35, a beta of 1.45, and an expected earnings growth rate of 0.08. A regression on comparable companies produces the following equation: Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta) What is the predicted P/E using the above regression?", "opts": ["7.65.", "11.21.", "9.18."], "ans": "C", "expl": "Predicted P/E = 7.65 + (3.75 × 0.35) + (15.35 × 0.08) − (0.70 × 1.45) = 9.1755", "explhtml": "<p>Predicted P/E = 7.65 + (3.75 × 0.35) + (15.35 × 0.08) − (0.70 × 1.45) = 9.1755<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.h<\/div><div class=\"qtext\"><p>An analyst is valuing a company with a dividend payout ratio of 0.35, a beta of 1.45, and an expected earnings growth rate of 0.08. A regression on comparable companies produces the following equation:<\/p><p>Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta)<\/p><p>What is the predicted P/E using the above regression?<\/p><\/div>", "subj": "equity"}, {"n": 84, "q": "Bill Whelan and Chad Delft are arguing about the relative merits of valuation metrics. Whelan: \"My ratio is less volatile than most, and it works particularly well when I look at stocks in cyclical industries.\" Delft: \"The problem with your ratio is that it doesn't reflect differences in the cost structures of companies in different industries. I like to use a metric that strips out all the fluff that distorts true company performance.\" Whelan: \"People can't even agree how to calculate your ratio.\" Which valuation metric do the analysts most likely prefer? Whelan  Delft", "opts": ["Price/sales Price/cash flow", "Price/book EV/EBITDA", "Price/cash flow Price/book"], "ans": "A", "expl": "The price/sales ratio is not very volatile, and it is of particular value when dealing with cyclical companies. The price/cash flow ratio considers the stock price relative to cash flows, ignoring the noncash gains and losses that can skew earnings. A major weakness of the price/cash flow ratio is the fact that there are different ways of calculating it, making comparisons difficult at times.", "explhtml": "<p>The price/sales ratio is not very volatile, and it is of particular value when dealing with cyclical companies. The price/cash flow ratio considers the stock price relative to cash flows, ignoring the noncash gains and losses that can skew earnings. A major weakness of the price/cash flow ratio is the fact that there are different ways of calculating it, making comparisons difficult at times.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.c<\/div><div class=\"qtext\"><p>Bill Whelan and Chad Delft are arguing about the relative merits of valuation metrics.<\/p><p>Whelan: &quot;My ratio is less volatile than most, and it works particularly well when I look at stocks in cyclical industries.&quot;<\/p><p>Delft: &quot;The problem with your ratio is that it doesn&#x27;t reflect differences in the cost structures of companies in different industries. I like to use a metric that strips out all the fluff that distorts true company performance.&quot;<\/p><p>Whelan: &quot;People can&#x27;t even agree how to calculate your ratio.&quot;<\/p><p>Which valuation metric do the analysts most likely prefer? Whelan &nbsp; Delft<\/p><\/div>", "subj": "equity"}, {"n": 85, "q": "A common pitfall in interpreting earnings yields in valuation is:", "opts": ["look-ahead bias.", "using negative earnings.", "using underlying earnings."], "ans": "A", "expl": "A common pitfall is look-ahead bias, wherein the analyst uses information that was not available to the investor when calculating the earnings yield.", "explhtml": "<p>A common pitfall is look-ahead bias, wherein the analyst uses information that was not available to the investor when calculating the earnings yield.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.f<\/div><div class=\"qtext\"><p>A common pitfall in interpreting earnings yields in valuation is:<\/p><\/div>", "subj": "equity"}, {"n": 86, "q": "An analyst focusing mostly on financial stocks is likely to prefer valuing stocks via the:", "opts": ["price/sales ratio.", "dividend yield.", "price/book ratio."], "ans": "C", "expl": "The price/book ratio is a preferred tool for valuing financial stocks.", "explhtml": "<p>The price/book ratio is a preferred tool for valuing financial stocks.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.c<\/div><div class=\"qtext\"><p>An analyst focusing mostly on financial stocks is likely to prefer valuing stocks via the:<\/p><\/div>", "subj": "equity"}, {"n": 87, "q": "If cash flow from operations (CFO) embeds financing-related flows, it should be adjusted by:", "opts": ["subtracting capital expenditures.", "adding (net interest outflow) × (1 - tax rate).", "subtracting (net interest outflow) × (1 - tax rate)."], "ans": "B", "expl": "Cash flow from operations CFO should be adjusted to CFO + (net cash interest outflow) × (1 – tax rate), if CFO embeds financing-related flows.", "explhtml": "<p>Cash flow from operations CFO should be adjusted to CFO + (net cash interest outflow) × (1 – tax rate), if CFO embeds financing-related flows.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.n<\/div><div class=\"qtext\"><p>If cash flow from operations (CFO) embeds financing-related flows, it should be adjusted by:<\/p><\/div>", "subj": "equity"}, {"n": 88, "q": "P/E multiples are often computed using the average of the multiples of comparable firms, because:", "opts": ["it is conceptually very straightforward.", "it provides the most accurate results.", "it is very easy to find comparable firms that have the same business mix and risk and growth profiles."], "ans": "A", "expl": "The use of comparable firms is quite common, because it is conceptually very straightforward. Also, it does not require the analyst to make specific assumptions regarding growth, risk, and other variables. However, it is often difficult to find comparable firms, since even within the same industry different firms can have different business mixes and risk and growth profiles.", "explhtml": "<p>The use of comparable firms is quite common, because it is conceptually very straightforward. Also, it does not require the analyst to make specific assumptions regarding growth, risk, and other variables. However, it is often difficult to find comparable firms, since even within the same industry different firms can have different business mixes and risk and growth profiles.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>P/E multiples are often computed using the average of the multiples of comparable firms, because:<\/p><\/div>", "subj": "equity"}, {"n": 89, "q": "Which of the following factors is a source of differences in cross-border valuation comparisons?", "opts": ["Accounting methods.", "Comparative advantage.", "Intra-country market indicators."], "ans": "A", "expl": "Different accounting conventions make cross-border comparisons for valuation purposes challenging.", "explhtml": "<p>Different accounting conventions make cross-border comparisons for valuation purposes challenging.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.p<\/div><div class=\"qtext\"><p>Which of the following factors is a source of differences in cross-border valuation comparisons?<\/p><\/div>", "subj": "equity"}, {"n": 90, "q": "Which of the following statements regarding the P/E to growth (PEG) valuation approach is least accurate? The P/E to growth (PEG) valuation approach assumes that:", "opts": ["stocks with higher PEGs are more attractive than stocks with lower PEGs.", "there is a linear relationship between price to earnings (P/E) and growth.", "there are no risk differences among stocks."], "ans": "A", "expl": "The PEG valuation approach implicitly assumes there is a linear relationship between price to earnings (P/E) and growth, even though there is not a \"real world\" linear relationship. The analyst must be cautious when using the PEG ratio for valuation or comparison purposes especially if the growth rate is very small or very large. If earnings or the growth rate is negative the PEG ratio is meaningless. The PEG ratio does not adjust for varying levels of risk among stocks and views stocks with lower PEG ratios to be more attractive than stocks with higher PEG ratios.", "explhtml": "<p>The PEG valuation approach implicitly assumes there is a linear relationship between price to earnings (P/E) and growth, even though there is not a &quot;real world&quot; linear relationship. The analyst must be cautious when using the PEG ratio for valuation or comparison purposes especially if the growth rate is very small or very large. If earnings or the growth rate is negative the PEG ratio is meaningless. The PEG ratio does not adjust for varying levels of risk among stocks and views stocks with lower PEG ratios to be more attractive than stocks with higher PEG ratios.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>Which of the following statements regarding the P/E to growth (PEG) valuation approach is least accurate? The P/E to growth (PEG) valuation approach assumes that:<\/p><\/div>", "subj": "equity"}, {"n": 91, "q": "Enhanced Systems, Inc., (ESI) has a price to book value (P/B) of four while the median P/B of the stock market overall is three, and the median P/B of companies within the industry is six. Based on the method of comparables, an analyst would most likely conclude that ESI:", "opts": ["should be purchased because it is an undervalued stock.", "is of indeterminate relative value, due to conflicting metrics.", "should be sold because it is an overvalued stock."], "ans": "A", "expl": "The price per dollar of book value of ESI is considerably lower than that for the median of the peer group, which implies that it may well be undervalued. For the method of comparables, we most appropriately select as comparison assets companies operating in the same industry as the subject company.", "explhtml": "<p>The price per dollar of book value of ESI is considerably lower than that for the median of the peer group, which implies that it may well be undervalued. For the method of comparables, we most appropriately select as comparison assets companies operating in the same industry as the subject company.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Enhanced Systems, Inc., (ESI) has a price to book value (P/B) of four while the median P/B of the stock market overall is three, and the median P/B of companies within the industry is six. Based on the method of comparables, an analyst would most likely conclude that ESI:<\/p><\/div>", "subj": "equity"}, {"n": 92, "q": "Consider the statement: \"Unlike many valuation metrics that incorporate dividend discounting, the PEG ratio may be used to value firms with zero expected dividend growth prospects.\" Is this statement correct?", "opts": ["Yes, because the expected dividend growth rate is cancelled out in the computation of the PEG ratio.", "No, because the PEG ratio is undefined for zero-growth companies.", "Yes, because the computation of the PEG ratio does not use the rate of expected dividend growth."], "ans": "B", "expl": "The PEG ratio measures the tradeoff between P/E and expected earnings growth (g). The formula for the PEG ratio is: PEG = (P/E) / g. Firms with zero expected earnings growth will have an infinite (or undefined) PEG ratio due to division by zero.", "explhtml": "<p>The PEG ratio measures the tradeoff between P/E and expected earnings growth (g). The formula for the PEG ratio is: PEG = (P/E) / g. Firms with zero expected earnings growth will have an infinite (or undefined) PEG ratio due to division by zero.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>Consider the statement: &quot;Unlike many valuation metrics that incorporate dividend discounting, the PEG ratio may be used to value firms with zero expected dividend growth prospects.&quot; Is this statement correct?<\/p><\/div>", "subj": "equity"}, {"n": 93, "q": "Which of the following is a disadvantage of using the price-to-book value (PBV) ratio?", "opts": ["Book values are affected by accounting standards, which may vary across firms and countries.", "Firms with negative earnings cannot be evaluated with the PBV ratios.", "Book value may not mean much for manufacturing firms with significant fixed costs."], "ans": "A", "expl": "The disadvantages of using PBV ratios are: 1. Book values are affected by accounting standards, which may vary across firms and countries. 2. Book value may not mean much for service firms without significant fixed costs. 3. Book value of equity can be made negative by a series of negative earnings, which limits the usefulness of the variable.", "explhtml": "<p>The disadvantages of using PBV ratios are:<\/p><p>1. Book values are affected by accounting standards, which may vary across firms and countries. 2. Book value may not mean much for service firms without significant fixed costs. 3. Book value of equity can be made negative by a series of negative earnings, which limits the usefulness of the variable.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.c<\/div><div class=\"qtext\"><p>Which of the following is a disadvantage of using the price-to-book value (PBV) ratio?<\/p><\/div>", "subj": "equity"}, {"n": 94, "q": "Which of the following is NOT a common momentum valuation indicator?", "opts": ["Earnings surprise.", "Dividend yield.", "Relative strength."], "ans": "B", "expl": "Dividend yield is not generally considered a momentum valuation indicator.", "explhtml": "<p>Dividend yield is not generally considered a momentum valuation indicator.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.q<\/div><div class=\"qtext\"><p>Which of the following is NOT a common momentum valuation indicator?<\/p><\/div>", "subj": "equity"}, {"n": 95, "q": "An analyst begins an equity analysis of Company A by estimating future cash flows, discounting them back to the present, and dividing the result by the outstanding number of shares. This analyst is most likely using the:", "opts": ["the method of forecasted fundamentals.", "the method of comparables.", "technical analysis."], "ans": "A", "expl": "This analysis is comparing forecasted discounted cash flows (DCF) to a fundamental variable (shares). This suggests the method for forecasted fundamentals.", "explhtml": "<p>This analysis is comparing forecasted discounted cash flows (DCF) to a fundamental variable (shares). This suggests the method for forecasted fundamentals.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>An analyst begins an equity analysis of Company A by estimating future cash flows, discounting them back to the present, and dividing the result by the outstanding number of shares. This analyst is most likely using the:<\/p><\/div>", "subj": "equity"}, {"n": 96, "q": "A firm's return on equity (ROE) is 15%, its required rate of return is 12%, and its expected growth rate is 7%. What is the firm's justified price to book value (P/B) based on these fundamentals?", "opts": ["1.71.", "1.60.", "0.63."], "ans": "B", "expl": "P₀/B₀ = (ROE – g) / (r – g) = (0.15 – 0.07) / (0.12 – 0.07) = 1.60", "explhtml": "<p>P<sub>0<\/sub>/B<sub>0<\/sub> = (ROE – g) / (r – g) = (0.15 – 0.07) / (0.12 – 0.07) = 1.60<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>A firm&#x27;s return on equity (ROE) is 15%, its required rate of return is 12%, and its expected growth rate is 7%. What is the firm&#x27;s justified price to book value (P/B) based on these fundamentals?<\/p><\/div>", "subj": "equity"}, {"n": 97, "q": "Two security analysts, Ramon Long and Sri Beujeau, disagree about certain aspects of the PEG ratio. Long argues that: \"unlike typical valuation metrics that incorporate dividend discounting, the PEG ratio is unique because it generates meaningful results for firms with negative expected earnings-growth.\" Is Long correct?", "opts": ["Yes, because the computation of the PEG ratio does not use the rate of expected earnings growth.", "No, because the PEG ratio generates meaningless results for negative earningsgrowth companies.", "Yes, because the expected earnings-growth rate is cancelled out in the computation of the PEG ratio."], "ans": "B", "expl": "The PEG ratio is: PEG = (P/E) / earnings growth. As such, firms with negative expected earnings growth will have a negative PEG ratio, which is meaningless.", "explhtml": "<p>The PEG ratio is: PEG = (P/E) / earnings growth. As such, firms with negative expected earnings growth will have a negative PEG ratio, which is meaningless.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>Two security analysts, Ramon Long and Sri Beujeau, disagree about certain aspects of the PEG ratio. Long argues that: &quot;unlike typical valuation metrics that incorporate dividend discounting, the PEG ratio is unique because it generates meaningful results for firms with negative expected earnings-growth.&quot; Is Long correct?<\/p><\/div>", "subj": "equity"}, {"n": 98, "q": "A method commonly used to normalize earnings is the method of:", "opts": ["historical average earnings per share (EPS).", "comparables.", "average return on assets."], "ans": "A", "expl": "A common method in normalizing earnings uses the historical average EPS.", "explhtml": "<p>A common method in normalizing earnings uses the historical average EPS.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>A method commonly used to normalize earnings is the method of:<\/p><\/div>", "subj": "equity"}, {"n": 99, "q": "Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 28 while the median leading P/E of a peer group of companies within the industry is 28. Based on the method of comparables, an analyst would most likely conclude that PTI should be:", "opts": ["sold or sold short as an overvalued stock.", "viewed as a properly valued stock.", "bought as an undervalued stock."], "ans": "B", "expl": "The price per dollar of earnings is the same as that for the median of the peer group, which implies that it is likely properly valued.", "explhtml": "<p>The price per dollar of earnings is the same as that for the median of the peer group, which implies that it is likely properly valued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 28 while the median leading P/E of a peer group of companies within the industry is 28. Based on the method of comparables, an analyst would most likely conclude that PTI should be:<\/p><\/div>", "subj": "equity"}, {"n": 100, "q": "An analyst has gathered the following data about the Garber Company: Payout Ratio = 60%. Expected Return on Equity = 16.75%. Required rate of return = 12.5%. What will be the appropriate price-to-book value (PBV) ratio for the Garber Company based on return differential?", "opts": ["0.58.", "1.38.", "1.73."], "ans": "C", "expl": "The estimated growth rate is 6.7% [0.1675 × (1 − 0.60)] and PBV ratio based on rate differential will be: P₀ / BV₀ = (ROE₁ − g) / (r − g) = (0.1675 − 0.067) / (0.125 − 0.067) = 1.73.", "explhtml": "<p>The estimated growth rate is 6.7% [0.1675 × (1 − 0.60)] and PBV ratio based on rate differential will be:<\/p><p>P<sub>0<\/sub> / BV<sub>0<\/sub> = (ROE<sub>1<\/sub> − g) / (r − g) = (0.1675 − 0.067) / (0.125 − 0.067) = 1.73.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>An analyst has gathered the following data about the Garber Company:<\/p><p>Payout Ratio = 60%. Expected Return on Equity = 16.75%. Required rate of return = 12.5%.<\/p><p>What will be the appropriate price-to-book value (PBV) ratio for the Garber Company based on return differential?<\/p><\/div>", "subj": "equity"}, {"n": 101, "q": "Which of the following factors is NOT a source of differences in cross-border valuation comparisons?", "opts": ["Intra-country market indicators.", "Growth opportunities.", "Cultures."], "ans": "A", "expl": "Intra-country market indicators are not, by definition, cross-border.", "explhtml": "<p>Intra-country market indicators are not, by definition, cross-border.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.p<\/div><div class=\"qtext\"><p>Which of the following factors is NOT a source of differences in cross-border valuation comparisons?<\/p><\/div>", "subj": "equity"}, {"n": 102, "q": "Herb McClain tells Cammy Oren that Kline Industries' expected dividend growth rate is 4.0%, ROE is 14%, and required return on equity (r) is 10%. Based on a justified P/B ratio compared to a P/B ratio (based on market price per share) of 1.55, Kline Industries is most likely:", "opts": ["overvalued.", "undervalued.", "correctly valued."], "ans": "B", "expl": "Justified P/B = (ROE − g) / (r − g). When the expected dividend growth is 4.0%, the justified P/B = (0.14 − 0.04) / (0.10 − 0.04) = 1.67. This is greater than the P/B (at market) of 1.55.", "explhtml": "<p>Justified P/B = (ROE − g) / (r − g). When the expected dividend growth is 4.0%, the justified P/B = (0.14 − 0.04) / (0.10 − 0.04) = 1.67. This is greater than the P/B (at market) of 1.55.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.l<\/div><div class=\"qtext\"><p>Herb McClain tells Cammy Oren that Kline Industries&#x27; expected dividend growth rate is 4.0%, ROE is 14%, and required return on equity (r) is 10%. Based on a justified P/B ratio compared to a P/B ratio (based on market price per share) of 1.55, Kline Industries is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 103, "q": "An increase in return on equity (ROE) will cause a price-to-book (P/B) multiple to:", "opts": ["there is insufficient information to tell.", "decrease.", "increase."], "ans": "C", "expl": "An increase in ROE should increase the price to book (P/B) ratio: P₀ / B₀ = (ROE – g) / (r – g)", "explhtml": "<p>An increase in ROE should increase the price to book (P/B) ratio:<\/p><p>P<sub>0<\/sub> / B<sub>0<\/sub> = (ROE – g) / (r – g)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in return on equity (ROE) will cause a price-to-book (P/B) multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 104, "q": "An analyst is preparing a presentation on \"Interpreting PE ratios\" and has the following data:  Portfolio % Stock PE Stock AAA 60% 10 Stock BBB 40% 15 Which of the following is the most appropriate measure for calculating the portfolio P/E?", "opts": ["Geometric mean of the P/E’s.", "Arithmetic average of the P/E’s.", "Weighted harmonic mean of the P/E’s."], "ans": "C", "expl": "The weighted harmonic mean of the 10 and 15 will give the result closest to the portfolio earnings divided by the portfolio value.", "explhtml": "<p>The weighted harmonic mean of the 10 and 15 will give the result closest to the portfolio earnings divided by the portfolio value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.r<\/div><div class=\"qtext\"><p>An analyst is preparing a presentation on &quot;Interpreting PE ratios&quot; and has the following data:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Portfolio %<\/td><td>Stock PE<\/td><\/tr><tr><td>Stock AAA<\/td><td>60%<\/td><td>10<\/td><\/tr><tr><td>Stock BBB<\/td><td>40%<\/td><td>15<\/td><\/tr><\/table><\/div><p>Which of the following is the most appropriate measure for calculating the portfolio P/E?<\/p><\/div>", "subj": "equity"}, {"n": 105, "q": "Using the P/E ratio with normalized earnings, Yantra appears to be more attractively valued under:", "opts": ["Method 1.", "Method 2.", "Neither method as they result in the same conclusion."], "ans": "B", "expl": "Method 1: Calculate average EPS over the stated period. (1.57 + 2.16 + 3.24 + 1.89) / 4 = £2.22. Based on a price of £44.56, the P/E multiple is 44.56 / 2.22 = 20.12 Method 2: First, calculate average ROE over the period (14.9% + 18.2% + 22.8% + 12%) / 4 = 17%. To get the normalized earnings multiply the average ROE by the most recent book value of £15.69 – 17% × 15.69 = £2.66. Thus, the resulting P/E multiple for Method 2 is 44.56 / 2.66 = 16.73. Comparing the two multiples, Method 2 results in higher normalized earnings and, therefore, lower P/E ratio and hence a lower (more attractive) valuation.", "explhtml": "<p>Method 1:<\/p><p>Calculate average EPS over the stated period. (1.57 + 2.16 + 3.24 + 1.89) / 4 = £2.22.<\/p><p>Based on a price of £44.56, the P/E multiple is 44.56 / 2.22 = 20.12<\/p><p>Method 2:<\/p><p>First, calculate average ROE over the period<\/p><p>(14.9% + 18.2% + 22.8% + 12%) / 4 = 17%.<\/p><p>To get the normalized earnings multiply the average ROE by the most recent book value of £15.69 – 17% × 15.69 = £2.66. Thus, the resulting P/E multiple for Method 2 is 44.56 / 2.66 = 16.73.<\/p><p>Comparing the two multiples, Method 2 results in higher normalized earnings and, therefore, lower P/E ratio and hence a lower (more attractive) valuation.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 105–110<\/summary><div class=\"vig-body\"><p>Beyan Bautista, CFA, is a sell-side research analyst for a boutique UK investment house. One of the companies she is currently covering is Yantra Plc, a manufacturer of mid-range motorboats, primarily for river use. The company's shares closed at £44.56 on 15 January 20x4. Beyan uses the Treasury bond yield of 2.5% and an assumed market risk premium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda:
