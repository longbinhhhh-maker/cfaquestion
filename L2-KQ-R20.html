expenditure and the firms levels of working capital is relatively constant.\"><\/div><\/details><div class=\"pp-topic\">Module 12.5, LOS 12.d<\/div><div class=\"qtext\"><p>Using the cash flow statement approach calculate the aggregate accruals ratio:<\/p><\/div>", "subj": "equity"}, {"n": 9, "q": "Regarding the Cery's comments on enterprise value multiples which are most likely correct: Comment 1  Comment 2", "opts": ["Correct Correct", "Correct Incorrect", "Incorrect Incorrect"], "ans": "A", "expl": "Since FCFF captures the amount of capital expenditures, it is more strongly linked with valuation theory than EBITDA. EBITDA will be an adequate measure if capital expenses equal depreciation expenses and working capital remains relatively constant.", "explhtml": "<p>Since FCFF captures the amount of capital expenditures, it is more strongly linked with valuation theory than EBITDA. EBITDA will be an adequate measure if capital expenses equal depreciation expenses and working capital remains relatively constant.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 6–9<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Victoria Banks is a senior analyst working for a large firm of portfolio managers. Her manager, David Alan, has asked her to report on a company called Retro Inc. as he believes it might offer a potentially good investment. The accounts for Retro Inc. are given below.<\/p><p>Retro prepares its accounts using U.S. GAAP.<\/p><p>Exhibit 1: Retro Inc. Balance Sheet as at 31 December<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v001.webp\" style=\"max-width:min(100%,336px)\" alt=\"20x9 20x8 $m $m\"><p>Assets<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v002.webp\" style=\"max-width:min(100%,324px)\" alt=\"Cash 150 100 1,700 1,620 Accounts receivable 1,810 1,800 Inventory Total current assets 3,660 3,520\"><p>Property, plant, and equipment 1,430 1,000<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v003.webp\" style=\"max-width:min(100%,324px)\" alt=\"Intangibles 100 150 5,190 4,670 Total assets\"><p>Liabilities and Capital<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v004.webp\" style=\"max-width:min(100%,324px)\" alt=\"Notes payable to banks 200 220 Accounts payable 1,330 1,200 Interest payable 130 100 Total current liabilities 1,660 1,520 770 Long-term debt 680 820 Deferred tax 790\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v005.webp\" style=\"max-width:min(100%,570px)\" alt=\"Common stock 1,300 1,300 Retained earnings 640 380 5,190 4,670 Total liabilities and capital Exhibit 2: Retro Inc. Income Statement for the Year Ended 31 December 20x9 $m Sales 3,000 Cost of goods sold (1,800) Grass profit 1,200 Depreciation (150) Amortization (50) SG&amp;A (280) Gain on disposal 30 Restructuring charge reversal 20 Interest expense (190) Income tax expense (223)\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v006.webp\" style=\"max-width:min(100%,643px)\" alt=\"357 Net income\"><p>Retro disposed of PPE in the year that had a cost of $150m and accumulated depreciation at the time of disposal of $90m. No intangibles were disposed of during the year. Deferred tax liabilities are not expected to reverse for the foreseeable future.<\/p><p>Banks is also concerned that the net income looks relatively high when compared to previous years and therefore wants to measure the quality of earnings. She has heard that the lower the accruals ratio the higher the quality of earnings.<\/p><p>Banks calculates that Retro Inc. has a leading P/E ratio of 4.29 and a five-year consensus growth rate forecast at 14,85%. The median PEG, based on leading P/E, for a group of companies comparable in risk to Retro Inc. is 0.82. Based on this Banks wants to determine whether the stock is correctly priced. One of Banks's colleagues, Jennifer Cery, comments that P/E multiples are not always that useful and that sometimes enterprise value multiples are better. She makes the following comments:<\/p><p>Comment 1: Enterprise value multiples are useful when comparing firms with different<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v007.webp\" style=\"max-width:min(100%,610px)\" alt=\"degrees of financial leverage and when EPS is negative.\"><p>Comment 2: As EBITDA can be used as a proxy for free cash flow to the firm providing<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v008.webp\" style=\"max-width:min(100%,613px)\" alt=\"depreciation is close to capital expenditure and the firms levels of working capital is relatively constant.\"><\/div><\/details><div class=\"pp-topic\">Module 19.5, LOS 19.h<\/div><div class=\"qtext\"><p>Regarding the Cery&#x27;s comments on enterprise value multiples which are most likely correct: Comment 1 &nbsp; Comment 2<\/p><\/div>", "subj": "equity"}, {"n": 10, "q": "A firm is better valued using the discounted cash flow approach than the P/E multiples approach when:", "opts": ["expected growth rate is very high.", "earnings per share are negative.", "dividend payout is low."], "ans": "B", "expl": "P/E multiples are not meaningful when the earnings per share are negative. While this problem can be partially offset by using normalized or average earnings per share, the problem cannot be eliminated.", "explhtml": "<p>P/E multiples are not meaningful when the earnings per share are negative. While this problem can be partially offset by using normalized or average earnings per share, the problem cannot be eliminated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>A firm is better valued using the discounted cash flow approach than the P/E multiples approach when:<\/p><\/div>", "subj": "equity"}, {"n": 11, "q": "An increase in growth will cause a price-to-earnings (P/E) multiple to:", "opts": ["decrease.", "increase.", "there is insufficient information to tell."], "ans": "B", "expl": "An increase in growth will decrease the denominator and increase the numerator in the trailing P/E expression, both of which should increase the P/E ratio: P₀/E₀ = [(1 – b)(1 + g)] / (r – g) Note that the topic review does not allow for any interactive relationship between retention and growth. Thus, no explicit consideration is given to how the growth increase was generated.", "explhtml": "<p>An increase in growth will decrease the denominator and increase the numerator in the trailing P/E expression, both of which should increase the P/E ratio:<\/p><p>P<sub>0<\/sub>/E<sub>0<\/sub> = [(1 – b)(1 + g)] / (r – g)<\/p><p>Note that the topic review does not allow for any interactive relationship between retention and growth. Thus, no explicit consideration is given to how the growth increase was generated.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in growth will cause a price-to-earnings (P/E) multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 12, "q": "Which of the following statements about the method of forecasted fundamentals in price multiple valuation is most accurate?", "opts": ["It values an asset relative to a benchmark value of the multiple.", "It relies on the Law of One Price.", "It relates multiples to company fundamentals using a discounted cash flow (DCF) model."], "ans": "C", "expl": "The method of forecasted fundamentals relates multiples to company fundamentals using a DCF method. It does not explicitly rely on the Law of One Price. Further, it does not typically focus on benchmarks.", "explhtml": "<p>The method of forecasted fundamentals relates multiples to company fundamentals using a DCF method. It does not explicitly rely on the Law of One Price. Further, it does not typically focus on benchmarks.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>Which of the following statements about the method of forecasted fundamentals in price multiple valuation is most accurate?<\/p><\/div>", "subj": "equity"}, {"n": 13, "q": "Barnes is contemplating the use of a price/earnings ratio to value a start-up medical technology firm. Which of the following is the most compelling reason not to use the P/E ratio?", "opts": ["P/E ratios for medical-technology firms with different specialties are not comparable.", "The company is likely to be unprofitable.", "Earnings per share are not a good determinant of investment value for medicaltechnology companies."], "ans": "B", "expl": "Earnings are the chief determinant of value for most companies, including med-tech. P/E is the most common valuation method and the best known by lay investors. Comparability of P/E ratios across industries is always problematic, but not as much so for within the med-tech industry. A start-up company is very likely to have negative earnings, which renders the P/E ratio useless.", "explhtml": "<p>Earnings are the chief determinant of value for most companies, including med-tech. P/E is the most common valuation method and the best known by lay investors. Comparability of P/E ratios across industries is always problematic, but not as much so for within the med-tech industry. A start-up company is very likely to have negative earnings, which renders the P/E ratio useless.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<\/summary><div class=\"vig-body\"><p>Analysts and portfolio managers at Big Picture Investments are having their weekly investment meeting. CEO Bob Powell, CFA, believes the firm's portfolios are too heavily weighted toward growth stocks. \"I expect value to make a comeback over the next 12 months. We need to get more value stocks in the Big Picture portfolios.\" Four of Powell's analysts, all of whom hold the CFA charter, were at the meeting - Laura Barnes, Chester Lincoln, Zelda Marks, and Thaddeus Bosley. Powell suggested Big Picture should start selecting stocks with the lowest price-to- earnings (P/E) multiples. Here are the analysts' comments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v009.webp\" style=\"max-width:min(100%,593px)\" alt=\"• Barnes said numerous academic studies have shown that low P/E stocks tend to outperform those with high P/Es, She uses the P/E ratio as the basis of most of her valuation analysis.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v010.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Lincoln warned against using P/E ratios to evaluate technology stocks. He suggests using price-to-book (P/B) ratios instead, because they are useful for explaining long-term stock returns. • Bosley prefers the price/sales (P/S) ratio and the earnings yield. • Marks acknowledges that the P/E ratio is a useful valuation measurement. However, she prefers using the price/free-cash-flow ratio.\"><p>Powell has provided Barnes with a group of small-cap stocks to analyze. The stocks come from a variety of different sectors and have widely different financial structures and growth profiles. She has been asked to determine which of these stocks represent attractive values. She is considering four possible methods for the job:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v011.webp\" style=\"max-width:min(100%,635px)\" alt=\"• The PEG ratio, because it corrects for risk if the stocks have similar expected returns. • Comparing P/E ratios to the average stock in the Russell 2000 Index, because the benchmark should serve as a good proxy for the average small-cap stock valuation. • Comparing P/E ratios to the median stock in the Russell 2000 Index, because outliers can skew the average P/E upward. • The P/S ratio, because it works well for companies in different stages of the business cycle.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Barnes is contemplating the use of a price/earnings ratio to value a start-up medical technology firm. Which of the following is the most compelling reason not to use the P/E ratio?<\/p><\/div>", "subj": "equity"}, {"n": 14, "q": "Based on their responses to Powell, which of the analysts is most likely concerned about earnings volatility?", "opts": ["Lincoln.", "Barnes.", "Bosley."], "ans": "A", "expl": "Book value tends to be more stable than earnings. Therefore, Lincoln's favorite valuation tool, the P/B ratio, is less volatile than the P/E. The P/S ratio tends to be less volatile than the P/E as well, but Bosley's other favorite, earnings yield, is just as volatile. The method preferred by Barnes is likely to be more volatile than the P/B ratio.", "explhtml": "<p>Book value tends to be more stable than earnings. Therefore, Lincoln&#x27;s favorite valuation tool, the P/B ratio, is less volatile than the P/E. The P/S ratio tends to be less volatile than the P/E as well, but Bosley&#x27;s other favorite, earnings yield, is just as volatile. The method preferred by Barnes is likely to be more volatile than the P/B ratio.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Analysts and portfolio managers at Big Picture Investments are having their weekly investment meeting. CEO Bob Powell, CFA, believes the firm's portfolios are too heavily weighted toward growth stocks. \"I expect value to make a comeback over the next 12 months. We need to get more value stocks in the Big Picture portfolios.\" Four of Powell's analysts, all of whom hold the CFA charter, were at the meeting - Laura Barnes, Chester Lincoln, Zelda Marks, and Thaddeus Bosley. Powell suggested Big Picture should start selecting stocks with the lowest price-to- earnings (P/E) multiples. Here are the analysts' comments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v009.webp\" style=\"max-width:min(100%,593px)\" alt=\"• Barnes said numerous academic studies have shown that low P/E stocks tend to outperform those with high P/Es, She uses the P/E ratio as the basis of most of her valuation analysis.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v010.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Lincoln warned against using P/E ratios to evaluate technology stocks. He suggests using price-to-book (P/B) ratios instead, because they are useful for explaining long-term stock returns. • Bosley prefers the price/sales (P/S) ratio and the earnings yield. • Marks acknowledges that the P/E ratio is a useful valuation measurement. However, she prefers using the price/free-cash-flow ratio.\"><p>Powell has provided Barnes with a group of small-cap stocks to analyze. The stocks come from a variety of different sectors and have widely different financial structures and growth profiles. She has been asked to determine which of these stocks represent attractive values. She is considering four possible methods for the job:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v011.webp\" style=\"max-width:min(100%,635px)\" alt=\"• The PEG ratio, because it corrects for risk if the stocks have similar expected returns. • Comparing P/E ratios to the average stock in the Russell 2000 Index, because the benchmark should serve as a good proxy for the average small-cap stock valuation. • Comparing P/E ratios to the median stock in the Russell 2000 Index, because outliers can skew the average P/E upward. • The P/S ratio, because it works well for companies in different stages of the business cycle.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Based on their responses to Powell, which of the analysts is most likely concerned about earnings volatility?<\/p><\/div>", "subj": "equity"}, {"n": 15, "q": "Barnes would be least likely to use EV/EBITDA ratio, rather than the P/E ratio, when analyzing a company that:", "opts": ["pays a dividend, and is likely to deliver little earnings growth.", "reports a lot of depreciation expense.", "has a different capital structure than most of its peers."], "ans": "A", "expl": "For companies that report a lot of depreciation expense or must be compared to companies with different levels of financial leverage, the EV/EBITDA ratio may be more useful than the P/E. For companies that pay a dividend and have little profit growth, both should work fine. Given Barnes' stated preference for the P/E ratio, she is least likely to use the EV/EBITDA ratio with the dividend-paying firm.", "explhtml": "<p>For companies that report a lot of depreciation expense or must be compared to companies with different levels of financial leverage, the EV/EBITDA ratio may be more useful than the P/E. For companies that pay a dividend and have little profit growth, both should work fine. Given Barnes&#x27; stated preference for the P/E ratio, she is least likely to use the EV/EBITDA ratio with the dividend-paying firm.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Analysts and portfolio managers at Big Picture Investments are having their weekly investment meeting. CEO Bob Powell, CFA, believes the firm's portfolios are too heavily weighted toward growth stocks. \"I expect value to make a comeback over the next 12 months. We need to get more value stocks in the Big Picture portfolios.\" Four of Powell's analysts, all of whom hold the CFA charter, were at the meeting - Laura Barnes, Chester Lincoln, Zelda Marks, and Thaddeus Bosley. Powell suggested Big Picture should start selecting stocks with the lowest price-to- earnings (P/E) multiples. Here are the analysts' comments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v009.webp\" style=\"max-width:min(100%,593px)\" alt=\"• Barnes said numerous academic studies have shown that low P/E stocks tend to outperform those with high P/Es, She uses the P/E ratio as the basis of most of her valuation analysis.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v010.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Lincoln warned against using P/E ratios to evaluate technology stocks. He suggests using price-to-book (P/B) ratios instead, because they are useful for explaining long-term stock returns. • Bosley prefers the price/sales (P/S) ratio and the earnings yield. • Marks acknowledges that the P/E ratio is a useful valuation measurement. However, she prefers using the price/free-cash-flow ratio.\"><p>Powell has provided Barnes with a group of small-cap stocks to analyze. The stocks come from a variety of different sectors and have widely different financial structures and growth profiles. She has been asked to determine which of these stocks represent attractive values. She is considering four possible methods for the job:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v011.webp\" style=\"max-width:min(100%,635px)\" alt=\"• The PEG ratio, because it corrects for risk if the stocks have similar expected returns. • Comparing P/E ratios to the average stock in the Russell 2000 Index, because the benchmark should serve as a good proxy for the average small-cap stock valuation. • Comparing P/E ratios to the median stock in the Russell 2000 Index, because outliers can skew the average P/E upward. • The P/S ratio, because it works well for companies in different stages of the business cycle.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Barnes would be least likely to use EV/EBITDA ratio, rather than the P/E ratio, when analyzing a company that:<\/p><\/div>", "subj": "equity"}, {"n": 16, "q": "Barnes is considering the four methods previously described to analyze the small-cap stocks provided to her by Powell. For which method does Barnes provide the weakest justification?", "opts": ["The price/sales ratio.", "The mean P/E of Russell 2000 companies.", "The PEG ratio."], "ans": "C", "expl": "No valuation method will work dependably across all types of stocks. The four Barnes proposed are probably as good as any. But the PEG ratio does not correct for risk – it works as a comparison tool only if the companies have similar expected risks and returns. The other justifications are reasonable.", "explhtml": "<p>No valuation method will work dependably across all types of stocks. The four Barnes proposed are probably as good as any. But the PEG ratio does not correct for risk – it works as a comparison tool only if the companies have similar expected risks and returns. The other justifications are reasonable.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 13–16<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Analysts and portfolio managers at Big Picture Investments are having their weekly investment meeting. CEO Bob Powell, CFA, believes the firm's portfolios are too heavily weighted toward growth stocks. \"I expect value to make a comeback over the next 12 months. We need to get more value stocks in the Big Picture portfolios.\" Four of Powell's analysts, all of whom hold the CFA charter, were at the meeting - Laura Barnes, Chester Lincoln, Zelda Marks, and Thaddeus Bosley. Powell suggested Big Picture should start selecting stocks with the lowest price-to- earnings (P/E) multiples. Here are the analysts' comments:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v009.webp\" style=\"max-width:min(100%,593px)\" alt=\"• Barnes said numerous academic studies have shown that low P/E stocks tend to outperform those with high P/Es, She uses the P/E ratio as the basis of most of her valuation analysis.\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v010.webp\" style=\"max-width:min(100%,634px)\" alt=\"• Lincoln warned against using P/E ratios to evaluate technology stocks. He suggests using price-to-book (P/B) ratios instead, because they are useful for explaining long-term stock returns. • Bosley prefers the price/sales (P/S) ratio and the earnings yield. • Marks acknowledges that the P/E ratio is a useful valuation measurement. However, she prefers using the price/free-cash-flow ratio.\"><p>Powell has provided Barnes with a group of small-cap stocks to analyze. The stocks come from a variety of different sectors and have widely different financial structures and growth profiles. She has been asked to determine which of these stocks represent attractive values. She is considering four possible methods for the job:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v011.webp\" style=\"max-width:min(100%,635px)\" alt=\"• The PEG ratio, because it corrects for risk if the stocks have similar expected returns. • Comparing P/E ratios to the average stock in the Russell 2000 Index, because the benchmark should serve as a good proxy for the average small-cap stock valuation. • Comparing P/E ratios to the median stock in the Russell 2000 Index, because outliers can skew the average P/E upward. • The P/S ratio, because it works well for companies in different stages of the business cycle.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Barnes is considering the four methods previously described to analyze the small-cap stocks provided to her by Powell. For which method does Barnes provide the weakest justification?<\/p><\/div>", "subj": "equity"}, {"n": 17, "q": "What is the justified leading price-to-earnings (P/E) multiple of a stock that has a retention ratio of 60% if the shareholders require a return of 16% on their investment and the expected growth rate in dividends is 6%?", "opts": ["4.24.", "6.36.", "4.00."], "ans": "C", "expl": "Justified Leading P/E = P₀/E₁ = 1 − b / r − g = Payout ratio / r − g = 0.40 / (0.16 − 0.06) = 4.00", "explhtml": "<p>Justified Leading P/E = P<sub>0<\/sub>/E<sub>1<\/sub> = 1 − b / r − g = Payout ratio / r − g = 0.40 / (0.16 − 0.06) = 4.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>What is the justified leading price-to-earnings (P/E) multiple of a stock that has a retention ratio of 60% if the shareholders require a return of 16% on their investment and the expected growth rate in dividends is 6%?<\/p><\/div>", "subj": "equity"}, {"n": 18, "q": "An analyst gathered the following data for TRK Construction [all amounts in Swiss francs (Sf)]: Recent share price Sf 25.00 Shares outstanding 40 million Market value of debt Sf 130 million Cash and marketable securities Sf 65 million Investments Sf 250 million Net income Sf 150 million Interest expense Sf 8 million Depreciation and amortization Sf 11 million Taxes Sf 52 million The EV/EBITDA multiple for TRK Construction is closest to:", "opts": ["2.47x.", "4.12x.", "3.69x."], "ans": "C", "expl": "EBITDA = (net income + interest + taxes + depreciation / amortization) EV = (market value of common stock + market value of debt – cash and investments) EBITDA = 150 + 8 + 11 + 52 = Sf 221 million EV = (25 × 40) + 130 – 65 – 250 = Sf 815 million EV / EBITDA = 3.69", "explhtml": "<p>EBITDA = (net income + interest + taxes + depreciation / amortization)<\/p><p>EV = (market value of common stock + market value of debt – cash and investments)<\/p><p>EBITDA = 150 + 8 + 11 + 52 = Sf 221 million<\/p><p>EV = (25 × 40) + 130 – 65 – 250 = Sf 815 million<\/p><p>EV / EBITDA = 3.69<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.o<\/div><div class=\"qtext\"><p>An analyst gathered the following data for TRK Construction [all amounts in Swiss francs (Sf)]:<\/p><div class=\"tbl\"><table><tr><td>Recent share price<\/td><td>Sf 25.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>40 million<\/td><\/tr><tr><td>Market value of debt<\/td><td>Sf 130 million<\/td><\/tr><tr><td>Cash and marketable securities<\/td><td>Sf 65 million<\/td><\/tr><tr><td>Investments<\/td><td>Sf 250 million<\/td><\/tr><tr><td>Net income<\/td><td>Sf 150 million<\/td><\/tr><tr><td>Interest expense<\/td><td>Sf 8 million<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>Sf 11 million<\/td><\/tr><tr><td>Taxes<\/td><td>Sf 52 million<\/td><\/tr><\/table><\/div><p>The EV/EBITDA multiple for TRK Construction is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 19, "q": "At a regional security analysts conference, Sandeep Singh made the following comment: \"A PEG ratio is a very useful valuation metric because it generates meaningful results for all equities, regardless of the rate of dividend growth.\" Is Singh correct?", "opts": ["Yes, because the expected dividend growth rate is cancelled out in the computation of the PEG ratio.", "Yes, because the computation of the PEG ratio does include the rate of expected dividend growth.", "No, because the PEG ratio generates highly questionable results for low-growth companies."], "ans": "C", "expl": "The PEG ratio measures the tradeoff between P/E and expected earnings growth (g). The formula for the PEG ratio is: PEG = (P/E) / g. PEG ratios generate questionable results for low-growth companies. Also, the PEG ratio is undefined for companies with zero expected growth (division by zero) or meaningless for companies with negative expected earnings growth.", "explhtml": "<p>The PEG ratio measures the tradeoff between P/E and expected earnings growth (g). The formula for the PEG ratio is: PEG = (P/E) / g. PEG ratios generate questionable results for low-growth companies. Also, the PEG ratio is undefined for companies with zero expected growth (division by zero) or meaningless for companies with negative expected earnings growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>At a regional security analysts conference, Sandeep Singh made the following comment: &quot;A PEG ratio is a very useful valuation metric because it generates meaningful results for all equities, regardless of the rate of dividend growth.&quot; Is Singh correct?<\/p><\/div>", "subj": "equity"}, {"n": 20, "q": "Alpha Software (AS) recently reported annual earnings per share (EPS) of $1.75, which included an extraordinary loss of $0.19 and an expense of $0.10 related to acquisition costs during the accounting period, neither of which are expected to recur. Given that the most recent share price is $65.00, what is a useful AS's trailing price to earnings (P/E) for valuation purposes?", "opts": ["44.52.", "31.86.", "37.14."], "ans": "B", "expl": "Using an underlying earnings concept, an analyst would add back the temporary charges against earnings: $1.75 + $0.19 + $0.10 = $2.04. The resulting trailing P/E = 65.00 / 2.04 = 31.86.", "explhtml": "<p>Using an underlying earnings concept, an analyst would add back the temporary charges against earnings: $1.75 + $0.19 + $0.10 = $2.04. The resulting trailing P/E = 65.00 / 2.04 = 31.86.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>Alpha Software (AS) recently reported annual earnings per share (EPS) of $1.75, which included an extraordinary loss of $0.19 and an expense of $0.10 related to acquisition costs during the accounting period, neither of which are expected to recur. Given that the most recent share price is $65.00, what is a useful AS&#x27;s trailing price to earnings (P/E) for valuation purposes?<\/p><\/div>", "subj": "equity"}, {"n": 21, "q": "The following data was available for Morris, Inc., for the year ending December 31, 2001: Sales per share = $150. Earnings per share = $1.75. Return on Equity (ROE) = 16%. Required rate of return = 12%. If the expected growth rate in dividends and earning is 4%, what will the appropriate price-to-sales (P/S) multiple be for Morris?", "opts": ["0.114.", "0.109.", "0.037."], "ans": "A", "expl": "Profit Margin = EPS / Sales per share = 1.75 / 150 = 0.01167 or 1.167%. Payout ratio = 1 − (g / ROE) = 1 − (0.04 / 0.16) = 0.75 or 75%. P₀ / S₀ = [profit margin × payout ratio × (1 + g)] / (r − g) = [0.01167 × 0.75 × 1.04] / (0.12 − 0.04) = 0.11375.", "explhtml": "<p>Profit Margin = EPS / Sales per share = 1.75 / 150 = 0.01167 or 1.167%.<\/p><p>Payout ratio = 1 − (g / ROE) = 1 − (0.04 / 0.16) = 0.75 or 75%.<\/p><p>P<sub>0<\/sub> / S<sub>0<\/sub> = [profit margin × payout ratio × (1 + g)] / (r − g) = [0.01167 × 0.75 × 1.04] / (0.12 − 0.04) = 0.11375.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.i<\/div><div class=\"qtext\"><p>The following data was available for Morris, Inc., for the year ending December 31, 2001:<\/p><p>Sales per share = $150. Earnings per share = $1.75. Return on Equity (ROE) = 16%. Required rate of return = 12%.<\/p><p>If the expected growth rate in dividends and earning is 4%, what will the appropriate price-to-sales (P/S) multiple be for Morris?<\/p><\/div>", "subj": "equity"}, {"n": 22, "q": "An analyst has gathered the following fundamental data:  Firm A Firm B Firm C Firm D Payout Ratio 75%    Required Rate of Return 12% 12% 12% 12% Return on Equity (ROE) 20% 15% 30% 14% Price/Book Value (PBV) Ratio  3.00 0.70 3.50 What is the PBV ratio for Firm A?", "opts": ["0.71.", "1.25.", "2.14."], "ans": "C", "expl": "The growth rate in dividends (g) = ROE(1 − payout ratio) = 0.20 × (1 − 0.75) = 0.05 or 5%. The PBV ratio = (ROE − g) / (r − g) = (0.20 − 0.05) / (0.12 − 0.05) = 2.14.", "explhtml": "<p>The growth rate in dividends (g) = ROE(1 − payout ratio) = 0.20 × (1 − 0.75) = 0.05 or 5%. The PBV ratio = (ROE − g) / (r − g) = (0.20 − 0.05) / (0.12 − 0.05) = 2.14.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>An analyst has gathered the following fundamental data:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Firm A<\/td><td>Firm B<\/td><td>Firm C<\/td><td>Firm D<\/td><\/tr><tr><td>Payout Ratio<\/td><td>75%<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>Required Rate of Return<\/td><td>12%<\/td><td>12%<\/td><td>12%<\/td><td>12%<\/td><\/tr><tr><td>Return on Equity (ROE)<\/td><td>20%<\/td><td>15%<\/td><td>30%<\/td><td>14%<\/td><\/tr><tr><td>Price/Book Value (PBV) Ratio<\/td><td><\/td><td>3.00<\/td><td>0.70<\/td><td>3.50<\/td><\/tr><\/table><\/div><p>What is the PBV ratio for Firm A?<\/p><\/div>", "subj": "equity"}, {"n": 23, "q": "The observation that negative price to earnings (P/E) ratios are meaningless and prices are never negative is used to justify which valuation approach?", "opts": ["Earnings yield.", "Dividend yield.", "Dividend discount model."], "ans": "A", "expl": "The observation is used to justify the earnings yield approach. Negative P/E ratios are meaningless. In such cases, it is common to use normalized earnings per share (EPS) and/or restate the ratio as the earnings yield or E/P because price is never negative. Price to earnings (P/E) ranking can then proceed as usual.", "explhtml": "<p>The observation is used to justify the earnings yield approach. Negative P/E ratios are meaningless. In such cases, it is common to use normalized earnings per share (EPS) and/or restate the ratio as the earnings yield or E/P because price is never negative. Price to earnings (P/E) ranking can then proceed as usual.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.f<\/div><div class=\"qtext\"><p>The observation that negative price to earnings (P/E) ratios are meaningless and prices are never negative is used to justify which valuation approach?<\/p><\/div>", "subj": "equity"}, {"n": 24, "q": "Which of the following price multiples is most severely damaged by international accounting differences?", "opts": ["Enterprise value to earnings before interest, taxes, depreciation, and amortization (EV/EBITDA).", "Price to cash flow from operations (P/CFO).", "Price to free cash flow to equity (P/FCFE)."], "ans": "A", "expl": "EV/EBITDA is the most seriously affect because it is most closely tied to accounting conventions.", "explhtml": "<p>EV/EBITDA is the most seriously affect because it is most closely tied to accounting conventions.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.p<\/div><div class=\"qtext\"><p>Which of the following price multiples is most severely damaged by international accounting differences?<\/p><\/div>", "subj": "equity"}, {"n": 25, "q": "The multiple indicated by applying the discounted cash flow (DCF) model to a firm's fundamentals is necessarily the:", "opts": ["result of calculating retention/(required rate of return - growth) for the overall market.", "same as the average industry multiple.", "justified price multiple."], "ans": "C", "expl": "A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple. The question is limited to an individual firm and does not necessarily apply to the market or an industry.", "explhtml": "<p>A justified price multiple is the warranted or intrinsic price multiple. It is the estimated fair value of that multiple. The question is limited to an individual firm and does not necessarily apply to the market or an industry.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.b<\/div><div class=\"qtext\"><p>The multiple indicated by applying the discounted cash flow (DCF) model to a firm&#x27;s fundamentals is necessarily the:<\/p><\/div>", "subj": "equity"}, {"n": 26, "q": "Which of the following explanations is least likely to explain why Jenkins' stock picks underperform?", "opts": ["Large stocks have an outsized effect on the benchmark data.", "She is using the mean rather than the median valuation as a benchmark.", "Many stocks in the benchmark group are mispriced."], "ans": "A", "expl": "Capitalization weights are not an issue unless the benchmark is a cap-weighted index. Jenkins is using an equally-weighted basket of stocks in the same industry (or simple average). Average valuations reflect outliers; medians do not. P/Es can get very high, but can never fall below zero. As such, the outliers are going to trend high, and the median is likely to be considerably lower than the mean. A stock that looks cheap relative to the mean may look expensive relative to the median. Stocks of different sizes often have different average or median valuations. Mispricing of stocks in the benchmark is always a risk.", "explhtml": "<p>Capitalization weights are not an issue unless the benchmark is a cap-weighted index. Jenkins is using an equally-weighted basket of stocks in the same industry (or simple average). Average valuations reflect outliers; medians do not. P/Es can get very high, but can never fall below zero. As such, the outliers are going to trend high, and the median is likely to be considerably lower than the mean. A stock that looks cheap relative to the mean may look expensive relative to the median. Stocks of different sizes often have different average or median valuations. Mispricing of stocks in the benchmark is always a risk.<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 26–29<\/summary><div class=\"vig-body\"><p>Carol Jenkins, CFA, works as a stock analyst for Cape Cod Partners, a money-management firm that handles private accounts for high net worth clients. Jenkins' assignment is to find attractively valued stocks for client portfolios.<\/p><p>Jenkins believes that recent weakness in the technology sector presents an attractive opportunity. She is looking at Massive Tech, the market leader in chipsets for laptop computers, and Mouse &amp; Associates, a tiny software developer specializing in data-storage programs. Jenkins is considering the companies' relative values in a number of ways. Statistics for Massive and Mouse are provided below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v012.webp\" style=\"max-width:min(100%,666px)\" alt=\"Mouse &amp; Associates Massive Tech $12 Stock price $65 $4,300 $3.15 Trailing earnings $84 $130,000 Market capitalization $7.0 $16,250 Assets $12,000 $5.5 Equity 49% 54% Operating margin 22% Net margin 12% $6 $3,500 Depreciation $5,675 $1.5 Amortization\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v013.webp\" style=\"max-width:min(100%,666px)\" alt=\"$0.3 $4,200 Fixed investment plus borrowing $0.02 $3 Dividends 2,000 7 Shares outstanding\"><p>* All figures except stock price, dividends, and percentages are in millions.<\/p><p>In most cases, Jenkins values her stocks relative to an equally-weighted basket of stocks in the same industry in order to avoid significant fundamental differences between companies of different types. However, her picks made based on price/earnings ratios are not doing well against the market. She fears the stocks she selects are not as cheap as she originally thought, relative to her benchmark.<\/p><p>Jenkins also wants to improve Cape Cod's selection of software stocks. To widen the field beyond the companies she currently follows, Jenkins wants to include Canadian software stocks in Cape Cod's research universe. Differences in accounting methodologies are not a concern, but Jenkins is still concerned about the difficulty of valuing the different stocks.<\/p><p>Jenkins has assembled the following data about Canadian software companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v014.webp\" style=\"max-width:min(100%,631px)\" alt=\"• Most are very small. • Most carry little debt, but about 20% are heavily leveraged. • These companies are more likely to be unprofitable compared to U.S. companies. • Few pay dividends, as is the case in the U.S. • Many of the companies are government-subsidized, which leads to drastic differences in the level of operating expenses.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Which of the following explanations is least likely to explain why Jenkins&#x27; stock picks underperform?<\/p><\/div>", "subj": "equity"}, {"n": 27, "q": "Which valuation ratio is least appropriate for comparing Massive and Mouse?", "opts": ["Enterprise value/EBITDA because Massive and Mouse have very different debt levels.", "Price/book because Massive is larger than Mouse.", "Price/cash flow because cash flows for small companies can be extremely volatile."], "ans": "B", "expl": "The P/B ratios can be misleading when used to compare companies with vastly different asset bases. A large semiconductor company is likely to have lots of fixed assets, while a tiny software company may have very few assets. The P/CF ratio tends to be more stable than the P/E ratio. The P/E ratio is useless for considering companies that lose money, but that does not mean the measure has no value when earnings are positive. The EV/EBITDA ratio is effective at comparing stocks with different degrees of financial leverage.", "explhtml": "<p>The P/B ratios can be misleading when used to compare companies with vastly different asset bases. A large semiconductor company is likely to have lots of fixed assets, while a tiny software company may have very few assets. The P/CF ratio tends to be more stable than the P/E ratio. The P/E ratio is useless for considering companies that lose money, but that does not mean the measure has no value when earnings are positive. The EV/EBITDA ratio is effective at comparing stocks with different degrees of financial leverage.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 26–29<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Jenkins, CFA, works as a stock analyst for Cape Cod Partners, a money-management firm that handles private accounts for high net worth clients. Jenkins' assignment is to find attractively valued stocks for client portfolios.<\/p><p>Jenkins believes that recent weakness in the technology sector presents an attractive opportunity. She is looking at Massive Tech, the market leader in chipsets for laptop computers, and Mouse &amp; Associates, a tiny software developer specializing in data-storage programs. Jenkins is considering the companies' relative values in a number of ways. Statistics for Massive and Mouse are provided below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v012.webp\" style=\"max-width:min(100%,666px)\" alt=\"Mouse &amp; Associates Massive Tech $12 Stock price $65 $4,300 $3.15 Trailing earnings $84 $130,000 Market capitalization $7.0 $16,250 Assets $12,000 $5.5 Equity 49% 54% Operating margin 22% Net margin 12% $6 $3,500 Depreciation $5,675 $1.5 Amortization\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v013.webp\" style=\"max-width:min(100%,666px)\" alt=\"$0.3 $4,200 Fixed investment plus borrowing $0.02 $3 Dividends 2,000 7 Shares outstanding\"><p>* All figures except stock price, dividends, and percentages are in millions.<\/p><p>In most cases, Jenkins values her stocks relative to an equally-weighted basket of stocks in the same industry in order to avoid significant fundamental differences between companies of different types. However, her picks made based on price/earnings ratios are not doing well against the market. She fears the stocks she selects are not as cheap as she originally thought, relative to her benchmark.<\/p><p>Jenkins also wants to improve Cape Cod's selection of software stocks. To widen the field beyond the companies she currently follows, Jenkins wants to include Canadian software stocks in Cape Cod's research universe. Differences in accounting methodologies are not a concern, but Jenkins is still concerned about the difficulty of valuing the different stocks.<\/p><p>Jenkins has assembled the following data about Canadian software companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v014.webp\" style=\"max-width:min(100%,631px)\" alt=\"• Most are very small. • Most carry little debt, but about 20% are heavily leveraged. • These companies are more likely to be unprofitable compared to U.S. companies. • Few pay dividends, as is the case in the U.S. • Many of the companies are government-subsidized, which leads to drastic differences in the level of operating expenses.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Which valuation ratio is least appropriate for comparing Massive and Mouse?<\/p><\/div>", "subj": "equity"}, {"n": 28, "q": "Mouse & Associates is cheaper than Massive Tech as measured by:", "opts": ["the price/sales ratio and the dividend yield.", "the earnings yield but not the price/book.", "the price/sales ratio and the price/earnings ratio."], "ans": "B", "expl": "To calculate the P/E, divide the market capitalization by the earnings. Lower is cheaper. To calculate the P/B, divide the market capitalization by the equity. Lower is cheaper. To calculate the P/S, determine sales by dividing the earnings by the net margin. Then divide the market capitalization by the sales. Lower is cheaper. To calculate the earnings yield, divide the earnings by the market capitalization. Higher is cheaper. To calculate the dividend yield, divide the dividends by the price. Higher is cheaper.  Massive Tech Mouse & Associates P/E 30.23 26.67 P/B 10.83 15.27 P/S 3.63 5.87 Earnings yield 3.31% 3.75% Dividend yield 4.62% 0.17%", "explhtml": "<p>To calculate the P/E, divide the market capitalization by the earnings. Lower is cheaper.<\/p><p>To calculate the P/B, divide the market capitalization by the equity. Lower is cheaper.<\/p><p>To calculate the P/S, determine sales by dividing the earnings by the net margin. Then divide the market capitalization by the sales. Lower is cheaper.<\/p><p>To calculate the earnings yield, divide the earnings by the market capitalization. Higher is cheaper.<\/p><p>To calculate the dividend yield, divide the dividends by the price. Higher is cheaper.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Massive Tech<\/td><td>Mouse &amp; Associates<\/td><\/tr><tr><td>P/E<\/td><td>30.23<\/td><td>26.67<\/td><\/tr><tr><td>P/B<\/td><td>10.83<\/td><td>15.27<\/td><\/tr><tr><td>P/S<\/td><td>3.63<\/td><td>5.87<\/td><\/tr><tr><td>Earnings yield<\/td><td>3.31%<\/td><td>3.75%<\/td><\/tr><tr><td>Dividend yield<\/td><td>4.62%<\/td><td>0.17%<\/td><\/tr><\/table><\/div>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 26–29<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Jenkins, CFA, works as a stock analyst for Cape Cod Partners, a money-management firm that handles private accounts for high net worth clients. Jenkins' assignment is to find attractively valued stocks for client portfolios.<\/p><p>Jenkins believes that recent weakness in the technology sector presents an attractive opportunity. She is looking at Massive Tech, the market leader in chipsets for laptop computers, and Mouse &amp; Associates, a tiny software developer specializing in data-storage programs. Jenkins is considering the companies' relative values in a number of ways. Statistics for Massive and Mouse are provided below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v012.webp\" style=\"max-width:min(100%,666px)\" alt=\"Mouse &amp; Associates Massive Tech $12 Stock price $65 $4,300 $3.15 Trailing earnings $84 $130,000 Market capitalization $7.0 $16,250 Assets $12,000 $5.5 Equity 49% 54% Operating margin 22% Net margin 12% $6 $3,500 Depreciation $5,675 $1.5 Amortization\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v013.webp\" style=\"max-width:min(100%,666px)\" alt=\"$0.3 $4,200 Fixed investment plus borrowing $0.02 $3 Dividends 2,000 7 Shares outstanding\"><p>* All figures except stock price, dividends, and percentages are in millions.<\/p><p>In most cases, Jenkins values her stocks relative to an equally-weighted basket of stocks in the same industry in order to avoid significant fundamental differences between companies of different types. However, her picks made based on price/earnings ratios are not doing well against the market. She fears the stocks she selects are not as cheap as she originally thought, relative to her benchmark.<\/p><p>Jenkins also wants to improve Cape Cod's selection of software stocks. To widen the field beyond the companies she currently follows, Jenkins wants to include Canadian software stocks in Cape Cod's research universe. Differences in accounting methodologies are not a concern, but Jenkins is still concerned about the difficulty of valuing the different stocks.<\/p><p>Jenkins has assembled the following data about Canadian software companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v014.webp\" style=\"max-width:min(100%,631px)\" alt=\"• Most are very small. • Most carry little debt, but about 20% are heavily leveraged. • These companies are more likely to be unprofitable compared to U.S. companies. • Few pay dividends, as is the case in the U.S. • Many of the companies are government-subsidized, which leads to drastic differences in the level of operating expenses.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Mouse &amp; Associates is cheaper than Massive Tech as measured by:<\/p><\/div>", "subj": "equity"}, {"n": 29, "q": "The price/cash flow ratio of Massive Tech, where cash flow is defined as earnings plus noncash charges, is closest to:", "opts": ["16.67.", "9.65.", "7.89."], "ans": "B", "expl": "Cash flow = net income plus depreciation plus amortization = ($4,300 + 3,500 + 5,675) = $13,475 million. P/CF = market capitalization/cash flow = ($130,000/13,475) = 9.65.", "explhtml": "<p>Cash flow = net income plus depreciation plus amortization = ($4,300 + 3,500 + 5,675) = $13,475 million.<\/p><p>P/CF = market capitalization/cash flow = ($130,000/13,475) = 9.65.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 26–29<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Carol Jenkins, CFA, works as a stock analyst for Cape Cod Partners, a money-management firm that handles private accounts for high net worth clients. Jenkins' assignment is to find attractively valued stocks for client portfolios.<\/p><p>Jenkins believes that recent weakness in the technology sector presents an attractive opportunity. She is looking at Massive Tech, the market leader in chipsets for laptop computers, and Mouse &amp; Associates, a tiny software developer specializing in data-storage programs. Jenkins is considering the companies' relative values in a number of ways. Statistics for Massive and Mouse are provided below:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v012.webp\" style=\"max-width:min(100%,666px)\" alt=\"Mouse &amp; Associates Massive Tech $12 Stock price $65 $4,300 $3.15 Trailing earnings $84 $130,000 Market capitalization $7.0 $16,250 Assets $12,000 $5.5 Equity 49% 54% Operating margin 22% Net margin 12% $6 $3,500 Depreciation $5,675 $1.5 Amortization\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v013.webp\" style=\"max-width:min(100%,666px)\" alt=\"$0.3 $4,200 Fixed investment plus borrowing $0.02 $3 Dividends 2,000 7 Shares outstanding\"><p>* All figures except stock price, dividends, and percentages are in millions.<\/p><p>In most cases, Jenkins values her stocks relative to an equally-weighted basket of stocks in the same industry in order to avoid significant fundamental differences between companies of different types. However, her picks made based on price/earnings ratios are not doing well against the market. She fears the stocks she selects are not as cheap as she originally thought, relative to her benchmark.<\/p><p>Jenkins also wants to improve Cape Cod's selection of software stocks. To widen the field beyond the companies she currently follows, Jenkins wants to include Canadian software stocks in Cape Cod's research universe. Differences in accounting methodologies are not a concern, but Jenkins is still concerned about the difficulty of valuing the different stocks.<\/p><p>Jenkins has assembled the following data about Canadian software companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v014.webp\" style=\"max-width:min(100%,631px)\" alt=\"• Most are very small. • Most carry little debt, but about 20% are heavily leveraged. • These companies are more likely to be unprofitable compared to U.S. companies. • Few pay dividends, as is the case in the U.S. • Many of the companies are government-subsidized, which leads to drastic differences in the level of operating expenses.\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>The price/cash flow ratio of Massive Tech, where cash flow is defined as earnings plus noncash charges, is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 30, "q": "The definition of a PEG ratio is price to earnings (P/E):", "opts": ["divided by the expected earnings growth rate.", "divided by the average growth rate of the peer group.", "divided by average historical earnings growth rate."], "ans": "A", "expl": "The PEG ratio is P/E divided by the expected earnings growth rate.", "explhtml": "<p>The PEG ratio is P/E divided by the expected earnings growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>The definition of a PEG ratio is price to earnings (P/E):<\/p><\/div>", "subj": "equity"}, {"n": 31, "q": "For which of the following firms is the Price/Earnings to Growth (PEG) ratio most appropriate for identifying undervalued or overvalued equities? Firm A: Expected dividend growth = 6%; Cost of equity = 12%; price-to-earnings (P/E) = 12. Firm B: Expected dividend growth = −6%; Cost of equity = 12%; price-to-earnings (P/E) = 12. Firm C: Expected dividend growth = 1%; Cost of equity = 12%; price-to-earnings (P/E) = 12.", "opts": ["Firm B.", "Firm A.", "Firm C."], "ans": "B", "expl": "The formula for the PEG ratio is: PEG = (P/E) / g. It measures the tradeoff between P/E and expected dividend growth (g). For traditional growth firms, PEG ratios fall between 1 and 2. The general rule is that PEG ratios above 2 are indicative of overvalued firms (expensive), and PEG ratios below 1 are indicative of firms that are undervalued (cheap). Firm A: PEG = 2, indicating a stock that is appropriately priced. Firm B: The PEG ratio of firms with negative expected dividend growth is negative,\nwhich is meaningless. For Firm B, PEG = -2. Firm C: Firms with very low expected dividend growth are likely to have PEG ratios that\nunrealistically indicate overvalued stocks. For Firm C, PEG = 12.", "explhtml": "<p>The formula for the PEG ratio is: PEG = (P/E) / g. It measures the tradeoff between P/E and expected dividend growth (g). For traditional growth firms, PEG ratios fall between 1 and 2. The general rule is that PEG ratios above 2 are indicative of overvalued firms (expensive), and PEG ratios below 1 are indicative of firms that are undervalued (cheap).<\/p><div class=\"tbl\"><table><tr><td>Firm A:<\/td><td>PEG = 2, indicating a stock that is appropriately priced.<\/td><\/tr><tr><td>Firm B:<\/td><td>The PEG ratio of firms with negative expected dividend growth is negative,<br>which is meaningless. For Firm B, PEG = -2.<\/td><\/tr><tr><td>Firm C:<\/td><td>Firms with very low expected dividend growth are likely to have PEG ratios that<br>unrealistically indicate overvalued stocks. For Firm C, PEG = 12.<\/td><\/tr><\/table><\/div>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>For which of the following firms is the Price/Earnings to Growth (PEG) ratio most appropriate for identifying undervalued or overvalued equities?<\/p><p>Firm A: Expected dividend growth = 6%; Cost of equity = 12%; price-to-earnings (P/E) = 12.<\/p><p>Firm B: Expected dividend growth = −6%; Cost of equity = 12%; price-to-earnings (P/E) = 12.<\/p><p>Firm C: Expected dividend growth = 1%; Cost of equity = 12%; price-to-earnings (P/E) = 12.<\/p><\/div>", "subj": "equity"}, {"n": 32, "q": "An analyst is preparing a presentation on \"Interpreting PE ratios\" and has the following data:  Portfolio % Stock PE Stock AAA 60% 10 Stock BBB 40% 15 Which of the following is closest to the weighted harmonic mean of these two PE ratios?", "opts": ["12.49.", "11.98.", "11.54."], "ans": "C", "expl": "The weighted harmonic mean of the two PE ratios is a harmonic mean which is weighted by the portfolio weights. 1/[(0.60 × 1/10) + (0.40 × 1/15)] = 11.54", "explhtml": "<p>The weighted harmonic mean of the two PE ratios is a harmonic mean which is weighted by the portfolio weights.<\/p><p>1/[(0.60 × 1/10) + (0.40 × 1/15)] = 11.54<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.r<\/div><div class=\"qtext\"><p>An analyst is preparing a presentation on &quot;Interpreting PE ratios&quot; and has the following data:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Portfolio %<\/td><td>Stock PE<\/td><\/tr><tr><td>Stock AAA<\/td><td>60%<\/td><td>10<\/td><\/tr><tr><td>Stock BBB<\/td><td>40%<\/td><td>15<\/td><\/tr><\/table><\/div><p>Which of the following is closest to the weighted harmonic mean of these two PE ratios?<\/p><\/div>", "subj": "equity"}, {"n": 33, "q": "A firm has a return on equity (ROE) of 18%, an estimated growth rate of 13%, and its shareholders require a return of 17% on their investment. Based on these fundamentals, a reasonable estimate of the appropriate price-to-book value ratio for the firm is:", "opts": ["2.42.", "1.25.", "1.58."], "ans": "B", "expl": "ROE - g P  0.18 - 0.13 |  =    =    = 1.25 r - g BV  0.17 - 0.13", "explhtml": "<p>ROE - g<\/p><div class=\"tbl\"><table><tr><td>P<\/td><td>0.18 - 0.13<\/td><\/tr><tr><td> = <\/td><td> = <\/td><td> = 1.25<\/td><\/tr><\/table><\/div><p>r - g BV &nbsp; 0.17 - 0.13<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>A firm has a return on equity (ROE) of 18%, an estimated growth rate of 13%, and its shareholders require a return of 17% on their investment. Based on these fundamentals, a reasonable estimate of the appropriate price-to-book value ratio for the firm is:<\/p><\/div>", "subj": "equity"}, {"n": 34, "q": "The relative valuation model known as the PEG ratio is equal to:", "opts": ["earnings per share growth rate / price-to-earnings.", "P/E × earnings.", "price-to-earnings (P/E) / earnings per share (EPS) growth rate."], "ans": "C", "expl": "The PEG ratio is equal to the price-to-earnings ratio divided by the EPS growth rate.", "explhtml": "<p>The PEG ratio is equal to the price-to-earnings ratio divided by the EPS growth rate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>The relative valuation model known as the PEG ratio is equal to:<\/p><\/div>", "subj": "equity"}, {"n": 35, "q": "The value of a firm, calculated using the discounted cash flow (DCF) method, will be closest to the valuation using P/E multiples when P/E multiples are estimated using:", "opts": ["P/E multiples of comparable firms.", "fundamental data.", "historical P/E multiples."], "ans": "B", "expl": "In the DCF valuation method, an analyst makes specific assumptions about each variable, such as growth, risk, payout, etc. The valuation using P/E multiples will be closest to the one obtained using the DCF approach when fundamental data -- for growth, risk, payout, etc. -- is used to estimate P/E multiples.", "explhtml": "<p>In the DCF valuation method, an analyst makes specific assumptions about each variable, such as growth, risk, payout, etc. The valuation using P/E multiples will be closest to the one obtained using the DCF approach when fundamental data -- for growth, risk, payout, etc. -- is used to estimate P/E multiples.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>The value of a firm, calculated using the discounted cash flow (DCF) method, will be closest to the valuation using P/E multiples when P/E multiples are estimated using:<\/p><\/div>", "subj": "equity"}, {"n": 36, "q": "Which of the following is NOT an advantage of using price-to-book value (PBV) multiples in stock valuation?", "opts": ["PBV ratios can be compared across similar firms if accounting standards are consistent.", "Book value is often positive, even when earnings are negative.", "Book values are very meaningful for firms in service industries."], "ans": "C", "expl": "Book values are NOT very meaningful for firms in service industries.", "explhtml": "<p>Book values are NOT very meaningful for firms in service industries.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.c<\/div><div class=\"qtext\"><p>Which of the following is NOT an advantage of using price-to-book value (PBV) multiples in stock valuation?<\/p><\/div>", "subj": "equity"}, {"n": 37, "q": "Precision Tools is expected to have earnings per share (EPS) of $5.00 per share in five years, a dividend per share of $2.00, a cost of equity of 12%, and a long-term expected growth rate of 5%. What is the terminal trailing price-to-earnings (P/E) ratio in five years?", "opts": ["9.00.", "6.00.", "7.14."], "ans": "B", "expl": "P₅/E₅ = (0.40 × 1.05) / (0.12 – 0.05) = 6.00", "explhtml": "<p>P<sub>5<\/sub>/E<sub>5<\/sub> = (0.40 × 1.05) / (0.12 – 0.05) = 6.00<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.k<\/div><div class=\"qtext\"><p>Precision Tools is expected to have earnings per share (EPS) of $5.00 per share in five years, a dividend per share of $2.00, a cost of equity of 12%, and a long-term expected growth rate of 5%. What is the terminal trailing price-to-earnings (P/E) ratio in five years?<\/p><\/div>", "subj": "equity"}, {"n": 38, "q": "The average return on equity (ROE) earnings normalization method relies on:", "opts": ["the earnings yield.", "average earnings per share (EPS) over the most recent cycle.", "average ROE over the most recent cycle."], "ans": "C", "expl": "The average return on equity normalization method normalizes EPS as the average ROE over the most recent full cycle multiplied by book value per share.", "explhtml": "<p>The average return on equity normalization method normalizes EPS as the average ROE over the most recent full cycle multiplied by book value per share.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>The average return on equity (ROE) earnings normalization method relies on:<\/p><\/div>", "subj": "equity"}, {"n": 39, "q": "One disadvantage of using the price/sales (P/S) multiple for stock valuation is that:", "opts": ["sales are relatively stable and might not change even though earnings and value might change significantly.", "P/S multiple does not provide a framework to evaluate the effects of corporate policy decisions and price changes.", "profit margins are not consistent across firms within an industry."], "ans": "A", "expl": "The stability of sales (relative to earnings and book value) can be a disadvantage. For example, revenues may remain stable but earnings and book values can drop significantly due to a sharp increase in expenses.", "explhtml": "<p>The stability of sales (relative to earnings and book value) can be a disadvantage. For example, revenues may remain stable but earnings and book values can drop significantly due to a sharp increase in expenses.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.c<\/div><div class=\"qtext\"><p>One disadvantage of using the price/sales (P/S) multiple for stock valuation is that:<\/p><\/div>", "subj": "equity"}, {"n": 40, "q": "An increase in growth will cause a price to cash flow multiple to:", "opts": ["decrease.", "there is insufficient information to tell.", "increase."], "ans": "C", "expl": "An increase in growth increases the price to cash flow ratio (CF), as indicated by the following expression: P₀ / CF₀ = (1 + g) / (r – g)", "explhtml": "<p>An increase in growth increases the price to cash flow ratio (CF), as indicated by the following expression:<\/p><p>P<sub>0<\/sub> / CF<sub>0<\/sub> = (1 + g) / (r – g)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.g<\/div><div class=\"qtext\"><p>An increase in growth will cause a price to cash flow multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 41, "q": "Analyst Ariel Cunningham likes using the price/earnings ratio for valuation purposes because studies have shown it is very effective at identifying undervalued stocks. However, she has one main problem with the statistic – it doesn't work when a company loses money. So Cunningham is considering switching to a different core valuation metric. Given Cunningham's rationale for using the price/earnings ratio, which option would be her best alternative?", "opts": ["Price/sales.", "Price/book.", "Price/cash flow."], "ans": "A", "expl": "Book value is usually positive, but not always. Cash flow is often negative. If the reason Cunningham wants to stop using the P/E ratio is that it does not work for unprofitable companies, her best option is a ratio base on sales, which are positive in all but the rarest of instances.", "explhtml": "<p>Book value is usually positive, but not always. Cash flow is often negative. If the reason Cunningham wants to stop using the P/E ratio is that it does not work for unprofitable companies, her best option is a ratio base on sales, which are positive in all but the rarest of instances.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.c<\/div><div class=\"qtext\"><p>Analyst Ariel Cunningham likes using the price/earnings ratio for valuation purposes because studies have shown it is very effective at identifying undervalued stocks. However, she has one main problem with the statistic – it doesn&#x27;t work when a company loses money. So Cunningham is considering switching to a different core valuation metric. Given Cunningham&#x27;s rationale for using the price/earnings ratio, which option would be her best alternative?<\/p><\/div>", "subj": "equity"}, {"n": 42, "q": "An analyst is calculating the weighted harmonic mean P/E ratio of a 2-stock portfolio. Stocks AAA and BBB have prices of $12 and $15, respectively, and EPS of $1 and $2, respectively. Which of the following is the weighted harmonic mean P/E of the portfolio closest to?", "opts": ["9", "9.23", "9.75"], "ans": "A", "expl": "The weighted harmonic mean is 1/[(12/27)(1/12) + (15/27)(2/15)] = 27/3 = 9.00 The weighted harmonic mean of the individual stocks P/Es is the best measure of the P/E for a portfolio of stocks.", "explhtml": "<p>The weighted harmonic mean is 1/[(12/27)(1/12) + (15/27)(2/15)] = 27/3 = 9.00 The weighted harmonic mean of the individual stocks P/Es is the best measure of the P/E for a portfolio of stocks.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.r<\/div><div class=\"qtext\"><p>An analyst is calculating the weighted harmonic mean P/E ratio of a 2-stock portfolio. Stocks AAA and BBB have prices of $12 and $15, respectively, and EPS of $1 and $2, respectively. Which of the following is the weighted harmonic mean P/E of the portfolio closest to?<\/p><\/div>", "subj": "equity"}, {"n": 43, "q": "An analyst is valuing a company with a dividend payout ratio of 0.65, a beta of 0.72, and an expected earnings growth rate of 0.05. A regression on comparable companies produces the following equation: Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta) What is the predicted P/E using the above regression?", "opts": ["10.35.", "11.39.", "7.65."], "ans": "A", "expl": "Predicted P/E = 7.65 + (3.75 × 0.65) + (15.35 × 0.05) − (0.70 × 0.72) = 10.35", "explhtml": "<p>Predicted P/E = 7.65 + (3.75 × 0.65) + (15.35 × 0.05) − (0.70 × 0.72) = 10.35<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.h<\/div><div class=\"qtext\"><p>An analyst is valuing a company with a dividend payout ratio of 0.65, a beta of 0.72, and an expected earnings growth rate of 0.05. A regression on comparable companies produces the following equation:<\/p><p>Predicted price to earnings (P/E) = 7.65 + (3.75 × dividend payout) + (15.35 × growth) − (0.70 × beta)<\/p><p>What is the predicted P/E using the above regression?<\/p><\/div>", "subj": "equity"}, {"n": 44, "q": "What is the justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 65% if the shareholders require a return of 10% on their investment and the expected growth rate in dividends is 6%?", "opts": ["16.25.", "9.28.", "17.23."], "ans": "C", "expl": "P₀/E₀ = (0.65 × 1.06) / (0.10 – 0.06) = 17.225", "explhtml": "<p>P<sub>0<\/sub>/E<sub>0<\/sub> = (0.65 × 1.06) / (0.10 – 0.06) = 17.225<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>What is the justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 65% if the shareholders require a return of 10% on their investment and the expected growth rate in dividends is 6%?<\/p><\/div>", "subj": "equity"}, {"n": 45, "q": "Leslie Singer comments to Robert Chan that Dreamtime Industries' expected dividend growth rate is 5.0%, ROE is 14%, and required return on equity (r) is 10%. Based on a justified P/B ratio compared to a P/B ratio (based on market price per share) of 1.60, Dreamtime Industries is most likely:", "opts": ["correctly valued.", "undervalued.", "overvalued."], "ans": "B", "expl": "Justified P/B = (ROE − g) / (r − g). When the expected dividend growth is 5.0%, the justified P/B = (0.14 − 0.05) / (0.10 − 0.05) = 1.80. This is greater than the market P/B of 1.60.", "explhtml": "<p>Justified P/B = (ROE − g) / (r − g). When the expected dividend growth is 5.0%, the justified P/B = (0.14 − 0.05) / (0.10 − 0.05) = 1.80. This is greater than the market P/B of 1.60.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.l<\/div><div class=\"qtext\"><p>Leslie Singer comments to Robert Chan that Dreamtime Industries&#x27; expected dividend growth rate is 5.0%, ROE is 14%, and required return on equity (r) is 10%. Based on a justified P/B ratio compared to a P/B ratio (based on market price per share) of 1.60, Dreamtime Industries is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 46, "q": "An analyst has gathered the following data about Jackson, Inc.: Payout ratio = 60%. Expected growth rate in dividends = 6.7%. Required rate of return = 12.5%. What will be the appropriate price-to-book value (PBV) ratio for Jackson, based on fundamentals?", "opts": ["0.58.", "1.38.", "1.73."], "ans": "C", "expl": "Return on equity (ROE) = g / (1 − payout ratio) = 0.067 / 0.40 = 0.1675 or 16.75%. Based on fundamentals: PBV = (0.1675 − 0.067) / (0.125 − 0.067) = 1.73.", "explhtml": "<p>Return on equity (ROE) = g / (1 − payout ratio) = 0.067 / 0.40 = 0.1675 or 16.75%.<\/p><p>Based on fundamentals:<\/p><p>PBV = (0.1675 − 0.067) / (0.125 − 0.067) = 1.73.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>An analyst has gathered the following data about Jackson, Inc.:<\/p><p>Payout ratio = 60%. Expected growth rate in dividends = 6.7%. Required rate of return = 12.5%.<\/p><p>What will be the appropriate price-to-book value (PBV) ratio for Jackson, based on fundamentals?<\/p><\/div>", "subj": "equity"}, {"n": 47, "q": "What is the justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 40% if the shareholders require a return of 16% on their investment and the expected growth rate in dividends is 6%?", "opts": ["4.24.", "4.00.", "6.36."], "ans": "A", "expl": "P₀/E₀ = (0.40 × 1.06) / (0.16 – 0.06) = 4.24", "explhtml": "<p>P<sub>0<\/sub>/E<sub>0<\/sub> = (0.40 × 1.06) / (0.16 – 0.06) = 4.24<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>What is the justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 40% if the shareholders require a return of 16% on their investment and the expected growth rate in dividends is 6%?<\/p><\/div>", "subj": "equity"}, {"n": 48, "q": "An analyst begins an equity analysis of Company A by noting the following ratios from three companies in the same industry:  EPS PE Company A $1.60 10.0 Company B $2.10 12.5 Company C $5.80 13.0 This analyst is most likely using:", "opts": ["the method of comparables.", "technical analysis.", "the method of forecasted fundamentals."], "ans": "A", "expl": "The analysis is comparing ratios of three companies in the same industry. The Law of One Price states that similar assets should have comparable prices.", "explhtml": "<p>The analysis is comparing ratios of three companies in the same industry. The Law of One Price states that similar assets should have comparable prices.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>An analyst begins an equity analysis of Company A by noting the following ratios from three companies in the same industry:<\/p><div class=\"tbl\"><table><tr><td><\/td><td>EPS<\/td><td>PE<\/td><\/tr><tr><td>Company A<\/td><td>$1.60<\/td><td>10.0<\/td><\/tr><tr><td>Company B<\/td><td>$2.10<\/td><td>12.5<\/td><\/tr><tr><td>Company C<\/td><td>$5.80<\/td><td>13.0<\/td><\/tr><\/table><\/div><p>This analyst is most likely using:<\/p><\/div>", "subj": "equity"}, {"n": 49, "q": "A firm has a payout ratio of 40%, a profit margin of 7%, an estimated growth rate of 10%, and its shareholders require a return of 14% on their investment. Based on these fundamentals, a reasonable estimate of the appropriate price-to-sales ratio for the firm (based on trailing sales) is:", "opts": ["0.77.", "0.56.", "0.70."], "ans": "A", "expl": "payout × profitmargin × ( 1 + g ) 0.40 × 0.07 × 1.10 P =  =  = 0.77 r −g S  0.14 −0.10", "explhtml": "<p>payout × profitmargin × ( 1 + g )<\/p><p>0.40 × 0.07 × 1.10<\/p><p>P = &nbsp; = &nbsp; = 0.77<\/p><p>r −g S &nbsp; 0.14 −0.10<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>A firm has a payout ratio of 40%, a profit margin of 7%, an estimated growth rate of 10%, and its shareholders require a return of 14% on their investment. Based on these fundamentals, a reasonable estimate of the appropriate price-to-sales ratio for the firm (based on trailing sales) is:<\/p><\/div>", "subj": "equity"}, {"n": 50, "q": "Calculate free cash flow to equity during 2x09 using the data extracted from the 2x09 accounts:", "opts": ["$90.7 million.", "$94.0 million.", "$120.0 million."], "ans": "B", "expl": "FCFE = CFO – FC Inv + net borrowing = 130 – 50 + 14 = $94 million", "explhtml": "<p>FCFE = CFO – FC Inv + net borrowing<\/p><p>= 130 – 50 + 14<\/p><p>= $94 million<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 50–55<\/summary><div class=\"vig-body\"><p>At the end of 2x09, Dustin Pedroia, CFA, is writing a report to help advise on a potential corporate takeover. Iliot Inc. is up for sale, and Pedroia's client is considering buying 100% of the share capital.<\/p><p>Pedroia has decided to include two free cash flow valuations in his report for the client. An extract of the most recent cash flow statement, which he intends to use as a base for his first FCF calculation, appears below:<\/p><p>Cash Flow Statement (extract) for the Year Ended 31st December 2x09<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v015.webp\" style=\"max-width:min(100%,503px)\" alt=\"U.S. $ millions Cash flow from operating activities 130 Extracts from the Financial Statements for 2x09 also show the following: 2x08 2x09 Financial Statement Extracts Sm $m 270.0 320.0 Fixed assets (at cost)\"><p>Less: Accumulated depreciation 112.0 138.0<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v016.webp\" style=\"max-width:min(100%,660px)\" alt=\"65.2 Inventory 71.0 Accounts receivable 94.2 96.7 74.0 79.0 Accounts payable\"><p>There have been no sales or impairments of fixed assets during the year and net borrowing for 2x09 raised $14 million.<\/p><p>For his first valuation, Pedroia will make a simple assumption that free cash flow to equity will grow at 5% per annum indefinitely in order to reach his valuation. The resulting value will be labelled \"Best Case Scenario\" in the report.<\/p><p>In addition, the client has passed Pedroia their own forecasts for the performance of lliot over the next five years, and he also intends to use these forecasts to come up with an alternative valuation, which he will label \"FCF Valuation Using Forecasted Cash Flows.\" Details of the forecasted flows are as follows: Free Cash Flow to Equity Forecasts: Iliot Inc.<\/p><p>2x10 $65 million 2x11 $68 million 2x12 $72 million 2x13 $75 million Pedroia will discount the flows at a cost of equity of 12%, and that the 2x10 free cash flow will occur in one year from now. In order to calculate a terminal value at the end of 2x13, Pedroia intends to use an estimate of lliot's P/E ratio and earnings. He estimates lliot's trailing P/E ratio at the end of 2x13 to be 28 using a linear regression model based on risk, growth, and dividend payout, and forecasts 2x13 earnings to be $70 milllion.<\/p><p>Pedroia also wishes to include a note on lliot's normalized earnings in his final report. He intends to initially calculate a normalized EPS figure for 2x09. To do this he will use the method of average return on equity method. In order to assist with this task he notes down various information for lliot from the last three years:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v017.webp\" style=\"max-width:min(100%,339px)\" alt=\"Iliot Historical Data 2x07 2x09 2x08 $2.80 $2.50 Earnings per share $2.85 $16.40 Book value per share $16.20 $15.80 14.8% 15.4% Return on equity 18.0%\"><p>Pedroia intends to conclude his report with a note to the client that he himself owns a small number of lliot shares. He purchased the shares after implementing a stock screen system of selection, whereby he decided to only purchase shares if they passed the following criteria:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v018.webp\" style=\"max-width:min(100%,276px)\" alt=\"• P/E less than 10 • Market Cap greater than $0.5 billion\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v019.webp\" style=\"max-width:min(100%,320px)\" alt=\"• EBITDA-to-free cash flow ratio less than 12 • PEG ratio greater than 1.2\"><p>He implemented his stock screen system in mid 2x06. Before implementing the system, Pedroia back tested it using 2x05 year-end ratios published by his favorite analyst's journal in April 2x06. Using those ratios, results showed that if he had bought stocks at the end of 2x05, which passed his screen, he would have made abnormal positive profits.<\/p><\/div><\/details><div class=\"pp-topic\">Module 19.4, LOS 19.d<\/div><div class=\"qtext\"><p>Calculate free cash flow to equity during 2x09 using the data extracted from the 2x09 accounts:<\/p><\/div>", "subj": "equity"}, {"n": 51, "q": "The growth assumption Pedroia uses in calculating his \"Best Case Scenario\" valuation are most suitable if Iliot is:", "opts": ["a stable firm in a mature industry with a required return on equity of 4%.", "a stable firm in a mature industry with a required return on equity of 14%.", "a growing firm in an infant industry with a required return on equity of 14%."], "ans": "B", "expl": "The assumption of constant perpetual growth is suited to stable firms in a mature industry. If Iliot has a cost of equity of 4%, this would be less than the growth rate (5%) assumed and hence the model would not be appropriate.", "explhtml": "<p>The assumption of constant perpetual growth is suited to stable firms in a mature industry. If Iliot has a cost of equity of 4%, this would be less than the growth rate (5%) assumed and hence t
