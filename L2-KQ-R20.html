mium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda: &quot;operates in extremely cyclical industry&quot; Struma:\"><p>Tundzha: \"has very different cost structure to the rest of its peers\" Based on the highlighted points, she is deciding on the most appropriate candidate ratio for each of the above companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v030.webp\" style=\"max-width:min(100%,449px)\" alt=\"price-to-earnings or price-to-book Arda: normalized price-to-earnings or trailing price-to-sales Struma:\"><p>Tundzha: price-to-earnings or price-to-sales Beyan has also been recently tasked with covering Nanuk Ple and Nunca Ple, two close competitors developing innovative solutions for marine navigation. She has collected the following information on the two companies (the trailing cash flow per share is calculated as net income per share plus non-cash charges per share):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v031.webp\" style=\"max-width:min(100%,300px)\" alt=\"Nanuk Nunca Share price 64.00 38.00 9.11 4.52 Trailing CF per share\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v032.webp\" style=\"max-width:min(100%,300px)\" alt=\"P/CF 8.41 7.03 Trailing FCFE per share 3.11 3.85 P/FCFE 12.22 16.62 14% 5-year growth rate 19% Beta 1.4 1.4\"><\/div><\/details><div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>Using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals, Yantra appears to be:<\/p><\/div>", "subj": "equity"}, {"n": 107, "q": "Using justified trailing price-to-cash flow ratio and dividend yield based on forecasted fundamentals, Yantra appears to be:", "opts": ["undervalued.", "overvalued.", "the results are mixed."], "ans": "C", "expl": "The price-to-cash flow multiple based on market data is 44.56 / 1.05 = 42.44. The dividend yield flow multiple based on market data is 0.76 / 44.56 = 1.7%. The intrinsic value of a company based on FCFE and the Gordon Growth Model is: FCFE₀×(1+g) V₀ = (r−g) To obtain the trailing justified price-to-cash flow; divide both sides of the equation by FCFE₀. We already have g and r inputs from prior computations: (1+g) P  1.072 | =  =  = 46.65 | CF  (r−g)  (0.095−0.072) Thus, the company appears undervalued based on this criterion as its market multiple of 42.44 is below the justified multiple of 46.65. Reciprocating the Gordon Growth Model, we obtain the formula for justified trailing dividend yield: (r−g) D₀ = P₀  (1+g) This is the reciprocal of the above P/CF ratio, so a shortcut computation would be: justified D/P = 1 / 46.65 = 2.1% The current dividend yield of 1.7% is below the justified dividend yield of 2.1% so, based on this criterion, the company appears overvalued (note that when price is on the numerator high multiple = undervalued).", "explhtml": "<p>The price-to-cash flow multiple based on market data is 44.56 / 1.05 = 42.44.<\/p><p>The dividend yield flow multiple based on market data is 0.76 / 44.56 = 1.7%.<\/p><p>The intrinsic value of a company based on FCFE and the Gordon Growth Model is:<\/p><p>FCFE<sub>0<\/sub>×(1+g)<\/p><p>V<sub>0<\/sub> =<\/p><p>(r−g)<\/p><p>To obtain the trailing justified price-to-cash flow; divide both sides of the equation by FCFE<sub>0<\/sub>. We already have g and r inputs from prior computations:<\/p><p>(1+g)<\/p><div class=\"tbl\"><table><tr><td>P<\/td><td>1.072<\/td><\/tr><tr><td>=<\/td><td>=<\/td><td>= 46.65<\/td><\/tr><tr><td>CF<\/td><td>(r−g)<\/td><td>(0.095−0.072)<\/td><\/tr><\/table><\/div><p>Thus, the company appears undervalued based on this criterion as its market multiple of 42.44 is below the justified multiple of 46.65.<\/p><p>Reciprocating the Gordon Growth Model, we obtain the formula for justified trailing dividend yield:<\/p><p>(r−g)<\/p><p>D<sub>0<\/sub><\/p><p>= P<sub>0<\/sub> &nbsp; (1+g)<\/p><p>This is the reciprocal of the above P/CF ratio, so a shortcut computation would be:<\/p><p>justified D/P = 1 / 46.65 = 2.1%<\/p><p>The current dividend yield of 1.7% is below the justified dividend yield of 2.1% so, based on this criterion, the company appears overvalued (note that when price is on the numerator high multiple = undervalued).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 105–110<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beyan Bautista, CFA, is a sell-side research analyst for a boutique UK investment house. One of the companies she is currently covering is Yantra Plc, a manufacturer of mid-range motorboats, primarily for river use. The company's shares closed at £44.56 on 15 January 20x4. Beyan uses the Treasury bond yield of 2.5% and an assumed market risk premium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda: &quot;operates in extremely cyclical industry&quot; Struma:\"><p>Tundzha: \"has very different cost structure to the rest of its peers\" Based on the highlighted points, she is deciding on the most appropriate candidate ratio for each of the above companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v030.webp\" style=\"max-width:min(100%,449px)\" alt=\"price-to-earnings or price-to-book Arda: normalized price-to-earnings or trailing price-to-sales Struma:\"><p>Tundzha: price-to-earnings or price-to-sales Beyan has also been recently tasked with covering Nanuk Ple and Nunca Ple, two close competitors developing innovative solutions for marine navigation. She has collected the following information on the two companies (the trailing cash flow per share is calculated as net income per share plus non-cash charges per share):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v031.webp\" style=\"max-width:min(100%,300px)\" alt=\"Nanuk Nunca Share price 64.00 38.00 9.11 4.52 Trailing CF per share\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v032.webp\" style=\"max-width:min(100%,300px)\" alt=\"P/CF 8.41 7.03 Trailing FCFE per share 3.11 3.85 P/FCFE 12.22 16.62 14% 5-year growth rate 19% Beta 1.4 1.4\"><\/div><\/details><div class=\"pp-topic\">Module 20.2, LOS 20.i<\/div><div class=\"qtext\"><p>Using justified trailing price-to-cash flow ratio and dividend yield based on forecasted fundamentals, Yantra appears to be:<\/p><\/div>", "subj": "equity"}, {"n": 108, "q": "If the appropriate adjustments to the five justified ratios are implemented following the launch of the new product line at Yantra, then:", "opts": ["all five ratios will decline.", "four ratios will decline.", "three ratios will decline."], "ans": "B", "expl": "Generally, most justified ratios suffer when the discount rate is increased and/or assumed growth rate decreased. However, the notable exception to this rule is justified dividend yield. Lower growth implies more earnings available for dividend payments. Higher cost of equity reduces share price, thus (maintaining a constant dollar dividend) the dividend yield increases.", "explhtml": "<p>Generally, most justified ratios suffer when the discount rate is increased and/or assumed growth rate decreased. However, the notable exception to this rule is justified dividend yield. Lower growth implies more earnings available for dividend payments. Higher cost of equity reduces share price, thus (maintaining a constant dollar dividend) the dividend yield increases.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 105–110<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beyan Bautista, CFA, is a sell-side research analyst for a boutique UK investment house. One of the companies she is currently covering is Yantra Plc, a manufacturer of mid-range motorboats, primarily for river use. The company's shares closed at £44.56 on 15 January 20x4. Beyan uses the Treasury bond yield of 2.5% and an assumed market risk premium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda: &quot;operates in extremely cyclical industry&quot; Struma:\"><p>Tundzha: \"has very different cost structure to the rest of its peers\" Based on the highlighted points, she is deciding on the most appropriate candidate ratio for each of the above companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v030.webp\" style=\"max-width:min(100%,449px)\" alt=\"price-to-earnings or price-to-book Arda: normalized price-to-earnings or trailing price-to-sales Struma:\"><p>Tundzha: price-to-earnings or price-to-sales Beyan has also been recently tasked with covering Nanuk Ple and Nunca Ple, two close competitors developing innovative solutions for marine navigation. She has collected the following information on the two companies (the trailing cash flow per share is calculated as net income per share plus non-cash charges per share):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v031.webp\" style=\"max-width:min(100%,300px)\" alt=\"Nanuk Nunca Share price 64.00 38.00 9.11 4.52 Trailing CF per share\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v032.webp\" style=\"max-width:min(100%,300px)\" alt=\"P/CF 8.41 7.03 Trailing FCFE per share 3.11 3.85 P/FCFE 12.22 16.62 14% 5-year growth rate 19% Beta 1.4 1.4\"><\/div><\/details><div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>If the appropriate adjustments to the five justified ratios are implemented following the launch of the new product line at Yantra, then:<\/p><\/div>", "subj": "equity"}, {"n": 109, "q": "In relation to Arda, Struma, and Tundzha, Beyan should opt for: Arda  Struma  Tundzha", "opts": ["P/B P/E norm P/E", "P/B P/S norm P/E", "P/E P/E P/S"], "ans": "A", "expl": "Arda is in financial hardship, which probably means the company has very low or even negative earnings rendering the P/E ratio meaningless. Struma operates in a very cyclical industry so earnings normalization is necessary to take into account the full impact of the business cycle. Taking the trailing price-to-sales ratio, (i.e., most recent twelve-month sales) would either inflate or deflate the ratio for a cyclical company depending on the stage of the cycle. Tundzha has a very different cost structure relative to its peer group. This indicates that the use of the price-to-sales ratio is not a good idea as that ratio completely ignores items below the sales line (i.e., ignores cross-sectional differences in profitability).", "explhtml": "<p>Arda is in financial hardship, which probably means the company has very low or even negative earnings rendering the P/E ratio meaningless.<\/p><p>Struma operates in a very cyclical industry so earnings normalization is necessary to take into account the full impact of the business cycle. Taking the trailing price-to-sales ratio, (i.e., most recent twelve-month sales) would either inflate or deflate the ratio for a cyclical company depending on the stage of the cycle.<\/p><p>Tundzha has a very different cost structure relative to its peer group. This indicates that the use of the price-to-sales ratio is not a good idea as that ratio completely ignores items below the sales line (i.e., ignores cross-sectional differences in profitability).<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 105–110<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beyan Bautista, CFA, is a sell-side research analyst for a boutique UK investment house. One of the companies she is currently covering is Yantra Plc, a manufacturer of mid-range motorboats, primarily for river use. The company's shares closed at £44.56 on 15 January 20x4. Beyan uses the Treasury bond yield of 2.5% and an assumed market risk premium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda: &quot;operates in extremely cyclical industry&quot; Struma:\"><p>Tundzha: \"has very different cost structure to the rest of its peers\" Based on the highlighted points, she is deciding on the most appropriate candidate ratio for each of the above companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v030.webp\" style=\"max-width:min(100%,449px)\" alt=\"price-to-earnings or price-to-book Arda: normalized price-to-earnings or trailing price-to-sales Struma:\"><p>Tundzha: price-to-earnings or price-to-sales Beyan has also been recently tasked with covering Nanuk Ple and Nunca Ple, two close competitors developing innovative solutions for marine navigation. She has collected the following information on the two companies (the trailing cash flow per share is calculated as net income per share plus non-cash charges per share):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v031.webp\" style=\"max-width:min(100%,300px)\" alt=\"Nanuk Nunca Share price 64.00 38.00 9.11 4.52 Trailing CF per share\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v032.webp\" style=\"max-width:min(100%,300px)\" alt=\"P/CF 8.41 7.03 Trailing FCFE per share 3.11 3.85 P/FCFE 12.22 16.62 14% 5-year growth rate 19% Beta 1.4 1.4\"><\/div><\/details><div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>In relation to Arda, Struma, and Tundzha, Beyan should opt for: Arda &nbsp; Struma &nbsp; Tundzha<\/p><\/div>", "subj": "equity"}, {"n": 110, "q": "In relation to the companies in the marine navigation sector, Nunca is:", "opts": ["undervalued relative to Nanuk.", "overvalued relative to Nanuk.", "trading at premium due to its superior fundamentals."], "ans": "C", "expl": "First, note that computing \"cash flow\" as net income plus non-cash charges is suboptimal and should not be trusted; especially if a superior metric such as price-to- FCFE is present. Therefore, despite the fact, Nunca has a lower price-to-cash flow ratio; this is unlikely to be a reason to invest, especially as it is in contradiction to the superior price-to- FCFE ratio. Controlling for risk (i.e., companies have the same beta), we note that Nunca has a higher five-year estimated growth rate but also higher P/FCFE multiple. The company is therefore not necessarily either under or overvalued relative to its competitor (based on the limited information presented in the table), but it is certainly trading at a premium (i.e., trading at a higher multiple) due to its higher growth forecast.", "explhtml": "<p>First, note that computing &quot;cash flow&quot; as net income plus non-cash charges is suboptimal and should not be trusted; especially if a superior metric such as price-to- FCFE is present.<\/p><p>Therefore, despite the fact, Nunca has a lower price-to-cash flow ratio; this is unlikely to be a reason to invest, especially as it is in contradiction to the superior price-to- FCFE ratio.<\/p><p>Controlling for risk (i.e., companies have the same beta), we note that Nunca has a higher five-year estimated growth rate but also higher P/FCFE multiple. The company is therefore not necessarily either under or overvalued relative to its competitor (based on the limited information presented in the table), but it is certainly trading at a premium (i.e., trading at a higher multiple) due to its higher growth forecast.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 105–110<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beyan Bautista, CFA, is a sell-side research analyst for a boutique UK investment house. One of the companies she is currently covering is Yantra Plc, a manufacturer of mid-range motorboats, primarily for river use. The company's shares closed at £44.56 on 15 January 20x4. Beyan uses the Treasury bond yield of 2.5% and an assumed market risk premium of 5% when calculating justified ratios based on forecasted fundamentals.<\/p><p>She would first like to calculate Yantra's normalized price-to-earnings ratio over the period 20×0 to 20x3 via the following two methods:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v026.webp\" style=\"max-width:min(100%,280px)\" alt=\"• Method 1 - historical average EPS • Method 2 - average return on equity\"><p>The following table summarizes selected historical data for Yantra Plc. AlI GBP figures are quoted on a per-share basis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v027.webp\" style=\"max-width:min(100%,326px)\" alt=\"20x0 20x1 20x2 20x3 £32.44 Sales Earnings £1.57 £2.16 £3.24 £1.89 £0.76 Dividends £1.05 FCFE\"><p>Book value £10.56 £11.88 £14.21 £15.69<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v028.webp\" style=\"max-width:min(100%,326px)\" alt=\"14.9% 18.2% 22.8% 12.0% ROE Beta 1.40\"><p>Beyan would like to value Yantra using justified trailing price-to-sales and price-to-book ratios based on forecasted fundamentals. She bases the inputs on the most recent data (i.e., 20x3).<\/p><p>Finally, she would like to conclude her valuation by analyzing the justified trailing price- to-cash flow and justified trailing dividend yield metrics. As above, where needed, 20x3 data is used to develop the inputs. Beyan assumes cash flows are growing at a constant rate. Given the recent lukewarm reception of a new product line at Yantra geared at ocean use, Beyan is considering increasing the cost of equity and reducing the growth rate in her models. She is considering what impact this might have on justified ratios based on forecasted fundamentals such as P/E, P/B, P/S, P/CF, D/P.<\/p><p>Beyan would also like to apply multiples analysis to three of Yantra's closest competitors—Arda, Struma, and Tundzha. Having read the MD&amp;A of the annual reports of each company, she has highlighted the following points:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v029.webp\" style=\"max-width:min(100%,511px)\" alt=\"&quot;is in financial hardship due to a recent downturn in its sector&quot; Arda: &quot;operates in extremely cyclical industry&quot; Struma:\"><p>Tundzha: \"has very different cost structure to the rest of its peers\" Based on the highlighted points, she is deciding on the most appropriate candidate ratio for each of the above companies:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v030.webp\" style=\"max-width:min(100%,449px)\" alt=\"price-to-earnings or price-to-book Arda: normalized price-to-earnings or trailing price-to-sales Struma:\"><p>Tundzha: price-to-earnings or price-to-sales Beyan has also been recently tasked with covering Nanuk Ple and Nunca Ple, two close competitors developing innovative solutions for marine navigation. She has collected the following information on the two companies (the trailing cash flow per share is calculated as net income per share plus non-cash charges per share):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v031.webp\" style=\"max-width:min(100%,300px)\" alt=\"Nanuk Nunca Share price 64.00 38.00 9.11 4.52 Trailing CF per share\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v032.webp\" style=\"max-width:min(100%,300px)\" alt=\"P/CF 8.41 7.03 Trailing FCFE per share 3.11 3.85 P/FCFE 12.22 16.62 14% 5-year growth rate 19% Beta 1.4 1.4\"><\/div><\/details><div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>In relation to the companies in the marine navigation sector, Nunca is:<\/p><\/div>", "subj": "equity"}, {"n": 111, "q": "Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 38 while the median leading P/E of a peer group of companies within the industry is 28. Based on the method of comparables, an analyst would most likely conclude that PTI should be:", "opts": ["sold or sold short as an overvalued stock.", "viewed as a properly valued stock.", "bought as an undervalued stock."], "ans": "A", "expl": "The price per dollar of earnings is considerably higher than that for the median of the peer group, which implies that it may well be overvalued.", "explhtml": "<p>The price per dollar of earnings is considerably higher than that for the median of the peer group, which implies that it may well be overvalued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Proprietary Technologies, Inc., (PTI) has a leading price-to-earnings (P/E) ratio of 38 while the median leading P/E of a peer group of companies within the industry is 28. Based on the method of comparables, an analyst would most likely conclude that PTI should be:<\/p><\/div>", "subj": "equity"}, {"n": 112, "q": "Earnings before interest, taxes, depreciation, and amortization (EBITDA) is best suited as a measure of:", "opts": ["total company value.", "debt capacity.", "equity value."], "ans": "A", "expl": "EBITDA is a pre-tax, pre-interest measure, which represents a flow to both equity and debt. Thus, it is better suited as an indicator of total company value than just equity value.", "explhtml": "<p>EBITDA is a pre-tax, pre-interest measure, which represents a flow to both equity and debt. Thus, it is better suited as an indicator of total company value than just equity value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.n<\/div><div class=\"qtext\"><p>Earnings before interest, taxes, depreciation, and amortization (EBITDA) is best suited as a measure of:<\/p><\/div>", "subj": "equity"}, {"n": 113, "q": "Enhanced Systems, Inc., (ESI) has a leading price to sales (P/S) of 0.18 while the median leading P/S of a peer group of companies within the industry is 0.10. Based on the method of comparables, an analyst would most likely conclude that ESI should be:", "opts": ["sold or sold short as an overvalued stock.", "bought as an undervalued stock.", "bought on margin as an undervalued stock."], "ans": "A", "expl": "The price per dollar of sales is considerably higher than that for the median of the peer group, which implies that it may well be overvalued.", "explhtml": "<p>The price per dollar of sales is considerably higher than that for the median of the peer group, which implies that it may well be overvalued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Enhanced Systems, Inc., (ESI) has a leading price to sales (P/S) of 0.18 while the median leading P/S of a peer group of companies within the industry is 0.10. Based on the method of comparables, an analyst would most likely conclude that ESI should be:<\/p><\/div>", "subj": "equity"}, {"n": 114, "q": "What is the appropriate price-to-sales (P/S) multiple of a stock that has a retention ratio of 45%, a return on equity (ROE) of 14%, an earnings per share (EPS) of $5.25, sales per share of $245.54, an expected growth rate in dividends and earnings of 6.5%, and shareholders require a return of 11% on their investment?", "opts": ["0.278.", "0.227.", "0.158."], "ans": "A", "expl": "Recall that profit margin is measured as E₀ / S₀. In this example, the profit margin is (5.25 / 245.54) = 0.0214. Thus: P₀ / S₀ = [(E₀ / S₀)(1 − b)(1 + g)] / (r − g) = [0.0214(0.55)(1.065)] / (0.11 − 0.065) = 0.278", "explhtml": "<p>Recall that profit margin is measured as E<sub>0<\/sub> / S<sub>0<\/sub>. In this example, the profit margin is (5.25 / 245.54) = 0.0214. Thus:<\/p><p>P<sub>0<\/sub> / S<sub>0<\/sub> = [(E<sub>0<\/sub> / S<sub>0<\/sub>)(1 − b)(1 + g)] / (r − g) = [0.0214(0.55)(1.065)] / (0.11 − 0.065) = 0.278<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>What is the appropriate price-to-sales (P/S) multiple of a stock that has a retention ratio of 45%, a return on equity (ROE) of 14%, an earnings per share (EPS) of $5.25, sales per share of $245.54, an expected growth rate in dividends and earnings of 6.5%, and shareholders require a return of 11% on their investment?<\/p><\/div>", "subj": "equity"}, {"n": 115, "q": "Enhanced Systems, Inc., has a price to book value (P/B) of five while the median P/B of a peer group of companies within the industry is five. Based on the method of comparables, an analyst would most likely conclude that ESI should be:", "opts": ["sold or sold short as an overvalued stock.", "bought as an undervalued stock.", "viewed as a properly valued stock."], "ans": "C", "expl": "The price per dollar of book value is the same as that for the median of the peer group, which implies that it is likely properly valued.", "explhtml": "<p>The price per dollar of book value is the same as that for the median of the peer group, which implies that it is likely properly valued.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.m<\/div><div class=\"qtext\"><p>Enhanced Systems, Inc., has a price to book value (P/B) of five while the median P/B of a peer group of companies within the industry is five. Based on the method of comparables, an analyst would most likely conclude that ESI should be:<\/p><\/div>", "subj": "equity"}, {"n": 116, "q": "Good Sports, Inc., (GSI) has a leading price-to-earnings (P/E) ratio of 12.75 and a 5-year consensus growth rate forecast of 8.5%. What is the firm's P/E to growth (PEG) ratio?", "opts": ["0.67.", "1.50.", "150.00."], "ans": "B", "expl": "The firm's PEG is 12.75 / 8.50 = 1.50.", "explhtml": "<p>The firm&#x27;s PEG is 12.75 / 8.50 = 1.50.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.j<\/div><div class=\"qtext\"><p>Good Sports, Inc., (GSI) has a leading price-to-earnings (P/E) ratio of 12.75 and a 5-year consensus growth rate forecast of 8.5%. What is the firm&#x27;s P/E to growth (PEG) ratio?<\/p><\/div>", "subj": "equity"}, {"n": 117, "q": "What is the appropriate justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 40% if shareholders require a return of 15% on their investment and the expected growth rate in dividends is 5%?", "opts": ["4.20.", "3.80.", "6.30."], "ans": "A", "expl": "P₀/E₀ = (0.40 × 1.05) / (0.15 – 0.05) = 4.20", "explhtml": "<p>P<sub>0<\/sub>/E<sub>0<\/sub> = (0.40 × 1.05) / (0.15 – 0.05) = 4.20<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>What is the appropriate justified trailing price-to-earnings (P/E) multiple of a stock that has a payout ratio of 40% if shareholders require a return of 15% on their investment and the expected growth rate in dividends is 5%?<\/p><\/div>", "subj": "equity"}, {"n": 118, "q": "An argument against using the price-to-earnings (P/E) valuation approach is that:", "opts": ["research shows that P/E differences are significantly related to long-run average stock returns.", "earnings can be negative.", "earnings power is the primary determinant of investment value."], "ans": "B", "expl": "Negative earnings render the P/E ratio useless. Both remaining factors increase the usefulness of the P/E approach.", "explhtml": "<p>Negative earnings render the P/E ratio useless. Both remaining factors increase the usefulness of the P/E approach.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.c<\/div><div class=\"qtext\"><p>An argument against using the price-to-earnings (P/E) valuation approach is that:<\/p><\/div>", "subj": "equity"}, {"n": 119, "q": "Which of the following statements about cyclical firms is least accurate?", "opts": ["The problems encountered when using the price-to-earnings (P/E) multiples of cyclical firms can be completely eliminated by using average or normalized earnings.", "Cyclical firms have volatile earnings, and their price-to-earnings (P/E) multiple is not very useful for valuation.", "The price-to-earnings (P/E) multiple of a cyclical firm normally peaks at the depths of recession and bottoms out at the peak of economic boom."], "ans": "A", "expl": "The P/E multiples for cyclical firms are not very useful for valuation. Earnings will follow the economy, and prices will reflect expectations about the future. Thus, most of the time, the P/E multiple of a cyclical firm will peak at the depths of recession and bottom out at the peak of an economic boom. This problem can be minimized to some extent by using average or normalized earnings but will not be eliminated completely.", "explhtml": "<p>The P/E multiples for cyclical firms are not very useful for valuation. Earnings will follow the economy, and prices will reflect expectations about the future. Thus, most of the time, the P/E multiple of a cyclical firm will peak at the depths of recession and bottom out at the peak of an economic boom. This problem can be minimized to some extent by using average or normalized earnings but will not be eliminated completely.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.e<\/div><div class=\"qtext\"><p>Which of the following statements about cyclical firms is least accurate?<\/p><\/div>", "subj": "equity"}, {"n": 120, "q": "Shares of TKR Construction (TKR) are selling for $50. Earnings for the last 12 months were $4.00 per share. The average trailing P/E ratio for firms in TKR's industry is 15. The appropriate WACC is 12%, and the risk-free rate is 8%. Assume a growth rate of 0%. Using the method of comparables, what price is indicated for TKR?", "opts": ["$60.00.", "$33.33.", "$50.00."], "ans": "A", "expl": "Using the method of comparables, TKR should be priced as (15 × 4) = $60.00.", "explhtml": "<p>Using the method of comparables, TKR should be priced as (15 × 4) = $60.00.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>Shares of TKR Construction (TKR) are selling for $50. Earnings for the last 12 months were $4.00 per share. The average trailing P/E ratio for firms in TKR&#x27;s industry is 15. The appropriate WACC is 12%, and the risk-free rate is 8%. Assume a growth rate of 0%. Using the method of comparables, what price is indicated for TKR?<\/p><\/div>", "subj": "equity"}, {"n": 121, "q": "The trailing price-to-earnings (P/E) ratio is defined as:", "opts": ["price to most recent earnings.", "the average P/E over the last five years.", "price to next period's expected earnings."], "ans": "A", "expl": "The trailing P/E ratio is price to most recent realized earnings.", "explhtml": "<p>The trailing P/E ratio is price to most recent realized earnings.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.d<\/div><div class=\"qtext\"><p>The trailing price-to-earnings (P/E) ratio is defined as:<\/p><\/div>", "subj": "equity"}, {"n": 122, "q": "At a CFA society function, Robert Chan comments to Li Chiao that Xanedu Industries' expected dividend growth rate is 5.5%, dividend payout ratio (g) is 40%, and required return on equity (r) is 12%. Based on a justified leading P/E ratio compared to an actual P/E ratio of 8.0, Xanedu Industries is most likely:", "opts": ["undervalued.", "overvalued.", "correctly valued."], "ans": "B", "expl": "Justified Leading P/E = payout ratio / (r − g). When the expected dividend growth is 5.5%, the justified leading P/E = 0.40 / (0.12 − 0.055) = 6.15. This is less than the actual (based on current market price) P/E of 8.0.", "explhtml": "<p>Justified Leading P/E = payout ratio / (r − g). When the expected dividend growth is 5.5%, the justified leading P/E = 0.40 / (0.12 − 0.055) = 6.15. This is less than the actual (based on current market price) P/E of 8.0.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.l<\/div><div class=\"qtext\"><p>At a CFA society function, Robert Chan comments to Li Chiao that Xanedu Industries&#x27; expected dividend growth rate is 5.5%, dividend payout ratio (g) is 40%, and required return on equity (r) is 12%. Based on a justified leading P/E ratio compared to an actual P/E ratio of 8.0, Xanedu Industries is most likely:<\/p><\/div>", "subj": "equity"}, {"n": 123, "q": "Which of the following statements about the method of comparables in price multiple valuation is CORRECT?", "opts": ["It values an asset relative to a benchmark value of the multiple.", "It relates multiples to company fundamentals using a discounted cash flow (DCF) model.", "It assumes that cash flows are related to fundamentals."], "ans": "A", "expl": "The method of comparables involves using a price multiple to evaluate whether an asset is valued properly relative to a benchmark value of the multiple. It makes no explicit assumptions about fundamentals and does not rely on a DCF model.", "explhtml": "<p>The method of comparables involves using a price multiple to evaluate whether an asset is valued properly relative to a benchmark value of the multiple. It makes no explicit assumptions about fundamentals and does not rely on a DCF model.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.1, LOS 20.a<\/div><div class=\"qtext\"><p>Which of the following statements about the method of comparables in price multiple valuation is CORRECT?<\/p><\/div>", "subj": "equity"}, {"n": 124, "q": "What is the appropriate leading price-to-earnings (P/E) multiple of a stock that has a projected payout ratio of 40% if shareholders require a return of 15% on their investment and the expected growth rate in dividends is 5%?", "opts": ["13.20.", "6.30.", "4.00."], "ans": "C", "expl": "Justified leading P/E = P₀/E₁ = (1– b) / (r– g) = 0.40 / (0.15 – 0.05) = 4.00 Note that the leading P/E omits (1 + g) in the numerator, which is present in the formula for the trailing P/E.", "explhtml": "<p>Justified leading P/E = P<sub>0<\/sub>/E<sub>1<\/sub> = (1– b) / (r– g) = 0.40 / (0.15 – 0.05) = 4.00<\/p><p>Note that the leading P/E omits (1 + g) in the numerator, which is present in the formula for the trailing P/E.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.i<\/div><div class=\"qtext\"><p>What is the appropriate leading price-to-earnings (P/E) multiple of a stock that has a projected payout ratio of 40% if shareholders require a return of 15% on their investment and the expected growth rate in dividends is 5%?<\/p><\/div>", "subj": "equity"}, {"n": 125, "q": "An analyst gathered the following data for TRK Construction [all amounts in Swiss francs (Sf)]: Recent share price Sf 22.00 Shares outstanding 40 million Market value of debt Sf 140 million Cash and marketable securities Sf 55 million Investments Sf 300 million Net income Sf 140 million Interest expense Sf 7 million Depreciation and amortization Sf 10 million Taxes Sf 56 million The EV/EBITDA ratio for TRK Construction is closest to:", "opts": ["3.49x.", "2.52x.", "3.12x."], "ans": "C", "expl": "EBITDA = (net income + interest + taxes + depreciation / amortization) EV = (market value of common stock + market value of debt – cash and investments) EBITDA = 140 + 7 + 10 + 56 = Sf 213 million EV = (22 × 40) + 140 – 55 – 300 = Sf 665 million EV / EBITDA = 3.12", "explhtml": "<p>EBITDA = (net income + interest + taxes + depreciation / amortization)<\/p><p>EV = (market value of common stock + market value of debt – cash and investments)<\/p><p>EBITDA = 140 + 7 + 10 + 56 = Sf 213 million<\/p><p>EV = (22 × 40) + 140 – 55 – 300 = Sf 665 million<\/p><p>EV / EBITDA = 3.12<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.o<\/div><div class=\"qtext\"><p>An analyst gathered the following data for TRK Construction [all amounts in Swiss francs (Sf)]:<\/p><div class=\"tbl\"><table><tr><td>Recent share price<\/td><td>Sf 22.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>40 million<\/td><\/tr><tr><td>Market value of debt<\/td><td>Sf 140 million<\/td><\/tr><tr><td>Cash and marketable securities<\/td><td>Sf 55 million<\/td><\/tr><tr><td>Investments<\/td><td>Sf 300 million<\/td><\/tr><tr><td>Net income<\/td><td>Sf 140 million<\/td><\/tr><tr><td>Interest expense<\/td><td>Sf 7 million<\/td><\/tr><tr><td>Depreciation and amortization<\/td><td>Sf 10 million<\/td><\/tr><tr><td>Taxes<\/td><td>Sf 56 million<\/td><\/tr><\/table><\/div><p>The EV/EBITDA ratio for TRK Construction is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 126, "q": "An analyst gathers the following information for ABC Industries: Market Value of Debt $110 million Market Value of Equity $90 million Book Value of Debt $100 million Book Value of Equity $50 million EBITDA $75 million The EV/EBITDA is closest to:", "opts": ["2.00.", "2.13.", "2.67."], "ans": "C", "expl": "EV uses market values for debt and equity. (110 + 90) / 75 = 2.67.", "explhtml": "<p>EV uses market values for debt and equity. (110 + 90) / 75 = 2.67.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.o<\/div><div class=\"qtext\"><p>An analyst gathers the following information for ABC Industries:<\/p><div class=\"tbl\"><table><tr><td>Market Value of Debt<\/td><td>$110 million<\/td><\/tr><tr><td>Market Value of Equity<\/td><td>$90 million<\/td><\/tr><tr><td>Book Value of Debt<\/td><td>$100 million<\/td><\/tr><tr><td>Book Value of Equity<\/td><td>$50 million<\/td><\/tr><tr><td>EBITDA<\/td><td>$75 million<\/td><\/tr><\/table><\/div><p>The EV/EBITDA is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 127, "q": "Which of the following are advantages of using EV/EBITDA?", "opts": ["EBITDA is useful for valuing capital-intensive businesses with high levels of depreciation and amortization.", "If working capital is growing, EBITDA will be larger than CFO.", "EV/EBITDA ignores how different revenue recognition policies affect CFO."], "ans": "A", "expl": "EBITDA is useful for valuing capital-intensive businesses with high levels of depreciation and amortization. The other statements are disadvantages to using EV/EBITDA.", "explhtml": "<p>EBITDA is useful for valuing capital-intensive businesses with high levels of depreciation and amortization. The other statements are disadvantages to using EV/EBITDA.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.o<\/div><div class=\"qtext\"><p>Which of the following are advantages of using EV/EBITDA?<\/p><\/div>", "subj": "equity"}, {"n": 128, "q": "A decrease in the earnings retention rate will cause a price-to-sales (P/S) multiple to:", "opts": ["increase.", "remain the same.", "decrease."], "ans": "A", "expl": "A decrease in the earnings retention rate will increase the following expression for P/S due to the implied increase in the payout ratio, which is (1 – b): P₀ / S₀ = [(E₀ / S₀) (1 – b)(1 + g)] / (r – g) Note that the topic review does not allow for any interactive relationship between retention and growth. Thus, no explicit consideration is given to whether the increase in the payout ratio will cause an offsetting decrease in growth.", "explhtml": "<p>A decrease in the earnings retention rate will increase the following expression for P/S due to the implied increase in the payout ratio, which is (1 – b):<\/p><p>P<sub>0<\/sub> / S<sub>0<\/sub> = [(E<sub>0<\/sub> / S<sub>0<\/sub>) (1 – b)(1 + g)] / (r – g)<\/p><p>Note that the topic review does not allow for any interactive relationship between retention and growth. Thus, no explicit consideration is given to whether the increase in the payout ratio will cause an offsetting decrease in growth.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.3, LOS 20.g<\/div><div class=\"qtext\"><p>A decrease in the earnings retention rate will cause a price-to-sales (P/S) multiple to:<\/p><\/div>", "subj": "equity"}, {"n": 129, "q": "The net impact of an increase in payout ratio on price-to-book value (PBV) ratio cannot be determined because it might also:", "opts": ["decrease the market value of the firm.", "decrease required rate of return.", "decrease expected growth."], "ans": "C", "expl": "If payout increases, the growth of the firm may slow down, because internally generated funds are not being invested in new, profitable projects. Hence, the net impact on the PBV ratio from change in payout ratio cannot be determined.", "explhtml": "<p>If payout increases, the growth of the firm may slow down, because internally generated funds are not being invested in new, profitable projects. Hence, the net impact on the PBV ratio from change in payout ratio cannot be determined.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>The net impact of an increase in payout ratio on price-to-book value (PBV) ratio cannot be determined because it might also:<\/p><\/div>", "subj": "equity"}, {"n": 130, "q": "All other variables held constant, the justified price-to-book multiple will decrease with a decrease in:", "opts": ["required rate of return.", "payout ratio.", "expected growth rate."], "ans": "C", "expl": "All other variables held constant, a decrease in expected growth rate will result in a decrease in the justified price-to-book multiple.", "explhtml": "<p>All other variables held constant, a decrease in expected growth rate will result in a decrease in the justified price-to-book multiple.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.2, LOS 20.g<\/div><div class=\"qtext\"><p>All other variables held constant, the justified price-to-book multiple will decrease with a decrease in:<\/p><\/div>", "subj": "equity"}, {"n": 131, "q": "Bernheim's investment bankers have determined the value of Country Point to be $162.6 million. As part of the spin-off, Beachwood issued to its common shareholders two shares in Country Point for each Beachwood share that its current shareholders held. The appropriate initial offering price per share of the shares that Beachwood's shareholders receive is closest to:", "opts": ["$16.26.", "$14.45.", "$32.50."], "ans": "A", "expl": "Since the shareholders receive two shares for every share they currently hold, each Beachwood common shareholder will receive two common shares of Country Point. At December 31, 2013, Beachwood had 5 million shares. Therefore, 10 million common shares were issued for the spin-off. The spin-off was valued at $162.6 million; dividing by 10 million, we arrive at a spin-off value per share of $16.26 (= $162.6 million / 10 million).", "explhtml": "<p>Since the shareholders receive two shares for every share they currently hold, each Beachwood common shareholder will receive two common shares of Country Point. At December 31, 2013, Beachwood had 5 million shares. Therefore, 10 million common shares were issued for the spin-off. The spin-off was valued at $162.6 million; dividing by 10 million, we arrive at a spin-off value per share of $16.26 (= $162.6 million / 10 million).<\/p>", "qhtml": "<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 131–134<\/summary><div class=\"vig-body\"><p>Beachwood Builders merged with Country Point Homes on December 31, 2003. Both companies were builders of mid-scale and luxury homes in their respective markets. On December 31, 2013, because of tax considerations and the need to segment the businesses between mid-scale and luxury homes, Beachwood decided to spin-off Country Point, its luxury home subsidiary, to its common shareholders. Beachwood retained Bernheim Securities to value the spin-off of Country Point to its shareholders.<\/p><p>The following information is available to Bernheim's investment bankers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v033.webp\" style=\"max-width:min(100%,636px)\" alt=\"• Country Point&#x27;s allocated common equity was $55.6 million as of December 31, 2013. • Beachwood paid no dividends and has no preferred shareholders. • Country Point&#x27;s free cash flow (FCF) is expected to grow 7% after 2017. • The current risk-free rate is 6%. The market risk premium is 11%. • Beachwood Builders had 5 million common shares as of December 31, 2013. • Country Point&#x27;s cost of capital is equal to its return on equity at year-end (rounded to the nearest percentage point). • Country Point did not have any long-term debt allocated from Beachwood.\"><p>The following data for Country Point is also available for analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v034.webp\" style=\"max-width:min(100%,667px)\" alt=\"2016(E) 2015(E) 2017(E) 2014(E) 2013 $ (in millions) 25 15 30 10 20 Net Income Depreciation 5 6 5 5 6 Change in Capital 12 10 7 9 8 Expenditures Change in Working Capital\"><p>There are three comparable companies in Country Point's peer group: Upscale Homes, Custom Estates and Chateau One.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v035.webp\" style=\"max-width:min(100%,666px)\" alt=\"Five-Year EPS Growth Forward PEG Forward P/E Company Forecast Upscale Homes 10.0 12.5% 0.80 15.0% 15.0 1.00 Custom Estates Chateau One 1.14 17.5% 20.0\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Bernheim&#x27;s investment bankers have determined the value of Country Point to be $162.6 million. As part of the spin-off, Beachwood issued to its common shareholders two shares in Country Point for each Beachwood share that its current shareholders held. The appropriate initial offering price per share of the shares that Beachwood&#x27;s shareholders receive is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 132, "q": "Immediately after the spin-off, Country Point's book value per share is closest to:", "opts": ["$11.12.", "$16.25.", "$5.56."], "ans": "C", "expl": "The allocated common equity or book value of Country Point was $55.6 million at year-end 2013 and 10 million shares were allocated for the spin-off. The book value would be $55.6 million / 10 million = $5.56 per share.", "explhtml": "<p>The allocated common equity or book value of Country Point was $55.6 million at year-end 2013 and 10 million shares were allocated for the spin-off. The book value would be $55.6 million / 10 million = $5.56 per share.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 131–134<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beachwood Builders merged with Country Point Homes on December 31, 2003. Both companies were builders of mid-scale and luxury homes in their respective markets. On December 31, 2013, because of tax considerations and the need to segment the businesses between mid-scale and luxury homes, Beachwood decided to spin-off Country Point, its luxury home subsidiary, to its common shareholders. Beachwood retained Bernheim Securities to value the spin-off of Country Point to its shareholders.<\/p><p>The following information is available to Bernheim's investment bankers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v033.webp\" style=\"max-width:min(100%,636px)\" alt=\"• Country Point&#x27;s allocated common equity was $55.6 million as of December 31, 2013. • Beachwood paid no dividends and has no preferred shareholders. • Country Point&#x27;s free cash flow (FCF) is expected to grow 7% after 2017. • The current risk-free rate is 6%. The market risk premium is 11%. • Beachwood Builders had 5 million common shares as of December 31, 2013. • Country Point&#x27;s cost of capital is equal to its return on equity at year-end (rounded to the nearest percentage point). • Country Point did not have any long-term debt allocated from Beachwood.\"><p>The following data for Country Point is also available for analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v034.webp\" style=\"max-width:min(100%,667px)\" alt=\"2016(E) 2015(E) 2017(E) 2014(E) 2013 $ (in millions) 25 15 30 10 20 Net Income Depreciation 5 6 5 5 6 Change in Capital 12 10 7 9 8 Expenditures Change in Working Capital\"><p>There are three comparable companies in Country Point's peer group: Upscale Homes, Custom Estates and Chateau One.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v035.webp\" style=\"max-width:min(100%,666px)\" alt=\"Five-Year EPS Growth Forward PEG Forward P/E Company Forecast Upscale Homes 10.0 12.5% 0.80 15.0% 15.0 1.00 Custom Estates Chateau One 1.14 17.5% 20.0\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Immediately after the spin-off, Country Point&#x27;s book value per share is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 133, "q": "Assume for this question that the initial offering price per share of the Country Point shares is $16.26. Based on this initial offering price of the spin-off, the estimated price-to-book (P/B) ratio of Country Point is closest to:", "opts": ["1.46 times.", "2.92 times.", "2.00 times."], "ans": "B", "expl": "The P/B ratio is determined by taking the spin-off price and dividing it by the book value per share (BVPS). Hence, the ratio is $16.26 per share spin-off price / $5.56 BVPS = 2.92 × book.", "explhtml": "<p>The P/B ratio is determined by taking the spin-off price and dividing it by the book value per share (BVPS). Hence, the ratio is $16.26 per share spin-off price / $5.56 BVPS = 2.92 × book.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 131–134<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beachwood Builders merged with Country Point Homes on December 31, 2003. Both companies were builders of mid-scale and luxury homes in their respective markets. On December 31, 2013, because of tax considerations and the need to segment the businesses between mid-scale and luxury homes, Beachwood decided to spin-off Country Point, its luxury home subsidiary, to its common shareholders. Beachwood retained Bernheim Securities to value the spin-off of Country Point to its shareholders.<\/p><p>The following information is available to Bernheim's investment bankers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v033.webp\" style=\"max-width:min(100%,636px)\" alt=\"• Country Point&#x27;s allocated common equity was $55.6 million as of December 31, 2013. • Beachwood paid no dividends and has no preferred shareholders. • Country Point&#x27;s free cash flow (FCF) is expected to grow 7% after 2017. • The current risk-free rate is 6%. The market risk premium is 11%. • Beachwood Builders had 5 million common shares as of December 31, 2013. • Country Point&#x27;s cost of capital is equal to its return on equity at year-end (rounded to the nearest percentage point). • Country Point did not have any long-term debt allocated from Beachwood.\"><p>The following data for Country Point is also available for analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v034.webp\" style=\"max-width:min(100%,667px)\" alt=\"2016(E) 2015(E) 2017(E) 2014(E) 2013 $ (in millions) 25 15 30 10 20 Net Income Depreciation 5 6 5 5 6 Change in Capital 12 10 7 9 8 Expenditures Change in Working Capital\"><p>There are three comparable companies in Country Point's peer group: Upscale Homes, Custom Estates and Chateau One.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v035.webp\" style=\"max-width:min(100%,666px)\" alt=\"Five-Year EPS Growth Forward PEG Forward P/E Company Forecast Upscale Homes 10.0 12.5% 0.80 15.0% 15.0 1.00 Custom Estates Chateau One 1.14 17.5% 20.0\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Assume for this question that the initial offering price per share of the Country Point shares is $16.26. Based on this initial offering price of the spin-off, the estimated price-to-book (P/B) ratio of Country Point is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 134, "q": "Based on Bernheim's careful analysis, firms comparable to Country Point trade at a P/B ratio of 3.5 times. The expected price per share of the spin-off based on this P/B ratio and assuming a liquid and efficient market for Country Point's common shares is closest to:", "opts": ["$56.88.", "$38.92.", "$19.46."], "ans": "C", "expl": "Based on the comparable P/B ratio of 3.5 times, we can simply multiply the book value of $5.56 by 3.5 to arrive at $19.46.", "explhtml": "<p>Based on the comparable P/B ratio of 3.5 times, we can simply multiply the book value of $5.56 by 3.5 to arrive at $19.46.<\/p>", "qhtml": "<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Item set · Câu 131–134<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Beachwood Builders merged with Country Point Homes on December 31, 2003. Both companies were builders of mid-scale and luxury homes in their respective markets. On December 31, 2013, because of tax considerations and the need to segment the businesses between mid-scale and luxury homes, Beachwood decided to spin-off Country Point, its luxury home subsidiary, to its common shareholders. Beachwood retained Bernheim Securities to value the spin-off of Country Point to its shareholders.<\/p><p>The following information is available to Bernheim's investment bankers:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v033.webp\" style=\"max-width:min(100%,636px)\" alt=\"• Country Point&#x27;s allocated common equity was $55.6 million as of December 31, 2013. • Beachwood paid no dividends and has no preferred shareholders. • Country Point&#x27;s free cash flow (FCF) is expected to grow 7% after 2017. • The current risk-free rate is 6%. The market risk premium is 11%. • Beachwood Builders had 5 million common shares as of December 31, 2013. • Country Point&#x27;s cost of capital is equal to its return on equity at year-end (rounded to the nearest percentage point). • Country Point did not have any long-term debt allocated from Beachwood.\"><p>The following data for Country Point is also available for analysis:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v034.webp\" style=\"max-width:min(100%,667px)\" alt=\"2016(E) 2015(E) 2017(E) 2014(E) 2013 $ (in millions) 25 15 30 10 20 Net Income Depreciation 5 6 5 5 6 Change in Capital 12 10 7 9 8 Expenditures Change in Working Capital\"><p>There are three comparable companies in Country Point's peer group: Upscale Homes, Custom Estates and Chateau One.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/kq/r20/v035.webp\" style=\"max-width:min(100%,666px)\" alt=\"Five-Year EPS Growth Forward PEG Forward P/E Company Forecast Upscale Homes 10.0 12.5% 0.80 15.0% 15.0 1.00 Custom Estates Chateau One 1.14 17.5% 20.0\"><\/div><\/details><div class=\"pp-topic\">Module 20.4, LOS 20.c<\/div><div class=\"qtext\"><p>Based on Bernheim&#x27;s careful analysis, firms comparable to Country Point trade at a P/B ratio of 3.5 times. The expected price per share of the spin-off based on this P/B ratio and assuming a liquid and efficient market for Country Point&#x27;s common shares is closest to:<\/p><\/div>", "subj": "equity"}, {"n": 135, "q": "A common justification for using earnings yields in valuation is that:", "opts": ["earnings are more stable than dividends.", "earnings are usually greater than free cash flows.", "negative earnings render P/E ratios meaningless and prices are never negative."], "ans": "C", "expl": "Negative earnings render P/E ratios meaningless. In such cases, it is common to use normalized earnings per share (EPS) and/or restate the ratio as the earnings yield or E/P because price is never negative. Price to earnings (P/E) ranking can then proceed as usual.", "explhtml": "<p>Negative earnings render P/E ratios meaningless. In such cases, it is common to use normalized earnings per share (EPS) and/or restate the ratio as the earnings yield or E/P because price is never negative. Price to earnings (P/E) ranking can then proceed as usual.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 20.4, LOS 20.f<\/div><div class=\"qtext\"><p>A common justification for using earnings yields in valuation is that:<\/p><\/div>", "subj": "equity"}, {"n": 136, "q": "The Farmer Co. has a payout ratio of 70% and a return on equity (ROE) of 14%. What will be the appropriate price-to-boo const CFG = {"title": "Reading 20 — Market-Based Valuation - Price and Enterprise Value Multiples", "subtitle": "CFA Level II · 141 câu · Kaplan Schweser QBank 2025 (108 câu đơn · 33 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;

let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");

  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);

}

// ---- render -------------------------------------------------------------- //

    const card = document.createElement("div");

    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");

      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");

}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}
