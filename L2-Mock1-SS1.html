lesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Sampson and/or Lawson violate the CFA Institute Standards of Professional Conduct with respect to presenting the TIM biographies to the client?<\/p><\/div>","subj":"ethics"},{"n":42,"q":"Sampson's use of the relabeled BAGF investment performance record violates CFA Institute Standards:","opts":["only if Sampson fails to include written disclosures as to the true source and nature of the performance record.","only if Sampson does not have written permission from Gobble Insurance to use the performance data.","unless Sampson includes written disclosures as to the true source and nature of the performance record and has written permission from Gobble Insurance to use the performance data."],"ans":"A","expl":"Standards I(C) and III(D). Including the BAGF performance is a violation of Standard I(C) – Professionalism – Misrepresentation and Standard III(D) – Duties to Clients – Performance Presentation. When Sampson combines the BAGF performance record with the TIM Composite Equity Composite, this gives potential clients a misleading impression of TIM's long-term equity management performance. The use of this performance data might be acceptable if full disclosure were made as to the source and nature of the data.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standards I(C) and III(D). Including the BAGF performance is a violation of Standard I(C) – Professionalism – Misrepresentation and Standard III(D) – Duties to Clients – Performance Presentation. When Sampson combines the BAGF performance record with the TIM Composite Equity Composite, this gives potential clients a misleading impression of TIM&#x27;s long-term equity management performance. The use of this performance data might be acceptable if full disclosure were made as to the source and nature of the data.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p>Case 1<\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p>Case 2<\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p>Case 3<\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><\/div><\/details><div class=\"qtext\"><p>Sampson&#x27;s use of the relabeled BAGF investment performance record violates CFA Institute Standards:<\/p><\/div>","subj":"ethics"},{"n":43,"q":"Did Luna violate the CFA Institute Standards of Professional Conduct by using soft dollar commissions to pay TIM's software subscription costs to StockCal and/or Add-Invest?","opts":["Both StockCal and Add-Invest software services may be paid for with soft dollars.","Neither StockCal nor Add-Invest software may be paid for with soft dollars.","It is acceptable to use soft dollars to pay for the StockCal software but not the Add-Invest software."],"ans":"C","expl":"Standard III(A). Luna has violated the CFA Institute Standards of Professional Conduct – Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is the property or asset of the client and not TIM. Client brokerage should be used only for research products or services that are directly related to the investment decision-making process and not the management costs of the firm. In this case, Luna should disclose to TIM's clients that their brokerage may be used to purchase research. In addition, Luna should seek to ensure that Turn Byer is providing the best execution for TIM's clients. StockCal is clearly providing equity research products/services that aid TIM in the investment decision-making process and not the general operation or management costs of the firm. StockCal may therefore be properly paid for with client brokerage soft dollars, and this is not a violation of the Standards or Code. However, Add-Invest Software provides TIM's clients with portfolio accounting and performance measurement services and is not related to the investment decision-making process. Therefore, Luna is misusing client resources when she uses client brokerage to purchase Add-Invest Software. Add-Invest is clearly a business expense of TIM and should rightly be paid for by the firm and not the clients. The product or service received must provide proper assistance to the investment manager in following through with his investment decision-making responsibilities.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard III(A). Luna has violated the CFA Institute Standards of Professional Conduct – Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is the property or asset of the client and not TIM. Client brokerage should be used only for research products or services that are directly related to the investment decision-making process and not the management costs of the firm. In this case, Luna should disclose to TIM&#x27;s clients that their brokerage may be used to purchase research. In addition, Luna should seek to ensure that Turn Byer is providing the best execution for TIM&#x27;s clients. StockCal is clearly providing equity research products/services that aid TIM in the investment decision-making process and not the general operation or management costs of the firm. StockCal may therefore be properly paid for with client brokerage soft dollars, and this is not a violation of the Standards or Code. However, Add-Invest Software provides TIM&#x27;s clients with portfolio accounting and performance measurement services and is not related to the investment decision-making process. Therefore, Luna is misusing client resources when she uses client brokerage to purchase Add-Invest Software. Add-Invest is clearly a business expense of TIM and should rightly be paid for by the firm and not the clients. The product or service received must provide proper assistance to the investment manager in following through with his investment decision-making responsibilities.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p>Case 1<\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p>Case 2<\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p>Case 3<\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><\/div><\/details><div class=\"qtext\"><p>Did Luna violate the CFA Institute Standards of Professional Conduct by using soft dollar commissions to pay TIM&#x27;s software subscription costs to StockCal and/or Add-Invest?<\/p><\/div>","subj":"ethics"},{"n":44,"q":"Would either compensation arrangement to reward Wurtzel for client referrals violate the CFA Institute Standards of Professional Conduct?","opts":["Both compensation arrangements would be violations, regardless of any disclosures to clients.","The increased commissions plan would be a violation, while the cash referral fees would not be a violation.","Both compensation arrangements are allowed, as long as they are fully disclosed, in advance, to all clients and prospective clients."],"ans":"B","expl":"Standard III(A). The increased commission would be a violation, but the cash referral fee would not. Doubling the commission paid to Wurtzel would be a violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is strictly an asset of the client and must be used for the benefit of clients in research that will assist the investment manager in the investment decision-making process. Client brokerage cannot be used as a reward for bringing clients to TIM and to do so is a misappropriation of client assets. Cash referral fees are acceptable, so long as the referral arrangement is fully disclosed to the clients in advance of opening their accounts. The case mentions that this disclosure will be made. This disclosure allows the client to evaluate any potential conflict(s) of interest in the referral process.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard III(A). The increased commission would be a violation, but the cash referral fee would not. Doubling the commission paid to Wurtzel would be a violation of Standard III(A) Duties to Clients – Loyalty, Prudence, and Care. Client brokerage is strictly an asset of the client and must be used for the benefit of clients in research that will assist the investment manager in the investment decision-making process. Client brokerage cannot be used as a reward for bringing clients to TIM and to do so is a misappropriation of client assets. Cash referral fees are acceptable, so long as the referral arrangement is fully disclosed to the clients in advance of opening their accounts. The case mentions that this disclosure will be made. This disclosure allows the client to evaluate any potential conflict(s) of interest in the referral process.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p>Case 1<\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p>Case 2<\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p>Case 3<\/p><p>Sol Wurtzel, the equity salesman for Turn Byer, has referred several clients to TIM over the past year. In fact, Wurtzel referrals currently account for almost 20% of the assets managed by TIM. The principals of TIM decide to reward Wurtzel, either by doubling the commissions paid on trades executed through Turn Byer on Wurtzel&#x27;s referral accounts, or by paying Wurtzel a cash referral fee for each additional TIM account opened by a Wurtzel referral. The principals agree that any cash referral fee would need to be disclosed to clients in advance.<\/p><\/div><\/details><div class=\"qtext\"><p>Would either compensation arrangement to reward Wurtzel for client referrals violate the CFA Institute Standards of Professional Conduct?<\/p><\/div>","subj":"ethics"}];
const CFG = {"title": "Schweser Mock 1 (2025) — Session 1", "subtitle": "CFA Level II · 44 câu · 2h12p", "minutes": 132, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

  derivatives:/derivative|forward|future|swap|option|call buyer|call seller|put buyer|put seller|strike price|premium|put-call|binomial|contingent claim|moneyness|expiration|arbitrage|replication/g,
  alternatives:/alternative|private capital|private equity|private debt|hedge fund|real estate|\breit|infrastructure|natural resource|commodit|digital asset|cryptocurrenc|bitcoin|collectible|venture capital|buyout|mezzanine|general partner|limited partner|waterfall|clawback|management fee|incentive fee|redemption|timberland|farmland/g,
  portfolio:/portfolio|asset allocation|investment policy|\bips\b|behavioral|cognitive error|risk aversion|utility|risk objective|capital asset pricing|\bcapm\b|security market line|capital market line|efficient frontier|systematic risk|unsystematic risk|diversification|correlation|covariance|sharpe|treynor|jensen|information ratio|two-fund|risk budgeting|lifecycle fund|mutual fund|endowment|foundation|defined contribution|defined benefit|pension|insurance company|risk-neutral/g
};
let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>

(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.qnotesClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("qnotesHead"), panel=P();

  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qnp-x")||e.target.closest(".qnp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();

</div>
<script id="baii-calc-js">
(function(){
  var loaded=false;
  function P(){return document.getElementById("baiiPanel");}
  window.baiiOpen=function(){
    var fr=document.getElementById("baiiFrame");
    if(!loaded){ fr.src="baii-plus.html"; loaded=true; }
    P().classList.add("open"); document.getElementById("baiiOverlay").classList.add("show"); P().setAttribute("aria-hidden","false");
  };
  window.baiiClose=function(){
    P().classList.remove("open"); document.getElementById("baiiOverlay").classList.remove("show"); P().setAttribute("aria-hidden","true");
  };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape" && P() && P().classList.contains("open")) window.baiiClose(); });
  // ---- drag the window by its header ----
  var head=document.getElementById("baiiHead"), panel=P();
  var drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".bp-x")||e.target.closest(".bp-open")) return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+"px"; panel.style.top=r.top+"px"; panel.style.right="auto"; panel.style.bottom="auto";
    drag=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    panel.classList.add("dragging");
    try{head.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  head.addEventListener("pointermove",function(e){
    if(!drag) return;
    var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    var w=panel.offsetWidth, h=panel.offsetHeight;
    nx=Math.max(4,Math.min(nx,window.innerWidth-w-4));
    ny=Math.max(4,Math.min(ny,window.innerHeight-h-4));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  function endDrag(e){ if(!drag)return; drag=false; panel.classList.remove("dragging"); try{head.releasePointerCapture(e.pointerId);}catch(_){} }
  head.addEventListener("pointerup",endDrag);
  head.addEventListener("pointercancel",endDrag);
})();
</script>
<!--baii-calc-end-->

<div id="restartOverlay" class="overlay">
  <div class="modal">
    <h3>Làm lại từ đầu?</h3>
    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">
      <button type="button" onclick="rcCancel()">Huỷ</button>
      <button type="button" class="btn-primary" onclick="rcConfirm()">Làm lại</button>
    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
