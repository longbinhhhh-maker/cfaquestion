<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>

<header>

<script>
const DATA = [{"n":1,"q":"Shears's supervisor, Sam Kite, expresses concern that equation (1) might be misspecified. Specifically, Kite refers to the finding that \"sales have been increasing at a fairly constant rate over time.\"\nWhich of the following data transformations should be applied to the dependent variable in equation (1) to best address Kite's concern?","opts":["Lagged transformation.","Logarithmic transformation.","First difference transformation."],"ans":"B","expl":"A logarithmic transformation of the dependent variable is the most appropriate transformation to apply when the variable grows at a constant rate over time: ln(sales) = b0 + b1t + et The slope of this equation (b1) equals the nominal constant rate. (Module 2.1, LOS 2.b)","explhtml":"<p>A logarithmic transformation of the dependent variable is the most appropriate transformation to apply when the variable grows at a constant rate over time: ln(sales) = b0 + b1t + et The slope of this equation (b1) equals the nominal constant rate. (Module 2.1, LOS 2.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<\/summary><div class=\"vig-body\"><p>William Shears, CFA, has been assigned the task of predicting sales for the specialty retail industry. Shears finds that sales have been increasing at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model: salest = b0 + b1t + et (1) where:<\/p><p>sales = quarterly sales (measured in $ millions) for the specialty retail industry b0 = intercept term b1 = slope t = time variable (quarter number) e = random error Exhibit 1 provides the results of the linear trend regression. Exhibit 1: Linear Trend Regression<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>Standard Error<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>10.0<\/td><td>3.50<\/td><\/tr><tr><td>Trend<\/td><td>16.0<\/td><td>6.55<\/td><\/tr><\/table><\/div><p>Shears also estimates an autoregressive model of order one, AR(1), using the changes in quarterly sales data for the industry from the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model: ∆salest = b0 + b1∆salest–1 + et Exhibit 2: AR(1) Model for Changes in Industry Sales<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>Standard Error<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>20.00<\/td><td>2.15<\/td><\/tr><tr><td>Lag 1<\/td><td>0.10<\/td><td>0.04<\/td><\/tr><\/table><\/div><p>The autocorrelations for the first four lags from Shears&#x27;s AR(1) model are provided in Exhibit 3:<\/p><p>Exhibit 3: Autocorrelations From the AR(1) Model<\/p><div class=\"tbl\"><table><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>p-Value<\/td><\/tr><tr><td>1<\/td><td>–0.032<\/td><td>0.38<\/td><\/tr><tr><td>2<\/td><td>–0.200<\/td><td>0.16<\/td><\/tr><tr><td>3<\/td><td>–0.065<\/td><td>0.23<\/td><\/tr><tr><td>4<\/td><td>0.470<\/td><td>0.02<\/td><\/tr><\/table><\/div><p>Quarterly sales for the Specialty Retail Industry during 2018 were: Exhibit 4: 2018 Quarterly Industry Sales<\/p><div class=\"tbl\"><table><tr><td>Quarter<\/td><td>Sales (in millions)<\/td><\/tr><tr><td>Quarter 1, 2018<\/td><td>900<\/td><\/tr><tr><td>Quarter 2, 2018<\/td><td>925<\/td><\/tr><tr><td>Quarter 3, 2018<\/td><td>950<\/td><\/tr><tr><td>Quarter 4, 2018<\/td><td>1,000<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Shears&#x27;s supervisor, Sam Kite, expresses concern that equation (1) might be misspecified. Specifically, Kite refers to the finding that &quot;sales have been increasing at a fairly constant rate over time.&quot;<\/p><p>Which of the following data transformations should be applied to the dependent variable in equation (1) to best address Kite&#x27;s concern?<\/p><\/div>","subj":"quant"},{"n":2,"q":"Using the results for the linear trend equation in Exhibit 1, the specialty retail industry sales forecast for Quarter 1 of 2019 is closest to:","opts":["$26 million.","$976 million.","$986 million."],"ans":"C","expl":"Quarter 1 of 2019 is the 61st quarter (starting with Quarter 1 of 2004): sales = 10 + 16(61) = $986 million. (Module 2.1, LOS 2.b)","explhtml":"<p>Quarter 1 of 2019 is the 61st quarter (starting with Quarter 1 of 2004): sales = 10 + 16(61) = $986 million. (Module 2.1, LOS 2.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Shears, CFA, has been assigned the task of predicting sales for the specialty retail industry. Shears finds that sales have been increasing at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model: salest = b0 + b1t + et (1) where:<\/p><p>sales = quarterly sales (measured in $ millions) for the specialty retail industry b0 = intercept term b1 = slope t = time variable (quarter number) e = random error Exhibit 1 provides the results of the linear trend regression. Exhibit 1: Linear Trend Regression<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>Standard Error<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>10.0<\/td><td>3.50<\/td><\/tr><tr><td>Trend<\/td><td>16.0<\/td><td>6.55<\/td><\/tr><\/table><\/div><p>Shears also estimates an autoregressive model of order one, AR(1), using the changes in quarterly sales data for the industry from the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model: ∆salest = b0 + b1∆salest–1 + et Exhibit 2: AR(1) M ean reverting value. The change in sales for the last quarter in 2018 was $50 million, which exceeds the mean reverting value. We could also have computed the forecasted change in sales for Quarter 1, 2019 as 20 + (0.1) × 50 = 25 (which is lower than the previous change of 50). (Module 2.2, LOS 2.f)","explhtml":"<p>The mean reverting value equals the intercept divided by 1 minus slope = 20 / (1 − 0.10) = 20 / 0.90 = $22.22 million. The last change was $50 million as shown in Exhibit 5 (1000 − 950). Therefore, the AR(1) model predicts that the series will fall anytime the current value (the last quarter in 2018) is above the mean reverting value. The change in sales for the last quarter in 2018 was $50 million, which exceeds the mean reverting value. We could also have computed the forecasted change in sales for Quarter 1, 2019 as 20 + (0.1) × 50 = 25 (which is lower than the previous change of 50). (Module 2.2, LOS 2.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 1–4 · Quantitative Methods<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>William Shears, CFA, has been assigned the task of predicting sales for the specialty retail industry. Shears finds that sales have been increasing at a fairly constant rate over time and decides to estimate the linear trend in sales for the industry using quarterly data over the past 15 years, starting with Quarter 1 of 2004 and ending with Quarter 4 of 2018. On January 1, 2019, Shears estimates the following model: salest = b0 + b1t + et (1) where:<\/p><p>sales = quarterly sales (measured in $ millions) for the specialty retail industry b0 = intercept term b1 = slope t = time variable (quarter number) e = random error Exhibit 1 provides the results of the linear trend regression. Exhibit 1: Linear Trend Regression<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>Standard Error<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>10.0<\/t the first quarter of 2004 through the fourth quarter of 2018. He obtains the following results for his AR(1) model: ∆salest = b0 + b1∆salest–1 + et Exhibit 2: AR(1) Model for Changes in Industry Sales<\/p><div class=\"tbl\"><table><tr><td>Coefficient<\/td><td>Standard Error<\/td><td><\/td><\/tr><tr><td>Intercept<\/td><td>20.00<\/td><td>2.15<\/td><\/tr><tr><td>Lag 1<\/td><td>0.10<\/td><td>0.04<\/td><\/tr><\/table><\/div><p>The autocorrelations for the first four lags from Shears&#x27;s AR(1) model are provided in Exhibit 3:<\/p><p>Exhibit 3: Autocorrelations From the AR(1) Model<\/p><div class=\"tbl\"><table><tr><td>Lag<\/td><td>Autocorrelation<\/td><td>p-Value<\/td><\/tr><tr><td>1<\/td><td>–0.032<\/td><td>0.38<\/td><\/tr><tr><td>2<\/td><td>–0.200<\/td><td>0.16<\/td><\/tr><tr><td>3<\/td><td>–0.065<\/td><td>0.23<\/td><\/tr><tr><td>4<\/td><td>0.470<\/td><td>0.02<\/td><\/tr><\/table><\/div><p>Quarterly sales for the Specialty Retail Industry during 2018 were: Exhibit 4: 2018 Quarterly Industry Sales<\/p><div class=\"tbl\"><table><tr><td>Quarter<\/td><td>Sales (in millions)<\/td><\/tr><tr><td>Quarter 1, 2018<\/td><td>900<\/td><\/tr><tr><td>Quarter 2, 2018<\/td><td>925<\/td><\/tr><tr><td>Quarter 3, 2018<\/td><td>950<\/td><\/tr><tr><td>Quarter 4, 2018<\/td><td>1,000<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding seasonality, given a 5% level of significance, Shears should use Exhibit 3 to conclude he should add the following lag to his autoregressive model:<\/p><\/div>","subj":"quant"},{"n":5,"q":"The government proposal that would most likely lead to the highest increase in labor productivity is:","opts":["Proposal 1.","Proposal 2.","Proposal 3."],"ans":"B","expl":"In order for developed countries to grow, technological development is critical. Proposal 2 most clearly addresses this need. Proposal 1 would be more effective if the focus was on post-secondary education, as developed nations benefit more from innovation and less from applying technology. Proposal 3 is unlikely to have a major impact on labor productivity, as developed nations have high capital-to-labor ratios, and incentives to further increase capital will have relatively little effect on labor productivity. (Module 6.2, LOS 6.h)","explhtml":"<p>In order for developed countries to grow, technological development is critical. Proposal 2 most clearly addresses this need. Proposal 1 would be more effective if the focus was on post-secondary education, as developed nations benefit more from innovation and less from applying technology. Proposal 3 is unlikely to have a major impact on labor productivity, as developed nations have high capital-to-labor ratios, and incentives to further increase capital will have relatively little effect on labor productivity. (Module 6.2, LOS 6.h)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles.<\/p><p>Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to West and Central and relocating manufacturing of salty snack foods to East.<\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles<\/td><\/tr><\/table><\/div><p>driven per capita increased.<\/p><\/div><\/details><div class=\"qtext\"><p>The government proposal that would most likely lead to the highest increase in labor productivity is:<\/p><\/div>","subj":"economics"},{"n":6,"q":"Which Tristanyan industry is most likely to shrink due to the regulatory changes in the East?","opts":["Snacks.","Agriculture.","Carbonated beverages."],"ans":"C","expl":"The carbonated beverages industry is likely to be hurt by the elimination of bigger sizes of drinks. The snack industry can avoid the new manufacturing tax in East by moving manufacture of sweet snacks to the other two states. The demand for corn is expected to remain fairly high so the regulatory changes in East are unlikely to have a major impact on the Tristanyan agricultural industry. (Module 7.1, LOS 7.i)","explhtml":"<p>The carbonated beverages industry is likely to be hurt by the elimination of bigger sizes of drinks. The snack industry can avoid the new manufacturing tax in East by moving manufacture of sweet snacks to the other two states. The demand for corn is expected to remain fairly high so the regulatory changes in East are unlikely to have a major impact on the Tristanyan agricultural industry. (Module 7.1, LOS 7.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles.<\/p><p>Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to West and Central and relocating manufacturing of salty snack foods to East.<\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles<\/td><\/tr><\/table><\/div><p>driven per capita increased.<\/p><\/div><\/details><div class=\"qtext\"><p>Which Tristanyan industry is most likely to shrink due to the regulatory changes in the East?<\/p><\/div>","subj":"economics"},{"n":7,"q":"Based on finding 1, the snack food industry is engaging in regulatory:","opts":["capture.","arbitrage.","competition."],"ans":"B","expl":"The snack foods industry, a regulated entity, has found a way to exploit the differences in regulations among the three states and is engaging in regulatory arbitrage. Regulatory competition is a result of actions taken by regulators to attract certain entities. Regulatory capture is the idea that regulatory bodies are influenced or controlled by the regulated industry. (Module 7.1, LOS 7.f)","explhtml":"<p>The snack foods industry, a regulated entity, has found a way to exploit the differences in regulations among the three states and is engaging in regulatory arbitrage. Regulatory competition is a result of actions taken by regulators to attract certain en lessen the net regulatory burden of regulation.","Regulatory burden refers to the costs of regulation for the regulated entity."],"ans":"A","expl":"There is often a tendency to focus on the implementation costs of regulation (for example, the cost of paperwork), however in many instances, the most significant costs are the indirect ones that relate to the ways in which economic decisions and behavior are altered and market allocations are changed. The other two statements are true. (Module 7.1, LOS 7.h)","explhtml":"<p>There is often a tendency to focus on the implementation costs of regulation (for example, the cost of paperwork), however in many instances, the most significant costs are the indirect ones that relate to the ways in which economic decisions and behavior are altered and market allocations are changed. The other two statements are true. (Module 7.1, LOS 7.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 5–8 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tristanya is a developed country with three states, West Tristanya (West), Central Tristanya (Central), and East Tristanya (East). Tristanya is a stable democracy with elected representatives, appointed judges, and an elected prime minister. All three states have approximately the same population and geographical area. Tristanya&#x27;s savings rates are above the global average, and economic development has been mostly financed with domestic savings. The currency in Tristanya is the Tristanya dollar with a symbol of T$. The financial markets are highly liquid and function efficiently. Tristanya&#x27;s foreign trade is a significant part of the economy, and because of this, Tristanya has continued to push for lower trade barriers. Similar to other developed nations, population growth rate in Tristanya is low and capital stock is high.<\/p><p>The three states adhere to all federal regulations but differ significantly on some policies that are not covered by federal laws. The states also have their own agencies for regional administration of state-specific regulations. Any jurisdictional issue is resolved in federal courts.<\/p><p>The government of Tristanya is increasing its efforts to boost labor productivity. Some of the proposals under consideration include:<\/p><p>1. Increased education funding for elementary and middle schools. 2. Increased tax credits for private research and development expenditures. 3. Increased depreciation allowances for tax purposes.<\/p><p>Fuel costs have become an issue in Tristanya as demand for gasoline is expected to increase. Mandated fuel additives, specifically corn ethanol, are used to increase supply, and minimum fuel economy standards have been imposed to curtail demand.<\/p><p>East has the highest obesity rates among the three states. To control the state government&#x27;s health care expenditure, East&#x27;s government is implementing an additional tax on all sweet snack foods manufactured in the state. The tax is also known as the &quot;sweet tax.&quot; Another regulation, the &quot;supersize drinks ban,&quot; will prohibit restaurants in East from selling large portion sizes of carbonated beverages.<\/p><p>The most common form of sweetener in Tristanya is corn syrup. The agricultural industry has benefited from excess demand for corn to produce corn syrup and ethanol. Even after implementation of the &quot;sweet tax,&quot; the demand for corn is expected to remain high.<\/p><p>West has the highest gasoline usage per capita, and reducing gasoline consumption is a policy goal for that state&#x27;s government. West also has the most stringent environmental regulations and has recently raised their standards for minimum fuel economy for automobiles.<\/p><p>Juanita Estrada, an analyst, is assigned to assess the impact of all the regulatory changes on economic growth. Estrada lists the following findings from her analysis:<\/p><div class=\"tbl\"><table><tr><td>Finding 1: <\/td><td>The snack food industry is in the process of relocating manufacturing of sweet snack foods to West and Central and relocating manufacturing of salty snack foods to East.<\/td><\/tr><tr><td>Finding 2: <\/td><td>After West raised that state&#x27;s fuel economy standards, the average miles<\/td><\/tr><\/table><\/div><p>driven per capita increased.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following statements regarding regulatory burden is least accurate?<\/p><\/div>","subj":"economics"},{"n":9,"q":"Mahi's statement is consistent with:","opts":["classical growth theory.","endogenous growth theory.","neoclassical growth theory."],"ans":"C","expl":"Neoclassical growth theory concludes that capital accumulation affects the level of output but not the long-run growth rate.\n(Module 6.3, LOS 6.i)","explhtml":"<p>Neoclassical growth theory concludes that capital accumulation affects the level of output but not the long-run growth rate.<\/p><p>(Module 6.3, LOS 6.i)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<\/summary><div class=\"vig-body\"><p>Bella Stone, CFA, is analyzing investment opportunities in Astair, an emerging market. She notes that at a recent congressional hearing, Mr. Adel Mahi, the chief economic advisor to the prime minister, stated that Astair&#x27;s capital accumulation affects the size of the Astair&#x27;s GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self-regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>While discussing international parity conditions with an intern, Stone makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods should have the same price throughout the world. Absolute purchasing power parity is not widely used in practice to forecast exchange rates.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate forecasts, it is not useful for predicting short-run currency values.<\/td><\/tr><tr><td>Statement 3:<\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the future spot rate.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Mahi&#x27;s statement is consistent with:<\/p><\/div>","subj":"economics"},{"n":10,"q":"The objectives of regulators in financial markets is least likely to include:","opts":["low inflation.","prudential supervision.","promotion of economic growth."],"ans":"A","expl":"The objectives of regulators in financial markets include prudential supervision, financial stability, market integrity, and economic growth. Low inflation is likely to be an objective of the central bank.\n(Module 7.1, LOS 7.b)","explhtml":"<p>The objectives of regulators in financial markets include prudential supervision, financial stability, market integrity, and economic growth. Low inflation is likely to be an objective of the central bank.<\/p><p>(Module 7.1, LOS 7.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Stone, CFA, is analyzing investment opportunities in Astair, an emerging market. She notes that at a recent congressional hearing, Mr. Adel Mahi, the chief economic advisor to the prime minister, stated that Astair&#x27;s capital accumulation affects the size of the Astair&#x27;s GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self-regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>While discussing international parity conditions with an intern, Stone makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods should have the same price throughout the world. Absolute purchasing power parity is not widely used in practice to forecast exchange rates.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate forecasts, it is not useful for predicting short-run currency values.<\/td><\/tr><tr><td>Statement 3:<\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the future spot rate.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The objectives of regulators in financial markets is least likely to include:<\/p><\/div>","subj":"economics"},{"n":11,"q":"Regarding statements 1 and 2 made by Stone, are both statements correct?","opts":["Yes.","No, only Statement 2 is correct.","No, both statements are incorrect."],"ans":"A","expl":"Statement 1: Stone is correct regarding absolute purchasing power parity. It is based on the law of one price, which states that the price of goods (after currency conversion) should not differ internationally. Absolute purchasing power parity is not used to predict exchange rates.\nStatement 2: Stone is correct regarding relative purchasing power parity. It does not hold in the short-run and therefore is not useful for predicting short-run currency values. It does tend to hold in the long- run, however, and is therefore useful for long-run exchange rate forecasts.\n(Module 5.2, LOS 5.e)","explhtml":"<p>Statement 1: Stone is correct regarding absolute purchasing power parity. It is based on the law of one price, which states that the price of goods (after currency conversion) should not differ internationally. Absolute purchasing power parity is not used to predict exchange rates.<\/p><p>Statement 2: Stone is correct regarding relative purchasing power parity. It does not hold in the short-run and therefore is not useful for predicting short-run currency values. It does tend to hold in the long- run, however, and is therefore useful for long-run exchange rate forecasts.<\/p><p>(Module 5.2, LOS 5.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Stone, CFA, is analyzing investment opportunities in Astair, an emerging market. She notes that at a recent congressional hearing, Mr. Adel Mahi, the chief economic advisor to the prime minister, stated that Astair&#x27;s capital accumulation affects the size of the Astair&#x27;s GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self-regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>While discussing international parity conditions with an intern, Stone makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods should have the same price throughout the world. Absolute purchasing power parity is not widely used in practice to forecast exchange rates.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate forecasts, it is not useful for predicting short-run currency values.<\/td><\/tr><tr><td>Statement 3:<\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the future spot rate.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Regarding statements 1 and 2 made by Stone, are both statements correct?<\/p><\/div>","subj":"economics"},{"n":12,"q":"Stone's statement 3 is most likely:","opts":["correct.","incorrect as uncovered interest rate parity holds only if real interest rate parity holds.","incorrect as uncovered interest rate parity holds only if covered interest rate parity holds."],"ans":"A","expl":"When the expected future spot rate is equal to the forward rate (and given that covered interest parity always holds—by arbitrage), uncovered interest rate parity should hold as well. The international Fisher relationship links relative purchasing power parity to uncovered interest rate parity. Real interest rate parity links the Fisher effect to the international Fisher relationship.\n(Module 5.2, LOS 5.f)","explhtml":"<p>When the expected future spot rate is equal to the forward rate (and given that covered interest parity always holds—by arbitrage), uncovered interest rate parity should hold as well. The international Fisher relationship links relative purchasing power parity to uncovered interest rate parity. Real interest rate parity links the Fisher effect to the international Fisher relationship.<\/p><p>(Module 5.2, LOS 5.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 9–12 · Economics<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Bella Stone, CFA, is analyzing investment opportunities in Astair, an emerging market. She notes that at a recent congressional hearing, Mr. Adel Mahi, the chief economic advisor to the prime minister, stated that Astair&#x27;s capital accumulation affects the size of the Astair&#x27;s GDP but not its growth rate.<\/p><p>All commercial and financial market regulations are the domain of federal agencies and government recognized self-regulatory organizations (SROs). In this regard, the federal government tends to set minimum standards and allows each state to create agencies to enforce their regulations.<\/p><p>While discussing international parity conditions with an intern, Stone makes the following statements.<\/p><div class=\"tbl\"><table><tr><td>Statement 1: <\/td><td>Absolute purchasing power parity extends the law of one price and states that a basket of goods should have the same price throughout the world. Absolute purchasing power parity is not widely used in practice to forecast exchange rates.<\/td><\/tr><tr><td>Statement 2: <\/td><td>Although relative purchasing power parity is useful as an input for long-run exchange rate forecasts, it is not useful for predicting short-run currency values.<\/td><\/tr><tr><td>Statement 3:<\/td><td>For uncovered interest rate parity to hold, the forward rate must be an unbiased predictor of the future spot rate.<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Stone&#x27;s statement 3 is most likely:<\/p><\/div>","subj":"economics"},{"n":13,"q":"When applying the financial analysis framework to Delicious, which of the following is the best example of an input Scott should use when establishing the purpose and context of the analysis?","opts":["The audited financial statements of Delicious prepared in conformance with either U.S. GAAP or IFRS.","Ratio analysis adjusted for differences between U.S. accounting standards and international accounting standards.","Review of the pension fund’s guidelines related to developing the specific work product."],"ans":"B","expl":"The institutional guidelines related to developing the specific work product is an input source in the first phase (defining the purpose and context of the analysis). Audited financial statements are an example of an input in the data collection phase. Ratio analysis is an example of the output from the data processing phase. (Module 13.1, LOS 13.a)","explhtml":"<p>The institutional guidelines related to developing the specific work product is an input source in the first phase (defining the purpose and context of the analysis). Audited financial statements are an example of an input in the data collection phase. Ratio analysis is an example of the output from the data processing phase. (Module 13.1, LOS 13.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<\/summary><div class=\"vig-body\"><p>Delicious Candy Company (Delicious) is a leading manufacturer and distributor of quality confectionery products throughout Europe and Mexico. Delicious is a publicly traded firm located in Italy and has been in business over 60 years. Delicious complies with International Financial Reporting Standards (IFRS).<\/p><p>Caleb Scott, an equity analyst with a large pension fund, has been asked to complete a comprehensive analysis of Delicious in order to evaluate the possibility of a future investment.<\/p><p>Scott compiles the selected financial data found in Exhibit 1 and learns that Delicious owns a 30% equity interest in a supplier located in the United States. Delicious uses the equity method to account for its investment in the U.S. associate. The associate prepares its financial statements in accordance with U.S. Generally Accepted Accounting Principles (GAAP).<\/p><p>Exhibit 1: Selected Financial Data—Delicious Candy Company<\/p><div class=\"tbl\"><table><tr><td>In millions<\/td><td>2017<\/td><td>2016<\/td><\/tr><\/table><\/div><p>Income Statement<\/p><div class=\"tbl\"><table><tr><td>Revenue<\/td><td>€60,229<\/td><td>€55,137<\/td><\/tr><tr><td>Earnings before interest and tax<\/td><td>7,990<\/td><td>7,077<\/td><\/tr><tr><td>Earnings before tax<\/td><td>7,570<\/td><td>6,779<\/td><\/tr><tr><td><sup>a<\/sup><\/td><td>354<\/td><td>270<\/td><\/tr><\/table><\/div><p>Income from associate<\/p><div class=\"tbl\"><table><tr><td>Net income<\/td><td>6,501<\/td><td>5,625<\/td><\/tr><\/table><\/div><p>Balance sheet<\/p><div class=\"tbl\"><table><tr><td><sup>b<\/sup><\/td><td>€56,396<\/td><td>€53,111<\/td><\/tr><\/table><\/div><p>Total assets<\/p><div class=\"tbl\"><table><tr><td>Investment in associate<\/td><td>5,504<\/td><td>5,193<\/td><\/tr><tr><td><sup>c<\/sup><\/td><td>30,371<\/td><td>29,595<\/td><\/tr><\/table><\/div><p>Stockholders&#x27; equity<\/p><p>a Not included in EBIT or EBT.<\/p><p>b Total assets were €45,597 at the end of 2015.<\/p><p>c Stockholders&#x27; equity was €27,881 at the end of 2015.<\/p><p>Scott reads the Delicious&#x27;s revenue recognition footnote found in Exhibit 2.<\/p><p>Exhibit 2: Revenue Recognition Footnote<\/p><p>In millions<\/p><p>Revenue is recognized, net of returns and allowances, when the goods are shipped to customers and collectibility is assured. Several customers remit payment before delivery in order to receive additional discounts. Delicious reports these amounts as unearned revenue until the goods are shipped. Unearned revenue was €9,701 at the end of 2017, €2,514 at the end of 2016, and €2,511 at the end of 2015.<\/p><p>Scott wants to determine whether the cash flow is of high quality.<\/p><p>Scott gathers the information in Exhibit 3 to determine the implied &quot;stand-alone&quot; value of Delicious without regard to the value of its U.S. associate.<\/p><p>Exhibit 3: Selected 2017 Market Capitalization Data<\/p><div class=\"tbl\"><table><tr><td>In millions except exchange rates<\/td><td>Delicious<\/td><td>Associate<\/td><\/tr><tr><td>Market capitalization<\/td><td>€97,525<\/td><td>$32,330<\/td><\/tr><tr><td>Current exchange rate (€ per $)<\/td><td>€0.70<\/td><td><\/td><\/tr><tr><td>Average exchange rate (€ per $)<\/td><td>€0.73<\/td><td><\/td><\/tr><\/table><\/div><p>Delicious financial statements include an investment of €60 million in debt securities, which are reported as fair value through profit or loss securities.<\/p><\/div><\/details><div class=\"qtext\"><p>When applying the financial analysis framework to Delicious, which of the following is the best example of an input Scott should use when establishing the purpose and context of the analysis?<\/p><\/div>","subj":"fsa"},{"n":14,"q":"If Delicious reported the investment in debt securities as fair value through OCI securities instead of as fair value through profit or loss securities, the impact on Delicious's financial statement would be:","opts":["to decrease total assets.","to increase total assets.","no change to total assets."],"ans":"B","expl":"If Delicious reported the investment in debt securities as fair value through OCI instead of fair value through profit or loss, its total assets would be unchanged, because both methods report the bonds at fair value on the balance sheet. Net income would, however, differ with unrealized gains or loss reported in income statement under fair value through profit or loss classification while being reported in OCI under fair value through OCI classification. (Module 8.1, LOS 8.a)","explhtml":"<p>If Delicious reported the investment in debt securities as fair value through OCI instead of fair value through profit or loss, its total assets would be unchanged, because both methods report the bonds at fair value on the balance sheet. Net income would, however, differ with unrealized gains or loss reported in income statement under fair value through profit or loss classification while being reported in OCI under fair value through OCI classification. (Module 8.1, LOS 8.a)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 13–16 · Financial Statement Analysis<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Delicious Candy Company (Delicious) is a leading manufacturer and distributor of quality confectionery products throughout Europe and Mexico. Delicious is a publicly traded fir additional discounts. Delicious reports these amounts as unearned revenue until the goods are shipped. Unearned revenue was €9,701 at the end of 2017, €2,514 at the end of 2016, and €2,511 at the end of 2015.<\/p><p>Scott wants to determine whether the cash flow is of high quality.<\/p><p>Scott gathers the information in Exhibit 3 to determine the implied &quot;stand-alone&quot; value of Delicious without regard to the value of its U.S. associate.<\/p><p>Exhibit 3: Selected 2017 Market Capitalization Data<\/p><div class=\"tbl\"><table><tr><td>In millions except exchange rates<\/td><td>Delicious<\/td><td>Associate<\/td><\/tr><tr><td>Market capitalization<\/td><td>€97,525<\/td><td>$32,330<\/td><\/tr><tr><td>Current exchange rate (€ per $)<\/td><td>€0.70<\/td><td><\/td><\/tr><tr><td>Average exchange rate (€ per $)<\/td><td>€0.73<\/td><td><\/td><\/tr><\/table><\/div><p>Delicious financial statements include an investment of €60 million in debt securities, which are reported as fair value through profit or loss securities.<\/p><\/div><\/details><div class=\"qtext\"><p>Using the data found in Exhibit 1 and Exhibit 3, Delicious&#x27;s implied P/E multiple without regard to its U.S. associate is closest to:<\/p><\/div>","subj":"fsa"},{"n":17,"q":"Based on Exhibit 1, which company has the lowest predicted P/E utilizing the model presented by Swift?","opts":["A.","B.","C."],"ans":"A","expl":"First calculate the growth rates = ROE × retention rate A: 0.20 × 0.75 = 15% B: 0.15 × 0.6 = 9% C: 0.13 × 0.5 = 6.50% Based on the model presented, the predicted P/E ratios can be calculated as: A: 2.74 + 8.21(0.50 / 2.00) + 14.21(0.15) + 2.81(0.20) = 7.49 B: 2.74 + 8.21(1.60 / 4.00) + 14.21(0.09) + 2.81(0.15) = 7.72 C: 2.74 + 8.21(1.50 / 3.00) + 14.21(0.065) + 2.81(0.13) = 8.13 (Module 22.4, LOS 22.e)","explhtml":"<p>First calculate the growth rates = ROE × retention rate A: 0.20 × 0.75 = 15% B: 0.15 × 0.6 = 9% C: 0.13 × 0.5 = 6.50% Based on the model presented, the predicted P/E ratios can be calculated as: A: 2.74 + 8.21(0.50 / 2.00) + 14.21(0.15) + 2.81(0.20) = 7.49 B: 2.74 + 8.21(1.60 / 4.00) + 14.21(0.09) + 2.81(0.15) = 7.72 C: 2.74 + 8.21(1.50 / 3.00) + 14.21(0.065) + 2.81(0.13) = 8.13 (Module 22.4, LOS 22.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<\/summary><div class=\"vig-body\"><p>Brightscore Investments is a boutique wealth management firm. One of Brightscore&#x27;s equity analysts, Marie Swift, CFA, recently held a meeting with the senior partners to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Brightscore researches.<\/p><p>Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the semiconductor industry (16 companies):<\/p><div class=\"tbl\"><table><tr><td>predicted P/E =<\/td><td>2.74 +<\/td><td>8.21(payout ratio) +<\/td><td>14.21(g) +<\/td><td>2.81(ROE)<\/td><\/tr><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>Swift collects data on three companies as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$2.00<\/td><td>$4.00<\/td><td>$3.00<\/td><\/tr><tr><td>DPS<\/td><td>$0.50<\/td><td>$1.60<\/td><td>$1.50<\/td><\/tr><tr><td>ROE<\/td><td>20%<\/td><td>15%<\/td><td>13%<\/td><\/tr><tr><td>Required rate of return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Swift is following Sigma, Inc., a chipmaker for wearable devices. Sigma has invested significantly in R&amp;D since its inception and that expenditure is finally bearing fruit: the company is now profitable. Sigma correctly expenses the R&amp;D expenditure when incurred. Relative to its competitors, Sigma pays a lower share of gross revenue to its independent contractors. However, Sigma does pay contractors annual bonuses based on their number of years of affiliation with the company.<\/p><p>Swift is also analyzing Safe Bank, a regional bank holding company. Safe Bank is expected to have an earnings growth rate of 3% going forward and its ROE is 12%. Current BVPS is $50.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which company has the lowest predicted P/E utilizing the model presented by Swift?<\/p><\/div>","subj":"equity"},{"n":18,"q":"Which relative valuation multiple would Swift most appropriately use to value Sigma, Inc.?","opts":["Price-to-cash-flow ratio.","Price-to-book ratio.","Price-to-sales ratio."],"ans":"A","expl":"We are told that the firm has significant investment in R&D, suggesting the existence of intangible assets that are not reflected in Sigma's book value; hence, the price-to-book value ratio may be misleading. Sigma's cost structure is different from that of its peers, so use of price-to-sales ratio may not be directly comparable. The price-to-cash-flow ratio is most appropriate here because cash flow is less prone to manipulation and less likely to be distorted by differences in accounting practices.\n(Module 22.3, LOS 22.c)","explhtml":"<p>We are told that the firm has significant investment in R&amp;D, suggesting the existence of intangible assets that are not reflected in Sigma&#x27;s book value; hence, the price-to-book value ratio may be misleading. Sigma&#x27;s cost structure is different from that of its peers, so use of price-to-sales ratio may not be directly comparable. The price-to-cash-flow ratio is most appropriate here because cash flow is less prone to manipulation and less likely to be distorted by differences in accounting practices.<\/p><p>(Module 22.3, LOS 22.c)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brightscore Investments is a boutique wealth management firm. One of Brightscore&#x27;s equity analysts, Marie Swift, CFA, recently held a meeting with the senior partners to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Brightscore researches.<\/p><p>Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the semiconductor industry (16 companies):<\/p><div class=\"tbl\"><table><tr><td>predicted P/E =<\/td><td>2.74 +<\/td><td>8.21(payout ratio) +<\/td><td>14.21(g) +<\/td><td>2.81(ROE)<\/td><\/tr><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>Swift collects data on three companies as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$2.00<\/td><td>$4.00<\/td><td>$3.00<\/td><\/tr><tr><td>DPS<\/td><td>$0.50<\/td><td>$1.60<\/td><td>$1.50<\/td><\/tr><tr><td>ROE<\/td><td>20%<\/td><td>15%<\/td><td>13%<\/td><\/tr><tr><td>Required rate of return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Swift is f wth rate of 3% going forward and its ROE is 12%. Current BVPS is $50.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following is least appropriate regarding the use of standardized unexpected earnings?<\/p><\/div>","subj":"equity"},{"n":20,"q":"Assuming a 9% required rate of return and using the residual income model, the value of Safe Bank's equity is closest to:","opts":["$75 per share.","$95 per share.","$115 per share."],"ans":"A","expl":"(ROE−r)×B0 | (0.12−0.09)50\nV0= B0 + | = $50 + | = $75\n(r−g) | 0.09−0.03\n(Module 23.2, LOS 23.d)","explhtml":"<div class=\"tbl\"><table><tr><td>(ROE−r)×B0<\/td><td>(0.12−0.09)50<\/td><td><\/td><\/tr><tr><td>V0= B0 +<\/td><td>= $50 +<\/td><td>= $75<\/td><\/tr><tr><td>(r−g)<\/td><td>0.09−0.03<\/td><td><\/td><\/tr><\/table><\/div><p>(Module 23.2, LOS 23.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 17–20 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Brightscore Investments is a boutique wealth management firm. One of Brightscore&#x27;s equity analysts, Marie Swift, CFA, recently held a meeting with the senior partners to discuss a relatively new model the firm is implementing to determine the P/E ratios of companies that Brightscore researches.<\/p><p>Swift explains that the model utilizes a cross-sectional regression using the previous year-end data of a group of comparable companies&#x27; P/E ratios against their dividend payout ratios (payout ratio), sustainable growth rates (g), and returns on equity (ROE). The resulting regression equation is used to determine a predicted P/E ratio for the subject company using the subject company&#x27;s most recent year-end data. Swift has developed the following model, which has an R-squared of 81%, for the semiconductor industry (16 companies):<\/p><div class=\"tbl\"><table><tr><td>predicted P/E =<\/td><td>2.74 +<\/td><td>8.21(payout ratio) +<\/td><td>14.21(g) +<\/td><td>2.81(ROE)<\/td><\/tr><tr><td>(STD error)<\/td><td>(2.11)<\/td><td>(6.52)<\/td><td>(9.24)<\/td><td>(2.10)<\/td><\/tr><\/table><\/div><p>Swift collects data on three companies as shown in Exhibit 1.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>A<\/td><td>B<\/td><td>C<\/td><td><\/td><\/tr><tr><td>EPS<\/td><td>$2.00<\/td><td>$4.00<\/td><td>$3.00<\/td><\/tr><tr><td>DPS<\/td><td>$0.50<\/td><td>$1.60<\/td><td>$1.50<\/td><\/tr><tr><td>ROE<\/td><td>20%<\/td><td>15%<\/td><td>13%<\/td><\/tr><tr><td>Required rate of return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Swift is following Sigma, Inc., a chipmaker for wearable devices. Sigma has invested significantly in R&amp;D since its inception and that expenditure is finally bearing fruit: the company is now profitable. Sigma correctly expenses the R&amp;D expenditure when incurred. Relative to its competitors, Sigma pays a lower share of gross revenue to its independent contractors. However, Sigma does pay contractors annual bonuses based on their number of years of affiliation with the company.<\/p><p>Swift is also analyzing Safe Bank, a regional bank holding company. Safe Bank is expected to have an earnings growth rate of 3% going forward and its ROE is 12%. Current BVPS is $50.<\/p><\/div><\/details><div class=\"qtext\"><p>Assuming a 9% required rate of return and using the residual income model, the value of Safe Bank&#x27;s equity is closest to:<\/p><\/div>","subj":"equity"},{"n":21,"q":"Based on Exhibit 1, which stock is the most undervalued by applying the justified price-to-book value method?","opts":["Able Corporation.","Baker, Inc.","Charles Company."],"ans":"B","expl":"The justified price-to-book value (P/B) ratio is calculated as: P/B = (ROE − g) / (r − g) where:\ngrowth rate: g = ROE × (1 − payout) Able: g = 0.25 × (1 − 1.00 / 2.50) = 0.15 Baker: g = 0.15 × (1 − 1.60 / 4.80) = 0.10 Charles: g = 0.08 × (1 − 2.50 / 4.00) = 0.03 Justified price-to-book value (P/B):\nAble: P/B = (0.25 − 0.15) / (0.20 − 0.15) = 2, implying price = 2 × 10 = $20 Baker: P/B = (0.15 − 0.10) / (0.12 − 0.10) = 2.5, implying price = 2.5 × 32 = $80 Charles: P/B = (0.08 − 0.03) / (0.10 − 0.03) = 0.71, implying price = 0.71 × 50 = $35.5 Able sells for $60, triple its value; Baker sells for $70, 12% below its value; and Charles sells for $35.5, right at its value.\n(Module 22.4, LOS 22.m)","explhtml":"<p>The justified price-to-book value (P/B) ratio is calculated as: P/B = (ROE − g) / (r − g) where:<\/p><p>growth rate: g = ROE × (1 − payout) Able: g = 0.25 × (1 − 1.00 / 2.50) = 0.15 Baker: g = 0.15 × (1 − 1.60 / 4.80) = 0.10 Charles: g = 0.08 × (1 − 2.50 / 4.00) = 0.03 Justified price-to-book value (P/B):<\/p><p>Able: P/B = (0.25 − 0.15) / (0.20 − 0.15) = 2, implying price = 2 × 10 = $20 Baker: P/B = (0.15 − 0.10) / (0.12 − 0.10) = 2.5, implying price = 2.5 × 32 = $80 Charles: P/B = (0.08 − 0.03) / (0.10 − 0.03) = 0.71, implying price = 0.71 × 50 = $35.5 Able sells for $60, triple its value; Baker sells for $70, 12% below its value; and Charles sells for $35.5, right at its value.<\/p><p>(Module 22.4, LOS 22.m)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>Able Corporation<\/td><td>Baker, Inc.<\/td><td>Charles Company<\/td><td><\/td><\/tr><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, which stock is the most undervalued by applying the justified price-to-book value method?<\/p><\/div>","subj":"equity"},{"n":22,"q":"Based on Exhibit 1, the justified price-to-sales ratio of Baker, Inc., is closest to:","opts":["1.5.","1.7.","1.9."],"ans":"B","expl":"The justified price-to-sales (P/S) ratio is calculated as: P/S = [profit margin × payout ratio × (1 + g)] / (r − g) Baker: P/S = [(4.80 / 52.80) × (1.60 / 4.80) × (1 + 0.10)] / (0.12 − 0.10) = 1.67 (Module 22.4, LOS 22.m)","explhtml":"<p>The justified price-to-sales (P/S) ratio is calculated as: P/S = [profit margin × payout ratio × (1 + g)] / (r − g) Baker: P/S = [(4.80 / 52.80) × (1.60 / 4.80) × (1 + 0.10)] / (0.12 − 0.10) = 1.67 (Module 22.4, LOS 22.m)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>Able Corporation<\/td><td>Baker, Inc.<\/td><td>Charles Company<\/td><td><\/td><\/tr><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the justified price-to-sales ratio of Baker, Inc., is closest to:<\/p><\/div>","subj":"equity"},{"n":23,"q":"If valuation is based on the justified price-to-sales ratio, Armor should conclude that Able Corporation is:","opts":["overvalued; the stock trades at more than double its value based on a justified price-to-sales ratio.","overvalued relative to Baker, but undervalued relative to Charles.","undervalued; the stock trad
