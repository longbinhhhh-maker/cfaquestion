es at less than half its value based on a justified price-to- sales ratio."],"ans":"A","expl":"Able Corporation should sell for [(2.50 / 115) × (1.00 / 2.50) × (1 + 0.15)] / (0.20 − 0.15) = 0.20 × sales, or $23/share. The current market price of $60 is 161% overvalued. Baker trades for $70 versus a value of 1.67 × 52.8 = $88, a discount of 20%. Charles trades for $35.50 versus a value of 1.43 × 25.75 = 37, a negligible discount of 4%.\n(Module 22.4, LOS 22.h)","explhtml":"<p>Able Corporation should sell for [(2.50 / 115) × (1.00 / 2.50) × (1 + 0.15)] / (0.20 − 0.15) = 0.20 × sales, or $23/share. The current market price of $60 is 161% overvalued. Baker trades for $70 versus a value of 1.67 × 52.8 = $88, a discount of 20%. Charles trades for $35.50 versus a value of 1.43 × 25.75 = 37, a negligible discount of 4%.<\/p><p>(Module 22.4, LOS 22.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>Able Corporation<\/td><td>Baker, Inc.<\/td><td>Charles Company<\/td><td><\/td><\/tr><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>If valuation is based on the justified price-to-sales ratio, Armor should conclude that Able Corporation is:<\/p><\/div>","subj":"equity"},{"n":24,"q":"Armor has been asked to identify the relative valuation merits of the three stocks. Which of the following statements is correct?","opts":["Able Corporation is the best investment because it has the highest ROE.","Charles Company is the best investment because the stock is priced below book value.","Able Corporation’s earnings should grow the fastest due to its high ROE and retention ratio."],"ans":"C","expl":"A high ROE does not make a company a good investment, nor does a high book value. However, Able Corporation does have the highest potential growth rate. Because the justified values for Charles Company are near the market price, there does not appear to be any problem with the valuation inputs (e.g., required return). The similarity between the justified P/B value and the market price of Charles indicates that it is fairly priced and not an especially attractive investment.\n(Module 22.4, LOS 22.h)","explhtml":"<p>A high ROE does not make a company a good investment, nor does a high book value. However, Able Corporation does have the highest potential growth rate. Because the justified values for Charles Company are near the market price, there does not appear to be any problem with the valuation inputs (e.g., required return). The similarity between the justified P/B value and the market price of Charles indicates that it is fairly priced and not an especially attractive investment.<\/p><p>(Module 22.4, LOS 22.h)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 21–24 · Equity Valuation<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>George Armor, CFA, is a new stock analyst for Pedad Investments. One tool that Pedad uses to compare stock valuations is the dividend discount model (DDM). In particular, the firm evaluates stocks in terms of &quot;justified&quot; multiples of sales and book value. These multiples are based on algebraic manipulation of the DDM. Over time, these multiples seem to provide a good check on the market valuation of a stock relative to the company&#x27;s fundamentals. Any stock that is currently priced below its value based on a justified multiple of sales or book value is considered attractive for purchase by Pedad portfolio managers. Exhibit 1 contains financial information from the year just ended for three stable companies in the meatpacking industry: Able Corporation, Baker, Inc., and Charles Company, from which Armor will derive his valuation estimates.<\/p><p>Exhibit 1: Selected Financial Information<\/p><div class=\"tbl\"><table><tr><td>Able Corporation<\/td><td>Baker, Inc.<\/td><td>Charles Company<\/td><td><\/td><\/tr><tr><td>Revenue/share<\/td><td>$115.00<\/td><td>$52.80<\/td><td>$25.75<\/td><\/tr><tr><td>EPS<\/td><td>$2.50<\/td><td>$4.80<\/td><td>$4.00<\/td><\/tr><tr><td>DPS<\/td><td>$1.00<\/td><td>$1.60<\/td><td>$2.50<\/td><\/tr><tr><td>ROE<\/td><td>25%<\/td><td>15%<\/td><td>8%<\/td><\/tr><tr><td>Book value per share<\/td><td>$10.00<\/td><td>$32.00<\/td><td>$50.00<\/td><\/tr><tr><td>Stock price per share (current)<\/td><td>$60.00<\/td><td>$70.00<\/td><td>$35.50<\/td><\/tr><tr><td>Required return<\/td><td>20%<\/td><td>12%<\/td><td>10%<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Armor has been asked to identify the relative valuation merits of the three stocks. Which of the following statements is correct?<\/p><\/div>","subj":"equity"},{"n":25,"q":"Hellens's claim regarding the 2-year forward contract on the 5-year, risk-free, zero coupon bond is most accurately described as:","opts":["incorrect, as the quoted price is roughly in line with the forward pricing model.","incorrect, as the quoted price is much lower than the forward pricing model would suggest.","correct."],"ans":"A","expl":"To obtain F(2,5), first calculate the 2-year discount factor P2 and the 7-year discount factor P7.\n2\nP2 | = 1 / (1 + 0.0036) 7 | = 0.9928\nP7 | = 1 / (1 + 0.0227) | = 0.8546\nF(2,5) | = 0.8546 / 0.9928 | = 0.8608\nAlternatively:\n(1/5)\nUsing forward price, f(2,5) | = (1 / 0.8608) | – 1 | = 3.043%\n5 | 2+5 | 2\nUsing spot rates, [1+f(2,5)] | = [(1 + S(2+5)) | /  (1 + S2)] (1/5) | = 1.1617\n[1+ f(2,5)] | = 1.1617 | = 1.03043\nf(2,5) | = 0.03043 | = 3.043%\n(Module 25.1, LOS 25.a)","explhtml":"<p>To obtain F(2,5), first calculate the 2-year discount factor P2 and the 7-year discount factor P7.<\/p><p><sup>2<\/sup><\/p><div class=\"tbl\"><table><tr><td>P2<\/td><td>= 1 / (1 + 0.0036) <sup>7<\/sup><\/td><td>= 0.9928<\/td><\/tr><tr><td>P7<\/td><td>= 1 / (1 + 0.0227)<\/td><td>= 0.8546<\/td><\/tr><tr><td>F(2,5)<\/td><td>= 0.8546 / 0.9928<\/td><td>= 0.8608<\/td><\/tr><\/table><\/div><p>Alternatively:<\/p><p><sup>(1/5)<\/sup><\/p><div class=\"tbl\"><table><tr><td>Using forward price, f(2,5)<\/td><td>= (1 / 0.8608)<\/td><td>– 1<\/td><td>= 3.043%<\/td><\/tr><tr><td><sup>5<\/sup><\/td><td><sup>2+5<\/sup><\/td><td><sup>2<\/sup><\/td><td><\/td><\/tr><tr><td>Using spot rates, [1+f(2,5)]<\/td><td>= [(1 + S(2+5))<\/td><td>/  (1 + S2)] <sup>(1/5)<\/sup><\/td><td>= 1.1617<\/td><\/tr><tr><td>[1+ f(2,5)]<\/td><td>= 1.1617<\/td><td>= 1.03043<\/td><td><\/td><\/tr><tr><td>f(2,5)<\/td><td>= 0.03043<\/td><td>= 3.043%<\/td><td><\/td><\/tr><\/table><\/div><p>(Module 25.1, LOS 25.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in November. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p>Exhibit 1: U.S. Treasuries Spot Curve<\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p>Exhibit 2: Active Bond Management<\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1-year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p>Exhibit 3: Swap Curves and Spreads<\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Hellens&#x27;s claim regarding the 2-year forward contract on the 5-year, risk-free, zero coupon bond is most accurately described as:<\/p><\/div>","subj":"fixed"},{"n":26,"q":"Lindstrom's comment in Exhibit 2 on active bond management is most likely:","opts":["correct. incorrect, as the forward price will be unchanged if the 1-year spot rate","occurring in one year is equal to the current 1-year forward rate one year from now [f (1,1)].","incorrect, as the forward price will be unchanged if the 1-year spot rate occurring in one year is equal to the current 1-year spot rate."],"ans":"B","expl":"Spot rates should evolve in line with the current forward rates. (Module 25.1, LOS 25.b)","explhtml":"<p>Spot rates should evolve in line with the current forward rates. (Module 25.1, LOS 25.b)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in November. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p>Exhibit 1: U.S. Treasuries Spot Curve<\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p>Exhibit 2: Active Bond Management<\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1-year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p>Exhibit 3: Swap Curves and Spreads<\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Lindstrom&#x27;s comment in Exhibit 2 on active bond management is most likely:<\/p><\/div>","subj":"fixed"},{"n":27,"q":"Which of the advantages of swap curves listed in Exhibit 3 is accurate?","opts":["Advantage one only.","Advantage two only.","Both advantages one and two are accurate."],"ans":"A","expl":"Retail banks typically have little exposure to swaps and, consequently, they typically use the government yield curve. The swap curve is more commonly used by wholesale banks.\n(Module 25.2, LOS 25.d)","explhtml":"<p>Retail banks typically have little exposure to swaps and, consequently, they typically use the government yield curve. The swap curve is more commonly used by wholesale banks.<\/p><p>(Module 25.2, LOS 25.d)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in November. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p>Exhibit 1: U.S. Treasuries Spot Curve<\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p>Exhibit 2: Active Bond Management<\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1-year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p>Exhibit 3: Swap Curves and Spreads<\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the advantages of swap curves listed in Exhibit 3 is accurate?<\/p><\/div>","subj":"fixed"},{"n":28,"q":"Gorman's definition of the swap spread in Exhibit 3 is best described as:","opts":["correct.","incorrect, as the spread is compared to the corporate bond being valued, not a government security.","incorrect, as the spread uses the fixed-rate paid in the swap, not the floating rate."],"ans":"C","expl":"The swap spread is the spread paid by the fixed-rate payer of an interest rate swap over the rate on an on-the-run government security with the same maturity as the swap.\n(Module 25.3, LOS 25.e)","explhtml":"<p>The swap spread is the spread paid by the fixed-rate payer of an interest rate swap over the rate on an on-the-run government security with the same maturity as the swap.<\/p><p>(Module 25.3, LOS 25.e)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 25–28 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ande Lindstrom is currently in the final year of his undergraduate degree in finance and is preparing to take the Level I CFA exam in November. To keep on top of the material, Lindstrom runs a website for his peers who are also planning to sit for the CFA exam.<\/p><p>Lindstrom is currently reviewing several submissions from classmates on the subject of fixed-income instruments. These submissions are especially topical because the U.S. central bank raised target rate in the previous month. Lindstrom intends to post the spot rate curve shown in Exhibit 1, which is derived from U.S. Treasuries, along with any articles he agrees with.<\/p><p>Exhibit 1: U.S. Treasuries Spot Curve<\/p><div class=\"tbl\"><table><tr><td>Maturity (years)<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>7<\/td><td>10<\/td><td>20<\/td><td>30<\/td><\/tr><tr><td>Spot Rate (%)<\/td><td>0.25<\/td><td>0.36<\/td><td>0.90<\/td><td>1.49<\/td><td>2.27<\/td><td>2.94<\/td><td>3.52<\/td><td>4.00<\/td><\/tr><\/table><\/div><p>Joe Hellens, a fellow Level I candidate, has submitted an article claiming that some banks are still offering forward rates that do not fully account for the new spot curve. As a result, Hellens claims that there are arbitrage opportunities. Upon analyzing a particular bank&#x27;s offering of a 2-year forward contract on a risk-free, 5-year, zero coupon bond, Hellens states that &quot;the quoted forward price of $0.8608 per $1 is higher than it should be under the forward pricing model and, hence, arbitrage profits could be made.&quot;<\/p><p>Lindstrom is always wary of posting articles on to the website that could be interpreted as investment advice. Instead, he prefers instructional articles that allow the reader to carry out their own research. In place of Hellens&#x27;s article on potential arbitrage opportunities (the profits of which he feels would be eliminated by transaction costs), Lindstrom intends to use the comment addressing active bond management shown in Exhibit 2.<\/p><p>Exhibit 2: Active Bond Management<\/p><p>&quot;Active bond managers will seek to outperform the market by anticipating interest rate movements that are not in line with current spot and forward rates. For example, the price of a 1-year forward contract on a 1-year, zero coupon, risk-free bond will remain unchanged if the future 1-year spot rate in one year is equal to the current 2-year spot rate. If it is not, there may be an opportunity for active managers to outperform the market.&quot;<\/p><p>Dan Gorman has submitted an article for Lindstrom&#x27;s review on the topic of the swap curve. Lindstrom is aware of the curve but unsure about how it is used in computing swap spreads and in bond valuation generally. Extracts from Gorman&#x27;s article are shown in Exhibit 3.<\/p><p>Exhibit 3: Swap Curves and Spreads<\/p><p>&quot;Swap spreads make use of the swap curve. Swap curves are a popular benchmark for the time value of money as they have at least two key advantages over the government yield curve:<\/p><p>Advantage One: Some countries do not have a liquid government bond market for maturities over one year. In those markets, the swap curve is an essential benchmark.<\/p><p>Advantage Two: Retail banks generally have familiarity with the swap market because they hedge assets and liabilities on their balance sheet with swaps. For this reason, the swap rate makes a useful benchmark for the time value of money for them.&quot;<\/p><p>Swap curves can also be used to calculate the swap spread, which is an increasingly popular indicator of credit spreads in the markets. The swap spread is defined as:<\/p><p>&quot;The spread paid by the floating-rate payer of an interest rate swap over the rate of the on-the-run government security with the same maturity.&quot;<\/p><\/div><\/details><div class=\"qtext\"><p>Gorman&#x27;s definition of the swap spread in Exhibit 3 is best described as:<\/p><\/div>","subj":"fixed"},{"n":29,"q":"Which of the following positions is most likely to achieve the CFO's objective for the $68 million bond outstanding?","opts":["Pay fixed interest rate swap with quarterly settlement.","Pay floating interest rate swap with quarterly settlement.","Long FRA on 90-day MRR."],"ans":"B","expl":"The CFO is looking to reduce the duration of the fixed-rate bond. The risk here is that market interest rates drop below 6.25%, but we're stuck still paying 6.25%. We can reduce this specific risk by effectively changing that fixed payment into a floating payment. A pay floating and receive fixed swap is most likely to achieve this objective.\n(Module 30.6, LOS 30.e)","explhtml":"<p>The CFO is looking to reduce the duration of the fixed-rate bond. The risk here is that market interest rates drop below 6.25%, but we&#x27;re stuck still paying 6.25%. We can reduce this specific risk by effectively changing that fixed payment into a floating payment. A pay floating and receive fixed swap is most likely to achieve this objective.<\/p><p>(Module 30.6, LOS 30.e)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p>Exhibit 1: TorkSpark CFO Comments<\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the U.K. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>Over the past year, TorkSpark has also entered into a receiver swap, and has written call options on the stock of Perimeter, Inc., a Brazilian company listed on the NYSE. Additionally, TorkSpark has a long position in payer swaptions on a five-year interest rate swap.<\/p><p>Garton believes that the expansionary fiscal and monetary policies will soon lead to an increase in interest rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the following positions is most likely to achieve the CFO&#x27;s objective for the $68 million bond outstanding?<\/p><\/div>","subj":"derivatives"},{"n":30,"q":"In order to hedge exposure to the currency swap described by the CFO, the swap dealer would least appropriately:","opts":["borrow GBP.","borrow USD.","lend USD."],"ans":"B","expl":"TorkSpark has borrowed USD and thus should engage in a USD for GBP swap. At initiation, TorkSpark would exchange USD principal for GBP principal. During the life of the swap, TorkSpark would pay GBP interest and the swap dealer would pay USD interest. To hedge these flows, the dealer could enter into a GBP for USD swap. Alternately, the dealer could lend USD and borrow GBP.\n(Module 30.7, LOS 30.f)","explhtml":"<p>TorkSpark has borrowed USD and thus should engage in a USD for GBP swap. At initiation, TorkSpark would exchange USD principal for GBP principal. During the life of the swap, TorkSpark would pay GBP interest and the swap dealer would pay USD interest. To hedge these flows, the dealer could enter into a GBP for USD swap. Alternately, the dealer could lend USD and borrow GBP.<\/p><p>(Module 30.7, LOS 30.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p>Exhibit 1: TorkSpark CFO Comments<\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the U.K. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>Over the past year, TorkSpark has also entered into a receiver swap, and has written call options on the stock of Perimeter, Inc., a Brazilian company listed on the NYSE. Additionally, TorkSpark has a long position in payer swaptions on a five-year interest rate swap.<\/p><p>Garton believes that the expansionary fiscal and monetary policies will soon lead to an increase in interest rates.<\/p><\/div><\/details><div class=\"qtext\"><p>In order to hedge exposure to the currency swap described by the CFO, the swap dealer would least appropriately:<\/p><\/div>","subj":"derivatives"},{"n":31,"q":"If Garton's expectations about interest rates turn out to be accurate, which of TorkSpark's positions is most likely to result in a gain to the firm?","opts":["Receiver swap.","Calls on Perimeter, Inc.","Payer swaption."],"ans":"C","expl":"Garton expects interest rates to rise. An increase in rates will lead to a gain for parties entering into a payer swap and payer swaptions because that party pays the (previously lower) fixed rate and receives the (higher) future floating rate. Rho is positive for equity call options; an increase in interest rate leads to a higher value of a call option. Because TorkSpark has written the option, it has a short position in the call, and thus would experience a loss due to an increase in the value of the call option.\n(Module 31.7, LOS 31.k)","explhtml":"<p>Garton expects interest rates to rise. An increase in rates will lead to a gain for parties entering into a payer swap and payer swaptions because that party pays the (previously lower) fixed rate and receives the (higher) future floating rate. Rho is positive for equity call options; an increase in interest rate leads to a higher value of a call option. Because TorkSpark has written the option, it has a short position in the call, and thus would experience a loss due to an increase in the value of the call option.<\/p><p>(Module 31.7, LOS 31.k)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p>Exhibit 1: TorkSpark CFO Comments<\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the U.K. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>Over the past year, TorkSpark has also entered into a receiver swap, and has written call options on the stock of Perimeter, Inc., a Brazilian company listed on the NYSE. Additionally, TorkSpark has a long position in payer swaptions on a five-year interest rate swap.<\/p><p>Garton believes that the expansionary fiscal and monetary policies will soon lead to an increase in interest rates.<\/p><\/div><\/details><div class=\"qtext\"><p>If Garton&#x27;s expectations about interest rates turn out to be accurate, which of TorkSpark&#x27;s positions is most likely to result in a gain to the firm?<\/p><\/div>","subj":"derivatives"},{"n":32,"q":"If Garton wants to hedge the firm's position in TorkSpark stock using put options, the resulting portfolio's gamma would most likely be:","opts":["negative.","zero.","positive."],"ans":"C","expl":"To dynamically hedge a long stock position, long put options will be used. Long stock has zero gamma while long put has positive gamma. Portfolio gamma therefore would be positive.\n(Module 31.7, LOS 31.m)","explhtml":"<p>To dynamically hedge a long stock position, long put options will be used. Long stock has zero gamma while long put has positive gamma. Portfolio gamma therefore would be positive.<\/p><p>(Module 31.7, LOS 31.m)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 29–32 · Derivatives<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jon Garton, CFA, is an equity analyst covering several industry sectors for a boutique U.S. investment firm. Currently Garton is reviewing a reply that he received from the CFO of TorkSpark, Inc., a manufacturer of automotive parts.<\/p><p>Garton had noticed that the most recent quarterly filing by TorkSpark showed an increase in the volume of derivative transactions that showed gains and losses either in the income statement or in other comprehensive income. This is the third quarter in a row that Garton has observed such an increase, and in a recent analyst call, Garton asked the CFO to give some explanation for such an increase.<\/p><p>Extracts from the CFO&#x27;s reply are shown in Exhibit 1.<\/p><p>Exhibit 1: TorkSpark CFO Comments<\/p><p>&quot;TorkSpark currently has a $68 million bond outstanding that is not due to mature until 2028. The coupon payments are fixed at 6.25% and paid quarterly. A decision was taken recently to try to reduce the interest rate risk on the bond.<\/p><p>The board also identified a need to address the financing of TorkSpark Plc., our wholly owned subsidiary in the U.K. In order to raise the 175 million GBP needed to fund an expansion of the operations, the board leveraged its relationship with the Lobman Starn banking group here in the United States.<\/p><p>TorkSpark borrowed 250 million USD and set up a USD-GBP currency swap with a swap dealer based in Europe. Unfortunately, the dealer experienced some issues trying to hedge their position, so TorkSpark agreed to settle the swap at the PV of future payments only 170 days after origination.<\/p><p>Over the past year, TorkSpark has also entered into a receiver swap, and has written call options on the stock of Perimeter, Inc., a Brazilian company listed on the NYSE. Additionally, TorkSpark has a long position in payer swaptions on a five-year interest rate swap.<\/p><p>Garton believes that the expansionary fiscal and monetary policies will soon lead to an increase in interest rates.<\/p><\/div><\/details><div class=\"qtext\"><p>If Garton wants to hedge the firm&#x27;s position in TorkSpark stock using put options, the resulting portfolio&#x27;s gamma would most likely be:<\/p><\/div>","subj":"derivatives"},{"n":33,"q":"Unlike option 3, the demand for option 1 would most likely include which factor?","opts":["Business confidence.","Wage growth.","Consumer credit."],"ans":"A","expl":"Option 1 is an office REIT while option 3 is a retail REIT. Common factors affecting both kinds of REITs include: GDP growth, population growth, wage growth, taxes, and regulations. Unique factors affecting Option 1 are: business formation, business investment, and business confidence. Unique factors affecting option 3 are: household formations, personal income, consumer confidence, consumer credit, retail sales growth, and consumer spending.\n(Module 33.1, LOS 33.b)\n-->","explhtml":"<p>Option 1 is an office REIT while option 3 is a retail REIT. Common factors affecting both kinds of REITs include: GDP growth, population growth, wage growth, taxes, and regulations. Unique factors affecting Option 1 are: business formation, business investment, and business confidence. Unique factors affecting option 3 are: household formations, personal income, consumer confidence, consumer credit, retail sales growth, and consumer spending.<\/p><p>(Module 33.1, LOS 33.b)<\/p><p>--&gt;<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<\/summary><div class=\"vig-body\"><p>Karen Westin, Kei Shinoya, and Carlos Perez, partners at PacRim Investment Consultants, are advising a client, the West Lundia Government Employees Pension Plan (WLGE), a large public pension fund. In a previous meeting with the pension board of WLGE, the PacRim team made a recommendation to increase the fund&#x27;s exposure to domestic real estate. Because of the WLGE plan&#x27;s large size and in-house expertise, the pension fund has the capacity to invest in and manage a wide variety of real estate investments. The currency in West Lundia is the West Lundian Dollar (WL$).<\/p><p>Because of the favorable real estate conditions, the consensus was to consider equity investments in real estate. Three options under consideration are:<\/p><div class=\"tbl\"><table><tr><td>Option 1: <\/td><td>Investment in an office REIT.<\/td><\/tr><tr><td>Option 2: <\/td><td>Investment in a health care REIT.<\/td><\/tr><tr><td>Option 3: <\/td><td>Investment in a retail REIT.<\/td><\/tr><\/table><\/div><p>Option 1: Direct Investment<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>WL$ 107 MM<\/td><\/tr><tr><td>Number of tenants<\/td><td>68<\/td><\/tr><tr><td>Required return on equity investment<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Option 2: Health Care REIT<\/p><div class=\"tbl\"><table><tr><td>Recent NOI<\/td><td>WL$ 140.0 MM<\/td><\/tr><tr><td>Non-cash rents<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Full year adjustment for acquisition<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Other assets<\/td><td>WL$ 50.0 MM<\/td><\/tr><tr><td>Total liabilities<\/td><td>WL$ 300.0 MM<\/td><\/tr><tr><td>Current market price per share<\/td><td>WL$ 125.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>15 MM<\/td><\/tr><tr><td>Going-in cap rate<\/td><td>7.00%<\/td><\/tr><tr><td>NOI growth rate<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Option 3: Retail REIT<\/p><div class=\"tbl\"><table><tr><td>Expected AFFO in Year 7<\/td><td>WL$ 13.5 MM<\/td><\/tr><tr><td>Holding period<\/td><td>7 years<\/td><\/tr><tr><td>Present value of all dividends for 7 years<\/td><td>WL$ 39.7 MM<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.0 MM<\/td><\/tr><tr><td>Cap rate<\/td><td>7.0%<\/td><\/tr><tr><td>Growth rate (from Year 8)<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Additional Information:<\/p><p>1. The office building under consideration has existing tenants with long-term leases that will expire in seven years.<\/p><p>2. The Retail REIT terminal value at the end of seven years is to be based on a price-to-AFFO multiple of 12x.<\/p><\/div><\/details><div class=\"qtext\"><p>Unlike option 3, the demand for option 1 would most likely include which factor?<\/p><\/div>","subj":"alternatives"},{"n":34,"q":"Based on its estimated value using the net asset value approach, the REIT identified in Option 2 is:","opts":["fairly priced.","selling at a discount.","selling at a premium."],"ans":"C","expl":"NAVPS based on forecasted NOI:\nOption #2 (REIT) | (in WL$ millions)\nRecent NOI | 140.0\nSubtract: Non-cash rents | − 5.0\nAdd: Full-year adjustment for acquisition | + 5.0\nPro forma cash NOI | 140.0\nProjected NOI @ 2.5% growth | 143.5\nEstimated value of operating real estate @ cap rate of 7.0% | 2050.0\nAdd: Other assets | + 50.0\nEstimated gross value | 2100.0\nSubtract: Total liabilities | − 300.0\nNAV | 1800.0\nNAVPS = 1800 / 15 = 120, which is lower than the current market price of WL$125.00. This REIT is selling at a premium to NAVPS.\n(Module 33.2, LOS 33.g)","explhtml":"<p>NAVPS based on forecasted NOI:<\/p><div class=\"tbl\"><table><tr><td>Option #2 (REIT)<\/td><td>(in WL$ millions)<\/td><\/tr><tr><td>Recent NOI<\/td><td>140.0<\/td><\/tr><tr><td>Subtract: Non-cash rents<\/td><td>− 5.0<\/td><\/tr><tr><td>Add: Full-year adjustment for acquisition<\/td><td>+ 5.0<\/td><\/tr><tr><td>Pro forma cash NOI<\/td><td>140.0<\/td><\/tr><tr><td>Projected NOI @ 2.5% growth<\/td><td>143.5<\/td><\/tr><tr><td>Estimated value of operating real estate @ cap rate of 7.0%<\/td><td>2050.0<\/td><\/tr><tr><td>Add: Other assets<\/td><td>+ 50.0<\/td><\/tr><tr><td>Estimated gross value<\/td><td>2100.0<\/td><\/tr><tr><td>Subtract: Total liabilities<\/td><td>− 300.0<\/td><\/tr><tr><td>NAV<\/td><td>1800.0<\/td><\/tr><\/table><\/div><p>NAVPS = 1800 / 15 = 120, which is lower than the current market price of WL$125.00. This REIT is selling at a premium to NAVPS.<\/p><p>(Module 33.2, LOS 33.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Karen Westin, Kei Shinoya, and Carlos Perez, partners at PacRim Investment Consultants, are advising a client, the West Lundia Government Employees Pension Plan (WLGE), a large public pension fund. In a previous meeting with the pension board of WLGE, the PacRim team made a recommendation to increase the fund&#x27;s exposure to domestic real estate. Because of the WLGE plan&#x27;s large size and in-house expertise, the pension fund has the capacity to invest in and manage a wide variety of real estate investments. The currency in West Lundia is the West Lundian Dollar (WL$).<\/p><p>Because of the favorable real estate conditions, the consensus was to consider equity investments in real estate. Three options under consideration are:<\/p><div class=\"tbl\"><table><tr><td>Option 1: <\/td><td>Investment in an office REIT.<\/td><\/tr><tr><td>Option 2: <\/td><td>Investment in a health care REIT.<\/td><\/tr><tr><td>Option 3: <\/td><td>Investment in a retail REIT.<\/td><\/tr><\/table><\/div><p>Option 1: Direct Investment<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>WL$ 107 MM<\/td><\/tr><tr><td>Number of tenants<\/td><td>68<\/td><\/tr><tr><td>Required return on equity investment<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Option 2: Health Care REIT<\/p><div class=\"tbl\"><table><tr><td>Recent NOI<\/td><td>WL$ 140.0 MM<\/td><\/tr><tr><td>Non-cash rents<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Full year adjustment for acquisition<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Other assets<\/td><td>WL$ 50.0 MM<\/td><\/tr><tr><td>Total liabilities<\/td><td>WL$ 300.0 MM<\/td><\/tr><tr><td>Current market price per share<\/td><td>WL$ 125.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>15 MM<\/td><\/tr><tr><td>Going-in cap rate<\/td><td>7.00%<\/td><\/tr><tr><td>NOI growth rate<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Option 3: Retail REIT<\/p><div class=\"tbl\"><table><tr><td>Expected AFFO in Year 7<\/td><td>WL$ 13.5 MM<\/td><\/tr><tr><td>Holding period<\/td><td>7 years<\/td><\/tr><tr><td>Present value of all dividends for 7 years<\/td><td>WL$ 39.7 MM<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.0 MM<\/td><\/tr><tr><td>Cap rate<\/td><td>7.0%<\/td><\/tr><tr><td>Growth rate (from Year 8)<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Additional Information:<\/p><p>1. The office building under consideration has existing tenants with long-term leases that will expire in seven years.<\/p><p>2. The Retail REIT terminal value at the end of seven years is to be based on a price-to-AFFO multiple of 12x.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on its estimated value using the net asset value approach, the REIT identified in Option 2 is:<\/p><\/div>","subj":"alternatives"},{"n":35,"q":"The estimated value per share of Option 3, using the discounted cash flow approach, is closest to:","opts":["WL$ 125.50.","WL$ 140.60.","WL$ 162.00."],"ans":"A","expl":"The terminal value estimate is 12.0 × WL$13.5 MM for end of Year 7 or WL$162.0 MM. The discount rate is the cap rate of 7.0% plus the growth rate of 2.5%, or 9.5%. Discounting this terminal value to find the present value: FV = WL$162.0 MM; I/Y = 9.5; N = 7; PV = WL$85.83 MM. Add the present value of all dividends of WL$39.7 MM for a total of WL$125.53 MM. Divide WL$125.53 MM by 1 million shares outstanding for a value per share of WL$125.53.\n(Module 33.2, LOS 33.i)","explhtml":"<p>The terminal value estimate is 12.0 × WL$13.5 MM for end of Year 7 or WL$162.0 MM. The discount rate is the cap rate of 7.0% plus the growth rate of 2.5%, or 9.5%. Discounting this terminal value to find the present value: FV = WL$162.0 MM; I/Y = 9.5; N = 7; PV = WL$85.83 MM. Add the present value of all dividends of WL$39.7 MM for a total of WL$125.53 MM. Divide WL$125.53 MM by 1 million shares outstanding for a value per share of WL$125.53.<\/p><p>(Module 33.2, LOS 33.i)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Karen Westin, Kei Shinoya, and Carlos Perez, partners at PacRim Investment Consultants, are advising a client, the West Lundia Government Employees Pension Plan (WLGE), a large public pension fund. In a previous meeting with the pension board of WLGE, the PacRim team made a recommendation to increase the fund&#x27;s exposure to domestic real estate. Because of the WLGE plan&#x27;s large size and in-house expertise, the pension fund has the capacity to invest in and manage a wide variety of real estate investments. The currency in West Lundia is the West Lundian Dollar (WL$).<\/p><p>Because of the favorable real estate conditions, the consensus was to consider equity investments in real estate. Three options under consideration are:<\/p><div class=\"tbl\"><table><tr><td>Option 1: <\/td><td>Investment in an office REIT.<\/td><\/tr><tr><td>Option 2: <\/td><td>Investment in a health care REIT.<\/td><\/tr><tr><td>Option 3: <\/td><td>Investment in a retail REIT.<\/td><\/tr><\/table><\/div><p>Option 1: Direct Investment<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>WL$ 107 MM<\/td><\/tr><tr><td>Number of tenants<\/td><td>68<\/td><\/tr><tr><td>Required return on equity investment<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Option 2: Health Care REIT<\/p><div class=\"tbl\"><table><tr><td>Recent NOI<\/td><td>WL$ 140.0 MM<\/td><\/tr><tr><td>Non-cash rents<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Full year adjustment for acquisition<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Other assets<\/td><td>WL$ 50.0 MM<\/td><\/tr><tr><td>Total liabilities<\/td><td>WL$ 300.0 MM<\/td><\/tr><tr><td>Current market price per share<\/td><td>WL$ 125.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>15 MM<\/td><\/tr><tr><td>Going-in cap rate<\/td><td>7.00%<\/td><\/tr><tr><td>NOI growth rate<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Option 3: Retail REIT<\/p><div class=\"tbl\"><table><tr><td>Expected AFFO in Year 7<\/td><td>WL$ 13.5 MM<\/td><\/tr><tr><td>Holding period<\/td><td>7 years<\/td><\/tr><tr><td>Present value of all dividends for 7 years<\/td><td>WL$ 39.7 MM<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.0 MM<\/td><\/tr><tr><td>Cap rate<\/td><td>7.0%<\/td><\/tr><tr><td>Growth rate (from Year 8)<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Additional Information:<\/p><p>1. The office building under consideration has existing tenants with long-term leases that will expire in seven years.<\/p><p>2. The Retail REIT terminal value at the end of seven years is to be based on a price-to-AFFO multiple of 12x.<\/p><\/div><\/details><div class=\"qtext\"><p>The estimated value per share of Option 3, using the discounted cash flow approach, is closest to:<\/p><\/div>","subj":"alternatives"},{"n":36,"q":"A REOC would be preferred over Option 2 if:","opts":["liquidity of the investment is critical.","the investment must be efficient in terms of corporate taxes.","capital appreciation is more highly valued than current income."],"ans":"C","expl":"Investment in both public REOCs and public REITs enjoy high liquidity, as shares of both trade on a stock exchange. Tax advantages favor REITs as REOCs are not tax-advantaged. REOCs are more reliant on capital appreciation due to their ability to reinvest cash flows, while REITs tend to have higher current income (i.e., yield).\n(Module 33.2, LOS 33.f)","explhtml":"<p>Investment in both public REOCs and public REITs enjoy high liquidity, as shares of both trade on a stock exchange. Tax advantages favor REITs as REOCs are not tax-advantaged. REOCs are more reliant on capital appreciation due to their ability to reinvest cash flows, while REITs tend to have higher current income (i.e., yield).<\/p><p>(Module 33.2, LOS 33.f)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 33–36 · Alternative Investments<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Karen Westin, Kei Shinoya, and Carlos Perez, partners at PacRim Investment Consultants, are advising a client, the West Lundia Government Employees Pension Plan (WLGE), a large public pension fund. In a previous meeting with the pension board of WLGE, the PacRim team made a recommendation to increase the fund&#x27;s exposure to domestic real estate. Because of the WLGE plan&#x27;s large size and in-house expertise, the pension fund has the capacity to invest in and manage a wide variety of real estate investments. The currency in West Lundia is the West Lundian Dollar (WL$).<\/p><p>Because of the favorable real estate conditions, the consensus was to consider equity investments in real estate. Three options under consideration are:<\/p><div class=\"tbl\"><table><tr><td>Option 1: <\/td><td>Investment in an office REIT.<\/td><\/tr><tr><td>Option 2: <\/td><td>Investment in a health care REIT.<\/td><\/tr><tr><td>Option 3: <\/td><td>Investment in a retail REIT.<\/td><\/tr><\/table><\/div><p>Option 1: Direct Investment<\/p><div class=\"tbl\"><table><tr><td>Purchase price<\/td><td>WL$ 107 MM<\/td><\/tr><tr><td>Number of tenants<\/td><td>68<\/td><\/tr><tr><td>Required return on equity investment<\/td><td>10%<\/td><\/tr><\/table><\/div><p>Option 2: Health Care REIT<\/p><div class=\"tbl\"><table><tr><td>Recent NOI<\/td><td>WL$ 140.0 MM<\/td><\/tr><tr><td>Non-cash rents<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Full year adjustment for acquisition<\/td><td>WL$ 5.0 MM<\/td><\/tr><tr><td>Other assets<\/td><td>WL$ 50.0 MM<\/td><\/tr><tr><td>Total liabilities<\/td><td>WL$ 300.0 MM<\/td><\/tr><tr><td>Current market price per share<\/td><td>WL$ 125.00<\/td><\/tr><tr><td>Shares outstanding<\/td><td>15 MM<\/td><\/tr><tr><td>Going-in cap rate<\/td><td>7.00%<\/td><\/tr><tr><td>NOI growth rate<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Option 3: Retail REIT<\/p><div class=\"tbl\"><table><tr><td>Expected AFFO in Year 7<\/td><td>WL$ 13.5 MM<\/td><\/tr><tr><td>Holding period<\/td><td>7 years<\/td><\/tr><tr><td>Present value of all dividends for 7 years<\/td><td>WL$ 39.7 MM<\/td><\/tr><tr><td>Shares outstanding<\/td><td>1.0 MM<\/td><\/tr><tr><td>Cap rate<\/td><td>7.0%<\/td><\/tr><tr><td>Growth rate (from Year 8)<\/td><td>2.50%<\/td><\/tr><\/table><\/div><p>Additional Information:<\/p><p>1. The office building under consideration has existing tenants with long-term leases that will expire in seven years.<\/p><p>2. The Retail REIT terminal value at the end of seven years is to be based on a price-to-AFFO multiple of 12x.<\/p><\/div><\/details><div class=\"qtext\"><p>A REOC would be preferred over Option 2 if:<\/p><\/div>","subj":"alternatives"},{"n":37,"q":"In Exhibit 1, the annual VaR is most accurately described as being calculated using:","opts":["a historical simulation.","the parametric method.","a Monte Carlo simulation."],"ans":"B","expl":"VaR has been calculated using the parameters (mean and standard deviation) of the portfolio and assuming a distribution for portfolio risk factors. A historical simulation would instead identify actual returns from the portfolio and identify the 5th percentile.\n(Module 37.1, LOS 37.b)","explhtml":"<p>VaR has been calculated using the parameters (mean and standard deviation) of the portfolio and assuming a distribution for portfolio risk factors. A historical simulation would instead identify actual returns from the portfolio and identify the 5th percentile.<\/p><p>(Module 37.1, LOS 37.b)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p>Exhibit 1: VaR Calculations<\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p>Assumptions:<\/p><p>250 trading days per year.<\/p><p>Risk factors are normally distributed.<\/p><p>Mean and volatility calculated using historical data over a 3-year lookback period.<\/p><p>The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p>Exhibit 2: Risk Management Measures<\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><p>Statement 1:<\/p><p>Some ETF legal structures expose the investors to counterparty risk.<\/p><div class=\"tbl\"><table><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository receipts (ADRs).<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>In Exhibit 1, the annual VaR is most accurately described as being calculated using:<\/p><\/div>","subj":"portfolio"},{"n":38,"q":"Sishek's short-term risk management recommendation is best described as an example of:","opts":["risk budgeting.","a stop loss limit.","a position limit."],"ans":"B","expl":"Liquidating a position when losses exceed a certain amount is an example of a stop loss limit.\n(Module 37.5, LOS 37.j)","explhtml":"<p>Liquidating a position when losses exceed a certain amount is an example of a stop loss limit.<\/p><p>(Module 37.5, LOS 37.j)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p>Exhibit 1: VaR Calculations<\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p>Assumptions:<\/p><p>250 trading days per year.<\/p><p>Risk factors are normally distributed.<\/p><p>Mean and volatility calculated using historical data over a 3-year lookback period.<\/p><p>The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p>Exhibit 2: Risk Management Measures<\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><p>Statement 1:<\/p><p>Some ETF legal structures expose the investors to counterparty risk.<\/p><div class=\"tbl\"><table><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository receipts (ADRs).<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Sishek&#x27;s short-term risk management recommendation is best described as an example of:<\/p><\/div>","subj":"portfolio"},{"n":39,"q":"The description of measures given by Sishek in Exhibit 2 is inaccurate with respect to:","opts":["active share because it does not require the use of a benchmark.","surplus-at-risk because it is not an application of VaR.","maximum drawdown because it is not a measure of redemptions."],"ans":"C","expl":"Maximum drawdown is most commonly defined as the worst peak-to-trough decline in a portfolio's returns, or the worst-returning month or quarter for a portfolio. Maximum drawdown is an important risk measure for hedge funds. Redemption risk is a measure for open-end funds of the percentage of a portfolio could be redeemed at peak times.\n(Module 37.4, LOS 37.l)","explhtml":"<p>Maximum drawdown is most commonly defined as the worst peak-to-trough decline in a portfolio&#x27;s returns, or the worst-returning month or quarter for a portfolio. Maximum drawdown is an important risk measure for hedge funds. Redemption risk is a measure for open-end funds of the percentage of a portfolio could be redeemed at peak times.<\/p><p>(Module 37.4, LOS 37.l)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p>Exhibit 1: VaR Calculations<\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p>Assumptions:<\/p><p>250 trading days per year.<\/p><p>Risk factors are normally distributed.<\/p><p>Mean and volatility calculated using historical data over a 3-year lookback period.<\/p><p>The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p>Exhibit 2: Risk Management Measures<\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><p>Statement 1:<\/p><p>Some ETF legal structures expose the investors to counterparty risk.<\/p><div class=\"tbl\"><table><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository receipts (ADRs).<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>The description of measures given by Sishek in Exhibit 2 is inaccurate with respect to:<\/p><\/div>","subj":"portfolio"},{"n":40,"q":"Which of Sishek's statements about risks of investing in ETF are accurate?","opts":["Only statement 1 is correct.","Only statement 2 is correct.","Both statements are correct."],"ans":"A","expl":"Statement 1 is correct. Some ETF legal structures expose investors to counterparty risk: the invested amount could be lost in the event of counterparty failure. Statement 2 is incorrect. Settlement risk is applicable for ETFs that use OTC derivative contracts, however ADRs are exchange-traded.\n(Module 35.3, LOS 35.g)","explhtml":"<p>Statement 1 is correct. Some ETF legal structures expose investors to counterparty risk: the invested amount could be lost in the event of counterparty failure. Statement 2 is incorrect. Settlement risk is applicable for ETFs that use OTC derivative contracts, however ADRs are exchange-traded.<\/p><p>(Module 35.3, LOS 35.g)<\/p>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 37–40 · Portfolio Management<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sally Sishek, CFA, works as a freelance risk management consultant in the United States. Recently, she was contacted by BlueCanopy Investments (BCI), an asset management firm that recently experienced a significant financial loss after what it described as a &quot;serious failure in multiple risk management processes.&quot;<\/p><p>Sishek has had an initial meeting with Jon Bagwell, the chief investment officer of BCI, who is leading the review of risk management following the resignation of BCI&#x27;s chief risk officer (CRO) last month.<\/p><p>Bagwell has concerns that the CRO relied too heavily on VaR as a risk measure, rather than also implementing other complimentary controls.<\/p><p>Sishek is reviewing the VaR analysis carried out by the recently departed CRO. Some of the calculations involved are shown in Exhibit 1.<\/p><p>Exhibit 1: VaR Calculations<\/p><p>Portfolio EGF Internal Ref:0300201 5% VaR<\/p><div class=\"tbl\"><table><tr><td>Inputs:<\/td><td>Mean annual return<\/td><td>9.4%<\/td><\/tr><tr><td>Annual volatility<\/td><td>14.2%<\/td><td><\/td><\/tr><\/table><\/div><p>Assumptions:<\/p><p>250 trading days per year.<\/p><p>Risk factors are normally distributed.<\/p><p>Mean and volatility calculated using historical data over a 3-year lookback period.<\/p><p>The historical standard deviation has been adjusted upward to reflect the long-term expectations relative to the lookback period.<\/p><p>5% Annual VaR = [9.4% − (1.65 × 14.2%)] = –14%<\/p><p>Sishek has some concerns about the calculations as well as the firm&#x27;s use of VaR. Bagwell admits that he has very little idea how the VaR calculations were currently used to manage risk. Sishek suggests that in the short term, the firm should immediately implement at least the following recommendation:<\/p><p>Risk Management Recommendation<\/p><p>Impose a daily 1% VaR limit of (for example) $2,000,000 on a portfolio. Monitor the portfolio for any signs of trending and liquidate the portfolio if cumulative monthly losses exceed $7,500,000.<\/p><p>She also intends to provide a list of typical risk management measures that traditional asset managers employ and agreed to put together a case study on how each of these measures could be implemented. The list she will provide is shown in Exhibit 2.<\/p><p>Exhibit 2: Risk Management Measures<\/p><p>Typical risk measures employed by traditional asset managers include:<\/p><p>1. Beta sensitivity: useful for equity only 2. Active share: a measure of similarity to a benchmark 3. Surplus-at-risk: an application of VaR 4. Maximum drawdown: percentage of portfolio redeemed at peak times<\/p><p>Bagwell states that he is concerned about risks associated with the ETFs that BCI has been investing in. Sishek makes the following statements about the risks of investing in ETFs:<\/p><p>Statement 1:<\/p><p>Some ETF legal structures expose the investors to counterparty risk.<\/p><div class=\"tbl\"><table><tr><td>Statement 2: <\/td><td>Settlement risk is a key concern for foreign equity ETFs that invest in American depository receipts (ADRs).<\/td><\/tr><\/table><\/div><\/div><\/details><div class=\"qtext\"><p>Which of Sishek&#x27;s statements about risks of investing in ETF are accurate?<\/p><\/div>","subj":"portfolio"},{"n":41,"q":"Did Sampson and/or Lawson violate the CFA Institute Standards of Professional Conduct with respect to presenting the TIM biographies to the client?","opts":["Yes, both Sampson and Lawson violated the Standards.","Yes, Sampson violated the Standards, while Lawson did not.","Neither Sampson nor Lawson violated the Standards, because such outsourcing is permitted."],"ans":"A","expl":"Standard I(C). Both Sampson and Lawson have violated Standard I(C) – Professionalism – Misrepresentation. When Sampson prepared biographies with Shadow Mountain Wealth Management Team included in them, she was obviously trying to convey the image that TIM personnel are employees of the bank trust department. This does not portray the correct business relationship between Shadow Mountain and TIM. TIM is an outsourcer to Shadow Mountain and a contract investment management provider, not an employee. Sampson is attempting to create a misleading view of the service level and investment expertise that clients could rightly expect. While Lawson was not a party to preparing such misleading business cards and marketing materials, he participated in the misrepresentation by agreeing to go ahead with the client presentation.\n(Module 42.1, LOS 42.a)","explhtml":"<p>Standard I(C). Both Sampson and Lawson have violated Standard I(C) – Professionalism – Misrepresentation. When Sampson prepared biographies with Shadow Mountain Wealth Management Team included in them, she was obviously trying to convey the image that TIM personnel are employees of the bank trust department. This does not portray the correct business relationship between Shadow Mountain and TIM. TIM is an outsourcer to Shadow Mountain and a contract investment management provider, not an employee. Sampson is attempting to create a misleading view of the service level and investment expertise that clients could rightly expect. While Lawson was not a party to preparing such misleading business cards and marketing materials, he participated in the misrepresentation by agreeing to go ahead with the client presentation.<\/p><p>(Module 42.1, LOS 42.a)<\/p>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case · Câu 41–44 · Ethical &amp; Professional Standards<\/summary><div class=\"vig-body\"><p>For the past 15 years, Susan Luna, CFA, Kyle Lawson, CFA, and Matt Miller, CFA, have worked together as equity analysts and then equity portfolio managers in the investment management division (BIMCO) of Broadway Life Insurance Company. For the past five years, the three associates have worked together managing the BIMCO Aggressive Growth Fund (BAGF). During their management tenure, the BAGF had excellent performance and was well recognized in the financial press.<\/p><p>Just over one year ago, Broadway Life was acquired by a larger company, Gobble Insurance, and as part of the consolidation process, BIMCO was closed. The closure allowed Luna, Lawson, and Miller to start their own investment management firm, Trio Investment Management LLC (TIM). TIM focuses on the small capitalization growth equities area. This is the same investment focus as the BAGF, but TIM will have individually managed accounts. Several cases have arisen calling for interpretation as to consistency with CFA Institute Standards of Professional Conduct.<\/p><p>Case 1<\/p><p>TIM markets its investment management services by contracting with small, local bank trust departments. One of the newest bank trust clients for TIM is Shadow Mountain Bank and Trust. Judy Sampson, CFA, the trust officer for Shadow Mountain, has scheduled a meeting with a potential client. When Lawson arrives for the client meeting, he finds that all the TIM marketing material, including biographies of TIM portfolio managers, has been relabeled by Sampson as the Shadow Mountain Wealth Management Team. Sampson has also added the performance of BAGF into the current TIM Equity Composite Index portfolio and relabeled the resultant combined graph, the Shadow Mountain Equity Composite Index. Sampson states that making such changes would probably please clients and improve the chances of acquiring additional trust management accounts for Shadow Mountain and TIM. Lawson goes along and makes the presentation to the potential client using the Shadow Mountain marketing material and the relabeled BAGF/TIM equity performance record.<\/p><p>Case 2<\/p><p>Susan Luna of TIM is meeting with Sol Wurtzel, an institutional salesman for Turn Byer, a large national brokerage firm. Luna complains that TIM&#x27;s technology costs are too high, especially their outside software services costs. TIM currently subscribes to two investment-related software services. The first software vendor is StockCal Software Services (StockCal), which provides valuation and stock-charting capabilities that TIM uses in its equity research and selection process. The other vendor is Add-Invest Software (Add-Invest), a software program providing account management and performance evaluation reporting, which TIM uses in developing monthly reports for all clients. In response to Luna, Wurtzel suggests that Turn Byer has an excellent soft dollar trading desk and would be willing to offer to cover TIM&#x27;s StockCal and Add-Invest expenses through soft dollar commissions. Luna then reviews TIM&#x27;s projected commission dollars for the year and decides there are more than enough soft dollars to pay the StockCal, AGF, and Add-Invest Software bills combined. Luna believes she can be assured of excellent trade execution from Turn Byer and improved profitability for TIM because of the increased use of soft dollars. Luna then directs that the StockCal and Add-Invest software services be paid for with soft dollar or client brokerage dollars.<\/p><p>Case 3<\/p><p>Sol Wurtzel, the equity sa
