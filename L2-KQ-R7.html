What is the impact if the company had originally classified the shares as fair value through P&L on the value of the assets of Company X?", "opts": ["$200,000.00", "$70,000.00", "$0.00"], "ans": "C", "expl": "If the company had originally classified the shares as fair value through P&L, the value of the assets would be the same (i.e., fair value) but the net income would have been different.", "explhtml": "<p>If the company had originally classified the shares as fair value through P&amp;L, the value of the assets would be the same (i.e., fair value) but the net income would have been different.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 48–49<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 48–49). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the impact if the company had originally classified the shares as fair value through P&amp;L on the value of the assets of Company X?<\/p><\/div>", "subj": "fsa"}, {"n": 49, "q": "If the shares were classified as fair value through P&L, what would have been the impact on the income and the stockholders' equity of Company X?", "opts": ["Stockholders' equity will rise by $200,000, but income will not change.", "Income will rise by $200,000, but stockholders' equity will not change.", "Income and stockholder's equity will rise by $200,000."], "ans": "B", "expl": "The unrealized gain of $200,000 would have been reported on the income statement. Assets and equity would be the same under either classification.", "explhtml": "<p>The unrealized gain of $200,000 would have been reported on the income statement. Assets and equity would be the same under either classification.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 48–49<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.c<\/div><div class=\"qtext\"><p>If the shares were classified as fair value through P&amp;L, what would have been the impact on the income and the stockholders&#x27; equity of Company X?<\/p><\/div>", "subj": "fsa"}, {"n": 50, "q": "If Anderson Company accounts for the Birschbach Company shares as classified as fair value through OCI, the carrying amount of these shares on Anderson's balance sheet at the end of 2012 is:", "opts": ["$3.5 million.", "$2.5 million.", "$2.6 million."], "ans": "A", "expl": "Fair value through OCI securities are measured at fair market value. (100,000)($35) = $3,500,000", "explhtml": "<p>Fair value through OCI securities are measured at fair market value.<\/p><p>(100,000)($35) = $3,500,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 50–53). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>If Anderson Company accounts for the Birschbach Company shares as classified as fair value through OCI, the carrying amount of these shares on Anderson&#x27;s balance sheet at the end of 2012 is:<\/p><\/div>", "subj": "fsa"}, {"n": 51, "q": "If Anderson Company accounts for the Birschbach Company shares using the equity method, the carrying amount of these shares on Anderson's balance sheet at the end of 2012 is closest to:", "opts": ["$2.8 million.", "$2.6 million.", "$3.5 million."], "ans": "B", "expl": "Under the equity method, market value is ignored. The carrying value of the shares is: the original investment + proportional share of earnings − dividend received. [(100,000)($25)] + [(100,000)($2.50 − 1.50)] = $2,600,000", "explhtml": "<p>Under the equity method, market value is ignored. The carrying value of the shares is: the original investment + proportional share of earnings − dividend received.<\/p><p>[(100,000)($25)] + [(100,000)($2.50 − 1.50)] = $2,600,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>If Anderson Company accounts for the Birschbach Company shares using the equity method, the carrying amount of these shares on Anderson&#x27;s balance sheet at the end of 2012 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 52, "q": "For the year 2012, the investment income that Anderson Company reports on its investment in Birschbach Company shares, if Anderson classifies the shares as fair value through OCI, is:", "opts": ["$250,000.", "$150,000.", "$100,000."], "ans": "B", "expl": "Under the fair value through OCI classification, unrealized gains and losses are not recognized on the income statement, so the only impact on the income statement is the dividend received: (100,000 shares)($1.50 per share) = $150,000", "explhtml": "<p>Under the fair value through OCI classification, unrealized gains and losses are not recognized on the income statement, so the only impact on the income statement is the dividend received:<\/p><p>(100,000 shares)($1.50 per share) = $150,000<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>For the year 2012, the investment income that Anderson Company reports on its investment in Birschbach Company shares, if Anderson classifies the shares as fair value through OCI, is:<\/p><\/div>", "subj": "fsa"}, {"n": 53, "q": "If Anderson Company accounts for the Birschbach Company shares using the equity method, the change in carrying value from 2012 to 2013 is closest to:", "opts": ["+$2,650,000.", "+$50,000.", "+$225,000."], "ans": "B", "expl": "For the equity method, the ending carrying value on the balance sheet is the beginning carrying value plus a proportion of earnings minus a proportion of dividends. For the Anderson Company, the change in the carrying value is the difference between the earnings per share and the dividends per share. Dividends per share in 2013 were $1.75 per share and the earnings per share were $2.25 per share. 100,000 shares × ($2.25 – $1.75) = +$50,000. The actual carrying value on the balance sheet is $2,600,00 + $225,000 - $175,000 = $2,650,000.", "explhtml": "<p>For the equity method, the ending carrying value on the balance sheet is the beginning carrying value plus a proportion of earnings minus a proportion of dividends. For the Anderson Company, the change in the carrying value is the difference between the earnings per share and the dividends per share. Dividends per share in 2013 were $1.75 per share and the earnings per share were $2.25 per share. 100,000 shares × ($2.25 – $1.75) = +$50,000. The actual carrying value on the balance sheet is $2,600,00 + $225,000 - $175,000 = $2,650,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 50–53<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>If Anderson Company accounts for the Birschbach Company shares using the equity method, the change in carrying value from 2012 to 2013 is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 54, "q": "Which of the following statements regarding special purpose entities (SPEs) is least accurate?", "opts": ["According to U.S. GAAP, if a SPE is considered a VIE, it must be only consolidated by the primary beneficiary.", "Under IFRS, a special purpose entity must be consolidated by the entity which exercises control over that entity.", "According to U.S. GAAP, a special purpose entity is classified as a variable interest entity (VIE) if it has at-risk equity that is sufficient to finance its own activities without additional financial support."], "ans": "C", "expl": "Under U.S. GAAP rules, a VIE could include a SPE that has at-risk equity that is insufficient to finance the entity's activities without additional financial support.", "explhtml": "<p>Under U.S. GAAP rules, a VIE could include a SPE that has at-risk equity that is insufficient to finance the entity&#x27;s activities without additional financial support.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.b<\/div><div class=\"qtext\"><p>Which of the following statements regarding special purpose entities (SPEs) is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 55, "q": "Assuming that the purchase price of an acquisition exceeds the pro-rata share of the fair value of net assets, which of the following statements is true:", "opts": ["Full goodwill method will result in a higher ROE.", "Full goodwill under U.S. GAAP would report a lower debt-to-equity ratio.", "Partial goodwill under IFRS will report a lower debt-to-equity ratio."], "ans": "B", "expl": "Since purchase price > prorate share of FVNA, goodwill is positive. Full goodwill > partial goodwill and minority interest under full goodwill will be higher than minority interest under partial goodwill. Because minority interest is part of equity, equity will be higher under full goodwill and debt-to-equity ratio will be lower. Net income would be the same and hence ROE under full goodwill will be lower.", "explhtml": "<p>Since purchase price &gt; prorate share of FVNA, goodwill is positive. Full goodwill &gt; partial goodwill and minority interest under full goodwill will be higher than minority interest under partial goodwill. Because minority interest is part of equity, equity will be higher under full goodwill and debt-to-equity ratio will be lower. Net income would be the same and hence ROE under full goodwill will be lower.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.5, LOS 7.b<\/div><div class=\"qtext\"><p>Assuming that the purchase price of an acquisition exceeds the pro-rata share of the fair value of net assets, which of the following statements is true:<\/p><\/div>", "subj": "fsa"}, {"n": 56, "q": "Last year, Parent Company acquired Sub Company for $2,000,000. On the date of acquisition, the fair value of Sub's net assets was $1,700,000. At the end of the year, the fair value of Sub is $1,950,000, and the fair value of Sub's net assets is $1,775,000. If the carrying value of Sub is $1,980,000, the impairment loss under U.S. GAAP is closest to:", "opts": ["$30,000.", "$125,000.", "$0."], "ans": "B", "expl": "Parent reported acquisition goodwill of $300,000 ($2,000,000 purchase price − $1,700,000 fair value of Sub's net assets). Since the carrying value of 1,980,000 exceeds the fair value of 1,950,000, an impairment exists. = fair value of subsidiary New goodwill  – fair value of subsidiary's assets = 1,950,000 – 1,775,000 = 175,000 Impairment loss = 300,000 – 175,000 = $125,000", "explhtml": "<p>Parent reported acquisition goodwill of $300,000 ($2,000,000 purchase price − $1,700,000 fair value of Sub&#x27;s net assets). Since the carrying value of 1,980,000 exceeds the fair value of 1,950,000, an impairment exists.<\/p><p>= fair value of subsidiary New goodwill &nbsp; – fair value<\/p><p>of subsidiary&#x27;s assets = 1,950,000 – 1,775,000 = 175,000<\/p><p>Impairment loss = 300,000 – 175,000 = $125,000<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.7, LOS 7.a<\/div><div class=\"qtext\"><p>Last year, Parent Company acquired Sub Company for $2,000,000. On the date of acquisition, the fair value of Sub&#x27;s net assets was $1,700,000.<\/p><p>At the end of the year, the fair value of Sub is $1,950,000, and the fair value of Sub&#x27;s net assets is $1,775,000. If the carrying value of Sub is $1,980,000, the impairment loss under U.S. GAAP is closest to:<\/p><\/div>", "subj": "fsa"}, {"n": 57, "q": "Equity method is:", "opts": ["recommended under IFRS and U.S. GAAP for jointly controlled entities.", "required under IFRS and under U.S. GAAP for jointly controlled entities.", "recommended under U.S. GAAP for jointly controlled entities, but is not normally permitted under IFRS."], "ans": "B", "expl": "Equity method is required under both U.S. GAAP and IFRS for jointly controlled entities.", "explhtml": "<p>Equity method is required under both U.S. GAAP and IFRS for jointly controlled entities.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"qtext\"><p>Equity method is:<\/p><\/div>", "subj": "fsa"}, {"n": 58, "q": "Under which of the following is a minority interest account most likely to appear on the consolidated balance sheet? I. The acquisition method. II. Equity method.", "opts": ["II only.", "Both I and II.", "I only."], "ans": "C", "expl": "Minority interest is included in the parent's company's equity under consolidation method only.", "explhtml": "<p>Minority interest is included in the parent&#x27;s company&#x27;s equity under consolidation method only.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.5, LOS 7.a<\/div><div class=\"qtext\"><p>Under which of the following is a minority interest account most likely to appear on the consolidated balance sheet?<\/p><p>I. The acquisition method. II. Equity method.<\/p><\/div>", "subj": "fsa"}, {"n": 59, "q": "Maverick Incorporated formed a special purpose entity (SPE) to purchase and lease a 50,000 acre ranch. The SPE financed 95% of the purchase price with debt. The remaining 5% was financed with equity capital received from two separate independent investors. The lender would not make the loan without Maverick's guarantee. How should Maverick treat the SPE in its financial statements if Maverick is the lessee?", "opts": ["Maverick must consolidate the SPE.", "No firm must consolidate the SPE.", "Each equity investor must proportionately consolidate the SPE."], "ans": "A", "expl": "The 5% at-risk equity investment is not sufficient to support the activities of the SPE without Maverick's guarantee. Thus, the SPE is considered a variable interest entity (VIE). Since Maverick is responsible for the guarantee, Maverick is the primary beneficiary and must consolidate the SPE.", "explhtml": "<p>The 5% at-risk equity investment is not sufficient to support the activities of the SPE without Maverick&#x27;s guarantee. Thus, the SPE is considered a variable interest entity (VIE). Since Maverick is responsible for the guarantee, Maverick is the primary beneficiary and must consolidate the SPE.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Maverick Incorporated formed a special purpose entity (SPE) to purchase and lease a 50,000 acre ranch. The SPE financed 95% of the purchase price with debt. The remaining 5% was financed with equity capital received from two separate independent investors. The lender would not make the loan without Maverick&#x27;s guarantee. How should Maverick treat the SPE in its financial statements if Maverick is the lessee?<\/p><\/div>", "subj": "fsa"}, {"n": 60, "q": "Which of the following investments would most likely be reported under the equity method?", "opts": ["An investment in 5% of the equity of an entity that gives the owner significant influence over that entity.", "An investment in 80% of the equity of an entity that gives the owner control over that entity.", "An investment in 40% of the equity of an entity that gives the owner control over that entity."], "ans": "A", "expl": "The parent-company must have significant influence over the management of the affiliate. Control would require the consolidation method.", "explhtml": "<p>The parent-company must have significant influence over the management of the affiliate. Control would require the consolidation method.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 60–61<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 60–61). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following investments would most likely be reported under the equity method?<\/p><\/div>", "subj": "fsa"}, {"n": 61, "q": "Luna has recorded its investment in Instate utilizing the equity method of accounting for intercorporate investments. According to FASB, which of the following statements most accurately reflects the impact on an investor's financial statements by using the equity method?", "opts": ["Market values can be compared with the carrying amount for analysis purposes, but only market values may be used in the financial statements.", "The investing firm will not make any adjustments to its financial statements to reflect its proportionate share of the investee’s net assets, but will reference the investment in the footnotes.", "The investing firm can include a proportionate share of the investee’s income in its earnings, regardless of whether or not there are actual cash flows (i.e. dividends)."], "ans": "C", "expl": "The proportionate share of the investee's income is included in the parent's income statement. Changes in the market value of the investee are not reflected in the investing firm's income statement so long as the decline in value is not considered to be permanent.", "explhtml": "<p>The proportionate share of the investee&#x27;s income is included in the parent&#x27;s income statement. Changes in the market value of the investee are not reflected in the investing firm&#x27;s income statement so long as the decline in value is not considered to be permanent.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 60–61<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Luna has recorded its investment in Instate utilizing the equity method of accounting for intercorporate investments. According to FASB, which of the following statements most accurately reflects the impact on an investor&#x27;s financial statements by using the equity method?<\/p><\/div>", "subj": "fsa"}, {"n": 62, "q": "Cosmo Inc. (Cosmo) invests in two portfolios – Portfolio 1 and Portfolio 2. Portfolio 1 contains securities classified as fair value through P&L. Portfolio 2 contains equity securities classified as fair value through OCI. Which of the following treatments of Cosmo's reporting of the investments in Portfolios 1 and 2, respectively, is most accurate? Portfolio 1  Portfolio 2", "opts": ["Unrealized Assets amounts reported at fair reported on income value. statement.", "Unrealized Assets amounts reported at fair reported on value. balance sheet.", "Unrealized Assets amounts reported at reported on cost. income statement."], "ans": "A", "expl": "Portfolio 1 contains FVPL. Therefore, the unrealized gains and losses would be reported immediately in the income statement. Portfolio 2 contains FVOCI. Therefore, the securities (assets) would be reported at fair value.", "explhtml": "<p>Portfolio 1 contains FVPL. Therefore, the unrealized gains and losses would be reported immediately in the income statement.<\/p><p>Portfolio 2 contains FVOCI. Therefore, the securities (assets) would be reported at fair value.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.2, LOS 7.a<\/div><div class=\"qtext\"><p>Cosmo Inc. (Cosmo) invests in two portfolios – Portfolio 1 and Portfolio 2. Portfolio 1 contains securities classified as fair value through P&amp;L. Portfolio 2 contains equity securities classified as fair value through OCI. Which of the following treatments of Cosmo&#x27;s reporting of the investments in Portfolios 1 and 2, respectively, is most accurate? Portfolio 1 &nbsp; Portfolio 2<\/p><\/div>", "subj": "fsa"}, {"n": 63, "q": "Which of the following statements about special purpose entities (SPE) are correct or incorrect? Statement #1: The sponsor usually maintains the decision-making power and voting\ncontrol over the SPE. Statement #2: The equity owners of an SPE usually receive a rate of return that is tied to\nthe performance of the SPE.", "opts": ["Only one is correct.", "Both are incorrect.", "Both are correct."], "ans": "B", "expl": "Both statements are incorrect. The sponsor does not usually have voting control over the SPE; the activities of an SPE are specifically detailed in governing documents created at the origination of the SPE. The structure of the SPE transfers the risks and rewards from the equity owners to the variable interest owners. In return, the equity owners usually receive a fixed rate of return.", "explhtml": "<p>Both statements are incorrect. The sponsor does not usually have voting control over the SPE; the activities of an SPE are specifically detailed in governing documents created at the origination of the SPE. The structure of the SPE transfers the risks and rewards from the equity owners to the variable interest owners. In return, the equity owners usually receive a fixed rate of return.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Which of the following statements about special purpose entities (SPE) are correct or incorrect?<\/p><div class=\"tbl\"><table><tr><td>Statement #1:<\/td><td>The sponsor usually maintains the decision-making power and voting<br>control over the SPE.<\/td><\/tr><tr><td>Statement #2:<\/td><td>The equity owners of an SPE usually receive a rate of return that is tied to<br>the performance of the SPE.<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 64, "q": "Mustang Corporation formed a special purpose entity (SPE) for purposes of providing research and development. An unrelated firm absorbs the expected losses of the SPE and the independent shareholders of the SPE receive the expected residual returns. Is the SPE considered a variable interest entity (VIE) according to FASB Interpretation No. 46(R) and is consolidation required by Mustang, respectively?", "opts": ["No ; No.", "Yes ; No.", "Yes ; Yes."], "ans": "B", "expl": "Since the shareholders do not absorb the expected losses, the SPE is considered a VIE. The unrelated firm (not Mustang) that absorbs the losses is the primary beneficiary and must consolidate the VIE.", "explhtml": "<p>Since the shareholders do not absorb the expected losses, the SPE is considered a VIE. The unrelated firm (not Mustang) that absorbs the losses is the primary beneficiary and must consolidate the VIE.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Mustang Corporation formed a special purpose entity (SPE) for purposes of providing research and development. An unrelated firm absorbs the expected losses of the SPE and the independent shareholders of the SPE receive the expected residual returns. Is the SPE considered a variable interest entity (VIE) according to FASB Interpretation No. 46(R) and is consolidation required by Mustang, respectively?<\/p><\/div>", "subj": "fsa"}, {"n": 65, "q": "Barrett Inc. is advised by its banker to create a special purpose entity (SPE) to convert its existing $15 million loan off-balance sheet. Under the terms of the deal, SPE would obtain a loan for $15 million from the bank with Barrett providing loan guarantee. Barrett would then sell $15 million of accounts receivable to the SPE and use the proceeds to pay off the current loan. Barrett prepares its financial statements under U.S. GAAP. Which of the following statements is most accurate regarding the impact of such an arrangement on Barrett's ratios?", "opts": ["Barrett’s leverage would decrease and receivable turnover would increase.", "Barrett’s leverage would remain the same while receivable turnover would increase.", "Barrett’s leverage as well as receivables turnover would remain the same."], "ans": "C", "expl": "Under U.S. GAAP, the sponsor needs to consolidate SPEs using acquisition method. The underlying loan and accounts receivable would then be included in the consolidated balance sheet and none of the financial ratios would be affected.", "explhtml": "<p>Under U.S. GAAP, the sponsor needs to consolidate SPEs using acquisition method. The underlying loan and accounts receivable would then be included in the consolidated balance sheet and none of the financial ratios would be affected.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Barrett Inc. is advised by its banker to create a special purpose entity (SPE) to convert its existing $15 million loan off-balance sheet. Under the terms of the deal, SPE would obtain a loan for $15 million from the bank with Barrett providing loan guarantee. Barrett would then sell $15 million of accounts receivable to the SPE and use the proceeds to pay off the current loan. Barrett prepares its financial statements under U.S. GAAP. Which of the following statements is most accurate regarding the impact of such an arrangement on Barrett&#x27;s ratios?<\/p><\/div>", "subj": "fsa"}, {"n": 66, "q": "Mashburn Company acquired 25% of the 100,000 outstanding shares of Humm Co. on January 1 for $250,000 in cash. Humm Co. earned $1 per share and had a dividend payout ratio of 40%. As of December 31, Humm Co. shares were trading in the open market at $12 per share. Calculate the income statement treatment of the Humm Co. investment as of December 31.", "opts": ["$10,000.", "$25,000.", "$75,000."], "ans": "B", "expl": "Under the equity method, the investor recognizes its pro-rata share of the affiliate's income on the income statement. Since Mashburn owns 25,000 shares of Humm and Humm earned $1, the income statement impact of the investment is $25,000.", "explhtml": "<p>Under the equity method, the investor recognizes its pro-rata share of the affiliate&#x27;s income on the income statement. Since Mashburn owns 25,000 shares of Humm and Humm earned $1, the income statement impact of the investment is $25,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Mashburn Company acquired 25% of the 100,000 outstanding shares of Humm Co. on January 1 for $250,000 in cash. Humm Co. earned $1 per share and had a dividend payout ratio of 40%. As of December 31, Humm Co. shares were trading in the open market at $12 per share. Calculate the income statement treatment of the Humm Co. investment as of December 31.<\/p><\/div>", "subj": "fsa"}, {"n": 67, "q": "Alpha Inc. owns 70% of the outstanding shares of Beta Inc. Compared to the debt-to-equity ratio under the partial goodwill method, Alpha's debt-to-equity ratio under the full goodwill method is most likely be:", "opts": ["lower.", "higher.", "the same."], "ans": "A", "expl": "The choice of full vs. partial goodwill will not impact consolidated debt. Compared to partial goodwill method, Alpha's equity will be higher under the full goodwill method (due to a higher minority interest value). Hence, full goodwill will report a lower debt-to-equity ratio (due to the higher denominator).", "explhtml": "<p>The choice of full vs. partial goodwill will not impact consolidated debt. Compared to partial goodwill method, Alpha&#x27;s equity will be higher under the full goodwill method (due to a higher minority interest value). Hence, full goodwill will report a lower debt-to-equity ratio (due to the higher denominator).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.7, LOS 7.a<\/div><div class=\"qtext\"><p>Alpha Inc. owns 70% of the outstanding shares of Beta Inc. Compared to the debt-to-equity ratio under the partial goodwill method, Alpha&#x27;s debt-to-equity ratio under the full goodwill method is most likely be:<\/p><\/div>", "subj": "fsa"}, {"n": 68, "q": "Firm A recently leased equipment used in its manufacturing plant. If the leased asset is worth less than $100,000 at the end of the lease, Firm A will pay the lessor the difference. Firm B provided debt financing to an unrelated entity. The debt has a provision whereby Firm B cannot be repaid until all other senior debt is satisfied. Do Firm A and Firm B have a variable interest?", "opts": ["Both have a variable interest.", "Only one has a variable interest.", "Neither have a variable interest."], "ans": "A", "expl": "A lease residual guarantee and subordinated debt are both examples of variable interests. Firm A will experience a loss if the leased asset is worth less than $100,000 at the end of the lease. Firm B will experience a loss if the senior debt is not paid in full.", "explhtml": "<p>A lease residual guarantee and subordinated debt are both examples of variable interests. Firm A will experience a loss if the leased asset is worth less than $100,000 at the end of the lease. Firm B will experience a loss if the senior debt is not paid in full.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Firm A recently leased equipment used in its manufacturing plant. If the leased asset is worth less than $100,000 at the end of the lease, Firm A will pay the lessor the difference.<\/p><p>Firm B provided debt financing to an unrelated entity. The debt has a provision whereby Firm B cannot be repaid until all other senior debt is satisfied.<\/p><p>Do Firm A and Firm B have a variable interest?<\/p><\/div>", "subj": "fsa"}, {"n": 69, "q": "Company A acquired a 50% stake in Company T on January 1, 2003 by paying T's shareholders $100,000 in cash. Pre-acquisition balance sheets for the two firms are presented below: Balance Sheet    Company A Company T Current assets $400,000 $60,000 Fixed assets 600,000 100,000 Total $1,000,000 $160,000    Current liabilities $50,000 $ 30,000 Common stock 350,000 60,000 Retained earnings 600,000 70,000 Total $1,000,000 $160,000 The fair values of company T assets and liabilities was same as the book value. Company A reports under U.S. GAAP. What are the post-acquisition balance sheet values for total assets for Company A under the equity and acquisition methods of accounting respectively?", "opts": ["$1,000,000 and $1,095,000.", "$1,000,000 and $1,130,000.", "$1,060,000 and $1,095,000."], "ans": "B", "expl": "Using the equity method will result in a decrease of the current asset account to $300,000 because of the cash outflow. However, a new non-current asset called \"Investment in Company T\" will be added to the balance sheet. This amount will be $100,000, so the total assets will remain unchanged. Under U.S. GAAP, only full goodwill is allowed. Full goodwill = fair value of company T – Book value of company T. Fair value of company T = (100,000 / 0.50 = 200,000). Book value of company T = 130,000 (total stock holder's equity = common stock + retained earnings). Goodwill = 70,000. Under acquisition, total assets will be $1,130,000 (70,000 + 400,000 + 60,000 + 600,000 + 100,000 – 100,000).", "explhtml": "<p>Using the equity method will result in a decrease of the current asset account to $300,000 because of the cash outflow. However, a new non-current asset called &quot;Investment in Company T&quot; will be added to the balance sheet. This amount will be $100,000, so the total assets will remain unchanged. Under U.S. GAAP, only full goodwill is allowed. Full goodwill = fair value of company T – Book value of company T. Fair value of company T = (100,000 / 0.50 = 200,000). Book value of company T = 130,000 (total stock holder&#x27;s equity = common stock + retained earnings). Goodwill = 70,000. Under acquisition, total assets will be $1,130,000 (70,000 + 400,000 + 60,000 + 600,000 + 100,000 – 100,000).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Company A acquired a 50% stake in Company T on January 1, 2003 by paying T&#x27;s shareholders $100,000 in cash. Pre-acquisition balance sheets for the two firms are presented below:<\/p><div class=\"tbl\"><table><tr><td colspan=3>Balance Sheet<\/td><\/tr><tr><td><\/td><td>Company A<\/td><td>Company T<\/td><\/tr><tr><td>Current assets<\/td><td>$400,000<\/td><td>$60,000<\/td><\/tr><tr><td>Fixed assets<\/td><td>600,000<\/td><td>100,000<\/td><\/tr><tr><td>Total<\/td><td>$1,000,000<\/td><td>$160,000<\/td><\/tr><tr><td>Current liabilities<\/td><td>$50,000<\/td><td>$ 30,000<\/td><\/tr><tr><td>Common stock<\/td><td>350,000<\/td><td>60,000<\/td><\/tr><tr><td>Retained earnings<\/td><td>600,000<\/td><td>70,000<\/td><\/tr><tr><td>Total<\/td><td>$1,000,000<\/td><td>$160,000<\/td><\/tr><\/table><\/div><p>The fair values of company T assets and liabilities was same as the book value. Company A reports under U.S. GAAP. What are the post-acquisition balance sheet values for total assets for Company A under the equity and acquisition methods of accounting respectively?<\/p><\/div>", "subj": "fsa"}, {"n": 70, "q": "Which of the following statements regarding asset securitizations and special purpose entities (SPEs) is most accurate?", "opts": ["When receivables are securitized, the sponsor reports the cash inflow as an investing activity in the cash flow statement.", "The SPE usually issues debt to purchase receivables from the sponsor.", "If the sponsor has no recourse, then the transaction is nothing more than a collateralized borrowing."], "ans": "B", "expl": "SPEs are often created to securitize assets, usually receivables of the sponsor. Typically, the SPE issues debt to purchase the receivables from the sponsor and the debt is repaid as the receivables are collected. When the receivables are securitized, the sponsor removes the receivables from the balance sheet and reports the cash inflow as an operating activity in the cash flow statement. If the sponsor still has recourse, the transaction is nothing more than a collateralized borrowing.", "explhtml": "<p>SPEs are often created to securitize assets, usually receivables of the sponsor. Typically, the SPE issues debt to purchase the receivables from the sponsor and the debt is repaid as the receivables are collected.<\/p><p>When the receivables are securitized, the sponsor removes the receivables from the balance sheet and reports the cash inflow as an operating activity in the cash flow statement. If the sponsor still has recourse, the transaction is nothing more than a collateralized borrowing.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Which of the following statements regarding asset securitizations and special purpose entities (SPEs) is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 71, "q": "Acme Corporation purchases a 3% interest in Bandy Company to become the single largest shareholder of Bandy. Acme will hold a seat on the Board of Directors of Bandy. Acme will account for its investment in Bandy using the:", "opts": ["equity method.", "lower of cost or market method.", "acquisition method."], "ans": "A", "expl": "Even though Acme's interest is low at only 3%, they have significant influence by having a seat on Bandy's Board of Directors. As such, they must use the equity method.", "explhtml": "<p>Even though Acme&#x27;s interest is low at only 3%, they have significant influence by having a seat on Bandy&#x27;s Board of Directors. As such, they must use the equity method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Acme Corporation purchases a 3% interest in Bandy Company to become the single largest shareholder of Bandy. Acme will hold a seat on the Board of Directors of Bandy. Acme will account for its investment in Bandy using the:<\/p><\/div>", "subj": "fsa"}, {"n": 72, "q": "What is the investment income that Zeisler Company will report for the year 2009 on its investment in Market Square Corporation shares if it continues to account for the shares as an FVOCI investment?", "opts": ["$150,000.", "$200,000.", "$250,000."], "ans": "A", "expl": "The investment income (for FVOCI securities) includes dividends and interest. In this case, the investment income from Market Square Corporation would be the dividends it paid to the number of shares Zeisler owns: 100,000 shares × $1.50 per share = $150,000.", "explhtml": "<p>The investment income (for FVOCI securities) includes dividends and interest. In this case, the investment income from Market Square Corporation would be the dividends it paid to the number of shares Zeisler owns:<\/p><p>100,000 shares × $1.50 per share = $150,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 72–75<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 72–75). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the investment income that Zeisler Company will report for the year 2009 on its investment in Market Square Corporation shares if it continues to account for the shares as an FVOCI investment?<\/p><\/div>", "subj": "fsa"}, {"n": 73, "q": "If Zeisler were to account for the Market Square Corporation shares as FVPL, assuming that the securities do not change in value between the December 15th meeting and the end of the year, the carrying amount of these shares on Zeisler's December 31, 2009 balance sheet would be:", "opts": ["$2.50 million.", "$2.75 million.", "$3.50 million."], "ans": "C", "expl": "Regardless of the FVOCI or FVPL classification, securities are carried at fair market value: 100,000 shares × $35 per share = $3,500,000.", "explhtml": "<p>Regardless of the FVOCI or FVPL classification, securities are carried at fair market value:<\/p><p>100,000 shares × $35 per share = $3,500,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 72–75<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>If Zeisler were to account for the Market Square Corporation shares as FVPL, assuming that the securities do not change in value between the December 15th meeting and the end of the year, the carrying amount of these shares on Zeisler&#x27;s December 31, 2009 balance sheet would be:<\/p><\/div>", "subj": "fsa"}, {"n": 74, "q": "If Zeisler reclassified the common stock of General Nuclear as FVPL, what effect would it have on Zeisler's 2009 income statement?", "opts": ["Reclassifying the security would have no effect on the income statement because gains and losses would be recognized in equity.", "Net income would increase.", "None, reclassification is prohibited under IFRS 9."], "ans": "C", "expl": "Initial designation for equity securities is irrevocable under IFRS 9 and hence reclassification is prohibited.", "explhtml": "<p>Initial designation for equity securities is irrevocable under IFRS 9 and hence reclassification is prohibited.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 72–75<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>If Zeisler reclassified the common stock of General Nuclear as FVPL, what effect would it have on Zeisler&#x27;s 2009 income statement?<\/p><\/div>", "subj": "fsa"}, {"n": 75, "q": "If Zeisler were to account for the Market Square Corporation shares using the equity method, assuming that the securities do not change in value between the December 15th meeting and the end of the year, the carrying amount of these shares on Zeisler's December 31, 2009 balance sheet would be:", "opts": ["$2.75 million.", "$2.60 million.", "$3.50 million."], "ans": "B", "expl": "Under the equity method the market value of the stock is ignored but the proportionate share of the earnings are added to the original investment and the proportionate share of the dividends are subtracted from the earnings. Hence, we have the original investment + (earnings − dividends) = total value of the investment. [(100,000 shares)($25)] + [(100,000 shares)($2.50 earnings − 1.50 dividend)] = $2,600,000.", "explhtml": "<p>Under the equity method the market value of the stock is ignored but the proportionate share of the earnings are added to the original investment and the proportionate share of the dividends are subtracted from the earnings. Hence, we have the original investment + (earnings − dividends) = total value of the investment.<\/p><p>[(100,000 shares)($25)] + [(100,000 shares)($2.50 earnings − 1.50 dividend)] = $2,600,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 72–75<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>If Zeisler were to account for the Market Square Corporation shares using the equity method, assuming that the securities do not change in value between the December 15th meeting and the end of the year, the carrying amount of these shares on Zeisler&#x27;s December 31, 2009 balance sheet would be:<\/p><\/div>", "subj": "fsa"}, {"n": 76, "q": "According to U.S. GAAP, goodwill is most likely to be considered impaired if the reporting unit's:", "opts": ["tangible assets acquired in a business combination decrease in value.", "carrying value (including goodwill) is greater than its fair value.", "implied value of goodwill is less than book value of goodwill."], "ans": "B", "expl": "To test goodwill for impairment under U.S. GAAP, the carrying value of the reporting unit (including goodwill) is compared to the fair value of the reporting unit. After an impairment has been detected, the loss is calculated as the difference between the book value of goodwill and the implied value of goodwill.", "explhtml": "<p>To test goodwill for impairment under U.S. GAAP, the carrying value of the reporting unit (including goodwill) is compared to the fair value of the reporting unit. After an impairment has been detected, the loss is calculated as the difference between the book value of goodwill and the implied value of goodwill.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.7, LOS 7.a<\/div><div class=\"qtext\"><p>According to U.S. GAAP, goodwill is most likely to be considered impaired if the reporting unit&#x27;s:<\/p><\/div>", "subj": "fsa"}, {"n": 77, "q": "Under IFRS rules, which of the following accounting treatments is most preferred for joint ventures where there is shared control?", "opts": ["Acquisition method.", "Proportionate consolidation method.", "Equity method."], "ans": "C", "expl": "Only equity method is now permitted under both IFRS and U.S. GAAP.", "explhtml": "<p>Only equity method is now permitted under both IFRS and U.S. GAAP.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"qtext\"><p>Under IFRS rules, which of the following accounting treatments is most preferred for joint ventures where there is shared control?<\/p><\/div>", "subj": "fsa"}, {"n": 78, "q": "Regarding accounting for joint ventures using the equity method or using proportionate consolidation, it would be most accurate to state that:", "opts": ["both IFRS and US GAAP require the proportionate consolidation method be used to account for joint ventures.", "the equity method results in a single line item on the income statement, and a single line item on the balance sheet.", "total net assets of the investor will differ between proportionate consolidation and the equity method."], "ans": "B", "expl": "On the income statement, the equity method results in a single line item (equity in income of the joint venture). On the balance sheet, the equity method also results in a single line item (investment in joint venture). Both IFRS and U.S. GAAP require the equity method of accounting for joint ventures; only under rare circumstances will proportionate consolidation be allowed for reporting of joint ventures under IFRS and U.S. GAAP. Total net assets of the investor is identical under the two methods.", "explhtml": "<p>On the income statement, the equity method results in a single line item (equity in income of the joint venture). On the balance sheet, the equity method also results in a single line item (investment in joint venture). Both IFRS and U.S. GAAP require the equity method of accounting for joint ventures; only under rare circumstances will proportionate consolidation be allowed for reporting of joint ventures under IFRS and U.S. GAAP. Total net assets of the investor is identical under the two methods.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.8, LOS 7.a<\/div><div class=\"qtext\"><p>Regarding accounting for joint ventures using the equity method or using proportionate consolidation, it would be most accurate to state that:<\/p><\/div>", "subj": "fsa"}, {"n": 79, "q": "Milburne Company purchased 1,000 shares of Marino Co. for $20 per share on January 1 classified as FVPL. By December 31, shares of Marino were trading at $15 per share in the open market. Marino Co. has 100,000 shares outstanding with a dividend yield of 2% at year end. The impact of the Marino holding on the Milburne income statement is:", "opts": ["−$4,700.", "−$5,000.", "−$5,300."], "ans": "A", "expl": "Since these securities are to be classified as FVPL securities, both the dividend received and the unrealized loss are posted to the income statement. The dividend is computed as 0.02 × $15 × 1,000 = $300 whereas the unrealized loss is $5,000 = ($15 - $20) × 1,000. The net income statement impact is $300 - $5,000 = -$4,700.", "explhtml": "<p>Since these securities are to be classified as FVPL securities, both the dividend received and the unrealized loss are posted to the income statement. The dividend is computed as 0.02 × $15 × 1,000 = $300 whereas the unrealized loss is $5,000 = ($15 - $20) × 1,000. The net income statement impact is $300 - $5,000 = -$4,700.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.2, LOS 7.c<\/div><div class=\"qtext\"><p>Milburne Company purchased 1,000 shares of Marino Co. for $20 per share on January 1 classified as FVPL. By December 31, shares of Marino were trading at $15 per share in the open market. Marino Co. has 100,000 shares outstanding with a dividend yield of 2% at year end. The impact of the Marino holding on the Milburne income statement is:<\/p><\/div>", "subj": "fsa"}, {"n": 80, "q": "After the acquisitions, the liabilities reported by Company X will be:", "opts": ["$300,000.", "$480,000.", "$460,000."], "ans": "C", "expl": "Liabilities will be equal to the starting balance plus the liability balance for Company D, which equals 300,000 + 160,000 = 460,000.", "explhtml": "<p>Liabilities will be equal to the starting balance plus the liability balance for Company D, which equals 300,000 + 160,000 = 460,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 80–83<\/div> <div class=\"pp-topic\">Module 7.5, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 80–83). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>After the acquisitions, the liabilities reported by Company X will be:<\/p><\/div>", "subj": "fsa"}, {"n": 81, "q": "After the acquisitions, minority interest reported by Company X will be:", "opts": ["$168,000.", "$0.", "$72,000."], "ans": "C", "expl": "Minority interest will be equal to the proportion not owned of Company D multiplied by the equity of Company D, which is (1 − 0.7) × 240,000 = 72,000.", "explhtml": "<p>Minority interest will be equal to the proportion not owned of Company D multiplied by the equity of Company D, which is (1 − 0.7) × 240,000 = 72,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 80–83<\/div> <div class=\"pp-topic\">Module 7.5, LOS 7.a<\/div><div class=\"qtext\"><p>After the acquisitions, minority interest reported by Company X will be:<\/p><\/div>", "subj": "fsa"}, {"n": 82, "q": "Company X will report revenue for 2007 of:", "opts": ["$2,280,000.", "$2,000,000.", "$2,400,000."], "ans": "C", "expl": "Revenues will equal the revenue of Company X and D, which is 2,000,000 + 400,000.", "explhtml": "<p>Revenues will equal the revenue of Company X and D, which is 2,000,000 + 400,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 80–83<\/div> <div class=\"pp-topic\">Module 7.5, LOS 7.a<\/div><div class=\"qtext\"><p>Company X will report revenue for 2007 of:<\/p><\/div>", "subj": "fsa"}, {"n": 83, "q": "The change in the investment in the associates account (the account that reflects all non-consolidated investments in other companies) between January 3 and December 31 is:", "opts": ["$11,400.", "$10,800.", "$27,600."], "ans": "B", "expl": "The investment in the associates account will increase from the proportionate income of Companies B and C, and will decrease from the dividends received from Companies B and C. The changes will be (0.3 × 20,000) + (0.4 × 30,000) − (0.3 × 8,000) − (0.4 × 12,000) = 10,800.", "explhtml": "<p>The investment in the associates account will increase from the proportionate income of Companies B and C, and will decrease from the dividends received from Companies B and C. The changes will be (0.3 × 20,000) + (0.4 × 30,000) − (0.3 × 8,000) − (0.4 × 12,000) = 10,800.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 80–83<\/div> <div class=\"pp-topic\">Module 7.5, LOS 7.a<\/div><div class=\"qtext\"><p>The change in the investment in the associates account (the account that reflects all non-consolidated investments in other companies) between January 3 and December 31 is:<\/p><\/div>", "subj": "fsa"}, {"n": 84, "q": "The consolidation method results in:", "opts": ["same net income as the equity method but different shareholders' equity.", "same net income and shareholders' equity as the equity method.", "same equity as the cost method."], "ans": "A", "expl": "Consolidation results in the SAME net income and higher equity as compared to the equity method.", "explhtml": "<p>Consolidation results in the SAME net income and higher equity as compared to the equity method.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>The consolidation method results in:<\/p><\/div>", "subj": "fsa"}, {"n": 85, "q": "Fiduciary Investors held two portfolios of marketable securities: $50 million in Portfolio A was accounted for as Fair value through profit or loss. $50 million in Portfolio B was accounted for as amortized cost securities. Assume that Fiduciary reclassified securities ($10 million carrying value, $8 million market value) from Portfolio B into Portfolio A. If no previous write downs were made, Fiduciary must:", "opts": ["charge $2 million to the equity section of its balance sheet.", "charge $2 million to its income statement.", "do nothing to its income statement or equity section of its balance sheet."], "ans": "B", "expl": "Reclassification of debt securities into FVPL is allowed if the business model has changed. Unrealized gain or loss on reclassification is recognized in the income statement.", "explhtml": "<p>Reclassification of debt securities into FVPL is allowed if the business model has changed. Unrealized gain or loss on reclassification is recognized in the income statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.2, LOS 7.c<\/div><div class=\"qtext\"><p>Fiduciary Investors held two portfolios of marketable securities:<\/p><p>$50 million in Portfolio A was accounted for as Fair value through profit or loss. $50 million in Portfolio B was accounted for as amortized cost securities.<\/p><p>Assume that Fiduciary reclassified securities ($10 million carrying value, $8 million market value) from Portfolio B into Portfolio A. If no previous write downs were made, Fiduciary must:<\/p><\/div>", "subj": "fsa"}, {"n": 86, "q": "Under IFRS, where an investor owns a significant number (39%) of the voting shares of an investee but has no involvement in policy making and no Board of Directors' representation, which of the following investment classifications is most appropriate to characterize the situation?", "opts": ["Significant influence.", "Investment in financial assets.", "Investment in associates."], "ans": "B", "expl": "Investment in financial assets is the correct classification here because there is no significant influence (i.e. no involvement in policy marking, no Board of Directors' representation). Although the ownership interest level is significant at 39% (it is between 20% and 50%), the lack of control classifies the investment as an investment in financial assets. Significant influence is not in investment classification per se. It is a measure of relative degree of influence.", "explhtml": "<p>Investment in financial assets is the correct classification here because there is no significant influence (i.e. no involvement in policy marking, no Board of Directors&#x27; representation). Although the ownership interest level is significant at 39% (it is between 20% and 50%), the lack of control classifies the investment as an investment in financial assets.<\/p><p>Significant influence is not in investment classification per se. It is a measure of relative degree of influence.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.1, LOS 7.b<\/div><div class=\"qtext\"><p>Under IFRS, where an investor owns a significant number (39%) of the voting shares of an investee but has no involvement in policy making and no Board of Directors&#x27; representation, which of the following investment classifications is most appropriate to characterize the situation?<\/p><\/div>", "subj": "fsa"}];
const CFG = {"title": "Reading 7 — Intercorporate Investments", "subtitle": "CFA Level II · 86 câu · Kaplan Schweser QBank 2025 (40 câu đơn · 46 câu item set)", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
  renderSubjectBreakdown();
  setSubmitButtonMode(true);
}

function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);

function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;

  const subjects=Object.keys(ranges);

    });

  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });

  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
