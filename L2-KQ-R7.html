<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading 7 — Intercorporate Investments · Kaplan QBank</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;

    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));

  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}

  }
</style>

<!--l2-vignette-start-->
<style id="l2-css">

  .pp-topic.set{color:#a855f7;background:color-mix(in srgb,#a855f7 12%,transparent)}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>

<script>
const DATA = [{"n": 1, "q": "When comparing companies that hold equity investments in other corporations, which of the following statements is most accurate? All else being equal, leverage measures for a firm using consolidation will appear:", "opts": ["more or less favorable depending on the leverage of the investee company.", "less favorable than those for a comparable firm using the equity method.", "more favorable than those for a comparable firm using the equity method."], "ans": "A", "expl": "Under consolidation, the debt of the subsidiary is included in the parent company balance sheet. Parent company's equity is also increased due to minority interest. The impact on leverage will depend on the leverage employed by the subsidiary.", "explhtml": "<p>Under consolidation, the debt of the subsidiary is included in the parent company balance sheet. Parent company&#x27;s equity is also increased due to minority interest. The impact on leverage will depend on the leverage employed by the subsidiary.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>When comparing companies that hold equity investments in other corporations, which of the following statements is most accurate? All else being equal, leverage measures for a firm using consolidation will appear:<\/p><\/div>", "subj": "fsa"}, {"n": 2, "q": "GTH Corporation has just purchased 18% of the common stock of Pittor Corporation, one of their major suppliers, making GTH the largest single shareholder in Pittor. The primary motivation for the purchase is that managerial problems at Pittor have resulted in quality control difficulties, thereby affecting the reliability of several critical component parts for GTH products. At the time of the purchase, GTH management announced they plan to be an active investor and exercise significant influence on Pittor so the quality problems can be resolved. Given these circumstances, the accounting method used to record the intercorporate investment will most likely be the:", "opts": ["equity method.", "investment in financial assets method.", "acquisition method."], "ans": "A", "expl": "Normally, due to the less than 20% ownership stake, investment in financial assets accounting would be used to record this investment. However, percentage ownership rules are guidelines only and the appropriate accounting method is dependent on the degree of influence the acquirer intends to exert. In this case, GTH has announced their desire to exert significant influence, hence, the equity method is the appropriate choice.", "explhtml": "<p>Normally, due to the less than 20% ownership stake, investment in financial assets accounting would be used to record this investment. However, percentage ownership rules are guidelines only and the appropriate accounting method is dependent on the degree of influence the acquirer intends to exert. In this case, GTH has announced their desire to exert significant influence, hence, the equity method is the appropriate choice.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>GTH Corporation has just purchased 18% of the common stock of Pittor Corporation, one of their major suppliers, making GTH the largest single shareholder in Pittor. The primary motivation for the purchase is that managerial problems at Pittor have resulted in quality control difficulties, thereby affecting the reliability of several critical component parts for GTH products. At the time of the purchase, GTH management announced they plan to be an active investor and exercise significant influence on Pittor so the quality problems can be resolved. Given these circumstances, the accounting method used to record the intercorporate investment will most likely be the:<\/p><\/div>", "subj": "fsa"}, {"n": 3, "q": "Harter Company recently acquired a 40% stake in Compton Corp. for $40 million in cash by borrowing at 10%. Harter will account for this acquisition using which of the following methods:", "opts": ["Equity method.", "Held to maturity debt securities method.", "Acquisition Method."], "ans": "A", "expl": "The 40% ownership stake would indicate that significant influence has been gained over the affiliate company. The equity method would be used.", "explhtml": "<p>The 40% ownership stake would indicate that significant influence has been gained over the affiliate company. The equity method would be used.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Harter Company recently acquired a 40% stake in Compton Corp. for $40 million in cash by borrowing at 10%. Harter will account for this acquisition using which of the following methods:<\/p><\/div>", "subj": "fsa"}, {"n": 4, "q": "A company reports an intercorporate investment using the acquisition method. Which of the following statements is most accurate?", "opts": ["The use of the acquisition method by a company will generally report the less favorable results.", "The use of the acquisition method by a company will generally report the more favorable results.", "The use of the equity method by a company will generally report the same results."], "ans": "A", "expl": "The equity method will provide more favorable results, while the acquisition method will provide less favorable results. (Under the equity method, liabilities and leverage are lower than under the acquisition method, while net profit margin, ROE, and ROA are higher.)", "explhtml": "<p>The equity method will provide more favorable results, while the acquisition method will provide less favorable results. (Under the equity method, liabilities and leverage are lower than under the acquisition method, while net profit margin, ROE, and ROA are higher.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>A company reports an intercorporate investment using the acquisition method. Which of the following statements is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 5, "q": "Milburne Company purchased 1,000 shares of Marino Co. for $20 per share on January 1. By December 31, shares of Marino were trading at $15 per share in the open market. Marino Co. has 100,000 shares outstanding with a dividend yield of 2% at year end. Milburne choose FVOCI classification for these shares. The impact of the Marino holding on the Milburne income statement is:", "opts": ["-$5,000.", "-$4,700.", "$300."], "ans": "C", "expl": "These securities are to be classified as FVOCI and hence, all unrealized gains and losses are taken to OCI in shareholder's equity on the balance sheet. Hence, the only income statement impact is the $300 dividend = 0.02 × $15 × 1,000.", "explhtml": "<p>These securities are to be classified as FVOCI and hence, all unrealized gains and losses are taken to OCI in shareholder&#x27;s equity on the balance sheet. Hence, the only income statement impact is the $300 dividend = 0.02 × $15 × 1,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.6, LOS 7.c<\/div><div class=\"qtext\"><p>Milburne Company purchased 1,000 shares of Marino Co. for $20 per share on January 1. By December 31, shares of Marino were trading at $15 per share in the open market. Marino Co. has 100,000 shares outstanding with a dividend yield of 2% at year end. Milburne choose FVOCI classification for these shares. The impact of the Marino holding on the Milburne income statement is:<\/p><\/div>", "subj": "fsa"}, {"n": 6, "q": "Assuming the equity method of accounting is used, what will be the reported investment income for Birch?", "opts": ["$60,000.00.", "$175,000.00.", "$115,000.00."], "ans": "B", "expl": "Under the equity method, dividends are not included as income to the acquirer. ($700,000 × 0.25) = $175,000 will be the reported investment income for Birch.", "explhtml": "<p>Under the equity method, dividends are not included as income to the acquirer. ($700,000 × 0.25) = $175,000 will be the reported investment income for Birch.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–9<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 6–9). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Assuming the equity method of accounting is used, what will be the reported investment income for Birch?<\/p><\/div>", "subj": "fsa"}, {"n": 7, "q": "Assuming the equity method of accounting is used, what will be the cash flow received by Birch, due to their investment in TRQ?", "opts": ["$65,400.", "$227,500.", "$52,500."], "ans": "C", "expl": "The cash flow to Birch will be the dividend received ($700,000)(0.30)(0.25) = $52,500.", "explhtml": "<p>The cash flow to Birch will be the dividend received ($700,000)(0.30)(0.25) = $52,500.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–9<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Assuming the equity method of accounting is used, what will be the cash flow received by Birch, due to their investment in TRQ?<\/p><\/div>", "subj": "fsa"}, {"n": 8, "q": "If the consolidation method is used, how much of TRQ's net income will Birch recognize in the group income statement?", "opts": ["$122,500.", "$175,000.", "$700,000."], "ans": "B", "expl": "Birch would recognize 25% of the net income = $700,000 × 0.25 = $175,000. This would be recognized line by line to include the full $700,000, then 75% would be removed as belonging to the noncontrolling interest.", "explhtml": "<p>Birch would recognize 25% of the net income = $700,000 × 0.25 = $175,000. This would be recognized line by line to include the full $700,000, then 75% would be removed as belonging to the noncontrolling interest.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–9<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>If the consolidation method is used, how much of TRQ&#x27;s net income will Birch recognize in the group income statement?<\/p><\/div>", "subj": "fsa"}, {"n": 9, "q": "Which of Fitzroy's reasons would most likely support the equity accounting method being appropriate for TRQ?", "opts": ["Reason 2.", "Reason 1.", "Reason 3."], "ans": "B", "expl": "Birch owns 1,500/6,000 = 25% of the common shares of TRQ. This suggests significant influence which would make equity accounting appropriate. The percentage of preferred shares owned is not relevant.", "explhtml": "<p>Birch owns 1,500/6,000 = 25% of the common shares of TRQ. This suggests significant influence which would make equity accounting appropriate. The percentage of preferred shares owned is not relevant.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 6–9<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Which of Fitzroy&#x27;s reasons would most likely support the equity accounting method being appropriate for TRQ?<\/p><\/div>", "subj": "fsa"}, {"n": 10, "q": "Under U.S. GAAP rules, where an investor owns 41% of the voting shares of an investee and is able to control the investee, which of the following methods of accounting is most appropriate to use?", "opts": ["Proportionate consolidation method.", "Acquisition method.", "Equity method."], "ans": "B", "expl": "It is possible to control with less than a 50% ownership interest. In this case, the investment is still considered controlling and the acquisition method would be most appropriate.", "explhtml": "<p>It is possible to control with less than a 50% ownership interest. In this case, the investment is still considered controlling and the acquisition method would be most appropriate.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.b<\/div><div class=\"qtext\"><p>Under U.S. GAAP rules, where an investor owns 41% of the voting shares of an investee and is able to control the investee, which of the following methods of accounting is most appropriate to use?<\/p><\/div>", "subj": "fsa"}, {"n": 11, "q": "Which of the following methods of accounting for investments will reflect the highest assets and liabilities on a company's balance sheet?", "opts": ["Equity method.", "Acquisition method.", "Both methods result in reporting the same balances for assets and liabilities."], "ans": "B", "expl": "The consolidation method will reflect the highest assets and liabilities. The equity method would reflect the lowest.", "explhtml": "<p>The consolidation method will reflect the highest assets and liabilities. The equity method would reflect the lowest.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>Which of the following methods of accounting for investments will reflect the highest assets and liabilities on a company&#x27;s balance sheet?<\/p><\/div>", "subj": "fsa"}, {"n": 12, "q": "Sawbuck Corporation recently acquired a 60% stake in Rawboard Inc. for $70 million in newly issued common stock. Given this information, which of the following methods should be used to account for the acquisition of Rawboard?", "opts": ["Acquisition.", "Proportionate consolidation.", "The pooling of interest method."], "ans": "A", "expl": "When the parent company has at least a 50% ownership stake and control over the subsidiary, the acquisition method is used.", "explhtml": "<p>When the parent company has at least a 50% ownership stake and control over the subsidiary, the acquisition method is used.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.4, LOS 7.a<\/div><div class=\"qtext\"><p>Sawbuck Corporation recently acquired a 60% stake in Rawboard Inc. for $70 million in newly issued common stock. Given this information, which of the following methods should be used to account for the acquisition of Rawboard?<\/p><\/div>", "subj": "fsa"}, {"n": 13, "q": "When comparing companies that hold equity investments in other corporations, which of the following statements is most accurate? All else being equal, return on asset measures for a firm using the acquisition method will appear:", "opts": ["same as for a comparable firm using the equity method.", "more favorable than those for a comparable firm using the equity method.", "less favorable than those for a comparable firm using the equity method."], "ans": "C", "expl": "All else being equal, return on asset measures for a firm using consolidation will appear less favorable than those for a comparable firm using the equity method. This is because the choice of accounting method will affect the book value of assets, while the level of net income remains the same.", "explhtml": "<p>All else being equal, return on asset measures for a firm using consolidation will appear less favorable than those for a comparable firm using the equity method. This is because the choice of accounting method will affect the book value of assets, while the level of net income remains the same.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>When comparing companies that hold equity investments in other corporations, which of the following statements is most accurate? All else being equal, return on asset measures for a firm using the acquisition method will appear:<\/p><\/div>", "subj": "fsa"}, {"n": 14, "q": "Assuming no significant influence exists, which of the following statements concerning percentage ownership and accounting method is most accurate?", "opts": ["When the ownership is less than 20%, both US GAAP and IFRS require the equity method.", "When the ownership is less than 20%, both US GAAP and IFRS require the investment in financial assets method.", "When the ownership is less than 20%, US GAAP requires the investment in financial assets method, IFRS the equity method."], "ans": "B", "expl": "When the percentage ownership is less than 20% (with no significant influence over the investee firm), both US GAAP and IFRS require the investment in financial assets method.", "explhtml": "<p>When the percentage ownership is less than 20% (with no significant influence over the investee firm), both US GAAP and IFRS require the investment in financial assets method.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–16<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 14–16). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Assuming no significant influence exists, which of the following statements concerning percentage ownership and accounting method is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 15, "q": "For instances in which Omricon holds exactly 50% of the outstanding equity of the investee firm's equity (i.e., the investee firm is a joint venture), which of the following statements is most accurate?", "opts": ["Both US GAAP and IFRS require that the equity method be used.", "IFRS and US GAAP both permit a choice between the equity method and proportional consolidation.", "IFRS requires that the equity method be used; US GAAP permits a choice between the equity method and proportional consolidation."], "ans": "A", "expl": "Equity method is required accounting method under both IFRS and U.S. GAAP for joint ventures.", "explhtml": "<p>Equity method is required accounting method under both IFRS and U.S. GAAP for joint ventures.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–16<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>For instances in which Omricon holds exactly 50% of the outstanding equity of the investee firm&#x27;s equity (i.e., the investee firm is a joint venture), which of the following statements is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 16, "q": "Relative to consolidation, using the equity method of accounting for investments results in:", "opts": ["ROA being higher than under consolidation.", "ROA being lower and leverage being higher than under consolidation.", "ROA being higher and leverage being higher than under consolidation."], "ans": "A", "expl": "Since consolidation results in inclusion of investee's assets in the investor's balance sheet, the total assets would be higher under consolidation as compared to equity method. Net income is same under either methods. ROA would be higher under equity method as compared to under consolidation. Leverage effects will depend on the debt of the investee company. Under consolidation, all of investee's debt would be included in investors balance sheet. However, total equity in the consolidated balance sheet will also be higher due to inclusion of minority interest.", "explhtml": "<p>Since consolidation results in inclusion of investee&#x27;s assets in the investor&#x27;s balance sheet, the total assets would be higher under consolidation as compared to equity method. Net income is same under either methods. ROA would be higher under equity method as compared to under consolidation. Leverage effects will depend on the debt of the investee company. Under consolidation, all of investee&#x27;s debt would be included in investors balance sheet. However, total equity in the consolidated balance sheet will also be higher due to inclusion of minority interest.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 14–16<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Relative to consolidation, using the equity method of accounting for investments results in:<\/p><\/div>", "subj": "fsa"}, {"n": 17, "q": "The equity method of accounting is most likely to be required to be used for joint ventures under:", "opts": ["IFRS but not U.S. GAAP.", "neither IFRS nor U.S. GAAP.", "both IFRS and U.S. GAAP."], "ans": "C", "expl": "Both IFRS and US GAAP require the equity method of accounting for joint ventures.(Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP.)", "explhtml": "<p>Both IFRS and US GAAP require the equity method of accounting for joint ventures.(Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP.)<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.8, LOS 7.a<\/div><div class=\"qtext\"><p>The equity method of accounting is most likely to be required to be used for joint ventures under:<\/p><\/div>", "subj": "fsa"}, {"n": 18, "q": "What will be the post-acquisition current ratio, using both the acquisition method and the equity method, respectively, for TME? The choices below represent Acquisition and Equity, respectively.", "opts": ["1.21, 1.02.", "1.04, 1.11.", "1.01, 0.92."], "ans": "C", "expl": "With the acquisition method: The current assets are ($80,000 + $38,000 - $25,000) = $93,000. The current liabilities are ($60,000 + $32,000) = $92,000. The current ratio is $93,000/$92,000 = 1.01. With the equity method: The current assets are ($80,000 - $25,000) = $55,000. The current liabilities are $60,000. The current ratio is $55,000/$60,000 = 0.92.", "explhtml": "<p>With the acquisition method: The current assets are ($80,000 + $38,000 - $25,000) = $93,000. The current liabilities are ($60,000 + $32,000) = $92,000. The current ratio is $93,000/$92,000 = 1.01. With the equity method: The current assets are ($80,000 - $25,000) = $55,000. The current liabilities are $60,000. The current ratio is $55,000/$60,000 = 0.92.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 18–20). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What will be the post-acquisition current ratio, using both the acquisition method and the equity method, respectively, for TME? The choices below represent Acquisition and Equity, respectively.<\/p><\/div>", "subj": "fsa"}, {"n": 19, "q": "Using the acquisition method to account for the acquisition, what will be the post-acquisition current assets of TME?", "opts": ["$105,000.", "$93,000.", "$118,000."], "ans": "B", "expl": "Using the acquisition basis of accounting, the post-acquisition level of the current assets is the amount of the current assets prior to acquisition minus the amount of cash used for the acquisition. ($80,000 + 38,000 – 25,000) = $93,000.", "explhtml": "<p>Using the acquisition basis of accounting, the post-acquisition level of the current assets is the amount of the current assets prior to acquisition minus the amount of cash used for the acquisition. ($80,000 + 38,000 – 25,000) = $93,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>Using the acquisition method to account for the acquisition, what will be the post-acquisition current assets of TME?<\/p><\/div>", "subj": "fsa"}, {"n": 20, "q": "Using the acquisition method to account for the acquisition, which of the following is closest to the post-acquisition amount that will be recorded as the minority interest under US GAAP?", "opts": ["$10,700.", "$6,300.", "$21,000."], "ans": "A", "expl": "Since only 70% of Abcor was purchased by TME there is a minority interest that must be accounted for, equal to the percentage of Abcor not owned by TME times Abcor's fair value. Abcor's fair value = 25,000/0.7 = 35,714.29 Under US GAAP, only full goodwill. Minority interest = 35,714.29 (0.3) = 10, 714.29", "explhtml": "<p>Since only 70% of Abcor was purchased by TME there is a minority interest that must be accounted for, equal to the percentage of Abcor not owned by TME times Abcor&#x27;s fair value.<\/p><p>Abcor&#x27;s fair value = 25,000/0.7 = 35,714.29<\/p><p>Under US GAAP, only full goodwill.<\/p><p>Minority interest = 35,714.29 (0.3) = 10, 714.29<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 18–20<\/div> <div class=\"pp-topic\">Module 7.4, LOS 7.c<\/div><div class=\"qtext\"><p>Using the acquisition method to account for the acquisition, which of the following is closest to the post-acquisition amount that will be recorded as the minority interest under US GAAP?<\/p><\/div>", "subj": "fsa"}, {"n": 21, "q": "Which of the following statements regarding special purpose entities (SPEs) is least accurate?", "opts": ["An SPE can be established as one of several legal forms, such as corporations, partnerships, or trusts, but must establish separate management from that of the sponsor.", "In general, the equity investors in an SPE can expect to receive a limited rate of return on their investment in exchange for limited risk exposure.", "An SPE can be formed to isolate specific assets from the sponsor, thus lowering the cost of capital by protecting the assets of the SPE in the event the sponsor experiences financial distress."], "ans": "A", "expl": "An SPE can take on one of many legal forms, but does not necessarily have to have separate management or employees from that of the sponsor.", "explhtml": "<p>An SPE can take on one of many legal forms, but does not necessarily have to have separate management or employees from that of the sponsor.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 21–24). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Which of the following statements regarding special purpose entities (SPEs) is least accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 22, "q": "According to US GAAP, if an SPE is to be considered a variable interest entity (VIE), it must meet which of the following conditions?", "opts": ["The equity investors in the VIE must bear all of the SPE's risk up to a predetermined level as outlined in the governing documents.", "The SPE must be consolidated by the primary beneficiary, whose status as primary beneficiary is defined by the level of the firm's percentage of voting control.", "The total at-risk equity of the SPE is not sufficient to finance the entity's activities without additional subordinated financial support."], "ans": "C", "expl": "To qualify as a VIE under US GAAP, any one of four conditions must be met, one of which is the presence of an insufficient at-risk equity investment.", "explhtml": "<p>To qualify as a VIE under US GAAP, any one of four conditions must be met, one of which is the presence of an insufficient at-risk equity investment.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>According to US GAAP, if an SPE is to be considered a variable interest entity (VIE), it must meet which of the following conditions?<\/p><\/div>", "subj": "fsa"}, {"n": 23, "q": "As outlined in FIN 46(R), the primary beneficiary of a VIE is that entity which meets which of the following conditions?", "opts": ["Holds the majority voting control of the VIE and has separate management from the VIE.", "Has exposure to the majority of the loss risks or receives the majority of the residual benefits of the VIE.", "Holds the majority voting control of the VIE and shares management with the VIE."], "ans": "B", "expl": "Unlike past accounting treatments of VIEs where consolidation was based upon voting control, FIN 46(R) recognizes the primary beneficiary of a VIE as that entity that absorbs the majority of the risks and enjoys the majority of the benefits of the VIE. The primary beneficiary is required to consolidate the VIE on their financial statements.", "explhtml": "<p>Unlike past accounting treatments of VIEs where consolidation was based upon voting control, FIN 46(R) recognizes the primary beneficiary of a VIE as that entity that absorbs the majority of the risks and enjoys the majority of the benefits of the VIE. The primary beneficiary is required to consolidate the VIE on their financial statements.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>As outlined in FIN 46(R), the primary beneficiary of a VIE is that entity which meets which of the following conditions?<\/p><\/div>", "subj": "fsa"}, {"n": 24, "q": "Assuming that QuickTime is considered a VIE in accordance with FIN 46(R), which of the following statements regarding the consolidation of QuickTime on Evergreen's financial statements is most accurate?", "opts": ["The truck dealer is supplying the financing for the majority (75%) of QuickTime's debt, so Evergreen may not consolidate QuickTime on its financial statements.", "Evergreen is exposed to the majority of QuickTime's risks and rewards, so Evergreen must consolidate QuickTime on its financial statements.", "Because the outside investor holds only nonvoting stock, Evergreen holds the majority controlling financial interest in QuickTime and must consolidate QuickTime on its financial statements."], "ans": "B", "expl": "Before the issuance of FIN 46(R), consolidation was based upon possession of voting control of an entity. FIN 46(R) uses a risk/reward approach when determining which firm must consolidate the VIE on its financial statements. Since Evergreen is the sole entity exposed to variability in QuickTime's net income, as well asset value, QuickTime should be consolidated on their financial statements.", "explhtml": "<p>Before the issuance of FIN 46(R), consolidation was based upon possession of voting control of an entity. FIN 46(R) uses a risk/reward approach when determining which firm must consolidate the VIE on its financial statements. Since Evergreen is the sole entity exposed to variability in QuickTime&#x27;s net income, as well asset value, QuickTime should be consolidated on their financial statements.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 21–24<\/div> <div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Assuming that QuickTime is considered a VIE in accordance with FIN 46(R), which of the following statements regarding the consolidation of QuickTime on Evergreen&#x27;s financial statements is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 25, "q": "In 2003, Flitenight would reflect its investment in Rocky Mountain on its income statement by recording:", "opts": ["$300,000.", "$600,000.", "−$200,000."], "ans": "B", "expl": "Under the equity method, Flitenight would record $600,000 (= $3 million × 0.2) on its 2003 income statement as its share of Rocky Mountain's earnings. The dividends received by Flitenight are already included as part of its share of Rocky Mountain's net income in the equity method.", "explhtml": "<p>Under the equity method, Flitenight would record $600,000 (= $3 million × 0.2) on its 2003 income statement as its share of Rocky Mountain&#x27;s earnings. The dividends received by Flitenight are already included as part of its share of Rocky Mountain&#x27;s net income in the equity method.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"kq-note\">Câu thuộc item set (câu 25–28). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>In 2003, Flitenight would reflect its investment in Rocky Mountain on its income statement by recording:<\/p><\/div>", "subj": "fsa"}, {"n": 26, "q": "If Flitenight were to account for its Rocky Mountain investment as an investment in financial assets instead of the equity method, Flitenight's 2004 income statement would reflect its investment in Rocky Mountain by including which of the following?", "opts": ["Nothing, since the cost of the acquisition is not adjusted until the asset is sold.", "Only income of $200,000.", "Only a loss of $160,000."], "ans": "B", "expl": "If Flitenight accounted for its Rocky Mountain investment as an investment in financial assets, in 2004 it would record on its income statement $200,000 (= $1 million × 0.2) in dividends. That method would not be a permissible choice for Flitenight, however, since it controls more than 20% of Rocky Mountain.", "explhtml": "<p>If Flitenight accounted for its Rocky Mountain investment as an investment in financial assets, in 2004 it would record on its income statement $200,000 (= $1 million × 0.2) in dividends. That method would not be a permissible choice for Flitenight, however, since it controls more than 20% of Rocky Mountain.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"qtext\"><p>If Flitenight were to account for its Rocky Mountain investment as an investment in financial assets instead of the equity method, Flitenight&#x27;s 2004 income statement would reflect its investment in Rocky Mountain by including which of the following?<\/p><\/div>", "subj": "fsa"}, {"n": 27, "q": "Under the acquisition method, minority interest is considered:", "opts": ["a liability under IFRS and US GAAP.", "equity under IFRS and a liability under US GAAP.", "equity under IFRS and US GAAP."], "ans": "C", "expl": "Under the acquisition method, minority interest is now considered equity under IFRS and US GAAP. Prior to SFAS 160 minority interest was considered either a liability or a mezzanine(hybrid) item under US GAAP.", "explhtml": "<p>Under the acquisition method, minority interest is now considered equity under IFRS and US GAAP. Prior to SFAS 160 minority interest was considered either a liability or a mezzanine(hybrid) item under US GAAP.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"qtext\"><p>Under the acquisition method, minority interest is considered:<\/p><\/div>", "subj": "fsa"}, {"n": 28, "q": "Regarding Basten's and Matthews' statements about the gain/loss that Flitenight had at the end of 2004 on its investment in Rocky Mountain, which is most accurate?", "opts": ["Basten’s statement is correct and Matthews’ statement is incorrect.", "Basten’s statement is incorrect and Matthews’ statement is correct.", "Basten’s statement is correct and Matthews’ statement is correct."], "ans": "C", "expl": "If Flitenight accounted for its Rocky Mountain investment using the equity method, the value of the investment as of December 31, 2004, would be: Flitenight's original $10 million investment + (Flitenight's share of Rocky Mountain's 2003 earnings less dividends Flitenight received in 2003) + (Flitenight's share of Rocky Mountain's 2004 earnings less dividends Flitenight received in 2004). Since we know that Flitenight owns 20% of Rocky Mountain and consequently receives 20% of the dividends that Rocky Mountain pays, we can calculate: Value of Rocky Mountain on Flitenight's books at the end of 2004 = $10 million + (0.20 × $3 million in 2003 earnings − 0.20 × $1.5 million in 2003 dividends) + (0.20 × −$800,000 in 2004 earnings − 0.20 × $1 million in 2004 dividends) = $10 million + ($600,000 − $300,000) + (−$160,000 − $200,000) = $10,000,000 + $300,000 − $360,000 = $9,940,000 Basten's statement is correct. On a cash basis, Flitenight spent $10 million to acquire its stake in Rocky Mountain, and received $500,000 (= $300,000 in 2003 dividends + $200,000 in 2004 dividends) in dividends over the two years. $500,000 in cash return on a $10,000,000 cash investment equals 5% over the two years. Matthews' statement is also correct.", "explhtml": "<p>If Flitenight accounted for its Rocky Mountain investment using the equity method, the value of the investment as of December 31, 2004, would be:<\/p><p>Flitenight&#x27;s original $10 million investment + (Flitenight&#x27;s share of Rocky Mountain&#x27;s 2003 earnings less dividends Flitenight received in 2003) + (Flitenight&#x27;s share of Rocky Mountain&#x27;s 2004 earnings less dividends Flitenight received in 2004).<\/p><p>Since we know that Flitenight owns 20% of Rocky Mountain and consequently receives 20% of the dividends that Rocky Mountain pays, we can calculate:<\/p><p>Value of Rocky Mountain on Flitenight&#x27;s books at the end of 2004 =<\/p><p>$10 million + (0.20 × $3 million in 2003 earnings − 0.20 × $1.5 million in 2003 dividends) + (0.20 × −$800,000 in 2004 earnings − 0.20 × $1 million in 2004 dividends) =<\/p><p>$10 million + ($600,000 − $300,000) + (−$160,000 − $200,000) =<\/p><p>$10,000,000 + $300,000 − $360,000 = $9,940,000<\/p><p>Basten&#x27;s statement is correct.<\/p><p>On a cash basis, Flitenight spent $10 million to acquire its stake in Rocky Mountain, and received $500,000 (= $300,000 in 2003 dividends + $200,000 in 2004 dividends) in dividends over the two years. $500,000 in cash return on a $10,000,000 cash investment equals 5% over the two years. Matthews&#x27; statement is also correct.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 25–28<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.b<\/div><div class=\"qtext\"><p>Regarding Basten&#x27;s and Matthews&#x27; statements about the gain/loss that Flitenight had at the end of 2004 on its investment in Rocky Mountain, which is most accurate?<\/p><\/div>", "subj": "fsa"}, {"n": 29, "q": "Accounting standards for intercorporate investments establish different categories of securities with distinct ways of treating them on the financial statements of the company. One category requires the securities to be carried at fair value on the balance sheet with unrealized gains and losses excluded from the income statement. This category of security classification is called debt:", "opts": ["and equity classified as fair value through P&L securities.", "securities classified at amortized cost.", "and equity securities classified as fair value through OCI."], "ans": "C", "expl": "If securities are designated as debt and equity securities classified as fair value through OCI they are to be carried at fair value on the balance sheet with unrealized gains and losses excluded from the income statement (but go into equity via OCI).", "explhtml": "<p>If securities are designated as debt and equity securities classified as fair value through OCI they are to be carried at fair value on the balance sheet with unrealized gains and losses excluded from the income statement (but go into equity via OCI).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.1, LOS 7.a<\/div><div class=\"qtext\"><p>Accounting standards for intercorporate investments establish different categories of securities with distinct ways of treating them on the financial statements of the company. One category requires the securities to be carried at fair value on the balance sheet with unrealized gains and losses excluded from the income statement. This category of security classification is called debt:<\/p><\/div>", "subj": "fsa"}, {"n": 30, "q": "Which of the following statements about variable interest entities (VIE) are correct or incorrect? Statement #1: One potential benefit of a VIE is a lower cost of capital since the assets and\nliabilities of the VIE are isolated in the event the sponsor experiences\nfinancial difficulties. Statement #2: The organizational form of a VIE must be either a partnership or a joint\nventure and it is necessary for the VIE to have separate management and\nemployees.", "opts": ["Only one is correct.", "Both are incorrect.", "Both are correct."], "ans": "A", "expl": "Statement #1 is a correct statement. A lower cost of capital is a potential benefit of forming a VIE. Statement #2 is an incorrect statement. The organizational form can be a corporation, partnership, joint venture or trust. It is not necessary for the VIE to have separate management and employees.", "explhtml": "<p>Statement #1 is a correct statement. A lower cost of capital is a potential benefit of forming a VIE. Statement #2 is an incorrect statement. The organizational form can be a corporation, partnership, joint venture or trust. It is not necessary for the VIE to have separate management and employees.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.9, LOS 7.a<\/div><div class=\"qtext\"><p>Which of the following statements about variable interest entities (VIE) are correct or incorrect?<\/p><div class=\"tbl\"><table><tr><td>Statement #1:<\/td><td>One potential benefit of a VIE is a lower cost of capital since the assets and<br>liabilities of the VIE are isolated in the event the sponsor experiences<br>financial difficulties.<\/td><\/tr><tr><td>Statement #2:<\/td><td>The organizational form of a VIE must be either a partnership or a joint<br>venture and it is necessary for the VIE to have separate management and<br>employees.<\/td><\/tr><\/table><\/div><\/div>", "subj": "fsa"}, {"n": 31, "q": "Company X owns 15% of company S and exerts significant influence over the operations of the company. The book value of the investment on December 31, 2008, is $48,000. In 2009, company S earned $100,000 and paid dividends of $20,000. The impact of the investment on the income statement of company X is:", "opts": ["$15,000.", "$12,000.", "$3,000."], "ans": "A", "expl": "Because company X exerts significant influence over company S, the investment will be treated using the equity method, even though the ownership is less than the 20% guideline. The impact on the income statement is the proportionate income of company S, which is 0.15 × 100,000 = 15,000.", "explhtml": "<p>Because company X exerts significant influence over company S, the investment will be treated using the equity method, even though the ownership is less than the 20% guideline. The impact on the income statement is the proportionate income of company S, which is 0.15 × 100,000 = 15,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Company X owns 15% of company S and exerts significant influence over the operations of the company. The book value of the investment on December 31, 2008, is $48,000. In 2009, company S earned $100,000 and paid dividends of $20,000. The impact of the investment on the income statement of company X is:<\/p><\/div>", "subj": "fsa"}, {"n": 32, "q": "On December 31, 2008 Company P invests $5,000 in Company S in exchange for 25% of the company. During 2009, Company S earns $2,000 and pays a dividend of $500. If Company P uses the equity method of accounting, what values will be reported on the balance sheet and income statement? How much cash will be recognized from the investment? Income Balance Sheet  Cash Statement", "opts": ["$5,500 $0 $0", "$5,375 $125 $500", "$5,375 $125 $125"], "ans": "B", "expl": "The carrying value on the balance sheet is $5,375, the income statement will show $500 of income, and the cash recognized is equal to the dividend of $125. Using the equity method, for 2008, Company P will: Recognize $500 ($2000 × 0.25) on its income statement as equity in the net income of Company S. Increase the investment in the Company S account on the balance sheet to $5,500, reflecting its share of the net assets of Company S. Receive $125 in cash dividends from Company S and reduce its investment in Company S by that amount to reflect the decline in the net assets of Company S due to the dividend payment. At the end of 2008, the carrying value of Company S on Company P's balance sheet will be ($5,000 original investment + $500 proportional share of Company S earnings – $125 dividend received = $5,375).", "explhtml": "<p>The carrying value on the balance sheet is $5,375, the income statement will show $500 of income, and the cash recognized is equal to the dividend of $125.<\/p><p>Using the equity method, for 2008, Company P will:<\/p><p>Recognize $500 ($2000 × 0.25) on its income statement as equity in the net income of Company S. Increase the investment in the Company S account on the balance sheet to $5,500, reflecting its share of the net assets of Company S. Receive $125 in cash dividends from Company S and reduce its investment in Company S by that amount to reflect the decline in the net assets of Company S due to the dividend payment.<\/p><p>At the end of 2008, the carrying value of Company S on Company P&#x27;s balance sheet will be ($5,000 original investment + $500 proportional share of Company S earnings – $125 dividend received = $5,375).<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>On December 31, 2008 Company P invests $5,000 in Company S in exchange for 25% of the company. During 2009, Company S earns $2,000 and pays a dividend of $500. If Company P uses the equity method of accounting, what values will be reported on the balance sheet and income statement? How much cash will be recognized from the investment?<\/p><p>Income Balance Sheet &nbsp; Cash<\/p><p>Statement<\/p><\/div>", "subj": "fsa"}, {"n": 33, "q": "Company X owns 15% of company S and exerts significant influence over the operations of the company. The book value of the investment on December 31, 2001, is $48,000. In 2002, company S earned $100,000 and paid dividends of $20,000. The value of the investment account on December 31, 2002, is:", "opts": ["$63,000.", "$60,000.", "$48,000."], "ans": "B", "expl": "Because company X exerts significant influence over company S, the investment will be treated using the equity method, even though the ownership is less than the 20% guideline. The value of the investment account is equal to the beginning balance plus the proportionate income of company S minus the dividends received from company S, which equals 48,000 + (0.15 x 100,000) − (0.15 x 20,000) = 60,000.", "explhtml": "<p>Because company X exerts significant influence over company S, the investment will be treated using the equity method, even though the ownership is less than the 20% guideline. The value of the investment account is equal to the beginning balance plus the proportionate income of company S minus the dividends received from company S, which equals 48,000 + (0.15 x 100,000) − (0.15 x 20,000) = 60,000.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.a<\/div><div class=\"qtext\"><p>Company X owns 15% of company S and exerts significant influence over the operations of the company. The book value of the investment on December 31, 2001, is $48,000. In 2002, company S earned $100,000 and paid dividends of $20,000. The value of the investment account on December 31, 2002, is:<\/p><\/div>", "subj": "fsa"}, {"n": 34, "q": "Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 1999. Which is the correct method?", "opts": ["Equity method.", "Acquisition method.", "Investment in Financial Assets method."], "ans": "A", "expl": "When a company owns an influential but non-controlling interest in another company, commonly 20-50%, it must account for it under the equity method.", "explhtml": "<p>When a company owns an influential but non-controlling interest in another company, commonly 20-50%, it must account for it under the equity method.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 34–37<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"kq-note\">Câu thuộc item set (câu 34–37). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 1999. Which is the correct method?<\/p><\/div>", "subj": "fsa"}, {"n": 35, "q": "Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 1998. Which is the correct method?", "opts": ["Investment in Financial Assets method.", "Equity method.", "Acquisition method."], "ans": "A", "expl": "When a company owns a non-influential and non-controlling interest in another company the investment must be carried at fair value. Simpson must carry its BC investment at fair value for 1998.", "explhtml": "<p>When a company owns a non-influential and non-controlling interest in another company the investment must be carried at fair value. Simpson must carry its BC investment at fair value for 1998.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 34–37<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 1998. Which is the correct method?<\/p><\/div>", "subj": "fsa"}, {"n": 36, "q": "Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 2000. Which is the correct method?", "opts": ["Acquisition method.", "Proportional consolidation method.", "Equity method."], "ans": "A", "expl": "When a company's interest in another exceeds 50% it is considered to have controlling interest and must consolidate the financial statements.", "explhtml": "<p>When a company&#x27;s interest in another exceeds 50% it is considered to have controlling interest and must consolidate the financial statements.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 34–37<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>Haggs wonders which accounting method Simpson uses to calculate the book value of the BC investment for the year ending December 31, 2000. Which is the correct method?<\/p><\/div>", "subj": "fsa"}, {"n": 37, "q": "Haggs wants to make sure that he assumes the proper accounting method when he does his analysis. The acquisition of BC stock will lead to Simpson's total net cash flow equaling which of the following for the year ending December 31, 1999?", "opts": ["$360,000.", "$−2,830,000.", "$−3,190,000."], "ans": "B", "expl": "Simpson paid a total of $−3,190,000 (290,000 shares × $11) however, they also received a dividend from BC of $360,000. For 1999 Bailey Corporation is paying $1.20 in dividends per share (1,200,000 / 1,000,000). As of December 1999, Simpson has purchased 300,000 shares of BC (= 290,000 + 10,000). So dividends received is 300,000 × $1.20 = $360,000. This will make the total cash flow for the year $−2,830,000.", "explhtml": "<p>Simpson paid a total of $−3,190,000 (290,000 shares × $11) however, they also received a dividend from BC of $360,000. For 1999 Bailey Corporation is paying $1.20 in dividends per share (1,200,000 / 1,000,000). As of December 1999, Simpson has purchased 300,000 shares of BC (= 290,000 + 10,000). So dividends received is 300,000 × $1.20 = $360,000. This will make the total cash flow for the year $−2,830,000.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 34–37<\/div> <div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>Haggs wants to make sure that he assumes the proper accounting method when he does his analysis. The acquisition of BC stock will lead to Simpson&#x27;s total net cash flow equaling which of the following for the year ending December 31, 1999?<\/p><\/div>", "subj": "fsa"}, {"n": 38, "q": "Carter Schmitz, Inc. (Schmitz) purchased 200 shares of Intelismart at $21 a share in June 2006 and classifies 80 shares as fair value through profit or loss securities and holds the remaining 120 shares as classified as fair value through OCI. Intelismart's closing price was $26 on December 31, 2006, and Schmitz did not sell any of its shares. What amount should Schmitz report on this investment under the income statement?", "opts": ["$400.", "$1,000.", "$600."], "ans": "A", "expl": "The unrealized gain on the 120 shares available for sale is $600 (26 - 21 = 5 × 120 shares). There is also an unrealized gain of $400 (5 × 80) related to the 80 shares that are classified as fair value through profit or loss which would be reported on the income statement. For securities classified as fair value through profit or loss, realized and unrealized gains and losses are reported on the income statement. For securities classified as fair value through OCI, only realized gains and losses are reported on the income statement.", "explhtml": "<p>The unrealized gain on the 120 shares available for sale is $600 (26 - 21 = 5 × 120 shares). There is also an unrealized gain of $400 (5 × 80) related to the 80 shares that are classified as fair value through profit or loss which would be reported on the income statement. For securities classified as fair value through profit or loss, realized and unrealized gains and losses are reported on the income statement. For securities classified as fair value through OCI, only realized gains and losses are reported on the income statement.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.6, LOS 7.a<\/div><div class=\"qtext\"><p>Carter Schmitz, Inc. (Schmitz) purchased 200 shares of Intelismart at $21 a share in June 2006 and classifies 80 shares as fair value through profit or loss securities and holds the remaining 120 shares as classified as fair value through OCI. Intelismart&#x27;s closing price was $26 on December 31, 2006, and Schmitz did not sell any of its shares.<\/p><p>What amount should Schmitz report on this investment under the income statement?<\/p><\/div>", "subj": "fsa"}, {"n": 39, "q": "What is the income from the equity portfolio if the securities are classified as FVPL?", "opts": ["$19,900.", "$20,900.", "–$6,600."], "ans": "A", "expl": "FVPL income is calculated as dividends plus all gains and losses (realized and unrealized). Total dividends are 2,400. GLI realized a loss on the sale of 200 shares at 45.00 per share for a total realized loss of 1,000. GLI has an unrealized gain of 8,000 (800 × (60 – 50)) on the shares purchased in Q1 and 10,500 (700 × (60 – 45)) the shares purchased in Q3, or total unrealized gains of 18,500. Therefore, total income under the FVPL classification is 19,900 (2,400 – 1,000 + 18,500).", "explhtml": "<p>FVPL income is calculated as dividends plus all gains and losses (realized and unrealized). Total dividends are 2,400. GLI realized a loss on the sale of 200 shares at 45.00 per share for a total realized loss of 1,000. GLI has an unrealized gain of 8,000 (800 × (60 – 50)) on the shares purchased in Q1 and 10,500 (700 × (60 – 45)) the shares purchased in Q3, or total unrealized gains of 18,500. Therefore, total income under the FVPL classification is 19,900 (2,400 – 1,000 + 18,500).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 7.1, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 39–42). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>What is the income from the equity portfolio if the securities are classified as FVPL?<\/p><\/div>", "subj": "fsa"}, {"n": 40, "q": "What is the balance sheet carrying value of the securities under each of the classifications at year-end? FVPL  FVOCI", "opts": ["$71,500 $71,500", "$90,000 $71,500", "$90,000 $90,000"], "ans": "C", "expl": "Under the FVPL and FVOCI classifications the balance sheet carrying values are the market values of the shares or 90,000 = (1,500 × 60).", "explhtml": "<p>Under the FVPL and FVOCI classifications the balance sheet carrying values are the market values of the shares or 90,000 = (1,500 × 60).<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 7.1, LOS 7.a<\/div><div class=\"qtext\"><p>What is the balance sheet carrying value of the securities under each of the classifications at year-end? FVPL &nbsp; FVOCI<\/p><\/div>", "subj": "fsa"}, {"n": 41, "q": "If the fixed income portfolio outlined in Exhibit 2 is remains classified as amortized cost, which of the following is closest to the interest income reported in the income statement for the year ending 31st December 2013?", "opts": ["$1,079,000.", "$1,086,000.", "$1,088,000."], "ans": "A", "expl": "The bonds will be accounted for using the amortized cost method. Interest will be calculated using the yield at the date of purchase. Yield at date of purchase can be calculated as follows: 10 N, −25,893,577 PV, 625,000 PMT, 25,000,000 FV CPT I/Y = 2.1%. This is semiannual. The annual yield is 4.2%.  Asset Interest (2.1%) Coupon 6m 25,893,577 543,765 625,000 1yr 25,812,342 542,059 625,000 18m 25,729,401 540,317 625,000 2yr 25,644,718 538,539 625,000 Total interest in 2013 (i.e., year 2) is $540,317 + $538,539 = $1,078,856.", "explhtml": "<p>The bonds will be accounted for using the amortized cost method. Interest will be calculated using the yield at the date of purchase.<\/p><p>Yield at date of purchase can be calculated as follows:<\/p><p>10 N, −25,893,577 PV, 625,000 PMT, 25,000,000 FV<\/p><p>CPT I/Y = 2.1%. This is semiannual. The annual yield is 4.2%.<\/p><div class=\"tbl\"><table><tr><td><\/td><td>Asset<\/td><td>Interest (2.1%)<\/td><td>Coupon<\/td><\/tr><tr><td>6m<\/td><td>25,893,577<\/td><td>543,765<\/td><td>625,000<\/td><\/tr><tr><td>1yr<\/td><td>25,812,342<\/td><td>542,059<\/td><td>625,000<\/td><\/tr><tr><td>18m<\/td><td>25,729,401<\/td><td>540,317<\/td><td>625,000<\/td><\/tr><tr><td>2yr<\/td><td>25,644,718<\/td><td>538,539<\/td><td>625,000<\/td><\/tr><\/table><\/div><p>Total interest in 2013 (i.e., year 2) is $540,317 + $538,539 = $1,078,856.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 7.1, LOS 7.a<\/div><div class=\"qtext\"><p>If the fixed income portfolio outlined in Exhibit 2 is remains classified as amortized cost, which of the following is closest to the interest income reported in the income statement for the year ending 31st December 2013?<\/p><\/div>", "subj": "fsa"}, {"n": 42, "q": "If the bonds are reclassified as suggested by the chief investment officer, which of the following statements is most likely correct?", "opts": ["The difference between the amortized cost and fair value will be shown in other comprehensive income.", "The difference between the amortized cost and fair value will be shown in net income.", "The difference between the purchase price and fair value will be shown in other comprehensive income."], "ans": "B", "expl": "The bonds will be shown at amortized cost. When reclassified to FVPL, the bond will be restated at fair value and the difference taken to the income statement.", "explhtml": "<p>The bonds will be shown at amortized cost. When reclassified to FVPL, the bond will be restated at fair value and the difference taken to the income statement.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 39–42<\/div> <div class=\"pp-topic\">Module 7.1, LOS 7.a<\/div><div class=\"qtext\"><p>If the bonds are reclassified as suggested by the chief investment officer, which of the following statements is most likely correct?<\/p><\/div>", "subj": "fsa"}, {"n": 43, "q": "Which of the following methods of accounting for investments will reflect the highest net income on a company's income statement?", "opts": ["Equity method.", "Both methods report the same net income.", "Acquisition method."], "ans": "B", "expl": "Both methods will report the same net income.", "explhtml": "<p>Both methods will report the same net income.<\/p>", "qhtml": "<div class=\"pp-topic\">Module 7.3, LOS 7.c<\/div><div class=\"qtext\"><p>Which of the following methods of accounting for investments will reflect the highest net income on a company&#x27;s income statement?<\/p><\/div>", "subj": "fsa"}, {"n": 44, "q": "The marketable securities balance amount shown on the balance sheet is:", "opts": ["$3,000,000.00.", "$3,100,000.00.", "$3,200,000.00."], "ans": "C", "expl": "The bonds are classified as debt securities at amortized cost. Since the bonds were purchased at par, the amortized cost = cost (par). The stocks are valued at market value.", "explhtml": "<p>The bonds are classified as debt securities at amortized cost. Since the bonds were purchased at par, the amortized cost = cost (par). The stocks are valued at market value.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 44–47<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.a<\/div><div class=\"kq-note\">Câu thuộc item set (câu 44–47). File đáp án Kaplan không kèm đoạn vignette/exhibit chung của case — một số số liệu chỉ xuất hiện trong phần giải thích.<\/div><div class=\"qtext\"><p>The marketable securities balance amount shown on the balance sheet is:<\/p><\/div>", "subj": "fsa"}, {"n": 45, "q": "In late 20X6, Company X decided to reclassify the investments in stock. What classification can the company classify the investment in stocks to?", "opts": ["Fair value through profit or loss or amortized cost.", "Reclassification would not be allowed.", "Fair value through profit or loss only."], "ans": "B", "expl": "The initial choice of classification into fair value through OCI is irrevocable and reclassification is not allowed for equity securities.", "explhtml": "<p>The initial choice of classification into fair value through OCI is irrevocable and reclassification is not allowed for equity securities.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 44–47<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.a<\/div><div class=\"qtext\"><p>In late 20X6, Company X decided to reclassify the investments in stock. What classification can the company classify the investment in stocks to?<\/p><\/div>", "subj": "fsa"}, {"n": 46, "q": "The appropriate classification for the investment in government bonds would be:", "opts": ["amortized cost, fair value through OCI, or fair value through profit or loss.", "amortized cost or fair value through OCI.", "amortized cost or fair value through profit or loss."], "ans": "A", "expl": "Under IFRS 9 debt securities can be classified at amortized cost (if they meet business model and cash flow characteristic test), fair value through OCI, or fair value through profit or loss.", "explhtml": "<p>Under IFRS 9 debt securities can be classified at amortized cost (if they meet business model and cash flow characteristic test), fair value through OCI, or fair value through profit or loss.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 44–47<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.a<\/div><div class=\"qtext\"><p>The appropriate classification for the investment in government bonds would be:<\/p><\/div>", "subj": "fsa"}, {"n": 47, "q": "Assuming that the investments were initially classified as fair value through profit or loss. The company can reclassify:", "opts": ["debt security only if the business model has changed.", "equity security but only into fair value through OCI.", "both debt and equity securities into fair value through OCI."], "ans": "A", "expl": "Reclassification of equity securities under the standards is not permitted as the initial designation (FVPL or FVOCI) is irrevocable. Reclassification of debt securities from amortized cost to FVPL (or vice versa) is permitted only if the business model has changed.", "explhtml": "<p>Reclassification of equity securities under the standards is not permitted as the initial designation (FVPL or FVOCI) is irrevocable. Reclassification of debt securities from amortized cost to FVPL (or vice versa) is permitted only if the business model has changed.<\/p>", "qhtml": "<div class=\"pp-topic set\">Item set · câu 44–47<\/div> <div class=\"pp-topic\">Module 7.2, LOS 7.a<\/div><div class=\"qtext\"><p>Assuming that the investments were initially classified as fair value through profit or loss. The company can reclassify:<\/p><\/div>", "subj": "fsa"}, {"n": 48, "q": "
