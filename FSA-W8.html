<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#6366f1; --accent2:#818cf8;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#6366f1; --accent2:#4f46e5;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#6d5efc; --accent2:#9d8bff;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#6d5efc; --accent2:#5346e0;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(109,94,252,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(157,139,255,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(109,94,252,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(109,94,252,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
</head>
<body>
<header>
  <button class="back-btn" onclick="location.href='/'" title="Quay lại danh sách">← Quay lại</button>
  <div class="htext">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <span id="badge" class="badge"></span>
  <span id="timer" class="timer hidden">--:--</span>
  <button id="themeBtn" onclick="toggleTheme()" title="Sáng / Tối"></button>
  <button id="navBtn" class="nav-toggle" onclick="toggleNav()">☰ Câu hỏi</button>
  <button id="pauseBtn" onclick="togglePause()" style="display:none">⏸ Tạm dừng</button>
  <button onclick="restart()">↻ Làm lại</button>
  <button class="btn-primary" onclick="requestSubmit()">Nộp bài</button>
</header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<div id="resumeNote" class="resume-note"></div>

<main id="quiz"></main>

<aside id="navPanel">
  <div class="nav-head"><b>Danh sách câu</b>
    <button onclick="toggleNav()">✕</button></div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"  onclick="setFilter('all',this)">Tất cả <span></span></button>
    <button class="chip"        data-f="done" onclick="setFilter('done',this)">Đã làm <span></span></button>
    <button class="chip"        data-f="todo" onclick="setFilter('todo',this)">Chưa làm <span></span></button>
    <button class="chip"        data-f="pin"  onclick="setFilter('pin',this)">Đã ghim <span></span></button>
  </div>
  <div class="grid" id="navGrid"></div>
</aside>

<div id="confirmOverlay" class="overlay">
  <div class="modal">
    <h3>Nộp bài?</h3>
    <p id="confirmMsg"></p>
    <div class="modal-actions">
      <button onclick="closeConfirm()">Tiếp tục làm</button>
      <button class="btn-primary" onclick="confirmSubmit()">Nộp bài</button>
    </div>
  </div>
</div>

<div id="pauseOverlay" class="overlay">
  <div class="modal pause-box">
    <div class="big">⏸</div>
    <h3>Đã tạm dừng</h3>
    <p>Đồng hồ đang dừng. Bấm tiếp tục để làm bài.</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-primary" onclick="togglePause()">▶ Tiếp tục</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"n": 1, "q": "Which of the following items is most likely to appear on a company's balance sheet?", "opts": ["Weighted average coupon rate for long-term debt", "Specific details for leases treated as finance leases", "Separate carrying values for short- and long-term debt"], "ans": "C", "expl": "Presentation of liabilities\nShown on balance sheet Shown on footnotes\nDetails on each bond issue (ie, maturity, stated\nTotal carrying value of noncurrent\nrate, effective rate) and finance leases\ndebt\nRequired payments for the next five years\nTotal carrying value of current debt\n(including leases)\n(ie, due within 12 months)\nCollateral pledged\nTotal carrying value of leases\nLines of credit and other contingent financing\npayable for finance leases\nsources\nA company normally presents a single line on its balance sheet for the total carrying value of its long-term debt and includes a similar line under\ncurrent liabilities for its short-term debt. The footnotes to the financial statements contain (for each liability) details such as maturity, coupon rate,\nand effective interest rate (Choice A). The footnotes also provide detailed information on leases that the company treats as finance leases\n(Choice B).\nCFA Institute curriculum does not address whether IFRS or US GAAP specify mandatory disclosures for noncurrent liabilities. Instead, it presents\na general \"best practices\" guide to what analysts can expect to see in a company's financial statements concerning those liabilities.\nThings to remember:\nCompanies normally present minimal information concerning their noncurrent liabilities on their balance sheets; in general, there is one line each\nfor long- and short-term debt. Detailed information regarding a company's liabilities is contained in the footnotes to its financial statements.\nDescribe the financial statement presentation of and disclosures relating to long-term liabilities and share-based compensation", "qhtml": null, "explfigs": null}, {"n": 2, "q": "Which of the following is most likely a reason for a company to lease, rather than purchase, an asset? The company does not have to:", "opts": ["report a lease liability on the balance sheet.", "report a leased asset on the balance sheet.", "risk disposing of the asset at a below-market residual value."], "ans": "C", "expl": "Leasing an asset gives the lessee the right to use the asset for a fixed time in exchange for periodic payments to the lessor (ie, owner of the\nasset). There are several motivations for a company to lease an asset instead or purchasing it.\nLess costly upfront: Leasing, unlike buying, typically does not require an up-front down payment.\nLooser restrictions: Leasing an asset circumvents the need to finance an expensive purchase with borrowed funds, which typically include\nstrict covenants.\nLess asset disposal risk: The lessee does not have to worry about disposing of the assets at below-market salvage (ie, residual) values.\nAccounting rules require lessees to record the fair value of a lease as an asset and liability at the inception of the lease (Choices A and B).\nThings to remember:\nMotivations for leasing instead of purchasing an asset include less up-front costs, more flexible terms, and reduced exposure to a decline in the\nleased asset's value.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}, {"n": 3, "q": "Under IFRS, at the inception of a lease, a lessee would most appropriately record a(n):", "opts": ["expense equal to the average periodic lease payment.", "long-term asset equal to the present value of lease payments.", "long-term liability equal to the total amount of future lease payments."], "ans": "B", "expl": "Financial statement impact to the lessee\nGoverning standard Balance sheet Income statement Cash flow statement\nReduction of lease liability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified period. Under IFRS, all leases\nare treated like asset purchases financed with borrowed funds (similar to the treatment of finance leases under US GAAP). At inception, the\nlessee records on its balance sheet a long-term asset and liability equal to the present value of the future lease payments (Choice C). The\nlessee depreciates the asset during the term of the lease.\nThe periodic lease payments are apportioned toward interest payments and liability reduction each period. In this respect, a lease is conceptually\nvery similar to amortizing a long-term loan.\n(Choice A) Under US GAAP, the amount of the average periodic lease payment in an operating lease is recorded as an expense each period on\nthe income statement. Operating leases are treated like rental agreements.\nThings to remember:\nUnder IFRS, all leases are treated like asset purchases financed with borrowed funds. At inception, the lessee records a long-term asset and\nliability equal to the present value of the future lease payments. The asset is depreciated periodically throughout the term of the lease, and\nperiodic lease payments are apportioned toward interest payments and liability reduction each period.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}, {"n": 4, "q": "A company maintains a defined benefit plan for its employees. It recently determined that its employees' life expectancy has increased, which will increase the company's pension liability. The amount of the increased liability can only be estimated. Under US GAAP, the company most appropriately reports the increased liability on its financial statements:", "opts": ["in the footnotes only, since it cannot determine the amount of increase.", "as part of other comprehensive income and amortizes the increase over time.", "as part of other comprehensive income but does not amortize the increase over time."], "ans": "B", "expl": "Treatment of defined benefit (DB) plan items for IFRS and US GAAP\nIFRS US GAAP\nIncrease in service costs\nIncrease in service costs\nPension liability – interest\nIncome statement Pension liability – interest expense\nexpense\nPension surplus – interest income\nExpected return on plan assets\nActuarial gains/losses (not amortized over time) Actuarial gains/losses (amortized\nOther comprehensive\nDifference between actual return on plan assets and return over time)\nincome (OCI)\nincluded in net income Past service costs\nDetermining the amount of a company's future defined benefit (DB) plan obligation involves making estimates based on actuarial assumptions for\ncost variables such as life expectancy during retirement. Changes to these assumptions cause the company to increase or decrease its future\nobligation. These changes translate into gains or losses in the period when the change occurs.\nIFRS and US GAAP both require the company to recognize the gain or loss in other comprehensive income (OCI), but they differ in how the\ncompany treats the OCI item in subsequent years. US GAAP require the company to amortize the gain or loss ratably over time. The effect of\namortization is that reported pension expense is more consistent from year to year. IFRS do not permit this \"smoothing\" technique.\n(Choice A) Estimates of pension liability based on variables such as life expectancy are examples of actuarial assumptions. Both IFRS and US\nGAAP permit use of actuarial assumptions to determine the amount of pension expense that companies can recognize.\n(Choice C) IFRS do not permit amortization of pension items included in OCI. Those items remain in OCI until the company recognizes the gain\nor loss. This typically causes a company reporting under IFRS to show more variability in year-to-year pension expense.\nThings to remember:\nCompanies use actuarial assumptions to calculate pension expense and liabilities. IFRS and US GAAP differ in how they require companies to\ntreat changes in pension liability due to actuarial gains and losses. For items included in OCI, US GAAP require companies to amortize the gains\nand losses ratably to \"smooth\" pension expense each year, while IFRS prohibit such amortization.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null, "explfigs": null}, {"n": 5, "q": "The impact on a lessor's financial statements in the first year of a lease that was newly classified as a sales-type lease rather than a direct- financing lease is most likely higher:", "opts": ["leverage.", "return on equity.", "depreciation expense."], "ans": "B", "expl": "A finance lease removes the leased asset from the lessor's balance sheet and treats the lessee as the owner. This means that the lessee, not\nthe lessor, depreciates the asset; therefore, the lessor's depreciation expense decreases rather than increases (Choice C).\nA finance lease also assumes that the lessee \"purchased\" the asset with funds borrowed from the lessor. The purchase \"price\" is the present\nvalue of the lease payments. For the lessor, this creates an asset (eg, lease receivable) that replaces the leased item; therefore, the lessor's total\nassets are unchanged. Leverage is defined as assets divided by owners' equity, and since the numerator does not increase, leverage does not\nincrease (Choice A).\nUS GAAP (but not IFRS) further classify a finance lease as either a direct-finance or a sales-type lease. When the present value of all lease\npayments equals the asset's carrying value at the beginning of the lease, the lease is a direct-finance lease. When the payments' present value\nexceeds the lessor's carrying value at commencement, the lease is a sales-type lease.\nWith a sales-type lease, the lessor recognizes the difference between the present value and carrying value as a gain in the first year of the\nlease. This gain increases the lessor's net income. Return on equity (ROE) equals net income divided by owners' equity, so ROE is higher with a\nsales-type lease than with a direct-finance lease.\nThings to remember:\nUS GAAP classify a finance lease as either a direct-finance or sales-type lease. A sales-type lease requires the lessor to recognize as gain the\ndifference between the present value of the lease payments and the leased asset's carrying value. This gain increases the lessor's net income, as\nwell as ratios in which net income is the numerator.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA/sAAAMECAIAAABv3qKhAADr30lEQVR42uz9T2xcyZXnix9OW/1Pb8CUgNdTxhuJSS3HsJRaPncTzFy6rAaTOwsqgJkrq1ULMjetKW2YuVFZvWFyIbW8cDEJlFB+s2ESrakCvGEStOstmaJRvTFaSuqVFyXAUvKnnhl3WVX8Lb7D06G4+Y9/RUmfDwqF5FXcuBEn/txzT5w4MbS9vW0AAAAAAPCG8h8QAQAAAAAAGj8AAAAAAKDxAwAAAAAAGj8AAAAAAKDxAwAAAAAAGj8AAAAAAKDxAwAAAACg8QMAAAAAABo/AAAAAACg8QMAAAAAABo/AAAAAACg8QMAAAAAABo/AAAAAACg8QMAAAAAoPEDAAAAAAAaPwAAAAAAoPEDAAAAAAAaPwAAAAAAoPEDAAAAAAAaPwAAAAAAoPEDAAAAAKDxAwAAAAAAGj8AAAAAAKDxAwAAAAAAGj8AAAAAAKDxAwAAAAAAGj8AAAAAAKDxAwAAAACg8QMAAAAAABo/AAAAAACg8QMAAAAAABo/AAAAAAAcGN9BBE6j0TCz+fl5/Wi327qezWanpqbMrFAoIKXe1Gq1xcVF/3Nubi6Tybydomg2m8ViUT90RaJYWFjoKxP1wGw2e8zHyzEv4W5ptVr6kU6nD7VjmFmybywsLHgnSVIqlTzxysoKU81uh15v8b4u5HK5cDKZm5t7C18xZuZvmbf5FfPGTLO0KRr/kVIqlcysWq1202z8Y0Cv21QqhdC6DWbJSvhX01uFap3L5aLqS//oMZdpKiyVSvV63cy2t7ePZxNrvNTr9eNZwr21V7VarVQqGuCHp/G3220pbcm+0fsl12w2w5EFux16b4YOQR/QJOlyeDtfMa/p2JSKValUZLPwaZY2Nbx6AAAAAADAsPHvn3K5HFr30+n07OysfujTs1Kp6IdstKVSSQvEkCRy8zhU7wg7xk4FFhgq8vm8mS0tLfU1XcgV4Zib8YrF4htmaHTL09H0jbAb5PP5paUlzFqHN/QQL8AxmWa7zbGoDYaNHwAAAAAADBu/7dvp07875eiZdNPP5/MXL160HW+zWq3miwDJDH2vmDIc3ONfmbdaLWUbZe6mwcHz9MKk0+neH81R lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified amount of time. Under IFRS, all\nleases are treated like asset purchases financed with borrowed funds. At inception, the lessee records a right-of-use asset and a lease liability\nequal to the present value of the future lease payments.\nAfter inception, periodic payments are separated into two categories:\nA portion is applied toward reducing the lease liability principal and is recorded as a cash outflow under financing activities.\nThe rest of the monthly payment counts as interest and is recorded as a cash outflow under financing activities or operating activities.\nNote that the interest portion of the lease payments is classified under financing or operating activities under IFRS but is strictly classified as\noperating activities under US GAAP.\n(Choice A) Under IFRS, the principal portion of the lease payment cannot be classified as an operating activity.\n(Choice B) Under IFRS, the reduction of the lease liability is treated as a cash outflow from financing, not investing.\nThings to remember:\nUnder IFRS, the principal portion of the periodic lease payment is classified as a cash outflow under financing activities. The interest portion of\nperiodic lease payments can be classified as a financing activity or operating activity. In contrast, US GAAP strictly classified the interest portion\nas an operating activity.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}, {"n": 7, "q": "A company reporting under US GAAP leases a factory building under a long-term operating lease contract. On the income statement, the ongoing expenses pertaining to the lease should most appropriately be reported:", "opts": ["in equal amounts each period, under a single line item.", "in different amounts each period, under a single line item.", "in different amounts each period, under depreciation expense and interest expense."], "ans": "A", "expl": "Financial statement impact to the lessee\nGoverning standard Balance sheet Income statement Cash flow statement\nReduction of lease liability: CFF\nIFRS: all leases Asset Depreciation Interest payments:\nUS GAAP: finance lease Liability Interest IFRS: CFF or CFO\nUS GAAP: CFO\nAsset\nUS GAAP: operating lease Single expense item Entire lease payment: CFO\nLiability\nIn a lease contract, the lessee makes periodic payments to the lessor for the right to use an asset for a specified amount of time. Under US\nGAAP, long-term leases can be classified as finance or operating.\nOperating leases are treated like a rental agreement. Each period, the lessee records on the income statement a single expense, which is\nequal to the average periodic lease payment. For example, if a 10-year operating lease's total contractual amount is CAD 120 million, then the\nmonthly income statement expense will be CAD 1 million (or CAD 120 million / 120 months), regardless of the actual lease payments each month\n(Choice B).\nFinance leases are treated liked an asset purchase financed with borrowed funds. Each period, the lessee records on the income statement the\ndepreciation expense from the leased asset and the interest expense from the \"debt.\"\n(Choice C) In a finance lease, not an operating lease, the expense can be separated into depreciation expense and interest expense on the\nincome statement. Furthermore, interest expense is different each period.\nThings to remember:\nFinance leases are treated like an asset purchase financed with borrowed funds. Each period, the lessee records depreciation expense from the\nleased asset and interest expense from the \"debt\" on the income statement. Operating leases are treated like a rental agreement. Each period,\nthe lessee records on the income statement a single expense, which is equal to the average periodic lease payment.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}, {"n": 8, "q": "A manufacturing company maintains a defined benefit plan for its employees who are directly involved in the manufacturing process. The company most appropriately recognizes contributions made for those employees:", "opts": ["immediately as a separate operating expense.", "as a separate operating expense only when the employees retire.", "as cost of goods sold when it sells goods that those employees made."], "ans": "C", "expl": "Defined contribution plans (DC) Defined benefit plans (DB)\nNo future benefit guaranteed Employer promises future benefits\nEmployee bears responsibility for performance Employer bears responsibility for performance\nFinancial impact limited to expensing contributions made to Performance of plan assets can significantly impact\nparticipants' accounts financial reporting\nAccounting is straightforward and simple Accounting is complicated\nNo significant differences between US GAAP and IFRS Significant differences between US GAAP and IFRS\nA defined benefit (DB) plan is a pension plan that guarantees employees income when they retire. The benefit for each employee is formula-\ndriven and can be based on several variables, including years of service and average compensation. To provide this benefit, employers contribute\nan amount each year into one separate investment account that is maintained for the benefit of all employees.\nDB plan contributions are deductible expenses, but IFRS and US GAAP treat pension contributions as a type of wage expense. Wage expenses\nfor employees in a direct production capacity, such as this company's manufacturing employees, are included as a cost of inventory.\nInventory costs are not expensed immediately. Instead, they are included in cost of goods sold (COGS) when the company sells the inventory.\n(Choice A) Contributions to a DB plan are deductible when made. The company does not wait until the employee begins receiving pension\nbenefits to deduct prior contributions.\n(Choice B) For a manufacturing company, pension contributions are included as wage expenses. Wage expenses for manufacturing employees\nare included as part of inventory and expensed as COGS. Wage expenses for nonmanufacturing employees are part of selling, general and\nadministrative expenses. The company's footnotes to its financial statements provide more detail on the different components of wage expenses.\nThings to remember:\nFor a manufacturing company, contributions to a defined benefit plan are usually deductible when made. However, they do not appear as a\nseparate expense; instead, they are a component of wage expenses. Both IFRS and US GAAP provide that wage expenses for manufacturing\nemployees are included in inventory costs and are recognized as cost of goods sold.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null, "explfigs": null}, {"n": 9, "q": "Under US GAAP, a lessee reports periodic payments for the second year of a finance lease. Compared to using an operating lease, the lessee will most likely report:", "opts": ["less cash flow from financing activities.", "less cash flow from operating activities.", "more cash flow from investing activities."], "ans": "A", "expl": "Long-term leases under US GAAP: lessee's perspective\nType Balance sheet Income statement Cash flow statement\nReduction of lease liability:\nAsset Depreciation\nFinance lease ↓ CFF\nLiability Interest\nInterest payments: ↓ CFO\nAsset\nOperating lease Single expense Entire lease payment: ↓ CFO\nLiability\nIn a long-term lease contract, the lessee makes periodic payments to the lessor for the right to use an asset (ie, right of use [ROU]) for a specified\nperiod. Under US GAAP, long-term leases can be classified as finance or operating.\nFinance leases are treated like asset purchases financed with borrowed funds (from the lessor). At inception, the lessee simultaneously records\nan ROU asset and a lease liability, both equal to the present value of the future lease payments. After inception, a portion of each periodic\npayment is applied toward reducing the liability (ie, principal reduction), which reduces cash from financing activities. Therefore, cash flow\nfrom financing (CFF) is less under a finance lease. The rest of the monthly payment counts as interest and reduces cash from operating\nactivities (CFO).\nOperating leases are treated like rental agreements. In each period, the entire periodic payment is treated like rent expense and reduces cash\nfrom operating activities on the cash flow statement. Therefore, CFO under an operating lease is less than CFO under a finance lease (Choice\nB).\n(Choice C) After inception, periodic payments do not affect cash flows from investing activities regardless of lease type.\nThings to remember:\nUnder US GAAP, a finance lease results in more cash from operating activities and less cash from financing activities compared to an operating\nlease. Under a finance lease, the portion of the periodic payment that reduces the lease liability is considered a cash outflow from financing\nactivities; the portion applied toward the interest payment is considered a cash outflow from operating activities.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}, {"n": 10, "q": "A company issued coupon-paying bonds with a face value of £5 million. It used the proceeds to purchase one of its suppliers. The company uses IFRS for financial reporting. In its statement of cash flows, it can report its coupon payments on the bonds as:", "opts": ["cash from financing (CFF) or cash from investing (CFI).", "cash from investing (CFI) or cash from operations (CFO).", "cash from financing (CFF) or cash from operations (CFO)."], "ans": "C", "expl": "Cash flows consist of both outflows and inflows. From an issuer's (ie, borrower's) perspective, the proceeds from issuing a bond are a cash inflow,\nwhereas interest and principal payments on the bond are outflows. Both GAAP and IFRS classify receipt and payment of bond principal as cash\nfrom financing (CFF). US GAAP classify all interest payments (ie, outflows) as cash from operations (CFO), but IFRS permit companies to\nclassify those payments as either CFO or CFF.\nOwning another company's bonds is an investment. Interest received on those bonds is directly linked to that investment, so IFRS allow interest\nreceived to be classified as cash from investing (CFI). However, this does not apply to interest paid on debt, even if the borrower uses the\nproceeds from the bond for an investment, as in this case. Interest paid is either CFO or CFF, but never CFI, so (Choices A and B) are incorrect.\nThings to remember:\nUS GAAP classify all interest payments as CFO, regardless of how the borrower used the proceeds of the debt on which it paid the interest. IFRS\npermit companies to classify interest payments as either CFO or CFF, but not as CFI.\nDescribe the financial statement presentation of and disclosures relating to long-term liabilities and share-based compensation", "qhtml": null, "explfigs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApwAAAFgCAIAAACZkT4NAABD0klEQVR42u2dXW4iS7a2o45273PRalXWRetIrZactSdgPAInIwBGAIzAMAJgBMAISEYAHgF4BMYT2E5LrXPTOnKWWvum1dr1Xbyq9cWO/AFju8o/z3Nh2enM+I9YsVasiPjw9etXBwAAAK+f/6IIAAAAEOoAAACAUAcAAACEOgAAACDUAQAAEOoAAACAUAcAAACEOgAAACDUAQAAEOoAAACAUAcAAACEOgAAACDUAQAAAKEOAACAUAcAAACEOgAAACDUAQAAAKEOAACAUAcAAACEOgAAACDUAQAAAKEOAACAUAcAAACEOgAAACDUAQAAAKEOAAAACHUAAACEOgAAACDUAQAA4Hn56TEf53nunNtutzc3N/bw5OQkSRLnXBzHpV9tt1v9EkVRo9F4yaXjJ9U5F6Q2z/P1eu2cu7u705Pz83NlPMsyPdEn+vyHs9vtrNacc6qmN8Nut7u8vLRGqAxWNcLX2N6OQ01xvV5/+fLFOffx40e/6t9qY3gO8jxXD7LB7Tlal2rEj+h1teFnLYpnKvNX16nr+fD169fjvpzNZpPJxB8XA  can be contributions from the employer, the participant's own contributions (ie, salary deferrals), or a combination of\nthese. In all cases, the participant, not the employer, is responsible for the account's performance. All investment gains or losses, as well as\ndividend or interest income generated by those investments, benefit the participant, not the employer (Choices A and C).\nAn employer receives a tax deduction for any contributions that it makes to participants' accounts. Deductibility applies whether the contributions\nare contractually required (eg, collective bargaining agreements) or voluntary (eg, profit-sharing plans).\nThings to remember:\nA defined contribution plan imposes no responsibility on the employer for investment performance. Employers do not share in participant\naccounts' gains or losses. The only financial impact on employers is the tax deduction for any contributions that it makes to participant accounts.\nExplain the financial reporting of defined contribution, defined benefit, and stock-based compensation plans", "qhtml": null, "explfigs": null}, {"n": 12, "q": "After entering a finance lease agreement, the lessor most appropriately records periodic:", "opts": ["lease income.", "interest revenue.", "depreciation expense."], "ans": "B", "expl": "Financial statement impact on the lessor\nBalance sheet Income statement Cash flow statement\nRemove leased asset Record interest revenue Lease payments received: CFO\nFinance lease Recognize lease receivable\nRecord gain or loss\nRetains leased asset Record lease income Lease payments received: CFO\nOperating lease\nRecord depreciation\nCFO = cash flow from operating activities, CFI = cash flow from financing activities\nIn a lease contract, the lessor grants the lessee the right to use an asset over a specific period of time in exchange for scheduled regular\npayments. For accounting purposes, most leases are classified as finance leases, although some exceptions (eg, airport terminals) are treated as\noperating leases.\nFrom a lessor's perspective, a finance lease is economically equivalent to financing an asset sale to the lessee (customer). At inception of the\nlease, the lessor removes the leased asset from its balance sheet and simultaneously records a receivable. Subsequently, the lessor reports\ninterest revenue earned from the financing provided to the customer.\nIn contrast, operating leases are treated like rental agreements. The lessor retains the asset at inception and subsequently records rental (ie,\nlease) income and depreciation (Choices A and C).\nThings to remember:\nFrom a lessor's perspective, a finance lease is economically equivalent to financing an asset sale to the lessee. At inception of the lease, the\nlessor removes the leased asset from its balance sheet and simultaneously records a receivable. Subsequently, the lessor reports interest\nrevenue earned from the financing provided to the customer.\nExplain the financial reporting of leases from the perspectives of lessors and lessees", "qhtml": null, "explfigs": null}];

  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      if(q.explfigs){q.explfigs.forEach(function(u){var im=document.createElement("img");im.className="qfig";im.src=u;im.alt="exhibit";e.appendChild(im);});}
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
<!--qnote-feature-start-->
<style id="qnote-css">
  .qnote{margin-top:12px;border-radius:12px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--pin) 9%, var(--panel2));padding:8px 10px}
  .qnote-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;
    font-size:12.5px;font-weight:600;color:var(--muted)}
  .qnote-head .dot{color:var(--pin)}
  .qnote-saved{margin-left:auto;font-size:11.5px;color:var(--ok);opacity:0;
    transition:opacity .25s}
  .qnote-saved.show{opacity:1}
  .qnote textarea{width:100%;resize:vertical;min-height:40px;display:block;
    font:inherit;font-size:14px;line-height:1.5;color:var(--txt);
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;outline:none}
  .qnote textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 1.5px var(--accent) inset}
  .qnote textarea::placeholder{color:var(--muted);opacity:.7}
</style>
<script>
/* ===== Ghi chú cá nhân cho mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      if(card.querySelector(".qnote")) continue;
      var k = keyFor(card);
      if(k===null) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú của bạn</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.rows = 2;
      ta.setAttribute("placeholder","Viết ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      card.appendChild(wrap);
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<!--qnote-feature-end-->
