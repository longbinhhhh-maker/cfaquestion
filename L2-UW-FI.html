<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<script>
  /* đặt theme trước khi vẽ để không bị nháy màu */
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("cfa:theme")||"dark"); }catch(e){} })();
  function toggleTheme(){
    var nx = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
    try{ localStorage.setItem("cfa:theme", nx); }catch(e){}
    document.documentElement.setAttribute("data-theme", nx);
  }
</script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#14532d; --bad:#ef4444; --badbg:#7f1d1d; --pin:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  header{position:sticky;top:0;z-index:30;background:var(--panel);
    border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .htext{flex:1 1 240px;min-width:200px}
  .htext h1{margin:0;font-size:18px}
  .htext p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;
    padding:4px 10px;border-radius:8px;background:var(--panel2);min-width:78px;text-align:center}
  .timer.warn{color:#fff;background:var(--bad)}
  .timer.hidden{display:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);padding:8px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:600}
  .btn-primary:hover{background:var(--accent2)}
  .progress-wrap{height:5px;background:var(--panel2)}
  .progress{height:100%;width:0;background:var(--accent);transition:width .2s}
  .resume-note{display:none;max-width:820px;margin:8px auto -8px;padding:6px 16px;
    font-size:12.5px;color:#bbf7d0}
  .resume-note.show{display:block}
  .badge{display:none;font-weight:700;padding:6px 12px;border-radius:999px}
  .badge.show{display:inline-block}
  .badge.pass{background:var(--okbg);color:#bbf7d0;border:1px solid var(--ok)}
  .badge.fail{background:var(--badbg);color:#fecaca;border:1px solid var(--bad)}
  main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin:0 0 16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qnum{font-weight:700;color:var(--accent2)}
  .pin{margin-left:auto;font-size:15px;padding:4px 8px;line-height:1;opacity:.45;
    background:transparent;border-color:transparent}
  .pin.on{opacity:1}
  .pin.on::after{content:"";}
  .stem{white-space:pre-wrap;margin-bottom:12px;font-size:15.5px}
  .stem p{white-space:normal;margin:0 0 10px}
  table.qt{border-collapse:collapse;margin:10px 0;font-size:14.5px;white-space:normal}
  table.qt th,table.qt td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  table.qt thead th{background:var(--panel2);font-weight:600}
  img.qfig{display:block;max-width:100%;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;
    border-radius:9px;background:var(--panel2)}
  .opt .lead{font-weight:700;margin-right:8px;color:var(--accent2)}
  .opt.sel{border-color:var(--accent2);background:#312e81}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--badbg);border-color:var(--bad)}
  .opt.correct .lead,.opt.wrong .lead{color:#fff}
  .expl{display:none;margin-top:12px;padding:12px;border-radius:9px;
    background:#0b1220;border:1px dashed var(--line);white-space:pre-wrap;font-size:14px;color:#cbd5e1}
  .expl.show{display:block}
  .expl b{color:var(--accent2)}
  /* navigator */
  .nav-toggle.has{}
  #navPanel{position:fixed;top:0;right:0;height:100%;width:330px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);z-index:40;
    transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column}
  #navPanel.open{transform:translateX(0)}
  .nav-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .nav-head b{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;padding:5px 9px;border-radius:999px}
  .chip.active{background:var(--accent);border-color:var(--accent)}
  .grid{padding:12px 14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .cell.answered{border-color:var(--accent2);background:#312e81}
  .cell.pinned::after{content:"\1F4CC";position:absolute;top:-4px;right:-2px;font-size:10px}
  .cell.correct{background:var(--okbg);border-color:var(--ok)}
  .cell.wrong{background:var(--badbg);border-color:var(--bad)}
  .cell.hide{display:none}
  /* overlays */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:420px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pause-box{text-align:center}
  .pause-box .big{font-size:40px;margin-bottom:6px}
  @media (max-width:520px){.htext h1{font-size:16px}}
  /* ===== theme sáng ===== */
  #themeBtn::after{content:"🌙"}
  html[data-theme="light"] #themeBtn::after{content:"☀️"}
  html[data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e9eef5; --line:#d4dce6;
    --txt:#0f172a; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --pin:#d97706;
  }
  html[data-theme="light"] .opt.sel{background:#e0e7ff}
  html[data-theme="light"] .opt.correct{background:#dcfce7}
  html[data-theme="light"] .opt.wrong{background:#fee2e2}
  html[data-theme="light"] .opt.correct .lead,html[data-theme="light"] .opt.wrong .lead{color:#0f172a}
  html[data-theme="light"] .expl{background:#f8fafc;color:#334155}
  html[data-theme="light"] .badge.pass{background:#dcfce7;color:#166534}
  html[data-theme="light"] .badge.fail{background:#fee2e2;color:#991b1b}
  html[data-theme="light"] .cell.answered{background:#e0e7ff}
  html[data-theme="light"] .cell.correct{background:#dcfce7}
  html[data-theme="light"] .cell.wrong{background:#fee2e2}
</style>
<!--ui-polish-start-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="ui-polish">
  :root{
    --bg:#0b1020; --panel:#151d31; --panel2:#1d2740; --line:#2b3a57;
    --txt:#e6edf6; --muted:#94a3b8; --accent:#538297; --accent2:#86a7b5;
    --ok:#22c55e; --okbg:#0f3d2a; --bad:#f43f5e; --badbg:#4c1322; --pin:#f59e0b;
    --radius:14px; --shadow:0 8px 28px rgba(2,6,23,.35);
  }
  html[data-theme="light"]{
    --bg:#f3f6fb; --panel:#ffffff; --panel2:#eef2f9; --line:#dde6f2;
    --txt:#0f1b2d; --muted:#5a6b80; --accent:#538297; --accent2:#35637a;
    --ok:#16a34a; --okbg:#dcfce7; --bad:#e11d48; --badbg:#ffe4e6; --pin:#d97706;
    --shadow:0 8px 24px rgba(15,27,45,.08);
  }
  body{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(83,130,151,.20), transparent 60%),
      radial-gradient(900px 520px at -8% 2%, rgba(134,167,181,.14), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  *{transition:background-color .18s ease,border-color .18s ease,color .18s ease,
    box-shadow .18s ease,transform .12s ease}
  header{
    background:color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter:saturate(170%) blur(14px);
    -webkit-backdrop-filter:saturate(170%) blur(14px);
    border-bottom:1px solid var(--line);padding:14px 18px;
  }
  .htext h1{font-size:19px;font-weight:800;letter-spacing:-.015em}
  .htext p{font-size:13px}
  .timer{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px}
  .timer.warn{animation:cfaPulse 1.1s ease-in-out infinite}
  @keyframes cfaPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}
    50%{box-shadow:0 0 0 7px rgba(244,63,94,0)}}
  button{border-radius:10px;font-weight:600}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  .back-btn{font-weight:600}
  .back-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;box-shadow:0 6px 18px rgba(83,130,151,.42)}
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px rgba(83,130,151,.5)}
  .progress-wrap{height:6px}
  .progress{background:linear-gradient(90deg,var(--accent),var(--accent2))}
  main{max-width:880px;padding-top:22px}
  .card{border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid var(--line)}
  .card:hover{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .qnum{background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.01em}
  .stem{font-size:16px;line-height:1.65}
  .opt{border:1px solid var(--line);border-radius:12px;font-size:15px}
  .opt:hover{border-color:var(--accent2);transform:translateX(2px);
    background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
  .opt.sel{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 20%,var(--panel2));
    box-shadow:0 0 0 1.5px var(--accent) inset}
  .opt.correct{box-shadow:0 0 0 1.5px var(--ok) inset}
  .opt.wrong{box-shadow:0 0 0 1.5px var(--bad) inset}
  .expl{border-radius:12px}
  .qfig{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
    box-shadow:var(--shadow);margin:8px 0;background:#fff}
  .badge{box-shadow:var(--shadow)}
  #navPanel{box-shadow:-16px 0 48px rgba(2,6,23,.4)}
  .cell{border:1px solid var(--line);border-radius:9px}
  .cell:hover{border-color:var(--accent2);transform:scale(1.07)}
  .chip{border:1px solid var(--line)}
  .chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff}
  .overlay{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .modal{border-radius:18px;box-shadow:0 24px 64px rgba(2,6,23,.5)}
  .resume-note{font-weight:600}
  @media (max-width:520px){.card{padding:14px}.htext h1{font-size:17px}}
</style>
<!--ui-polish-end-->
<!-- ===== Lordicon + feedback sinh động ===== -->
<script src="https://cdn.lordicon.com/lordicon.js" defer></script>
<style id="fx-css">
  .btn-primary lord-icon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
  .opt .fx-mark{display:inline-block;margin-left:8px;font-size:16px;
    transform:scale(0);animation:fxPop .42s cubic-bezier(.18,1.5,.5,1) forwards}
  @keyframes fxPop{0%{transform:scale(0) rotate(-25deg)}
    70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #resultOverlay .modal{max-width:380px;text-align:center}
  #resultOverlay lord-icon{width:120px;height:120px;margin:0 auto 6px}
  #resultOverlay .r-emoji{font-size:46px;line-height:1;margin-bottom:4px;
    display:block;animation:fxPop .5s cubic-bezier(.18,1.5,.5,1) both}
  #resultOverlay h3{font-size:22px;margin:4px 0 6px}
  #resultOverlay .r-score{font-size:15px;color:var(--muted);margin:0}
  #resultOverlay h3.pass{color:var(--ok)}
  #resultOverlay h3.fail{color:var(--bad)}
  .fx-confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;
    pointer-events:none;border-radius:2px;animation:fxFall linear forwards}
  @keyframes fxFall{to{transform:translateY(105vh) rotate(640deg);opacity:.9}}
</style>
<style id="lord2-css">
  header button lord-icon.hi{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
  .pause-box .big lord-icon{width:56px;height:56px}
</style>

<!--subject-breakdown-start-->
<style id="subject-breakdown-css">
  #resultOverlay .modal{max-width:720px;max-height:90vh;overflow-y:auto;text-align:center}
  .subject-breakdown{margin-top:18px;text-align:left}
  .subject-breakdown h4{margin:0 0 10px;font-size:15px;text-align:center}
  .subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subject-row{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .subject-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:12px}
  .subject-name{font-weight:650;min-width:0}
  .subject-score{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .subject-bar{height:6px;margin-top:7px;border-radius:999px;overflow:hidden;background:var(--line)}
  .subject-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  @media(max-width:600px){.subject-grid{grid-template-columns:1fr}}

  /* Subject label shown on each question after grading */
  .question-subject{max-width:min(58vw,360px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;
    letter-spacing:.01em;color:var(--accent2);background:color-mix(in srgb,var(--accent) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--line))}
  @media(max-width:520px){.question-subject{max-width:52vw;font-size:10px;padding:3px 7px}}
</style>
<!--subject-breakdown-end-->

<!--explanation-redesign-start-->
<style id="explanation-redesign-css">
  .expl{padding:0!important;white-space:normal!important;overflow:hidden;
    background:color-mix(in srgb,var(--panel2) 82%,var(--panel))!important;
    border:1px solid var(--line)!important;border-radius:14px!important}
  .expl-shell{display:flex;flex-direction:column}
  .expl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    border-bottom:1px solid var(--line)}
  .expl-title{font-size:13px;font-weight:800;color:var(--txt)}
  .expl-answer{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;
    color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 42%,var(--line))}
  .expl-content{display:grid;gap:10px;padding:12px}
  .expl-choice{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
  .expl-choice.is-correct{border-color:color-mix(in srgb,var(--ok) 56%,var(--line));
    background:color-mix(in srgb,var(--okbg) 58%,var(--panel))}
  .expl-choice-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .expl-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
    border-radius:7px;font-size:12px;font-weight:900;color:var(--muted);background:var(--panel2)}
  .expl-choice.is-correct .expl-letter{color:#fff;background:var(--ok)}
  .expl-state{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--muted)}
  .expl-choice.is-correct .expl-state{color:var(--ok)}
  .expl-option-copy{margin:0 0 8px;font-size:13px;font-weight:650;line-height:1.5;color:var(--txt)}
  .expl-reason{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-note{padding:11px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .expl-note p{margin:0;font-size:13.5px;line-height:1.72;color:color-mix(in srgb,var(--txt) 88%,var(--muted))}
  .expl-meta{display:grid;gap:5px;padding:10px 12px;border-radius:10px;
    border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .expl-meta-row{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--muted)}
  .expl-meta-row b{flex:0 0 auto;color:var(--accent2)}
  @media(max-width:520px){
    .expl-head{align-items:flex-start;padding:10px 11px}.expl-content{padding:9px;gap:8px}
    .expl-choice{padding:10px}.expl-option-copy,.expl-reason,.expl-note p{font-size:12.5px}
  }
</style>
<!--explanation-redesign-end-->
<!--l2-vignette-start-->
<style id="l2-css">
  .stem .vig,.stem .qtext{white-space:normal}
  .vig{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 14px;overflow:hidden}
  .vig>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);
    list-style:none;display:flex;gap:8px;align-items:center;user-select:none}
  .vig>summary::-webkit-details-marker{display:none}
  .vig>summary::before{content:"▸";font-size:12px;transition:transform .15s}
  .vig[open]>summary::before{transform:rotate(90deg)}
  .vig>summary .vig-tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .vig>summary .vig-hint{margin-left:auto;font-weight:500;font-size:12px}
  .vig[open]>summary .vig-hint{display:none}
  .vig[open]>summary{border-bottom:1px solid var(--line)}
  .vig-body{padding:12px 16px;max-height:62vh;overflow:auto;font-size:15px;line-height:1.65}
  .vig-body p,.qtext p,.expl-html p{margin:0 0 10px}
  .qtext{font-size:16px;line-height:1.65}
  .tbl{overflow-x:auto;margin:6px 0 12px}
  .tbl table{border-collapse:collapse;font-size:14px;line-height:1.45}
  .tbl td,.tbl th{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .tbl tr:first-child td,.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .pimg{display:block;margin:8px 0 12px;border-radius:8px;background:#fff;height:auto}
  .expl-html{padding:14px 16px;line-height:1.65;font-size:14.5px}
  .pp-topic{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 10px;border-radius:999px;margin:0 0 10px}
  .eimg{display:block;width:100%;max-width:900px;height:auto;border-radius:8px;background:#fff;margin:4px 0}
  .qorig{margin:10px 0 0;font-size:12.5px;color:var(--muted)} .qorig summary{cursor:pointer}
  .qorig img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:8px;background:#fff}
</style>
<script id="l2-js">
function buildExplHtml(q){
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+q.ans;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content expl-html"; content.innerHTML=q.explhtml;
  shell.appendChild(content); return shell;
}
</script>
<!--l2-vignette-end-->
</head>
<body>
<header>

"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex002.webp\" style=\"max-width:min(100%,329px)\" alt=\"Exhibit\"><p>Tan asks Chong why the swap rate curve would be used to value bonds instead of a government bond curve. In response, Chong makes the following observations:<\/p><p>Observation 1: Swap rates are like the YTM on a government bond.<\/p><p>Observation 2:The swap curve is derived using short-term lending rates; thus, its usefulness as a benchmark is limited to short-term securities.<\/p><p>Observation 3:Some institutions prefer the swap curve as a benchmark since they regularly hedge their balance sheet with swaps.<\/p><p>Chong then quizzes Tan on his knowledge of spot and forward rates. Chong asks Tan to evaluate the relative attractiveness of purchasing a three-year zero-coupon government bond based on the following forecasted spot rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex003.webp\" style=\"max-width:min(100%,620px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, the three-year zero-coupon government bond is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q006.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":7,"q":"Based on Exhibit 1, the probability that Bond I will pay its contractual cash flows to maturity in full is closest to:","opts":["95.500%","95.567%","97.023%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a007.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a007.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the probability that Bond I will pay its contractual cash flows to maturity in full is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q007.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":8,"q":"The credit valuation adjustment for estimating a corporate bond's fair value is most likely the:","opts":["product of the market price and (1 - Recovery rate).","difference from the bond's value as a risk-free security.","expected decrease in fair value if the bond's credit rating is cut."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a008.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a008.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>The credit valuation adjustment for estimating a corporate bond&#x27;s fair value is most likely the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q008.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":9,"q":"Based on Exhibit 1 and Exhibit 2, one year prior to its maturity, the expected exposure for Bond I! is closest to:","opts":["99.956","104.437","104.456"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a009.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a009.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, one year prior to its maturity, the expected exposure for Bond I! is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q009.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":10,"q":"Which of Sovo's statements regarding structural credit models is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a010.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a010.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Sovo&#x27;s statements regarding structural credit models is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q010.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":11,"q":"All else equal, if the yield spread of Bond I over an appropriate benchmark government bond widens, it is most likely the result of which of the following events?","opts":["Declining number of dealers making markets in the company's bonds","Increasing divergences in the range of inflation forecasts by economic analysts","Being removed from a credit agency's positive watch list with an affirmation of the current rating"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a011.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a011.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, if the yield spread of Bond I over an appropriate benchmark government bond widens, it is most likely the result of which of the following events?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q011.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":12,"q":"Alum and Sovo may use a statistical-based approach to analyze the asset portfolios of structured debt securities. That model would be least appropriate if the securities were created from which of the following asset types?","opts":["Auto loans","Credit card receivables","Commercial mortgages"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a012.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a012.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 2 · Câu 7–12 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Tomas Alum and Hernan Sovo are fixed-income analysts at an asset management company. They are evaluating several bonds currently held in one of the firm&#x27;s portfolios. Information about the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex004.webp\" style=\"max-width:min(100%,652px)\" alt=\"Exhibit\"><p>Alum and Sovo discuss the credit valuation adjustment they must factor in to estimate the corporate bonds&#x27; fair values. Alum uses the government par bond yield curve to develop a binomial tree to determine the value of Bond II assuming no default, as shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex005.webp\" style=\"max-width:min(100%,674px)\" alt=\"Exhibit\"><p>The two analysts discuss the potential impact of credit rating changes on bond values and expected returns and the use of credit models for estimating the default risk of bonds issued by publicly traded companies. Sovo makes the following statements regarding the advantages of structural models compared with reduced-form models.<\/p><p>Structural models:<\/p><p><b>Statement 1:<\/b> Are easier to implement since they rely primarily on publicly available information, such as coverage ratios and debt-to-equity ratios<\/p><p><b>Statement 2:<\/b> Attempt to directly value the option-like aspects of a straight bond since a company can elect to not repay debt, effectively selling the company to the bondholders for the value of the debt.<\/p><p><b>Statement 3:<\/b> Treat default as an exogenous random variable and use statistical methods to estimate when default is likely to occur.<\/p><p>While discussing the models, the analysts discuss the factors reflected in corporate bond yield spreads.<\/p><p>Alum and Sovo are also evaluating several structured debt securities in the portfolio. They discuss whether the same approaches can be used for evaluating the different types of asset-backed securities (ABS) held in the portfolio.<\/p><\/div><\/details><div class=\"qtext\"><p>Alum and Sovo may use a statistical-based approach to analyze the asset portfolios of structured debt securities. That model would be least appropriate if the securities were created from which of the following asset types?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q012.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":13,"q":"Which of Kennon's statements regarding lognormal interest rate models is correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a013.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a013.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jenda Harrar manages fixed-income portfolios for an investment company. Harrar directs Dag Kennon, an analyst at the firm, to construct a binomial interest rate tree to evaluate bond values. Harrar and Kennon discuss how to project interest rates over time and Kennon makes the following statements about the benefits of using a lognormal random walk for modeling interest rate changes.<\/p><p><b>Statement 1:<\/b> Interest rates on a binomial tree are approximately lognormally distributed around the forward rates derived from the benchmark yield curve.<\/p><p><b>Statement 2:<\/b> A lognormal random walk allows for the possibility of negative interest rates as are sometimes observed in market rates.<\/p><p><b>Statement 3:<\/b> A lognormal model of interest rates results in period-to-period rate changes that are inversely proportional to the level of interest rates.<\/p><p>Exhibit 1 contains a partially completed binomial interest rate tree. Kennon constructed the tree from spot rates derived from the 1-year, 2-year, and 3-year option-free government par bonds, using a lognormal interest rate model, and an assumed interest rate volatility of 12%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex006.webp\" style=\"max-width:min(100%,646px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial valuation for a 3-year 3.5% coupon bond based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex007.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit\"><p>Harrar is concerned about rising inflation and uncertainty about central bank monetary policy, which she believes will cause interest rate volatility to increase. Harrar directs Kennon to create a second binomial tree based on 20% volatility, shown in Exhibit 3. She then asks Kennan to use this tree (Exhibit 3) to value a 3-year, 3.0% coupon option-free government bond.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex008.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Harrar and Kennon discuss using a Monte Carlo simulation as an alternative method for valuing bonds. Kennon identifies several advantages of using a Monte Carlo simulation rather than a binomial interest rate tree.<\/p><p><b>Statement 4:<\/b> Monte Carlo simulations allow for more complex interest rate behavior, such as mean reversion, that better represents observed interest rate movements.<\/p><p><b>Statement 5:<\/b> Monte Carlo simulations allow analysts to assign different probability weightings to specific interest rate paths to better align with their expectations regarding future interest rates.<\/p><p>Assume all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Kennon&#x27;s statements regarding lognormal interest rate models is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q013.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":14,"q":"When calibrating the binomial tree in Exhibit 1 to the term structure of the government spot rate curve, Kennon is least likely to use an assumed volatility based on:","opts":["historical interest rate volatility.","coupons and yields of bonds used to construct the binomial tree.","prices of interest rate derivatives such as caps, floors, and swaptions."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a014.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a014.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 3 · Câu 13–18 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jenda Harrar manages fixed-income portfolios for an investment company. Harrar directs Dag Kennon, an analyst at the firm, to construct a binomial interest rate tree to evaluate bond values. Harrar and Kennon discuss how to project interest rates over time and Kennon makes the following statements about the benefits of using a lognormal random walk for modeling interest rate changes.<\/p><p><b>Statement 1:<\/b> Interest rates on a binomial tree are approximately lognormally distributed around the forward rates derived from the benchmark yield curve.<\/p><p><b>Statement 2:<\/b> A lognormal random walk allows for the possibility of negative interest rates as are sometimes observed in market rates.<\/p><p><b>Statement 3:<\/b> A lognormal model of interest rates results in period-to-period rate changes that are inversely proportional to the level of interest rates.<\/p><p>Exhibit 1 contains a partially completed binomial interest rate tree. Kennon constructed the tree from spot rates derived from the 1-year, 2-year, and 3-year option-free government par bonds, using a lognormal interest rate model, and an assumed interest rate volatility of 12%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex006.webp\" style=\"max-width:min(100%,646px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial valuation for a 3-year 3.5% coupon bond based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex007.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit\"><p>Harrar is concerned about rising inflation and uncertainty about central bank monetary policy, which she believes will cause interest rate volatility to increase. Harrar directs Kennon to create a second binomial tree based on 20% volatility, shown in Exhibit 3. She then asks Kennan to use this tree (Exhibit 3) to value a 3-year, 3.0% coupon option-free government bond.<\/ onds, using a lognormal interest rate model, and an assumed interest rate volatility of 12%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex006.webp\" style=\"max-width:min(100%,646px)\" alt=\"Exhibit\"><p>Exhibit 2 contains the binomial valuation for a 3-year 3.5% coupon bond based on the information in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex007.webp\" style=\"max-width:min(100%,535px)\" alt=\"Exhibit\"><p>Harrar is concerned about rising inflation and uncertainty about central bank monetary policy, which she believes will cause interest rate volatility to increase. Harrar directs Kennon to create a second binomial tree based on 20% volatility, shown in Exhibit 3. She then asks Kennan to use this tree (Exhibit 3) to value a 3-year, 3.0% coupon option-free government bond.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex008.webp\" style=\"max-width:min(100%,540px)\" alt=\"Exhibit\"><p>Harrar and Kennon discuss using a Monte Carlo simulation as an alternative method for valuing bonds. Kennon identifies several advantages of using a Monte Carlo simulation rather than a binomial interest rate tree.<\/p><p><b>Statement 4:<\/b> Monte Carlo simulations allow for more complex interest rate behavior, such as mean reversion, that better represents observed interest rate movements.<\/p><p><b>Statement 5:<\/b> Monte Carlo simulations allow analysts to assign different probability weightings to specific interest rate paths to better align with their expectations regarding future interest rates.<\/p><p>Assume all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the analyst&#x27;s statements regarding the advantages of Monte Carlo simulations compared with binomial valuation is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q018.webp\" alt=\"Câu hỏi gốc\"><\/ d CDS to determine the relative pricing of credit in the two markets. Exhibit 3 contains the pertinent information for Quant bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Leti Xena, CFA, manages the domestic high-yield fund. She believes general credit conditions are likely to worsen and buys $50 million notional of the on-the-run high-yield index CDS (CDX) to hedge credit risk in the fund. The CDX includes 100 reference entities. The CDX has an upfront premium of 2%.<\/p><p>Xena anticipates improving creditworthiness for several issuers included in the index that are not held in the fund. She sells credit protection on two of the companies, Casha, Inc. and Donbo Corp. Exhibit 4 contains information related to the CDS sold by Xena.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex012.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, Zendo&#x27;s cash flow related to the up-front premium on the purchase of the Marsh Manufacturing CDS is closest to a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q019.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":20,"q":"Based on Exhibit 2 and the fund's position in Marsh bonds, Zendo should most likely settle the CDS by:","opts":["delivering Bond 1.","delivering Bond 2.","accepting a cash settlement."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a020.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a020.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 4 · Câu 19–24 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darien Trading Ltd. is a fixed-income asset management firm that runs several domestic bond funds, two of which are an investment-grade corporate bond fund and a high-yield corporate bond fund.<\/p><p>Jay Zendo, CFA, manages the investment-grade bond portfolio, which is an actively managed fund. Zendo frequently uses single-name and index credit default swaps (CDS) both to manage the credit risk of portfolio securities and to make speculative bets on company or sector credit pricing. Zendo holds two Marsh Manufacturing, Inc. bonds:<\/p><p>Bond 1: $1 million par value of 3-year subordinated bonds<\/p><p>Bond 2: $1 million par value of 4-year senior unsecured bonds<\/p><p>Zendo buys credit protection on the Marsh bonds. Exhibit 1 contains information on the purchased CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex009.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Several months after the CDS purchase, Marsh declares bankruptcy. Exhibit 2 shows the post-bankruptcy bond prices and the CDS recovery rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex010.webp\" style=\"max-width:min(100%,361px)\" alt=\"Exhibit\"><p>Zendo sometimes uses basis trades to profit from the difference in pricing of credit risk by the bond and CDS markets. He evaluates Quant Corp. bonds and CDS to determine the relative pricing of credit in the two markets. Exhibit 3 contains the pertinent information for Quant bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Leti Xena, CFA, manages the domestic high-yield fund. She believes general credit conditions are likely to worsen and buys $50 million notional of the on-the-run high-yield index CDS (CDX) to hedge credit risk in the fund. The CDX includes 100 reference entities. The CDX has an upfront premium of 2%.<\/p><p>Xena anticipates improving creditworthiness for several issuers included in the index that are not held in th onds<\/p><p>Zendo buys credit protection on the Marsh bonds. Exhibit 1 contains information on the purchased CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex009.webp\" style=\"max-width:min(100%,401px)\" alt=\"Exhibit\"><p>Several months after the CDS purchase, Marsh declares bankruptcy. Exhibit 2 shows the post-bankruptcy bond prices and the CDS recovery rate.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex010.webp\" style=\"max-width:min(100%,361px)\" alt=\"Exhibit\"><p>Zendo sometimes uses basis trades to profit from the difference in pricing of credit risk by the bond and CDS markets. He evaluates Quant Corp. bonds and CDS to determine the relative pricing of credit in the two markets. Exhibit 3 contains the pertinent information for Quant bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex011.webp\" style=\"max-width:min(100%,506px)\" alt=\"Exhibit\"><p>Leti Xena, CFA, manages the domestic high-yield fund. She believes general credit conditions are likely to worsen and buys $50 million notional of the on-the-run high-yield index CDS (CDX) to hedge credit risk in the fund. The CDX includes 100 reference entities. The CDX has an upfront premium of 2%.<\/p><p>Xena anticipates improving creditworthiness for several issuers included in the index that are not held in the fund. She sells credit protection on two of the companies, Casha, Inc. and Donbo Corp. Exhibit 4 contains information related to the CDS sold by Xena.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex012.webp\" style=\"max-width:min(100%,526px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>At the time Xena closes out the position, improving credit prospects have resulted in the CDS spread for Donbo narrowing to 3.75%. Based on Exhibit 4, the gain on the trade (in $) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q024.webp\" alt=\"Câu hỏi  protection buyer in two index CDS investments:<\/p><p>The North American CDX with €100 million notional principal. Lavigne has tracked default probabilities between the index&#x27;s constituent companies and notes that the correlation in the likelihood of defaults among the companies has increased over the past year.<\/p><p>The iTraxx Main CDS with €250 million notional principal. The iTraxx Main has 125 constituents, one of which is Company A. Company A accounts for 1% of the combined market cap of the constituents within the index. Lavigne wishes to unwind the credit protection in Company A only. Pascal asks Lavigne to sell a single-name CDS in Company A with a €1.2 million notional principal.<\/p><\/div><\/details><div class=\"qtext\"><p>The best response to Pascal&#x27;s question about CDS risk is that CDS:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q025.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":26,"q":"Based on Exhibit 1, the cheapest-to-deliver obligation for the CDS contract on Montage is:","opts":["Bond 1","Bond 2","Bond 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a026.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a026.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ethan Lavigne is a fixed income analyst at Seine Financial, an investment management firm. Lavigne assists fund manager Sofia Pascal with managing a bond portfolio. Pascal asks Lavigne to assume the primary responsibility for managing several credit default swap (CDS) positions, but first she asks Lavigne what he knows about CDS, starting with their risk profile.<\/p><p>Seine is the cred vigne has tracked default probabilities between the index&#x27;s constituent companies and notes that the correlation in the likelihood of defaults among the companies has increased over the past year.<\/p><p>The iTraxx Main CDS with €250 million notional principal. The iTraxx Main has 125 constituents, one of which is Company A. Company A accounts for 1% of the combined market cap of the constituents within the index. Lavigne wishes to unwind the credit protection in Company A only. Pascal asks Lavigne to sell a single-name CDS in Company A with a €1.2 million notional principal.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, based on correlation trends in the CDX, the price of buying credit protection in the index will most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q029.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":30,"q":"After purchasing credit protection, the proportion of Company A's credit risk that remains unhedged by the iTraxx Main index CDS is closest to:","opts":["40%","52%","60%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a030.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a030.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 5 · Câu 25–30 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ethan Lavigne is a fixed income analyst at Seine Financial, an investment management firm. Lavigne assists fund manager Sofia Pascal with managing a bond portfolio. Pascal asks Lavigne to assume the primary responsibility for managing several credit default swap (CDS) positions, but first she asks Lavigne what he knows about CDS, starting with their risk profile.<\/p><p>Seine is the credit protection buyer for a CDS of Montage Industries. Montage recently experienced a credit event that triggered a settlement on the company&#x27;s CDS. Montage has three bonds outstanding; the reference bond for the CDS is Bond 1. Pascal collects information on each of the three bonds, shown in Exhibit 1, and asks Lavigne which bond is the cheapest to deliver:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex013.webp\" style=\"max-width:min(100%,619px)\" alt=\"Exhibit\"><p>Lavigne wishes to practice estimating probabilities of survival and default and asks to see the hazard rates of a company&#x27;s senior debt that are used in pricing its CDS. Pascal provides the hazard rates for Riposte Technologies over the next five years, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex014.webp\" style=\"max-width:min(100%,345px)\" alt=\"Exhibit\"><p>Lavigne and Pascal then discuss index CDS. Seine is currently the credit protection buyer in two index CDS investments:<\/p><p>The North American CDX with €100 million notional principal. Lavigne has tracked default probabilities between the index&#x27;s constituent companies and notes that the correlation in the likelihood of defaults among the companies has increased over the past year.<\/p><p>The iTraxx Main CDS with €250 million notional principal. The iTraxx Main has 125 constituents, one of which is Company A. Company A accounts for 1% of the combined market cap of the constituents within the index. Lavigne wishes to unwind the credit protection in Company A only. Pascal asks Lavigne to sell a single-name CDS in Company A with a €1.2 million notional principal.<\/p><\/div><\/details><div class=\"qtext\"><p>After purchasing credit protection, the proportion of Company A&#x27;s credit risk that remains unhedged by the iTraxx Main index CDS is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q030.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":31,"q":"Based on Exhibit 1 and Scenario 1, the greatest value of key rate duration for Bond 2 is the:","opts":["1-year key rate duration.","2-year key rate duration.","3-year key rate duration."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a031.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a031.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jonathon Paster is an analyst at a fixed-income trading firm. Paster has been assigned to evaluate a developed economy&#x27;s sovereign debt issues. Exhibit 1 contains information on five sovereign bonds; all the bonds mature in exactly three years, on Jun 15 20X9. Three of the bonds have a fixed coupon rate and two of the bonds are floating rate notes (FRNs, or floaters).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex015.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Recent interest rate volatility has been minimal, and the sovereign yield curve is currently flat at 2.00%. Siena Mastro, a portfolio manager at the firm, asks Paster to evaluate the five bonds (Exhibit 1) under several different scenarios:<\/p><p><b>Scenario 1:<\/b> Assume interest rates remain unchanged and interest rate volatility is 0%.<\/p><p><b>Scenario 2:<\/b> Assume an upward parallel yield curve shift of 0.50%, resulting in a 2.50% flat sovereign yield curve, and interest rate volatility is 0%.<\/p><p><b>Scenario 3:<\/b> Assume the yield curve steepens, as shown in Exhibit 2, and interest rate volatility is 0%.<\/p><p><b>Scenario 4:<\/b> Assume the yield curve has already steepened, as shown in Exhibit 2, and then interest rate volatility increases to 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex016.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Mastro asks Paster to describe the effective convexities of the callable and putable bonds. In response, Paster makes the following statements:<\/p><p><b>Statement 1:<\/b> Both callable and putable bonds exhibit positive convexity when the embedded options are out of the money since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Scenario 1, the greatest value of key rate duration for Bond 2 is the:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q031.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":32,"q":"Based on Exhibit 1 and Scenario 2, Bond 3's one-sided down duration is most likely:","opts":["less than its one-sided up duration.","equal to its one-sided up duration.","greater than its one-sided up duration."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a032.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a032.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathon Paster is an analyst at a fixed-income trading firm. Paster has been assigned to evaluate a developed economy&#x27;s sovereign debt issues. Exhibit 1 contains information on five sovereign bonds; all the bonds mature in exactly three years, on Jun 15 20X9. Three of the bonds have a fixed coupon rate and two of the bonds are floating rate notes (FRNs, or floaters).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex015.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Recent interest rate volatility has been minimal, and the sovereign yield curve is currently flat at 2.00%. Siena Mastro, a portfolio manager at the firm, asks Paster to evaluate the five bonds (Exhibit 1) under several different scenarios:<\/p><p><b>Scenario 1:<\/b> Assume interest rates remain unchanged and interest rate volatility is 0%.<\/p><p><b>Scenario 2:<\/b> Assume an upward parallel yield curve shift of 0.50%, resulting in a 2.50% flat sovereign yield curve, and interest rate volatility is 0%.<\/p><p><b>Scenario 3:<\/b> Assume the yield curve steepens, as shown in Exhibit 2, and interest rate volatility is 0%.<\/p><p><b>Scenario 4:<\/b> Assume the yield curve has already steepened, as shown in Exhibit 2, and then interest rate volatility increases to 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex016.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Mastro asks Paster to describe the effective convexities of the callable and putable bonds. In response, Paster makes the following statements:<\/p><p><b>Statement 1:<\/b> Both callable and putable bonds exhibit positive convexity when the embedded options are out of the money since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Scenario 2, Bond 3&#x27;s one-sided down duration is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q032.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":33,"q":"Based on Exhibits 1 and 2, which bond(s) has (have) the lowest value under Scenario 3?","opts":["Bond 2 only","Bonds 1 and 2 only","Bonds 1, 2, and 3"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a033.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a033.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathon Paster is an analyst at a fixed-income trading firm. Paster has been assigned to evaluate a developed economy&#x27;s sovereign debt issues. Exhibit 1 contains information on five sovereign bonds; all the bonds mature in exactly three years, on Jun 15 20X9. Three of the bonds have a fixed coupon rate and two of the bonds are floating rate notes (FRNs, or floaters).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex015.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Recent interest rate volatility has been minimal, and the sovereign yield curve is currently flat at 2.00%. Siena Mastro, a portfolio manager at the firm, asks Paster to evaluate the five bonds (Exhibit 1) under several different scenarios:<\/p><p><b>Scenario 1:<\/b> Assume interest rates remain unchanged and interest rate volatility is 0%.<\/p><p><b>Scenario 2:<\/b> Assume an upward parallel yield curve shift of 0.50%, resulting in a 2.50% flat sovereign yield curve, and interest rate volatility is 0%.<\/p><p><b>Scenario 3:<\/b> Assume the yield curve steepens, as shown in Exhibit 2, and interest rate volatility is 0%.<\/p><p><b>Scenario 4:<\/b> Assume the yield curve has already steepened, as shown in Exhibit 2, and then interest rate volatility increases to 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex016.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Mastro asks Paster to describe the effective convexities of the callable and putable bonds. In response, Paster makes the following statements:<\/p><p><b>Statement 1:<\/b> Both callable and putable bonds exhibit positive convexity when the embedded options are out of the money since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, whi ><p><b>Scenario 4:<\/b> Assume the yield curve has already steepened, as shown in Exhibit 2, and then interest rate volatility increases to 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex016.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Mastro asks Paster to describe the effective convexities of the callable and putable bonds. In response, Paster makes the following statements:<\/p><p><b>Statement 1:<\/b> Both callable and putable bonds exhibit positive convexity when the embedded options are out of the money since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>All else equal, based on Exhibit 1 and Scenario 4, which of the following bonds is expected to decrease in value?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q034.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":35,"q":"Which of Paster's statements concerning the effective convexities of callable and putable bonds is correct?","opts":["Only Statement 1","Only Statement 2","Neither Statement 1 nor Statement 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a035.webp\" target=\"_blank\" rel=\"noopener\" title=\
