i/ex062.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>While reviewing Redithy&#x27;s analysis of the two strategies, Marsico comments that their relative attractiveness depends on future interest rates. During the discussion, Redithy expresses the view that &quot;the term structure of interest rates is not determined by economy-wide availability and demand for credit. Instead, due to the constraints facing most issuers and investors, the shape and level of the yield curve is determined solely by the expected supply and demand for credit at each maturity.&quot;<\/p><p>Marsico wants to evaluate values in the eurozone corporate bond market and asks Redithy to gather information on the swap rate curve and swap spreads, which is shown in Exhibit 3. All rates are expressed on an annual compound basis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex063.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><p>In the discussion with Marsico, Redithy identifies two advantages of using the swap curve for valuing corporate bonds rather than using the government bond yield curve of the issuer&#x27;s home country.<\/p><p><b>Advantage 1:<\/b> Yields on government bonds are sometimes distorted due to differences in liquidity that favor on-the-run versus off-the-run issues. However, swap rates are not subject to the same distortions due to generally uniform liquidity across maturities.<\/p><p><b>Advantage 2:<\/b> When analysts are valuing corporate bonds of a given maturity (eg, 10 years), a swap rate that reflects exactly 10 years to maturity is always available. Unfortunately, even if it is the government&#x27;s benchmark security, the quoted government 10-year bond will rarely have exactly 10 years to maturity.<\/p><p>Marsico asks Redithy if she has considered interest rate volatility in her analysis and what factor has the biggest impact on short-term interest rate volatility.<\/p><\/div><\/details><div class=\"qtext\"><p>In response to Marsico&#x27;s question, Redithy would most appropriately conclude that short-term interest rate volatility is related to uncertainty surrounding:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q120.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":121,"q":"Which of Toussaint's statements is(are) correct?","opts":["Statement 1 only","Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a121.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a121.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 121–126 · Fixed Income<\/summary><div class=\"vig-body\"><p>Gerard Marleau and Giles Toussaint are fixed income analysts at Brittany Capital Advisors. The two are having a general discussion on the binomial interest tree framework since their supervisor, Anne Callaise, has asked a series of questions on the topic.<\/p><p>Toussaint comments that when valuing an option-free bond with an arbitrage-free binomial lattice, he prefers to construct the binomial tree rates based on the spot rate curve since:<\/p><p><b>Statement 1:<\/b> using par rates will result in an artificially high valuation<\/p><p><b>Statement 2:<\/b> using forward rates will result in an artificially low valuation<\/p><p>Marleau then brings up the topic of pathwise valuation and states that when valuing a 4-year, arbitrage-free, default-risk-free bond, the bond&#x27;s value:<\/p><p>Component 1: is probability-weighted<\/p><p>Component 2: follows only a single specific interest rate path<\/p><p>Component 3: results in the same value as a backward induction process only if the path begins at the highest probability node in Year 4.<\/p><p>The two analysts begin the process of calibrating a binomial interest rate tree to match a specific term structure. Callaise has asked them to work on this model together and determine the most appropriate interest rate at time i1,L.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex064.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>The conversation then shifts to various term structure models. Callaise has asked Marleau and Toussaint to identify the term structure models that can accommodate the current yield curve, which is inverted and has negative yields. Toussaint adds that they also need to consider the appropriate volatility and drift assumptions of the model.<\/p><p>Finally, Marleau asks Toussaint about the use of a Monte Carlo simulation. Toussaint replies that it depends on the securities being evaluated and lists three types of securities that would justify using a Monte Carlo simulation, with its added complexity:<\/p><p><b>Security 1:<\/b> Mortgage-backed security<\/p><p><b>Security 2:<\/b> Zero-coupon bond with a European call<\/p><p><b>Security 3:<\/b> A-rated corporate straight bond<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Toussaint&#x27;s statements is(are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q121.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":122,"q":"The number of Marleau's components on pathwise valuation that are correct is:","opts":["zero.","one.","two."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a122.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a122.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 22 · Câu 121–126 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Gerard Marleau and Gile g\" loading=\"lazy\" src=\"l2img/uw-fi/a131.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 131–134 · Fixed Income<\/summary><div class=\"vig-body\"><p>Stefan Bagby is a portfolio manager at Mulderberg Investments, a firm that specializes in fixed income management, and Jonathan Landa is a newly hired analyst who reports to Bagby. Bagby is interested in assessing Landa&#x27;s knowledge of the relationships between spot rates, forward rates, and bond pricing.<\/p><p>Bagby provides Landa with Exhibit 1 and asks him to calculate:<\/p><p>the forward price of a 2-year bond to be issued in 1 year, using the forward pricing model<\/p><p>the interest rate on a 2-year loan that begins in 1 year, using the forward rate model.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex067.webp\" style=\"max-width:min(100%,310px)\" alt=\"Exhibit\"><p>He then asks Landa to provide an interpretation of the 3-year forward rate 1 year from today. Landa replies that, assuming no arbitrage, the 3-year forward rate 1 year from today is equivalent to the return from buying either:<\/p><p><b>Reply 1:<\/b> A 1-year zero-coupon bond today and then reinvesting the proceeds a year later in a 3-year zero-coupon bond<\/p><p><b>Reply 2:<\/b> A 4-year zero-coupon bond today<\/p><p>Bagby then turns his attention to active bond portfolio management concepts and provides Landa with three alternative investment strategies, given spot and forward rate assumptions. Bagby specifies that the investment horizon is 1 year and the future spot rates in 1 year are equal to the no-arbitrage forward rates implied by spot rate curve today, as presented in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex068.webp\" style=\"max-width:min(100%,413px)\" alt=\"Exhibit\"><p>The three alternative strategies are:<\/p><p><b>Strategy 1<\/b> Buy a 1-year zero-coupon bond<\/p><p><b>Strategy 2:<\/b> Buy a 3-year zero-coupon bond and sell it in 1 year<\/p><p><b>Strategy 3:<\/b> Buy a 4-year zero-coupon bond and sell it in 1 year<\/p><p>Note that all spot and forward rates have been rounded.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and using the forward pricing model, the forward price of a 2-year bond to be issued in 1 year is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q131.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":132,"q":"Based on Exhibit 1 and using the forward rate model, the interest rate on a 3-year loan that begins in 1 year is closest to:","opts":["7.00%","8.02%","8.53%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a132.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a132.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 24 · Câu 131–134 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Stefan Bagby is a portfolio manager at Mulderberg Investments, a firm that specializes in fixed income management, and Jonathan Landa is a newly hired analyst who reports to Bagby. Bagby is interested in assessing Landa&#x27;s knowledge of the relationships between spot rates, forward rates, and bond pricing.<\/p><p>Bagby provides Landa with Exhibit 1 and asks him to calculate:<\/p><p>the forward price of a 2-year bond to be issued in 1 year, using the forward pricing model<\/p><p>the interest rate on a 2-year loan that begins in 1 year, using the forward rate model.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex067.webp\" style=\"max-width:min(100%,310px)\" alt=\"Exhibit\"><p>He then asks Landa to provide an interpretation of the 3-year forward rate 1 year from today. Landa replies that, assuming no =\"lazy\" src=\"l2img/uw-fi/q137.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":138,"q":"Which type of yield curve shift is Burly's interest rate forecast most consistent with?","opts":["Bullish flattening","Bullish steepening","Bearish steepening"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a138.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a138.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 135–140 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marigold Darling, CFA, a fixed-income analyst at an asset management firm, is evaluating three trading strategies being considered for Country A zero-coupon government bonds:<\/p><p><b>Strategy 1:<\/b> Buy a 3-year bond and hold to maturity.<\/p><p><b>Strategy 2:<\/b> Buy a 1-year bond and simultaneously buy a 1-year forward contract on a 2-year bond. When the 1-year bond matures, buy the underlying 2-year bond at the forward contract expiration, and hold that bond until it matures.<\/p><p><b>Strategy 3:<\/b> Buy a 5-year bond and sell after 3 years.<\/p><p>Exhibit 1 contains the rates on the securities used for the three strategies.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex069.webp\" style=\"max-width:min(100%,385px)\" alt=\"Exhibit\"><p>Demetrio Burly, a portfolio strategist at the firm, is assigned to evaluate Country B&#x27;s economy. He is focusing on the central bank&#x27;s expected actions and the effect of its policies on interest rates. Exhibit 2 contains information on Country B government bond rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex070.webp\" style=\"max-width:min(100%,384px)\" alt=\"Exhibit\"><p>The report Burly submits to his manager states &quot;Country B is in recession and its cen st risk to investors holding portfolios of Country B government bonds is most likely related to changes in the yield curve's:","opts":["level.","slope.","curvature."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a140.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a140.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 25 · Câu 135–140 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Marigold Darling, CFA, a fixed-income analyst at an asset management firm, is evaluating three trading strategies being considered for Country A zero-coupon government bonds:<\/p><p><b>Strategy 1:<\/b> Buy a 3-year bond and hold to maturity.<\/p><p><b>Strategy 2:<\/b> Buy a 1-year bond and simultaneously buy a 1-year forward contract on a 2-year bond. When the 1-year bond matures, buy the underlying 2-year bond at the forward contract expiration, and hold that bond until it matures.<\/p><p><b>Strategy 3:<\/b> Buy a 5-year bond and sell after 3 years.<\/p><p>Exhibit 1 contains the rates on the securities used for the three strategies.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex069.webp\" style=\"max-width:min(100%,385px)\" alt=\"Exhibit\"><p>Demetrio Burly, a portfolio strategist at the firm, is assigned to evaluate Country B&#x27;s economy. He is focusing on the central bank&#x27;s expected actions and the effect of its policies on interest rates. Exhibit 2 contains information on Country B government bond rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex070.webp\" style=\"max-width:min(100%,384px)\" alt=\"Exhibit\"><p>The report Burly submits to his manager states &quot;Country B is in recession and its central bank is expected to reduce short-term interest rates by 1.50% over next year. Furthermore, the central bank has committed to buying government bonds to help stimulate economic recovery and these bond purchases are expected to reduce intermediate term government bond yields by 1.00%.&quot;<\/p><p>One year later, Burly gathers the following information:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex071.webp\" style=\"max-width:min(100%,510px)\" alt=\"Exhibit\"><p>Interest rates provided in all exhibits are based on annual compounding.<\/p><\/div><\/details><div class=\"qtext\"><p>Given the change in Country B&#x27;s interest rates over the year that passed between Exhibit 2 and Exhibit 3, the greatest risk to investors holding portfolios of Country B government bonds is most likely related to changes in the yield curve&#x27;s:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q140.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":141,"q":"Based on Exhibit 1, the price per 100 par of the CDS on Bond 3's issuer is closest to:","opts":["98.8","100.3","101.2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a141.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a141.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jemmi Tauran, CFA, works on the proprietary trading desk of a private bank, dealing in fixed-income securities and related derivatives. Tauran evaluates three bonds and the related single-name credit default swaps (CDS), which the firm currently has no positions in. Exhibit 1 contains information on the bonds and related CDS. The market reference interest rate is 0.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex072.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>In search of other trading opportunities, Tauran performs a credit analysis of Axit, Inc. After completing the evaluation, she buys 10-year Axit bonds and simultaneously buys credit protection using a 10-year single-name CDS on Axit. Exhibit 2 contains information on the bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex073.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Based on her evaluation of economic conditions, Tauran concludes there is likely to be a substantial weakening of US GDP growth near term, though her long-term outlook on the economy is positive. Near-term economic weakness would create financial stress in the corporate sector and likely result in a substantial increase in short-term credit spreads. However, longer-term credit spreads are likely to remain stable or increase by a small amount. Tauran decides to implement a curve trade using the US high-yield index CDS (ie, HY CDX) to profit from the expected change in the credit curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the price per 100 par of the CDS on Bond 3&#x27;s issuer is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q141.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":142,"q":"Tauran assumes the price of credit risk in the fixed-income and CDS markets will converge for all three bonds. Assuming duration risk is hedged with an interest rate derivative, based on Exhibit 1, the largest potential profit from buying the bond and buying credit protection on the same security would most likely be earned from:","opts":["Bond 1.","Bond 2.","Bond 3."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a142.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a142.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\" ction on the same security would most likely be earned from:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q142.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":143,"q":"Tauran decides to sell 5-year credit protection on Bond 2 without taking any position in the bond. Tauran's position is most likely equivalent to being:","opts":["Al short the issuer's bond.","long the issuer's credit quality.","short the issuer's credit quality."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a143.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a143.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jemmi Tauran, CFA, works on the proprietary trading desk of a private bank, dealing in fixed-income securities and related derivatives. Tauran evaluates three bonds and the related single-name credit default swaps (CDS), which the firm currently has no positions in. Exhibit 1 contains information on the bonds and related CDS. The market reference interest rate is 0.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex072.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>In search of other trading opportunities, Tauran performs a credit analysis of Axit, Inc. After completing the evaluation, she buys 10-year Axit bonds and simultaneously buys credit protection using a 10-year single-name CDS on Axit. Exhibit 2 contains information on the bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex073.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Based on her evaluation of economic conditions, Tauran concludes there is likely to be a substantial weakening of US GDP growth near term, though her long-term outlook on the economy is positive. Near-term economic weakness would create financial stress in the corporate sector and likely result in a substantial increase in short-term credit spreads. However, longer-term credit spreads are likely to remain stable or increase by a small amount. Tauran decides to implement a curve trade using the US high-yield index CDS (ie, HY CDX) to profit from the expected change in the credit curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Tauran decides to sell 5-year credit protection on Bond 2 without taking any position in the bond. Tauran&#x27;s position is most likely equivalent to being:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q143.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":144,"q":"Based on Exhibit 2, since Tauran received a 2.10% upfront premium for buying credit protection on Axit bonds, the CDS spread is closest to:","opts":["0.70%.","0.79%.","1.30%."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a144.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a144.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jemmi Tauran, CFA, works on the proprietary trading desk of a private bank, dealing in fixed-income securities and related derivatives. Tauran evaluates three bonds and the related single-name credit default swaps (CDS), which the firm currently has no positions in. Exhibit 1 contains information on the bonds and related CDS. The market reference interest rate is 0.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex072.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>In search of other trading opportunities, Tauran performs a credit analysis of Axit, Inc. After completing the evaluation, she buys 10-year Axit bonds and simultaneously buys credit protection using a 10-year single-name CDS on Axit. Exhibit 2 contains information on the bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex073.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Based on her evaluation of economic conditions, Tauran concludes there is likely to be a substantial weakening of US GDP growth near term, though her long-term outlook on the economy is positive. Near-term economic weakness would create financial stress in the corporate sector and likely result in a substantial increase in short-term credit spreads. However, longer-term credit spreads are likely to remain stable or increase by a small amount. Tauran decides to implement a curve trade using the US high-yield index CDS (ie, HY CDX) to profit from the expected change in the credit curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, since Tauran received a 2.10% upfront premium for buying credit protection on Axit bonds, the CDS spread is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q144.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":145,"q":"Several months after Tauran buys Axit bonds and buys credit protection on them, Axit declares bankruptcy. If the Axit bond is trading at 30% of par and the auction-determined CDS cash settlement value results in a payout ratio of 70%, Tauran's most appropriate response is to:","opts":["elect cash settlement.","elect physical settlement.","be indifferent between cash and physical settlement."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a145.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img c ion-determined CDS cash settlement value results in a payout ratio of 70%, Tauran&#x27;s most appropriate response is to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q145.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":146,"q":"Based on Tauran's expectations for a shift in the US high-yield corporate credit curve, the profitable curve trade using the HY CDX is most likely:","opts":["sell 3-year credit protection and buy 10-year credit protection.","buy 3-year credit protection and sell 10-year credit protection.","buy 3-year credit protection and buy 10-year credit protection."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a146.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a146.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 26 · Câu 141–146 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jemmi Tauran, CFA, works on the proprietary trading desk of a private bank, dealing in fixed-income securities and related derivatives. Tauran evaluates three bonds and the related single-name credit default swaps (CDS), which the firm currently has no positions in. Exhibit 1 contains information on the bonds and related CDS. The market reference interest rate is 0.50%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex072.webp\" style=\"max-width:min(100%,429px)\" alt=\"Exhibit\"><p>In search of other trading opportunities, Tauran performs a credit analysis of Axit, Inc. After completing the evaluation, she buys 10-year Axit bonds and simultaneously buys credit protection using a 10-year single-name CDS on Axit. Exhibit 2 contains information on the bonds and CDS.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex073.webp\" style=\"max-width:min(100%,414px)\" alt=\"Exhibit\"><p>Based on her evaluation of economic conditions, Tauran concludes there is likely to be a substantial weakening of US GDP growth near term, though her long-term outlook on the economy is positive. Near-term economic weakness would create financial stress in the corporate sector and likely result in a substantial increase in short-term credit spreads. However, longer-term credit spreads are likely to remain stable or increase by a small amount. Tauran decides to implement a curve trade using the US high-yield index CDS (ie, HY CDX) to profit from the expected change in the credit curve.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Tauran&#x27;s expectations for a shift in the US high-yield corporate credit curve, the profitable curve trade using the HY CDX is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q146.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":147,"q":"Patel's belief regarding short-term expected returns most likely reflects which traditional term structure theory?","opts":["Local expectations","Liquidity preference","Segmented markets"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a147.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a147.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 147–150 · Fixed Income<\/summary><div class=\"vig-body\"><p>Amanda Neal is a fixed-income strategist at a sell-side firm. Neal has a meeting scheduled with Geetika Patel, a buy-side fixed-income portfolio manager. Patel manages a government bond fund with a weighted average maturity of 10 years. The two plan to discuss Neal&#x27;s economic outlook and recommended positioning for the fixed-income portfolio.<\/p><p>The economy has experienced modest growth over the past several years, and inflation has generally been benign. The central bank policy rate has been unchanged over this time, but now there are some developing concerns regarding inflation pressures. There is widespread expectation that the central bank will raise interest rates several times over the next 12 months. The yield curve is currently upward sloping and would be considered normally shaped.<\/p><p>At the meeting, Neal suggests that the economy is likely to avoid a recession as long as the central bank does not tighten monetary policy too much. Neal&#x27;s current forecast is for the central bank to raise the policy rate by a total of 100 basis points over the next 12 months.<\/p><p>Patel responds by stating that, given the forecasting uncertainty over the next 12 months, &quot;My belief is that expected returns for all bonds over a short-term horizon will match the risk-free rate due to the no-arbitrage condition in the markets. Therefore, I should allocate as much of the portfolio as possible to the 1-year maturity segment of the curve and shorten the fund&#x27;s duration.&quot;<\/p><p>Based on Patel&#x27;s portfolio reallocation comment, Neal presents her three-factor term structure model, which forms the basis of her yield curve forecast. Neal is predicting no change in the level factor, but a 2increase in both the slope and curvature factors over the next year. Neal&#x27;s model is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex074.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Neal then sums up her portfolio positioning views based on her economic forecast, yield curve assumptions, and term structure model. She notes that, over the next year, either of the following strategies would be preferable to a 10-year bullet strategy, provided the future spot rates stay below the current forward rates:<\/p><p><b>Strategy 1:<\/b> Riding the yield curve using 11-year default-free government bonds<\/p><p><b>Strategy 2:<\/b> A 1-year and 20-year barbell strategy<\/p><p>Patel is intrigued by Neal&#x27;s term structure factor model and its implication for the portfolio, and she makes the following statements about the portfolio&#x27;s yield curve risks and related duration measures:<\/p><p><b>Statement 1:<\/b> A portfolio&#x27;s effective duration adequately accounts for shaping risk.<\/p><p><b>Statement 2:<\/b> Key rate duration is useful for individual bonds, but not portfolios.<\/p><p><b>Statement 3:<\/b> Key rate duration is appropriately only for bonds without embedded options.<\/p><\/div><\/details><div class=\"qtext\"><p>Patel&#x27;s belief regarding short-term expected returns most likely reflects which traditional term structure theory?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q147.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":148,"q":"Based on Exhibit 1 and Neal's factor model forecast, the resulting change in the yield curve is best described as a:","opts":["bearish flattening.","parallel shift higher.","bearish steepening."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a148.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a148.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 147–150 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amanda Neal is a fixed-income strategist at a sell-side firm. Neal has a meeting scheduled with Geetika Patel, a buy-side fixed-income portfolio manager. Patel manages a government bond fund with a weighted average maturity of 10 years. The two plan to discuss Neal&#x27;s economic outlook and recommended positioning for the fixed-income portfolio.<\/p><p>The economy has experienced modest growth over the past several years, and inflation has generally been benign. The central bank policy rate has been unchanged over this time, but now there are some developing concerns regarding inflation pressures. There is widespread expectation that the central bank will raise interest rates several times over the next 12 months. The yield curve is currently upward sloping and would be considered normally shaped.<\/p><p>At the meeting, Neal suggests that the economy is likely to avoid a recession as long as the central bank does not tighten monetary policy too much. Neal&#x27;s current forecast is for the central bank to raise the policy rate by a total of 100 basis points over the next 12 months.<\/p><p>Patel responds by stating that, given the forecasting uncertainty over the next 12 months, &quot;My belief is that expected returns for all bonds over a short-term horizon will match the risk-free rate due to the no-arbitrage condition in the markets. Therefore, I should allocate as much of the portfolio as possible to the 1-year maturity segment of the curve and shorten the fund&#x27;s duration.&quot;<\/p><p>Based on Patel&#x27;s portfolio reallocation comment, Neal presents her three-factor term structure model, which forms the basis of her yield curve forecast. Neal is predicting no change in the level factor, but a 2increase in both the slope and curvature factors over the next year. Neal&#x27;s model is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex074.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Neal then sums up her portfolio positioning views based on her economic forecast, yield curve assumptions, and term structure model. She notes that, over the next year, either of the following strategies would be preferable to a 10-year bullet strategy, provided the future spot rates stay below the current forward rates:<\/p><p><b>Strategy 1:<\/b> Riding the yield curve using 11-year default-free government bonds<\/p><p><b>Strategy 2:<\/b> A 1-year and 20-year barbell strategy<\/p><p>Patel is intrigued by Neal&#x27;s term structure factor model and its implication for the portfolio, and she makes the following statements about the portfolio&#x27;s yield curve risks and related duration measures:<\/p><p><b>Statement 1:<\/b> A portfolio&#x27;s effective duration adequately accounts for shaping risk.<\/p><p><b>Statement 2:<\/b> Key rate duration is useful for individual bonds, but not portfolios.<\/p><p><b>Statement 3:<\/b> Key rate duration is appropriately only for bonds without embedded options.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Neal&#x27;s factor model forecast, the resulting change in the yield curve is best described as a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q148.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":149,"q":"Based on Exhibit 1 and Neal's forecast, which of Neal's suggested portfolio strategies is (are) preferable to a bullet strategy?","opts":["Only Strategy 1","Only Strategy 2","Both Strategy 1 and Strategy 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a149.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a149.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 147–150 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amanda Neal is a fixed-income strategist at a sell-side firm. Neal has a meeting scheduled with Geetika Patel, a buy-side fixed-income portfolio manager. Patel manages a government bond fund with a weighted average maturity of 10 years. The two plan to discuss Neal&#x27;s economic outlook and recommended positioning for the fixed-income portfolio.<\/p><p>The economy has experienced modest growth over the past several years, and inflation has generally been benign. The central bank policy rate has been unchanged over this time, but now there are some developing concerns regarding inflation pressures. There is widespread expectation that the central bank will raise interest rates several times over the next 12 months. The yield curve is currently upward sloping and would be considered normally shaped.<\/p><p>At the meeting, Neal suggests that the economy is likely to avoid a recession as long as the central bank does not tighten monetary policy too much. Neal&#x27;s current forecast is for the central bank to raise the policy rate by a total of 100 basis points over the next 12 months.<\/p><p>Patel responds by stating that, given the forecasting uncertainty over the next 12 months, &quot;My belief is that expected returns for all bonds over a short-term horizon will match the risk-free rate due to the no-arbitrage condition in the markets. Therefore, I should allocate as much of the portfolio as possible to the 1-year maturity segment of the curve and shorten the fund&#x27;s duration.&quot;<\/p><p>Based on Patel&#x27;s portfolio reallocation comment, Neal presents her three-factor term structure model, which forms the basis of her yield curve forecast. Neal is predicting no change in the level factor, but a 2increase in both the slope and curvature factors over the next year. Neal&#x27;s model is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex074.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Neal then sums up her portfolio positioning views based on her economic forecast, yield curve assumptions, and term structure model. She notes that, over the next year, either of the following strategies would be preferable to a 10-year bullet strategy, provided the future spot rates stay below the current forward rates:<\/p><p><b>Strategy 1:<\/b> Riding the yield curve using 11-year default-free government bonds<\/p><p><b>Strategy 2:<\/b> A 1-year and 20-year barbell strategy<\/p><p>Patel is intrigued by Neal&#x27;s term structure factor model and its implication for the portfolio, and she makes the following statements about the portfolio&#x27;s yield curve risks and related duration measures:<\/p><p><b>Statement 1:<\/b> A portfolio&#x27;s effective duration adequately accounts for shaping risk.<\/p><p><b>Statement 2:<\/b> Key rate duration is useful for individual bonds, but not portfolios.<\/p><p><b>Statement 3:<\/b> Key rate duration is appropriately only for bonds without embedded options.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Neal&#x27;s forecast, which of Neal&#x27;s suggested portfolio strategies is (are) preferable to a bullet strategy?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q149.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":150,"q":"Which of Patel's statements regarding duration and yield curve risks to the portfolio is (are) correct?","opts":["Only Statement 1","Only Statement 2 and Statement 3","None of the Statements are correct"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a150.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a150.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 27 · Câu 147–150 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Amanda Neal is a fixed-income strategist at a sell-side firm. Neal has a meeting scheduled with Geetika Patel, a buy-side fixed-income portfolio manager. Patel manages a government bond fund with a weighted average maturity of 10 years. The two plan to discuss Neal&#x27;s economic outlook and recommended positioning for the fixed-income portfolio.<\/p><p>The economy has experienced modest growth over the past several years, and inflation has generally been benign. The central bank policy rate has been unchanged over this time, but now there are some developing concerns regarding inflation pressures. There is widespread expectation that the central bank will raise interest rates several times over the next 12 months. The yield curve is currently upward sloping and would be considered normally shaped.<\/p><p>At the meeting, Neal suggests that the economy is likely to avoid a recession as long as the central bank does not tighten monetary policy too much. Neal&#x27;s current forecast is for the central bank to raise the policy rate by a total of 100 basis points over the next 12 months.<\/p><p>Patel responds by stating that, given the forecasting uncertainty over the next 12 months, &quot;My belief is that expected returns for all bonds over a short-term horizon will match the risk-free rate due to the no-arbitrage condition in the markets. Therefore, I should allocate as much of the portfolio as possible to the 1-year maturity segment of the curve and shorten the fund&#x27;s duration.&quot;<\/p><p>Based on Patel&#x27;s portfolio reallocation comment, Neal presents her three-factor term structure model, which forms the basis of her yield curve forecast. Neal is predicting no change in the level factor, but a 2increase in both the slope and curvature factors over the next year. Neal&#x27;s model is presented in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex074.webp\" style=\"max-width:min(100%,432px)\" alt=\"Exhibit\"><p>Neal then sums up her portfolio positioning views based on her economic forecast, yield curve assumptions, and term structure model. She notes that, over the next year, either of the following strategies would be preferable to a 10-year bullet strategy, provided the future spot rates stay below the current forward rates:<\/p><p><b>Strategy 1:<\/b> Riding the yield curve using 11-year default-free government bonds<\/p><p><b>Strategy 2:<\/b> A 1-year and 20-year barbell strategy<\/p><p>Patel is intrigued by Neal&#x27;s term structure factor model and its implication for the portfolio, and she makes the following statements about the portfolio&#x27;s yield curve risks and related duration measures:<\/p><p><b>Statement 1:<\/b> A portfolio&#x27;s effective duration adequately accounts for shaping risk.<\/p><p><b>Statement 2:<\/b> Key rate duration is useful for individual bonds, but not portfolios.<\/p><p><b>Statement 3:<\/b> Key rate duration is appropriately only for bonds without embedded options.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Patel&#x27;s statements regarding duration and yield curve risks to the portfolio is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q150.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":151,"q":"Based on Exhibit 1 and Exhibit 2, the no-arbitrage value of Bond A is closest to:","opts":["98.978","99.087","99.093"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a151.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a151.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 151–154 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ali Laschi manages the fixed-income trading desk for an international bank, where Jennifer Beaumont is an analyst. Laschi asks Beaumont to assess the relative value of several government bonds. Exhibit 1 contains selected data on the off-the-run government bonds Laschi wants Beaumont to evaluate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex075.webp\" style=\"max-width:min(100%,495px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on government par bond yields and spot rates that Beaumont will use in analyzing the bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex076.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Laschi and Beaumont discuss bond valuation using spot rates versus using a binomial tree. During the discussion, Beaumont makes the following comments regarding a binomial interest rate framework with a tree constructed using a lognormal interest rate model:<\/p><p><b>Comment 1:<\/b> Whereas spot rate curve valuations discount each cash flow once by the appropriate term spot rate, binomial valuations discount cash flows period by period, each time using the 1-period forward rates along every possible interest rate path from Time 0 to maturity.<\/p><p><b>Comment 2:<\/b> Using a volatility of 0% for tree construction results in a tree with a single interest rate path that consists of the 1-period spot rate and a series of 1-period forward rates derived from the spot rate curve.<\/p><p>Laschi asks Beaumont to explain in detail how backward induction is used to calculate a coupon bond&#x27;s value at each node on a binomial tree. In response, Beaumont makes the following statements:<\/p><p><b>Statement 1:<\/b> The value at any node is any coupon due, added to the average of the PVs of the two nodes along the interest rate paths to the succeeding period.<\/p><p><b>Statement 2:<\/b> Before the addition of that period&#x27;s coupon, the value at any node is the average PV of subsequent periods&#x27; cash flows for all the interest rate paths from that node to maturity.<\/p><p>Laschi then asks Beaumont to perform a pathwise valuation of Bond B. Exhibit 3 contains a binomial tree constructed from government par bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex077.webp\" style=\"max-width:min(100%,436px)\" alt=\"Exhibit\"><p>Exhibit 4 describes the possible interest rate paths on the tree to be used for a pathwise valuation of the bond:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex078.webp\" style=\"max-width:min(100%,514px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per annum and all interest rates are expressed as annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1 and Exhibit 2, the no-arbitrage value of Bond A is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q151.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":152,"q":"Which of Beaumont's comments regarding a binomial interest-rate-tree framework is (are) correct?","opts":["Only Comment 1","Only Comment 2","Both Comment 1 and Comment 2"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a152.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a152.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 28 · Câu 151–154 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ali Laschi manages the fixed-income trading desk for an international bank, where Jennifer Beaumont is an analyst. Laschi asks Beaumont to assess the relative value of several government bonds. Exhibit 1 contains selected data on the off-the-run government bonds Laschi wants Beaumont to evaluate:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex075.webp\" style=\"max-width:min(100%,495px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on government par bond yields and spot rates that Beaumont will use in analyzing the bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex076.webp\" style=\"max-width:min(100%,472px)\" alt=\"Exhibit\"><p>Laschi and Beaumont discuss bond valuation using spot rates const CFG = {"title": "UWorld — Fixed Income", "subtitle": "CFA Level II · 154 câu · UWorld item sets", "minutes": 0, "passMark": 65, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    let prev = {}; try{ prev = JSON.parse(localStorage.getItem(PROG_KEY)||"null")||{}; }catch(e){}
    const slug = PROG_KEY.replace(/^cfa:prog:/,"");
    const _d=new Date(); const day=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
    let tbase = prev.tbase;
    if(!tbase || tbase.d !== day) tbase = {d:day, base:(prev.done||0)};
    const answeredToday = Math.max(0, done - tbase.base);
    try{
      const daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}");
      (daily[day] = daily[day]||{})[slug] = {answered:answeredToday, done, total, graded, correct, pct, title:(CFG.title||slug), ts:Date.now()};
      localStorage.setItem("cfa:daily", JSON.stringify(daily));
    }catch(e){}
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, tbase, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); var __slug = PROG_KEY.replace(/^cfa:prog:/,""); var __daily = JSON.parse(localStorage.getItem("cfa:daily")||"{}"), __ch=false; for(var __d in __daily){ if(__daily[__d] && __daily[__d][__slug]){ delete __daily[__d][__slug]; __ch=true; } if(__daily[__d] && Object.keys(__daily[__d]).length===0) delete __daily[__d]; } if(__ch) localStorage.setItem("cfa:daily", JSON.stringify(__daily)); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      e.appendChild(q.explhtml?buildExplHtml(q):buildExplanation(q.expl,q.ans,q.opts));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}


// ---- readable explanations ---------------------------------------------- //
function explanationData(raw){
  const noise=/^(?:discuss(?:ion)?|discu|filter|eilter|solution|what do you want to discuss.*|question\s+\d+\s+of\s+\d+|response rationale for the correct answer|rationale for the correct answer|thảo luận|lọc|giải pháp|bạn muốn thảo luận.*|lý do cho đáp án đúng|câu hỏi\s+\d+\s+trên\s+\d+|\(?required\)?|\(?bắt buộc\)?|[?①θi1])$/i;
  let lines=String(raw||"").replace(/\r/g,"").split("\n")
    .map(line=>line.replace(/\s+/g," ").trim())
    .filter(line=>line&&!noise.test(line));
  let reading="",los="",losIndex=-1;
  const action=/^(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss|tính|mô tả|giải thích|so sánh|phân tích|đánh giá|diễn giải|nhận diện|xác định|định nghĩa|thảo luận)\b/i;
  for(let i=Math.max(1,lines.length-10);i<lines.length;i++){
    const candidate=lines[i].replace(/^[·•?]\s*/,"").replace(/^i(?=(?:calculate|describe|explain|compare|analy[sz]e|evaluate|interpret|identify|define|determine|discuss))/i,"").trim();
    const previous=lines[i-1]||"";
    if(action.test(candidate)&&previous.length<120&&!/[.!?]$/.test(previous)&&!/^[A-J][.)]\s/i.test(previous)){
      reading=previous; los=lines.slice(i).join(" "); lines=lines.slice(0,i-1); losIndex=i; break;
    }
  }
  return {text:lines.join(" ").replace(/\s+/g," ").trim(),reading,los};
}
function explanationSections(text,correctLetter){
  const broken=String(text||"").replace(/\s+([A-J])\s*[.)]\s+(?=(?:Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\b)/gi,"\n$1. ");
  const chunks=broken.split(/\n(?=[A-J]\.\s+)/).map(s=>s.trim()).filter(Boolean);
  const sections=chunks.map(chunk=>{
    const match=chunk.match(/^([A-J])\.\s*(?:(Correct|Incorrect|Đúng|Chính xác|Sai|Không (?:đúng|chính xác))\.?\s*)?(?:because\s+)?/i);
    if(!match) return {letter:"",text:chunk};
    return {letter:match[1].toUpperCase(),text:chunk.slice(match[0].length).trim()};
  });
  const hasCorrect=sections.some(section=>section.letter===correctLetter);
  if(!hasCorrect&&sections.length>1&&!sections[0].letter) sections[0].letter=correctLetter;
  const unique=[];
  sections.forEach(section=>{
    if(!section.letter){
      if(section.text&&!unique.some(item=>!item.letter)) unique.push(section);
      return;
    }
    const duplicateIndex=unique.findIndex(item=>item.letter===section.letter);
    if(duplicateIndex<0) unique.push(section);
    else if((section.text||"").length>(unique[duplicateIndex].text||"").length) unique[duplicateIndex]=section;
  });
  return unique;
}
function buildExplanation(raw,correctLetter,options){
  const data=explanationData(raw);
  const shell=document.createElement("div"); shell.className="expl-shell";
  const head=document.createElement("div"); head.className="expl-head";
  const title=document.createElement("span"); title.className="expl-title"; title.textContent="Giải thích đáp án";
  const answer=document.createElement("span"); answer.className="expl-answer"; answer.textContent="Đáp án đúng: "+correctLetter;
  head.appendChild(title); head.appendChild(answer); shell.appendChild(head);
  const content=document.createElement("div"); content.className="expl-content";
  explanationSections(data.text,correctLetter).forEach(section=>{
    if(section.letter){
      const choice=document.createElement("article");
      const isCorrect=section.letter===correctLetter;
      choice.className="expl-choice "+(isCorrect?"is-correct":"is-other");
      const top=document.createElement("div"); top.className="expl-choice-top";
      const letter=document.createElement("span"); letter.className="expl-letter"; letter.textContent=section.letter;
      const state=document.createElement("span"); state.className="expl-state"; state.textContent=isCorrect?"Đáp án đúng":"Không đúng";
      top.appendChild(letter); top.appendChild(state); choice.appendChild(top);
      const optionIndex=LETTERS.indexOf(section.letter);
      if(options&&optionIndex>=0&&options[optionIndex]){
        const option=document.createElement("p"); option.className="expl-option-copy"; option.textContent=options[optionIndex]; choice.appendChild(option);
      }
      if(section.text){ const reason=document.createElement("p"); reason.className="expl-reason"; reason.textContent=section.text; choice.appendChild(reason); }
      content.appendChild(choice);
    }else if(section.text){
      const note=document.createElement("div"); note.className="expl-note";
      const paragraph=document.createElement("p"); paragraph.textContent=section.text; note.appendChild(paragraph); content.appendChild(note);
    }
  });
  if(data.reading||data.los){
    const meta=document.createElement("div"); meta.className="expl-meta";
    if(data.reading){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="Reading:"; const value=document.createElement("span"); value.textContent=data.reading; row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    if(data.los){ const row=document.createElement("div"); row.className="expl-meta-row"; const key=document.createElement("b"); key.textContent="LOS:"; const value=document.createElement("span"); value.textContent=data.los.replace(/^[·•?]\s*/,""); row.appendChild(key); row.appendChild(value); meta.appendChild(row); }
    content.appendChild(meta);
  }
  shell.appendChild(content); return shell;
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function setSubmitButtonMode(showResults){
  const btn=$("submitBtn"); if(!btn) return;
  const label=showResults?"Xem kết quả":"Nộp bài";
  const textNode=Array.from(btn.childNodes).find(n=>n.nodeType===3);
  if(textNode) textNode.nodeValue=label;
  btn.title=showResults?"Xem lại điểm tổng và điểm theo môn":"";
}
function requestSubmit(){
  if(graded){
    if(typeof window.showGradedResult==="function") window.showGradedResult();
    else $("resultOverlay").classList.add("show");
    return;
  }
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();

  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";

    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    showQuestionSubject(card,q);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){

    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";

const CFA_SESSION_SUBJECT_RANGES = {

};
const CFA_SUBJECT_HINTS = {
  quant:/probabilit|return measure|holding period|money-weighted|time-weighted|mean|median|mode|quintile|percentile|variance|standard deviation|semideviation|skew|kurtosis|hypothesis|test statistic|confidence interval|regression|correlation|covariance|sampling|estimation|bayes|box and whisker|interquartile|coefficient of variation|compound|present value|future value|interest rate|data science|machine learning|fintech/g,
  economics:/business cycle|credit cycle|fiscal|monetary|central bank|gross domestic product|\bgdp\b|inflation|unemployment|aggregate demand|aggregate supply|market structure|perfect(?:ly)? competitive|monopolistic|oligopoly|elasticity|supply curve|demand curve|globalization|geopolitic|international trade|trade surplus|export subsidy|economic integration|common market|exchange rate|currency|forward points|capital restriction|world bank|international monetary fund/g,

let CFA_SUBJECT_ASSIGNMENTS=null;
function getCfaSubjectHintScore(question,subject){
  const prompt=((question.q||"")+" "+(question.opts||[]).join(" ")).toLowerCase().replace(/[‐‑–—]/g,"-");
  const matches=prompt.match(CFA_SUBJECT_HINTS[subject]);
  return matches?matches.length:0;
}
function buildCfaSubjectAssignments(){
  const session=/-SS1\.html$/i.test(location.pathname)?1:2;
  const ranges=CFA_SESSION_SUBJECT_RANGES[session];
  const subjects=Object.keys(ranges);
  const raw=DATA.map(getCfaSubjectRaw);
  const assigned=raw.slice();
  const counts={}; subjects.forEach(subject=>counts[subject]=0);
  if(session===1){
    DATA.forEach((question,index)=>{
      if(Number(question.n)<=ranges.ethics[1]) assigned[index]="ethics";
      else if(assigned[index]==="ethics") assigned[index]=null;
    });
  }
  DATA.forEach((question,index)=>{
    if(assigned[index]) return;
    const eligible=subjects.filter(subject=>subject!=="ethics");
    assigned[index]=eligible.sort((a,b)=>getCfaSubjectHintScore(question,b)-getCfaSubjectHintScore(question,a))[0];
  });
  assigned.forEach(subject=>counts[subject]++);
  subjects.forEach(source=>{
    const maximum=ranges[source][1];
    if(counts[source]<=maximum) return;
    const candidates=DATA.map((question,index)=>({index,score:getCfaSubjectHintScore(question,source)}))
      .filter(item=>assigned[item.index]===source && !(session===1 && source==="ethics" && Number(DATA[item.index].n)<=27))
      .sort((a,b)=>a.score-b.score||b.index-a.index);
    for(const candidate of candidates){
      if(counts[source]<=maximum) break;
      const belowMinimum=subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][0]);
      const destinations=(belowMinimum.length?belowMinimum:subjects.filter(subject=>subject!==source && counts[subject]<ranges[subject][1]))
        .sort((a,b)=>getCfaSubjectHintScore(DATA[candidate.index],b)-getCfaSubjectHintScore(DATA[candidate.index],a)
          ||(ranges[b][1]-counts[b])-(ranges[a][1]-counts[a]));
      const destination=destinations[0]; if(!destination) break;
      assigned[candidate.index]=destination; counts[source]--; counts[destination]++;
    }
  });
  return assigned;
}
function getCfaSubject(question){
  if(question&&question.subj) return question.subj;
  if(!CFA_SUBJECT_ASSIGNMENTS) CFA_SUBJECT_ASSIGNMENTS=buildCfaSubjectAssignments();
  const index=DATA.indexOf(question);
  return index>=0?CFA_SUBJECT_ASSIGNMENTS[index]:getCfaSubjectRaw(question);
}

function showQuestionSubject(card, question){
  const head=card.querySelector(".card-head"); if(!head) return;
  let label=head.querySelector(".question-subject");
  if(!label){
    label=document.createElement("span"); label.className="question-subject";
    const pin=head.querySelector(".pin"); head.insertBefore(label,pin||null);
  }
  const key=getCfaSubject(question);
  const subject=CFA_SUBJECTS.find(item=>item[0]===key);
  label.dataset.subject=key;
  label.textContent=subject?subject[1]:"Chưa phân loại";
  label.title="Môn CFA: "+label.textContent;
}

function renderSubjectBreakdown(){
  const panel=$("subjectBreakdown"); if(!panel) return;
  const scores={}; CFA_SUBJECTS.forEach(s=>scores[s[0]]={correct:0,total:0});
  DATA.forEach((q,i)=>{
    const key=getCfaSubject(q); if(!scores[key]) return;
    scores[key].total++; if(answers[i]===q.ans) scores[key].correct++;
  });
  panel.innerHTML="";
  const heading=document.createElement("h4"); heading.textContent="Điểm theo môn CFA · Tổng "+DATA.length+" câu"; panel.appendChild(heading);
  const grid=document.createElement("div"); grid.className="subject-grid";
  CFA_SUBJECTS.forEach(subject=>{
    const score=scores[subject[0]]; if(!score.total) return;
    const pct=Math.round(score.correct/score.total*100);
    const row=document.createElement("div"); row.className="subject-row";
    const top=document.createElement("div"); top.className="subject-top";
    const name=document.createElement("span"); name.className="subject-name"; name.textContent=subject[1];
    const value=document.createElement("span"); value.className="subject-score"; value.textContent=score.correct+"/"+score.total+" ("+pct+"%)";
    const bar=document.createElement("div"); bar.className="subject-bar"; bar.setAttribute("role","progressbar"); bar.setAttribute("aria-valuemin","0"); bar.setAttribute("aria-valuemax","100"); bar.setAttribute("aria-valuenow",String(pct));
    const fill=document.createElement("div"); fill.className="subject-fill"; fill.style.width=pct+"%";
    top.appendChild(name); top.appendChild(value); bar.appendChild(fill); row.appendChild(top); row.appendChild(bar); grid.appendChild(row);
  });
  panel.appendChild(grid);
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  setSubmitButtonMode(false);
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();

      title.textContent='Chưa đạt — cố lên nhé!'; title.className='fail';
      icon.setAttribute('src','https://cdn.lordicon.com/jdgfsfzr.json');
      emoji.textContent='💪';
    }
    ov.classList.add('show');
  }
  function fetchEmoji(group, el){
    var ctrl=('AbortController'in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){try{ctrl.abort();}catch(e){}},3500);
    fetch('https://emojihub.yurace.pro/api/random/group/'+group, ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.htmlCode&&d.htmlCode.length){
        el.innerHTML=d.htmlCode.join('');
        el.style.animation='none'; void el.offsetWidth; el.style.animation='';
      }})
      .catch(function(){});
  }
  if(graded) window.showGradedResult();

  function confetti(){
    var cols=['#538297','#86a7b5','#22c55e','#f59e0b','#f43f5e','#38bdf8'];
    for(var i=0;i<70;i++){(function(){
      var d=document.createElement('i'); d.className='fx-confetti';
      d.style.left=Math.random()*100+'vw';
      d.style.background=cols[i%cols.length];
      d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
      d.style.animationDelay=(Math.random()*0.5)+'s';
      d.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(d);
      setTimeout(function(){d.remove();},4500);
    })();}
  }
})();

<script>
/* ===== Ghi chú cá nhân bên phải mỗi câu (lưu trong máy - localStorage) ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function load(){ try{ return JSON.parse(localStorage.getItem(NKEY)||"{}")||{}; }catch(e){ return {}; } }
  function save(map){ try{ localStorage.setItem(NKEY, JSON.stringify(map)); }catch(e){} }
  function keyFor(card){ var id=card.id||""; var m=id.match(/^q-(\d+)$/); return m?m[1]:null; }
  function attach(){
    var notes = load();
    var cards = document.querySelectorAll("#quiz .card");
    for(var c=0;c<cards.length;c++){
      var card = cards[c];
      var parent = card.parentNode;
      if(parent && parent.classList && parent.classList.contains("qrow")) continue; // already wrapped
      var k = keyFor(card);
      if(k===null || !parent) continue;
      var wrap = document.createElement("div");
      wrap.className = "qnote";
      var head = document.createElement("div");
      head.className = "qnote-head";
      head.innerHTML = '<span class="dot">📝</span><span>Ghi chú</span><span class="qnote-saved">Đã lưu ✓</span>';
      var ta = document.createElement("textarea");
      ta.setAttribute("placeholder","Ghi chú cho câu này…");
      ta.value = notes[k] || "";
      (function(ta,k,savedEl){
        var t=null;
        ta.addEventListener("input", function(){
          var m=load();
          if(ta.value && ta.value.trim()) m[k]=ta.value; else delete m[k];
          save(m);
          savedEl.classList.add("show");
          clearTimeout(t); t=setTimeout(function(){ savedEl.classList.remove("show"); }, 1200);
        });
      })(ta, k, head.querySelector(".qnote-saved"));
      wrap.appendChild(head); wrap.appendChild(ta);
      var row = document.createElement("div");
      row.className = "qrow";
      parent.insertBefore(row, card);   // put row where the card was
      row.appendChild(card);            // move question card into the row (left)
      row.appendChild(wrap);            // note beside it (right)
    }
  }
  function boot(){
    attach();
    var quiz = document.getElementById("quiz");
    if(quiz && "MutationObserver" in window){
      var pend=false;
      new MutationObserver(function(){
        if(pend) return; pend=true;
        setTimeout(function(){ pend=false; attach(); }, 30);
      }).observe(quiz,{childList:true});
    }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

<script>
/* ===== Đánh dấu câu có Ghi chú trong "Danh sách câu" + bộ lọc "Ghi chú" ===== */
(function(){
  var slug = (location.pathname.split("/").pop()||"quiz").replace(/\.html$/i,"").toLowerCase();
  var NKEY = "cfa:note:" + slug;
  function noteSet(){
    var s={};
    try{ var m=JSON.parse(localStorage.getItem(NKEY)||"{}")||{};
      for(var k in m){ if(m.hasOwnProperty(k) && m[k] && (""+m[k]).trim()) s[k]=1; } }catch(e){}
    return s;
  }
  function addChip(){
    var chips=document.getElementById("chips");
    if(!chips || chips.querySelector('[data-f="note"]')) return;
    var b=document.createElement("button");
    b.className="chip"; b.setAttribute("data-f","note");
    b.innerHTML='Ghi chú <span></span>';
    b.onclick=function(){ if(typeof setFilter==="function") setFilter("note", b); };
    chips.appendChild(b);
  }
  var wrapped=false;
  function wrapRefresh(){
    if(wrapped || typeof window.refreshNav!=="function") return;
    wrapped=true;
    var orig=window.refreshNav;
    window.refreshNav=function(){
      orig.apply(this, arguments);
      var ns=noteSet(), cnt=0;
      var active=document.querySelector('#chips .chip.active');
      var f=active?active.getAttribute("data-f"):"all";
      var cells=document.querySelectorAll("#navGrid .cell");
      for(var j=0;j<cells.length;j++){
        var c=cells[j], m=(c.id||"").match(/^cell-(\d+)$/); if(!m) continue;
        var has=!!ns[m[1]];
        c.classList.toggle("noted", has);
        if(has) cnt++;
        if(f==="note") c.classList.toggle("hide", !has);
      }
      var sp=document.querySelector('#chips [data-f="note"] span');
      if(sp) sp.textContent="("+cnt+")";
    };
  }
  function wrapToggle(){
    if(typeof window.toggleNav!=="function" || window.toggleNav.__qnav) return;
    var orig=window.toggleNav;
    window.toggleNav=function(){
      var r=orig.apply(this, arguments);
      var p=document.getElementById("navPanel");
      if(p && p.classList.contains("open") && typeof window.refreshNav==="function") window.refreshNav();
      return r;
    };
    window.toggleNav.__qnav=true;
  }
  function boot(){
    addChip(); wrapRefresh(); wrapToggle();
    if(typeof window.refreshNav==="function") window.refreshNav();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

    <p>Toàn bộ đáp án đã chọn và tiến độ của đề này sẽ bị xoá và không thể khôi phục. Bạn chắc chắn muốn làm lại?</p>
    <div class="modal-actions">

    </div>
  </div>
</div>
<script id="restart-confirm-js">
(function(){
  if(typeof restart!=="function") return;
  var _restart=restart;
  function ov(){ return document.getElementById("restartOverlay"); }
  function hasWork(){
    try{
      if(typeof graded!=="undefined" && graded) return true;
      if(typeof answers==="object" && answers && Object.keys(answers).length>0) return true;
      if(typeof pinned==="object" && pinned && Object.keys(pinned).length>0) return true;
    }catch(e){}
    return false;
  }
  window.rcCancel=function(){ var o=ov(); if(o) o.classList.remove("show"); };
  window.rcConfirm=function(){ window.rcCancel(); _restart(); };
  window.restart=function(){
    var o=ov();
    if(o && hasWork()){ o.classList.add("show"); return; }
    _restart();
  };
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){ var o=ov(); if(o && o.classList.contains("show")) window.rcCancel(); }
  });
  var o=ov(); if(o) o.addEventListener("click",function(e){ if(e.target===o) window.rcCancel(); });
})();
</script>
<!--restart-confirm-end-->
