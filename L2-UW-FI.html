 since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Paster&#x27;s statements concerning the effective convexities of callable and putable bonds is correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q035.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":36,"q":"Based on Exhibits 1 and 3, the value of the embedded option in Bond 4 is closest to:","opts":["0.144","0.466","0.747"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a036.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a036.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 6 · Câu 31–36 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jonathon Paster is an analyst at a fixed-income trading firm. Paster has been assigned to evaluate a developed economy&#x27;s sovereign debt issues. Exhibit 1 contains information on five sovereign bonds; all the bonds mature in exactly three years, on Jun 15 20X9. Three of the bonds have a fixed coupon rate and two of the bonds are floating rate notes (FRNs, or floaters).<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex015.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Recent interest rate volatility has been minimal, and the sovereign yield curve is currently flat at 2.00%. Siena Mastro, a portfolio manager at the firm, asks Paster to evaluate the five bonds (Exhibit 1) under several different scenarios:<\/p><p><b>Scenario 1:<\/b> Assume interest rates remain unchanged and interest rate volatility is 0%.<\/p><p><b>Scenario 2:<\/b> Assume an upward parallel yield curve shift of 0.50%, resulting in a 2.50% flat sovereign yield curve, and interest rate volatility is 0%.<\/p><p><b>Scenario 3:<\/b> Assume the yield curve steepens, as shown in Exhibit 2, and interest rate volatility is 0%.<\/p><p><b>Scenario 4:<\/b> Assume the yield curve has already steepened, as shown in Exhibit 2, and then interest rate volatility increases to 30%.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex016.webp\" style=\"max-width:min(100%,613px)\" alt=\"Exhibit\"><p>Mastro asks Paster to describe the effective convexities of the callable and putable bonds. In response, Paster makes the following statements:<\/p><p><b>Statement 1:<\/b> Both callable and putable bonds exhibit positive convexity when the embedded options are out of the money since, in that circumstance, the bonds will behave similarly to otherwise equivalent straight bonds.<\/p><p><b>Statement 2:<\/b> Both callable and putable bonds exhibit negative convexity when the embedded options are in the money since, in that circumstance, the value of the option will offset the effect of interest rates on the straight bond component of the securities.<\/p><p>Mastro directs Paster to construct a binomial interest rate tree based on the yields in Exhibit 2. The tree constructed by Paster is shown in Exhibit 3:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex017.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 3, the value of the embedded option in Bond 4 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q036.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":37,"q":"Based on Exhibit 1, and if interest rates decrease significantly immediately after the bonds are issued, the bond most likely to have the highest value after an interest rate increase is:","opts":["Bond 1.","Bond 2.","Bond 3."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a037.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a037.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Fixed Income<\/summary><div class=\"vig-body\"><p>Jethro Timkin is a portfolio manager at a fixed-income asset management firm. Timkin wants to evaluate the investment characteristics of three new bonds being issued by Moontite Corporation on 31 January 20X4. Each bond has a maturity date of 31 January 20X7. Details of the bonds are shown in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex018.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit\"><p>To better understand the risk and relative value of the callable bond, Timkin seeks to determine Bond 2&#x27;s effective duration. The related information is shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex019.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><p>Timkin also performs an option-adjusted spread analysis of Bond 2 versus a similar bond from Beta Alpha Corporation (Bond 4). Selected information regarding the bonds is shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex020.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Timkin wants to evaluate the relative value of a previously issued callable Beta Alpha Corporation bond currently trading at 105% of par. The bond pays a 6% coupon rate and has three years until maturity. The bond is callable at 103% of par on either of two dates, exactly one year or two years prior to maturity, respectively. The binomial interest rate tree Timkin developed to value the bond is shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex021.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>Assume all the bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, and if interest rates decrease significantly immediately after the bonds are issued, the bond most likely to have the highest value after an interest rate increase is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q037.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":38,"q":"Based on Exhibit 1, as interest rates decrease significantly below the coupon rate, the bond most likely to experience a shortening of its effective duration is:","opts":["Bond 1.","Bond 2.","Bond 3."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a038.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a038.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 7 · Câu 37–42 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Jethro Timkin is a portfolio manager at a fixed-income asset management firm. Timkin wants to evaluate the investment characteristics of three new bonds being issued by Moontite Corporation on 31 January 20X4. Each bond has a maturity date of 31 January 20X7. Details of the bonds are shown in Exhibit 1.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex018.webp\" style=\"max-width:min(100%,585px)\" alt=\"Exhibit\"><p>To better understand the risk and relative value of the callable bond, Timkin seeks to determine Bond 2&#x27;s effective duration. The related information is shown in Exhibit 2.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex019.webp\" style=\"max-width:min(100%,537px)\" alt=\"Exhibit\"><p>Timkin also performs an option-adjusted spread analysis of Bond 2 versus a similar bond from Beta Alpha Corporation (Bond 4). Selected information regarding the bonds is shown in Exhibit 3.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex020.webp\" style=\"max-width:min(100%,645px)\" alt=\"Exhibit\"><p>Timkin wants to evaluate the relative value of a previously issued callable Beta Alpha Corporation bond currently trading at 105% of par. The bond pays a 6% coupon rate and has three years until maturity. The bond is callable at 103% of par on either of two dates, exactly one year or two years prior to maturity, respectively. The binomial interest rate tree Timkin developed to value the bond is shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex021.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>Assume all the bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, as interest rates decrease significantly below the coupon rate, the bond most likely to experience a shortening of its effective duration is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q038.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":39,"q":"Based on Exh Beta Alpha Corporation bond currently trading at 105% of par. The bond pays a 6% coupon rate and has three years until maturity. The bond is callable at 103% of par on either of two dates, exactly one year or two years prior to maturity, respectively. The binomial interest rate tree Timkin developed to value the bond is shown in Exhibit 4.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex021.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>Assume all the bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 3 and 4, the analyst should most appropriately conclude that the callable bond IS:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q042.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":43,"q":"Based on Exhibits 1 and 2, arbitrage profits on Bond A most likely:","opts":["can be earned by stripping the cash flows and selling each as a zero-coupon bond.","can be earned by selling a reconstituted Bond A by combining 1-, 2-, 3-, and 4-year zeros.","cannot be earned by either stripping the bond or reconstituting it from zero-coupon bonds."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a043.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a043.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–46 · Fixed Income<\/summary><div class=\"vig-body\"><p>Sophie Ortega is a fixed-income portfolio manager for a hedge fund, where Manuelo Ruiz also works as an analyst. Ortega asks Ruiz to evaluate the potential for earning arbitrage profits by stripping or reconstituting off-the-run government coupon bonds. Exhibit 1 contains selected data for three off-the-run government securities:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex022.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on zero-coupon government bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex023.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit\"><p>Ortega and Ruiz discuss creating a binomial interest rate tree to evaluate the bonds. During the discussion, Ruiz makes the following statements regarding the construction of a binomial tree using a lognormal interest rate model.<\/p><p><b>Statement 1:<\/b> The time steps on a binomial tree must match the number and frequency of cash flows to the maturity of the bond being valued.<\/p><p><b>Statement 2:<\/b> The average of the 1-period forward rates on the tree at a given time step is approximately equal to the 1-period forward rate derived from the spot rate curve.<\/p><p><b>Statement 3:<\/b> The adjacent 1-period forward rates at a given time step beyond Time 0 differ by one standard deviation, based on the volatility used in constructing the tree.<\/p><p>An increase in the central bank&#x27;s policy rate results in a bearish flattening of the government spot rate curve. Ortega asks Ruiz to develop a binomial interest rate tree for valuing government bonds in the new interest rate environment. Exhibit 3 contains the binomial rate tree created by Ruiz. The tree is accurately calibrated to the current government par bond curve based on 12%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex024.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>volatility:<\/p><p>Ortega has Ruiz perform a binomial valuation of Bond C (from Exhibit 1) using the 12% volatility tree. The binomial tree value is slightly lower than the current market price of the bond. Ortega asks Ruiz to estimate Bond C&#x27;s value using the current government spot rate curve.<\/p><p>Assume all bonds pay coupons once per annum and all interest rates are expressed as annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, arbitrage profits on Bond A most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q043.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":44,"q":"Which of Ruiz's statements regarding binomial interest rate tree construction are correct?","opts":["Only Statement 1 and Statement 2","Only Statement 1 and Statement 3","Only Statement 2 and Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a044.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a044.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–46 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sophie Ortega is a fixed-income portfolio manager for a hedge fund, where Manuelo Ruiz also works as an analyst. Ortega asks Ruiz to evaluate the potential for earning arbitrage profits by stripping or reconstituting off-the-run government coupon bonds. Exhibit 1 contains selected data for three off-the-run government securities:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex022.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on zero-coupon government bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex023.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit\"><p>Ortega and Ruiz discuss creating a binomial interest rate tree to evaluate the bonds. During the discussion, Ruiz makes the following statements regarding the construction of a binomial tree using a lognormal interest rate model.<\/p><p><b>Statement 1:<\/b> The time steps on a binomial tree must match the number and frequency of cash flows to the maturity of the bond being valued.<\/p><p><b>Statement 2:<\/b> The average of the 1-period forward rates on the tree at a given time step is approximately equal to the 1-period forward rate derived from the spot rate curve.<\/p><p><b>Statement 3:<\/b> The adjacent 1-period forward rates at a given time step beyond Time 0 differ by one standard deviation, based on the volatility used in constructing the tree.<\/p><p>An increase in the central bank&#x27;s policy rate results in a bearish flattening of the government spot rate curve. Ortega asks Ruiz to develop a binomial interest rate tree for valuing government bonds in the new interest rate environment. Exhibit 3 contains the binomial rate tree created by Ruiz. The tree is accurately calibrated to the current government par bond curve based on 12%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex024.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>volatility:<\/p><p>Ortega has Ruiz perform a binomial valuation of Bond C (from Exhibit 1) using the 12% volatility tree. The binomial tree value is slightly lower than the current market price of the bond. Ortega asks Ruiz to estimate Bond C&#x27;s value using the current government spot rate curve.<\/p><p>Assume all bonds pay coupons once per annum and all interest rates are expressed as annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Ruiz&#x27;s statements regarding binomial interest rate tree construction are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q044.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":45,"q":"Based on Exhibits 1 and 3, the no-arbitrage value of Bond B is closest to:","opts":["98.607","99.859","101.607"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a045.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a045.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–46 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sophie Ortega is a fixed-income portfolio manager for a hedge fund, where Manuelo Ruiz also works as an analyst. Ortega asks Ruiz to evaluate the potential for earning arbitrage profits by stripping or reconstituting off-the-run government coupon bonds. Exhibit 1 contains selected data for three off-the-run government securities:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex022.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on zero-coupon government bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex023.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit\"><p>Ortega and Ruiz discuss creating a binomial interest rate tree to evaluate the bonds. During the discussion, Ruiz makes the following statements regarding the construction of a binomial tree using a lognormal interest rate model.<\/p><p><b>Statement 1:<\/b> The time steps on a binomial tree must match the number and frequency of cash flows to the maturity of the bond being valued.<\/p><p><b>Statement 2:<\/b> The average of the 1-period forward rates on the tree at a given time step is approximately equal to the 1-period forward rate derived from the spot rate curve.<\/p><p><b>Statement 3:<\/b> The adjacent 1-period forward rates at a given time step beyond Time 0 differ by one standard deviation, based on the volatility used in constructing the tree.<\/p><p>An increase in the central bank&#x27;s policy rate results in a bearish flattening of the government spot rate curve. Ortega asks Ruiz to develop a binomial interest rate tree for valuing government bonds in the new interest rate environment. Exhibit 3 contains the binomial rate tree created by Ruiz. The tree is accurately calibrated to the current government par bond curve based on 12%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex024.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>volatility:<\/p><p>Ortega has Ruiz perform a binomial valuation of Bond C (from Exhibit 1) using the 12% volatility tree. The binomial tree value is slightly lower than the current market price of the bond. Ortega asks Ruiz to estimate Bond C&#x27;s value using the current government spot rate curve.<\/p><p>Assume all bonds pay coupons once per annum and all interest rates are expressed as annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 3, the no-arbitrage value of Bond B is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q045.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":46,"q":"Ruiz's spot rate curve valuation of Bond C will most likely be:","opts":["equal to the binomial tree valuation since the tree was calibrated to the par bond curve.","equal to the market price since the spot rate curve is not affected by the volatility assumption.","greater than the binomial valuation since the spot rates are less than the forward rates in the tree."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a046.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a046.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 8 · Câu 43–46 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Sophie Ortega is a fixed-income portfolio manager for a hedge fund, where Manuelo Ruiz also works as an analyst. Ortega asks Ruiz to evaluate the potential for earning arbitrage profits by stripping or reconstituting off-the-run government coupon bonds. Exhibit 1 contains selected data for three off-the-run government securities:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex022.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>Exhibit 2 contains information on zero-coupon government bonds:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex023.webp\" style=\"max-width:min(100%,346px)\" alt=\"Exhibit\"><p>Ortega and Ruiz discuss creating a binomial interest rate tree to evaluate the bonds. During the discussion, Ruiz makes the following statements regarding the construction of a binomial tree using a lognormal interest rate model.<\/p><p><b>Statement 1:<\/b> The time steps on a binomial tree must match the number and frequency of cash flows to the maturity of the bond being valued.<\/p><p><b>Statement 2:<\/b> The average of the 1-period forward rates on the tree at a given time step is approximately equal to the 1-period forward rate derived from the spot rate curve.<\/p><p><b>Statement 3:<\/b> The adjacent 1-period forward rates at a given time step beyond Time 0 differ by one standard deviation, based on the volatility used in constructing the tree.<\/p><p>An increase in the central bank&#x27;s policy rate results in a bearish flattening of the government spot rate curve. Ortega asks Ruiz to develop a binomial interest rate tree for valuing government bonds in the new interest rate environment. Exhibit 3 contains the binomial rate tree created by Ruiz. The tree is accurately calibrated to the current government par bond curve based on 12%<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex024.webp\" style=\"max-width:min(100%,481px)\" alt=\"Exhibit\"><p>volatility:<\/p><p>Ortega has Ruiz perform a binomial valuation of Bond C (from Exhibit 1) using the 12% volatility tree. The binomial tree value is slightly lower than the current market price of the bond. Ortega asks Ruiz to estimate Bond C&#x27;s value using the current government spot rate curve.<\/p><p>Assume all bonds pay coupons once per annum and all interest rates are expressed as annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Ruiz&#x27;s spot rate curve valuation of Bond C will most likely be:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q046.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":47,"q":"Based on Exhibit 1, if Bond is now priced at 99, the risk-neutral probability of default by maturity is closest to:","opts":["0.88%","1.82%","2.69%"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a047.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a047.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 47–52 · Fixed Income<\/summary><div class=\"vig-body\"><p>Pella Aswami and Gurt Pachen manage fixed-income portfolios for an international bank. They are assessing the values of several securities held in a multicurrency corporate bond portfolio. Exhibit 1 contains information about Bonds I, II, III, and IV.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex025.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Aswami asks Pachen to perform in-depth analyses of the bonds. Pachen discovers that the eurozone benchmark yield curve is flat at a risk-free rate of 2.50% and gathers information on par bond rates (contained in Exhibit 2) to construct a GBP benchmark yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex026.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>Exhibit 3 contains information generated by Pachen to estimate Bond III&#x27;s fair value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex027.webp\" style=\"max-width:min(100%,604px)\" alt=\"Exhibit\"><p>After reviewing a similar analysis of Bond IV, Pachen concludes that the appropriate credit valuation adjustment for that bond is 3.2289.<\/p><p>Aswami asks Pachen to gather information about the yield spreads of the bonds being evaluated by calculating the yield spreads using the swap curve rather than the government bond yield curve. Pachen objects, identifying two reasons why government bonds are preferable to swap rates for calculating yield spreads.<\/p><p><b>Reason 1:<\/b> The liquidity of government bonds is more uniform across maturities, compared with various maturity swaps.<\/p><p><b>Reason 2:<\/b> For any given corporate bond, the likelihood is greater of finding a government bond with a matching maturity.<\/p><p>After assessing Pachen&#x27;s research on Bond III, Aswami comments that the yield curve constructed from the company&#x27;s senior unsecured bonds is less steeply sloped than the GBP benchmark government bond curve.<\/p><p>Assume that all bonds pay coupons once annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, if Bond is now priced at 99, the risk-neutral probability of default by maturity is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q047.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":48,"q":"Based on Exhibit 1, if Bond II defaults 2 years in the future, the loss from the default is expected to be closest to:","opts":["42.5805","63.8707","65.0129"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a048.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a048.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 9 · Câu 47–52 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Pella Aswami and Gurt Pachen manage fixed-income portfolios for an international bank. They are assessing the values of several securities held in a multicurrency corporate bond portfolio. Exhibit 1 contains information about Bonds I, II, III, and IV.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex025.webp\" style=\"max-width:min(100%,549px)\" alt=\"Exhibit\"><p>Aswami asks Pachen to perform in-depth analyses of the bonds. Pachen discovers that the eurozone benchmark yield curve is flat at a risk-free rate of 2.50% and gathers information on par bond rates (contained in Exhibit 2) to construct a GBP benchmark yield curve.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex026.webp\" style=\"max-width:min(100%,437px)\" alt=\"Exhibit\"><p>Exhibit 3 contains information generated by Pachen to estimate Bond III&#x27;s fair value.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex027.webp\" style=\"max-width:min(100%,604px)\" alt=\"Exhibit\"><p>After reviewing a similar analysis of Bond IV, Pachen concludes that the appropriate credit valuation adjustment for that bond is 3.2289.<\/p><p>Aswami asks Pachen to gather information about the yield spreads of the bonds being evaluated by calculating the yield spreads using the swap curve rather than the government bond yield curve. Pachen objects, identifying two reasons why government bonds are preferable to swap rates for calculating yield spreads.<\/p><p><b>Reason 1:<\/b> The liquidity of government bonds is more uniform across maturities, compared with various maturity swaps.<\/p><p><b>Reason 2:<\/b> For any given corporate bond, the likelihood is greater of finding a government bond with a matching maturity.<\/p><p>After assessing Pachen&#x27;s research on Bond III, Aswami comments that the yield curve constructed from the company&#x27;s senior unsecured bonds is less steeply sloped than the GBP benchmark government bond curve.<\/p><p>Assume that all bonds pa nd will be 65%.<\/p><p>Okada then collects information on a CDS for which Sensei is a credit protection seller. Okada updates the gain or loss for Sensei if it unwinds the position, based on the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex028.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Okada is discussing company risk expectations with Chiyo Hirano, an analyst at Sensei. Hirano provides Okada with her expectations for several companies that are all peers in the life insurance industry, presented in Exhibit 2. Okada uses these expectations to create long-short trades.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex029.webp\" style=\"max-width:min(100%,571px)\" alt=\"Exhibit\"><p>Hirano mentions that she has noticed some mispricing between the bond market and CDS market, allowing for basis trades. She states that these mispricings do not last long and suggests taking advantage of a likely convergence. Hirano provides Okada data on Tokyo Industries, one company with a mispricing:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex030.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>The type of credit event triggered by Crane is best described as a:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q053.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":54,"q":"If Okada's estimates are correct, the payout (in · billions) that Sensei would receive for Crane's credit event is closest to:","opts":["3.5","5.0","6.5"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a054.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a054.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case s also a credit protection buyer of ¥10 billion in notional value of CDS on Crane. Crane just announced that due to financial difficulties, future interest and principal payments on its 10-year bonds will be reduced by 50%. The company has not made any other announcements or changes. Based on this credit event, an auction has determined that the ultimate recovery rate for the bond will be 65%.<\/p><p>Okada then collects information on a CDS for which Sensei is a credit protection seller. Okada updates the gain or loss for Sensei if it unwinds the position, based on the information in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex028.webp\" style=\"max-width:min(100%,350px)\" alt=\"Exhibit\"><p>Okada is discussing company risk expectations with Chiyo Hirano, an analyst at Sensei. Hirano provides Okada with her expectations for several companies that are all peers in the life insurance industry, presented in Exhibit 2. Okada uses these expectations to create long-short trades.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex029.webp\" style=\"max-width:min(100%,571px)\" alt=\"Exhibit\"><p>Hirano mentions that she has noticed some mispricing between the bond market and CDS market, allowing for basis trades. She states that these mispricings do not last long and suggests taking advantage of a likely convergence. Hirano provides Okada data on Tokyo Industries, one company with a mispricing:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex030.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, to fulfill the basis trade, Okada should most appropriately:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q058.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":59,"q":"Which of the three approaches for the arbitrage-free valuation of option-free bonds described by Muon is least likely correct?","opts":["Approach 1","Approach 2","Approach 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a059.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a059.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Fixed Income<\/summary><div class=\"vig-body\"><p>Macon Quark manages a proprietary trading desk at a multinational financial institution. Quark directs Jemma Muon, CFA, an analyst at the firm, to evaluate the US market for profitable trading opportunities. Muon collects the US par bond rates shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex031.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>During a discussion of bond valuation in the current market environment, Muon describes the following approaches to the arbitrage-free valuation of a coupon bond:<\/p><p><b>Approach 1:<\/b> Value the bond as a portfolio of zero-coupon bonds that replicate the bond&#x27;s cash flows.<\/p><p><b>Approach 2:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the spot rate with a matching term.<\/p><p><b>Approach 3:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the YTM of a benchmark bond with the same time to maturity as the bond.<\/p><p>After the discussion, Muon is directed to evaluate several 3-year bonds, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex032.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Quark had begun developing binomial interest rate trees for both the Swiss and eurozone fixed-income markets, based on equal probabilities of rates being higher or lower in future periods. Quark instructs Muon to complete these interest rate trees (Exhibits 3 and 4):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex033.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex034.webp\" style=\"max-width:min(100%,503px)\" alt=\"Exhibit\"><p>Once the trees are completed, Quark uses the eurozone binomial tree to calculate the arbitrage-free value of a 3-year, 6% coupon, option-free bond. Afterward, Quark and Muon discuss the implications of using different volatility assumptions and the pathwise valuation of bonds using the binomial interest rate trees.<\/p><p>Assume that all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of the three approaches for the arbitrage-free valuation of option-free bonds described by Muon is least likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q059.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":60,"q":"Based on Exhibits 1 and 2, which bond has a market price that best reflects its arbitrage-free price?","opts":["Bond A","Bond B","Bond C"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a060.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a060.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Macon Quark manages a proprietary trading desk at a multinational financial institution. Quark directs Jemma Muon, CFA, an analyst at the firm, to evaluate the US market for profitable trading opportunities. Muon collects the US par bond rates shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex03  reflects its arbitrage-free price?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q060.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":61,"q":"Based on Exhibit 3, if Muon assumes a volatility of 20%, the interest rate at the higher-rate node at Time 1 is closest to:","opts":["1.40%","1.72%","3.13%"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a061.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a061.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Macon Quark manages a proprietary trading desk at a multinational financial institution. Quark directs Jemma Muon, CFA, an analyst at the firm, to evaluate the US market for profitable trading opportunities. Muon collects the US par bond rates shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex031.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>During a discussion of bond valuation in the current market environment, Muon describes the following approaches to the arbitrage-free valuation of a coupon bond:<\/p><p><b>Approach 1:<\/b> Value the bond as a portfolio of zero-coupon bonds that replicate the bond&#x27;s cash flows.<\/p><p><b>Approach 2:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the spot rate with a matching term.<\/p><p><b>Approach 3:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the YTM of a benchmark bond with the same time to maturity as the bond.<\/p><p>After the discussion, Muon is directed to evaluate several 3-year bonds, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex032.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Quark had begun developing binomial interest rate trees for both the Swiss and eurozone fixed-income markets, based on equal probabilities of rates being higher or lower in future periods. Quark instructs Muon to complete these interest rate trees (Exhibits 3 and 4):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex033.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex034.webp\" style=\"max-width:min(100%,503px)\" alt=\"Exhibit\"><p>Once the trees are completed, Quark uses the eurozone binomial tree to calculate the arbitrage-free value of a 3-year, 6% coupon, option-free bond. Afterward, Quark and Muon discuss the implications of using different volatility assumptions and the pathwise valuation of bonds using the binomial interest rate trees.<\/p><p>Assume that all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 3, if Muon assumes a volatility of 20%, the interest rate at the higher-rate node at Time 1 is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q061.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":62,"q":"Based on Exhibit 4, the arbitrage-free value of a 3-year, 6% coupon bond with no embedded options is closest to:","opts":["104.255","107.012","107.066"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a062.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a062.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Fixed Income<span class=\"vig-hint\">bấm để xem , Quark and Muon discuss the implications of using different volatility assumptions and the pathwise valuation of bonds using the binomial interest rate trees.<\/p><p>Assume that all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 4, the arbitrage-free value of a 3-year, 6% coupon bond with no embedded options is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q062.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":63,"q":"The binomial interest rate tree in Exhibit 4 was constructed using 12% volatility. Assuming the same benchmark yield curve, if the binomial tree is recalibrated using 20% volatility, the arbitrage-free value of the 3-year, 6% coupon bond is most likely:","opts":["smaller.","the same.","greater."],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a063.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a063.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 11 · Câu 59–64 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Macon Quark manages a proprietary trading desk at a multinational financial institution. Quark directs Jemma Muon, CFA, an analyst at the firm, to evaluate the US market for profitable trading opportunities. Muon collects the US par bond rates shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex031.webp\" style=\"max-width:min(100%,374px)\" alt=\"Exhibit\"><p>During a discussion of bond valuation in the current market environment, Muon describes the following approaches to the arbitrage-free valuation of a coupon bond:<\/p><p><b>Approach 1:<\/b> Value the bond as a portfolio of zero-coupon bonds that replicate the bond&#x27;s cash flows.<\/p><p><b>Approach 2:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the spot rate with a matching term.<\/p><p><b>Approach 3:<\/b> Value the bond as the sum of the individual cash flows&#x27; present values, discounting each cash flow by the YTM of a benchmark bond with the same time to maturity as the bond.<\/p><p>After the discussion, Muon is directed to evaluate several 3-year bonds, shown in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex032.webp\" style=\"max-width:min(100%,450px)\" alt=\"Exhibit\"><p>Quark had begun developing binomial interest rate trees for both the Swiss and eurozone fixed-income markets, based on equal probabilities of rates being higher or lower in future periods. Quark instructs Muon to complete these interest rate trees (Exhibits 3 and 4):<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex033.webp\" style=\"max-width:min(100%,478px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex034.webp\" style=\"max-width:min(100%,503px)\" alt=\"Exhibit\"><p>Once the trees are completed, Quark uses the eurozone binomial tree to calculate the arbitrage-free value of a 3-year, 6% coupon, option-free bond. Afterward, Quark and Muon discuss the implications of using different volatility assumptions and the pathwise valuation of bonds using the binomial interest rate trees.<\/p><p>Assume that all bonds pay coupons annually and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>The binomial interest rate tree in Exhibit 4 was constructed using 12% volatility. Assuming the same benchmark yield curve, if the binomial tree is recalibrated using 20% volatility, the arbitrage-free value of the 3-year, 6% coupon bond is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l  the next several years. He directs Yang to analyze the return on Bond B if it is held to maturity based on this expectation.<\/p><p>Assume the coupon bonds and swaps in this scenario are annual-pay instruments and that all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 2, the 3-year swap rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q068.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":69,"q":"Which of Wang's statements are correct?","opts":["Statement 1 and Statement 2","Statement 2 and Statement 3","Statement 1 and Statement 3"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a069.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a069.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Fixed Income<\/summary><div class=\"vig-body\"><p>Ling Wang, a portfolio manager at Universal Bond Management, is training Ishi Devi, a recently hired junior analyst. Wang begins by testing Devi&#x27;s knowledge of arbitrage-free valuation concepts for fixed income securities by making the following statements:<\/p><p>Ignoring transaction costs, the arbitrage-free valuation approach assumes:<\/p><p><b>Statement 1:<\/b> Arbitrage profits are possible when value additivity does not hold<\/p><p><b>Statement 2:<\/b> Market participants can earn an arbitrage profit through stripping and reconstitution<\/p><p><b>Statement 3:<\/b> A financial asset with a risk-free payoff in the future must have a positive price today<\/p><p>Wang then provides Devi with the par and spot rates, shown in Exhibit 1, that are used to build the interest rate trees in Exhibits 2 and 3. Wang states that both binomial trees have been calibrated and to assume that all bonds pay coupons annually and all interest rates are annual compound rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex037.webp\" style=\"max-width:min(100%,342px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex038.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex039.webp\" style=\"max-width:min(100%,464px)\" alt=\"Exhibit\"><p>Devi asks about the types of term structure models. Wang replies:<\/p><p><b>Reply 1:<\/b> Arbitrage-free models are parameterized to match current market prices<\/p><p><b>Reply 2:<\/b> Equilibrium models use fundamental economic variables to forecast many possible interest rate paths. This often results in a term structure that is inconsistent with current market data<\/p><p><b>Reply 3:<\/b> Equilibrium models such as the Cox-Ingersoll-Ross (CIR) and Vasicek models are multifactor models that incorporate short-term, intermediate, and long-term rates<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Wang&#x27;s statements are correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q069.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":70,"q":"Based on Exhibits 1 and 2, the arbitrage-free price of the 3-year, 6% coupon bond is closest to:","opts":["102.7232","102.7566","102.9316"],"ans":"B","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a070.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a070.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 13 · Câu 69–74 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Ling Wang, a portfolio manager at Universal Bond Management, is training Ishi Devi, a es:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex042.webp\" style=\"max-width:min(100%,675px)\" alt=\"Exhibit\"><p>Assume all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 3, as of 15 May 20X8, the convertible bond&#x27;s market conversion premium per share (in €) is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q080.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":81,"q":"Which of Serrano's statements) regarding sinking fund bonds is (are) correct?","opts":["Statement 1 only","Statement 2 only","Both Statement 1 and Statement 2"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a081.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a081.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 15 · Câu 81–86 · Fixed Income<\/summary><div class=\"vig-body\"><p>Pablo Serrano is an analyst supporting Jana Lanka, a bond portfolio manager at a global investment company. Lanka asks Serrano to assess the value of a sinking fund bond (sinker) held in the portfolio. The sinker has call, acceleration, and delivery option provisions. Lanka wants a summary of the effect the embedded options have on the bond&#x27;s value. Serrano makes the following statements:<\/p><p><b>Statement 1:<\/b> The issuer is long both the call and acceleration options since they give the issuer a right to retire bonds more rapidly than reflected in the sinking fund schedule.<\/p><p><b>Statement 2:<\/b> Investors are long the delivery option since this feature tends to result in sinking fund bonds trading at higher values than similar bonds without a sinking fund provision.<\/p><p>Another holding, Quad Incorporated&#x27;s convertible bonds, were purchased at issuance and are still held in the portfolio managed by Lanka. Selected data on the bonds is shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex043.webp\" style=\"max-width:min(100%,558px)\" alt=\"Exhibit\"><p>Lanka directs Serrano to assess the value of another portfolio holding, Terapolis Corporation&#x27;s convertible bonds. Terapolis is a money-losing smartphone manufacturer. However, investors believe that Terapolis&#x27;s portfolio of technology patents makes it a potential takeover target. During the morning of Aug 15 20X3, Serrano gathers information to evaluate the bond, which is contained in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex044.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>Later that day, the stock price increases to £45 per share based on rumors of a takeover bid. At the same time, Terapolis&#x27;s straight debt yields increase to 8.50% due to rising risk-free rates and widening credit spreads.<\/p><p>Assume all bonds pay coupons once per year and all interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Serrano&#x27;s statements) regarding sinking fund bonds is (are) correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q081.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":82,"q":"Based on Exhibit 1, the embedded call giving Quad Incorporated the right to retire the bonds prior to maturity is best described as an:","opts":["American-style option.","European-style option.","Bermudan-style option."],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a082.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a082.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vign t of default on the client&#x27;s bond holdings and directs Silviano Pastor, the junior analyst assisting her, to estimate the exposure related to several of the bonds. Although none of the bonds seems likely to default soon, Bearing is concerned about the impact of rating downgrades and whether the bonds&#x27; credit risks are priced accurately. Pastor collects information to conduct the credit analysis. Exhibit 2 contains a partial credit rating transition matrix:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex056.webp\" style=\"max-width:min(100%,642px)\" alt=\"Exhibit\"><p>Exhibit 3 provides information on government par bonds for constructing a benchmark yield curve:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex057.webp\" style=\"max-width:min(100%,477px)\" alt=\"Exhibit\"><p>Bearing and Pastor discuss various approaches to calculating yield spreads for Bond III. Pastor notes that there are no on-the-run government bonds with the same maturity as Bond III. They discuss the trade-offs between two options: using an off-the-run government bond with a 4-year maturity, which results in a smaller spread, or interpolating a 4-year rate from on-the-run 3-year and 5-year government bonds.<\/p><p>Bearing decides to evaluate several structured debt securities that may be added to client portfolios. Bearing and Pastor discuss how to assess the credit enhancement used in different types of asset-backed securities (ABS). Bearing directs Pastor to identify automotive and credit card ABS that have larger-than-average excess spreads.<\/p><p>Assume all corporate and government bonds pay coupons once annually and that all the bonds&#x27; interest rates are annual compound rates.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, when comparing Bond I and Bond II, the expected exposure to default loss in 1 year is most likely:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw he discount factor for valuing a 3-year zero-coupon bond is closest to:","opts":["0.8890","0.9125","0.9130"],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a105.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a105.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 105–108 · Fixed Income<\/summary><div class=\"vig-body\"><p>Darla Esquallo is a fixed-income analyst for an asset management company that specializes in managing government employee pension funds. Carlos Fiero is a retirement plan administrator for one of the company&#x27;s clients. Fiero contacts Esquallo regarding the valuation of securities held in one of the plan&#x27;s portfolios. Exhibit 1 contains selected data on government par bond yields and spot rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex058.webp\" style=\"max-width:min(100%,442px)\" alt=\"Exhibit\"><p>Fiero has only recently been given responsibility for supporting the plan&#x27;s fixed-income investments, after having spent most of his career supporting equity portfolios. He asks Esquallo several questions regarding the relationship between spot rates, forward rates, and YTM. Esquallo describes spot rates and forward rates and explains how spot rates can be bootstrapped from par bond yields. To explain YTM to Fiero, Esquallo makes the following statements:<\/p><p><b>Statement 1:<\/b> YTM is the realized rate of return on bonds held to maturity, so long as the issuer does not default.<\/p><p><b>Statement 2:<\/b> YTM is the weighted average of spot rates over the time until the bond&#x27;s maturity.<\/p><p><b>Statement 3:<\/b> YTM is the single periodic discount rate that results in the PV of the bond&#x27;s coupon and principal being equal to the dirty price of the bond.<\/p><\/div><\/details><div class=\"qtext he issuer does not default.<\/p><p><b>Statement 2:<\/b> YTM is the weighted average of spot rates over the time until the bond&#x27;s maturity.<\/p><p><b>Statement 3:<\/b> YTM is the single periodic discount rate that results in the PV of the bond&#x27;s coupon and principal being equal to the dirty price of the bond.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the 1-year forward rate one year in the future is:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q106.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":107,"q":"Based on Exhibit 1, the 4-year spot rate is closest to:","opts":["2.78%","2.82%","2.85%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a107.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a107.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 105–108 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darla Esquallo is a fixed-income analyst for an asset management company that specializes in managing government employee pension funds. Carlos Fiero is a retirement plan administrator for one of the company&#x27;s clients. Fiero contacts Esquallo regarding the valuation of securities held in one of the plan&#x27;s portfolios. Exhibit 1 contains selected data on government par bond yields and spot rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex058.webp\" style=\"max-width:min(100%,442px)\" alt=\"Exhibit\"><p>Fiero has only recently been given responsibility for supporting the plan&#x27;s fixed-income investments, after having spent most of his career supporting equity portfolios. He asks Esquallo several questions regarding the relationship between spot rates, forward rates, and YTM. Esquallo describes spot rates and forward rates and explains how spot rates can be bootstrapped from par bond yields. To explain YTM to Fiero, Esquallo makes the following statements:<\/p><p><b>Statement 1:<\/b> YTM is the realized rate of return on bonds held to maturity, so long as the issuer does not default.<\/p><p><b>Statement 2:<\/b> YTM is the weighted average of spot rates over the time until the bond&#x27;s maturity.<\/p><p><b>Statement 3:<\/b> YTM is the single periodic discount rate that results in the PV of the bond&#x27;s coupon and principal being equal to the dirty price of the bond.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, the 4-year spot rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q107.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":108,"q":"Which of Esquallo's statements concerning YTM is least likely correct?","opts":["Statement 1","Statement 2","Statement 3"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a108.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a108.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 19 · Câu 105–108 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Darla Esquallo is a fixed-income analyst for an asset management company that specializes in managing government employee pension funds. Carlos Fiero is a retirement plan administrator for one of the company&#x27;s clients. Fiero contacts Esquallo regarding the valuation of securities held in one of the plan&#x27;s portfolios. Exhibit 1 contains selected data on government par bond yields and spot rates:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex058.webp\" style=\"max-width:min(100%,442px)\" alt=\"Exhibit\"><p>Fiero has only recently been given responsibility for supporting the plan&#x27;s fixed-income investments, after having spent most of his career supporting equity portfolios. He asks Esquallo several questions regarding the relationship between spot rates, forward rates, and YTM. Esquallo describes spot rates and forward rates and explains how spot rates can be bootstrapped from par bond yields. To explain YTM to Fiero, Esquallo makes the following statements:<\/p><p><b>Statement 1:<\/b> YTM is the realized rate of return on bonds held to maturity, so long as the issuer does not default.<\/p><p><b>Statement 2:<\/b> YTM is the weighted average of spot rates over the time until the bond&#x27;s maturity.<\/p><p><b>Statement 3:<\/b> YTM is the single periodic discount rate that results in the PV of the bond&#x27;s coupon and principal being equal to the dirty price of the bond.<\/p><\/div><\/details><div class=\"qtext\"><p>Which of Esquallo&#x27;s statements concerning YTM is least likely correct?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q108.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":109,"q":"Which theory of the term structure of interest rates best explains Green's portfolio repositioning?","opts":["Preferred habitat theory","Pure expectations theory","Liquidity preference theory"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a109.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a109.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 109–114 · Fixed Income<\/summary><div class=\"vig-body\"><p>Eleanor Green is a portfolio manager at Guadalupe Credit Group and oversees the actively managed Seguin Bond Fund. Nena Chowdhury is an analyst who assists Green in managing the fund. The two are discussing the domestic economic outlook and the potential implications for the portfolio.<\/p><p>The economy is currently in a mild but prolonged recession. After initially lowering interest rates to very low levels at the onset of the recession, the country&#x27;s central bank instituted a quantitative easing (QE) policy of selling short-term bills to purchase long-term bonds (20–30 years) in an attempt to further stimulate the economy. As a result of this policy, the very long end of the yield curve is now inverted since the 30-year maturity is now yielding less than the 15-year maturity. In response to this development, Green has sold the fund&#x27;s positions in 20- to 30-year bonds and has repositioned the proceeds into the 15-year maturity segment.<\/p><p>Green states that based on the current macro environment, she believes inflation and GDP growth are poised to accelerate, which will increase the bond risk premium for long-term bonds and negatively impact the portfolio since it is currently comprised. Chowdhury disagrees, stating that inflation and GDP growth impact short-term rates more than long-term rates.<\/p><p>The portfolio is currently positioned in investment-grade securities as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex059.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>The two then continue to discuss this situation:<\/p><p>Green: &quot;My base forecast is for a rapid economic recovery over the next year, and I anticipate an end to the central bank&#x27;s QE policy in the coming months.&quot;<\/p><p>Chowdhury: &quot;I question these assumptions. It is more likely that the recession will continue and the QE policy will be maintained.&quot;<\/p><p>Green: &quot;I am concerned that the portfolio is not appropriately positioned for a continuation of the recession and the associated QE policy.&quot;<\/p><p>Green then asks Chowdhury to construct a multi-factor yield curve model to assess the fund&#x27;s sensitivity to different macro scenarios. The model is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex060.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Which theory of the term structure of interest rates best explains Green&#x27;s portfolio repositioning?<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q109.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":110,"q":"Of the primary yield curve factors, the central bank's policy of selling short-term bills and buying long-term bonds has the greatest impact on:","opts":["level.","slope.","curvature."],"ans":"C","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a110.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a110.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 109–114 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eleanor Green is a portfolio manager at Guadalupe Credit Group and oversees the actively managed Seguin Bond Fund. Nena Chowdhury is an analyst who assists Green in managing the fund. The two are discussing the domestic economic outlook and the potential implications for the portfolio.<\/p><p>The economy is currently in a mild but prolonged recession. After initially lowering interest rates to very low levels at the onset of the recession, the country&#x27;s central bank instituted a quantitative easing (QE) policy of selling short-term bills to purchase long-term bonds (20–30 years) in an attempt to further stimulate the economy. As a result of this policy, the very long end of the yield curve is now inverted since the 30-year maturity is now yieldi nomic outlook and the potential implications for the portfolio.<\/p><p>The economy is currently in a mild but prolonged recession. After initially lowering interest rates to very low levels at the onset of the recession, the country&#x27;s central bank instituted a quantitative easing (QE) policy of selling short-term bills to purchase long-term bonds (20–30 years) in an attempt to further stimulate the economy. As a result of this policy, the very long end of the yield curve is now inverted since the 30-year maturity is now yielding less than the 15-year maturity. In response to this development, Green has sold the fund&#x27;s positions in 20- to 30-year bonds and has repositioned the proceeds into the 15-year maturity segment.<\/p><p>Green states that based on the current macro environment, she believes inflation and GDP growth are poised to accelerate, which will increase the bond risk premium for long-term bonds and negatively impact the portfolio since it is currently comprised. Chowdhury disagrees, stating that inflation and GDP growth impact short-term rates more than long-term rates.<\/p><p>The portfolio is currently positioned in investment-grade securities as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex059.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>The two then continue to discuss this situation:<\/p><p>Green: &quot;My base forecast is for a rapid economic recovery over the next year, and I anticipate an end to the central bank&#x27;s QE policy in the coming months.&quot;<\/p><p>Chowdhury: &quot;I question these assumptions. It is more likely that the recession will continue and the QE policy will be maintained.&quot;<\/p><p>Green: &quot;I am concerned that the portfolio is not appropriately positioned for a continuation of the recession and the associated QE policy.&quot;<\/p><p>Green then asks Chowdhury to construct a multi-factor yield curve model to assess the fund&#x27;s sensitivity to different macro scenarios. The model is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex060.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Using Exhibit 1 and Chowdhury&#x27;s economic forecast, the most appropriate duration-neutral portfolio positioning results in:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q113.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":114,"q":"Based on Exhibits 1 and 2, if the central bank's policy actions result in a two standard deviation increase in the curvature factor, all else equal, the price return impact on the fund is closest to:","opts":["1.48%","1.57%","4.18%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a114.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a114.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\"><summary><span class=\"vig-tag\">Vignette<\/span>Case 20 · Câu 109–114 · Fixed Income<span class=\"vig-hint\">bấm để xem case<\/span><\/summary><div class=\"vig-body\"><p>Eleanor Green is a portfolio manager at Guadalupe Credit Group and oversees the actively managed Seguin Bond Fund. Nena Chowdhury is an analyst who assists Green in managing the fund. The two are discussing the domestic economic outlook and the potential implications for the portfolio.<\/p><p>The economy is currently in a mild but prolonged recession. After initially lowering interest rates to very low levels at the onset of the recession, the country&#x27;s central bank instituted a quantitative easing (QE) policy of selling short-term bills to purchase long-term bonds (20–30 years) in an attempt to further stimulate the economy. As a result of this policy, the very long end of the yield curve is now inverted since the 30-year maturity is now yielding less than the 15-year maturity. In response to this development, Green has sold the fund&#x27;s positions in 20- to 30-year bonds and has repositioned the proceeds into the 15-year maturity segment.<\/p><p>Green states that based on the current macro environment, she believes inflation and GDP growth are poised to accelerate, which will increase the bond risk premium for long-term bonds and negatively impact the portfolio since it is currently comprised. Chowdhury disagrees, stating that inflation and GDP growth impact short-term rates more than long-term rates.<\/p><p>The portfolio is currently positioned in investment-grade securities as follows:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex059.webp\" style=\"max-width:min(100%,511px)\" alt=\"Exhibit\"><p>The two then continue to discuss this situation:<\/p><p>Green: &quot;My base forecast is for a rapid economic recovery over the next year, and I anticipate an end to the central bank&#x27;s QE policy in the coming months.&quot;<\/p><p>Chowdhury: &quot;I question these assumptions. It is more likely that the recession will continue and the QE policy will be maintained.&quot;<\/p><p>Green: &quot;I am concerned that the portfolio is not appropriately positioned for a continuation of the recession and the associated QE policy.&quot;<\/p><p>Green then asks Chowdhury to construct a multi-factor yield curve model to assess the fund&#x27;s sensitivity to different macro scenarios. The model is presented in Exhibit 2:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex060.webp\" style=\"max-width:min(100%,466px)\" alt=\"Exhibit\"><\/div><\/details><div class=\"qtext\"><p>Based on Exhibits 1 and 2, if the central bank&#x27;s policy actions result in a two standard deviation increase in the curvature factor, all else equal, the price return impact on the fund is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q114.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":115,"q":"Based on Exhibit 1, if the 2-year Bund spot rate is 3.53%, the 3-year spot rate is closest to:","opts":["4.57% м","4.78%","6.53%"],"ans":"A","expl":"Lời giải chi tiết (ảnh gốc UWorld) bên dưới.","explhtml":"<a href=\"l2img/uw-fi/a115.webp\" target=\"_blank\" rel=\"noopener\" title=\"Mở ảnh lời giải cỡ lớn\"><img class=\"eimg\" loading=\"lazy\" src=\"l2img/uw-fi/a115.webp\" alt=\"Lời giải\"><\/a>","qhtml":"<details class=\"vig\" open><summary><span class=\"vig-tag\">Vignette<\/span>Case 21 · Câu 115–120 · Fixed Income<\/summary><div class=\"vig-body\"><p>Alpha Bond Investors (ABI) is a global fixed-income fund. Gemmy Marsico, CFA, is an ABI portfolio manager and Marget Redithy is an analyst who assists Marsico by performing valuation and risk analysis.<\/p><p>Marsico intends to increase her portfolio&#x27;s allocation to short-term German bunds. To evaluate relative values in the sector, Marsico directs Redithy to obtain the spot rates for short-dated Bunds. Annual compound par bond yields on Bunds are shown in Exhibit 1:<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex061.webp\" style=\"max-width:min(100%,539px)\" alt=\"Exhibit\"><p>Marsico asks Redithy for assistance in evaluating two strategies with 4-year investment horizons:<\/p><p><b>Strategy 1:<\/b> Buy a 4-year zero-coupon bond and hold it to maturity.<\/p><p><b>Strategy 2:<\/b> Buy a 1-year zero-coupon bond and simultaneously enter into a forward agreement to buy a 3-year zero-coupon bond 1 year in the future.<\/p><p>Exhibit 2 contains current information on annual compound zero-coupon bond (ie, spot) rates and forward rates.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex062.webp\" style=\"max-width:min(100%,522px)\" alt=\"Exhibit\"><p>While reviewing Redithy&#x27;s analysis of the two strategies, Marsico comments that their relative attractiveness depends on future interest rates. During the discussion, Redithy expresses the view that &quot;the term structure of interest rates is not determined by economy-wide availability and demand for credit. Instead, due to the constraints facing most issuers and investors, the shape and level of the yield curve is determined solely by the expected supply and demand for credit at each maturity.&quot;<\/p><p>Marsico wants to evaluate values in the eurozone corporate bond market and asks Redithy to gather information on the swap rate curve and swap spreads, which is shown in Exhibit 3. All rates are expressed on an annual compound basis.<\/p><img class=\"pimg\" loading=\"lazy\" src=\"l2img/uw-fi/ex063.webp\" style=\"max-width:min(100%,468px)\" alt=\"Exhibit\"><p>In the discussion with Marsico, Redithy identifies two advantages of using the swap curve for valuing corporate bonds rather than using the government bond yield curve of the issuer&#x27;s home country.<\/p><p><b>Advantage 1:<\/b> Yields on government bonds are sometimes distorted due to differences in liquidity that favor on-the-run versus off-the-run issues. However, swap rates are not subject to the same distortions due to generally uniform liquidity across maturities.<\/p><p><b>Advantage 2:<\/b> When analysts are valuing corporate bonds of a given maturity (eg, 10 years), a swap rate that reflects exactly 10 years to maturity is always available. Unfortunately, even if it is the government&#x27;s benchmark security, the quoted government 10-year bond will rarely have exactly 10 years to maturity.<\/p><p>Marsico asks Redithy if she has considered interest rate volatility in her analysis and what factor has the biggest impact on short-term interest rate volatility.<\/p><\/div><\/details><div class=\"qtext\"><p>Based on Exhibit 1, if the 2-year Bund spot rate is 3.53%, the 3-year spot rate is closest to:<\/p><\/div><details class=\"qorig\"><summary>Xem ảnh câu hỏi gốc<\/summary><img loading=\"lazy\" src=\"l2img/uw-fi/q115.webp\" alt=\"Câu hỏi gốc\"><\/details>","subj":"fixed"},{"n":116,"
