ompany, denominated in USD, and sold in the US.", "issued by a British company, denominated in GBP, and sold in the UK, Japan, and South America."], "ans": "B", "expl": "Regulatory and legal considerations affect where a bond is issued and to whom it is sold. A domestic bond is issued by a company that is\nincorporated within the country of issuance, denominated in that country's currency, and sold to investors within that country. This\nclassification applies even if the issuer is a subsidiary of a foreign company. An example is a US subsidiary of Toyota (a Japanese company)\nissuing USD bonds in the United States.\n(Choice A) A bond issued by a US company in Australia and denominated in EUR is considered a Eurobond.\n(Choice C) This is an example of a global bond, which is issued in the issuer's domestic country as well as in other countries.\nThings to remember:\nDomestic bonds represent the obligation of a domestic issuer, are denominated in the domestic currency, and are sold and traded in the domestic\nmarket. A domestic issuer can be a domestic subsidiary of a foreign company.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 34, "q": "A bond indenture specifies that the coupon rate will increase by 30 basis points (bps) every time the issuer receives a downgrade. This bond is most likely a:", "opts": ["floating rate note.", "step-up coupon bond.", "credit-linked coupon bond."], "ans": "C", "expl": "A credit-linked bond has coupon payments that change as the bond's or issuer's credit rating changes. In this question, the coupon rate\nincreases by 30 bps every time the issuer credit rating deteriorates. Investors may be concerned about an issuer's (borrower's) future\ncreditworthiness, so credit-linked coupons compensate for this risk.\n(Choice A) Changes to a floating rate note's coupons are driven by movements in the underlying reference interest rate (eg, LIBOR), not by\nchanges in the issuer's credit rating.\n(Choice B) Step-up coupon bonds have coupon rates that increase (ie, \"step up\") on preset dates specified in the bond indenture. For example,\na step-up bond indenture may specify an increase of 20 bps every six months. These increases happen regardless of changes to the issuer's\ncredit rating.\nThings to remember:\nA credit-linked bond has coupon payments that change as the issuer's credit rating changes. If investors are concerned about an issuer's\n(borrower's) future creditworthiness, credit-linked coupons may be used to compensate for this risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 35, "q": "A floating-rate bond that has regularly scheduled increases in coupon rates and helps mitigate the impact of inflation on investors is most appropriately classified as a(n):", "opts": ["inflation-linked bond.", "step-up coupon bond.", "deferred coupon bond."], "ans": "B", "expl": "A step-up coupon bond may have either fixed or a floating coupon. The main characteristic of a step-up coupon bond is that the coupon rate\nincreases by a predetermined rate at specified intervals. Step-up bonds are often callable by the issuer just before a scheduled increase in the\ncoupon rate.\n(Choice A) An inflation-linked bond offers investors protection against inflation, but changes in the coupon rate are tied to changes in inflation\nrather than being regularly scheduled. Also, since inflation can go up or down, the coupon rates of inflation-linked bonds can change in both\ndirections; the coupon rates of step-up bonds can only increase, never decrease.\n(Choice C) Unlike a step-up bond, a bond with a deferred coupon pays no coupon interest early in its life and compensates investors with a\nhigher coupon rate in later years.\nThings to remember:\nThe coupon rate of a step-up bond increases by a predetermined rate at specified intervals. A step-up bond can offer investors some protection\nagainst inflation, but changes in its coupon rate are not based on changes in inflation. Unlike inflation-linked bonds, step-up bonds have coupon\nrates that only increase—instead of increasing and decreasing along with changes in inflation.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 36, "q": "50,000 bonds with a 15-year maturity were issued 10 years ago and are currently trading at 110. The indenture contains a sinking fund provision that retires 10% of the outstanding bonds every year for the next four years (starting now). If an investor bought 500 bonds at issuance, which of the following is the best outcome for the investor this year?", "opts": ["All bonds are redeemed.", "50 bonds are redeemed.", "No bonds are redeemed."], "ans": "C", "expl": "Sinking fund provision\nPredetermined schedule for retiring a portion of a bond\nissue prior to maturity\nExposes bondholders to:\nReinvestment risk\nGradually reduced credit risk\nA sinking fund arrangement details a schedule for gradually retiring a portion of a bond's principal. For the bondholder (ie, investor), this\nprovision can be either beneficial or detrimental, depending on the circumstance. A sinking fund gradually reduces credit risk by decreasing\nexposure to a specific bond issue. However, early principal repayment increases reinvestment risk since the proceeds must be reinvested at a\ndifferent—and perhaps lower—interest rate.\nSinking fund provisions typically operate on a lottery basis, with a predetermined quantity of bonds (eg, 10%) randomly selected based on a\nserial number or similar identifier. This sinking fund lottery creates a situation in which individual investors could have all, none, or any number of\ntheir bonds redeemed.\nIn this instance, with bonds trading at a large premium (ie, 110), a redemption at par (ie, 100) due to the sinking fund provision is detrimental for\nthe investor since the redeemed principal must now be reinvested at a lower interest rate. Therefore, the best outcome for the investor is to have\nnone of the 500 bonds redeemed (Choices A and B).\nThings to remember:\nA sinking fund arrangement details a schedule for gradually retiring a bond's principal. For the bondholder, this provision can reduce exposure to\ncredit risk but also increases reinvestment risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 37, "q": "For the bondholder, a sinking fund arrangement most likely results in:", "opts": ["more reinvestment risk.", "more exposure to credit risk.", "a larger balloon payment at maturity."], "ans": "A", "expl": "A sinking fund arrangement details a schedule for gradually retiring a bond's principal over time. The example above shows a plan to reduce\nprincipal by 10% annually after Year 5 and fully retire the bond in Year 15.\nFor the issuer (ie, borrower), a sinking fund provides a well-timed, disciplined approach to retiring debt. The typical fixed-rate bond has relatively\nsmall periodic interest obligations and a large terminal principal (ie, face value) obligation. An issuer who implements a sinking fund provision can\nease the payment schedule by reducing the principal early on, thus lowering the size of the terminal obligation (Choice C).\nFor the bondholder (ie, investor), this provision can be both beneficial and detrimental. A detailed plan for repaying principal reduces the investor's\nexposure to credit risk (Choice B). However, early principal repayment increases reinvestment risk since the proceeds must be reinvested at a\ndifferent—and perhaps lower—interest rate.\nThings to remember:\nA sinking fund arrangement details a schedule for gradually retiring a bond's principal over time. For the issuer (ie, borrower), a sinking fund\nprovides a well-timed, disciplined approach to retiring debt. For the bondholder (ie, investor), this provision can reduce exposure to credit risk but\nalso increase reinvestment risk.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 38, "q": "Which of the following statements concerning putable bonds is most accurate?", "opts": ["A put provision benefits the issuer when interest rates fall.", "A put provision benefits the bondholder when interest rates rise.", "A putable bond trades at a lower price than an otherwise similar option-free bond."], "ans": "B", "expl": "A putable bond contains a provision (ie, put provision) that gives the bondholder (ie, investor) the option to sell back the bond to the issuer at\na predetermined price prior to maturity. A bondholder may choose to exercise the put option (ie, put the bond back to the issuer) when interest\nrates rise since rising rates lower the bond's value (Choice A). This benefit may allow the bondholder to sell the bond at a predetermined price\nthat is higher than the market price and subsequently reinvest the proceeds at a higher interest rate.\nSince this benefit is bestowed on the bondholder, a putable bond is priced higher than an otherwise similar option-free bond and offers lower yields\n(Choice C). In effect, the bondholder pays a higher price to the issuer for the option to retire the bond early.\nThings to remember:\nA putable bond allows the bondholder to sell back the bond to the issuer at a predetermined price prior to maturity. This benefit is realized when\ninterest rates rise. As such, the bondholder pays a higher price and accepts a lower yield for the putable bond than for an otherwise similar option-\nfree bond.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 39, "q": "A company issues a callable 10-year corporate bond with the following characteristics: Corporate callable bond Comparable government bond Coupon (%) 5.00 3.50 Current YTM (%) 5.50 3.00 The bond has a make-whole provision with a 40-basis-point call spread. If this bond is called, the unpaid coupons and principal will be discounted at a rate closest to:", "opts": ["2.9%", "3.4%", "5.4%"], "ans": "B", "expl": "Make-whole call provision\nLump-sum payment is equal to the present value of all forgone\ncoupon and principal payments.\nLump-sum payment is discounted at the YTM of a predetermined\ncomparable government bond plus a spread.\nA call provision gives the issuer the option to buy back a bond before maturity. A make-whole call provision requires the issuer to make a lump-\nsum payment to bondholders that includes compensation for forgone coupon and principal payments and, thus, to make the bondholders\nwhole if the bond is called.\nThe lump-sum payment is calculated as the present value of all remaining future coupon and principal payments, discounted at a rate equal to\nthe YTM of a predetermined comparable government bond plus a spread. The make-whole call can typically be exercised at any time and the\npayment can never be less than par. A call provision is seldom used since the cost to the issuer is usually substantial, but the provision is included\nin the bond indenture to \"sweeten\" the deal and lower the issuer's borrowing cost.\nIn this scenario, the bond was issued with a 40-basis-point call spread (ie, 0.40%), which is added to the current 3.00% YTM of the referenced\ngovernment bond. Therefore, the present value of the lump sum payment would be discounted at a rate of 3.40%.\n(Choice A) 2.90% results from inappropriately using the difference in yields (ie, yield spread) between the corporate bond and the government\nbond (2.50%) and adding the make-whole call spread of 40 basis points.\n(Choice C) 5.40% results from inappropriately using the corporate coupon rate of 5.00% and adding the make-whole call spread of 40 basis\npoints.\nThings to remember:\nA make-whole call provision requires a bond issuer to make a lump-sum payment to bondholders that includes compensation for forgone coupon\nand principal payments if the bonds are called. The lump-sum payment is calculated as the present value of all remaining future coupon and\nprincipal payments discounted at a rate equal to the YTM of a predetermined comparable government bond plus a spread.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 40, "q": "The biggest determinant of market yields on US dollar-denominated emerging market sovereign debt issued in the Eurobond markets is:", "opts": ["euro interest rates.", "US dollar interest rates.", "the emerging market's domestic interest rates."], "ans": "B", "expl": "Eurobond market\nMarket Part of international bond market outside national markets' jurisdiction\nCurrency\nMajor currency (usually not issuer's domestic currency)\ndenomination\nIssuance currency's benchmark rate + Yield spread reflecting\nValuation\nissuer's credit risk and issue's liquidity risk\nThe market value of a bond is the PV of the coupon and principal amounts discounted by the appropriate market interest rate for the bond's\ncurrency denomination. An interest rate in the same currency must be used since it represents the opportunity cost of debt capital in that\ncurrency. The specific rate used to value the bond is based on the currency's benchmark (eg, government bond, interest rate swap) rate, adjusted\nfor any risk factors (eg, credit, liquidity) that are appropriate for the bond.\nA bond's market yield is the market discount rate used for valuing the bond's cash flows. Therefore, the market yield on US dollar-denominated\nemerging market sovereign debt, as in this case, is primarily determined by US dollar interest rates regardless of where the bonds are issued.\n(Choice A) Euro interest rates are used to value euro-denominated securities but have no direct effect on the value of bonds denominated in\nother currencies. The Eurobond market is a segment of the global fixed-income securities markets that consists of debt issued outside the\njurisdiction of any single country.\n(Choice C) An emerging market's domestic interest rates are the primary determinant of the country's sovereign debt yield if the bond is\ndenominated in that country's currency, regardless of where the debt is issued. However, in this scenario, the bonds are US dollar-denominated.\nThings to remember:\nThe market discount rate for valuing a bond must be in the same currency the bond is denominated in, since the rate represents opportunity cost\nas well as risk. So, the market yield on US dollar-denominated emerging market sovereign debt is primarily determined by US dollar interest\nrates.\nDescribe how legal, regulatory, and tax considerations affect the issuance and trading of fixed-income securities", "qhtml": null}, {"n": 41, "q": "Assuming there are no changes in the credit risk of the issuer, an increase in the volatility of interest rates will least likely have an impact on the price of a:", "opts": ["putable bond.", "callable bond.", "floating rate note."], "ans": "C", "expl": "The coupon rate of a floating rate note (FRN) is reset regularly and often, typically every three months, based on market rates. Therefore,\nincreased volatility in interest rates between coupon dates will not have much impact on the price of an FRN. If the issuer's credit quality has not\nchanged, the price of the bond is equal to par value at each reset.\nCallable and putable bonds have embedded call and put options. Whether those options are exercised depends on interest rates. A rise in\ninterest rate volatility increases the range of possible interest rates. With more possible outcomes, there is a higher probability that a bond's\noption will be exercised, which makes the option worth more.\nInterest rate volatility affects the prices of both callable and putable bonds. The price of a putable bond is the price of an otherwise identical\noption-free bond plus the value of the put option. As the put option increases in value, the price of the bond rises. The opposite applies for\ncallable bonds: An increase in the value of the call option reduces the price of the bond (Choices A and B).\nThings to remember:\nSince the coupon rate of a floating rate note (FRN) resets regularly and often, based on market rates, increased volatility in interest rates will not\nhave much impact on the price of the bond. Higher volatility in interest rates increases the value of both call and put options, which affects the\nprices of callable and putable bonds.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 42, "q": "A government agency issues a one-year, 3% coupon bond at par on June 30, 20X0. The bond is callable in whole or in part at: Call date Price September 30, 20X0 101.00 December 31, 20X0 100.50 March 31, 20X1 100.00 The call provision is best described as: ", "opts": ["Bermuda style.", "American style.", "European style."], "ans": "A", "expl": "Types of call provisions\nAmerican style Continuously callable: the issuer has the right to call at any time beginning on the call date until maturity\nEuropean style Only one call date, and the issuer can call bonds only on that date\nBermuda style Can be called on one of multiple call dates, but only on those dates\nA call provision allows the bond issuer to redeem a bond prior to its final maturity. This allowance exposes bondholders to reinvestment risk, as\nthe call provision is unlikely to be exercised unless yields are lower than when the bond was issued. To compensate for the call risk, investors\nrequire higher yields for callable bonds than for noncallable bonds.\nMost callable bonds have an initial call protection period during which the bonds cannot be called. Once the call protection period has passed, the\nbond is callable within the constraints of the embedded call provision. Specific call dates usually coincide with coupon payment dates.\nIn this scenario, the bond is callable on multiple specific dates and is, therefore, a Bermuda-style call rather than an American- or European-\nstyle call (Choices B and C). Bermuda-style calls often require a premium to par on the earliest call dates, which serves as a \"sweetener\" for the\nbondholder since it discourages the issuer from exercising the call provision early in the life of the bond.\nThings to remember:\nA call provision allows the bond issuer to redeem a bond prior to its final maturity. A Bermuda-style call provision has multiple call dates—but the\nbonds can be called only on specific dates, which usually coincide with coupon payment dates.\nDescribe common cash flow structures of fixed-income instruments and contrast cash flow contingency provisions that benefit issuers and\ninvestors.", "qhtml": null}, {"n": 43, "q": "A large corporate issuer issued $50 million to the general public in a new bond offering two years ago. Using the same offering circular, the company just issued an additional $30 million in new bonds, most likely due to a: ", "opts": ["shelf registration.", "private placement.", "best effort offering."], "ans": "A", "expl": "Shelf registration\nA single, all-encompassing offering circular\nCan last for years, covering multiple new issues\nSecurities can be issued with just a short document confirming details have not changed\nAllows issuer flexibility to quickly issue securities when conditions are favorable\nA shelf registration gives certain well-established issuers the ability to file a single, all-encompassing offering circular (ie, master prospectus)\nthat allows securities to be issued quickly in the future when capital is needed or when market conditions are favorable. The term comes from\nthe idea that the securities are \"sitting on a shelf,\" just waiting to be sold. Shelf registrations can last for years, and all that is required for a new\nissuance is a short document confirming that no material changes have occurred that require additional disclosure.\n(Choice B) A private placement is not sold to the general public, and the investors would most likely require a new prospectus.\n(Choice C) A best effort offering is a type in which the broker sells securities only on a \"best effort\" basis. It is typically used only for high-risk\nsecurities, not those from well-known, seasoned issuers.\nThings to remember:\nA shelf registration gives certain well-established issuers the ability to file a single, all-encompassing offering circular that allows securities to be\nissued quickly in the future when capital is needed or when market conditions are favorable.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 44, "q": "An analyst is classifying bonds within the global fixed income market. Which of the following is least likely a valid distinction for the analyst to use? ", "opts": ["Bilateral versus syndicated", "Fixed rate versus floating rate", "Corporate versus nonsovereign"], "ans": "A", "expl": "Fixed income securities can be classified in a number of different ways; the most common classifications are shown above. Bilateral and\nsyndicated are types of loans, not types of bonds, made by banks to corporations and other entities. A bilateral loan is made from a single\nlender to a single borrower who needs funding. A syndicated loan is made by a syndicate (ie, a group of lenders who share the credit risk of the\nloan). Note that although a bond issuance may, in some cases, be purchased by a single institutional investor, this bond is not called \"bilateral.\"\n(Choice B) Bonds may be classified by coupon type, so fixed versus floating is a valid distinction. The \"rate\" refers to the coupon rate paid by the\nissuer, so fixed-rate bonds maintain the same rate or coupon over time. Floating-rate bonds have a rate that varies based on a reference rate\nsuch as LIBOR.\n(Choice C) Bonds may be classified by issuer type, so corporate versus nonsovereign is a valid distinction. There are four broad bond sectors:\nfinancial institutions, nonfinancial corporates, governments, and households. Within the government sector, nonsovereign bonds are issued by\nauthorities (eg, municipal governments) subordinate to national governments.\nThings to remember:\nThe most common classifications of fixed income securities are issuer type, credit quality, maturity, currency denomination, type of coupon,\ngeography, inflation protection, and tax treatment.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 45, "q": "Typically, corporate bonds are most likely issued through a(n):", "opts": ["auction.", "best effort offering.", "underwritten offering."], "ans": "C", "expl": "Corporate bonds are most often issued in an underwritten offering; this is also known as a firm commitment offering. In an underwritten\noffering, the underwriter (eg, investment bank) guides the issuer through the issuance process (eg, size, structure, pricing) by conveying investors'\npreferences. The underwriter then buys the entire issue to resell to investors, thus guaranteeing that the issuance is successful for the issuer but\ntaking a financial risk if not all the bonds are sold.\n(Choice A) Auctions utilize a bidding process for price discovery and are more typical in the issuance of sovereign government debt. Sovereign\nbonds are well known to investors; combined with the standardized nature and regular issuance of these bonds, they enable the lowest cost\nissuance method, namely an auction.\n(Choice B) In a best effort offering, the investment bank is acting only as a broker and will sell the issue only on a \"best efforts\" basis for a\ncommission. Best effort offerings are not as common and usually reserved for high-risk issues.\nThings to remember:\nCorporate bonds are most often issued in an underwritten offering; this is also known as a firm commitment offering. The underwriter buys the\nentire issue to resell to investors, thus taking financial risk that the issuance is successful.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 46, "q": "The secondary market for a particular bond is most likely deemed liquid if the bond can be sold quickly:", "opts": ["to numerous bidders.", "for same-day settlement.", "at close to fair market value."], "ans": "C", "expl": "Secondary bond market liquidity\nNot simply about how quickly a bond can be bought or sold\nThe ability to buy and sell quickly at prices close to fair value\nThe secondary bond market is dominated by institutional investors and central banks, with only limited retail participation. Securities are most\noften traded through a broker-dealer in over-the-counter (OTC) transactions.\nOutside of a handful of very liquid bonds (eg, sovereigns) that can be traded on an electronic order execution system (ie, \"screen\"), the liquidity of\nbonds is largely dependent on getting manual quotes from brokerage firms. Secondary bond market liquidity is determined by both how fast a\nbond can be bought or sold and how closely the price approximates fair value.\nFor example, suppose an institutional investor is interested in selling a high-quality bond and, due to the decentralized nature of the OTC market,\nthe investor requests bids (ie, price the buyer is willing to pay) from numerous brokerage firms (ie, manual quotes). Depending on the bond and\nmarket conditions, the price dispersion may be quite wide. In this case, suppose the best bid received is 2% below what the investor believes is a\nfair market price. This bond would not be considered liquid in the sense that even though the bond can be sold quickly, the price is too far below\nfair market value.\n(Choice A) Numerous bidders alone do not constitute a liquid market, particularly if the bids are materially below fair value.\n(Choice B) The market convention for settling most corporate bonds is trade date plus two or three days (eg, t + 3). Same-day settlement is often\npossible, but it frequently comes at a price further from fair market value, indicating a less liquid market.\nThings to remember:\nSecondary bond market liquidity is determined by both how fast a bond can be bought or sold and how closely the price approximates fair value.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 47, "q": "Floating rate notes (FRNs) are most likely issued by banks to:", "opts": ["limit their interest rate risk.", "lower their interest expense.", "secure long-term funding needs."], "ans": "A", "expl": "Floating rate notes (FRNs) are most often issued by banks to align balance sheet interest rate risk. FRNs are generally issued with short-term\nmaturities and are frequently tied to the same reference rates as an institution's liabilities. By matching the interest rate risk of assets and\nliabilities, the bank diminishes earnings and net worth fluctuations, thus decreasing the probability of an adverse outcome on a financial\ninstitution's capital buffer.\n(Choice B) Banks and corporations issue FRNs for different purposes and needs. Corporate borrowers will issue FRNs as an alternative to bank\nlines of credit when financing is cheaper. Corporate issuers may also speculate on the direction of interest rates, issuing FRNs when they believe\ninterest rates will fall.\n(Choice C) FRNs are most often issued with short maturities to align interest rate risk at banks. Long-term funding is largely secured through\nother means (eg, fixed rate debt, preferred stock).\nThings to remember:\nFloating rate notes (FRNs) are most often issued by banks to align balance sheet interest rate risk. By matching the interest rate risk of assets\nand liabilities, the bank diminishes earnings and net worth fluctuations, thus decreasing the probability of an adverse outcome on a financial\ninstitution's capital buffer.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 48, "q": "A dealer places a noncompetitive bid in a single-price auction of government bonds for $1 million face value of bonds. Which of the following statements most accurately describes the amount of bonds the dealer will receive when the auction is concluded?", "opts": ["None, since the bid is noncompetitive", "$1 million face value of bonds at the issuer-accepted yield", "$1 million face value of bonds at the yield that the dealer bid"], "ans": "B", "expl": "Governments often issue bonds through an auction. Bidders submit bids that specify the lowest yield that they will accept for a specified\namount in bonds. For instance, a dealer may bid a yield of 3% for $10 million face value of two-year bonds. Bids are ranked from lowest to\nhighest in terms of yield, but the yield accepted by the issuer is usually some type of average from the bids submitted.\nA single-price auction means that all winning bidders pay the same price for the bonds (ie, they receive the same yield). Bids can be submitted\non a competitive or a noncompetitive basis. Competitive bidders may not receive bonds if their bids are higher than the lowest accepted yield.\n(Choice A) A noncompetitive bid means that the bidder simply wants bonds, regardless of price. Noncompetitive bidders agree to take bonds at\nthe issuer-accepted yield, so they always receive bonds from the issue.\n(Choice C) A single-price auction means that all winners receive bonds at the same price, regardless of the price that they submitted. In a multi-\nprice auction, winning bidders receive bonds at the yield that they bid, so winners pay different prices.\nThings to remember:\nGovernments often issue bonds through an auction and bidders can submit competitive or noncompetitive bids. A competitive bidder risks not\nreceiving bonds if its bid is not accepted, while a noncompetitive bidder wants a specified amount of bonds and agrees to accept them at the yield\naccepted by the issuer.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 49, "q": "With respect to the supply of fixed-rate and floating-rate debt, which of the following statements is most accurate?", "opts": ["Consumer banks prefer to make fixed-rate loans.", "Consumer finance companies prefer to issue floating-rate debt.", "Corporate borrowers expecting higher rates prefer to issue floating-rate bonds."], "ans": "B", "expl": "The supply of fixed-rate and floating-rate debt results from lenders attempting to match the type of interest rate they receive from assets to the\ntype of interest rate they pay for liabilities. In general, institutions seek to match fixed to fixed and floating to floating since doing so mitigates\ninterest rate risk.\nConsumer finance companies extend short-term loans, so the interest earned on their loan assets may vary greatly over time. Therefore,\nthese companies prefer to issue floating-rate debt to finance their own operations.\n(Choice A) Consumer banks are funded by accepting checking (ie, demand), savings, and money market deposits from customers and by selling\ncertificates of deposit. These short-term sources are liabilities for the bank, and their rates change frequently. To match their interest patterns,\nbanks prefer to make floating-rate loans.\n(Choice C) Corporations expecting lower interest rates prefer to issue floating-rate bonds so their future financing costs will be lower.\nThings to remember:\nFor interest rates paid on liabilities and received on assets, institutions seek to match fixed to fixed and floating to floating to mitigate interest rate\nrisk. Therefore, consumer finance companies and companies expecting lower rates prefer to issue floating-rate debt. Likewise, banks that have\nshort-term variable liabilities prefer to make floating-rate loans.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 50, "q": "A bond that trades in the secondary market is most likely transacted:", "opts": ["through an auction.", "on an organized exchange.", "in the over-the-counter markets."], "ans": "C", "expl": "While some government and very active corporate bonds do trade on an exchange (Choice B), the great majority of bonds are bought and sold\nin the over-the-counter (OTC) markets.\nAn exchange is a central location where all orders are processed, whereas the OTC markets have no specific location: buyers and sellers are\nconnected by various trading platforms that form a communications network.\n(Choice A) Auctions are primarily used with new-issue sovereign government bonds.\nThings to remember:\nWhile some government and very active corporate bonds do trade on an exchange, the great majority of bonds are bought and sold in the over-\nthe-counter markets.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 51, "q": "A Japanese corporation makes a public offering of EUR-denominated bonds in the French domestic bond market. From a French investor's perspective, these securities are most likely considered:", "opts": ["Eurobonds.", "foreign bonds.", "domestic bonds."], "ans": "B", "expl": "Geographic classification of bonds\nDomestic bonds Foreign bonds Eurobonds\nIssuer Same as country\nDifferent from country of issuance\ndomicile of issuance\nCurrency Domestic (local) currency Foreign currency\nJurisdiction Domestic legal, regulatory, and tax rules Numerous exemptions\nForeign bonds are debt securities issued in the domestic market by foreign-domiciled issuers. The securities are denominated in the local\ncurrency and are subject to local laws, regulations, and taxes. Foreign issuers issue such securities to reduce currency risk for earnings of\ndomestic subsidiaries and/or to gain access to capital at attractive interest rates.\nIn this scenario, the debt of the Japanese corporation issued in France and denominated in EUR, which is the local currency where the bond is\nissued, is considered a foreign bond in the French bond market.\n(Choice A) Eurobonds are debt securities issued outside of the issuer's domestic market; they are issued in one country and denominated in the\ncurrency of another. Eurobonds have numerous exemptions from local rules, regulations, and taxes that often result in lower capital costs relative\nto domestic bond issues. Most issuers raising capital outside of their own domestic markets do so in the Eurobond markets.\n(Choice C) Domestic bonds are debt securities issued within the country in which the issuer is domiciled and denominated in that country's\ncurrency. These issues are subject to local laws, regulations, and taxes. Most issued debt securities are domestic bonds.\nThings to remember:\nWhen classifying bonds by geography, there are three categories: domestic bonds, foreign bonds, and Eurobonds. Foreign bonds are debt\nsecurities issued in the domestic market by a foreign-domiciled issuer. The securities are denominated in the local currency of the country where\nthey are issued and are subject to its local laws, regulations, and taxes.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 52, "q": "Which of the following abilities is most likely an advantage for an institutional investor participating in a bond private placement?", "opts": ["Influencing the terms of the transaction", "Immediately reselling the bonds for a quick profit", "Conducting extensive due diligence to confidently take a large portfolio position"], "ans": "A", "expl": "Corporate bond private placements\nAdvantages Disadvantages\nInfluence the structure of the transaction Restricted/unregistered securities\nInfluence covenants, collateral, etc. Riskier than most alternatives\nInvestor Higher return potential Very limited secondary market liquidity\nResearch intensive\nSmall offering size limits attractiveness\nReduced regulation and disclosure Small offering size\nIssuer Low issuance cost Higher yields\nCan quickly come to market\nCompanies use many methods to issue securities when raising capital. In a private placement, bonds are sold directly to a limited number of\nqualified investors through a privately negotiated transaction. Common investors in private placements include pension funds and insurance\ncompanies.\nPrivate placements have several features that make them attractive to issuers, including reduced regulatory and disclosure requirements (eg, the\noffering is often unregistered). These features result in lower issuance costs and an ability to come to the market more quickly.\nInvestors are attracted to the higher return potential of private placements and the ability to exert considerable influence on bond structure,\ncollateral (ie, pledged assets), and covenants. Investors must balance these factors against the higher risks, research demands, limited liquidity,\nand relatively small portfolio impact of these deals.\n(Choice B) Since private placements are usually illiquid and come with resale restrictions, an investor is generally not able to sell immediately\nafter purchase for a quick profit.\n(Choice C) Even with extensive due diligence, the relatively small size of private placements limits an institutional investor's ability to take a large\nposition.\nThings to remember:\nIn a private placement, bonds are sold directly to a limited number of qualified investors through a privately negotiated transaction. Investors are\nprimarily attracted by the higher return potential and the ability to exert considerable influence on bond structure, collateral, and covenants.\nCompare primary and secondary fixed-income markets to equity markets.", "qhtml": null}, {"n": 53, "q": "For floating-rate debt, the reference rate most likely:", "opts": ["defines the periodic reset of the spread.", "depends mainly on the issuer's creditworthiness.", "determines borrowing cost variation after issuance."], "ans": "C", "expl": "A floating-rate bond pays a coupon that is equal to a variable reference rate (eg, LIBOR) plus a constant spread over the reference rate. The\nspread is based on the issuer's creditworthiness, is set when the bond is created, and remains the same throughout the life of the bond. The\nhigher the spread, the lower the issuer's creditworthiness.\nIn contrast, the choice of reference rate reflects the relevant market interest rate but does not depend on the creditworthiness of the issuer\n(Choice B). The reference rate resets each period, which causes the coupon rate of the bond to \"float\" with the market rate. As a result, the\nreference rate determines the variation in the borrowing cost for the issuer after the bond has been issued, by defining the periodic reset of\nthe floating rate (not the spread) (Choice A).\nThings to remember:\nA floating-rate coupon is equal to a variable reference rate plus a constant spread, which is based on the issuer's creditworthiness. The spread is\nset at issuance and does not change or periodically reset. Variation in the issuer's borrowing cost is due to changes in the reference rate over\ntime.\nDescribe fixed-income market segments and their issuer and investor participants.", "qhtml": null}, {"n": 54, "q": "Compared with broad equity indexes (eg, STOXX Europe 600, S&P 500), broad fixed-income indexes covering the same geographic region most likely:", "opts": ["have fewer constituents.", "exhibit greater constituent turnover.", "are equally weighted rather than market-value-weighted."], "ans": "B", "expl": "Fixed-income indexes vs. equity indexes\nFixed income Equity\nNational governments\nRegional/local governments\nTypes of issuers Corporations\nGovernment agencies\nCorporations\nNumber of issues Multiple issues per issuer Usually only 1 class of common equity\nIssues mature\nConstituent turnover Securities last for life of issuer\nNew issues are more frequent\nWeighting Usually market value Usually market capitalization\nBroad fixed-income indexes perform the same functions for debt markets as broad equity indexes perform for stock markets. Both provide a\nmeans of tracking risk and return in different securities markets. Fixed-income indexes facilitate the evaluation of relative performance for\ndifferent markets and the sectors within those markets. Indexes also serve as benchmarks for assessing the performance of investment\nmanagers and implementing indexed investment strategies.\nBroad fixed-income indexes differ from broad equity indexes in several significant ways. Fixed-income indexes usually contain many more\nsecurities (ie, constituents) since there are more types of issuers for debt securities (eg, governments, agencies, corporations) compared with\nequities, which are issued only by corporations. Furthermore, most debt issuers have multiple issues outstanding, while most corporations have\nonly one class of common equity outstanding (Choice A).\nThere is also much greater turnover of constituent securities in fixed-income indexes. This is due to:\nthe more frequent issuance of new securities, which are added to the index, and\nthe finite life of most bonds, which results in issues being removed from the index.\nFixed-income indexes are usually market-value weighted, so the turnover of constituents results in these indexes reflecting changes in the\ncomposition over time (Choice C).\nThings to remember:\nBroad fixed-income indexes provide a means of tracking risk and return in different securities markets. Such indexes also serve as benchmarks\nfor assessing investment manager performance and implementing indexed investment strategies. Compared with equity indexes, fixed-income\nindexes have more constituent securities and greater constituent turnover.\nDescribe types of fixed-income indexes", "qhtml": null}, {"n": 55, "q": "A negotiable certificate of deposit (CD) is best described as having:", "opts": ["small denominations and a penalty for early withdrawal.", "a maximum maturity of one year, and interest is paid monthly.", "large denominations, and it can be traded in the secondary market."], "ans": "C", "expl": "Certificates of deposit (CD)\nNonnegotiable CD Negotiable CD\nDenomination ≤ USD 100,000 Usually ≥ USD 1,000,000\nEarly withdrawal Yes, with penalty No\nTradable No Yes, in secondary market\nBanks receive much of their funding through retail customer deposits, but they also often turn to the wholesale funding market to obtain capital.\nThe wholesale funding market consists of central bank funds, the interbank market, and certificates of deposit (CDs).\nIn exchange for a deposit, a bank will issue a CD in a specific amount for a specified time and interest rate. CDs are one of the primary sources of\nfunding for banks and similar financial institutions. CDs can be categorized as either negotiable or nonnegotiable.\nA nonnegotiable CD is commonly sold to the bank's retail customers. Nonnegotiable CDs pay interest at maturity, are issued in small\ndenominations of usually less than USD 100,000, and can only be withdrawn before maturity by paying a penalty (Choice A).\nA negotiable CD is issued in large denominations, often USD 1 million or more, and can be traded to other investors in the secondary market.\nNegotiable CDs pay interest at maturity and cannot be withdrawn early.\n(Choice B) Both types of CDs can have maturities greater than one year. A CD with a maturity of more than one year is known as a term CD. All\nCDs pay interest at maturity.\nThings to remember:\nIn exchange for a deposit, a bank will issue a certificate of deposit (CD) in a specific amount for a specified time and interest rate. A negotiable CD\nis issued in large denominations, often USD 1 million or more, and can be traded to other investors in the secondary market. Negotiable CDs pay\ninterest at maturity and cannot be withdrawn early.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 56, "q": "A US bank issues USD 100 million in 90-day, 4% US commercial paper. Assuming a 360-day year, the proceeds from the offering (USD millions) are closest to:", "opts": ["96", "99", "100"], "ans": "B", "expl": "Commercial paper is short-term unsecured debt issued by companies in many markets around the world. Commercial paper is used\nextensively for short-term financing needs, including working capital, seasonal funds, and bridge financing since it is relatively flexible, available,\nand low-cost. The United States commercial paper (USCP) market is the world's largest. Eurocommercial paper (ECP) refers to all commercial\npaper issued outside the United States market.\nOne of the most important differences between these markets is the way interest is earned. USCP pays interest on a discount basis whereas\nthe ECP market uses either an interest-bearing or discount basis. In this USCP scenario, the paper is issued at a discount to par. The interest\namount is calculated as follows:\nFor commercial paper offered on a discount basis, the offering proceeds are equal to the par value minus the interest: 100 million − 1 million = 99\nmillion.\n(Choice A) USD 96 million is the result of failing to multiply by (90 ÷ 360) when calculating the interest.\n(Choice C) USD 100 million is the amount of proceeds if the interest of the offering were on an interest bearing (ie, yield) basis.\nThings to remember:\nUS commercial paper is offered with interest on a discount basis, so offering proceeds are equal to par value minus interest. Eurocommercial\npaper may be offered on either a discount or interest-bearing basis.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 57, "q": "Interbank offered rates are least likely used:", "opts": ["to price a 5-year fixed-coupon bond issued by a bank.", "for resetting the coupon rate on a 5-year floating-rate note (FRN)", "as the reference rate for a 5-year fixed-for-floating interest rate swap."], "ans": "A", "expl": "Adjustable- or floating-rate instruments have numerous attractions for borrowers and creditors. Floating-rate loans or bonds are usually lower-cost\nsources of funds than long-term fixed rate borrowing. Lenders and investors can reduce interest rate risk by using floating-rate securities or\nderivatives. Interbank offered rates (eg, Libor) are widely used as reference rates for setting interest rates on such financial instruments.\nHowever, interbank rates are not used to price fixed-coupon bonds. Such a bond's price is based on the YTM at which the security is trading. A\n5-year bond's price reflects a 5-year interest rate. Interbank rates have terms that range from overnight to a maximum of 1 year; therefore, they\nare not used to price 5-year fixed-coupon bonds.\n(Choices B and C) The specific interbank rate used typically has a term consistent with the reset frequency (eg, a 3-month rate is used for\nquarterly resets).\nThings to remember:\nThe price of a fixed-coupon bond is based on the YTM at which the security is trading. Interbank rates have terms that range from overnight to a\nmaximum of 1 year; therefore, they are not used to price 5-year fixed-coupon bonds.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 58, "q": "The purpose of a repo margin is most likely to:", "opts": ["provide a return to the lender.", "shield the borrower from counterparty risk.", "protect the lender from a decline in collateral value."], "ans": "C", "expl": "Factors affecting repo margin\nCollateral quality The higher the quality of collateral, the lower the margin\nCollateral demand Lower margin is required if specific collateral is in high demand\nLength The longer the term of the repo, the higher the margin\nCounterparty risk Higher creditworthiness of counterparty, lower margin required\nIn a repurchase agreement (\"repo\"), the repo buyer, as the lender, provides cash in exchange for securities provided by the repo seller, as the\nborrower. In effect, securities are collateral for the short-term financing provided by the repo.\nThe lender is exposed to the risk that the borrower will not repurchase the collateral when the agreement ends, defaulting on the repo. Although\nthe lender can sell the collateral in the market, it is possible that its market value will have declined since the repo was initiated.\nTo shield the lender from a decline in collateral value in the event of default, the value of the collateral is greater than the amount actually\nloaned (eg, 102%, 105%). The difference between the value of the collateral and the amount loaned is the repo margin. The magnitude of the\nrepo margin depends upon:\nthe quality of the collateral,\nthe demand for specific collateral,\nthe term of the repo, and\nthe counterparty's creditworthiness.\n(Choice A) The lender's return (ie, interest rate) for providing cash to the borrower is the repo rate.\n(Choice B) The repo margin protects the lender from counterparty risk, not the borrower.\nThings to remember:\nThe repurchase agreement (\"repo\") margin is the difference between the value of the cash loaned and the value of the collateral. The repo margin\nprotects the lender from counterparty default risk and a decline in collateral value.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 59, "q": "With respect to principal repayment structures, a serial maturity bond is most similar to a:", "opts": ["coupon strip.", "payment-in-kind bond.", "bond with a sinking fund."], "ans": "C", "expl": "An issuance of corporate bonds typically has one of two principal repayment structures:\nIn a term maturity, the entire principal amount for a bond is due on the same date.\nWith a serial maturity, the bond issue has multiple maturity dates; the principals of certain bonds are retired on each of the maturity\ndates.\nSince a term maturity involves the issuer retiring the entire bond issue at one maturity date, it exposes bondholders to greater risk of default than a\nserial maturity structure. A sinking fund can mitigate this risk: the issuer is required to retire a certain minimum percentage of the bonds each year,\naccording to a schedule designated in the bond indenture. This means that redemptions to bondholders happen over time, similarly to how\ncash flows occur for a bond issuance with a serial maturity structure.\n(Choice A) A coupon strip refers to the securities created when the interest payments from a government bond are separated (\"stripped\") from\ntheir principal payment and the two types of obligations trade as separate securities in the market. In this process, the date of the principal\npayment is not changed and occurs on the same single date, so the resulting securities are not similar to a serial maturity.\n(Choice B) Payment-in-kind (PIK) refers to a type of bond coupon, not a type of principal repayment structure. A PIK coupon bond pays the\nperiodic coupon in the form of common stock shares of the company or in bonds, not cash.\nThings to remember:\nCorporate bond issues have either a serial maturity structure, in which the bonds are retired on multiple maturity dates, or a term maturity structure\nwith one maturity date. The term maturity structure involves more risk due to the single required date of principal repayment. A sinking fund is\nsimilar to a serial maturity structure from the issuer's perspective.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 60, "q": "A bank expects to originate more loans than can be funded by retail deposits. Banks in this situation most commonly utilize funding from:", "opts": ["wholesale funds.", "demand deposits.", "fixed-rate bond issuances."], "ans": "A", "expl": "Short-term funding available to banks\nDemand deposits (checking accounts)\nRetail deposits Savings accounts\nMoney market accounts\nCentral bank funds\nWholesale funds Interbank deposits\nCertificates of deposit\nShort-term loan-like agreements\nRepurchase agreements (\"repos\") Repo and reverse repo\nNot particular to banks\nDebt maturities < 360 days\nCommercial paper\nNot particular to banks\nFinancial institutions like banks have greater funding needs than nonfinancial companies since, in addition to projects like expansions and\nacquisitions, they engage in financial operations such as making loans and investing. Banks obtain much of their funding through the retail\ndeposits of their customers. However, when the amount of loans made to customers exceeds the funds available from retail accounts, they most\ncommonly turn to wholesale funds: central bank funds, interbank deposits, and certificates of deposit.\nBanks will use wholesale funds first, after retail deposits, since interest costs can be less than with retail deposits, repurchase agreements, and\ncommercial paper. Wholesale funds are also important in managing any potential fixed/floating balance sheet mismatch between assets and\nliabilities. Repurchase agreements are another commonly used source of funds available to banks and other companies.\n(Choice B) Demand deposits (checking accounts) are a type of retail deposit.\n(Choice C) Bank financial assets tend to be relatively short-term, and therefore result in a variable rate of interest. Banks normally first turn to\nlower-cost wholesale funds before issuing debt in the form of bonds. If banks issue bonds, the bonds are likely to have a floating (not fixed)\ncoupon rate.\nThings to remember:\nBanks are most likely to turn to wholesale funds if loan balances exceed retail deposits. Wholesale funds are generally less expensive for banks\nthan a bond issuance.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 61, "q": "For a bond issue with a sinking fund arrangement, the bonds retired prior to maturity are least likely to be retired at:", "opts": ["a discount to par.", "par.", "a premium to par."], "ans": "C", "expl": "Sinking fund provision\nPredetermined schedule for retiring a portion of a bond\nissue prior to maturity\nExposes bondholders to:\nReinvestment risk\nGradually reduced credit risk\nA bond issue with a sinking fund arrangement requires the issuer to retire a portion of the original principal amount prior to maturity (similar to a\nserial maturity structure). The sinking fund schedule specifies the principal amount of bonds that must be retired each year. The retirements\nreduce the total amount of debt outstanding, thereby reducing the credit risk faced by holders of the bonds still outstanding.\nThe issuer can meet the sinking fund requirement by either:\npurchasing the required par amount in the secondary market, or\nrandomly choosing bonds to call at par (Choice B).\nBonds purchased in the secondary market must be delivered to the indenture trustee to prove compliance with the sinking fund arrangement.\nSecondary market purchases are used to satisfy a sinking fund retirement only if the bond is trading at a discount to par (Choice A). If the\nbond is trading at a premium, the sinking fund calls at par are used. Therefore, bonds with a sinking fund arrangement are unlikely to ever be\nretired at a premium to par.\nThings to remember:\nA bond with a sinking fund arrangement requires the issuer to retire a portion of the original principal amount prior to maturity. The issuer can\nmeet this requirement by either calling bonds to be retired or purchasing bonds in the secondary market. Bonds are purchased in the secondary\nmarket only if they can be purchased at a discount.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 62, "q": "A contingency provision contained in the indenture of a bond issued by a corporation most likely refers to:", "opts": ["the issuer's ability to defer coupon payments if certain conditions are met.", "the bondholder's ability to force the corporation to redeem the bond before maturity.", "the issuer's right to incur additional debt while some or all of the original amount is still outstanding."], "ans": "B", "expl": "Typical bond contingency provisions\nCallability Issuer has right to redeem bond before maturity\nPutability Bondholder can require issuer to redeem bond before maturity\nBondholder can convert bond into a predetermined number of issuer's\nConvertibility\ncommon shares\nContingency provisions in the context of bonds are very specific and refer to the rights of the issuer and/or bondholders with respect to how a\nbond can be redeemed or disposed of. The most common types of contingency provisions concern whether a bond can be called, put, or\nconverted.\nA putable bond gives its holder the right to require that the issuer redeem the bond before maturity. The redemption price is established in the\nindenture, in addition to any other relevant provisions such as when the bondholder must act. This right (ie, the put) can be valuable to the\nbondholder, and that value allows the issuer to pay a lower coupon rate.\n(Choice A) The issuer's right to defer coupon payments does not relate to redeeming or converting the bond, so it is not properly categorized as a\ncontingency.\n(Choice C) Provisions concerning an issuer's ability to incur additional debt are a covenant, or promise, of actions that the issuer agrees to take\n(ie, affirmative covenants) or not take (ie, negative covenants).\nThings to remember:\nA contingency provision in a bond covenant refers to the circumstances governing the redemption or disposal of a bond. The most common\ncontingency provisions address a bond's callability, putability, and convertibility.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 63, "q": "If repo collateral is \"on special,\" it most likely:", "opts": ["is in high demand.", "is a repo to maturity.", "offers the highest overnight repo rate."], "ans": "A", "expl": "Factors affecting repo rates\nCollateral risk The higher the quality of collateral, the lower the rate.\nCollateral General collateral is the standard rate for a collateral type.\ndemand \"On special\" collateral lowers the repo rate.\nTerm The longer the term, the higher the rate.\nDelivery A lower rate is offered if collateral needs to be directly\nrequirements delivered to the lender versus a third-party custodian.\nFinancing Repo rates are affected by financing alternatives available in\nalternatives the market.\nThe repo rate is the quoted interest rate on a repurchase agreement. Repo rates are generally tied to short-term interest rates and follow the\ncentral bank policy rate very closely. With the policy rate as the baseline, other factors that influence the repo rate include collateral risk, demand\nfor collateral, term, delivery requirements, and alternative financing sources.\n\"General collateral\" refers to a broad variety (eg, maturities, coupons) of issues of the same type (eg, Treasuries, agency bonds) that serve as\ncollateral (ie, the asset sold and repurchased) for the repo. When a certain asset, such as a specific Treasury bond, is \"on special,\" there is great\ndemand for that specific security to serve as collateral, which depresses the repo rate below the general collateral rate. The lender is willing to\naccept the lower rate in order to have that specific asset as collateral. Specialness is driven by a very specific borrowing need (eg, a short position\nor a futures delivery) and most often applies to a benchmark security (eg, 10-year Treasury).\n(Choice B) A repo to maturity is a repo with a term equal to the maturity of the underlying collateral (eg, 15 days). Special collateral is most often\nin great demand to satisfy a very specific obligation; however, it is highly unlikely that a repo to maturity would be able satisfy the specific collateral\nobligation.\n(Choice C) An \"on special\" repo will have a lower rate versus general collateral of the same term.\nThings to remember:\nRepo rates are affected by collateral risk, demand for collateral, term, delivery requirements, and alternative financing sources. When a certain\nasset, such as a specific Treasury bond, is \"on special,\" there is great demand for that specific security to serve as collateral, which depresses the\nrepo rate below the general collateral rate.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 64, "q": "A large corporation based in the United States wants to borrow funds for three months as interim financing until it can complete a long-term bond issue. If the interim funding is to be unsecured, the most appropriate funding arrangement is to: ", "opts": ["issue three-month commercial paper.", "borrow directly from a bank for three months.", "initiate a three-month term repurchase agreement."], "ans": "A", "expl": "Commercial paper is a form of short-term debt that is often used for interim financing until longer-term financing can be finalized. In addition to\nbeing short-term, commercial paper is unsecured, meaning that there is no collateral; it is only the issuer's promise to pay that backs the loan.\nCommercial paper is issued to multiple investors through capital markets, whereas bank loans are negotiated directly between the borrower and\nlender.\n(Choice B) Bank loans are more likely to be used by smaller corporate borrowers that do not have ready access to capital markets. Most bank\nloans require the borrower to secure the loan with collateral.\n(Choice C) In a repurchase (\"repo\") agreement, the borrower sells an asset while agreeing to repurchase it in the future for a predetermined\nprice. Since the lender can sell the asset if the repurchase does not occur, a repo agreement can be viewed as a secured loan. For this reason, it\nis classified as a secured form of short-term debt.\nThings to remember:\nCommercial paper is a form of short-term debt that larger companies often use as a source of interim financing. Commercial paper is unsecured\nby any collateral or other security; it is backed only by the issuer's promise to pay.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 65, "q": "Which of the following fixed-income instruments is most similar to a collateralized loan?", "opts": ["Putable bond", "Interbank loan", "Repurchase agreement"], "ans": "C", "expl": "A repurchase agreement (ie, repo) is structured as two paired transactions. The first trade is a sale of securities for a specified amount of cash.\nAt that time, the counterparties agree to a second trade in which the initial seller repurchases the securities for a slightly higher price.\nThere is no price risk with a repo since the prices for both trades are agreed to at initiation; in effect, the price difference is interest earned on\nthe purchase (ie, loaned) amount. The original buyer is protected from default by the securities (ie, collateral) received in the initial trade. As a\nresult, a repo is the equivalent of a collateralized loan.\n(Choice A) The put provision in a putable bond does give bondholders the right to force the issuer to repurchase the bond prior to maturity, but\nthere is no collateral (ie, no assets are pledged against the risk of default).\n(Choice B) An interbank loan is unsecured. In a repo, the assets purchased function as collateral.\nThings to remember:\nRepurchase agreements (repos) consist of an initial sale and subsequent repurchase of securities. There is no price risk, so the agreed-upon\nprice difference is effectively interest. Since buyers are protected from default by the securities in their possession, repos are a type of\ncollateralized loan.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 66, "q": "A large company with a low credit rating needs to borrow a large amount of money. If the company operates in a country with an underdeveloped bond market, which of the following is the company's most likely source of funds?", "opts": ["Bilateral loan", "Bond issuance", "Syndicated loan"], "ans": "C", "expl": "Bank loans are the primary source of debt financing for small- and medium-size companies. Large companies may also use bank loans instead of\nissuing bonds if the company:\nis in an underdeveloped bond market area;\nmust compete for bond issuance in a market where government entities and financial institutions dominate (\"crowd out\") corporate issuers;\nor\nhas a low credit rating, making bond issuance more expensive than a bank loan.\nA syndicated loan is made by a group (ie, syndicate) of financial institutions (eg, banks, insurance companies, and other lenders) to a single\nborrower. A syndicated loan is appropriate when no single lender wishes to make a bilateral loan (ie, single lender to single borrower) and take\non all the credit risk of the loan (Choice A). A substantial loan to a large company with a low credit rating, as described in this case, would\ninvolve high credit risk, making a syndicate a more likely source of funds than a single lender.\n(Choice B) Large, established companies with high credit ratings issue bonds perceived as relatively safe investments by bond markets. For\nsuch companies, issuing bonds may be less expensive, and therefore more desirable, than taking out bank loans. The exceptions to this general\nrule is when bond markets are not fully developed or when government entities \"crowd out\" private companies in bond issuance.\nThings to remember:\nLarge companies with good credit ratings generally prefer to issue bonds as their lowest cost borrowing option. A large company may instead use\nbank loans if bond markets are underdeveloped; bond markets are dominated by government and financial institutions, or the company's credit\nrating is low. A syndicated loan is more appropriate than a bilateral loan when credit risk is too great and/or the loan principal is too large for a\nsingle lender.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 67, "q": "Which of the following exposes a counterparty lending to a bank to the least amount of credit risk?", "opts": ["Central bank funds", "Repurchase agreements", "Negotiable certificates of deposit"], "ans": "B", "expl": "Short-term bank funding alternatives\nFunds deposited by individual and commercial customers\nRetail deposits\nChecking (ie, demand), savings, and money market accounts\nCentral bank Commercial bank deposits (usually required) at central bank\n(reserve) funds Excess over required minimum may be lent to other banks\nInterbank funds Market for deposits and loans between banks\nNegotiable certificates Large denomination deposits with penalties for early withdrawal\nof deposit (CDs) Withdrawal penalty avoided by sale of deposit to another investor\nRepurchase Security sale paired with later repurchase of same security\nagreements (repos) Combined transactions equivalent to a collateralized loan\nA repurchase agreement (repo) is structured as a pair of transactions:\nAt initiation securities are sold for cash, and at the same time\nthe counterparties agree to a second trade in which the seller will repurchase those securities at maturity at a higher price.\nThe required repurchase makes repos economically equivalent to collateralized loans. The repo buyer (ie, lender) has securities that can be\nsold to recover the amount owed if the repo seller (ie, borrower) fails to repurchase them. The amount borrowed in a repo is less than the value of\nthe collateral, thus minimizing the lender's exposure to credit risk.\n(Choices A and C) Loans of central bank funds and negotiable certificates of deposit are not collateralized, so the lenders are exposed to more\ncredit risk than in a repo.\nThings to remember:\nRepurchase agreements (repos) consist of an initial sale of securities and the subsequent repurchase of those securities. Repos are a type of\ncollateralized loan since the buyers are protected from default by possessing the securities. Loans of central bank funds and negotiable\ncertificates of deposit are not collateralized and therefore expose the lenders to more credit risk.\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 68, "q": "When a hedge fund engages in a reverse repurchase agreement, which of the following is the most likely purpose?", "opts": ["Earn interest on cash holdings", "Speculate on increasing security prices", "Obtain securities to deliver on a short sale"], "ans": "C", "expl": "Repurchase agreements (repos) and reverse repurchase agreements (reverse repos) have identical structures. In both transactions, the\ncounterparties agree to an initial exchange (ie, sale) of securities for cash. The initial exchange is conditioned on the original security holder's\npromise to buy them back (ie, repurchase agreement).\nRepos are economically equivalent to a loan of cash collateralized by securities. In the repo diagram, the insurance company lending cash is not\nconcerned with the specific security received, only that it is adequate collateral. The reverse repo has a different motivation: the hedge fund is\nborrowing a specific security and providing cash collateral in return. Reverse repos are often the least expensive method for borrowing securities\nneeded to complete a short sale.\nA short sale is a sale of securities the seller does not own. Nonetheless, the securities must be delivered, which is the motivation for the hedge\nfund doing a reverse repo. Short sales may be done to speculate on declining prices or to hedge long positions.\n(Choice A) The hedge fund would use a repurchase agreement to earn interest since repo rates are higher than interest rates on reverse repos.\n(Choice B) The sale and repurchase prices in repos and reverse repos are set at transaction initiation, so neither transaction entails a direct\nspeculation on the related security price.\nThings to remember:\nReverse repos are a loan of specific securities collateralized by cash that are often used to obtain securities to deliver on a short sale (ie, the sale\nof a security not owned).\nCompare short-term funding alternatives available to corporations and financial institutions.", "qhtml": null}, {"n": 69, "q": "The repo margin most accurately describes:", "opts": ["the rate of return earned by the repo lender.", "the difference between the market value of the collateral and the amount loaned.", "the amount of additional collateral required by the repo lender in addition to the repo collateral."], "ans": "B", "expl": "A repurchase agreement (ie, repo) is a type of short-term debt. It is structured as the sale of an asset, typically a high-quality, short-term bond\nthat the seller agrees to repurchase at a future date for a specified amount. Since the terms of the agreement are known in advance, a repo can\nbe viewed as a short-term secured loan. The repo seller is the borrower and the repo buyer is the lender.\nThe lender is exposed to the risk that the borrower will be unable to repurchase the asset when the agreement matures. Although the buyer can\nsell the collateral if the seller defaults, it is possible that its market value will have declined from when the repo was initiated. To mitigate this risk,\nthe amount loaned is less than the value of the collateral. The difference is the repo margin. In the example above, the repo margin is $1,010\n− 1,000 = $10.\n(Choice A) The repo rate is the lender's return from the transaction (ie, the repurchase agreement's interest rate). In the example above, the\nprice ($2 higher) that the seller pays to repurchase the asset is equivalent to the interest on the original $1,000 loan. In this case the repo rate is\n0.2% for the two-month period, or 1.2% annually.\n(Choice C) The financial instrument that the buyer purchases is the only collateral in a repo. The repo margin is a form of credit enhancement for\nthe loan, but it is not additional collateral.\nThings to remember:\nA repurchase agreement (ie, repo) is a type of short-term debt. It is structured as a sale of an asset that the seller agrees to repurchase at a future\ndate for a predetermined price. The repo margin is the difference between the value of the purchased asset (ie, the loan collateral) and the\namount paid for the asset (ie, the loan).\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 70, "q": "Which of the following is most likely considered a contingency provision for a corporate bond?", "opts": ["The issuer's ability to call the bond prior to maturity", "An increase in the bond's coupon rate if the issuer's credit rating declines", "The bondholder's right to sell the bond to another investor prior to maturity"], "ans": "A", "expl": "Typical bond contingency provisions\nCallability Issuer has right to redeem bond before maturity\nPutability Bondholder can require issuer to redeem bond before maturity\nBondholder can convert bond into a predetermined number of issuer's\nConvertibility\ncommon shares\nBonds with contingency provisions combine the cash flows of a debt security with an embedded option. Contingency provisions give either\nbondholders or issuers the right to take some action that alters the bond's cash flows.\nExercise of call or put provisions shortens the period over which coupons are paid. In addition, calling a bond may require paying a\npremium over par value.\nConversion of a bond may shorten the period over which coupons are paid and always results in an exchange of securities for the converted\nbond rather than retiring it with cash.\nA common contingency provision in indentures gives issuers the right to force bondholders to surrender their securities (ie, call the bond) prior to\nmaturity.\n(Choice B) An increase in coupon rate due to a credit rating decline does alter a bond's cash flows, but this is not considered a contingency\nprovision. Instead, the change in cash flows is triggered by an event specified in the indenture, not by the issuer or bondholders exercising some\nright.\n(Choice C) Bondholders generally have the right to sell their bonds to other investors in the secondary market prior to maturity, but that right is not\na contingency provision since the sale would not alter the cash flows payable by the issuer.\nThings to remember:\nContingency provisions give either bondholders or issuers the right to take some action that alters the bond's cash flows. Bonds with contingency\nprovisions have an embedded option; exercising that option alters the bond's cash flows. Three common types of contingency provisions result in\nbonds that are either callable, putable, or convertible.\nContrast the long-term funding of investment-grade versus high-yield corporate issuers.", "qhtml": null}, {"n": 71, "q": "Which of the following factors most likely impacts repo margin requirements?", "opts": ["Counterparty risk", "Central bank policy rate", "Interest rates on alternative financing sources"], "ans": "A", "expl": "Factors affecting repo margin\nCollateral quality The higher the quality of collateral, the lower the margin\nCollateral demand Lower margin is required if specific collateral is in high demand\nLength The longer the term of the repo, the higher the margin\nCounterparty risk Higher creditworthiness of counterparty, lower margin required\nA repurchase agreement (ie, repo) is structured as the sale of an asset, typically a high-quality bond (eg, treasury, agency) that the seller agrees to\nrepurchase at a future date for a specified amount. Since the terms of the agreement are known in advance, a repo is a type of short-term\ncollateralized loan. The repo seller is the borrower (ie, collateral provider) and the repo buyer (ie, cash provider) is the lender.\nThe lender is exposed to the risk that the borrower will be unable to repurchase the asset when the agreement ends. Although the buyer can sell\nthe collateral in the market if the seller defaults, it is possible that the market value will have declined since the repo was initiated. To mitigate this\nrisk, the value of the collateral is greater than the amount loaned. The difference is the repo margin, which is expressed as a percentage of the\nvalue of the loan (eg, 102%, 105%).\nThe amount of the repo margin depends upon the quality of the collateral, the demand for specific collateral, the term of the repo, and the\ncounterparty's creditworthiness.\n(Choices B and C) The central bank policy rate and the interest rate on alternative sources of financing affect the repo rate, not the repo margin.\nThings to remember:\nA repo margin is the difference between the value of a cash loan and the value of the collateral. The amount of the repo margin depends upon the\nquality of the collateral, the demand for specific collateral, the term of the repo, and the counterparty's creditworthiness.\nDescribe repurchase agreements (repos), their uses, and their benefits and risks.", "qhtml": null}, {"n": 72, "q": "One source of funds for making interest and principal payments on nonsovereign bonds is most likely:", "opts": ["a special tax or fee established for that purpose.", "the operating cash flows of a private corporation.", "income from the loan portfolios of the supranational entity."], "ans": "A", "expl": "Nonsovereign government bonds (ie, nonsovereigns) are issued by government entities subordinate to national governments (eg, states,\nprovinces, prefectures, or cities). Nonsovereigns are not normally guaranteed by the associated national government. In the U.S., these bonds\nare known as municipal bonds, have specific tax exemptions, and may be issued to fund specific projects like schools, bridges, or expressways.\nInterest and principal on such bonds are paid from the:\ngeneral taxing authority of the municipality (eg, property taxes, sales taxes)\nrevenue generated by the project funded (eg, tolls)\nspecial fees or taxes established to pay the bonds' interest and principal\nSince the creditworthiness and financial discipline of local government entities vary greatly, nonsovereign bonds have a range of credit ratings,\nand, therefore, yields; nonsovereigns guaranteed by the associated national government trade at a lower yield due to higher quality.\n(Choice B) Nonsovereigns are issued by governments below the national level, not by corporations.\n(Choice C) Funding interest and principal payments from the loan portfolio of a supranational entity describe bonds issued by a supranational\norganization like the World Bank or European Investment Bank.\nThings to remember:\nNonsovereign bonds are issued by government entities subordinate to national governments. These bonds may be issued to fund specific\nprojects like schools, bridges, or expressways. Interest and principal on such bonds are paid from general taxing authority, project revenue, or\nspecial fees and taxes established to fund the bonds.\nDescribe funding choices by sovereign and non-sovereign governments, quasi-government entities, and supranational agencies.", "qhtml": null}, {"n": 73, "q": "Bonds issued by the World Bank are best described as:", "opts": ["sovereign bonds.", "supranational bonds.", "quasi
