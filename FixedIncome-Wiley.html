pread would be for an equivalent noncallable bond. The\ncallable bond's OAS is used to calculate an option-adjusted price and yield, allowing better comparisons with other securities.\n(Choices A and C) The G- and I-spreads are based on the difference between a bond's YTM and a benchmark rate of the same maturity (eg, 5-\nyear corporate bond versus a 5-year government bond or swap). Since these spreads are computed separately for each maturity, they widen as\nmaturities increase, reflecting the greater relative risk of corporate securities for longer time horizons.\nThings to remember:\nA callable bond's option-adjusted spread (OAS) is calculated by subtracting the value of the embedded option (in basis points per year) from the\nbond's Z-spread. The OAS is used to estimate the bond's option-adjusted price and yield to facilitate comparisons with other bonds.\nCompare, calculate, and interpret yield and yield spread measures for fixed-rate bonds.", "qhtml": null}, {"n": 114, "q": "A three-year, zero-coupon bond is priced at 80 per 100 of par value. The annual yield-to-maturity (YTM), stated with a periodicity of 6, is closest to:", "opts": ["95.90", "96.07", "97.50 Explanation HP 12c TI BA II Plus A bond's no-arbitrage (ie, arbitrage-free) value is calculated by discounting each cash flow by the spot rate corresponding to when that cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null}, {"n": 115, "q": "An analyst gathers the following data for two bonds: Based on a periodicity of 2, the difference between the YTM values of the two bonds is closest to:", "opts": ["95.90", "96.07", "97.50 Explanation HP 12c TI BA II Plus A bond's no-arbitrage (ie, arbitrage-free) value is calculated by discounting each cash flow by the spot rate corresponding to when that cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the y 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null}, {"n": 120, "q": "A government spot-rate curve is shown below: Maturity 1-year 2-year 3-year Rate 3.75% 5.15% 6.00% If a 3-year, 5% annual-pay nongovernment bond has a zero-volatility spread of 55 basis points and a par value of 100, the highest arbitrage-free price that an investor should be willing to pay for the bond (per 100 par value) is closest to:", "opts": ["95.90", "96.07", "97.50 Explanation HP 12c TI BA II Plus A bond's no-arbitrage (ie, arbitrage-free) value is calculated by discounting each cash flow by the spot rate corresponding to when that cash flow occurs. Since spot rates are derived from a yield curve for government bonds, which are default-free, the rates do not reflect a nongovernment bond's credit risk. Therefore, the no-arbitrage value is, in general, higher than the bond's market price. To equate a bond's arbitrage-free price with its market price, an identical extra yield called the zero-volatility spread (ie, Z-spread) is added to each spot rate. The Z-spread reflects the additional compensation needed for the risks of investing in a nongovernment bond. This means that the appropriate discount rate for each cash flow is the applicable spot rate plus the Z-spread, as shown below: (Choice A) 95.90 results from discounting each cash flow by 0.0655, which is the sum of the 3-year spot rate and the 55-basis-point Z-spread. (Choice C) 97.50 results from discounting each cash flow at its applicable spot rate but neglecting to add the Z-spread to each rate. Things to remember: The arbitrage-free price of a bond is obtained by discounting each of the bond's cash flows by the applicable spot rate. Since spot rates are derived from a government bond yield curve, they do not account for a nongovernment bond's credit risk. Adding an identical extra yield (ie, Z- spread) to each spot rate equates the present value to the bond's market price. Compare, calculate, and interpret yield and yield spread measures for fixed-rate bonds. LOS Copyright © UWorld. Copyright CFA Institute. All rights reserved."], "ans": "B", "expl": "", "qhtml": null}, {"n": 121, "q": "A floating-rate note has a quoted margin of 35 basis points (bps) and a discount margin of −15 bps. If the relevant reference rate is 3.25% on the bond's reset date, the new coupon rate is most likely:", "opts": ["3.10%", "3.45%", "3.60%"], "ans": "C", "expl": "The coupon rate of a floating-rate note (ie, FRN or floater) is based on a reference rate (eg, LIBOR). The quoted margin is the yield that is\nadded to the reference rate to determine each period's coupon rate. The quoted margin typically does not change during the life of the bond. The\ncoupon rate of the FRN in this scenario is the LIBOR rate plus 35 basis points (bps), or 3.25% + 0.35% = 3.60%.\nThe discount margin of an FRN (also called the required margin) is an adjustment to the rate used to discount the bond's cash flows. The\ndiscount margin represents the additional yield required given the risks of an FRN. When the bond is issued, the discount margin is the same as\nthe quoted margin, but changes in the bond's risks cause the discount margin to change. Any change in the discount margin affects the bond's\npresent value, not its coupon rate.\n(Choice A) 3.10% results from adding the discount margin (−15 bps), rather than the quoted margin, to the reference rate.\n(Choice C) 3.45% results from inappropriately adding the sum of the quoted margin and discount margin (20 bps) to the reference rate.\nThings to remember:\nThe quoted margin is an amount of yield added to a reference rate (eg, LIBOR) to derive the coupon rate of a floating-rate note (FRN). The\nquoted margin typically does not change during the life of the bond. The discount margin, which represents the additional yield investors require to\ncompensate for the risks of an FRN, will change if the risks change. Any change in the discount margin affects the bond's present value, not its\ncoupon rate.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 122, "q": "A 4%, annual-pay bond is currently priced at 105 per 100 of par value. It has three years to maturity and is callable at a price of 102.5 at the end of Year 1 and 100.5 at the end of Year 2. The yield-to-worst is the bond's:", "opts": ["yield to maturity.", "yield to first call.", "yield to second call."], "ans": "B", "expl": "A bond's present value is calculated by discounting its expected cash flows using its required return (ie, YTM). One of the assumptions underlying\nYTM is that the bond is held to maturity; however, this assumption may not always hold for callable bonds, which the issuer can redeem before\ntheir scheduled maturity.\nOnce called, a bond has no future cash flows, so its yield is calculated as though it will be called on its call date, with the call price substituted for\nits face value. For bonds with multiple call dates, a separate yield is calculated for each date, and each yield is referred to as the yield to first call,\nyield to second call, etc. The yield-to-worst is the lowest yield for all possible call dates as well as the YTM.\nThe bond in this question can be called at the end of Year 1 or Year 2. Each yield-to-call can be computed using a financial calculator. The\ncalculator strokes are shown below. The bond's yield to first call of 1.43%, which is the lowest of the three possible yields, is its yield-to-worst.\n(Choice A) 2.26% is the bond's yield to maturity.\n(Choice C) 1.68% is the bond's yield to second call.\nThings to remember:\nA callable bond may be redeemed before maturity, so its yield is calculated using the call date as the maturity date. When bonds have multiple call\ndates, the yield for each date is calculated separately and referred to as the yield to first call, yield to second call, etc. The lowest yield for all the\npossible yields is called the yield-to-worst.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 123, "q": "A bond's current price is 95 per 100 par value. Its current yield is best described as its annual coupon payments divided by its:", "opts": ["flat price.", "full price.", "par value."], "ans": "A", "expl": "A bond's yield describes and quantifies its return. There are several types of yields used for bonds. One measure is its current yield, which is\nthe bond's annual coupon payments divided by its flat price (ie, the price usually quoted by dealers, which does not account for accrued\ninterest).\nCurrent yield has two main drawbacks that limit its usefulness in analyzing or comparing bonds:\nIt accounts only for interest payments, so it ignores a bond's capital appreciation (or loss) and is also ineffective for bonds that do not pay\ninterest (ie, zero-coupon bonds).\nIt fails to include accrued interest in the denominator, which has the effect of making current yield too high. A bond's full price is its flat price\nplus accrued interest (Choice B).\n(Choice C) Coupon interest divided by par value is a bond's coupon rate.\nThings to remember:\nCurrent yield is a bond's annual coupon interest divided by its flat price. Current yield is not particularly useful for comparing bonds since the\nnumerator ignores any capital appreciation, and the denominator fails to account for accrued interest.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 124, "q": "A two-year floating-rate note makes quarterly payments at 3-month LIBOR plus 50 basis points (bps). The floater is priced at 98.75 per 100 of par value, and the current 3-month LIBOR is 1.5%. Assuming a 30/360 day-count convention and evenly spaced periods, the discount margin is closest to:", "opts": ["66 bps", "114 bps", "264 bps"], "ans": "B", "expl": "Floating-rate notes (FRNs, or floaters) are debt instruments that make periodic interest payments based on a reference rate, such as LIBOR,\nplus a quoted spread (ie, quoted margin). The price of an FRN equals the sum of its discounted future payments, with the discount rate\n(discount factor) equaling the reference rate plus a discount margin (ie, required margin).\nCompared with an FRN, the reference rate plus the quoted margin is analogous to the coupon rate, and the reference rate plus the discount\nmargin is analogous to the YTM.\nTo solve for the discount margin, first calculate the discount factor, then use that to derive the discount margin.\n1. Calculate discount factor (reference calculator tabs):\n2. Use discount factor to find discount margin:\n(Choice A) 66 bps is the discount factor, not the discount margin. The discount factor equals the sum of the reference rate and the discount\nmargin divided by the number of periods per year.\n(Choice C) 264 bps results from not subtracting the reference rate (0.015) from the product of the discount factor and the number of annual\npayments.\nThings to remember:\nFloating-rate notes (FRNs, or floaters) are debt instruments that make periodic interest payments based on a reference rate plus a quoted spread\n(ie, quoted margin). The price of an FRN equals the sum of its discounted future payments, where the discount factor is based on the reference\nrate plus a discount margin that reflects market return expectations.\nCalculate and interpret yield spread measures for floating-rate instruments. LOS\n5. With respect to an investor's rate of return, a money market instrument's discount rate most likely:\n A. understates return.\nB. fairly states return.\nC. overstates return.\nExplanation\nMoney market securities (eg, US Treasury bills) are highly liquid investments that mature in less than one year. They are frequently purchased at\na discount to face value. Returns for money market securities can be quoted on an annualized basis as money market yields (MMY) or bond\nequivalent yields, which are both derived using purchase price (ie, present value) as the denominator.\nIn contrast, the quoted \"discount rate\" (ie, discount basis yield) is derived from using the face value as a denominator. Since the face value is\nlarger than the purchase price (ie, larger denominator), the discount basis yield will be lower than the MMY (proxy for investor returns).\nConsequently, quoted discount rates on MMY understate investor returns (Choices B and C).\nThings to remember:\nA money market discount rate is calculated as a percentage of the money market instrument's face value. Thus, it understates the investor's rate\nof return, which is a percentage of the instrument's purchase price (ie, present value).\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 125, "q": "With respect to an investor's rate of return, a money market instrument's discount rate most likely:", "opts": ["understates return.", "fairly states return.", "overstates return."], "ans": "A", "expl": "Money market securities (eg, US Treasury bills) are highly liquid investments that mature in less than one year. They are frequently purchased at\na discount to face value. Returns for money market securities can be quoted on an annualized basis as money market yields (MMY) or bond\nequivalent yields, which are both derived using purchase price (ie, present value) as the denominator.\nIn contrast, the quoted \"discount rate\" (ie, discount basis yield) is derived from using the face value as a denominator. Since the face value is\nlarger than the purchase price (ie, larger denominator), the discount basis yield will be lower than the MMY (proxy for investor returns).\nConsequently, quoted discount rates on MMY understate investor returns (Choices B and C).\nThings to remember:\nA money market discount rate is calculated as a percentage of the money market instrument's face value. Thus, it understates the investor's rate\nof return, which is a percentage of the instrument's purchase price (ie, present value).\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 126, "q": "One year ago, an investor purchased a 3-year bond with a 6% semiannual coupon. The purchase price was 95. The bond is currently trading at a flat price of 99. The bond's current yield is closest to: ", "opts": ["6.1%", "6.3%", "6.5%"], "ans": "A", "expl": "The current yield is the total of one year's coupon payments divided by the bond's flat price. The flat price is the quoted price, which\nexcludes any accrued interest. Current yield as a return measure is advantageous because it is quick and easy to calculate. In this scenario, the\nbond has a 6% semiannual coupon, so there are 2 coupon payments of 3 (ie, 3% of 100 par) per year. The current yield is calculated as:\nAs a rate of return measure for an investor, current yield is a very rough approximation since current yield does not account for:\nany capital appreciation in the bond's price; or\nany accrued interest paid by the investor at purchase; or\nthe compounding effect of the frequency of coupon payments.\n(Choice B) 6.3% is the bond's current yield at the time of the bond purchase, based on the price of 95 per 100 par value.\n(Choice C) 6.5% is the bond's yield-to-maturity based on a price of 99.\nThings to remember:\nThe current yield of a bond is determined by summing the coupon payments for one year and dividing by the bond's flat price. Current yield is a\nvery rough measure of rate of return to an investor since it does not capture the effect of capital appreciation of the bond over time, accrued\ninterest, or the frequency of coupon payments.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 127, "q": "A 2-year floating rate note is priced at 98 per 100 par value and pays interest quarterly based on the 3-month LIBOR. It has a discount margin of 50 basis points (bps) and uses a 30/360 day-count convention. If the three-month LIBOR is 3% throughout the life of the bond, the quoted margin is closest to:", "opts": ["- 153 bps.", "- 54 bps.", "50 bps."], "ans": "B", "expl": "Floating rate debt instruments (ie, floaters or FRNs) do not pay a fixed coupon. Instead, coupon payments are based on a reference rate such as\nLIBOR, which can fluctuate from one coupon period to the next.\nThe present value of a floater is calculated as the sum of its discounted cash flows. The formula shows the required inputs. Two variables—the\nquoted margin and discount margin—affect the present value of each payment:\nTo determine the quoted margin, calculate the coupon payment using a financial calculator. Each quarterly payment for this bond is approximately\n0.6151 per 100 par value, with a coupon rate of 0.6151% per quarter, since the bond's quarterly yield is 0.8750% (based on an annual yield of\n3.5%, the sum of the 3-month LIBOR of 3% and the discount margin of 0.5%). Once the payment is known, the quoted margin in terms of basis\npoints (bps) is calculated using the formula shown above:\nThis means that the bond's interest payment is the 3-month LIBOR minus 54 bps. The quoted margin can be positive or negative.\n(Choice A) - 153 bps is the quoted margin if the coupon payments are discounted by specifying the denominator in the present value formula as\n(1 – discount margin)n instead of (1 + discount margin)n.\n(Choice C) 50 bps is the quoted margin that makes the bond's price equal to par value.\nThings to remember:\nA floating rate bond's coupon payments fluctuate according to the reference rate used for the bond's coupon rate. The quoted margin and the\ndiscount (ie, required) margin are two variables that affect the present value of a floating rate note. The quoted margin determines how interest\npayments are calculated, whereas the discount margin affects the discounted value of each payment.\nCalculate and interpret yield spread measures for floating-rate instruments.\n8.A T-bill with 121 days to maturity has a 360-day assumed year and a USD 1 million par value. If it is currently priced at USD 988,176, then its\ndiscount rate is closest to:\nA. 1.18%\n B. 3.52%\nC. 3.56%\nExplanation\nA money market interest rate is expressed as either a discount rate or an add-on rate. Both are annualized rates. A discount rate is a percentage\nof the future value (ie, par value) of the instrument; it applies to money market investments sold at a discount. An add-on rate is a percentage of\nthe bond's present value or price. The discount rate of a money market instrument is calculated as the change in value (FV − PV) divided by\nfuture value. The rate is annualized by multiplying it by the instrument's periodicity (days in the year ÷ days in the period).\nIn this scenario, the days in the period are equal to the days until maturity. The money market discount rate is calculated as:\nUnlike a bond market discount rate or a yield to maturity, which are each percentages of a present value, a money market discount rate is a\npercentage of a future value, annualized by multiplying the change in value (FV − PV) by the periodicity. In contrast, investors measure their rate\nof return as a percentage of the amount being invested. This means that the money market discount rate understates the investor's rate of return,\nwhich is a percentage of the present value, not the future value.\n(Choice A) 1.18% results from not annualizing the rate. After determining (FV − PV) ÷ FV, multiply by (days in the year ÷ days until maturity),\nusing the correct year convention (ie, 360 or 365). This will determine the correct annualized discount rate.\n(Choice C) 3.56% results from dividing by the present value to find the periodic interest rate. This is the equivalent of calculating an add-on rate.\nDiscount rates for money market instruments are calculated by dividing by the instrument's future value, not its present value.\nThings to remember:\nA money market discount rate is a percentage of the future value (ie, par value) of the instrument; it applies to money market investments sold at a\ndiscount. The discount rate of a money market instrument is calculated as the change in value (FV − PV) divided by future value. The rate is\nannualized by multiplying it by the instrument's periodicity (days in the year ÷ days in the period).\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 128, "q": "A T-bill with 121 days to maturity has a 360-day assumed year and a USD 1 million par value. If it is currently priced at USD 988,176, then its discount rate is closest to:", "opts": ["1.18%", "3.52%", "3.56%"], "ans": "B", "expl": "A money market interest rate is expressed as either a discount rate or an add-on rate. Both are annualized rates. A discount rate is a percentage\nof the future value (ie, par value) of the instrument; it applies to money market investments sold at a discount. An add-on rate is a percentage of\nthe bond's present value or price. The discount rate of a money market instrument is calculated as the change in value (FV − PV) divided by\nfuture value. The rate is annualized by multiplying it by the instrument's periodicity (days in the year ÷ days in the period).\nIn this scenario, the days in the period are equal to the days until maturity. The money market discount rate is calculated as:\nUnlike a bond market discount rate or a yield to maturity, which are each percentages of a present value, a money market discount rate is a\npercentage of a future value, annualized by multiplying the change in value (FV − PV) by the periodicity. In contrast, investors measure their rate\nof return as a percentage of the amount being invested. This means that the money market discount rate understates the investor's rate of return,\nwhich is a percentage of the present value, not the future value.\n(Choice A) 1.18% results from not annualizing the rate. After determining (FV − PV) ÷ FV, multiply by (days in the year ÷ days until maturity),\nusing the correct year convention (ie, 360 or 365). This will determine the correct annualized discount rate.\n(Choice C) 3.56% results from dividing by the present value to find the periodic interest rate. This is the equivalent of calculating an add-on rate.\nDiscount rates for money market instruments are calculated by dividing by the instrument's future value, not its present value.\nThings to remember:\nA money market discount rate is a percentage of the future value (ie, par value) of the instrument; it applies to money market investments sold at a\ndiscount. The discount rate of a money market instrument is calculated as the change in value (FV − PV) divided by future value. The rate is\nannualized by multiplying it by the instrument's periodicity (days in the year ÷ days in the period).\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 129, "q": "Interest rates of different money market instruments are best compared using their:", "opts": ["quoted yields.", "periodic interest rates.", "bond equivalent yields."], "ans": "C", "expl": "Money market instrument conventions and bond-equivalent yield\nMoney market\nFeature Variation\nbond-equivalent yield\nDay-count convention 360-day or 365-day 365-day\nRate types Discount rate or add-on rate Add-on rate\nPeriodicities Various Annualized\nMoney market instruments are short-term debt securities with maturities of 1 year or less. Analysis of money market instruments can be\nchallenging, since quoting conventions vary among different money market instruments. Money market instruments may use different day count\nconventions (eg, 360-day versus 365-day year), rate types, and/or periodicities.\nOne way of comparing yields of money market instruments with different conventions is to convert rates to an annualized 365-day-count\nadd-on rate, which is known as the money market instrument bond equivalent yield. This conversion makes the yields of instruments with\ndiffering conventions comparable.\n(Choice A) Since quoting conventions vary, the quoted yields of money market instruments are not comparable. This results in needing a way to\ncompare instruments with different quoting conventions.\n(Choice B) The periodic interest rates of different money market instruments are not annualized, and each instrument may have a different\nperiodicity. Therefore, the periodic interest rates of money market instruments may not be comparable.\nThings to remember:\nDiffering money market conventions (including different day-count conventions, rates types, and periodicities) make comparing money market\ninstruments challenging. The money market bond equivalent yield (the 365-day add-on rate) is a way to effectively compare money market\ninstruments yields.\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 130, "q": "A two-year floating-rate note pays three-month Libor plus 15 basis points. The floater is priced at 99.60 per 100 par value, three-month Libor is currently 1.45%, and the coupon reset today. Assuming a 30/360 day-count convention and quarterly coupon payments, the discount margin in basis points (bps) is closest to:", "opts": ["35 bps", "40 bps", "45 bps"], "ans": "A", "expl": "A floating-rate note (FRN) is a debt instrument with an interest rate that resets periodically, so that the interest rate and payments are \"floating\" and\nnot fixed. The interest rate is based on a reference rate, such as LIBOR, plus a quoted margin, which compensates the investor for the credit risk\nof the issuer.\nThe price of an FRN is its discounted future payments, where the discount factor is based on the reference rate plus a discount margin. The\ndiscount margin represents the market's required spread to price the FRN at par on the reset date.\nTo solve for the discount margin, first calculate the discount factor and then use that to derive the discount margin.\n1. Calculate the discount factor (using a financial calculator):\n2. Use the discount factor to find the discount margin:\n(Choice B) 40 bps is the difference between the market price and par value, not the discount margin.\n(Choice C) 45 bps is the periodic discount factor, not the discount margin. The periodic discount factor equals the sum of the reference rate and\nthe discount margin (180 bps) divided by the number of periods per year (4).\nThings to remember:\nA floating-rate note (FRN) is a debt instrument with an interest rate that resets periodically and is based on a reference rate, such as LIBOR, plus\na quoted margin. The price of an FRN is its discounted future payments, where the discount factor is based on the reference rate plus a discount\nmargin that reflects the market's required return.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 131, "q": "Of the following, the government equivalent yield best describes yield to maturity (YTM):", "opts": ["restated from a 30/360 day-count basis to an actual/actual day-count basis.", "calculated based on the actual dates that the bond pays interest and principal.", "calculated by assuming that interest and principal are paid on their scheduled dates."], "ans": "A", "expl": "A bond's yield describes and quantifies its return. One yield measure used for corporate bonds is the government equivalent yield. Many\ncorporate bonds use a 30/360 day-count convention, whereas government bonds, particularly US Treasury notes and bonds, use an actual/actual\nday-count convention. Each bond's YTM is based on its day-count convention, so the yields cannot be directly compared.\nThe government equivalent yield results from converting a corporate bond's YTM, which is based on a 30/360-day basis, to the YTM based on the\nactual/actual basis of a government bond. This makes the yields directly comparable and shows the additional yield required to compensate\ninvestors for the corporate bond's additional risk.\n(Choice B) The true yield is similar to the yield obtained from using the street convention but is modified to account for the actual day that a\npayment occurs (eg, an interest payment scheduled for a Sunday is instead made on the following Monday).\n(Choice C) The street convention is a bond's YTM calculated under the assumption that all payments are made on their scheduled dates,\nregardless of whether a scheduled date is a trading day.\nThings to remember:\nMany corporate bonds use a 30/360 day-count convention to calculate YTM, whereas government bonds, particularly US Treasury notes and\nbonds, use an actual/actual day-count convention. The government equivalent yield results from converting a YTM based on a 30/360 day-count\nconvention to a YTM based on an actual/actual convention.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 132, "q": "Using a 30/360 day-count convention, the discount rate for 90-day commercial paper currently priced at 99 per 100 par value is closest to:", "opts": ["4.00%", "4.04%", "4.06%"], "ans": "A", "expl": "Yield conventions for money market instruments\nMoney market instruments are short-term debt with maturities ranging from overnight to one year. Yields for money market instruments are\nstated on a noncompounded (ie, simple) basis. The time value of money functions on both approved calculators (HP 12C and TI BAII) do not work\nwhen interest is not compounded, so it is important to know the formula shown above.\nIn the formula above, the first term in the formula above (days in year divided by days to maturity) is used to annualize the rate. The second term\n(interest earned divided by the future value) is the interest rate.\nFor money market instruments quoted on a discount rate basis (eg, commercial paper, treasury bills), future value (FV) is typically the face value\npaid at maturity (eg, 100) and is greater than the present value (PV). When divided by the larger FV amount, the discount rate most likely\nunderstates an investor's return compared with measures that divide by the PV, such as the add-on rate for money market instruments (eg,\ncertificates of deposit).\n(Choice B) 4.04% is the add-on rate using a 360-day year, which results from incorrectly dividing the interest earned by the PV of 99 instead of\nthe FV of 100.\n(Choice C) 4.06% results from incorrectly using 365 for the number of days in the year instead of the given 360.\nThings to remember:\nThe discount rate for a money market instrument equals the quantity (days in year divided by days to maturity) multiplied by the interest rate\n(interest earned divided by the future value). For money market instruments quoted on a discount rate basis (eg, commercial paper), the future\nvalue (FV) is typically the face value paid at maturity.\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 133, "q": "A floating-rate note will most likely be priced at a premium when the quoted margin is:", "opts": ["less than the discount margin.", "greater than the reference rate.", "greater than the discount margin."], "ans": "C", "expl": "Floating-rate notes (FRN [ie, floaters]) are debt instruments that make interest (coupon) payments based on a reference rate, which can fluctuate\nfrom one period to the next. The reference rate is typically a short-term, low-risk money market rate, such as LIBOR.\nSince FRN investors may face additional credit risk, a quoted yield spread (ie, quoted margin) is added to the reference rate to compensate for\nthis risk. The discount margin (ie, required margin) reflects investor return expectations and is used for discounting future interest payments to the\npresent value of the FRN.\nAn FRN will trade at a premium if the quoted margin that the issuer pays is greater than the required margin that the market demands. This is\nsimilar to a fixed-rate bond, which sells at a premium when the coupon rate is greater than its YTM.\n(Choice A) The FRN will trade at a discount, not premium, when the quoted margin is less than the discount margin.\n(Choice B) The size of the quoted margin relative to the reference rate has no bearing on whether an FRN trades at a premium or discount.\nThings to remember:\nA floating-rate note will trade at a premium if the quoted margin that the issuer pays is greater than the required margin that the market demands.\nThis is similar to a fixed-rate bond, which sells at a premium when the coupon rate is greater than its YTM.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 134, "q": "An analyst has compiled the following information to compare the yields of three money market instruments: Investment X Investment Y Investment Z Day count 360 360 365 Term (in days) 180 90 30 Quoted rate 6.15% 6.20% 6.30% Rate type Add-on Discount Add-on If the credit risks are the same, the instrument that offers the highest rate of return is:", "opts": ["Investment X.", "Investment Y.", "Investment Z."], "ans": "B", "expl": "Analysis of money market instruments is made difficult by the variety of features and quoting conventions. Different times-to-maturity, types of\ninterest rates (ie, discount versus add-on), and periodicities will complicate comparisons. One way to simplify comparisons is to convert rates\nto a bond equivalent yield (ie, investment yield). The bond equivalent yield for money market instruments is the rate stated as a 365-day add-on\nrate, which—unlike a discount rate—is quoted as a percentage of present value rather than future value, and therefore represents an investor's\nannualized rate of return.\nIn this scenario, the money market instruments are quoted using different types of interest rates, either add-on or discount, and using either a 360-\nday or a 365-day year convention. Investment Z is quoted on a 365-day add-on basis, so it is already stated as a money market bond equivalent\nyield.\nInvestment X is quoted with an add-on rate, but its year convention is 360. The investment's bond equivalent yield (365-day add-on rate) is\ncalculated as follows:\nInvestment Y is quoted with a 360-day discount rate. It is converted to a 365-day add-on rate as follows:\nBond equivalent yield\n(365-day add-on rate)\nInvestment X 6.24%\nInvestment Y 6.39%\nInvestment Z 6.30%\nAfter conversion to the bond equivalent yield, it becomes clear that Investment Y has a higher annualized rate of return than Investment X (Choice\nA) or Investment Z.\n(Choice C) Investment Z has the highest quoted rate. However, the quoted rates are misleading in this case, since the day-count conventions\nand rate types are not equivalent and therefore not comparable.\nThings to remember:\nAnalysis of money market instruments is made difficult by the variety of features and quoting conventions. Comparisons can be facilitated by\nconverting interest rates to a bond equivalent yield. The bond equivalent yield for money market instruments is the 365-day add-on rate.\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 135, "q": "A floating-rate note (FRN) pays semiannual coupons based on six-month LIBOR + 0.5% and has a discount margin of 65 basis points at its reset date, 2 years from maturity. If LIBOR is at 4.5%, the FRN's discount on the reset date is closest to:", "opts": ["0.15", "0.28", "0.53"], "ans": "B", "expl": "A floating-rate note's (FRN's) coupon payments change based on a reference rate. The quoted margin is the amount added to the reference rate\nto determine the FRN's coupon. If the note's semiannual coupons are based on six-month LIBOR plus 0.50%, the quoted margin is 50 bps. The\nquoted margin, which is set at issuance and does not change, compensates the bondholder for the credit risk of the issuer at issuance.\nHowever, the credit risk may change after issuance. The required margin (in practice called discount margin) is the interest spread in\naddition to the reference rate required to compensate bondholders for the bond's credit risk such that the bond would be priced at par. If the\nquoted margin (used to determine the coupon) is equal to the required margin (used to determine the discount rate), then the bond will be priced\nat par on its reset date. If the required margin is greater than the quoted margin, the note will be priced at a discount since the coupon payments\nare not sufficient given the note's credit risk.\nIn this scenario, the FRN's price is determined using a financial calculator as follows:\nThe FRN is priced at a discount of 100 − 99.7184 ≈ 0.28. Note that the discount pricing (ie, the amount the price is below par) of the bond is a\nseparate concept from the discount margin discussed above.\n(Choice A) 0.15 is the discount of the note calculated incorrectly using 4, instead of 2, as the periodicity over 4 periods.\n(Choice C) 0.53 is the discount of the note calculated incorrectly using 1, instead of 2, as the periodicity over 4 periods.\nThings to remember:\nIf an FRN's quoted margin is greater than its required (discount) margin, it is priced at a premium in the market on the reset date. If quoted margin\nis less than required margin, the bond is priced at a discount on the reset date.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 136, "q": "An analyst gathers the following information for three money market instruments, all with similar credit risk. Each has a maturity of 270 days: On a bond equivalent basis, which money market instrument offers the highest return?", "opts": ["Instrument A", "Instrument B", "Instrument C"], "ans": "B", "expl": "Yield conventions for money market instruments\nYields on money market instruments are quoted either as a discount rate (DR) or an add-on rate (AOR). The different methods for calculating DR\nand AOR mean that they cannot be compared directly with each other. Converting each to a bond equivalent yield allows for comparability. The\nbond equivalent yield (BEY) for money market instruments is the AOR that assumes a 365-day year.\nThe steps for calculating the 365-day AOR for the money market instruments in this question are as follows, with Instrument B offering the highest\nrate:\nThings to remember:\nMoney market yields can be quoted as a discount rate or an add-on rate (AOR) and are not directly comparable. Converting each to a bond\nequivalent yield (BEY) allows for comparability. The BEY for money market instruments is the AOR that assumes a 365-day year.\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 137, "q": "Information on two bonds is shown below: If the bonds are priced on a date when they both pay coupon interest, Bond A's annual percentage rate (APR) is most likely: ", "opts": ["less than Bond B's.", "equal to Bond B's.", "greater than Bond B's."], "ans": "A", "expl": "A fixed-coupon bond's return (ie, yield) is measured in terms of percentage. The yield depends on both the amount of each coupon payment and\nthe bond's periodicity, which refers to the number of coupon (ie, compounding) periods per year. A bond that pays coupon interest\nsemiannually has a periodicity of 2, a bond that pays monthly has a periodicity of 12, etc.\nA bond's price is the PV of its future cash flows. Each bond's cash flows are discounted at a periodic yield, thus prohibiting the comparison of\nbonds with different periodicities. Multiplying the periodic yield by the number of compounding periods in a year produces the annual percentage\nrate (APR), allowing for the comparison of APRs for bonds with different periodicities.\nIn this question, Bond A's periodicity is 2, and its semiannual yield is approximately 2.64%. Multiplying the semiannual yield by the number of\ncoupon periods (2) results in an APR of approximately 5.27%. Bond B's periodicity is 4, its periodic yield is approximately 1.41%, and its APR is\napproximately 5.65% (1.41% × 4), which is greater than Bond A's APR (Choices B and C).\nThings to remember:\nA fixed-coupon bond's return, or yield, depends on both the amount of each coupon payment and the bond's periodicity, or the number of coupon\n(ie, compounding) periods per year. Multiplying a bond's periodic yield by the number of compounding periods per year generates the bond's\nannual percentage rate.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 138, "q": "A 90-day banker's acceptance has a 365-day assumed year and is offered at USD 500,000 par value. If its redemption amount is USD 511,033 at maturity, its add-on rate is closest to:", "opts": ["2.21%", "8.75%", "8.95%"], "ans": "C", "expl": "A money market interest rate is expressed as either a discount rate or an add-on rate. Both are annualized rates. A discount rate is a percentage\nof the future value (ie, par value) of the instrument and applies to instruments sold at a discount. An add-on rate is expressed as a percentage of\nthe bond's present value or price and normally applies to instruments offered at par.\nThe money market add-on rate in this scenario is calculated by dividing the difference between the present and future values by the present\nvalue, and then multiplying by the instrument's periodicity, as follows:\nUnlike a money market discount rate, an add-on rate can be viewed as an investor's annualized rate of return on the instrument if it is held to\nmaturity. Treating the add-on rate as an investor's annual rate of return assumes that, throughout the year, the money market instrument can be\nreinvested a number of times equal to its periodicity. In this scenario, that would mean reinvesting the instrument exactly 4.055 (365 ÷ 90) times in\none year.\n(Choice A) 2.21% is the result of failing to annualize the rate by multiplying by the instrument's periodicity (4.055).\n(Choice B) 8.75% is the result of calculating the period interest rate by dividing by the future value. This is the equivalent of calculating a\ndiscount rate. Add-on rates in money markets are calculated by dividing by the present value, not the future value, of the instrument.\nThings to remember:\nA money market interest rate is expressed as either a discount rate or an add-on rate. The add-on rate of a money market instrument is calculated\nby dividing the growth (future value − present value) by the present value, and then multiplying by the instrument's periodicity (days in the year ÷\ndays of the instrument's term).\ncalculate and interpret yield measures for money market instruments", "qhtml": null}, {"n": 139, "q": "A four-year, 3% coupon bond pays interest quarterly and is priced at 87.43 per 100 of par value. Its yield of 6.60% is based on a periodic rate of 1.65%. The bond's yield based on a periodicity of 2 is closest to:", "opts": ["3.33%", "3.43%", "6.65%"], "ans": "C", "expl": "A bond's present value is calculated by discounting its expected cash flows using its required return (ie, YTM). The conventional treatment is to\ndivide YTM by a bond's periodicity, which is the bond's number of discounting periods in a year (ie, number of coupon payments per year).\nUse the formula above to convert YTM for bonds with different periodicities:\n(Choice A) 3.33% is the bond's periodic return for a 6-month period. The yield for a semiannual bond is its periodic return multiplied by two.\n(Choice B) 3.43% is the bond's current yield, which is the bond's total coupon payments each year divided by the bond's current price.\nThings to remember:\nA bond's present value is calculated by discounting its expected cash flows by its yield-to-maturity (YTM). YTM is scaled by its periodicity, which is\nthe number of discounting periods in a year. Periodicity usually corresponds to the number of coupon payments.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 140, "q": "For money market instruments, add-on rates most likely:", "opts": ["understate total return.", "are used to compute bond-equivalent yields.", "provide a money market instrument's compounded rate of return."], "ans": "B", "expl": "The return for a money market instrument is quoted either as a discount rate (DR) or an add-on rate (AOR). All money market instrument returns\nare based on simple interest, so neither DR nor AOR represents a compounded rate (Choice C).\nThe formula for calculating DR is:\nThe formula for AOR is:\nThe difference in how each rate is derived means that they cannot be compared directly to each other. Converting their returns to a bond-\nequivalent yield allows for comparability. The bond-equivalent yield is the AOR calculated using a 365-day year.\n(Choice A) Discount rates understate total return since the denominator of the future value includes all future earnings from the instrument. Add-\non rates' returns are based on the initial investment (ie, present value) and provide a better measure of the return earned by the investor.\nThings to remember:\nMoney market instrument returns are quoted as discount rates or add-on rates. Both returns are based on simple interest calculations, so neither\nrate uses compounding as a component of return. The bond-equivalent yield for any money-market instrument is its 365-day add-on rate return.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 141, "q": "A new issue of 270-day commercial paper is priced at 96 per 100 of par value. Using a 360-day year, the discount interest rate at issuance is closest to: ", "opts": ["5.33%", "5.41%", "5.56%"], "ans": "A", "expl": "Money market instruments are quoted using either discount rates or add-on interest rates. Market convention determines the interest rates used\nfor specific securities.\nDiscount securities (eg, T-bills, commercial paper, banker's acceptances) are quoted using discount rates, which are calculated based\non the face value (ie, future value) of the security: (FV − PV) / FV.\nOther money market instruments (eg, certificates of deposit, repurchase agreements) are quoted using add-on rates, which are calculated\nbased on the price (ie, present value) of the security: (FV − PV) / PV.\nA discount security is a short-maturity debt instrument issued without a coupon. Investors purchase the security at a discount to (ie, below) the\nface value, and they receive the face value at maturity. The interest earned is the difference between the purchase price (PV) and the face value\n(FV). A money market discount interest rate is a periodic rate (ie, interest earned as a percentage of the face value); the rate is annualized by\nmultiplying it by the security's periodicity:\n(Choice B) A rate of 5.41% results from inappropriately using a 365-day year.\n(Choice C) 5.56% is the add-on equivalent rate of the commercial paper, calculated by using a periodic rate based on the instrument's price (96)\nrather than its face value.\nThings to remember:\nMoney market discount rates are interest rates used to quote discount securities. A discount rate equals the interest earned as a percentage of\nthe face value, annualized to account for the security's periodicity.\nCalculate and interpret yield spread measures for floating-rate instruments.", "qhtml": null}, {"n": 142, "q": "An investor with a 5-year investment horizon observes the following annual compound spot rates: Tenor Spot Rate 1-year 2.50% 2-year 2.90% 3-year 3.20% 4-year 3.40% 5-year 3.50% Given the observed spot rates, the 3y2y implied forward rate is closest to:", "opts": ["3.55%", "3.90%", "3.95%"], "ans": "C", "expl": "Implied forward rates (IFRs), also known as forward yields, are future period interest rates that reflect the difference between spot rates of\ndifferent tenors (ie, maturities). Spot rates are the YTMs on zero-coupon bonds. The IFR for the period between two spot rates of different\nmaturities is a reinvestment rate that results in two strategies, each having an investment horizon equal to the longer-maturity spot rate, earning\nthe same rate of return.\nIn this question, given the stipulated investment horizon and spot rates, the two strategies are:\nInvest at the 3-year spot rate and then, at the end of 3 years, reinvest the maturity value at a rate equal to today's 3y2y IFR (ie, the 2-year\nrate starting 3 years in the future).\nInvest at the 5-year spot rate and hold for 5 years.\nSince IFRs are reinvestment rates that result in two strategies earning equal rates of return, forward rates are referred to as breakeven\nreinvestment rates.\nThe 3y2y IFR (ie, the 2-year forward rate starting 3 years in the future, or IFR ) is calculated as 3.95%:\n3,5 − 3\n(Choice A) 3.55% is the 1y2y IFR (ie, 2-year forward rate starting 1 year in the future).\n(Choice B) 3.90% is the 2y3y IFR (ie, 3-year forward rate starting 2 years in the future).\nThings to remember:\nAn implied forward rate (IFR) is a future period interest rate that reflects the difference between two spot rates of different tenors (ie, maturities).\nSince IFRs are reinvestment rates that result in two strategies earning equal rates of return, forward rates are referred to as breakeven\nreinvestment rates.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 143, "q": "The forward curve consists of the following rates, which are stated on a semiannual basis: Based on this information, the implied three-year spot rate is closest to:", "opts": ["7.56%", "7.72%", "9.78%"], "ans": "B", "expl": "The forward curve, also called the forward yield curve, refers to the forward rates for different maturities. The forward rates are derived from\ntoday's spot rates for different maturities. The general formula for calculating a forward rate is given as:\nThe 0y1y forward rate is the one-year forward rate that begins at time 0 (ie, today), so it is also the one-year spot rate. This means that the\nforward rates can be used to derive an implied spot rate.\nThis question requires the 0y1y, 1y1y, and 2y1y forward rates to generate the implied three-year spot rate. Since the forward rates are stated on a\nsemiannual basis, each rate must be divided by two and compounded twice (ie, squared) to produce an accurate response. The calculations that\nproduce an implied 3-year spot rate of approximately 7.72% are shown below:\nThings to remember:\nThe forward curve consists of implied forward rates across different maturities. The forward rates can be derived from known spot rates.\nHowever, if the forward rates are known, they can be used to derive the spot rates for different maturities.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates LOS\n3.An analyst gathers the following information on spot rates:\nMaturity Spot Rate\n0.5 year 1.50%\n1.0 year 1.90%\n1.5 years 2.20%\n2.0 years 2.40%\nBased on this information, the price of a two-year 3% coupon bond that pays interest semiannually is closest to:\nA. 96.64\nB. 101.16\n\nC. 101.18\nExplanation\nFixed-rate bonds pay coupons at the end of each period and return the par value with the final coupon payment; a bond's price can be estimated\nas the sum of the present value of each cash flow. Zero-coupon bonds make only a single payment at maturity, so a coupon bond can be priced\nas if it were a series of zero-coupon bonds with par values equal to the coupon bond's cash flows and maturities matching the payment of those\ncash flows.\nSpot rates are the YTM on zero-coupon bonds, so the rates provided here can be used to calculate the present values of each of the coupon\nbond's cash flows. For this scenario:\nEach periodic coupon payment is 0.03 × 100 ÷ 2 = 1.50.\nThe stated (ie, annual) spot rates are converted to periodic (semiannual) equivalent rates by dividing by the bond's periodicity (2).\n(Choice A) 96.64 results from discounting each cash flow by 1 plus the stated spot rate, therefore failing to convert the annual rates to their\nsemiannual equivalent.\n(Choice B) 101.16 results from discounting each cash flow by the semiannual equivalent of the two-year spot rate (1.2%).\nThings to remember:\nA coupon bond can be priced as if it were a series of zero-coupon bonds with par values equal to the coupon bond's cash flows and maturities\nmatching the payment of those cash flows. The individual cash flows are discounted by the YTM of a zero-coupon bond (ie, spot rate). The spot\nrate must be converted to a periodic equivalent rate for bonds with a periodicity greater than 1.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.", "qhtml": null}, {"n": 144, "q": "An analyst gathers the following information on spot rates: Maturity Spot Rate 0.5 year 1.50% 1.0 year 1.90% 1.5 years 2.20% 2.0 years 2.40% Based on this information, the price of a two-year 3% coupon bond that pays interest semiannually is closest to:", "opts": ["96.64", "101.16", "101.18"], "ans": "C", "expl": "Fixed-rate bonds pay coupons at the end of each period and return the par value with the final coupon payment; a bond's price can be estimated\nas the sum of the present value of each cash flow. Zero-coupon bonds make only a single payment at maturity, so a coupon bond can be priced\nas if it were a series of zero-coupon bonds with par values equal to the coupon bond's cash flows and maturities matching the payment of those\ncash flows.\nSpot rates are the YTM on zero-coupon bonds, so the rates provided here can be used to calculate the present values of each of the coupon\nbond's cash flows. For this scenario:\nEach periodic coupon payment is 0.03 × 100 ÷ 2 = 1.50.\nThe stated (ie, annual) spot rates are converted to periodic (semiannual) equivalent rates by dividing by the bond's periodicity (2).\n(Choice A) 96.64 results from discounting each cash flow by 1 plus the stated spot rate, therefore failing to convert the annual rates to their\nsemiannual equivalent.\n(Choice B) 101.16 results from discounting each cash flow by the semiannual equivalent of the two-year spot rate (1.2%).\nThings to remember:\nA coupon bond can be priced as if it were a series of zero-coupon bonds with par values equal to the coupon bond's cash flows and maturities\nmatching the payment of those cash flows. The individual cash flows are discounted by the YTM of a zero-coupon bond (ie, spot rate). The spot\nrate must be converted to a periodic equivalent rate for bonds with a periodicity greater than 1.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.", "qhtml": null}, {"n": 145, "q": "An analyst has compiled the following data points from a forward curve: Period Forward Rate (%) 0y1y 0.90 1y1y 1.35 2y1y 2.89 3y1y 3.42 Based on these rates, the price of a 3-year bond with 2.5% annual coupon is closest to: ", "opts": ["102.34", "104.01", "104.57"], "ans": "A", "expl": "The present value of a bond is equal to the sum of the bond's discounted cash flows. The discounting calculation usually relies on spot rates.\nHowever, the bond's value also can be calculated using the forward curve, in which each cash flow is discounted using the combination of\nforward rates that is equivalent to the appropriate spot rate.\nForward rates and spot rates are related and each can be derived from the other (as shown in the image above). However, solving for spot rates\nis not required to calculate a bond's value. Instead, the forward rates can be applied directly to solve the discount rates at each cash flow and,\nsubsequently, the present value.\nIn this scenario, since each coupon is 2.50 (100 × 0.025):\n(Choice B) 104.01 is the bond's price if 1y1y (not 0y1y) is used as the starting point of the discounting calculations.\n(Choice C) 104.57 is the bond's price if each forward rate is applied individually to each cash flow, as if they were spot rates.\nThings to remember:\nThe present value of a bond is equal to the sum of the bond's discounted cash flows. Each cash flow can be discounted using the combination of\nforward rates that is equivalent to the appropriate spot rate.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 146, "q": "A feature of spot curves is that bond yields-to-maturity most likely assume that bonds are:", "opts": ["priced at par.", "coupon bonds.", "free of default risk."], "ans": "C", "expl": "Different yield curves\nYield curve Underlying Yields\nSpot curve YTMs on zero-coupon bonds\nPar curve YTMs if the bonds are priced at par\nYTM are implied forward rates that link shorter-term, zero-\nForward curve\ncoupon bond yields to longer-term, zero-coupon yields\nYield curves are ideally constructed using bonds with the same characteristics, such as maturity, coupon rate and frequency, credit risk,\nliquidity, tax status, etc. It is unlikely that bonds fitting all these criteria will be readily available, so the most practical solution is to create a spot\ncurve using a series of government zero-coupon bonds with various maturities.\nThis is the preferred solution since these bonds have many common features: the same issuer, liquidity, and tax status. Since they are\ngovernment bonds, they are assumed to have no default risk and as zero-coupon bonds, they have no reinvestment risk.\nNote that bonds issued by any government always have some risk of default and that some sovereign issuers are riskier than others, but it is\ngenerally assumed that bonds issued by governments of certain nations are effectively free of default risk.\n(Choice A) A par curve is designed so that the bonds represented by the YTMs at every point of the curve are priced at par. This assumption\ndoes not apply to spot curves.\n(Choice B) A spot curve is compiled using YTMs of zero-coupon government bonds.\nThings to remember:\nA spot curve is derived from the YTMs of a series of zero-coupon government bonds, which do not bear default or reinvestment risk. Unlike par\ncurves, spot curves do not make any assumption about bond price.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 147, "q": "A benchmark government yield curve is most likely obtained from:", "opts": ["interpolation.", "the par curve.", "the spot curve."], "ans": "A", "expl": "Yield curves display the term structure of interest rates by graphing the relationship between maturities and bond yields. Government bonds form\nthe basis of most yield curves, the most fundamental of which is the yield curve on coupon bonds (ie, the coupon curve).\nMany governments regularly issue bonds in select maturities such as 2, 3, 5, 7, 10, and 30 years, and these bonds form the backbone of the\n\"benchmark\" coupon curve. As government coupon curves are constructed using only the most recently issued and actively traded bonds as\nbenchmarks, the remainder of the curve is constructed using interpolation (ie, estimated values) to connect these points.\n(Choices B and C) The spot curve is constructed from a series of government zero-coupon bonds of different maturities. A par curve is\nconstructed from a spot curve and represents the coupon rate for a given maturity such that the bond would trade at par when each coupon\npayment is discounted by the appropriate term spot rate. Spot and/or par curves are not used to construct a benchmark coupon curve.\nThings to remember:\nYield curves on government coupon bonds are constructed using only the most recently issued and actively traded benchmark bonds. The\nremainder of the curve is constructed using interpolation to connect these points.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 148, "q": "An investor wants to price a two-year, 6% annual coupon bond. Spot rates are 5% for zero-coupon, one-year bonds of similar credit quality and 7% for similar, zero-coupon, two-year bonds. Based on this information, the price of the bond per 100 of par value is closest to:", "opts": ["implied spot rate of a two-year zero-coupon bond in one year.", "required rate of return to invest in the three-year zero-coupon bond.", "breakeven reinvestment rate on a one-year zero-coupon bond in two years."], "ans": "C", "expl": "The implied forward rate (or just \"forward rate\") is an interest rate derived from the current zero-coupon bond term structure (ie, spot curve).\nArbitrage-free pricing enforces the consistency of forward rates with spot rate differences. A forward rate can be interpreted as the incremental\nreturn required for extending the time-to-maturity by an additional period.\nFor example, in this scenario an investor would be indifferent to investing in a three-year zero-coupon bond at 2.15% or investing in a two-year\nzero-coupon bond at 1.85% and then, two years from now, in a one-year zero-coupon bond at 2.75% (ie, the \"2y1y\" forward rate), since both result\nin the same return in three years.\nThe implied forward rate is the breakeven reinvestment rate required to make the two transactions equivalent. If an investor believes that the\none-year rate two years in the future will be lower than the breakeven rate of 2.75%, the investor is better off buying the three-year zero-coupon\nbond today.\n(Choice A) The implied spot rate of a two-year zero-coupon bond in one year is quoted as 1y2y, not 2y1y.\n(Choice B) The rate of return of the three-year zero-coupon bond is known (ie, 2.15%); it is the return of the one-year zero-coupon bond in two\nyears that is uncertain. The implied forward rate is the required rate of return for the investor to be indifferent to the two transactions.\nThings to remember:\nThe implied forward rate is an interest rate derived from the current zero-coupon bond term structure. It is the breakeven reinvestment rate that is\nrequired to make a series of zero-coupon bond transactions economically equivalent.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 149, "q": "An investor is considering a three-year investment and has calculated a \"2y1y\" forward rate of 2.75%. If a two-year zero-coupon bond's YTM is 1.85% and a three-year zero-coupon bond's YTM is 2.15%, the forward rate is best described as the:", "opts": ["implied spot rate of a two-year zero-coupon bond in one year.", "required rate of return to invest in the three-year zero-coupon bond.", "breakeven reinvestment rate on a one-year zero-coupon bond in two years."], "ans": "C", "expl": "The implied forward rate (or just \"forward rate\") is an interest rate derived from the current zero-coupon bond term structure (ie, spot curve).\nArbitrage-free pricing enforces the consistency of forward rates with spot rate differences. A forward rate can be interpreted as the incremental\nreturn required for extending the time-to-maturity by an additional period.\nFor example, in this scenario an investor would be indifferent to investing in a three-year zero-coupon bond at 2.15% or investing in a two-year\nzero-coupon bond at 1.85% and then, two years from now, in a one-year zero-coupon bond at 2.75% (ie, the \"2y1y\" forward rate), since both result\nin the same return in three years.\nThe implied forward rate is the breakeven reinvestment rate required to make the two transactions equivalent. If an investor believes that the\none-year rate two years in the future will be lower than the breakeven rate of 2.75%, the investor is better off buying the three-year zero-coupon\nbond today.\n(Choice A) The implied spot rate of a two-year zero-coupon bond in one year is quoted as 1y2y, not 2y1y.\n(Choice B) The rate of return of the three-year zero-coupon bond is known (ie, 2.15%); it is the return of the one-year zero-coupon bond in two\nyears that is uncertain. The implied forward rate is the required rate of return for the investor to be indifferent to the two transactions.\nThings to remember:\nThe implied forward rate is an interest rate derived from the current zero-coupon bond term structure. It is the breakeven reinvestment rate that is\nrequired to make a series of zero-coupon bond transactions economically equivalent.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 150, "q": "Theoretically, all bonds on a par curve are least likely to have the same:", "opts": ["liquidity.", "maturity.", "credit risk."], "ans": "B", "expl": "Yield curves display the term structure of interest rates, which graphs the relationship between times-to-maturity and bond yields. In theory, the\nyields are derived from bonds with the same currency, credit risk, liquidity, and tax status (Choices A and C). Furthermore, the annual yields are\nexpressed using the same periodicity.\nThere are three different types of yield curves discussed in CFA Institute's curriculum:\nDifferent yield curves\nYield curve Underlying Yields\nSpot curve YTMs on zero-coupon bonds\nPar curve YTMs if the bonds are priced at par\nYTM are implied forward rates that link shorter-term, zero-\nForward curve\ncoupon bond yields to longer-term, zero-coupon yields\nThe YTMs on the par curve are the discount rates, assuming that the prices of the bonds are equal their par values (ie, face values).\nThings to remember:\nYields on a yield curve are derived from bonds with the same currency, credit risk, liquidity, and tax status. The curriculum describes three types of\nyield curves: spot, par, and forward. The YTMs on the par curve are the discount rates that price the bonds equal to their par values.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 151, "q": "Which of the following is most likely a valid assumption in constructing a par yield curve?", "opts": ["A par yield curve mainly uses bonds that are priced at par.", "All cash flows from a bond are discounted at the same rate.", "Each bond uses the same periodicity regardless of maturity."], "ans": "C", "expl": "A par curve is constructed from a spot curve. Both curves discount cash flows by the spot rate for each period that the cash flow occurs;\ntherefore, the discounting rates for both curves assume the same periodicity across all maturities.\nThe main difference between the par and spot curves is that the present values of bonds included in a spot curve can differ from their par values.\nThe par curve assumes that each bond's present value always equals its par value. This assumption allows yields for different maturities to be\ncompared directly.\nThe par yield is the assumed coupon rate that makes the present value equal to the par value when discounting the cash flows using the spot\nrates, as shown by the formula below:\nAs the table above demonstrates, the difference between the yield measures is not significant, being as small as one or two basis points in some\ncases.\n(Choice A) The par curve is derived from adjusting a bond's payments so that the present value is equal to the par value, but the actual market\nprice can be any value.\n(Choice B) Each cash flow is discounted at the spot rate for the period when the cash flow occurs. Since spot rates can be (and usually are)\ndifferent for each maturity, cash flows are discounted at different rates.\nThings to remember:\nA par curve is constructed from a spot curve. The total present value of all payments, discounted at each payment's spot rate, is equal to the\nbond's par value. One assumption of a par curve is that the periodicity for each spot rate is the same for all maturities.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 152, "q": "An analyst has gathered the following forward rates: Period Forward Rate 0y,1y 2.23% 1y,1y 2.49% 2y,1y 2.61% If the rates are based on a periodicity of one, the implied two-year spot rate is closest to: ", "opts": ["2.36%", "2.44%", "2.75%"], "ans": "A", "expl": "A spot rate is the YTM on a zero-coupon bond. A forward rate is a future period interest rate that reflects the differences between spot rates of\ndifferent maturities. Arbitrage-free pricing ensures that two investment strategies of equivalent risk covering the same time horizon earn the same\nreturn. Therefore, a spot rate for a given term must be consistent with a series of forward rates over the same horizon, and that series of\nforward rates can be used to find the implied spot rate for that term.\nFor this scenario, the two investment strategies reflecting the series of forward rates are:\nBuy a two-year zero-coupon bond and hold to maturity\nBuy a one-year zero-coupon bond and hold to maturity, then reinvest the proceeds in another one-year zero-coupon bond\nThese two strategies are illustrated on a timeline:\nThe implied two-year spot rate can be computed using the given equation:\nNote the forward rate notation used: The second numeral denotes the term of the forward rate, and the first numeral denotes its starting point. For\nexample, \"2y,1y\" should be read as a one-year rate beginning 2 years from today.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates. LOS\n12.A Treasury bond with a 5% annual coupon and 4 years remaining to maturity is currently priced at 106 per 100 of par value. An investor plans\nto create an arbitrage profit by replicating this bond with zero-coupon strips using the spot rates shown in the image below:\nIgnoring transaction costs, the potential profit from the arbitrage transaction is closest to:\nA. 0\nB. 0.31\n C. 0.42\nExplanation\nAccording to the arbitrage-free valuation approach, a fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds\nwith the same pattern of cash flows. The no-arbitrage value (ie, price) of the replicated bond equals the sum of the face values of each zero-\ncoupon bond discounted by a corresponding spot rate. If the fixed-rate bond's market price is not its arbitrage-free price, then arbitrage is\npossible.\nIn this scenario, the fixed-rate Treasury bond's market price is 106, which is below the arbitrage-free price of 106.42. An investor can purchase the\nTreasury bond for 106 and short sell the package of zero-coupon strips that replicate the mispriced bond's cash flows for 106.42, generating a\nprofit of 0.42.\n(Choice A) There is a profit of 0.42 from this transaction. There would be no arbitrage profit possible only if the fixed-rate bond's market price is\nequal to the price of the replicated bond, that is, its arbitrage-free price.\n(Choice B) 0.31 results from dividing each spot rate by 2 and then annualizing it. Since the quoted spot rates are annual rates, they should not\nbe treated like semiannual rates.\nThings to remember:\nAccording to the arbitrage-free valuation approach, a fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds with\nthe same pattern of cash flows. If the fixed-rate bond's market price is not its arbitrage-free price, then arbitrage is possible. Ignoring transaction\ncosts, the arbitrage profit equals the absolute difference between the price of the fixed-rate bond and the present value of the series of zero-\ncoupon bonds.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.", "qhtml": null}, {"n": 153, "q": "A Treasury bond with a 5% annual coupon and 4 years remaining to maturity is currently priced at 106 per 100 of par value. An investor plans to create an arbitrage profit by replicating this bond with zero-coupon strips using the spot rates shown in the image below: Ignoring transaction costs, the potential profit from the arbitrage transaction is closest to:", "opts": ["0", "0.31", "0.42"], "ans": "C", "expl": "According to the arbitrage-free valuation approach, a fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds\nwith the same pattern of cash flows. The no-arbitrage value (ie, price) of the replicated bond equals the sum of the face values of each zero-\ncoupon bond discounted by a corresponding spot rate. If the fixed-rate bond's market price is not its arbitrage-free price, then arbitrage is\npossible.\nIn this scenario, the fixed-rate Treasury bond's market price is 106, which is below the arbitrage-free price of 106.42. An investor can purchase the\nTreasury bond for 106 and short sell the package of zero-coupon strips that replicate the mispriced bond's cash flows for 106.42, generating a\nprofit of 0.42.\n(Choice A) There is a profit of 0.42 from this transaction. There would be no arbitrage profit possible only if the fixed-rate bond's market price is\nequal to the price of the replicated bond, that is, its arbitrage-free price.\n(Choice B) 0.31 results from dividing each spot rate by 2 and then annualizing it. Since the quoted spot rates are annual rates, they should not\nbe treated like semiannual rates.\nThings to remember:\nAccording to the arbitrage-free valuation approach, a fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds with\nthe same pattern of cash flows. If the fixed-rate bond's market price is not its arbitrage-free price, then arbitrage is possible. Ignoring transaction\ncosts, the arbitrage profit equals the absolute difference between the price of the fixed-rate bond and the present value of the series of zero-\ncoupon bonds.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.", "qhtml": null}, {"n": 154, "q": "An investor replicates a 4-year, 2% annual coupon-paying Treasury bond with 100 par value by combining zero-coupon bonds with the following spot rates: The YTM on the bond is closest to:", "opts": ["3.00%", "3.94%", "4.43%"], "ans": "B", "expl": "A fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds (strips) with the same pattern of cash flows. The\nprice of the fixed-rate bond should equal the sum of the face values of the individual strips discounted by their corresponding spot rates (ie, the\nmarket discount rate for zero-coupon bonds). This is known as the arbitrage-free valuation approach since the same price applies to both\ninstruments; otherwise, arbitrage opportunities will be present.\nThe YTM is the rate that discounts a bond's future cash flows to its current price. To calculate the YTM (r) of a fixed-rate bond, first calculate the\nbond's present value (ie, price) using the cash flows of the zero-coupon strips, and then input the present value and other parameters (ie, maturity,\ncoupons, par value) on the calculator to solve for r.\n(Choice A) 3.00% results from incorrectly using 8 (ie, assuming semiannual periods) for the number of periods.\n(Choice C) 4.43% results from failing to include the last coupon payment of 20 in period 4's cash flow when computing the bond's present value.\nThings to remember:\nA fixed-rate coupon Treasury bond can be replicated from a series of zero-coupon bonds (strips) with the same pattern of cash flows. To calculate\nthe YTM (r) of a fixed-rate bond, first calculate the bond's present value (ie, price) by discounting the series of zero-coupon strips at corresponding\nspot rates, and then input the present value and other parameters (ie, maturity, coupons, par value) on the calculator to solve for r.\nDefine spot rates and the spot curve, and calculate the price of a bond using spot rates.", "qhtml": null}, {"n": 155, "q": "The following table shows the spot rates for Years 1 through 4: If the rates are stated on an annual basis, the 2y1y implied forward rate is closest to:", "opts": ["4.25%", "4.60%", "4.95%"], "ans": "C", "expl": "One assumption underlying a bond's total return is that the investor reinvests all cash flows. The reinvestment rate that an investor expects to\nreceive today is the implied forward rate. It can be derived if the spot rates are known for each period that the investor plans to hold the bond.\nAn investor with a three-year horizon can invest in a three-year, zero-coupon bond with a guaranteed annual return of 4.15% based on today's\nthree-year spot rate; this is the first strategy shown in the diagram below. Alternatively, the investor can replicate a three-year, zero-coupon bond\nby investing in any of the other following strategies:\nSince the spot rates for each period are known today, the implied forward rate for any of the alternative strategies must be the rate that makes the\ninvestor indifferent to choosing between that strategy and the three-year bond. In addition, the \"no arbitrage\" rule forces each strategy's implied\nforward rate(s) to be such that the total three-year return for all strategies is identical.\nThis question asks for the 2y1y implied forward rate. The sec
