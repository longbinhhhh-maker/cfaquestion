sets) evaluates the extent to which the sale of financial, tangible and intangible assets could fund the repayment of debt.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 266, "q": "A company has recently declared bankruptcy and defaulted on its senior unsecured debt. Bondholders include: Which of the following best describes the right-to-payment rankings of these bondholders? ", "opts": ["All have equal priority.", "Investor A has priority.", "Investor C has priority."], "ans": "A", "expl": "A pari passu provision (from a Latin phrase meaning \"on equal footing\") is found in most corporate debt indentures (ie, offering documents).\nWith regard to bondholders' rights in the event of bankruptcy, pari passu ensures that all bondholders of the same class (ie, seniority) will be\ntreated equally in their rights to payment and/or eventual recovery of assets. In this scenario, since all bonds are senior unsecured debt and\nare therefore of the same class, all bondholders have an equally ranked, pro rata claim.\n(Choice B) In the event of default, time left to maturity does not affect the priority of claims, whether that time is six months (Investor A) or six\nyears (Investor B).\n(Choice C) Investor C owns the largest share of the bonds, by par value, but all bondholders of the same class are treated equally, regardless of\nthe par value of bonds owned.\nThings to remember:\nA pari passu provision protects bondholders' rights in the event of bankruptcy, meaning that the same class (ie, seniority) of bondholders will be\ntreated equally in their rights to payment and/or eventual recovery of assets. In this scenario, all bonds are senior unsecured debt of the same\nclass and therefore all bondholders have an equally ranked, pro rata claim.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 267, "q": "An analyst gathered the following company data: SAR millions Shareholders' equity 16.31 Total assets 40.82 Total debt 7.05 Total liabilities 24.51 Based on this information, the company's debt/capital ratio is closest to:", "opts": ["17.27%", "30.18%", "43.23%"], "ans": "B", "expl": "Debt/capital ratio = Total debt / Total capital\nTotal capital = Total debt + Shareholders' equity\nA credit analyst uses credit analysis measures to evaluate the financial health of a company. Among these measures, leverage ratios can assess\nthe company's ability to repay its debt principal. One leverage ratio, the debt/capital ratio, indicates the percentage of the company's total\ncapital that is financed by debt.\nIn this scenario, total capital is calculated as follows:\nTotal capital = Total debt + Shareholders' equity\n= 7.05 + 16.31\n= 23.36\nTo determine the company's debt/capital ratio, divide total debt by total capital:\nDebt/capital ratio = Total debt / Total capital\n= 7.05 / 23.36\n= 30.18%\nNote: Nondebt current liabilities are not included in total debt. Therefore, total debt does not equal total liabilities.\n(Choice A) 17.27% results from dividing total debt by total assets instead of total capital.\n(Choice C) 43.23% results from dividing total debt by shareholders' equity instead of total capital.\nThings to remember:\nCredit analysis measures are used to evaluate a company's financial health. Among these measures, leverage ratios (eg, debt/capital ratio)\nassess the company's ability to repay its debt principal. The debt/capital ratio indicates the percentage of the company's capital that is financed by\ndebt. Nondebt current liabilities are not included in total debt and therefore not equal to total debt.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 268, "q": "Debtholders of a subordinated bond recovered 15% of their bond's value during a bankruptcy while the holders of a senior secured bond recovered 75% of their bond's value. The most likely explanation is that the: ", "opts": ["various classes of claimants agreed to a negotiated settlement.", "value of the secured property was less than the amount of the claim.", "preferred shareholders received distributions first based on the priority of claims."], "ans": "A", "expl": "For issuers with multiple debt issues outstanding, indentures establish seniority rankings that determine the priority of claims for the different\nclasses of investors. During a bankruptcy, strict adherence to the priority of claims results in sequential payment in full, according to the seniority\nof each class of claimants.\nIf subordinated debtholders receive partial payment before secured and senior debtholders are paid in full, then the priority of claims was not\nstrictly adhered to. A likely reason is that the various classes of claimants negotiated a settlement to avoid litigation, which would reduce assets\navailable for recovery.\nIn this scenario, the subordinated debtholders received 15% of their claim while the senior secured debtholders received 75% of theirs, suggesting\nthe various claimants agreed to such a settlement. If the priority of claims were strictly followed, the senior secured debtholders would have\nreceived 100% of their claim before lower classes received any distributions.\n(Choice B) In cases where the value of the secured property is less than the amount of the claim, shortfalls are given a status equal to the claims\nof senior unsecured creditors. This claim still takes priority over subordinated debtholders based on the priority of claims.\n(Choice C) Shareholders, including preferred shareholders, have claims junior to those of all debtholders. They will receive distributions only\nafter all liability holders' claims are paid in full, assuming adherence to the priority of claims.\nThings to remember:\nSecured and senior unsecured bond classes have a higher priority of claims on a company's assets during bankruptcies. If subordinated\ndebtholders receive partial payment before secured and senior debtholders are paid in full, a likely reason is that the various classes of claimants\nnegotiated a settlement to avoid litigation.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 269, "q": "Regarding the four Cs of credit analysis, character is most likely concerned with:", "opts": ["asset values relative to level of indebtedness.", "affirmative and restrictive indenture provisions.", "aggressive accounting policies and tax strategies."], "ans": "C", "expl": "Aggressive accounting policies and tax strategies raise questions about the quality of a company's financial statements. Management\nconducting such policies and strategies can result in overstating profitability. Since investors can never have a complete understanding of a\ncompany's financial and operating situation, they are reliant on management for a truthful portrayal of company circumstances. Questionable\naccounting policies or tax strategies raise concerns about management's character.\nPremature revenue recognition or delayed expense recognition are examples of aggressive accounting policies. Claiming tax credits or\ndeductions that are likely to be challenged by tax authorities are aggressive tax strategies. Such actions can result in higher borrowing costs or\nrequire greater protections for bondholders (eg, more restrictive indenture covenants) because of concerns about character.\n(Choice A) Collateral is the element of the 4 Cs that relates to the value of the company's assets relative to its level of indebtedness.\n(Choice B) Covenants is the element of the 4 Cs that relates bond contract provisions designed to protect bondholders.\nThings to remember:\nIn the 4 Cs of traditional credit analysis, character refers to investors' assessment of company management. Since investors rely on management\nfor an honest portrayal of a company's circumstances, questionable accounting policies or tax strategies raise questions about management's\ncharacter.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 270, "q": "Which of the following is most likely considered strict adherence with the priority of claims in a bankruptcy proceeding?", "opts": ["All creditor classes receiving only partial settlement of their claims", "Preferred stockholders receiving distributions only after all creditors are paid in full", "Secured lenders receiving 100% of collateral sale proceeds to fully retire their claims"], "ans": "B", "expl": "The types of issued securities and the provisions (ie, indentures) of debt contracts determine the priority of claims for different classes of\ncreditors and owners. Strict adherence to the priority of claims results in sequential payment in full according to the seniority of each class of\nclaimants.\nThe class of claimants with the most senior status at the point when the last of the assets are distributed receives only partial payment. Those\nwith more junior claims receive nothing. Therefore, preferred shareholders receiving distributions only after all liability holders' claims\n(including those of subordinated lenders) are paid in full is consistent with strict adherence to the priority of claims.\n(Choice A) All creditors accepting partial settlement of their claims is not strict adherence to the priority of claims. However, senior creditors often\naccept immediate, partial settlement of their claims to avoid protracted litigation and obtain higher recovery rates.\n(Choice C) Secured creditors have a claim only to the money they are owed. Collateral sale proceeds in excess of their claims are used to make\ndistributions to other claimants. Shortfalls are given a status equal to the claims senior unsecured creditors.\nThings to remember:\nThe types of issued securities and the provisions (ie, indentures) of debt contracts determine the priority of claims for different classes of owners\nand creditors. Preferred shareholders receiving no distributions until all liability holders' claims are paid in full is consistent with strict adherence to\nthe priority of claims.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 271, "q": "An analyst compiles the following data for three companies: Total debt/total capital Total debt/EBITDA EBITDA/interest expense Company X 84% 1.80 4.46 Company Y 73% 1.30 4.71 Company Z 67% 1.20 6.04 The company with the highest credit quality is most likely:", "opts": ["Company X.", "Company Y.", "Company Z."], "ans": "C", "expl": "Interpreting financial ratios\nType Measures Better credit quality if ratio is\nTotal debt/Total capital Leverage Reliance on debt Lower\nTotal debt/EBITDA Leverage Debt carrying capacity Lower\nEBITDA/Interest expense Coverage Ability to service debt Higher\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay (ie, cover) its interest obligations, with a higher ratio indicating better credit quality.\nIn contrast, leverage ratios compare total debt to some measure of capital, income, or cash flow to assess the company's ability to repay principal\nand/or its use of leverage. Since debt is in the numerator of both the total debt/total capital ratio and the total debt/EBITDA ratio, lower leverage\nratios indicate better credit quality.\nIn this scenario, Company Z has the highest EBITDA/interest ratio, indicating that it has the greatest ability to cover the interest payments on its\ndebt. Company Z also has the lowest leverage ratios: its total debt/EBITDA and total debt/total capital ratios are the lowest, indicating a\ngreater ability to pay debt principal and less reliance on debt financing than the other companies. The three ratios together indicate that Company\nZ has the best credit quality on average (Choices A and B).\nThings to remember:\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay (ie, cover) its interest obligations, with a higher ratio indicating better credit quality. Leverage ratios compare total debt to\nsome measure of income, cash flow, or capital to assess the company's ability to repay principal and/or its use of leverage.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 272, "q": "With regards to credit analysis, management's strategy and execution most likely affects:", "opts": ["capacity.", "collateral.", "character."], "ans": "A", "expl": "4 Cs of credit analysis\nCapacity Ability to make debt payments on time\nCollateral Value of assets supporting debt\nCovenants Terms and conditions in debt contracts\nCharacter Track record of management\nCapacity is a borrower's ability to service debt. Evaluating capacity requires a comprehensive analysis of the stability and predictability of all\nrevenues and expenditures. Assessment of a company's capacity should include:\nindustry structure and fundamentals to determine the competitive environment and prospects for growth,\ncompany fundamentals to understand its competitive position and operating history,\nratio analysis to evaluate profitability, leverage, and debt service coverage, and\ncorporate liquidity to assess future flexibility for financing operations and funding investment.\nAssessing management's strategy and execution is a crucial aspect of analyzing a company's capacity to service its debt. Analysts must\nevaluate management's ability to design strategies appropriate for the operating environment and its capability to successfully execute those\nstrategies to achieve targeted growth and profitability.\n(Choice B) Collateral refers to the value of a borrower's assets relative to the amount of its debt.\n(Choice C) Character refers to management's openness and honesty with regards to financial reporting and public communications.\nThings to remember:\nIn traditional credit analysis, capacity is a borrower's ability to service debt. Management's ability to design appropriate strategies and successfully\nexecute them is a crucial aspect of evaluating capacity.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 273, "q": "If a corporate bond issuer defaults, which of the following categories of bondholders is most likely to realize the lowest recovery rate?", "opts": ["Second lien", "Senior secured", "Senior subordinated"], "ans": "C", "expl": "For companies with multiple debt issues outstanding, the debt contracts' provisions (ie, indentures) establish seniority rankings that determine the\npriority of claims for different classes of creditors. The more senior the ranking, the higher the priority of the claim on the cash flow and assets of\nthe issuer.\nSubordinated bondholders are the most junior (ie, lowest ranked) class of company creditors, although they are still senior to the equity\nholders. Consequently, subordinated bondholders are the last creditors to be paid in any liquidation and obtain the lowest recovery rate in a\nbankruptcy reorganization of a company.\n(Choice A) A second lien obligation is a type of secured debt. Other company creditors (ie, first lienholders) have a prior claim on the pledged\nasset. However, recovery is still viable because the value of the collateral should exceed the original value of the claims of all lienholders—\nincluding first, second, and possibly third lienholders.\n(Choice B) Senior secured (first lien) bondholders are ranked ahead of all other creditors.\nThings to remember:\nSubordinated bondholders are the most junior class of company creditors; however, they are still senior to equity holders. Subordinated\nbondholders are the last creditors paid in any liquidation and obtain the lowest recovery rate in a bankruptcy reorganization of a company.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 274, "q": "For credit analysis, limitations on dividend payments or mergers and acquisitions are most likely evaluated under:", "opts": ["capacity.", "collateral.", "covenants."], "ans": "C", "expl": "Debt securities are contracts, the terms of which are specified in a trust deed or bond indenture. Contract provisions (ie, covenants) detail\nthe rights and obligations of issuers and investors. Most covenants are designed to protect creditors while leaving management adequate\noperational flexibility. Allowing dividend payments or mergers and acquisitions only if specified conditions are satisfied is a common covenant.\nCredit analysis must consider contractual protections since management represents owners (ie, shareholders). Management actions to enrich\nshareholders might disadvantage bondholders. For example, excessive dividends can undermine the ability to repay debt due to the cash\ndistribution. As another example, mergers usually entail incurring additional debt, adding to the corporate debt burden and possibly affecting\ncreditworthiness.\n(Choice A) Capacity relates to the ability to service debt. It is determined by a borrower's ability to generate sufficient net cash flow from\noperations.\n(Choice B) Collateral refers to the value of a borrower's assets relative to the amount of its debt.\nThings to remember:\nCovenants are bond contract provisions that detail the rights and obligations of issuers and investors. Most are designed to protect creditors.\nLimitations on distributions to shareholders (eg, dividends) or mergers and acquisitions are common covenants.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 275, "q": "A credit analyst has the following industry and company financial ratios: Based on this data, the credit rating of Company Z is most likely: ", "opts": ["lower than Company Y.", "the same as Company Y.", "higher than Company Y."], "ans": "A", "expl": "Interpreting financial ratios\nType Measures Better credit quality if ratio is\nTotal debt/Total capital Leverage Reliance on debt Lower\nTotal debt/EBITDA Leverage Debt carrying capacity Lower\nEBITDA/Interest expense Coverage Ability to service debt Higher\nDebt-to-total capital ratios measure the extent to which a firm relies on debt to finance its operations. Total debt-to-EBITDA ratios assess how\nwell a company's ability to generate cash from operations can support its debt. In general, the higher the value of these leverage ratios, the\nworse a company's credit quality. Company Z's leverage ratios are above both the industry average and Company Y's.\nEBITDA-to-interest expense ratios measure a company's ability to cover interest payments with cash flow from operations, using EBITDA\n(earnings before interest, taxes, depreciation, and amortization) as a proxy for operating cash flow. A lower coverage ratio means greater\nuncertainty that the company can generate the cash flow to service its debt. Company Z's coverage ratio is below both the industry average and\nCompany Y's.\nThings to remember:\nLeverage and coverage ratios are two of the most important categories of financial ratios for evaluating credit quality. In general, higher leverage\nand lower coverage ratios are associated with lower credit quality, and vice versa.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 276, "q": "In credit analysis, collateral assessments are most likely to be a significant concern if a company:", "opts": ["has stock that is trading below book value.", "carries high-quality intangibles on its balance sheet.", "reports large capital expenditures relative to depreciation expense."], "ans": "A", "expl": "Credit risk and analysis\nElements of risk Focus of analysis Relevant companies\nCapacity High quality\nDefault probability\n(Operating cash flow sufficiency) (Rated AA/Aa2 or higher)\nSeverity of loss Collateral Low quality/distressed\n(in event of default) (Value of asset versus debt levels) (Rated B or lower)\nCredit analysis focuses primarily on the probability of default and the severity of potential losses. Collateral analysis helps estimate the\nseverity of loss from default by measuring the liquidation value of assets that may be sold in that event.\nIf a company's stock price is below book value (ie, liquidation value), it may signal that the market perceives the company's assets—its\ncollateral—to be of lower quality than the financial statements suggest. In this case, since the quality of the collateral is in question, collateral\nassessments would be important to the company's credit analysis.\n(Choice B) When default occurs, high-quality intangibles (ie, intellectual property) are considered easier to liquidate, thus reducing loss severity.\nIn contrast, low-quality intangibles have little or no liquidation value and cannot be relied on to compensate creditors. Therefore, collateral\nassessments are most significant to companies holding low-quality intangibles.\n(Choice C) A company with large capital expenditures compared against its depreciation expense may be investing capital in new or replacement\nassets with higher liquidation values that can reduce loss severity. Such investments may also indicate sustained financial performance and lower\ndefault risk. For these reasons, collateral assessments would not be a significant concern.\nThings to remember:\nCollateral analysis measures the liquidation value of assets that may be sold in the event of default. When a company has stocks trading below\nbook value, low capital expenditures, or low-quality intangibles, the risks of default and severe loss increase. Collateral assessments would be a\nsignificant concern in the company's credit analysis.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 277, "q": "An analyst compiles the following information for a company: £ 20X1 20X2 20X3 Total debt 912 1,200 2,010 Shareholders' equity 165 173 186 Total capital 1,077 1,373 2,196 Operating profit 246 210 205 Depreciation and amortization 262 146 314 Interest expense 114 75 100 Based on the trends in the company's ratio of total debt to total capital and its ratio of EBITDA to interest expense over the three-year period, the most appropriate conclusion is that the company's ability to pay interest payments is:", "opts": ["increasing and its ability to repay principal is increasing.", "increasing and its ability to repay principal is decreasing.", "decreasing and its ability to repay principal is increasing."], "ans": "B", "expl": "Credit analysis ratios\nType Ratio\nDebt-to-Capital\nLeverage Debt-to-EBITDA\n(ability to repay principal) FFO-to-Debt\nFCF after dividends-to-Debt\nCoverage EBITDA-to-Interest expense\n(ability to cover interest) EBIT-to-Interest expense\nEBITDA\nProfitability and FFO\ncash flow measures FCF before dividends\nFCF after dividends\nFCF = free cash flow; FFO = funds from operations.\nA credit analyst uses measures such as coverage ratios and leverage ratios to evaluate a company's financial health. Coverage ratios (eg,\nEBITDA to interest expense) can assess the company's ability to pay (ie, cover) its interest obligations; a higher coverage ratio indicates better\ncredit quality.\nIn contrast, leverage ratios (eg, total debt to total capital) compare total debt with some measure of capital, income, or cash flow to assess the\ncompany's ability to repay debt principal and/or its use of leverage. Since debt is in the numerator in the ratio of total debt to total capital, a lower\nnumber indicates a greater ability to repay principal and, therefore, better credit quality.\nIn this scenario, the two ratios are calculated for each of the three years:\nThe company's ratio of EBITDA to interest expense is increasing, which indicates that its ability to pay interest on debt is increasing.\nHowever, its ratio of total debt to total capital is also increasing, which indicates that its ability to repay debt principal is decreasing\n(Choices A and C).\nCalculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 278, "q": "For credit analysis, when assessing an issuer's capacity an analyst should most appropriately consider:", "opts": ["management's track record.", "EBITDA and coverage ratios.", "asset values versus outstanding debt."], "ans": "B", "expl": "4 Cs of credit analysis\nCapacity Ability to make debt payments on time\nCollateral Value of assets supporting debt\nCovenants Terms and conditions in debt contracts\nCharacter Track record of management\nCapacity is a borrower's ability to service debt. Evaluating capacity entails both industry and company analysis. The industries in which a\nborrower operates are analyzed to understand the competitive environment and prospects for growth and how each impacts borrower cash flow.\nBeyond assessing the general operating environment, borrower-specific circumstances are analyzed, including:\nAbility to generate revenue (eg, sales trends and turnover ratios)\nProfitability (eg, profit margins and return ratios\nSolvency and ability to meet obligations (eg, debt ratios and coverage ratios)\nOperating and financial leverage\nEBITDA is a proxy for operating cash flow. EBITDA/interest expense is a widely used coverage ratio. Beyond operating considerations,\ncapacity is also influenced by the ability to obtain additional funds (eg, access to capital markets or banks).\n(Choice A) Management's track record is addressed in Character.\n(Choice C) Asset values versus level of indebtedness is addressed under Collateral.\nThings to remember:\nCapacity is a borrower's ability to service debt. Capacity is primarily evaluated by comparing net operating cash flows to required debt payments.\nEBITDA is a proxy for operating cash flow and is often compared to interest expense (ie, interest coverage ratio) to assess a borrower's capacity\nto repay its debts.\nDescribe the qualitative and quantitative factors used to evaluate a corporate borrower’s creditworthiness.", "qhtml": null}, {"n": 279, "q": "Which of the following is least likely a benefit of securitization? Securitization provides:", "opts": ["lenders with the ability to finance more loans.", "companies with an alternate source of funding.", "investors with less inherent credit risk from the underlying collateral."], "ans": "C", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans and receivables, such as auto loans or credit card\nreceivables, to create asset-backed securities (ABS). The cash flows from these assets (ie, payments from the borrowers) are used to pay the\nbonds' interest and principal.\nSecuritization has many benefits, including the redistribution of the risk of the underlying collateral. Credit enhancements allow investors to tailor\ntheir interest rate and credit risk exposure. However, the level of inherent credit risk on this collateral does not change. Therefore, securitization is\nnot guaranteed to reduce the overall credit risk to investors. If losses on the collateral are particularly high, the credit enhancements can fail to\nprovide the intended protection.\n(Choices A and B) One benefit of securitization is that it allows financial institutions to sell loans and use the proceeds to provide more lending.\nSecuritization also provides a funding source for companies in addition to equity and bond issuance because companies that originate loans and\nreceivables can sell these assets directly to financial intermediaries.\nThings to remember:\nSecuritization is a process that bundles assets to create asset-backed securities (ABS) with credit enhancements. These enhancements\nredistribute the risk of the underlying collateral and allow investors to tailor the risk of their investment. Securitization does not change the inherent\ncredit risk of the underlying collateral, so the ABS structures can fail to provide their intended benefits if losses in the collateral are particularly\nhigh.\nExplain benefits of securitization for issuers, investors, economies, and financial markets.", "qhtml": null}, {"n": 280, "q": "A residential mortgage-backed security (RMBS) has a credit rating higher than the bonds of the seller of the securitized assets. All else being equal, this scenario least likely results from which of the following factors?", "opts": ["The RMBS is issued by a special purpose entity.", "The seller's bonds are subordinate to the RMBS.", "The RMBS may be backed by guarantees if the underlying borrowers default."], "ans": "B", "expl": "A characteristic common to all asset-backed securities (ABS), including residential mortgage-backed securities (RMBS), is how they are created.\nAs shown, assets that collateralize the ABS are sold to a special purpose entity (SPE), which then becomes the issuer of the ABS.\nThe SPE and the seller are separate entities, so if the seller declares bankruptcy, its debts cannot be satisfied by creditors seizing the ABS\ncollateral. The collateral may be of high quality, and its immunity to the seller's bankruptcy potentially makes the ABS that it supports more\ncreditworthy than a bond issued by the seller, even if that bond were backed by similar collateral. This translates into a higher credit rating for the\nABS than for an otherwise identical bond issued by the seller (Choice A).\nAnother consequence of the SPE and the seller being separate entities is that creditors' claims are not prioritized based on different bond issues\nbeing designated as senior vs. subordinated. Since the seller's bondholders have no claims against the SPE's assets (and vice versa), each\nbond's credit rating cannot depend on whether one bond is \"senior\" to the other.\n(Choice C) Financial guarantees are one type of credit enhancement that can be used for all types of ABS, including RMBS. A financial\nguarantee may warrant a higher credit rating for ABS than for a bond issued by the collateral seller.\nThings to remember:\nAsset-backed securities (ABS) are created by selling assets, such as mortgages, to a special purpose entity (SPE), which subsequently issues the\nABS. Since the SPE and asset seller are separate entities, the ABS collateral is not subject to the claims of the seller's creditors. This can result\nin the ABS having a higher credit rating than the bonds issued by the collateral seller.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 281, "q": "A retailer offers loans to customers to finance purchases of high-priced merchandise. If a customer defaults on a loan, the retailer will repossess and resell the merchandise. The retailer securitizes USD 30 million of these loans by selling them to a special purpose vehicle (SPV). Subsequently, the SPV will sell asset-backed securities (ABS) to investors. Based on this information, for the ABS, which of the following descriptions is most appropriate?", "opts": ["The retailer is the issuer.", "The SPV is the depositor.", "The merchandise financing loans are the collateral."], "ans": "C", "expl": "Lenders often package loans together and sell them for quick cash; this process is known as securitization. In general, the process involves the\nlender (ie, depositor) selling bundled loans to a special purpose vehicle (ie, issuer). The SPV then issues asset-backed securities, using the\nloans as collateral, to investors. As return, the ABS investors receive periodic cash flows from the SPV, which are provided by the loan payments\nfrom the loans that serve as collateral.\nIn this scenario, the retailer (ie, depositor) sells customer loans to the SPV (ie, issuer) (Choices A and B). The SPV subsequently sells ABS to\ninvestors using the customer loans as collateral. After investors purchase the ABS, they receive future payments from the SPV, which are\nprovided from customer repayment of the merchandise loans.\nThings to remember:\nLenders often package loans together and sell them for quick cash through securitization. In general, the process involves the lender (ie,\ndepositor) selling bundled loans to a special purpose vehicle (SPV) (ie, issuer). The SPV then issues asset-backed securities (ABS), using the\nloans as collateral, to investors. As return, the ABS investors receive periodic cash flows from the SPV, which are provided from the collateral.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 282, "q": "A company sells ¥485 million of its receivables to a special purpose entity (SPE). Using the receivables as collateral, the SPE issues asset- backed securities (ABS) with the following structure: Bond Class Par Value (¥ Millions) A (senior) 275 B (subordinate to A) 120 C (subordinate to B) 90 Total 485 If customers default on ¥120 million of the receivables owed, then bond class(es):", "opts": ["B and C realize losses of ¥60 million each.", "A, B, and C realize losses of ¥40 million each.", "C realizes losses of ¥90 million and B realizes losses of ¥30 million."], "ans": "C", "expl": "In a securitization, a company sells an asset such as accounts receivable to a special purpose entity (SPE), which then issues asset-backed\nsecurities (ABS) using the receivables as collateral. As customers make payments on the receivables to the SPE, the cash flow is used to pay\ndown the ABS tranches. Defaults on receivables can lead to losses in the ABS; the assignment of payments and losses to the tranches differs\naccording to the ABS structure.\nIn this scenario, the ABS is structured to provide credit enhancement (known as credit tranching) using a \"waterfall\" structure. Payments are\ndirected to the senior tranche first until its principal is reduced to zero, and then to other tranches sequentially by seniority. The flow of losses\nis in the opposite direction: Losses are absorbed by the most subordinate tranche until its principal is reduced to zero, then the next most\nsubordinate tranche absorbs the remaining losses, and so on.\nIn this ABS structure, there is one senior tranche and two subordinate tranches. The ¥120 million in losses are absorbed as follows:\nThe first ¥90 million in losses is applied to bond class C, which reduces its principal to zero.\nThe remaining ¥30 million in losses is applied to bond class B, leaving a par value of ¥90 million.\nBond class A is unaffected.\n(Choices A and B) In a waterfall structure, losses are not allocated proportionally but sequentially and by seniority. Losses are allocated to the\nmost junior tranche first.\nThings to remember:\nIn a waterfall structure (also known as credit tranching), payments go to the most senior tranche until its principal reaches zero and then cascade\ndown the tranches, paying the principal of each in order of seniority. Losses are absorbed by the most subordinate tranche first and then move\nupward sequentially to more senior tranches.\nDescribe securitization, including the parties and the roles they play. LOS\n5. Company X securitizes some of its receivables, selling them to a special purpose entity (SPE). Using the receivables as collateral, the SPE\nissues asset-backed securities (ABS), with one senior bond class and two subordinated bond classes. Company X files for bankruptcy after the\nABS issuance, due solely to a dramatic decline in sales. All else being equal, the bankruptcy's effect on the ABS structure will most likely be that:\nA. all of the bond classes will default.\n\nB. none of the bond classes will default.\nC. the bond classes will default according to seniority.\nExplanation\nIn a securitization, a company may sell an asset (eg, accounts receivable) to a special purpose entity (SPE), which then issues asset-backed\nsecurities, using the bundled receivables as collateral.\nThe SPE is a separate legal entity from the company selling the receivables. If the company later declares bankruptcy, its debts cannot be\nsatisfied by the receivables that are now owned by the SPE. The receivables now collateralize the SPE's bonds, not the company's debt.\nIf customers continue to pay the receivables, the SPE can make interest and principal payments so that all bond classes are unaffected by the\ncompany's bankruptcy. For that reason, the SPE is commonly referred to as \"bankruptcy remote\" since, all else being equal, the company's\nbankruptcy does not affect to the SPE's ABS investors (Choices A and C).\nThings to remember:\nCompanies may sell receivables to a special purpose entity (SPE), which then issues asset-backed securities (ABS) with the receivables as\ncollateral. Since the receivables are owned by the SPE (a separate legal entity), ABS investors are protected from the company's creditors if the\ncompany goes bankrupt.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 283, "q": "Company X securitizes some of its receivables, selling them to a special purpose entity (SPE). Using the receivables as collateral, the SPE issues asset-backed securities (ABS), with one senior bond class and two subordinated bond classes. Company X files for bankruptcy after the ABS issuance, due solely to a dramatic decline in sales. All else being equal, the bankruptcy's effect on the ABS structure will most likely be that:", "opts": ["all of the bond classes will default.", "none of the bond classes will default.", "the bond classes will default according to seniority."], "ans": "B", "expl": "In a securitization, a company may sell an asset (eg, accounts receivable) to a special purpose entity (SPE), which then issues asset-backed\nsecurities, using the bundled receivables as collateral.\nThe SPE is a separate legal entity from the company selling the receivables. If the company later declares bankruptcy, its debts cannot be\nsatisfied by the receivables that are now owned by the SPE. The receivables now collateralize the SPE's bonds, not the company's debt.\nIf customers continue to pay the receivables, the SPE can make interest and principal payments so that all bond classes are unaffected by the\ncompany's bankruptcy. For that reason, the SPE is commonly referred to as \"bankruptcy remote\" since, all else being equal, the company's\nbankruptcy does not affect to the SPE's ABS investors (Choices A and C).\nThings to remember:\nCompanies may sell receivables to a special purpose entity (SPE), which then issues asset-backed securities (ABS) with the receivables as\ncollateral. Since the receivables are owned by the SPE (a separate legal entity), ABS investors are protected from the company's creditors if the\ncompany goes bankrupt.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 284, "q": "In the context of securitization, describing a special-purpose entity (SPE) as \"bankruptcy remote\" most likely refers to the:", "opts": ["probability that the SPE declares bankruptcy.", "protection of the collateral from creditors' claims against the asset seller if the seller declares bankruptcy.", "responsibility of the SPE for principal and interest of a securitized loan if the borrower declares bankruptcy."], "ans": "B", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans such as mortgages or credit card receivables. The original\nlender sells the loans to a special-purpose entity (SPE), which then issues bonds that use the bundled loans as collateral. Borrowers make\npayments on the loans to the SPE, which applies the payments to the bonds' interest and principal.\nPayments made on the collateral are often the only source of payments for the bonds. For this reason, it is critical that the SPE be independent\nfrom the seller of the assets used to create the bonds. This prevents the possibility that, if the seller went bankrupt, creditors of the seller could\nseize the collateral for the securitized loans to satisfy claims against the seller. For this reason, the SPE is commonly referred to as \"bankruptcy\nremote.\"\n(Choice A) If borrowers on the collateral default in repaying those loans, this could cause the SPE to become bankrupt. \"Bankruptcy remote\"\ndoes not refer to the SPE's possibility of bankruptcy.\n(Choice C) The SPE has no obligation to assume a borrower's debt if the borrower declares bankruptcy.\nThings to remember:\nA special-purpose entity (SPE) is created to purchase loans such as mortgages or credit card receivables that will be used as collateral for bonds.\nCash generated from payments from the assets is used to pay the bonds' principal and interest. The sale of the assets must be structured so that\nthe SPE is \"bankruptcy remote,\" meaning that those assets are not subject to claims by seller's creditors if the seller later declares bankruptcy.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 285, "q": "An equipment manufacturer provides customer financing through loans. The manufacturer transfers the loans to a special purpose entity (SPE) that issues bonds to investors. The investors' collateral is most likely the: ", "opts": ["loans held by the SPE.", "cash flows of the manufacturer.", "equipment purchased with the loan financing."], "ans": "A", "expl": "Asset-backed securities (ABS) are created through a process called securitization. Firms, such as the manufacturer in this scenario, sponsor a\nspecial purpose entity (SPE), which then acquires an asset, or a portfolio of assets (eg, customer loans), that serves as collateral. As in this\ncase, the ABS sponsor is often the originator of loans that become the collateral. The SPE then issues bonds, backed by this asset, to investors.\nThe investors' collateral is the assets (ie, loans) held by the SPE. The bond investors have no claim on the assets or cash flows of the ABS\nsponsor and/or the loan originator. In this case, the manufacturer is both sponsor and originator, but it no longer owns the loans since they have\nbeen sold to the SPE (Choice B).\n(Choice C) The equipment purchased with the loan proceeds may serve as collateral for the loans but not for the bonds that use the loans as\ncollateral.\nThings to remember:\nAsset-backed securities (ABS) give investors a share of the cash flows generated by a pool of assets held by a special purpose entity (SPE). The\nassets held by the SPE serve as collateral on the ABS. ABS investors have no claim on the assets or cash flow of the loan originator or SPE\nsponsor.\nDescribe securitization, including the parties and the roles they play.", "qhtml": null}, {"n": 286, "q": "Which of the following is least likely a benefit of securitization?", "opts": ["Lenders enjoy additional capital resources.", "Lenders can relax credit standards in their lending decisions.", "Asset-backed securities are more liquid than the collateral used to create them."], "ans": "B", "expl": "Securitization refers to the process of bundling (ie, pooling) cash-generating loans, such as mortgages or credit card receivables. The original\nlenders sell the assets to an entity that issues bonds secured by the assets, which are broadly referred to as asset-backed securities. The cash\nflows from these assets are used to pay the bonds' interest and principal.\nAlthough securitization offers many benefits, it can also present increased risks. A lender that plans to sell a 30-year home mortgage immediately\nafter originating it, rather than keeping the loan until it matures, has less incentive to conduct proper due diligence concerning the borrower's credit\nquality or the collateral securing the loan. This can lead to later defaults, as in the financial crisis of 2006-2008.\n(Choices A and C) Traditionally, lenders kept loans on their balance sheets until they matured; therefore, they were not liquid. However, bonds\nthat are secured by bundled assets can be traded in the secondary market; therefore, they are liquid. This liquidity is a benefit of securitization. In\naddition, securitization provides lenders with another source of capital aside from borrowing or selling equity.\nThings to remember:\nSecuritization is the process of bundling cash-generating loans that serve as collateral for bonds. The benefits of securitization include enhanced\nliquidity as well as an additional means to raise capital, but there is a risk that lenders may not exercise appropriate due diligence with respect to\nthe borrower's credit quality or the collateral that backs the loan.\nExplain benefits of securitization for issuers, investors, economies, and financial markets.", "qhtml": null}, {"n": 287, "q": "Which of the following is the last level of internal credit-loss protection for bondholders of an auto loan asset-backed security (ABS)?", "opts": ["Overcollateralization", "Excess spread account", "Sequential pay structure"], "ans": "C", "expl": "Auto loan asset-backed securities (ABS) are based on an underlying pool of auto loans and leases that have been securitized and sold to\ninvestors. The cash flows from these loans are used to pay the bonds' interest and principal. Credit enhancements are common elements\nembedded in ABS to reduce the investors' credit risk.\nInternal credit enhancements are processes undertaken by the issuer to cover potential cash shortages in servicing the debt. These\nenhancements are found in almost all auto loan ABS. Common forms of credit enhancement include:\nExcess spread account, a form of cash reserve funded from the difference between the interest received on the underlying loans and the\npayment to investors (ie, coupon). This is the first level of credit protection to absorb losses (Choice B).\nOvercollateralization, in which the face value of the underlying loan portfolio is larger than the principal value of the security. This is the\nsecond level of credit protection to absorb losses (Choice A).\nSequential pay structure, or multiple levels of subordination that create a sequential distribution of credit losses. The most junior tranche\nis the first to absorb losses, then the tranche above it, and so on until losses ultimately hit the most senior tranche. This is the third and last\nlevel of loss protection, as credit losses now begin to erode the investors' principal.\nThings to remember:\nInternal credit enhancement provides additional protection to bondholders. Common forms of credit enhancement include excess spread\naccounts, overcollateralization, and sequential pay structures. Credit losses are initially offset by an excess spread account, then by\novercollateralization, and, finally, by a sequential pay structure.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 288, "q": "Due to adverse losses on a credit card receivable asset-backed security (ABS), the early amortization period was triggered. Which of the following best describes the impact on investors? ", "opts": ["Principal repayment begins", "All cash flows to investors stop", "Only finance charges and fees are paid to investors"], "ans": "A", "expl": "Internal credit enhancements are created by the asset-backed security (ABS) issuer to cover potential cash shortages in servicing the ABS.\nCommon forms of credit enhancement for credit card ABS include:\nExcess spread account\nOvercollateralization\nSequential pay structure\nEarly amortization period\nThe early amortization enhancement results from the use of a lockout period which, in turn, is used to prevent the ABS being paid off before its\nscheduled maturity. The collateral backing the ABS decreases as cardholders pay off their credit card balances.\nDuring the lockout period, principal payments are used to acquire additional receivables.\nOnce the lockout period expires, principal payments are applied toward retiring the ABS at maturity.\nHowever, during the lockout period, if losses or events (eg, credit losses, issuer merger) threaten investors' returns, the early amortization period\ncan be triggered and principal payments will begin (Choices B and C). This insulates investors from potential credit losses regardless of the\nlockout period. The early amortization feature is the only way the principal cash flow schedule of the ABS can be modified and is a unique\nfeature of credit card receivable ABS.\nThings to remember:\nIf the early amortization period is triggered, principal payments are initiated to insulate investors from potential credit losses. The triggering of the\nearly amortization feature is the only way the principal cash flow schedule can be modified and is a unique investor protection feature of credit\ncard receivable asset-backed securities.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 289, "q": "If a collateralized debt obligation provision is triggered, requiring the return of principal to the senior tranche, the most likely cause for the trigger is the failure: ", "opts": ["of prespecified risk tests.", "to return principal to the equity tranche investors.", "to earn a return higher than the costs of issuing the bonds."], "ans": "A", "expl": "Collateralized debt obligations (CDOs) are a type of asset securitization similar to asset-backed securities (ABS). Sponsors of both CDOs and\nABS create special purpose entities that issue multiple tranches (ie, different classes) of bonds to raise funds. The funds pay for assets that\nbecome the collateral (ie, asset portfolio) for the CDO. The cash flow from the collateral is used to make distributions to investors.\nCDO collateral can include different types of assets with varying degrees of credit risk and rates of return (eg, commercial mortgage loans,\ncorporate debt, credit default swaps). ABS usually are collateralized by a specific type of loan (eg, auto, credit cards).\nLeveraged CDOs are structured like a waterfall, with several tranches of different seniority, including an equity tranche. The CDO manager\nuses funds raised for investment to construct an asset portfolio designed to earn a return that is sufficient to:\n1. pay bondholders the bond's interest and principal, in order of seniority,\n2. then pay investors in the equity tranche, and\n3. only then pay the CDO manager.\nThis structure typically includes restrictions known as prespecified risk tests (eg, maintain agreed-upon levels of coverage ratios, collateral\nquality) to ensure adequate cash flows for the senior tranche. If the CDO fails any of the prespecified risk tests, a provision is triggered that\nrequires principal payments to be redirected from junior classes to the senior class until the CDO is back in compliance with the tests.\nFailure to earn a return higher than the cost of issuing bonds is determined by the return on the investments made by the CDO manager.\nSuch a failure lowers the CDO manager's compensation; it can also affect the return to the equity tranche of the CDO. However, these\ncircumstances can occur without triggering the prespecified risk tests or affecting the senior tranche (Choices B and C).\nThings to remember:\nCollateralized debt obligations (CDOs) are structured like a waterfall, with several tranches of different seniority, including an equity tranche.\nThese structures include prespecified risk tests to protect the senior tranche. If a CDO fails any of the tests, then all principal is directed to the\nsenior tranche until the CDO structure is back in compliance.\nDescribe collateralized debt obligations, including their cash flows and risks\n4.An arbitrage collateralized debt obligation (CDO) holding a portfolio of fixed coupon bonds is funded in part by a floating rate senior tranche.\nThe interest rate mismatch of fixed rate collateral versus a floating rate tranche is:\nA. the CDO sponsor's risk-free profit.\nB. an excess spread used to fund a cash reserve.\n\nC. hedged with a fixed-for-floating interest rate swap.\nExplanation\nCollateralized debt obligations (CDOs) are a type of asset securitization that has some similarities to asset-backed securities (ABS). Sponsors\nof both CDOs and ABS create special purpose entities (SPEs) that issue multiple tranches (ie, different classes of securities) to raise funds. The\nfunds raised pay for the assets comprising the collateral (ie, asset portfolio). The cash flow from the collateral is used to make distributions to\ninvestors.\nMany CDOs have asset/liability interest rate mismatches. Senior tranches (eg, CDO liabilities) usually pay floating rates, and the collateral is\noften a portfolio of fixed-rate bonds (eg, CDO assets). Large interest rate increases could cause the interest owed on the senior tranche to be\ngreater than collateral interest income. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\n(Choice A) Arbitrage CDO is a name given to certain transactions, but they are not riskless strategies, so a risk-free profit is not earned by the\nsponsor.\n(Choice B) An excess spread is the difference between the interest earned on the asset portfolio and the interest owed on the tranches. There is\nno excess spread in a CDO since any interest above the amount owed on the debt tranches is distributed to the equity tranche.\nThings to remember:\nCollateralized debt obligations (CDOs) often have an interest rate mismatch: senior tranches that pay floating interest rates versus an asset\nportfolio of fixed-rate bonds. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 290, "q": "An arbitrage collateralized debt obligation (CDO) holding a portfolio of fixed coupon bonds is funded in part by a floating rate senior tranche. The interest rate mismatch of fixed rate collateral versus a floating rate tranche is:", "opts": ["the CDO sponsor's risk-free profit.", "an excess spread used to fund a cash reserve.", "hedged with a fixed-for-floating interest rate swap."], "ans": "C", "expl": "Collateralized debt obligations (CDOs) are a type of asset securitization that has some similarities to asset-backed securities (ABS). Sponsors\nof both CDOs and ABS create special purpose entities (SPEs) that issue multiple tranches (ie, different classes of securities) to raise funds. The\nfunds raised pay for the assets comprising the collateral (ie, asset portfolio). The cash flow from the collateral is used to make distributions to\ninvestors.\nMany CDOs have asset/liability interest rate mismatches. Senior tranches (eg, CDO liabilities) usually pay floating rates, and the collateral is\noften a portfolio of fixed-rate bonds (eg, CDO assets). Large interest rate increases could cause the interest owed on the senior tranche to be\ngreater than collateral interest income. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\n(Choice A) Arbitrage CDO is a name given to certain transactions, but they are not riskless strategies, so a risk-free profit is not earned by the\nsponsor.\n(Choice B) An excess spread is the difference between the interest earned on the asset portfolio and the interest owed on the tranches. There is\nno excess spread in a CDO since any interest above the amount owed on the debt tranches is distributed to the equity tranche.\nThings to remember:\nCollateralized debt obligations (CDOs) often have an interest rate mismatch: senior tranches that pay floating interest rates versus an asset\nportfolio of fixed-rate bonds. CDOs hedge the interest rate mismatch with interest rate swaps (ie, pay fixed/receive floating).\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 291, "q": "During the lockout period for asset-backed securities (ABS) secured by credit card receivables, payments made by cardholders on the credit card debt balances are most likely used to:", "opts": ["establish a reserve fund to cover future defaults by cardholders.", "purchase additional credit card receivables to replace collateral that was paid off.", "reimburse the ABS issuer for any principal and/or interest it advanced to investors."], "ans": "B", "expl": "Credit card receivables can be used as collateral for asset-backed securities (ABS). Cash flows used to pay principal and interest on the ABS\ncome from two sources:\nPrincipal payments made by cardholders on their credit card debt\nInterest on outstanding card balances and other charges imposed by the credit card issuer\nAs cardholders pay off their credit card balances, the collateral backing the ABS decreases. To prevent the possibility of the ABS being paid off\nbefore its scheduled maturity, credit card ABS often include one or more lockout periods.\nDuring a lockout period, the ABS investors receive only the interest and late charges collected from cardholders, not payments on principal.\nThe ABS issuer uses principal payments to purchase additional receivables to replace the collateral that was paid off. When the lockout period\nends, the issuer resumes distributing all payments to the ABS investors.\n(Choice A) A reserve fund can be used to pay ABS investors if the securitized assets default, but it is not used to purchase additional collateral.\n(Choice C) Reimbursing an issuer for advances of interest and/or principal is unrelated to a lockout period.\nThings to remember:\nA lockout period is when the asset-backed securities (ABS) issuer uses payments made on the credit card debt principal to purchase additional\nreceivables, which replace the ABS's collateral that was paid off. During the lockout period, ABS investors receive interest payments made on\noutstanding credit card debt, and other charges imposed by the credit card company on cardholders.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 292, "q": "In a falling interest rate environment, an auto loan asset-backed security (ABS) most likely exposes an investor to:", "opts": ["balloon risk.", "extension risk.", "contraction risk."], "ans": "C", "expl": "Auto loan asset-backed securities: prepayment dynamics\nAmortizing auto loans and leases\nSecuritized by\nNonrecourse loans\nChanges in interest rates\nEarly loan payoff\nVehicle ownership change\nSubject to prepayment risk due to\nSales and trade-ins\nRepossessions and resale\nInsurance proceeds for destroyed autos\nAuto loan asset-backed securities (ABS) are securitized by amortizing, nonrecourse loans, which are prone to prepayments. Prepayment risk is\nnormally associated with changing interest rates, but auto loan ABS are also impacted by other factors. There are two forms of prepayment risk:\ncontraction risk and extension risk.\nContraction risk is most acute when interest rates fall and lead to refinancing (eg, mortgage, auto loan), which pay loans off early. More\nprepayments than expected shorten the life of the ABS, resulting in a reduction in the final maturity.\nExtension risk occurs when interest rates increase; higher rates result in slower prepayments than expected and lengthen the security's\nlife (Choice B).\nAuto loan ABSs have other elements that affect the speed of prepayments not directly tied to interest rates, which exposes investors to more\ncontraction risk.\nExamples include:\nborrowers who choose to pay the loan early\nsales and trade-ins\nrepossessions and resales\ninsurance proceeds for destroyed vehicles\n(Choice A) Balloon risk refers to a risk of partially amortizing and interest-only loans that have balloon payments due at the end of the loan.\nBalloon payments are unusual for auto loans and therefore are not a risk for holders of auto loan ABS.\nThings to remember:\nAuto loan asset-backed securities (ABS) are subject to contraction risk when more prepayments than expected shorten the maturity of the ABS.\nFalling interest rates play a large role when loans are refinanced, but other factors (eg, early loan payoff, sales, trade-ins, repossession, resale,\ninsurance proceeds for destroyed vehicles) also have impacts.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 293, "q": "Credit card receivable asset-backed securities (ABS) are not subject to contraction risk since the underlying pool of loans is most likely:", "opts": ["amortizing.", "non-amortizing.", "partially amortizing."], "ans": "B", "expl": "Credit card receivable asset-backed securities (ABS) have underlying collateral made up of credit card accounts (ie, consumer loans) that have\nbalances that:\nvary widely (eg, $0 or $20,000) and\nmay increase or decrease over the duration of the ABS.\nSince they do not have a fixed principal repayment schedule, the loans are non-amortizing. When non-amortizing loans serve as ABS collateral,\nthe collateral (and therefore the ABS) is not subject to the prepayment risks of contraction and extension.\nIn contrast, other kinds of ABS (eg, auto loans, home loans) may be backed by loans (ie, amortizing, partially amortizing) that require regular\nprincipal payments and are subject to prepayment risks (Choices A and C).\nThings to remember:\nCredit card receivable asset-backed securities (ABS) are collateralized by non-amortizing loans; therefore, they are not subject to the prepayment\nrisks of contraction and extension. In contrast, other kinds of ABS may be backed by loans (ie, amortizing, partially amortizing) that require regular\nprincipal payments and are subject to prepayment risks.\nDescribe types and characteristics of non-mortgage asset-backed securities, including the cash flows and risks of each type", "qhtml": null}, {"n": 294, "q": "If covered bondholders do not receive payments as scheduled and the bond has a soft-bullet redemption regime, the bond default is most likely:", "opts": ["delayed, and final maturity is extended.", "triggered, and bond payments are accelerated.", "delayed, and the bond converts to a pass-through structure."], "ans": "A", "expl": "Covered bond redemption regimes\nIf fund sponsor defaults:\nHard bullet Default triggered; payments accelerate\nSoft bullet Default delayed; final maturity date extended\nConditional pass- Pass-through mode triggered only if bonds are not retired at\nthrough original maturity date\nA type of asset-backed security (ABS), a covered bond is secured by collateral consisting of a pool of loans (eg, auto loans, home mortgages).\nInterest and principal payments on ABS depend exclusively on the timely payment of the interest and principal on the underlying loans.\nUnlike other ABS, covered bonds offer an additional layer of protection since bondholders have dual recourse, which allows a claim on both the\nissuer and the cover pool (ie, underlying pool of loans). Other kinds of ABS are typically issued by a special purpose entity so that the issuer\nremains bankruptcy remote.\nIf payments on covered bonds are not received as scheduled, stipulations in the issuing documents (ie, loan covenants) called redemption\nregimes determine how the bonds are impacted. The three types of covered bond redemption regimes are as follows:\nHard bullet: Bond default is triggered and all payments are due immediately. This is the typical treatment for bonds of all types in the event\nof issuer default (Choice B).\nSoft bullet: Bond default is delayed and payments continue on the original schedule. The issuer's failure to pay does not trigger default\nsince the maturity date is extended (eg, to 12 months). A failure to pay principal and interest on the new, extended maturity date will\ntrigger default.\nConditional pass-through: Bond default is not triggered and payments continue on the original schedule. If payments are not fully\nsatisfied at maturity (ie, conditional), the bond is converted to pass-through mode, in which payments are funneled directly from the\nunderlying pool to bondholders until the original expected cash flow payments are met (Choice C).\nThings to remember:\nA covered bond is a type of asset-backed security. Covered bonds may have hard-bullet, soft-bullet, or conditional pass-through redemption\nregimes.\nDescribe characteristics and risks of covered bonds and how they differ from other asset-backed securities", "qhtml": null}, {"n": 295, "q": "A mortgage-backed securities (MBS) issuer is concerned that interest rates will soon fall, so it structures tranches with various maturities to mitigate prepayment risk. This most likely describes: ", "opts": ["time tranching.", "credit tranching.", "floating-rate tranching."], "ans": "A", "expl": "Time tranching example\nTranche Average life (years)\nA 5.2\nB 12\nC 16\nD 22\nMortgage-backed securities (MBS) are bonds created by bundling residential or commercial mortgage loans. The principal repayments and\ninterest provide cash flow to MBS investors. To attract investors with different levels of risk tolerance or time preferences, MBS may be structured\nas multiple classes or tranches, which create different cash flows and therefore risk exposures for investors.\nOne risk borne by MBS investors is prepayment risk. When interest rates fall, borrowers may accelerate repayment of principal, either in part or in\nfull. This phenomenon (ie, contraction risk) reduces the maturity of the MBS and future cash flows to investors.\nTo mitigate prepayment risk for certain MBS investors, issuers structure different bond classes with different maturities. Known as time tranching,\nthis redistributes prepayment risk by allocating all principal payments, including all prepayments, to the tranches with shorter expected\nmaturities first. Once the shorter-lived tranches are retired, the principal payments are allocated to tranches with longer expected maturities.\n(Choice B) Credit tranching addresses default risk, which refers to the possibility that the borrowers of loans serving as collateral may default,\neither in part or in full.\n(Choice C) Floating-rate tranches are created by combining fix-rated collateral with floating-rate instruments. Floating-rate tranches are not\ndesigned to mitigate prepayment risk.\nThings to remember:\nMortgage-backed securities (MBS) issuers structure different bond classes with different maturities (ie, time tranching) to mitigate prepayment risk\nfor certain MBS investors. Time tranching redistributes prepayment risk by allocating all principal payments, including all prepayments, to the\ntranches with shorter expected maturities first.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}, {"n": 296, "q": "In securitizations that create residential mortgage-backed securities (RMBS), credit tranching most likely refers to multiple classes of bonds that offer unequal: ", "opts": ["default risk.", "extension risk.", "contraction risk."], "ans": "A", "expl": "Asset-backed securities are bonds created from securitizing cash-generating assets, such as residential mortgages or credit card receivables.\nAs the schematic above shows, the assets are bundled and sold to a special purpose entity (SPE) that uses them as collateral for bonds. The\ncash flows from the loans pay the bonds' interest and principal. Residential mortgage-backed securities (RMBS) are a type of ABS.\nOne type of risk that RMBS present to bondholders is default risk. This refers to the possibility that borrowers of the loans serving as collateral\ndefault, either in full or in part. Since the cash flows from the collateral are the primary source of payments for the bonds, defaults can\nsignificantly impact the bondholders' expected returns.\nSome securitization structures attempt to mitigate the risk of defaults through credit tranching. Instead of issuing only one class of bonds from\nthe securitization, a credit-tranched structure uses multiple classes. Subordinate classes are the first to absorb losses caused by defaults in the\ncollateral, which shields senior classes from some default risk.\n(Choices B and C) Extension risk and contraction risk are two types of prepayment risks. Securitizations may offer different classes of bonds\nthat allow investors to determine how much prepayment risk they want to be exposed to; this is known as time tranching.\nThings to remember:\nInvestors in mortgage-backed securities (MBS) are exposed to the risk that the borrowers for the loans that serve as the MBS collateral may\ndefault. A securitization structure that creates different classes of bonds that allocate default losses differently is known as credit tranching.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}, {"n": 297, "q": "Which of the following instruments is least likely to have loans as its collateral?", "opts": ["Credit card asset-backed security", "Nonagency residential mortgage-backed security", "Sequential-pay collateralized mortgage obligation"], "ans": "C", "expl": "Collateral for asset-backed securities (ABS)\nABS Typical collateral\nResidential mortgage-backed securities (RMBS) Residential mortgage loans\nCollateralized mortgage obligations (CMO) Mortgage-related products (eg, RMBS)\nCommercial mortgage-backed securities (CMBS) Commercial mortgage loans\nCollateralized debt obligations (CDO) Loans, other ABS, structured securities\nNon-mortgage asset-backed securities (ABS) Credit card loans, auto loans\nSecuritized debt instruments, broadly known as asset-backed securities (ABS), are created using collateral which is sold to a special purpose\nentity (SPE). The SPE then sells bonds backed by the collateral. As shown in the table above, there are different types of ABS, which have\ndifferent forms of collateral.\nResidential mortgage-backed securities (RMBS) are bonds that are securitized by pools of residential mortgage loans. Agency RMBS are issued\nand typically guaranteed by a sovereign government or one of its agencies. A nonagency RMBS is issued by a private entity and has no\ngovernment guarantee.\nThe collateral for agency and nonagency RMBS consists of residential mortgage loans (Choice B). Credit card receivables, which are unsecured\nloans, are the collateral for credit card ABS (Choice A).\nA collateralized mortgage obligation (CMO) is similar to a residential mortgage-backed security except that the collateral is one or more ABS\ninstead of actual loans. A typical CMO is structured with multiple tranches of bonds. Payments on the loans that secure the ABS are then\ndistributed to the CMO investors. A sequential-pay CMO is designed so that each tranche is retired in order of seniority; only the most senior\ntranche then existing receives principal payments until that tranche has been retired.\nThings to remember:\nAsset-backed securities (ABS) are collateralized bonds. The collateral varies with each type of ABS. Residential mortgage-backed securities and\ncredit card ABS are collateralized with loans. Collateralized mortgage obligations are generally collateralized with other ABS, not with actual\nloans.\nDescribe collateralized debt obligations, including their cash flows and risks", "qhtml": null}, {"n": 298, "q": "A key distinction regarding collateral of a covered bond compared to other types of asset-backed securities is:", "opts": ["only covered bonds are overcollateralized.", "a covered bond's collateral remains on the issuer's balance sheet.", "the issuer of a covered bond does not substitute for defaulted collateral."], "ans": "B", "expl": "Covered bonds vs. other asset-backed securities (ABS)\nCovered bonds Other ABS\nAssets transferred to special entity\nAssets remain on issuer's balance sheet\nInvestors exposed to credit risk if collateral\nIssuer replaces nonperforming collateral\ndefaults\nA covered bond is a type of asset-backed security (ABS) secured by collateral consisting of pools of loans (eg, auto loans, home mortgages).\nInterest and principal payments on an ABS depend on timely payment of the interest and principal on the underlying loans. If the underlying loans\ndefault, the ABS investors risk not receiving interest and principal.\nMost ABS issues have a general structure in which the collateral is transferred to a special-purpose entity that becomes the security's legal issuer.\nBond indentures (ie, contracts governing the rights and obligations of the issuer and bondholders) typically allow bondholders to seek payment\nfrom the special entity if the ABS defaults. This can limit recovery since, in most cases, the special entity has no assets other than the ABS\ncollateral.\nCovered bonds mitigate bondholders' risk in two ways (ie, dual recourse). First, collateral remains on the issuer's balance sheet instead of\nbeing transferred to a special entity; this gives investors in a covered bond direct recourse against the issuer. Second, if the covered bond's\ncollateral is in default, the issuer must replace it with good collateral; this replacement feature is not commonly used in other types of ABS.\n(Choice A) Overcollateralization is an internal credit enhancement in which the issuer pledges collateral worth more than the bond's principal. It\ncan be used with all types of bonds, not just covered bonds.\n(Choice C) Covered bonds do use collateral substitution to protect bondholders against losses from collateral default.\nThings to remember:\nA covered bond is a type of asset-backed security (ABS). It differs from most types of ABS in that the security's collateral remains on the issuer's\nbalance sheet and the issuer commits to substitute defaulted collateral with good collateral.\nDescribe characteristics and risks of covered bonds and how they differ from other asset-backed securities", "qhtml": null}, {"n": 299, "q": "For asset securitization, credit tranching is most likely used:", "opts": ["as a waterfall structure.", "for mitigation of prepayment risk.", "as a method of overcollateralization."], "ans": "A", "expl": "Bond credit enhancements and uses\nEnhancement Use\nSubordination Senior tranches have priority over junior tranches\nInternal Overcollateralization Issuer pledges assets worth more than the amount borrowed\nReserve accounts Excess cash received from financed asset deposited in a separate account\nSurety bonds Payment guarantees issued by insurance companies\nExternal Letters of credit Guarantees from financial institutions other than insurance companies\nCash collateral accounts Cash deposited by guarantor that issuer can borrow\nThe process of securitizing pooled assets provides investors the opportunity to invest in tailored risk exposures and specified rates of returns.\nInvestors' exposure to credit risk is reduced with enhancements, or features designed to redistribute risk by absorbing or reallocating potential\nlosses.\nA common feature is credit tranching, in which pooled assets are segmented into tranches and each tranche is issued as a separate security,\nrepresenting a different priority claim on the security's cash flows. Losses are allocated to tranches in a predetermined manner, with lower-rated\ntranches absorbing losses first. This structure is primarily used to shield investors in more senior tranches from default risk. It is also known\nas a waterfall structure due to how payments are allocated across tranches.\n(Choice B) Time tranching, not credit tranching, is primarily used to mitigate prepayment risk since it relies on segmenting the asset pool by using\nsecurities with different maturities.\n(Choice C) Overcollateralization may be used in addition to credit tranching. Generally, absorbed losses need to first exhaust the full amount of\novercollateralization before the credit tranching structure applies.\nThings to remember:\nCredit tranching (ie, waterfall structure) is a type of enhancement used to protect investors from default risk. A waterfall structure allocates losses\nto lower-rated tranches first, thus shielding investors in more senior tranches from default risk.\nDescribe typical credit enhancement structures used in securitizations.", "qhtml": null}, {"n": 300, "q": "The pass-through rate for a mortgage pass-through security most likely refers to the:", "opts": ["security's coupon rate.", "monthly prepayment rate on the underlying loans.", "weighted average coupon rate of the underlying mortgage loans."], "ans": "A", "expl": "A mortgage pass-through security (pass-through) is a bond created from bundling (ie, pooling) individual mortgage loans that serve as the\ncollateral for the pass-throughs. The pass-through rate is the coupon rate for this security. Cash generated by payments on the mortgage loans\nis used to pay the pass-through rate as well as the security's principal.\nThe collateral may consist of thousands of individual mortgages, and each might have a unique interest rate. The average interest rate for the\ncollateral is referred to as the weighted average coupon (WAC).\nThe pass-through rate is lower than the WAC since each pass-through has servicing and administrative fees (Choice C). In the diagram, the\ncollateral's WAC is assumed to be 5.0%, while the pass-through rate is 4.5%. The 0.5% difference represents the servicing and administrative\nfees associated with the issue.\n(Choice B) The monthly prepayment rate is referred to as the single monthly mortality rate (SMM).\nThings to remember:\nA mortgage pass-through is an asset-backed security for which the collateral consists of pooled individual mortgages. Pass-throughs pay interest\nand principal to their investors from cash generated by borrowers paying on the collateral mortgages. The pass-through rate is the pass-through's\ncoupon rate, which is less than the weighted average coupon rate of the collateral.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null}, {"n": 301, "q": "An issuer constructs a mortgage pass-through security with the following underlying collateral: If the issuer charges a servicing fee of 25 basis points, then the pass-through rate is closest to:", "opts": ["4.48%", "4.50%", "4.75%"], "ans": "B", "expl": "Issuers create mortgage pass-through securities (ie, pass-throughs) by pooling individual mortgage loans and using the pool as collateral for the\npass-through security, which is then sold to investors. Investors receive cash returns generated from the pool of monthly mortgage payments.\nThe mortgage pool usually consists of multiple mortgages with different interest rates. The pass-through rate (ie, coupon rate that pass-through\ninvestors receive) equals the weighted average coupon (WAC) less servicing and administrative fees. The WAC is the weighted average of the\nmortgage rates for the pooled mortgages, with the weights being each mortgage balance as a percentage of the total balances. In this scenario,\nthe WAC is 4.75% and the fees are 0.25%, so the pass-through rate is 4.50%.\n(Choice A) 4.48% results from taking the simple average, not the weighted average, of the coupons.\n(Choice C) 4.75% results from not subtracting the servicing fe
