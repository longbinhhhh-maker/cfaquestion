e from the WAC.\nThings to remember:\nThe pass-through rate (ie, coupon rate that investors receive on mortgage pass-through securities) equals the weighted average coupon (WAC)\nless servicing and administrative fees.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null}, {"n": 302, "q": "The risk to the cash flows investors receive from agency pass-through mortgage-backed securities is most likely related to:", "opts": ["prepayment risk.", "reinvestment risk.", "borrower defaults."], "ans": "A", "expl": "Prepayment risk of mortgage-backed securities\nCauses Consequences Effects on investment value\nDeclining interest Shorter average life of mortgage- Higher cash flows in early years that must be\nContraction risk\nrates backed securities reinvested at lower interest rates\nDefers more of cash flows to later years,\nLonger average life of mortgage-\nExtension risk Rising interest rates reducing their present value and price of\nbacked securities\nsecurity\nAgency pass-throughs are a type of mortgage-backed security (MBS): Investors receive a share of the interest and principal from a pool of\nmortgage loans. Since most mortgages give borrowers the right to prepay their loans, actual periodic cash flows from an MBS may vary as\nthe effective maturity (ie, average life) of the MBS varies. Prepayment risk refers to the uncertainty of MBS cash flows and maturity.\nThere are two components of prepayment risk:\nContraction risk: Declining interest rates encourage borrowers to refinance their loans, resulting in early repayment (ie, prepayment) of the\noriginal mortgages. This accelerated return of principal forces reinvestment of higher-than-anticipated cash flows at lower interest rates.\nExtension risk: Rising interest rates cause fewer refinancings and prepayments, so a larger portion of MBS cash flows is deferred further\ninto the future. The deferral of cash flows, along with the higher rates at which they are discounted, results in a decline in MBS values.\n(Choice B) Reinvestment risk relates to the uncertainty of the interest rate at which cash flows are reinvested, not the uncertainty of the cash\nflows received from holding an MBS. Changes in prepayment rates result in changes in the amount of reinvestment risk MBS holders are\nexposed to, so there is a connection between prepayment risk and reinvestment risk. However, they are defined as distinct types of risk.\n(Choice C) An agency MBS has either a government guarantee or an agency guarantee, so borrower defaults do not affect the cash flow\nuncertainty of these securities.\nThings to remember:\nAn agency pass-through mortgage-backed security (MBS) is an investment in pools of mortgage loans. Borrowers usually have the right to\nprepay such loans, which creates uncertainty as to the effective maturity of the MBS. This uncertainty is referred to as prepayment risk.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null}, {"n": 303, "q": "A portfolio of government securities is constructed to match the cash flow stream of the interest and principal payments of a commercial mortgage and to effectively retire that mortgage. This process is best described as a: ", "opts": ["defeasance.", "sinking fund.", "securitization."], "ans": "A", "expl": "Defeasance\nPurpose A form of call protection for investors in commercial mortgage-backed securities (CMBS)\nOccurrence When a borrower prepays a mortgage loan that is held in a CMBS\nThe borrower must provide funds to construct a portfolio of government securities to match the original loan's cash flow\nDescription\nstream\nFunction To protect the CMBS investor from prepayment risk\nUnlike residential mortgage-backed securities (RMBS), commercial mortgage-backed securities (CMBS) use call protections to mitigate\nprepayment risk. Due to this call protection, CMBS trade more like corporate bonds than RMBS.\nDefeasance is a form of call protection for CMBS bondholders. To prepay a commercial mortgage loan in the underlying CMBS, a borrower\nmust provide funds for constructing a portfolio of government securities to match the cash flow stream of the original interest and principal\npayments. This process effectively retires the loan—which has been defeased by the economically equivalent government securities portfolio—\nand the CMBS investor is made whole.\n(Choice B) A sinking fund arrangement details a schedule for gradually retiring a portion of a bond's principal over time.\n(Choice C) Securitization is the process of bundling cash-generating loans that serve as collateral for bonds.\nThings to remember:\nDefeasance is a form of call protection for commercial mortgage-backed securities (CMBS) bondholders. To prepay a commercial mortgage loan\nin the underlying CMBS, a borrower must provide funds for constructing a portfolio of government securities to match the cash flow stream of the\noriginal interest and principal payments. This process effectively retires the loan, and the CMBS investor is made whole.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null}, {"n": 304, "q": "For a commercial mortgage loan, a high debt service coverage ratio coupled with a low loan-to-value ratio is most likely indicative of:", "opts": ["low credit risk.", "high balloon risk.", "low prepayment risk."], "ans": "A", "expl": "Ratios for assessing credit risk\nLoan-to-value (LTV) = Loan amount / Property value\nDebt service coverage (DSC) = Net operating income / Annual principal and interest\nCommercial mortgage–backed securities (CMBS) consist of bundled commercial mortgage loans. Each loan is secured by income-generating\ncommercial property that the lender may sell if the borrower defaults. Lenders should appropriately gauge each borrower's level of credit risk with\nmetrics such as the loan-to-value (LTV) ratio and the debt service coverage (DSC) ratio.\nThe LTV is the ratio of the loan amount to the property value. Low LTVs suggest that the borrower has a lower chance of defaulting due to high\nequity (ie, property value − loan amount). Furthermore, higher property value (denominator) relative to the loan amount (numerator) suggests that\neven if the borrower defaults, the lender can adequately recoup the loan with the proceeds from selling the property.\nThe DSC ratio is the ratio of net operating income (NOI) to annual principal and interest owed, where NOI equals annual rental income less cash\noperating expense and depreciation reserve. High DSC ratios indicate that the borrower can better service its annual debt obligations, lowering\ncredit risk. Therefore, a low LTV in conjunction with a high DSC confirms low credit risk.\n(Choice B) Balloon risk is primarily driven by the features of the mortgage, not the financial performance of the borrower; therefore, it is not\nindicative of credit risk. Balloon risk stems from underlying mortgages that require a disproportionally large principal repayment at maturity.\n(Choice C) Prepayment risk is primarily driven by the level of interest rates, not the financial performance of the borrower; therefore, it is not\nindicative of credit risk.\nThings to remember:\nThe loan-to-value (LTV) ratio is the ratio of the loan amount to the property value. The debt service coverage (DSC) ratio is the ratio of net\noperating income (NOI) to annual principal and interest owed, where NOI equals annual rental income less cash operating expense and\ndepreciation reserve. A low LTV in conjunction with a high DSC suggests low credit risk.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null}, {"n": 305, "q": "For commercial mortgage–backed securities, which of the following mechanisms is least likely to provide call protection at the loan level?", "opts": ["Prepayment lockout", "Sequential-pay tranches", "Yield maintenance charge"], "ans": "B", "expl": "CMBS call protection mechanisms at the loan level\nPrepayment\nDisallows prepayments within a specified timeframe\nlockout\nPrepayment Predetermined percentage fee charged on outstanding\npenalty points balance if borrower wishes to refinance\nYield maintenance Fee to compensate lenders based on the difference between\ncharge new, lower borrowing rates and existing borrowing rates\nBorrower provides funds to the servicer to construct a portfolio\nDefeasance of government securities that replicates monthly mortgage\npayments\nCMBS = commercial mortgage–backed security.\nA commercial mortgage–backed security (CMBS) is created from pooled mortgages on commercial properties (eg, office buildings, warehouses).\nCMBS investors receive cash flows from the underlying commercial mortgage payments. Excess principal prepayments can arise as borrowers\nrefinance existing loans when interest rates fall, which forces investors to reinvest the proceeds at a lower rate. A CMBS can limit prepayment risk\nfor investors by providing call protection at the individual loan level and at the structural level.\nAt the individual loan level, mechanisms such as prepayment lockout and yield maintenance charges discourage borrowers from making excess\nprepayments (Choices A and C). Yield maintenance charges compensate lenders and are based on the difference between new, lower\nborrowing rates and existing borrowing rates.\nAt the structural level, certain mechanisms can redistribute aggregate prepayment risk from one class of investor to another. For example,\nsequential-pay tranches shift prepayment risk away from investors in one tranche by first distributing excess principal prepayments to other\ntranches.\nThings to remember:\nCommercial mortgage–backed securities (CMBS) provide investors with call protection at the structural level and at the individual loan level. The\nfour call protection mechanisms at the individual loan level are prepayment lockout, prepayment penalty points, yield maintenance charges, and\ndefeasance.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null}, {"n": 306, "q": "A homeowner borrowed $850,000 in a 30-year fully amortizing recourse mortgage loan to purchase a house that secures the loan. The borrower defaults on the loan at the end of Year 3, when the loan has been amortized by $25,000. Interest rates have increased so that the present value of the loan is $800,000. If the lender forecloses on the loan and receives $750,000 from the sale of the house, the amount that the lender can recover from the borrower is closest to:", "opts": ["$50,000", "$75,000", "$100,000"], "ans": "B", "expl": "A mortgage is a loan for which specific real property is used as security. If the borrower defaults, the lender can foreclose on the collateral, which\nmeans that the lender can seize the property and sell it to repay the loan. A recourse loan means that the lender can seize other assets from\nthe borrower if the proceeds are insufficient to fully repay the loan. In a nonrecourse loan, the collateral is the lender's only source of repayment.\nIn this question, the outstanding loan amount is $825,000 ($850,000 − 25,000) when the borrower defaults. The sale of the collateral results in\nproceeds of $750,000, so $75,000 remains unpaid on the loan balance. The question stipulates that this is a recourse loan, so the lender can\nassert a claim for $75,000 against the borrower's additional assets.\n(Choice A) $50,000 is the difference between the proceeds from the sale of the collateral and the present value of the loan. Shortfalls from\nforeclosures are based on the amortized loan balance, not the present value of the loan.\n(Choice C) $100,000 results from incorrectly calculating the outstanding balance as $850,000; this fails to account for the $25,000 amortization.\nThings to remember:\nA mortgage is a loan secured by specific real property. If the borrower defaults, the lender can sell the collateral and use the proceeds to satisfy\nthe loan. A recourse loan allows the lender to assert a claim for any shortfall against the borrower's other assets. A nonrecourse loan allows the\nlender to sell only the collateral to satisfy the loan.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}, {"n": 307, "q": "Which of the following best describes a consequence of a nonrecourse mortgage loan in the event of default?", "opts": ["The borrower cannot be forced into foreclosure.", "The borrower can be held liable for the entire loan balance.", "The lender receives only the proceeds from the sale of the property."], "ans": "C", "expl": "Residential mortgage default remedies\nBorrower is responsible for the entire mortgage balance\nRecourse loan Lender has a claim on borrower's other assets to satisfy any shortfall\nCommon in European countries\nLender receives only the proceeds from the sale of the property\nNonrecourse loan Borrowers often turn to strategic default on underwater mortgages\nCommon in the United States\nA residential mortgage is a loan with residential property used as collateral. If the borrower defaults, the lender can foreclose, which is a legal\nprocess by which the lender can take possession of the property and sell it to obtain payment for the loan. Recourse and nonrecourse refer to the\nlegal options available to a lender in the event that the borrower does not pay the scheduled interest and principal payments.\nIn a nonrecourse loan, the lender can claim only the proceeds from the sale of the property. In a recourse loan, the lender can seize other\nassets from the borrower if the proceeds from selling the property are insufficient to fully repay the loan (Choice B).\n(Choice A) Foreclosure is a remedy for the lender in the event of a default under either loan type.\nThings to remember:\nRecourse and nonrecourse refer to the legal options available to a lender in the event that the borrower does not pay the scheduled interest and\nprincipal payments. In a recourse loan, the lender can seize other assets from the borrower if the proceeds from selling the property are\ninsufficient to fully repay the loan. In a nonrecourse loan, the lender's only remedy is the proceeds from the sale of the property.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}, {"n": 308, "q": "An issuer creates a sequential-pay collateralized mortgage obligation that consists of Tranches A, B, C, and D. The face value of each tranche is paid in order of seniority, with Tranche A the most senior and Tranche D the least senior. The collateral consists of 30-year residential mortgages. An investor in Tranche D most likely assumes a greater exposure to:", "opts": ["balloon risk.", "extension risk.", "contraction risk."], "ans": "B", "expl": "A collateralized mortgage obligation (CMO) is a type of mortgage-backed security (MBS). A CMO has multiple issues, or tranches, of bonds\nthat are backed by the mortgages. The cash from mortgage payments pays bonds' interest and principal. Each tranche has different rules\nregarding both the timing and amount of principal that it receives from the collateral's cash flows.\nIn a sequential-pay residential CMO, all tranches receive interest payments but only the most senior tranche (Tranche A in this example)\nreceives principal (including any prepayments) until its face value has been paid. The next senior tranche (Tranche B) then receives principal,\nand so on, until all tranches have been paid. Junior tranches (eg, Tranche D) must wait until the tranches senior to them (eg, Tranches A, B, and\nC) are completely paid. This increases the extension risk (ie, the risk that the maturity will be longer than expected) to junior tranches.\n(Choice A) Balloon risk is a type of default risk that applies to CMOs that are backed by commercial mortgages. Many commercial mortgages\nrequire a large principal payment at maturity (ie, the \"balloon\"). CMO investors are exposed to the risk that the borrower will be unable to make\nthe balloon payment.\n(Choice C) Contraction risk is the possibility that the bond will mature more quickly than anticipated due to higher-than-expected prepayments.\nThis risk is more associated with senior tranches of a sequential pay CMO.\nThings to remember:\nA sequential-pay CMO issues multiple tranches of bonds. Principal payments from the collateral are allocated only to the most senior tranche until\nits face value has been paid. Investors in the junior tranches assume the most extension risk, while the senior tranches assume the most\ncontraction risk.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null}, {"n": 309, "q": "Which of the following types of residential mortgage loan is least likely to result in a balloon payment at maturity?", "opts": ["Interest-only", "Fully amortizing", "Partially amortizing"], "ans": "B", "expl": "An amortizing loan is characterized by a payment schedule that gradually increases principal repayments over time. In a traditional fixed-rate\nmortgage loan, the total payment is fixed, but over time the underlying principal component increases while the interest component decreases.\nFully amortizing loans completely pay both principal and interest by the time the last scheduled payment is made. Thus, the mortgage loan has\nbeen fully satisfied, and the borrower is under no additional obligation.\n(Choice A) Interest-only loans do not include any principal payments. At the end of the mortgage period, the entire original principal balance is\ndue as a balloon payment.\n(Choice C) Partially amortizing loans do not completely retire the principal, resulting in a balloon payment, which is the remaining principal\nneeded to retire the loan. Balloon payments often require the borrower to refinance the remaining principal into a new mortgage loan.\nThings to remember:\nFully amortizing loans completely pay both principal and interest by the time the last scheduled payment is made. Thus, the mortgage loan has\nbeen fully satisfied and the borrower is under no additional obligation. Partially amortizing and interest-only loans result in balloon payments at the\nend of the mortgage.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}, {"n": 310, "q": "A local bank advertises the availability of 30-year home mortgages that carry a 4% annual interest rate for the first 10 years. After that, the interest rate becomes variable until maturity. This type of mortgage is most likely a: ", "opts": ["hybrid mortgage.", "variable mortgage.", "convertible mortgage."], "ans": "A", "expl": "A mortgage is a loan that is collateralized by specific real property, such as a house. Payment of interest and principal on mortgages can be\nstructured in different ways. A hybrid mortgage begins as a fixed-rate mortgage for a specified period (eg, 10 years). At the end of the period,\nthe mortgage automatically changes to a variable rate mortgage for the remainder of its life.\n(Choice B) A variable mortgage has a variable interest rate from inception until it matures.\n(Choice C) A convertible mortgage is similar to a hybrid mortgage, except that the borrower decides whether the mortgage becomes a variable\nrate at the end of the initial fixed-rate period.\nThings to remember:\nA hybrid mortgage begins as a fixed-rate mortgage for a specified period. At the end of the period, it automatically changes to a variable mortgage\nfor the remainder of its life. A convertible mortgage is similar to a hybrid mortgage, except that the borrower decides whether the mortgage\nchanges to a variable rate at the end of the initial fixed-rate period.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}, {"n": 311, "q": "Which of the following is most likely a credit enhancement for commercial mortgage-backed securities (CMBS)?", "opts": ["Subordination", "Call protection", "Limits on loan-to-value ratio (LTV)"], "ans": "A", "expl": "Commercial mortgage-backed securities (CMBS) typically include multiple bond classes (ie, tranches), each with its own credit rating. CMBS\nallocate cash flows and credit losses from the underlying collateral to create a series of senior and subordinate tranches and offer investors a\nrange of credit ratings and credit risk.\nCMBS use subordination as a credit enhancement to allocate collateral losses to the lowest-rated (ie, most-subordinated) tranche with\nremaining principal value. The more junior (ie, more subordinated) the tranche, the greater the exposure to credit risk. The more senior the\ntranche, the greater the protection from credit losses and the lower the tranche's credit risk.\n(Choice B) Call protection at either the structural level or the loan level protects investors from prepayment risk and therefore is not a credit\nenhancement.\n(Choice C) The loan-to-value (LTV) ratio is a loan-level credit risk evaluation tool. Limits to the LTV ratio may reduce the credit risk of the\nunderlying loans that form the collateral for the CMBS, but they do not impact the credit losses allocated to CMBS tranches as a credit\nenhancement would.\nThings to remember:\nCMBS uses subordination as a form of credit enhancement to allocate credit losses to the lowest rated tranche with remaining principal value.\nThe more junior (ie, more subordinated) the tranche, the greater the exposure to credit risk. The more senior the tranche, the greater the\nprotection from credit losses and the lower the tranche's credit risk.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null}, {"n": 312, "q": "Which of the following is most likely a difference between mortgage pass-through securities and collateralized mortgage obligations (CMOs)?", "opts": ["CMOs contain multiple tranches.", "CMOs eliminate prepayment risk.", "Pass-throughs reallocate prepayment risk."], "ans": "A", "expl": "Issuers create pass-through securities (ie, pass-throughs) by pooling mortgage loans that serve collectively as an underlying cash-generating\nasset and as collateral. Investors can purchase shares of a pass-through security and receive the pass-through rate. Since there is only one\nclass of pass-through shares, all investors receive the same percentage returns and are exposed to the same level of prepayment risk (Choice\nC).\nIn contrast to pass-throughs, collateralized mortgage obligations (CMOs) offer multiple security classes (ie, tranches). Different tranches are\ntailored to different investor risk preferences. In sequential-pay CMOs, as shown above, investors who can tolerate more extension risk (ie, longer\nmaturity than expected) may invest in subordinate tranches that offer higher returns in exchange for higher risk.\n(Choice B) CMOs distribute prepayment risk across tranches but do not eliminate it.\nThings to remember:\nMortgage pass-through securities offer one class of shares to all investors. In contrast, collateralized mortgage obligations offer multiple tranches\n(ie, classes) and distribute risk according to investor preferences.\nDescribe types and characteristics of residential mortgage-backed securities, including mortgage pass-through securities and collateralized\nmortgage obligations, and explain the cash flows and risks for each type", "qhtml": null}, {"n": 313, "q": "Of the following investments, the one that most likely offers the greatest protection against contraction risk is a:", "opts": ["commercial mortgage–backed security.", "residential mortgage pass-through security.", "support tranche of a planned amortization class security."], "ans": "A", "expl": "A commercial mortgage–backed security (CMBS) is created from pooled commercial mortgages. Normally, investors in mortgage-backed\nsecurities can be exposed to prepayment risk, particularly contraction risk (ie, higher-than-expected prepayments cause the security to be paid\noff faster than expected).\nUnlike residential mortgages, commercial mortgages usually restrict prepayments. This means that investors in CMBS have little exposure to\ncontraction risk.\n(Choice B) A residential mortgage pass-through has one class of bonds, therefore all investors receive scheduled principal payments as well as\nprepayments. Residential mortgages typically allow borrowers to prepay, so contraction risk is high for these securities.\n(Choice C) A planned amortization class (PAC) offers limited protection against contraction risk. However, if prepayment rates are higher than\nanticipated, then PACs will expose investors to contraction risk. The support tranches of these securities assume that risk.\nThings to remember:\nA commercial mortgage–backed security (CMBS) offers protection against contraction risk (ie, the risk that higher-than-expected prepayments will\nreduce the CMBS's maturity) since borrowers on the CMBS collateral loans are restricted from prepaying those mortgages.\nDescribe characteristics and risks of commercial mortgage-backed securities", "qhtml": null}, {"n": 314, "q": "An analyst finds that a mortgage pass-through security issued three years ago has a prepayment rate of 200 PSA. The analyst's most appropriate conclusion is that the:", "opts": ["prepayment assumption is 2% annually.", "prepayment assumption is half the PSA benchmark.", "collateral had many mortgages at above-market rates."], "ans": "C", "expl": "The Public Securities Association (PSA) created a prepayment model for mortgage-backed securities that has become the benchmark for\nexpressing prepayment rates. The standard model begins with the assumption that borrowers prepay their mortgages at a rate that increases\nby 0.2% per month for the first 30 months, at which time the rate reaches 6% (ie, 0.2% × 30). Then, prepayments stabilize at a constant 6%\nrate until the bond is retired.\nA mortgage-backed security with a value of 100 PSA assumes prepayments fit the standard model. A value of 50 PSA assumes prepayments\noccur at half the rate of the standard model, and a 200 PSA assumes twice the rate of prepayments (Choice B). If prepayments were assumed\nto be double the benchmark (200 PSA), the underlying mortgage collateral must have had much higher mortgage rates than the current market\nenvironment, as many homeowners were incentivized to refinance their mortgages at lower rates.\n(Choice A) A 2% prepayment assumption would imply a 33 PSA (ie, 33% of 6%).\nThings to remember:\nThe standard Public Securities Association model (100 PSA) begins with the assumption that borrowers prepay their mortgages at a rate that\nincreases by 0.2% per month for the first 30 months, at which time the rate reaches 6% (ie, 0.2% × 30). Then, prepayments stabilize at a constant\n6% rate until the bond is retired. A mortgage-backed security with a value of 50 PSA assumes prepayments occur at half that rate, and a 200 PSA\nassumes twice the rate of prepayments.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null}, {"n": 315, "q": "A corporate bond with a 6% annual coupon rate, paid monthly, is quoted at a 5.5% YTM. If the YTM is restated as a bond with semiannual payments, the restated YTM is closest to: ", "opts": ["5.56%", "5.58%", "5.64%"], "ans": "A", "expl": "A bond's periodicity (ie, compounding frequency) usually reflects the number of coupon payments per year. The periodicity is used to obtain the\nbond's YTM, which is normally quoted on an annual basis. This convention means that YTMs based on different periodicities are not directly\ncomparable.\nTo compare different bonds' yields, the YTMs must be expressed using the same periodicity. In this scenario, the yield based on monthly\nperiodicity must be converted to a semiannual equivalent yield as shown in the table below:\n(Choice B) 5.58% would be the effective annual yield of the corporate bond if the initial YTM were based on a periodicity of 2 {[1 + (0.055 / 2)]2}.\n(Choice C) 5.64% is the effective annual yield of the corporate bond {[1 + (0.55 / 12)]12}.\nThings to remember:\nGenerally, bond YTMs are quoted on an annual basis and use a periodicity that reflects the number of coupon payments per year. Bond YTMs\nbased on different periodicities are not directly comparable. However, a YTM of a given periodicity can be converted to the equivalent YTM of a\ndifferent periodicity to allow comparisons between bonds.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null}, {"n": 316, "q": "In a nonagency residential mortgage-backed security (RMBS) where a significant portion of the securitized mortgages are nonrecourse and underwater, bondholders are most likely exposed to:", "opts": ["contraction risk.", "interest rate risk.", "strategic default risk."], "ans": "C", "expl": "Strategic default: residential mortgages\nBorrower has sufficient resources to pay but chooses to default\nMost often occurs with underwater mortgages\nMost prevalent with nonrecourse loans\nHas negative credit consequences for the borrower\nIf a borrower defaults on a collateralized loan, such as a conventional residential mortgage, the lender can foreclose (ie, take possession of the\ncollateral and sell it to obtain payment for the loan). Strategic default occurs when a borrower has sufficient resources to pay the mortgage\nbut chooses to default.\nAn underwater mortgage happens when the value of the property is less than the remaining loan balance of the mortgage. Strategic defaults\noccur most often in underwater mortgages with nonrecourse loans, as the lender has claim only to the proceeds from the sale of the property. In\ncontrast, with a recourse loan, the lender can seize other assets from the borrower if the proceeds from selling the property are insufficient to fully\nrepay the loan, a practice that discourages strategic defaults.\nFor RMBS bondholders, strategic defaults pose two main risks, potential loss of principal and extension risk, since the anticipated maturity of the\nRMBS increases due to slower prepayments. This is in contrast to contraction risk, which occurs when prepayments accelerate and reduce the\nexpected maturity of the RMBS (Choice A).\n(Choice B) Interest rate risk refers to the change in the value of a bond that results from interest rate volatility.\nThings to remember:\nStrategic default is a type of residential mortgage default that occurs when a borrower has sufficient resources to pay the mortgage but chooses to\ndefault. An underwater mortgage happens when the value of the property is less than the remaining loan balance of the mortgage. Strategic\ndefaults occur most often in underwater mortgages with nonrecourse loans.\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}, {"n": 317, "q": "When interest rates are rising, investors in residential mortgage–backed securities are most likely to be exposed to higher-than-expected:", "opts": ["default risk.", "extension risk.", "contraction risk."], "ans": "B", "expl": "Asset-backed securities (ABS) are bonds that are created by bundling cash-generating loans, such as mortgages. Fixed-rate residential\nmortgages are often structured as amortizing loans, for which each scheduled payment includes both interest and principal. In theory, residential\nmortgage–backed securities' (RMBS) maturity coincides with the average maturity of the underlying mortgages; however, the maturity is impacted\nby prepayments made by the borrowers.\nPrepayments are often related to changes in interest rates. When rates fall, borrowers are more likely to prepay since they can refinance the\nloans at a lower rate. This type of prepayment risk is known as contraction risk since it reduces (ie, contracts) the maturity of the RMBS\n(Choice C). However, when interest rates rise, borrowers are less likely to prepay since their existing mortgage rate is now cheaper by\ncomparison. Fewer prepayments increases the anticipated maturity of the RMBS, which is known as extension risk.\n(Choice A) Default risk refers to the possibility that borrowers default on the underlying loans. Prepayments are not a default.\nThings to remember:\nPrepayment risk in connection with residential mortgage–backed securities (RMBS) is the possibility that borrowers will prepay the underlying\nloans' principal, which reduces (ie, contracts) the maturity of the RMBS. Borrowers reduce prepayments when interest rates rise, resulting in\nextension risk (ie, increasing the anticipated maturity of the RMBS). Declining interest rates can cause an increase in prepayments, resulting in\ncontraction risk.\nDefine prepayment risk and describe time tranching structures in securitizations and their purpose.", "qhtml": null}, {"n": 318, "q": "A convertible mortgage is a loan that is best described as one that the borrower can convert from a(n):", "opts": ["nonrecourse to a recourse loan.", "interest-only to an amortizing loan.", "fixed-rate to an adjustable-rate loan."], "ans": "C", "expl": "A mortgage is a loan that is collateralized by specific real property, such as a house. If the borrower defaults on the loan, the lender may be\nable to seize and sell the property to satisfy the loan amount.\nMortgages can be structured in different ways with respect to their interest rates. A convertible mortgage begins as either a fixed- or variable-rate\nloan for a predetermined period (eg, five years). At the end of the initial period, the borrower has the option to change the loan to a variable-rate\nloan (if initially a fixed-rate loan) or a fixed-rate loan (if initially a variable-rate loan). \"Convertibility\" refers only to changing the interest rate\nstructure, not other characteristics such as amortization or foreclosure rights.\n(Choice A) Recourse and nonrecourse refer to the lender's rights if the borrower defaults (ie, foreclosure). A recourse loan allows the lender to\nassert claims against the borrower's other assets if the collateral is insufficient to satisfy the loan. A nonrecourse loan permits the lender to look\nonly to the collateral to satisfy the loan.\n(Choice B) Amortization refers to how a mortgage loan's principal is paid. A convertible loan refers only to the borrower's option to change the\nloan from one type of interest rate to another, not how the loan is amortized.\nThings to remember:\nA convertible mortgage begins as either a fixed- or variable-rate mortgage for a predetermined period. It gives the borrower the option to change\nthe loan to a variable-rate loan (if initially a fixed-rate loan) or a fixed-rate loan (if initially a variable-rate loan).\nDescribe fundamental features of residential mortgage loans that are securitized.", "qhtml": null}];
const CFG = {"title": "Fixed Income — Wiley/UWorld Q-bank", "subtitle": "CFA Level I · Wiley 2024 · 318 câu · không giới hạn giờ", "minutes": 0, "passMark": 70, "hasAnswers": true, "hasExpl": true};

const LETTERS = "ABCDEFGHIJ".split("");
let answers = {};      // i -> letter
let pinned  = {};      // i -> true
let graded  = false;
let filter  = "all";
let started = false;
let paused  = false;
let timerId = null;
let endTime = null;                  // ms timestamp when time runs out
let remaining = (CFG.minutes||0)*60; // seconds left

const $ = id => document.getElementById(id);

// ---- progress persistence (resume + score for the hub) ------------------- //
const PROG_KEY = "cfa:prog:" + ((location.pathname.split("/").pop() || CFG.title || "quiz").replace(/\.html$/i,"").toLowerCase());
(function loadProg(){
  try{
    const s = JSON.parse(localStorage.getItem(PROG_KEY)||"null");
    if(s && typeof s==="object"){
      answers = s.answers||{}; pinned = s.pinned||{}; graded = !!s.graded;
      if(typeof s.remaining === "number" && s.remaining > 0) remaining = s.remaining;
      started = !graded && !!s.started;
    }
  }catch(e){}
})();
function saveProg(){
  try{
    const total = DATA.length, done = Object.keys(answers).length;
    let correct = null, pct = null;
    if(graded && CFG.hasAnswers){
      correct = 0; DATA.forEach((q,i)=>{ if(answers[i]===q.ans) correct++; });
      pct = Math.round(correct/total*100);
    }
    localStorage.setItem(PROG_KEY, JSON.stringify(
      {answers, pinned, graded, done, total, correct, pct, remaining, started, ts:Date.now()}));
  }catch(e){}
}
function clearProg(){ try{ localStorage.removeItem(PROG_KEY); }catch(e){} }
// paint the option selections / pins that were restored from storage
function applySaved(){
  Object.keys(answers).forEach(i=>{
    const b = $("opt-"+i+"-"+answers[i]);
    if(b && !graded) b.classList.add("sel");
  });
  Object.keys(pinned).forEach(i=>{
    const card = $("q-"+i);
    if(card){ const p=card.querySelector(".pin"); if(p) p.classList.add("on"); }
  });
  if(graded) paintResults();
  const done = Object.keys(answers).length;
  if(done>0 && !graded){
    const t = $("resumeNote");
    if(t){ t.textContent = "Đã khôi phục tiến trình • "+done+"/"+DATA.length+" câu"; t.classList.add("show"); }
  }
}

// ---- render -------------------------------------------------------------- //
function render(){
  $("title").textContent = CFG.title || "Quiz";
  $("subtitle").textContent = CFG.subtitle || "";
  const quiz = $("quiz");
  quiz.innerHTML = "";
  DATA.forEach((q,i)=>{
    const card = document.createElement("div");
    card.className = "card"; card.id = "q-"+i;
    const head = document.createElement("div");
    head.className = "card-head";
    const num = document.createElement("span");
    num.className = "qnum"; num.textContent = "Câu " + q.n;
    const pin = document.createElement("button");
    pin.className = "pin"; pin.title = "Ghim câu này"; pin.textContent = "📌";
    pin.onclick = ()=>togglePin(i);
    head.appendChild(num); head.appendChild(pin);
    card.appendChild(head);

    const stem = document.createElement("div");
    stem.className = "stem"; if(q.qhtml){stem.innerHTML = q.qhtml;} else {stem.textContent = q.q;}
    card.appendChild(stem);

    const opts = document.createElement("div");
    opts.className = "opts";
    q.opts.forEach((t,oi)=>{
      const L = LETTERS[oi];
      const b = document.createElement("button");
      b.className = "opt"; b.dataset.letter = L; b.id = "opt-"+i+"-"+L;
      b.onclick = ()=>pick(i,L);
      const lead = document.createElement("span");
      lead.className = "lead"; lead.textContent = L + ".";
      b.appendChild(lead);
      b.appendChild(document.createTextNode(t));
      opts.appendChild(b);
    });
    card.appendChild(opts);

    if(q.expl){
      const e = document.createElement("div");
      e.className = "expl"; e.id = "expl-"+i;
      const lab = document.createElement("b"); lab.textContent = "Giải thích: ";
      e.appendChild(lab);
      e.appendChild(document.createTextNode(q.expl));
      card.appendChild(e);
    }
    quiz.appendChild(card);
  });
  buildNav();
  refreshNav();
  updateProgress();

  // timer setup
  if(CFG.minutes>0){
    $("pauseBtn").style.display = "";
    $("timer").classList.remove("hidden");
    showTime();
    if(started && !graded){            // resume an in-progress timed quiz
      if(remaining>0){ endTime = Date.now() + remaining*1000; timerId = setInterval(tick, 250); }
      else { grade(true); }
    }
  }
  applySaved();
}

// ---- answering ----------------------------------------------------------- //
function pick(i, L){
  if(graded) return;
  const card = $("q-"+i);
  if(answers[i] === L){              // bấm lại đáp án đang chọn -> huỷ chọn
    delete answers[i];
    $("opt-"+i+"-"+L).classList.remove("sel");
  }else{
    answers[i] = L;
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    $("opt-"+i+"-"+L).classList.add("sel");
  }
  if(!started) startTimer();
  updateProgress();
  refreshNav();
  saveProg();
}

function togglePin(i){
  if(pinned[i]) delete pinned[i]; else pinned[i]=true;
  const btn = $("q-"+i).querySelector(".pin");
  btn.classList.toggle("on", !!pinned[i]);
  refreshNav();
  saveProg();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  $("progress").style.width = (done/DATA.length*100) + "%";
}

// ---- timer --------------------------------------------------------------- //
function startTimer(){
  if(started || CFG.minutes<=0) return;
  started = true;
  endTime = Date.now() + remaining*1000;
  timerId = setInterval(tick, 250);
}
function tick(){
  if(paused) return;
  const prev = remaining;
  remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
  showTime();
  if(remaining !== prev) saveProg();   // persist countdown so reload resumes here
  if(remaining<=0){
    clearInterval(timerId);
    grade(true);   // auto-submit, skip confirmation
  }
}
function showTime(){
  const m = Math.floor(remaining/60), s = remaining%60;
  const t = $("timer");
  t.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("warn", remaining<=60 && remaining>0);
}
function togglePause(){
  if(!started || graded) return;
  paused = !paused;
  if(paused){
    remaining = Math.max(0, Math.round((endTime - Date.now())/1000));
    $("pauseOverlay").classList.add("show");
    $("pauseBtn").textContent = "▶ Tiếp tục";
  }else{
    endTime = Date.now() + remaining*1000;   // restore exact remaining
    $("pauseOverlay").classList.remove("show");
    $("pauseBtn").textContent = "⏸ Tạm dừng";
  }
  saveProg();
}

// ---- navigator ----------------------------------------------------------- //
function toggleNav(){ $("navPanel").classList.toggle("open"); }
function buildNav(){
  const g = $("navGrid"); g.innerHTML = "";
  DATA.forEach((q,i)=>{
    const c = document.createElement("div");
    c.className = "cell"; c.id = "cell-"+i; c.textContent = q.n;
    c.onclick = ()=>{ $("q-"+i).scrollIntoView({behavior:"smooth",block:"center"});
                      toggleNav(); };
    g.appendChild(c);
  });
}
function setFilter(f, el){
  filter = f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  el.classList.add("active");
  refreshNav();
}
function refreshNav(){
  let done=0, pin=0;
  DATA.forEach((q,i)=>{
    const c = $("cell-"+i);
    if(!c) return;
    const isDone = answers[i]!==undefined;
    const isPin  = !!pinned[i];
    if(isDone) done++;
    if(isPin) pin++;
    c.className = "cell";
    if(graded){
      if(answers[i]===q.ans) c.classList.add("correct");
      else c.classList.add("wrong");
    }else if(isDone){ c.classList.add("answered"); }
    if(isPin) c.classList.add("pinned");
    // filter
    let show = true;
    if(filter==="done") show = isDone;
    else if(filter==="todo") show = !isDone;
    else if(filter==="pin")  show = isPin;
    c.classList.toggle("hide", !show);
  });
  // chip counts
  const spans = document.querySelectorAll(".chip span");
  spans[0].textContent = "("+DATA.length+")";
  spans[1].textContent = "("+done+")";
  spans[2].textContent = "("+(DATA.length-done)+")";
  spans[3].textContent = "("+pin+")";
}

// ---- submit / grade ------------------------------------------------------ //
function requestSubmit(){
  if(graded) return;
  const unanswered = DATA.length - Object.keys(answers).length;
  $("confirmMsg").textContent = unanswered>0
    ? "Bạn còn " + unanswered + " câu chưa làm (sẽ bị tính sai). Nộp bài luôn?"
    : "Bạn đã làm hết các câu. Nộp bài?";
  $("confirmOverlay").classList.add("show");
}
function closeConfirm(){ $("confirmOverlay").classList.remove("show"); }
function confirmSubmit(){ closeConfirm(); grade(false); }

function grade(auto){
  if(graded) return;
  graded = true;
  if(timerId) clearInterval(timerId);
  $("pauseOverlay").classList.remove("show");
  closeConfirm();
  const rn = $("resumeNote"); if(rn) rn.classList.remove("show");
  paintResults();
  saveProg();
  window.scrollTo({top:0, behavior:"smooth"});
}

function paintResults(){
  if(!CFG.hasAnswers){
    // no answer key — reveal explanations only, no scoring
    DATA.forEach((q,i)=>{ const e=$("expl-"+i); if(e) e.classList.add("show"); });
    $("badge").textContent = "Đã nộp (không có đáp án để chấm)";
    $("badge").className = "badge show fail";
    refreshNav();
    return;
  }

  let correct = 0;
  DATA.forEach((q,i)=>{
    const card = $("q-"+i);
    const ai = q.ans ? LETTERS.indexOf(q.ans) : -1;
    // mark correct option
    if(q.ans){
      const cb = $("opt-"+i+"-"+q.ans);
      if(cb) cb.classList.add("correct");
    }
    const pickL = answers[i];
    if(pickL!==undefined){
      if(pickL===q.ans){ correct++; }
      else{ const wb=$("opt-"+i+"-"+pickL); if(wb) wb.classList.add("wrong"); }
    }
    card.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"));
    const e = $("expl-"+i); if(e) e.classList.add("show");
  });

  const pct = Math.round(correct/DATA.length*100);
  const pass = pct >= CFG.passMark;
  const b = $("badge");
  b.textContent = (pass?"ĐẠT":"KHÔNG ĐẠT") + " · " + correct + "/" + DATA.length + " (" + pct + "%)";
  b.className = "badge show " + (pass?"pass":"fail");
  refreshNav();
}

// ---- restart ------------------------------------------------------------- //
function restart(){
  answers = {}; pinned = {}; graded = false; started = false; paused = false;
  if(timerId) clearInterval(timerId);
  remaining = (CFG.minutes||0)*60;
  clearProg();
  $("badge").className = "badge";
  $("pauseBtn").textContent = "⏸ Tạm dừng";
  $("pauseOverlay").classList.remove("show");
  $("timer").classList.remove("warn");
  $("resumeNote").classList.remove("show");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

render();
</script>
</body>
</html>
