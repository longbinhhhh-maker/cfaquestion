bonds.\nIn this scenario, the bond is callable, so effective convexity is appropriate. Substitute the bond price and the effective convexity data to\ncalculate the implied shift in the benchmark yield:\nCalculate and interpret convexity and describe the convexity adjustment.", "qhtml": null}, {"n": 228, "q": "All else equal, an option-free bond's effective duration and approximate modified duration are closest when the benchmark par bond curve:", "opts": ["is flat.", "is steeply sloped.", "makes a parallel shift."], "ans": "A", "expl": "Approximate modified duration (ModDur) and effective duration (EffDur) both measure the sensitivity of bond prices to changes in yields:\nModDur measures sensitivity as the slope of a bond's price-yield curve, derived by calculating the bond's price at lower and higher YTMs.\nEffDur measures sensitivity based on parallel downward and upward shifts of the benchmark yield curve.\nIf the government par bond (ie, benchmark) curve is flat, the spot rate curve derived from it is also flat, and the spot rates and YTMs are equal\nwith the same value across all maturities. Therefore, if the basis point change in YTM and the shift in the benchmark yield curve are equal, the\nsame PV and PV will be used to calculate both ModDur and EffDur since all cash flows are discounted by the same interest rate. This results in\n+ −\nModDur and EffDur being closest to each other (ie, they are equal).\nRegardless of the yield curve's shape, PV and PV for ModDur are calculated by using a single interest rate to discount bond cash flows.\n+ −\nHowever, if the benchmark curve is not flat, the PV and PV used to determine EffDur are calculated by discounting each cash flow by a different\n+ −\nspot rate. If the benchmark curve's slope diverges only slightly from flat, the two duration measures will be almost equal. As the curve's slope\nsteepens, the divergence of spot rates used to calculate PV and PV will increase, leading to larger differences between ModDur and EffDur\n+ −\n(Choice B).\n(Choice C) Neither duration measure is based on actual movements of the yield curve. Effective duration is based on assumed downward and\nupward parallel shifts of the yield curve.\nThings to remember:\nModDur and EffDur measure the sensitivity of bond prices to interest rate changes. A flat benchmark yield curve results in the two duration\nmeasures being equal. As the slope of the curve steepens, the difference between the two measures will increase.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 229, "q": "Shaping risk is most appropriately assessed by measuring the change in a bond's price that results from a:", "opts": ["change in the bond's yield-to-maturity.", "shift in the entire benchmark yield curve.", "shift in a portion of the benchmark yield curve."], "ans": "C", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nEstimating the interest rate risk of bonds with embedded options involves measuring changes in the prices of those bonds based on shifts in the\nbenchmark yield curve. This can be done using effective duration or key rate duration. Effective duration measures changes in bond prices based\non shifts in the entire benchmark yield curve.\nIn contrast, a change in rates within only some portion of the benchmark yield curve indicates a shift in one or more key rates. Key rate duration\nassesses price changes based on changes to rates within a portion of the benchmark yield curve.\nWhen only a portion of the benchmark yield curve changes, the shape of the curve changes. For example, if rates for maturities less than two\nyears decrease, this causes a steepening of the overall curve:\nFor this reason, key rate duration is said to measure the shaping risk of a bond—the interest rate risk that arises from changes to the shape of\nthe yield curve.\n(Choice A) Modified duration involves assessing interest rate risk by measuring changes in a bond's price based on changes to its yield-to-\nmaturity, not based on changes to a portion of the benchmark yield curve.\n(Choice B) Effective duration measures changes in a bond's price based on a shift in the entire benchmark yield curve.\nThings to remember:\nKey rate duration measures bond price changes based on rate changes within a portion of the benchmark yield curve that have caused a change\nin the shape of the curve. Therefore, it can be said that key rate duration is used to assess the shaping risk of a bond. Effective duration\nmeasures bond price changes based on shifts in the entire benchmark yield curve.\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}, {"n": 230, "q": "An investor is evaluating several callable bonds. The investor believes short-term interest rates are likely to rise significantly, but intermediate and long-term rates will be stable. Which of the following types of duration would be most appropriate for evaluating the risk of the bonds given the expected flattening of the yield curve?", "opts": ["Key rate", "Modified", "Effective"], "ans": "A", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nKey rate duration is used to assess the impact on bond values of a movement of rates along a portion of the yield curve (eg, ten-year rate or\nfrom zero to three years to maturity). This allows key rate duration to measure the impact of changes in the shape of the yield curve (ie,\nshaping risk) on the value of callable bonds.\nA callable bond has uncertain future cash flows since it may be called and retired before maturity. Investors use effective duration to try to account\nfor the cash flow uncertainty by assuming parallel shifts of the benchmark yield curve (Choice C).\nIf short-term rates rise and the yield curve flattens as anticipated, a key rate duration calculated on such an assumption produces a better estimate\nof the bond's change in value. Under such circumstances, a key rate duration more accurately assesses an issuer's incentive to call the bond and\nthe future cash flow uncertainty.\n(Choice B) Modified duration measures the sensitivity of a bond's price to a change in its yield-to-maturity. Since it is based on a change in that\nsingle interest rate, modified duration cannot be used to assess the impact of a shift in rates over a portion of a benchmark yield curve.\nThings to remember:\nKey rate duration is used to assess the impact on bond values of a movement of rates along a portion of the yield curve. It measures the impact\non bond values of changes in the shape of the yield curve (ie, shaping risk).\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}, {"n": 231, "q": "Effective duration is the most appropriate duration measure for bonds with:", "opts": ["embedded options.", "predictable cash flows.", "a well-defined yield-to-maturity."], "ans": "A", "expl": "Effective duration estimates how much a bond's total price will change in response to a parallel shift of the benchmark yield curve. Since\neffective duration uses the yield curve instead of the YTM, it is a more appropriate measure of interest rate risk for bonds that have embedded\noptions, such as callable and putable bonds. Those bonds have unpredictable cash flows due to the possibility of option exercise and thus lack a\nwell-defined YTM.\n(Choices B and C) For bonds that have predictable cash flows, and thus a well-defined YTM, interest rate risk can be measured using\napproximate modified duration, which is based on YTM.\nThings to remember:\nSince it uses the yield curve instead of YTM in its calculation, effective duration can measure the interest rate risk of bonds with embedded\noptions, which have uncertain future cash flows and thus lack a well-defined YTM.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 232, "q": "Compared with analytical duration, empirical duration is the more appropriate measure to estimate the impact of benchmark interest rate changes for a bond portfolio of:", "opts": ["US agency bonds.", "global high-yield corporate bonds.", "highly rated European covered bonds."], "ans": "B", "expl": "Duration is a linear estimate of the change in a bond's price given a change in its yield.\nAnalytical duration (eg, modified duration) estimates price and yield changes given a change in benchmark interest rates, based on current\nmarket information.\nEmpirical duration estimates a bond's interest rate sensitivity using the correlations between benchmark yields and yield spreads based\non historical data and statistical relationships with other factors (eg, credit, liquidity).\nEmpirical and analytical duration will be very similar for bonds that have similar risks as benchmark securities, but will differ for bonds with\nconsiderable spread risk, such as credit, liquidity, or country risk, etc. The more types of risk a bond is exposed to, besides interest rate risk, the\nmore relevant its empirical duration will be. Empirical duration is particularly useful in predicting price changes during periods of financial stress\n(eg, flight to quality), as correlations among risky assets increase dramatically.\nGlobal high-yield corporate bonds represent a wide variety of credit, country, and liquidity risks, in addition to interest rate risk, so empirical\nduration can be expected to be a more appropriate predictor of their prices than analytical duration.\n(Choices A and B) US agency and highly rated (eg, AAA, AA+) European covered bonds carry little credit risk; therefore, both duration measures\nwill be very similar.\nThings to remember:\nEmpirical duration estimates a bond's interest rate sensitivity using historical data and statistical relationships with other factors, quantifying the\ncorrelations between benchmark yields and yield spreads. Empirical duration is relevant for bonds with considerable spread risk, particularly\nduring periods when benchmark yields and spreads may be correlated, as it can provide a more accurate measure of risk.\nDescribe the difference between empirical duration and analytical duration", "qhtml": null}, {"n": 233, "q": "Which of the following is most appropriate to measure the interest rate risk of a bond with an embedded call option? A measure of:", "opts": ["yield duration.", "curve duration.", "modified duration."], "ans": "B", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nBonds are valued at the present value of their cash flows until maturity, using the YTM as the discount rate. When a bond is issued with an\nembedded call option, the possibility of option exercise makes the cash flows uncertain. This results in the bond lacking a well-defined YTM.\nTherefore, it is most appropriate to measure a callable bond's interest rate risk using effective duration, which is a curve duration statistic.\nTo measure interest rate risk, effective duration shifts a benchmark yield curve up and down by the same number of basis points, rather than\nchanging a specific YTM. This method better captures the way cash flows vary under different interest rate scenarios for bonds without well-\ndefined YTMs (eg, callable bonds).\n(Choices A and C) Yield durations (eg, Macaulay duration, modified duration) measure interest rate risk based on a single interest rate, the\nbond's YTM. Yield durations are appropriate for bonds without embedded options since such bonds have well-defined YTMs.\nThings to remember:\nWhen a bond is issued with an embedded call option, its cash flows are uncertain, and thus its YTM is not well-defined. Effective duration\nmeasures bond price changes relative to a change in the benchmark yield curve, rather than a change in a specific YTM. Therefore, it is more\nappropriate for bonds without well-defined YTMs (eg, a bond with an embedded call option).\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 234, "q": "A bond matures in 20 years and is callable at the issuer's option any time after the first call date in 3 years. Which of the following types of duration is most appropriate for quantifying the bond's interest rate risk? ", "opts": ["Effective", "Modified", "Macaulay"], "ans": "A", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nA callable bond can be analyzed as a package comprising two elements: the schedule of coupon and principal payments over the bond's\nscheduled life and a call option giving the issuer the right to purchase (ie, call) the bond prior to its maturity. The option creates uncertainty about\nthe bond's future cash flows.\nEven assuming no default, the cash flows on a callable bond are uncertain due to the possibility of early retirement. Of the choices, only effective\nduration addresses the uncertainty regarding the length of time over which the bond will pay cash flows. It is necessary to value the embedded\noption to address how future interest rate fluctuations may impact the bond's cash flows.\n(Choices B and C) Modified and Macaulay durations can be calculated only for a stream of cash flows for a fixed time period. These duration\nmeasures are not accurate measures for callable bonds, given the cash flow uncertainty introduced by the embedded call option.\nThings to remember:\nEffective duration is the appropriate measure for a bond with an embedded option, as it addresses the uncertainty regarding the bond's future\ncash flows. Macaulay and modified durations can be calculated only for bonds with a known stream of contractual cash flows.\nExplain why effective duration and effective convexity are the most appropriate measures of interest rate risk for bonds with embedded options.", "qhtml": null}, {"n": 235, "q": "All else being equal, key rate duration is most appropriate for assessing the interest rate risk of callable bonds if:", "opts": ["yield volatility is increasing.", "yield spreads are widening.", "the yield curve is steepening."], "ans": "C", "expl": "Bond duration\nType Measures Applicable bonds\nPresent-value-weighted average time to\nMacaulay No embedded options\nreceipt of coupon and principal\nPercentage change in price for a given\nModified No embedded options\nchange in bond's yield-to-maturity\nPercentage change in price due to parallel\nEffective All\nshift of benchmark yield curve\nPercentage change in price due to a shift\nKey rate All\nwithin a portion of benchmark yield curve\nPrice change in currency units given a\nMoney All\nchange in the appropriate yield or curve\nThe early retirement option embedded in callable bonds creates uncertainty about future cash flows. Two types of duration are used to evaluate\nthe effect of early retirement options on cash flows payable over an uncertain time horizon:\nEffective duration assumes parallel shifts in the benchmark yield curve, and\nkey rate duration is based on a change in the shape (ie, shaping risk) of the benchmark yield curve.\nA bond's key rate duration is calculated by assuming changes in one or more yields on the benchmark yield curve. A steepening of the yield curve\ncould result from a decrease in short-term rates, an increase in long-term rates, or a combination of both. The assumed change in the benchmark\ncurve is used to evaluate the effect on the embedded call option and cash flows over the life of the bond.\n(Choice A) Yield volatility affects bond values but is not a factor measured by key rate duration.\n(Choice B) Corporate bond yields reflect a benchmark government bond yield and a yield spread over that benchmark. The spread reflects the\nissuer's credit risk and the bond issue's liquidity risk. Key rate duration is based on changes in the benchmark yield curve, so it does not directly\nincorporate changes in yield spreads.\nThings to remember:\nKey rate duration measures the effect on a callable bond's value caused by changes in one or more yields on a benchmark yield curve. The\nshape or slope of the yield curve reflects the impact of those changes.\nDefine key rate duration and describe its use to measure price sensitivity of fixed-income instruments to benchmark yield curve changes.", "qhtml": null}, {"n": 236, "q": "An analyst has compiled the following data on a corporate bond: Selected Data Maturity (years) 12 Coupon (%) 5 Price 100 Modified duration 8.94 Convexity 90 The price impact from an instantaneous 80 basis points of spread narrowing is closest to (%):", "opts": ["6.86", "7.15", "7.44"], "ans": "C", "expl": "The price change of a bond is a function of its modified duration, its convexity, and a change in its yield. The yield of a corporate bond is a\nfunction of interest rates and the bond's yield spread. The yield spread is the difference in yields between the corporate bond and a government\nissue of the same maturity, reflecting the greater credit and liquidity risks (ie, spread risk) of the corporate bond. A change in spread can\nsignificantly impact the price of a bond.\nBond prices and yields move in opposite directions. Therefore, narrowing spreads (ie, smaller spreads) positively impact prices and widening\nspreads (ie, larger spreads) have a negative impact. Note that the negative sign in the price impact equation accounts for this inverse relationship.\nPrice impact can be determined by entering the values into the formula:\n(Choice A) 6.86% is the estimated price decline if the spread widens by 80 basis points.\n(Choice B) 7.15% results from approximating price impact (L54761) using only modified duration, which is appropriate for only small changes in\nspreads.\nThings to remember:\nThe price change of a bond is a function of its modified duration, its convexity, and a change in its yield. Bond prices and yields move in opposite\ndirections. Therefore, narrower spreads positively impact prices and widening spreads have a negative impact.\nDescribe macroeconomic, market, and issuer-specific factors that influence the level and volatility of yield spreads\n2.All else being equal, in which of the following situations would a rating agency's bond rating be least likely to reflect the true risk of default?\nA. The issuer paid the rating agency's fee.\n\nB. The issuer may have to pay significant penalties for environmental damage.\nC. The bond is issued by a subsidiary of a holding company that issues its own bonds.\nExplanation\nCredit rating agencies\nAdvantages Disadvantages\nLaws and regulations often require Potential conflicts of interest\nbonds to be rated by rating Market prices are affected by changes in credit\nagencies. risk faster than rating agencies can change their\nRatings are often based on material ratings.\nnonpublic information. Contingent risks (eg, legal, business risks) may\nBoth issuers and specific bonds are not be reflected in ratings.\nrated. Agencies make mistakes.\nRatings allow easy comparison\nacross bonds and issuers.\nRating agencies such as Moody's and S&P provide credit ratings for bonds and issuers that investors can use to compare the default risk of\ndifferent bond investments. One advantage of relying on rating agencies is that they may have access to material nonpublic information that is\nunavailable to investors. However, contingencies that might affect default risk (eg, legal exposure that cannot be accurately determined) may not\nbe reflected in a rating. In such a case, the rating may not indicate the true risk of default.\n(Choice A) The convention is that the issuer pays the agency's fees in the rating process. There are several rating agencies, which raises the\npossibility an issuer might choose the agency likely to bestow the highest rating. However, the curriculum indicates that the \"issuer pays\" model\ndoes not cause ratings to be biased upward.\n(Choice C) A holding company and its subsidiaries may both issue bonds. Cash flows generated by a subsidiary must first be used to service\nthat subsidiary's bonds, and then the cash can be used by the holding company to service its bonds. The subsidiary's bond rating reflects its\ndefault risk independent of bonds issued by the holding company.\nThings to remember:\nRating agencies assess the default risk of bonds and the credit risk of the issuers. Ratings may be based on information that is unavailable to\ninvestors, but they may not reflect contingencies such as legal exposure that cannot be quantified.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 237, "q": "All else being equal, in which of the following situations would a rating agency's bond rating be least likely to reflect the true risk of default?", "opts": ["The issuer paid the rating agency's fee.", "The issuer may have to pay significant penalties for environmental damage.", "The bond is issued by a subsidiary of a holding company that issues its own bonds."], "ans": "B", "expl": "Credit rating agencies\nAdvantages Disadvantages\nLaws and regulations often require Potential conflicts of interest\nbonds to be rated by rating Market prices are affected by changes in credit\nagencies. risk faster than rating agencies can change their\nRatings are often based on material ratings.\nnonpublic information. Contingent risks (eg, legal, business risks) may\nBoth issuers and specific bonds are not be reflected in ratings.\nrated. Agencies make mistakes.\nRatings allow easy comparison\nacross bonds and issuers.\nRating agencies such as Moody's and S&P provide credit ratings for bonds and issuers that investors can use to compare the default risk of\ndifferent bond investments. One advantage of relying on rating agencies is that they may have access to material nonpublic information that is\nunavailable to investors. However, contingencies that might affect default risk (eg, legal exposure that cannot be accurately determined) may not\nbe reflected in a rating. In such a case, the rating may not indicate the true risk of default.\n(Choice A) The convention is that the issuer pays the agency's fees in the rating process. There are several rating agencies, which raises the\npossibility an issuer might choose the agency likely to bestow the highest rating. However, the curriculum indicates that the \"issuer pays\" model\ndoes not cause ratings to be biased upward.\n(Choice C) A holding company and its subsidiaries may both issue bonds. Cash flows generated by a subsidiary must first be used to service\nthat subsidiary's bonds, and then the cash can be used by the holding company to service its bonds. The subsidiary's bond rating reflects its\ndefault risk independent of bonds issued by the holding company.\nThings to remember:\nRating agencies assess the default risk of bonds and the credit risk of the issuers. Ratings may be based on information that is unavailable to\ninvestors, but they may not reflect contingencies such as legal exposure that cannot be quantified.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 238, "q": "An analyst has compiled the following information on three new bond issues: Issuer Industry Moody's Issuer Rating Standard & Poor's Issuer Rating Bond Seniority Bond X Pharmaceutical Aa1 AA+ Senior subordinated Bond Y Utility Baa1 A− Senior unsecured Bond Z Industrial machinery B2 B Senior subordinated Which bond would have the greatest notching adjustment?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "C", "expl": "Notching example for an investment-grade bond issuer\nNotches above (+) or\nSecurity class Seniority ranking\nbelow (−) issuer rating\nSecured debt Secured bonds +1\nSenior unsecured bonds 0\nSenior subordinated bonds −1\nUnsecured debt\nSubordinated bonds −1\nJunior subordinated bonds −1\nEquity Preferred stock −2\nA bond's credit rating reflects the general creditworthiness of the issuer (ie, borrower) and specific factors (eg, collateral, subordination) related to\nthat particular bond. Senior unsecured bondholders are general creditors of the issuer and therefore reflect the issuer's overall creditworthiness.\nCredit rating agencies use notching to indicate whether an individual bond issue merits a higher or lower credit rating than the issuer's senior\nunsecured debt.\nThe notching adjustment is based primarily on a bond's seniority compared to the issuer's other bonds, which indicates its loss-severity risk. For\nexample, since the seniority of a senior subordinated bond ranks below the senior unsecured debt rating, its credit rating is a notch below. This\nprocess continues down the capital structure as each bond issue, in order of declining creditworthiness, is rated a notch below a more senior\nissue.\nNotching for investment-grade bonds (eg, Bonds X and Y) tends to be very incremental (eg, ± 1 notch) since the default risk of these bonds is low\n(Choice A). Default risk and loss-severity risk increase in lower-rated issues (ie, high-yield/junk bonds), so greater notching adjustments are\nused. For bonds that are not investment-grade (eg, Bond Z), the rating adjustment for subordinated and junior debt classes is often two notches\nlower.\n(Choice B) Bond Y is a senior unsecured bond (reflecting the overall creditworthiness of the issuer), so it is a base by which related company\nbonds can be judged. There is no notching adjustment for this bond.\nThings to remember:\nCredit rating agencies use notching to indicate whether an individual bond issue merits a higher or lower credit rating than the issuer's senior\nunsecured debt. Default risk and loss-severity risk increase in lower-rated issues, so greater notching adjustments are used.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 239, "q": "If a debt security has a higher credit rating than its issuer, it is most likely due to:", "opts": ["a bond indenture that includes few covenants restricting issuer operating flexibility.", "an indenture provision that grants a second lien claim on company-owned property.", "market expectations that rating agencies intend to upgrade the issuer's credit rating."], "ans": "B", "expl": "Investment grade credit ratings\nStandard &\nMoody's Fitch\nPoor's\nAaa AAA AAA\nAa1 AA+ AA+\nAa2 AA AA\nAa3 AA− AA−\nA1 A+ A+\nA2 A A\nA3 A− A−\nBaa1 BBB+ BBB+\nBaa2 BBB BBB\nBaa3 BBB− BBB−\nCredit ratings reflect both the probability of default and severity of loss in case of default. The probability of default is usually similar for each of an\nissuer's bonds due to the prevalence of cross-default clauses. Cross-default clauses specify that a default on any single bond issue is considered\na default on all of an issuer's bonds.\nRating agencies sometimes give individual debt issues credit ratings that differ from the company's general credit rating. Any difference in\nratings reflects an issue's seniority ranking and whether the bonds are secured by company assets (ie, second lien). Having valuable assets\npledged as collateral often results in a bond having a higher credit rating than its issuer. The process for establishing different ratings for\nindividual issues in known as notching.\n(Choice A) Less restrictive covenants cause a bond to be riskier than would otherwise be the case.\n(Choice C) Market expectations of a credit rating upgrade would likely cause all the issuer's bonds to increase in value. However, anticipation of\nan issuer rating change would not explain an existing difference between an issue and the issuer rating.\nThings to remember:\nIndividual debt issues sometimes have higher or lower credit ratings compared to the general credit rating of the issuing company. Rating\ndifferences reflect an issue's seniority ranking and the value of any assets pledged as collateral.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 240, "q": "In credit analysis, the size of the notching adjustment for the rating on a corporate bond issue is most likely:", "opts": ["unrelated to the issuer's reference credit rating.", "directly related to the issuer's reference credit rating.", "inversely related to the issuer's reference credit rating."], "ans": "C", "expl": "Notching guidelines relative to credit rating\nSecurity class Seniority ranking Ba2 or higher Ba3 or lower\nSecured debt Secured bonds +1 +1\nSenior unsecured bonds 0 0*\nSenior subordinated bonds −1 −2\nUnsecured debt\nSubordinated bonds −1 −2\nJunior subordinated bonds −1 −2 or −3\nEquity Preferred stock −2 −3 or −4\n*The reference rate for issuers rated Ba3 or lower may be either the senior unsecured debt\nrating or the corporate family credit rating.\nSource: Moody's Investors Service\nBond credit ratings are based on expected losses from default, which reflect estimates of default probability and the severity of loss in case of\ndefault. A bond's rating reflects both the general creditworthiness of the issuer and issue-specific factors (eg, collateral, subordination). Notching\nis the rating agencies' process for determining the rating on individual issues relative to the issuer's reference credit rating, which is typically\nthe rating on the issuer's senior unsecured debt or the corporate family credit rating.\nThe image above illustrates the notching guidelines and shows how notching adjustments are inversely related to a company's reference credit\nrating. The smaller notching adjustments for issuers with higher credit ratings reflect the much lower probability of default. The probability of\ndefault by lower-rated issuers is much higher, so their issues require larger notching adjustments to capture the greater risk exposure (Choices A\nand B).\nThings to remember:\nBond credit ratings are based on expected losses resulting from default, which reflect both the general creditworthiness of the issuer and issue-\nspecific factors. Notching adjustments are inversely related to an issuer's reference credit rating. Therefore, the debt of issuers with higher credit\nratings will have smaller notching adjustments due to the lower exposure to credit risk.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 241, "q": "The process for assigning different credit ratings for individual bond issues versus the issuer's credit rating is best described as:", "opts": ["notching.", "credit migration.", "spread widening."], "ans": "A", "expl": "Notching is the rating agency process for establishing credit ratings on individual bond issues that differ from the issuer's credit rating. Any\ndifference reflects issue-specific factors that improve or worsen credit quality. The image above shows one rating agency's notching guidelines.\nCredit ratings reflect both the probability of default and the severity (ie, amount) of loss in case of default. Default probability is usually similar for\neach of an issuer's bonds due to cross-default clauses, meaning that a default on any bond issue is considered a default on all the issuer's bonds.\nDifferences in ratings on individual issues result from seniority ranking and the value of any assets pledged as collateral. These factors impact the\nseverity of loss on different issues if a default occurs.\n(Choice B) Credit migration refers to the risk of a decline in an issuer's creditworthiness that ultimately results in a credit rating downgrade.\n(Choice C) Spread widening refers to an increase in a bond's YTM relative to a benchmark government bond.\nThings to remember:\nNotching is the rating agency process for establishing individual bond credit ratings that differ from the issuer's rating. Issue-specific factors that\nimpact credit quality relate to relative seniority ranking and the value of assets pledged as collateral. These factors impact the severity of loss on\ndifferent issues in case of default.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 242, "q": "The type of debt security most likely to have a credit rating the same as the issuer's is:", "opts": ["secured.", "senior unsecured.", "senior subordinated."], "ans": "B", "expl": "Bond credit ratings reflect the general creditworthiness of the issuer (ie, borrower) and issue specific factors (eg, collateral, degree of\nsubordination). Notching is the process that rating agencies use to determine whether an individual issue merits a higher or lower credit rating\nthan its issuer. The image above indicates how agency notching guidelines scale up or down from the company's rating. The differential for senior\nunsecured debt is 0.\nSenior unsecured bondholders are general creditors of the issuer. Such debt is backed by the issuer's obligation to pay interest and principal.\nThis gives senior unsecured debtholders a general claim on the cash flow and assets of the issuer but no priority regarding specific assets. Their\ncredit risk reflects the overall creditworthiness of the borrower, so senior unsecured bonds usually have the same rating as the issuer.\n(Choice A) Secured bonds entail a priority claim against specific assets pledged as collateral. Secured bonds often have a higher credit rating\nthan the issuer.\n(Choice C) Senior subordinated debt is contractually junior to senior unsecured debt. The lower seniority ranking means senior subordinated\ndebt often has a lower credit rating than the issuer.\nThings to remember:\nSenior unsecured bondholders are general creditors of the issuer. Such debt is backed by the issuer's obligation to pay interest and principal,\ngiving the holders a general claim on cash flow and assets. Their credit risk reflects the overall creditworthiness of the borrower, so senior\nunsecured bonds usually have the same rating as the issuer.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 243, "q": "Which of the following factors is most likely to result in a narrowing of corporate bond yield spreads?", "opts": ["Falling government bond yields", "Strengthening economic conditions", "Increasing supply of new-issue corporate debt"], "ans": "B", "expl": "Corporate bonds have more credit and liquidity risk than government bonds. Yield spread, the difference between YTMs on same-maturity\ngovernment and corporate bonds, reflects the market's pricing of those risks. Yield spreads narrow when investors perceive that corporate bonds\nare relatively less risky.\nWhen analyzing spreads and assessing how they are likely to change, corporate yield spreads are typically disaggregated into two elements: a\ncredit spread and a liquidity premium. A stronger economy implies increased revenue and operating profits. Higher operating profits mean\ncompanies are less likely to default. This leads to a narrowing of credit spreads, and by extension, a narrowing of yield spreads.\n(Choice A) The direction of government bond yield changes does not provide any direct information on corporate yield spreads.\n(Choice C) An increase in the supply of corporate bonds typically results in wider yield spreads. An increased supply of corporate bonds tends to\ndepress their prices. Lower prices result in higher yields. Other things being equal, this results in wider spreads of corporate over government\nbond yields.\nThings to remember:\nCorporate bond yield spreads narrow when investors perceive corporate bonds as relatively less risky compared to government bonds.\nStrengthening economic conditions reduce investor concerns over credit risk. Credit spreads are a component of corporate yield spreads, so a\nreduction in credit risk leads to a reduction in yield spreads.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 244, "q": "When analyzing the credit risk of a bond issue, the expected loss can most likely be estimated knowing only the bond's:", "opts": ["spread risk and loss severity.", "downgrade risk and recovery rate.", "default probability and loss severity."], "ans": "C", "expl": "Rating agencies' assessments of credit risk reflect the expected loss that results from a borrower (ie, bond issuer) default. The two elements of\ncredit risk are default probability and loss severity:\nDefault probability is the estimated likelihood of a default occurring.\nLoss severity is an estimate of the decrease in value of the bondholder's claim (ie, principal and any past-due coupons) in the event of a\ndefault.\nExpected loss is estimated as the product of two factors: default probability and loss severity, where loss severity equals 1 − Recovery rate.\nThe terms loss severity, loss given default, and loss severity given default are used interchangeably, and whichever expression is used is equal to\n1 − Recovery rate.\n(Choices A and B) Spread risk (ie, change in the difference of a bond's YTM versus a benchmark yield) and downgrade risk (ie, potential of a\nbond's credit rating being reduced) reflect possible changes in a bond's credit quality, but neither directly measures default probability.\nThings to remember:\nThe two elements of credit risk are the probability of a default and the severity of loss if a default occurs. Bondholder losses from default are\nestimated by multiplying default probability by loss severity (1 − Recovery rate).\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 245, "q": "Analysts evaluating the credit risk of AA/Aa2-rated issuers tend to place most emphasis on:", "opts": ["asset values.", "probability of default.", "severity of loss in default."], "ans": "B", "expl": "Credit risk and analysis\nElements of risk Focus of analysis Relevant companies\nCapacity High quality\nDefault probability\n(Operating cash flow sufficiency) (Rated AA/Aa2 or higher)\nSeverity of loss Collateral Low quality/distressed\n(in event of default) (Value of asset versus debt levels) (Rated B or lower)\nThe two elements of credit risk are default probability and loss severity if default occurs. The credit quality of the issuer determines the relative\nimportance of each element for credit analysis. For very high-quality issuers, the focus of analysis is on default probability.\nTriple A– and double A–rated companies almost never default. Consequently, the evaluation of highly rated companies concentrates on whether\nthe rating is deserved and can be maintained. The analysis focuses on the ability to generate cash flow well in excess of the amounts necessary\nto make timely debt service payments (ie, capacity). As long as a double- or triple-A rating is maintained, the default probability is near 0%. If\nthere is no probability of default, default-related losses are not considered when evaluating a bond.\n(Choices A and C) Issuers rated single B or lower default at significantly higher rates. The annual average default rate is approximately 3% and\nspikes dramatically higher (often well above 10%) during economic downturns. The credit analysis of such companies must account for the\npotential for default-related losses, including the degree to which collateral (asset values) may mitigate losses.\nThings to remember:\nThe two elements of credit risk are the probability of default and the severity of loss if default occurs. The higher the rating of the issuer, the\ngreater the emphasis on the probability of default and the maintenance of the higher rating. If the capacity to service debt is deemed great\nenough, the probability of default is near 0%, so default-related losses are inconsequential.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 246, "q": "In the event of a default, a bondholder's expected loss is most appropriately expressed as:", "opts": ["Par value × [Probability of default × (1 − Recovery rate)] ÷ ×", "Par value [Probability of default (1 − Recovery rate)] × ×", "Market value [Probability of default (1 − Recovery rate)]"], "ans": "A", "expl": "The two elements of credit risk are the probability of a default and the severity of loss when a default occurs. Default probability is an estimate of\nthe likelihood of a default occurring. Loss severity is an estimate of the decrease in value of the bondholder's claim in the event of a default.\nNote that loss estimates are made relative to the par value, not the market price (Choice C).\nAs shown in the image above, losses are estimated by multiplying default probability by loss severity (ie, 1 − recovery rate) and can be\nexpressed as a percentage or an amount of money. Typically, credit quality deteriorates and market values decline for years before a default.\nWhen a default occurs, price declines are usually much smaller than the amounts estimated by formulas.\n(Choice B) This formula incorrectly divides (rather than multiplies) par value by the product of default probability and loss severity.\nThings to remember:\nThe two elements of credit risk are the probability of a default and the severity of loss when a default occurs. Bondholder losses from default are\nestimated by combining default probability with loss severity (ie, 1 − recovery rate). Loss estimates are relative to the par value, not the market\nprice.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 247, "q": "Which of the following risks is least likely to impact yield spreads between corporate and government bonds?", "opts": ["Credit risk", "Inflation risk", "Liquidity risk"], "ans": "B", "expl": "Corporate bonds trade at higher YTMs than government bonds of the same maturity. The difference in yields, or the yield spread, reflects the\ngreater credit and liquidity risks of corporates. The yield spread is calculated by finding the difference in yields on the same maturity bonds:\nInflation risk is reflected in the nominal risk-free rate (ie, government bond yield) from which the spread is calculated. Inflation risk is not a\ncomponent of the yield spread. Regardless of the source of funds, changes in the price level (ie, inflation) impact the purchasing power of\nmoney to the same degree. It makes no difference whether the money was received from holding a corporate bond or a government bond.\n(Choice A) Credit risk is reflected in corporate bond yields. Compared to governments, corporations face greater uncertainty regarding their\nability to make debt payments. Government bonds are usually default risk-free.\n(Choice C) Due to the size of the markets and the volume of trading, government bonds are more liquid than same-country corporate bonds.\nEspecially in periods of financial stress, when liquidity for even high-credit-quality corporate debt is greatly diminished, there are usually ready\nbuyers for major country government bonds.\nThings to remember:\nCorporate bonds trade at higher YTMs than same-maturity government bonds. The yield spread (ie, difference in yields) is due to the greater\ncredit and liquidity risk of corporate bonds compared to government bonds. Inflation risk is not a component of the yield spread. It is a component\nof the nominal risk-free rate from which the spread is calculated.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 248, "q": "Which of the following best describes loss severity for a debt instrument?", "opts": ["Loss given default −", "One default rate", "Par value × default probability"], "ans": "A", "expl": "Credit risk refers to the expected financial loss that occurs if a bond issuer defaults in paying interest and/or principal. Expected loss comprises\ntwo components, the probability that a default occurs and the severity of the loss. Loss severity, also known as loss given default, is the\nportion of a bond's value, including unpaid interest, that a bond investor loses when an issuer defaults:\nLoss severity = (1 − recovery rate)\nThe recovery rate is the principal amount recovered in a default, expressed as a percentage of par. When defaults do occur, the severity of the\nloss can range from a total loss to a complete recovery of principal and interest.\n(Choice B) Loss severity is expressed as (1 − recovery rate), not (1 − default rate).\n(Choice C) Loss severity is expressed as (1 − recovery rate), not (par value × default probability).\nThings to remember:\nLoss severity, also known as loss given default, is the portion of a bond's value, including unpaid interest, that a bond investor loses when an\nissuer defaults. Loss severity is expressed as (1 − recovery rate).\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 249, "q": "A company's bonds are currently trading at a lower YTM than bonds with similar maturities but have the same credit rating as those other bonds. Based only on this information, the most appropriate conclusion by market participants is that rating agencies are:", "opts": ["underestimating the company's probability of default.", "overestimating the bonds' recovery rate in event of default.", "slower to recognize the company's improving credit quality."], "ans": "C", "expl": "Bond market values can adjust immediately as traders react to new information. Therefore, changes in issuer credit quality are quickly reflected\nin bond YTMs. Conversely, agency credit ratings result from a much slower, multistep process, involving the bond's rating by a team of analysts\nand approval by a rating committee.\nThis timing difference means that credit quality changes are likely to be recognized by the market well before being reflected in a revised credit\nrating. A lower yield on a company's bonds compared to other bonds of the same credit rating and maturity most likely means that the company's\ncredit quality has improved. The reduced credit risk is reflected by the lower YTM in the market before it is recognized in a credit rating\nupgrade.\n(Choice A) If rating agencies underestimate the default probability, then the market expects a greater probability of default and demands higher\n(not lower) YTMs, compared to similar bonds, to compensate for the greater risk.\n(Choice B) If rating agencies overestimate the recovery rate (and consequently underestimate loss severity), then the market expects larger\nlosses from default than is reflected in the credit rating. Larger expected losses make bonds less valuable and result in higher (not lower) YTMs,\ncompared to similar bonds.\nThings to remember:\nMarkets can immediately revalue bonds and adjust their YTMs in response to new information. Credit ratings change only after a formal process,\nincluding revaluation of creditworthiness. Consequently, credit rating changes tend to lag the market in recognizing changes in credit quality.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 250, "q": "The best reason to avoid overreliance on credit ratings is that ratings:", "opts": ["tend to be static.", "usually lead market prices.", "do not capture all types of risk."], "ans": "C", "expl": "Credit rating agencies\nAdvantages Disadvantages\nLaws and regulations often require Potential conflicts of interest\nbonds to be rated by rating Market prices are affected by changes in credit\nagencies. risk faster than rating agencies can change their\nRatings are often based on material ratings.\nnonpublic information. Contingent risks (eg, legal, business risks) may\nBoth issuers and specific bonds are not be reflected in ratings.\nrated. Agencies make mistakes.\nRatings allow easy comparison\nacross bonds and issuers.\nMajor rating agencies provide credit ratings that bond investors perceive as reliable measures of risk for a bond issuer or issuance. However,\ninvestors should avoid relying excessively on credit ratings since they have several limitations.\nRating agencies' credit analyses capture a variety of risks that impact the issuer, but several types of risk (eg, litigation, environmental) are more\ndifficult to anticipate or quantify. These risks often are not completely captured in credit ratings. Investors should not assume that ratings\nfully and accurately reflect all risks.\n(Choice A) Ratings may update more slowly than market prices, but they tend to be updated regularly. A bond's ratings can migrate considerably\nfrom issuance to maturity. Investors should not assume ratings will remain static (ie, unchanged).\n(Choice B) Circumstances that affect bond valuations will be reflected quickly in a bond's market price. Ratings are updated less frequently than\nmarket prices; therefore, ratings tend to lag (rather than lead) the market's view on a bond's credit risk.\nThings to remember:\nBond investors view credit ratings as an accurate representation of an issuer's credit risk; however, ratings have limitations. For example, they do\nnot capture risks that are difficult to quantify; tend to lag, not lead, the market; and can change considerably between issuance and maturity.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 251, "q": "If a company issued a senior subordinated bond with a B2 rating, which of the following is most likely to be its issuer rating?", "opts": ["Ba3", "B2", "B3"], "ans": "A", "expl": "Rating agencies consider priority of claims, along with other criteria, when rating borrowers' bond issues. Ratings on senior unsecured\nbonds reflect the issuer's creditworthiness, so they generally have the same rating as the bond issuer. Other issues are typically subordinated\nand their ratings are lower, reflecting their lower priority.\nRating agencies use notching to set issue ratings. The issuer rating is the starting point, and the bond ratings are \"notched\" (ie, adjusted)\nbased on where each issue ranks in the priority of claims. Lower-rated issuers have a greater default risk, so agencies apply larger adjustments\nto reflect the higher risk in their subordinated issues.\nIn this question, the subordinated bond has a B2 rating. Due to priority of claim, the rating agency would have adjusted down from the rating of\nthe senior unsecured debt to arrive at this rating. Therefore, the issuer rating is most likely higher. Therefore, the issuer rating would be Ba3.\n(Choice B) B2 is the same rating as the subordinated debt, but the issuer rating is most likely higher in this case.\n(Choice C) B3 is lower than the current rating for the subordinated debt. The issuer rating is typically rated higher, not lower, than subordinated\ndebt.\nThings to remember:\nRating agencies use a process called notching to set issue ratings. This relies on using issuer ratings as a starting point and adjusting based on\npriority of claims to rate bonds. The adjustment varies according to the issuer's creditworthiness, with larger adjustments typically applied to the\nsubordinated debt of lower-quality issuers.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 252, "q": "The risk that a bond's credit rating might decline is best described as:", "opts": ["credit spread risk.", "credit duration risk.", "credit migration risk."], "ans": "C", "expl": "Credit ratings\nStandard & Poor's Moody's\nAAA Aaa\nAA Aa\nInvestment grade A A\nBBB Baa\nBB Ba\nB B\nCCC Caa\nBelow investment grade CC Ca\nC C\nD D\nCredit ratings reflect both the probability of default and the severity of loss in case of default. The lower the credit rating, the greater the\nexpected loss if default occurs. Credit migration risk describes the risk associated with a bond's credit rating being lowered.\nBond investors are very sensitive to credit migration risk since losses due to declines in creditworthiness can be substantial. Although market\nvalues typically move in advance of rating changes, yield increases due to declines in credit quality can be tens or hundreds of basis points.\n(Choice A) Credit spreads are the portion of the corporate yield spread above benchmark government bonds that reflect the greater credit risk of\ncorporate securities. Credit spreads widen as markets perceive worsening creditworthiness, but credit spread risk is not used to describe the risk\nof a credit rating downgrade.\n(Choice B) Credit duration can be used to estimate the impact on a bond's price due to a change in its credit spread. However, credit duration is\nnot used to describe the risk of a credit rating downgrade.\nThings to remember:\nCredit ratings reflect both the probability of default and the severity of loss in case of default. The lower the credit rating, the greater the expected\nloss if default occurs. Credit migration risk describes the risk associated with a bond's credit rating being lowered.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 253, "q": "All else being equal, if an issuer has less publicly traded debt outstanding than other comparable companies, then most likely the company's bonds will have:", "opts": ["more interest rate risk.", "less market liquidity risk.", "a greater market liquidity premium."], "ans": "C", "expl": "Credit-related risks\nType of risk Attributed to\nDowngrade risk (credit migration risk) Drop in issuer's creditworthiness\nLower-quality bonds\nMarket liquidity risk Smaller size of the issuer (ie, issuer has less publicly traded\ndebt outstanding)\nCredit-related risks (eg, downgrade risk, market liquidity risk) increase yield spreads and decrease bond prices. Downgrade risk refers to the\nworsening of the issuer's creditworthiness. Market liquidity risk refers to potential discrepancies between a bond's actual transaction (buy/sell)\nprice and the observed market price.\nMarket liquidity risk is impacted by the issuer's amount of publicly traded debt outstanding (issuer size) and credit quality. In general, lower-quality\nbonds and smaller issuer size lead to less frequent trading, and thus greater market liquidity risk (Choice B). Investors demand a higher liquidity\npremium, which results in a higher yield and lower price.\n(Choice A) Interest rate risk is tied to general interest rate changes in the macroeconomy, not to credit risk specific to an issuer.\nThings to remember:\nIn general, lower-quality bonds and smaller issuer size lead to less frequent trading, and thus greater market liquidity risk. Market liquidity risk\nrefers to potential discrepancies between a bond's actual transaction (buy/sell) price and the observed market price.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 254, "q": "Credit spreads are most likely to widen if:", "opts": ["equity markets are declining.", "the economy is strengthening.", "corporate bond issuance is declining."], "ans": "A", "expl": "Corporate bonds trade at higher YTMs than government bonds of the same maturity, reflecting the greater risk of corporate securities. The\ndifference in yields, the yield spread, has a credit risk component (ie, credit spread) and a liquidity risk component (ie, liquidity premium). Credit\nspreads widen when investors perceive that corporate bonds have become relatively riskier compared with government securities.\nDeclining equity values result in a general increase investor risk aversion. Persistent drops in equity values usually precede weakening economic\nconditions, which typically results in worsening credit conditions. This set of factors causes investors to reduce their holdings of corporate bonds\nand hold larger amounts of default risk-free government debt. The result is a widening of credit spreads.\n(Choice B) Strengthening economies usually result in increased operating income, reducing investor concerns about credit risk. Credit spreads\nnarrow.\n(Choice C) Holding demand constant, reduced supply (ie. declining issuance) generally results in higher prices. Higher bond prices result in\nlower yields and narrower credit spreads.\nThings to remember:\nCredit spreads widen when investors perceive increased risk exposure in holding corporate bonds in comparison to default risk-free government\nbonds. Declining equity markets often precede or coincide with a worsening of several factors that heighten investor concerns about risk, leading\nto wider credit spreads.\nDescribe credit risk and its components, probability of default and loss given default.", "qhtml": null}, {"n": 255, "q": "Bond market price adjustments reflecting a company's deteriorating credit quality are most likely to:", "opts": ["lag credit rating downgrades.", "coincide with credit rating downgrades.", "precede credit rating downgrades."], "ans": "C", "expl": "Markets can reprice assets continuously in response to new information. Large numbers of bond traders and portfolio managers constantly\nreassess the value of publicly traded bonds. New information indicating an issuer's deteriorating credit quality causes many investment\nprofessionals to sell immediately to avoid larger losses in the long run (or to profit from short selling when possible). These actions result in bond\nprices adjusting almost immediately.\nCredit ratings are the considered opinions of rating agencies. A credit rating team contains a handful of analysts. They must take time to gather\nand analyze the data before presenting a recommendation to a rating committee. Ratings can be changed only after completing a formal\nprocess. The consequence is that market price changes almost always precede formal announcements of credit rating changes.\nThings to remember:\nMarkets can reprice assets immediately in response to new information. Credit ratings can change only after a formal process that entails a\nreanalysis of a company's creditworthiness. Consequently, market price changes almost always precede formal announcements of credit rating\nchanges.\nDescribe the uses of ratings from credit rating agencies and their limitations.", "qhtml": null}, {"n": 256, "q": "Compared to default risk, spread risk is a more important consideration for a US-based investor evaluating which of the following bonds?", "opts": ["US Treasury bonds", "High-yield corporate bonds", "Investment-grade corporate bonds"], "ans": "C", "expl": "Spread risk represents the potential for the yield spread to change while an investor owns a bond. The two key components of spread risk are as\nfollows:\nMarket liquidity risk: The risk that due to market illiquidity a bond can be bought (sold) at a price significantly different than the market\nprice. Liquidity risk is most often reflected in the bid-ask spread. For example, a bond may have a market price of 100 but can be sold for\nonly 98 (ie, bid) or bought for no less than 102 (ie, ask). The more acute the bond's liquidity situation, the greater the spread required to\ncompensate the investor for the risk.\nCredit migration risk: The risk that a bond's credit rating is downgraded, resulting in a greater probability of default, which is reflected in\nhigher yield spreads. A default is the ultimate negative outcome of credit migration risk.\nVirtually all bonds are evaluated on the basis of yield spread. However, spread risk is considered a relatively greater risk than default risk for\ninvestment-grade bonds since their risk of default is remote (<1%). In contrast, the probability of default risk, compared to the probability of a\ndowngrade (ie, credit migration risk), is much more significant in the evaluation of high-yield debt; therefore, for high-yield bonds, the emphasis on\ndefault risk is relatively greater than spread risk (Choice B).\n(Choice A) Very high-quality sovereign bonds, such as US Treasury bonds, are considered free of default risk and are used as the basis to\ndetermine yield spread (as in the image above). Therefore, they do not have spread risk.\nThings to remember:\nCompared to high-yield credit analysis, investment-grade debt analysis relies more on spread risk than default risk since investment-grade bonds\nhave only a remote risk of default.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 257, "q": "Which of the following debts issued by the sovereignty of a developing economy is least likely to default?", "opts": ["USD-denominated debt issued in the US", "USD-denominated debt issued in the Eurobond market", "Local currency-denominated debt issued in the domestic market"], "ans": "C", "expl": "Sovereigns (national governments) can issue bonds in their domestic market, foreign national markets, or the Eurobond market. Funding needs\nversus available capital, preferred funding currency, and market access are the primary factors that influence the choice of market segment and\ncurrency.\nQuantitative (eg, tax revenues versus expenditures) and qualitative (eg, stability of political system) factors impact the credit (ie, default) risk of\nsovereign debt. Sovereign borrowers have several advantages when selling local currency-denominated debt in their domestic market. The\nsovereign may be able to influence judicial decisions, and it can \"print\" money to repay debt. The ability to create money means a sovereign is\nless likely to default on local currency-denominated bonds, so such issues often have higher ratings than debt issued in a currency other than\nthe issuer's local currency.\n(Choices A and B) Debt issued outside of the domestic market can place legal constraints on sovereigns that may be avoided in its domestic\nmarket. Most importantly, with foreign currency-denominated debt, adverse exchange rate movements can impair the ability to service debt. In\nthis case, a developing economy would not be the U.S.\nThings to remember:\nSovereign debt issued domestically and denominated in the local currency exposes investors to less default risk than the same issuer's debt\ndenominated in a widely used currency. Although the other factors impacting credit risk are similar, governments can print money to repay debt\ndenominated in their own currency.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 258, "q": "If an investor is most concerned about being able to legally enforce payment of principal and interest in the event of default, which of the following bonds represents the least appropriate investment choice? ", "opts": ["Sovereign debt", "High-yield corporate", "Nonsovereign revenue"], "ans": "A", "expl": "Sovereign credit analysis\nSovereign debt factors Nonsovereign debt factors\nBasic institutional systems and risks\nCash on balance sheet\nEconomic growth prospects\nOperating cash flow\nInternational position and reputation\nAbility to pay Bank credit\nAccess to external liquidity\nAsset sales\nFiscal and monetary policies\nRaise debt/equity capital\nDebt burden\nForced bankruptcy\nSovereign immunity allows a\nAsset seizures\nWillingness to pay government to avoid legal remedies\nPersonal liability/reputation\nto force debt repayment\nBusiness dissolution\nAt a high level, sovereign credit analysis begins with an assessment of a country's ability to pay and willingness to pay. A unique feature of\nsovereign credits is sovereign immunity, which is the inability of investors to force debt repayment through legal means.\nFactors to consider when assessing a country's willingness to pay include the following:\nRespect for the rule of law\nLevel of government corruption\nGovernmental checks and balances\nUniversal property rights\nPrior commitment to pay debts\n(Choices B and C) High-yield corporate and nonsovereign revenue bonds are issued by entities that can be forced through legal means to honor\ntheir debts. This does not mean that investors will always be repaid in full, only that legal remedies (eg, bankruptcy laws) are available.\nThings to remember:\nA unique feature of sovereign credits is the concept of sovereign immunity, which is the inability of investors to force debt repayment through legal\nmeans.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 259, "q": "The credit risk of nonsovereign government revenue bonds is most likely based on:", "opts": ["project net operating cash flow.", "a full faith and credit guarantee.", "income and sales tax revenues."], "ans": "A", "expl": "Most nonsovereign government debt is issued by regional (eg, Canadian provinces, US states) or local (eg, Prefecture of Tokyo) governments.\nThese securities are usually categorized as either general obligation bonds or revenue bonds. General obligation debt typically carries a full faith\nand credit pledge.\nDespite being issued in the name of a regional or local government, revenue bonds are secured only by the revenues of the project (eg,\nairports, toll roads or bridges). Most often, the payments to the bondholders are obtained only through the fees or user charges generated by the\nproject. The requirement to pay debt service on revenue bonds extends only to funds generated by the source(s) identified in the bond's\nindenture.\n(Choices B and C) General obligation bonds are usually safer than revenue bonds, as the full faith and credit pledge means the debt service is\nsupported by all sources of revenue received by the issuer (ie, taxing authority).\nThings to remember:\nMost nonsovereign government debt issues are categorized as either general obligation (GO) or revenue bonds. GO debt is backed by the\nissuer's taxing authority. Revenue bonds are usually riskier because they are secured only by the revenues of the project financed by the bond\noffering.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 260, "q": "A high-yield bond issuer has a \"top-heavy\" capital structure. The owner of the company's senior unsecured debt most likely has a:", "opts": ["smaller probability that a default occurs.", "lower rate of recovery in the event of default.", "higher rate of recovery in the event of default."], "ans": "B", "expl": "High-yield credit analysis: additional considerations\nEspecially critical for high-yield issuers\nLiquidity Examples: cash on balance sheet, strong operating\ncash flow, bank credit facilities\nFinancial Robust scenario analysis and stress testing take on\nprojections added importance\nLeverage analysis at each level of debt required\nDebt structure \"Top-heavy\" debt structures decrease financial\nflexibility and are more prone to default\nCompanies may issue high-yield debt for many reasons, but such companies tend to have weak balance sheets and/or impaired business\nmodels. Due to the greater operational risk and higher probability of default, credit analysis of high-yield bonds, compared to the analysis of\ninvestment-grade bonds, requires additional scrutiny. The priority of claims is of particular importance, and leverage calculations should be\nperformed for every debt class.\nSecured creditors (eg, first and second lien) have the most senior claims on a company's cash flows and assets and rank ahead of all unsecured\ncreditors. High-yield issuers with a large proportion of secured debt are considered \"top-heavy.\"\nFor top-heavy issuers, secured debt is often in the form of bank debt with stringent loan covenants, short maturities, and little room to access\nadditional bank lines of credit. In the event of financial distress, such companies have limited ability to refinance or raise additional debt capital,\nleading to a higher risk of default and lower rate of recovery for creditors with a lower priority of claims (eg, senior unsecured debt) (Choices\nA and C).\nThings to remember:\nHigh-yield issuers with a large proportion of secured debt are considered \"top-heavy,\" resulting in a higher risk of default and lower rate of recovery\nfor creditors with a lower priority of claims.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 261, "q": "Compared with yield spreads between investment-grade bonds and government bonds, yield spreads between high-yield bonds and governments are most likely:", "opts": ["wider and less volatile.", "wider and more volatile.", "narrower and more volatile."], "ans": "B", "expl": "Corporate bonds trade at higher yields than same-maturity government bonds due to greater credit and liquidity risks. High-yield bonds expose\ninvestors to more of both risks, so their yields must reflect a larger risk premium (ie, wider yield spreads) to governments. Greater uncertainty\nregarding the impact of credit and liquidity risks on high-yield returns results in more volatile yield spreads.\nThe wider and more volatile spreads for high-yield bonds are illustrated in the graph above, which shows that high-yield spreads were always at\nleast double those for investment-grade bonds for the years shown. At times of economic weakness (ie, shaded areas marking recessions), many\nfixed-income investors seek the safety of government bonds. This can cause government yields to fall even as corporate yields rise (eg, 2008–\n2009 in the top diagram in the image). Sometimes, high-yield spreads to governments can widen to more than four times the spread for\ninvestment-grade bonds.\nThings to remember:\nCorporate bonds trade at higher yields than government bonds due to greater credit and liquidity risks. High-yield bonds expose investors to more\nof both risks, so such securities must trade at even wider yield spreads to governments. Greater uncertainty regarding the impact of those risks\nresults in more volatile yield spreads.\nExplain special considerations when evaluating the credit of sovereign and non-sovereign government debt issuers and issues.", "qhtml": null}, {"n": 262, "q": "In a bankruptcy reorganization, which of the following categories of creditors is most likely to have the highest recovery rate?", "opts": ["Second lien", "Senior unsecured", "Senior subordinated"], "ans": "A", "expl": "Secured debt is backed by a claim (ie, lien) on specific assets pledged as collateral. Secured creditors have the most senior claim on the cash\nflows and assets of a company. As a type of secured debt, a second lien obligation is ranked ahead of all unsecured creditors and equity\nholders. Secured creditors' claims are paid first in any liquidation or obtain the highest recovery rates in a bankruptcy reorganization.\nIn the case of a second lien obligation, first lienholders have a prior claim on the assets pledged as collateral. However, the collateral value is\ntypically significantly greater than the original value of the claims of all lienholders. Should the collateral prove inadequate to cover the entire debt,\nsecured creditors are ranked equally with senior unsecured creditors for the balance of their claims.\n(Choice B) Senior unsecured creditors are ranked ahead of all other unsecured creditors and all equity holders. However, senior unsecured\ncreditors rank behind the secured creditors, including second and third lienholders, with respect to any asset pledged as collateral.\n(Choice C) Senior subordinated creditors are junior to the other listed creditor classes. Although senior to other subordinated creditors and equity\nholders, senior subordinated lenders have the lowest recovery rate among the categories of creditors shown here.\nThings to remember:\nSecured creditors have the most senior claim on the cash flows and assets of a company. As a type of secured debt holder, second lienholders\nare ranked ahead of all unsecured creditors and all equity holders. Second lienholders have among the highest recovery rates in bankruptcy\nreorganizations.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 263, "q": "Which of the following choices lists the securities in the proper priority of claims, from most senior to most junior?", "opts": ["Preferred stock, second-lien debt, junior subordinated debt", "Second-lien debt, junior subordinated debt, preferred stock", "Junior subordinated debt, second-lien debt, preferred stock"], "ans": "B", "expl": "In the priority of claims for bankruptcy liquidations or reorganizations, all classes of creditors are senior to all classes of equity. Among creditors,\nsecured obligations take precedence over unsecured debts. Since their obligations are secured, second lienholders rank ahead of junior\nsubordinated lenders. Although junior subordinated debt is the lowest-priority creditor class, the claim of its holders (as creditors) is still senior\nto that of any equity holder, including preferred shareholders. Preferred equity is junior to all classes of debt but is senior to common equity.\nThings to remember:\nSecured debt ranks ahead of all unsecured debt and all equity. Junior subordinated bondholders are the most junior class of company creditors,\nbut their claim is senior to the claim of preferred equity.\nDescribe the seniority rankings of debt, secured versus unsecured debt and the priority of claims in bankruptcy, and their impact on credit ratings.", "qhtml": null}, {"n": 264, "q": "The following information is from a company's income statement: € millions Gross profit 7,294 Other operating income 314 Other operating expenses 6,910 Operating profit 698 Interest income 54 Interest expense 169 Income before taxes 583 Income taxes 172 Net income 411 Depreciation and amortization were €207 million for 20X0. Based on only this information, the company's EBITDA interest coverage ratio is closest to:", "opts": ["4.13", "5.36", "7.87"], "ans": "B", "expl": "EBITDA interest coverage = EBITDA ÷ Interest expense\nEBITDA = Operating profit + Depreciation and amortization\nCredit analysts often use credit analysis ratios as part of an evaluation of a company's financial health. Among these, coverage ratios can assess\nthe company's ability to pay its interest obligations through its operations. Two commonly used ratios are the EBITDA and EBIT interest-coverage\nratios.\nBoth ratios measure the operating earnings available to make interest payments relative to the size of those interest payments. The higher the\nratio, the more likely the company can meet its obligations. Of the two, EBITDA interest coverage is considered the more liberal ratio since it adds\nback the noncash expense of depreciation and amortization to the numerator, and EBIT interest coverage does not.\nIn this scenario, the EBITDA interest coverage ratio is calculated by first determining EBITDA. Since this company does not have other\nnonoperating income and expenses, its operating profit equals EBIT. Therefore:\nEBITDA = Operating profit + Depreciation and amortization\n= 698 + 207\n= 905\nThen, EBITDA is divided by interest expense:\nEBITDA interest coverage = EBITDA / Interest expense\n= 905 / 169\n≈ 5.36\n(Choice A) 4.13 results from not adding in depreciation and amortization before dividing by the interest expense. It is the correct result when\ncalculating the EBIT interest coverage ratio, not the EBITDA interest coverage ratio.\n(Choice C) 7.87 results from dividing by the net of the interest income and expense, not just the interest expense.\nThings to remember:\nA credit analyst uses credit analysis measures to evaluate a company's financial health. Among these measures, coverage ratios can assess the\ncompany's ability to pay its interest obligations. The EBITDA interest coverage ratio = (Operating profit + Depreciation and amortization) / Interest\nexpense.\nCalculate and interpret financial ratios used in credit analysis", "qhtml": null}, {"n": 265, "q": "In traditional credit analysis, collateral is most likely concerned with which of the following?", "opts": ["Asset values relative to level of indebtedness", "Projected cash flow from company operations", "Affirmative and restrictive indenture provisions"], "ans": "A", "expl": "In the four Cs of traditional credit analysis, collateral refers to the value of company assets relative to its level of indebtedness. Collateral in\nthis context is not narrowly focused on the value of assets pledged as collateral on secured bonds. In this case, collateral refers to the estimated\nvalue of a company's financial, tangible and intangible assets and the degree to which their sale might mitigate creditor losses in the event of\ndefault.\nThe two elements of credit risk are the probability of default and the severity of loss if default occurs. The primary focus of most credit analysis is\nan issuer's ability to generate cash flow sufficient to make timely debt service payments (ie, avoid default). The focus shifts to asset values (ie,\ncollateral) when the probability of default has increased enough to concern investors.\n(Choice B) Projected cash flow from company operations is an important consideration when evaluating an issuer's capacity in traditional credit\nanalysis.\n(Choice C) Affirmative and restrictive indenture provisions are an important consideration when evaluating bondholder contractual protections (ie,\ncovenants) in traditional credit analysis.\nThings to remember:\nIn the four Cs of traditional credit analysis, collateral refers to the value of a company's assets relative to its level of indebtedness. In this context,\ncollateral (ie, as
