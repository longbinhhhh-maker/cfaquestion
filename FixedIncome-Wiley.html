ond number refers to how long the rate is in effect, and the first number refers to\nwhen the rate begins; therefore, 2y1y is a one-year rate that will take effect two years from now. The 2y1y rate is calculated as follows:\nInvesting in a two-year, zero-coupon bond discounted annually at 3.75% and, when it matures, reinvesting the proceeds in a one-year, zero-\ncoupon bond at 'today's implied 2y1y rate of 4.95% produces the same overall return as a three-year bond with a 4.15% annual discount rate.\n(Choice A) 4.25% is the 1y1y implied forward rate.\n(Choice B) 4.60% is the 1y2y implied forward rate.\nThings to remember:\nAn implied forward rate is the reinvestment rate that an investor expects to receive today for a specified future period. It bridges the returns from\nzero-coupon bonds of different maturities and can be derived from known spot rates.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 156, "q": "The following table shows a series of annual spot rates: Maturity (years) Spot Rate (%) 1 1.05 2 2.33 3 2.90 The 1-year rate available in 2 years is closest to:", "opts": ["3.47%", "4.05%", "6.04%"], "ans": "B", "expl": "A forward rate for a period can be derived by using:\nthe forward rates from prior periods or\ntwo spot rates from a spot curve (ie, series of spot rates).\nA forward rate can be interpreted as a marginal return that would make investors extend their horizons by one period (eg, 1 year). In this\ninstance, the return on a 3-year bond is equivalent to the return on a 2-year bond plus the marginal return of extending the bond for 1 year.\nThat marginal return is a 1-year rate available in 2 years (ie, 2y1y) and can be calculated using 2-year and 3-year spot rates.\nThe rate given as 2y1y is solved as follows:\nExpressed as a percentage, 2y1y is 4.05%.\n(Choice A) 3.47% results from using the correct spot rates but applying exponents of 1 and 2.\n(Choice C) 6.04% results from using the 1-year and 2-year spot rates.\nThings to remember:\nA forward rate for a period can be derived by calculating the forward rates for prior periods or by using two spot rates from a spot curve. The\nforward rate represents the added marginal return that would make investors extend their horizons to a later maturity.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 157, "q": "The forward curve is constructed from the implied forward rates shown below. The rates are stated on an annual basis: The price per 100 par value of a three-year, 4% annual-pay bond is closest to:", "opts": ["102.11", "103.38", "105.64"], "ans": "C", "expl": "A bond's present value is calculated by discounting each of the bond's cash flows at the spot rate in effect when the cash flow occurs. Spot rates\nare not given in this question, but they can be derived as a geometric average of the forward rates. For example, today's two-year spot rate is\ncalculated as:\nThe two-year spot rate in this question is approximately 1.67%, so the present value of the second year's coupon is calculated by discounting it by\n(1 + 0.0167)2 (1 + 0.012)1 × (1 + 0.0215)1 = (1 + 0.0167)2\n. However, since , the present value is the same when discounting the\ncoupon by the product of the two forward rates:\nThe present value of each of the bond's cash flows using this method is demonstrated below:\n(Choice A) 102.11 is the present value when all cash flows are incorrectly discounted by the 3y1y rate of 3.25%. 3.25% is the one-year forward\nrate that begins in three years. It is not a spot rate.\n(Choice B) 103.38 is the sum of all present values calculated by treating each forward rate as though it were a spot rate and discounting each\ncash flow.\nThings to remember:\nCalculating a bond's present value is normally accomplished from discounting each of its cash flows by the applicable spot rate. However, when\nthe forward rates are given, they can be used as the discounting factors. The bond's present value is identical in either case.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.\n17.The risk-free yields for a spot curve constructed from government debt instruments most likely refer to the absence of:\n A. credit risk.\nB. liquidity risk.\nC. inflation risk.\nExplanation\nA yield curve allows comparisons between yields of bonds over different maturities (ie, term structure of interest rates). Most yield curves are\nbased on government bonds, which have no risk of defaulting on principal or coupon payments. However, government bonds have different\ncoupon rates for different maturities, so each maturity reflects some degree of reinvestment risk. This risk can prevent accurate analysis of the\nterm structure.\nThe spot curve is the government bond yield curve constructed from a series of government zero-coupon bonds of different maturities. Zero-\ncoupon bonds do not pay periodic interest, so they have no reinvestment risk since there is nothing to reinvest until maturity. Although the spot\ncurve reflects the absence of both credit and reinvestment risks, it addresses neither liquidity risk nor inflation risk.\n(Choice B) The demand for government bonds is not the same for all maturities. Bonds for which there is low demand can exhibit lack of liquidity,\nposing liquidity risk. This would manifest as a higher spread between the bid and ask prices that dealers quote for the bonds.\n(Choice C) Most government bonds do not adjust their coupon rates or principal to keep pace with inflation, so government bond yields do not\naccount for inflation risk.\nThings to remember:\nA yield curve that is equivalent to a series of government bonds of different maturities eliminates default risk, so the yields are known as the \"risk-\nfree\" rates. A spot curve refines a yield curve by removing reinvestment risk, but government bonds can still contain liquidity and inflation risks.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 158, "q": "The risk-free yields for a spot curve constructed from government debt instruments most likely refer to the absence of:", "opts": ["credit risk.", "liquidity risk.", "inflation risk."], "ans": "A", "expl": "A yield curve allows comparisons between yields of bonds over different maturities (ie, term structure of interest rates). Most yield curves are\nbased on government bonds, which have no risk of defaulting on principal or coupon payments. However, government bonds have different\ncoupon rates for different maturities, so each maturity reflects some degree of reinvestment risk. This risk can prevent accurate analysis of the\nterm structure.\nThe spot curve is the government bond yield curve constructed from a series of government zero-coupon bonds of different maturities. Zero-\ncoupon bonds do not pay periodic interest, so they have no reinvestment risk since there is nothing to reinvest until maturity. Although the spot\ncurve reflects the absence of both credit and reinvestment risks, it addresses neither liquidity risk nor inflation risk.\n(Choice B) The demand for government bonds is not the same for all maturities. Bonds for which there is low demand can exhibit lack of liquidity,\nposing liquidity risk. This would manifest as a higher spread between the bid and ask prices that dealers quote for the bonds.\n(Choice C) Most government bonds do not adjust their coupon rates or principal to keep pace with inflation, so government bond yields do not\naccount for inflation risk.\nThings to remember:\nA yield curve that is equivalent to a series of government bonds of different maturities eliminates default risk, so the yields are known as the \"risk-\nfree\" rates. A spot curve refines a yield curve by removing reinvestment risk, but government bonds can still contain liquidity and inflation risks.\nCompare the spot curve, par curve, and forward curve.", "qhtml": null}, {"n": 159, "q": "An analyst has gathered the following information on zero-coupon government bond yields: Maturity Spot Rate 1 year 2.42% 2 years 3.05% 3 years 3.48% 4 years 3.65% If the rates are based on a periodicity of 1, the one-year forward rate 2 years in the future (2y1y) is closest to:", "opts": ["3.72%", "4.16%", "4.35%"], "ans": "C", "expl": "A forward rate (or implied forward rate [IFR]) is a future period interest rate. Forward rates are not expectations of future spot rates; instead, they\nare future interest rates that reflect the difference between spot rates of different maturities (ie, tenors), based on the assumption that\ninvestment strategies covering the same time horizon and carrying equivalent risk should have the same return. In effect, forward rates are the\nbreakeven reinvestment rates that produce that result. Arbitrage-free pricing enforces the consistency of forward rates with spot rate differences.\nIn this scenario, equal amounts invested in a strategy today should have the same future value at the end of 3 years. To answer this question, two\ninvestment strategies can be compared as follows:\nBuy a three-year zero-coupon bond and hold it to maturity (ie, right side of the first equation above).\nBuy a two-year zero-coupon bond and hold it to maturity; at maturity, reinvest the proceeds in a one-year zero-coupon bond (ie, left side of\nthe first equation above).\nThese two strategies are illustrated on the following timeline:\nThe IFR for the one-year forward rate starting 2 years in the future (IFR ) is calculated as follows:\n2,3−2\n(Choice A) 3.72% results from incorrectly calculating the IFR as [(1 + Three-year spot rate)3 − 1] / 2.\n(Choice B) 4.16% is the one-year forward rate starting 3 years in the future.\nThings to remember:\nA forward rate is a future period interest rate that reflects the difference between spot rates of different tenors. In effect, forward rates are\nbreakeven reinvestment rates that result in two investment strategies of equivalent risk, covering the same time horizon and earning the same\nreturn.\nDefine par and forward rates, and calculate par rates, forward rates from spot rates, spot rates from forward rates, and the price of a bond using\nforward rates.", "qhtml": null}, {"n": 160, "q": "A coupon bond's Macaulay duration is most accurately described as the holding period over which:", "opts": ["the value of cash flows received equal the cost of buying the bond.", "changes in reinvestment income offset changes in the bond's price.", "the bond earns a risk-free return if hedged by shorting a government bond."], "ans": "B", "expl": "Noncallable coupon bonds contain two types of interest rate risk: reinvestment risk and price risk. Reinvestment risk dominates in the long run\nand price risk dominates in the short run. Logically, somewhere in between the short run and the long run, there should be a balance point.\nThat point is the Macaulay duration: the holding period to the point where changes in reinvestment income and changes in price offset one\nanother exactly.\nInterest rates increase: additional reinvestment income and bond price decreases\nInterest rates decrease: reduced reinvestment income and bond price increases\nNo matter the direction, the impact of a rate change is positive for one source of return, but negative for the other. In the short run, price risk\ndominates. Interest rate changes affect bond prices immediately. In the long run, reinvestment risk dominates since its impact builds over time as\nmore coupons are reinvested. A bond's Macaulay duration is the holding period over which those risks balance each other.\n(Choice A) Market price equals the present value of the coupon and principal, so a bond must be held to maturity to receive cash flows with a\nvalue equal to the cost of the bond. Since Macaulay duration is the present value weighted average time of the cash flows, a coupon bond's\nMacaulay duration is shorter than its time to maturity.\n(Choice C) Although it is a type of hedge, the strategy is not riskless and therefore does not lock in a risk-free rate of return.\nThings to remember:\nThe Macaulay duration is the holding period of a bond to the point where changes in reinvestment income and changes in price offset one another\nexactly.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 161, "q": "Five years ago, an investor purchased a 10-year, 7% semiannual coupon paying bond for 98. Today the bond is sold for 98.25. The capital gain or loss per 100 of par value is closest to:", "opts": ["−1.75", "−0.57", "0.25"], "ans": "B", "expl": "An investor's capital gain or loss equals the selling price minus the carrying value at the time of the sale. At any point in time, the bond's\ncarrying value is the initial price adjusted for the accumulated amortization of the discount or premium.\nFor a bond initially issued at a discount, carrying value increases over time until it reaches par value at maturity.\nFor a bond initially issued at a premium, carrying value decreases over time until it reaches par value at maturity.\nIn this question, the bond was initially purchased at a discount. To find the capital gain or loss:\n(Choice A) −1.75 capital loss results from subtracting the par value 100 from the sales price 98.25.\n(Choice C) 0.25 capital gain results from subtracting the initial price 98 from the sales price 98.25.\nThings to remember:\nAn investor's capital gain or loss equals the selling price minus the carrying value at the time of the sale. For a bond, the carrying value is the\nbond's initial price adjusted for the accumulated amortization of the discount or premium over time.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 162, "q": "A 10-year, zero-coupon bond is priced at 64.3928 per 100 of par value and is trading at a 4.50% yield-to-maturity using annual compounding. Assuming a 10-basis point change in yield-to-maturity, the approximate modified duration of the bond is closest to: ", "opts": ["9.57", "9.62", "10.00"], "ans": "A", "expl": "The solution requires determining the price of the zero-coupon bond twice: at the initial yield minus 10 basis points (price ) and at the\nlower yield\ninitial yield plus 10 basis points (price ). The price of a zero-coupon bond is the present value of its face amount. After obtaining the two\nhigher yield\nprices, use the formula in the first exhibit to calculate the approximate modified duration. Be sure to enter the yield change in its decimal form (ie,\n10 basis points = 0.10% = 0.001).\nThe question specifies using a 10-basis point change in the bond's yield. The choice of yield change is somewhat arbitrary. Using too large or too\nsmall a yield change (eg, 100 basis points or 1 basis point) is likely to result in a less useful value for duration. Typically, yield changes of between\n5 and 25 basis points might be used. The calculated value for duration will vary a bit depending on the basis point change being used.\n(Choice B) 9.62 results from calculating the price of the zero-coupon bond at only a 4.40% yield. The difference between the price at a 4.40%\nyield and the initial price is divided by the initial price multiplied by 0.001.\n(Choice C) 10.00 is the Macaulay, not the modified, duration for the 10-year zero-coupon bond.\nThings to remember:\nDetermining a bond's approximate modified duration requires calculating its price twice, once each at a specified yield difference above and below\n× ×\nits initial yield. The difference between those two prices is divided by 2 yield change (in decimal form) initial price.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 163, "q": "An investor with a 10-year investment horizon purchases a noncallable 10-year, 7% annual coupon bond. The bond purchase price is 107.360087 per 100 of par value, with a 6% YTM. The bond's annual modified duration is 7.180. The duration gap at the time of the investment is closest to:", "opts": ["−2.82", "−2.39", "0.00"], "ans": "B", "expl": "Bond investor exposure to reinvestment risk or price risk results from any divergence between intended investment horizon and a bond's\nMacaulay duration. The difference is referred to as a duration gap and calculated as: Macaulay duration minus investment horizon. A positive\nduration gap means the investor has greater exposure to price risk; a negative gap results in greater exposure to reinvestment risk.\nSince the bond's modified duration was provided, the Macaulay duration must be calculated before the duration gap can be determined. Macaulay\nduration is found by multiplying the modified duration by 1 + YTM expressed as a periodic rate. Since the bond in question is an annual coupon\nbond, the periodic rate is the same as the given YTM. Since the duration gap is negative, the investor has exposure to reinvestment risk.\n(Choice A) −2.82 results from subtracting the investment horizon from the bond's modified duration rather than its Macaulay duration.\n(Choice C) 0.00 would be the correct answer if the investor had purchased a zero-coupon bond. Since zeros have a Macaulay duration equal to\ntheir maturity, buying a 10-year zero-coupon bond would result in the investment having a Macaulay duration equal to the investment horizon.\nThings to remember:\nBond investor net exposure to interest rate risk results from divergences between investment horizon and Macaulay duration, which is defined as\nthe duration gap. A duration gap equals Macaulay duration minus investment horizon. Positive gaps mean exposure to price risk; negative gaps\nmean exposure to reinvestment risk.\nDescribe the relationships among a bond’s holding period return, its Macaulay duration, and the investment horizon.", "qhtml": null}, {"n": 164, "q": "An investor buys a newly issued 20-year bond at par. The bond pays a 6% annual coupon. Shortly after purchase, the bond's YTM falls to 5% and stays at that level until the bond is sold at the end of three years. If the reinvestment rate over the period is 5%, the investor's annualized rate of return over the three-year investment horizon is closest to:", "opts": ["8.94%", "9.19%", "10.06%"], "ans": "B", "expl": "The rate of return (or horizon return) is the geometric average annual rate that equates the initial investment with the value accumulated by\nthe end of the holding period (ie, investment horizon). The accumulated value, or total money return, is the sum of:\nprice at which the bond is sold\ncumulative coupon payments\nreinvestment income on any coupons received before the end of the holding period\nThese three components can be computed in two steps. The bond must be priced at a 5% yield three years in the future (when 17 years remain\nuntil maturity). The coupon payments plus reinvestment income are calculated simultaneously by solving for the future value of an annuity.\nThe total money return divided by the initial investment is equal to 1 + the total rate of return. That outcome is annualized by raising it to the power\nof (1/holding period) and subtracting 1 (ie, removing the value of the initial investment).\n(Choice A) 8.94% uses a total money return reflecting only the bond price and the three coupons received over the investment horizon. This\nsolution omits the reinvestment income on the first two coupons.\n(Choice C) 10.06% is the arithmetic (rather than the standard geometric) average annual return. 10.06% is based on the accurate total rate of\nreturn (30.19%) divided by 3, rather than (1 + total rate of return)1/3 – 1.\nThings to remember:\nThe horizon return is the geometric average annual rate that equates the initial investment to the total money return. The total money return is the\nselling price plus coupons received plus reinvestment income on the coupons received before the end of the holding period.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 165, "q": "An investor buys a bond that matures in 22 years. The bond has a 7% coupon rate and pays semiannually. The investor's price was 112.1271 when the bond's YTM was 6%. Before the next coupon date, the bond's YTM rises to 8% and stays at that level until the bond is sold at the end of 6 years. If the reinvestment rate over the period is 8%, the investor's annualized rate of return over the 6-year investment horizon is closest to:", "opts": ["−3.41%", "+2.89%", "+4.22%"], "ans": "C", "expl": "The rate of return (ie, horizon yield) is the geometric average annual rate that equates the initial investment to the value accumulated by the\nend of the holding period (ie, investment horizon). The accumulated value, or total money return, is the sum of the:\nprice at which the bond is sold\ncumulative coupon payments\nreinvestment income on any coupons received before the end of the holding period\nThose three components can be calculated in two steps. The bond must be priced at an 8% YTM, 6 years in the future when 16 years (ie, 32\ncoupon periods) remain until maturity. The coupon payments plus reinvestment income are calculated simultaneously by solving for the future\nvalue of an annuity.\nThe total money return divided by the initial investment equals 1 + the total rate of return. Annualize that outcome by raising it to the power of (1 /\nholding period), then subtract 1 (removing the value of the initial investment).\nNote: The capital loss (ie, difference between selling price and carrying value) does not have to be determined to calculate the horizon return.\n(Choice A) −3.41% is the annualized return taking account only of the selling price and purchase price, ignoring both coupons and reinvestment\nincome.\n(Choice B) +2.89% uses a total money return reflecting only the bond price and the 12 coupons received over the investment horizon. This\nsolution omits the reinvestment income on the first 11 coupons.\nThings to remember:\nThe horizon return is the geometric average annual rate that equates the total money return to the initial investment. The total money return is the\nselling price plus coupons received plus reinvestment income on the coupons received before the end of the holding period.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 166, "q": "If the bond is priced with a 10.2% YTM, the bond's annual Macaulay duration is closest to:", "opts": ["7.1", "7.6", "15.2"], "ans": "B", "expl": "Macaulay duration is a type of yield duration that measures the sensitivity of a bond's full price to changes in its own YTM. The Macaulay duration\nis the weighted average time to receipt of the bond's payments. The weights are the portions of the bond's full price that correspond to each of the\nfuture payments. Macaulay duration can also be thought of as the average time to receipt of the bond's payments that will result in realization of\nthe bond's initial, stated YTM.\nIn this scenario:\nt/T = 0/T = 0 since the bond settles on its July 11, 2023 coupon payment date\nYTM is 10.2% and YTM per period is r = (0.102 / 2) = 0.051\nCoupon per period is c = (0.07 / 2) = 0.035\nN = 23 = (11.5 years × 2 semiannual periods per year)\nSubstitute these values into the formula to calculate the bond's Macaulay duration per period:\nThe result of this calculation is the bond's Macaulay duration per period. Dividing by the number of periods per year results in the bond's annual\nMacaulay duration: 15.18 ÷ 2 = 7.59.\n(Choice A) 7.1 is the result of incorrectly interpreting the fact that the bond's settlement is on the coupon payment date to mean that t = T, so that\nt/T = 1. The correct value of t/T in this question is 0/T = 0.\n(Choice C) 15.2 is the result of failing to convert Macaulay duration per period into annual Macaulay duration.\nThings to remember:\nMacaulay duration is a type of yield duration, a measure of sensitivity of a bond's full price to changes in its own YTM. The Macaulay duration is\nthe weighted average time to receipt of the bond's payments.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 167, "q": "A bond matures in 3 years and pays a 7% annual coupon. The bond is currently trading at 104.0469 per 100 par value with a 5.50% yield-to- maturity. The Macaulay duration of the bond is closest to:", "opts": ["2.64", "2.81", "2.93"], "ans": "B", "expl": "The Macaulay duration is a function of maturity, coupon, and yield. It is the weighted average time until the coupons and principal are due.\nThe timing of each payment is weighted by its present value as a percent of the bond's full price. Another way to calculate the Macaulay duration\nis to use the formula:\n(Choice A) 2.64 results from using only the par value for the final cash flow (ie, failing to include the last coupon).\n(Choice C) 2.93 results from dividing the time weighted present value of the cash flows (the numerator in the calculation) by the par value of 100\nrather than the market price of 104.0469.\nThings to remember:\nThe Macaulay duration is the present value–weighted average time until the coupons and principal are due. Calculate the present value of each\ncash flow and divide each by the bond's price to find the percentage of the total price each represents (ie, the weight). Multiply the weight of each\ncash flow by the time until it's due and sum the results.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 168, "q": "An investor purchases a bond for a price of 111.62. The bond is a 10-year callable bond with a 7% coupon paid annually. If the bond's benchmark yield curve shifts by 30 basis points and its YTM changes by 25 basis points, the bond's price is expected to be: 110.23 if interest rates rise, or 112.99 if interest rates fall. Based on only this information and using the most appropriate measure of duration, the bond's duration is closest to:", "opts": ["4.12", "4.95", "−19.91"], "ans": "A", "expl": "A bond's interest rate risk is measured by duration and convexity. Together, these two measurements are used to estimate the change in a bond's\nprice due to a given change in interest rates. Interest rate changes can be represented as changes in the bond's yield-to-maturity or shifts in a\nbenchmark yield curve.\nAn embedded call option creates uncertainty in a bond's cash flows and, therefore in its YTM, since the bond may be called (ie, redeemed) before\nmaturity. Thus, for a callable bond, it makes sense to estimate price changes based on a shift in the benchmark yield curve instead of the\nYTM.\nApproximate modified duration and convexity measure changes in a bond's price based on changes in its YTM.\nEffective duration and convexity measure changes in a bond's price based on shifts in its benchmark yield curve.\nIn this scenario, since the bond is callable, interest rate changes are represented by a shift in the benchmark yield curve, and therefore effective\nduration is appropriate. Substitute the bond price and benchmark rate change data into the formula to calculate effective duration:\n(Choice B) 4.95 is the approximate modified duration of the bond. Approximate modified duration is not appropriate for use with callable bonds.\n(Choice C) −19.91 is the effective convexity of the bond based on the given data, not the effective duration.\nThings to remember:\nA bond's interest rate risk can be measured by viewing price changes as a function of changes in the bond's yield-to-maturity or of shifts in a\nbenchmark yield curve. For a bond with an embedded option, price changes should be based on shifts in a benchmark yield curve and measured\nusing effective duration.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 169, "q": "An investor purchases a bond with 5 years until maturity, a 4% annual coupon payment, and a YTM of 4.25%. The investor holds the bond until maturity. After purchase and before the first coupon, if the YTM for similar bonds increases to 4.5% due to a rise in interest rates and remains at that level for the life of the bond, then the value of the investor's reinvested coupons at maturity is closest to:", "opts": ["21.67", "21.77", "21.88"], "ans": "C", "expl": "Assuming no default, sources of return for a bond investor include:\ncoupon and principal payments received on the dates agreed upon in the contract;\ninterest on reinvestment (ie, interest on interest) of coupons between the time each one is received and the end of the bond's holding\nperiod; and\ncapital losses or gains from any sale of the bond prior to maturity.\nOne assumption made in calculating the YTM is that the bond's coupon payments are reinvested at the YTM rate. However, that may not be\npossible if interest rates change, which often happens (ie, interest rate risk). If so, the investor's rate of return will likely not be equal to the bond's\ninitial YTM.\nA change in the YTM for similar bonds affects the rate at which the coupons can be reinvested. In this scenario, interest rates rise, which\nincreases the reinvestment rate. The future value of the reinvested coupons is calculated as follows:\nSince interest rates have risen, the investor's reinvested coupons are worth $21.88 at maturity.\n(Choice A) $21.67 is the value of the reinvested coupon if one incorrectly assumes that the coupons are reinvested at the coupon rate of 4%.\n(Choice B) $21.77 results from assuming that the coupons are reinvested at the bond's YTM rate at purchase (ie, 4.25%).\nThings to remember:\nSources of return for a bond investor include coupon and principal payments received, interest on coupon reinvestment, and capital losses or\ngains from any sale in the market prior to maturity. A change in the YTM for similar bonds affects the reinvestment rate and, thus, the value of the\nreinvested coupons at maturity.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 170, "q": "An investor buys a bond at a price below 100% of par value. The investor later sells the bond prior to maturity. The gain or loss on sale will most likely be the difference between the sale price and the:", "opts": ["original purchase price.", "carrying value based on straight-line amortization of the original discount.", "carrying value based on the YTM at purchase and the time remaining to maturity."], "ans": "C", "expl": "The capital gain or loss on a bond is usually not the difference between the purchase and sale price. The gain or loss is the difference between\nthe selling price and the bond's carrying value. If the purchase price is any value other than 100% of par value, the carrying value changes\nover time.\nFor bonds purchased at a price above or below 100% of par value, the premium or discount must be amortized over the time-to-maturity. The\nschedule of carrying values (ie, present values) is a trajectory of prices at which the bond would trade if its YTM were constant over the time to\nmaturity.\nThere cannot be a capital gain or loss on a bond held to maturity as the original purchase price adjusted for cumulative amortization converges\nwith par value (ie, pull to par). For bonds sold prior to maturity, the carrying value is determined by using the YTM at which the bond was trading\nwhen purchased to discount the coupons and principal over the remaining time to maturity when the sale occurred.\nThings to remember:\nCapital gain or loss on bonds is based on selling price minus carrying value, not the original purchase price. Any discount or premium at purchase\nis amortized. There is no capital gain or loss on bonds held- to-maturity. For bonds sold prior to maturity, the carrying value is determined by\ndiscounting the coupons and principal over the remaining time-to-maturity by the YTM at purchase.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 171, "q": "A manager is concerned with identifying a noncallable coupon bond that minimizes the risk of funding a future liability. Which type of duration is most appropriate for this manager to use?", "opts": ["Key rate duration", "Modified duration", "Macaulay duration"], "ans": "C", "expl": "Noncallable coupon bonds contain two types of interest rate risk: price risk and reinvestment risk. Interest rate changes have opposite effects on\nthese two risks and on the components of bond returns. Interest rate changes are:\ninversely related to price since higher (lower) rates cause bond prices to decrease (increase), and\ndirectly related to reinvestment income since higher (lower) rates cause reinvestment income to increase (decrease).\nMacaulay duration is the holding period (ie, investment horizon) over which a bond's price change is equal to a change in reinvestment income,\nallowing those changes to offset each other. Holding the bond over that period will balance reinvestment risk and price risk and minimize total\nrisk. Therefore, the return on a bond held over its Macaulay duration is equal to the bond's market discount rate (ie, YTM) when it was\npurchased. Buying a bond with a Macaulay duration equal to the time until a liability is due minimizes the risk that the bond's issuer will be unable\nto fund that liability.\n(Choice A) Key rate duration measures the effect on bond prices of a change in one (or more) specific-term interest rate(s).\n(Choice B) Modified duration measures a bond's approximate percentage price change due to a 100-basis-point change in its YTM, ignoring the\nimpact of convexity.\nThings to remember:\nMacaulay duration is the holding period (ie, investment horizon) over which a bond's price change equals a change in reinvestment income. A\nbond held over its Macaulay duration earns a return equal to the YTM when the bond was purchased. Buying a bond with a Macaulay duration\nequal to the time until a liability is due minimizes the risk that the bond's issuer will be unable to fund that liability.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 172, "q": "An investor buys a 20-year bond at par value. The bond pays a 4% semiannual coupon and has an approximate modified duration of 13.68. The investor sells the bond one year later after interest rates have risen by 100 basis points. Which of the following sources most likely accounts for the largest portion of the investor's holding period return?", "opts": ["Coupon income", "Capital gain or loss", "Interest on interest income"], "ans": "B", "expl": "The largest component of short time horizon (eg, quarterly or annual) returns on long-maturity bonds is usually capital gains or losses driven by\nchanges in their yields-to-maturity. Long-maturity bonds have long durations, so their prices are highly sensitive to changes in interest rates.\nUnless interest rate changes are very small (eg, 20 basis points), capital gains or losses are the largest portion of return.\nInterest on interest (ie, reinvestment of coupon) income is relatively insignificant over short time horizons. Reinvestment income is earned only on\ncash flows received during the holding period, and then only for the remainder of the period. In this scenario, the first coupon earns reinvestment\nincome over the second half of the year. Even at high reinvestment rates, reinvestment income is a small fraction of coupon income (Choice C).\nDuration is a measure of a bond's price sensitivity to a change in its yield-to-maturity. Due to this bond's long approximate duration (13.68%), the\nyield increase of 100 basis points (1%) would result in a capital loss of about three times the coupon income (4%). The estimated price decline is\nshown in the bottom row of the table (Choice A).\nNaturally, outcomes depend on specific circumstances. Coupon rates vary from 0% to over 10%. Some securities (eg, US mortgage-backed) pay\nprincipal and interest monthly, allowing for a bigger contribution from reinvestment income. Nonetheless, in all but the most stable interest rate\nenvironments, price changes are likely to be the largest contributor to return for long-dated bonds over short horizons.\nThings to remember:\nThe largest component of period returns on long-maturity bonds is usually capital gains or losses. Long-maturity bonds have long durations, so\ntheir prices are very sensitive to interest rate changes. A large rate change results in price gains or losses that exceed the coupon income, which\nin turn is greater than the reinvestment income.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 173, "q": "An investor buys a previously issued bond that has 12 years remaining to maturity at a price of 92.4639 per 100 par value. The bond has an 8.0% YTM and pays a 7.0% annual coupon. Two years later the bond is sold for 96.5680 at a YTM of 7.5%. The carrying value used to determine the capital gain is closest to:", "opts": ["93.2048", "93.2899", "93.7199"], "ans": "B", "expl": "The capital gain or loss on a bond is usually not the difference between the purchase and sale price. The gain or loss is the difference between\nthe selling price and the bond's carrying value. If the purchase price is at any value other than 100% of par value, the carrying value will\nchange over time.\nFor bonds purchased at a price above or below 100% of par, the premium or discount must be amortized over the time to maturity. This process\nresults in carrying value at maturity equal to 100% of par. Thus, for bonds held to maturity, there will never be a capital gain or loss.\nFor bonds sold prior to maturity, the carrying value is based on the YTM at the bond's purchase. The carrying value is determined by using the\nYTM at the bond's purchase to discount the coupons and principal over the remaining time to maturity.\n(Choice A) 93.2048 would be the carrying value if the bond paid coupons semiannually.\n(Choice C) 93.7199 is the result of using straight-line amortization of the discount rather than the constant yield method.\nThings to remember:\nCapital gain or loss on bonds is based on carrying value, not the original purchase price. Purchase at any price other than 100% of par requires\nthe premium or discount to be amortized. There is no capital gain or loss on bonds held until maturity. For bonds sold prior to maturity, the\ncarrying value is determined by using the purchase YTM to discount the coupons and principal over the remaining time-to-maturity.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 174, "q": "An investor purchases a 20-year 6% annual coupon bond at 100% of par value. 10 years later the bond has a YTM of 10% and is trading at 75.42 per 100 of par value. Assuming a reinvestment rate of 10% since purchase, the largest effect on the bond's holding period rate of return is most likely the:", "opts": ["capital loss.", "coupon income.", "reinvestment income."], "ans": "B", "expl": "There are three sources of return on coupon-bearing fixed-income securities:\nCoupon income: annual coupon payments over the holding period\nCapital gain or loss: difference between purchase price and current market value or sale price\nReinvestment income: interest earned from reinvesting the coupons received over the holding period\nIn this scenario, the coupon income over the holding period provides the greatest source of return (Choices A and C).\nThe source that has the largest impact on rate of return depends on the specific circumstances. Capital gain or loss, typically the largest factor in\nthe short run, results from change in a bond's YTM and, therefore, its price. Coupon income accrues at a constant rate over time and often\nexceeds the price change in the long run.\nReinvestment income is not earned until after the receipt of the first coupon and therefore has a negligible impact in the short run. However, due\nto compounding, reinvestment income can be the biggest factor in the long run if the reinvestment rate and coupon income are high enough.\nIt should be noted that reinvestment income is most efficiently calculated indirectly by calculating the future value of the coupons then subtracting\nthe coupon income. The calculation is illustrated using the formula for the future value of an ordinary annuity but is best solved using the time\nvalue of money functions on a calculator.\nThings to remember:\nThere are three sources of total money return on coupon bonds: coupon income, capital gain or loss, and reinvestment income on the coupons\nreceived during the holding period. The proportion of return from each source depends on price change, length of holding period, coupon rate,\nand reinvestment rate.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 175, "q": "A 20-year zero-coupon bond has a YTM of 4%. Assuming semi-annual compounding, its modified duration is closest to:", "opts": ["19.23", "19.61", "20.00"], "ans": "B", "expl": "Macaulay duration is the weighted average time (in years) to receive all the future expected cash flows from a bond. Macaulay duration allows\ninvestors to compare their exposure to reinvestment risk and price risk. Modified duration, derived from Macaulay duration, measures the\nsensitivity of bond prices to changes in interest rates and is widely used to assess the interest rate risk of bonds.\nFor a zero-coupon bond, the Macaulay duration is simply the bond's maturity since it has only one cash flow: the principal repayment at maturity,\nin this case at the end of Year 20. Since the Macaulay duration (20) is known, modified duration can be calculated as:\nThe denominator is the periodicity yield, the YTM divided by the coupon periodicity, which is semi-annual (ie, 2) in this instance. While it is very\nlikely on the exam that the question will state a periodicity, the standard convention for most zero-coupon bonds is to assume semi-annual\ncoupons with a periodicity of 2. Doing so allows a direct yield comparison to the vast majority of government and corporate coupon bonds, which\npay semi-annually.\n(Choice A) 19.23 results from not accounting for the semiannual coupon convention.\n(Choice C) 20.00 is the bond's Macaulay duration.\nThings to remember:\nMacaulay duration is the weighted average time (in years) it takes to receive all the future expected cash flows from a bond. For a zero-coupon\nbond, the Macaulay duration is simply the bond's maturity since it has only one cash flow. Modified duration, which is derived from Macaulay\nduration, can be calculated as Macaulay duration divided by one plus the periodicity yield.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 176, "q": "An investor with a 2-year investment horizon buys a 10-year government bond that pays a 3% annual coupon. The resulting mismatch between the 10-year bond's duration and the investment horizon results in the investor having the greatest exposure to: ", "opts": ["price risk.", "liquidity risk.", "reinvestment risk."], "ans": "A", "expl": "A mismatch between an investor's holding period (or investment horizon) and a bond's Macaulay duration results in exposure to two types of\ninterest rate risk: price risk and reinvestment risk. An investment horizon that is longer than the Macaulay duration results in exposure to\nreinvestment risk. An investment horizon shorter than the Macaulay duration creates price risk.\nA 10-year coupon bond will have a Macaulay duration of less than 10 years, but significantly longer than 2 years. At the end of the investment\nhorizon, the bond will still have 8 years until its maturity. If the bond's YTM has increased or decreased by even a relatively modest amount (eg,\n0.50%), the price change will be much greater than the reinvestment income on 2 years of coupon income.\nThe duration mismatch can work to the investor's advantage. If yields decline, the investor's 2-year horizon return will be greater than the bond's\nYTM at purchase. However, the mismatch becomes a disadvantage for the investor if yields rise since the price decrease will exceed the\nadditional reinvestment income.\n(Choice B) Liquidity risk refers to the ability to convert an investment into cash at a price close to the bond's fair value. The investment would not\ncreate significant exposure to liquidity risk since government bonds are typically more liquid than other fixed income securities.\n(Choice C) Investors have exposure to reinvestment risk when their investment horizons are longer than the Macaulay durations of their bond\nholdings.\nThings to remember:\nMismatches between an investment horizon and a Macaulay duration result in exposure to interest rate risk. An investment horizon longer than\nthe Macaulay duration results in exposure to reinvestment risk. An investment horizon shorter than the Macaulay duration creates price risk.\nDescribe the relationships among a bond’s holding period return, its Macaulay duration, and the investment horizon.", "qhtml": null}, {"n": 177, "q": "A noncallable bond that pays a 6% annual coupon has exactly 4 years until maturity. The bond is priced at 98.2871 per 100 par value and has a 6.50% YTM. Assuming a 10–basis point change in YTM, the bond's approximate modified duration is closest to: ", "opts": ["3.45", "3.50", "6.89"], "ans": "A", "expl": "The solution requires determining the price of the bond twice: at the initial yield minus 10 basis points (price ) and at the initial yield plus\nlower yield\n10 basis points (price ). After obtaining the two prices, use the formula in the exhibit to calculate the approximate modified duration. Be\nhigher yield\nsure to enter the yield change in its decimal form (ie, 10 basis points = 0.10% = 0.001).\nThe question specifies using a 10–basis point change in the bond's yield. The choice of yield change is somewhat arbitrary. The calculated value\nfor duration will vary somewhat depending on the basis point change used.\n(Choice B) 3.50 results from calculating the approximate duration as if the bond paid coupons semiannually instead of annually.\n(Choice C) 6.89 results from failing to include 2 in the denominator of the calculation.\nThings to remember:\nDetermining a bond's approximate modified duration requires calculating its price twice: once at a specified yield difference above its initial yield\n× ×\nand once below. The difference between those two prices is divided by 2 yield change (in decimal form) initial price.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 178, "q": "A callable bond's coupon rate is 100 basis points (bps) below yields-to-maturity on noncallable bonds having the same time to maturity and credit risk. If market yields decline by 200 bps, the callable bond's effective duration most likely: ", "opts": ["decreases.", "remains unchanged.", "increases."], "ans": "A", "expl": "Duration measures bond price sensitivity to changes in interest rates. Graphically, duration is the slope of the price/yield function. The effective\nduration of a callable bond decreases as market interest rates decline below its coupon rate. Callable and noncallable bond prices behave\nsimilarly when interest rates rise (purple curve segment), but their prices and durations diverge significantly as yields fall below bond coupon rates.\nA callable bond has an embedded option giving the issuer the right to purchase (ie, call) the bond prior to maturity. The further market rates drop\nbelow a bond's coupon, the greater the likelihood it will be called. As a result, no matter how low rates fall, the potential appreciation of a callable\nbond is limited. That is reflected by the flattening slope (ie, decreasing duration) of the red segment of the callable bond price/yield curve.\nThings to remember:\nAs market yields decrease from higher levels to below a callable bond's coupon rate, the effective duration of the bond decreases. The more rates\ndecline, the less sensitive callable bond prices are to interest rate changes.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 179, "q": "A corporation buys a 5-year default-risk-free government bond to fund a lump-sum liability due in five years. The bond is noncallable and pays coupons semiannually. Which of the following types of risk does the corporation most likely have the greatest exposure to?", "opts": ["Inflation risk", "Market price risk", "Reinvestment risk"], "ans": "C", "expl": "Macaulay duration is the weighted average time until receipt of the coupon and principal payments. The investment application of that insight is\nthat a bond's Macaulay duration is the holding period (investment horizon) over which changes in price and in reinvestment income exactly offset\none another. Thus, for holding periods equal to Macaulay duration, an investor's return is the YTM at which the bond was purchased.\nInvestment horizons shorter than Macaulay duration result in exposure to price risk. Investment horizons longer than Macaulay duration result\nin exposure to reinvestment risk.\nFor coupon bonds, the Macaulay duration is always shorter than the bond's maturity. Since a liability due in five years is being funded with a\nbond that has a duration of less than five years, the corporation has exposure to reinvestment risk.\n(Choice A) Since the bond matures when the liability comes due, inflation will impact both equally, so the corporation has no exposure to inflation\nrisk.\n(Choice B) Market price risk results from changes in credit quality and market yields. Buying a default risk-free security removes credit quality\nconcerns. Owning a security that matures at the time the liability comes due eliminates interest rate–related price risk. No matter how much\ninterest rates change over five years, the bond will be worth its par value at that time.\nThings to remember:\nIf an investor's horizon return equals the bond's Macaulay duration, the bond's reinvestment risk will equal its price risk. An investment horizon\nshorter than a bond's Macaulay duration results in exposure to greater price risk. An investment horizon longer than a bond's Macaulay duration\nresults in exposure to greater reinvestment risk.\nDescribe the relationships among a bond’s holding period return, its Macaulay duration, and the investment horizon.", "qhtml": null}, {"n": 180, "q": "An investor buys a bond for 115.443470 per 100 par value. The bond has 10 years left until maturity, a 5% YTM, and a 7% annual coupon. Four years later, the bond is sold for 112.894681 at a YTM of 4.5%. The capital gain or loss is closest to a:", "opts": ["2.5488 loss.", "2.7433 gain.", "3.6286 gain."], "ans": "B", "expl": "The capital gain or loss on a bond trade is the difference between the selling price and the bond's carrying value, not the purchase price.\nFor bonds sold prior to maturity, the carrying value is the present value of the remaining cash flows, using the YTM at purchase, not the current\nYTM, to discount those remaining cash flows.\nSince they must converge with par value by maturity, the carrying values for bonds purchased at a premium decline over time. Although the bond\nin this instance sold for less than its purchase price, its sale price was higher than its carrying value, so there is a capital gain.\n(Choice A) A 2.5488 loss is the result of using the original purchase price rather than the carrying value.\n(Choice C) A 3.6286 gain results from using straight-line amortization of the purchase premium to determine the carrying value.\nThings to remember:\nThe capital gain or loss on bonds is based on the selling price versus the carrying value, not the original purchase price. The carrying value for\nbonds sold prior to maturity is determined by discounting the remaining cash flows by the YTM at the time of purchase, not the current YTM.\nSince any discount or premium at purchase is amortized, there is no capital gain or loss on bonds held until maturity.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 181, "q": "An investor buys a bond that matures in exactly 20 years. The bond pays a 6% annual coupon, is trading at an 8% YTM, and is priced at 80.3637 per 100 par value. Assuming a constant reinvestment rate of 8%, if the bond is held until maturity which of the following sources most likely contributes the largest portion of the investor's total return?", "opts": ["Coupon payments", "Principal repayment", "Reinvestment income"], "ans": "C", "expl": "Total money returns on most fixed income securities come from three sources:\nProceeds on disposition (price received for secondary market sale or par value at maturity)\nTotal coupon payments received during holding period\nReinvestment income on cash flows received before the end of the holding period\nFor bonds held to maturity, three variables impact their relative contributions: time to maturity, coupon rate, and the interest rate at which coupon\npayments are reinvested.\nPar (principal or face) value is known. At maturity, the investor will receive the full par value, 100. The coupon contribution to total money return\n× ×\nis: 0.06 100 20 = 120 (Choices A and B).\nThe reinvestment income is the future value of the coupons (ie, coupons plus reinvestment income) less the coupon payments. Use time value of\nmoney functions on the calculator to compute reinvestment income:\nFor short- and intermediate-terms bonds, principal will be the largest component of total money return to maturity. As time to maturity lengthens,\nboth the cumulative coupon payments and the amount of reinvestment income increase. For bonds with long enough maturities, the largest\nsource of return depends on bond contract terms and reinvestment rate and must be determined by computing the money amount of each\nsource.\nThings to remember:\nThere are three sources of total money return on coupon bonds held-to-maturity: total coupon payments, reinvestment income on the coupons\nreceived prior to maturity, and the par value. The proportion of return from each source depends on coupon rate, reinvestment rate, and time-to-\nmaturity.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 182, "q": "An analyst has collected information on three bonds, each of which matures in 10 years and uses an annual compounding convention: Which of the bonds most likely has the shortest Macaulay duration? ", "opts": ["Bond A", "Bond B", "Bond C"], "ans": "A", "expl": "Macaulay duration is a function of maturity, coupon, and yield. It is the weighted average time until the coupons and principal are due. Each\npayment is weighted by its present value as a percentage of the bond's full price.\nMacaulay duration is positively related to maturity: the longer the maturity, the longer the average time to a bond's cash flows. Duration is\ninversely related to coupon rate and yield. The higher the coupon, the shorter the average time until receipt of all cash flows. Higher yields\nreduce present values, and that impact increases with time due to compounding over more periods, shortening the weighted average time.\nAn illustration of the Macaulay duration for each bond is shown below. The bonds' cash flows can be envisioned as being stacked on a weightless\nbalance beam whose length equals the time to maturity. The present value weighted average time is where a fulcrum would have to be located so\nthat the balance beam would not tilt left or right. That balance point (location of the fulcrum) is the bonds' Macaulay duration.\nSince all the bonds have the same maturity and are trading at the same yield, the highest coupon bond has the shortest Macaulay duration\n(Choices B and C).\nThings to remember:\nMacaulay duration is the weighted average time until the coupon and principal payments are due. It is positively related to maturity (ie, longer\nmaturity = greater duration) and inversely related to coupon rate and yield (ie, higher coupon or yield = shorter duration).\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 183, "q": "A noncallable bond's approximate duration is closest to its effective duration when:", "opts": ["it has a long time to maturity.", "its benchmark curve is relatively flat.", "it is priced at a significant premium to its par value."], "ans": "B", "expl": "Duration measures a bond's price sensitivity to changes in interest rates. Approximate duration (ie, approximate modified duration)\nmeasures price sensitivity with respect to changes in a bond's YTM. Effective duration measures price sensitivity based on an identical change\nin all rates of a benchmark curve. Effective duration is typically used for callable bonds, but it can also be used for noncallable bonds.\nAlthough the formulas for approximate and effective duration are similar, they often produce different results. For an upward-sloped benchmark\ncurve, changing each yield by the same amount causes the corresponding spot rate to change by more than the benchmark yield. The price\nobtained by discounting the bond's cash flows by the appropriate spot rates is different than the price obtained by changing the YTM, even if the\nYTM and the benchmark curve are shifted by the same amount.\nApproximate duration and effective duration are identical only when the benchmark curve is completely flat, which rarely occurs. Approximate\nduration is closest to effective duration when:\nthe bond's price is close to par,\nthe bond has a short maturity, and/or\nthe benchmark curve is relatively flat.\n(Choice A) When a bond's maturity is shorter, there are fewer cash flows to discount, so the difference in prices from using spot rates versus\nYTM will be less than for a bond with a longer time to maturity. The smaller price differences result in the approximate duration being closer than\nthe effective duration.\n(Choice C) When a bond's price is closer to par, it implies a smaller difference between the YTM and the spot rates constructed from a\nbenchmark curve. The smaller difference indicates it is likely that the curve is flatter, so the effective duration is closer to the approximate duration.\nThings to remember:\nThe formulas for calculating approximate duration and effective duration are similar but often produce different results. The two duration measures\nfor a noncallable bond are likely to be closest when the bond is priced close to par, has a short maturity, and/or the benchmark yield curve is\nrelatively flat.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 184, "q": "Investor X and Investor Y purchase identical bonds with 3 years until maturity, a YTM of 8.88%, an annual coupon of 6%, and a price of 92.7. After purchase and before the first coupon, the YTM for the bonds drops to 7.9% and remains at that level for the life of the bonds. Investor X's time horizon is 2 years, and Investor Y's time horizon is 3 years. Investor X's annual rate of return on investment is most likely:", "opts": ["less than Investor Y's rate of return.", "equal to Investor Y's rate of return.", "greater than Investor Y's rate of return."], "ans": "C", "expl": "A bond investor's rate of return is equal to the bond's YTM if:\nthe issuer does not default,\nthe bond is held until maturity, and\nthe coupons are reinvested at the initial YTM.\nIn this scenario, since the YTM on the identical bonds changes and the investors have different time horizons, the rates of return differ. A bond's\nannual rate of return is its annualized holding period return based on the sum of its reinvested coupons and its sale price:\nA change in YTM affects both the coupon reinvestment rate and the price of the bond prior to maturity. In this scenario, interest rates fall,\nnegatively impacting the rate at which coupons can be reinvested. This disproportionately disadvantages Investor Y, who has a longer holding\nperiod (3 years) and redeems at par; therefore, Investor Y depends more on the coupon reinvestment portion of the return. Investor Y's rate of\nreturn (8.82%) is less than the bond's initial YTM (8.88%).\nInvestor X, who sells the bond before maturity and therefore has a shorter holding period, is more affected by the bond's price than the rate of\ncoupon reinvestment. Since interest rates decrease, the bond's price rises; therefore, Investor X is positively impacted. Investor X's rate of return\n(9.28%) is greater than the bond's initial YTM (8.88%).\nInvestor X's rate of return is about 0.46% (9.28% − 8.82%) greater than Investor Y's rate of return (Choices A and B). The effect of a change\nin interest rates on bond prices and coupon reinvestments is summarized in a table.\nThings to remember:\nA change in YTM affects both the coupon reinvestment rate and the price of the bond prior to maturity. Changes in the coupon reinvestment rate\nimpact long-term investors more, and changes in the bond price impact short-term investors more.\nCalculate and interpret the sources of return from investing in a fixed-rate bond", "qhtml": null}, {"n": 185, "q": "The modified duration of a fixed-rate coupon bond with no embedded options most likely quantifies the:", "opts": ["sensitivity of the bond's price to a change in its YTM.", "weighted average time to receipt of the bond's cash flows.", "expected standard deviation of returns over the life of the bond."], "ans": "A", "expl": "Modified duration quantifies the sensitivity of a bond's price to a change in its yield. Therefore, modified duration can be used to estimate a\nbond's percentage price change using the formula in the exhibit. The calculated percentage price change is only an approximation. Errors in\nestimates of price change arise as a result of the curvilinear relationship between price and yield (green function); duration assumes a linear\nrelationship.\nDuration, the slope of the blue tangent line, measures the sensitivity of price to yield changes at current market values, allowing the use of\nduration as a measure of risk. Duration's primary application is quantifying the sensitivity of bond prices and the value of bond portfolios to interest\nrate changes.\nConsider the consequence for two bonds with different durations. For equal declines in their YTM, the bond with the longer duration would have a\nlarger percentage price increase. If their yields rose by the same number of basis points, the longer-duration bond would have a larger\npercentage price decrease.\n(Choice B) Macaulay duration is usually interpreted as a measure of a bond's life. It is the present value–weighted average time until the receipt\nof a bond's remaining contractual cash flows.\n(Choice C) Duration is sometimes mistakenly believed to quantify bond price volatility. Volatility quantifies dispersion of outcomes (eg, returns).\nDuration quantifies sensitivity, not volatility.\nThings to remember:\nModified duration quantifies the sensitivity of a bond's price to a change in its YTM. The longer a bond's duration, the more sensitive its price to\nchanges in the YTM, and vice versa.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 186, "q": "A 20-year 8% semiannual pay coupon bond is trading at a 7% yield-to-maturity. It has an annual Macaulay duration of 10.76. The bond's annual modified duration is closest to:", "opts": ["10.06", "10.35", "10.40"], "ans": "C", "expl": "A bond's modified duration is calculated by modifying the Macaulay duration, specifically by dividing the Macaulay duration by one plus the\nYTM expressed as a periodic rate. Both Macaulay and modified durations measure aspects of interest rate risk.\nMacaulay duration is the weighted average time until the receipt of coupon and principal payments. This measure allows investors to assess their\nrelative exposure to reinvestment risk versus price risk. Modified duration measures the sensitivity of bond prices to changes in interest rates. It is\nwidely used to assess the interest rate risk of bonds and is employed in quantifying and managing the risk of bond portfolios relative to their\nbenchmark indexes.\n(Choice A) 10.06 results from dividing the Macaulay duration by one plus the YTM. The proper calculation requires using the YTM, but it needs\nto be adjusted for the compounding frequency so that it is expressed as a periodic discount rate.\n(Choice B) 10.35 results from dividing the Macaulay duration by one plus the periodic coupon rate rather than one plus the periodic discount rate.\nThings to remember:\nModified duration is calculated by dividing the Macaulay duration by one plus the YTM expressed as a periodic rate. Modified duration measures\nthe sensitivity of bond prices to changes in interest rates, which enables it to be used to measure the interest rate risk of bonds and bond\nportfolios.\nDefine, calculate, and interpret Macaulay duration.", "qhtml": null}, {"n": 187, "q": "An analyst obtains the following information on a three-bond portfolio: All are fixed-rate bonds paying annual coupons, and there is no accrued interest. If the YTM on each bond increases by 10 basis points, which bond's price change is most likely to have the greatest impact on the portfolio value?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "A bond's money duration is its annual modified duration multiplied by the bond's full price. In this calculation, the full price is the bond's\nmarket value, as none of the bonds have any accrued interest. Money duration is a measure of a bond's price sensitivity to a change in its YTM\nexpressed in the currency units of the bond's denomination.\nUnlike other measures of price sensitivity (ie, modified and effective durations that estimate percentage price change, money duration estimates\nthe total change in value. Since it is weighted by the size of the position, money duration more effectively measures the impact individual bond\npositions have on portfolio risk.\n(Choice A) Bond X is the largest position by value invested but it has a much shorter duration than the other bonds.\n(Choice C) Bond Z has the longest duration of the three bonds but has a much smaller weight in the portfolio than either of the other two\nsecurities.\nThings to remember:\nMoney duration is annual modified duration multiplied by a bond's full price. Unlike modified or effective duration, money duration factors in the\nsize of the position. Consequently, money duration is a better measure of the impact of individual bond positions on overall portfolio risk.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 188, "q": "An analyst gathers the following information about three bonds: As measured by price value of a basis point, which bond is most sensitive to changes in its YTM?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "C", "expl": "The price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes given a change of 1\nbasis point in its yield-to-maturity. A basis point is 1/100th of a percentage point, or 0.0001. The PVBP of a bond is also called the bond's\nPV01 or DV01, meaning \"price value\" or \"dollar value\" of a 1-basis-point change.\nIn this scenario, Bond Z's YTM (6.2%), annual coupon (5%), and time-to-maturity (11 years) are given. A 1-basis-point increase in Bond Z's YTM\nresults in a new YTM of 6.21%, and a 1-basis-point decrease results in a new YTM of 6.19%. PV and PV are calculated for Bond Z as follows:\n+ −\nFor Bond Y, PV and PV are given. Substitute to calculate Bond Y's PVBP:\n− +\nTherefore, Bond Z has the greatest yield duration based on its price value of a basis point compared to Bond X and Bond Y (Choices A and B).\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes given a 1-basis-point\nchange in its YTM. PVBP can be calculated as [(PV − PV )/2] or alternatively as (approximate modified duration × bond's initial value × 0.0001).\n− +\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 189, "q": "An analyst obtains the following information about a bond with no embedded options: Effective duration 13.0 years Price value of a basis point 0.12 Price if YTM decreases by 1 basis point 94.17 If the bond's YTM increases by 1 basis point, the best estimate of the bond's price is closest to:", "opts": ["92.31", "93.93", "94.41"], "ans": "B", "expl": "The price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes in currency given a 1-\nbasis-point change in its YTM. A basis point is 1/100 of a percentage point, or 0.0001. The PVBP of a bond is also known as the bond's PV01\n(price value) or DV01 (dollar value) of a 1-basis-point change.\nThe PVBP can be calculated as (PV − PV ) / 2 or, alternatively, as the product of approximate modified duration, the bond's initial value (PV ),\n− + 0\nand 1 basis point (0.0001). The reason these two calculations yield the same result is shown here.\nIn this scenario, since the PVBP and price of the bond for a YTM increase are given, substitute each to calculate the price for a 1-basis-point\nincrease in YTM as follows:\n(Choice A) 92.31 is the result of calculating the initial price of the bond using the relationship PVBP = ApproxModDur × PV × 0.0001 and using\n0\neffective duration instead of the approximate modified duration. Also, this question asks for the price when the bond's YTM increases, not its initial\nprice.\n(Choice C) 94.41 is the result of incorrectly substituting 94.17 for PV and then solving for PV . The price of the bond when the yield decreases,\n+ +\nnot increases, is 94.17.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes given a change in its\nYTM of 1 basis point. PVBP can be calculated as (PV − PV ) / 2 or, alternatively, as (Approximate modified duration × Bond's initial value ×\n− +\n0.0001).\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).\n4.A bond's current price is 97.15, its approximate modified duration is 12.3, and its approximate convexity is 36.2. The bond's price value of a\nbasis point (in $) is closest to:\n\nA. 0.12\nB. 0.35\nC. 4.33\nExplanation\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency) given a\nchange of 1 basis point in its yield-to-maturity. A basis point is 1/100th of a percentage point, or 0.0001. The PVBP of a bond is also known as\nthe bond's PV01 or DV01, meaning \"price value\" or \"dollar value\" of a 1-basis-point change.\nThe PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product of approximate modified duration, the bond's current value,\n− +\nand 1 basis point (0.0001). The reason these two calculations yield the same result is shown here.\nIn this scenario, since the approximate modified duration and the bond's current price are given but the prices of the bond when the yield changes\nare unknown, PVBP can be calculated as:\nThus, the price value of a basis point is $0.12 per $100 par value.\n(Choice B) $0.35 is the result of using the bond's approximate convexity instead of approximate modified duration in the equation above. PVBP\nis a measure of yield duration and therefore does not involve convexity.\n(Choice C) $4.33 is the result of multiplying the current value of the bond by 0.0001 and then multiplying by both approximate modified duration\nand approximate convexity. This overestimates PVBP, which is calculated using only duration.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency), given a\nchange of 1 basis point in its YTM. PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product [(approximate modified duration) ×\n− +\nPV × 0.0001].\n0\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 190, "q": "A bond's current price is 97.15, its approximate modified duration is 12.3, and its approximate convexity is 36.2. The bond's price value of a basis point (in $) is closest to: ", "opts": ["0.12", "0.35", "4.33"], "ans": "A", "expl": "The price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency) given a\nchange of 1 basis point in its yield-to-maturity. A basis point is 1/100th of a percentage point, or 0.0001. The PVBP of a bond is also known as\nthe bond's PV01 or DV01, meaning \"price value\" or \"dollar value\" of a 1-basis-point change.\nThe PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product of approximate modified duration, the bond's current value,\n− +\nand 1 basis point (0.0001). The reason these two calculations yield the same result is shown here.\nIn this scenario, since the approximate modified duration and the bond's current price are given but the prices of the bond when the yield changes\nare unknown, PVBP can be calculated as:\nThus, the price value of a basis point is $0.12 per $100 par value.\n(Choice B) $0.35 is the result of using the bond's approximate convexity instead of approximate modified duration in the equation above. PVBP\nis a measure of yield duration and therefore does not involve convexity.\n(Choice C) $4.33 is the result of multiplying the current value of the bond by 0.0001 and then multiplying by both approximate modified duration\nand approximate convexity. This overestimates PVBP, which is calculated using only duration.\nThings to remember:\nThe price value of a basis point (PVBP), a measure of yield duration, is an estimate of how much a bond's price changes (in currency), given a\nchange of 1 basis point in its YTM. PVBP can be calculated as [(PV − PV ) / 2] or alternatively as the product [(approximate modified duration) ×\n− +\nPV × 0.0001].\n0\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 191, "q": "A 6% semiannual pay coupon bond has exactly 12 years to maturity. The bond has a YTM of 5.81% and is priced at 101.625466 per 100 of par value. The price value of a basis point for the bond is closest to:", "opts": ["0.0856", "0.0864", "0.1729"], "ans": "B", "expl": "The price value of a basis point (PVBP) is the currency unit change in a bond's full value (ie, market price plus accrued interest) for a change of 1\nbasis point in its YTM. The solution requires determining the price of the bond twice: once at the initial yield less 1 basis point and again at\nthe initial yield plus 1 basis point. The difference between the two prices is then divided by 2 to find the average price change.\nSince the bond pays semiannually, the annual coupon and yields must be divided by 2 and the years to maturity must be multiplied by 2 to obtain\nthe correct input values.\nPVBP is a measure of bond price sensitivity to a change in yield. 0.0864 is the approximate price change per 100 par value due to a 1 basis point\nchange in the bond's YTM. PVBP is used as an alternative to modified or effective duration as a measure of interest rate risk.\n(Choice A) 0.0856 is the PVBP for the bond if it paid coupons annually rather than semiannually.\n(Choice C) 0.1729 results from failing to divide the price difference by 2.\nThings to remember:\nThe price value of a basis point is the currency unit change in a bond's full value for a one basis point change in its YTM. Determine the price of\nthe bond twice, once at the initial yield less 1 basis point and again at the initial yield plus 1 basis point, then divide the difference by 2 to find the\naverage price change.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 192, "q": "The following applies to a noncallable bond: Selected Bond Data Effective convexity 98.8691 Price if YTM decreases by 1 basis point 101.3167 Price if yield curve shifts down by 1 basis point 101.2866 Price if YTM increases by 1 basis point 100.9711 Price if yield curve shifts up by 1 basis point 101.0011 The bond's PVBP is closest to:", "opts": ["0.1428", "0.1728", "0.3456"], "ans": "B", "expl": "The price value of a basis point (PVBP, also known as PV01 or DV01 [dollar value of 1 basis point]) is a measure of yield duration. PVBP is a\nway to estimate how much a bond's price changes (in currency) given a change of 1 basis point in its YTM. A basis point is 1/100 of a\npercentage point, or 0.0001.\nThe PVBP can be calculated in two ways. In this scenario, the current value of the bond (PV ) is not given, so one can use the price when the\n0\nyield decreases (PV ) and the price when the yield increases (PV ):\n− +\n(Choice A) 0.1428 is the result of incorrectly using the prices of the bond based on changes to shifts in the benchmark yield curve. A noncallable\nbond's price changes are measured with respect to changes in its YTM, not with respect to changes in the yield curve.\n(Choice C) 0.3456 is the result of subtracting PV from PV .\n+ −\nThings to remember:\nThe price value of a basis point (PVBP) is a measure of how much a bond's price changes (in currency) given a change of 1 basis point in its\nYTM. The PVBP can be calculated as [(PV − PV ) / 2] or, alternatively, as the product of approximate modified duration, the bond's current value,\n− +\nand a change in YTM of 1 basis point.\nDefine, calculate, and interpret modified duration, money duration, and the price value of a basis point (PVBP).", "qhtml": null}, {"n": 193, "q": "An analyst has collected information on three bonds that pay annual coupons and are trading at the same YTM: All else being equal, which of the bonds has the greatest interest rate risk?", "opts": ["Bond X", "Bond Y", "Bond Z"], "ans": "B", "expl": "Interest rate changes impact the reinvestment risk of coupon-bearing bonds and the call or prepayment risk of fixed-income securities subject to\nearly retirement. Interest rate risk most commonly refers to the impact on bond prices of changes in their YTM. The interest rate (price) risk of\nbonds is positively related to maturity and inversely related to coupon rate and yield.\nA bond's price is the present value of the coupon and principal payments. Interest rate risk reflects the sensitivity of the cash flows' present value\nto maturity, coupon, and yield:\nMaturity (date of the largest single cash flow): A longer maturity has a greater number of periods over which an interest rate change is\ncompounded, which magnifies the impact of rate changes on present value.\nCoupon rate: The higher a bond's coupon rate, the greater the percentage of total cash flows received earlier in a bond's life, which reduces\nthe sensitivity of their present value to interest rate changes.\nYield: The higher a bond's YTM, the smaller the percentage change in yield each basis point represents. Since price changes\nproportionately to the percentage change in YTM, interest rate risk is inversely related to yield.\nIn summary, holding all else constant, the longer (shorter) the time to mat
